<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sagrada Biblia · Reina-Valera 1909</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #2a1f10;
    --ink-soft:   #4a3a22;
    --rubric:     #8b1e1e;   /* red ink for verse numbers, chapter caps */
    --gold:       #a07820;
    --gold-deep:  #6e5212;
    --parchment:  #f4ead0;
    --parch-edge: #d8c69a;
    --parch-deep: #c0a86c;
    --leather:    #2a1410;
    --leather-2:  #1a0a08;
    --leather-3:  #3a1c14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at center, var(--leather-3) 0%, var(--leather) 60%, var(--leather-2) 100%);
    color: var(--ink);
    font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(ellipse at center, var(--leather-3) 0%, var(--leather) 60%, var(--leather-2) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
    background-blend-mode: multiply;
  }

  /* ─── Header (top bar with title + book/chapter selector) ─── */
  header {
    flex-shrink: 0;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid rgba(160,120,32,0.25);
    background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1));
  }
  .brand {
    font-family: 'UnifrakturMaguntia', 'Pirata One', serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(160,120,32,0.3), 0 1px 0 rgba(0,0,0,0.6);
    line-height: 1;
  }
  .brand-sub {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--parch-edge);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
    opacity: 0.7;
  }
  .nav-cluster {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .nav-btn {
    background: linear-gradient(180deg, #2a1810, #1a0a08);
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    padding: 8px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    box-shadow: 0 1px 0 rgba(160,120,32,0.2) inset, 0 2px 6px rgba(0,0,0,0.4);
  }
  .nav-btn:hover {
    background: linear-gradient(180deg, #3a2418, #2a1410);
    color: #d4a843;
    box-shadow: 0 1px 0 rgba(160,120,32,0.4) inset, 0 2px 10px rgba(160,120,32,0.3);
  }
  .nav-btn .ornament {
    color: var(--rubric);
    margin: 0 4px;
  }
  .ref-display {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 20px;
    color: var(--parchment);
    text-shadow: 0 0 6px rgba(160,120,32,0.4);
    padding: 0 8px;
  }

  /* ─── Main book area ─── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 0;
  }

  /* ─── The book: a 3D open volume with leather spine + stacked page edges ─── */
  .book-wrap {
    width: min(1200px, 100%);
    height: 100%;
    max-height: 860px;
    perspective: 2800px;
    perspective-origin: 50% 30%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .book {
    width: 100%;
    height: 100%;
    display: grid;
    /* No spine column — pages meet directly, gutter is created by shadows */
    grid-template-columns: 1fr 1fr;
    position: relative;
    transform-style: preserve-3d;
    /* Soft drop shadow under the whole volume */
    filter: drop-shadow(0 32px 28px rgba(0,0,0,0.55))
            drop-shadow(0 12px 14px rgba(0,0,0,0.35));
  }
  /* Each page is a stack: a thick base (the page-block) with the visible page on top */
  .page {
    position: relative;
    background-color: var(--parchment);
    background-image:
      radial-gradient(ellipse at top, rgba(255,250,225,0.45), transparent 55%),
      radial-gradient(ellipse 80% 60% at center, transparent 30%, rgba(150,100,40,0.10) 75%, rgba(120,75,25,0.22) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='340'><filter id='p'><feTurbulence baseFrequency='0.62' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0 0.10 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>"),
      linear-gradient(180deg, #f6ecd2 0%, #efe1c0 100%);
    background-blend-mode: normal, multiply, multiply, normal;
    /* overflow visible so the page-edge stack pseudo (::before) shows on the outside */
    padding: 38px 52px 44px;
    display: flex;
    flex-direction: column;
    transform-style: preserve-3d;
  }
  /* Outer edge: gilded stack of pages — gives the book actual thickness */
  .page::before {
    content: '';
    position: absolute;
    top: 6px; bottom: 6px;
    width: 11px;
    background:
      repeating-linear-gradient(
        to bottom,
        #d8c594 0px, #d8c594 1px,
        #f1e3b6 1px, #f1e3b6 2px,
        #c4a866 2px, #c4a866 3px
      ),
      linear-gradient(90deg, #c0a468 0%, #e8d39a 50%, #b89a5a 100%);
    background-blend-mode: multiply;
    box-shadow:
      0 8px 14px -2px rgba(0,0,0,0.6),
      0 2px 4px rgba(0,0,0,0.4);
  }
  /* Aged corner vignette + subtle highlight */
  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(255,250,230,0.35), transparent 45%),
      radial-gradient(ellipse at center, transparent 55%, rgba(110,70,30,0.22) 100%);
    pointer-events: none;
  }
  .page-left {
    border-radius: 4px 0 0 4px;
    /* Gutter shadow on inner edge — strong dark gradient that simulates paper
       curving down into the central valley. Tighter ramp, deeper black. */
    box-shadow:
      inset -36px 0 48px -28px rgba(40,22,8,0.5),
      inset -10px 0 16px -8px  rgba(50,28,12,0.4),
      inset -1px 0 0 rgba(30,15,5,0.35);
    /* Outer edge lifts toward viewer; right edge stays at 0 (pinned to gutter) */
    transform: perspective(2400px) rotateY(2.4deg);
    transform-origin: right center;
  }
  .page-left::before  { left: -11px;  border-radius: 2px 0 0 2px; box-shadow: -4px 6px 14px rgba(0,0,0,0.55); }
  .page-right {
    border-radius: 0 4px 4px 0;
    box-shadow:
      inset 36px 0 48px -28px rgba(40,22,8,0.5),
      inset 10px 0 16px -8px  rgba(50,28,12,0.4),
      inset 1px 0 0 rgba(30,15,5,0.35);
    transform: perspective(2400px) rotateY(-2.4deg);
    transform-origin: left center;
  }
  .page-right::before { right: -11px; border-radius: 0 2px 2px 0; box-shadow: 4px 6px 14px rgba(0,0,0,0.55); }

  /* ─── Central gutter overlay: a thin dark crease where pages meet ───
     This is what you actually see in an open book: not leather, just the
     deepest line of shadow at the center, with the page tone fading out
     to either side. The two pages have done most of the gradient work
     via inset shadows; this overlay just adds the final dark seam line. */
  .gutter {
    position: absolute;
    top: 6px; bottom: 6px;
    left: 50%;
    width: 14px;
    transform: translateX(-50%);
    z-index: 3;
    pointer-events: none;
    background:
      /* Tiny lighter halo right at the bend, like the slight paper highlight */
      linear-gradient(90deg, transparent 0%, rgba(180,140,80,0.10) 40%, rgba(180,140,80,0.10) 60%, transparent 100%),
      /* A narrow soft shadow at the crease — much softer than before */
      radial-gradient(ellipse 50% 100% at center, rgba(40,20,8,0.55) 0%, rgba(40,20,8,0.18) 40%, transparent 75%);
  }
  /* The actual sharp seam — 1px hairline down the middle, brown instead of black */
  .gutter::after {
    content: '';
    position: absolute;
    top: 4px; bottom: 4px;
    left: 50%; width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent 0%, rgba(50,25,10,0.45) 20%, rgba(40,18,5,0.7) 50%, rgba(50,25,10,0.45) 80%, transparent 100%);
  }
  /* Silk ribbon bookmark drifting out the bottom of the gutter */
  .ribbon {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 76px;
    background:
      linear-gradient(180deg, #8b1e1e 0%, #6e1414 70%, #4a0a0a 100%);
    box-shadow:
      inset 2px 0 3px rgba(0,0,0,0.45),
      inset -2px 0 3px rgba(0,0,0,0.45),
      0 4px 8px rgba(0,0,0,0.55);
    clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%);
    z-index: 4;
  }

  /* ─── Inside-page content ─── */
  .page-content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;   /* keep paginated verses clipped within the page */
  }
  /* Page header (book name + chapter number) — shown only on left page top */
  .page-header {
    text-align: center;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(139,30,30,0.18);
    padding-bottom: 14px;
  }
  .book-name {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 30px;
    color: var(--ink);
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .chapter-num {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--rubric);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  /* Ornate flourish under header */
  .page-header .flourish {
    display: block;
    color: var(--gold);
    font-size: 14px;
    margin-top: 8px;
    opacity: 0.7;
    letter-spacing: 8px;
  }

  /* Verse body — typical Bible: two columns per page, justified, tighter leading */
  .verses {
    font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 22px;
    min-height: 0;
    /* Thin vertical rule between the two columns, like a printed Bible */
    background:
      linear-gradient(180deg, transparent 6%, rgba(139,30,30,0.18) 6%, rgba(139,30,30,0.18) 94%, transparent 94%)
      center / 1px 100% no-repeat;
  }
  .vcol {
    text-align: justify;
    hyphens: auto;
    overflow: hidden;
    min-height: 0;
  }
  .verses p { margin: 0; display: inline; }
  .verse { display: inline; }
  .v-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--rubric);
    vertical-align: super;
    line-height: 0;
    margin-right: 2px;
    padding-left: 2px;
  }
  /* Illuminated drop cap — first letter of chapter */
  .drop-cap {
    font-family: 'UnifrakturMaguntia', 'Pirata One', serif;
    font-size: 58px;
    line-height: 0.85;
    color: var(--rubric);
    float: left;
    padding: 4px 8px 2px 0;
    margin-top: 4px;
    text-shadow: 1px 1px 0 rgba(160,120,32,0.3);
  }

  /* ─── Annotations: highlights, note markers, popover, modals ─── */
  .verse { cursor: pointer; transition: background 0.15s; padding: 1px 0; border-radius: 2px; }
  .verse:hover { background: rgba(160,120,32,0.06); }
  .verse.hl-gold {
    background: linear-gradient(180deg, transparent 40%, rgba(212,168,67,0.42) 40%, rgba(212,168,67,0.42) 96%, transparent 96%);
  }
  .verse.hl-red {
    background: linear-gradient(180deg, transparent 40%, rgba(180,40,40,0.32) 40%, rgba(180,40,40,0.32) 96%, transparent 96%);
  }
  .verse.hl-blue {
    background: linear-gradient(180deg, transparent 40%, rgba(60,90,160,0.28) 40%, rgba(60,90,160,0.28) 96%, transparent 96%);
  }
  /* Note marker — ❦ next to verse number when the verse has a note */
  .note-marker {
    display: inline-block;
    color: var(--gold);
    font-size: 12px;
    margin-right: 2px;
    cursor: pointer;
    vertical-align: super;
    line-height: 0;
    text-shadow: 0 0 4px rgba(160,120,32,0.5);
  }

  /* Floating note viewer — shows the note text inline near the verse without
     covering it. Tap ❦ to open, then choose Editar / Eliminar from inside. */
  .note-popover {
    position: fixed;
    z-index: 200;
    width: min(320px, calc(100vw - 24px));
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0 0.10 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
      linear-gradient(180deg, #fbf3df 0%, #f3e6c4 100%);
    background-blend-mode: multiply, normal;
    border: 1px solid var(--gold-deep);
    border-radius: 4px;
    padding: 14px 16px 12px;
    box-shadow:
      0 14px 30px rgba(0,0,0,0.45),
      0 4px 8px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(160,120,32,0.15);
    color: var(--ink);
    font-family: 'EB Garamond', 'Cormorant Garamond', serif;
  }
  .note-popover[hidden] { display: none; }
  /* Little folded-corner tab pointing at the verse */
  .note-popover::before {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    background: inherit;
    border: 1px solid var(--gold-deep);
    transform: rotate(45deg);
  }
  .note-popover.np-above::before { bottom: -6px; left: 24px; border-top: none; border-left: none; }
  .note-popover.np-below::before { top: -6px; left: 24px; border-bottom: none; border-right: none; }
  .note-popover.np-right::before { left: -6px; top: 22px; border-right: none; border-top: none; }
  .note-popover.np-left::before  { right: -6px; top: 22px; border-left: none;  border-bottom: none; }
  .note-popover .np-ref {
    font-family: 'UnifrakturMaguntia', serif;
    color: var(--rubric);
    font-size: 13px;
    margin-bottom: 6px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .note-popover .np-text {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 200px;
    overflow-y: auto;
  }
  .note-popover .np-meta {
    font-style: italic;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.65;
    margin-bottom: 10px;
  }
  .note-popover .np-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    border-top: 1px solid rgba(139,30,30,0.18);
    padding-top: 8px;
  }
  .np-btn {
    background: rgba(160,120,32,0.08);
    border: 1px solid rgba(160,120,32,0.45);
    color: var(--ink);
    padding: 5px 12px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .np-btn:hover { background: rgba(160,120,32,0.18); color: var(--gold-deep); }
  .np-btn.danger { color: #8b1e1e; border-color: rgba(139,30,30,0.45); }
  .np-btn.danger:hover { background: rgba(139,30,30,0.12); color: #6e1414; }

  /* Floating popover with annotation actions */
  .annot-popover {
    position: fixed;
    z-index: 200;
    background: linear-gradient(180deg, #2a1810, #1a0a08);
    border: 1px solid var(--gold-deep);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .annot-popover[hidden] { display: none; }
  .annot-btn {
    background: none;
    border: 1px solid var(--gold-deep);
    color: var(--gold);
    width: 32px;
    height: 32px;
    border-radius: 4px;
    cursor: pointer;
    font-family: serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .annot-btn:hover {
    background: rgba(160,120,32,0.15);
    border-color: var(--gold);
  }
  .annot-btn.color-gold { background: #d4a843; border-color: #d4a843; }
  .annot-btn.color-red  { background: #b42828; border-color: #b42828; }
  .annot-btn.color-blue { background: #3c5aa0; border-color: #3c5aa0; }
  .annot-btn.color-gold:hover { box-shadow: 0 0 8px #d4a843; }
  .annot-btn.color-red:hover  { box-shadow: 0 0 8px #b42828; }
  .annot-btn.color-blue:hover { box-shadow: 0 0 8px #3c5aa0; }

  /* Note editor modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0 0.10 0 0 0 0.15 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
      linear-gradient(180deg, #f6ecd2, #efe1c0);
    background-blend-mode: multiply, normal;
    color: var(--ink);
    border: 1px solid var(--gold-deep);
    border-radius: 6px;
    padding: 24px;
    width: min(520px, 100%);
    max-height: 80vh;
    overflow: auto;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
  }
  .modal h3 {
    font-family: 'UnifrakturMaguntia', serif;
    color: var(--rubric);
    font-size: 22px;
    margin-bottom: 4px;
    font-weight: normal;
  }
  .modal .ref {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .modal textarea {
    width: 100%;
    min-height: 140px;
    background: rgba(255,250,225,0.6);
    border: 1px solid rgba(160,120,32,0.4);
    padding: 12px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    border-radius: 4px;
    resize: vertical;
  }
  .modal textarea:focus { outline: 1px solid var(--gold); }
  .modal input[type=text] {
    width: 100%;
    background: rgba(255,250,225,0.6);
    border: 1px solid rgba(160,120,32,0.4);
    padding: 10px 12px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .modal .modal-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-btn {
    background: linear-gradient(180deg, #2a1810, #1a0a08);
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    padding: 8px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-style: italic;
    cursor: pointer;
    border-radius: 4px;
  }
  .modal-btn:hover { background: linear-gradient(180deg, #3a2418, #2a1410); color: #d4a843; }
  .modal-btn.danger { color: #c47070; border-color: #6e1414; }
  .modal-btn.danger:hover { background: #2a0a0a; color: #e89999; }

  /* Bookmarks list */
  .bookmark-list {
    list-style: none;
    max-height: 50vh;
    overflow-y: auto;
    margin: 8px 0 4px;
  }
  .bookmark-item {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(139,30,30,0.18);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    border-radius: 3px;
  }
  .bookmark-item:hover { background: rgba(160,120,32,0.1); }
  .bookmark-item .bm-label {

/* ════════════════════════════════════════════════════════════
   STATE + RENDERING
   ════════════════════════════════════════════════════════════ */

const state = {
  bookId: 'gen',
  chapter: 1,
  spread: 0,        // which spread (pair of pages) of the current chapter
  spreads: [],      // array of {l1, l2, r1, r2} HTML chunks per spread
};

const bookMeta = (id) => ALL_BOOKS.find(b => b.id === id);

function chapterText(bookId, chapter) {
  const key = `${bookId}-${chapter}`;
  return TEXT[key] || null;
}

// Build the chapter scaffolding (page headers + empty verse grids) once.
// Spread content gets injected by renderSpread().
function renderChapterIntoPages() {
  const ch = chapterText(state.bookId, state.chapter);
  const book = bookMeta(state.bookId);
  const refEl = document.getElementById('ref-display');
  refEl.textContent = `${book.name} ${roman(state.chapter)}`;

  const leftContent  = document.querySelector('#page-left .page-content');
  const rightContent = document.querySelector('#page-right .page-content');

  if (!ch) {
    leftContent.innerHTML = `
      <div class="page-header">
        <div class="book-name">${book.name}</div>
        <span class="chapter-num">Capítulo ${state.chapter}</span>
        <span class="flourish">✦ ❦ ✦</span>
      </div>
      <div class="loading">
        <em>Este capítulo aún no está cargado en esta demostración.<br>
        Próximamente: Reina-Valera 1909 completa.</em>
      </div>`;
    rightContent.innerHTML = '';
    state.spreads = [];
    return;
  }

  // Build verse HTML once
  const verseEntries = Object.entries(ch).sort((a, b) => +a[0] - +b[0]);
  const verseHTMLs = verseEntries.map(([n, t], i) => {
    if (i === 0) {
      const firstLetter = t.charAt(0);
      const firstRest   = t.slice(1);
      return `<span class="verse"><span class="drop-cap">${firstLetter}</span><span class="v-num">${n}</span>${firstRest} </span>`;
    }
    return `<span class="verse"><span class="v-num">${n}</span>${t} </span>`;
  });

  // Render scaffolding
  leftContent.innerHTML = `
    <div class="page-header">
      <div class="book-name">${book.name}</div>
      <span class="chapter-num">Capítulo ${state.chapter}</span>
      <span class="flourish">✦ ❦ ✦</span>
    </div>
    <div class="verses">
      <div class="vcol" id="L1"></div>
      <div class="vcol" id="L2"></div>
    </div>
    <div class="page-footer">
      <span class="ornament">❦</span>
      <span class="page-num" id="pgnum-left">${book.name} · ${state.chapter}</span>
    </div>`;

  rightContent.innerHTML = `
    <div class="verses">
      <div class="vcol" id="R1"></div>
      <div class="vcol" id="R2"></div>
    </div>
    <div class="page-footer">
      <span class="page-num" id="pgnum-right">${book.name} · ${state.chapter}</span>
      <span class="ornament">❦</span>
    </div>`;

  // Measure how many verses fit per column for this layout, then build spreads
  state.spreads = paginateChapter(verseHTMLs);
  if (state.spread >= state.spreads.length) state.spread = 0;
  renderSpread();
}

// Split the chapter's verse-HTML strings into spreads of 4 columns each
// (left page = L1 + L2, right page = R1 + R2). Uses a hidden measuring
// element sized like one column to determine where each column should break.
function paginateChapter(verseHTMLs) {
  // Find a real column to clone styles from
  const refCol = document.getElementById('L1');
  if (!refCol) return [{l1: verseHTMLs.join(''), l2: '', r1: '', r2: ''}];

  const colW = refCol.clientWidth;
  const colH = refCol.clientHeight;
  if (colW < 10 || colH < 10) {
    return [{l1: verseHTMLs.join(''), l2: '', r1: '', r2: ''}];
  }
  const cs   = getComputedStyle(refCol);

  // Hidden measuring container — same width / typography as a single column
  const meas = document.createElement('div');
  meas.style.cssText = `
    position: absolute; left: -10000px; top: 0;
    width: ${colW}px;
    font-family: ${cs.fontFamily}; font-size: ${cs.fontSize};
    line-height: ${cs.lineHeight}; color: ${cs.color};
    text-align: justify; hyphens: auto;
  `;
  meas.innerHTML = verseHTMLs.join('');
  document.body.appendChild(meas);

  // Walk verses, slice indices where cumulative height crosses every colH
  const verseEls = Array.from(meas.querySelectorAll('.verse'));
  const cuts = [0];   // indices where each new column starts
  let nextLimit = colH;
  for (let i = 0; i < verseEls.length; i++) {
    const yEnd = verseEls[i].offsetTop + verseEls[i].offsetHeight;
    while (yEnd > nextLimit + 2) {
      // This verse spills past the current column boundary — start a new column at i
      if (cuts[cuts.length - 1] !== i) cuts.push(i);
      nextLimit += colH;
    }
  }
  cuts.push(verseEls.length);
  document.body.removeChild(meas);

  // Build column-HTML chunks from the cut indices
  const cols = [];
  for (let i = 0; i < cuts.length - 1; i++) {
    cols.push(verseHTMLs.slice(cuts[i], cuts[i + 1]).join(''));
  }
  // Group columns into spreads of 4
  const spreads = [];
  for (let i = 0; i < cols.length; i += 4) {
    spreads.push({
      l1: cols[i]     || '',
      l2: cols[i + 1] || '',
      r1: cols[i + 2] || '',
      r2: cols[i + 3] || '',
    });
  }
  // Ensure at least one spread even for a short chapter
  if (!spreads.length) {
    spreads.push({l1: verseHTMLs.join(''), l2: '', r1: '', r2: ''});
  }
  return spreads;
}

function renderSpread() {
  const s = state.spreads[state.spread];
  if (!s) return;
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('L1', s.l1);
  set('L2', s.l2);
  set('R1', s.r1);
  set('R2', s.r2);
  // Page footer: show "1 / N" if multi-spread
  const total = state.spreads.length;
  const lbl = total > 1
    ? `${bookMeta(state.bookId).name} · ${state.chapter} · ${state.spread + 1}/${total}`
    : `${bookMeta(state.bookId).name} · ${state.chapter}`;
  set('pgnum-left',  lbl);
  set('pgnum-right', lbl);
}

function roman(n) {
  const M = ['','M','MM','MMM'];
  const C = ['','C','CC','CCC','CD','D','DC','DCC','DCCC','CM'];
  const X = ['','X','XX','XXX','XL','L','LX','LXX','LXXX','XC'];
  const I = ['','I','II','III','IV','V','VI','VII','VIII','IX'];
  return M[Math.floor(n/1000)] + C[Math.floor(n%1000/100)] + X[Math.floor(n%100/10)] + I[n%10];
}

/* ────── Navigation ────── */
function prev() {
  // Step back within chapter first
  if (state.spread > 0) {
    state.spread--;
    renderSpread();
    return;
  }
  // Otherwise jump to previous chapter (and to its last spread)
  const idx = ALL_BOOKS.findIndex(b => b.id === state.bookId);
  if (state.chapter > 1) {
    state.chapter--;
  } else if (idx > 0) {
    state.bookId = ALL_BOOKS[idx - 1].id;
    state.chapter = ALL_BOOKS[idx - 1].chapters;
  } else {
    return;
  }
  state.spread = 0;
  renderChapterIntoPages();
  // Land on the LAST spread of the previous chapter so the read order is continuous
  if (state.spreads.length > 1) {
    state.spread = state.spreads.length - 1;
    renderSpread();
  }
}
function next() {
  // Forward within chapter first
  if (state.spread < state.spreads.length - 1) {
    state.spread++;
    renderSpread();
    return;
  }
  // Otherwise jump to next chapter
  const book = bookMeta(state.bookId);
  const idx = ALL_BOOKS.findIndex(b => b.id === state.bookId);
  if (state.chapter < book.chapters) {
    state.chapter++;
  } else if (idx < ALL_BOOKS.length - 1) {
    state.bookId = ALL_BOOKS[idx + 1].id;
    state.chapter = 1;
  } else {
    return;
  }
  state.spread = 0;
  renderChapterIntoPages();
}
function goTo(bookId, chapter) {
  state.bookId = bookId;
  state.chapter = chapter;
  state.spread = 0;
  renderChapterIntoPages();
  closeDrawer();
}
// Aliases so older click handlers still work
const prevChapter = prev;
const nextChapter = next;

/* ════════════════════════════════════════════════════════════
   ANNOTATIONS LAYER — highlights, notes, bookmarks, last-read
   All persisted to localStorage. Key: 'bible-rv1909-annot'
   ════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'bible-rv1909-annot';

const annot = (() => {
  let data;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) { data = {}; }
  data.highlights = data.highlights || {};   // { 'gen-1-3': 'gold' | 'red' | 'blue' }
  data.notes      = data.notes      || {};   // { 'gen-1-3': {text, updatedAt, createdAt} }
  data.bookmarks  = data.bookmarks  || [];   // [{id, bookId, chapter, verse?, label, date}]
  data.lastRead   = data.lastRead   || null; // {bookId, chapter, spread}
  // Migrate any older string-format notes to the new object shape
  for (const k in data.notes) {
    if (typeof data.notes[k] === 'string') {
      data.notes[k] = { text: data.notes[k], updatedAt: Date.now(), createdAt: Date.now() };
    }
  }
  return data;
})();

function saveAnnot() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(annot)); }
  catch (e) { console.warn('Bible storage save failed:', e); }
}
function verseKey(bookId, chapter, verseN) {
  return `${bookId}-${chapter}-${verseN}`;
}

// Apply stored highlights + note markers to currently rendered verses
function applyAnnotationsToDOM() {
  document.querySelectorAll('.verse[data-vk]').forEach(el => {
    const vk = el.dataset.vk;
    el.classList.remove('hl-gold', 'hl-red', 'hl-blue');
    const hl = annot.highlights[vk];
    if (hl) el.classList.add('hl-' + hl);
    // Inject note marker right after the verse number (or replace existing)
    const existingMarker = el.querySelector('.note-marker');
    if (existingMarker) existingMarker.remove();
    if (annot.notes[vk]) {
      const num = el.querySelector('.v-num');
      const marker = document.createElement('span');
      marker.className = 'note-marker';
      marker.textContent = '❦';
      marker.title = 'Ver nota';
      if (num) num.insertAdjacentElement('afterend', marker);
    }
  });
}

/* ────── Verse popover ────── */
const popover = document.getElementById('annot-popover');
let popoverTarget = null;   // {verseEl, vk, bookId, chapter, verseN}

function showPopover(verseEl) {
  const vk = verseEl.dataset.vk;
  if (!vk) return;
  const [bookId, chap, vn] = vk.split('-');
  popoverTarget = { verseEl, vk, bookId, chapter: +chap, verseN: +vn };
  // Position the popover near the verse, clamped to viewport
  const r = verseEl.getBoundingClientRect();
  popover.hidden = false;
  const pw = popover.offsetWidth;
  const ph = popover.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  let top  = r.top - ph - 8;
  if (top < 8) top = r.bottom + 8;
  if (left < 8) left = 8;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  popover.style.left = left + 'px';
  popover.style.top  = top  + 'px';
}
function hidePopover() {
  popover.hidden = true;
  popoverTarget = null;
}

// Click on a verse → show popover; click elsewhere → hide
document.addEventListener('click', e => {
  const noteMarker = e.target.closest('.note-marker');
  if (noteMarker) {
    e.stopPropagation();
    const verseEl = noteMarker.closest('.verse');
    if (verseEl) showNotePopover(verseEl, noteMarker);
    return;
  }
  const verse = e.target.closest('.verse');
  if (verse && verse.dataset.vk) {
    e.stopPropagation();
    showPopover(verse);
    return;
  }
  if (!e.target.closest('.annot-popover') && !e.target.closest('.note-popover')) {
    hidePopover();
    hideNotePopover();
  }
});

popover.addEventListener('click', e => {
  const btn = e.target.closest('.annot-btn');
  if (!btn || !popoverTarget) return;
  const act = btn.dataset.act;
  const t = popoverTarget;
  if (act === 'hl-gold' || act === 'hl-red' || act === 'hl-blue') {
    const color = act.slice(3);
    if (annot.highlights[t.vk] === color) delete annot.highlights[t.vk];
    else annot.highlights[t.vk] = color;
    saveAnnot();
    applyAnnotationsToDOM();
    hidePopover();
  } else if (act === 'clear') {
    delete annot.highlights[t.vk];
    saveAnnot();
    applyAnnotationsToDOM();
    hidePopover();
  } else if (act === 'note') {
    openNoteModal(t.verseEl);
    hidePopover();
  } else if (act === 'bookmark') {
    openBookmarkNameModal(t.bookId, t.chapter, t.verseN);
    hidePopover();
  }
});

/* ────── Note viewer popover (in-page, doesn't cover verse) ────── */
const notePopover = document.getElementById('note-popover');
const npRef       = document.getElementById('np-ref');
const npText      = document.getElementById('np-text');
const npMeta      = document.getElementById('np-meta');
let notePopoverVK = null;

function showNotePopover(verseEl, anchor) {
  const vk = verseEl.dataset.vk;
  const note = annot.notes[vk];
  if (!note) return;
  notePopoverVK = vk;
  const [bookId, chap, vn] = vk.split('-');
  const book = bookMeta(bookId);
  npRef.textContent = `${book ? book.name : bookId} ${chap}:${vn}`;
  npText.textContent = note.text;
  npMeta.textContent = relativeDate
    ? `editado ${relativeDate(note.updatedAt || note.createdAt || Date.now())}`
    : '';
  notePopover.hidden = false;
  // Reset positioning classes before measuring
  notePopover.classList.remove('np-above', 'np-below', 'np-left', 'np-right');

  // Strategy: prefer SIDE placement so the verse stays fully visible.
  // - Verse on left half of viewport  → try RIGHT side first, then below
  // - Verse on right half of viewport → try LEFT side first, then below
  // - Last resort: above (only when nothing else fits)
  const ar = (anchor || verseEl).getBoundingClientRect();
  const pw = notePopover.offsetWidth;
  const ph = notePopover.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const gap = 14;
  const margin = 10;

  const verseOnLeftPage = (ar.left + ar.width / 2) < vw / 2;
  const roomRight = vw - ar.right - gap;
  const roomLeft  = ar.left - gap;
  const roomBelow = vh - ar.bottom - gap;
  const roomAbove = ar.top - gap;

  let placement;
  if (verseOnLeftPage && roomRight >= pw)      placement = 'right';
  else if (!verseOnLeftPage && roomLeft >= pw) placement = 'left';
  else if (roomRight >= pw)                    placement = 'right';
  else if (roomLeft  >= pw)                    placement = 'left';
  else if (roomBelow >= ph)                    placement = 'below';
  else if (roomAbove >= ph)                    placement = 'above';
  else                                         placement = roomBelow > roomAbove ? 'below' : 'above';

  let left, top;
  if (placement === 'right') {
    left = ar.right + gap;
    top  = ar.top - 6;
  } else if (placement === 'left') {
    left = ar.left - pw - gap;
    top  = ar.top - 6;
  } else if (placement === 'below') {
    left = ar.left - 8;
    top  = ar.bottom + 10;
  } else { /* above */
    left = ar.left - 8;
    top  = ar.top - ph - 10;
  }
  // Clamp inside viewport
  if (left + pw > vw - margin) left = vw - pw - margin;
  if (left < margin)           left = margin;
  if (top + ph > vh - margin)  top  = vh - ph - margin;
  if (top < margin)            top  = margin;

  notePopover.style.left = left + 'px';
  notePopover.style.top  = top  + 'px';
  notePopover.classList.add('np-' + placement);
}
function hideNotePopover() {
  notePopover.hidden = true;
  notePopoverVK = null;
}
notePopover.addEventListener('click', e => {
  const btn = e.target.closest('.np-btn');
  if (!btn || !notePopoverVK) return;
  const act = btn.dataset.act;
  if (act === 'edit') {
    const verseEl = document.querySelector(`.verse[data-vk="${notePopoverVK}"]`);
    if (verseEl) {
      openNoteModal(verseEl);
    }
    hideNotePopover();
  } else if (act === 'delete') {
    delete annot.notes[notePopoverVK];
    saveAnnot();
    applyAnnotationsToDOM();
    hideNotePopover();
  }
});

      .map(bm => {
        const book = bookMeta(bm.bookId);
        const ref  = bm.verse ? `${book.name} ${bm.chapter}:${bm.verse}` : `${book.name} ${bm.chapter}`;
        return `<li class="bookmark-item" data-id="${bm.id}">
          <div>
            <div class="bm-label">${escapeHTML(bm.label)}</div>
            <span class="bm-ref">${ref}</span>
          </div>
          <button class="bm-del" data-del="${bm.id}" title="Eliminar">✕</button>
        </li>`;
      }).join('');
  }
  bmListBd.classList.add('show');
}
function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
bmList.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const id = +del.dataset.del;
    annot.bookmarks = annot.bookmarks.filter(b => b.id !== id);
    saveAnnot();
    openBookmarksList();
    return;
  }
  const item = e.target.closest('.bookmark-item');
  if (!item) return;
  const id = +item.dataset.id;
  const bm = annot.bookmarks.find(b => b.id === id);
  if (!bm) return;
  goTo(bm.bookId, bm.chapter);
  bmListBd.classList.remove('show');
});
document.getElementById('bm-list-close').addEventListener('click', () => bmListBd.classList.remove('show'));
document.getElementById('btn-bookmarks').addEventListener('click', openBookmarksList);

/* ────── Notes list modal (view / sort / edit / delete) ────── */
const notesListBd = document.getElementById('notes-list-bd');
const notesListEl = document.getElementById('notes-list');
let notesSort = 'recent';   // 'recent' | 'biblical'

// Book-order index for biblical sorting
const BOOK_INDEX = {};
ALL_BOOKS.forEach((b, i) => { BOOK_INDEX[b.id] = i; });

function relativeDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = Date.now();
  const diff = (now - ts) / 1000;
  if (diff < 60)     return 'hace un momento';
  if (diff < 3600)   return `hace ${Math.floor(diff/60)} min`;
  if (diff < 86400)  return `hace ${Math.floor(diff/3600)} h`;
  if (diff < 604800) return `hace ${Math.floor(diff/86400)} día(s)`;
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
}

function openNotesList() {
  renderNotesList();
  notesListBd.classList.add('show');
}
function renderNotesList() {
  const entries = Object.entries(annot.notes).map(([vk, n]) => {
    const [bookId, chap, vn] = vk.split('-');
    return {
      vk,
      bookId,
      chapter: +chap,
      verse: +vn,
      text: n.text,
      updatedAt: n.updatedAt || 0,
      bookIdx: BOOK_INDEX[bookId] ?? 999,
    };
  });

  if (notesSort === 'recent') {
    entries.sort((a, b) => b.updatedAt - a.updatedAt);
  } else {
    entries.sort((a, b) =>
      a.bookIdx - b.bookIdx ||
      a.chapter - b.chapter ||
      a.verse   - b.verse
    );
  }

  if (!entries.length) {
    notesListEl.innerHTML = `<li class="bookmark-empty">Aún no has escrito notas.<br>Toca un versículo y elige 📝 para empezar.</li>`;
    return;
  }
  notesListEl.innerHTML = entries.map(e => {
    const book = bookMeta(e.bookId);
    const ref  = book ? `${book.name} ${e.chapter}:${e.verse}` : e.vk;
    return `<li class="note-item" data-vk="${e.vk}">
      <div class="note-body">
        <div class="note-ref">${ref}</div>
        <div class="note-text">${escapeHTML(e.text)}</div>
        <div class="note-date">${relativeDate(e.updatedAt)}</div>
      </div>
      <button class="bm-del" data-del="${e.vk}" title="Eliminar nota">✕</button>
    </li>`;
  }).join('');
}

document.getElementById('btn-notes').addEventListener('click', openNotesList);
document.getElementById('notes-list-close').addEventListener('click', () => notesListBd.classList.remove('show'));

// Sort toggle
document.getElementById('notes-sort').addEventListener('click', e => {
  const btn = e.target.closest('[data-sort]');
  if (!btn) return;
  notesSort = btn.dataset.sort;
  document.querySelectorAll('#notes-sort button').forEach(b => b.classList.toggle('active', b === btn));
  renderNotesList();
});

// Click on note → jump there, then open the note editor.
// Click on ✕ → delete in place.
notesListEl.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    delete annot.notes[del.dataset.del];
    saveAnnot();
    renderNotesList();
    applyAnnotationsToDOM();
    return;
  }
  const item = e.target.closest('.note-item');
  if (!item) return;
  const vk = item.dataset.vk;
  const [bookId, chap, vn] = vk.split('-');
  notesListBd.classList.remove('show');
  goTo(bookId, +chap);
  // Wait for the chapter to render, then show the note popover near the verse
  setTimeout(() => {
    const verseEl = document.querySelector(`.verse[data-vk="${vk}"]`);
    if (verseEl) {
      verseEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      // After the scroll lands, open the popover at the ❦ marker
      setTimeout(() => {
        const marker = verseEl.querySelector('.note-marker');
        showNotePopover(verseEl, marker || verseEl);
      }, 320);
    } else {
      // Verse not on visible spread — fall back to the editor modal
      noteEditingVK = vk;
      noteRef.textContent = `${bookMeta(bookId).name} ${chap}:${vn}`;
      noteText.value = (annot.notes[vk] && annot.notes[vk].text) || '';
      noteBd.classList.add('show');
      setTimeout(() => noteText.focus(), 50);
    }
  }, 200);
});

// Backdrop click closes any modal
[noteBd, bmNameBd, bmListBd, notesListBd].forEach(bd => {
  bd.addEventListener('click', e => {
    if (e.target === bd) bd.classList.remove('show');
  });
});

/* ────── Stamp data-vk on verses + apply annotations after each render ────── */
function tagVersesAndApply() {
  document.querySelectorAll('.verse').forEach(el => {
    const num = el.querySelector('.v-num');
    if (!num) return;
    const vn = num.textContent.trim();
    if (vn) el.dataset.vk = verseKey(state.bookId, state.chapter, vn);
  });
  applyAnnotationsToDOM();
}

// Hook into existing renderSpread + renderChapter
const _origRenderSpread = renderSpread;
renderSpread = function() {
  _origRenderSpread();
  tagVersesAndApply();
  // Persist last-read position
  annot.lastRead = { bookId: state.bookId, chapter: state.chapter, spread: state.spread };
  saveAnnot();
};

/* ────── Restore last-read position on load ────── */
if (annot.lastRead && bookMeta(annot.lastRead.bookId)) {
  state.bookId = annot.lastRead.bookId;
  state.chapter = annot.lastRead.chapter;
  state.spread = annot.lastRead.spread || 0;
}

// Escape closes popover / modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hidePopover();
    hideNotePopover();
    noteBd.classList.remove('show');
    bmNameBd.classList.remove('show');
    bmListBd.classList.remove('show');
    notesListBd.classList.remove('show');
  }
});

// First paint
renderBookList();
renderChapterIntoPages();
</script>
</body>
</html>
