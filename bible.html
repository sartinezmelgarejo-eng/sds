<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sagrada Biblia · Reina-Valera 1909</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #2a1f10;
    --ink-soft:   #4a3a22;
    --rubric:     #8b1e1e;   /* red ink for verse numbers, chapter caps */
    --gold:       #a07820;
    --gold-deep:  #6e5212;
    --parchment:  #f4ead0;
    --parch-edge: #d8c69a;
    --parch-deep: #c0a86c;
    --leather:    #2a1410;
    --leather-2:  #1a0a08;
    --leather-3:  #3a1c14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at center, var(--leather-3) 0%, var(--leather) 60%, var(--leather-2) 100%);
    color: var(--ink);
    font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(ellipse at center, var(--leather-3) 0%, var(--leather) 60%, var(--leather-2) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
    background-blend-mode: multiply;
  }

  /* ─── Header (top bar with title + book/chapter selector) ─── */
  header {
    flex-shrink: 0;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid rgba(160,120,32,0.25);
    background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1));
  }
  .brand {
    font-family: 'UnifrakturMaguntia', 'Pirata One', serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(160,120,32,0.3), 0 1px 0 rgba(0,0,0,0.6);
    line-height: 1;
  }
  .brand-sub {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--parch-edge);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
    opacity: 0.7;
  }
  .nav-cluster {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .nav-btn {
    background: linear-gradient(180deg, #2a1810, #1a0a08);
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    padding: 8px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    box-shadow: 0 1px 0 rgba(160,120,32,0.2) inset, 0 2px 6px rgba(0,0,0,0.4);
  }
  .nav-btn:hover {
    background: linear-gradient(180deg, #3a2418, #2a1410);
    color: #d4a843;
    box-shadow: 0 1px 0 rgba(160,120,32,0.4) inset, 0 2px 10px rgba(160,120,32,0.3);
  }
  .nav-btn .ornament {
    color: var(--rubric);
    margin: 0 4px;
  }
  .ref-display {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 20px;
    color: var(--parchment);
    text-shadow: 0 0 6px rgba(160,120,32,0.4);
    padding: 0 8px;
  }

  /* ─── Main book area ─── */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 0;
  }

  /* The book itself: two-page spread with spine in the middle */
  .book {
    width: min(1200px, 100%);
    height: 100%;
    max-height: 820px;
    display: grid;
    grid-template-columns: 1fr 12px 1fr;
    position: relative;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,0.6))
            drop-shadow(0 10px 20px rgba(0,0,0,0.4));
  }
  .page {
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.15), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(120,80,30,0.18), transparent 60%),
      linear-gradient(180deg, #f6ecd2 0%, #f0e4c4 100%);
    background-color: var(--parchment);
    position: relative;
    overflow: hidden;
    padding: 38px 52px 48px;
    display: flex;
    flex-direction: column;
  }
  /* Subtle paper texture overlay */
  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0 0.10 0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>");
    mix-blend-mode: multiply;
    opacity: 0.4;
    pointer-events: none;
  }
  /* Aged edge vignette */
  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 60%, rgba(140,90,30,0.22) 100%);
    pointer-events: none;
  }
  .page-left {
    border-radius: 6px 0 0 6px;
    box-shadow: inset -6px 0 16px -8px rgba(0,0,0,0.4);
  }
  .page-right {
    border-radius: 0 6px 6px 0;
    box-shadow: inset 6px 0 16px -8px rgba(0,0,0,0.4);
  }
  /* The spine */
  .spine {
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.7) 50%,
        rgba(0,0,0,0.45) 100%);
    position: relative;
    z-index: 2;
  }
  .spine::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      transparent, rgba(160,120,32,0.15) 50%, transparent);
  }

  /* ─── Inside-page content ─── */
  .page-content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  /* Page header (book name + chapter number) — shown only on left page top */
  .page-header {
    text-align: center;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(139,30,30,0.18);
    padding-bottom: 14px;
  }
  .book-name {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 30px;
    color: var(--ink);
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .chapter-num {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--rubric);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  /* Ornate flourish under header */
  .page-header .flourish {
    display: block;
    color: var(--gold);
    font-size: 14px;
    margin-top: 8px;
    opacity: 0.7;
    letter-spacing: 8px;
  }

  /* Verse body — justified, slightly tighter line spacing */
  .verses {
    font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    text-align: justify;
    hyphens: auto;
    flex: 1;
    overflow: hidden;
  }
  .verses p { margin: 0; display: inline; }
  .verse {
    display: inline;
  }
  .v-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--rubric);
    vertical-align: super;
    line-height: 0;
    margin-right: 2px;
    padding-left: 2px;
  }
  /* Illuminated drop cap — first letter of chapter */
  .drop-cap {
    font-family: 'UnifrakturMaguntia', 'Pirata One', serif;
    font-size: 72px;
    line-height: 0.85;
    color: var(--rubric);
    float: left;
    padding: 6px 10px 4px 0;
    margin-top: 4px;
    text-shadow: 1px 1px 0 rgba(160,120,32,0.3);
  }

  /* Page footer with page number + tiny ornament */
  .page-footer {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
    padding-top: 8px;
    border-top: 1px solid rgba(139,30,30,0.12);
  }
  .page-left  .page-footer .page-num { order: -1; }   /* number on outside */
  .page-right .page-footer .page-num { margin-left: auto; }
  .page-footer .ornament { color: var(--gold); }

  /* ─── Side flippers (invisible click zones on left/right edges) ─── */
  .flipper {
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 36px;
    font-family: 'Cormorant Garamond', serif;
    opacity: 0;
    transition: opacity 0.3s;
    user-select: none;
  }
  .flipper:hover { opacity: 0.8; }
  .flipper.prev { left: -70px; }
  .flipper.next { right: -70px; }

  /* ─── Books drawer ─── */
  .drawer {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(420px, 88%);
    background: linear-gradient(180deg, #1f1208, #150b06);
    box-shadow: 6px 0 30px rgba(0,0,0,0.7);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--gold-deep);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid rgba(160,120,32,0.25);
    color: var(--gold);
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .drawer-close {
    background: none;
    border: none;
    color: var(--parch-edge);
    font-size: 22px;
    cursor: pointer;
    font-family: serif;
    padding: 0 8px;
  }
  .drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
  }
  .testament-label {
    font-family: 'UnifrakturMaguntia', serif;
    color: var(--rubric);
    font-size: 16px;
    padding: 16px 22px 8px;
    border-bottom: 1px solid rgba(139,30,30,0.25);
    letter-spacing: 2px;
  }
  .book-list { list-style: none; }
  .book-item {
    padding: 9px 22px;
    color: var(--parchment);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(160,120,32,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
  }
  .book-item:hover {
    background: rgba(160,120,32,0.1);
    color: var(--gold);
  }
  .book-item.current {
    background: rgba(139,30,30,0.18);
    color: var(--gold);
  }
  .book-item .chap-count {
    font-size: 11px;
    color: var(--parch-edge);
    opacity: 0.55;
    font-style: italic;
  }

  /* Chapter picker (shown when a book is selected) */
  .chap-picker {
    padding: 14px 18px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid rgba(160,120,32,0.18);
    max-height: 280px;
    overflow-y: auto;
  }
  .chap-picker.open { display: flex; }
  .chap-btn {
    width: 38px; height: 38px;
    background: rgba(160,120,32,0.08);
    border: 1px solid rgba(160,120,32,0.3);
    color: var(--parchment);
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .chap-btn:hover {
    background: rgba(160,120,32,0.2);
    color: var(--gold);
    border-color: var(--gold);
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .drawer-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* ─── Mobile ─── */
  @media (max-width: 800px) {
    header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    .brand { font-size: 22px; }
    .brand-sub { display: none; }
    .nav-btn { padding: 6px 12px; font-size: 13px; }
    .ref-display { font-size: 15px; padding: 0 4px; }

    main { padding: 8px; }
    .book {
      grid-template-columns: 1fr;   /* single page on phone */
      max-height: none;
    }
    .spine, .page-left  { display: none; }
    .page-right {
      border-radius: 6px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
    }
    .page { padding: 22px 24px 24px; }
    .verses { font-size: 16px; }
    .book-name { font-size: 24px; }
    .drop-cap { font-size: 56px; }
    .flipper.prev { left: 4px; opacity: 0.5; }
    .flipper.next { right: 4px; opacity: 0.5; }
  }

  /* Loading state */
  .loading {
    color: var(--ink-soft);
    text-align: center;
    font-style: italic;
    padding: 40px;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Sagrada Biblia</div>
    <div class="brand-sub">Reina-Valera · 1909</div>
  </div>

  <div class="nav-cluster">
    <button class="nav-btn" id="btn-books">
      <span class="ornament">❦</span> Libros
    </button>
    <span class="ref-display" id="ref-display">Génesis I</span>
    <button class="nav-btn" id="btn-prev" title="Capítulo anterior">‹</button>
    <button class="nav-btn" id="btn-next" title="Capítulo siguiente">›</button>
  </div>
</header>

<main>
  <div class="book" id="book">
    <div class="page page-left" id="page-left">
      <div class="page-content"></div>
    </div>
    <div class="spine"></div>
    <div class="page page-right" id="page-right">
      <div class="page-content"></div>
    </div>
    <div class="flipper prev" id="flip-prev">‹</div>
    <div class="flipper next" id="flip-next">›</div>
  </div>
</main>

<!-- Books drawer -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span>Libros Sagrados</span>
    <button class="drawer-close" id="drawer-close">✕</button>
  </div>
  <div class="drawer-content" id="drawer-content"></div>
  <div class="chap-picker" id="chap-picker"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════

   For v1 only Génesis 1-3 and Juan 1-3 are hardcoded.

/* ════════════════════════════════════════════════════════════
   STATE + RENDERING
   ════════════════════════════════════════════════════════════ */

const state = {
  bookId: 'gen',
  chapter: 1,
  page: 0,       // which page-pair of the current chapter we're on
  pages: [],     // array of {verses: [...]} chunks for this chapter
};

const bookMeta = (id) => ALL_BOOKS.find(b => b.id === id);

function chapterText(bookId, chapter) {
  const key = `${bookId}-${chapter}`;
  return TEXT[key] || null;
}

function renderChapterIntoPages() {
  const ch = chapterText(state.bookId, state.chapter);
  const book = bookMeta(state.bookId);
  const refEl = document.getElementById('ref-display');
  refEl.textContent = `${book.name} ${roman(state.chapter)}`;

  const leftContent  = document.querySelector('#page-left .page-content');
  const rightContent = document.querySelector('#page-right .page-content');
  leftContent.innerHTML = '';
  rightContent.innerHTML = '';

  if (!ch) {
    leftContent.innerHTML = `
      <div class="page-header">
        <div class="book-name">${book.name}</div>
        <span class="chapter-num">Capítulo ${state.chapter}</span>
        <span class="flourish">✦ ❦ ✦</span>
      </div>
      <div class="loading">
        <em>Este capítulo aún no está cargado en esta demostración.<br>
        Próximamente: Reina-Valera 1909 completa.</em>
      </div>`;
    return;
  }

  // Build the full verse HTML for this chapter once
  const verseEntries = Object.entries(ch).sort((a, b) => +a[0] - +b[0]);
  const firstVerseText = verseEntries[0][1];
  const firstLetter = firstVerseText.charAt(0);
  const firstRest   = firstVerseText.slice(1);

  let html = '';
  verseEntries.forEach(([n, t], i) => {
    if (i === 0) {
      html += `<span class="verse"><span class="drop-cap">${firstLetter}</span><span class="v-num">${n}</span>${firstRest} </span>`;
    } else {
      html += `<span class="verse"><span class="v-num">${n}</span>${t} </span>`;
    }
  });

  // For v1: put the header + verses on the left page, continuation flows to right via JS measurement
  leftContent.innerHTML = `
    <div class="page-header">
      <div class="book-name">${book.name}</div>
      <span class="chapter-num">Capítulo ${state.chapter}</span>
      <span class="flourish">✦ ❦ ✦</span>
    </div>
    <div class="verses" id="verses-left"></div>
    <div class="page-footer">
      <span class="ornament">❦</span>
      <span class="page-num">${book.name} · ${state.chapter}</span>
    </div>`;

  rightContent.innerHTML = `
    <div class="verses" id="verses-right"></div>
    <div class="page-footer">
      <span class="page-num">${book.name} · ${state.chapter}</span>
      <span class="ornament">❦</span>
    </div>`;

  // Split verses between two pages: put the full text on left first, then if it
  // overflows move the trailing verses to the right page.
  const leftV  = document.getElementById('verses-left');
  const rightV = document.getElementById('verses-right');
  leftV.innerHTML  = html;

  // Measure: if left overflows, peel verses from the end and move them right
  // until it fits. (Simple, fast enough for chapters up to ~200 verses.)
  if (leftV.scrollHeight > leftV.clientHeight + 4) {
    const verses = Array.from(leftV.querySelectorAll('.verse'));
    let moved = [];
    while (leftV.scrollHeight > leftV.clientHeight + 4 && verses.length > 1) {
      const last = verses.pop();
      moved.unshift(last);
      last.remove();
    }
    rightV.innerHTML = moved.map(el => el.outerHTML).join('');
  } else {
    // Chapter fits on left page — put a small marker on the right for now
    rightV.innerHTML = `<div style="text-align:center;color:var(--ink-soft);font-style:italic;opacity:0.5;margin-top:40%;">
      <span style="font-size:24px;color:var(--gold);">❦</span>
    </div>`;
  }
}

function roman(n) {
  const M = ['','M','MM','MMM'];
  const C = ['','C','CC','CCC','CD','D','DC','DCC','DCCC','CM'];
  const X = ['','X','XX','XXX','XL','L','LX','LXX','LXXX','XC'];
  const I = ['','I','II','III','IV','V','VI','VII','VIII','IX'];
  return M[Math.floor(n/1000)] + C[Math.floor(n%1000/100)] + X[Math.floor(n%100/10)] + I[n%10];
}

/* ────── Navigation ────── */
function prevChapter() {
  const idx = ALL_BOOKS.findIndex(b => b.id === state.bookId);
  if (state.chapter > 1) {
    state.chapter--;
  } else if (idx > 0) {
    state.bookId = ALL_BOOKS[idx - 1].id;
    state.chapter = ALL_BOOKS[idx - 1].chapters;
  }
  renderChapterIntoPages();
}
function nextChapter() {
  const book = bookMeta(state.bookId);
  const idx = ALL_BOOKS.findIndex(b => b.id === state.bookId);
  if (state.chapter < book.chapters) {
    state.chapter++;
  } else if (idx < ALL_BOOKS.length - 1) {
    state.bookId = ALL_BOOKS[idx + 1].id;
    state.chapter = 1;
  }
  renderChapterIntoPages();
}
function goTo(bookId, chapter) {
  state.bookId = bookId;
  state.chapter = chapter;
  renderChapterIntoPages();
  closeDrawer();
}

/* ────── Books drawer ────── */
const drawer    = document.getElementById('drawer');
const backdrop  = document.getElementById('drawer-backdrop');
const chapPick  = document.getElementById('chap-picker');

function renderBookList() {
  const c = document.getElementById('drawer-content');
  const list = (label, books) => `
    <div class="testament-label">${label}</div>
    <ul class="book-list">
      ${books.map(b => `
        <li class="book-item ${b.id === state.bookId ? 'current' : ''}" data-book="${b.id}">
          <span>${b.name}</span>
          <span class="chap-count">${b.chapters} cap.</span>
        </li>
      `).join('')}
    </ul>`;
  c.innerHTML = list('Antiguo Testamento', BOOKS_AT) + list('Nuevo Testamento', BOOKS_NT);
  c.querySelectorAll('.book-item').forEach(item => {
    item.addEventListener('click', () => {
      const bid = item.dataset.book;
      renderChapPicker(bid);
    });
  });
}

function renderChapPicker(bookId) {
  const book = bookMeta(bookId);
  chapPick.innerHTML = Array.from({length: book.chapters}, (_, i) =>
    `<button class="chap-btn" data-ch="${i+1}">${i+1}</button>`
  ).join('');
  chapPick.classList.add('open');
  chapPick.querySelectorAll('[data-ch]').forEach(b => {
    b.addEventListener('click', () => goTo(bookId, +b.dataset.ch));
  });
}

function openDrawer() {
  drawer.classList.add('open');
  backdrop.classList.add('show');
  chapPick.classList.remove('open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  backdrop.classList.remove('show');
}

/* ────── Wire it up ────── */
document.getElementById('btn-books').addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
backdrop.addEventListener('click', closeDrawer);
document.getElementById('btn-prev').addEventListener('click', prevChapter);
document.getElementById('btn-next').addEventListener('click', nextChapter);
document.getElementById('flip-prev').addEventListener('click', prevChapter);
document.getElementById('flip-next').addEventListener('click', nextChapter);

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevChapter();
  if (e.key === 'ArrowRight') nextChapter();
  if (e.key === 'Escape') closeDrawer();
});

// Re-flow on resize (verses may need to re-split between pages)
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderChapterIntoPages, 120);
});

// First paint
renderBookList();
renderChapterIntoPages();
</script>
