  const packDone = PACKING.flatMap(c=>c.items).filter(i=>packStatus[i.id]).length;
  const packTotal = PACKING.flatMap(c=>c.items).length;
  html += `<div style="background:${barBg};border-bottom:1px solid ${cardBord};padding:0;flex-shrink:0;position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top)">
    <div style="max-width:620px;margin:0 auto;padding:0 12px;display:flex;align-items:center;height:52px">
      <div style="flex:1;display:flex;justify-content:flex-start">
        <button onclick="setState({itnShowMap:!state.itnShowMap})" style="display:flex;align-items:center;gap:4px;background:${itnShowMap?day.col+'22':'none'};border:1px solid ${itnShowMap?day.col:cardBord};color:${itnShowMap?day.col:txDim};border-radius:7px;cursor:pointer;padding:5px 9px;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700">MAPA</button><button onclick="showPhrasebook()" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:none;border:1px solid ${cardBord};color:${txDim};border-radius:50%;cursor:pointer;font-size:14px;margin-left:4px" title="Frases básicas">📖</button>
      </div>
      <span onclick="Math.random()<0.25?(Math.random()<0.5?showPandaGame():showPapaPandaGame()):showWisdom()" style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:800;letter-spacing:2px;color:${txMain};cursor:pointer;user-select:none">ITINERARIO</span>
      <div style="flex:1;display:flex;justify-content:flex-end">
        <button onclick="setState({itnReservas:!state.itnReservas})" style="display:flex;align-items:center;gap:3px;background:${state.itnReservas?'rgba(245,158,11,0.12)':'none'};border:1px solid ${state.itnReservas?'#F59E0B':cardBord};color:${state.itnReservas?'#F59E0B':txDim};border-radius:7px;cursor:pointer;padding:5px 9px;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700">RESERVAS${resvPending>0?'<span style="color:'+(state.itnReservas?'#F59E0B':'#ef4444')+';margin-left:3px;font-size:9px">'+resvPending+'</span>':''}</button>
      </div>
    </div>
  </div>`;

  // Reservas — full page, show immediately after top bar
  if (state.itnReservas) {
    html += `<div style="flex:1;overflow-y:auto">${renderReservations()}</div>`;
    html += '</div>';
    return html;
  }

  // Day selector
  html += `<div id="itnDayBar" style="background:${barBg};border-bottom:1px solid ${cardBord};overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0">
    <div style="display:flex;gap:4px;padding:10px 16px;width:max-content">`;
  AGENDA.forEach(d => {
    const a = d.day === itnDay;
    const dp = d.date.split(' ');
    html += `<button onclick="setItnDay(${d.day})" style="display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:8px;background:${a?d.col:'transparent'};border:1px solid ${a?d.col:cardBord};cursor:pointer;min-width:50px;transition:all 0.15s">
      <span style="font-family:'DM Sans',sans-serif;font-size:9px;color:${a?'rgba(255,255,255,0.8)':txDim};font-weight:600;line-height:1.3">${dp[0]}</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:13px;color:${a?'#fff':txMain};font-weight:800;line-height:1.2">${dp[1]}</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:9px;color:${a?'rgba(255,255,255,0.8)':txDim};font-weight:600;line-height:1.3">${dp[2]?dp[2].split('(')[0]:''}</span>
    </button>`;
  });
  html += `</div></div>`;

  // Inline map (when toggled open)
  if (itnShowMap) {
    html += `<div id="itnMapWrap" style="border-bottom:1px solid ${cardBord}"><div id="leafletMap" style="height:240px;width:100%"></div></div>`;
  }

  // Day header — with city desc + hotel link
  const _cityObj = CITIES.find(c => c.city === day.city);
  const _hotelObj = _cityObj && HOTELS[_cityObj.id] ? HOTELS[_cityObj.id][0] : null;
  const _cityDesc = _cityObj ? _cityObj.desc : null;
  const _isFirstDayOfCity = !AGENDA.find(d => d.city === day.city && d.day < day.day);
  html += `<div style="background:linear-gradient(135deg,${day.col}20,transparent);border-bottom:1px solid ${cardBord}">
    <div style="max-width:620px;margin:0 auto;padding:13px 20px">
      <div style="display:flex;align-items:center;gap:10px">
        <span onclick="showCityQuiz(AGENDA.find(function(d){return d.day===${day.day};}).city)" style="font-size:26px;cursor:pointer;user-select:none" title="Quiz">${day.emoji}</span>
        <div style="flex:1">
          <div style="font-size:17px;font-weight:800;color:${txMain};letter-spacing:-0.3px">${day.date} — ${day.city}</div>
          <div style="font-family:'DM Sans',sans-serif;font-size:11px;color:${day.col};font-weight:600;margin-top:2px">${day.events.length} paradas</div>
        </div>
        ${_hotelObj ? `<a href="${_hotelObj.link}" target="_blank" rel="noopener" style="text-align:right;text-decoration:none;flex-shrink:0"><div style="font-family:'DM Sans',sans-serif;font-size:8px;font-weight:700;color:${txDim};letter-spacing:1px">HOTEL</div><div style="font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:${txSub};max-width:100px;text-align:right;line-height:1.3">${_hotelObj.name.split(' ').slice(0,3).join(' ')}</div></a>` : ''}
      </div>
      ${(_cityDesc && _isFirstDayOfCity) ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid ${cardBord}"><p style="font-family:'DM Sans',sans-serif;font-size:11px;line-height:1.65;color:${txSub};margin:0">${_cityDesc}</p></div>` : ''}
    </div>
  </div>`;



  // Timeline
  html += `<div style="flex:1;padding:16px 20px 50px">
    <div style="max-width:620px;margin:0 auto">`;

  let itnWalkCount = 0;
  // Pre-sort OPCIÓN groups A→B→C in itinerary view (within same-time sub-groups)
  const _itLabelOrder = {'A':0,'B':1,'C':2,'D':3,'★':4};
  function _itParseMin(t) { if(!t) return 0; const p=t.split(':'); return parseInt(p[0]||0)*60+parseInt(p[1]||0); }
  const _itSorted = (() => {
    const arr = day.events.filter(e => !!e);
    let i = 0;
    while (i < arr.length) {
      if (/^[^A-Za-z0-9]*OPCI[ÓO]N/.test(arr[i].title)) {
        let j = i;
        while (j < arr.length && /^[^A-Za-z0-9]*OPCI[ÓO]N/.test(arr[j].title)) j++;
        // Sort within same-time sub-groups only
        const run = arr.slice(i, j);
        const sorted = [];
        let sg = 0;
        while (sg < run.length) {
          const ref = _itParseMin(run[sg].time);
          let sgEnd = sg + 1;
          while (sgEnd < run.length && Math.abs(_itParseMin(run[sgEnd].time) - ref) <= 15) sgEnd++;
          const sub = run.slice(sg, sgEnd).sort((a,b) => {
            const la = (a.title.match(/OPCI[ÓO]N\s*([A-Z★])/) || [,'★'])[1];
            const lb = (b.title.match(/OPCI[ÓO]N\s*([A-Z★])/) || [,'★'])[1];
            return (_itLabelOrder[la]??9) - (_itLabelOrder[lb]??9);
          });
          sorted.push(...sub);
          sg = sgEnd;
        }
        sorted.forEach((e,k) => arr[i+k]=e);
        i = j;
      } else { i++; }
    }
    return arr;
  })();
  // Build pin numbers (only used when map is open)
  const itnPinNum = {};
  if (itnShowMap) {
    let _pc = 0;
    _itSorted.forEach(ev => { if (PLACE_COORDS[ev.title]) { _pc++; itnPinNum[ev.title] = _pc; } });
  }

  let _grpScrollHint = false;
  _itSorted.forEach((ev, idx) => {
    const isLast = idx === _itSorted.length - 1;
    const tagCol = tagColors[ev.tag] || '#94a3b8';
    const resvItem = ev.resv ? RESERVATIONS.find(r => r.id === ev.resv) : null;

    const isOpt = /^[^A-Za-z0-9]*OPCIÓN/.test(ev.title);
    const prevIsOpt = idx > 0 && /^[^A-Za-z0-9]*OPCIÓN/.test(_itSorted[idx-1].title);
    const nextIsOpt = idx < _itSorted.length-1 && /^[^A-Za-z0-9]*OPCIÓN/.test(_itSorted[idx+1].title);
    // Same time group = within 15 min
    const _itSameGrp = (a,b) => Math.abs(_itParseMin(a.time)-_itParseMin(b.time))<=15;
    const prevIsOptSame = prevIsOpt && _itSameGrp(ev, _itSorted[idx-1]);
    const nextIsOptSame = nextIsOpt && _itSameGrp(ev, _itSorted[idx+1]);
    const optMatchI = isOpt ? ev.title.match(/OPCI[ÓO]N\s*([A-Z★])/) : null;
    const optLabel = optMatchI ? optMatchI[1] : (isOpt ? '★' : null);
    const displayTitle = isOpt ? ev.title.replace(/^OPCIÓN\s*[A-Z]?\s*[\u2014\-—]?\s*/, '') : ev.title;
    const optBadgeColorsI = {'A':'#3B82F6','B':'#8B5CF6','C':'#059669','D':'#F59E0B'};
    const optBadgeColor = optBadgeColorsI[optLabel] || '#6B7280';
    const isResvDone = resvItem ? (resvItem.done || resvStatus[resvItem.id]) : null;
    const hasAddress = ev.addr_cn && ev.addr_cn.length > 0;
    const _amapCoords = PLACE_COORDS[ev.title];
    const amapUrl = _amapCoords
      ? `https://uri.amap.com/marker?position=${_amapCoords[1]},${_amapCoords[0]}&name=${encodeURIComponent(ev.title)}&src=china-trip&callnative=1`
      : (hasAddress ? `https://uri.amap.com/poi?keywords=${encodeURIComponent(ev.addr_cn)}&src=china-trip&dev=0&callnative=1` : null);
    const uid = `${day.day}_${idx}`;

    // Time header: show for regular events and first option only
    if (!isOpt || !prevIsOpt) {
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px${idx>0?';margin-top:4px':''}">
        <div style="font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;color:${txMain};white-space:nowrap;min-width:52px">${ev.time}</div>
        <div style="flex:1;height:1px;background:${divider}"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:${tagCol};flex-shrink:0;box-shadow:0 0 6px ${tagCol}90"></div>
      </div>`;
    }
    const itnHasGroup = isOpt && !prevIsOptSame && nextIsOptSame;
    if (itnHasGroup) {
      let _grpSz = 1, _ni = idx+1;
      while (_ni < _itSorted.length) {
        const _ne = _itSorted[_ni];
        if (!/^[^A-Za-z0-9]*OPCIÓN/.test(_ne.title)) break;
        if (Math.abs(_itParseMin(ev.time)-_itParseMin(_ne.time))>15) break;
        _grpSz++; _ni++;
      }
      _grpScrollHint = _grpSz >= 3;
      if (_grpScrollHint) {
        html += `<div style="position:relative;margin-bottom:${(!isLast&&!nextIsOpt)?20:0}px">`;
        html += `<div style="display:flex;gap:8px;align-items:stretch;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;padding-right:24px">`;
        html += `<div style="position:absolute;right:0;top:0;bottom:4px;width:44px;background:linear-gradient(to right,transparent,${isDark?'rgba(18,18,26,0.95)':'rgba(249,249,253,0.95)'});pointer-events:none;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;border-radius:0 12px 12px 0;z-index:2"><span style="font-size:20px;font-weight:300;color:${isDark?'rgba(255,255,255,0.45)':'rgba(0,0,0,0.3)'};line-height:1">›</span></div>`;
      } else {
        _grpScrollHint = false;
        html += `<div style="display:flex;gap:8px;align-items:stretch;margin-bottom:${(!isLast&&!nextIsOpt)?20:0}px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px">`;
      }
    }

    html += `<div onclick="${itnShowMap ? (ev.tag==='transporte' ? `var _d=AGENDA.find(function(d){return d.day===${day.day}});highlightRoute(_d.events[${idx}],_d)` : `selectPlace(${day.day},${idx})`) : ''}" style="${itnShowMap&&PLACE_COORDS[ev.title]?'cursor:pointer;':'' }${(isOpt&&(prevIsOptSame||nextIsOptSame))?'flex:1;min-width:160px;':''}background:${cardBg};border:1px ${isOpt?'dashed':'solid'} ${cardBord};border-left:3px solid ${tagCol};border-radius:12px;overflow:hidden${isOpt?'':';margin-bottom:'+(isLast?0:20)+'px'}">
      <div style="padding:13px 14px 11px;display:flex;align-items:flex-start;gap:10px;justify-content:space-between">
        <div style="display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0">
          ${isOpt ? `<div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:${optBadgeColor};display:flex;align-items:center;justify-content:center;margin-top:2px"><span style="font-size:10px;font-weight:800;color:#fff">${optLabel}</span></div>` : itnShowMap && itnPinNum[ev.title] ? `<div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:${tagCol};border:2px solid rgba(255,255,255,0.88);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:white;box-shadow:0 2px 6px rgba(0,0,0,0.3)">${itnPinNum[ev.title]}</div>` : `<span style="font-size:22px;flex-shrink:0;margin-top:1px">${ev.icon}</span>`}
          <div>
            <div style="font-size:${isOpt?'13':'15'}px;font-weight:700;color:${txMain};line-height:1.35;margin-bottom:5px">${displayTitle}</div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px">
              <span style="font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;background:${tagCol}22;color:${tagCol};padding:2px 9px;border-radius:20px">${ev.tag}</span>
              ${ev.dur ? `<span style="font-family:'DM Sans',sans-serif;font-size:10px;color:${txDim};background:${isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.05)'};padding:2px 9px;border-radius:20px">⏱ ${ev.dur}</span>` : ''}
            </div>
          </div>
        </div>
        ${ev.phone ? `<div style="position:relative;flex-shrink:0;margin-top:2px" id="ph-wrap-${uid}"><button onclick="event.stopPropagation();var p=document.getElementById('ph-pop-${uid}');p.style.display=p.style.display==='flex'?'none':'flex'" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${tagCol}18;color:${tagCol};border:none;cursor:pointer;padding:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg></button><div id="ph-pop-${uid}" style="display:none;position:absolute;right:0;top:34px;background:${cardBg};border:1px solid ${tagCol}44;border-radius:10px;padding:8px 12px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.18);flex-direction:column;align-items:flex-start;gap:6px;min-width:160px"><span onclick="copyText('${ev.phone}',this)" style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;color:${txMain};white-space:nowrap;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background 0.2s" title="Toca para copiar">${ev.phone}</span></div></div>` : ''}
        ${!resvItem ? '' : isResvDone ? '<button onclick="showResvPopup(\'' + ev.resv + '\')" title="Ver confirmación" style="flex-shrink:0;background:rgba(16,185,129,0.15);border:1.5px solid #10b981;color:#10b981;font-size:14px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px">✅</button>' : '<button onclick="showResvPopup(\'' + ev.resv + '\')" title="Ver reservación" style="flex-shrink:0;background:rgba(234,179,8,0.15);border:1.5px solid #eab308;color:#eab308;font-size:13px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px">⚠</button>'}
      </div>
      ${ev.desc ? `<div style="border-top:1px solid ${divider}">
        <button onclick="var el=document.getElementById('desc-${uid}');var ic=document.getElementById('ic-${uid}');if(el.style.display==='none'){el.style.display='block';ic.textContent='▲'}else{el.style.display='none';ic.textContent='▼'}" style="width:100%;background:none;border:none;cursor:pointer;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-family:'DM Sans',sans-serif;text-align:left">
          <span style="font-size:11px;font-weight:600;color:${txDim}">¿Qué es este lugar?</span>

function getStationCoords(title) {
  for (var key in STATION_COORDS) {
    if (title.includes(key)) return STATION_COORDS[key];
  }
  return null;
}

function getTrainFromTo(ev) {
  // Parse "Tren: A → B" or "Metro: A → B" or "🚇 MTR A → B"
  var t = ev.title;
  // Match arrow pattern
  var parts = t.match(/[→:]\s*(.+?)\s*[→]\s*(.+)/);
  if (!parts) {
    // Try "Tren/Metro: Origin → Dest" pattern
    parts = t.match(/(?:Tren|Metro|MTR)[:\s]+(.+?)\s*→\s*(.+)/i);
  }
  if (parts) {
    var fromStr = parts[1].replace(/^[^a-zA-Z\u00C0-\u024F\u4E00-\u9FFF]*/, '').trim();
    var toStr = parts[2].replace(/\s*\(.*\)/, '').trim();
    var fromC = getStationCoords(fromStr) || getStationCoords(t.split('→')[0]);
    var toC = getStationCoords(toStr) || getStationCoords(t.split('→').pop());
    if (fromC && toC) return { from: fromC, to: toC, fromLabel: fromStr, toLabel: toStr };
  }
  // Fallback: just look for any station name in the title
  var toC = getStationCoords(t);
  return toC ? { to: toC } : null;
}

function highlightRoute(ev, day) {
  if (!window._map || (!state.showMap && !state.itnShowMap)) return;
  const evIdx = day.events.indexOf(ev);
  const modeStyle = { train:{color:'#60A5FA',weight:5,dash:null}, flight:{color:'#A78BFA',weight:4,dash:'6,6'}, metro:{color:'#2DD4BF',weight:5,dash:null}, didi:{color:'#F59E0B',weight:4,dash:'5,6'}, van:{color:'#F97316',weight:4,dash:'4,5'}, ferry:{color:'#22D3EE',weight:4,dash:'3,4'}, walk:{color:'#94a3b8',weight:3,dash:'3,5'} };

  if (window._highlightMarker) { try { window._map.removeLayer(window._highlightMarker); } catch(e){} }
  if (window._ctxMarkers) { window._ctxMarkers.forEach(function(m){ try { window._map.removeLayer(m); } catch(e){}; }); }
  window._ctxMarkers = [];

  // Detect long-distance transport and use station coords
  var isLongTransport = /Tren|Vuelo|Metro|MTR|🚄|🚇|✈/.test(ev.title) || ev.tag === 'transporte';
  var stationRoute = isLongTransport ? getTrainFromTo(ev) : null;
  var fromCoords, toCoords, fromLabel, toLabel;
  var prevEv;

  if (stationRoute && stationRoute.from && stationRoute.to) {
    fromCoords = stationRoute.from;
    toCoords   = stationRoute.to;
    fromLabel  = stationRoute.fromLabel || '';
    toLabel    = stationRoute.toLabel   || ev.title;
  } else {
    prevEv    = day.events.slice(0, evIdx).reverse().find(function(e){ return PLACE_COORDS[e.title]; });
    fromCoords = prevEv ? PLACE_COORDS[prevEv.title] : null;
    toCoords   = PLACE_COORDS[ev.title] || (stationRoute && stationRoute.to) || null;
    fromLabel  = prevEv ? prevEv.title : '';
    toLabel    = ev.title;
  }

  if (!fromCoords && !toCoords) { if (PLACE_COORDS[ev.title]) zoomToCoords(PLACE_COORDS[ev.title], ev, day); return; }

  var mode = travelMode(ev, fromCoords, toCoords, 0);
  var st = modeStyle[mode] || modeStyle.didi;
  var maxZ = (mode === 'train' || mode === 'flight') ? 10 : 15;

  if (fromCoords && toCoords) {
    var opts = {color:st.color, weight:st.weight+2, opacity:0.9};
    if (st.dash) opts.dashArray = st.dash;
    window._ctxMarkers.push(L.polyline([fromCoords, toCoords], opts).addTo(window._map));
    window._ctxMarkers.push(L.polyline([fromCoords, toCoords], {color:st.color, weight:st.weight+10, opacity:0.15}).addTo(window._map));
    var fromIcon = L.divIcon({ html: '<div style="width:22px;height:22px;border-radius:50%;background:' + st.color + ';border:2.5px solid white;opacity:0.85;display:flex;align-items:center;justify-content:center;font-size:12px">🚉</div>', iconSize:[22,22], iconAnchor:[11,11], className:'' });
    window._ctxMarkers.push(L.marker(fromCoords, {icon:fromIcon}).addTo(window._map).bindPopup('<small style="color:' + st.color + '">SALIDA</small><br><b>' + fromLabel + '</b>'));
    var toIcon = L.divIcon({ html: '<div style="width:28px;height:28px;border-radius:50%;background:' + st.color + ';border:3px solid white;box-shadow:0 0 0 4px ' + st.color + '77;display:flex;align-items:center;justify-content:center;font-size:14px">' + ev.icon + '</div>', iconSize:[28,28], iconAnchor:[14,14], className:'' });
    window._highlightMarker = L.marker(toCoords, {icon:toIcon}).addTo(window._map).bindPopup('<small style="color:' + st.color + '">LLEGADA</small><br><b>' + toLabel + '</b>' + (ev.dur?'<br><small>⏱ ' + ev.dur + '</small>':'')).openPopup();
    window._map.fitBounds(L.latLngBounds([fromCoords, toCoords]), {padding:[50,50], maxZoom:maxZ, animate:true});
    var mapEl = document.getElementById('leafletMap');
    if (mapEl) mapEl.scrollIntoView({behavior:'smooth', block:'start'});
  } else if (currCoords) {
    zoomToCoords(currCoords, ev, day);
  }
}

function zoomToCoords(coords, ev, day) {
  if (!window._map) return;

  const cityObj = CITIES.find(c => c.city === day.city);
  const col = cityObj ? cityObj.color : '#F59E0B';

  // Find prev and next events that have coordinates
  const evIdx = day.events.indexOf(ev);
  const prevEv = day.events.slice(0, evIdx).reverse().find(e => PLACE_COORDS[e.title]);
  const nextEv = day.events.slice(evIdx + 1).find(e => PLACE_COORDS[e.title]);
  const prevCoords = prevEv ? PLACE_COORDS[prevEv.title] : null;
  const nextCoords = nextEv ? PLACE_COORDS[nextEv.title] : null;

  // Clear old context markers
  if (window._highlightMarker) { try { window._map.removeLayer(window._highlightMarker); } catch(e){} }
  if (window._ctxMarkers) {
    window._ctxMarkers.forEach(function(m) { try { window._map.removeLayer(m); } catch(e){} });
  }
  window._ctxMarkers = [];

  // Build bounds to include prev/next if they exist
  const pts = [coords];
  if (prevCoords) pts.push(prevCoords);
  if (nextCoords) pts.push(nextCoords);

  if (pts.length > 1) {
    const bounds = L.latLngBounds(pts);
    window._map.fitBounds(bounds, { padding: [44, 44], maxZoom: 15, animate: true });
  } else {
    window._map.setView(coords, 16, { animate: true, duration: 0.5 });
  }

  // Main marker — large + glowing
  const dot = L.divIcon({
    html: '<div style="width:30px;height:30px;border-radius:50%;background:' + col + ';border:3px solid white;box-shadow:0 0 0 4px ' + col + '55,0 4px 14px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:15px">' + ev.icon + '</div>',
    iconSize:[30,30], iconAnchor:[15,15], className:''
  });
  window._highlightMarker = L.marker(coords, {icon:dot}).addTo(window._map)
    .bindPopup('<b style="color:'+col+'">' + ev.title + '</b>' + (ev.dur ? '<br><small>⏱ ' + ev.dur + '</small>' : '')).openPopup();

  // Context markers — smaller, muted
  function addCtxMarker(c2, label, icon2, opacity) {
    const sm = L.divIcon({
      html: '<div style="width:20px;height:20px;border-radius:50%;background:' + col + ';opacity:' + opacity + ';border:2px solid rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:11px">' + icon2 + '</div>',
      iconSize:[20,20], iconAnchor:[10,10], className:''
    });
    const m = L.marker(c2, {icon:sm, opacity:opacity}).addTo(window._map)
      .bindPopup('<span style="opacity:0.7;font-size:11px">' + label + '</span>');
    window._ctxMarkers.push(m);
  }

  if (prevCoords) addCtxMarker(prevCoords, prevEv.icon + ' ' + prevEv.title, prevEv.icon, 0.5);
  if (nextCoords) addCtxMarker(nextCoords, nextEv.icon + ' ' + nextEv.title, nextEv.icon, 0.5);

  // Connecting lines
  if (prevCoords) {
    const line = L.polyline([prevCoords, coords], {color: col, weight: 2, opacity: 0.35, dashArray: '4,6'}).addTo(window._map);
    window._ctxMarkers.push(line);
  }
  if (nextCoords) {
    const line = L.polyline([coords, nextCoords], {color: col, weight: 2, opacity: 0.35, dashArray: '4,6'}).addTo(window._map);
    window._ctxMarkers.push(line);
  }
}

function showPlaceInfo(title, icon, cityColor, desc, tipsStr) {
  const isDark = getTheme() === 'dark';
  const bg   = isDark ? '#0f1629' : '#f8fafc';
  const card = isDark ? '#1e2538' : '#ffffff';

  bodyHtml += '<div style="width:80px"></div></div></div>';
  bodyHtml += '<div style="flex:1;overflow-y:auto"><div style="max-width:620px;margin:0 auto;padding:20px 20px 50px">';

    bodyHtml += '<p style="font-family:\'DM Sans\',sans-serif;font-size:15px;line-height:1.8;color:' + txs + ';margin-bottom:20px">' + desc + '</p>';

    });

  }
  if (!desc && tips.length === 0) {
    bodyHtml += '<p style="font-family:\'DM Sans\',sans-serif;font-size:14px;color:' + txd + '">Sin información adicional.</p>';
  }
  bodyHtml += '</div></div>';

  modal.innerHTML = bodyHtml;
  document.body.appendChild(modal);
}


function evEndTime(ev) {
  if (!ev || !ev.dur || !ev.time || !ev.time.includes(':')) return null;
  var dh = ev.dur.match(/(\d+(?:\.\d+)?)\s*h/);
  var dm = ev.dur.match(/(\d+)\s*min/);
  var mins = 0;
  if (dh) mins += parseFloat(dh[1]) * 60;
  if (dm) mins += parseInt(dm[1]);
  if (!mins) return null;
  // Strip any leading ~ or whitespace from time
  var cleanTime = ev.time.replace(/^[^0-9]*/,'');
  var parts = cleanTime.split(':');
  var h = parseInt(parts[0]), m = parseInt(parts[1]);
  if (isNaN(h) || isNaN(m)) return null;
  var total = h*60 + m + Math.round(mins);
  return String(Math.floor(total/60)%24).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
}

function copyText(text, el) {
  navigator.clipboard.writeText(text).then(function() {
    const orig = el.style.background;
    el.style.background = '#10B981';
    el.style.color = '#fff';
    setTimeout(function() { el.style.background = orig; el.style.color = '#111'; }, 900);
  }).catch(function() {
    // fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const orig = el.style.background;
    el.style.background = '#10B981'; el.style.color = '#fff';
    setTimeout(function() { el.style.background = orig; el.style.color = '#111'; }, 900);
  });
}

}

<script>
(function() {
  // Only activate in standalone home screen mode
  if (!window.navigator.standalone) return;

  var startY = 0, pulling = false, indicator = null;
  var THRESHOLD = 80;

  function createIndicator() {
    var el = document.createElement('div');
    el.id = 'ptr-indicator';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;transition:height 0.1s;background:transparent;pointer-events:none';
    el.innerHTML = '<div style="width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(220,38,38,0.3);border-top-color:#DC2626;animation:none;opacity:0;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center" id="ptr-spinner"></div>';
    document.body.appendChild(el);
    // Add spin keyframe
    var style = document.createElement('style');
    style.textContent = '@keyframes ptr-spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(style);
    return el;
  }

  document.addEventListener('touchstart', function(e) {
    if (window.scrollY === 0 && e.touches.length === 1) {
      startY = e.touches[0].clientY;
      pulling = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling) return;
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pulling = false; return; }
    if (!indicator) indicator = createIndicator();
    var pct = Math.min(dy / THRESHOLD, 1);
    var h = Math.min(dy * 0.4, 48);
    indicator.style.height = h + 'px';
    var spinner = document.getElementById('ptr-spinner');
    if (spinner) {
      spinner.style.opacity = pct;
      spinner.style.transform = 'rotate(' + (pct * 180) + 'deg)';
      if (pct >= 1) spinner.style.borderTopColor = '#DC2626';
      else spinner.style.borderTopColor = 'rgba(220,38,38,' + (0.3 + pct * 0.7) + ')';
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!pulling || !indicator) { pulling = false; return; }
    pulling = false;
    var dy = e.changedTouches[0].clientY - startY;
    if (dy >= THRESHOLD) {
      // Spin and reload
      var spinner = document.getElementById('ptr-spinner');
      if (spinner) spinner.style.animation = 'ptr-spin 0.5s linear infinite';
      indicator.style.height = '48px';
      setTimeout(function() { window.location.reload(); }, 400);
    } else {
      // Snap back
      indicator.style.height = '0';
      var spinner = document.getElementById('ptr-spinner');
      if (spinner) spinner.style.opacity = '0';
    }
  }, { passive: true });
})();
</script>
