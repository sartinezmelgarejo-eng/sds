/* ── State ── */
let state = { activeCity: 1, expandedDay: 0, showBooking: false, showMap: true, photoIdx: 0 };
let photoTimer = null;

function setState(updates) {
  Object.assign(state, updates);
  render();
}

function startPhotoTimer() {
  if (photoTimer) clearInterval(photoTimer);
  const city = CITIES[state.activeCity];
  const photos = CITY_PHOTOS[city.id];
  if (photos && photos.length > 1) {
    photoTimer = setInterval(function() {
      state.photoIdx = (state.photoIdx + 1) % photos.length;
      updatePhotoOnly();
    }, 4000);
  }
}

function updatePhotoOnly() {
  const city = CITIES[state.activeCity];
  const photos = CITY_PHOTOS[city.id];
  if (!photos || photos.length < 2) return;
  const idx = state.photoIdx % photos.length;
  const banner = document.getElementById("photoBanner");
  const dots = document.getElementById("photoDots");
  if (banner) {
    banner.style.transition = "opacity 0.3s";
    banner.style.opacity = "0.6";
    setTimeout(function() {
      banner.style.backgroundImage = "url(" + photos[idx] + ")";
      banner.style.opacity = "1";
    }, 150);
  }
  if (dots) {
    dots.innerHTML = photos.map(function(_, i) {
      return '<div style="width:' + (i === idx ? 16 : 6) + 'px;height:6px;border-radius:3px;background:' + (i === idx ? '#fff' : 'rgba(255,255,255,0.4)') + ';transition:all 0.3s"></div>';
    }).join("");
  }
}

/* ── Leaflet Map ── */
const cityColors = { beijing:"#DC2626", shanghai:"#3B82F6", hangzhou:"#059669", xian:"#7C3AED", chengdu:"#EA580C", chongqing:"#E11D48", lijiang:"#0891B2", xijiang:"#D97706", shenzhen:"#6366F1", hongkong:"#BE185D" };
let leafletMap = null;
let mapMarkers = [];

function initOrUpdateMap(activeCityId) {
  const routeOrder = ["beijing","shanghai","hangzhou","xian","chengdu","chongqing","lijiang","xijiang","shenzhen","hongkong"];
  const coords = routeOrder.map(id => {
    const c = MAP_CITIES.find(m => m.id === id);
    return { id, name: c.name, lat: c.lat, lon: c.lon, color: cityColors[id] };
  });

  const mapEl = document.getElementById("leafletMap");
  if (!mapEl) return;
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map("leafletMap", {
    zoomControl: false,
    attributionControl: false,
    scrollWheelZoom: true,
    dragging: true,
  }).setView([30, 110], 4);

  L.control.zoom({ position: "bottomright" }).addTo(leafletMap);
  L.control.attribution({ position: "bottomleft", prefix: false })
    .addAttribution('\u00a9 <a href="https://openstreetmap.org">OSM</a>')
    .addTo(leafletMap);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 16,
  }).addTo(leafletMap);

  const latLngs = coords.map(c => [c.lat, c.lon]);
  // Flight segments: chongqing→lijiang, lijiang→xijiang
  const flightPairs = [["chongqing","lijiang"], ["lijiang","xijiang"]];
  for (let i = 0; i < coords.length - 1; i++) {
    const from = coords[i], to = coords[i+1];
    const isFlight = flightPairs.some(p => p[0] === from.id && p[1] === to.id);
    L.polyline([[from.lat, from.lon],[to.lat, to.lon]], {
      color: isFlight ? "#60A5FA" : "#F59E0B",
      weight: isFlight ? 2.5 : 2,
      opacity: isFlight ? 0.6 : 0.35,
      dashArray: isFlight ? "4 8" : "8 6",
    }).addTo(leafletMap);
  }

  leafletMap.fitBounds(L.latLngBounds(latLngs).pad(0.15));

  mapMarkers = [];

  coords.forEach(c => {
    const isActive = c.id === activeCityId;
    const size = isActive ? 14 : 8;
    const icon = L.divIcon({
      className: "",
      html: '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+c.color+';border:2px solid '+(isActive ? '#fff' : 'rgba(255,255,255,0.3)')+';box-shadow:'+(isActive ? '0 0 12px '+c.color+'80' : 'none')+';transition:all 0.3s"></div>',
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
    });
    const marker = L.marker([c.lat, c.lon], { icon })
      .on("click", function() { handleMapClick(c.id); })
      .addTo(leafletMap);
    marker.bindTooltip(c.name, {
      permanent: isActive,
      direction: "top",
      offset: [0, -size/2 - 2],
      className: "city-tooltip" + (isActive ? " active-tooltip" : ""),
    });
    if (isActive) marker.openTooltip();
    mapMarkers.push(marker);
  });
}

function handleMapClick(id) {
  const idx = CITIES.findIndex(c => c.id === id);
  if (idx >= 0) setState({ activeCity: idx, expandedDay: 0, showBooking: false, photoIdx: 0 });
}

    html += `<div style="margin-top:6px;display:flex;gap:5px">

    [{l:"Ciudad Prohibida",u:"https://www.gugong.net/"},{l:"Gran Muralla",u:"https://www.mutianyugreatwall.com/"},{l:"Shanghai Tower",u:"https://www.shanghaitower.com/"},{l:"Terracota",u:"https://www.bmy.com.cn/"},{l:"Panda Base",u:"https://www.panda.org.cn/"},{l:"Jade Dragon Mt",u:"https://www.ljylsm.com/"},{l:"Victoria Peak",u:"https://www.thepeak.com.hk/"},{l:"Star Ferry",u:"https://www.starferry.com.hk/"}].forEach(a => {

    html += `</div></div>`;

    // Hotels
    html += `<div style="margin-bottom:10px">

    html += `<div class="sans" style="margin-top:8px;padding:9px 12px;border-radius:9px;background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.12);font-size:10.5px;color:#FBBF24;line-height:1.5">⚠️ <strong>Visa L-type doble entrada</strong> — tramitar en Embajada China CDMX, ~4 semanas antes del viaje</div>`;

  html += `</div>`;

  html += `</div>`; // close main content

  app.innerHTML = html;

  // Init/update Leaflet map
  if (showMap) {
