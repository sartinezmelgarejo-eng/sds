<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — @resisres</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#d4d4d4;font-family:'Inter',system-ui,sans-serif;min-height:100vh}

/* Header */
.header{padding:32px 20px 0;max-width:900px;margin:0 auto}
.header h1{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#c8a960}
.header .sub{font-size:11px;color:#555;margin-top:2px;letter-spacing:1px}

/* Search */
.search-bar{max-width:900px;margin:24px auto 0;padding:0 20px}
.search-bar input{
  width:100%;padding:10px 16px;
  background:#111118;border:1px solid #222;border-radius:10px;
  color:#d4d4d4;font-size:13px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.search-bar input:focus{border-color:#c8a960}
.search-bar input::placeholder{color:#444}

/* Filters */
.filters{max-width:900px;margin:16px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{
  padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid #222;background:#111118;color:#888;cursor:pointer;
  transition:all .2s;text-transform:uppercase;letter-spacing:.5px;
}
.filter-btn:hover{border-color:#444;color:#ccc}
.filter-btn.active{background:#c8a960;color:#0a0a0f;border-color:#c8a960}

/* Date nav */
.date-nav{max-width:900px;margin:16px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.date-btn{
  padding:4px 12px;border-radius:6px;font-size:10px;font-weight:500;
  border:1px solid #1a1a24;background:transparent;color:#666;cursor:pointer;
  transition:all .2s;font-family:'SF Mono','Fira Code',monospace;
}
.date-btn:hover{border-color:#444;color:#ccc}
.date-btn.active{background:#1a1a2a;color:#c8a960;border-color:#c8a960}

/* Stats bar */
.stats{max-width:900px;margin:16px auto 0;padding:0 20px;font-size:10px;color:#555;letter-spacing:.5px;font-family:'SF Mono',monospace}

/* Feed */
.feed{max-width:900px;margin:20px auto;padding:0 20px 40px}

.card{
  background:#111118;border:1px solid #1a1a24;border-radius:12px;
  padding:20px;margin-bottom:14px;
  transition:border-color .2s,transform .2s;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#2a2a34;transform:translateY(-1px)}
.card-accent{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}

.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-emoji{font-size:18px}
.card-task{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  padding:3px 10px;border-radius:4px;
}
.card-date{font-size:10px;color:#555;font-family:'SF Mono',monospace;margin-left:auto}

.card-headline{font-size:15px;font-weight:700;color:#e8e0cc;margin-bottom:8px;line-height:1.4}
.card-body{font-size:13px;color:#999;line-height:1.7;white-space:pre-line}
.card-source{
  display:inline-block;margin-top:12px;font-size:10px;color:#638cd2;
  text-decoration:none;border-bottom:1px solid rgba(99,140,210,.3);
  transition:color .2s;
}
.card-source:hover{color:#8bb4f0}

/* Task colors */
.task-dragon .card-accent{background:#e44;}
.task-dragon .card-task{background:rgba(238,68,68,.12);color:#e44}
.task-scan .card-accent{background:#14b8a6}
.task-scan .card-task{background:rgba(20,184,166,.12);color:#14b8a6}
.task-scant .card-accent{background:#14b8a6}
.task-scant .card-task{background:rgba(20,184,166,.12);color:#14b8a6}
.task-dailyt .card-accent{background:#f59e0b}
.task-dailyt .card-task{background:rgba(245,158,11,.12);color:#f59e0b}
.task-daily .card-accent{background:#f59e0b}
.task-daily .card-task{background:rgba(245,158,11,.12);color:#f59e0b}
.task-mananera .card-accent{background:#f59e0b}
.task-mananera .card-task{background:rgba(245,158,11,.12);color:#f59e0b}
.task-onmexico .card-accent{background:#8b5cf6}
.task-onmexico .card-task{background:rgba(139,92,246,.12);color:#8b5cf6}
.task-gringo .card-accent{background:#3b82f6}
.task-gringo .card-task{background:rgba(59,130,246,.12);color:#3b82f6}
.task-espejo .card-accent{background:#ec4899}
.task-espejo .card-task{background:rgba(236,72,153,.12);color:#ec4899}
.task-data .card-accent{background:#06b6d4}
.task-data .card-task{background:rgba(6,182,212,.12);color:#06b6d4}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:#444;font-size:13px}

/* Responsive */
@media(max-width:640px){
  .header{padding:20px 16px 0}
  .search-bar,.filters,.date-nav,.stats,.feed{padding-left:16px;padding-right:16px}
  .card{padding:16px}
  .card-headline{font-size:14px}
  .card-body{font-size:12px}
  .filters{gap:6px}
}
</style></head><body>

<div class="header">
  <h1>📡 Feed</h1>
  <div class="sub">@resisres — everything posted, searchable</div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search posts… (headline, body, source)">
</div>

<div class="filters" id="filters"></div>
<div class="date-nav" id="dateNav"></div>
<div class="stats" id="stats"></div>
<div class="feed" id="feed"></div>

<script>
/* Category mapping: task → display label + filter group */
const TASK_LABELS = {
  dragon:'🐉',scan:'Mexican News',scant:'Mexican News',
  dailyt:'Mañanera',daily:'Mañanera',mananera:'Mañanera',
  onmexico:'Intl Coverage',gringo:'Intl Coverage',espejo:'Intl Coverage',
  data:'Data'
};
/* For filter buttons, group tasks into these categories */
const FILTER_GROUPS = [
  {key:'mananera', label:'Mañanera', tasks:['dailyt','daily','mananera']},
  {key:'news',     label:'Mexican News', tasks:['scan','scant']},
  {key:'intl',     label:'Intl Coverage', tasks:['onmexico','gringo','espejo']},
  {key:'dragon',   label:'🐉', tasks:['dragon']},
  {key:'data',     label:'Data', tasks:['data']},
];

let DATA=[], activeTask='all', activeDate='all', query='';

async function init(){
  try{
    const r=await fetch('feed.json?t='+Date.now());
    DATA=await r.json();
  }catch(e){DATA=[];}
  DATA.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  buildFilters();
  buildDates();
  render();
}

function buildFilters(){
  const presentTasks=new Set(DATA.map(d=>d.task));
  const el=document.getElementById('filters');
  let html='<button class="filter-btn active" data-group="all">All</button>';
  FILTER_GROUPS.forEach(g=>{
    if(g.tasks.some(t=>presentTasks.has(t)))
      html+=`<button class="filter-btn" data-group="${g.key}">${g.label}</button>`;
  });
  el.innerHTML=html;
  el.addEventListener('click',e=>{
    if(!e.target.matches('.filter-btn'))return;
    el.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeTask=e.target.dataset.group;
    render();
  });
}

function buildDates(){
  const dates=[...new Set(DATA.map(d=>d.date))].sort().reverse();
  const el=document.getElementById('dateNav');
  let html='<button class="date-btn active" data-date="all">All dates</button>';
  dates.forEach(d=>{
    const dt=new Date(d+'T12:00:00');
    const label=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    html+=`<button class="date-btn" data-date="${d}">${label}</button>`;
  });
  el.innerHTML=html;
  el.addEventListener('click',e=>{
    if(!e.target.matches('.date-btn'))return;
    el.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeDate=e.target.dataset.date;
    render();
  });
}

function render(){
  let items=DATA;
  if(activeTask!=='all'){
    const grp=FILTER_GROUPS.find(g=>g.key===activeTask);
    if(grp) items=items.filter(d=>grp.tasks.includes(d.task));
  }
  if(activeDate!=='all') items=items.filter(d=>d.date===activeDate);
  if(query){
    const q=query.toLowerCase();
    items=items.filter(d=>
      (d.headline||'').toLowerCase().includes(q)||
      (d.body||'').toLowerCase().includes(q)||
      (d.source_name||'').toLowerCase().includes(q)
    );
  }

  document.getElementById('stats').textContent=
    `${items.length} post${items.length!==1?'s':''} · ${[...new Set(items.map(d=>d.date))].length} day${[...new Set(items.map(d=>d.date))].length!==1?'s':''}`;

  const el=document.getElementById('feed');
  if(!items.length){el.innerHTML='<div class="empty">No posts match your filters.</div>';return;}

  el.innerHTML=items.map(d=>{
    const dt=new Date(d.date+'T12:00:00');
    const dateLabel=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const taskClass='task-'+(d.task||'');
    const taskLabel=TASK_LABELS[d.task]||d.task;
    const sourceHtml=d.source_url?
      `<a class="card-source" href="${d.source_url}" target="_blank">${d.source_name||'Source'} ↗</a>`:'';
    return `
      <div class="card ${taskClass}">
        <div class="card-accent"></div>
        <div class="card-top">
          <span class="card-emoji">${d.emojis||''}</span>
          <span class="card-task">${taskLabel}</span>
          <span class="card-date">${dateLabel} · ${d.time||''}</span>
        </div>
        <div class="card-headline">${esc(d.headline||'')}</div>
        <div class="card-body">${esc(d.body||'')}</div>
        ${sourceHtml}
      </div>`;
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
init();
</script>
</body></html>
