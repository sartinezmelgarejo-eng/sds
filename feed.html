<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — @resisres</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* === PALETTE: Mexico flag === */
:root{
  --verde:#006847;--verde-d:#004d35;--verde-l:rgba(0,104,71,.12);
  --blanco:#f5f1eb;--crema:#ece5d8;
  --rojo:#ce1126;--rojo-d:#a80d1e;--rojo-l:rgba(206,17,38,.10);
  --oro:#c8a960;--oro-l:rgba(200,169,96,.15);
  --txt:#1a1a1a;--txt2:#555;--txt3:#888;
  --card-bg:#fff;--card-bdr:#e5dfd4;
}

body{background:var(--blanco);color:var(--txt);font-family:'Inter',system-ui,sans-serif;min-height:100vh}

/* Flag stripe across top */
.flag{height:5px;display:flex}
.flag span{flex:1}
.flag .fg{background:var(--verde)}
.flag .fw{background:var(--blanco)}
.flag .fr{background:var(--rojo)}

/* Header */
.header{padding:28px 20px 0;max-width:860px;margin:0 auto;text-align:center}
.header h1{font-size:28px;font-weight:800;color:var(--verde-d);letter-spacing:-0.5px}
.header .sub{font-size:11px;color:var(--txt3);margin-top:4px;letter-spacing:2px;text-transform:uppercase}

/* Search */
.search-bar{max-width:860px;margin:20px auto 0;padding:0 20px}
.search-bar input{
  width:100%;padding:10px 16px;
  background:var(--card-bg);border:2px solid var(--card-bdr);border-radius:8px;
  color:var(--txt);font-size:13px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.search-bar input:focus{border-color:var(--verde)}
.search-bar input::placeholder{color:#bbb}

/* Filters */
.filters{max-width:860px;margin:14px auto 0;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.filter-btn{
  padding:6px 16px;border-radius:6px;font-size:11px;font-weight:600;
  border:2px solid var(--card-bdr);background:var(--card-bg);color:var(--txt2);cursor:pointer;
  transition:all .15s;text-transform:uppercase;letter-spacing:.5px;
}
.filter-btn:hover{border-color:var(--verde);color:var(--verde)}
.filter-btn.active{background:var(--verde);color:#fff;border-color:var(--verde)}

/* Date nav */
.date-nav{max-width:860px;margin:10px auto 0;padding:0 20px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.date-btn{
  padding:4px 10px;border-radius:4px;font-size:10px;font-weight:600;
  border:1px solid var(--card-bdr);background:transparent;color:var(--txt3);cursor:pointer;
  transition:all .15s;
}
.date-btn:hover{border-color:var(--rojo);color:var(--rojo)}
.date-btn.active{background:var(--rojo);color:#fff;border-color:var(--rojo)}

/* Stats */
.stats{max-width:860px;margin:12px auto 0;padding:0 20px;font-size:10px;color:var(--txt3);letter-spacing:.5px;text-align:center}

/* Feed */
.feed{max-width:860px;margin:16px auto;padding:0 20px 40px}

.card{
  background:var(--card-bg);border:1px solid var(--card-bdr);border-radius:8px;
  padding:14px 16px;margin-bottom:10px;
  transition:box-shadow .15s,border-color .15s;
  position:relative;overflow:hidden;
  border-left:4px solid var(--card-bdr);
}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06);border-color:#ccc}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-emoji{font-size:15px}
.card-task{
  font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
  padding:2px 8px;border-radius:3px;
}
.card-date{font-size:9px;color:var(--txt3);margin-left:auto}
.card-src{font-size:9px;color:var(--txt3);font-weight:600}

.card-headline{font-size:14px;font-weight:800;color:var(--txt);line-height:1.3;margin-bottom:4px}
.card-body{font-size:12px;color:var(--txt2);line-height:1.6;display:none}
.card.expanded .card-body{display:block;margin-top:6px}
.card-toggle{
  font-size:10px;color:var(--verde);cursor:pointer;font-weight:600;
  margin-top:4px;display:inline-block;
}
.card-toggle:hover{text-decoration:underline}

.card-source{
  display:inline-block;margin-top:6px;font-size:9px;color:var(--verde);
  text-decoration:none;font-weight:600;
}
.card-source:hover{color:var(--rojo)}

/* Task accent colors */
.task-dragon{border-left-color:var(--rojo)}
.task-dragon .card-task{background:var(--rojo-l);color:var(--rojo)}
.task-scant,.task-scan{border-left-color:var(--verde)}
.task-scant .card-task,.task-scan .card-task{background:var(--verde-l);color:var(--verde)}
.task-dailyt,.task-daily,.task-mananera{border-left-color:var(--oro)}
.task-dailyt .card-task,.task-daily .card-task,.task-mananera .card-task{background:var(--oro-l);color:#8a7030}
.task-onmexico,.task-gringo,.task-espejo{border-left-color:#444}
.task-onmexico .card-task,.task-gringo .card-task,.task-espejo .card-task{background:rgba(0,0,0,.06);color:#444}
.task-data{border-left-color:var(--verde)}
.task-data .card-task{background:var(--verde-l);color:var(--verde)}

.empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:13px}

/* Footer */
.footer{text-align:center;padding:10px;font-size:9px;color:var(--txt3);letter-spacing:1px;border-top:1px solid var(--card-bdr);max-width:860px;margin:0 auto}

@media(max-width:640px){
  .header{padding:20px 16px 0}
  .header h1{font-size:22px}
  .search-bar,.filters,.date-nav,.stats,.feed{padding-left:12px;padding-right:12px}
  .card{padding:12px 14px}
  .card-headline{font-size:13px}
  .filter-btn{padding:5px 12px;font-size:10px}
}
</style></head><body>

<div class="flag"><span class="fg"></span><span class="fw"></span><span class="fr"></span></div>

<div class="header">
  <h1>RESISRES</h1>
  <div class="sub">Feed Archive</div>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search…">
</div>

<div class="filters" id="filters"></div>
<div class="date-nav" id="dateNav"></div>
<div class="stats" id="stats"></div>
<div class="feed" id="feed"></div>
<div class="footer">sartinezmelgarejo-eng.github.io/sds</div>

<script>
const TASK_LABELS={
  dragon:'🐉',scan:'Noticias MX',scant:'Noticias MX',
  dailyt:'Mañanera',daily:'Mañanera',mananera:'Mañanera',
  onmexico:'Intl Coverage',gringo:'Intl Coverage',espejo:'Intl Coverage',
  data:'Datos'
};
const FILTER_GROUPS=[
  {key:'mananera',label:'Mañanera',tasks:['dailyt','daily','mananera']},
  {key:'news',label:'Noticias MX',tasks:['scan','scant']},
  {key:'intl',label:'Intl Coverage',tasks:['onmexico','gringo','espejo']},
  {key:'dragon',label:'🐉',tasks:['dragon']},
  {key:'data',label:'Datos',tasks:['data']},
];

let DATA=[],activeTask='all',activeDate='all',query='';

async function init(){
  try{const r=await fetch('feed.json?t='+Date.now());DATA=await r.json();}catch(e){DATA=[];}
  DATA.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  buildFilters();buildDates();render();
}

function buildFilters(){
  const present=new Set(DATA.map(d=>d.task));
  const el=document.getElementById('filters');
  let h='<button class="filter-btn active" data-group="all">All</button>';
  FILTER_GROUPS.forEach(g=>{
    if(g.tasks.some(t=>present.has(t)))
      h+=`<button class="filter-btn" data-group="${g.key}">${g.label}</button>`;
  });
  el.innerHTML=h;
  el.addEventListener('click',e=>{
    if(!e.target.matches('.filter-btn'))return;
    el.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeTask=e.target.dataset.group;render();
  });
}

function buildDates(){
  const dates=[...new Set(DATA.map(d=>d.date))].sort().reverse();
  const el=document.getElementById('dateNav');
  let h='<button class="date-btn active" data-date="all">All</button>';
  dates.forEach(d=>{
    const dt=new Date(d+'T12:00:00');
    const lbl=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    h+=`<button class="date-btn" data-date="${d}">${lbl}</button>`;
  });
  el.innerHTML=h;
  el.addEventListener('click',e=>{
    if(!e.target.matches('.date-btn'))return;
    el.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    activeDate=e.target.dataset.date;render();
  });
}

function render(){
  let items=DATA;
  if(activeTask!=='all'){
    const g=FILTER_GROUPS.find(g=>g.key===activeTask);
    if(g)items=items.filter(d=>g.tasks.includes(d.task));
  }
  if(activeDate!=='all')items=items.filter(d=>d.date===activeDate);
  if(query){
    const q=query.toLowerCase();
    items=items.filter(d=>
      (d.headline||'').toLowerCase().includes(q)||
      (d.body||'').toLowerCase().includes(q)||
      (d.source_name||'').toLowerCase().includes(q)
    );
  }

  document.getElementById('stats').textContent=
    items.length+' post'+(items.length!==1?'s':'')+' · '+[...new Set(items.map(d=>d.date))].length+' day'+(new Set(items.map(d=>d.date)).size!==1?'s':'');

  const el=document.getElementById('feed');
  if(!items.length){el.innerHTML='<div class="empty">No posts match.</div>';return;}

  el.innerHTML=items.map((d,i)=>{
    const dt=new Date(d.date+'T12:00:00');
    const dl=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const tc='task-'+(d.task||'');
    const tl=TASK_LABELS[d.task]||d.task;
    const src=d.source_name?`<span class="card-src">${esc(d.source_name)}</span>`:'';
    const link=d.source_url?`<a class="card-source" href="${d.source_url}" target="_blank">Source ↗</a>`:'';
    const hasBody=d.body&&d.body.length>0;
    return `
      <div class="card ${tc}" id="c${i}">
        <div class="card-top">
          <span class="card-emoji">${d.emojis||''}</span>
          <span class="card-task">${tl}</span>
          ${src}
          <span class="card-date">${dl} · ${d.time||''}</span>
        </div>
        <div class="card-headline">${esc(d.headline||'')}</div>
        ${hasBody?`<span class="card-toggle" onclick="this.parentElement.classList.toggle('expanded')">[expand]</span><div class="card-body">${esc(d.body)}</div>`:''}
        ${link}
      </div>`;
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
init();
</script>
</body></html>
