    border-radius: 9px;
    background: #fdfcf3;
    cursor: ns-resize;          /* hint: drag vertically to change count, click to pick */
    touch-action: none;         /* prevent page scroll while dragging on mobile */
    line-height: 13px;
    color: var(--accent);
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    opacity: 0.9;
    transition: opacity 0.15s, transform 0.1s, background 0.1s;
    z-index: 6;
  }
  .subdiv-triangle:hover,
  .subdiv-triangle.has-divs { opacity: 1; }
  .subdiv-triangle:hover { background: var(--accent); color: #fff; }
  .subdiv-triangle.has-divs { background: var(--accent); color: #fff; }
  .subdiv-bar {
    position: absolute;
    bottom: 6px;                 /* lower so it doesn't crowd the tab/staff content */
    left: 6px;
    right: 6px;
    height: 9px;                 /* thicker so segments are easier to tap */
    display: flex;
    gap: 2px;
    z-index: 4;
  }
  /* Compose-mode tab cells reserve room at the bottom so the chord diagram
     / staff doesn't extend into the subdivision bar's area. The bar itself
     is also chunkier in compose (easier hit target than playback). Bar
     sits low (close to the diagram) so the cell stays compact. */
  body:not(.player-active) .real-book-tabs .rb-tab-cell,
  body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
    padding-bottom: 28px;
  }
  /* Piano mode (no segment bar) — only reserve room for the count badge */
  body.instrument-piano:not(.player-active) .real-book-tabs .rb-tab-cell,
  body.instrument-piano:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
    padding-bottom: 14px;
  }
  /* Play mode (desktop + vertical mobile): reserve room at the bottom
     of each tab cell so the playback subdivision bar gets its own
     strip and stops overlapping the chord diagram. Landscape mobile
     handles its own padding inside #landscape-play. */
  body.player-active:not(.lp-on) .real-book-tabs .rb-tab-cell {
    padding-bottom: 14px;
  }

  /* ─── Mobile transport bar — brutalist (matches landscape) ───
     Same vibe as the landscape overlay: hard black borders, square
     corners, no shadows / no gradients. State colours stay strong
     (green play, red stop, yellow/orange loop) but the chrome is
     flat. Buttons sit on the page background — no panel block. */
  .m-transport {
    display: none;
    gap: 0;
    padding: 8px 12px;
    background: transparent;
    border: 0;
    width: 100%;
    box-sizing: border-box;
  }
  /* Brutalist weighted single row — play dominates ancho (30%),
     stop & edit secundarios (20% each), modifiers más angostos
     (15% each). Flex-grow weights so when stop / edit are hidden,
     the remaining buttons absorb their space proportionally. */
  .m-transport .m-tx-btn {
    min-width: 0;
    height: 56px;
    padding: 0;
    background: #fdfcf3;
    border: 2px solid #1a1a1a;
    border-radius: 0;
    font-size: 22px;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 800;
    color: #1a1a1a;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.1s, color 0.1s;
    /* Force text presentation of play / stop / pencil symbols on
       phones that default to color-emoji rendering (Android Noto
       Emoji especially). The variation-selector also forces text
       on a per-character basis, this is the CSS-level safety net. */
    font-variant-emoji: text;
  }
  .m-transport #m-tx-cycle { flex: 15 1 0; }
  .m-transport #m-tx-loop  { flex: 15 1 0; }
  .m-transport #m-tx-play  { flex: 30 1 0; }
  .m-transport #m-tx-stop  { flex: 20 1 0; }
  .m-transport #m-tx-edit  { flex: 20 1 0; }
  /* SVG icons — guaranteed consistent rendering across all phones
     (no emoji-font surprises). currentColor lets the icon flip to
     white when the button hits its active dark background. */
  .m-transport .m-tx-ico {
    width: 22px;
    height: 22px;
    display: block;
    pointer-events: none;
  }
  .m-transport .m-tx-play .m-tx-ico { width: 24px; height: 24px; }
  /* Play / pause icon swap — pause is hidden by default, shown when
     the play button is in its .active (playing) state. */
  .m-transport .m-tx-play .m-tx-ico-pause { display: none; }
  .m-transport .m-tx-play.active .m-tx-ico-play  { display: none; }
  .m-transport .m-tx-play.active .m-tx-ico-pause { display: block; }
  /* Hard divider between adjacent buttons — the row reads as a
     single brutalist strip, not separate pills. */
  .m-transport .m-tx-btn + .m-tx-btn { border-left: 0; }
  .m-transport .m-tx-btn:active { background: #1a1a1a; color: #fdfcf3; }
  /* Generic "on" state for buttons without a dedicated colour */
  .m-transport .m-tx-btn.active { background: #1a1a1a; color: #fdfcf3; }
  /* Play / pause — green idle/paused; bright lime when playing (still
     reads as "play" not "stop", with the pause-icon swap clarifying
     the state). Color-coded like a Logic transport indicator light. */
  /* Play / pause — green idle/paused; bright lime when playing (still
     reads as "play" not "stop", with the pause-icon swap clarifying
     the state). Color-coded like a Logic transport indicator light. */
  .m-transport .m-tx-play {
    background: #059669;
    color: #fdfcf3;
    border-color: #1a1a1a;
  }
  .m-transport .m-tx-play.active {
    background: #22c55e;          /* clean bright green when playing */
    color: #1a1a1a;
    border-color: #1a1a1a;
  }
  /* Stop — flat red */
  .m-transport .m-tx-stop {
    background: #dc2626;
    color: #fdfcf3;
  }
  .m-transport .m-tx-stop.armed {
    animation: mTxStopPulse 0.7s ease-in-out infinite;
  }
  @keyframes mTxStopPulse {
    0%, 100% { background: #dc2626; color: #fdfcf3; }
    50%      { background: #fdfcf3; color: #dc2626; }
  }
  /* Loop — yellow for section, orange for song. Inactive stays cream. */
  .m-transport #m-tx-loop.active {
    background: #fbbf24;
    color: #1a1a1a;
  }
  .m-transport #m-tx-loop.loop-song {
    background: #f97316;
    color: #1a1a1a;
  }
  /* PITCHED cycle — indigo when on */
  .m-transport #m-tx-cycle.active {
    background: #4f46e5;
    color: #fdfcf3;
  }
  /* Edit — neutral cream like the off state */
  .m-transport #m-tx-edit {
    font-size: 15px;
  }
  .m-transport .m-tx-btn[hidden] { display: none !important; }

  /* ─── Desktop unified transport bar ───────────────────────────
     Lives in the top toolbar where ▶ AI / ⏹ / ↩ Edit used to sit.
     Same brutalist DNA as .m-transport but scaled for the desktop
     header strip: shorter height, tighter padding. Hidden on mobile
     (m-transport takes over there).
  ─────────────────────────────────────────────────────────────── */
  .d-transport {
    display: inline-flex;
    gap: 0;
    align-items: stretch;
    /* Match the SOUND panel's total outer height (border-box, so
       46px includes the cell's 2px borders on each side). */
    height: 46px;
  }
  .d-transport .d-tx-btn {
    min-width: 0;
    height: 100%;
    padding: 0 12px;
    background: #fdfcf3;
    border: 2px solid #1a1a1a;
    border-radius: 0;
    font-size: 14px;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 800;
    color: #1a1a1a;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.1s, color 0.1s;
    font-variant-emoji: text;
  }
  .d-transport #d-tx-cycle { min-width: 36px; }
  .d-transport #d-tx-loop  { min-width: 40px; }
  .d-transport #d-tx-play  { min-width: 64px; padding: 0 16px; }
  .d-transport #d-tx-stop  { min-width: 40px; }
  .d-transport #d-tx-edit  { min-width: 40px; }
  .d-transport .d-tx-ico {
    width: 16px;
    height: 16px;
    display: block;
    pointer-events: none;
  }
  .d-transport .d-tx-play .d-tx-ico { width: 18px; height: 18px; }
  .d-transport .d-tx-play .d-tx-ico-pause { display: none; }
  .d-transport .d-tx-play.active .d-tx-ico-play  { display: none; }
  .d-transport .d-tx-play.active .d-tx-ico-pause { display: block; }
  .d-transport .d-tx-btn + .d-tx-btn { border-left: 0; }
  .d-transport .d-tx-btn:hover { background: #f5ecd0; }
  .d-transport .d-tx-btn:active { background: #1a1a1a; color: #fdfcf3; }
  .d-transport .d-tx-btn.active { background: #1a1a1a; color: #fdfcf3; }
  .d-transport .d-tx-play {
    background: #059669;
    color: #fdfcf3;
    border-color: #1a1a1a;
  }
  .d-transport .d-tx-play:hover { background: #047857; }
  .d-transport .d-tx-play.active {
    background: #22c55e;
    color: #1a1a1a;
    border-color: #1a1a1a;
  }
  .d-transport .d-tx-stop {
    background: #dc2626;
    color: #fdfcf3;
  }
  .d-transport .d-tx-stop:hover { background: #b91c1c; }
  .d-transport .d-tx-stop.armed {
    animation: dTxStopPulse 0.7s ease-in-out infinite;
  }
  @keyframes dTxStopPulse {
    0%, 100% { background: #dc2626; color: #fdfcf3; }
    50%      { background: #fdfcf3; color: #dc2626; }
  }
  .d-transport #d-tx-loop.active {
    background: #fbbf24;
    color: #1a1a1a;
  }
  .d-transport #d-tx-loop.loop-song {
    background: #f97316;
    color: #1a1a1a;
  }
  .d-transport #d-tx-cycle.active {
    background: #4f46e5;
    color: #fdfcf3;
  }
  /* Loop badge — bar count (or "S") in the corner, mirrors loop-toggle */
  .d-transport #d-tx-loop::after {
    content: attr(data-section);
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 8px;
    font-weight: 800;
    line-height: 1;
    pointer-events: none;
  }
  .d-transport #d-tx-loop:not([data-section]):after,
  .d-transport #d-tx-loop[data-section=""]:after { content: none; }
  /* Stop / edit toggle via [hidden] — but keep their slot in the
     layout so the toolbar width never reflows when play is pressed.
     visibility:hidden preserves the box; display:none would shift the
     whole header. */
  .d-transport .d-tx-btn[hidden] {
    display: flex !important;
    visibility: hidden;
    pointer-events: none;
  }
  /* The original top auto-play / auto-stop / auto-edit buttons are now
     just hidden proxy targets — d-transport drives all visuals. JS still
     reads / clicks them, but they should never paint. */
  #auto-play, #auto-stop, #auto-edit { display: none !important; }
  /* Mobile: the m-transport bar in the chord panel owns transport.
     Hide the desktop bar entirely to avoid duplicates. */
  @media (max-width: 800px) {
    .d-transport { display: none !important; }
  }

  @media (max-width: 800px) {
    /* Phone-sized: hide the duplicated top buttons. The keypad's
       own play / clear / backspace already drive compose; the
       new transport bar takes over once play mode kicks in. */
    #auto-play,
    #auto-stop,
    #auto-edit { display: none !important; }
    /* Hide the loop button at the end of the tabs row — it now
       lives in the transport bar. */
    body.player-active .rb-loop { display: none !important; }
    /* Show the transport bar only when the player is active on
       a vertical mobile viewport (not in landscape). */
    body.player-active:not(.lp-on) .m-transport { display: flex; }
  }
  body:not(.player-active) .subdiv-bar:not(.playback-bar) {
    height: 18px;
    bottom: 12px;  /* leave room below for the count badge (hangs at -9px) */
  }
  body:not(.player-active) .subdiv-bar:not(.playback-bar) .subdiv-seg {
    min-width: 14px;
    border-radius: 3px;
  }
  /* Mobile: drop the segment min-width so 7/8 subdivisions don't overflow
     the narrower cells. Hit target stays generous thanks to bar height. */
  @media (max-width: 800px) {
    body:not(.player-active) .real-book.compose-interleaved .subdiv-bar:not(.playback-bar) .subdiv-seg {
      min-width: 0;
    }
  }
  .subdiv-seg {
    flex: 1;
    background: var(--accent);
    border-radius: 2px;
    opacity: 0.75;
    cursor: pointer;
    min-width: 8px;              /* hit target floor even at 8 subdivisions */
  }
  .subdiv-seg.muted {
    background: transparent;
    border: 1px dashed rgba(0,0,0,0.3);
    opacity: 0.5;
  }
  /* Playback bar — non-interactive indicator. Only HERE do we transition
     and pulse, so the compose preview stays totally static. */
  /* While dragging the subdivision badge, lock the page so the browser
     can't scroll/zoom in either direction. */
  body.dragging-subdiv { touch-action: none !important; overscroll-behavior: contain; user-select: none; }
  body.dragging-subdiv * { user-select: none; }
  .subdiv-bar.playback-bar { pointer-events: none; }
  /* Piano mode: the staff itself now draws the rhythm (noteheads + stems +
     rests), so the segment bar is redundant. Keep the count badge though
     — it's still how you pick the subdivision number. */
  body.instrument-piano .subdiv-bar { display: none !important; }
  .subdiv-bar.playback-bar .subdiv-seg {
    cursor: default;
    opacity: 0.45;
    transition: opacity 0.1s, background 0.1s;
  }
  .subdiv-bar.playback-bar .subdiv-seg.muted { opacity: 0.25; }
  .subdiv-bar.playback-bar .subdiv-seg.pb-on {
    background: #f4c542;
    opacity: 1;
    box-shadow: 0 0 8px rgba(244,197,66,0.7), 0 0 2px rgba(244,197,66,1);
    animation: subdivPulse 0.18s ease-out;
  }
  @keyframes subdivPulse {
    0%   { transform: scaleY(1.6); }
    100% { transform: scaleY(1); }
  }
  /* Mobile playback: subdivision bar sits in the reserved bottom
     strip of the cell (padding-bottom on rb-tab-cell), so the chord
     diagram above is no longer crushed by an overlay. */
  @media (max-width: 800px) {
    body.player-active:not(.lp-on) .subdiv-bar.playback-bar {
      height: 14px;
      bottom: 3px;
      left: 3px;
      right: 3px;
    }
  }
  /* Landscape overlay: generous subdivision bars (cells are larger here) */
  #landscape-play .subdiv-bar.playback-bar {
    height: 18px;
    bottom: 4px;
  }
  #landscape-play .lp-tabs-area .rb-tab-cell {
    padding-bottom: 24px;
  }
  /* Popover laid out as a 2-column grid with "1" capped on top and "8"
     capped on bottom, both centered spanning the two columns:
            [ 1 ]
        [2]     [3]
        [4]     [5]
        [6]     [7]
            [ 8 ]
     Left column ascends 2/4/6 (even). Right column 3/5/7 (odd).
     "1" = no subdivision, "8" = densest power-of-two — caps the layout. */
  /* Flat dark popover — modern, compact, no skeuomorphism. */
  #subdiv-popover {
    position: fixed;
    display: none;
    grid-template-columns: 26px 26px;
    gap: 2px 4px;
    background: #1a1a1a;
    border: none;
    border-radius: 8px;
    padding: 4px 5px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.15);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  #subdiv-popover.open { display: grid; }
  /* Caps: 1 top, 8 bottom — both span the row, slightly wider */
  #subdiv-popover button[data-subdiv-pick="1"] {
    grid-row: 1; grid-column: 1 / -1;
    justify-self: stretch;
  }
  #subdiv-popover button[data-subdiv-pick="8"] {
    grid-row: 5; grid-column: 1 / -1;
    justify-self: stretch;
  }
  #subdiv-popover button[data-subdiv-pick="2"] { grid-row: 2; grid-column: 1; }
  #subdiv-popover button[data-subdiv-pick="4"] { grid-row: 3; grid-column: 1; }
  #subdiv-popover button[data-subdiv-pick="6"] { grid-row: 4; grid-column: 1; }
  #subdiv-popover button[data-subdiv-pick="3"] { grid-row: 2; grid-column: 2; }
  #subdiv-popover button[data-subdiv-pick="5"] { grid-row: 3; grid-column: 2; }
  #subdiv-popover button[data-subdiv-pick="7"] { grid-row: 4; grid-column: 2; }
  #subdiv-popover button {
    height: 22px;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
    transition: background 0.08s, color 0.08s;
  }
  #subdiv-popover button:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  #subdiv-popover button.selected {
    background: var(--accent);
    color: #1a1a1a;
  }
  .rb-cell.current {
    background: #fcecaa;
  }
  /* Imminent: the upcoming chord on mobile when the page is about to roll over */
  @keyframes cellImminent {
    0%, 100% { background: #faedc4; }
    50%      { background: #f5d98a; }
  }
  .rb-cell.imminent {
    animation: cellImminent 1s ease-in-out infinite;
    color: #6b4a0e;
    font-weight: 700;
  }
  .rb-roman {
    font-size: 11px;
    color: #5a5a64;
    font-style: italic;
    font-weight: 500;
    line-height: 1;
  }
  .rb-cell.current .rb-roman { color: #6b4a0e; }
  .rb-chord {
    font-size: 19px;
    color: #1a1a1a;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
  }
  .rb-continuation {
    font-size: 22px;
    color: #5a5a64;
    font-weight: 400;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: normal;
  }
  /* Silent rest cell — a faint dot indicating the slot exists but is silent. */
  .rb-rest {
    font-size: 28px;
    line-height: 1;
    color: #b8b3a0;
    opacity: 0.7;
  }
  .rb-peek {
    flex: 0 0 auto;
    padding: 0 14px;
    display: flex;
    align-items: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: #908d80;
    opacity: 0.6;
    border-left: 1.5px dashed #908d80;
    background: #faf8ec;
    white-space: nowrap;
    transition: opacity 0.25s, color 0.25s, background 0.25s;
  }
  @keyframes peekImminent {
    0%, 100% { background: #faedc4; }
    50%      { background: #f5d98a; }
  }
  .rb-peek.imminent {
    opacity: 1;
    color: #6b4a0e;
    font-weight: 700;
    border-left-style: solid;
    border-left-color: #6b4a0e;
    animation: peekImminent 1s ease-in-out infinite;
  }
  .map-card.next-up {
    border-color: rgba(160,120,32,0.85) !important;
    background: #faedc4 !important;
    z-index: 18;
    animation: nextUpBlink var(--blink-duration, 1s) ease-in-out infinite;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    min-height: 0;
  }
  /* Grid (not flex) locks the two columns to exactly 48% / 52% regardless of
     inner content size — flex was letting the alt-row's min-content blow up
     the column even with min-width:0 + overflow:hidden in some browsers. */
  .bottom-bar {
    display: grid;
    grid-template-columns: 48% 52%;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
  }
  .bottom-bar .alternatives {
    min-width: 0;            /* grid items, same as flex, need this to let inner overflow scroll */
    box-sizing: border-box;
    overflow: hidden;        /* inner alt-row's overflow-x:auto handles the actual scrolling */
    border-top: none;
    border-right: 1px solid var(--line);
  }
  .bottom-bar .fb-wrap {
    min-width: 0;
    border-top: none;
    overflow: hidden;
  }

  /* ─── Chord Map ─── */
  .map-wrap {
    position: relative;
    overflow: auto;
    padding: 8px 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 18px;
  }
  .chord-map-host {
    width: 460px;
    height: 680px;
    flex-shrink: 0;
  }
  /* Desktop: the mobile map toggle + backdrop never show */
  #map-mobile-toggle, #map-mobile-backdrop { display: none; }
  .chord-map {
    position: relative;
    width: 540px;
    height: 800px;
    transform: scale(0.85);
    transform-origin: top left;
    /* Prevent iOS/Android long-press text selection on the whole map */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .map-arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* Sit BEHIND the cards so lines never cover chord content. */
    z-index: 1;
  }
  .map-card {
    position: absolute;
    width: 100px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 5px 6px;
    cursor: pointer;
    transition: opacity 0.22s ease, filter 0.22s ease, border-color 0.12s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    opacity: 0.95;
    z-index: 2;
    /* Block the browser's default touch gestures (scroll, pinch-zoom,
       double-tap zoom, text selection) on map cards so the long-press
       hold gesture stays clean on mobile. The gap between cards still
       scrolls / zooms normally for accessibility. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .map-card:hover { border-color: var(--line-2); opacity: 1; z-index: 3; }
  .map-card.hub {
    width: 130px;
    background: var(--panel-2);
    border: 1.5px solid var(--accent);
    padding: 10px 8px 10px;
    box-shadow: 0 4px 18px rgba(31,29,24,0.08);
    z-index: 4;
  }
  /* Function stripe + very light background tint — hub keeps its own
     full amber border as the tonal-center marker; all other cards
     (including popups) share the same color language. Tints are kept
     very faint so they add temperature without darkening the card. */
  .map-card:not(.hub).tag-tonic     { border-left: 4px solid var(--tag-tonic);    background: rgba(5,150,105,0.035); }
  .map-card.tag-predom              { border-left: 4px solid var(--tag-predom);   background: rgba(160,120,32,0.035); }
  .map-card.tag-dom                 { border-left: 4px solid var(--tag-dom);      background: rgba(220,38,38,0.030); }
  .map-card.tag-borrowed            { border-left: 4px solid var(--tag-borrowed); background: rgba(147,51,234,0.040); }
  .map-card.tag-secondary           { border-left: 4px solid #b45309;             background: rgba(180,83,9,0.040); }
  /* Popup cards get a more visible function tint so they're distinguishable
     from the clean neutral on-map connected cards they float beside. */
  .map-card.popup.tag-tonic     { background: rgba(5,150,105,0.055); }
  .map-card.popup.tag-predom    { background: rgba(160,120,32,0.055); }
  .map-card.popup.tag-dom       { background: rgba(220,38,38,0.050); }
  .map-card.popup.tag-borrowed  { background: rgba(147,51,234,0.055); }
  .map-card.popup.tag-secondary { background: rgba(180,83,9,0.055); }

  /* Satellite (non-diatonic): smaller and dimmer than diatonic chords */
  .map-card.satellite {
    width: 92px !important;
    padding: 4px 4px 5px;
    opacity: 0.82;
    background: var(--bg);
    border-style: dashed;
    z-index: 1;
  }
  .map-card.satellite .mc-top { gap: 4px; }
  .map-card.satellite .mc-roman { font-size: 13px; }
  .map-card.satellite .mc-name { font-size: 10.5px; }
  .map-card.satellite .mc-svg-wrap svg { width: 72px !important; }
  .map-card.satellite:hover { opacity: 1; }
  /* Cards connected to the focused chord get a soft amber glow */
  .map-card.related {
    box-shadow: 0 0 0 1.5px rgba(160,120,32,0.45), 0 0 14px rgba(212,160,23,0.22);
    border-color: rgba(160,120,32,0.55) !important;
    transition: box-shadow 0.35s ease, border-color 0.35s ease;
  }
  /* Stronger, slowly-pulsing glow when the focused chord is the tonic hub —
     makes the opening view feel alive without spaghetti arrows. */
  @keyframes hubRelatedPulse {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(160,120,32,0.45), 0 0 16px rgba(244,197,66,0.32); }
    50%      { box-shadow: 0 0 0 2px   rgba(160,120,32,0.6),  0 0 26px rgba(244,197,66,0.55); }
  }
  .map-card.related-from-hub {
    animation: hubRelatedPulse 2.6s ease-in-out infinite;
  }
  /* "In current progression" — quiet marker so progression chords are recognizable
     without competing with the playing/next-up highlights. */
  .map-card.in-progression::after {
    content: '';
    position: absolute;
    top: 5px;
    right: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tag-tonic);
    opacity: 0.82;
    pointer-events: none;
  }
  /* Don't show the dot when the card is already the live or upcoming chord */
  .map-card.playing.in-progression::after,
  .map-card.next-up.in-progression::after { display: none; }
  /* Cards NOT in the current progression get a subtle dim so the in-progression
     cards stand out without explicit decoration */
  body.player-active .map-card:not(.in-progression):not(.playing):not(.next-up) {
    opacity: 0.55;
  }
  /* In play mode: in-progression chords get a green border so they read as
     "this chord is in my song" above the dimmed non-progression cards. */
  body.player-active .map-card.in-progression:not(.playing):not(.next-up):not(.focused) {
    border-color: rgba(5,150,105,0.40) !important;
  }
  /* ── Compose-mode visual hierarchy ──
     When a non-hub chord is focused, idle cards step back (dim + desaturate)
     so the connected zone (focused + related + hover-target + popups) pops forward.
     Scoped to :not(.player-active) so it never interferes with playback highlights. */
  body:not(.player-active) #chord-map:has(.map-card.focused:not(.hub))
    .map-card:not(.focused):not(.related):not(.playing):not(.next-up):not(.popup):not(.hover-target) {
    opacity: 0.38;
    filter: saturate(0.55);
  }
  /* Connected on-map cards: full brightness, no function tint — clean and neutral.
     The border-left stripe still encodes harmonic role without washing the card. */
  body:not(.player-active) #chord-map:has(.map-card.focused:not(.hub)) .map-card.related:not(.popup) {
    opacity: 1 !important;
    filter: none !important;
    background: var(--panel) !important;
  }
  /* Hover-target card stays fully bright while its approach popups are showing */
  body:not(.player-active) #chord-map:has(.map-card.focused:not(.hub)) .map-card.hover-target {
    opacity: 1 !important;
    filter: none !important;
  }
  /* Diatonic: emphasize with subtle shadow + thicker border */
  .map-card.diatonic {
    box-shadow: 0 1px 4px rgba(31,29,24,0.07);
    border-width: 1.5px;
  }
  .map-card.focused {
    border-color: var(--tag-tonic);
    background: #e0f5eb !important;   /* !important: beats the :not(.popup) tint specificity */
    box-shadow: 0 6px 22px rgba(31,29,24,0.10), 0 0 0 2px rgba(5,150,105,0.30);
    z-index: 15;
    opacity: 1;
  }
  .mc-top { display: flex; gap: 6px; align-items: baseline; line-height: 1; }
  .mc-roman {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
  }
  .map-card.hub .mc-roman { font-size: 28px; }
  .mc-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .map-card.hub .mc-name { font-size: 17px; }
  .mc-tag {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .mc-tag.tonic     { color: var(--tag-tonic); }
  .mc-tag.predom    { color: var(--tag-predom); }
  .mc-tag.dom       { color: var(--tag-dom); }
  .mc-tag.borrowed  { color: var(--tag-borrowed); }
  .mc-tag.picardy   { color: var(--tag-picardy); }
  .mc-tag.secondary { color: #b45309; }
  .mc-svg-wrap { width: 100%; display: flex; justify-content: center; }
  .mc-svg-wrap svg { width: 78px; height: auto; }
  .map-card.hub .mc-svg-wrap svg { width: 108px; }
  .mc-cost {
    font-size: 9px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
  }
  .mc-cost strong { color: var(--accent); }

  /* ─── Alternatives ─── */
  .alternatives {
    padding: 8px 20px 10px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
  }
  .alt-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .alt-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .alt-title strong { color: var(--accent); }
  .alt-hint { font-size: 10px; color: var(--text-faint); }
  .alt-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .alt-card {
    flex: 0 0 auto;
    width: 100px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 5px 5px;
    cursor: pointer;
    transition: all 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .alt-card:hover { border-color: var(--line-2); }
  .alt-card.selected {
    border-color: var(--accent);
    background: #fff8e6;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  /* .playing = the voicing the AI player is sounding RIGHT NOW. Distinct
     from .selected (user choice) so both can coexist: AUTO card shows
     selected (auto-mode active) on the left, while the actual sounding
     voicing card gets the playing highlight in the middle of the row. */
  .alt-card.playing {
    border-color: #4a7a5a;
    box-shadow: inset 0 0 0 1px #4a7a5a, 0 0 0 2px rgba(74, 122, 90, 0.18);
  }
  .alt-card svg { width: 88px; height: 92px; }
  .alt-card .ac-label {
    font-size: 8px;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.2;
  }
  .alt-card .ac-notes {
    font-size: 8px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.3px;
  }
  /* Family separator: italic serif vertical label that visually LEANS into
     the cards on its right (the family it labels). Left margin separates
     from the previous group, NO right margin + a tinted border-right
     glues the label to its own group. */
  .alt-divider {
    flex: 0 0 auto;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 6px 6px 2px;
    margin: 0 0 0 12px;            /* big gap on the left, none on the right */
    border-right: 2px solid currentColor;  /* the colored bar glued to the right side */
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.8px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    opacity: 0.85;
  }

  /* ─── Fretboard ─── */
  .fb-wrap {
    padding: 6px 20px 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  svg.fretboard { width: 100%; height: 100%; display: block; max-height: 120px; }

  /* SVG arrow style */
  .arrow-path {
    fill: none;
    stroke: #b8b4a4;
    stroke-width: 1.5;
    opacity: 0.7;
  }
  .arrow-path.highlighted {
    stroke: var(--accent);
    stroke-width: 2.5;
    opacity: 1;
  }
  .arrow-path.sub {
    stroke-dasharray: 4 3;
  }
  .arrow-path.secondary {
    stroke: #b45309;
    opacity: 0.55;
    stroke-dasharray: 6 2;
  }
  .arrow-path.secondary.highlighted {
    stroke: #b45309;
    opacity: 1;
    stroke-width: 2.5;
  }
  .arrow-cost {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    fill: var(--text-faint);
  }
  .arrow-cost.highlighted {
    fill: var(--accent);
    font-weight: 700;
  }

  /* ════════════════════════════════════════════════════════════
     MOBILE — strip down to the essentials: chord neck + real book
     ════════════════════════════════════════════════════════════ */
  @media (max-width: 800px) {
    header {
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 6px 10px;
    }
    .brand { display: none; }                /* title takes room we don't have */
    .ctx-label { font-size: 9px; }

    /* Chord map — too dense for phones inline. Hidden by default, shown as
       a fullscreen overlay when the user taps the floating "🗺 Map" button. */
    .map-wrap { flex-direction: column; padding: 4px; gap: 8px; }
    .chord-map-host { display: none; }

    /* Toggle bar — thin row pinned to the very bottom of the viewport so it
       stays visible regardless of whether the dialer or the chord-map is up. */
    #map-mobile-toggle {
      display: block;
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 102;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
      background: #fdfcf3;
      border: none;
      border-top: 1.5px solid #1a1a1a;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    body.player-active #map-mobile-toggle { display: none; }
    body.map-overlay-open #map-mobile-toggle {
      background: #1a1a1a;
      color: #fdfcf3;
    }
    /* When map mode is on, the chord map REPLACES the keypad in the same
       bottom-pinned slot — but the action buttons (▼/▲/⌫/▶/×) hop to the
       right side of the map so the user can still cycle inversions, delete,
       play and clear without switching back to Keys mode. */
    body.map-overlay-open .compose-chord-btn { display: none; }
    body.map-overlay-open .compose-pad {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: fixed;
      right: 6px;
      bottom: calc(50px + env(safe-area-inset-bottom));
      top: auto; left: auto;
      width: 52px;
      max-height: 42vh;
      padding: 0;
      background: transparent;
      border-top: none;
      box-shadow: none;
      z-index: 101;
    }
    body.map-overlay-open .compose-pad .compose-btn {
      grid-row: auto !important;
      grid-column: auto !important;
      width: 100%;
      height: 44px;
      font-size: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    /* In the vertical right-column layout, ▲ should sit ABOVE ▼ so the
       arrow direction matches its action (up raises, down lowers). */
    body.map-overlay-open .compose-pad .compose-btn[data-act="inv-up"]   { order: -2; }
    body.map-overlay-open .compose-pad .compose-btn[data-act="inv-down"] { order: -1; }
    body.map-overlay-open .chord-map-host {
      display: block;       /* not flex — flex centering breaks when child overflows */
      position: fixed;
      left: 0; right: 0;
      bottom: calc(44px + env(safe-area-inset-bottom));
      z-index: 100;
      width: 100vw;
      height: 260px;
      max-height: 42vh;
      background: var(--panel-2);
      border-top: 1.5px solid #1a1a1a;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      padding: 8px 10px;
    }
    body.map-overlay-open .chord-map {
      /* Pin to a JS-driven center offset and translate the WIDE box left by
         half its own width before scaling. The action-buttons column on the
         right eats real estate, so the center has to shift LEFT of the true
         viewport center — otherwise the map's left side hugs empty space
         while its right side bumps into the buttons. JS sets --map-cx based
         on actual available width per device. */
      position: absolute;
      top: 8px;
      left: var(--map-cx, 50%);
      transform: translateX(-50%) scale(var(--map-scale, 0.6));
      transform-origin: top center;
      width: 540px;
      height: 800px;
    }
    /* Backdrop unused in this layout — map sits in the keypad slot, not over content */
    #map-mobile-backdrop { display: none !important; }
    body.map-overlay-open #map-mobile-toggle {
      background: #1a1a1a;
      color: #fdfcf3;
    }

    /* Side panel becomes full-width with just the chord neck */
    .map-side-panel { width: 100% !important; gap: 8px; }
    .scale-neck { height: 200px; }            /* shorter than desktop */
    /* Drop the scale neck (second one) — keep only the chord neck */
    .neck-block:nth-of-type(2) { display: none; }
    .neck-label { font-size: 11px; padding-left: 2px; }

    /* Bottom area — drop the alternatives + main fretboard, real estate is gone */
    .bottom-bar .alternatives,
    .bottom-bar .fb-wrap { display: none; }
    .bottom-bar { display: none; }

    /* Real Book strip — span the full viewport width on mobile (desktop pins
       it to the right half; on a phone that squeezes the chord cells off-screen). */
    .rb-area { padding: 6px; justify-content: stretch; gap: 0; }
    .rb-stack { width: 100% !important; }
    /* On mobile the card lives back in the header song-block (its
       original home). If for any reason a stale node lingers in the
       desktop containers, hide it there — the song-block copy is the
       canonical one on phones. */
    .rb-area #player-info,
    .map-wrap > #player-info { display: none !important; }
    .real-book { height: 56px; }
    .rb-cycle { height: 56px; }
    .real-book-tabs { height: 85px; }
    .rb-loop { height: 85px; }   /* mobile: match the (shorter) tabs row */
    /* On mobile during play, hide both side buttons attached to the
       staff rows — cycle (row 1) AND loop (row 2). The m-transport
       bar at the bottom of the chord panel already has both, so
       they're redundant chrome here. Also hide the piano-mode
       .right-btn-stack container that wraps them in a 30px sidebar
       — otherwise the 30px column still steals horizontal space
       even with its children invisible. */
    body.player-active .rb-cycle,
    body.player-active .rb-loop,
    body.player-active .right-btn-stack { display: none !important; }
    /* Mobile portrait play mode. The strip carries an explicit height
       computed from the cells' expected width — this avoids the
       aspect-ratio/align-items:stretch conflict that was collapsing
       the cells to zero height (SVG invisible, "rendered behind the
       background").

       Strip width  = viewport − 12px (rb-area padding) − 3px (strip border)
                    = 100vw − 15px
       Cell width   = strip width / 4 = (100vw − 15px) / 4
       Strip height = cell width × SVG aspect ratio
         • guitar (1:1):   strip height = (100vw − 15px) / 4
         • piano  (130:148): strip height = (100vw − 15px) / 4 × 148 / 130

       Cells keep their default `flex: 1 1 0` (from line 1771) and
       stretch vertically to fill the strip — so cell aspect == strip
       aspect == SVG viewBox aspect. The chord-diagram SVG fills cleanly
       (no letterbox); the piano staff outer SVG with
       preserveAspectRatio="none" scales evenly in both axes (no
       vertical stretch). The desktop min-height clamp at line 1731
       isn't scoped to desktop, so we reset it. */
    body.player-active:not(.lp-on) .real-book-tabs {
      height: calc((100vw - 15px) / 4);
      min-height: 0;
    }
    body.instrument-piano.player-active:not(.lp-on) .real-book-tabs {
      height: calc((100vw - 15px) / 4 * 148 / 130);
    }
    body.player-active:not(.lp-on) .rb-loop { height: 150px; }
    /* Chord cells: more breathing room, bigger chord names — they ARE the content */
    .rb-cell { padding: 4px 2px; }
    .rb-cell .rb-roman { font-size: 11px; }
    .rb-cell .rb-chord { font-size: 19px; }
    /* Drop the peek entirely on mobile — the 4 cells already show what's coming,
       and when the current chord enters its imminent state the page rolls over.
       No need to waste space on a separate next-chord readout. */
    .rb-peek { display: none; }

    /* Sound block — let it wrap and use compact sizing */
    .ctx-block { flex-shrink: 0; min-width: 0; }
    .ctx-block > div { flex-wrap: wrap; gap: 4px !important; }
    .auto-btn { font-size: 10px !important; padding: 3px 5px !important; }
    .bpm-compact { padding: 2px 6px; }
    .bpm-val { font-size: 11px; }

    /* Song / player-info on phones: own bar below the rest of the header
       so it never competes for space with Key / Tonality / Chords / Sound. */
    .song-block {
      flex: 1 0 100% !important;
      min-width: 0 !important;
      order: 99;                     /* force to the bottom of the header flex */
      width: 100%;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }
    .song-block .ctx-label { display: none; }   /* label not needed in standalone bar */
    .song-block > div:last-child { width: 100%; gap: 6px !important; }
    #player-info {
      gap: 8px;
      padding: 3px 4px;
      font-size: 11px;
      flex: 1;
    }
    #player-info .pi-div,
    #player-info .pi-key,
    #player-info .pi-step,
    #player-info .pi-iter { display: none; }
    #player-info .pi-prog { font-size: 13px; }
    #player-info .pi-form-seg { min-width: 10px; }
    #player-info .pi-beats { gap: 4px; }
    #player-info .pi-beat  { width: 11px; font-size: 11px; }

    /* Mixer / sound dropdowns — wider tap targets */
    .sound-menu-item { padding: 8px 12px; font-size: 13px; }
    .mixer-row { grid-template-columns: 60px 1fr 32px; }
  }

  /* ──────────────────────────────────────────────────────────
     LANDSCAPE PLAY OVERLAY
     Hidden by default. The overlay is *only* shown when the
     body has BOTH `player-active` AND `lp-on` — the latter is
     set by a matchMedia listener for landscape orientation on
     touch devices. Plain landscape (desktop) is ignored.
  ────────────────────────────────────────────────────────── */
  #landscape-play {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #f6efde;
    color: #1a1a1a;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }
  body.player-active.lp-on #landscape-play { display: flex; }
  body.player-active.lp-on > main { visibility: hidden; }
  body.player-active.lp-on { overflow: hidden; touch-action: none; }

  #landscape-play .lp-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 14px 4px;
    border-bottom: 1px solid #d8cfb5;
  }
  #landscape-play .lp-now { display: flex; align-items: baseline; gap: 10px; }
  #landscape-play .lp-now-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: clamp(22px, 5.5vh, 38px);
    line-height: 1;
  }
  #landscape-play .lp-now-roman {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: clamp(14px, 3vh, 22px);
    color: #6b6b6b;
  }
  #landscape-play .lp-next {
    display: flex; align-items: baseline; gap: 8px;
    opacity: 0.75;
  }
  #landscape-play .lp-next-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #6b6b6b;
  }
  #landscape-play .lp-next-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(16px, 3.5vh, 24px);
  }
  #landscape-play .lp-body {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
    padding: 8px 10px;
  }
  /* Guitar mode: fretboard right, tabs/progression left.
     Piano mode (set via body.instrument-piano): staff stacked
     ABOVE the keyboard, both full-width. */
  #landscape-play .lp-pane {
    background: #fff8e7;
    border: 1px solid #d8cfb5;
    border-radius: 8px;
    overflow: auto;
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  #landscape-play .lp-left  { flex: 1 1 0; }
  #landscape-play .lp-right { flex: 1.4 1 0; }
  /* Reparented live SVGs need to fill the pane (their default CSS
     sizes them for the main layout). The staff SVG built per-update
     just needs to scale via preserveAspectRatio. */
  #landscape-play #chord-neck,
  #landscape-play #chord-piano {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }
  #landscape-play .lp-pane > svg:not([id]) {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Guitar landscape (mirrors piano layout, brutalist style) ──
     Top: tabs strip clone in a 4-col grid. Bottom row: realistic
     guitar neck (left) + embedded controls strip (right). Header
     + progression strip are hidden — the tabs cells already show
     chord names and the highlighted current cell. */
  body:not(.instrument-piano) #landscape-play .lp-header,
  body:not(.instrument-piano) #landscape-play .lp-prog { display: none; }
  body:not(.instrument-piano) #landscape-play .lp-body {
    flex-direction: column;
    padding: 6px;
    gap: 6px;
  }
  #landscape-play .lp-guitar-layout {
    display: grid !important;
    grid-template-rows: 1fr 150px;          /* tabs / bottom row */
    width: 100%;
    height: 100%;
    gap: 6px;
  }
  #landscape-play .lp-tabs-area {
    background: #fdfcf3;
    border: 2px solid #1a1a1a;
    overflow: hidden;
    min-height: 0;
  }
  #landscape-play .lp-bottom-row {
    display: grid;
    grid-template-columns: 1fr 200px;       /* neck (fills) + controls (a bit roomier) */
    gap: 6px;
    min-height: 0;
  }
  #landscape-play .lp-guitar-area {
    /* No frame — the realistic neck has its own woodgrain edges; the
       enclosing border made it feel "boxed in". */
    background: transparent;
    border: 0;
    overflow: hidden;
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  /* Force the reparented neck SVG to fill its cell completely so the
     box border hugs the realistic guitar with no dead space inside. */
  #landscape-play .lp-guitar-area > #chord-neck {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
  }
  /* Cloned tabs strip in lp-tabs-area: 4-col grid filling the area. */
  #landscape-play .lp-tabs-area .real-book-tabs {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    background: transparent !important;
  }
  #landscape-play .lp-tabs-area .rb-tab-cell {
    border-right: 1px solid #d8cfb5;
    border-bottom: 1px solid #d8cfb5;
    min-width: 0;
    min-height: 0;
  }
  #landscape-play .lp-tabs-area .rb-tab-cell:nth-child(4n) { border-right: none; }
  #landscape-play .lp-tabs-area .rb-tab-cell:nth-last-child(-n+4) { border-bottom: none; }
  /* Piano-mode staff row: 4 chord cells side-by-side, current one
     highlighted. Mirrors the compose strip but at landscape scale. */
  #landscape-play .lp-staff-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    width: 100%;
    height: 100%;
    padding: 4px;
    box-sizing: border-box;
  }
  #landscape-play .lp-staff-cell {
    background: #fdfcf3;
    border: 1px solid #d8cfb5;
    border-radius: 6px;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }
  #landscape-play .lp-staff-cell svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #landscape-play .lp-staff-cell.current {
    background: #fcecaa;
    border-color: #c9a747;
    box-shadow: 0 0 0 1px #c9a747 inset;
  }
  /* Tabs clone inside the landscape overlay: re-arrange the 16 cells
     into a 4×4 grid (mirroring compose mode) so each cell is large
     enough to read. The cloned `.real-book-tabs` ships as a single
     horizontal flex row — overriding it here keeps the source markup
     untouched while making it useful at landscape scale. */
  #landscape-play .lp-right > * {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
  }
  #landscape-play .lp-right .real-book-tabs {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    height: 100% !important;
    overflow: hidden;
  }
  #landscape-play .lp-right .rb-tab-cell {
    border-bottom: 1.5px solid #1a1a1a;
    min-width: 0;
    min-height: 0;
  }
  #landscape-play .lp-right .rb-tab-cell:nth-child(4n) {
    border-right: none;
  }
  #landscape-play .lp-right .rb-tab-cell:nth-last-child(-n+4) {
    border-bottom: none;
  }
  /* Piano landscape — totally different layout from guitar.
     Top (~75%): the live #real-book-tabs strip, identical to the
     vertical play view. Bottom: piano keys (left) and the floating
     controls (right, absolute-positioned via .lp-controls).
     Header + bottom progression strip are hidden — the staff cells
     already carry chord names and the highlighted "current" cell. */
  body.instrument-piano #landscape-play .lp-header,
  body.instrument-piano #landscape-play .lp-prog { display: none; }
  body.instrument-piano #landscape-play .lp-body {
    flex-direction: column;
    padding: 6px;
    gap: 6px;
  }
  #landscape-play .lp-piano-layout {
    display: grid !important;
    grid-template-rows: 1fr 120px;          /* staff / bottom row */
    width: 100%;
    height: 100%;
    gap: 6px;
  }
  /* Open frame — side bars only (top/bottom open), like measure
     barlines bookending the strip. */
  #landscape-play .lp-staff-area {
    background: transparent;
    border: 0;
    border-left:  2px solid #1a1a1a;
    border-right: 2px solid #1a1a1a;
    border-radius: 0;
    overflow: hidden;
    min-height: 0;
  }
  #landscape-play .lp-piano-area {
    background: #fdfcf3;
    border: 2px solid #1a1a1a;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    min-width: 0;
  }
  /* Reparented #real-book-tabs in piano landscape: rearrange the
     16 cells into a 4-column grid so each bar is large and readable.
     Matches the spirit of vertical compose-interleaved mode. */
  #landscape-play .lp-staff-area > #real-book-tabs {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    background: transparent !important;
  }
  #landscape-play .lp-staff-area .rb-tab-cell {
    border-right: 1px solid #d8cfb5;
    border-bottom: 1px solid #d8cfb5;
    min-width: 0;
    min-height: 0;
  }
  #landscape-play .lp-staff-area .rb-tab-cell:nth-child(4n) { border-right: none; }
  #landscape-play .lp-staff-area .rb-tab-cell:nth-last-child(-n+4) { border-bottom: none; }

  #landscape-play .lp-prog {
    display: flex;
    gap: 4px;
    padding: 4px 10px 8px;
    overflow-x: auto;
    border-top: 1px solid #d8cfb5;
  }
  #landscape-play .lp-cell {
    flex: 0 0 auto;
    padding: 4px 10px;
    border-radius: 6px;
    background: #f0e6c8;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(12px, 2.6vh, 18px);
    color: #4a3f2a;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  #landscape-play .lp-cell.playing {
    background: #fcecaa;
    border-color: #c9a747;
    color: #1a1a1a;
  }
  #landscape-play .lp-cell.next-up {
    border-color: #6b6b6b;
  }

  /* ── Brutalist controls ──
     Hard black borders, no radius, no shadows, no blur. Buttons
     read as physical switches stamped into the panel. When the
     layout provides a #lp-controls-slot the strip is embedded
     inline; otherwise it falls back to the bottom-right corner
     (guitar mode). */
  #landscape-play .lp-controls {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    z-index: 2;
  }
  /* Stacked row layout: cycle, loop full-width; play + stop share
     the bottom row side-by-side. When stop is hidden, play spans
     the full row. */
  /* Row 1: chord-info window spans full width.
     Row 2: pitch shift (left) + loop (right).
     Row 3: play (left) + stop (right). */
  #landscape-play #lp-info  { grid-row: 1; grid-column: 1 / span 2; }
  #landscape-play #lp-cycle { grid-row: 2; grid-column: 1; }
  #landscape-play #lp-loop  { grid-row: 2; grid-column: 2; }
  #landscape-play #lp-play  { grid-row: 3; grid-column: 1; }
  #landscape-play #lp-stop  { grid-row: 3; grid-column: 2; }
  /* Divider between cycle and loop (mirror the play/stop divider) */
  #landscape-play #lp-loop {
    border-top: 0 !important;
    border-left: 2px solid #1a1a1a;
  }
  #landscape-play .lp-info {
    background: #f0e6c8;
    border: 0;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    gap: 2px;
  }
  #landscape-play .lp-info-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-style: italic;
    font-size: 18px;
    color: #064e3b;
    line-height: 1;
    white-space: nowrap;
  }
  #landscape-play .lp-info-sub {
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: #4b5563;
    line-height: 1.2;
    white-space: nowrap;
    text-transform: uppercase;
  }
  #landscape-play .lp-controls:not(:has(#lp-stop:not([hidden]))) #lp-play {
    grid-column: 1 / span 2;
  }
  /* Stop sits beside play (same row, different column), so the
     generic `.lp-btn + .lp-btn { border-top }` divider doesn't apply
     here — replace it with a vertical divider on the left. */
  #landscape-play #lp-stop {
    border-top: 0 !important;
    border-left: 2px solid #1a1a1a;
  }
  /* Guitar fallback: still floating in the corner, brutalist look. */
  #landscape-play > .lp-controls {
    position: absolute;
    right: max(8px, env(safe-area-inset-right));
    bottom: max(8px, env(safe-area-inset-bottom));
    grid-template-rows: none;
    grid-auto-flow: column;
    height: 44px;
  }
  /* Embedded controls strip — full-width brutalist bar at the
     bottom of the layout. Buttons distribute horizontally with
     hard black dividers between them. */
  #landscape-play .lp-controls-slot {
    border: 2px solid #1a1a1a;
    background: #fdfcf3;
    overflow: hidden;
    display: flex;
  }
  #landscape-play .lp-controls-slot .lp-controls {
    width: 100%;
    height: 100%;
  }
  #landscape-play .lp-controls-strip .lp-controls {
    grid-template-rows: none;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
  }
  #landscape-play .lp-controls-strip .lp-btn + .lp-btn {
    border-top: 0;
    border-left: 2px solid #1a1a1a;
  }
  #landscape-play .lp-btn {
    border: 0;
    border-radius: 0;
    background: #fdfcf3;
    color: #1a1a1a;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 800;
    font-size: 18px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    margin: 0;
    -webkit-tap-highlight-color: transparent;
  }
  /* Hard black dividers between stacked buttons. */
  #landscape-play .lp-controls-slot .lp-btn + .lp-btn {
    border-top: 2px solid #1a1a1a;
  }
  /* Floating (guitar) variant: thick outer border + horizontal
     dividers between buttons. */
  #landscape-play > .lp-controls .lp-btn {
    border: 2px solid #1a1a1a;
    width: 44px;
  }
  #landscape-play > .lp-controls .lp-btn + .lp-btn { border-left: 0; }

  #landscape-play .lp-btn:active { background: #1a1a1a; color: #fdfcf3; }
  #landscape-play .lp-btn.active { background: #1a1a1a; color: #fdfcf3; }
  /* Loop button: yellow when section-looping, orange when song-looping.
     Same palette as the mobile transport for visual continuity. */
  #landscape-play #lp-loop.active {
    background: #fbbf24;
    color: #1a1a1a;
    border-color: #1a1a1a;
  }
  #landscape-play #lp-loop.loop-song {
    background: #f97316;
    color: #1a1a1a;
  }
  /* Badge over the landscape loop button (bar count when section,
     "S" when song). Mirrors the toolbar / mobile transport badges. */
  #landscape-play #lp-loop {
    position: relative;
  }
  #landscape-play #lp-loop.loop-song::after,
  #landscape-play #lp-loop.active:not(.loop-song)::after {
    position: absolute;
    top: 2px;
    right: 4px;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 10px;
    font-weight: 800;
    color: #1a1a1a;
    pointer-events: none;
  }
  #landscape-play #lp-loop.loop-song::after { content: 'S'; }
  #landscape-play #lp-loop.active:not(.loop-song)::after { content: attr(data-section); }
  #landscape-play .lp-btn-play {
    background: #059669;
    color: #fdfcf3;
  }
  #landscape-play .lp-btn-play.active {
    background: #22c55e;          /* bright green when playing */
    color: #1a1a1a;
  }
  #landscape-play .lp-btn-play.paused {
    background: #059669;
    color: #fdfcf3;
  }
  /* SVG icons in landscape: same setup as mobile — currentColor so the
     icon flips when the button inverts. */
  #landscape-play .lp-ico { width: 28px; height: 28px; display: block; pointer-events: none; }
  #landscape-play .lp-btn-play .lp-ico-pause { display: none; }
  #landscape-play .lp-btn-play.active .lp-ico-play  { display: none; }
  #landscape-play .lp-btn-play.active .lp-ico-pause { display: block; }
  #landscape-play .lp-btn-stop {
    background: #dc2626;
    color: #fdfcf3;
  }
  /* When armed (waiting for confirm-tap to clear) the stop button
     pulses so the user knows the next tap wipes everything. */
  #landscape-play .lp-btn-stop.armed {
    animation: lpStopArmedPulse 0.7s ease-in-out infinite;
  }
  @keyframes lpStopArmedPulse {
    0%, 100% { background: #dc2626; }
    50%      { background: #fdfcf3; color: #dc2626; }
  }
  #landscape-play .lp-btn-stop[hidden] { display: none !important; }

  /* ──────────────────────────────────────────────────────────
     LANDSCAPE STANDBY — big remote-control menu shown in
     landscape when the player is NOT active. Same trigger
     (lp-on) but opposite gate (no player-active).
  ────────────────────────────────────────────────────────── */
  #landscape-standby {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: #1a1a1a;
    color: #fdfcf3;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
  }
  body.lp-on:not(.player-active) #landscape-standby { display: flex; }
  body.lp-on:not(.player-active) > main { visibility: hidden; }
  body.lp-on:not(.player-active) > header { visibility: hidden; }

  #landscape-standby .ls-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto;
    gap: 12px 20px;
    align-items: center;
    justify-items: center;
    width: min(90vw, 600px);
  }

  /* ── Big play button — spans full center column, both rows ── */
  #landscape-standby .ls-play {
    grid-column: 2;
    grid-row: 1 / 3;
    width: clamp(100px, 22vh, 160px);
    height: clamp(100px, 22vh, 160px);
    border-radius: 50%;
    border: 3px solid #fdfcf3;
    background: transparent;
    color: #fdfcf3;
    font-size: clamp(36px, 8vh, 64px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    line-height: 1;
    padding-left: 8px; /* optical center for ▶ */
  }
  #landscape-standby .ls-play:active {
    background: #fdfcf3;
    color: #1a1a1a;
    transform: scale(0.95);
  }

  /* ── Side buttons — brutalist rectangles ── */
  #landscape-standby .ls-btn {
    border: 2px solid #fdfcf3;
    background: transparent;
    color: #fdfcf3;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 3vh, 22px);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 18px;
    min-width: clamp(80px, 18vw, 140px);
    cursor: pointer;
    text-align: center;
    transition: background 0.12s;
  }
  #landscape-standby .ls-btn:active {
    background: #fdfcf3;
    color: #1a1a1a;
  }
  #landscape-standby .ls-btn.ls-active {
    background: #fdfcf3;
    color: #1a1a1a;
  }
  #landscape-standby .ls-btn.ls-loop-on {
    background: #d4a017;
    border-color: #d4a017;
    color: #1a1a1a;
    box-shadow: 0 0 12px #f4c54266;
  }

  /* ── Key + tonality (top-left) ── */
  #landscape-standby .ls-key-group {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #landscape-standby .ls-key {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: clamp(40px, 10vh, 72px);
    line-height: 1;
    cursor: pointer;
    user-select: none;
    min-width: 1.2em;
    text-align: center;
  }
  #landscape-standby .ls-tonality {
    font-size: clamp(12px, 2.5vh, 18px);
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
  }

  /* ── BPM (bottom-left) ── */
  #landscape-standby .ls-bpm {
    grid-column: 1;
    grid-row: 2;
    font-variant-numeric: tabular-nums;
  }
  #landscape-standby .ls-bpm-val {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: clamp(28px, 7vh, 48px);
    line-height: 1;
    cursor: ns-resize;
    user-select: none;
    touch-action: none;
  }
  #landscape-standby .ls-bpm-label {
    font-size: clamp(10px, 2vh, 14px);
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 2px;
  }

  /* ── Right column: loop + cycle (stacked) ── */
  #landscape-standby .ls-right-col {
    grid-column: 3;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
</style>
</head>
<body class="keypad-open">

<header>
  <div class="brand">Guitarra</div>

  <div class="ctx-block">
    <div class="ctx-row" id="key-row"></div>
  </div>

  <div class="ctx-block">
    <div class="toggle" id="tonality-toggle">
      <button class="active" data-tonality="major">Major</button>
      <button data-tonality="minor">Minor</button>
    </div>
  </div>

  <div class="ctx-block">
    <div class="ctx-label">Chords</div>
    <button class="auto-btn" id="chord-scope" style="font-weight:600" title="filter which chords appear in the map and progressions">✦ All</button>
  </div>

  <!-- BPM sits in the top row inline with everything else — no label
       so it fits compactly. -->
  <div class="ctx-block">
    <div class="bpm-compact" id="bpm-compact" title="drag up/down or click to type BPM">
      <span class="bpm-val" id="bpm-val">120</span>
    </div>
  </div>

  <!-- ─── VISUAL + SOUND together, pegged LEFT (no spacer before).
       Spacer moves AFTER the strip so song-block still floats right. -->
  <div class="ctx-block">
    <div class="vs-snd-strip">
      <div class="vs-panel" id="visual-panel">
        <button class="vs-cell active" id="visual-guitar" data-inst="guitar" title="show guitar fretboard for chords">
          <svg class="vs-ico" viewBox="0 0 26 14" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <!-- Rosewood fretboard rect — invisible when inactive,
                 painted wood when the cell hits .active so the guitar
                 reads as the real fretboard the toggle activates. -->
            <rect class="gtr-board" x="0" y="1" width="26" height="12" fill="transparent"/>
            <line class="gtr-nut"    x1="0.8" y1="1" x2="0.8" y2="13" stroke="currentColor" stroke-width="1.6"/>
            <line class="gtr-fret"   x1="6"   y1="1" x2="6"   y2="13" stroke="currentColor" stroke-width="0.7"/>
            <line class="gtr-fret"   x1="12"  y1="1" x2="12"  y2="13" stroke="currentColor" stroke-width="0.7"/>
            <line class="gtr-fret"   x1="18"  y1="1" x2="18"  y2="13" stroke="currentColor" stroke-width="0.7"/>
            <line class="gtr-fret"   x1="24"  y1="1" x2="24"  y2="13" stroke="currentColor" stroke-width="0.7"/>
            <line class="gtr-string" x1="0" y1="3"   x2="26" y2="3"   stroke="currentColor" stroke-width="0.55"/>
            <line class="gtr-string" x1="0" y1="6"   x2="26" y2="6"   stroke="currentColor" stroke-width="0.55"/>
            <line class="gtr-string" x1="0" y1="8.5" x2="26" y2="8.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="gtr-string" x1="0" y1="11"  x2="26" y2="11"  stroke="currentColor" stroke-width="0.55"/>
            <circle class="gtr-marker" cx="15" cy="7" r="0.9" fill="currentColor" opacity="0.55"/>
          </svg>
        </button>
        <button class="vs-cell" id="visual-piano" data-inst="piano" title="show piano keyboard for chords">
          <svg class="vs-ico" viewBox="0 0 26 14" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <rect class="pno-white-fill" x="0.5" y="0.5" width="25" height="13" fill="none" stroke="currentColor" stroke-width="0.8"/>
            <line class="pno-white-line" x1="4"    y1="0.5" x2="4"    y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="pno-white-line" x1="7.7"  y1="0.5" x2="7.7"  y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="pno-white-line" x1="11"   y1="0.5" x2="11"   y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="pno-white-line" x1="14.6" y1="0.5" x2="14.6" y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="pno-white-line" x1="18.3" y1="0.5" x2="18.3" y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <line class="pno-white-line" x1="22"   y1="0.5" x2="22"   y2="13.5" stroke="currentColor" stroke-width="0.55"/>
            <rect class="pno-black" x="2.6"  y="0.5" width="2.8" height="7.8" fill="currentColor"/>
            <rect class="pno-black" x="6.3"  y="0.5" width="2.8" height="7.8" fill="currentColor"/>
            <rect class="pno-black" x="13.2" y="0.5" width="2.8" height="7.8" fill="currentColor"/>
            <rect class="pno-black" x="16.9" y="0.5" width="2.8" height="7.8" fill="currentColor"/>
            <rect class="pno-black" x="20.6" y="0.5" width="2.8" height="7.8" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="snd-panel" id="sound-panel">
        <button class="snd-cell snd-bass active" id="bass-toggle" title="mute/unmute bass">
          <span class="bass-glow">BASS</span>
        </button>
        <button class="snd-cell snd-keys" id="chord-sound" title="click to pick chord sound"><span class="keys-ico" aria-hidden="true"></span></button>
        <button class="snd-cell" id="voicing-pref" data-label="VOICE" title="click to pick voicing type"><span class="sc-val">ALL</span></button>
        <button class="snd-cell snd-rhythm" id="rhythm-btn" title="rhythm style"><span class="rhythm-ico" aria-hidden="true"></span></button>
        <button class="snd-cell snd-mix" id="mixer-btn" data-label="MIXER" title="open the volume mixer"><span class="sc-val">≡</span></button>
      </div>
      <!-- BPM moved up to the top bar alongside KEY / TONALITY /
           CHORDS so the VISUAL+SOUND strip has the full row width
           below it. -->
    </div>
  </div>

  <div class="spacer"></div>

  <div class="ctx-block song-block" style="flex:1;min-width:200px">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="keypad-toggle" id="keypad-toggle" title="show/hide compose keypad" aria-label="toggle keypad">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <rect x="3"  y="3"  width="5" height="5"/>
          <rect x="10" y="3"  width="5" height="5"/>
          <rect x="17" y="3"  width="4" height="5"/>
          <rect x="3"  y="10" width="5" height="5"/>
          <rect x="10" y="10" width="5" height="5"/>
          <rect x="17" y="10" width="4" height="5"/>
          <rect x="3"  y="17" width="5" height="4"/>
          <rect x="10" y="17" width="5" height="4"/>
          <rect x="17" y="17" width="4" height="4"/>
        </svg>
      </button>
      <button class="auto-btn" id="auto-play" hidden>▶ AI</button>
      <button class="auto-btn" id="auto-stop" title="Stop and reset to start" hidden>⏹</button>
      <button class="auto-btn" id="auto-edit" title="Exit & edit — stop, focus on current chord in compose" hidden>↩ Edit</button>
      <!-- Desktop unified transport bar — brutalist single row that
           replaces the old ▶ AI / ⏹ / ↩ Edit trio. Buttons proxy to
           the real (now hidden) controls so all logic stays in one
           place. Cycle + Loop are mirrored here too so transport
           lives in one strip. Hidden on mobile (m-transport owns
           that role there). -->
      <div class="d-transport" id="d-transport">
        <button class="d-tx-btn" id="d-tx-cycle" title="PITCHED">·</button>
        <button class="d-tx-btn" id="d-tx-loop" title="Loop">
          <svg viewBox="0 0 24 24" class="d-tx-ico" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l4 4-4 4"/><path d="M3 12.5v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 11.5v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="d-tx-btn d-tx-play" id="d-tx-play" title="Start">
          <svg viewBox="0 0 24 24" class="d-tx-ico d-tx-ico-play" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
          <svg viewBox="0 0 24 24" class="d-tx-ico d-tx-ico-pause" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="0.5"/><rect x="14" y="4" width="4" height="16" rx="0.5"/></svg>
        </button>
        <button class="d-tx-btn d-tx-stop" id="d-tx-stop" title="Stop / reset" hidden>
          <svg viewBox="0 0 24 24" class="d-tx-ico" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>
        </button>
        <button class="d-tx-btn" id="d-tx-edit" title="Edit current chord" hidden>
          <svg viewBox="0 0 24 24" class="d-tx-ico" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14.5 6.5l3 3"/></svg>
        </button>
      </div>
      <div class="midi-wrap" id="midi-wrap" style="display:none;position:relative">
        <button class="auto-btn midi-export-btn" id="midi-export" title="Export as MIDI file">⬇ MIDI</button>
        <div class="midi-menu" id="midi-menu" hidden></div>
      </div>
      <!-- #player-info moved out of the header — now lives in the
           rb-area to the LEFT of the 4-bar partitura. Frees the top
           bar from the cramped "now playing" readout and gives that
           data its own proper home next to the score. -->
    </div>
  </div>

</header>

<div class="sound-menu" id="sound-menu" hidden></div>
<div class="sound-menu" id="voicing-menu" hidden></div>
<div class="sound-menu" id="scope-menu" hidden></div>
<div class="sound-menu mixer-menu" id="mixer-menu" hidden></div>
<div id="subdiv-popover"></div>
<div class="sound-menu" id="rhythm-menu" hidden></div>

<!-- Compose keypad — number pad for typing a custom progression. Only visible
     when the AI isn't playing. On phone: phone-dialer grid pinned to the bottom. -->
<div class="compose-pad" id="compose-pad"></div>

<!-- Mobile: a thin pinned bar at the very bottom of the viewport that toggles
     between the keypad (default) and the chord-map overlay. Sits below both
     the compose-pad and the map-host so it's always visible. -->
<button id="map-mobile-toggle" type="button" title="toggle keypad / chord map">🗺 Map</button>
<div id="map-mobile-backdrop" hidden></div>

<div class="rb-area">
  <!-- Now-playing readout — lives here so it sits to the LEFT of the
       4-bar partitura instead of cramped in the top header. During
       play/pause it's visible; during compose mode it's hidden so the
       compose strip can stretch to full width as before. -->
  <div id="player-info"></div>
  <div class="rb-stack">
    <div class="rb-row">
      <div class="real-book" id="real-book" hidden></div>
      <button class="rb-cycle" id="cycle-toggle" title="no key cycle">·</button>
    </div>
    <div class="rb-row">
      <div class="real-book-tabs" id="real-book-tabs" hidden></div>
      <button class="rb-loop" id="loop-toggle" title="loop the current section" aria-label="repeat"><svg width="14" height="22" viewBox="0 0 20 30"><rect class="repeat-thick" x="3"  y="3" width="4" height="24"/><rect class="repeat-thin"  x="9"  y="3" width="1.4" height="24"/><circle class="repeat-dot" cx="15" cy="11" r="1.8"/><circle class="repeat-dot" cx="15" cy="19" r="1.8"/></svg></button>
    </div>
  </div>
</div>

<main>
  <div class="map-wrap">
    <div class="chord-map-host">
      <div class="chord-map" id="chord-map">
        <svg class="map-arrows" id="map-arrows"></svg>
      </div>
    </div>
    <div class="map-side-panel">
      <div class="neck-block">
        <div class="neck-label">chord</div>
        <svg class="scale-neck" id="chord-neck" preserveAspectRatio="xMidYMid meet"></svg>
        <svg class="piano-svg" id="chord-piano" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <!-- Mobile-only transport bar shown below the realistic guitar
           while in play mode. Replaces the duplicated top toolbar
           buttons + the loop button that lived at the end of the
           tabs strip. Buttons are proxies that .click() the real
           controls so all their logic / state stays in one place. -->
      <div class="m-transport" id="m-transport" hidden>
        <button class="m-tx-btn" id="m-tx-cycle" title="PITCHED">·</button>
        <button class="m-tx-btn" id="m-tx-loop" title="Loop">
          <svg viewBox="0 0 24 24" class="m-tx-ico" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l4 4-4 4"/><path d="M3 12.5v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 11.5v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="m-tx-btn m-tx-play" id="m-tx-play" title="Play / pause">
          <svg viewBox="0 0 24 24" class="m-tx-ico m-tx-ico-play" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
          <svg viewBox="0 0 24 24" class="m-tx-ico m-tx-ico-pause" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="0.5"/><rect x="14" y="4" width="4" height="16" rx="0.5"/></svg>
        </button>
        <button class="m-tx-btn m-tx-stop" id="m-tx-stop" title="Stop / reset" hidden>
          <svg viewBox="0 0 24 24" class="m-tx-ico" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>
        </button>
        <button class="m-tx-btn" id="m-tx-edit" title="Edit current chord" hidden>
          <svg viewBox="0 0 24 24" class="m-tx-ico" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14.5 6.5l3 3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="alternatives">
      <div class="alt-header">
        <div class="alt-title">Other voicings for <strong id="alt-chord-name">—</strong></div>
      </div>
      <div class="alt-row" id="alt-row"></div>
    </div>

    <div class="fb-wrap">
      <svg id="fretboard-svg" class="fretboard" viewBox="0 0 2500 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</main>

<!-- ─────────────────────────────────────────────────────────────
     LANDSCAPE PLAY VIEW (mobile only).
     Shown when: body.player-active AND landscape orientation AND
     coarse pointer (touch device). Auto-toggled by an orientation
     matchMedia listener that adds/removes body.lp-on. Content is
     re-rendered by renderLandscapePlay(), called from the player's
     _updateVisuals and a few entry points so it stays in sync.
─────────────────────────────────────────────────────────────── -->
<div id="landscape-play" aria-hidden="true">
  <div class="lp-header">
    <div class="lp-now">
      <div class="lp-now-name" id="lp-now-name">—</div>
      <div class="lp-now-roman" id="lp-now-roman"></div>
    </div>
    <div class="lp-next">
      <div class="lp-next-label">next</div>
      <div class="lp-next-name" id="lp-next-name">—</div>
    </div>
  </div>
  <div class="lp-body" id="lp-body">
    <div class="lp-pane lp-left"  id="lp-left"></div>
    <div class="lp-pane lp-right" id="lp-right"></div>
  </div>
  <div class="lp-prog" id="lp-prog"></div>
  <!-- Corner controls: play/pause, loop, key shift down/up. Each
       button proxies to the existing main-UI control by triggering
       a click (play/loop) or by mutating state.keyPc (key shift). -->
  <div class="lp-controls" id="lp-controls">
    <!-- Top row: chord info "window" mirroring the green player-info
         bar — shows the chord currently playing + its voicing, so
         the user gets the same context they'd have on the main UI. -->
    <div class="lp-info" id="lp-info">
      <div class="lp-info-name" id="lp-info-name">—</div>
      <div class="lp-info-sub"  id="lp-info-sub"></div>
    </div>
    <!-- Middle row: pitch shift (left) + loop (right) split. -->
    <button class="lp-btn" id="lp-cycle"    title="PITCHED — key shift per loop">·</button>
    <button class="lp-btn" id="lp-loop"     title="Loop section">
      <svg viewBox="0 0 24 24" class="lp-ico" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l4 4-4 4"/><path d="M3 12.5v-2a4 4 0 0 1 4-4h14"/><path d="M7 21.5l-4-4 4-4"/><path d="M21 11.5v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <!-- Bottom row: play (left) + stop (right). -->
    <button class="lp-btn lp-btn-play" id="lp-play" title="Play / pause">
      <svg viewBox="0 0 24 24" class="lp-ico lp-ico-play" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
      <svg viewBox="0 0 24 24" class="lp-ico lp-ico-pause" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="lp-btn lp-btn-stop" id="lp-stop" title="Stop and reset" hidden>
      <svg viewBox="0 0 24 24" class="lp-ico" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg>
    </button>
  </div>
</div>

<!-- ─────────────────────────────────────────────────────────────
     LANDSCAPE STANDBY — big remote-control menu.
     Shown when: body.lp-on AND NOT body.player-active.
     A simple launcher with oversized buttons so you can set up
     key/bpm/toggles and hit play without rotating back.
─────────────────────────────────────────────────────────────── -->
<div id="landscape-standby" aria-hidden="true">
  <div class="ls-grid">
    <!-- Left top: key + tonality -->
    <div class="ls-key-group">
      <div class="ls-key" id="ls-key">C</div>
      <div class="ls-tonality" id="ls-tonality">major</div>
    </div>
    <!-- Left bottom: BPM -->
    <div class="ls-bpm">
      <div class="ls-bpm-val" id="ls-bpm-val">120</div>
      <div class="ls-bpm-label">bpm</div>
    </div>
    <!-- Center: big play -->
    <button class="ls-play" id="ls-play" title="Start AI player">▶</button>
    <!-- Right: loop + cycle -->
    <div class="ls-right-col">
      <button class="ls-btn" id="ls-loop" title="Loop">⟲ Loop</button>
      <button class="ls-btn" id="ls-cycle" title="PITCHED — key shift per loop">· PITCHED</button>
      <button class="ls-btn" id="ls-sound" title="Sound">🎹</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   THEORY
   ════════════════════════════════════════════════════════════ */

const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
