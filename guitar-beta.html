/* ════════════════════════════════════════════════════════════
   LANDSCAPE STANDBY
   Big remote-control menu shown in landscape when the player
   is idle. Syncs key/bpm/toggles from the main UI so you can
   configure and launch without rotating back to portrait.
═════════════════════════════════════════════════════════════ */
function renderLandscapeStandby() {
  const el = document.getElementById('landscape-standby');
  if (!el) return;
  const visible = document.body.classList.contains('lp-on')
               && !document.body.classList.contains('player-active');
  if (!visible) return;

  // Key display
  const keyEl = document.getElementById('ls-key');
  if (keyEl) {
    const flats = useFlatsFor(state.keyPc);
    keyEl.textContent = nameOf(state.keyPc, flats);
  }
  // Tonality
  const tonEl = document.getElementById('ls-tonality');
  if (tonEl) tonEl.textContent = state.tonality;

  // BPM
  const bpmEl = document.getElementById('ls-bpm-val');
  if (bpmEl) bpmEl.textContent = metronome.bpm || 120;

  // Loop button state — yellow when on, label shows mode
  const loopBtn = document.getElementById('ls-loop');
  if (loopBtn) {
    const isOn = loopMode !== 'off';
    loopBtn.classList.toggle('ls-active', false);
    loopBtn.classList.toggle('ls-loop-on', isOn);
    loopBtn.textContent = loopMode === 'off'    ? '⟲ Loop'
      : loopMode === 'bars-4' ? '⟲ 4 bars'
      : loopMode === 'section' ? '⟲ Section'
                              : '⟲ Song';
  }

  // Cycle button state
  const cycleBtn = document.getElementById('ls-cycle');
  const realCycle = document.getElementById('cycle-toggle');
  if (cycleBtn && realCycle) {
    const label = realCycle.textContent || '·';
    cycleBtn.textContent = (label === '·') ? '· PITCHED' : label + ' PITCHED';
    cycleBtn.classList.toggle('ls-active', realCycle.classList.contains('active'));
  }

  // Sound button — show current instrument
  const soundBtn = document.getElementById('ls-sound');
  if (soundBtn) {
    soundBtn.textContent = state.instrument === 'piano' ? '🎹 Piano' : '🎸 Guitar';
  }
}

// Wire standby buttons
(function wireLandscapeStandby() {
  // Play → proxy the real AI play button
  const playBtn = document.getElementById('ls-play');
  if (playBtn) playBtn.addEventListener('click', () => {
    const real = document.getElementById('auto-play');
    if (real) real.click();
  });

  // Key tap → cycle through the 12 keys
  const keyEl = document.getElementById('ls-key');
  if (keyEl) keyEl.addEventListener('click', () => {
    state.keyPc = (state.keyPc + 1) % 12;
    if (typeof render === 'function') render();
    renderLandscapeStandby();
  });

  // Tonality tap → toggle major/minor
  const tonEl = document.getElementById('ls-tonality');
  if (tonEl) tonEl.addEventListener('click', () => {
    const btns = document.querySelectorAll('#tonality-toggle button');
    const target = state.tonality === 'major' ? 'minor' : 'major';
    btns.forEach(b => { if (b.dataset.tonality === target) b.click(); });
    renderLandscapeStandby();
  });

  // BPM drag up/down to adjust (mirrors the portrait BPM compact)
  const bpmEl = document.getElementById('ls-bpm-val');
  if (bpmEl) {
    let dragY = null, dragBpm = null, moved = false;
    function lsBpmMove(e) {
      if (dragY === null) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const delta = Math.round((dragY - y) / 3);
      if (Math.abs(delta) > 0) moved = true;
      setBpm(dragBpm + delta);
      renderLandscapeStandby();
    }
    function lsBpmEnd() {
      dragY = null;
      document.removeEventListener('mousemove', lsBpmMove);
      document.removeEventListener('mouseup', lsBpmEnd);
      document.removeEventListener('touchmove', lsBpmMove);
      document.removeEventListener('touchend', lsBpmEnd);
    }
    bpmEl.addEventListener('mousedown', e => {
      dragY = e.clientY; dragBpm = metronome.bpm; moved = false;
      document.addEventListener('mousemove', lsBpmMove);
      document.addEventListener('mouseup', lsBpmEnd);
    });
    bpmEl.addEventListener('touchstart', e => {
      dragY = e.touches[0].clientY; dragBpm = metronome.bpm; moved = false;
      document.addEventListener('touchmove', lsBpmMove, {passive: true});
      document.addEventListener('touchend', lsBpmEnd);
    }, {passive: true});
  }

  // Loop → proxy the real loop-toggle (which now cycles 3 states)
  const loopBtn = document.getElementById('ls-loop');
  if (loopBtn) loopBtn.addEventListener('click', () => {
    const real = document.getElementById('loop-toggle');
    if (real) real.click();
    // renderLandscapeStandby is called by the loop-toggle handler
  });

  // Cycle → proxy
  const cycleBtn = document.getElementById('ls-cycle');
  if (cycleBtn) cycleBtn.addEventListener('click', () => {
    const real = document.getElementById('cycle-toggle');
    if (real) real.click();
    renderLandscapeStandby();
  });

  // Sound → toggle instrument (use the JS proxy since the DOM
  // #instrument-btn was replaced by the GTR/PNO vs-cell toggle)
  const soundBtn = document.getElementById('ls-sound');
  if (soundBtn) soundBtn.addEventListener('click', () => {
    if (typeof instrumentBtn !== 'undefined' && instrumentBtn && instrumentBtn.click) {
      instrumentBtn.click();
    }
    renderLandscapeStandby();
  });

  // Swipe left/right on standby or play overlay → toggle guitar/piano
  function wireSwipeInstrument(el) {
    if (!el) return;
    let startX = null, startY = null;
    el.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: true});
    el.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      startX = null;
      // Only trigger on horizontal swipes (dx > 60px, mostly horizontal)
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        // The old #instrument-btn DOM element is gone (replaced by the
        // GTR/PNO vs-cell toggle). Use the in-memory instrumentBtn
        // proxy whose .click() flips setInstrument.
        if (typeof instrumentBtn !== 'undefined' && instrumentBtn && instrumentBtn.click) {
          instrumentBtn.click();
        }
        if (typeof renderLandscapeStandby === 'function') renderLandscapeStandby();
      }
    }, {passive: true});
  }
  wireSwipeInstrument(document.getElementById('landscape-standby'));
  wireSwipeInstrument(document.getElementById('landscape-play'));
  // Mobile vertical: hook the same swipe on the realistic guitar /
  // piano panel (the chord neck below the strip) so the user can
  // flick between instruments without hunting for the 🎸/🎹 button.
  // Only attach on coarse-pointer (touch) devices to avoid hijacking
  // accidental mouse drags on desktop.
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    wireSwipeInstrument(document.querySelector('.map-side-panel'));
  }
})();

// Compose-mode counterpart of the player's green info bar. While the AI isn't
// playing, the bar still has useful real estate — show the focused chord and
// the voicing being inspected (type, inversion, string set, fret position).
// When the player IS playing, this is a no-op (the player owns the bar).
function renderComposeInfo() {
  const el = document.getElementById('player-info');
  if (!el) return;
  if (player && (player.playing || player.paused)) return;   // player owns the bar while playing OR paused
  const fcId = state.focusedChord;
  const map = currentMap();
  const ch = fcId && map.chordDefs[fcId];
  if (!ch) { el.innerHTML = ''; return; }
  const flats = useFlatsFor(state.keyPc);
  const root  = (state.keyPc + ch.deg) % 12;
  const name  = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
  const fs    = focusedShape();
  // Voicing-type label — prefer explicit type from userVoicing/focusedShape;
  // fall back to the global voicingPref when nothing more specific is known.
  const typeRaw = fs?.type || state.userVoicing?.type || (window.voicingPref && voicingPref !== 'all' ? voicingPref : 'drop2');
  const TYPE_LABEL = { drop2: 'DROP-2', drop3: 'DROP-3', shell: 'SHELLS', triad: 'TRIAD', guide: 'GUIDE', sus: 'SUS' };
  const typeLabel = TYPE_LABEL[typeRaw] || typeRaw.toUpperCase();
  // Inversion + string-set when available (drop-2 path).
  const SET_LABEL = ['LOW', 'MID', 'TOP'];
  const INV_LABEL = ['root pos', '1st inv', '2nd inv', '3rd inv'];
  const inv = fs?.inversion;
  const ss  = fs?.stringSetIdx;
  let detail = '';
  if (Number.isInteger(inv) && Number.isInteger(ss)) {
    detail = `${INV_LABEL[inv] || ('inv ' + inv)} · ${SET_LABEL[ss] || ('set ' + ss)} set`;
  }
  // Average fret as a quick "where on the neck" reading.
  let fretTxt = '';
  if (fs?.shape) {
    const af = Math.round(avgFret(fs.shape));
    if (Number.isFinite(af) && af > 0) fretTxt = `fret&nbsp;${af}`;
  }
  // Position counter inside the current voicing family — "3/12" tells the
  // user how many more voicings live in this technique before cycling
  // wraps. Only shown in compose mode (the AI's own info bar is busy with
  // progression state and doesn't need this).
  let posTxt = '';
  if (fs?.shape && typeRaw) {
    const family = allDistinctVoicings(ch.quality, root).filter(c => c.type === typeRaw);
    if (family.length > 1) {
      const idx = family.findIndex(c => c.shape.every((f, i) => f === fs.shape[i]));
      if (idx >= 0) posTxt = `${idx + 1}/${family.length}`;
    }
  }
  // Key chip (matches the player's pi-key styling).
  const keyName = nameOf(state.keyPc, flats);
  const tq = state.tonality === 'major' ? 'MAJ' : 'MIN';
  const keyHtml = `<span class="pi-key">${keyName}<span class="pi-key-q">${tq}</span></span>`;
  // Chord name uses the same italic-serif pi-prog class so it visually
  // rhymes with the playback bar's progression name.
  const chordHtml = `<span class="pi-prog">${name}</span>`;
  const romanHtml = `<span class="pi-iter">${ch.roman}</span>`;
  const posChip   = posTxt ? `<span class="pi-step">${posTxt}</span>` : '';
  const typeHtml  = `<span class="pi-voicing">${typeLabel}${detail ? ' · ' + detail : ''}</span>${posChip}`;
  const fretHtml  = fretTxt ? `<span class="pi-iter">${fretTxt}</span>` : '';
  el.innerHTML = `
    ${keyHtml}
    <span class="pi-div"></span>
    ${chordHtml}
    ${romanHtml}
    <span class="pi-div"></span>
    ${typeHtml}
    ${fretHtml ? '<span class="pi-spacer"></span>' + fretHtml : ''}
  `;
}

// ─── Beat counter loop: drives the 1-2-3-4 lights in the player-info bar ───
// Reads from audioCtx + player.nextBarTime so it stays phase-locked with the
// actual scheduled chord changes (no drift, no separate clock).
let _beatLoopId = null;
function startBeatCounterLoop() {
  if (_beatLoopId) return;
  let lastBeat = -1;
  let lastCountIn = null;
  let lastSubSlot = -1;
  let lastSubCell = -1;
  function tick() {
    if (!player || !player.playing || !audioCtx) {
      _beatLoopId = null;
      // Clear any lingering active-slot highlight on stop
      document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
      return;
    }
    const beatDur = 60 / metronome.bpm;
    const barDur = beatDur * 4;
    const barStart = player.nextBarTime - barDur;
    const elapsed = audioCtx.currentTime - barStart;
    const beatInBar = ((Math.floor(elapsed / beatDur) % 4) + 4) % 4;
    const inCountIn = !!(player._countInUntil && audioCtx.currentTime < player._countInUntil - 0.02);
    if (beatInBar !== lastBeat || inCountIn !== lastCountIn) {
      lastBeat = beatInBar;
      lastCountIn = inCountIn;
      const beatsEl = document.querySelector('#player-info .pi-beats');
      if (beatsEl) beatsEl.classList.toggle('count-in', inCountIn);
      document.querySelectorAll('#player-info .pi-beat').forEach((el, i) => {
        el.classList.toggle('on', i === beatInBar);
      });
    }
    // Subdivision slot animation: highlight the segment currently sounding
    // on the CURRENT cell's playback bar. During count-in nothing's
    // actually playing yet — keep the bar static.
    const cellInPage = player.totalBars % 4;
    const planned = player._cachedPage && player._cachedPage[cellInPage];
    const subN = (planned && planned.subdivisions) || 1;
    if (subN > 1 && elapsed >= 0 && !inCountIn) {
      const slotDur = barDur / subN;
      const slot = Math.min(subN - 1, Math.max(0, Math.floor(elapsed / slotDur)));
      const muted = (planned.subdivMute || [])[slot];
      if (slot !== lastSubSlot || cellInPage !== lastSubCell) {
        document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
        if (!muted) {
          const seg = document.querySelector(`[data-pb-cell="${cellInPage}"][data-pb-seg="${slot}"]`);
          if (seg) {
            // Force restart of the CSS animation by toggling the class off/on
            seg.classList.remove('pb-on');
            void seg.offsetWidth;
            seg.classList.add('pb-on');
          }
        }
        lastSubSlot = slot;
        lastSubCell = cellInPage;
      }
    } else if (lastSubSlot !== -1 || inCountIn) {
      // Either out of subdivisions or we're in count-in — clear any leftover.
      document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
      lastSubSlot = -1;
      lastSubCell = -1;
    }
    _beatLoopId = requestAnimationFrame(tick);
  }
  _beatLoopId = requestAnimationFrame(tick);
}

// Mobile chord-map overlay: toggle, close on backdrop tap, close after picking a chord
(function wireMobileMapToggle() {
  const btn      = document.getElementById('map-mobile-toggle');
  const backdrop = document.getElementById('map-mobile-backdrop');
  if (!btn || !backdrop) return;
  const host = document.querySelector('.chord-map-host');
  const mapEl = document.querySelector('.chord-map');
  function fitMap() {
    if (!host || !mapEl) return;
    if (!document.body.classList.contains('map-overlay-open')) return;
    // Reset scale + nominal box so measurements are stable
    mapEl.style.setProperty('--map-scale', '1');
    mapEl.style.width  = '540px';
    mapEl.style.height = '800px';
    // Measure ACTUAL content extents — no nominal floor. The 540×800 box was
    // padding the bounding box past the real cards, making scaleH artificially
    // small and leaving empty space below the bottom row of cards on mobile.
    let contentW = 0, contentH = 0;
    mapEl.querySelectorAll('.map-card').forEach(c => {
      contentW = Math.max(contentW, c.offsetLeft + c.offsetWidth);
      contentH = Math.max(contentH, c.offsetTop  + c.offsetHeight);
    });
    // Defensive fallback if no cards rendered yet
    if (contentW < 1 || contentH < 1) { contentW = 540; contentH = 800; }
    // Use the visual viewport when available — innerHeight on mobile lies while
    // the URL bar is showing, which was making the slot too tall and spilling
    // past the top of the actual visible area.
    const vv = window.visualViewport;
    const vw = vv ? vv.width  : window.innerWidth;
    const vh = vv ? vv.height : window.innerHeight;
    // Reserve room for the toggle bar + safe area below AND the header above
    const toggleBarH = 48;
    const headerH    = 60;
    // The action-buttons column (▼/▲/⌫/▶/×) sits at right:6px, width:52px on
    // mobile when map-overlay-open. The map can't grow into that strip without
    // colliding, so subtract it from the usable horizontal area and recenter
    // the map within what's actually left.
    const rightColW = 58;   // 6px right offset + 52px button width
    const padX = 16, padY = 18;   // 8px breathing room on each side
    const availW = Math.max(0, vw - rightColW - padX);
    // Center the map within the LEFT-of-buttons area, not the full viewport.
    // mapCx = leftPad + availW/2 → pulls the grid left so the empty space
    // we used to see between the left edge and the leftmost card disappears.
    const mapCx = (padX / 2) + (availW / 2);
    mapEl.style.setProperty('--map-cx', mapCx.toFixed(2) + 'px');
    // Cap the slot to a sensible fraction of the visual viewport so even on
    // small phones the map can never be taller than what's actually visible.
    // Reserve room for the compose strip too (~280px on mobile) so the chord
     // preview never gets buried behind the map overlay.
    const composeStripH = 280;
    const maxSlotH = Math.max(180, Math.min(vh * 0.42, vh - toggleBarH - headerH - composeStripH));
    const scaleW = availW    / contentW;
    const scaleH = (maxSlotH - padY) / contentH;
    const scale  = Math.min(scaleW, scaleH);
    mapEl.style.setProperty('--map-scale', scale.toFixed(4));
    mapEl.style.width  = contentW + 'px';
    mapEl.style.height = contentH + 'px';
    const slotH = Math.min(maxSlotH, Math.ceil(contentH * scale + padY));
    host.style.height = slotH + 'px';
  }
  function close() {
    document.body.classList.remove('map-overlay-open');
    btn.textContent = '🗺 Map';
  }
  function open() {
    document.body.classList.add('map-overlay-open');
    btn.textContent = '⌨ Keys';
    requestAnimationFrame(fitMap);
  }
  window.addEventListener('resize', fitMap);
  window.addEventListener('orientationchange', () => setTimeout(fitMap, 200));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitMap);
    window.visualViewport.addEventListener('scroll', fitMap);
  }
  btn.addEventListener('click', () => {
    document.body.classList.contains('map-overlay-open') ? close() : open();
  });
  // Map is an *alternative* to the keypad in the same slot — stays open while the
  // user taps multiple chords. They flip back to the dialer with the same button.
})();

/* ─── Keyboard shortcuts: 1–7 jump to diatonic scale degrees ─── */

const DEGREE_SHORTCUTS = {
  // Number 7 binds to the diatonic vii° in major (was bVII before — bVII
  // still lives in the chord map, just no longer on the number pad).
  major: {1:'I',  2:'ii',  3:'iii',  4:'IV', 5:'V',  6:'vi',  7:'vii'},
  minor: {1:'i',  2:'iiø', 3:'bIII', 4:'iv', 5:'V7', 6:'bVI', 7:'bVII'},
};

/* Master voicing catalog for a chord — DEDUPED across every technique.
   Ordered: drop-2 → shells → triads → guides → sus, register-ascending
   within each group. Used by the inversion cycle so the user can step
   through every distinct voicing the app knows how to play, instead of
   just the drop-2 column.
   Each entry: {shape, type, ...meta}. meta carries stringSetIdx/inversion
   (drop-2/sus) or stringSet (shells/triads/guides) so the green info bar
   can describe what's currently selected. */
function allDistinctVoicings(quality, rootPc, opts = {}) {
  const out = [];
  const seen = new Set();
  const keyOf = (sh) => sh.map((f, s) => f >= 0 ? `${s}.${f}` : '').filter(Boolean).sort().join(',');
  // Skip the playability filter for piano (no fret constraints) or when
  // an explicit opts.allShapes is passed — used by transpose-rebuild
  // so a voicing defined in piano keeps its coordinate across keys
  // even when the user later switches to guitar.
  const needsPlayable = !opts.allShapes && state.instrument !== 'piano';
  const add = (sh, type, meta = {}) => {
    if (!sh) return;
    if (needsPlayable && !isPlayableShape(sh)) return;
    const k = keyOf(sh);
    if (seen.has(k)) return;
    seen.add(k);
    out.push({ shape: sh, type, ...meta });
  };
  const byReg = (a, b) => avgFret(a.shape) - avgFret(b.shape);
  // Octave-shift a shape by +12 frets on every fretted string. Same
  // pitches, higher position. Returns null if any fret would exceed
  // the playable range so callers can stop ascending.
  const octaveUp = (sh) => {
    const shifted = sh.map(f => f >= 0 ? f + 12 : -1);
    return shifted.every(f => f === -1 || f <= N_FRETS) ? shifted : null;
  };
  // For each base voicing the builder returns, expand vertically by
  // adding every higher-octave copy that still fits on the neck.
  // Big range boost for chord types whose root sits low (drop-2 EADG
  // set 0 inv 0 used to be the only option — now we get the 12-fret-up
  // copy too, sometimes a third one in the upper register).
  const withOctaves = (push, baseSh) => {
    let sh = baseSh;
    while (sh) {
      push(sh);
      sh = octaveUp(sh);
    }
  };

  // 1. Drop-2 (3 string sets × 4 inversions × N octaves)
  const drops = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => drops.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  drops.sort(byReg).forEach(d => add(d.shape, 'drop2', { stringSetIdx: d.stringSetIdx, inversion: d.inversion }));

  // 1.5 Drop-3 (2 skipped-string sets × 4 inversions × N octaves) —
  // wider 4-note voicings; the "missing link" between shells and
  // drop-2. Uses DROP3_STRING_SETS (skip 5th or skip 4th) for the
  // idiomatic guitar drop-3 sound — the skipped middle string is
  // what gives the bass its breathing room.
  const drop3s = [];
  for (let ss = 0; ss < DROP3_STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = dropThreeVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => drop3s.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  drop3s.sort(byReg).forEach(d => add(d.shape, 'drop3', { stringSetIdx: d.stringSetIdx, inversion: d.inversion }));

  // 2. Shells (2 root-position string sets — no rotations on guitar)
  const shells = [];
  ['A','B'].forEach(t => {
    const base = shellVoicing(quality, rootPc, t);
    if (!base) return;
    withOctaves(sh => shells.push({ shape: sh, stringSet: t }), base);
  });
  shells.sort(byReg).forEach(s => add(s.shape, 'shell', { stringSet: s.stringSet }));

  // 3. Triads (3 string positions × 3 inversions × N octaves)
  const triads = [];
  ['top','mid','low'].forEach(t => {
    for (let inv = 0; inv < 3; inv++) {
      const base = triadVoicing(quality, rootPc, t, inv);
      if (!base) continue;
      withOctaves(sh => triads.push({ shape: sh, stringSet: t, inversion: inv }), base);
    }
  });
  triads.sort(byReg).forEach(t => add(t.shape, 'triad', { stringSet: t.stringSet, inversion: t.inversion }));

  // 4. Guide tones (2 string sets × N octaves)
  const guides = [];
  ['A','B'].forEach(t => {
    const base = guideToneVoicing(quality, rootPc, t);
    if (!base) return;
    withOctaves(sh => guides.push({ shape: sh, stringSet: t }), base);
  });
  guides.sort(byReg).forEach(g => add(g.shape, 'guide', { stringSet: g.stringSet }));

  // 5. Sus voicings (3 sets × 4 inversions × N octaves)
  const suss = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = susVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => suss.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  suss.sort(byReg).forEach(s => add(s.shape, 'sus', { stringSetIdx: s.stringSetIdx, inversion: s.inversion }));

  // 6. Strum chords — rhythm-guitar grips. Four sub-variants:
  //   seventh (jazz 4-note barre) · triad (pop/rock 3-note barre) ·
  //   power (R-5-R, rock) · open (cowboy chords in E/A/D/G/C keys).
  const strums = [];
  ['E', 'A'].forEach(t => {
    ['seventh', 'triad'].forEach(variant => {
      const base = barreVoicing(quality, rootPc, t, variant);
      if (!base) return;
      withOctaves(sh => strums.push({ shape: sh, stringSet: t, variant }), base);
    });
    const pwr = powerVoicing(quality, rootPc, t);
    if (pwr) withOctaves(sh => strums.push({ shape: sh, stringSet: t, variant: 'power' }), pwr);
  });
  // Open cowboy: single shape per (root, quality) if available — no
  // octave shift (it IS the open position).
  const openSh = openVoicing(quality, rootPc);
  if (openSh) strums.push({ shape: openSh, stringSet: 'OPEN', variant: 'open' });
  strums.sort(byReg).forEach(s => add(s.shape, 'strum', { stringSet: s.stringSet, variant: s.variant }));

  return out;
}

// All drop-2 voicing candidates for a chord, sorted by register (low → high).
// Kept as a separate helper because bestStartingVoicing still wants the
// drop-2-only pool for the map's static "what would this chord look like" view.
function composedCandidatesFor(quality, rootPc) {
  const cands = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (sh) cands.push({ shape: sh, stringSetIdx: ss, inversion: inv });
    }
  }
  cands.sort((a, b) => {
    const afA = avgFret(a.shape), afB = avgFret(b.shape);
    if (afA !== afB) return afA - afB;
    return a.stringSetIdx - b.stringSetIdx;
  });
  return cands;
}

// Strategy-aware voicing picker. Given a candidate list (from
// allDistinctVoicings), the previous chord's shape (optional), and the
// current state.autoStrategy, returns the index of the chosen voicing.
//   smoothest — voice-leading + central register + drop-2 bias (default)
//   low       — minimize avgFret (sit near the nut)
//   high      — maximize avgFret (high on the neck)
//   random    — uniform random pick
// Function-based voicing override: each harmonic function has a
// "natural" alternate family that should win a fraction of the
// time, even when the section's primary family is something else.
// Lets the AI add color/contrast on dominants and tonics without
// blowing up the section's overall texture.
//   tonic     → drop-3 (fuller "arrival") ~25%
//   predom    → shell  (lighter, pushing) ~30%
//   dom       → drop-3 (bass color)       ~40%
//   secondary → drop-3 (highlighted)      ~45%
//   borrowed  → drop-3 (color chord)      ~45%
const FUNCTION_OVERRIDE = {
  tonic:     { alt: 'drop3', prob: 0.15 },
  predom:    { alt: 'shell', prob: 0.18 },
  dom:       { alt: 'drop3', prob: 0.25 },
  secondary: { alt: 'drop3', prob: 0.30 },
  borrowed:  { alt: 'drop3', prob: 0.30 },
};
// Decide the voicing type to use for one chord-event. The section
// primary is the default; with FUNCTION_OVERRIDE probability we
// promote the chord to its natural alternate family. Deterministic
// per song position so re-rendering the same bar always picks the
// same family (no flicker).
function _voicingTypeForChord(primaryType, chordTag, songIdx, stepIdx, sectionIter) {
  // Only override in 'all' preference mode — if user pinned a
  // specific family, respect it.
  if (voicingPref !== 'all') return primaryType;
  if (!chordTag) return primaryType;
  const override = FUNCTION_OVERRIDE[chordTag];
  if (!override || override.alt === primaryType) return primaryType;
  // Deterministic 0..1 hash seeded on song position + chord function.
  const seed = `${songIdx}|${stepIdx}|${sectionIter}|${chordTag}|${primaryType}`;
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const r = ((h >>> 0) % 10000) / 10000;
  return r < override.prob ? override.alt : primaryType;
}

// Per-family bias used by the smoothest picker. Drop-2 stays the
// "house default" but bias is small enough that the others win when
// voice-leading is comparable. Random ±3 noise is added to every
// score so tied/near-tied cases break randomly across families
// (not always to drop-2). Aim: real variety on subsequent picks,
// drop-2 still ~half the time on average.
const FAMILY_BIAS = {
  drop2: 0,
  drop3: 1,
  shell: 2,
  triad: 3,
  guide: 6,
  sus:   5,
  strum: 4,   // Strum (barre/open/power) — neutral bias; mostly picked via PROGRESSION_VOICING weights or 'strum' pref
};
// Deterministic per-candidate hash → noise in [-3, 3]. Used in place
// of Math.random() so the picker returns the SAME family for the
// same (chord, prev, family-coordinate) context. That way the map
// card preview matches the chord that actually plays when clicked.
function _seedNoise(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const u = ((h >>> 0) % 10000) / 10000;
  return (u - 0.5) * 6;

    if (cell._silent) {
      const restGlyph = isTab ? '' : '<span class="rb-rest" title="silence">·</span>';
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${restGlyph}</div>`;
    }
    // Tie cell — shows % continuation symbol (same as AI song view)
    if (cell._tie) {
      if (isTab) {
        const showClef = (i === 0);
        const tSizing = isMobile
          ? {W: 100, H: 128, minimal: true, showClef}
          : {W: 130, H: 148, minimal: false, showClef};
        const contSvg = (state.instrument === 'piano') ? renderContinuationStaff(tSizing) : '';
        return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${contSvg}</div>`;
      }
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>
        <div class="rb-continuation">%</div>
        <button class="${(i === state.composedSelectedIdx) ? 'compose-edit-btn active' : 'compose-edit-btn'}" data-edit-idx="${i}" title="lock slot for replacement (L)">${i === state.composedSelectedIdx ? '🔒' : '🔓'}</button>
      </div>`;
    }
    const ch = map.chordDefs[cell.chord];
    if (!ch) return `<div class="${cls.join(' ')}"></div>`;
    const root = chordRoot(ch);
    if (isTab) {
      if (!cell.shape) return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}></div>`;
      // Clef only at the start of each visual row: mobile = 4 per row, desktop = 8 per row
      // Clef only on the very first compose cell — once you're past it, the
      // staff continues unmarked (the eye carries the clef forward).
      const showClef = (i === 0);
      const cellChordName = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
      // Piano mode embeds chord name in the staff SVG (no separate name row).
      // Guitar mode shows the name in the .rb-cell row above the tab — so we
      // SKIP passing chordName to renderMini to avoid a double-display.
      const sizingPiano = isMobile
        ? {W: 100, H: 128, r: 8, minimal: true, showClef, chordName: cellChordName, roman: ch.roman, tag: ch.tag, subdivisions: cell.subdivisions || 1, subdivMute: cell.subdivMute || []}
        : {W: 130, H: 148, r: 11, bwNotes: true, showClef, chordName: cellChordName, roman: ch.roman, tag: ch.tag, subdivisions: cell.subdivisions || 1, subdivMute: cell.subdivMute || []};
      const sizingGuitar = isMobile
        ? {W: 100, H: 128, r: 8, minimal: true}
        : {W: 130, H: 148, r: 11, bwNotes: true};
      const svg = state.instrument === 'piano'
        ? renderChordStaff(cell.shape, root, ch.quality, flats, sizingPiano)
        : renderMini(cell.shape, root, ch.quality, flats, sizingGuitar);
      // Rhythm subdivisions UI — triangle picker is ALWAYS visible with the
      // current count inside (default 1). Segment bar appears only when N > 1.
      const n = cell.subdivisions || 1;
      const muteArr = cell.subdivMute || [];
      const triClass = n > 1 ? 'subdiv-triangle has-divs' : 'subdiv-triangle';
      let barHtml = '';
      if (n > 1) {
        let segs = '';
        for (let s = 0; s < n; s++) {
          const m = muteArr[s] ? 'muted' : '';
          segs += `<div class="subdiv-seg ${m}" data-subdiv-cell="${i}" data-subdiv-seg="${s}"></div>`;
        }
        barHtml = `<div class="subdiv-bar">${segs}</div>`;
      }
      // Just a pill badge with the count — clean, no triangle silhouette.
      const triHtml = `<button class="${triClass}" data-subdiv-tri="${i}" title="rhythm subdivisions (click to change)">${n}</button>`;
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${svg}${triHtml}${barHtml}</div>`;
    }
    const name = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
    const selCls = (i === state.composedSelectedIdx) ? 'compose-edit-btn active' : 'compose-edit-btn';
    return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>
      <div class="rb-roman">${ch.roman}</div>
      <div class="rb-chord">${name}</div>
      <button class="${selCls}" data-edit-idx="${i}" title="lock slot for replacement (L)">${i === state.composedSelectedIdx ? '🔒' : '🔓'}</button>
    </div>`;
  };

  if (isMobile) {
    // Build quad rows: 4 chord cells, then 4 tab cells beneath, repeating
    const parts = [];
    for (let i = 0; i < cells.length; i += 4) {
      for (let k = 0; k < 4; k++) parts.push(renderCell(cells[i + k], i + k, false));
      for (let k = 0; k < 4; k++) parts.push(renderCell(cells[i + k], i + k, true));
    }
    el.innerHTML = parts.join('');
    tabsEl.innerHTML = '';
    // Auto-scroll the strip's INTERNAL scroll so the latest cell is at the
    // top — without bubbling to ancestor scrollables (scrollIntoView would
    // also scroll the page itself, which prevented the user from scrolling
    // back up to see the first row).
    requestAnimationFrame(() => {
      const cur = state.instrument === 'piano'
        ? el.querySelector('.rb-tab-cell.current')
        : el.querySelector('.rb-cell.current');
      if (cur && el.scrollHeight > el.clientHeight) {
        const target = cur.offsetTop - el.offsetTop;
        el.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    });
  } else {
    el.innerHTML = cells.map((c, i) => renderCell(c, i, false)).join('');
    tabsEl.innerHTML = cells.map((c, i) => renderCell(c, i, true)).join('');
  }
}

// Delegated click handler for the compose strip — tapping any composed-
// progression cell rings that chord (with its exact stored voicing) and
// focuses it so the user can audition / cycle inversions from there.
// Attached once on the document so it survives every renderComposeStrip().
// Subdivision popover lifecycle: open near the clicked triangle (above
// preferred, fallback below if no room). Click outside or Esc to close.
function openSubdivPopover(triEl, cellIdx) {
  const pop = document.getElementById('subdiv-popover');
  const cur = state.composedProgression[cellIdx]?.subdivisions || 1;
  pop.dataset.cellIdx = cellIdx;
  // Buttons in natural source order — CSS grid-area positions them in the
  // layout: [1] capped top, [2 4 6 / 3 5 7] in two columns, [8] capped bottom.
  const mkBtn = (n) => `<button data-subdiv-pick="${n}" class="${n === cur ? 'selected' : ''}">${n}</button>`;
  pop.innerHTML = [1,2,3,4,5,6,7,8].map(mkBtn).join('');
  pop.classList.add('open');
  // Position BELOW the badge, centered horizontally. Falls back to above
  // only if the popover would clip the viewport bottom.
  const r = triEl.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  let top  = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = r.top - h - 8;
  left = Math.max(6, Math.min(left, window.innerWidth - w - 6));
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
}
function closeSubdivPopover() {
  const pop = document.getElementById('subdiv-popover');
  if (pop) { pop.classList.remove('open'); pop.dataset.cellIdx = ''; }
}
document.addEventListener('click', (ev) => {
  // Close popover if click landed outside its body AND outside any triangle
  if (ev.target.closest('#subdiv-popover') || ev.target.closest('.subdiv-triangle')) return;
  closeSubdivPopover();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeSubdivPopover();
});

// ─── Drag-and-drop reorder for the compose strip (desktop only) ───
// User can drag a filled cell and drop it on another filled cell to
// SWAP positions (preserving song length). Dropping on a trailing
// empty cell moves the chord to the end of the sequence. Mobile is
// skipped — touch DnD with HTML5 is fragile, and the strip already
// has tap-to-jump / tap-to-replace touch UX.
(function() {
  let dragFromIdx = null;

  // Find the strip cell ancestor (chord or tab row, filled or empty).
  const cellOf = (target) => target && target.closest && target.closest('[data-compose-idx], [data-compose-empty]');

  // When the user touches an INTERIOR control (subdiv badge, segs, edit lock,
  // popover, etc.), suspend the cell's draggable attribute for the duration
  // of that gesture. Otherwise the browser's native HTML5 drag-detection on
  // the ancestor cell pre-empts pointer events, breaking the badge's
  // vertical drag-to-change-count gesture. Restore on the next pointerup.
  const INNER_CTRL_SEL = '.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg, #subdiv-popover';
  let suspendedCell = null;
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest) return;
    if (!e.target.closest(INNER_CTRL_SEL)) return;
    const cell = cellOf(e.target);
    if (cell && cell.getAttribute('draggable') === 'true') {
      cell.setAttribute('draggable', 'false');
      suspendedCell = cell;
    }
  }, true);
  const restoreSuspended = () => {
    if (suspendedCell) {
      suspendedCell.setAttribute('draggable', 'true');
      suspendedCell = null;
    }
  };
  document.addEventListener('pointerup', restoreSuspended, true);
  document.addEventListener('pointercancel', restoreSuspended, true);

  // Clear any lingering drop-target highlight across the whole strip.
  const clearDropTargets = () => {
    document.querySelectorAll('.rb-cell.drop-target, .rb-tab-cell.drop-target').forEach(c => c.classList.remove('drop-target'));
  };

  document.addEventListener('dragstart', (e) => {
    const cell = cellOf(e.target);
    if (!cell || cell.dataset.composeIdx == null) return;
    // Don't initiate drag from inner controls (edit btn, subdiv badge, etc).
    if (e.target.closest('.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg')) {
      e.preventDefault();
      return;
    }
    dragFromIdx = parseInt(cell.dataset.composeIdx, 10);
    try {
      e.dataTransfer.effectAllowed = 'move';
      // Some browsers need data set to actually start the drag.
      e.dataTransfer.setData('text/plain', String(dragFromIdx));
    } catch {}
    // Subtle visual: dim the source so the user sees what's being dragged.
    cell.classList.add('dragging');
    // Also dim the sibling row (tab cell mirroring same idx) so both
    // halves of the same step show the dragging state.
    document.querySelectorAll(`[data-compose-idx="${dragFromIdx}"]`).forEach(c => c.classList.add('dragging'));
  });

  document.addEventListener('dragover', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch {}
    // Update target highlight — only one cell at a time, sibling row too.
    const tIdx = cell.dataset.composeIdx != null ? cell.dataset.composeIdx : cell.dataset.composeEmpty;
    if (tIdx == null) return;
    // Don't highlight the source cell as a drop target.
    if (cell.dataset.composeIdx != null && parseInt(cell.dataset.composeIdx, 10) === dragFromIdx) {
      clearDropTargets();
      return;
    }
    // Clear stale targets then set the new pair.
    clearDropTargets();
    const sel = cell.dataset.composeIdx != null
      ? `[data-compose-idx="${tIdx}"]`
      : `[data-compose-empty="${tIdx}"]`;
    document.querySelectorAll(sel).forEach(c => c.classList.add('drop-target'));
  });

  document.addEventListener('drop', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) { dragFromIdx = null; clearDropTargets(); return; }
    e.preventDefault();
    const from = dragFromIdx;
    const seq = state.composedProgression;
    if (from < 0 || from >= seq.length) {
      dragFromIdx = null; clearDropTargets(); return;
    }
    // Deep clone the source so subdivisions / shape arrays don't share refs.
    const copy = JSON.parse(JSON.stringify(seq[from]));
    // Snapshot for undo before any mutation.
    const snapshot = () => {
      if (typeof _composeUndoStack !== 'undefined') {
        _composeUndoStack.push(JSON.parse(JSON.stringify(seq)));
      }
    };
    if (cell.dataset.composeIdx != null) {
      const to = parseInt(cell.dataset.composeIdx, 10);
      if (to !== from && to >= 0 && to < seq.length) {
        snapshot();
        seq[to] = copy;
        renderComposeStrip();
      }
    } else if (cell.dataset.composeEmpty != null) {
      // Drop on a trailing empty cell at index `to`. If `to` is past
      // the current end, fill the gap (seq.length .. to-1) with silent
      // rests, then place the duplicate at index `to`. This lets the
      // user drag e.g. from bar 2 to bar 4 and get a rest at bar 3.
      const to = parseInt(cell.dataset.composeEmpty, 10);
      if (to >= seq.length && to < 16) {
        snapshot();
        while (seq.length < to) seq.push({ _silent: true });
        seq.push(copy);
        renderComposeStrip();
      }
    }
    dragFromIdx = null;
    clearDropTargets();
  });

  document.addEventListener('dragend', () => {
    dragFromIdx = null;
    document.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging'));
    clearDropTargets();
  });
})();

// Vertical drag on the subdivision badge to change the count (like the BPM).
// Drag UP increments, DRAG DOWN decrements. ~14 px per step. Clamped 1–8.
// Uses POINTER events so mouse + touch + pen all work the same way, with
// setPointerCapture so the drag survives the cursor leaving the badge.
(function() {
  let dragIdx = null, dragStartY = null, dragStartN = null, dragMoved = false;
  let capturedEl = null, capturedPointerId = null;
  function clampN(n) { return Math.max(1, Math.min(8, n)); }
  function onMove(e) {
    if (dragIdx === null) return;
    // Block the browser from scrolling — touch-action:none on the badge
    // helps but once the pointer leaves it, only preventDefault stops scroll.
    if (e.cancelable) e.preventDefault();
    const y = e.clientY;
    const movedPx = Math.abs(y - dragStartY);
    // Wait until the pointer crosses an intentional-drag threshold
    // before mutating subdivisions. Otherwise tap jitter (1-2 px on
    // touchscreens) would compute distance=0 → newN=1 and wipe the
    // current value before the user has actually intended to drag.
    if (movedPx <= 8) return;
    dragMoved = true;
    // 1 is ALWAYS the center value, regardless of where dragging started.
    // Drag distance (in either direction) maps to the count: 0 → 1,
    // 14px → 2, …, 98px → 8. Drag back to the start point to return to 1.
    const distance = Math.round(movedPx / 14);
    const newN = clampN(1 + distance);
    const seq = state.composedProgression;
    const cell = seq[dragIdx];
    if (!cell || cell.subdivisions === newN) return;
    cell.subdivisions = newN;
    cell.subdivMute = (newN === 1)
      ? []
      : (cell.subdivMute && cell.subdivMute.length === newN
          ? cell.subdivMute
          : new Array(newN).fill(false));
    renderComposeStrip();
  }
  function onEnd(e) {
    if (capturedEl && capturedPointerId != null) {
      try { capturedEl.releasePointerCapture(capturedPointerId); } catch(_) {}
    }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
    document.body.classList.remove('dragging-subdiv');
    capturedEl = null;
    capturedPointerId = null;
    // Reset on next tick so the click handler can still read dragMoved.
    setTimeout(() => { dragIdx = null; dragMoved = false; }, 0);
  }
  document.addEventListener('pointerdown', e => {
    if (player.playing) return;
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    if (!seq[idx]) return;
    dragIdx = idx;
    dragStartY = e.clientY;
    dragStartN = seq[idx].subdivisions || 1;
    dragMoved = false;
    // Capture so subsequent move/up events fire on the SAME element even if
    // the finger drifts off the badge — critical on mobile.
    try {
      tri.setPointerCapture(e.pointerId);
      capturedEl = tri;
      capturedPointerId = e.pointerId;
    } catch(_) {}
    document.body.classList.add('dragging-subdiv');
    document.addEventListener('pointermove', onMove, {passive: false});
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  });
  // Right-click on the badge resets the subdivision count back to 1.
  document.addEventListener('contextmenu', e => {
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    e.preventDefault();
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    const cell = seq[idx];
    if (!cell) return;
    cell.subdivisions = 1;
    cell.subdivMute = [];
    renderComposeStrip();
  });
  window._subdivDragMoved = () => dragMoved;
})();

document.addEventListener('click', (ev) => {
  if (player.playing) return;

  // ── Rhythm subdivision triangle: open the 1–8 picker popover ──
  // (Only if the user TAPPED — if they dragged vertically to change the
  // count, the drag handler below sets _subdivDragMoved so we skip.)
  const triBtn = ev.target.closest('.subdiv-triangle');
  if (triBtn) {
    ev.stopPropagation();
    if (window._subdivDragMoved && window._subdivDragMoved()) return;
    const idx = parseInt(triBtn.dataset.subdivTri, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    // If the popover is already open for THIS cell, a second tap on
    // the same badge closes it (toggle behaviour). Otherwise open
    // (or re-open for a different cell).
    const pop = document.getElementById('subdiv-popover');
    if (pop && pop.classList.contains('open')
        && parseInt(pop.dataset.cellIdx, 10) === idx) {
      closeSubdivPopover();
    } else {
      openSubdivPopover(triBtn, idx);
    }
    return;
  }
  // ── Rhythm subdivision segment: toggle mute on click ──
  const seg = ev.target.closest('.subdiv-seg');
  if (seg) {
    ev.stopPropagation();
    const cellIdx = parseInt(seg.dataset.subdivCell, 10);
    const segIdx  = parseInt(seg.dataset.subdivSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    if (!cell.subdivMute) cell.subdivMute = new Array(cell.subdivisions || 1).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
  }
  // ── Staff slot (piano mode): same toggle, but clicking the noteheads
  //    on the partitura instead of the segment bar (which is hidden in
  //    piano mode). Finds the parent compose cell to know which index. ──
  const staffSlot = ev.target.closest('.staff-slot');
  if (staffSlot) {
    const parentCell = staffSlot.closest('[data-compose-idx]');
    if (!parentCell) return;
    const cellIdx = parseInt(parentCell.dataset.composeIdx, 10);
    const segIdx  = parseInt(staffSlot.dataset.staffSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    // Whole-note case (subdivisions === 1): clicking shouldn't mute
    // the only slot — that's what the regular delete key is for.
    // Instead, audition the chord (same behaviour as clicking the cell
    // in tab mode). We do it inline because this delegated handler
    // returns before reaching the cell-click block further down.
    const subN = cell.subdivisions || 1;
    if (subN <= 1) {
      ev.stopPropagation();
      if (!cell.chord) return;
      ensureAudio();
      state._composeFocusedIdx = cellIdx;
      state.focusedChord = cell.chord;
      state.userVoicing = cell.shape ? { shape: cell.shape } : null;
      renderAll();
      renderComposeStrip();
      ringFocusedChord();
      return;
    }
    ev.stopPropagation();
    if (!cell.subdivMute) cell.subdivMute = new Array(subN).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
  }
  // ── Click in the subdivision popover: pick a count ──
  const pickBtn = ev.target.closest('#subdiv-popover button[data-subdiv-pick]');
  if (pickBtn) {
    ev.stopPropagation();
    const n = parseInt(pickBtn.dataset.subdivPick, 10);
    const cellIdx = parseInt(document.getElementById('subdiv-popover').dataset.cellIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(n) || !seq[cellIdx]) return;
    const cell = seq[cellIdx];
    cell.subdivisions = n;
    cell.subdivMute = (n === 1)
      ? []
      : (cell.subdivMute && cell.subdivMute.length === n
          ? cell.subdivMute
          : new Array(n).fill(false));
    closeSubdivPopover();
    renderComposeStrip();
    return;
  }

  // ── Lock button: toggle lock on that specific slot ──
  const lockBtn = ev.target.closest('.compose-edit-btn');
  if (lockBtn) {
    ev.stopPropagation();
    const idx = parseInt(lockBtn.dataset.editIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    if (state.composedSelectedIdx === idx) {
      // Already locked on this slot — unlock
      state.composedSelectedIdx = null;
    } else {
      // Lock this slot
      state.composedSelectedIdx = idx;
      const entry = seq[idx];
      state.focusedChord = entry.chord;
      state.userVoicing = entry.shape ? { shape: entry.shape } : null;
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Empty cell click: extend the previous chord with ties up to that slot ──
  const emptyCell = ev.target.closest('[data-compose-empty]');
  if (emptyCell) {
    const seq = state.composedProgression;
    if (!seq.length || seq.length >= 16) return;
    const targetIdx = parseInt(emptyCell.dataset.composeEmpty, 10);
    if (!Number.isFinite(targetIdx) || targetIdx < seq.length) return;
    _composeSaveUndo();
    const prev = seq[seq.length - 1];
    const tieEntry = {
      chord: prev.chord, _candIdx: prev._candIdx, shape: prev.shape,
      voicingType: prev.voicingType, stringSetIdx: prev.stringSetIdx,
      inversion: prev.inversion, stringSet: prev.stringSet, _tie: true,
    };
    // Fill all slots from current end up to and including the clicked slot
    while (seq.length <= targetIdx && seq.length < 16) {
      seq.push(JSON.parse(JSON.stringify(tieEntry)));
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Cell click: focus/audition that chord (does NOT lock) ──
  const cell = ev.target.closest('[data-compose-idx]');
  if (!cell) {
    // Click outside any compose cell — clear lock
    if (state.composedSelectedIdx !== null) {
      const inControls = ev.target.closest('.compose-pad, .compose-btn, .compose-inv, .map-card');
      if (!inControls) {
        state.composedSelectedIdx = null;
        renderComposeStrip();
      }
    }
    return;
  }
  const idx = parseInt(cell.dataset.composeIdx, 10);
  const seq = state.composedProgression;
  if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
  const entry = seq[idx];
  if (!entry || !entry.chord) return;
  ensureAudio();
  // Tap a cell = focus + audit + silently arm a ONE-SHOT replace
  // target. NO visual lock indicator — the next chord button just
  // replaces this slot in place, then clears the arm so subsequent
  // picks append at the end. Tap a different cell to re-aim. Use
  // a separate _oneShotReplaceIdx so the existing composedSelectedIdx
  // (which DOES drive the orange "locked" highlight via the explicit
  // 🔓 button) stays untouched.
  state._composeFocusedIdx = idx;
  state.focusedChord = entry.chord;
  state.userVoicing = entry.shape ? { shape: entry.shape } : null;
  state._oneShotReplaceIdx = (state._oneShotReplaceIdx === idx) ? null : idx;
  renderAll();
  renderComposeStrip();
  ringFocusedChord();
});

// Sync hover highlight between chord-name row and tab row so they read as
// ONE cell. Uses bubbling mouseover/mouseout (mouseenter doesn't bubble,
// so the previous version only fired once on area entry, not per cell).
(function wireComposeHoverSync() {
  const area = document.querySelector('.rb-area');
  if (!area) return;
  let lastIdx = null;
  const clear = () => {
    area.querySelectorAll('[data-compose-idx].compose-hover')
        .forEach(el => el.classList.remove('compose-hover'));
  };
  area.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('[data-compose-idx]');
    if (!cell) return;
    const idx = cell.dataset.composeIdx;
    if (idx === lastIdx) return;
    lastIdx = idx;
    clear();
    area.querySelectorAll(`[data-compose-idx="${idx}"]`)
        .forEach(el => el.classList.add('compose-hover'));
  });
  area.addEventListener('mouseout', (e) => {
    // Skip if the mouse is still moving INTO another paired cell — the
    // mouseover that follows will refresh the highlight correctly.
    const next = e.relatedTarget && e.relatedTarget.closest
      ? e.relatedTarget.closest('[data-compose-idx]')
      : null;
    if (next) return;
    lastIdx = null;
    clear();
  });
})();

// Tracks voicing cycling for keyboard shortcuts.
//   Number 1–7                → select chord, play the screen-recommended voicing
//   Right Shift + number 1–7  → cycle FORWARD through alternate voicings
//   Left  Shift + number 1–7  → cycle BACKWARD through alternate voicings
let _shortcutCycle = { chord: null, idx: 0, cands: [] };

// Track which shift is held — e.shiftKey alone can't distinguish sides.
let _shiftSide = null;   // 'left' | 'right' | null
document.addEventListener('keydown', e => {
  if (e.code === 'ShiftLeft')  _shiftSide = 'left';
  if (e.code === 'ShiftRight') _shiftSide = 'right';
});
document.addEventListener('keyup', e => {
  if (e.code === 'ShiftLeft'  && _shiftSide === 'left')  _shiftSide = null;
  if (e.code === 'ShiftRight' && _shiftSide === 'right') _shiftSide = null;
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  // Ctrl/Cmd+Z → undo compose action
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    composeUndo();
    return;
  }

  if (e.metaKey || e.ctrlKey || e.altKey) return;

  // Spacebar → universal play/pause toggle (always available)
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    const btn = document.getElementById('auto-play');
    if (player.playing) {
      // Hit the auto-play button so it tears down player+metronome the same way
      if (btn) btn.click();
    } else if (state.composedProgression.length) {
      composePlay();
    } else if (btn) {
      btn.click();
    }
    return;
  }

  // Playback-mode shortcuts (active when the player owns the strip).
  // Enter  → click the big ⏹ stop button (2-stage: rewind, then clear).
  // Escape → click ✏ edit (exits playback, focuses the current chord
  //          in compose mode); a second Escape afterwards still falls
  //          through to the compose-mode "deselect → clear" chain.
  // ←/→    → step the playback head one bar back / forward through
  //          the strip while paused (crosses pages automatically).
  if (player.playing || player.paused) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const stopBtn = document.getElementById('auto-stop');
      if (stopBtn) stopBtn.click();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      const editBtn = document.getElementById('auto-edit');
      if (editBtn) editBtn.click();
      return;
    }
    if (player.paused && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      _navigateStrip(e.key === 'ArrowRight' ? 1 : -1);
      return;
    }
  }

  // Compose-mode shortcuts (only when AI off)
  if (!player.playing) {
    if (e.key === 'Backspace') {
      if (state.composedProgression.length) {
        e.preventDefault(); composeDeleteLast(); return;
      }
      // Nothing left to delete — if the player is paused (idle but
      // visualization still on the bar), the natural fallback is
      // "wipe everything and reset", same as tapping ⏹ stop/reset.
      if (player.paused) {
        e.preventDefault();
        const stopBtn = document.getElementById('auto-stop');
        if (stopBtn) stopBtn.click();
        return;
      }
    }
    if (e.key === 'Enter' && state.composedProgression.length) {
      e.preventDefault(); composePlay(); return;
    }
    // ←/→ = step through the composed progression (audition each chord)
    if (!player.paused && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') &&
        state.composedProgression.length) {
      e.preventDefault();
      const seq = state.composedProgression;
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const cur = state._composeFocusedIdx;
      let idx;
      if (cur === null || cur === undefined) {
        idx = dir > 0 ? 0 : seq.length - 1;
      } else {
        idx = cur + dir;
        if (idx < 0) idx = 0;
        if (idx >= seq.length) idx = seq.length - 1;
      }
      const entry = seq[idx];
      if (!entry || !entry.chord) return;
      ensureAudio();
      state._composeFocusedIdx = idx;
      state.focusedChord = entry.chord;
      state.userVoicing = entry.shape ? { shape: entry.shape } : null;
      renderAll();
      renderComposeStrip();
      ringFocusedChord();
      return;
    }
    // L = toggle lock on current/last chord slot for in-place replacement
    if ((e.key === 'l' || e.key === 'L') && state.composedProgression.length) {
      e.preventDefault();
      const seq = state.composedProgression;
      // If nothing selected, lock the last chord; if already locked, unlock
      const target = state.composedSelectedIdx ?? (seq.length - 1);
      if (state.composedSelectedIdx === target) {
        state.composedSelectedIdx = null;
      } else {
        state.composedSelectedIdx = target;
        const entry = seq[target];
        state.focusedChord = entry.chord;
        state.userVoicing = entry.shape ? { shape: entry.shape } : null;
      }
      renderAll();
      renderComposeStrip();
      return;
    }
  }
  if (e.key === 'Escape' && state.composedProgression.length) {
    e.preventDefault();
    // First Escape: just deselect (leaves the strip intact). Second Escape
    // (with no selection): clear the whole composed progression.
    if (state.composedSelectedIdx !== null) {
      state.composedSelectedIdx = null;
      renderComposeStrip();
    } else {
      composeClear();
    }
    return;
  }

  // Shift+digit may produce a punctuation glyph ("@", "#", ...) instead of the
  // digit on US layouts — fall back to e.code "Digit1"–"Digit7" in that case.
  // Also accept the numeric keypad ("Numpad1"–"Numpad7") so desktop users
  // with a 10-key get the same shortcut.
  let n = parseInt(e.key);
  if (isNaN(n) && e.code) {
    if (e.code.startsWith('Digit'))  n = parseInt(e.code.slice(5));
    else if (e.code.startsWith('Numpad')) n = parseInt(e.code.slice(6));
  }
  if (n < 1 || n > 7) return;
  const chordId = DEGREE_SHORTCUTS[state.tonality]?.[n];
  if (!chordId || !currentMap().chordDefs[chordId]) return;
  e.preventDefault();

  // Compose mode (AI not playing): append OR cycle last inversion with Shift
  if (!player.playing) {
    composeAddChord(chordId, e.shiftKey, _shiftSide === 'left' ? -1 : 1);
    // Flash AFTER composeAddChord, which re-renders the pad via renderAll
    const padBtn = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
    if (padBtn) {
      padBtn.classList.add('flash');
      setTimeout(() => padBtn.classList.remove('flash'), 150);
    }
    return;
  }

  const ch = currentMap().chordDefs[chordId];
  const root = chordRoot(ch);
  const isCycleKey = e.shiftKey;
  // Default to forward if shift side somehow isn't tracked (e.g. window lost focus)
  const direction = _shiftSide === 'left' ? -1 : 1;

  if (isCycleKey && _shortcutCycle.chord === chordId && _shortcutCycle.cands.length) {
    // Shift+same-number → step voicing in the chosen direction
    const len = _shortcutCycle.cands.length;
    _shortcutCycle.idx = (_shortcutCycle.idx + direction + len) % len;
  } else {
    // Either plain digit OR shift+different-chord. Pull the master voicing
    // list (drop-2 → shells → triads → guides → sus, deduped) so the cycle
    // covers EVERY distinct voicing — not just drop-2 inversions.
    const displayed = computeAllVoicings()[chordId];
    const cands = allDistinctVoicings(ch.quality, root);
    let startIdx = 0;
    if (displayed?.shape) {
      const match = cands.findIndex(c => c.shape.every((f, i) => f === displayed.shape[i]));
      if (match >= 0) startIdx = match;
    }
    if (isCycleKey && cands.length > 1) {
      startIdx = (startIdx + direction + cands.length) % cands.length;
    }
    _shortcutCycle = { chord: chordId, idx: startIdx, cands };
  }

  const picked = _shortcutCycle.cands[_shortcutCycle.idx];
  state.focusedChord = chordId;
  state.userVoicing = picked
    ? { shape: picked.shape, type: picked.type, stringSetIdx: picked.stringSetIdx, inversion: picked.inversion }
    : null;

  if (player.playing) {
    player.jumpTo(chordId);
  } else {
    renderAll();
    ringFocusedChord();
  }

  // Flash keypad button (after any re-render)
  const padBtn2 = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
  if (padBtn2) {
    padBtn2.classList.add('flash');
    setTimeout(() => padBtn2.classList.remove('flash'), 150);
  }
});

// Any non-keyboard focus change (clicking a card, AI moving) resets the cycle.
// We hook this by watching focusedChord transitions from other code paths.
const _origRenderAll = renderAll;
renderAll = function() {
  // If focused changed away from the cycle's chord by other means, drop the cycle
  if (_shortcutCycle.chord && state.focusedChord !== _shortcutCycle.chord) {
    _shortcutCycle = { chord: null, idx: 0, cands: [] };
  }
  return _origRenderAll.apply(this, arguments);
};

// ─── Startup randomizer ────────────────────────────────────────
// On each fresh page load, roll the default Chord Sound / Rhythm /
// Instrument view / BPM from the weighted distributions below.
// Voicing preference and Bass are intentionally left at their compile-
// time defaults ('all' / on) per the user's spec. No localStorage —
// every new session re-rolls.
(function rollStartupDefaults() {
  // Pick a key from a {value: weight} map. Weights are relative, no
  // need to sum to 100 — but we use percentages here for legibility.
  const pickWeighted = (map) => {
    const entries = Object.entries(map);
    const total = entries.reduce((a, [, w]) => a + w, 0);
    if (total <= 0) return entries[0][0];
    let r = Math.random() * total;
    for (const [k, w] of entries) {
      r -= w;
      if (r <= 0) return k;
    }
    return entries[entries.length - 1][0];
  };

  // 🎹 Chord Sound — instrument that plays the chords
  const soundPick = pickWeighted({
    rhodes:  5,
    piano:   60,
    jazzgtr: 15,
    pad:     10,
    organ:   10,
  });
  droneTimbre = soundPick;
  const sOpt = SOUND_OPTIONS.find(o => o.value === soundPick);
  if (sOpt && soundBtn && typeof _updateKeysIcon === 'function') {
    _updateKeysIcon();
  }

  // 🥁 Rhythm — drum/click pattern
  const rhythmPick = pickWeighted({
    ride:    50,
    drums:   15,
    twofour: 25,
    click:   5,
    off:     5,
  });
  applyRhythmMode(rhythmPick);

  // 🎸 Instrument view — guitar fretboard vs piano keyboard
  const instPick = pickWeighted({ guitar: 65, piano: 35 });
  setInstrument(instPick);

  // ⏱ BPM — first pick a range, then a uniform integer inside it
  const bpmRange = pickWeighted({
    '90-110':  30,
    '110-130': 40,
    '130-150': 20,
    '150-170': 10,
  });
  const [lo, hi] = bpmRange.split('-').map(Number);
  const bpm = lo + Math.floor(Math.random() * (hi - lo + 1));
  setBpm(bpm);
})();

renderAll();
// Initial placement of the now-playing card. App boots in compose
// mode, so the card belongs left of the chord map; without this it
// would sit stranded in .rb-area until the first state transition.
if (typeof relocatePlayerInfo === 'function') relocatePlayerInfo();
window.addEventListener('resize', () => {
  renderFretboard();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();
});

/* ─── MIDI Export ─── */

function _midiCollectComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    // Silent rests + ties — advance tick without emitting notes.
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = CHORD_MAP[state.tonality]?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    // Count consecutive ties after this cell
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    let notes;
    if (cell.shape && cell.shape.some(f => f >= 0)) {
      notes = cell.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
    } else {
      const rootPc = (state.keyPc + def.deg) % 12;
      const q = QUALITIES[def.quality];
      if (!q) { tick += barLen; continue; }
      notes = q.ints.map(i => 48 + rootPc + i);
    }
    const dur = barLen * bars;
    // Rhythm subdivisions: split the chord into N slot strikes within the
    // first bar (slot 0 = bar start). Muted slots emit nothing. The last
    // un-muted slot's note-off extends to the end of the full duration so
    // the chord rings through any tied bars instead of cutting on slot N-1.
    const subN = Math.max(1, cell.subdivisions || 1);
    const subMute = cell.subdivMute || [];
    const slotDur = Math.floor(barLen / subN);  // subdivisions live inside ONE bar
    let lastSlotStart = tick;
    for (let s = 0; s < subN; s++) {
      if (subMute[s]) continue;
      const slotStart = tick + s * slotDur;
      const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
      const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
      for (const n of notes) {
        events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
        events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
      }
      lastSlotStart = slotStart;
    }
    tick += dur;
  }
  return events;
}

function _midiCollectSong() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  if (!player.song || !player.song.length) return events;
  const homeKey = player._homeKey || { keyPc: state.keyPc, tonality: state.tonality };
  let prevShape = null;
  for (const section of player.song) {
    const secKey = section.keyPc ?? homeKey.keyPc;
    const secTon = section.tonality ?? homeKey.tonality;
    const vType  = section.voicingType || 'drop2';
    const prog   = section.progression;
    if (!prog || !prog.steps) continue;
    const repeats = section.repeats || 1;
    for (let r = 0; r < repeats; r++) {
      for (const step of prog.steps) {
        // Silent rest step — advance tick but emit no notes.
        if (step._silent) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        const def = CHORD_MAP[secTon]?.chordDefs?.[step.chord];
        if (!def) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        let notes;
        if (step.composedShape && step.composedShape.some(f => f >= 0)) {
          notes = step.composedShape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
          prevShape = step.composedShape;
        } else {
          const rootPc = (secKey + def.deg) % 12;
          const shape = player._pickShape(def.quality, rootPc, vType, prevShape);
          if (shape) {
            notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
            prevShape = shape;
          } else {
            const q = QUALITIES[def.quality];
            notes = q ? q.ints.map(i => 48 + rootPc + i) : null;
          }
        }
        const dur = ticksPerBeat * 4 * (step.bars || 1);
        if (notes && notes.length) {
          // Rhythm subdivisions: split into N slot strikes inside the bar.
          // Last un-muted slot extends to end of full duration so the chord
          // rings through tied bars instead of cutting on slot N-1.
          const barLen2 = ticksPerBeat * 4;
          const subN = Math.max(1, step.subdivisions || 1);
          const subMute = step.subdivMute || [];
          const slotDur = Math.floor(barLen2 / subN);
          for (let s = 0; s < subN; s++) {
            if (subMute[s]) continue;
            const slotStart = tick + s * slotDur;
            const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
            const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
            for (const n of notes) {
              events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
              events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
            }
          }
          tick += dur;
        }
      }
    }
  }
  return events;
}

function _buildMidiFile(events, label) {
  if (!events.length) return;
  const bpm = metronome.bpm || 120;
  const ticksPerBeat = 480;

  const buf = [];
  const w8  = (v) => buf.push(v & 0xff);
  const w16 = (v) => { w8(v >> 8); w8(v); };
  const w32 = (v) => { w16(v >> 16); w16(v); };
  const wStr = (s) => { for (let i = 0; i < s.length; i++) w8(s.charCodeAt(i)); };
  const wVLQ = (v) => {
    const bytes = [];
    bytes.push(v & 0x7f);
    v >>= 7;
    while (v > 0) { bytes.push((v & 0x7f) | 0x80); v >>= 7; }
    bytes.reverse().forEach(b => w8(b));
  };

  wStr('MThd'); w32(6); w16(0); w16(1); w16(ticksPerBeat);

  const trackBuf = [];
  const tw8  = (v) => trackBuf.push(v & 0xff);
  const twVLQ = (v) => {
    const bytes = [];
    bytes.push(v & 0x7f);
    v >>= 7;
    while (v > 0) { bytes.push((v & 0x7f) | 0x80); v >>= 7; }
    bytes.reverse().forEach(b => tw8(b));
  };

  const uspb = Math.round(60000000 / bpm);
  twVLQ(0); tw8(0xff); tw8(0x51); tw8(3);
  tw8((uspb >> 16) & 0xff); tw8((uspb >> 8) & 0xff); tw8(uspb & 0xff);

  const keyName = ROOTS[state.keyPc].name + ' ' + state.tonality + ' (' + label + ')';
  twVLQ(0); tw8(0xff); tw8(0x03); twVLQ(keyName.length);
  for (let i = 0; i < keyName.length; i++) tw8(keyName.charCodeAt(i));

  events.sort((a, b) => a.tick - b.tick || (a.type === 'off' ? -1 : 1));
  let lastTick = 0;
  for (const ev of events) {
    twVLQ(ev.tick - lastTick);
    lastTick = ev.tick;
    tw8(ev.type === 'on' ? 0x90 : 0x80);
    tw8(ev.note);
    tw8(ev.type === 'on' ? ev.vel : 0);
  }
  twVLQ(0); tw8(0xff); tw8(0x2f); tw8(0);

  wStr('MTrk'); w32(trackBuf.length);
  trackBuf.forEach(b => buf.push(b));

  const blob = new Blob([new Uint8Array(buf)], { type: 'audio/midi' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const keyStr = ROOTS[state.keyPc].name.replace('#', 's').replace('b', 'f');
  a.href = url;
  a.download = `guitarra-${keyStr}-${state.tonality}-${label}.mid`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Bass-only collectors: one root note per chord in bass register
function _midiCollectBassComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = CHORD_MAP[state.tonality]?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    const rootPc = (state.keyPc + def.deg) % 12;
    const note = bassMidiForPc(rootPc);
    const dur = barLen * bars;
    events.push({ tick, type: 'on', note, vel: 100 });
    events.push({ tick: tick + dur - 1, type: 'off', note, vel: 0 });
    tick += dur;
  }
  return events;
}

// Resolve state.songStructure → an actual letter sequence string.
// The literal value 'RANDOM' rolls a fresh non-rare structure each
// time it's called (so every new song gen gets a different shape),
// weighted by each entry's `weight` (default 1) so the canonical
// AABA / ABAB come up more often than the deeper cuts.
// Any other value is returned uppercased (default 'AABA').
function _resolveSongStructure(raw) {
  if (!raw) return 'AABA';
  if (raw === 'RANDOM') {
    const common = SONG_STRUCTURES.filter(s => !s.rare);
    if (!common.length) return 'AABA';
    const total = common.reduce((sum, s) => sum + (s.weight || 1), 0);
    let r = Math.random() * total;
    for (const s of common) {
      r -= (s.weight || 1);
      if (r <= 0) return s.id;
    }
    return common[common.length - 1].id;
  }
  return String(raw).toUpperCase();
}

// ── Song-structure picker (the SONG element in #player-info) ──
// Event delegation: #player-info re-renders every bar so binding
// directly to #pi-song-picker would lose the handler on the next tick.
let _songStructMenuEl = null;
function _closeSongStructMenu() {
  if (_songStructMenuEl) {
    _songStructMenuEl.remove();
    _songStructMenuEl = null;
  }
}
function _openSongStructMenu(anchor) {
  _closeSongStructMenu();
  const menu = document.createElement('div');
  menu.className = 'song-struct-menu';
  const current = state.songStructure || 'AABA';
  // "Random" entry at top — when picked, each song generation rolls
  // a fresh structure from the common pool (rare ones excluded).
  const randomItem = `
    <div class="ssm-item ${current === 'RANDOM' ? 'selected' : ''}" data-struct="RANDOM">
      <span class="ssm-label">↻ RANDOM</span>
      <span class="ssm-desc">Pick a common structure each new song</span>
    </div>
  `;
  const presetItems = SONG_STRUCTURES.map(s => {
    // Self-contained forms (BLUES, JAZZ_BLUES) display their id whole;
    // letter-sequence forms (AABA, ABAB, etc.) split letter-by-letter.
    const label = s.formType ? s.id.replace('_', ' ') : s.id.split('').join(' · ');
    return `
    <div class="ssm-item ${s.id === current ? 'selected' : ''}" data-struct="${s.id}">
      <span class="ssm-label">${label}${s.rare ? ' <span class="ssm-rare">rare</span>' : ''}</span>
      <span class="ssm-desc">${s.desc}</span>
    </div>
  `;
  }).join('');
  menu.innerHTML = randomItem + presetItems;
  // Position below the anchor element.
  document.body.appendChild(menu);
  const rect = anchor.getBoundingClientRect();
  menu.style.left = `${rect.left}px`;
  menu.style.top  = `${rect.bottom + 4 + window.scrollY}px`;
  // Click an item → set structure + regenerate song.
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[data-struct]');
    if (!item) return;
    const id = item.dataset.struct;
    state.songStructure = id;
    _closeSongStructMenu();
    // Regenerate the song with the new structure. If currently playing,
    // restart at section 0 so the new structure takes effect immediately.
    if (typeof player !== 'undefined' && player) {
      player.song = player._generateSong();
      player.songIdx = 0;
      player.sectionIter = 0;
      player.currentStepIdx = 0;
      if (typeof player._applySectionKey === 'function') player._applySectionKey();
      if (typeof renderAll === 'function') renderAll();
      if (player.playing && typeof player._updateVisuals === 'function') {
        player._updateVisuals();
      }
    }
  });
  _songStructMenuEl = menu;
}
// Delegated click listener — survives #player-info innerHTML rewrites.
document.addEventListener('click', (e) => {
  const songEl = e.target.closest('#pi-song-picker');
  if (songEl) {
    e.stopPropagation();
    if (_songStructMenuEl) _closeSongStructMenu();
    else _openSongStructMenu(songEl);
    return;
  }
  // Click outside the open menu → close it.
  if (_songStructMenuEl && !e.target.closest('.song-struct-menu')) {
    _closeSongStructMenu();
  }
});

// Show/hide MIDI wrap + manage menu
function _updateMidiBtn() {
  const wrap = document.getElementById('midi-wrap');
  if (!wrap) return;
  const hasComposed = state.composedProgression.length > 0;
  const hasSong = player.song && player.song.length > 0;
  wrap.style.display = (hasComposed || hasSong) ? '' : 'none';
}

const _midiMenu = document.getElementById('midi-menu');

function _closeMidiMenu() { _midiMenu.hidden = true; }

function _midiMenuBtn(label, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => { _closeMidiMenu(); fn(); };
  return b;
}

document.getElementById('midi-export').addEventListener('click', () => {
  const hasComposed = state.composedProgression.length > 0;
  const hasSong = player.song && player.song.length > 0;

  // Always show menu now (bass option means ≥2 choices)
  _midiMenu.innerHTML = '';
  if (hasComposed) {
    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — chords', () => _buildMidiFile(_midiCollectComposed(), 'composed')));
    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — bass only', () => _buildMidiFile(_midiCollectBassComposed(), 'composed-bass')));
  }
  if (hasSong) {
    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — chords', () => _buildMidiFile(_midiCollectSong(), 'song')));
    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — bass only', () => _buildMidiFile(_midiCollectBassSong(), 'song-bass')));
  }
  _midiMenu.hidden = false;
});

// Close menu on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.midi-wrap')) _closeMidiMenu();
});

const _origRenderComposeStrip = renderComposeStrip;
renderComposeStrip = function() {
  _origRenderComposeStrip.apply(this, arguments);
  _updateMidiBtn();
};

// Keypad toggle (desktop only — mobile always shows it)
document.getElementById('keypad-toggle').addEventListener('click', () => {
  document.body.classList.toggle('keypad-open');
});

// Register the shared service worker so this app installs / works offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('pwa/sw.js').catch(() => {});
}
</script>
