const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

const ROOTS = [
  {pc:0,name:'C',prefer:'sharp'},{pc:1,name:'Db',prefer:'flat'},{pc:2,name:'D',prefer:'sharp'},
  {pc:3,name:'Eb',prefer:'flat'},{pc:4,name:'E',prefer:'sharp'},{pc:5,name:'F',prefer:'flat'},
  {pc:6,name:'F#',prefer:'sharp'},{pc:7,name:'G',prefer:'sharp'},{pc:8,name:'Ab',prefer:'flat'},
  {pc:9,name:'A',prefer:'sharp'},{pc:10,name:'Bb',prefer:'flat'},{pc:11,name:'B',prefer:'sharp'},
];

const STRING_OPEN_MIDI = [40, 45, 50, 55, 59, 64];
const STRING_LABELS = ['E','A','D','G','B','E'];
const N_FRETS = 22;

const STRING_SETS = [
  {idx:[0,1,2,3], label:'EADG', sub:'low'},
  {idx:[1,2,3,4], label:'ADGB', sub:'mid'},
  {idx:[2,3,4,5], label:'DGBE', sub:'top'},
];

const QUALITIES = {
  'maj7':  {ints:[0,4,7,11],  degs:['R','3','5','7'],     sfx:'maj7'},
  '7':     {ints:[0,4,7,10],  degs:['R','3','5','b7'],    sfx:'7'},
  'm7':    {ints:[0,3,7,10],  degs:['R','b3','5','b7'],   sfx:'m7'},
  'm7b5':  {ints:[0,3,6,10],  degs:['R','b3','b5','b7'],  sfx:'ø'},
  'dim7':  {ints:[0,3,6,9],   degs:['R','b3','b5','bb7'], sfx:'°7'},
  'mMaj7': {ints:[0,3,7,11],  degs:['R','b3','5','7'],    sfx:'mMaj7'},
  '6':     {ints:[0,4,7,9],   degs:['R','3','5','6'],     sfx:'6'},
  'm6':    {ints:[0,3,7,9],   degs:['R','b3','5','6'],    sfx:'m6'},
  // Sus family — common in jazz comping and modern standards. Triads
  // (sus2 / sus4) lack a 3rd, so shells/guides will fall back to b7/3
  // approximations; triad mode handles them correctly.
  'sus4':  {ints:[0,5,7],     degs:['R','4','5'],         sfx:'sus4'},
  'sus2':  {ints:[0,2,7],     degs:['R','2','5'],         sfx:'sus2'},
  '7sus4': {ints:[0,5,7,10],  degs:['R','4','5','b7'],    sfx:'7sus4'},
  // ─── Extended / altered colors used by progressions via qualityOverride ───
  // These don't get their own chord-map nodes — they're picked per-step
  // by progressions that need a specific alteration on top of an existing
  // chord ID. E.g., bII7 with qualityOverride:'7#11' for Jobim bossa.
  '7#11':  {ints:[0,4,7,10,6],   degs:['R','3','5','b7','#11'],   sfx:'7#11'},   // Lydian dominant (Jobim, Wave)
  '9sus4': {ints:[0,5,7,10,2],   degs:['R','4','5','b7','9'],     sfx:'9sus4'},  // Maiden Voyage / quartal sus
  '7alt':  {ints:[0,4,6,10,1],   degs:['R','3','b5','b7','b9'],   sfx:'7alt'},   // Altered dom (b9, #11) — bebop standard
  'm9':    {ints:[0,3,7,10,2],   degs:['R','b3','5','b7','9'],    sfx:'m9'},     // Minor 9 (neo-soul, modal)
  'maj9':  {ints:[0,4,7,11,2],   degs:['R','3','5','7','9'],      sfx:'maj9'},   // Major 9 (bossa, neo-soul tonic)
};

// Resolve the effective quality for a chord step. A progression step
// can override the chord's canonical quality (e.g. play bII7 as 7#11
// in a Jobim bossa). The map card still shows the canonical version
// (bII7 = dom7); only the playback path uses the override. Returns
// the canonical quality if no override is given.
function effectiveQuality(step, chordDef) {
  if (step && step.qualityOverride && QUALITIES[step.qualityOverride]) {
    return step.qualityOverride;
  }
  return chordDef && chordDef.quality;
}

/* ─── CHORD MAP — tonic centered, approaches around ─── */

const CHORD_MAP = {
  major: {
    chordDefs: {
      // Diatonic
      'I':    {roman:'I',    deg:0,  quality:'maj7', tag:'tonic'},
      'ii':   {roman:'ii',   deg:2,  quality:'m7',   tag:'predom'},
      'iii':  {roman:'iii',  deg:4,  quality:'m7',   tag:'tonic'},
      'IV':   {roman:'IV',   deg:5,  quality:'maj7', tag:'predom'},
      'V':    {roman:'V',    deg:7,  quality:'7',    tag:'dom'},
      'vi':   {roman:'vi',   deg:9,  quality:'m7',   tag:'tonic'},
      'vii':  {roman:'viiø', deg:11, quality:'m7b5', tag:'dom'},     // diatonic leading-tone (functions as dom upper-structure)
      'V7sus':{roman:'V7sus',deg:7,  quality:'7sus4',tag:'dom'},     // suspended dom — common pre-V setup
      // Secondary dominants (in nodes). `sii` = the secondary ii that
      // forms the full ii–V of the target (vi acts as ii-of-V; Em7b5 is
      // the ii-of-ii). Used to draw / pop the "2" in front of the "5".
      'V_V':  {roman:'V/V',  deg:2,  quality:'7',    tag:'secondary', resolvesTo:'V',  sii:'vi'},
      'V_ii': {roman:'V/ii', deg:9,  quality:'7',    tag:'secondary', resolvesTo:'ii', sii:'iiø_ii'},
      // Borrowed / modal interchange (in nodes)
      'iv':   {roman:'iv',   deg:5,  quality:'m7',   tag:'borrowed',  borrowedFrom:'parallel minor'},
      'bVII': {roman:'bVII', deg:10, quality:'7',    tag:'borrowed',  borrowedFrom:'parallel minor'},
      // Tritone sub (in nodes)
      'bII7': {roman:'bII7', deg:1,  quality:'7',    tag:'borrowed',  resolvesTo:'I'},
      // ─── Pop-up only chord IDs (defined but NOT in nodes) ───
      // These don't show as map squares. Progressions can reference them;
      // the render layer pops a temporary card adjacent to their target
      // (resolvesTo) or near the tonic (borrowedFrom). Keeps the map clean
      // while letting progressions reach for the full functional palette.
      // Secondary dominants — completing the V/X family
      'V_iii':  {roman:'V/iii',  deg:11, quality:'7', tag:'secondary', resolvesTo:'iii',  popup:true, sii:'iiø_iii'},
      'V_IV':   {roman:'V/IV',   deg:0,  quality:'7', tag:'secondary', resolvesTo:'IV',   popup:true, sii:'ii_IV'},
      'V_vi':   {roman:'V/vi',   deg:4,  quality:'7', tag:'secondary', resolvesTo:'vi',   popup:true, sii:'vii'},
      'V_bVII': {roman:'V/bVII', deg:5,  quality:'7', tag:'secondary', resolvesTo:'bVII', popup:true},
      // Tritone subs of secondary dominants
      'bII7_V':   {roman:'bII7/V',   deg:8,  quality:'7', tag:'secondary', resolvesTo:'V',   popup:true},
      'bII7_ii':  {roman:'bII7/ii',  deg:3,  quality:'7', tag:'secondary', resolvesTo:'ii',  popup:true},
      'bII7_vi':  {roman:'bII7/vi',  deg:10, quality:'7', tag:'secondary', resolvesTo:'vi',  popup:true},
      // Modal interchange tonic substitutes (Coltrane changes, AATYA)
      'bIIImaj7':{roman:'bIIImaj7',deg:3,  quality:'maj7', tag:'borrowed', borrowedFrom:'parallel minor', popup:true},
      'bVImaj7': {roman:'bVImaj7', deg:8,  quality:'maj7', tag:'borrowed', borrowedFrom:'parallel minor', popup:true},
      // Major-key half-diminished ii (Stella opening, modal-minor borrow)
      'iiø':    {roman:'iiø',   deg:2,  quality:'m7b5', tag:'borrowed',  resolvesTo:'V', popup:true},
      // Secondary ii's — the "2" of a secondary ii–V. Popup-only and shown
      // ONLY chained in front of their secondary dominant (siiOf), never as
      // a standalone approach (no resolvesTo). Together with the V/X they
      // spell the full ii–V of a non-tonic degree.
      'iiø_ii':  {roman:'iiø/ii',  deg:4, quality:'m7b5', tag:'secondary', siiOf:'V_ii',  popup:true},
      'iiø_iii': {roman:'iiø/iii', deg:6, quality:'m7b5', tag:'secondary', siiOf:'V_iii', popup:true},
      'ii_IV':   {roman:'ii/IV',   deg:7, quality:'m7',   tag:'secondary', siiOf:'V_IV',  popup:true},
    },
    nodes: {
      // ── PREDOMINANT column (left, x=50) — descending-5ths chain reads top→bottom ──
      'n_iii':  {chord:'iii',  x:50,  y:30},
      'n_vi':   {chord:'vi',   x:50,  y:170},
      'n_ii':   {chord:'ii',   x:50,  y:310},
      'n_IV':   {chord:'IV',   x:50,  y:450},
      'n_bVII': {chord:'bVII', x:50,  y:600},
      // ── PREDOMINANT-area satellites (x=170, tucked right of their parent) ──
      'n_V_ii': {chord:'V_ii', x:170, y:325},   // sec dom of ii, sits right of ii
      'n_iv':   {chord:'iv',   x:170, y:465},   // borrowed iv, right of IV (same row)
      // ── DOMINANT column (middle, x=280) — moved right so the predom
      //    satellites at x=170 (right edge 262) don't collide with it ──
      'n_V':    {chord:'V',    x:280, y:450},
      'n_V_V':  {chord:'V_V',  x:280, y:325},   // sec dom of V, stacked above V
      'n_vii':  {chord:'vii',  x:280, y:200},   // diatonic vii° at top of dom column
      'n_V7sus':{chord:'V7sus',x:400, y:340},   // sus dom — sits above tonic, leads into V or I
      'n_bII7': {chord:'bII7', x:280, y:600},
      // ── TONIC (right) ──
      'n_I':    {chord:'I',    x:400, y:560, hub:true},
    },
    arrows: [
      // Predominant descending-5ths chain (straight down left column)
      {from:'n_iii', to:'n_vi'},
      {from:'n_vi',  to:'n_ii'},
      // Predoms → V (the push)
      {from:'n_ii',  to:'n_V'},
      {from:'n_IV',  to:'n_V'},
      // IV's alternate roles
      {from:'n_IV',  to:'n_ii', curve:-1},
      {from:'n_IV',  to:'n_I'},
      // V → I (the move)
      {from:'n_V',   to:'n_I'},
      // Deceptive V → vi (arches up-left around the predom column)
      {from:'n_V',   to:'n_vi', curve:-1},
      // iii's options
      {from:'n_iii', to:'n_IV'},                // stepwise neighbor
      {from:'n_iii', to:'n_V',  curve:1},       // long diagonal to dom
      // Borrowed iv path
      {from:'n_iv',  to:'n_I'},
      {from:'n_iv',  to:'n_bVII'},
      {from:'n_bVII',to:'n_I'},
      // Tritone sub
      {from:'n_bII7',to:'n_I'},
      // Secondaries to their targets
      {from:'n_V_V', to:'n_V'},
      {from:'n_V_ii',to:'n_ii'},
      // Secondary ii → its secondary V: vi acts as the "2" of V/V, so the
      // ii–V-of-V (Am7→D7) reads as a link between two permanent nodes.
      {from:'n_vi',  to:'n_V_V'},
      // vii° — diatonic leading-tone, resolves to I; IV → vii° is the classic Bach approach
      {from:'n_vii', to:'n_I'},
      {from:'n_IV',  to:'n_vii'},
      // V7sus — typically resolves to V or directly to I
      {from:'n_V7sus', to:'n_V'},
      {from:'n_V7sus', to:'n_I'},
      // I (hub) → outgoing diatonic options
      {from:'n_I',   to:'n_ii'},
      {from:'n_I',   to:'n_iii'},
      {from:'n_I',   to:'n_IV'},
      {from:'n_I',   to:'n_V'},
      {from:'n_I',   to:'n_vi'},
    ],
  },
  minor: {
    chordDefs: {
      'i':    {roman:'i',    deg:0,  quality:'m7',    tag:'tonic'},
      'iiø':  {roman:'iiø',  deg:2,  quality:'m7b5',  tag:'predom'},
      'bIII': {roman:'bIII', deg:3,  quality:'maj7',  tag:'tonic'},
      'iv':   {roman:'iv',   deg:5,  quality:'m7',    tag:'predom'},
      'V7':    {roman:'V7',    deg:7,  quality:'7',     tag:'dom'},
      'bVI':   {roman:'bVI',   deg:8,  quality:'maj7',  tag:'tonic'},
      'bVII':  {roman:'bVII',  deg:10, quality:'7',     tag:'dom'},
      // Extensions
      'bII7':  {roman:'bII7',  deg:1,  quality:'7',     tag:'borrowed', resolvesTo:'i'},     // Neapolitan / tritone sub of V7
      'V_iv':  {roman:'V/iv',  deg:0,  quality:'7',     tag:'secondary', resolvesTo:'iv'},   // secondary dom of iv
      'V_V':   {roman:'V/V',   deg:2,  quality:'7',     tag:'secondary', resolvesTo:'V7'},   // secondary dom of V7
      'I_pic': {roman:'I',     deg:0,  quality:'maj7',  tag:'borrowed', borrowedFrom:'parallel major'},   // Picardy major tonic
      'bIII7': {roman:'bIII7', deg:3,  quality:'7',     tag:'borrowed', resolvesTo:'bVI'},   // substitute dom
      'vii7':  {roman:'vii°7', deg:11, quality:'dim7',  tag:'borrowed', resolvesTo:'i'},     // harmonic-minor leading-tone dim
      'IV':    {roman:'IV',    deg:5,  quality:'maj7',  tag:'borrowed', borrowedFrom:'parallel major'},   // parallel-major IV
      'V7sus': {roman:'V7sus', deg:7,  quality:'7sus4', tag:'dom'},        // sus dom — common pre-V setup
      // ─── Pop-up only chord IDs in minor (no nodes) ───
      'V_bVI':   {roman:'V/bVI',   deg:3,  quality:'7', tag:'secondary', resolvesTo:'bVI',   popup:true},
      'V_bVII':  {roman:'V/bVII',  deg:5,  quality:'7', tag:'secondary', resolvesTo:'bVII',  popup:true},
      'V_bIII':  {roman:'V/bIII',  deg:10, quality:'7', tag:'secondary', resolvesTo:'bIII',  popup:true},
      'bII7_V':  {roman:'bII7/V',  deg:8,  quality:'7', tag:'secondary', resolvesTo:'V7',    popup:true},
    },
    nodes: {

function intervalColor(label) {
  const map = {'R':'i-R','b2':'i-b2','2':'i-2','b3':'i-b3','3':'i-3','4':'i-4','b5':'i-b5',
    '5':'i-5','b6':'i-b6','#5':'i-s5','6':'i-6','b7':'i-b7','7':'i-7','bb7':'i-6',
    'b9':'i-b9','9':'i-9','#9':'i-s9','11':'i-11','#11':'i-s11','13':'i-13','b13':'i-b13'};

}

function noteAt(s, f) { return (STRING_OPEN_MIDI[s] + f) % 12; }
function nameOf(pc, useFlats) { return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc]; }
function useFlatsFor(pc) { return ROOTS[pc].prefer === 'flat'; }

/* ─── Drop-2 generator ─── */

function dropTwoVoicing(quality, rootPc, stringSetIdx, inversion) {
  const q = QUALITIES[quality];
  if (!q || q.ints.length !== 4) return null;
  let close = [...q.ints];
  for (let i = 0; i < inversion; i++) {
    close = [close[1], close[2], close[3], close[0] + 12];
  }
  const dropped = [close[0], close[1], close[2] - 12, close[3]].sort((a, b) => a - b);
  const set = STRING_SETS[stringSetIdx].idx;
  for (let oct = 24; oct <= 84; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = dropped.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

/* ─── Drop-3 voicing ───
   Same idea as drop-2 but we drop the 3rd voice from the TOP (not the
   2nd) by an octave — producing a wider chord with an extra-spread
   bass note. On guitar this still fits on adjacent 4-string sets
   (the wider gap shows up as a 7- to 8-fret span). Drop-3 is the
   "missing link" between shells (3-note, dense) and drop-2 (4-note,
   compact): same chord-tone subset, more space, more bass presence.

   References: Randy Vincent "Three-Note Voicings and Beyond", Jens
   Larsen's voicing chain (shell → drop-3 → triad → drop-2).
*/
// Drop-3 on guitar uses SKIPPED-STRING sets, not adjacent ones —
// the skipped string between the bass and the upper voices gives
// drop-3 its characteristic "wide bass" sound. With adjacent strings
// it would just be a drop-2-ish inversion in disguise.
// Two canonical guitar drop-3 sets: bass on 6 (skip 5), bass on 5 (skip 4).
const DROP3_STRING_SETS = [
  {idx: [0, 2, 3, 4], label: 'E-DGB', sub: 'low'},   // E low, skip A, then D-G-B
  {idx: [1, 3, 4, 5], label: 'A-GBe', sub: 'mid'},   // A low, skip D, then G-B-e
  {idx: [0, 3, 4, 5], label: 'E-GBe', sub: 'spread'},// E low, skip A+D, then G-B-e (widest)
];

function dropThreeVoicing(quality, rootPc, stringSetIdx, inversion) {
  const q = QUALITIES[quality];
  if (!q || q.ints.length !== 4) return null;
  let close = [...q.ints];
  for (let i = 0; i < inversion; i++) {
    close = [close[1], close[2], close[3], close[0] + 12];
  }
  // Drop the 3rd voice from the top (close[1]) down an octave.
  const dropped = [close[0], close[1] - 12, close[2], close[3]].sort((a, b) => a - b);
  const setDef = DROP3_STRING_SETS[stringSetIdx];
  if (!setDef) return null;
  const set = setDef.idx;
  for (let oct = 24; oct <= 84; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = dropped.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

/* ─── Barre chord voicings ───
   Full barre shapes (5-6 strings) typical of rock rhythm guitar and
   Freddie Green-style jazz rhythm. Two main shapes per quality:
     E-shape: bass root on 6th string (low E), index finger barres
              all 6 strings at the root fret.
     A-shape: bass root on 5th string (A), low E muted, index barres
              5 strings starting from A.
   Patterns are relative offsets from the barre fret. Returns null
   for qualities that don't have a clean barre form.
*/
const BARRE_PATTERNS_E = {
  // [low E, A, D, G, B, e] — frets relative to barre position (0 = barre fret).
  // Verified against open-position E-shape chords (X=0):
  //   E major:  E-B-E-G#-B-E = R-5-R-3-5-R
  //   Em:       E-B-E-G-B-E  = R-5-R-b3-5-R
  //   E7:       E-B-D-G#-B-E = R-5-b7-3-5-R
  //   Emaj7:    E-B-D#-G#-B-E = R-5-7-3-5-R
  //   Em7:      E-B-D-G-B-E  = R-5-b7-b3-5-R
  //   Em7b5:    E-Bb-D-G-x-E = R-b5-b7-b3-x-R (B string muted: would clash)
  'maj7':  [0, 2, 1, 1, 0, 0],
  'm7':    [0, 2, 0, 0, 0, 0],
  '7':     [0, 2, 0, 1, 0, 0],
  'm7b5':  [0, 1, 0, 0, -1, 0],   // FIXED — A=Bb (b5), B muted
  'mMaj7': [0, 2, 1, 0, 0, 0],
  '6':     [0, 2, 2, 1, 2, 0],
  'm6':    [0, 2, 2, 0, 2, 0],
  '7sus4': [0, 2, 0, 2, 0, 0],
  'sus4':  [0, 2, 2, 2, 0, 0],
  'sus2':  [0, -1, 4, -1, 0, 0],  // FIXED — D string fret 4 = F# (2 of E); A/G muted
  // dim7 omitted: symmetric chord with no canonical barre form
};
const BARRE_PATTERNS_A = {
  // [low E, A, D, G, B, e] — low E muted, A is the root.
  // Verified against open-position A-shape chords (X=0):
  //   A major:  x-A-E-A-C#-E = R-5-R-3-5
  //   Am:       x-A-E-A-C-E  = R-5-R-b3-5
  //   A7:       x-A-E-G-C#-E = R-5-b7-3-5
  //   Amaj7:    x-A-E-G#-C#-E = R-5-7-3-5
  //   Am7:      x-A-E-G-C-E  = R-5-b7-b3-5
  //   Am7b5:    x-A-Eb-G-C-x = R-b5-b7-b3-x
  'maj7':  [-1, 0, 2, 1, 2, 0],
  'm7':    [-1, 0, 2, 0, 1, 0],
  '7':     [-1, 0, 2, 0, 2, 0],
  'm7b5':  [-1, 0, 1, 0, 1, -1],
  'mMaj7': [-1, 0, 2, 1, 1, 0],
  '6':     [-1, 0, 2, 2, 2, 2],
  'm6':    [-1, 0, 2, 2, 1, 2],
  '7sus4': [-1, 0, 2, 0, 3, 0],
  'sus4':  [-1, 0, 2, 2, 3, 0],
  'sus2':  [-1, 0, 2, 2, 0, 0],
  // dim7 omitted: symmetric chord with no canonical barre form
};

/* ─── Triad barre patterns (no 7th) ───
   Pop/rock/folk rarely uses 7th chords even when the harmony "is"
   a 7th. A vi-IV-I-V played as plain triads is overwhelmingly more
   common than as m7-maj7-maj7-7. These patterns let the strum family
   offer the triad as an additional candidate alongside the 7th shape;
   the picker decides which fits best by voice-leading + register.

   Substitution map (which 7th-qualities can drop their 7th):
     maj7 / 7 / 6        → major triad (E-B-E-G#-B-E open / A-E-A-C#-E)
     m7 / m6 / mMaj7     → minor triad (E-B-E-G-B-E open / A-E-A-C-E)
   NOT substituted: m7b5 (b5 is identity), sus / 7sus (sus is identity),
                    dim / dim7 (symmetric, no barre form anyway).
*/
const BARRE_TRIAD_PATTERNS_E = {
  'maj': [0, 2, 2, 1, 0, 0],   // R-5-R-3-5-R
  'm':   [0, 2, 2, 0, 0, 0],   // R-5-R-b3-5-R
};
const BARRE_TRIAD_PATTERNS_A = {
  'maj': [-1, 0, 2, 2, 2, 0],  // x-R-5-R-3-5
  'm':   [-1, 0, 2, 2, 1, 0],  // x-R-5-R-b3-5
};
// Which triadic flavor a 7th quality reduces to. Null = no substitution.
const TRIAD_SUB_FOR = {
  'maj7':  'maj',
  '7':     'maj',
  '6':     'maj',
  'm7':    'm',
  'm6':    'm',
  'mMaj7': 'm',
};

function barreVoicing(quality, rootPc, type = 'E', variant = 'seventh') {
  const isTriad = variant === 'triad';
  let pattern;
  if (isTriad) {
    const tQ = TRIAD_SUB_FOR[quality];
    if (!tQ) return null;
    pattern = type === 'A' ? BARRE_TRIAD_PATTERNS_A[tQ] : BARRE_TRIAD_PATTERNS_E[tQ];
  } else {
    pattern = type === 'A' ? BARRE_PATTERNS_A[quality] : BARRE_PATTERNS_E[quality];
  }
  if (!pattern) return null;
  // Compute barre fret to land the root at rootPc.
  //   E-shape: root on low E (open midi 40 = E2, pc 4). Fret = (rootPc - 4 + 12) % 12.
  //   A-shape: root on A   (open midi 45 = A2, pc 9). Fret = (rootPc - 9 + 12) % 12.
  let barreFret;
  if (type === 'E') {
    barreFret = (rootPc - 4 + 12) % 12;
  } else {
    barreFret = (rootPc - 9 + 12) % 12;
  }
  if (barreFret === 0) barreFret = 12;  // avoid open chords (not movable barres)
  const shape = pattern.map(p => p === -1 ? -1 : barreFret + p);
  // Reject if any fretted note ends up out of range.
  if (shape.some(f => f !== -1 && (f < 1 || f > N_FRETS))) return null;
  return shape;
}

/* ─── Open "cowboy" chords ───
   First-position shapes mixing open and fretted strings. Only exist
   for roots in {E, A, D, G, C} and a limited set of qualities (no
   m7b5, no dim, no altered dominants — those need a barre). Stored
   as absolute fret arrays (no transposition) because they ARE the
   open position. Keyed by rootPc → quality → [low E, A, D, G, B, e].
*/
const OPEN_CHORDS = {
  4: {  // E
    'maj': [0, 2, 2, 1, 0, 0],
    'm':   [0, 2, 2, 0, 0, 0],
    '7':   [0, 2, 0, 1, 0, 0],
    'm7':  [0, 2, 0, 0, 0, 0],
  },
  9: {  // A
    'maj':  [-1, 0, 2, 2, 2, 0],
    'm':    [-1, 0, 2, 2, 1, 0],
    '7':    [-1, 0, 2, 0, 2, 0],
    'm7':   [-1, 0, 2, 0, 1, 0],
    'maj7': [-1, 0, 2, 1, 2, 0],
  },
  2: {  // D
    'maj':  [-1, -1, 0, 2, 3, 2],
    'm':    [-1, -1, 0, 2, 3, 1],
    '7':    [-1, -1, 0, 2, 1, 2],
    'm7':   [-1, -1, 0, 2, 1, 1],
    'maj7': [-1, -1, 0, 2, 2, 2],
  },
  7: {  // G
    'maj':  [3, 2, 0, 0, 0, 3],
    '7':    [3, 2, 0, 0, 0, 1],
    'maj7': [3, 2, 0, 0, 0, 2],
  },
  0: {  // C
    'maj':  [-1, 3, 2, 0, 1, 0],
    '7':    [-1, 3, 2, 3, 1, 0],
    'maj7': [-1, 3, 2, 0, 0, 0],
  },
};
// Map fancier qualities to their natural triadic open equivalent. Lets
// a Cmaj7-context fall back to open C if Cmaj7 has no open shape, etc.
const OPEN_QUALITY_FALLBACK = {
  '6':     'maj',
  'mMaj7': 'm',
  'm6':    'm',
};
function openVoicing(quality, rootPc) {
  const bag = OPEN_CHORDS[rootPc];
  if (!bag) return null;
  if (bag[quality]) return bag[quality].slice();
  const fallback = OPEN_QUALITY_FALLBACK[quality];
  if (fallback && bag[fallback]) return bag[fallback].slice();
  return null;
}

/* ─── Power chords (R-5-R) ───
   Three-note movable shapes — typical rock/metal "no-third" voicing.
   Two stringSet forms: E-shape (root on low E) and A-shape (root on A).
   Mode-agnostic: works for any quality that contains a perfect 5th.
   Rejected qualities: m7b5 (b5), dim, dim7 (b5), and chords that need
   the 3rd or 7th to keep identity (handled via POWER_OK below).
*/
const POWER_PATTERN_E = [0, 2, 2, -1, -1, -1];   // low E + A + D (R-5-R)
const POWER_PATTERN_A = [-1, 0, 2, 2, -1, -1];   // A + D + G       (R-5-R)
// Qualities that have a perfect 5 and survive being stripped to R-5-R.
// V7 included because rock V7 routinely plays as power; jazz V7 will
// reject power via the genre bias (not the geometry).
const POWER_OK = new Set([
  'maj', 'm', '7', 'maj7', 'm7', 'mMaj7', '6', 'm6',
]);
function powerVoicing(quality, rootPc, type = 'E') {
  if (!POWER_OK.has(quality)) return null;
  const pattern = type === 'A' ? POWER_PATTERN_A : POWER_PATTERN_E;
  let baseFret;
  if (type === 'E') baseFret = (rootPc - 4 + 12) % 12;
  else              baseFret = (rootPc - 9 + 12) % 12;
  if (baseFret === 0) baseFret = 12;
  const shape = pattern.map(p => p === -1 ? -1 : baseFret + p);
  if (shape.some(f => f !== -1 && (f < 1 || f > N_FRETS))) return null;
  return shape;
}

/* ─── Sus voicings ───
   Substitution voicing: rebuild any chord as a 4-note 7sus4 (R-4-5-7).
   The 3rd gets replaced by the 4th, the 7th is preserved (or defaults to b7
   if the quality is pure-triad). Useful as a practice mode — the user can
   drill the whole progression in suspended voicings without changing chord
   identities in the map.
*/
function susVoicing(quality, rootPc, stringSetIdx, inversion) {
  const q = QUALITIES[quality];
  if (!q) return null;
  // Pick a 7th: prefer maj7 → b7 → 6 → fallback b7
  let seventh = 10;
  if (q.ints.includes(11)) seventh = 11;
  else if (q.ints.includes(10)) seventh = 10;
  else if (q.ints.includes(9))  seventh = 9;
  // Sus seventh intervals: Root, 4th, 5th, 7th
  const susInts = [0, 5, 7, seventh];
  let close = [...susInts];
  for (let i = 0; i < inversion; i++) {
    close = [close[1], close[2], close[3], close[0] + 12];
  }
  const dropped = [close[0], close[1], close[2] - 12, close[3]].sort((a, b) => a - b);
  const set = STRING_SETS[stringSetIdx].idx;
  for (let oct = 24; oct <= 84; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = dropped.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function totalVoiceMovement(shapeA, shapeB) {
  let total = 0;
  for (let s = 0; s < 6; s++) {
    if (shapeA[s] >= 0 && shapeB[s] >= 0) total += Math.abs(shapeA[s] - shapeB[s]);
  }
  return total;
}

function avgFret(shape) {
  const fs = shape.filter(f => f >= 0);
  return fs.length ? fs.reduce((a,b)=>a+b,0) / fs.length : 0;
}

/* ─── Guitar playability filter ───
   Validate a generated shape against ergonomic constraints:
   - Fretted-note span ≤ 5 frets (≤6 in upper register where fingers
     are physically closer).
   - No mixing open strings with frets above 7 (jumping between nut
     and a hand position 7+ frets up is awkward).
   - Highest fret ≤ 17 (above that, comping voicings cease to be
     useful — they're soloing register).

   Returns true if the shape is realistically playable on guitar.
   Gated by instrument: piano mode bypasses the check (no frets,
   any note combination is valid). */
function isPlayableShape(shape) {
  if (!shape) return false;
  const frets = shape.filter(f => f >= 0);
  if (frets.length < 2) return true;     // single-note or empty: trivially OK
  const fretted = frets.filter(f => f > 0);
  const hasOpen = frets.some(f => f === 0);
  if (fretted.length) {
    const minF = Math.min(...fretted);
    const maxF = Math.max(...fretted);
    const span = maxF - minF;
    // Upper-register fingers are closer together — allow one more
    // fret of span past the 9th position.
    const spanLimit = minF >= 9 ? 6 : 5;
    if (span > spanLimit) return false;
    if (maxF > 17) return false;
    // Open string + a fingered fret far up the neck = ergonomic
    // nightmare (would need to mute the open while reaching up).
    if (hasOpen && maxF > 7) return false;
  }
  // ── Isolated-bass check ──
  // Adjacent sounding strings shouldn't be far apart in fret position
  // when there are muted strings between them. Example C7 drop-3
  // "spread" set [8, -1, -1, 3, 5, 3]: low-E at fret 8, then 2 muted
  // strings, then the cluster at 3-5. Technically span=5 (passes
  // above), but the player has to barre fret 3 with the index AND
  // stretch the pinky to fret 8 across two muted strings — ugly and
  // nobody plays it. Walk the sounding strings in string-order and
  // reject if any two adjacent ones differ by > 3 frets while they
  // have muted strings between them.
  const sounding = [];
  for (let s = 0; s < 6; s++) {
    if (shape[s] >= 0) sounding.push({ s, f: shape[s] });
  }
  for (let i = 1; i < sounding.length; i++) {
    const a = sounding[i - 1], b = sounding[i];
    const stringGap = b.s - a.s;        // # of strings between (1 = adjacent)
    const fretGap   = Math.abs(b.f - a.f);
    // Tolerate big fret leaps only when the strings are adjacent
    // (typical drop-2 / E-shape voicings). With muted strings between,
    // the hand can't comfortably split — cap the leap at 3.
    if (stringGap >= 2 && fretGap > 3) return false;
  }
  return true;
}

function smoothestVoicing(quality, rootPc, sourceShape) {
  // Score = voice-movement + register-cost
  // Sweet spot: avg fret 5–9 (comping range). Outside that, cost grows.
  let best = null;
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!sh) continue;
      const m = totalVoiceMovement(sourceShape, sh);
      const af = avgFret(sh);
      const target = 7;
      const reg = Math.abs(af - target);
      const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
      // Prefer mid (5432) + top (4321) sets over low (6543) for comping clarity
      const setPref = ss === 0 ? 3 : 0;
      const score = m + registerCost + setPref;
      if (!best || score < best.score) best = {shape: sh, stringSetIdx: ss, inversion: inv, movement: m, score};
    }
  }
  return best;
}

function bestStartingVoicing(quality, rootPc) {
  // Single source of truth: use the master catalog + the same
  // pickByStrategy that composeAddChord runs (with no prevShape),
  // so the map's focused-chord card matches what actually plays
  // when the user clicks it as the first chord of a progression.
  const cands = (typeof allDistinctVoicings === 'function')
    ? allDistinctVoicings(quality, rootPc)
    : [];
  if (!cands.length) return null;
  const idx = pickByStrategy(cands, null);
  const c = cands[idx];
  return {
    shape: c.shape,
    type: c.type,
    stringSetIdx: c.stringSetIdx,
    inversion: c.inversion,
    stringSet: c.stringSet,
  };
}

/* ─── Alt voicing types: triad, shell ─── */

// Triad (R, 3rd or b3rd, 5th or b5th) — no 7th
function triadVoicing(quality, rootPc, stringSetType = 'top', inversion = 0) {
  const q = QUALITIES[quality];
  if (!q || q.ints.length < 3) return null;
  // First three chord tones = R, 3 (or b3), 5 (or b5).
  // Apply inversion by rotating: root pos = [R, 3, 5]; 1st inv = [3, 5, R+12];
  // 2nd inv = [5, R+12, 3+12]. Same logic as drop voicings, just 3 voices.
  let ints = [q.ints[0], q.ints[1], q.ints[2]];
  for (let i = 0; i < inversion; i++) {
    ints = [ints[1], ints[2], ints[0] + 12];
  }
  // Three-string sets to choose from
  const sets = {
    'top':  [3, 4, 5],   // G-B-E
    'mid':  [2, 3, 4],   // D-G-B
    'low':  [1, 2, 3],   // A-D-G
  };
  const set = sets[stringSetType] || sets.top;
  for (let oct = 24; oct <= 72; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = ints.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

// Shell voicing: R (low) + 7 (or b7) + 3 (or b3) — classic jazz comping
// Guide-tone duo: the 3rd and 7th only — literally a shell without the root.
// Mirrors shellVoicing's string sets minus the root string.
// Returns a single best shape (picker handles voice-leading across calls).
function guideToneVoicing(quality, rootPc, type = 'A') {
  const q = QUALITIES[quality];
  if (!q) return null;
  const ints = q.ints;
  const seventhInt = ints.includes(11) ? 11 : ints.includes(10) ? 10 : ints.includes(9) ? 9 : 10;
  const thirdInt   = ints.includes(4)  ? 4  : ints.includes(3)  ? 3  : 4;
  // Pitches ascending: 7 (below), 3+12 (above) — same arrangement as the shell's
  // upper two voices.
  const intervals = [seventhInt, thirdInt + 12];
  // Type A: 7 on D string, 3 on G string  (the upper two strings of shell A)
  // Type B: 7 on G string, 3 on B string  (the upper two strings of shell B)
  const strings = type === 'A' ? [2, 3] : [3, 4];
  for (let oct = 24; oct <= 60; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = intervals.map(s => rootMidi + s);
    const frets = strings.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      strings.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function shellVoicing(quality, rootPc, type = 'A') {
  const q = QUALITIES[quality];
  if (!q) return null;
  // Find the 7th and 3rd intervals from chord tones
  const ints = q.ints;
  let seventhInt = null;
  if (ints.includes(11)) seventhInt = 11;
  else if (ints.includes(10)) seventhInt = 10;
  else if (ints.includes(9))  seventhInt = 9;
  else seventhInt = 10; // fallback to b7
  let thirdInt = null;
  if (ints.includes(4)) thirdInt = 4;
  else if (ints.includes(3)) thirdInt = 3;
  else thirdInt = 4;
  // Shells are inherently a root-on-bottom idiom — rotating the voicing
  // (7 or 3 in the bass) forces awkward fret spans on guitar, so we stick
  // to root-position. Variety comes from the string-set choice instead.
  const intervals = [0, seventhInt, thirdInt + 12];
  // Type A: R on 6th string, 7 on 4th, 3 on 3rd (skip 5th string)
  // Type B: R on 5th string, 7 on 3rd, 3 on 2nd
  const strings = type === 'A' ? [0, 2, 3] : [1, 3, 4];
  for (let oct = 24; oct <= 60; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = intervals.map(s => rootMidi + s);
    const frets = strings.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      strings.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */

const state = {
  keyPc: 0,
  tonality: 'major',
  instrument: 'guitar',     // 'guitar' | 'piano' — swaps chord neck for piano keyboard
  display: 'notes',
  focusedChord: 'I',
  userVoicing: null,
  playerVoicing: null,  // {chord, shape, type} — currently playing
  nextVoicing: null,    // {chord, shape, type} — predicted upcoming
  // chordId → {shape, type} for chords that have played in the current progression.
  // Used so each chord card shows the voicing it will actually be played in.
  progressionVoicings: {},
  // Composed progression: user-typed sequence of {chord, inversion}. When non-empty
  // and AI starts playing, this overrides the AI's random progression generation —
  // the player just loops the typed sequence.
  composedProgression: [],
  // Index of the currently SELECTED compose cell (orange highlight). When set,
  // adding a chord / cycling inversions / Backspace target this cell instead
  // of appending to the end. null = append mode (default).
  composedSelectedIdx: null,
  // Strategy used by the "auto" card and by composeAddChord's default pick.
  // Cycles via the auto card click: smoothest → low → high → random → ...
  autoStrategy: 'smoothest',
  // Song structure preset — sequence of section labels. Default is
  // RANDOM, which rolls a fresh common structure (AABA / ABAB / AABB
  // / ABA) on every song generation. User can lock to a specific
  // structure (or pick a rare one) via the SONG picker in #player-info.
  songStructure: 'RANDOM',
};

// Available song structure presets shown in the SONG picker menu.
// Each id IS the letter sequence — _generateSong splits it character
// by character to assemble the section order. The `rare` flag marks
// structures that the RANDOM option skips. The `weight` field biases
// the RANDOM picker — higher = more likely to roll (default 1).
const SONG_STRUCTURES = [
  { id: 'AABA',   desc: 'Jazz standard — bridge in 3rd position',         weight: 4 },
  { id: 'ABAB',   desc: 'Verse / chorus alternation',                     weight: 4 },
  { id: 'ABABCB', desc: 'Verse · chorus · bridge · chorus (pop form)',    weight: 2 },
  { id: 'AABB',   desc: 'Two pairs',                                       weight: 1 },
  { id: 'ABA',    desc: 'Short ternary',                                   weight: 1 },
  // Self-contained forms — the entire song IS the progression, cycled.
  // No A/B/C sections; just loops a blues form. The `formType` tag
  // tells _generateSong to bypass the AABA assembly and pick a single
  // pinned progression from the matching role.
  { id: 'BLUES',     desc: '12-bar blues — cycles',                weight: 2, formType: 'blues' },
  { id: 'JAZZ_BLUES',desc: 'Bebop blues w/ ii-V subs — cycles',    weight: 1, formType: 'jazz-blues' },
  { id: 'AABACA', desc: 'AABA with a C interlude before the last A',      rare: true },
  { id: 'ABAC',   desc: 'AB with a fresh ending',                          rare: true },
  { id: 'ABBA',   desc: 'Bridge sandwich',                                 rare: true },
  { id: 'ABCA',   desc: 'Three sections, return to A',                     rare: true },
  { id: 'ABCB',   desc: 'Rondo-ish — B comes back last',                   rare: true },
  { id: 'ABACA',  desc: 'Rondo',                                            rare: true },
  { id: 'ABCD',   desc: 'Through-composed — no repeats',                    rare: true },
];

function currentMap() { return CHORD_MAP[state.tonality]; }

function chordRoot(chord) { return (state.keyPc + chord.deg) % 12; }

function focusedChord() {
  const map = currentMap();
  const ch = map.chordDefs[state.focusedChord];
  return {id: state.focusedChord, ...ch};
}

function focusedShape() {
  const fc = focusedChord();
  const root = chordRoot(fc);
  if (state.userVoicing) {
    // If the user voicing carries a raw shape (shells/triads/AI voicings), use it directly.
    if (state.userVoicing.shape) {
      // If `type` (and friends) weren't passed in, derive them from
      // the master catalog so the info bar can label the voicing
      // correctly — otherwise it would fall back to "DROP-2" for
      // every chord clicked from a compose cell.
      const out = { shape: state.userVoicing.shape, ...state.userVoicing };
      if (!out.type && fc && typeof allDistinctVoicings === 'function') {
        const cands = allDistinctVoicings(fc.quality, root, { allShapes: true });
        const match = cands.find(c => c.shape.every((f, i) => f === out.shape[i]));
        if (match) {
          out.type         = match.type;
          out.stringSetIdx = match.stringSetIdx;
          out.inversion    = match.inversion;
          out.stringSet    = match.stringSet;
        }
      }
      return out;
    }
    return {
      shape: dropTwoVoicing(fc.quality, root, state.userVoicing.stringSetIdx, state.userVoicing.inversion),
      ...state.userVoicing,
    };
  }
  // If the AI is currently playing this chord with a specific voicing, show that one
  if (state.playerVoicing && state.playerVoicing.chord === state.focusedChord && state.playerVoicing.shape) {
    return { shape: state.playerVoicing.shape, type: state.playerVoicing.type };
  }
  // Default: register-aware musical voicing.
  // Propagate the FULL voicing metadata (type + stringSet/idx) so the
  // green info bar can label it correctly — without `type`, the
  // fallback used to say "DROP-2" for every chord, even when the
  // pick was actually a shell / triad / drop-3.
  const v = bestStartingVoicing(fc.quality, root);
  if (v) {
    return {
      shape: v.shape,
      type: v.type,
      stringSetIdx: v.stringSetIdx,
      inversion: v.inversion,
      stringSet: v.stringSet,
    };
  }
  return {
    shape: dropTwoVoicing(fc.quality, root, 2, 0),
    type: 'drop2',
    stringSetIdx: 2,
    inversion: 0,
  };
}

function computeAllVoicings() {
  const map = currentMap();
  const focused = focusedChord();
  const focShape = focusedShape();
  const result = {};
  result[focused.id] = {...focShape, movement: 0};

  for (const id in map.chordDefs) {
    if (id === focused.id) continue;
    // 1. AI's predicted next-up voicing wins (most accurate)
    if (state.nextVoicing && state.nextVoicing.chord === id && state.nextVoicing.shape) {
      result[id] = { shape: state.nextVoicing.shape, type: state.nextVoicing.type };
      continue;
    }
    // 2. Cached voicing from this run of the progression — keeps each played
    //    chord's card showing the position it'll be in next time it comes around
    if (state.progressionVoicings[id]) {
      result[id] = state.progressionVoicings[id];
      continue;
    }
    // 3. Predict using the SAME picker the player / compose code would
    //    use, so the card visually matches what'll sound on click.
    //    During AI playback we honor the section's voicingType. Idle:
    //    we run pickByStrategy with the same prev-shape that
    //    composeAddChord will see (last compose cell, or null when
    //    the compose is empty) so the pick is identical.
    const ch = map.chordDefs[id];
    const r = chordRoot(ch);
    if (player && player.playing) {
      let sh = player._pickShape(ch.quality, r, player.voicingType, focShape.shape);
      if (!sh) sh = player._pickShape(ch.quality, r, 'drop2', focShape.shape);
      result[id] = sh ? { shape: sh, type: player.voicingType } : null;
    } else {
      const cands = allDistinctVoicings(ch.quality, r);
      if (cands.length) {
        // Mirror composeAddChord's prev-shape: last cell's shape if
        // compose has content, otherwise null (first chord).
        const seq = state.composedProgression;
        const lastCell = seq && seq.length ? seq[seq.length - 1] : null;
        const prevForPicker = lastCell && lastCell.shape ? lastCell.shape : null;
        const idx = pickByStrategy(cands, prevForPicker);
        const c = cands[idx];
        result[id] = { shape: c.shape, type: c.type, stringSetIdx: c.stringSetIdx, inversion: c.inversion, stringSet: c.stringSet };
      } else {
        result[id] = smoothestVoicing(ch.quality, r, focShape.shape);
      }
    }
  }
  return result;
}

/* ════════════════════════════════════════════════════════════
   MINI FRETBOARD (with inlays)
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   Clef glyphs — italic letters G (treble = G clef, anchors G4)
   and F (bass = F clef, anchors F3). Cleaner and instantly readable
   at any cell size on any device, no Unicode-font surprises.
   ════════════════════════════════════════════════════════════ */
// Continuation-bar staff: same grand-staff geometry as renderChordStaff but
// no notes — just an empty staff plus a simile sign (the slash + two dots
// you see in Real Books meaning "play the previous measure again"). Lets
// the partitura read continuously across multi-bar chords without
// retriggering the audio.
function renderContinuationStaff(sizing) {
  const W = sizing?.W || 100;
  const H = sizing?.H || 130;
  const showClef = sizing?.showClef !== false;
  const clefW = showClef ? 22 : 3;
  const labelH = sizing?.minimal ? 14 : 26;
  const padTop = labelH;
  const padBot = sizing?.minimal ? 7 : 9;
  const gapY = 2;
  const lineSp = (H - padTop - padBot) / (8 + gapY);
  const trebleTopY = padTop;
  const trebleBotY = trebleTopY + 4 * lineSp;
  const bassTopY   = trebleBotY + lineSp * gapY;
  const bassBotY   = bassTopY + 4 * lineSp;
  const middleCY   = trebleBotY + lineSp;
  // Staff lines run all the way to the left edge; the clef glyph overlays
  // them (classical engraving). This keeps the clef visually inside the
  // staff instead of pushing it into its own left margin.
  const linesStartX = 0;

  let lines = '';
  for (let i = 0; i < 5; i++) {
    const yt = trebleTopY + i * lineSp;
    const yb = bassTopY   + i * lineSp;
    lines += `<line x1="${linesStartX}" y1="${yt}" x2="${W}" y2="${yt}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    lines += `<line x1="${linesStartX}" y1="${yb}" x2="${W}" y2="${yb}" stroke="#1a1a1a" stroke-width="0.7"/>`;
  }
  // Compás divider on the right
  lines += `<line x1="${W - 0.5}" y1="${trebleTopY}" x2="${W - 0.5}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Faint middle-C hint
  const cHintW = W * 0.25;
  lines += `<line x1="${(W - cHintW)/2}" y1="${middleCY}" x2="${(W + cHintW)/2}" y2="${middleCY}" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>`;

  // Simile sign (thick slash + two flanking dots, classical Real-Book style).
  // Slash goes lower-left to upper-right; dots sit perpendicular to it on
  // either side at upper-left and lower-right.
  const cx = W * 0.5;
  const cy = middleCY;
  const slashL = lineSp * 1.9;
  const dotR   = lineSp * 0.42;
  const slashSW = Math.max(3, lineSp * 0.55);
  const dx = slashL / 2;
  const perp = lineSp * 0.75;            // perpendicular offset to the dots
  const simile =
    `<line x1="${cx - dx}" y1="${cy + dx}" x2="${cx + dx}" y2="${cy - dx}" stroke="#1a1a1a" stroke-width="${slashSW}" stroke-linecap="butt"/>` +
    `<circle cx="${cx - perp}" cy="${cy - perp}" r="${dotR}" fill="#1a1a1a"/>` +
    `<circle cx="${cx + perp}" cy="${cy + perp}" r="${dotR}" fill="#1a1a1a"/>`;

  // Clefs (only on the first cell of the row, so the rest reads as a clean
  // continuation of the partitura).
  let clef = '';
  if (showClef) {
    const trebleClefY = trebleBotY - lineSp;
    const bassClefY   = bassTopY + lineSp;
    const cx2 = clefW * 0.5;
    clef = trebleClefSVG(cx2, trebleClefY, lineSp, !!sizing?.minimal)
         + bassClefSVG(cx2, bassClefY, lineSp, !!sizing?.minimal);
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    ${lines}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" x="0" y="0" width="100%" height="100%">
      ${clef}
      ${simile}
    </svg>
  </svg>`;
}

function trebleClefSVG(cx, gLineY, lineSp, minimal) {
  // Real treble clef glyph. Mobile (Apple iOS / Noto Music) renders 𝄞 larger
  // within its em-box than desktop fonts (Apple Symbols / Segoe UI Symbol) —
  // use a smaller multiplier on mobile and a larger one on desktop so the
  // glyph visually reads at a similar staff-relative size on both.
  const fs = lineSp * (minimal ? 3.4 : 7.4);
  // Slightly softened ink + reduced opacity so the clef sits IN the staff
  // instead of dominating it. Warm dark brown ties into the Real-Book paper
  // palette without losing legibility.
  return `<text x="${cx}" y="${gLineY}"
        font-size="${fs}"
        font-family="'Bravura Text','Petaluma','Maestro','Sebastian','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola','Times New Roman',serif"
        fill="#2a2014"
        opacity="0.72"
        text-anchor="middle"
        dominant-baseline="central">𝄞</text>`;
}
function bassClefSVG(cx, fLineY, lineSp, minimal) {
  // Real bass clef glyph (𝄢, U+1D122). Sized to engraving spec: the body
  // of the F-clef fills the bass staff (~4 line-spacings tall). The visible
  // glyph in Apple Symbols / Segoe UI Symbol / Noto Music is roughly 0.55–
  // 0.60 of the font-size, so multiplying lineSp by ~6.7 yields ≈ 4·lineSp
  // of visible glyph — exactly the height of the staff.
  const fs = lineSp * (minimal ? 3.3 : 5.3);
  // 𝄢 sits high inside its em-box; push the glyph down so the dot lands on
  // F3 without the curl floating above the top staff line. Also nudged a
  // touch right so it doesn't crowd the brace bar on the left edge.
  const y  = fLineY + lineSp * (minimal ? 1.0 : 1.3);
  const x  = cx + lineSp * 0.35;
  // Same softened ink + opacity as the treble clef for visual consistency.
  return `<text x="${x}" y="${y}"
        font-size="${fs}"
        font-family="'Bravura Text','Petaluma','Maestro','Sebastian','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola','Times New Roman',serif"
        fill="#2a2014"
        opacity="0.72"
        text-anchor="middle"
        dominant-baseline="central">𝄢</text>`;
}

/* ════════════════════════════════════════════════════════════
   SHEET MUSIC — grand staff (treble + bass). Notes plotted at
   their actual pitch on whichever staff is appropriate (C4 / 60 is
   the split). No octave-shift trickery needed since the bass clef
   handles all the low chord tones natively.
   ════════════════════════════════════════════════════════════ */
function renderChordStaff(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const pcToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((rootPc + semi) % 12 + 12) % 12;
    if (!(pc in pcToDeg)) pcToDeg[pc] = q.degs[i];
  });
  const midis = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null)
                     .filter(x => x !== null)
                     .sort((a, b) => a - b);
  if (!midis.length) return '';

  const W = sizing?.W || 100;
  const H = sizing?.H || 82;
  const showClef = sizing?.showClef !== false;
  // Wider clef column so the bass-clef dots and treble-clef curl fit
  const clefW = showClef ? 22 : 3;
  const accW = 10;
  // Place the note stack at the HORIZONTAL CENTER of the cell — chords sit
  // visually balanced inside the staff lines instead of being pinned to the
  // left after the clef. Stay just right of the clef + accidental space.
  const noteX = Math.max(clefW + accW + 4, W * 0.55);
  // Budget the whole vertical space across both staves + a generous gap for
  // the middle-C ledger zone. Two staves × 4 line-spacings each + gap + pad
  // = H, so lineSp = (H - pad*2 - gap) / 8.
  // Top zone reserved for the chord-name label (Real-Book style above the
  // staff). padBot a bit looser so low chord tones never clip.
  const nameLabel = sizing?.chordName || '';
  const romanLabel = sizing?.roman || '';
  // Reuse the natural upper margin of the sheet music for the chord name —
  // just enough room for the text itself, no extra padding stacked on top.
  // The staff body keeps more vertical room as a result.
  const labelH = (nameLabel || romanLabel) ? (sizing?.minimal ? 14 : 26) : 3;
  const padTop = labelH;
  const padBot = (sizing?.minimal ? 7 : 9);
  // gap = 2 line-spacings so middle-C (one full ledger below treble bottom AND
  // one full ledger above bass top) sits at exactly the geometric mid-point
  // between the two staves. Anything less and the C-hint reads like B3.
  const gapY = 2;
  const lineSp = (H - padTop - padBot) / (8 + gapY);
  const trebleTopY = padTop;
  const trebleBotY = trebleTopY + 4 * lineSp;
  const bassTopY   = trebleBotY + lineSp * gapY;
  const bassBotY   = bassTopY + 4 * lineSp;
  const middleCY   = trebleBotY + lineSp;   // C4 ledger position

  // Map MIDI -> diatonic step + accidental + which staff
  const noteLetterFromPc = (pc, useFlat) => {
    const sharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const flat  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    return (useFlat ? flat : sharp)[pc];
  };
  const stepInOctave = {C:0, D:1, E:2, F:3, G:4, A:5, B:6};

  const positions = midis.map((midi) => {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const name = noteLetterFromPc(pc, flats);
    const letter = name.charAt(0);
    const acc = name.length > 1 ? name.charAt(1) : '';
    const step = (octave - 4) * 7 + stepInOctave[letter];   // 0 at C4
    // MIDI >= 60 → treble. Below → bass. (Middle C lives on first ledger
    // below treble; B3 and below sit on bass.)
    const useTreble = midi >= 60;
    const y = useTreble
      ? trebleBotY + lineSp - step * 0.5 * lineSp
      : bassTopY + (-step - 2) * 0.5 * lineSp;
    return { midi, pc, acc, letter, step, useTreble, y };
  });

  // 5 staff lines per staff — extend the FULL width of the cell so adjacent
  // cells' staves visually connect (continuous score look). The vertical bar
  // line at the right edge serves as the compás divider between cells.
  // Staff lines run all the way to the left edge; the clef glyph overlays
  // them (classical engraving). This keeps the clef visually inside the
  // staff instead of pushing it into its own left margin.
  const linesStartX = 0;
  let lines = '';
  for (let i = 0; i < 5; i++) {
    const yt = trebleTopY + i * lineSp;
    const yb = bassTopY   + i * lineSp;
    lines += `<line x1="${linesStartX}" y1="${yt}" x2="${W}" y2="${yt}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    lines += `<line x1="${linesStartX}" y1="${yb}" x2="${W}" y2="${yb}" stroke="#1a1a1a" stroke-width="0.7"/>`;
  }
  // Brace bar joining the two staves — sits flush at the left edge so the
  // clef glyphs can live inside the staff itself.
  if (showClef) {
    lines += `<line x1="0.7" y1="${trebleTopY}" x2="0.7" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="1.4"/>`;
  }
  // Compás divider — thin vertical line at the right edge of every cell
  lines += `<line x1="${W - 0.5}" y1="${trebleTopY}" x2="${W - 0.5}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Hint of the middle-C line floating between the two staves — short faint
  // dashed segment centered horizontally so the reader has a reference for
  // where C4 sits without overpowering the staff itself.
  // If middle C (MIDI 60) is actually sounding in this chord, light its
  // ledger line up in gold so the reader's eye snaps to the pivot tone.
  const hasMiddleC = midis.includes(60);
  const cHintW = hasMiddleC ? W * 0.32 : W * 0.25;
  const cHintX = (W - cHintW) / 2;
  if (hasMiddleC) {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#d4a843" stroke-width="1.2" opacity="0.95" stroke-linecap="round"/>`;
  } else {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>`;
  }

  // Both clefs drawn: treble (G clef) anchors G4 on the second-bottom treble
  // line; bass (F clef) anchors F3 on the second-top bass line.
  let clef = '';
  if (showClef) {
    const trebleClefY = trebleBotY - lineSp;   // G4 line — center of the loop
    const bassClefY   = bassTopY + lineSp;     // F3 line — dot of the bass clef
    const cx = clefW * 0.5;
    clef = trebleClefSVG(cx, trebleClefY, lineSp, !!sizing?.minimal)
         + bassClefSVG(cx, bassClefY, lineSp, !!sizing?.minimal);
  }

  // Ledger lines — drawn later, per-slot, inside the notes loop so each
  // slot's chord stack has its own short ledger lines aligned with its
  // noteheads. Empty string here; appended to `notes` below.
  let ledgers = '';
  // Helper: ledger lines for a single slot, centered on cx, based on the
  // current `positions` (same chord plays at every slot). Deduped per slot.
  const ledgersForSlot = (cx) => {
    let out = '';
    const seen = new Set();
    for (const p of positions) {
      const staffTop = p.useTreble ? trebleTopY : bassTopY;
      const staffBot = staffTop + 4 * lineSp;
      if (p.y > staffBot + lineSp * 0.3) {
        let k = 1;
        while (true) {
          const ly = staffBot + k * lineSp;
          if (ly > p.y + lineSp * 0.3) break;
          const key = `b-${ly.toFixed(1)}`;
          if (!seen.has(key)) {
            seen.add(key);
            out += `<line x1="${cx - 6}" y1="${ly}" x2="${cx + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
          }
          k++;
        }
      } else if (p.y < staffTop - lineSp * 0.3) {
        let k = 1;
        while (true) {
          const ly = staffTop - k * lineSp;
          if (ly < p.y - lineSp * 0.3) break;
          const key = `a-${ly.toFixed(1)}`;
          if (!seen.has(key)) {
            seen.add(key);
            out += `<line x1="${cx - 6}" y1="${ly}" x2="${cx + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
          }
          k++;
        }
      }
    }
    return out;
  };

  // Detect adjacent-stepwise pairs and offset one of them so noteheads don't overlap
  const offsetX = {};   // index -> x-offset for displaced notes
  for (let i = 1; i < positions.length; i++) {
    if (Math.abs(positions[i].step - positions[i - 1].step) <= 1
        && offsetX[i - 1] === undefined) {
      offsetX[i] = lineSp * 1.5;   // shift this note to the right of stem
    }
  }

  // ── Hand-drawn accidentals — cleaner than Unicode ♯ / ♭ at small sizes
  function svgSharp(cx, cy) {
    // Two vertical bars + two slightly upward-tilted thicker horizontal bars,
    // sized to fit roughly two line-spacings tall (one above + one below note line)
    const w = lineSp * 0.85;
    const h = lineSp * 1.6;
    const x0 = cx - w * 0.5, y0 = cy - h * 0.5;
    return [
      // Vertical bars
      `<line x1="${x0 + w*0.32}" y1="${y0 + h*0.06}" x2="${x0 + w*0.32}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="1.0" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.68}" y1="${y0 + h*0.06}" x2="${x0 + w*0.68}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="1.0" stroke-linecap="round"/>`,
      // Two thick angled crossbars (slope up to the right, classic sharp look)
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.45}" x2="${x0 + w*0.95}" y2="${y0 + h*0.33}" stroke="#1a1a1a" stroke-width="${Math.max(1.6, lineSp*0.32)}" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.72}" x2="${x0 + w*0.95}" y2="${y0 + h*0.60}" stroke="#1a1a1a" stroke-width="${Math.max(1.6, lineSp*0.32)}" stroke-linecap="round"/>`,
    ].join('');
  }
  function svgFlat(cx, cy) {
    // Vertical stem + a teardrop bulge on the lower right (the loop of a flat)
    const h = lineSp * 1.9;
    const x0 = cx - lineSp * 0.25, y0 = cy - h * 0.65;
    const stemX = x0 + lineSp * 0.18;
    return [
      `<line x1="${stemX}" y1="${y0}" x2="${stemX}" y2="${y0 + h * 0.95}" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>`,
      // Loop (filled teardrop)
      `<path d="M ${stemX} ${y0 + h*0.55}
                Q ${stemX + lineSp*1.0} ${y0 + h*0.50},
                  ${stemX + lineSp*0.55} ${y0 + h*0.95}
                Q ${stemX + lineSp*0.15} ${y0 + h*1.02},
                  ${stemX} ${y0 + h*0.85} Z"
              fill="#1a1a1a"/>`,
    ].join('');
  }

  // Accidentals + noteheads — rhythm-aware. If the cell has subdivisions,
  // render N noteheads spaced across the bar with the appropriate shape
  // (whole / half / quarter / eighth), stems, and rests for muted slots.
  // Falls back to a single whole note when subdivisions == 1.
  const subN = Math.max(1, sizing?.subdivisions || 1);
  const subMute = sizing?.subdivMute || [];
  const noteR = lineSp * 0.52;
  // Note SHAPE per subdivision count. (Odd values 3/5/6/7 reuse the
  // closest power-of-two for now; tuplet brackets are a follow-up.)
  //   1 → whole (open, no stem)
  //   2 → half (open, stem)
  //   3 → quarter (filled, stem) + 'triplet' feel
  //   4 → quarter (filled, stem)
  //   5–7 → eighth (filled, stem)
  //   8 → eighth (filled, stem + beam if adjacent)
  const noteKind = subN === 1 ? 'whole'
                  : subN === 2 ? 'half'
                  : (subN === 3 || subN === 4) ? 'quarter'
                  : 'eighth';
  const isOpen = noteKind === 'whole' || noteKind === 'half';
  const hasStem = noteKind !== 'whole';
  const hasFlag = noteKind === 'eighth';

  // Lay out slot positions across the available bar width. Leave room for
  // the clef at left and the bar-line at right. The first slot sits a
  // little after the clef space, subsequent slots are evenly spaced.
  const barStartX = Math.max(clefW + accW + 6, W * 0.20);
  const barEndX   = W - 6;
  const barWidth  = barEndX - barStartX;
  const slotW     = barWidth / subN;
  const slotX = (s) => barStartX + slotW * (s + 0.5);

  // Helper: render one notehead (filled or open) at (cx, cy)
  const drawHead = (cx, cy, color, open) => {
    if (open) {
      return `<g transform="rotate(-22 ${cx} ${cy})">
        <ellipse cx="${cx}" cy="${cy}" rx="${noteR * 1.25}" ry="${noteR * 0.88}" fill="none" stroke="${color}" stroke-width="${noteR * 0.5}"/>
      </g>`;
    }
    return `<g transform="rotate(-22 ${cx} ${cy})">
      <ellipse cx="${cx}" cy="${cy}" rx="${noteR * 1.15}" ry="${noteR * 0.82}" fill="${color}" stroke="${color}" stroke-width="0.4"/>
    </g>`;
  };
  // Helper: stem that passes through ALL noteheads of a chord stack.
  // Stem direction is determined by the chord's center vs the staff's
  // middle line — high notes get down-stems (hanging), low notes get
  // up-stems (rising), like classical engraving.
  //   notesGroup: positions in the same staff
  //   staffMidY: middle line of that staff (3rd line)
  //   cx: slot center x
  //   returns: { svg, stemEndX, stemEndY, stemDir }  — last 3 are for
  //     beaming consecutive eighth notes together later.
  const drawStemForGroup = (cx, notesGroup, staffMidY, withFlag) => {
    if (!notesGroup.length) return { svg: '', stemEndX: 0, stemEndY: 0, dir: 0 };
    const ys = notesGroup.map(p => p.y);
    const minY = Math.min(...ys);   // highest pitch on screen (smaller y)
    const maxY = Math.max(...ys);   // lowest pitch on screen (larger y)
    const centerY = (minY + maxY) / 2;
    // Up-stem (-1) if the chord's center is BELOW the staff middle
    // (i.e., low notes), down-stem (+1) if ABOVE.
    const dir = centerY > staffMidY ? -1 : 1;
    const stemLen = lineSp * 3.2;
    const x = cx + (dir === -1 ? noteR * 1.1 : -noteR * 1.1);
    // Anchor at the FAR notehead (in stem direction). Extend past the
    // other end of the chord stack plus stemLen.
    let y1, y2;
    if (dir === -1) {       // up-stem: anchored at bottom note, extends up past the top
      y1 = maxY;
      y2 = minY - stemLen;
    } else {                // down-stem: anchored at top note, extends down past the bottom
      y1 = minY;
      y2 = maxY + stemLen;
    }
    let svg = `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#1a1a1a" stroke-width="${Math.max(0.9, noteR * 0.25)}" stroke-linecap="round"/>`;
    if (withFlag) {
      // Single eighth-note flag (curl) at the END of the stem.
      const flagY = y2;
      const flagW = lineSp * 1.1;
      const flagH = lineSp * 1.6 * dir * -1;   // flag curls AWAY from chord (downwards for up-stem)
      svg += `<path d="M ${x} ${flagY}
                       Q ${x + flagW * 0.6} ${flagY + flagH * 0.25},
                         ${x + flagW * 0.9} ${flagY + flagH * 0.6}
                       Q ${x + flagW * 0.4} ${flagY + flagH * 0.4},
                         ${x} ${flagY + flagH * 0.5} Z"
                fill="#1a1a1a"/>`;
    }
    return { svg, stemEndX: x, stemEndY: y2, dir };
  };
  // Helper: rest glyph for a muted slot. Picks the rest shape matching
  // the slot's duration. Drawn in the middle gap between staves so it's
  // visible without clashing with notes above/below.
  const drawRest = (cx) => {
    const restY = middleCY;  // sits at middle-C line
    const fs = lineSp * 2.4;
    let glyph;
    switch (noteKind) {
      case 'whole':   glyph = '𝄻'; break;
      case 'half':    glyph = '𝄼'; break;
      case 'quarter': glyph = '𝄽'; break;
      case 'eighth':  glyph = '𝄾'; break;
      default:        glyph = '𝄽';
    }
    return `<text x="${cx}" y="${restY + lineSp * 0.5}" text-anchor="middle"
              font-size="${fs}"
              font-family="'Bravura Text','Petaluma','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola',serif"
              fill="#1a1a1a" opacity="0.55"
              dominant-baseline="alphabetic">${glyph}</text>`;
  };

  // Single shared stem across treble + bass (grand staff = one unit).
  // Direction follows the topmost note: if it sits ABOVE F5 (the top
  // treble line) the stem HANGS DOWN; otherwise it rises up. Matches
  // classical engraving convention applied to the combined grand staff.
  const slotStems = [];   // [{cx, endY, dir}] or null for muted slots
  // Per-bar accidental memory: once a sharp/flat appears on a given pitch
  // (identified by its staff y-position), subsequent slots in the same bar
  // omit the accidental — standard music notation convention.
  const accSeen = new Set();

  let notes = '';
  for (let s = 0; s < subN; s++) {
    const cx = slotX(s);
    let slotInner = '';
    if (subMute[s]) {
      slotInner += drawRest(cx);
      slotStems.push(null);
    } else {
      slotInner += ledgersForSlot(cx);
      positions.forEach((p, i) => {
        const dx = offsetX[i] || 0;
        const cxNote = cx + dx;
        const deg = pcToDeg[p.pc];
        const isRoot = deg === 'R';
        const color = isRoot ? (intervalColor('R') || '#dc2626') : '#1a1a1a';
        if (p.acc === '#' || p.acc === 'b') {
          const key = `${p.acc}@${p.y.toFixed(2)}`;
          if (!accSeen.has(key)) {
            accSeen.add(key);
            if (p.acc === '#') slotInner += svgSharp(cxNote - lineSp * 1.2, p.y);
            else slotInner += svgFlat(cxNote - lineSp * 1.1, p.y);
          }
        }
        slotInner += drawHead(cxNote, p.y, color, isOpen);
      });
      if (hasStem && positions.length) {
        const allY = positions.map(p => p.y);
        const topY = Math.min(...allY);   // smallest y = highest pitch
        const botY = Math.max(...allY);   // largest y = lowest pitch
        // E4 sits on the bottom line of the treble clef (y = trebleBotY).
        // If the topmost note is ABOVE E4, hang the stem downward so it
        // doesn't collide with notes/ledgers above.
        const e4Y = trebleBotY;
        const dir = topY < e4Y ? 1 : -1;
        const stemLen = lineSp * 3.2;
        const stemX = cx + (dir === -1 ? noteR * 1.1 : -noteR * 1.1);
        const y1 = dir === -1 ? botY : topY;
        const y2 = dir === -1 ? (topY - stemLen) : (botY + stemLen);
        slotInner += `<line x1="${stemX}" y1="${y1}" x2="${stemX}" y2="${y2}" stroke="#1a1a1a" stroke-width="${Math.max(0.9, noteR * 0.25)}" stroke-linecap="round"/>`;
        slotStems.push({ cx: stemX, endY: y2, dir });
      } else {
        slotStems.push(null);
      }
    }
    const hitRect = `<rect x="${cx - slotW/2}" y="${trebleTopY - lineSp}" width="${slotW}" height="${bassBotY - trebleTopY + 2 * lineSp}" fill="transparent" style="cursor:pointer" pointer-events="all"/>`;
    notes += `<g class="staff-slot" data-staff-seg="${s}">${slotInner}${hitRect}</g>`;
  }

  // Tuplet bracket for odd subdivisions (3, 5, 6, 7) — a horizontal line
  // above the staff with downturned tips at each end and the count number
  // floating in the middle. Matches classical engraving so the reader sees
  // "this is 5-against-4" instead of just five eighth notes.
  if (subN === 3 || subN === 5 || subN === 6 || subN === 7) {
    const firstX = slotX(0);
    const lastX  = slotX(subN - 1);
    // Bracket follows the TOPMOST visual element of the chord:
    //   - stem-down (common): the topmost notehead.
    //   - stem-up   (low chord): the stem-end, which sits above the notes.
    // Low chords drag the bracket downward; a ceiling near the top staff
    // line keeps it from crowding the chord-name label above.
    const allYbk     = positions.map(p => p.y);
    const topNoteY   = allYbk.length ? Math.min(...allYbk) : trebleTopY;
    const botNoteY   = allYbk.length ? Math.max(...allYbk) : trebleBotY;
    const e4Ybk      = trebleBotY;                      // E4 = stem-flip threshold
    const stemUpBk   = hasStem && allYbk.length && topNoteY >= e4Ybk;
    const stemLenBk  = lineSp * 3.2;
    const topElement = stemUpBk ? (topNoteY - stemLenBk) : topNoteY;
    const bracketCeil = trebleTopY + lineSp * 0.1;
    const bracketY    = Math.max(bracketCeil, topElement - lineSp * 1.2);
    const tipH   = lineSp * 0.4;
    const numFs  = lineSp * 1.1;
    const numW   = numFs * 0.75;                     // gap in the bracket for the number
    const numX   = (firstX + lastX) / 2;
    // Slightly muted color for the tuplet bracket and number so it reads
    // as a metric annotation rather than another notehead — keeps the eye
    // on the actual notes while still being legible.
    const tupColor = '#6b6b6b';
    const stk    = `stroke="${tupColor}" stroke-width="0.9" stroke-linecap="round"`;
    notes += `<line x1="${firstX}" y1="${bracketY}" x2="${numX - numW/2}" y2="${bracketY}" ${stk}/>`;
    notes += `<line x1="${numX + numW/2}" y1="${bracketY}" x2="${lastX}" y2="${bracketY}" ${stk}/>`;
    notes += `<line x1="${firstX}" y1="${bracketY}" x2="${firstX}" y2="${bracketY + tipH}" ${stk}/>`;
    notes += `<line x1="${lastX}" y1="${bracketY}" x2="${lastX}" y2="${bracketY + tipH}" ${stk}/>`;
    // y is the text baseline; offset by ~0.35·fontSize so the glyph's
    // optical center sits on bracketY.
    notes += `<text x="${numX}" y="${bracketY + numFs * 0.36}" text-anchor="middle"
                font-size="${numFs}" font-family="'Cormorant Garamond', Georgia, serif"
                font-style="italic" font-weight="700" fill="${tupColor}">${subN}</text>`;
  }

  // Beams for eighth notes — connect runs of consecutive non-muted slots
  // with a horizontal bar at the stem ends. Single eighths (run of 1)
  // fall back to a flag.
  if (hasFlag && hasStem) {
    const drawBeamsAndFlags = (stems) => {
      let out = '';
      let i = 0;
      while (i < stems.length) {
        if (!stems[i]) { i++; continue; }
        // Find run of consecutive non-null stems
        let j = i;
        while (j < stems.length && stems[j]) j++;
        const run = stems.slice(i, j);
        if (run.length >= 2) {
          // Beam: thick line connecting all stem ends in the run.
          // Use the AVERAGE y of the endpoints so the beam stays straight
          // even if the stems differ slightly in length.
          const beamY = run.reduce((a, r) => a + r.endY, 0) / run.length;
          const x1 = run[0].cx;
          const x2 = run[run.length - 1].cx;
          const thick = Math.max(1.6, lineSp * 0.4);
          out += `<line x1="${x1}" y1="${beamY}" x2="${x2}" y2="${beamY}" stroke="#1a1a1a" stroke-width="${thick}" stroke-linecap="butt"/>`;
        } else {
          // Singleton — needs a flag.
          const r = run[0];
          const flagW = lineSp * 1.1;
          const flagH = lineSp * 1.6 * r.dir * -1;
          out += `<path d="M ${r.cx} ${r.endY}
                          Q ${r.cx + flagW * 0.6} ${r.endY + flagH * 0.25},
                            ${r.cx + flagW * 0.9} ${r.endY + flagH * 0.6}
                          Q ${r.cx + flagW * 0.4} ${r.endY + flagH * 0.4},
                            ${r.cx} ${r.endY + flagH * 0.5} Z"
                    fill="#1a1a1a"/>`;
        }
        i = j;
      }
      return out;
    };
    notes += drawBeamsAndFlags(slotStems);
  }

  // Chord-name label above the staff (Real-Book style). Single <text> with
  // a <tspan> for the roman numeral that uses dx for letter-by-letter
  // offset. Roman is colored by harmonic-function tag (tonic green, dom red,
  // predom gold, borrowed purple, secondary orange).
  const TAG_COLOR = {
    tonic:     '#059669',
    predom:    '#a07820',
    dom:       '#dc2626',
    borrowed:  '#9333ea',
    secondary: '#b45309',
    picardy:   '#b45309',
  };
  let nameSvg = '';
  if (nameLabel) {
    // Match the on-screen size of guitar mode's .rb-chord pill (19 px).
    // With cell ~125 wide vs viewBox W=130, inner scale is ~0.96 — so
    // nameFs 20 renders ~19 px on screen, matching the rb-chord pill in
    // compose. romanFs matches rb-roman's 11 px.
    const nameFs = sizing?.minimal ? 14 : 20;
    const romanFs = sizing?.minimal ? 10 : 12;
    const tx = showClef ? clefW + 4 : 4;
    const ty = labelH * 0.85;
    const romanColor = TAG_COLOR[sizing?.tag] || '#5a5a64';
    const romanTspan = romanLabel
      ? `<tspan dx="${sizing?.minimal ? 6 : 10}" font-size="${romanFs}" font-weight="700" fill="${romanColor}">${romanLabel}</tspan>`
      : '';
    nameSvg += `<text x="${tx}" y="${ty}" font-size="${nameFs}"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-style="italic" font-weight="700" fill="#1a1a1a"
                letter-spacing="${sizing?.minimal ? 0.2 : 0.5}"><tspan>${nameLabel}</tspan>${romanTspan}</text>`;
  }
  // Two-layer SVG: outer stretches (preserveAspectRatio=none) so staff lines
  // and bar-line reach the actual cell edges — adjacent cells connect into
  // one continuous score. Inner keeps aspect so clef, noteheads AND the
  // chord-name label aren't horizontally distorted.
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    ${lines}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" x="0" y="0" width="100%" height="100%">
      ${nameSvg}${clef}${ledgers}${notes}
    </svg>
  </svg>`;
}

function renderMini(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const intToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((semi % 12) + 12) % 12;
    if (!(pc in intToDeg)) intToDeg[pc] = q.degs[i];
  });

  const played = shape.filter(f => f >= 0);
  if (!played.length) return '';
  let minF = Math.min(...played);
  let maxF = Math.max(...played);
  const hasOpen = shape.some(f => f === 0);
  let span = Math.max(4, maxF - minF + 1);
  // startFret = fret-number of the TOP BAR shown (the bar above the first playable fret)
  let startFret = hasOpen ? 0 : Math.max(0, minF - 1);
  let endFret = startFret + span;
  if (!hasOpen && endFret > N_FRETS) { endFret = N_FRETS; startFret = endFret - span; }

  const W = sizing?.W || 160;
  const H = sizing?.H || 140;
  const nameLabel  = sizing?.chordName;
  const romanLabel = sizing?.roman;
  const tag        = sizing?.tag;
  // Reserve top space for the embedded chord-name label when caller asks for it.
  const labelH = nameLabel ? (sizing?.minimal ? 16 : 24) : 0;
  const ml = 18, mr = 8, mt = 18 + labelH, mb = 6;
  const innerW = W - ml - mr;
  const innerH = H - mt - mb;
  const stringSp = innerW / 5;
  const fretSp = innerH / Math.max(4, endFret - startFret);

  let s = '';
  if (startFret === 0) {
    s += `<line x1="${ml-2}" y1="${mt}" x2="${ml+innerW+2}" y2="${mt}" stroke="#1f1d18" stroke-width="4"/>`;
  } else {
    s += `<text x="${ml-4}" y="${mt+fretSp/2+3}" text-anchor="end" font-size="10" fill="#7a7a82" font-family="SF Mono">${startFret+1}fr</text>`;
  }
  for (let i = (startFret === 0 ? 1 : 0); i <= endFret - startFret; i++) {
    const y = mt + i * fretSp;
    s += `<line x1="${ml}" y1="${y}" x2="${ml+innerW}" y2="${y}" stroke="#d4d4da" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = ml + i * stringSp;
    s += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+innerH}" stroke="#a8a8b0" stroke-width="0.8"/>`;
  }
  // Inlays
  {
    const cx = ml + innerW / 2;
    const dw = Math.min(stringSp * 0.7, fretSp * 0.32);
    const dh = Math.min(fretSp * 0.32, 8);
    const drawD = (x, y) => `<polygon points="${x},${y-dh} ${x+dw},${y} ${x},${y+dh} ${x-dw},${y}" fill="#aaa496" opacity="0.55"/>`;
    [3,5,7,9,15,17,19,21].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      s += drawD(cx, y);
    });
    [12, 24].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      const off = stringSp * 1.5;
      s += drawD(cx - off, y);
      s += drawD(cx + off, y);
    });
  }
  // Barre indicator: when 2+ strings share the same fret, draw a backing bar
  // that extends from the lowest to highest such string. Strings IN BETWEEN
  // can have HIGHER frets (other fingers pressed on top of the barre) —
  // those are still under the index finger physically. Strings in between
  // that are MUTED or have LOWER frets break the barre.
  {
    const fretted = shape.filter(f => f > 0);
    const minFret = fretted.length ? Math.min(...fretted) : 0;
    const fretGroups = {};
    shape.forEach((f, sIdx) => {
      if (f > 0) {
        if (!fretGroups[f]) fretGroups[f] = [];
        fretGroups[f].push(sIdx);
      }
    });
    Object.entries(fretGroups).forEach(([f, strings]) => {
      if (strings.length < 2) return;
      strings.sort((a, b) => a - b);
      const fret = +f;
      const minS = strings[0], maxS = strings[strings.length - 1];
      // Validate: every string between minS and maxS must be playable
      // and at fret >= barre fret (no muted, no lower-fret notes).
      let valid = true;
      for (let s = minS; s <= maxS; s++) {
        if (shape[s] < 0) { valid = false; break; }       // muted in middle breaks
        if (shape[s] > 0 && shape[s] < fret) { valid = false; break; }  // lower fret in middle
      }
      if (!valid) return;
      // Only draw at the chord's lowest fret (standard barre) or as
      // a top-2-string partial (high E + B).
      const isAtMinFret = fret === minFret;
      const isTopPair = (maxS - minS) === 1 && minS === 0;
      if (!isAtMinFret && !isTopPair) return;
      const cy = mt + ((fret - startFret) - 0.5) * fretSp;
      const x1 = ml + minS * stringSp;
      const x2 = ml + maxS * stringSp;
      const noteR = sizing?.r || 11;
      s += `<rect x="${x1 - noteR}" y="${cy - noteR - 1}" width="${x2 - x1 + 2*noteR}" height="${2*noteR + 2}" rx="${noteR + 1}" fill="#1f1d18" opacity="0.13"/>`;
    });
  }
  // `minimal` covers both note-style AND label sizing (used on mobile).
  // `bwNotes` is a finer flag that ONLY switches notes to black-and-white
  // without shrinking the chord-name / roman labels — used on desktop
  // compose where we want sober dots but keep the bigger labels.
  const minimal = sizing?.minimal === true || sizing?.bwNotes === true;
  shape.forEach((fret, sIdx) => {
    const x = ml + sIdx * stringSp;
    if (fret < 0) {
      s += `<text x="${x}" y="${mt-5}" text-anchor="middle" font-size="${minimal ? 9 : 11}" fill="${minimal ? '#1a1a1a' : '#a8a8b0'}" font-weight="700">×</text>`;
      return;
    }
    const pc = noteAt(sIdx, fret);
    const rel = (pc - rootPc + 12) % 12;
    const deg = intToDeg[rel] || '';
    let cy;
    if (fret === 0) {
      // Open string: small ring at the nut
      cy = mt - 7;
      if (minimal) {
        s += `<circle cx="${x}" cy="${cy}" r="4.5" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>`;
      } else {
        const color = intervalColor(deg);
        s += `<circle cx="${x}" cy="${cy}" r="6" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      }
      return;
    }
    cy = mt + ((fret - startFret) - 0.5) * fretSp;
    const r = sizing?.r || 11;
    if (minimal) {
      // Classical chord-diagram style: solid black dot, no text, no colors
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="#1a1a1a"/>`;
    } else {
      const color = intervalColor(deg);
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      const noteName = nameOf(pc, flats);
      let label = state.display === 'intervals' ? deg : noteName;
      let fontSize = label.length > 2 ? 8 : 10;
      s += `<text x="${x}" y="${cy + 3.5}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="#000">${label}</text>`;
    }
  });
  // Embedded chord-name label at the top of the SVG (Real-Book style) when
  // caller passed chordName/roman/tag in sizing.
  let nameSvg = '';
  if (nameLabel) {
    const TAG_COLOR = {
      tonic:     '#059669',
      predom:    '#a07820',
      dom:       '#dc2626',
      borrowed:  '#9333ea',
      secondary: '#b45309',
      picardy:   '#b45309',
    };
    const romanColor = TAG_COLOR[tag] || '#5a5a64';
    const nameFs  = sizing?.minimal ? 11 : 15;
    const romanFs = sizing?.minimal ? 8  : 10;
    const ty      = labelH * 0.78;
    const romanTspan = romanLabel
      ? `<tspan dx="${sizing?.minimal ? 5 : 8}" font-size="${romanFs}" font-weight="700" fill="${romanColor}">${romanLabel}</tspan>`
      : '';
    nameSvg = `<text x="${W/2}" y="${ty}" text-anchor="middle"
                 font-size="${nameFs}" font-family="'Cormorant Garamond', Georgia, serif"
                 font-style="italic" font-weight="700" fill="#1a1a1a"
                 letter-spacing="0.3"><tspan>${nameLabel}</tspan>${romanTspan}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${nameSvg}${s}</svg>`;
}

/* ════════════════════════════════════════════════════════════
   CHORD MAP RENDER
   ════════════════════════════════════════════════════════════ */

const MAP_DIMS = {width: 540, height: 800};

// Cache of (chord-id → role) shown last frame, so we only run the
// fade-in animation when a popup chord FIRST appears, not on every
// _updateVisuals tick that re-renders the map.
let _popupLastShown = { cur: null, nxt: null };

// ─── Compose-mode hover-to-reveal popups ───
