  const slotChords = (sizing?.slots && sizing.slots.length === subNEarly)
    ? sizing.slots
    : null;
  // Base chord — used for slot 0 and as fallback for slots without their
  // own data. For multi-chord cells we still want valid base data so the
  // staff geometry, C-hint detection, etc. have something to chew on.
  const baseShape   = slotChords ? slotChords[0].shape   : shape;
  const baseRoot    = slotChords ? slotChords[0].root    : rootPc;
  const baseQuality = slotChords ? slotChords[0].quality : quality;
  const q = QUALITIES[baseQuality];
  if (!q) return '';
  const midis = baseShape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null)
                     .filter(x => x !== null)
                     .sort((a, b) => a - b);
  if (!midis.length) return '';
  // pcToDeg is computed per-slot inside the helper below — for the base
  // case we still need one for accidental memory / coloring. Built once
  // here, then overridden per slot when multi-chord.
  const pcToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((baseRoot + semi) % 12 + 12) % 12;
    if (!(pc in pcToDeg)) pcToDeg[pc] = q.degs[i];
  });

  const W = sizing?.W || 100;
  const H = sizing?.H || 82;
  const showClef = sizing?.showClef !== false;
  // Wider clef column so the bass-clef dots and treble-clef curl fit
  const clefW = showClef ? 22 : 3;
  const accW = 10;
  // Place the note stack at the HORIZONTAL CENTER of the cell — chords sit
  // visually balanced inside the staff lines instead of being pinned to the
  // left after the clef. Stay just right of the clef + accidental space.
  const noteX = Math.max(clefW + accW + 4, W * 0.55);
  // Budget the whole vertical space across both staves + a generous gap for
  // the middle-C ledger zone. Two staves × 4 line-spacings each + gap + pad
  // = H, so lineSp = (H - pad*2 - gap) / 8.
  // Top zone reserved for the chord-name label (Real-Book style above the
  // staff). padBot a bit looser so low chord tones never clip.
  const nameLabel = sizing?.chordName || '';
  const romanLabel = sizing?.roman || '';
  // Reuse the natural upper margin of the sheet music for the chord name —
  // just enough room for the text itself, no extra padding stacked on top.
  // The staff body keeps more vertical room as a result.
  const labelH = (nameLabel || romanLabel) ? (sizing?.minimal ? 14 : 26) : 3;
  const padTop = labelH;
  const padBot = (sizing?.minimal ? 7 : 9);
  // gap = 2 line-spacings so middle-C (one full ledger below treble bottom AND
  // one full ledger above bass top) sits at exactly the geometric mid-point
  // between the two staves. Anything less and the C-hint reads like B3.
  const gapY = 2;
  const lineSp = (H - padTop - padBot) / (8 + gapY);
  const trebleTopY = padTop;
  const trebleBotY = trebleTopY + 4 * lineSp;
  const bassTopY   = trebleBotY + lineSp * gapY;
  const bassBotY   = bassTopY + 4 * lineSp;
  const middleCY   = trebleBotY + lineSp;   // C4 ledger position

  // Map MIDI -> diatonic step + accidental + which staff
  const noteLetterFromPc = (pc, useFlat) => {
    const sharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const flat  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    return (useFlat ? flat : sharp)[pc];
  };
  const stepInOctave = {C:0, D:1, E:2, F:3, G:4, A:5, B:6};

  // Build {pcToDeg, midis, positions, offsetX} for a chord (shape+root+qual).
  // Returns null if the shape produces no notes. Used for the base chord and,
  // when sizing.slots is set, per-slot to vary notes across the bar without
  // changing the staff layout itself.
  const buildSlotChord = (shp, root, qual) => {
    const qq = QUALITIES[qual];
    if (!qq) return null;
    const slotPcToDeg = {};
    qq.ints.forEach((semi, i) => {
      const pc = ((root + semi) % 12 + 12) % 12;
      if (!(pc in slotPcToDeg)) slotPcToDeg[pc] = qq.degs[i];
    });
    const slotMidis = shp.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null)
                         .filter(x => x !== null)
                         .sort((a, b) => a - b);
    if (!slotMidis.length) return null;
    // Note spelling follows DEGREES inside the chord — each chord tone gets
    // a letter derived from the root letter + diatonic offset for its
    // degree (R=0, 3=+2, 5=+4, 7=+6 letters), then the accidental falls
    // out of the semitone difference. So Cm's b3 stays Eb (not D#),
    // Bdim's b5 stays F (not E#), and a Db7's b7 stays Cb. Notes that
    // aren't chord tones (rare on a chord-only staff but possible if the
    // shape sneaks in a passing pc) fall back to the cell-key sharp/flat
    // side.
    //
    // The ROOT letter follows the CELL's key (passed-in `flats`), NOT
    // the root pc's intrinsic preference. Otherwise a root like A# in
    // F# major (pc 10, which useFlatsFor would say is "Bb") spells the
    // chord with the wrong letter set and every note ends up with a
    // bogus accidental against the F# major key sig.
    const useFlatForRoot = !!flats;
    const rootName = noteLetterFromPc(root, useFlatForRoot);
    const rootLetter = rootName.charAt(0);
    const LETTERS_ORDER = ['C','D','E','F','G','A','B'];
    const LETTER_TO_PC  = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
    const rootLetterIdx = LETTERS_ORDER.indexOf(rootLetter);
    const letterAccForDegree = (degree, pc) => {
      // Diatonic step from root letter: 'R' / '3' / 'b3' / '#5' / 'b7' /
      // 'maj7' / '9' / '#11' / 'b13' all parse to a digit (1, 3, 5, 7,
      // 9, 11, 13), which collapses mod 7 to the letter offset.
      let digit = 1;
      if (degree !== 'R') {
        const m = degree.match(/(\d+)/);
        if (m) digit = parseInt(m[1], 10);
      }
      const offset = (digit - 1) % 7;
      const targetLetterIdx = (rootLetterIdx + offset) % 7;
      const targetLetter = LETTERS_ORDER[targetLetterIdx];
      const naturalPc = LETTER_TO_PC[targetLetter];
      // Signed semitone diff in [-6, +6] range so ±1 sharps/flats fall out
      // naturally even when the natural pc wraps past 12.
      let diff = (((pc - naturalPc) % 12) + 12) % 12;
      if (diff > 6) diff -= 12;
      let acc = '';
      if (diff === 1)       acc = '#';
      else if (diff === -1) acc = 'b';
      else if (diff !== 0)  return null;   // double accidental → fall back
      return { letter: targetLetter, acc };
    };
    const slotPos = slotMidis.map((midi) => {
      const pc = ((midi % 12) + 12) % 12;
      const octave = Math.floor(midi / 12) - 1;
      const deg = slotPcToDeg[pc];
      let letter, acc;
      const la = deg ? letterAccForDegree(deg, pc) : null;
      if (la) {
        letter = la.letter;
        acc = la.acc;
      } else {
        const name = noteLetterFromPc(pc, useFlatForRoot);
        letter = name.charAt(0);
        acc = name.length > 1 ? name.charAt(1) : '';
      }
      const step = (octave - 4) * 7 + stepInOctave[letter];
      const useTreble = midi >= 60;
      const y = useTreble
        ? trebleBotY + lineSp - step * 0.5 * lineSp
        : bassTopY + (-step - 2) * 0.5 * lineSp;
      return { midi, pc, acc, letter, step, useTreble, y };
    });
    const slotOff = {};
    for (let i = 1; i < slotPos.length; i++) {
      if (Math.abs(slotPos[i].step - slotPos[i - 1].step) <= 1
          && slotOff[i - 1] === undefined) {
        // Magnitude only — the SIGN is applied per slot in the render loop
        // based on stem direction (opposite side of stem from regular notes).
        // ≈ 2.1·noteR so the displaced notehead's inner edge kisses the stem.
        slotOff[i] = lineSp * 1.1;
      }
    }
    return { pcToDeg: slotPcToDeg, midis: slotMidis, positions: slotPos, offsetX: slotOff };
  };
  const baseData = buildSlotChord(baseShape, baseRoot, baseQuality);
  if (!baseData) return '';
  const positions = baseData.positions;
  // Per-slot accessor — base for single-chord cells; per-slot when slotChords
  // is provided (multi-chord bar). Falls back to base on missing data so the
  // staff still renders something rather than going blank.
  const getSlotData = (s) => {
    if (!slotChords) return baseData;
    const slot = slotChords[s];
    if (!slot) return baseData;
    return buildSlotChord(slot.shape, slot.root, slot.quality) || baseData;
  };

  // 5 staff lines per staff — extend the FULL width of the cell so adjacent
  // cells' staves visually connect (continuous score look). The vertical bar
  // line at the right edge serves as the compás divider between cells.
  // Staff lines run all the way to the left edge; the clef glyph overlays
  // them (classical engraving). This keeps the clef visually inside the
  // staff instead of pushing it into its own left margin.
  const linesStartX = 0;
  let lines = '';
  for (let i = 0; i < 5; i++) {
    const yt = trebleTopY + i * lineSp;
    const yb = bassTopY   + i * lineSp;
    lines += `<line x1="${linesStartX}" y1="${yt}" x2="${W}" y2="${yt}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    lines += `<line x1="${linesStartX}" y1="${yb}" x2="${W}" y2="${yb}" stroke="#1a1a1a" stroke-width="0.7"/>`;
  }
  // Brace bar joining the two staves — sits flush at the left edge so the
  // clef glyphs can live inside the staff itself.
  if (showClef) {
    lines += `<line x1="0.7" y1="${trebleTopY}" x2="0.7" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="1.4"/>`;
  }
  // Compás divider — thin vertical line at the right edge of every cell
  lines += `<line x1="${W - 0.5}" y1="${trebleTopY}" x2="${W - 0.5}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Hint of the middle-C line floating between the two staves — short faint
  // dashed segment centered horizontally so the reader has a reference for
  // where C4 sits without overpowering the staff itself.
  // If middle C (MIDI 60) is actually sounding in this chord, light its
  // ledger line up in gold so the reader's eye snaps to the pivot tone.
  const hasMiddleC = midis.includes(60);
  const cHintW = hasMiddleC ? W * 0.32 : W * 0.25;
  const cHintX = (W - cHintW) / 2;
  if (hasMiddleC) {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#d4a843" stroke-width="1.2" opacity="0.95" stroke-linecap="round"/>`;
  } else {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>`;
  }

  // Both clefs drawn: treble (G clef) anchors G4 on the second-bottom treble
  // line; bass (F clef) anchors F3 on the second-top bass line.
  let clef = '';
  if (showClef) {
    const trebleClefY = trebleBotY - lineSp;   // G4 line — center of the loop
    const bassClefY   = bassTopY + lineSp;     // F3 line — dot of the bass clef
    const cx = clefW * 0.5;
    clef = trebleClefSVG(cx, trebleClefY, lineSp, !!sizing?.minimal)
         + bassClefSVG(cx, bassClefY, lineSp, !!sizing?.minimal);
  }

  // ── Key signature ──
  // Drawn on the FIRST bar of every visual row (`showClef` cells AND any
  // other cell flagged `firstOfRow` by the caller) — never on mid-row
  // bars. Real Real-Book convention: re-state the key on each new system,
  // not on every bar. The actual clef glyph still prints only on the very
  // first bar of the piece; subsequent rows get the key sig at a fainter
  // opacity (ghost reminder) without re-stating the clef.
  const firstOfRow = sizing?.firstOfRow !== undefined ? !!sizing.firstOfRow : showClef;
  // Compute key signature info up-front so we can also USE it to suppress
  // per-note accidentals that already appear in the armadura (Phase 2).
  const sigKeyPc = (sizing?.keyPc !== undefined) ? sizing.keyPc
                 : (typeof state !== 'undefined' && state ? state.keyPc : 0);
  const sigTonality = sizing?.tonality
                   || (typeof state !== 'undefined' && state ? state.tonality : 'major');
  const sig = getKeySig(sigKeyPc, sigTonality);
  // Letters that carry the key-sig accidental. Used inside the slot loop
  // to decide whether to draw a per-note accidental, naturalize a key-sig
  // letter that's sounding without its accidental, or print nothing.
  const SHARP_LETTERS_ORDER = ['F','C','G','D','A','E','B'];
  const FLAT_LETTERS_ORDER  = ['B','E','A','D','G','C','F'];
  const sigLetters = sig.type === '#' ? SHARP_LETTERS_ORDER.slice(0, sig.count)
                   : sig.type === 'b' ? FLAT_LETTERS_ORDER.slice(0, sig.count)
                   : [];
  const sigLetterSet = new Set(sigLetters);
  let keySig = '';
  let keySigW = 0;
  if (firstOfRow) {
    if (sig.count > 0) {
      // Order of accidentals in a standard key signature, with their
      // conventional staff positions (octave per accidental).
      // Treble + bass positions are computed via the same step→y formula
      // the noteheads use, so glyphs land on the correct staff line/space
      // for each clef without hard-coding y values.
      const SHARP_ORDER = [
        ['F', 5, 3], ['C', 5, 3], ['G', 5, 3], ['D', 5, 3],
        ['A', 4, 3], ['E', 5, 3], ['B', 4, 3],
      ];
      const FLAT_ORDER = [
        ['B', 4, 3], ['E', 5, 3], ['A', 4, 3], ['D', 5, 3],
        ['G', 4, 3], ['C', 5, 3], ['F', 5, 3],
      ];
      const order = sig.type === '#' ? SHARP_ORDER : FLAT_ORDER;
      const yFor = (letter, octave, useTreble) => {
        const step = (octave - 4) * 7 + stepInOctave[letter];
        return useTreble
          ? trebleBotY + lineSp - step * 0.5 * lineSp
          : bassTopY + (-step - 2) * 0.5 * lineSp;
      };
      // Key-sig glyphs print SMALLER than per-note accidentals — they're a
      // legend at the top of the staff, not a hot-take in the middle of a
      // chord. Pass scale=0.7 to svgSharp/svgFlat (drawn smaller) and keep
      // the per-glyph horizontal step proportional so the whole sig stays
      // compact next to the clef.
      const sigScale = 0.7;
      const stepX = sig.type === '#'
        ? lineSp * 0.55
        : lineSp * 0.50;
      const startX = clefW + (sizing?.minimal ? 2 : 3);
      keySigW = sig.count * stepX + (sizing?.minimal ? 2 : 3);
      let keySigInner = '';
      for (let i = 0; i < sig.count; i++) {
        const [letter, trebOct, bassOct] = order[i];
        const cx = startX + i * stepX + stepX * 0.5;
        const yT = yFor(letter, trebOct, true);
        const yB = yFor(letter, bassOct, false);
        keySigInner += (sig.type === '#')
          ? (svgSharp(cx, yT, sigScale) + svgSharp(cx, yB, sigScale))
          : (svgFlat(cx, yT, sigScale)  + svgFlat(cx, yB, sigScale));
      }
      // Wrap in a low-opacity group so it reads as background/legend,
      // like the clef glyphs (which use opacity 0.72). The bar that ALSO
      // shows the clef prints at 0.5 (easy to read on the first system).
      // Subsequent-row "ghost" restatements print at 0.3 — present enough
      // to remind the reader of the key without competing with notes.
      const sigOp = showClef ? 0.5 : 0.3;
      keySig = `<g opacity="${sigOp}">${keySigInner}</g>`;
    }
  }

  // Ledger lines — drawn later, per-slot, inside the notes loop so each
  // slot's chord stack has its own short ledger lines aligned with its
  // noteheads. Empty string here; appended to `notes` below.
  let ledgers = '';
  // Helper: ledger lines for a single slot, centered on cx. Takes an
  // optional positions override so multi-chord cells can ledger per-slot
  // (each slot's own chord may extend above/below the staff differently).
  // Deduped per slot.
  const ledgersForSlot = (cx, slotPositions) => {
    let out = '';
    const seen = new Set();
    const usePositions = slotPositions || positions;
    for (const p of usePositions) {
      const staffTop = p.useTreble ? trebleTopY : bassTopY;
      const staffBot = staffTop + 4 * lineSp;
      if (p.y > staffBot + lineSp * 0.3) {
        let k = 1;
        while (true) {
          const ly = staffBot + k * lineSp;
          if (ly > p.y + lineSp * 0.3) break;
          const key = `b-${ly.toFixed(1)}`;
          if (!seen.has(key)) {
            seen.add(key);
            out += `<line x1="${cx - 6}" y1="${ly}" x2="${cx + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
          }
          k++;
        }
      } else if (p.y < staffTop - lineSp * 0.3) {
        let k = 1;
        while (true) {
          const ly = staffTop - k * lineSp;
          if (ly < p.y - lineSp * 0.3) break;
          const key = `a-${ly.toFixed(1)}`;
          if (!seen.has(key)) {
            seen.add(key);
            out += `<line x1="${cx - 6}" y1="${ly}" x2="${cx + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
          }
          k++;
        }
      }
    }
    return out;
  };

  // offsetX is now per-chord — base cell uses baseData.offsetX; multi-chord
  // cells get a fresh one per slot via getSlotData(s) inside the loop below.
  const offsetX = baseData.offsetX;

  // ── Hand-drawn accidentals — cleaner than Unicode ♯ / ♭ at small sizes
  function svgSharp(cx, cy, scale = 1) {
    // Two vertical bars + two slightly upward-tilted thicker horizontal bars,
    // sized to fit roughly two line-spacings tall (one above + one below note line).
    // `scale` shrinks the whole glyph — used by the key signature where the
    // accidentals print smaller than per-note ones.
    const w = lineSp * 0.85 * scale;
    const h = lineSp * 1.6  * scale;
    const x0 = cx - w * 0.5, y0 = cy - h * 0.5;
    const sw = Math.max(1.0, 1.0 * scale);
    const cbw = Math.max(1.2, lineSp * 0.32 * scale);
    return [
      `<line x1="${x0 + w*0.32}" y1="${y0 + h*0.06}" x2="${x0 + w*0.32}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="${sw}" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.68}" y1="${y0 + h*0.06}" x2="${x0 + w*0.68}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="${sw}" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.45}" x2="${x0 + w*0.95}" y2="${y0 + h*0.33}" stroke="#1a1a1a" stroke-width="${cbw}" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.72}" x2="${x0 + w*0.95}" y2="${y0 + h*0.60}" stroke="#1a1a1a" stroke-width="${cbw}" stroke-linecap="round"/>`,
    ].join('');
  }
  function svgFlat(cx, cy, scale = 1) {
    // Vertical stem + a teardrop bulge on the lower right (the loop of a flat).
    const h  = lineSp * 1.9 * scale;
    const ls = lineSp * scale;
    const x0 = cx - ls * 0.25, y0 = cy - h * 0.65;
    const stemX = x0 + ls * 0.18;
    const sw = Math.max(1.0, 1.1 * scale);
    return [
      `<line x1="${stemX}" y1="${y0}" x2="${stemX}" y2="${y0 + h * 0.95}" stroke="#1a1a1a" stroke-width="${sw}" stroke-linecap="round"/>`,
      `<path d="M ${stemX} ${y0 + h*0.55}
                Q ${stemX + ls*1.0} ${y0 + h*0.50},
                  ${stemX + ls*0.55} ${y0 + h*0.95}
                Q ${stemX + ls*0.15} ${y0 + h*1.02},
                  ${stemX} ${y0 + h*0.85} Z"
              fill="#1a1a1a"/>`,
    ].join('');
  }
  function svgNatural(cx, cy, scale = 1) {
    // Hand-drawn natural — two short vertical bars (left tall on top, right
    // tall on bottom) with two tilted horizontal bars forming an inner
    // parallelogram. Same visual weight as the sharp/flat helpers.
    const w  = lineSp * 0.55 * scale;
    const h  = lineSp * 1.6  * scale;
    const x0 = cx - w * 0.5, y0 = cy - h * 0.5;
    const sw  = Math.max(1.0, 1.0 * scale);
    const cbw = Math.max(1.3, lineSp * 0.28 * scale);
    return [
      // Left vertical — from near top down to the middle horizontal
      `<line x1="${x0 + w*0.25}" y1="${y0 + h*0.05}" x2="${x0 + w*0.25}" y2="${y0 + h*0.78}" stroke="#1a1a1a" stroke-width="${sw}" stroke-linecap="round"/>`,
      // Right vertical — from middle down to near bottom
      `<line x1="${x0 + w*0.75}" y1="${y0 + h*0.22}" x2="${x0 + w*0.75}" y2="${y0 + h*0.95}" stroke="#1a1a1a" stroke-width="${sw}" stroke-linecap="round"/>`,
      // Top tilted crossbar (up to the right, classic natural look)
      `<line x1="${x0 + w*0.25}" y1="${y0 + h*0.40}" x2="${x0 + w*0.75}" y2="${y0 + h*0.30}" stroke="#1a1a1a" stroke-width="${cbw}" stroke-linecap="round"/>`,
      // Bottom tilted crossbar
      `<line x1="${x0 + w*0.25}" y1="${y0 + h*0.65}" x2="${x0 + w*0.75}" y2="${y0 + h*0.55}" stroke="#1a1a1a" stroke-width="${cbw}" stroke-linecap="round"/>`,
    ].join('');
  }

  // Accidentals + noteheads — rhythm-aware. If the cell has subdivisions,
  // render N noteheads spaced across the bar with the appropriate shape
  // (whole / half / quarter / eighth), stems, and rests for muted slots.
  // Falls back to a single whole note when subdivisions == 1.
  const subN = Math.max(1, sizing?.subdivisions || 1);
  const subMute = sizing?.subdivMute || [];
  const noteR = lineSp * 0.52;
  // Note SHAPE per subdivision count. (Odd values 3/5/6/7 reuse the
  // closest power-of-two for now; tuplet brackets are a follow-up.)
  //   1 → whole (open, no stem)
  //   2 → half (open, stem)
  //   3 → quarter (filled, stem) + 'triplet' feel
  //   4 → quarter (filled, stem)
  //   5–7 → eighth (filled, stem)
  //   8 → eighth (filled, stem + beam if adjacent)
  const noteKind = subN === 1 ? 'whole'
                  : subN === 2 ? 'half'
                  : (subN === 3 || subN === 4) ? 'quarter'
                  : 'eighth';
  const isOpen = noteKind === 'whole' || noteKind === 'half';
  const hasStem = noteKind !== 'whole';
  const hasFlag = noteKind === 'eighth';

  // Lay out slot positions across the available bar width. Leave room for
  // the clef at left and the bar-line at right. The first slot sits a
  // little after the clef space, subsequent slots are evenly spaced.
  const barStartX = Math.max(clefW + keySigW + accW + 6, W * 0.20);
  const barEndX   = W - 6;
  const barWidth  = barEndX - barStartX;
  const slotW     = barWidth / subN;
  const slotX = (s) => barStartX + slotW * (s + 0.5);

  // Helper: render one notehead (filled or open) at (cx, cy)
  const drawHead = (cx, cy, color, open) => {
    if (open) {
      return `<g transform="rotate(-22 ${cx} ${cy})">
        <ellipse cx="${cx}" cy="${cy}" rx="${noteR * 1.25}" ry="${noteR * 0.88}" fill="none" stroke="${color}" stroke-width="${noteR * 0.5}"/>
      </g>`;
    }
    return `<g transform="rotate(-22 ${cx} ${cy})">
      <ellipse cx="${cx}" cy="${cy}" rx="${noteR * 1.15}" ry="${noteR * 0.82}" fill="${color}" stroke="${color}" stroke-width="0.4"/>
    </g>`;
  };
  // Helper: stem that passes through ALL noteheads of a chord stack.
  // Stem direction is determined by the chord's center vs the staff's
  // middle line — high notes get down-stems (hanging), low notes get
  // up-stems (rising), like classical engraving.
  //   notesGroup: positions in the same staff
  //   staffMidY: middle line of that staff (3rd line)
  //   cx: slot center x
  //   returns: { svg, stemEndX, stemEndY, stemDir }  — last 3 are for
  //     beaming consecutive eighth notes together later.
  const drawStemForGroup = (cx, notesGroup, staffMidY, withFlag) => {
    if (!notesGroup.length) return { svg: '', stemEndX: 0, stemEndY: 0, dir: 0 };
    const ys = notesGroup.map(p => p.y);
    const minY = Math.min(...ys);   // highest pitch on screen (smaller y)
    const maxY = Math.max(...ys);   // lowest pitch on screen (larger y)
    const centerY = (minY + maxY) / 2;
    // Up-stem (-1) if the chord's center is BELOW the staff middle
    // (i.e., low notes), down-stem (+1) if ABOVE.
    const dir = centerY > staffMidY ? -1 : 1;
    const stemLen = lineSp * 3.2;
    const x = cx + (dir === -1 ? noteR * 1.1 : -noteR * 1.1);
    // Anchor at the FAR notehead (in stem direction). Extend past the
    // other end of the chord stack plus stemLen.
    let y1, y2;
    if (dir === -1) {       // up-stem: anchored at bottom note, extends up past the top
      y1 = maxY;
      y2 = minY - stemLen;
    } else {                // down-stem: anchored at top note, extends down past the bottom
      y1 = minY;
      y2 = maxY + stemLen;
    }
    let svg = `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#1a1a1a" stroke-width="${Math.max(0.9, noteR * 0.25)}" stroke-linecap="round"/>`;
    if (withFlag) {
      // Single eighth-note flag (curl) at the END of the stem.
      const flagY = y2;
      const flagW = lineSp * 1.1;
      const flagH = lineSp * 1.6 * dir * -1;   // flag curls AWAY from chord (downwards for up-stem)
      svg += `<path d="M ${x} ${flagY}
                       Q ${x + flagW * 0.6} ${flagY + flagH * 0.25},
                         ${x + flagW * 0.9} ${flagY + flagH * 0.6}
                       Q ${x + flagW * 0.4} ${flagY + flagH * 0.4},
                         ${x} ${flagY + flagH * 0.5} Z"
                fill="#1a1a1a"/>`;
    }
    return { svg, stemEndX: x, stemEndY: y2, dir };
  };
  // Helper: rest glyph for a muted slot. Picks the rest shape matching
  // the slot's duration. Drawn in the middle gap between staves so it's
  // visible without clashing with notes above/below.
  const drawRest = (cx) => {
    const restY = middleCY;  // sits at middle-C line
    const fs = lineSp * 2.4;
    let glyph;
    switch (noteKind) {
      case 'whole':   glyph = '𝄻'; break;
      case 'half':    glyph = '𝄼'; break;
      case 'quarter': glyph = '𝄽'; break;
      case 'eighth':  glyph = '𝄾'; break;
      default:        glyph = '𝄽';
    }
    return `<text x="${cx}" y="${restY + lineSp * 0.5}" text-anchor="middle"
              font-size="${fs}"
              font-family="'Bravura Text','Petaluma','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola',serif"
              fill="#1a1a1a" opacity="0.55"
              dominant-baseline="alphabetic">${glyph}</text>`;
  };

  // Single shared stem across treble + bass (grand staff = one unit).
  // Direction follows the topmost note: if it sits ABOVE F5 (the top
  // treble line) the stem HANGS DOWN; otherwise it rises up. Matches
  // classical engraving convention applied to the combined grand staff.
  const slotStems = [];   // [{cx, endY, dir}] or null for muted slots
  // Per-bar accidental memory: tracks WHICH acc ('#', 'b', or '') is in
  // effect at each y position. The baseline is the key signature (a letter
  // in sigLetterSet defaults to sig.type). When a note's acc differs from
  // whatever is currently established, we draw it AND record the change.
  // This makes redundant accidentals disappear (note matches key sig =
  // no glyph) and produces a natural sign on the first cancellation in
  // the bar.
  const accSeen = new Map();

  let notes = '';
  // Track the union of all slots' positions so the tuplet bracket clears
  // every slot's top notehead/stem (not just the base chord's).
  const allSlotPositions = [];
  // Editing-slot highlight (multi-chord cells only): caller passes
  // sizing.editingSlotIdx so we tint the column of the selected slot
  // gold/amber instead of marking the whole bar. Subtle so it reads
  // as "this is the slot you're editing" without overpowering the notes.
  const editingSlotIdx = (sizing?.editingSlotIdx !== undefined) ? sizing.editingSlotIdx : -1;
  for (let s = 0; s < subN; s++) {
    const cx = slotX(s);
    let slotInner = '';
    // Highlight rect drawn FIRST (under the notes) when this slot is the
    // currently-edited one. Spans the slot's full vertical region (treble
    // top through bass bottom) so the chord-name above + the noteheads +
    // the stem all visually belong to the highlighted column.
    if (s === editingSlotIdx) {
      // Soft amber tint behind the slot's column — chord name + notes
      // + stem all read as belonging to the highlighted column.
      slotInner += `<rect x="${cx - slotW/2 + 1}" y="0" width="${slotW - 2}" height="${H}" fill="#d4a843" opacity="0.14" rx="3"/>`;
      // Stronger underline right above the staff (just below the chord
      // name) so the user's eye can find which column is active even
      // at a glance.
      slotInner += `<line x1="${cx - slotW/2 + 2}" y1="${labelH - 1}" x2="${cx + slotW/2 - 2}" y2="${labelH - 1}" stroke="#d4a017" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    if (subMute[s]) {
      slotInner += drawRest(cx);
      slotStems.push(null);
    } else {
      // Per-slot chord data — base for single-chord cells, this slot's
      // chord (shape+root+quality) for multi-chord cells.
      const sd = getSlotData(s);
      const sPos = sd.positions;
      const sOff = sd.offsetX;
      const sPcToDeg = sd.pcToDeg;
      allSlotPositions.push(...sPos);
      slotInner += ledgersForSlot(cx, sPos);
      // Compute stem direction up-front so adjacent-step displacements can
      // be drawn on the OPPOSITE side of the stem from the regular column
      // (standard music-notation convention). E4 sits on the bottom treble
      // line; if the top note is above E4 the stem hangs down (dir=1),
      // otherwise it rises up (dir=-1).
      const slotAllY = sPos.length ? sPos.map(p => p.y) : [];
      const slotTopY = slotAllY.length ? Math.min(...slotAllY) : 0;
      const slotBotY = slotAllY.length ? Math.max(...slotAllY) : 0;
      const slotDir  = slotAllY.length ? (slotTopY < trebleBotY ? 1 : -1) : -1;
      sPos.forEach((p, i) => {
        // dir=1 (stem-down on the LEFT of cx)  → dx negative, displaced LEFT
        // dir=-1 (stem-up on the RIGHT of cx) → dx positive, displaced RIGHT
        const dx = sOff[i] ? sOff[i] * -slotDir : 0;
        const cxNote = cx + dx;
        const deg = sPcToDeg[p.pc];
        const isRoot = deg === 'R';
        const color = isRoot ? (intervalColor('R') || '#dc2626') : '#1a1a1a';
        // Decide whether this note needs an explicit accidental.
        //   baseAcc  = what's "in effect" before any per-bar override. If
        //              the letter is in the key sig, baseAcc = sig.type.
        //   established = current per-bar state at this y (defaults to baseAcc).
        //   noteAcc  = the spelling this note actually wants ('', '#' or 'b').
        // If noteAcc !== established, we draw and update the establishment.
        // No glyph needed otherwise — the key sig or a previous chromatic
        // already covers it.
        const yKey = p.y.toFixed(2);
        const baseAcc = sigLetterSet.has(p.letter) ? sig.type : '';
        const established = accSeen.has(yKey) ? accSeen.get(yKey) : baseAcc;
        const noteAcc = p.acc;
        if (noteAcc !== established) {
          // For up-stem displacements (dx > 0) the displaced note sits to
          // the RIGHT of the regular column, so its accidental at the
          // standard position lands on top of the regular notehead. Shift
          // it further left past the regular accidental column. Down-stem
          // displacements (dx < 0) already moved the note + accidental
          // into clear space, so no extra shift is needed.
          const accShift = dx > 0 ? -(dx + lineSp * 1.1) : 0;
          if (noteAcc === '#')      slotInner += svgSharp(cxNote - lineSp * 1.2 + accShift, p.y);
          else if (noteAcc === 'b') slotInner += svgFlat(cxNote - lineSp * 1.1 + accShift, p.y);
          else                       slotInner += svgNatural(cxNote - lineSp * 1.15 + accShift, p.y);
          accSeen.set(yKey, noteAcc);
        }
        slotInner += drawHead(cxNote, p.y, color, isOpen);
      });
      if (hasStem && sPos.length) {
        const stemLen = lineSp * 3.2;
        const stemX = cx + (slotDir === -1 ? noteR * 1.1 : -noteR * 1.1);
        const y1 = slotDir === -1 ? slotBotY : slotTopY;
        const y2 = slotDir === -1 ? (slotTopY - stemLen) : (slotBotY + stemLen);
        slotInner += `<line x1="${stemX}" y1="${y1}" x2="${stemX}" y2="${y2}" stroke="#1a1a1a" stroke-width="${Math.max(0.9, noteR * 0.25)}" stroke-linecap="round"/>`;
        slotStems.push({ cx: stemX, endY: y2, dir: slotDir });
      } else {
        slotStems.push(null);
      }
    }
    const hitRect = `<rect x="${cx - slotW/2}" y="${trebleTopY - lineSp}" width="${slotW}" height="${bassBotY - trebleTopY + 2 * lineSp}" fill="transparent" style="cursor:pointer" pointer-events="all"/>`;
    notes += `<g class="staff-slot" data-staff-seg="${s}">${slotInner}${hitRect}</g>`;
  }

  // Tuplet bracket for odd subdivisions (3, 5, 6, 7) — a horizontal line
  // above the staff with downturned tips at each end and the count number
  // floating in the middle. Matches classical engraving so the reader sees
  // "this is 5-against-4" instead of just five eighth notes.
  if (subN === 3 || subN === 5 || subN === 6 || subN === 7) {
    const firstX = slotX(0);
    const lastX  = slotX(subN - 1);
    // Bracket follows the TOPMOST visual element of the chord:
    //   - stem-down (common): the topmost notehead.
    //   - stem-up   (low chord): the stem-end, which sits above the notes.
    // Low chords drag the bracket downward; a ceiling near the top staff
    // line keeps it from crowding the chord-name label above.
    // Use the union of all slots' positions so the bracket clears every
    // slot's top notehead — multi-chord bars otherwise punch through.
    const bkPos      = allSlotPositions.length ? allSlotPositions : positions;
    const allYbk     = bkPos.map(p => p.y);
    const topNoteY   = allYbk.length ? Math.min(...allYbk) : trebleTopY;
    const botNoteY   = allYbk.length ? Math.max(...allYbk) : trebleBotY;
    const e4Ybk      = trebleBotY;                      // E4 = stem-flip threshold
    const stemUpBk   = hasStem && allYbk.length && topNoteY >= e4Ybk;
    const stemLenBk  = lineSp * 3.2;
    const topElement = stemUpBk ? (topNoteY - stemLenBk) : topNoteY;
    const bracketCeil = trebleTopY + lineSp * 0.1;
    const bracketY    = Math.max(bracketCeil, topElement - lineSp * 1.2);
    const tipH   = lineSp * 0.4;
    const numFs  = lineSp * 1.1;
    const numW   = numFs * 0.75;                     // gap in the bracket for the number
    const numX   = (firstX + lastX) / 2;
    // Slightly muted color for the tuplet bracket and number so it reads
    // as a metric annotation rather than another notehead — keeps the eye
    // on the actual notes while still being legible.
    const tupColor = '#6b6b6b';
    const stk    = `stroke="${tupColor}" stroke-width="0.9" stroke-linecap="round"`;
    notes += `<line x1="${firstX}" y1="${bracketY}" x2="${numX - numW/2}" y2="${bracketY}" ${stk}/>`;
    notes += `<line x1="${numX + numW/2}" y1="${bracketY}" x2="${lastX}" y2="${bracketY}" ${stk}/>`;
    notes += `<line x1="${firstX}" y1="${bracketY}" x2="${firstX}" y2="${bracketY + tipH}" ${stk}/>`;
    notes += `<line x1="${lastX}" y1="${bracketY}" x2="${lastX}" y2="${bracketY + tipH}" ${stk}/>`;
    // y is the text baseline; offset by ~0.35·fontSize so the glyph's
    // optical center sits on bracketY.
    notes += `<text x="${numX}" y="${bracketY + numFs * 0.36}" text-anchor="middle"
                font-size="${numFs}" font-family="'Cormorant Garamond', Georgia, serif"
                font-style="italic" font-weight="700" fill="${tupColor}">${subN}</text>`;
  }

  // Beams for eighth notes — connect runs of consecutive non-muted slots
  // with a horizontal bar at the stem ends. Single eighths (run of 1)
  // fall back to a flag.
  if (hasFlag && hasStem) {
    const drawBeamsAndFlags = (stems) => {
      let out = '';
      let i = 0;
      while (i < stems.length) {
        if (!stems[i]) { i++; continue; }
        // Find run of consecutive non-null stems
        let j = i;
        while (j < stems.length && stems[j]) j++;
        const run = stems.slice(i, j);
        if (run.length >= 2) {
          // Beam: thick line connecting all stem ends in the run.
          // Use the AVERAGE y of the endpoints so the beam stays straight
          // even if the stems differ slightly in length.
          const beamY = run.reduce((a, r) => a + r.endY, 0) / run.length;
          const x1 = run[0].cx;
          const x2 = run[run.length - 1].cx;
          const thick = Math.max(1.6, lineSp * 0.4);
          out += `<line x1="${x1}" y1="${beamY}" x2="${x2}" y2="${beamY}" stroke="#1a1a1a" stroke-width="${thick}" stroke-linecap="butt"/>`;
        } else {
          // Singleton — needs a flag.
          const r = run[0];
          const flagW = lineSp * 1.1;
          const flagH = lineSp * 1.6 * r.dir * -1;
          out += `<path d="M ${r.cx} ${r.endY}
                          Q ${r.cx + flagW * 0.6} ${r.endY + flagH * 0.25},
                            ${r.cx + flagW * 0.9} ${r.endY + flagH * 0.6}
                          Q ${r.cx + flagW * 0.4} ${r.endY + flagH * 0.4},
                            ${r.cx} ${r.endY + flagH * 0.5} Z"
                    fill="#1a1a1a"/>`;
        }
        i = j;
      }
      return out;
    };
    notes += drawBeamsAndFlags(slotStems);
  }

  // Chord-name label above the staff (Real-Book style). Single <text> with
  // a <tspan> for the roman numeral that uses dx for letter-by-letter
  // offset. Roman is colored by harmonic-function tag (tonic green, dom red,
  // predom gold, borrowed purple, secondary orange).
  const TAG_COLOR = {
    tonic:     '#059669',
    predom:    '#a07820',
    dom:       '#dc2626',
    borrowed:  '#9333ea',
    secondary: '#b45309',
    picardy:   '#b45309',
  };
  let nameSvg = '';
  if (slotChords) {
    // Multi-chord bar — one chord name above each slot's column, colored by
    // the slot's function tag. The label row sits ABOVE the staff, so it
    // doesn't need to respect the note area's barStartX margin (which exists
    // to leave room for the clef glyph). We reclaim the full cell width for
    // chord names: only the clef itself (when present) and the section-tag
    // chip (top-left) need clearance. This gives each name ~30% more
    // horizontal room than the note slots have, so 3-4 chord bars fit
    // without crowding.
    const sectionShift = (sizing?.sectionLabel && !showClef) ? (sizing?.minimal ? 12 : 16) : 0;
    const nameStartX = showClef ? clefW + 2 : 4 + sectionShift;
    const nameEndX   = W - 4;
    const nameSlotW  = (nameEndX - nameStartX) / subN;
    const nameSlotX  = (s) => nameStartX + nameSlotW * (s + 0.5);
    // Font size scales DOWN with slot count so adjacent names don't collide.
    // At 2 slots each name has half the bar to breathe (italic Garamond,
    // matches single-chord). At 3+ slots a condensed sans-serif so 4-5 char
    // names like "Cmaj7" still fit. Longest name drives sizing so all match.
    const longest = slotChords.reduce((m, sl) =>
      sl && sl.chordName ? Math.max(m, sl.chordName.length) : m, 1);
    // Per-char width ratios bumped from earlier draft — bold sans w/ Δ ø °
    // symbols runs ~0.6·fs in practice, not the 0.48 we'd get from regular
    // weight Latin text. 3+ slots tighten the slot budget so neighbour
    // names don't kiss even with longer suffixes (Bm7 / F#m7 / Bm9).
    const garamondRatio = 0.58;
    const sansRatio     = 0.60;
    const dense   = subN >= 3;
    const fsCap   = dense ? (sizing?.minimal ? 11 : 14) : (sizing?.minimal ? 14 : 18);
    const fsFloor = sizing?.minimal ? 7 : 8;
    const budgetFactor = dense ? 0.72 : 0.92;
    const garamondFs = Math.min(fsCap, (nameSlotW * budgetFactor) / longest / garamondRatio);
    const garamondOk = !dense && garamondFs >= (sizing?.minimal ? 10 : 12);
    const sansFs = Math.max(fsFloor,
                   Math.min(fsCap, (nameSlotW * budgetFactor) / longest / sansRatio));
    const useGaramond = garamondOk;
    const nameFs = useGaramond ? garamondFs : sansFs;
    const fontFamily = useGaramond
      ? "'Cormorant Garamond', Georgia, serif"
      : "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    const fontStyle = useGaramond ? 'italic' : 'normal';
    const ty = labelH * 0.85;
    const mutedArr = sizing?.subdivMute || [];
    for (let s = 0; s < subN; s++) {
      const slot = slotChords[s];
      if (!slot || !slot.chordName) continue;
      // Muted slot — hide the chord name too (the slot-loop above already
      // drew a rest glyph instead of noteheads; the chord name lingering
      // overhead would suggest the chord is still sounding).
      if (mutedArr[s]) continue;
      const fill = TAG_COLOR[slot.tag] || '#1a1a1a';
      nameSvg += `<text x="${nameSlotX(s)}" y="${ty}" font-size="${nameFs.toFixed(2)}"
                  text-anchor="middle"
                  font-family="${fontFamily}"
                  font-style="${fontStyle}" font-weight="700" fill="${fill}"
                  letter-spacing="0">${slot.chordName}</text>`;
    }
  } else if (nameLabel) {
    // Match the on-screen size of guitar mode's .rb-chord pill (19 px).
    // With cell ~125 wide vs viewBox W=130, inner scale is ~0.96 — so
    // nameFs 20 renders ~19 px on screen, matching the rb-chord pill in
    // compose. romanFs matches rb-roman's 11 px.
    const nameFs = sizing?.minimal ? 14 : 20;
    const romanFs = sizing?.minimal ? 10 : 12;
    // When the cell is the start of a new section, the HTML .rb-section-tag
    // chip sits at the cell's top-left (~3-17px in cell coords). Push the
    // chord name to the right so they don't overlap. Clef cells already
    // start the name at clefW+4 (past the chip), so no shift needed there.
    const sectionShift = (sizing?.sectionLabel && !showClef) ? (sizing?.minimal ? 12 : 16) : 0;
    const tx = showClef ? clefW + 4 : 4 + sectionShift;
    const ty = labelH * 0.85;
    const romanColor = TAG_COLOR[sizing?.tag] || '#5a5a64';
    const romanTspan = romanLabel
      ? `<tspan dx="${sizing?.minimal ? 6 : 10}" font-size="${romanFs}" font-weight="700" fill="${romanColor}">${romanLabel}</tspan>`
      : '';
    nameSvg += `<text x="${tx}" y="${ty}" font-size="${nameFs}"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-style="italic" font-weight="700" fill="#1a1a1a"
                letter-spacing="${sizing?.minimal ? 0.2 : 0.5}"><tspan>${nameLabel}</tspan>${romanTspan}</text>`;
  }
  // Two-layer SVG: outer stretches (preserveAspectRatio=none) so staff lines
  // and bar-line reach the actual cell edges — adjacent cells connect into
  // one continuous score. Inner keeps aspect so clef, noteheads AND the
  // chord-name label aren't horizontally distorted.
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    ${lines}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" x="0" y="0" width="100%" height="100%">
      ${clef}${keySig}${ledgers}${notes}${nameSvg}
    </svg>
  </svg>`;
}

function renderMini(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const intToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((semi % 12) + 12) % 12;
    if (!(pc in intToDeg)) intToDeg[pc] = q.degs[i];
  });

  const played = shape.filter(f => f >= 0);
  if (!played.length) return '';
  let minF = Math.min(...played);
  let maxF = Math.max(...played);
  const hasOpen = shape.some(f => f === 0);
  let span = Math.max(4, maxF - minF + 1);
  // startFret = fret-number of the TOP BAR shown (the bar above the first playable fret)
  let startFret = hasOpen ? 0 : Math.max(0, minF - 1);
  let endFret = startFret + span;
  if (!hasOpen && endFret > N_FRETS) { endFret = N_FRETS; startFret = endFret - span; }

  const W = sizing?.W || 160;
  const H = sizing?.H || 140;
  const nameLabel  = sizing?.chordName;
  const romanLabel = sizing?.roman;
  const tag        = sizing?.tag;
  // Reserve top space for the embedded chord-name label when caller asks for it.
  const labelH = nameLabel ? (sizing?.minimal ? 16 : 24) : 0;
  const ml = 18, mr = 8, mt = 18 + labelH, mb = 6;
  const innerW = W - ml - mr;
  const innerH = H - mt - mb;
  const stringSp = innerW / 5;
  const fretSp = innerH / Math.max(4, endFret - startFret);

  let s = '';
  if (startFret === 0) {
    s += `<line x1="${ml-2}" y1="${mt}" x2="${ml+innerW+2}" y2="${mt}" stroke="#1f1d18" stroke-width="4"/>`;
  } else {
    s += `<text x="${ml-4}" y="${mt+fretSp/2+3}" text-anchor="end" font-size="10" fill="#7a7a82" font-family="SF Mono">${startFret+1}fr</text>`;
  }
  for (let i = (startFret === 0 ? 1 : 0); i <= endFret - startFret; i++) {
    const y = mt + i * fretSp;
    s += `<line x1="${ml}" y1="${y}" x2="${ml+innerW}" y2="${y}" stroke="#d4d4da" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = ml + i * stringSp;
    s += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+innerH}" stroke="#a8a8b0" stroke-width="0.8"/>`;
  }
  // Inlays
  {
    const cx = ml + innerW / 2;
    const dw = Math.min(stringSp * 0.7, fretSp * 0.32);
    const dh = Math.min(fretSp * 0.32, 8);
    const drawD = (x, y) => `<polygon points="${x},${y-dh} ${x+dw},${y} ${x},${y+dh} ${x-dw},${y}" fill="#aaa496" opacity="0.55"/>`;
    [3,5,7,9,15,17,19,21].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      s += drawD(cx, y);
    });
    [12, 24].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      const off = stringSp * 1.5;
      s += drawD(cx - off, y);
      s += drawD(cx + off, y);
    });
  }
  // Barre indicator: when 2+ strings share the same fret, draw a backing bar
  // that extends from the lowest to highest such string. Strings IN BETWEEN
  // can have HIGHER frets (other fingers pressed on top of the barre) —
  // those are still under the index finger physically. Strings in between
  // that are MUTED or have LOWER frets break the barre.
  {
    const fretted = shape.filter(f => f > 0);
    const minFret = fretted.length ? Math.min(...fretted) : 0;
    const fretGroups = {};
    shape.forEach((f, sIdx) => {
      if (f > 0) {
        if (!fretGroups[f]) fretGroups[f] = [];
        fretGroups[f].push(sIdx);
      }
    });
    Object.entries(fretGroups).forEach(([f, strings]) => {
      if (strings.length < 2) return;
      strings.sort((a, b) => a - b);
      const fret = +f;
      const minS = strings[0], maxS = strings[strings.length - 1];
      // Validate: every string between minS and maxS must be playable
      // and at fret >= barre fret (no muted, no lower-fret notes).
      let valid = true;
      for (let s = minS; s <= maxS; s++) {
        if (shape[s] < 0) { valid = false; break; }       // muted in middle breaks
        if (shape[s] > 0 && shape[s] < fret) { valid = false; break; }  // lower fret in middle
      }
      if (!valid) return;
      // Only draw at the chord's lowest fret (standard barre) or as
      // a top-2-string partial (high E + B).
      const isAtMinFret = fret === minFret;
      const isTopPair = (maxS - minS) === 1 && minS === 0;
      if (!isAtMinFret && !isTopPair) return;
      const cy = mt + ((fret - startFret) - 0.5) * fretSp;
      const x1 = ml + minS * stringSp;
      const x2 = ml + maxS * stringSp;
      const noteR = sizing?.r || 11;
      s += `<rect x="${x1 - noteR}" y="${cy - noteR - 1}" width="${x2 - x1 + 2*noteR}" height="${2*noteR + 2}" rx="${noteR + 1}" fill="#1f1d18" opacity="0.13"/>`;
    });
  }
  // `minimal` covers both note-style AND label sizing (used on mobile).
  // `bwNotes` is a finer flag that ONLY switches notes to black-and-white
  // without shrinking the chord-name / roman labels — used on desktop
  // compose where we want sober dots but keep the bigger labels.
  const minimal = sizing?.minimal === true || sizing?.bwNotes === true;
  // Root tint for minimal/bwNotes tabs — a clear sober red (not the
  // brightest possible, not muted to invisibility). Sheet music already
  // paints the root red on the staff; this carries the same anchor over
  // to the tab so the eye can pattern-match root positions across
  // inversions and bars at a glance. The function-red palette (dom red,
  // secondary amber) lives on text + backgrounds elsewhere — there's no
  // actual visual conflict with this dot color on the tab surface itself.
  const ROOT_TINT = '#c62828';
  shape.forEach((fret, sIdx) => {
    const x = ml + sIdx * stringSp;
    if (fret < 0) {
      s += `<text x="${x}" y="${mt-5}" text-anchor="middle" font-size="${minimal ? 9 : 11}" fill="${minimal ? '#1a1a1a' : '#a8a8b0'}" font-weight="700">×</text>`;
      return;
    }
    const pc = noteAt(sIdx, fret);
    const rel = (pc - rootPc + 12) % 12;
    const deg = intToDeg[rel] || '';
    const isRoot = deg === 'R';
    let cy;
    if (fret === 0) {
      // Open string: small ring at the nut
      cy = mt - 7;
      if (minimal) {
        const strokeColor = isRoot ? ROOT_TINT : '#1a1a1a';
        s += `<circle cx="${x}" cy="${cy}" r="4.5" fill="none" stroke="${strokeColor}" stroke-width="1.4"/>`;
      } else {
        const color = intervalColor(deg);
        s += `<circle cx="${x}" cy="${cy}" r="6" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      }
      return;
    }
    cy = mt + ((fret - startFret) - 0.5) * fretSp;
    const r = sizing?.r || 11;
    if (minimal) {
      // Classical chord-diagram style: solid dot, no text, no colors —
      // except the root gets a muted dark-red tint so root-string position
      // is trainable at a glance.
      const dotFill = isRoot ? ROOT_TINT : '#1a1a1a';
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${dotFill}"/>`;
    } else {
      const color = intervalColor(deg);
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      const noteName = nameOf(pc, flats);
      let label = state.display === 'intervals' ? deg : noteName;
      let fontSize = label.length > 2 ? 8 : 10;
      s += `<text x="${x}" y="${cy + 3.5}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="#000">${label}</text>`;
    }
  });
  // Embedded chord-name label at the top of the SVG (Real-Book style) when
  // caller passed chordName/roman/tag in sizing.
  let nameSvg = '';
  if (nameLabel) {
    const TAG_COLOR = {
      tonic:     '#059669',
      predom:    '#a07820',
      dom:       '#dc2626',
      borrowed:  '#9333ea',
      secondary: '#b45309',
      picardy:   '#b45309',
    };
    const romanColor = TAG_COLOR[tag] || '#5a5a64';
    const nameFs  = sizing?.minimal ? 11 : 15;
    const romanFs = sizing?.minimal ? 8  : 10;
    const ty      = labelH * 0.78;
    const romanTspan = romanLabel
      ? `<tspan dx="${sizing?.minimal ? 5 : 8}" font-size="${romanFs}" font-weight="700" fill="${romanColor}">${romanLabel}</tspan>`
      : '';
    nameSvg = `<text x="${W/2}" y="${ty}" text-anchor="middle"
                 font-size="${nameFs}" font-family="'Cormorant Garamond', Georgia, serif"
                 font-style="italic" font-weight="700" fill="#1a1a1a"
                 letter-spacing="0.3"><tspan>${nameLabel}</tspan>${romanTspan}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${nameSvg}${s}</svg>`;
}

/* ─── Horizontal TAB renderer ────────────────────────────────────
   Used by multi-chord cells (cell.slots.length > 1 AND slots contain
   different chords). Same visual language as renderChordStaff (the
   piano sheet music renderer): 6 horizontal lines that extend the
   FULL width of the cell so adjacent cells connect into a continuous
   tab line, a thick brace at the left edge, a thin compás divider at
   the right edge, and chord names positioned above each slot column
   in italic serif.

   Standard guitar TAB orientation:
     line 0 (top)    = high e
     line 1          = B
     line 2          = G
     line 3          = D
     line 4          = A
     line 5 (bottom) = low E
   so shape index 0 (low E) renders at the BOTTOM line, index 5 (high e)
   at the TOP. */
function renderHorizontalTab(columns, sizing) {
  if (!columns || !columns.length) return '';
  const W = sizing?.W || 200;
  const H = sizing?.H || 130;
  const minimal = sizing?.minimal === true || sizing?.bwNotes === true;
  const N = columns.length;

  // ── Layout zones (top → bottom):
  //   1. Chord names (italic Cormorant, one per slot)
  //   2. Tuplet bracket — only when N > 1 (marks the rhythmic grouping)
  //   3. Staff: 6 string lines spanning the full cell width
  //   4. Stems extending below the bottom string
  //   5. Padding
  // Same visual language as the piano sheet music staff: cream paper +
  // black ink, italic serif labels, vertical stems anchoring each
  // chord-event, tuplet bracket for the bar's rhythmic identity.
  const hasNames = columns.some(c => c.chordName);
  const labelH = hasNames ? (minimal ? 22 : 34) : 0;
  // Longest visible chord name drives the per-slot font scaling so the
  // names never run into each other when one of them is long (Bm7b5,
  // F#m7, Cmaj7…). Same idea as the piano staff multi-chord path.
  const longestName = columns.reduce((m, c) =>
    c && c.chordName ? Math.max(m, c.chordName.length) : m, 1);
  const bracketH = N > 1 ? (minimal ? 14 : 18) : 0;
  const gapBeforeStaff = minimal ? 6 : 10;
  // Stems extend past the viewBox and get partially clipped — that's
  // fine and what the user prefers, since it lets the staff itself be
  // BIG (more lineSp, bigger fret numbers) inside the same viewBox.
  // padBot is just enough to keep the bottom string off the SVG edge.
  const stemLen = minimal ? 50 : 72;
  const padBot = minimal ? 8 : 12;
  const padTop = labelH + bracketH + gapBeforeStaff;
  const staffH = H - padTop - padBot;
  const lineSp = staffH / 5;            // 6 lines → 5 gaps
  const staffTopY = padTop;
  const staffBotY = padTop + 5 * lineSp;

  // String-name labels at the leftmost edge — one per line, telling the
  // player which guitar string each fret number sits on (lowercase 'e'
  // = high e, uppercase 'E' = low E, conventional in printed tab books).
  // Much more useful than abstract T-A-B clef letters when you're
  // actually trying to play the chord.
  const tabW = minimal ? 14 : 18;
  const slotStartX = tabW + 4;
  const slotEndX = W - 6;
  const slotW = (slotEndX - slotStartX) / N;
  const slotX = (s) => slotStartX + slotW * (s + 0.5);

  const TAG_COLOR = {
    tonic:'#059669', predom:'#a07820', dom:'#dc2626',
    borrowed:'#9333ea', secondary:'#b45309', picardy:'#b45309',
  };

  let s = '';

  // 6 string lines — extended FAR past the viewBox bounds so that
  // preserveAspectRatio="meet" centering doesn't leave visible gaps
  // between the lines' endpoints and the cell's left/right edges. The
  // SVG element has overflow="visible" so the lines aren't clipped at
  // the SVG bounds; the parent cell has overflow:hidden to keep them
  // from bleeding into adjacent cells.
  const EXT = 2000;
  for (let i = 0; i < 6; i++) {
    const y = staffTopY + i * lineSp;
    s += `<line x1="${-EXT}" y1="${y}" x2="${W + EXT}" y2="${y}" stroke="#1a1a1a" stroke-width="0.6"/>`;
  }
  // No SVG-drawn final bar line — `.rb-tab-cell` already renders a
  // 1.5px black border-right which IS the bar line. Drawing one inside
  // the SVG too produced a visible doubled stroke in play mode (and was
  // redundant in compose).

  // String-name labels — one per line (top → bottom: e B G D A E).
  // Italic Cormorant in a muted ink so they read as orientation rather
  // than competing with the fret numbers.
  const stringNames = ['e', 'B', 'G', 'D', 'A', 'E'];
  const stringFs = minimal ? 9 : 12;
  const tabCx = tabW * 0.5;
  for (let i = 0; i < 6; i++) {
    const y = staffTopY + i * lineSp;
    s += `<text x="${tabCx}" y="${y + (minimal ? 3.5 : 4)}" text-anchor="middle"
            font-size="${stringFs}" font-weight="700" font-style="italic"
            font-family="'Cormorant Garamond', Georgia, serif" fill="#7a6e5a"
            stroke="#fdfcf3" stroke-width="2.4" paint-order="stroke">${stringNames[i]}</text>`;
  }

  // Tuplet bracket above the staff (only when N > 1). Short verticals at
  // first and last slot, horizontal bar joining them with a gap in the
  // middle for the N number. Same convention as the piano's "3" bracket
  // over triplets.
  if (N > 1 && bracketH > 0) {
    const bracketY = labelH + bracketH * 0.55;
    const bx1 = slotX(0);
    const bx2 = slotX(N - 1);
    const midX = (bx1 + bx2) / 2;
    const numW = minimal ? 7 : 9;
    s += `<line x1="${bx1}" y1="${bracketY}" x2="${bx1}" y2="${bracketY + 4}" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>`;
    s += `<line x1="${bx2}" y1="${bracketY}" x2="${bx2}" y2="${bracketY + 4}" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>`;
    s += `<line x1="${bx1}" y1="${bracketY}" x2="${midX - numW}" y2="${bracketY}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    s += `<line x1="${midX + numW}" y1="${bracketY}" x2="${bx2}" y2="${bracketY}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    s += `<text x="${midX}" y="${bracketY + 4}" text-anchor="middle"
            font-size="${minimal ? 11 : 13}" font-weight="700" font-style="italic"
            font-family="'Cormorant Garamond', Georgia, serif" fill="#1a1a1a">${N}</text>`;
  }

  columns.forEach((col, ci) => {
    const cx = slotX(ci);

    // Muted slot — chord is "quitado": skip the chord name AND fret
    // numbers/stem, draw a small rest glyph in the middle of the staff
    // so the slot reads as silence. Editing underline still appears so
    // the user can see which slot has focus while it's muted.
    if (col.muted) {
      const restFs = minimal ? 14 : 20;
      s += `<text x="${cx}" y="${(staffTopY + staffBotY) / 2 + restFs * 0.3}" text-anchor="middle"
              font-size="${restFs}" fill="#1a1a1a" opacity="0.45"
              font-family="'Bravura Text','Petaluma','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola',serif">𝄽</text>`;
      if (col.isEditing) {
        const uw = slotW - 8;
        const tyE = labelH * 0.78;
        s += `<line x1="${cx - uw/2}" y1="${tyE + 4}" x2="${cx + uw/2}" y2="${tyE + 4}" stroke="#d4a017" stroke-width="1.6" stroke-linecap="round"/>`;
      }
      // Hit rect still goes below so the slot can be re-selected / un-muted
      const slotLeftXM = slotStartX + ci * slotW;
      s += `<rect x="${slotLeftXM}" y="0" width="${slotW}" height="${H}"
              fill="rgba(0,0,0,0)" pointer-events="all"
              data-multichord-slot="${ci}" style="cursor:pointer"/>`;
      return;
    }

    // Chord name above this slot — italic Cormorant, big enough to be
    // the headline. Colored by the chord's function tag (tonic=green,
    // dom=red, predom=amber, etc.). Font size shrinks based on the
    // LONGEST visible chord name + slot width so neighbouring names
    // never run into each other. Italic Cormorant ≈ 0.55·fs per char;
    // 0.88 of slotW gives a small gutter between names.
    if (col.chordName) {
      const ty = labelH * 0.78;
      const fsCap   = minimal ? 16 : 22;
      const fsFloor = minimal ? 9  : 11;
      const ideal = (slotW * 0.88) / longestName / 0.55;
      const nameFs = Math.max(fsFloor, Math.min(fsCap, ideal));
      const nameColor = TAG_COLOR[col.tag] || '#1a1a1a';
      s += `<text x="${cx}" y="${ty}" text-anchor="middle"
              font-size="${nameFs.toFixed(2)}" font-family="'Cormorant Garamond', Georgia, serif"
              font-style="italic" font-weight="700" fill="${nameColor}"
              letter-spacing="0.2">${col.chordName}</text>`;
      if (col.isEditing) {
        const uw = Math.min(slotW - 8, col.chordName.length * (nameFs * 0.55));
        s += `<line x1="${cx - uw/2}" y1="${ty + 4}" x2="${cx + uw/2}" y2="${ty + 4}" stroke="#d4a017" stroke-width="1.6" stroke-linecap="round"/>`;
      }
    }

    // Fret numbers (the "noteheads") and stem. Bigger now so the user
    // doesn't have to squint — they ARE the content, the lines just
    // anchor them.
    if (col.shape) {
      const fontSize = minimal ? 18 : 26;
      const dy = minimal ? 6 : 9;
      let topY = Infinity;            // y of the topmost played fret (for stem anchor)
      let hasAnyFret = false;
      for (let str = 0; str < 6; str++) {
        const displayIdx = 5 - str;
        const y = staffTopY + displayIdx * lineSp;
        const fret = col.shape[str];
        if (fret < 0) {
          s += `<text x="${cx}" y="${y + (minimal ? 4 : 4.5)}" text-anchor="middle"
                  font-size="${minimal ? 10 : 12}"
                  font-family="'Cormorant Garamond', Georgia, serif"
                  font-style="italic" fill="#9a948a">×</text>`;
        } else {
          hasAnyFret = true;
          if (y < topY) topY = y;
          s += `<text x="${cx}" y="${y + dy}" text-anchor="middle"
                  font-size="${fontSize}" font-weight="700"
                  font-family="'Cormorant Garamond', Georgia, serif"
                  fill="#1a1a1a">${fret}</text>`;
        }
      }
      // Stem connects all played frets vertically — anchored at the TOP
      // fret (the highest string the user is hitting in this chord) and
      // running down PAST the bottom string by stemLen. Sits to the right
      // of the number column so it doesn't cut through any digits. Same
      // convention the piano staff uses: the stem is the chord's
      // rhythmic spine, joining its noteheads visually.
      if (hasAnyFret) {
        const stemX = cx + (minimal ? 6 : 8);
        const stemY1 = topY - (minimal ? 2 : 3);   // just above the top notehead
        const stemY2 = staffBotY + stemLen;
        s += `<line x1="${stemX}" y1="${stemY1}" x2="${stemX}" y2="${stemY2}" stroke="#1a1a1a" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>`;
      }
    }

    // Invisible click target spanning this slot's column. Tapping it
    // selects the slot for editing — the next chord button press writes
    // into this slot, shift+number cycles its voicing. Drawn LAST in
    // this slot's iteration so it sits on top of the rendered content
    // and reliably receives the click.
    const slotLeftX = slotStartX + ci * slotW;
    s += `<rect x="${slotLeftX}" y="0" width="${slotW}" height="${H}"
            fill="rgba(0,0,0,0)" pointer-events="all"
            data-multichord-slot="${ci}" style="cursor:pointer"/>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" overflow="visible">${s}</svg>`;
}

/* ════════════════════════════════════════════════════════════
   CHORD MAP RENDER
   ════════════════════════════════════════════════════════════ */

const MAP_DIMS = {width: 540, height: 800};

// Cache of (chord-id → role) shown last frame, so we only run the
// fade-in animation when a popup chord FIRST appears, not on every
// _updateVisuals tick that re-renders the map.
let _popupLastShown = { cur: null, nxt: null };

// ─── Compose-mode hover-to-reveal popups ───
// When the user lingers on a chord card in compose mode, after a short
// delay we surface the productive approaches to that chord — its
// secondary dominant (V/X) and tritone sub (bII7/X) — as clickable
// popup cards. Clicking adds that hidden chord to the compose strip
// without ever needing it permanently on the map.
let _hoverTimer = null;
let _hoverChordId = null;
let _hoverAllowedIds = null;  // non-null when current hover render was restricted to a subset
const HOVER_DELAY_MS = 450;
const HOVER_EXIT_GRACE_MS = 220;
let _hoverExitTimer = null;

function _findApproachesTo(chordId) {
  const map = currentMap();
  if (!map) return [];
  const approaches = [];
  for (const id in map.chordDefs) {
    const ch = map.chordDefs[id];
    if (ch.resolvesTo === chordId) {
      // Both popup-only AND already-on-map approaches get listed. The
      // renderer decides whether to materialize a popup card or just
      // draw a connector arrow to the existing card.
      approaches.push({ id, isPopup: !!ch.popup });
    }
  }
  return approaches;
}

// When a chord on the map is the designated "sii" of a popup secondary
// dominant (e.g. viiø is the sii of V/vi), returns that dominant's
// resolvesTo target so the caller can auto-show the full ii–V popup chain.
// Only matches on-map siis (popup siis are already handled by siiOf chains).
function _findChainTargetForSii(siiChordId) {
  const map = currentMap();
  if (!map) return null;
  const defs = map.chordDefs;
  for (const id in defs) {
    const ch = defs[id];
    if (ch.popup && ch.sii === siiChordId && !defs[siiChordId]?.popup) {
      return ch.resolvesTo || null;
    }
  }
  return null;
}

// Companion to _findChainTargetForSii: returns the popup V chord's own ID
// instead of its resolvesTo target. Used to restrict hover popups to only
// the one chord directly connected to the on-map sii — not all approaches
// to the shared resolution target (e.g. don't show bII7/vi just because
// viiø is selected; only show the V/vi that actually pairs with viiø).
function _findSiiVChordId(siiChordId) {
  const map = currentMap();
  if (!map) return null;
  const defs = map.chordDefs;
  for (const id in defs) {
    const ch = defs[id];
    if (ch.popup && ch.sii === siiChordId && !defs[siiChordId]?.popup) {
      return id;
    }
  }
  return null;
}

// ─── Logical grid for popup placement ───
// The chord map IS a grid: 5 rows × 4 cols (with a potential extra
// column on the left for expansion). Each existing chord occupies one
// cell. Popups go into the NEAREST EMPTY CELL to the target chord, so
// placements respect the visual structure of the map and never overlap
// existing cards. The grid lines aren't drawn — just used internally.
const POPUP_GRID = {
  W: 96,
  H: 104,
  // Cell anchor x-coords (left edge). Existing chords already live at
  // 50 / 170 / 280 / 400 — these match.
  cols: [50, 170, 280, 400],
  // Row anchor y-coords. Existing chords land roughly on these rows.
  rows: [30, 170, 310, 450, 600],
};

// Map each chord-on-map to its (col, row) grid cell. Anything not in
// this table is treated as "not on the map" (popup-only).
const CHORD_GRID_CELL = {
  major: {
    'iii':   { col: 0, row: 0 },
    'vi':    { col: 0, row: 1 },
    'vii':   { col: 2, row: 1 },   // diatonic vii (viiø) lives mid-top
    'ii':    { col: 0, row: 2 },
    'V_ii':  { col: 1, row: 2 },
    'V_V':   { col: 2, row: 2 },
    'V7sus': { col: 3, row: 2 },
    'IV':    { col: 0, row: 3 },
    'iv':    { col: 1, row: 3 },
    'V':     { col: 2, row: 3 },
    'bVII':  { col: 0, row: 4 },
    'bII7':  { col: 2, row: 4 },
    'I':     { col: 3, row: 4 },
  },
  minor: {
    'bIII':  { col: 0, row: 0 },
    'bVI':   { col: 0, row: 1 },
    'vii7':  { col: 2, row: 1 },
    'iiø':   { col: 0, row: 2 },
    'V_V':   { col: 2, row: 2 },
    'V7sus': { col: 3, row: 2 },
    'iv':    { col: 0, row: 3 },
    'IV':    { col: 1, row: 3 },
    'V_iv':  { col: 1, row: 3 },
    'V7':    { col: 2, row: 3 },
    'bVII':  { col: 0, row: 4 },
    'bIII7': { col: 1, row: 1 },
    'bII7':  { col: 2, row: 4 },
    'i':     { col: 3, row: 4 },
    'I_pic': { col: 3, row: 4 },
  },
};

// Given a target chord ID and the chords already occupying popup slots
// this render pass, return the (col, row) of the nearest empty cell.
// Searches outward in concentric rings around the target cell.
function _findNearestEmptyCell(targetChordId, occupiedCells) {
  const tonality = state.tonality === 'minor' ? 'minor' : 'major';
  const cellMap = CHORD_GRID_CELL[tonality] || {};
  const targetCell = cellMap[targetChordId];
  if (!targetCell) return null;
  const numRows = POPUP_GRID.rows.length;
  const numCols = POPUP_GRID.cols.length;
  // Build set of occupied cells: existing chords + already-placed popups
  const occupied = new Set();
  for (const id in cellMap) {
    const c = cellMap[id];
    occupied.add(`${c.col},${c.row}`);
  }
  for (const cell of occupiedCells) {
    occupied.add(`${cell.col},${cell.row}`);
  }
  // Spiral search outward from target — closest empty cell wins.
  for (let ring = 1; ring <= Math.max(numRows, numCols); ring++) {
    const candidates = [];
    for (let dc = -ring; dc <= ring; dc++) {
      for (let dr = -ring; dr <= ring; dr++) {
        // Only check cells AT this ring's edge, not inside
        if (Math.abs(dc) !== ring && Math.abs(dr) !== ring) continue;
        const c = targetCell.col + dc;
        const r = targetCell.row + dr;
        if (c < 0 || c >= numCols || r < 0 || r >= numRows) continue;
        if (occupied.has(`${c},${r}`)) continue;
        // Manhattan distance for ordering within the ring
        candidates.push({ col: c, row: r, dist: Math.abs(dc) + Math.abs(dr) });
      }
    }
    if (candidates.length) {
      // Pick the cell with smallest Manhattan distance to the target
      candidates.sort((a, b) => a.dist - b.dist);
      return { col: candidates[0].col, row: candidates[0].row };
    }
  }
  return null;
}

// Track popup slots placed this render pass so subsequent popups for
// the same target (e.g. multiple approaches) don't land on the same cell.
let _popupOccupiedThisPass = [];

// Get the (x, y) for a popup, computed from the grid cell map.
// `idx` is unused now — we resolve via target chord and find empty cell.
function _getPopupSlot(targetNode, targetChordId, idx, popupW, popupH, gap) {
  // Reset occupied list at idx=0 (new render pass).
  if (idx === 0) _popupOccupiedThisPass = [];
  const cell = _findNearestEmptyCell(targetChordId, _popupOccupiedThisPass);
  if (!cell) {
    // Fallback: bottom-right corner if no empty cell found.
    return { x: MAP_DIMS.width - POPUP_GRID.W - 8, y: MAP_DIMS.height - POPUP_GRID.H - 8 };
  }
  _popupOccupiedThisPass.push(cell);
  const x = POPUP_GRID.cols[cell.col];
  const y = POPUP_GRID.rows[cell.row];
  return { x, y };
}

// The cell most recently claimed by _getPopupSlot — lets a chained
// secondary ii anchor itself next to the dominant popup just placed.
function _lastPopupCell() {
  return _popupOccupiedThisPass.length
    ? _popupOccupiedThisPass[_popupOccupiedThisPass.length - 1]
    : null;
}

// Like _findNearestEmptyCell but anchored at an explicit {col,row} cell
// instead of a chord id. Used to seat the chained secondary ii right
// beside its secondary-V popup, which owns no fixed grid cell of its own.
function _getPopupSlotNearCell(anchorCell) {
  if (!anchorCell) return { x: MAP_DIMS.width - POPUP_GRID.W - 8, y: MAP_DIMS.height - POPUP_GRID.H - 8 };
  const tonality = state.tonality === 'minor' ? 'minor' : 'major';
  const cellMap = CHORD_GRID_CELL[tonality] || {};
  const numRows = POPUP_GRID.rows.length, numCols = POPUP_GRID.cols.length;
  const occupied = new Set();
  for (const id in cellMap) { const c = cellMap[id]; occupied.add(`${c.col},${c.row}`); }
  for (const cell of _popupOccupiedThisPass) occupied.add(`${cell.col},${cell.row}`);
  for (let ring = 1; ring <= Math.max(numRows, numCols); ring++) {
    const candidates = [];
    for (let dc = -ring; dc <= ring; dc++) for (let dr = -ring; dr <= ring; dr++) {
      if (Math.abs(dc) !== ring && Math.abs(dr) !== ring) continue;
      const c = anchorCell.col + dc, r = anchorCell.row + dr;
      if (c < 0 || c >= numCols || r < 0 || r >= numRows) continue;
      if (occupied.has(`${c},${r}`)) continue;
      candidates.push({ col: c, row: r, dist: Math.abs(dc) + Math.abs(dr) });
    }
    if (candidates.length) {
      candidates.sort((a, b) => a.dist - b.dist);
      const pick = { col: candidates[0].col, row: candidates[0].row };
      _popupOccupiedThisPass.push(pick);
      return { x: POPUP_GRID.cols[pick.col], y: POPUP_GRID.rows[pick.row] };
    }
  }
  return { x: MAP_DIMS.width - POPUP_GRID.W - 8, y: MAP_DIMS.height - POPUP_GRID.H - 8 };
}

function _renderHoverPopups(chordId, allowedIds) {
  if (!chordId) return;
  // Skip if the player is engaged — compose-only feature.
  if (player.playing || player.paused) return;
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  if (!wrap) return;
  // ── Pre-clear route check ──
  // Compute approaches BEFORE touching the DOM so we can bail or re-route
  // without wiping visible popups. Key case: hovering viiø (no popup
  // approaches of its own) redirects to the vi chain so V/vi stays clickable.
  const approaches = _findApproachesTo(chordId);
  if (!approaches.some(a => a.isPopup)) {
    if (typeof _findChainTargetForSii === 'function') {
      const chainTarget = _findChainTargetForSii(chordId);
      if (chainTarget) {
        // Already showing the right chain → stay put; otherwise re-route.
        // Pass allowedIds restricted to the specific V chord paired with
        // this sii so that unrelated approaches to chainTarget (e.g. bII7)
        // don't appear just because they share the same resolution target.
        if (_hoverChordId !== chainTarget) {
          _hoverChordId = chainTarget;
          const vId = _findSiiVChordId(chordId);
          _renderHoverPopups(chainTarget, vId ? new Set([vId]) : null);
        }
        return;
      }
    }
    if (!approaches.length) return;   // no approaches at all — bail without clearing
  }
  // Record whether this render is restricted so the mousemove guard can let
  // a direct hover on the same chord override with the full set of approaches.
  _hoverAllowedIds = allowedIds || null;
  // Clear any prior hover popups — preserve persistent (clicked/active)
  // cards AND partner-pinned ones (the still-clickable partner of a freshly
  // composed ii→V→I chain step). Without :not(.partner-pinned) the next
  // mousemove over the partner card would wipe it before the user could
  // click it.
  Array.from(wrap.querySelectorAll('.map-card.popup.hover:not(.persistent):not(.partner-pinned)')).forEach(el => el.remove());
  // Preserve persistent (already-composed popup) AND partner-pinned arrows.
  // Without these exclusions, the connector arrow of a composed secondary
  // dominant would vanish the moment the cursor hovered any other chord —
  // the card stayed (since it's .persistent), but its arrow blinked out.
  if (arrowsSvg) Array.from(arrowsSvg.querySelectorAll('.hover-arrow:not(.persistent):not(.partner-pinned)')).forEach(el => el.remove());
  const map = currentMap();
  if (!map) return;
  // Find the target card's position from its node.
  let targetNode = null;
  for (const nid in map.nodes) {
    if (map.nodes[nid].chord === chordId) { targetNode = map.nodes[nid]; break; }
  }
  if (!targetNode) return;
  // (approaches already computed above — no second call needed)
  const flats = useFlatsFor(state.keyPc);
  const POPUP_W = 96, POPUP_H = 104, GAP = 18;

  // Reset the per-pass occupied list before allocating grid slots.
  _popupOccupiedThisPass = [];

  // Highlight the target card itself while popups are visible —
  // makes the relationship obvious at a glance.
  const targetCard = wrap.querySelector(`.map-card[data-chord="${chordId}"]:not(.popup)`);
  if (targetCard) targetCard.classList.add('hover-target');

  // Functional label for each popup based on its metadata.
  const labelFor = (ch) => {
    if (ch.siiOf) return 'SECONDARY ii';
    if (ch.tag === 'secondary') return 'SECONDARY DOM';
    if (ch.borrowedFrom) return 'MODAL INTERCHANGE';
    if (ch.tag === 'borrowed' && /^bII7/.test(ch.roman)) return 'TRITONE SUB';
    return 'APPROACH';
  };

  // Locate an on-map node by chord id (null if popup-only).
  const findNodeFor = (cid) => {
    for (const nid in map.nodes) if (map.nodes[nid].chord === cid) return map.nodes[nid];
    return null;
  };

  // Build a clickable popup card for a popup-only chord at (x, y).
  // Shared by the secondary-dominant approach and its chained ii.
  const buildPopupCard = (appId, chDef, x, y) => {
    const root = (state.keyPc + chDef.deg) % 12;
    let shape = null;
    if (typeof bestStartingVoicing === 'function') {
      const v = bestStartingVoicing(chDef.quality, root);
      if (v) shape = v.shape;
    }
    const chordName = chordNameForVoicing(chDef.quality, root, shape, flats)
      || (nameOf(root, flats) + QUALITIES[chDef.quality].sfx);
    const miniSvg = shape && typeof renderMini === 'function'
      ? renderMini(shape, root, chDef.quality, flats, { W: POPUP_W - 8, H: POPUP_H - 42, r: 6.5 })
      : '';
    const card = document.createElement('div');
    card.className = `map-card popup hover tag-${chDef.tag}`;
    card.style.left = `${x}px`;
    card.style.top = `${y}px`;
    card.style.width = `${POPUP_W}px`;
    card.style.height = `${POPUP_H}px`;
    card.dataset.chord = appId;
    card.dataset.popup = '1';
    card.innerHTML = `
      <div class="mc-popup-funclabel">${labelFor(chDef)}</div>
      <div class="mc-top">
        <span class="mc-roman">${chDef.roman}</span>
        <span class="mc-name">${chordName}</span>
      </div>
      <div class="mc-svg-wrap">${miniSvg}</div>
    `;
    card.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const chDefs = (currentMap() || {}).chordDefs || {};
      const isSecondaryIi = !!(chDefs[appId] && chDefs[appId].siiOf);

      if (isSecondaryIi) {
        // ── Secondary-ii chain step ──
        // composeAddChord → renderAll → renderChordMap wipes every .map-card,
        // which would destroy the whole visible chain. To keep "2 stays green,
        // 5 stays clickable at exactly the same spot", we:
        //   1. Snapshot every hover-popup card + arrow BEFORE the wipe
        //   2. Call composeAddChord (wipe happens inside)
        //   3. Re-inject the cards at their original pixel positions:
        //      the ii card gets persistent (green) styling, the V card gets
        //      a fresh click listener so it's still usable.
        const mapWrap   = document.getElementById('chord-map');
        const svgArrows = document.getElementById('map-arrows');

        const snapCards = [...mapWrap.querySelectorAll('.map-card.popup.hover')].map(c => ({
          appId:    c.dataset.chord,
          isIi:     c.dataset.chord === appId,
          left:     c.style.left,
          top:      c.style.top,
          width:    c.style.width,
          height:   c.style.height,
          innerHTML: c.innerHTML,
          className: c.className,   // snapshot BEFORE adding persistent
        }));
        // Pre-apply persistent to the ii card NOW so it goes green instantly
        // (transition:none on .persistent means no white flash).
        card.classList.add('persistent');
        const snapArrows = [...(svgArrows?.querySelectorAll('.hover-arrow') || [])].map(a => a.cloneNode(true));

        _persistentPopupChordId = null;
        _persistentPopupNode    = null;
        if (typeof composeAddChord === 'function') {
          composeAddChord(appId, ev.shiftKey, _shiftSide === 'left' ? -1 : 1);
        }

        // Re-inject at original positions.
        _hoverChordId = chordId;
        snapCards.forEach(snap => {
          const el = document.createElement('div');
          // ii → persistent (green pulse); V partners → normal hover BUT
          // marked .partner-pinned so the next mousemove over the popup
          // (or over the parent map) doesn't wipe it via _clearHoverPopups.
          // The pinned partner only goes away when the persistent ii does
          // (see _clearPersistentPopup), so the user can click V next to
          // complete the ii→V→I chain.
          el.className = snap.isIi
            ? snap.className + ' persistent'
            : snap.className + ' partner-pinned';
          el.style.cssText = `left:${snap.left};top:${snap.top};width:${snap.width};height:${snap.height};position:absolute;`;
          el.dataset.chord  = snap.appId;
          el.dataset.popup  = '1';
          el.innerHTML      = snap.innerHTML;
          if (!snap.isIi) {
            // Reattach click handler so V is still composable.
            const vAppId = snap.appId;
            el.addEventListener('click', (ev2) => {
              ev2.stopPropagation();
              _persistentPopupChordId = vAppId;
              _persistentPopupNode    = chordId;
              if (typeof composeAddChord === 'function') {
