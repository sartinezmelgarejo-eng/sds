                composeAddChord(vAppId, ev2.shiftKey, _shiftSide === 'left' ? -1 : 1);
              }
              _clearHoverPopups();
            });
          }
          mapWrap.appendChild(el);
        });
        if (svgArrows) snapArrows.forEach(a => {
          // Mark the re-injected arrow as partner-pinned too so the next
          // mousemove / hover render doesn't wipe it. Tied to the persistent
          // popup's lifetime via _clearPersistentPopup.
          a.classList.add('partner-pinned');
          svgArrows.appendChild(a);
        });
        return;
      }

      // ── Secondary-V chain step (clicking the dominant first) ──
      // Mirror of the ii-first path: if the clicked popup IS the dominant
      // (has a popup sii), keep the ii partner visible at its original position
      // so the user can click it second (both-ways chain navigation).
      const isSecondaryV = !!(chDefs[appId]?.sii && chDefs[chDefs[appId].sii]?.popup);

      if (isSecondaryV) {
        const mapWrap   = document.getElementById('chord-map');
        const svgArrows = document.getElementById('map-arrows');
        const snapCards = [...mapWrap.querySelectorAll('.map-card.popup.hover')].map(c => ({
          appId:    c.dataset.chord,
          isV:      c.dataset.chord === appId,
          left:     c.style.left,
          top:      c.style.top,
          width:    c.style.width,
          height:   c.style.height,
          innerHTML: c.innerHTML,
          className: c.className,
        }));
        card.classList.add('persistent');
        const snapArrows = [...(svgArrows?.querySelectorAll('.hover-arrow') || [])].map(a => a.cloneNode(true));
        _persistentPopupChordId = null;
        _persistentPopupNode    = null;
        if (typeof composeAddChord === 'function') {
          composeAddChord(appId, ev.shiftKey, _shiftSide === 'left' ? -1 : 1);
        }
        _hoverChordId = chordId;
        snapCards.forEach(snap => {
          const el = document.createElement('div');
          // V = green persistent; ii partner = pinned hover so a mousemove
          // doesn't immediately wipe it via _clearHoverPopups. Same fix as
          // the ii-first path above — keeps the chain visible until the
          // user either clicks ii to add it or composes elsewhere.
          el.className = snap.isV
            ? snap.className + ' persistent'
            : snap.className + ' partner-pinned';
          el.style.cssText = `left:${snap.left};top:${snap.top};width:${snap.width};height:${snap.height};position:absolute;`;
          el.dataset.chord  = snap.appId;
          el.dataset.popup  = '1';
          el.innerHTML      = snap.innerHTML;
          if (!snap.isV) {
            const iiAppId = snap.appId;
            el.addEventListener('click', (ev2) => {
              ev2.stopPropagation();
              _persistentPopupChordId = iiAppId;
              _persistentPopupNode    = chordId;
              if (typeof composeAddChord === 'function') {
                composeAddChord(iiAppId, ev2.shiftKey, _shiftSide === 'left' ? -1 : 1);
              }
              _clearHoverPopups();
            });
          }
          mapWrap.appendChild(el);
        });
        if (svgArrows) snapArrows.forEach(a => {
          // Mark the re-injected arrow as partner-pinned too so the next
          // mousemove / hover render doesn't wipe it. Tied to the persistent
          // popup's lifetime via _clearPersistentPopup.
          a.classList.add('partner-pinned');
          svgArrows.appendChild(a);
        });
        return;
      }

      // ── Normal popup click ──
      // Pre-apply persistent immediately so the card goes green on click
      // with no transition (transition:none on .persistent prevents the
      // cream→white→green blink).
      card.classList.add('persistent');
      _persistentPopupChordId = appId;
      _persistentPopupNode   = chordId;
      // Save exact pixel position so _redrawPersistentPopup re-uses the
      // same slot (not always slot-0 which would shift slot-1 cards).
      _persistentPopupPos = { x: parseFloat(card.style.left), y: parseFloat(card.style.top) };
      if (typeof composeAddChord === 'function') {
        composeAddChord(appId, ev.shiftKey, _shiftSide === 'left' ? -1 : 1);
      }
      // No _clearHoverPopups() here — renderChordMap already wipes the DOM
      // and auto-popup re-establishes the connection cards for the focused chord.
    });
    return card;
  };

  // Generic two-point connector arrow (used for the ii → V link, which
  // points to the dominant card rather than the hovered target).
  const drawArrowPts = (fromX, fromY, toX, toY) => {
    if (!arrowsSvg) return;
    const dx = toX - fromX, dy = toY - fromY;
    const mx = fromX + dx * 0.5;
    const my = fromY + dy * 0.5 - 16;
    const ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('class', 'hover-arrow');
    path.setAttribute('d', `M ${fromX} ${fromY} Q ${mx} ${my} ${toX} ${toY}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent, #a07820)');
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', 'url(#ah-hl)');
    path.setAttribute('opacity', '0.85');
    arrowsSvg.appendChild(path);
  };

  // Helper to draw a connector arrow from any (x, y) to the target chord.
  const drawArrowFrom = (fromX, fromY) => {
    if (!arrowsSvg) return;
    const toX = targetNode.x + 48;
    const toY = targetNode.y + 50;
    const dx = toX - fromX, dy = toY - fromY;
    const mx = fromX + dx * 0.5;
    const my = fromY + dy * 0.5 - 16;
    const ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('class', 'hover-arrow');
    path.setAttribute('d', `M ${fromX} ${fromY} Q ${mx} ${my} ${toX} ${toY}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent, #a07820)');
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', 'url(#ah-hl)');
    path.setAttribute('opacity', '0.85');
    arrowsSvg.appendChild(path);
  };

  // Allocate grid slots only for popup-only approaches; on-map ones use
  // their own existing position for the arrow source.
  // When allowedIds is set, restrict to only the directly-connected chords
  // (e.g. when viiø is focused, show only V/vi — not bII7/vi — even though
  // both share 'vi' as their resolution target).
  const visibleApproaches = allowedIds
    ? approaches.filter(a => allowedIds.has(a.id))
    : approaches;
  let popupSlotIdx = 0;
  visibleApproaches.forEach((approach) => {
    const appId = approach.id;
    const ch = map.chordDefs[appId];
    if (!ch) return;
    // `domAnchor` = the point the secondary V occupies, so its chained
    // secondary ii can draw an arrow INTO it (ii → V), not into the target.
    // `domNode` / `domCell` tell the ii where to seat itself.
    let domAnchorX, domAnchorY, domNode = null, domCell = null;
    // ── Case A: approach is ALREADY a card on the map ──
    // Don't create a popup, just draw a connector arrow from its
    // existing card to the hovered target. This handles V/ii, V/V,
    // etc. — the secondary dominants permanently visible on the map.
    if (!approach.isPopup) {
      domNode = findNodeFor(appId);
      if (!domNode) return;
      domAnchorX = domNode.x + 48;
      domAnchorY = domNode.y + 50;
      drawArrowFrom(domAnchorX, domAnchorY);
    } else {
      // ── Case B: approach is popup-only — render its card + arrow ──
      // If this chord is already showing as the persistent popup, reuse its
      // existing position instead of creating a duplicate card.
      const existingPersistent = (appId === _persistentPopupChordId)
        ? wrap.querySelector(`.map-card.popup.persistent[data-chord="${appId}"]`)
        : null;
      if (existingPersistent) {
        domAnchorX = parseFloat(existingPersistent.style.left) + POPUP_W / 2;
        domAnchorY = parseFloat(existingPersistent.style.top) + POPUP_H / 2;
        drawArrowFrom(domAnchorX, domAnchorY);
        domCell = null; // no new cell allocated
      } else {
        const { x, y } = _getPopupSlot(targetNode, chordId, popupSlotIdx, POPUP_W, POPUP_H, GAP);
        popupSlotIdx++;
        domCell = _lastPopupCell();
        const card = buildPopupCard(appId, ch, x, y);
        wrap.appendChild(card);
        domAnchorX = x + POPUP_W / 2;
        domAnchorY = y + POPUP_H / 2;
        drawArrowFrom(domAnchorX, domAnchorY);
      }
    }
    // ── Chain the secondary ii in front of this secondary dominant ──
    // Completes the ii–V-of-X: if the "2" is already an on-map node
    // (vi for V/V, viiø for V/vi) just connect it; otherwise materialize
    // it as its own popup seated right beside the dominant.
    if (ch.sii) {
      const siiId = ch.sii;
      const siiCh = map.chordDefs[siiId];
      if (siiCh) {
        const siiNode = findNodeFor(siiId);
        if (siiNode) {
          // On-map "2" → arrow from its card into the dominant.
          drawArrowPts(siiNode.x + 48, siiNode.y + 50, domAnchorX, domAnchorY);
        } else if (siiCh.popup) {
          // Popup-only "2" → seat it next to the V (node's grid cell in
          // Case A, the just-placed popup's cell in Case B), arrow into the V.
          const slot = domNode
            ? _getPopupSlot(domNode, appId, popupSlotIdx, POPUP_W, POPUP_H, GAP)
            : _getPopupSlotNearCell(domCell);
          popupSlotIdx++;
          const siiCard = buildPopupCard(siiId, siiCh, slot.x, slot.y);
          wrap.appendChild(siiCard);
          drawArrowPts(slot.x + POPUP_W / 2, slot.y + POPUP_H / 2, domAnchorX, domAnchorY);
        }
      }
    }
  });
}

// Tracks the popup chord the user last clicked-to-add. Stays on the
// map with a "persistent" active style (like a playing card) until
// another chord is added via any path. Independent of the hover
// system so it survives mouseleave / new hovers.
let _persistentPopupChordId = null;
let _persistentPopupNode = null;     // remembered target node for re-render
let _persistentPopupPos  = null;     // exact {x,y} the card occupied when clicked

function _clearHoverPopups() {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  if (wrap) {
    // Only remove hover popups that AREN'T marked persistent OR pinned
    // partner. The clicked one stays as the "currently composing" active
    // indicator; pinned partners stay so the user can still complete the
    // ii→V→I chain after composing the first step.
    Array.from(wrap.querySelectorAll('.map-card.popup.hover:not(.persistent):not(.partner-pinned)')).forEach(el => el.remove());
    // Target highlight only goes away if there's no persistent popup
    // for it — otherwise keep the gold ring so the relationship reads.
    Array.from(wrap.querySelectorAll('.map-card.hover-target')).forEach(c => {
      if (c.dataset.chord !== _persistentPopupNode) c.classList.remove('hover-target');
    });
  }
  if (arrowsSvg) {
    // Same logic for arrows — keep the arrow tied to the persistent popup.
    Array.from(arrowsSvg.querySelectorAll('.hover-arrow:not(.persistent):not(.partner-pinned)')).forEach(el => el.remove());
  }
  _hoverChordId = null;
  _hoverAllowedIds = null;
}

// Drop the persistent popup (called when the user composes another
// chord, so only the most-recent addition stays highlighted).
function _clearPersistentPopup() {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  if (wrap) {
    Array.from(wrap.querySelectorAll('.map-card.popup.persistent')).forEach(el => el.remove());
    // Partner-pinned cards are tied to the persistent one — when the
    // persistent goes, the partner should follow (the chain is no longer
    // active so the unfilled half of the chain has no context).
    Array.from(wrap.querySelectorAll('.map-card.popup.partner-pinned')).forEach(el => el.remove());
    Array.from(wrap.querySelectorAll('.map-card.hover-target')).forEach(c => c.classList.remove('hover-target'));
  }
  if (arrowsSvg) {
    Array.from(arrowsSvg.querySelectorAll('.hover-arrow.persistent')).forEach(el => el.remove());
    Array.from(arrowsSvg.querySelectorAll('.hover-arrow.partner-pinned')).forEach(el => el.remove());
  }
  _persistentPopupChordId = null;
  _persistentPopupNode = null;
  _persistentPopupPos  = null;
}

// Re-render the persistent popup from its saved (approachId, targetId).
// Called from renderChordMap after a fresh map render, so the persistent
// card survives the wrap.innerHTML wipe that happens when composeAddChord
// (or any other compose action) triggers renderAll. If nothing is
// pinned, no-op.
function _redrawPersistentPopup() {
  if (!_persistentPopupChordId || !_persistentPopupNode) return;
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  if (!wrap) return;
  const map = currentMap();
  if (!map) return;
  const ch = map.chordDefs[_persistentPopupChordId];
  if (!ch) { _persistentPopupChordId = null; _persistentPopupNode = null; return; }
  let targetNode = null;
  for (const nid in map.nodes) {
    if (map.nodes[nid].chord === _persistentPopupNode) { targetNode = map.nodes[nid]; break; }
  }
  if (!targetNode) return;
  const flats = useFlatsFor(state.keyPc);
  const POPUP_W = 96, POPUP_H = 104, GAP = 18;
  // Prefer the exact pixel position saved at click time — this preserves
  // whichever slot the card occupied (slot 1 cards used to jump to slot 0).
  // Fall back to the slot allocator for cases where no position was saved
  // (e.g. page reload restoring a persisted state).
  const { x, y } = _persistentPopupPos
    || _getPopupSlot(targetNode, _persistentPopupNode, 0, POPUP_W, POPUP_H, GAP);
  const root = (state.keyPc + ch.deg) % 12;
  let shape = null;
  if (typeof bestStartingVoicing === 'function') {
    const v = bestStartingVoicing(ch.quality, root);
    if (v) shape = v.shape;
  }
  const chordName = chordNameForVoicing(ch.quality, root, shape, flats)
    || (nameOf(root, flats) + QUALITIES[ch.quality].sfx);
  const miniSvg = shape && typeof renderMini === 'function'
    ? renderMini(shape, root, ch.quality, flats, { W: POPUP_W - 8, H: POPUP_H - 42, r: 6.5 })
    : '';
  const labelTxt = ch.tag === 'secondary' ? 'SECONDARY DOM'
                  : ch.borrowedFrom ? 'MODAL INTERCHANGE'
                  : (ch.tag === 'borrowed' && /^bII7/.test(ch.roman)) ? 'TRITONE SUB'
                  : 'APPROACH';
  const card = document.createElement('div');
  card.className = `map-card popup hover persistent tag-${ch.tag}`;
  card.style.left = `${x}px`;
  card.style.top = `${y}px`;
  card.style.width = `${POPUP_W}px`;
  card.style.height = `${POPUP_H}px`;
  card.dataset.chord = _persistentPopupChordId;
  card.dataset.popup = '1';
  card.innerHTML = `
    <div class="mc-popup-funclabel">${labelTxt}</div>
    <div class="mc-top">
      <span class="mc-roman">${ch.roman}</span>
      <span class="mc-name">${chordName}</span>
    </div>
    <div class="mc-svg-wrap">${miniSvg}</div>
  `;
  wrap.appendChild(card);
  // Mark the target with the hover-target highlight so the relationship reads.
  const targetCard = wrap.querySelector(`.map-card[data-chord="${_persistentPopupNode}"]:not(.popup)`);
  if (targetCard) targetCard.classList.add('hover-target');
  // Re-draw the connector arrow.
  if (arrowsSvg) {
    const fromX = x + POPUP_W / 2;
    const fromY = y + POPUP_H / 2;
    const toX = targetNode.x + 48;
    const toY = targetNode.y + 50;
    const dx = toX - fromX, dy = toY - fromY;
    const mx = fromX + dx * 0.5;
    const my = fromY + dy * 0.5 - 16;
    const ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('class', 'hover-arrow persistent');
    path.setAttribute('d', `M ${fromX} ${fromY} Q ${mx} ${my} ${toX} ${toY}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent, #a07820)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', 'url(#ah-hl)');
    arrowsSvg.appendChild(path);
  }
}

// ─── Mobile: press-and-hold reveals popups, release on one to plug it ───
// Touch equivalent of the desktop hover system. User presses a chord,
// holds 450ms → popups appear. While still pressed, they can drag their
// finger onto a popup; releasing on it adds THAT chord to compose. If
// they release on the original card, it adds the original. If they
// release outside, nothing is added. Short taps (release before timer)
// fall through to the normal click handler.
let _touchHoldTimer = null;
let _touchState = null;          // { startX, startY, origChordId, origCard, popupsShown }
const TOUCH_HOLD_MS = 450;
const TOUCH_CANCEL_DIST = 14;    // px of movement that aborts the hold

function _setupChordMapTouch() {
  const wrap = document.getElementById('chord-map');
  if (!wrap) return false;

  // Prevent iOS/Android native long-press context menu from stealing the hold.
  wrap.addEventListener('contextmenu', (e) => { e.preventDefault(); });

  wrap.addEventListener('touchstart', (e) => {
    if (player.playing || player.paused) return;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const card = t.target.closest && t.target.closest('.map-card');
    if (!card || card.classList.contains('popup')) return;
    const chordId = card.dataset.chord;
    if (!chordId) return;
    // We're in compose mode tracking a valid tap. Call preventDefault to:
    //   1. Block the iOS callout / text-selection magnifier (belt-and-suspenders
    //      alongside the CSS user-select:none on .chord-map).
    //   2. Suppress the browser-generated synthetic click that would fire ~300ms
    //      after touchend — we'll fire it ourselves in touchend for short taps
    //      so we stay in full control of timing.
    // IMPORTANT: this runs ONLY when all guards above passed (compose mode, single
    // finger, on a non-popup card), so playing/paused taps and popup-card taps
    // are unaffected and still get their native click.
    e.preventDefault();
    _touchState = {
      startX: t.clientX,
      startY: t.clientY,
      origChordId: chordId,
      origCard: card,
      popupsShown: false,
    };
    clearTimeout(_touchHoldTimer);
    _touchHoldTimer = setTimeout(() => {
      if (!_touchState) return;
      _hoverChordId = chordId;
      _renderHoverPopups(chordId);
      _touchState.popupsShown = true;
      // Light haptic if the device supports it — confirms the hold landed.
      if (navigator.vibrate) try { navigator.vibrate(15); } catch(e) {}
    }, TOUCH_HOLD_MS);
  });

  wrap.addEventListener('touchmove', (e) => {
    if (!_touchState) return;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - _touchState.startX;
    const dy = t.clientY - _touchState.startY;
    // If the user moves significantly BEFORE popups appear, abort the
    // hold (they're probably scrolling or accidentally dragging).
    if (!_touchState.popupsShown) {
      if (Math.hypot(dx, dy) > TOUCH_CANCEL_DIST) {
        clearTimeout(_touchHoldTimer);
        _touchState = null;
      }
      return;
    }
    // After popups appear, follow the finger and visually mark the
    // popup it's currently over so the user sees the target before release.
    const under = document.elementFromPoint(t.clientX, t.clientY);
    const popUnder = under && under.closest && under.closest('.map-card.popup.hover');
    document.querySelectorAll('.map-card.popup.hover.touch-over').forEach(c =>
      c.classList.remove('touch-over'));
    if (popUnder) popUnder.classList.add('touch-over');
  }, { passive: true });

  wrap.addEventListener('touchend', (e) => {
    if (!_touchState) return;
    clearTimeout(_touchHoldTimer);
    const wasHold = _touchState.popupsShown;
    if (!wasHold) {
      // Short tap — touchstart's e.preventDefault() blocked the native click on
      // most browsers, so we fire it manually here. But on some iOS/Android
      // versions preventDefault doesn't fully suppress the synthetic click,
      // and the card handler then ran TWICE — adding the chord twice on tap.
      // Tag the card with a brief "pending synthetic" window so the click
      // handler can swallow the trusted click that arrives right after our
      // manual (untrusted) one.
      const cardToClick = _touchState.origCard;
      _touchState = null;
      cardToClick._pendingSyntheticClick = true;
      // Clear the flag after a safety window in case the synthetic never fires.
      setTimeout(() => { cardToClick._pendingSyntheticClick = false; }, 350);
      cardToClick.click();
      return;
    }
    // Hold released — decide what to add based on final finger position.
    const t = e.changedTouches[0];
    e.preventDefault();      // suppress synthetic click after the long-press
    if (!t) { _touchState = null; return; }
    const under = document.elementFromPoint(t.clientX, t.clientY);
    const popUnder = under && under.closest && under.closest('.map-card.popup.hover');
    if (popUnder) {
      // Released on a popup → add THAT chord.
      const appId = popUnder.dataset.chord;
      const chDefs = (currentMap() || {}).chordDefs || {};
      const isSecondaryIi = !!(chDefs[appId] && chDefs[appId].siiOf);
      const origChordId = _touchState.origChordId;

      if (isSecondaryIi) {
        // Same save/restore logic as the desktop click path: keep the ii green
        // and the V partner visible at its original position after the wipe.
        const mapWrap   = document.getElementById('chord-map');
        const svgArrows = document.getElementById('map-arrows');
        const snapCards = [...mapWrap.querySelectorAll('.map-card.popup.hover')].map(c => ({
          appId: c.dataset.chord, isIi: c.dataset.chord === appId,
          left: c.style.left, top: c.style.top,
          width: c.style.width, height: c.style.height,
          innerHTML: c.innerHTML, className: c.className,
        }));
        // Pre-apply persistent to the ii card for instant green (no blink).
        popUnder.classList.add('persistent');
        const snapArrows = [...(svgArrows?.querySelectorAll('.hover-arrow') || [])].map(a => a.cloneNode(true));
        _persistentPopupChordId = null;
        _persistentPopupNode    = null;
        if (typeof composeAddChord === 'function') composeAddChord(appId, false, 1);
        _hoverChordId = origChordId;
        snapCards.forEach(snap => {
          const el = document.createElement('div');
          el.className = snap.isIi
            ? snap.className + ' persistent'
            : snap.className + ' partner-pinned';
          el.style.cssText = `left:${snap.left};top:${snap.top};width:${snap.width};height:${snap.height};position:absolute;`;
          el.dataset.chord = snap.appId;
          el.dataset.popup = '1';
          el.innerHTML = snap.innerHTML;
          if (!snap.isIi) {
            const vAppId = snap.appId;
            el.addEventListener('click', (ev2) => {
              ev2.stopPropagation();
              _persistentPopupChordId = vAppId;
              _persistentPopupNode    = origChordId;
              if (typeof composeAddChord === 'function') composeAddChord(vAppId, false, 1);
              _clearHoverPopups();
            });
          }
          mapWrap.appendChild(el);
        });
        if (svgArrows) snapArrows.forEach(a => {
          a.classList.add('partner-pinned');
          svgArrows.appendChild(a);
        });
      } else {
        const isSecondaryV = !!(chDefs[appId]?.sii && chDefs[chDefs[appId].sii]?.popup);
        if (isSecondaryV) {
          // V-first touch path: keep the ii partner visible.
          const mapWrap   = document.getElementById('chord-map');
          const svgArrows = document.getElementById('map-arrows');
          const snapCards = [...mapWrap.querySelectorAll('.map-card.popup.hover')].map(c => ({
            appId: c.dataset.chord, isV: c.dataset.chord === appId,
            left: c.style.left, top: c.style.top,
            width: c.style.width, height: c.style.height,
            innerHTML: c.innerHTML, className: c.className,
          }));
          popUnder.classList.add('persistent');
          const snapArrows = [...(svgArrows?.querySelectorAll('.hover-arrow') || [])].map(a => a.cloneNode(true));
          _persistentPopupChordId = null;
          _persistentPopupNode    = null;
          if (typeof composeAddChord === 'function') composeAddChord(appId, false, 1);
          _hoverChordId = origChordId;
          snapCards.forEach(snap => {
            const el = document.createElement('div');
            el.className = snap.isV
              ? snap.className + ' persistent'
              : snap.className + ' partner-pinned';
            el.style.cssText = `left:${snap.left};top:${snap.top};width:${snap.width};height:${snap.height};position:absolute;`;
            el.dataset.chord = snap.appId;
            el.dataset.popup = '1';
            el.innerHTML = snap.innerHTML;
            if (!snap.isV) {
              const iiAppId = snap.appId;
              el.addEventListener('click', (ev2) => {
                ev2.stopPropagation();
                _persistentPopupChordId = iiAppId;
                _persistentPopupNode    = origChordId;
                if (typeof composeAddChord === 'function') composeAddChord(iiAppId, false, 1);
                _clearHoverPopups();
              });
            }
            mapWrap.appendChild(el);
          });
          if (svgArrows) snapArrows.forEach(a => {
            a.classList.add('partner-pinned');
            svgArrows.appendChild(a);
          });
        } else {
          // Pre-apply persistent for instant green on touch (no blink).
          popUnder.classList.add('persistent');
          _persistentPopupChordId = appId;
          _persistentPopupNode    = origChordId;
          _persistentPopupPos = { x: parseFloat(popUnder.style.left), y: parseFloat(popUnder.style.top) };
          if (typeof composeAddChord === 'function') composeAddChord(appId, false, 1);
          // renderChordMap wipes + rebuilds — no manual _clearHoverPopups needed.
        }
      }
    } else {
      const origOver = under && under.closest && under.closest('.map-card') === _touchState.origCard;
      if (origOver) {
        // Released on the originally-pressed card → add that chord
        // (no popup pinning since it's already a permanent map card).
        if (typeof composeAddChord === 'function') composeAddChord(_touchState.origChordId, false, 1);
      }
      // Released outside any card → cancel (nothing added).
      _clearHoverPopups();
    }
    _touchState = null;
  });

  // Cancel any in-progress hold if the touch is interrupted (call, system gesture).
  wrap.addEventListener('touchcancel', () => {
    clearTimeout(_touchHoldTimer);
    _touchState = null;
    _clearHoverPopups();
  });
  return true;
}

// Delegated hover listeners on the chord-map container. Fires only in
// compose mode (player not engaged) so playback isn't affected.
//
// Logic uses `mouseenter`/`mouseleave` on the WRAPPER (not bubbling
// mouseover) so internal moves over SVG arrows, gaps between cards,
// or popup ↔ target jumps DON'T trigger exit. The popups only clear
// when the cursor truly leaves the chord-map wrapper.
(function setupHoverPopups() {
  const init = () => {
    const wrap = document.getElementById('chord-map');
    if (!wrap) return false;
    // Track which card the cursor is over for the delay timer.
    wrap.addEventListener('mousemove', (e) => {
      if (player.playing || player.paused) return;
      const card = e.target.closest('.map-card');
      // Only START a new delay when we land on a NON-popup card that
      // isn't the same one already showing popups.
      if (!card || card.classList.contains('popup')) return;
      const chordId = card.dataset.chord;
      // Allow re-triggering if the current hover was restricted (allowedIds set)
      // — e.g. after viiø focus set _hoverChordId='vi' showing only V/vi,
      // the user directly hovering vi should see ALL approaches (bII7 etc.).
      if (!chordId || (chordId === _hoverChordId && !_hoverAllowedIds)) return;
      // If hovering the on-map sii for the currently-shown chain context,
      // don't re-trigger — keeps V/vi popup stable while cursor is on viiø.
      if (_hoverChordId && typeof _findChainTargetForSii === 'function' &&
          _findChainTargetForSii(chordId) === _hoverChordId) return;
      // Menu-bridge guard: if the cursor is inside (or within a small
      // forgiveness ring of) any currently-visible popup, don't trigger
      // a new hover — the user is most likely navigating toward that
      // popup and we shouldn't yank it out by replacing it with another
      // chord's popups that may land in the same grid cell. Without
      // this guard, mousing from a chord to its popup that crosses an
      // adjacent chord's bbox swaps the popups mid-travel.
      const existingPopups = wrap.querySelectorAll('.map-card.popup.hover:not(.persistent)');
      if (existingPopups.length > 0) {
        const POPUP_BRIDGE_PAD = 28;   // px forgiveness around each popup rect
        const mx = e.clientX, my = e.clientY;
        for (const pop of existingPopups) {
          const r = pop.getBoundingClientRect();
          if (mx >= r.left - POPUP_BRIDGE_PAD && mx <= r.right + POPUP_BRIDGE_PAD &&
              my >= r.top  - POPUP_BRIDGE_PAD && my <= r.bottom + POPUP_BRIDGE_PAD) {
            // Inside the safe zone — cancel any pending swap and bail.
            clearTimeout(_hoverTimer);
            return;
          }
        }
      }
      // Cancel any pending exit + restart the delay for the new chord.
      clearTimeout(_hoverExitTimer);
      clearTimeout(_hoverTimer);
      _hoverTimer = setTimeout(() => {
        _hoverChordId = chordId;
        _renderHoverPopups(chordId);
      }, HOVER_DELAY_MS);
    });
    // Only fire when the cursor actually leaves the chord-map. Internal
    // moves (between target ↔ popup ↔ SVG arrows ↔ gaps) don't trigger
    // mouseleave on the wrapper — that's exactly what we want.
    wrap.addEventListener('mouseleave', () => {
      clearTimeout(_hoverTimer);
      clearTimeout(_hoverExitTimer);
      _hoverExitTimer = setTimeout(() => {
        _clearHoverPopups();
        // Restore connections for focused chord after hover clears.
        if (!player.playing && !player.paused) {
          const fc = state.focusedChord;
          const chDefs = (currentMap() || {}).chordDefs || {};
          if (fc && fc !== 'I' && fc !== 'i') {
            const fcApproaches = _findApproachesTo(fc);
            if (fcApproaches.some(a => a.isPopup)) {
              _hoverChordId = fc; _renderHoverPopups(fc);
            } else {
              const chainTarget = _findChainTargetForSii(fc);
              const persistentIsPairV = _persistentPopupChordId && chDefs[_persistentPopupChordId]?.sii === fc;
              if (chainTarget && !persistentIsPairV) {
                const vId = _findSiiVChordId(fc);
                _hoverChordId = chainTarget; _renderHoverPopups(chainTarget, vId ? new Set([vId]) : null);
              } else if (chDefs[fc]?.resolvesTo) {
                _hoverChordId = chDefs[fc].resolvesTo; _renderHoverPopups(chDefs[fc].resolvesTo);
              }
            }
          }
        }
      }, HOVER_EXIT_GRACE_MS);
    });
    // A real click on a card should clear any showing hover popups
    // immediately — the user committed to the regular chord, not the
    // approach. Also cancels the pending hover timer so popups don't
    // appear AFTER the click (which used to feel like "click triggered
    // them").
    wrap.addEventListener('click', (e) => {
      const card = e.target.closest('.map-card');
      if (!card || card.classList.contains('popup')) return;
      clearTimeout(_hoverTimer);
      clearTimeout(_hoverExitTimer);
      _clearHoverPopups();
      // Show connections for the newly-focused chord (all chords except I/i).
      if (!player.playing && !player.paused) {
        const fc = state.focusedChord;
        const chDefs = (currentMap() || {}).chordDefs || {};
        if (fc && fc !== 'I' && fc !== 'i') {
          const fcApproaches = _findApproachesTo(fc);
          if (fcApproaches.some(a => a.isPopup)) {
            _hoverChordId = fc; _renderHoverPopups(fc);
          } else {
            const chainTarget = _findChainTargetForSii(fc);
            const persistentIsPairV = _persistentPopupChordId && chDefs[_persistentPopupChordId]?.sii === fc;
            if (chainTarget && !persistentIsPairV) {
              const vId = _findSiiVChordId(fc);
              _hoverChordId = chainTarget; _renderHoverPopups(chainTarget, vId ? new Set([vId]) : null);
            } else if (chDefs[fc]?.resolvesTo) {
              _hoverChordId = chDefs[fc].resolvesTo; _renderHoverPopups(chDefs[fc].resolvesTo);
            }
          }
        }
      }
    });
    // Mobile: press-and-hold reveals popups, release on one to plug it.
    _setupChordMapTouch();
    return true;
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    if (!init()) document.addEventListener('DOMContentLoaded', init);
  }
})();

// Render temporary popup cards for currently-playing or upcoming chord
// IDs that exist in chordDefs but NOT as map nodes (V/iii, iiø,
// bIIImaj7, etc.). The popup sits adjacent to the chord's resolvesTo
// target (or near the tonic if borrowedFrom only), with a connector
// arrow showing the harmonic relationship. Timing mirrors the regular
// map-card highlight system: yellow next-up one bar ahead, green
// playing on its bar, fade-out after.
function _renderPopupCards(curId, nxtId, isLastBar) {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  if (!wrap) return;
  // Clear previous popups + their connector arrows.
  Array.from(wrap.querySelectorAll('.map-card.popup')).forEach(el => el.remove());
  if (arrowsSvg) Array.from(arrowsSvg.querySelectorAll('.popup-arrow')).forEach(el => el.remove());
  const map = currentMap();
  if (!map) return;
  const flats = useFlatsFor(state.keyPc);
  // Locate a node by its chord id (for positioning popups next to their target).
  const findNode = (chordId) => {
    for (const nid in map.nodes) {
      if (map.nodes[nid].chord === chordId) return map.nodes[nid];
    }
    return null;
  };
  // Tonic node fallback for borrowed chords that don't resolve to a specific target.
  const tonicId = state.tonality === 'major' ? 'I' : 'i';
  const tonicNode = findNode(tonicId);

  const POPUP_W = 96, POPUP_H = 104, GAP = 18;
  // Use the same centralized placement as the compose hover popups so
  // both modes drop the popup in the SAME spot for any given chord.
  // `idx` differentiates current (0) and next-up (1) popups so they
  // don't overlap in the bottom-row grid.
  const placeNear = (targetNode, targetChordId, idx) => {
    if (!targetNode) {
      // No target — float near top-right of map as an "approach" zone.
      return { x: MAP_DIMS.width - POPUP_W - 8, y: 30 };
    }
    return _getPopupSlot(targetNode, targetChordId, idx || 0, POPUP_W, POPUP_H, GAP);
  };

  const drawArrow = (fromX, fromY, toX, toY) => {
    if (!arrowsSvg) return;
    const dx = toX - fromX, dy = toY - fromY;
    const mx = fromX + dx * 0.5;
    const my = fromY + dy * 0.5 - 14;   // slight upward arc
    const ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('class', 'popup-arrow');
    path.setAttribute('d', `M ${fromX} ${fromY} Q ${mx} ${my} ${toX} ${toY}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--accent, #a07820)');
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', 'url(#ah-hl)');
    path.setAttribute('opacity', '0.85');
    arrowsSvg.appendChild(path);
  };

  const renderOne = (chordId, isPlaying, isNextUp) => {
    if (!chordId) return;
    const ch = map.chordDefs[chordId];
    if (!ch || !ch.popup) return;          // not a popup-only chord
    if (findNode(chordId)) return;         // somehow already a node — skip
    // Position next to resolvesTo target (or near tonic if borrowedFrom).
    const targetNode = ch.resolvesTo ? findNode(ch.resolvesTo) : tonicNode;
    const targetChordId = ch.resolvesTo || tonicId;
    // Current popup goes to slot 0, next-up goes to slot 1 — keeps both
    // visible in the bottom-row grid without overlap.
    const slotIdx = isPlaying ? 0 : 1;
    const { x, y } = placeNear(targetNode, targetChordId, slotIdx);
    const root = (state.keyPc + ch.deg) % 12;
    // Resolve effective quality so popup name + mini-diagram reflect any
    // step-level qualityOverride (e.g. V_iii sounding as 7#11 would
    // show as B7#11 with the matching shape).
    const stepNow = (typeof player !== 'undefined' && player && isPlaying)
      ? player._currentStep() : null;
    const eq = effectiveQuality(stepNow, ch);
    // Prefer the live played shape when this is the current sounding
    // chord (so the popup shows the EXACT inversion you're hearing).
    // Otherwise compute a best-starting voicing for the chord.
    let shape = null;
    if (isPlaying && state.playerVoicing && state.playerVoicing.chord === chordId && state.playerVoicing.shape) {
      shape = state.playerVoicing.shape;
    } else if (typeof bestStartingVoicing === 'function') {
      const v = bestStartingVoicing(eq, root);
      if (v) shape = v.shape;
    }
    const chordName = chordNameForVoicing(eq, root, shape, flats)
      || (nameOf(root, flats) + QUALITIES[eq].sfx);
    const miniSvg = shape && typeof renderMini === 'function'
      ? renderMini(shape, root, eq, flats, { W: POPUP_W - 8, H: POPUP_H - 38, r: 6.5 })
      : '';
    const card = document.createElement('div');
    let cls = `map-card popup tag-${ch.tag}`;
    if (isPlaying) cls += ' playing';
    if (isNextUp) cls += ' next-up';
    if (isNextUp && isLastBar) cls += ' about-to-start';
    // Suppress the fade-in animation when this chord was already shown
    // in the same role last frame (we re-render on every bar tick, so
    // a sustained popup would otherwise keep re-firing the animation
    // and flicker continuously).
    const lastRole = isPlaying ? _popupLastShown.cur : _popupLastShown.nxt;
    if (lastRole === chordId) cls += ' no-anim';
    card.className = cls;
    card.style.left = `${x}px`;
    card.style.top = `${y}px`;
    card.style.width = `${POPUP_W}px`;
    card.style.height = `${POPUP_H}px`;
    card.dataset.chord = chordId;
    card.dataset.popup = '1';
    card.innerHTML = `
      <div class="mc-top">
        <span class="mc-roman">${ch.roman}</span>
        <span class="mc-name">${chordName}</span>
      </div>
      <div class="mc-svg-wrap">${miniSvg}</div>
      <div class="mc-popup-tag">${ch.resolvesTo ? '→ ' + ch.resolvesTo : (ch.borrowedFrom ? 'borrowed' : '')}</div>
    `;
    wrap.appendChild(card);
    // Connector arrow from popup to its target node (if any).
    if (targetNode) {
      // Anchor: edge of popup closest to target.
      const popupCx = x + POPUP_W / 2;
      const popupCy = y + POPUP_H / 2;
      const tgtCx = targetNode.x + 48;     // approx half-width of target card
      const tgtCy = targetNode.y + 50;
      drawArrow(popupCx, popupCy, tgtCx, tgtCy);
    }
  };

  // The current chord shows as playing. The next chord shows as next-up
  // (and gets the about-to-start blink on the last bar of the current).
  renderOne(curId, true, false);
  if (nxtId && nxtId !== curId) renderOne(nxtId, false, true);
  // Update cache for next frame's animation-suppression check.
  _popupLastShown = { cur: curId, nxt: nxtId };
}

function renderChordMap() {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  const map = currentMap();
  const flats = useFlatsFor(state.keyPc);
  const voicings = computeAllVoicings();

  // Clear existing cards
  Array.from(wrap.querySelectorAll('.map-card')).forEach(el => el.remove());

  // Render one card per node
  for (const nodeId in map.nodes) {
    const node = map.nodes[nodeId];
    // Skip chords not allowed by the current scope filter — clears space in the map
    if (!isChordInScope(node.chord)) continue;
    const ch = map.chordDefs[node.chord];
    const root = chordRoot(ch);
    const v = voicings[node.chord];
    const chordName = chordNameForVoicing(ch.quality, root, v?.shape, flats)
      || (nameOf(root, flats) + QUALITIES[ch.quality].sfx);
    const isFocus = node.chord === state.focusedChord;
    const isHub = node.hub;
    const card = document.createElement('div');
    const isSatellite = (ch.tag === 'secondary' || ch.tag === 'borrowed');
    card.className = `map-card tag-${ch.tag} ${isHub ? 'hub' : ''} ${isFocus ? 'focused' : ''} ${isSatellite ? 'satellite' : 'diatonic'}`;
    card.style.left = `${node.x}px`;
    card.style.top = `${node.y}px`;
    card.dataset.chord = node.chord;
    const sizing = isHub ? {W:130, H:120, r:9} : (isSatellite ? {W:72, H:80, r:5.5} : {W:96, H:104, r:7.5});
    const svg = v?.shape ? renderMini(v.shape, root, ch.quality, flats, sizing) : '';
    card.innerHTML = `
      <div class="mc-top">
        <span class="mc-roman">${ch.roman}</span>
        <span class="mc-name">${chordName}</span>
      </div>
      <div class="mc-svg-wrap">${svg}</div>
    `;
    card.addEventListener('click', (ev) => {
      // On touch devices, touchend already fires a manual cardToClick.click()
      // (untrusted) AND on some browsers a synthetic click (trusted) follows
      // even though touchstart called preventDefault. We have to swallow
      // whichever of the two arrives SECOND — and the order isn't guaranteed:
      //   • Manual-first (A/B): touchend's flag catches the trusted one.
      //   • Trusted-first (C — seen on some recent iOS Safari):
      //     trusted runs before touchend ever fires, so the flag is still
      //     false. We tag it here so the manual click that arrives a few ms
      //     later sees the marker and bails.
      if (card._pendingSyntheticClick && ev.isTrusted) {
        card._pendingSyntheticClick = false;
        ev.stopPropagation();
        return;
      }
      if (card._trustedClickJustRan && !ev.isTrusted) {
        card._trustedClickJustRan = false;
        ev.stopPropagation();
        return;
      }
      if (ev.isTrusted) {
        card._trustedClickJustRan = true;
        // Safety window: clear unconditionally a bit later so a real
        // second tap (intentional double-add) isn't swallowed.
        setTimeout(() => { card._trustedClickJustRan = false; }, 350);
      }
      const engaged = player.playing || player.paused;
      // Play view: audition the clicked chord without disturbing the
      // player's visualization (no focus change, no renderAll). The next
      // scheduled bar continues as planned.
      if (engaged) {
        if (v?.shape) auditionChord(node.chord, { shape: v.shape, silentVisual: true });
        return;
      }
      // Compose mode: tapping a map card types that chord into the strip.
      if (currentMap().chordDefs[node.chord]) {
        composeAddChord(node.chord, ev.shiftKey, _shiftSide === 'left' ? -1 : 1);
        return;
      }
      // Fallback: focus + ring (chord not in current map's dialer).
      state.focusedChord = node.chord;
      state.userVoicing = v?.shape ? { shape: v.shape, ...v } : null;
      renderAll();
      ringFocusedChord();
    });
    wrap.appendChild(card);
  }

  // Render arrows using node positions
  arrowsSvg.setAttribute('viewBox', `0 0 ${MAP_DIMS.width} ${MAP_DIMS.height}`);
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  arrowsSvg.innerHTML = `
    <defs>
      <!-- Tiny, minimal arrowhead — only shown on highlighted arrows -->
      <marker id="ah-hl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,1 L7,4 L0,7" fill="none" stroke="${accentColor}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="ah-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0,1 L7,4 L0,7" fill="none" stroke="#9d978a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
  ` + map.arrows.map(arr => {
    const a = map.nodes[arr.from];
    const b = map.nodes[arr.to];
    if (!a || !b) return '';
    // Don't draw arrows touching chords filtered out by the scope
    if (!isChordInScope(a.chord) || !isChordInScope(b.chord)) return '';
    const aIsHub = a.hub;
    const bIsHub = b.hub;
    const aChDef = map.chordDefs[a.chord];
    const bChDef = map.chordDefs[b.chord];
    const aSat = aChDef && (aChDef.tag === 'secondary' || aChDef.tag === 'borrowed');
    const bSat = bChDef && (bChDef.tag === 'secondary' || bChDef.tag === 'borrowed');
    const aw = aIsHub ? 130 : (aSat ? 92 : 100);
    const bw = bIsHub ? 130 : (bSat ? 92 : 100);
    const ah = aIsHub ? 145 : (aSat ? 100 : 115);
    const bh = bIsHub ? 145 : (bSat ? 100 : 115);
    const acx = a.x + aw/2;
    const acy = a.y + ah/2;
    const bcx = b.x + bw/2;
    const bcy = b.y + bh/2;

    const dx = bcx - acx, dy = bcy - acy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (!dist) return '';
    const ux = dx/dist, uy = dy/dist;
    const aRadX = aw/2 * 0.92, aRadY = ah/2 * 0.7;
    const tA = 1 / Math.max(Math.abs(ux)/aRadX, Math.abs(uy)/aRadY);
    const sx = acx + ux * tA;
    const sy = acy + uy * tA;
    const bRadX = bw/2 * 0.92, bRadY = bh/2 * 0.7;
    const tB = 1 / Math.max(Math.abs(ux)/bRadX, Math.abs(uy)/bRadY);
    const ex = bcx - ux * tB;
    const ey = bcy - uy * tB;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const perpX = -uy, perpY = ux;
    // Gentler curve — short arrows nearly straight, long arrows softly arched
    const curveAmt = dist < 180 ? dist * 0.06 : Math.min(70, dist * 0.18);
    const curveDir = (arr.curve === undefined) ? 1 : arr.curve;
    const cx = mx + perpX * curveAmt * curveDir;
    const cy = my + perpY * curveAmt * curveDir;

    const aChord = a.chord, bChord = b.chord;
    const isHl = (aChord === state.focusedChord) || (bChord === state.focusedChord);

    // Only DRAW arrows that touch the focused chord — keeps the map clean.
    if (!isHl) return '';

    // When the focused chord is the tonic hub, suppress ALL its arrows.
    // The relationships are conveyed by glowing the connected cards instead.
    const focusedNode = Object.values(map.nodes).find(n => n.chord === state.focusedChord);
    if (focusedNode?.hub) return '';

    // Voice-leading cost → opacity (smoother connections are bolder)
    const va = voicings[aChord];
    const vb = voicings[bChord];
    let opacity = 0.85;
    if (va?.shape && vb?.shape) {
      const cost = totalVoiceMovement(va.shape, vb.shape);
      if (cost <= 3) opacity = 1.0;
      else if (cost <= 7) opacity = 0.8;
      else opacity = 0.55;
    }

    // Hand-rolled arrowhead — compute the exact tangent at the path end so
    // direction is guaranteed correct on every browser (mobile Safari has
    // historically mis-oriented SVG <marker> arrows with curved Q paths).
    // Tangent of Q at t=1 is (end - control), pointing OUT of the path end.
    const tdx = ex - cx, tdy = ey - cy;
    const tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
    const tux = tdx / tlen, tuy = tdy / tlen;
    const arrSize = 7;
    // Tip sits at (ex,ey); two wings flare backward along -tangent ± perpendicular
    const baseX = ex - tux * arrSize;
    const baseY = ey - tuy * arrSize;
    const wing = arrSize * 0.55;
    const w1x = baseX + (-tuy) * wing, w1y = baseY + ( tux) * wing;
    const w2x = baseX - (-tuy) * wing, w2y = baseY - ( tux) * wing;
    const head = `<polyline points="${w1x.toFixed(1)},${w1y.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)} ${w2x.toFixed(1)},${w2y.toFixed(1)}" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
    return `<path d="M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="${accentColor}" stroke-width="1.8" opacity="${opacity}" stroke-linecap="round"/>${head}`;
  }).join('');

  // ── Light up the cards connected to the focused chord ──
  // Find chord IDs that the focused chord points TO or FROM
  const relatedIds = new Set();
  map.arrows.forEach(arr => {
    const a = map.nodes[arr.from];
    const b = map.nodes[arr.to];
    if (!a || !b) return;
    if (a.chord === state.focusedChord) relatedIds.add(b.chord);
    if (b.chord === state.focusedChord) relatedIds.add(a.chord);
  });
  const focusedNode2 = Object.values(map.nodes).find(n => n.chord === state.focusedChord);
  const isFocusedHub = !!focusedNode2?.hub;
  document.querySelectorAll('.map-card').forEach(c => {
    c.classList.remove('related', 'related-from-hub');
    if (relatedIds.has(c.dataset.chord)) {
      c.classList.add('related');
      if (isFocusedHub) c.classList.add('related-from-hub');
    }
  });
  // Re-draw the persistent hover popup (if any) after every map rebuild,
  // so the "currently composing" highlight survives renderAll → wipe.
  if (typeof _redrawPersistentPopup === 'function') _redrawPersistentPopup();
  // Auto-show approach popups whenever a chord with popup-only approaches is
  // focused (compose mode only). This lets the user always see the ii–V chain
  // for the current chord and trace/extend it without having to hover first.
  if (!player.playing && !player.paused &&
      typeof _renderHoverPopups === 'function') {
    const fc = state.focusedChord;
    const chDefs = (currentMap() || {}).chordDefs || {};
    if (fc && fc !== 'I' && fc !== 'i') {
      const fcApproaches = _findApproachesTo(fc);
      if (fcApproaches.some(a => a.isPopup)) {
        // Regular map chord with popup approaches → show them.
        _hoverChordId = fc;
        _renderHoverPopups(fc);
      } else {
        // Check on-map sii (e.g. viiø → chain to vi) or popup chord
        // focused (e.g. V/vi focused → show siblings approaching vi).
        const chainTarget = typeof _findChainTargetForSii === 'function'
          ? _findChainTargetForSii(fc) : null;
        const persistentIsPairV = _persistentPopupChordId &&
          chDefs[_persistentPopupChordId]?.sii === fc;
        if (chainTarget && !persistentIsPairV) {
          const vId = typeof _findSiiVChordId === 'function' ? _findSiiVChordId(fc) : null;
          _hoverChordId = chainTarget;
          _renderHoverPopups(chainTarget, vId ? new Set([vId]) : null);
        } else if (chDefs[fc]?.resolvesTo) {
          // Popup chord is focused — show all approaches to its target so
          // the user sees the full connection picture (siblings + sii arrow).
          _hoverChordId = chDefs[fc].resolvesTo;
          _renderHoverPopups(chDefs[fc].resolvesTo);
        }
      }
    }
  }
}

/* ════════════════════════════════════════════════════════════
   ALTERNATIVES
   ════════════════════════════════════════════════════════════ */

function renderAlternatives() {
  const altRow = document.getElementById('alt-row');
  const altName = document.getElementById('alt-chord-name');
  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const chordName = chordNameForVoicing(fc.quality, root, state.userVoicing?.shape, flats)
    || (nameOf(root, flats) + QUALITIES[fc.quality].sfx);
  altName.textContent = `${fc.roman} · ${chordName}`;

  // Master catalog — drop-2 → shells → triads → guides → sus, deduped.
  const cands = allDistinctVoicings(fc.quality, root);
  const shapeKey = (sh) => sh.map((f, i) => f >= 0 ? `${i}.${f}` : '').filter(Boolean).join(',');
  const curKey = state.userVoicing?.shape ? shapeKey(state.userVoicing.shape) : null;
  // The voicing currently SOUNDING via the AI player (independent of
  // user selection). When auto-mode is on, .selected lands on the AUTO
  // card to the left — without this, the scroll-into-view snapped to
  // the leftmost AUTO card every bar and the actual playing voicing
  // (somewhere in the middle of the row) was never brought into view.
  const playKey = (player && player.playing
                   && state.playerVoicing && state.playerVoicing.shape
                   && state.playerVoicing.chord === fc.id)
    ? shapeKey(state.playerVoicing.shape) : null;

  const autoSel = state.userVoicing === null ? 'selected' : '';
  const STRAT_LABEL = { smoothest: 'smoothest', low: 'low pos', high: 'high pos', random: 'random' };
  const curStrat = state.autoStrategy || 'smoothest';
  let html = `
    <div class="alt-card ${autoSel}" data-auto="1" style="justify-content:center" title="click to cycle: smoothest → low pos → high pos → random">
      <div style="font-size:14px;color:var(--accent);font-weight:700;text-align:center;line-height:1.2;padding:24px 0">↻<br><span style="font-size:9px;text-transform:uppercase;letter-spacing:1px">auto</span></div>
      <div class="ac-label">${STRAT_LABEL[curStrat]}</div>
      <div class="ac-notes">(click cycles)</div>
    </div>
  `;

  // Card labels are now JUST position info — the family name lives on the
  // labeled divider that precedes each group.
  const INV = ['R','1st','2nd','3rd'];
  const SET = ['LOW','MID','TOP'];
  const labelFor = (c) => {
    if (c.type === 'drop2' || c.type === 'sus') {
      return `${INV[c.inversion]} · ${SET[c.stringSetIdx]}`;
    }
    if (c.type === 'triad' && c.inversion != null) {
      return `${INV[c.inversion]} · ${(c.stringSet || '').toUpperCase()}`;
    }
    if (c.type === 'strum') {
      // Sub-variant determines the label format:
      //   barre 7th     → "E-SHAPE" / "A-SHAPE"
      //   barre triad   → "E-TRIAD" / "A-TRIAD"
      //   power (R-5-R) → "E-POWER" / "A-POWER"
      //   open (cowboy) → "OPEN"
      const set = (c.stringSet || '').toUpperCase();
      if (c.variant === 'open')  return 'OPEN';
      if (c.variant === 'power') return `${set}-POWER`;
      if (c.variant === 'triad') return `${set}-TRIAD`;
      return `${set}-SHAPE`;
    }
    return c.stringSet || '';   // shells / guides → just the set letter
  };
  const FAMILY = { drop2: 'Drop-2', drop3: 'Drop-3', shell: 'Shells', triad: 'Triads', guide: 'Guides', sus: 'Sus', strum: 'Strum' };
  // Per-family ink color so each voicing group has its own identity on the
  // cream paper background. Tuned to coexist (not compete) with each other.
  const FAMILY_COLOR = {
    drop2: '#3a4050',   // charcoal — the default jazz voicing
    drop3: '#2a5a6a',   // teal — wider voicing, more bass
    shell: '#4a7a5a',   // muted forest green — guide-tone feel
    triad: '#9a5a3a',   // warm terracotta — bright, clean
    guide: '#5a6a8a',   // slate blue — minimal, cool
    sus:   '#6a4a8a',   // muted violet — suspended, dreamy
    strum: '#7a4030',   // deep brick — rhythm-guitar grips (barre / open / power)
  };

  let lastType = null;
  cands.forEach((c, i) => {
    if (lastType !== c.type) {
      const color = FAMILY_COLOR[c.type] || '#3a3a40';
      html += `<div class="alt-divider" style="color:${color}">${FAMILY[c.type] || c.type}</div>`;
      lastType = c.type;
    }
    const sk = shapeKey(c.shape);
    const sel = (sk === curKey) ? 'selected' : '';
    const playing = (sk === playKey) ? 'playing' : '';
    const notes = c.shape.map((f, st) => f < 0 ? '' : nameOf(noteAt(st, f), flats)).filter(x => x).join(' ');
    html += `
      <div class="alt-card ${sel} ${playing}" data-idx="${i}">
        ${renderMini(c.shape, root, fc.quality, flats, {W:88, H:92, r:7})}
        <div class="ac-label">${labelFor(c)}</div>
        <div class="ac-notes">${notes}</div>
      </div>
    `;
  });

  altRow.innerHTML = html;

  // Resolve which composed-strip cell the alt voicing should modify:
  // explicit selection > focused cell > last cell that matches fc.id.
  // Returns -1 if no cell matches or the player owns the strip.
  const _altTargetIdx = () => {
    if (player.playing) return -1;
    const seq = state.composedProgression;
    if (!seq.length) return -1;
    const tryIdx = (idx) => (idx != null && idx >= 0 && idx < seq.length
                             && seq[idx] && !seq[idx]._tie && !seq[idx]._silent
                             && seq[idx].chord === fc.id) ? idx : -1;
    let t = tryIdx(state.composedSelectedIdx);
    if (t >= 0) return t;
    t = tryIdx(state._composeFocusedIdx);
    if (t >= 0) return t;
    // Fall back to the LAST cell matching fc.id (covers the typical
    // "just typed this chord" case where nothing is explicitly focused).
    for (let i = seq.length - 1; i >= 0; i--) {
      if (seq[i] && !seq[i]._tie && !seq[i]._silent && seq[i].chord === fc.id) return i;
    }
    return -1;
  };

  altRow.querySelectorAll('[data-auto]').forEach(c => {
    c.addEventListener('click', () => {
      // Cycle through the four strategies on each click.
      const order = ['smoothest', 'low', 'high', 'random'];
      const cur = state.autoStrategy || 'smoothest';
      state.autoStrategy = order[(order.indexOf(cur) + 1) % order.length];
      state.userVoicing = null;
      // Re-pick the voicing of whichever cell the user is editing (selected
      // > focused > last-matching) using the new strategy. Was previously
      // hard-coded to the tail of the progression.
      const seq = state.composedProgression;
      const targetIdx = _altTargetIdx();
      if (targetIdx >= 0) {
        const ch = currentMap().chordDefs[fc.id];
        const r  = chordRoot(ch);
        const all = allDistinctVoicings(ch.quality, r);
        const prev = targetIdx > 0 ? seq[targetIdx - 1].shape : null;
        const idx = pickByStrategy(all, prev);
        if (idx >= 0) {
          const pk = all[idx];
          const target = seq[targetIdx];
          target.shape = pk.shape;
          target._candIdx = idx;
          target.voicingType = pk.type;
          target.stringSetIdx = pk.stringSetIdx;
          target.inversion = pk.inversion;
          target.stringSet = pk.stringSet;
          renderComposeStrip();
        }
      }
      applyAltToComping(fc.id, null);
      renderAll();
    });
  });

  altRow.querySelectorAll('[data-idx]').forEach(card => {
    card.addEventListener('click', () => {
      const c = cands[+card.dataset.idx];
      if (!c) return;
      state.userVoicing = {
        shape: c.shape,
        type: c.type,
        stringSetIdx: c.stringSetIdx,
        inversion: c.inversion,
        stringSet: c.stringSet,
      };
      // Apply the new voicing to whichever cell the user is editing —
      // selected > focused > last-matching — not always the tail.
      const seq = state.composedProgression;
      const targetIdx = _altTargetIdx();
      if (targetIdx >= 0) {
        const target = seq[targetIdx];
        target.shape = c.shape;
        target.voicingType = c.type;
        target.stringSetIdx = c.stringSetIdx;
        target.inversion = c.inversion;
        target.stringSet = c.stringSet;
        target._candIdx = +card.dataset.idx;
        renderComposeStrip();
      }
      applyAltToComping(fc.id, { shape: c.shape, type: c.type, stringSetIdx: c.stringSetIdx, inversion: c.inversion });
      renderAll();
    });
  });

  // Auto-scroll horizontally only (no vertical jump) so the selected card
  // is in view after a cycle or click. Custom rAF animation — the native
  // `behavior:'smooth'` was 400-500ms which felt sluggish on chord
  // changes; this is ~180ms with easeOutQuad.
  requestAnimationFrame(() => {
    // Prefer the .playing card (AI's live voicing) over .selected (user
    // pick / AUTO card on far-left). Otherwise auto-mode always snapped
    // the row to the leftmost AUTO card and hid the actual sounding
    // voicing somewhere off-screen to the right.
    const sel = altRow.querySelector('.alt-card.playing')
             || altRow.querySelector('.alt-card.selected');
    if (!sel || altRow.clientWidth <= 0) return;
    const target = Math.max(0, sel.offsetLeft - altRow.clientWidth / 2 + sel.offsetWidth / 2);
    const start  = altRow.scrollLeft;
    const delta  = target - start;
    if (Math.abs(delta) < 2) { altRow.scrollLeft = target; return; }
    // Cancel any in-flight scroll animation so consecutive chord changes
    // don't fight each other.
    if (altRow._scrollRaf) cancelAnimationFrame(altRow._scrollRaf);
    const dur = 180;
    const t0 = performance.now();
    const ease = (t) => 1 - (1 - t) * (1 - t);   // easeOutQuad
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      altRow.scrollLeft = start + delta * ease(t);
      if (t < 1) altRow._scrollRaf = requestAnimationFrame(step);
      else altRow._scrollRaf = null;
    };
    altRow._scrollRaf = requestAnimationFrame(step);
  });
}

// Push an alternate voicing into the live AI comping path, if playing:
//   - cache it so the next bar of this chord uses it
//   - if it's the chord currently sounding, re-trigger so the change is audible now
function applyAltToComping(chordId, voicing) {
  if (!player || !player.playing) return;
  if (voicing && voicing.shape) {
    state.progressionVoicings[chordId] = voicing;
  } else {
    delete state.progressionVoicings[chordId];
  }
  // Invalidate the cached page-plan so the next bar re-resolves with the new voicing
  if (player._cachedPlanPage !== undefined) player._cachedPlanPage = -1;
  if (player.currentChord === chordId && typeof player.jumpTo === 'function') {
    player.jumpTo(chordId);
  }
}

/* ════════════════════════════════════════════════════════════
   FRETBOARD
   ════════════════════════════════════════════════════════════ */

const FB = {W:2500, H:380, ml:60, mr:20, mt:30, mb:30, openW:70, noteR:16};

function renderFretboard() {
  const svg = document.getElementById('fretboard-svg');
  const innerW = FB.W - FB.ml - FB.mr - FB.openW;
  const fretW = innerW / N_FRETS;
  const stringsH = FB.H - FB.mt - FB.mb;
  const ss = stringsH / 5;

  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const q = QUALITIES[fc.quality];
  const focShape = focusedShape();

  const activeFrets = focShape.shape ? new Set(focShape.shape.map((f, i) => f >= 0 ? `${i}.${f}` : null).filter(Boolean)) : new Set();

  const chordPcs = new Set(q.ints.map(i => (root + i) % 12));
  const chordDegFromRoot = {};
  q.ints.forEach((semi, i) => {
    const pc = (root + semi) % 12;
    if (!(pc in chordDegFromRoot)) chordDegFromRoot[pc] = q.degs[i];
  });

  let s = '';
  const diamond = (cx, cy) => `<polygon points="${cx},${cy-11} ${cx+11},${cy} ${cx},${cy+11} ${cx-11},${cy}" fill="#aaa496"/>`;
  [3,5,7,9,15,17,19,21].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + stringsH/2);
  });
  [12, 24].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + ss);
    s += diamond(cx, FB.mt + ss*4);
  });

  for (let f = 0; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + f * fretW;
    const w = f === 0 ? 6 : 1.5;
    const color = f === 0 ? '#1a1a1f' : '#c8c8cc';
    s += `<line x1="${x}" y1="${FB.mt - 4}" x2="${x}" y2="${FB.mt + stringsH + 4}" stroke="${color}" stroke-width="${w}"/>`;
  }
  for (let f = 1; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += `<text x="${x}" y="${FB.H - 8}" text-anchor="middle" font-size="11" fill="#8a8a92" font-family="SF Mono, monospace">${f}</text>`;
  }
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    const w = 0.6 + (5 - str) * 0.35;
    s += `<line x1="${FB.ml}" y1="${y}" x2="${FB.W - FB.mr}" y2="${y}" stroke="#a8a8b0" stroke-width="${w}"/>`;
    s += `<text x="${FB.ml - 10}" y="${y + 5}" text-anchor="end" font-size="13" fill="#7a7a82" font-family="SF Mono, monospace" font-weight="700">${STRING_LABELS[str]}</text>`;
  }

  // Shadow chord-tones
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const pc = noteAt(str, f);
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!chordPcs.has(pc) || isActive) continue;
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      s += `<circle cx="${cx}" cy="${y}" r="9" fill="${c}" opacity="0.42" stroke="#000" stroke-width="0.5"/>`;
    }
  }

  // Active voicing — bright
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!isActive) continue;
      const pc = noteAt(str, f);
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      const isRoot = pc === root;
      if (isRoot) {
        s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR + 5}" fill="none" stroke="${c}" stroke-width="2.2" opacity="0.6"/>`;
      }
      s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR}" fill="${c}" stroke="#000" stroke-width="1.5"/>`;
      const noteName = nameOf(pc, flats);
      if (state.display === 'notes') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${noteName}</text>`;
      } else if (state.display === 'intervals') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${deg}</text>`;
      } else {
        s += `<text x="${cx}" y="${y - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="#000">${noteName}</text>`;
        s += `<text x="${cx}" y="${y + 10}" text-anchor="middle" font-size="8" font-weight="700" fill="#000" opacity="0.7">${deg}</text>`;
      }
    }
  }

  svg.innerHTML = s;
}

function renderKeyRow() {
  const el = document.getElementById('key-row');
  // Piano layout: 7 white keys + 5 black keys overlaid
  const whitePCs   = [0, 2, 4, 5, 7, 9, 11];  // C D E F G A B
  const blackInfo  = [
    {pc:1,  after:0}, // C#/Db between C(0) and D(1 idx)
    {pc:3,  after:1}, // D#/Eb between D and E
    {pc:6,  after:3}, // F#/Gb between F and G
    {pc:8,  after:4}, // G#/Ab between G and A
    {pc:10, after:5}, // A#/Bb between A and B
  ];
  const whiteW = 24;
  const blackW = 16;
  const totalW = whitePCs.length * whiteW;

  let html = `<div class="key-piano" style="width:${totalW}px">`;
  whitePCs.forEach(pc => {
    const r = ROOTS[pc];
    const active = state.keyPc === pc ? 'active' : '';
    html += `<div class="pk-white ${active}" data-pc="${pc}">${r.name}</div>`;
  });
  blackInfo.forEach(b => {
    const r = ROOTS[b.pc];
    const active = state.keyPc === b.pc ? 'active' : '';
    const left = (b.after + 1) * whiteW - blackW / 2;
    html += `<div class="pk-black ${active}" data-pc="${b.pc}" style="left:${left}px">${r.name}</div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-pc]').forEach(c => {
    c.addEventListener('click', () => {
      state.keyPc = +c.dataset.pc;
      state.userVoicing = null;
      // Re-compute each composed cell's voicing in the new key so the
      // tabs / sheet music actually transpose with the chord names.
      rebuildComposedShapesForCurrentKey();
      renderAll();
    });
  });
}

// Re-bake the shape on every composed-progression cell using the CURRENT key.
// Matches by VOICING COORDINATES (type + string-set + inversion) so the user's
// chosen drop-2 / shell / inversion is preserved exactly across transpositions.
// Falls back to clamping _candIdx for legacy cells without meta.
function rebuildComposedShapesForCurrentKey() {
  const seq = state.composedProgression;
  if (!seq || !seq.length) return;
  const map = currentMap();
  // Reusable per-entry rebuild — takes a "cell or slot" object that owns
  // the same {chord, shape, _candIdx, voicingType, stringSetIdx, inversion,
  // stringSet} shape, mutates it in-place against the current tonality.
  // Returns true on success, false if the chord ID isn't valid here so the
  // caller knows the entry stays stale.
  const rebuildOne = (entry) => {
    if (!entry || !entry.chord) return false;
    const ch = map.chordDefs[entry.chord];
    if (!ch) return false;
    const root = (state.keyPc + ch.deg) % 12;
    const cands = allDistinctVoicings(ch.quality, root, { allShapes: true });
    if (!cands.length) return false;
    let matchIdx = -1;
    if (entry.voicingType) {
      matchIdx = cands.findIndex(c =>
        c.type === entry.voicingType &&
        c.stringSetIdx === entry.stringSetIdx &&
        c.inversion === entry.inversion &&
        c.stringSet === entry.stringSet
      );
    }
    if (matchIdx < 0) {
      matchIdx = (typeof entry._candIdx === 'number' && entry._candIdx >= 0 && entry._candIdx < cands.length)
        ? entry._candIdx : 0;
    }
    const c = cands[matchIdx];
    entry.shape = c.shape;
    entry._candIdx = matchIdx;
    entry.voicingType = c.type;
    entry.stringSetIdx = c.stringSetIdx;
    entry.inversion = c.inversion;
    entry.stringSet = c.stringSet;
    return true;
  };
  for (const cell of seq) {
    rebuildOne(cell);
    // Multi-chord cells store per-slot voicings independently — rebuild
    // each slot too, otherwise switching tonality leaves slots with old
    // shapes that no longer match their (now possibly invalid) chord ID.
    if (cell && cell.slots && cell.slots.length) {
      for (const slot of cell.slots) {
        rebuildOne(slot);
      }
      // Re-mirror slot 0 onto the cell-level fields. If slot 0's chord ID
      // doesn't exist in the new tonality, the cell already stayed stale
      // from rebuildOne(cell) above — no double-write needed.
      const s0 = cell.slots[0];
      if (s0 && s0.chord && map.chordDefs[s0.chord]) {
        cell.chord = s0.chord;
        cell._candIdx = s0._candIdx;
        cell.shape = s0.shape;
        cell.voicingType = s0.voicingType;
        cell.stringSetIdx = s0.stringSetIdx;
        cell.inversion = s0.inversion;
        cell.stringSet = s0.stringSet;
      }
    }
  }
  // Multi-chord edit state may point at a cell/slot whose chord no longer
  // exists in the new tonality — clear it so the keypad falls back to the
  // normal append flow instead of writing into a stale slot.
  const editIdx = state._multiChordEditCell;
  if (editIdx !== null && editIdx !== undefined && seq[editIdx]) {
    const editCell = seq[editIdx];
    const slotIdx = state._multiChordEditSlotIdx;
    const editSlot = (editCell.slots && slotIdx >= 0 && slotIdx < editCell.slots.length)
      ? editCell.slots[slotIdx] : null;
    const stillValid = editSlot && editSlot.chord && map.chordDefs[editSlot.chord];
    if (!stillValid) {
      state._multiChordEditCell = null;
      state._multiChordEditSlotIdx = null;
      state._multiChordEditAutoAdvance = null;
    }
  }
}

document.querySelectorAll('#tonality-toggle button').forEach(b => {
  b.addEventListener('click', () => {
    state.tonality = b.dataset.tonality;
    state.focusedChord = state.tonality === 'major' ? 'I' : 'i';
    state.userVoicing = null;
    rebuildComposedShapesForCurrentKey();
    syncTonalityToggle();
    renderAll();
  });
});

// Keep the Major/Minor toggle visually in sync with state.tonality —
// gets called from renderAll so AI-driven modulations update it too.
function syncTonalityToggle() {
  document.querySelectorAll('#tonality-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.tonality === state.tonality);
  });
}

// ── Instrument toggle: single pill that flips between 🎸 and 🎹 ──
// Visual toggle is now a 2-cell brutalist switch (GTR / PNO). We keep
// `instrumentBtn` as a virtual proxy so any legacy code that .click()s
// it still flips the instrument — but the visible UI is the new pair.
const vsGuitar = document.getElementById('visual-guitar');
const vsPiano  = document.getElementById('visual-piano');
const instrumentBtn = {
  // Minimal shape so `.click()` still toggles; legacy callers (landscape
  // proxy, etc.) used it just for the click.
  click: () => setInstrument(state.instrument === 'guitar' ? 'piano' : 'guitar'),
};
function setInstrument(inst) {
  state.instrument = inst;
  document.body.classList.toggle('instrument-piano', inst === 'piano');
  document.body.classList.toggle('instrument-guitar', inst === 'guitar');
  // Brutalist 2-cell toggle: the picked side inverts (black bg, cream text).
  if (vsGuitar) vsGuitar.classList.toggle('active', inst === 'guitar');
  if (vsPiano)  vsPiano.classList.toggle('active',  inst === 'piano');
  // Piano mode: stack cycle + loop into a single right-column inside the
  // staff row, splitting vertically ~30/70. Guitar mode: restore them to
  // their original separate rows (cycle in row 1, loop in row 2).
  const cycleBtn = document.getElementById('cycle-toggle');
  const loopBtn  = document.getElementById('loop-toggle');
  if (cycleBtn && loopBtn) {
    if (inst === 'piano') {
      let stack = document.getElementById('right-btn-stack');
      if (!stack) {
        stack = document.createElement('div');
        stack.id = 'right-btn-stack';
        stack.className = 'right-btn-stack';
      }
      stack.appendChild(cycleBtn);    // top
      stack.appendChild(loopBtn);     // bottom
      const tabsRow = document.querySelector('.rb-stack > .rb-row:nth-child(2)');
      if (tabsRow) tabsRow.appendChild(stack);
    } else {
      const row1 = document.querySelector('.rb-stack > .rb-row:first-child');
      const row2 = document.querySelector('.rb-stack > .rb-row:nth-child(2)');
      if (row1) row1.appendChild(cycleBtn);
      if (row2) row2.appendChild(loopBtn);
      const stack = document.getElementById('right-btn-stack');
      if (stack) stack.remove();
    }
  }
  if (typeof renderChordPiano === 'function') renderChordPiano();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();
  if ((player.playing || player.paused) && typeof player._renderRealBook === 'function') player._renderRealBook();
}
// Wire the two visual cells — direct set instead of toggle so each
// side is sticky (clicking the active side is a no-op rather than a
// flip-back). Matches a physical 2-position switch.
[vsGuitar, vsPiano].forEach(btn => {
  if (!btn) return;
  btn.addEventListener('click', () => setInstrument(btn.dataset.inst));
});
// Initial state
document.body.classList.add('instrument-guitar');
