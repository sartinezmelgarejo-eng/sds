    player.song = player._generateSong();
    player.songIdx = 0;
    player.sectionIter = 0;
    player.currentStepIdx = 0;
    if (typeof player._applySectionKey === 'function') player._applySectionKey();
    if (typeof renderAll === 'function') renderAll();
    if (player.playing && typeof player._updateVisuals === 'function') {
      player._updateVisuals();
    }
  }
};

// Resolve state.songStructure → an actual letter sequence string.
// The literal value 'RANDOM' rolls a fresh non-rare structure each
// time it's called (so every new song gen gets a different shape),
// weighted by each entry's `weight` (default 1) so the canonical
// AABA / ABAB come up more often than the deeper cuts.
// Any other value is returned uppercased (default 'AABA').
// Roll a fresh common (non-rare) song structure and stash it in
// state.songStructureUpcoming. Called by the landscape standby on entry
// (when songStructure is RANDOM) and when the user cycle-taps back to
// RANDOM. _resolveSongStructure reads and clears this value at play time.
function _rerollSongStructure() {
  const common = SONG_STRUCTURES.filter(s => !s.rare);
  if (!common.length) { state.songStructureUpcoming = 'AABA'; return; }
  const total = common.reduce((sum, s) => sum + (s.weight || 1), 0);
  let r = Math.random() * total;
  for (const s of common) {
    r -= (s.weight || 1);
    if (r <= 0) { state.songStructureUpcoming = s.id; return; }
  }
  state.songStructureUpcoming = common[common.length - 1].id;
}

function _resolveSongStructure(raw) {
  if (!raw) return 'AABA';
  if (raw === 'RANDOM') {
    // Prefer the pre-rolled value if the standby UI rolled one — that's
    // what the user just saw, so use it. Then clear so the next RANDOM
    // play gets a fresh roll (via the standby on re-entry).
    if (state.songStructureUpcoming) {
      const v = state.songStructureUpcoming;
      state.songStructureUpcoming = null;
      return v;
    }
    // Fallback: no pre-roll cached (player invoked from a path that
    // bypassed the standby). Roll fresh on the spot — original behavior.
    const common = SONG_STRUCTURES.filter(s => !s.rare);
    if (!common.length) return 'AABA';
    const total = common.reduce((sum, s) => sum + (s.weight || 1), 0);
    let r = Math.random() * total;
    for (const s of common) {
      r -= (s.weight || 1);
      if (r <= 0) return s.id;
    }
    return common[common.length - 1].id;
  }
  return String(raw).toUpperCase();
}

// ── Song-structure picker (the SONG element in #player-info) ──
// Event delegation: #player-info re-renders every bar so binding
// directly to #pi-song-picker would lose the handler on the next tick.
let _songStructMenuEl = null;
function _closeSongStructMenu() {
  if (_songStructMenuEl) {
    _songStructMenuEl.remove();
    _songStructMenuEl = null;
  }
}
function _openSongStructMenu(anchor) {
  _closeSongStructMenu();
  const menu = document.createElement('div');
  menu.className = 'song-struct-menu';
  const current = state.songStructure || 'AABA';
  // "Random" entry at top — when picked, each song generation rolls
  // a fresh structure from the common pool (rare ones excluded).
  const randomItem = `
    <div class="ssm-item ${current === 'RANDOM' ? 'selected' : ''}" data-struct="RANDOM">
      <span class="ssm-label">↻ RANDOM</span>
      <span class="ssm-desc">Pick a common structure each new song</span>
    </div>
  `;
  const presetItems = SONG_STRUCTURES.map(s => {
    // Self-contained forms (BLUES, JAZZ_BLUES) display their id whole;
    // letter-sequence forms (AABA, ABAB, etc.) split letter-by-letter.
    const label = s.formType ? s.id.replace('_', ' ') : s.id.split('').join(' · ');
    return `
    <div class="ssm-item ${s.id === current ? 'selected' : ''}" data-struct="${s.id}">
      <span class="ssm-label">${label}${s.rare ? ' <span class="ssm-rare">rare</span>' : ''}</span>
      <span class="ssm-desc">${s.desc}</span>
    </div>
  `;
  }).join('');
  menu.innerHTML = randomItem + presetItems;
  document.body.appendChild(menu);
  const vpW = window.innerWidth || document.documentElement.clientWidth;
  // Mobile (< 720px): center the menu modal-style for maximum reliability
  // (no anchor positioning quirks across mobile webviews).
  if (vpW < 720) {
    menu.style.left = '50%';
    menu.style.top = '50%';
    menu.style.transform = 'translate(-50%, -50%)';
  } else {
    const rect = anchor.getBoundingClientRect();
    const menuW = menu.offsetWidth || 240;
    const menuH = menu.offsetHeight || 320;
    const vpH = window.innerHeight || document.documentElement.clientHeight;
    let left = rect.left;
    if (left + menuW > vpW - 8) left = Math.max(8, vpW - menuW - 8);
    let top = rect.bottom + 4;
    if (top + menuH > vpH - 8) top = Math.max(8, rect.top - menuH - 4);
    menu.style.left = `${Math.max(8, left)}px`;
    menu.style.top  = `${Math.max(8, top)}px`;
  }
  // Click an item → set structure + regenerate song.
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[data-struct]');
    if (!item) return;
    const id = item.dataset.struct;
    state.songStructure = id;
    _closeSongStructMenu();
    // Regenerate the song with the new structure. If currently playing,
    // restart at section 0 so the new structure takes effect immediately.
    if (typeof player !== 'undefined' && player) {
      player.song = player._generateSong();
      player.songIdx = 0;
      player.sectionIter = 0;
      player.currentStepIdx = 0;
      if (typeof player._applySectionKey === 'function') player._applySectionKey();
      if (typeof renderAll === 'function') renderAll();
      if (player.playing && typeof player._updateVisuals === 'function') {
        player._updateVisuals();
      }
    }
  });
  _songStructMenuEl = menu;
}
// Delegated click listener — survives #player-info innerHTML rewrites.
// Handles BOTH the desktop #pi-song-picker and the play-mode mobile
// .pi-song-picker-mobile (compose-mode mobile uses a native <select>
// with onchange, so it doesn't go through this path at all).
document.addEventListener('click', (e) => {
  const songEl = e.target.closest('#pi-song-picker, .pi-song-picker-mobile');
  if (songEl) {
    e.stopPropagation();
    if (_songStructMenuEl) _closeSongStructMenu();
    else _openSongStructMenu(songEl);
    return;
  }
  // Click outside the open menu → close it.
  if (_songStructMenuEl && !e.target.closest('.song-struct-menu')) {
    _closeSongStructMenu();
  }
});

    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — bass only', () => _buildMidiFile(_midiCollectBassComposed(), 'composed-bass')));
    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — all (zip)',
      () => _buildMidiBundle(_midiCollectComposed(), _midiCollectBassComposed(), 'composed')));
  }

    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — bass only', () => _buildMidiFile(_midiCollectBassSong(), 'song-bass')));
    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — all (zip)',
      () => _buildMidiBundle(_midiCollectSong(), _midiCollectBassSong(), 'song')));

  // Desktop: button sits on the right of the meta strip, so right-aligning
  // works. Mobile: button sits on the left, so right-aligning pushes the
  // menu past the left edge of the viewport. Detect the overflow case and

  const r = e.currentTarget.getBoundingClientRect();

  _midiMenu.style.top   = '-9999px';

  _midiMenu.hidden = false;
  const menuW = _midiMenu.offsetWidth;

  if (left < pad) {
    left = r.left;                      // fall back to left-align
    if (left + menuW > window.innerWidth - pad) {
      left = window.innerWidth - menuW - pad;
    }
  }
  left = Math.max(pad, left);
  _midiMenu.style.top  = (r.bottom + 4) + 'px';
  _midiMenu.style.left = left + 'px';
});

/* ─── TUNER (third landscape-standby mode) ─────────────────────────
   Same brutalist standby grid as band/metronome modes, repurposed:
   detected note ↔ ls-key slot, cents ↔ ls-bpm slot, sweep needle inside
   the play-button orb, six-string indicator ↔ ls-song slot. Mic gets
   opened on mode entry and released on mode exit, matching the
   metronome's "snapshot rhythm on enter, restore on leave" pattern.

   Pitch detection notes:
   - YIN on a 2048-sample window handles fundamentals down to ~22Hz at
     44.1kHz (well below E2 = 82Hz). O(N²/4) inner loop is ~1M ops per
     tick — fine for modern phones at ~60fps.
   - Median over the last 5 readings smooths typical vibrato jitter
     without dragging response time.
   - RMS gate below 0.005 freezes the UI on "play a string" so a quiet
     room doesn't drive the needle on noise. */
window._tuner = (function setupTuner() {
  const STRINGS = [
    { num: 6, name: 'E', freq:  82.41 },
    { num: 5, name: 'A', freq: 110.00 },
    { num: 4, name: 'D', freq: 146.83 },
    { num: 3, name: 'G', freq: 196.00 },
    { num: 2, name: 'B', freq: 246.94 },
    { num: 1, name: 'E', freq: 329.63 },
  ];
  const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

  let stream    = null;
  let analyser  = null;
  let ctx       = null;
  let micSource = null;
  let buf       = null;
  let rafId     = null;
  let recent    = [];
  // sessionId is bumped on every stop() so an in-flight start() can detect
  // that the user already left the tuner before getUserMedia resolved, and
  // release the orphan stream instead of starting a phantom listener.
  let sessionId = 0;
  const SMOOTH_N = 8;         // larger window → calmer needle, slight extra latency
  // Lock-feedback state machine. Fire the green flash + soft ding when
  // the user has held in-tune for IN_TUNE_LOCK_MS wall-clock ms; don't
  // re-fire until they've drifted clearly out (>10¢) for OUT_REARM_MS.
  // Wall-clock timing (vs frame counts) keeps the lock window consistent
  // across 60Hz vs 120Hz refresh rates — frame-based timing made the
  // lock fire ~2× as fast on ProMotion phones. Plus a wall-clock cooldown
  // so two notes tuned in rapid succession can't overlap feedback.
  let inTuneSince  = 0;       // perf.now() when we entered in-tune zone
  let outSince     = 0;       // perf.now() when we entered out zone
  let armed        = true;
  let lastFlashAt  = 0;
  let muteUntil    = 0;       // ignore YIN until this audioCtx-time (during ding)
  const IN_TUNE_LOCK_MS   = 90;
  const OUT_REARM_MS      = 110;
  const FLASH_COOLDOWN_MS = 900;

  function $(id) { return document.getElementById(id); }
  function freqToMidi(f) { return 12 * Math.log2(f / 440) + 69; }

  function nearestString(f) {
    let best = STRINGS[0], bestAbs = Infinity, bestCents = 0;
    for (const s of STRINGS) {
      const cents = 1200 * Math.log2(f / s.freq);
      if (Math.abs(cents) < bestAbs) { best = s; bestAbs = Math.abs(cents); bestCents = cents; }
    }
    return { string: best, cents: bestCents };
  }

  function yinPitch(b, sr) {
    const N = b.length;
    const half = N >> 1;
    const d = new Float32Array(half);
    for (let tau = 1; tau < half; tau++) {
      let sum = 0;
      for (let i = 0; i < half; i++) {
        const x = b[i] - b[i + tau];
        sum += x * x;
      }
      d[tau] = sum;
    }
    d[0] = 1;
    let running = 0;
    for (let tau = 1; tau < half; tau++) {
      running += d[tau];
      d[tau] *= tau / (running || 1);
    }
    const THRESH = 0.1;
    let tau = -1;
    for (let t = 2; t < half; t++) {
      if (d[t] < THRESH) {
        while (t + 1 < half && d[t + 1] < d[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) return -1;
    let refined = tau;
    if (tau > 0 && tau < half - 1) {
      const a = d[tau - 1], b1 = d[tau], c = d[tau + 1];
      const denom = 2 * (2 * b1 - c - a);
      if (denom !== 0) refined = tau + (c - a) / denom;
    }
    return sr / refined;
  }

  function rms(b) {
    let s = 0;
    for (let i = 0; i < b.length; i++) s += b[i] * b[i];
    return Math.sqrt(s / b.length);
  }
  function median(xs) {
    const sorted = [...xs].sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length / 2)];
  }
  function classify(absCents) {
    if (absCents < 5)  return 'in-tune';
    if (absCents < 15) return 'near';
    return 'off';
  }

  function paintIdle(msg) {
    const noteEl   = $('ls-tuner-note');
    const centsEl  = $('ls-tuner-cents-val');
    const hzEl     = $('ls-tuner-orb-hz');
    const orbEl    = $('ls-tuner-orb');
    const needleEl = $('ls-tuner-needle');
    const statusEl = $('ls-tuner-status');
    if (noteEl)   { noteEl.textContent = '—'; noteEl.className = 'ls-tuner-note'; }
    if (centsEl)  { centsEl.textContent = '·'; centsEl.className = 'ls-tuner-cents-val'; }
    if (hzEl)     { hzEl.textContent = '— Hz'; }
    if (orbEl)    { orbEl.className = 'ls-tuner-orb'; }
    if (needleEl) {
      needleEl.style.transform = 'translateX(-50%) rotate(0deg)';
      needleEl.className = 'ls-tuner-needle';
    }
    document.querySelectorAll('#ls-tuner-strings .ts-cell').forEach(el => {
      el.classList.remove('match', 'in-tune', 'near', 'off');
    });
    if (statusEl) {
      statusEl.textContent = msg || 'play a string';
      statusEl.classList.remove('err');
      // Drop any retry-click handler that the mic-denied branch may have
      // installed — once we're back to a normal idle state, taps on the
      // status row should do nothing.
      statusEl.style.cursor = '';
      statusEl.onclick = null;
    }
  }

  // One-shot feedback: brief green screen flash + soft 880Hz "ding".
  // Cooled down by FLASH_COOLDOWN_MS so quick re-tunes don't double-fire.
  // Sets muteUntil so the next ~280ms of mic data is skipped — that way
  // the ding can't leak back through the mic and confuse YIN into
  // reporting A5 right after every lock.
  function fireLockFeedback() {
    const now = performance.now();
    if (now - lastFlashAt < FLASH_COOLDOWN_MS) return;
    lastFlashAt = now;
    const flashEl = $('ls-tuner-flash');
    if (flashEl) {
      flashEl.classList.remove('flashing');
      // Force reflow so re-adding the class restarts the animation
      void flashEl.offsetWidth;
      flashEl.classList.add('flashing');
    }
    if (ctx && ctx.state === 'running') {
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
      muteUntil = t0 + 0.30;
    }
  }

  function tick() {
    rafId = requestAnimationFrame(tick);
    if (!analyser || !buf) return;
    analyser.getFloatTimeDomainData(buf);
    // Don't analyse while the lock-tone is still sounding through the mic
    if (ctx && ctx.currentTime < muteUntil) return;
    if (rms(buf) < 0.005) {
      if (recent.length) { recent = []; paintIdle('play a string'); }
      inTuneSince = 0;
      outSince = 0;
      return;
    }
    const f = yinPitch(buf, ctx.sampleRate);
    if (!(f > 60 && f < 1300)) return;
    recent.push(f);
    if (recent.length > SMOOTH_N) recent.shift();
    const fs = median(recent);

    const midiF = freqToMidi(fs);
    const midiR = Math.round(midiF);
    const cents = (midiF - midiR) * 100;
    const noteName = NOTE_NAMES[((midiR % 12) + 12) % 12];
    const octave = Math.floor(midiR / 12) - 1;
    const absCents = Math.abs(cents);
    const cls = classify(absCents);

    const noteEl   = $('ls-tuner-note');
    const centsEl  = $('ls-tuner-cents-val');
    const hzEl     = $('ls-tuner-orb-hz');
    const orbEl    = $('ls-tuner-orb');
    const needleEl = $('ls-tuner-needle');
    const statusEl = $('ls-tuner-status');

    if (noteEl)  { noteEl.textContent  = noteName + octave;             noteEl.className  = 'ls-tuner-note ' + cls; }
    if (centsEl) { centsEl.textContent = (cents >= 0 ? '+' : '') + cents.toFixed(0); centsEl.className = 'ls-tuner-cents-val ' + cls; }
    if (hzEl)    { hzEl.textContent    = fs.toFixed(1) + ' Hz'; }
    if (orbEl)   { orbEl.className     = 'ls-tuner-orb ' + cls; }
    // Needle rotation across the half-circle: ±50¢ → ±60°
    const deg = Math.max(-50, Math.min(50, cents)) * 1.2;
    if (needleEl) {
      needleEl.style.transform = 'translateX(-50%) rotate(' + deg.toFixed(1) + 'deg)';
      needleEl.className = 'ls-tuner-needle live ' + cls;
    }

    const ns = nearestString(fs);
    const matchCls = classify(Math.abs(ns.cents));
    document.querySelectorAll('#ls-tuner-strings .ts-cell').forEach(el => {
      const isMatch = parseInt(el.dataset.string, 10) === ns.string.num;
      el.classList.toggle('match', isMatch);
      el.classList.remove('in-tune', 'near', 'off');
      if (isMatch) el.classList.add(matchCls);
    });
    if (statusEl) { statusEl.textContent = ''; statusEl.classList.remove('err'); }

    // Lock-feedback state machine, wall-clock edition. Fire when in-tune
    // has been sustained for IN_TUNE_LOCK_MS AND we're currently armed.
    // Re-arm only after the user has drifted clearly off (|cents| > 10)
    // for OUT_REARM_MS so wobble near 0¢ doesn't generate a stream of
    // flashes. Using perf.now() instead of frame counts keeps the window
    // the same on 60Hz and 120Hz devices.
    const tNow = performance.now();
    if (absCents < 5) {
      if (!inTuneSince) inTuneSince = tNow;
      outSince = 0;
      if (armed && (tNow - inTuneSince) >= IN_TUNE_LOCK_MS) {
        fireLockFeedback();
        armed = false;
      }
    } else if (absCents > 10) {
      if (!outSince) outSince = tNow;
      inTuneSince = 0;
      if ((tNow - outSince) >= OUT_REARM_MS) armed = true;
    } else {
      // 5¢–10¢: dead zone, don't re-arm but also don't sustain in-tune timer
      inTuneSince = 0;
    }
  }

  async function start() {
    // Already running — don't request a second stream
    if (stream || rafId) return;
    const mySession = ++sessionId;
    const statusEl = $('ls-tuner-status');
    paintIdle('connecting microphone…');
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('mic api unavailable');
      }
      const s = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        },
      });
      // The user may have swiped away or rotated to portrait while the
      // permission prompt was up — in that case stop() bumped sessionId.
      // Release the stream we just received and bail out cleanly.
      if (mySession !== sessionId) {
        s.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
        return;
      }
      stream = s;
      ctx = ensureAudio();
      micSource = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      micSource.connect(analyser);    // analyser ONLY — never to ctx.destination
      recent = [];
      paintIdle('play a string');
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      if (mySession !== sessionId) return;   // got cancelled mid-permission
      const msg = (e && e.name === 'NotAllowedError')
        ? 'microphone access denied'
        : 'microphone unavailable';
      if (statusEl) {
        statusEl.textContent = msg + ' — tap to retry';
        statusEl.classList.add('err');
        statusEl.style.cursor = 'pointer';
        // One-shot retry: tap the status line to re-request permission.
        // Replaces the old "swipe away and back" workaround. Clear the
        // handler immediately so a double-tap can't double-fire start().
        statusEl.onclick = () => {
          statusEl.onclick = null;
          statusEl.style.cursor = '';
          start();
        };
      }
    }
  }

  function stop() {
    sessionId++;        // invalidate any in-flight start()
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
    if (analyser) { try { analyser.disconnect(); } catch (e) {} }
    analyser = null;
    buf = null;
    if (stream) {
      stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
      stream = null;
    }
    recent = [];
    inTuneSince = 0;
    outSince = 0;
    armed = true;
    muteUntil = 0;
    paintIdle('play a string');
  }

  function isRunning() { return !!stream || !!rafId; }
  function tunerModeVisible() {
    return state.standbyMode === 'tuner'
        && document.body.classList.contains('lp-on')
        && !document.body.classList.contains('player-active')
        && !document.hidden;
  }

  // Reference-tone pluck for tap-to-ring. Three-harmonic additive synth
  // (1× triangle, 2×/3× sine) with a fast attack + ~1.6s exponential
  // decay — close enough to a plucked string for ear-tuning. Goes
  // straight to ctx.destination (independent of the chord drone path so
  // it works even if the player isn't loaded). muteUntil bumps so the
  // mic-driven YIN tick skips the next ~1.7s and can't echo-detect the
  // reference tone as the user's own playing.
  function playStringTone(freq) {
    if (!ctx) ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const t0  = ctx.currentTime;
    const dur = 1.6;
    const harmonics = [
      { mul: 1, amp: 0.20, type: 'triangle' },
      { mul: 2, amp: 0.07, type: 'sine'     },
      { mul: 3, amp: 0.03, type: 'sine'     },
    ];
    harmonics.forEach(h => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = h.type;
      osc.frequency.setValueAtTime(freq * h.mul, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(h.amp, t0 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0002, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    });
    muteUntil = t0 + dur + 0.1;
    // Reset the lock-feedback state so the tuner's "play a string"
    // arming logic doesn't immediately fire a green flash when the
    // reference tone itself happens to be perfectly in tune. The tone
    // is muted from YIN anyway, but the in-tune timer would otherwise
    // persist from before the tap.
    inTuneSince = 0;
    outSince = 0;
    armed = false;       // require an actual out-of-tune drift to re-arm
  }

  // Wire tap-on-string-cell → reference pluck. Event delegation on the
  // wrapper so the wiring outlives any future innerHTML rebuilds.
  (function wireStringPluck() {
    const wrap = document.getElementById('ls-tuner-strings');
    if (!wrap) return;
    wrap.addEventListener('click', e => {
      const cell = e.target.closest('.ts-cell');
      if (!cell) return;
      const num = parseInt(cell.dataset.string, 10);
      const s = STRINGS.find(x => x.num === num);
      if (!s) return;
      playStringTone(s.freq);
      // Restart the pulse animation by removing + re-adding the class
      cell.classList.remove('pluck-pulse');
      void cell.offsetWidth;
      cell.classList.add('pluck-pulse');
    });
  })();

  // Page hidden (tab switched, screen locked, app backgrounded) → release
  // the mic so iOS doesn't keep the red recording dot pinned and so the
  // OS doesn't drain battery on a stalled tick. Coming back visible while
  // tuner mode is still selected restarts cleanly. Without this the mic
  // would stay open silently behind a frozen requestAnimationFrame loop.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (isRunning()) stop();
    } else if (tunerModeVisible() && !isRunning()) {
      start();
    }
  });

  // Player-active class is added when AI playback starts. The mic shouldn't
  // stay open during playback — same reasoning as above (battery, iOS audio
  // session in playAndRecord mode, surprising UX). Watches body class so
  // anything that triggers the player (spacebar, autoplay paths, mode
  // changes elsewhere) releases the mic for us without us having to thread
  // a hook into every entry point.
  (function wirePlayerActiveRelease() {
    let wasPlayerActive = document.body.classList.contains('player-active');
    const obs = new MutationObserver(() => {
      const nowPlayerActive = document.body.classList.contains('player-active');
      if (nowPlayerActive === wasPlayerActive) return;
      wasPlayerActive = nowPlayerActive;
      if (nowPlayerActive) {
        if (isRunning()) stop();
      } else if (tunerModeVisible() && !isRunning()) {
        // Player just stopped and we're back in tuner mode — re-open the mic
        start();
      }
    });
    obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  })();

  return { start, stop, isRunning };
})();

// Register the shared service worker so this app installs / works offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('pwa/sw.js').catch(() => {});
}
</script>

</body>
