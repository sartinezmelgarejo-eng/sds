/* ════════════════════════════════════════════════════════════
   AUDIO — drones (Web Audio API)
   ════════════════════════════════════════════════════════════ */

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Karplus-Strong physical-model plucked string. Returns an AudioBuffer.
// Cache of pre-computed Karplus-Strong buffers, keyed by (freq, opts).
// Building a 7s KS buffer is ~308k samples of synchronous JS work;
// chord progressions reuse the same notes constantly, so caching
// eliminates 95% of the per-voice cost and removes the main-thread
// stalls that were causing clicks / pops on the jazz guitar voice.
const _ksCache = new Map();
function ksBuffer(ctx, freq, opts = {}) {
  const duration   = opts.duration   ?? 2.2;
  const brightness = opts.brightness ?? 0.5;
  const damping    = opts.damping    ?? 0.9975;
  const sr = ctx.sampleRate;
  // Quantize freq to ~1 Hz so adjacent fractional pitches share a
  // cache entry — the perceptual difference is below the JND for
  // sustain tails and the cache stays small.
  const key = `${sr}|${Math.round(freq)}|${duration}|${brightness}|${damping}`;
  const cached = _ksCache.get(key);
  if (cached) return cached;

  const N = Math.max(2, Math.floor(sr / freq));
  const samples = Math.floor(duration * sr);
  const buf = ctx.createBuffer(1, samples, sr);
  const data = buf.getChannelData(0);
  // Delay line — shaped pluck (low-passed noise)
  const delay = new Float32Array(N);
  for (let i = 0; i < N; i++) delay[i] = Math.random() * 2 - 1;
  // Low-pass the initial burst (2 passes for warmer attack)
  for (let pass = 0; pass < 2; pass++) {
    let prev = 0;
    for (let i = 0; i < N; i++) {
      const v = delay[i] * (1 - brightness) + prev * brightness;
      delay[i] = v;
      prev = v;
    }
  }
  // Karplus-Strong main loop: output sample, average with next, feed back with damping
  let idx = 0;
  for (let i = 0; i < samples; i++) {
    const cur = delay[idx];
    data[i] = cur;
    const nxt = delay[(idx + 1) % N];
    delay[idx] = (cur + nxt) * 0.5 * damping;
    idx = (idx + 1) % N;
  }
  _ksCache.set(key, buf);
  // Keep cache bounded — drop the oldest entries if we balloon past
  // ~120 entries (~10 chord families × ~12 notes is plenty).
  if (_ksCache.size > 120) {
    const firstKey = _ksCache.keys().next().value;
    _ksCache.delete(firstKey);
  }
  return buf;
}

// Tube-style soft saturation curve (warm even+odd harmonics, no harshness)
function makeSatCurve(amount = 8) {
  const n = 2048;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    // tanh-style soft clip with slight asymmetry for tube warmth
    const y = Math.tanh(x * amount) / Math.tanh(amount);
    curve[i] = y * 0.85 + (y * y * Math.sign(y)) * 0.06;
  }
  return curve;
}

// Generate a short plate/room reverb impulse response. Cached per ctx.
let _jazzReverbIR = null;
function getJazzReverbIR(ctx) {
  if (_jazzReverbIR && _jazzReverbIR._sr === ctx.sampleRate) return _jazzReverbIR;
  const sr = ctx.sampleRate;
  const duration = 1.8;
  const len = Math.floor(sr * duration);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      // Exponential decay, slightly slower in the early tail
      const env = Math.pow(1 - t, 2.2) * (1 - 0.4 * Math.pow(t, 0.3));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    // gentle low-pass on the IR (one-pole) so reverb is dark, not splashy
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const v = data[i] * 0.35 + prev * 0.65;
      data[i] = v;
      prev = v;
    }
  }
  buf._sr = sr;
  _jazzReverbIR = buf;
  return buf;
}

class Drone {
  constructor() {
    this.nodes = [];
    this.master = null;
    this.playing = false;
    this.targetVolume = 0.18;
  }
  start(midiNotes, volume, forceRestart = false, startAt = null) {
    // Avoid restarting if the pitches didn't change (prevents clicking on focus
    // changes). Skip this short-circuit when the caller is explicitly asking
    // for a re-strike — e.g. the bar scheduler hitting the same chord at the
    // start of a new step, where the player WANTS the chord to sound again.
    if (!forceRestart && this.playing && this.lastNotes &&
        midiNotes.length === this.lastNotes.length &&
        midiNotes.every((n, i) => n === this.lastNotes[i])) {
      this.setVolume(volume);
      return;
    }
    const ctx = ensureAudio();
    // `startAt` is the absolute audioCtx time when this strike should begin.
    // Falls back to "now" when caller didn't schedule ahead. Clamped to the
    // present if the caller passed a stale (past) time.
    const t0 = Math.max(ctx.currentTime, startAt ?? ctx.currentTime);
    // Quick crossfade out of any previous master to avoid clicks. The fade
    // is anchored to NOW (not t0) so the old chord doesn't ring past the
    // new strike when t0 is slightly in the future.
    if (this.playing && this.master) {
      const oldM = this.master, oldN = this.nodes;
      const fadeStart = ctx.currentTime;
      const fadeEnd = Math.min(t0, fadeStart + 0.06);
      oldM.gain.cancelScheduledValues(fadeStart);
      oldM.gain.linearRampToValueAtTime(0, fadeEnd);
      const stopAt = fadeEnd + 0.03;
      setTimeout(() => {
        oldN.forEach(n => {
          try {
            if (n.o1) n.o1.stop();
            if (n.o2) n.o2.stop();
            if (n.o3) n.o3.stop();
            if (n.lfo) n.lfo.stop();
          } catch(e) {}
        });
        try { oldM.disconnect(); } catch(e) {}
      }, Math.max(90, (stopAt - fadeStart) * 1000 + 20));
    } else {
      this._immediateStop();
    }
    if (!midiNotes.length) {
      this.master = null; this.nodes = []; this.playing = false; this.lastNotes = null;
      return;
    }
    this.nodes = []; // fresh array for new oscillators
    this.lastNotes = [...midiNotes];
    this.targetVolume = volume;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    const sortedNotes = [...midiNotes].sort((a,b) => a - b);
    const timbre = droneTimbre;

    // Tremolo LFO only for Rhodes (the iconic wobble)
    if (timbre === 'rhodes') {
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 4.6;
      const lfoDepth = ctx.createGain();
      lfoDepth.gain.value = 0.055;
      lfo.connect(lfoDepth);
      lfoDepth.connect(this.master.gain);
      lfo.start(t0);
      this.nodes.push({lfo});
    }

    sortedNotes.forEach((midi, i) => {
      const startOffset = timbre === 'pad' ? 0 : i * 0.006;
      const t = t0 + startOffset;
      if (timbre === 'pad') this._voicePad(midi, i, sortedNotes.length, t);
      else if (timbre === 'organ') this._voiceOrgan(midi, i, sortedNotes.length, t);
      else if (timbre === 'piano') this._voicePiano(midi, i, sortedNotes.length, t);
      else if (timbre === 'jazzgtr') this._voiceJazzGuitar(midi, i, sortedNotes.length, t);
      else this._voiceRhodes(midi, i, sortedNotes.length, t);
    });

    // Per-timbre master attack — anchored at t0 so the strike lands exactly there
    const attack = timbre === 'pad' ? 0.4 : (timbre === 'organ' ? 0.18 : (timbre === 'piano' ? 0.05 : (timbre === 'jazzgtr' ? 0.04 : 0.06)));
    this.master.gain.cancelScheduledValues(t0);
    this.master.gain.setValueAtTime(0, t0);
    this.master.gain.linearRampToValueAtTime(this.targetVolume, t0 + attack);
    this.playing = true;
  }

  _voiceRhodes(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = freq;
    const ratio = midi < 55 ? 4 : (midi < 70 ? 7 : 14);
    const modulator = ctx.createOscillator();
    modulator.type = 'sine';
    modulator.frequency.value = freq * ratio;
    const modDepth = ctx.createGain();
    const peakDepth = freq * 3.2;
    const restDepth = freq * 0.12;
    modDepth.gain.setValueAtTime(0, t);
    modDepth.gain.linearRampToValueAtTime(peakDepth, t + 0.004);
    modDepth.gain.exponentialRampToValueAtTime(restDepth, t + 0.45);
    modulator.connect(modDepth);
    modDepth.connect(carrier.frequency);
    const pitchRoll = 1.0 - (i / total) * 0.4;
    const peakVol = 0.22 * pitchRoll;
    const sustainVol = peakVol * 0.62;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(peakVol, t + 0.008);
    noteG.gain.exponentialRampToValueAtTime(sustainVol, t + 0.5);
    carrier.connect(noteG);
    noteG.connect(this.master);
    carrier.start(t); modulator.start(t);
    this.nodes.push({o1: carrier, o2: modulator});
  }

  _voicePad(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq; o1.detune.value = -6;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq; o2.detune.value =  6;
    const o3 = ctx.createOscillator(); o3.type = 'sine';     o3.frequency.value = freq;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 1400 + (midi - 36) * 28;
    filt.Q.value = 0.5;
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const sineG = ctx.createGain(); sineG.gain.value = 0.48;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.12 * pitchRoll, t + 0.025);
    o1.connect(filt); o2.connect(filt);
    o3.connect(sineG); sineG.connect(filt);
    filt.connect(noteG); noteG.connect(this.master);
    o1.start(t); o2.start(t); o3.start(t);
    this.nodes.push({o1, o2, o3});
  }

  _voiceOrgan(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Full Hammond drawbar stack restored — the upper partials
     // (ratio 4 and 6) are what give the organ its sparkle / "sauce".
     // Trimming them flattened the sound; the jazz-guitar fixes
     // already covered the CPU budget so the full stack is back.
    const harmonics = [
      {ratio: 1, gain: 0.75},
      {ratio: 2, gain: 0.50},
      {ratio: 3, gain: 0.30},
      {ratio: 4, gain: 0.20},
      {ratio: 6, gain: 0.12},
    ];
    const pitchRoll = 1.0 - (i / total) * 0.30;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.12 * pitchRoll, t + 0.04);
    // Soft lowpass for warmth
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200 + (midi - 36) * 30;
    lp.Q.value = 0.4;
    noteG.connect(lp);
    lp.connect(this.master);
    const oscs = [];
    harmonics.forEach(h => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * h.ratio;
      const g = ctx.createGain(); g.gain.value = h.gain;
      o.connect(g); g.connect(noteG);
      o.start(t);
      oscs.push(o);
    });
    // Track oscillators in chunks of 3 (so stop logic catches them all)
    for (let j = 0; j < oscs.length; j += 3) {
      this.nodes.push({ o1: oscs[j], o2: oscs[j+1], o3: oscs[j+2] });
    }
  }

  _voicePiano(midi, i, total, t) {
    // Calm felt/acoustic piano: gentle hammer attack, mellow decay
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Fundamental sine
    const fund = ctx.createOscillator();
    fund.type = 'sine'; fund.frequency.value = freq;
    // Triangle for body
    const tri = ctx.createOscillator();
    tri.type = 'triangle'; tri.frequency.value = freq;
    // Subtle 2nd harmonic (octave above) for slight piano color
    const harm = ctx.createOscillator();
    harm.type = 'sine'; harm.frequency.value = freq * 2;
    const harmG = ctx.createGain(); harmG.gain.value = 0.18;
    const triG = ctx.createGain(); triG.gain.value = 0.45;
    // Soft lowpass with a slight downward sweep (felt damping)
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(1100, t + 0.5);
    lp.Q.value = 0.35;
    // Pitch-dependent decay — high notes die faster like a real piano.
    const decayTime = midi < 55 ? 5.0 : (midi < 65 ? 4.0 : (midi < 72 ? 3.2 : 2.5));
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const peakVol = 0.22 * pitchRoll;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(peakVol, t + 0.018);            // soft felt attack
    env.gain.exponentialRampToValueAtTime(peakVol * 0.5,  t + 0.35);       // hammer pluck dies
    env.gain.exponentialRampToValueAtTime(peakVol * 0.15, t + decayTime * 0.55);
    env.gain.exponentialRampToValueAtTime(0.0001,         t + decayTime);  // full fade to silence
    fund.connect(env);
    tri.connect(triG); triG.connect(env);
    harm.connect(harmG); harmG.connect(env);
    env.connect(lp);
    lp.connect(this.master);
    fund.start(t); tri.start(t); harm.start(t);
    // Free the oscillators after the envelope finishes so they don't pile up
    fund.stop(t + decayTime + 0.1);
    tri.stop(t + decayTime + 0.1);
    harm.stop(t + decayTime + 0.1);
    this.nodes.push({o1: fund, o2: tri, o3: harm});
  }

  _voiceJazzGuitar(midi, i, total, t) {
    // Soft archtop jazz guitar — Karplus-Strong physically modeled plucked string
    // plus body-formant EQ to suggest the wooden hollow body.
    const ctx = audioCtx;
    const freq = midiToFreq(midi);

    // Joe-Pass dark archtop: neck pickup, tone rolled off — heavily damped attack
    const brightness = midi < 55 ? 0.86 : (midi < 70 ? 0.82 : 0.78);
    // Long sustain across the range (hollow body resonance)
    const damping = midi < 55 ? 0.9990 : (midi < 70 ? 0.9984 : 0.9978);

    // 7s was overkill — by 4s the KS damping has decayed the string
     // far below audibility, and the per-voice envelope (decayTime
     // below) already fades within ~5s anyway. Halving the buffer
     // halves the main-thread cost on every fresh chord.
    const buf = ksBuffer(ctx, freq, {
      duration: 4,
      brightness,
      damping,
    });
    const src = ctx.createBufferSource();
    src.buffer = buf;

    // Per-voice filter chain SLASHED: was 6 BiquadFilters per voice
    // (3 body formants + 2 LPs + highshelf). The body formants moved
    // into the shared FX bus below (one set across all voices instead
    // of N sets). One LP + highshelf is enough per voice for the
    // tone-knob roll. ~25 fewer BiquadFilters per chord on mobile.
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1800; lp.Q.value = 0.6;
    const hsh = ctx.createBiquadFilter();
    hsh.type = 'highshelf'; hsh.frequency.value = 2200; hsh.gain.value = -14;

    // Per-voice volume balance
    const pitchRoll = 1 - (i / total) * 0.35;
    const vol = 0.32 * pitchRoll;
    const g = ctx.createGain();
    // Gentle plucked-string envelope: brief settling after the pluck, then slow body decay.
    const decayTime = midi < 55 ? 6.5 : (midi < 65 ? 5.5 : (midi < 72 ? 4.5 : 3.5));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    // Small settle: pluck transient drops ~15% in the first half-second
    g.gain.exponentialRampToValueAtTime(vol * 0.85, t + 0.5);
    // Long slow decay through the body of the note
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + decayTime * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decayTime);

    // Shared FX bus — saturation, amp tone, body formants, and a
    // cheap delay-based "room" instead of a ConvolverNode. The
    // convolver was the biggest single-node CPU cost; a parallel
    // feedback delay tail is musically close for this dark archtop
    // and runs ~10x cheaper on the audio thread.
    if (!this._gtrFx || this._gtrFx._master !== this.master) {
      // Body formants — moved from per-voice to bus (one set for the
      // whole chord, not N sets). Slightly less independent per-note
      // behavior but for chord stacks the difference is inaudible.
      const fb1 = ctx.createBiquadFilter();
      fb1.type = 'peaking'; fb1.frequency.value = 180; fb1.Q.value = 1.2; fb1.gain.value = 2.5;
      const fb2 = ctx.createBiquadFilter();
      fb2.type = 'peaking'; fb2.frequency.value = 520; fb2.Q.value = 1.4; fb2.gain.value = 2.0;
      const fb3 = ctx.createBiquadFilter();
      fb3.type = 'peaking'; fb3.frequency.value = 1400; fb3.Q.value = 1.6; fb3.gain.value = 1.0;
      // Pre-amp tone: gentle low-mid warmth + slight upper-mid scoop
      const preEq = ctx.createBiquadFilter();
      preEq.type = 'peaking'; preEq.frequency.value = 350; preEq.Q.value = 0.8; preEq.gain.value = 1.8;
      const scoop = ctx.createBiquadFilter();
      scoop.type = 'peaking'; scoop.frequency.value = 2200; scoop.Q.value = 1.2; scoop.gain.value = -3.0;
      // Light tube warmth — oversample 'none' is fine for this gentle curve
      const drive = ctx.createGain();  drive.gain.value = 1.15;
      const sat = ctx.createWaveShaper();
      sat.curve = makeSatCurve(2.2);
      sat.oversample = 'none';
      const postSat = ctx.createGain(); postSat.gain.value = 0.88;
      // Speaker cab — dark, woody
      const ampLp = ctx.createBiquadFilter();
      ampLp.type = 'lowpass'; ampLp.frequency.value = 2000; ampLp.Q.value = 0.5;
      const ampHp = ctx.createBiquadFilter();
      ampHp.type = 'highpass'; ampHp.frequency.value = 85; ampHp.Q.value = 0.5;
      // Cheap delay-based room reverb (replaces ConvolverNode).
      const dry = ctx.createGain(); dry.gain.value = 0.92;
      const sendToVerb = ctx.createGain(); sendToVerb.gain.value = 0.18;
      const verbDelay = ctx.createDelay(0.5);
      verbDelay.delayTime.value = 0.085;
      const verbFb = ctx.createGain(); verbFb.gain.value = 0.45;
      const verbTone = ctx.createBiquadFilter();
      verbTone.type = 'lowpass'; verbTone.frequency.value = 2200; verbTone.Q.value = 0.4;
      const wet = ctx.createGain(); wet.gain.value = 0.18;
      // Bus input
      const input = ctx.createGain(); input.gain.value = 1.0;
      // Wiring: input → body formants → preEq → scoop → drive → sat → cab → dry/verb
      input.connect(fb1); fb1.connect(fb2); fb2.connect(fb3);
      fb3.connect(preEq); preEq.connect(scoop); scoop.connect(drive); drive.connect(sat); sat.connect(postSat);
      postSat.connect(ampHp); ampHp.connect(ampLp);
      ampLp.connect(dry); dry.connect(this.master);
      ampLp.connect(sendToVerb); sendToVerb.connect(verbDelay);
      verbDelay.connect(verbFb); verbFb.connect(verbDelay);  // feedback loop
      verbDelay.connect(verbTone); verbTone.connect(wet); wet.connect(this.master);

      this._gtrFx = { input, _master: this.master };
    }

    src.connect(lp); lp.connect(hsh); hsh.connect(g); g.connect(this._gtrFx.input);
    src.start(t);
    this.nodes.push({o1: src});
  }

  _immediateStop() {
    this.nodes.forEach(n => {
      try {
        if (n.o1) n.o1.stop();
        if (n.o2) n.o2.stop();
        if (n.o3) n.o3.stop();
        if (n.lfo) n.lfo.stop();
      } catch(e) {}
    });
    if (this.master) { try { this.master.disconnect(); } catch(e) {} }
    this.nodes = []; this.master = null; this.playing = false;
    this.lastNotes = null;
  }
  stop(fadeMs = 350) {
    if (!this.playing || !audioCtx) return this._immediateStop();
    const now = audioCtx.currentTime;
    const m = this.master, n = this.nodes;
    m.gain.cancelScheduledValues(now);
    m.gain.linearRampToValueAtTime(0, now + fadeMs/1000);
    setTimeout(() => {
      n.forEach(x => {
        try {
          if (x.o1) x.o1.stop();
          if (x.o2) x.o2.stop();
          if (x.o3) x.o3.stop();
          if (x.lfo) x.lfo.stop();
        } catch(e) {}
      });
      try { m.disconnect(); } catch(e) {}
    }, fadeMs + 60);
    this.master = null; this.nodes = []; this.playing = false;
  }
  setVolume(v) {
    this.targetVolume = v;
    if (this.master && audioCtx) {
      this.master.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
    }
  }
}

let droneTimbre = 'piano';
let loopMode = 'off';  // 'off' | 'bars-4' | 'section' | 'song'
// Key-cycle modes: 'none' | 'chromatic' (+1 semitone per loop) | 'fourths' (+5)
let cycleMode = 'none';
// Labels show the semitone jump per loop with a leading "+" so it's
// obvious how much the key moves each cycle (renamed from "cycle"
// to PITCHED in the UI). chromatic = +1 semitone, fourths = +5.
const CYCLE_OPTIONS = [
  { value: 'none',      label: '·',  title: 'PITCHED off' },
  { value: 'chromatic', label: '+1', title: 'PITCHED — up 1 semitone each loop' },
  { value: 'fourths',   label: '+5', title: 'PITCHED — up 5 semitones (a fourth) each loop' },
];

const tonicDrone = new Drone();
const chordDrone = new Drone();

/* ─── Bass pluck (jazz upright pizzicato) ─── */

function bassMidiForPc(pc) {
  // Map pitch class to a bass register (MIDI 32-43 range, G#1 to G2)
  let midi = 24 + pc;
  while (midi < 32) midi += 12;
  if (midi > 43) midi -= 12;
  return midi;
}

function playBassPluck(midi, time, volume) {
  const ctx = audioCtx;
  if (!ctx) return [];
  const freq = midiToFreq(midi);

  // Triangle = warm body
  const tri = ctx.createOscillator();
  tri.type = 'triangle'; tri.frequency.value = freq;
  // Sine sub for depth
  const sine = ctx.createOscillator();
  sine.type = 'sine'; sine.frequency.value = freq;
  // Brief saw click for the pluck transient
  const click = ctx.createOscillator();
  click.type = 'sawtooth'; click.frequency.value = freq * 2;
  const clickG = ctx.createGain();
  clickG.gain.setValueAtTime(0, time);
  clickG.gain.linearRampToValueAtTime(volume * 0.35, time + 0.003);
  clickG.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);

  // Lowpass with downward sweep — "thump" envelope
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1200, time);
  lp.frequency.exponentialRampToValueAtTime(280, time + 0.3);
  lp.Q.value = 0.7;

  // Main amplitude envelope
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(volume, time + 0.008);
  env.gain.exponentialRampToValueAtTime(volume * 0.45, time + 0.18);
  env.gain.exponentialRampToValueAtTime(0.0008, time + 1.3);

  tri.connect(env);
  sine.connect(env);
  click.connect(clickG); clickG.connect(env);
  env.connect(lp);
  lp.connect(ctx.destination);

  tri.start(time); sine.start(time); click.start(time);
  tri.stop(time + 1.4); sine.stop(time + 1.4); click.stop(time + 0.06);

  return [tri, sine, click];
}

function tonicMidiNotes() {
  // Root note in 2 octaves (bass + tenor) + fifth above for body
  const pc = state.keyPc;
  return [36 + pc, 48 + pc, 36 + pc + 7];
}
function chordMidiNotes() {
  const fs = focusedShape();
  if (!fs.shape) return [];
  return fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
}

// Per-channel volumes (0..1). The mixer popover writes here; audio sites read.
const channelVols = {
  chords:    0.7,
  bass:      0.7,
  metronome: 0.7,
  tonic:     0.0,    // off by default; raise in mixer to enable
};
const CHANNEL_SCALES = { chords: 0.5, bass: 0.5, metronome: 1.0, tonic: 0.5 };
function chVol(name) { return channelVols[name] * (CHANNEL_SCALES[name] ?? 0.5); }

// Backward-compat shim — old call sites that meant "the chord/drone volume"
function currentDroneVolume() { return chVol('chords'); }

// Bass is enabled whenever its slider is above zero.
function isBassEnabled() { return channelVols.bass > 0.001; }

function updateActiveDrones() {
  if (tonicDrone.playing) tonicDrone.start(tonicMidiNotes(), chVol('tonic'));
  if (chordDrone.playing) chordDrone.start(chordMidiNotes(), chVol('chords'));
}

// Auto start/stop the tónica drone when its channel volume crosses zero.
function syncTonicDrone() {
  if (channelVols.tonic > 0.001) {
    if (!tonicDrone.playing) tonicDrone.start(tonicMidiNotes(), chVol('tonic'));
    else tonicDrone.setVolume(chVol('tonic'));
  } else {
    if (tonicDrone.playing) tonicDrone.stop();
  }
}

// Ring the currently focused chord's voicing — used for manual navigation
// (keyboard shortcut OR chord card click). Skips when the AI is playing so
// we don't double up. The jazz-guitar voice has natural per-note decay so
// the chord fades out on its own without ringing forever.
function ringFocusedChord() {
  if (player.playing) return;
  ensureAudio();
  const fs = focusedShape();
  if (!fs?.shape) return;
  const notes = fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
  if (!notes.length) return;
  chordDrone.start(notes, currentDroneVolume() * 1.8, true);
  // Safety: fade the master after ~2s so audio never lingers indefinitely
  if (chordDrone.master && audioCtx) {
    const m = chordDrone.master;
    const now = audioCtx.currentTime;
    m.gain.cancelScheduledValues(now + 2);
    m.gain.setTargetAtTime(0, now + 2, 0.5);
  }
}

// Audition a chord WHILE the AI is playing — rings the clicked chord on top
// of the playback so the user can hear what they tapped, without altering the
// progression. The next bar boundary's scheduled chord will naturally
// overwrite the audition, restoring whatever was supposed to be playing.
// A timeout also reverts the visual focus to the chord that's actually
// sounding, so the highlight doesn't get stuck on the auditioned card.
let _auditionRevertTimer = null;
function auditionChord(chordId, opts = {}) {
  // PAUSED counts — the user is still in play mode, just stopped audio.
  if (!player.playing && !player.paused) return;
  ensureAudio();
  // Caller can pass a shape directly (preview audition that bypasses
  // state.focusedChord — keeps the player's visualization untouched).
  const shape = opts.shape || (focusedShape() && focusedShape().shape);
  if (!shape) return;
  const notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
  if (!notes.length) return;
  chordDrone.start(notes, currentDroneVolume() * 1.8, true);
  // No focus mutation happened, so there's nothing to revert.
  if (opts.silentVisual) return;
  // Revert the focused chord back to whatever the player is on after a few
  // seconds (or sooner if the user clicks again — the timer is replaced).
  if (_auditionRevertTimer) clearTimeout(_auditionRevertTimer);
  _auditionRevertTimer = setTimeout(() => {
    _auditionRevertTimer = null;
    if (!player.playing && !player.paused) return;
    state.focusedChord = player.currentChord || state.focusedChord;
    state.userVoicing = null;
    renderAll();
    document.querySelectorAll('.map-card').forEach(c => {
      if (c.dataset.chord === player.currentChord) c.classList.add('playing');
      else if (c.dataset.chord === player.nextChord) c.classList.add('next-up');
    });
  }, 3500);
}

// Controls which chords appear in the chord map AND which progressions the AI can choose.
const SCOPE_OPTIONS = [
  {value: 'all',      emoji: '✦', label: 'All',        desc: 'diatonic + secondaries + borrowed'},
  {value: 'diatonic', emoji: '◇', label: 'Diatonic',   desc: 'only the 7 diatonic chords'},

  {value: 'secondary',emoji: '✷', label: '+ Secondaries', desc: 'diatonic + secondary dominants'},
];
let chordScope = 'all';

// True iff `chordId` is allowed under the current scope.
function isChordInScope(chordId) {
  const ch = currentMap().chordDefs[chordId];
  if (!ch) return false;
  if (chordScope === 'all') return true;
  if (chordScope === 'diatonic') return ['tonic','predom','dom'].includes(ch.tag);
  if (chordScope === 'borrowed') return ['tonic','predom','dom','borrowed'].includes(ch.tag);
  if (chordScope === 'secondary') return ['tonic','predom','dom','secondary'].includes(ch.tag);
  return true;
}

        player.bassPattern = player._currentSection().bassPattern || player.bassPattern;
        player._cachedPage = null;

    });
  });
}

// Anchor a popover under a button while keeping it inside the viewport.
// Without this, opening a popover near the right edge of a phone pushes the
// menu off-screen. We make it visible momentarily to measure its width, then
// clamp left so it always fits within an 8px margin.
function positionPopoverUnder(menu, btn) {
  const rect = btn.getBoundingClientRect();
  const margin = 8;
  // Show it first so the layout engine gives us a real width
  menu.style.visibility = 'hidden';
  menu.hidden = false;
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = rect.left;
  if (left + mw > vw - margin) left = Math.max(margin, vw - mw - margin);
  if (left < margin) left = margin;
  let top = rect.bottom + 4;
  if (top + mh > vh - margin) top = Math.max(margin, rect.top - mh - 4);  // flip above
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';
  menu.style.visibility = '';
}

// multi-chord slot writes. Soft fallback to drop2 (the existing emergency
// fallback at ~:6572) kicks in if no allowed type yields a shape for a
// given chord, so play never breaks.
const VOICING_TYPE_IDS = VOICING_OPTIONS.filter(v => v.value !== 'all').map(v => v.value);
let voicingPrefSet = new Set(VOICING_TYPE_IDS);
function voicingPrefIsAll() {
  return voicingPrefSet.size === VOICING_TYPE_IDS.length;
}
function isVoicingAllowed(type) {
  return voicingPrefIsAll() || (type && voicingPrefSet.has(type));
}
function allowedVoicingTypes() {
  return voicingPrefIsAll() ? VOICING_TYPE_IDS.slice() : [...voicingPrefSet];
}
function filterShapeCandidates(cands) {
  if (voicingPrefIsAll() || !cands || !cands.length) return cands;
  const filtered = cands.filter(c => c && c.type && voicingPrefSet.has(c.type));
  return filtered.length ? filtered : cands;
}
// Compact short codes for the voicing button when 2+ types are selected.
// The full label "DROP-2 + DROP-3 + SHELLS" would grow the button (and the
// whole toolbar / mobile numberpad with it), so we cap visible length:
//   1 selected → full label (DROP-2, SHELLS, etc.)
//   2 selected → two short codes joined with '+'  (e.g. D2+D3)
//   3+ selected → MIX·N where N is the count.
const VOICING_SHORT_CODE = {
  drop2: 'D2', drop3: 'D3', shell: 'SH',
  triad: 'TR', guide: 'GU', sus: 'SU', strum: 'ST',
};
function getVoicingPrefLabel() {
  if (voicingPrefIsAll()) return 'ALL';
  const selected = VOICING_OPTIONS
    .filter(o => o.value !== 'all' && voicingPrefSet.has(o.value));
  if (selected.length === 1) return selected[0].label.toUpperCase();
  if (selected.length === 2) {
    return selected.map(o => VOICING_SHORT_CODE[o.value] || o.label[0].toUpperCase()).join('+');
  }
  return `MIX·${selected.length}`;
}
function defaultAllowedType(preferred) {
  if (voicingPrefIsAll() || voicingPrefSet.has(preferred)) return preferred;
  return allowedVoicingTypes()[0] || preferred;
}

function _updateVoicingPrefButton() {
  const vv = voicingBtn.querySelector('.sc-val');
  const label = getVoicingPrefLabel();
  if (vv) vv.textContent = label;
  else voicingBtn.textContent = label;
}
function renderVoicingMenu() {
  // Multi-select menu. Each row toggles its type in voicingPrefSet. The
  // 'ALL' row is a special mass-select: clicking it fills the set. Clicking
  // a specific type while in ALL drops to a single-type filter. Toggling
  // the last individual off snaps back to ALL so play never has zero-
  // allowed types. Menu stays open after a click; outside-click handler at
  // :11057 closes it.
  voicingMenu.innerHTML = VOICING_OPTIONS.map(v => {
    // When ALL is on, only ALL gets the checkmark — individual rows stay
    // unchecked (less visual noise). When in a partial filter, ALL is off
    // and only the actively-allowed types show their checks.
    const selected = (v.value === 'all')
      ? voicingPrefIsAll()
      : (!voicingPrefIsAll() && voicingPrefSet.has(v.value));
    return `
    <div class="sound-menu-item ${selected ? 'selected' : ''}" data-voicing="${v.value}">
      <span class="menu-ico">${VOICE_ICONS[v.value] || ''}</span>
      <span style="flex:1">
        ${v.label}
        <span style="display:block;font-size:10px;opacity:0.6;font-style:italic">${v.desc}</span>
      </span>
      <span class="check">✓</span>
    </div>`;
  }).join('');
  voicingMenu.querySelectorAll('[data-voicing]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      const id = item.dataset.voicing;
      if (id === 'all') {
        voicingPrefSet = new Set(VOICING_TYPE_IDS);
      } else if (voicingPrefIsAll()) {
        // First specific click out of ALL → switch to a single-type filter.
        voicingPrefSet = new Set([id]);
      } else if (voicingPrefSet.has(id)) {
        voicingPrefSet.delete(id);
        if (voicingPrefSet.size === 0) voicingPrefSet = new Set(VOICING_TYPE_IDS);
      } else {
        voicingPrefSet.add(id);
      }
      _updateVoicingPrefButton();
      renderVoicingMenu();
      // Re-assign voicingType per section so the strip lookahead and the
      // player stay synchronized under the new preference.
      if (player.playing && player.song) {
        const typeByLabel = {};
        player.song.forEach(s => {
          const key = s.label + (s.modName || '');
          if (typeByLabel[key] === undefined) typeByLabel[key] = player._pickVoicingType();
          s.voicingType = typeByLabel[key];
        });
        player.voicingType = player._currentSection().voicingType;
        player._cachedPage = null;     // strip recomputes with new types
      }
      // Re-render only what depends on the voicing filter. renderAll()
      // here was triggering layout reflow on mobile (visualViewport scroll
      // → fitMap → chord-map host resize) every time a voicing was
      // toggled. The compose strip, key row, scale strip, etc. don't
      // depend on the filter — already-written cells keep their stored
      // voicings — so re-rendering them on filter changes was both
      // wasteful and visually disruptive.
      if (typeof renderChordMap   === 'function') renderChordMap();
      if (typeof renderFretboard  === 'function') renderFretboard();
    });
  });
}

voicingBtn.addEventListener('click', e => {

/* ─── Metronome ─── */

class Metronome {
  constructor() {
    this.bpm = 120;
    this.mode = 'ride';
    this.playing = false;
    this.nextTickTime = 0;
    this.tickIdx = 0;
    this.timer = null;
    this.scheduleAhead = 0.12;
    this.lookAheadMs = 25;
    // Standalone-metronome controls (used by the landscape standby's
    // metronome mode). beatsPerBar reshapes the click-mode tick pattern
    // so downbeat lands every N ticks instead of every 4. _barCount and
    // _accelOn drive the auto-accelerate feature (+5 BPM every 4 bars).
    this.beatsPerBar = 4;
    this._barCount = 0;
    this._accelOn = false;
  }
  // Lazy-init a long pink-noise buffer once per audio context. Reused for both
  // the ride shimmer wash and the 2&4 hi-hat. Pink noise sounds random regardless,
  // so generating it once and replaying is indistinguishable from per-tick generation
  // — but skips ~48k samples of synchronous main-thread work per tick (the original
  // biggest source of audio glitches on mobile).
  static _ensurePinkBuf(ctx) {
    if (Metronome._pinkBuf && Metronome._pinkBuf._sr === ctx.sampleRate) return Metronome._pinkBuf;
    const bufLen = Math.floor(ctx.sampleRate * 1.2);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    // Paul Kellet's pink noise approximation
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for (let i = 0; i < bufLen; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    buf._sr = ctx.sampleRate;
    Metronome._pinkBuf = buf;
    return buf;
  }
  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.tickIdx = 0;
    this._barCount = 0;
    this.nextTickTime = ctx.currentTime + 0.08;
    this.timer = setInterval(() => this._scheduler(), this.lookAheadMs);
  }
  stop() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
  }
  _scheduler() {
    if (!audioCtx) return;
    while (this.nextTickTime < audioCtx.currentTime + this.scheduleAhead) {
      this._playTick(this.nextTickTime, this.tickIdx);
      this._advance();
    }
  }
  _advance() {
    if (this.mode === 'drums') {
      // Straight 8ths: 8 ticks per bar, no swing
      this.nextTickTime += (60 / this.bpm) / 2; // eighth note
      this.tickIdx = (this.tickIdx + 1) % 8;
      return;
    }
    if (this.mode === 'click' || this.mode === 'twofour') {
      this.nextTickTime += 60 / this.bpm;
      // Use custom beatsPerBar (3-7) only in click mode; twofour keeps 4
      // because its backbeat semantics assume 4/4. The visual beat indicator
      // still shows beatsPerBar dots regardless of the underlying pattern.
      const period = (this.mode === 'click') ? (this.beatsPerBar || 4) : 4;
      const prev = this.tickIdx;
      this.tickIdx = (this.tickIdx + 1) % period;
      // Bar completed (tickIdx wrapped back to 0) — bump bar counter
      // and apply accel if armed.
      if (this.tickIdx === 0 && prev !== 0) {
        this._barCount++;
        if (this._accelOn && this._barCount > 0 && this._barCount % 8 === 0) {
          // Defer the BPM bump so it doesn't mutate state mid-scheduler loop
          setTimeout(() => {
            if (typeof setBpm === 'function') setBpm(this.bpm + 5);
          }, 0);
        }
      }
    } else {
      // Jazz ride: 6 hits per bar in triplet feel at triplet positions [0, 3, 5, 6, 9, 11] of 12
      const positions = [0, 3, 5, 6, 9, 11];
      const cur = positions[this.tickIdx];
      this.tickIdx = (this.tickIdx + 1) % 6;
      const nxt = positions[this.tickIdx];
      const triplet = 60 / (this.bpm * 3); // duration of one triplet eighth
      let diff = nxt - cur;
      if (diff <= 0) diff += 12;
      this.nextTickTime += diff * triplet;
    }
  }
  _playTick(time, idx) {
    if (this.mode === 'click') this._click(time, idx === 0);
    else if (this.mode === 'twofour') this._twoFour(time, idx);
    else if (this.mode === 'drums') this._drums(time, idx);
    else this._ride(time, idx);
    // UI callback fired in sync with the actual audio tick (no rAF jitter).
    // Used by the landscape standby beat indicator. Delay = scheduled audio
    // time minus current ctx time, so the visual hits at the same instant
    // the listener hears the click.
    if (this._onUITick) {
      const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);
      const cb = this._onUITick;
      const mode = this.mode;
      setTimeout(() => { if (this._onUITick === cb) cb(idx, mode); }, delayMs);
    }
  }
  _click(time, isDownbeat) {
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = isDownbeat ? 1600 : 1100;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.32 * mv, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(time); o.stop(time + 0.08);
  }
  _ride(time, idx) {
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    // idx 0,3 = main "ding" (downbeats); idx 1,4 = swing "and"; idx 2,5 = skip note
    const isDing = (idx === 0 || idx === 3);
    const dur = isDing ? 1.1 : 0.55;
    const vol = (isDing ? 0.20 : 0.13) * mv;

    // PRIMARY: pink-noise shimmer wash from the shared cached buffer
    const noise = ctx.createBufferSource();
    noise.buffer = Metronome._ensurePinkBuf(ctx);

    // Multi-stage filtering for the cymbal "sheen"
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3200;
    hp.Q.value = 0.4;

    const shimmer = ctx.createBiquadFilter();
    shimmer.type = 'peaking';
    shimmer.frequency.value = 7800;
    shimmer.Q.value = 1.2;
    shimmer.gain.value = 6;

    const air = ctx.createBiquadFilter();
    air.type = 'lowpass';
    air.frequency.value = 13000;
    air.Q.value = 0.5;

    const noiseEnv = ctx.createGain();
    // Soft attack (no harsh click), long smooth exponential tail
    noiseEnv.gain.setValueAtTime(0.0001, time);
    noiseEnv.gain.exponentialRampToValueAtTime(vol, time + 0.018);
    noiseEnv.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    noise.connect(hp); hp.connect(shimmer); shimmer.connect(air); air.connect(noiseEnv); noiseEnv.connect(ctx.destination);
    noise.start(time);

    // ─── SECONDARY: subtle warm "ding" bell — only on main beats, very quiet ───
    if (isDing) {
      // Two soft mid-high partials, warm not piercing
      const partials = [{f: 940, g: 0.5}, {f: 1640, g: 0.3}];
      partials.forEach(p => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = p.f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol * 0.09 * p.g, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.55);
        o.connect(g); g.connect(ctx.destination);
        o.start(time); o.stop(time + dur * 0.6);
      });
    }
  }
  _twoFour(time, idx) {
    // Beats 2 and 4 only — idx 0=beat1, 1=beat2, 2=beat3, 3=beat4
    if (idx !== 1 && idx !== 3) return;
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    // Brushed snare / rim-ish: pink noise bandpassed in the snare body region
    // with a quick metallic ping on top. More body and presence than the old
    // thin hi-hat tick, fills the room better at low volumes.
    const noise = ctx.createBufferSource();
    noise.buffer = Metronome._ensurePinkBuf(ctx);
    // Body band: focused on ~3.5kHz with steep filtering = warm snare body
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3500; bp.Q.value = 1.2;
    // Air shelf: slight highshelf cut to keep it from being shrill
    const shelf = ctx.createBiquadFilter();
    shelf.type = 'highshelf'; shelf.frequency.value = 8000; shelf.gain.value = -6;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, time);
    env.gain.exponentialRampToValueAtTime(0.55 * mv, time + 0.004);  // snappier attack
    env.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);      // longer body decay
    noise.connect(bp); bp.connect(shelf); shelf.connect(env); env.connect(ctx.destination);
    noise.start(time); noise.stop(time + 0.18);

    // Subtle metallic "click" — short sine ping that gives it definition
    const ping = ctx.createOscillator();
    ping.type = 'triangle'; ping.frequency.value = 2200;
    const pingEnv = ctx.createGain();
    pingEnv.gain.setValueAtTime(0.0001, time);
    pingEnv.gain.exponentialRampToValueAtTime(0.12 * mv, time + 0.002);
    pingEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    ping.connect(pingEnv); pingEnv.connect(ctx.destination);
    ping.start(time); ping.stop(time + 0.05);
  }
  _drums(time, idx) {
    // Straight-8th rock beat (8 ticks per bar, no swing):
    //   tick: 0  1  2  3  4  5  6  7
    //   HH:  x  x  x  x  x  x  x  x   (every 8th)
    //   KK:  x        x               (beats 1 and 3)
    //   SN:        x        x         (beats 2 and 4)
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;

    // Hi-hat on every 8th note
    const hat = ctx.createBufferSource();
    hat.buffer = Metronome._ensurePinkBuf(ctx);
    const hatHp = ctx.createBiquadFilter();
    hatHp.type = 'highpass'; hatHp.frequency.value = 7000; hatHp.Q.value = 0.6;
    const hatEnv = ctx.createGain();
    const hatVol = (idx % 2 === 0 ? 0.18 : 0.12) * mv; // downbeats slightly louder
    hatEnv.gain.setValueAtTime(0.0001, time);
    hatEnv.gain.exponentialRampToValueAtTime(hatVol, time + 0.002);
    hatEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    hat.connect(hatHp); hatHp.connect(hatEnv); hatEnv.connect(ctx.destination);
    hat.start(time); hat.stop(time + 0.08);

    // Kick on beats 1 and 3 (ticks 0 and 4)
    if (idx === 0 || idx === 4) {
      const kick = ctx.createOscillator();
      kick.type = 'sine';
      kick.frequency.setValueAtTime(150, time);
      kick.frequency.exponentialRampToValueAtTime(40, time + 0.12);
      const kickEnv = ctx.createGain();
      kickEnv.gain.setValueAtTime(0.0001, time);
      kickEnv.gain.exponentialRampToValueAtTime(0.45 * mv, time + 0.005);
      kickEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.25);
      kick.connect(kickEnv); kickEnv.connect(ctx.destination);
      kick.start(time); kick.stop(time + 0.3);
      // Kick click transient
      const kclick = ctx.createOscillator();
      kclick.type = 'square';
      kclick.frequency.value = 800;
      const kcEnv = ctx.createGain();
      kcEnv.gain.setValueAtTime(0.0001, time);
      kcEnv.gain.exponentialRampToValueAtTime(0.08 * mv, time + 0.001);
      kcEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.015);
      kclick.connect(kcEnv); kcEnv.connect(ctx.destination);
      kclick.start(time); kclick.stop(time + 0.02);
    }

    // Snare on beats 2 and 4 (ticks 2 and 6)
    if (idx === 2 || idx === 6) {
      const snare = ctx.createBufferSource();
      snare.buffer = Metronome._ensurePinkBuf(ctx);
      const snBp = ctx.createBiquadFilter();
      snBp.type = 'bandpass'; snBp.frequency.value = 3000; snBp.Q.value = 0.8;
      const snEnv = ctx.createGain();
      snEnv.gain.setValueAtTime(0.0001, time);
      snEnv.gain.exponentialRampToValueAtTime(0.35 * mv, time + 0.003);
      snEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
      snare.connect(snBp); snBp.connect(snEnv); snEnv.connect(ctx.destination);
      snare.start(time); snare.stop(time + 0.2);
      // Snare body tone
      const snTone = ctx.createOscillator();
      snTone.type = 'triangle'; snTone.frequency.value = 180;
      const stEnv = ctx.createGain();
      stEnv.gain.setValueAtTime(0.0001, time);
      stEnv.gain.exponentialRampToValueAtTime(0.12 * mv, time + 0.002);
      stEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
      snTone.connect(stEnv); stEnv.connect(ctx.destination);
      snTone.start(time); snTone.stop(time + 0.1);
    }
  }
  setBpm(b) { this.bpm = Math.max(40, Math.min(280, b)); }
  setMode(m) { this.mode = m; this.tickIdx = 0; }

  // Time of the next bar's downbeat (beat 1). Used to sync the player.
  nextDownbeatTime() {
    if (!this.playing) return null;
    if (this.mode === 'drums') {
      // 8 ticks per bar (eighth notes); tickIdx 0 = beat 1
      const eighthDur = (60 / this.bpm) / 2;
      const ticksUntilOne = (8 - this.tickIdx) % 8;
      return this.nextTickTime + ticksUntilOne * eighthDur;
    }
    if (this.mode === 'click' || this.mode === 'twofour') {
      // 4 ticks per bar; tickIdx 0 = beat 1
      const beatDur = 60 / this.bpm;
      const ticksUntilOne = (4 - this.tickIdx) % 4;
      return this.nextTickTime + ticksUntilOne * beatDur;
    } else {
      // ride: positions [0,3,5,6,9,11] of 12 triplets. tickIdx 0 = beat 1.
      if (this.tickIdx === 0) return this.nextTickTime;
      const positions = [0, 3, 5, 6, 9, 11];
      const tripletDur = 60 / (this.bpm * 3);
      const tripletsLeft = 12 - positions[this.tickIdx];
      return this.nextTickTime + tripletsLeft * tripletDur;
    }
  }
}

const metronome = new Metronome();
// Beat indicator pulse (landscape standby in metronome mode) — fired in
// sync with the actual scheduled audio tick. Maps the metronome's
// per-mode tick idx to a 0..3 beat position so the 4 dots cycle naturally.
metronome._onUITick = (idx, mode) => {
  if (state.standbyMode !== 'metronome') return;
  const dots = document.querySelectorAll('#ls-beat-indicator .beat-dot');
  if (!dots.length) return;
  // dots.length === metroBeatsPerBar (regenerated in renderLandscapeStandby).
  // click mode reshapes its tickIdx to match beatsPerBar so idx % N is exact.
  // Other modes keep their native cycles; we map them to the N-dot strip.
  const N = dots.length;
  let beat;
  if (mode === 'drums') beat = Math.floor(idx / 2) % N;       // 8th notes → quarters
  else if (mode === 'ride') beat = Math.floor(idx / 1.5) % N; // 6 ride hits/bar → ~N quarters
  else beat = idx % N;                                         // click / twofour
  dots.forEach((d, i) => d.classList.toggle('on', i === beat));
};

function updateBlinkRate() {
  const beat = 60 / metronome.bpm;
  document.documentElement.style.setProperty('--blink-duration', (beat * 2) + 's');
}

function setBpm(v) {
  v = Math.max(40, Math.min(280, Math.round(v)));
  metronome.setBpm(v);
  bpmVal.textContent = v;
  const lsBpm = document.getElementById('ls-bpm-val');
  if (lsBpm) lsBpm.textContent = v;
  updateBlinkRate();
}

// Drag up/down to change BPM
(function() {
  let dragY = null, dragBpm = null;
  function onMove(e) {
    if (dragY === null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = Math.round((dragY - y) / 3);
    setBpm(dragBpm + delta);
  }
  function onEnd() {
    dragY = null;
    bpmCompact.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  }
  bpmCompact.addEventListener('mousedown', e => {
    if (e.target.tagName === 'INPUT') return;
    dragY = e.clientY; dragBpm = metronome.bpm;
    bpmCompact.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  });
  bpmCompact.addEventListener('touchstart', e => {
    if (e.target.tagName === 'INPUT') return;
    dragY = e.touches[0].clientY; dragBpm = metronome.bpm;
    bpmCompact.classList.add('dragging');
    document.addEventListener('touchmove', onMove, {passive: true});
    document.addEventListener('touchend', onEnd);
  }, {passive: true});
})();

// Click to type BPM
bpmCompact.addEventListener('dblclick', () => {
  const cur = metronome.bpm;
  bpmVal.innerHTML = `<input class="bpm-edit" type="number" value="${cur}" min="40" max="280">`;
  const inp = bpmVal.querySelector('input');
  inp.focus(); inp.select();
  function commit() {
    const v = parseInt(inp.value);
    if (!isNaN(v)) setBpm(v); else bpmVal.textContent = cur;
    bpmVal.textContent = metronome.bpm;
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = cur; inp.blur(); } });
});

updateBlinkRate();

}

  if (currentRhythmMode === 'off') {
    rhythmBtn.classList.remove('active');
  } else {
    rhythmBtn.classList.add('active');
  }
}

function applyRhythmMode(mode) {
  currentRhythmMode = mode;
  if (mode === 'off') {
    if (metronome.playing) metronome.stop();
  } else {
    metronome.setMode(mode);
    // Only swap the sound on the fly if it's ALREADY playing. Don't auto-
    // start from the picker — the user can hit Play when they're ready.
    // (player.start() will turn the metronome on if currentRhythmMode !== 'off')
  }
  updateRhythmBtn();
}

  // RHYTHM_ICONS SVG drawings used in the panel cell.
  rhythmMenu.innerHTML = RHYTHM_OPTIONS.map(o => `

      <span class="menu-ico">${RHYTHM_ICONS[o.value] || ''}</span><span>${o.label}</span><span class="check">✓</span>

  rhythmMenu.querySelectorAll('[data-rhythm]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      applyRhythmMode(item.dataset.rhythm);
      rhythmMenu.hidden = true;
    });
  });
}

// Weighted-random pick from a {family: weight} map. Sums weights and
// rolls a number in [0, total), then walks the keys until reached.
function _weightedPickFamily(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  if (total <= 0) return 'drop2';
  let r = Math.random() * total;
  for (const k in weights) {
    r -= weights[k];
    if (r <= 0) return k;
  }
  return Object.keys(weights)[0];
}

/* ─── AI Player — travels through real progressions with sections + repeats ─── */

class Player {
  constructor() {
    this.playing = false;
    this.paused  = false;
    this.song = null;
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = 0;
    this.nextBarTime = 0;
    this.timer = null;
    this.previousShape = null;
    this.voicingType = 'drop2';
    this.bassPattern = 'two-feel';
    this.bassOscillators = [];
    this.totalBars = 0;
    this._cachedPage = null;
    // Multi-chord bars: which slot WITHIN the current bar is sounding right
    // now. Updated by _triggerChord's per-slot setTimeouts so the display
    // (now-playing card, landscape dashboard, map highlight) can follow each
    // slot as the bar progresses. Stays at 0 for single-chord bars.
    this.currentBarSlot = 0;
  }

  // Slot-aware versions of _currentChordId / _nextChordId for the DISPLAY
  // side. The trigger path keeps using _currentChordId (which is bar-level)
  // so the audio scheduler stays correct; only the visible chord cards and
  // dashboard update per slot. For single-chord bars these fall through to
  // the bar-level lookups and behavior is unchanged.
  _currentDisplayChordId() {
    this._ensurePagePlan();
    const barInPage = this.totalBars % 4;
    const planned = this._cachedPage?.[barInPage];
    if (!planned || !planned.slots || planned.slots.length < 2) return this._currentChordId();
    // Slot-aware regardless of whether chord IDs match across slots — the
    // user can intentionally place the same chord in multiple slots and
    // each strike should still highlight the right one.
    const slotIdx = Math.min(planned.slots.length - 1, this.currentBarSlot || 0);
    const slot = planned.slots[slotIdx];
    return (slot && slot.chord) || planned.chord;
  }
  _nextDisplayChordId() {
    this._ensurePagePlan();
    const barInPage = this.totalBars % 4;
    const planned = this._cachedPage?.[barInPage];
    if (!planned || !planned.slots || planned.slots.length < 2) return this._nextChordId();
    const slotIdx = Math.min(planned.slots.length - 1, this.currentBarSlot || 0);
    // Mid-bar: next visible chord is the next non-muted slot in this bar.
    for (let s = slotIdx + 1; s < planned.slots.length; s++) {
      const sl = planned.slots[s];
      if (sl && sl.chord) return sl.chord;
    }
    // Last slot — fall through to the bar-level next chord.
    return this._nextChordId();
  }

  _pickBassPattern() {
    const r = Math.random();
    if (r < 0.28) return 'whole';       // root on beat 1 only — sparse, ballad
    if (r < 0.60) return 'two-feel';    // root on beats 1 and 3 — solid
    return 'fifth';                     // root on 1, fifth on 3 — boom-chuck
  }

  _pickVoicingType(opts) {
    // Progression-aware weights: each progression has its own family
    // preference (bossa → drop-3, Bach → triads, etc.). Fall back to a
    // sensible default mix if the progression isn't tagged.
    const progName = opts && opts.progName;
    const baseWeights = (progName && PROGRESSION_VOICING[progName])
      || { drop2: 62, drop3: 16, shell: 14, triad: 8, sus: 0 };
    // Clone so we don't mutate the master map when we apply continuity
    // bonuses below.
    const weights = Object.assign({}, baseWeights);
    // Coherence bias: subsequent sections nudge toward the previous
    // section's family for continuity. Same-identity sections (A→A)
    // get a strong bonus; different identities (A→B, bridge) get a
    // gentler one so the bridge can still contrast meaningfully.
    const prev = opts && opts.prevType;
    if (prev) {
      const sameIdentity = !!(opts && opts.sameIdentity);
      const bonus       = sameIdentity ? 80 : 25;
      const sisterBonus = sameIdentity ? 20 : 10;
      weights[prev] = (weights[prev] || 0) + bonus;
      const sister = SISTER_FAMILY[prev];
      if (sister) weights[sister] = (weights[sister] || 0) + sisterBonus;
    }

    // for non-allowed types so the weighted pick stays inside the filter.
    // Continuity bonus on `prev` may have lifted a now-disallowed type;
    // dropping it here is the right thing. If the entire weight table
    // empties out (e.g. progression weights and filter don't intersect),
    // fall back to a flat distribution over the allowed types.
    if (!voicingPrefIsAll()) {
      for (const k of Object.keys(weights)) {

  _pickShapeFiltered(quality, root, prevType, prevShape, opts = {}) {

    const first = this._pickVoicingType(opts);
    const order = [first, ...allowed.filter(t => t !== first)];
    for (const t of order) {
      const sh = this._pickShape(quality, root, t, prevShape, opts);

  // Find the candidate shape of the chosen type that voice-leads best and stays anchored
  _pickShape(quality, root, type, prevShape, opts = {}) {
    const cands = [];
    // Per-progression extension scaling. Default 1.0 (baseline extBias 1.5).
    // PROGRESSION_VOICING.extensions can dial it: lower values discourage
    // 9-voicings (Bach, pop, folk → barely ever), higher values encourage
    // them (modal jazz, bossa → more freely). Clamped at 0.05 so even
    // 'never' leaves a microscopic door open if voice-leading is overwhelmingly
    // in favor — preserves the "don't shut out musical surprises" instinct.
    const _progName = opts.progName;
    const _extWeight = (_progName && PROGRESSION_VOICING[_progName] && PROGRESSION_VOICING[_progName].extensions);
    const _extScale  = (typeof _extWeight === 'number') ? Math.max(0.05, _extWeight) : 1.0;

      // 'maj9' — typically arrived at via a step's qualityOverride), route
      // directly to the rootless 4-note builder for that flavor so the
      // candidates ARE 9-voicings (not plain dom7 fallbacks). This is what
      // makes a progression that says 'this V is qualityOverride:9' actually
      // get a 9-voicing instead of falling through to plain dom7.
      const explicit9Builder = quality === '9'    ? dropTwoNinthVoicing
                             : quality === 'm9'   ? dropTwoMinorNinthVoicing
                             : quality === 'maj9' ? dropTwoMajorNinthVoicing
                             : null;
      const baseBuilder = explicit9Builder
        ? (rt, ss, inv) => explicit9Builder(rt, ss, inv)
        : (rt, ss, inv) => dropTwoVoicing(quality, rt, ss, inv);
      for (let ss = 0; ss < STRING_SETS.length; ss++) {

      // of an additional 9-voicing alongside the canonical ones. Tagged with

      // leading clearly prefers it. The name upgrade lives in
      // chordNameForVoicing's UPGRADE_RULES_BY_QUALITY, so a picked 9-shape
      // displays as "G9" / "Dm9" / "Cmaj9" automatically. Skipped when the
      // quality is already an explicit 5-note 9 — those qualities are
      // forced into the rootless builder above and don't need additional
      // candidates of the same kind.
      const ninthBuilder = quality === '7'    ? dropTwoNinthVoicing
                         : quality === 'm7'   ? dropTwoMinorNinthVoicing
                         : quality === 'maj7' ? dropTwoMajorNinthVoicing
                         : null;
      if (ninthBuilder) {

            Object.defineProperty(sh, '__ext9', { value: true });

          }

      for (let ss = 0; ss < DROP3_STRING_SETS.length; ss++) {

          if (sh) cands.push(sh);
        }

      // No rotations: shell inversions sit awkwardly on guitar.
      ['A','B'].forEach(t => { const sh = shellVoicing(quality, root, t); if (sh) cands.push(sh); });
    } else if (type === 'triad') {
      // 3 string sets × 3 inversions = up to 9 triad candidates per chord.
      // Was previously root-position only (3 candidates) — opens up the
      // tighter 1st/2nd-inversion shapes that guitarists actually use
      // (Beatles, Pat Metheny, gospel sus/triads). The picker chooses
      // smoothest from the larger pool.

          const sh = triadVoicing(quality, root, t, inv);

      ['A','B'].forEach(t => { const sh = guideToneVoicing(quality, root, t); if (sh) cands.push(sh); });

        tagAndPush(powerVoicing(quality, root, t),            'power');

    // (excessive span, open mixed with high frets, etc.). Piano
    // mode keeps everything since frets are irrelevant.

      // don't return null on an obscure chord.
    }

    // Open cowboy shapes get their own sweet spot at fret 1-2 (they

    // land on an open chord instead of being yanked to fret 6.
    if (!prevShape) {

      for (const sh of cands) {
        const af = avgFret(sh);
        const target = sh.__variant === 'open' ? 1.5 : 6.5;
        let cost = Math.pow(Math.abs(af - target), 1.7);
        if (sh.__variant === 'open') {
          cost += (strumW >= 30) ? -8 : (strumW >= 15 ? -2 : 8);
        } else if (sh.__variant === 'power') {
          cost += (progName && HEAVY_ROCK_PROGS.has(progName)) ? -6
                 : (strumW < 15 ? 8 : 0);
        }
        // First chord of a song has no voice-leading context to make a 9
        // preferable, so just lean toward root voicings — the 9 can show
        // up on the second chord onward when there's something to resolve
        // smoothly from. _extBiasBase already incorporates per-progression
        // scaling so Bach starts cleaner than Jazz.
        if (sh.__ext9) cost += _extBiasBase;
        if (!best || cost < best.cost) best = {shape: sh, cost};
      }
      return best.shape;
    }

    // With previous: hard-filter candidates that drift too far from previous region.
    // Then score by voice-leading smoothness + sweet-spot pull.
    const prevAvg = avgFret(prevShape);
    const REGION_LIMIT = 4.5; // max avg-fret drift between consecutive chords
    // Open cowboy shapes are exempt from the region filter and the
    // comfort-zone floor — they LIVE at fret 0-3 by definition. Without
    // this exemption the region filter would kill every open candidate
    // whenever the previous chord was a mid-neck barre, and the variant
    // bias would never get a chance to favor them.
    const isExempt = sh => sh.__variant === 'open';
    let filtered = cands.filter(sh => isExempt(sh) || Math.abs(avgFret(sh) - prevAvg) <= REGION_LIMIT);
    filtered = filtered.filter(sh => {
      if (isExempt(sh)) return true;
      const af = avgFret(sh);
      return af >= 1.5 && af <= 12;
    });
    if (!filtered.length) filtered = cands; // emergency fallback

    let best = null;
    const prevStrings = prevShape.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
    // ── Goodrick rule prep ──
    // Compute the MIDI pitches of prev's top voice + its set of
    // (string,fret) pairs, so each candidate can be quickly tested
    // for: common-tone, stepwise-top, or register-continuity.
    const prevTopMidi = (() => {
      let top = -Infinity;
      for (let s = 0; s < 6; s++) {
        if (prevShape[s] >= 0) {
          const m = STRING_OPEN_MIDI[s] + prevShape[s];
          if (m > top) top = m;
        }
      }
      return top;
    })();
    const prevPairs = new Set();
    for (let s = 0; s < 6; s++) {
      if (prevShape[s] >= 0) prevPairs.add(`${s}.${prevShape[s]}`);
    }
    for (const sh of filtered) {
      // Per-string voice movement on overlapping strings
      let moveSum = 0, overlapCount = 0;
      for (let s = 0; s < 6; s++) {
        if (prevShape[s] >= 0 && sh[s] >= 0) {
          moveSum += Math.abs(sh[s] - prevShape[s]);
          overlapCount++;
        }
      }
      const af = avgFret(sh);
      const regionShift = Math.abs(af - prevAvg);
      const candStrings = sh.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
      const stringSetPenalty = (prevStrings === candStrings) ? 0 : 4;
      // Strong sweet-spot anchor (quadratic outside frets 4-9)
      const reg = Math.abs(af - 6.5);
      const regSpot = reg <= 2.5 ? 0 : Math.pow(reg - 2.5, 1.9);
      // Recovery bias: if previous was high or low, prefer candidates that come back toward center
      let recoveryBias = 0;
      if (prevAvg > 9.5 && af < prevAvg - 0.5) recoveryBias = -2;
      if (prevAvg < 4 && af > prevAvg + 0.5) recoveryBias = -2;
      // ── Goodrick penalty ──
      // A switch must preserve at least ONE of:
      //   (a) common tone — a shared (string, fret) pair
      //   (b) stepwise top voice — top note moves by ≤ M3 (4 semitones)
      //   (c) register continuity — avg fret shift ≤ 2.0
      // Breaking all three sounds like a jump-cut. Soft penalty so it's
      // only chosen if no better option exists.
      let hasCommon = false;
      for (let s = 0; s < 6; s++) {
        if (sh[s] >= 0 && prevPairs.has(`${s}.${sh[s]}`)) { hasCommon = true; break; }
      }
      let candTopMidi = -Infinity;
      for (let s = 0; s < 6; s++) {
        if (sh[s] >= 0) {
          const m = STRING_OPEN_MIDI[s] + sh[s];
          if (m > candTopMidi) candTopMidi = m;
        }
      }
      const topMove = (prevTopMidi !== -Infinity && candTopMidi !== -Infinity)
        ? Math.abs(candTopMidi - prevTopMidi) : 0;
      const topStep = topMove <= 4;
      const registerCont = regionShift <= 2.0;
      const goodrickPenalty = (hasCommon || topStep || registerCont) ? 0 : 9;
      // ── Top-voice (soprano) penalty ──
      // The highest note is the line the ear actually tracks as the
      // melody. Picker used to only consider it as one of three
      // Goodrick conditions (boolean ≤ M3) — meaning two candidates
      // that both passed could be ranked purely on average movement,
      // ignoring whether the melody jumped an octave vs. stepped a
      // whole tone. This explicit penalty rewards holding/stepping
      // the top voice. Squared (≈^1.4) so leaps hurt disproportionately
      // more than steps, and zero when the top note is held (common tone).
      const topPenalty = Math.pow(topMove, 1.4) * 1.2;
      // Extra quadratic penalty for "register jumps" — even when
      // voice-leading is decent, jumping more than 4 frets to a wildly
      // different register sounds disjointed unless there's a clear
      // reason (different family, new section). Soft so it can still
      // happen when no closer voicing exists.
      const jumpPenalty = regionShift > 4 ? Math.pow(regionShift - 4, 1.8) : 0;
      // ── Strum variant bias (per-genre nudge) ──
      // Strum family has four sub-variants:
      //   seventh — full barre with the 7th (jazz rhythm / Freddie Green)
      //   triad   — barre with 7th dropped (pop/rock/folk)
      //   open    — cowboy chords, first position (folk/pop in cowboy keys)
      //   power   — R-5-R, no third (rock/metal)
      // Biases vary in magnitude:
      //   • triad ↔ seventh: small (±2). Both are legit in most contexts;
      //     just nudges by genre. Voice-leading still dominates.
      //   • open: large (±10). Open shapes sit at fret 0-3 which would
      //     otherwise be killed by the sweet-spot pull. Strong favor when
      //     the progression is folk/pop AND the geometry allows, strong
      //     penalty in jazz so it doesn't sneak in just because the key
      //     happens to be C.
      //   • power: large (±10) too. Strong favor in heavy-rock progs;
      //     strong penalty in jazz (loses harmonic identity).
      let variantBias = 0;
      if (sh.__variant) {
        const progName = opts.progName;
        const strumW = (progName && PROGRESSION_VOICING[progName] && PROGRESSION_VOICING[progName].strum) || 0;
        const isHeavyRock = progName && HEAVY_ROCK_PROGS.has(progName);
        const v = sh.__variant;
        if (v === 'open') {
          if (strumW >= 30)      variantBias = -10;   // pop/rock/folk in cowboy key: love it
          else if (strumW >= 15) variantBias = -3;    // modal: allow
          else                   variantBias =  10;   // jazz: avoid even if key fits
        } else if (v === 'power') {
          if (isHeavyRock)       variantBias = -8;    // rock context: love it
          else if (strumW >= 30) variantBias = -1;    // generic pop/rock: mild allow
          else if (strumW >= 15) variantBias =  3;    // modal: discouraged
          else                   variantBias =  10;   // jazz: avoid
        } else if (strumW >= 30) {
          // Pop / rock / folk — bias toward triad (no 7th)
          variantBias = v === 'triad' ? -2 : 1.5;
        } else if (strumW >= 15) {
          // Modal / crossover — balanced; tiny edge to 7th
          variantBias = v === 'seventh' ? -0.5 : 0.5;
        } else {
          // Jazz / no strum weight (user pinned 'strum' pref) → favor 7th
          variantBias = v === 'seventh' ? -2 : 1.5;
        }
      }
      // Extension bias — same role as variantBias but for "this candidate
      // adds the 9th." Baseline 1.5 scaled per-progression via
      // PROGRESSION_VOICING.extensions: lower extensions weight → higher
      // extBias → fewer 9s (Bach, pop). Higher → more (modal, bossa).
      const extBias = sh.__ext9 ? _extBiasBase : 0;
      // Weight: voice-leading * 1, region shift * 2.4, sweet-spot * 1, string set * 4, recovery * 1, goodrick * 9, jump * 1, top-voice ≈1.2, variant ≈±2, ext9 = 1.5 / extensions
      const score = (overlapCount ? moveSum : 5) + regionShift * 2.4 + stringSetPenalty + regSpot + recoveryBias + goodrickPenalty + jumpPenalty + topPenalty + variantBias + extBias;
      if (!best || score < best.score) best = {shape: sh, score};
    }
    return best ? best.shape : filtered[0];
  }

  _currentSection() { return this.song?.[this.songIdx]; }
  _currentProgression() { return this._currentSection()?.progression; }
  _currentStep() { return this._currentProgression()?.steps[this.currentStepIdx]; }
  _currentChordId() { return this._currentStep()?.chord; }

  // Look ahead to figure out the next chord that'll play (handles repeats + section transitions)
  _nextChordId() {
    const prog = this._currentProgression();
    if (!prog) return null;
    const nextStepIdx = this.currentStepIdx + 1;
    if (nextStepIdx < prog.steps.length) {
      return prog.steps[nextStepIdx].chord;
    }
    // At end of progression — will we repeat or move on?
    const section = this._currentSection();
    if (this.sectionIter + 1 < section.repeats) {
      // Repeating same progression
      return prog.steps[0].chord;
    }
    // Moving to next section
    const nextSectionIdx = (this.songIdx + 1) % this.song.length;
    return this.song[nextSectionIdx]?.progression.steps[0].chord;
  }

  _pickProgression(avoidName = null, role = null) {
    const list = PROGRESSIONS[state.tonality] || [];
    if (!list.length) return null;
    // Only use progressions whose chords are all allowed by the current scope.
    let inScope = list.filter(p => p.steps.every(step => isChordInScope(step.chord)));
    if (!inScope.length) inScope = list; // safety: never starve the player
    // Role filter: keep progressions tagged for this song role (A/B/C).
    // Unlisted progressions default to ['A'] so they never disappear.
    // Fall back to the unfiltered pool if a role has nothing tagged in
    // the current tonality (e.g. minor + role C with no minor 'C' tags).
    let roleScoped = inScope;
    if (role) {
      roleScoped = inScope.filter(p => {
        const roles = PROGRESSION_ROLES[p.name] || ['A'];
        return roles.includes(role);
      });
      if (!roleScoped.length) roleScoped = inScope;
    }
    const filtered = avoidName ? roleScoped.filter(p => p.name !== avoidName) : roleScoped;
    const finalList = filtered.length ? filtered : roleScoped;
    return finalList[Math.floor(Math.random() * finalList.length)];
  }

  _repeatsFor(prog) {
    // Bias toward powers of 2 (4s and 2s) — that's how most music phrases
    const r = Math.random();
    if (prog.len <= 4) {
      // 4-bar progressions
      if (r < 0.50) return 4;  // 16 bars total (most common)
      if (r < 0.85) return 2;  // 8 bars total
      if (r < 0.95) return 3;  // 12 bars — occasional odd phrase
      return 1;                // very rare single pass
    }
    if (prog.len <= 8) {
      // 8-bar progressions
      if (r < 0.65) return 2;  // 16 bars total (standard chorus half)
      if (r < 0.90) return 1;  // 8 bars (single statement)
      return 4;                // 32 bars (extended)
    }
    // 16-bar+ progressions
    return r < 0.85 ? 1 : 2;
  }

  _pickModulation(homePc, homeTonality) {
    // Returns {keyPc, tonality, name} for a musically motivated key change.
    const opts = [
      {keyPc: (homePc + 5) % 12, tonality: homeTonality, name: 'to subdominant'},
      {keyPc: (homePc + 7) % 12, tonality: homeTonality, name: 'to dominant'},
    ];
    if (homeTonality === 'major') {
      opts.push({keyPc: (homePc + 9) % 12, tonality: 'minor', name: 'to relative minor'});
      opts.push({keyPc: homePc, tonality: 'minor', name: 'to parallel minor'});
    } else {
      opts.push({keyPc: (homePc + 3) % 12, tonality: 'major', name: 'to relative major'});
      opts.push({keyPc: homePc, tonality: 'major', name: 'to parallel major'});
    }
    return opts[Math.floor(Math.random() * opts.length)];
  }

  _generateSong() {
    // Captured AI song with user edits → bypass the standard composed-seed
    // path and rebuild the same structure with the edited cells.
    if (state._capturedSong) return this._generateFromCaptured();
    // Snapshot the home key so we can restore + measure modulations from it
    const homePc = state.keyPc;
    const homeTonality = state.tonality;
    this._homeKey = { keyPc: homePc, tonality: homeTonality };

    // If user typed a custom progression, treat the FIRST 8 chords as section A.
    // If they kept typing past 8, chords 9–16 become section B.
    //   • Loop ON                       → loop just A (single section)
    //   • Loop OFF, only A typed (≤8)   → A + AI-picked B in AABA
    //   • Loop OFF, A & B typed (9–16)  → both sections come from typed input
    if (state.composedProgression && state.composedProgression.length) {
      const buildSteps = (cells, label) => {
        // Merge consecutive same-chord cells (ties) into one step with bars > 1.
        // Silent rest cells become their own steps with _silent flag so the
        // trigger knows to skip the audio strike for that bar.
        const steps = [];
        for (const c of cells) {
          const prev = steps.length ? steps[steps.length - 1] : null;
          if (c._silent) {
            // Merge consecutive silents into a single multi-bar rest.
            if (prev && prev._silent) prev.bars++;
            else steps.push({ chord: null, bars: 1, roman: '', _silent: true });
            continue;
          }
          if (prev && !prev._silent && prev.chord === c.chord && c._tie) {
            prev.bars++;
          } else {
            steps.push({
              chord: c.chord,
              bars: 1,
              roman: currentMap().chordDefs[c.chord]?.roman || c.chord,
              composedShape: c.shape,
              subdivisions: c.subdivisions || 1,
              subdivMute: c.subdivMute ? [...c.subdivMute] : [],
              // Multi-chord bars carry per-slot shape/chord/voicing so the
              // scheduler can fire each slot with its OWN voicing. Cloned
              // (not aliased) so later edits to the cell don't mutate the
              // captured strip step.
              slots: c.slots ? c.slots.map(sl => sl ? {...sl} : null) : null,
            });
          }
        }
        return {
          label,
          progression: { name: `◇ Composed ${label}`, len: steps.length, steps },
          repeats: loopMode !== 'off' ? 1 : 2,
          voicingType: defaultAllowedType('drop2'),
          bassPattern: this._pickBassPattern(),
        };
      };
      const aCells = state.composedProgression.slice(0, 8);
      const bCells = state.composedProgression.slice(8, 16);
      const A_sec = buildSteps(aCells, 'A');

      if (loopMode === 'bars-4' || loopMode === 'section') {
        // Anchored loop: build a single A section out of the user's
        // composition. The scheduler will snap back to the anchor
        // every N bars regardless of section structure.
        return [A_sec];
      }

      // Resolve song structure (default AABA). The literal sentinel
      // 'RANDOM' rolls a fresh common structure on every song gen.
      const structureStr = _resolveSongStructure(state.songStructure);
      const letters = structureStr.split('');
      const uniqueLetters = [...new Set(letters)];
      // Section A is the composed one; B/C/D/E come from the user's
      // composed strip if they typed cells past chord 8/16/24/32.
      // Anything still missing gets AI-picked below.
      const progByLabel = { A: A_sec };
      if (bCells.length > 0) {
        progByLabel.B = buildSteps(bCells, 'B');
      }
      const extraRanges = [['C', 16, 24], ['D', 24, 32], ['E', 32, 40]];
      for (const [lab, start, end] of extraRanges) {
        const cells = state.composedProgression.slice(start, end);
        if (cells.length > 0) progByLabel[lab] = buildSteps(cells, lab);
      }
      for (const lab of uniqueLetters) {
        if (progByLabel[lab]) continue;
        const usedNames = Object.values(progByLabel).map(s => s.progression?.name).filter(Boolean);
        // Role for the picker: A → 'A', B → 'B', everything else (C/D) → 'C'
        // so further-from-home sections pull from the bridge/interlude pool.
        const role = lab === 'A' ? 'A' : (lab === 'B' ? 'B' : 'C');
        const picked = this._pickProgression(usedNames[0], role);
        progByLabel[lab] = {
          label: lab,
          progression: picked,
          repeats: this._repeatsFor(picked),
          voicingType: this._pickVoicingType({progName: picked.name}),
          bassPattern: this._pickBassPattern(),
        };
      }
      return letters.map(lab => ({ ...progByLabel[lab] }));
    }

    // ── Non-composed (AI random) path — same structure-aware build ──
    const structureStr = _resolveSongStructure(state.songStructure);

    // Self-contained forms (BLUES, JAZZ_BLUES) — single section, no
    // AABA letters. Pick a matching progression from the dedicated role
    // pool and loop it; structure picker bypasses the role-A path so
    // these never get poured into a regular AABA's A section.
    const structDef = SONG_STRUCTURES.find(s => s.id === structureStr);
    if (structDef && structDef.formType) {
      const list = PROGRESSIONS[state.tonality] || [];
      const pool = list.filter(p => {
        const roles = PROGRESSION_ROLES[p.name] || [];
        return roles.includes(structDef.formType);
      });
      // If the current tonality has no matching blues (e.g. JAZZ_BLUES
      // while in minor mode), fall back to any 'blues' role in scope.
      const fallback = !pool.length
        ? list.filter(p => (PROGRESSION_ROLES[p.name] || []).includes('blues'))
        : pool;
      const final = fallback.length ? fallback : list;
      const prog = final[Math.floor(Math.random() * final.length)];
