    // ridiculously tall+narrow because the strip stayed at 8-mode height.
    if (seq.length <= 8) MAX_CELLS = 8;
    else MAX_CELLS = Math.max(16, seq.length);
  }
  const cells = seq.slice(0, MAX_CELLS);
  while (cells.length < MAX_CELLS) cells.push(null);
  // Mobile: render interleaved (2 chord cells, then 2 tab cells, repeating) into
  // the main strip only. Tabs container is hidden so the whole grid scrolls as one.
  el.classList.toggle('compose-interleaved', isMobile);
  // Compact tier — >8 chords on desktop. Strip height shrinks so the
  // narrower cells maintain a reasonable aspect. Same class covers both
  // 16-cells-no-scroll and the >16-chord hscroll case.
  const isCompactTier = !isMobile && seq.length > 8;
  el.classList.toggle('compose-tier-compact', isCompactTier);
  tabsEl.classList.toggle('compose-tier-compact', isCompactTier);
  // Desktop: turn on horizontal scroll once we're past 16 cells. The CSS
  // applies overflow-x to the SHARED parent (.rb-stack) so both rows scroll
  // as a unit — they cannot desync. Each strip flexes to its natural
  // content width inside the stack.
  const wantHscroll = !isMobile && seq.length > 16;
  el.classList.toggle('compose-hscroll', wantHscroll);
  tabsEl.classList.toggle('compose-hscroll', wantHscroll);
  const stack = el.closest('.rb-stack');
  if (stack) stack.classList.toggle('compose-hscroll', wantHscroll);
  tabsEl.hidden = isMobile ? true : false;

  // Section badges — render a small A/B/C/... chip at the first cell of
  // each section. Two sources:
  //   1) Captured AI song (cap.boundaries) → multi-section stacked strip.
  //   2) Hand-composed strip past cell 8 → legacy A/B at the dividerAt.
  const cap = state._capturedSong;
  const badgeByIdx = {};
  if (cap && cap.boundaries && cap.boundaries.length && cap.uniqueLabels.length > 1) {
    for (const b of cap.boundaries) badgeByIdx[b.start] = b.label;
  } else if (!state._composeIsSingleSection && seq.length > dividerAt) {
    // Hand-composed: sections of `dividerAt` chords each (default 8).
    // Tag A/B/C/D/E at 0, 8, 16, 24, 32 as the user fills past each.
    // CSS classes rb-section-{a..e} exist for these five.
    const labels = ['A','B','C','D','E'];
    for (let s = 0; s < labels.length; s++) {
      const start = s * dividerAt;
      if (start === 0 || seq.length > start) badgeByIdx[start] = labels[s];
    }
  }
  const sectionBadgeFor = (i) => {
    const lab = badgeByIdx[i];
    if (!lab) return '';
    const cls = `rb-section-tag rb-section-${lab.toLowerCase()}`;
    return `<span class="${cls}">${lab}</span>`;
  };
  const renderCell = (cell, i, isTab) => {
    const cls = ['rb-cell'];
    if (isTab) cls[0] = 'rb-tab-cell';
    const focIdx = state._composeFocusedIdx ?? (seq.length - 1);
    if (i === focIdx) cls.push('current');
    if (i === state.composedSelectedIdx) cls.push('compose-selected');
    // Section divider: at any captured boundary or at the legacy dividerAt
    // (cell 8) for hand-composed strips with content past it.
    if (badgeByIdx[i] && i > 0) cls.push('section-divider');
    else if (i === dividerAt && !state._composeIsSingleSection && !cap) cls.push('section-divider');
    // Section badge sits on the tab/diagram row — both guitar AND piano
    // compose modes now hide the separate chord-name row (the chord name
    // lives inside the SVG via renderMini's / renderChordStaff's
    // chordName param), so the tab row is the only one visible. Placing
    // the badge on the hidden .rb-cell row meant the A/B/C/D/E chips
    // disappeared on desktop after the unified-row layout work.
    const sectionTag = isTab ? sectionBadgeFor(i) : '';
    // data-compose-idx lets the delegated click handler (below) find which
    // composed-progression step was tapped so it can ring + focus that chord.
    const idxAttr = (cell && i < seq.length) ? ` data-compose-idx="${i}"` : '';
    // Desktop only: make filled cells draggable so the user can reorder
    // (swap) the progression. Mobile is gated by isMobile to avoid
    // conflicts with the touch handlers + because native HTML5 DnD
    // doesn't work well on touch.
    const dragAttr = (!isMobile && cell && i < seq.length) ? ' draggable="true"' : '';
    // Empty slot — clickable so the user can extend the previous chord
    if (!cell) {
      const emptyAttr = (i >= seq.length && seq.length > 0 && seq.length < _composeMax()) ? ` data-compose-empty="${i}"` : '';
      return `<div class="${cls.join(' ')}"${emptyAttr}>${sectionTag}</div>`;
    }
    // Silent rest cell — slot exists but plays nothing. Rendered as a
    // small dot/rest marker so the user sees the gap.
    if (cell._silent) {
      const restGlyph = isTab ? '' : '<span class="rb-rest" title="silence">·</span>';
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${sectionTag}${restGlyph}</div>`;
    }
    // Tie cell — shows % continuation symbol (same as AI song view)
    if (cell._tie) {
      if (isTab) {
        const showClef = (i === 0);
        const tSizing = isMobile
          ? {W: 100, H: 128, minimal: true, showClef}
          : {W: 130, H: 148, minimal: false, showClef};
        const contSvg = (state.instrument === 'piano') ? renderContinuationStaff(tSizing) : '';
        return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${sectionTag}${contSvg}</div>`;
      }
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>
        ${sectionTag}
        <div class="rb-continuation">%</div>
        <button class="${(i === state.composedSelectedIdx) ? 'compose-edit-btn active' : 'compose-edit-btn'}" data-edit-idx="${i}" title="lock slot for replacement (L)">${i === state.composedSelectedIdx ? '🔒' : '🔓'}</button>
      </div>`;
    }
    const ch = map.chordDefs[cell.chord];
    if (!ch) return `<div class="${cls.join(' ')}"></div>`;
    const root = chordRoot(ch);
    if (isTab) {
      if (!cell.shape) return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${sectionTag}</div>`;
      // Clef only at the start of each visual row: mobile = 4 per row, desktop = 8 per row
      // Clef only on the very first compose cell — once you're past it, the
      // staff continues unmarked (the eye carries the clef forward).
      const showClef = (i === 0);
      // When the voicing skips the 7th, drop the "7"/"m7"/"maj7" suffix so
      // the name matches what's sounding (Dm7 voiced D-F-A → "Dm").
      const cellChordName = chordNameForVoicing(ch.quality, root, cell.shape, flats)
        || (nameOf(root, flats) + QUALITIES[ch.quality].sfx);
      // Piano mode embeds chord name in the staff SVG (no separate name row).
      // Guitar mode shows the name in the .rb-cell row above the tab — so we
      // SKIP passing chordName to renderMini to avoid a double-display.
      // sectionLabel — when set, renderChordStaff shifts the embedded chord
      // name a few pixels to the right so the .rb-section-tag chip (which
      // sits at the cell's top-left in piano mode) doesn't overlap it.
      const sectionLabel = badgeByIdx[i] || null;
      // firstOfRow: re-state the key sig on each visual row.
      //   Mobile compose: 4-col grid → cells 0, 4, 8, … are first of row.
      //   Desktop compose: single flex row → only cell 0.
      const composeFirstOfRow = isMobile ? (i % 4 === 0) : (i === 0);
      const sizingPiano = isMobile
        ? {W: 100, H: 128, r: 8, minimal: true, showClef, chordName: cellChordName, roman: ch.roman, tag: ch.tag, subdivisions: cell.subdivisions || 1, subdivMute: cell.subdivMute || [], sectionLabel, keyPc: state.keyPc, tonality: state.tonality, firstOfRow: composeFirstOfRow}
        : {W: 130, H: 148, r: 11, bwNotes: true, showClef, chordName: cellChordName, roman: ch.roman, tag: ch.tag, subdivisions: cell.subdivisions || 1, subdivMute: cell.subdivMute || [], sectionLabel, keyPc: state.keyPc, tonality: state.tonality, firstOfRow: composeFirstOfRow};
      // Guitar mode now embeds the chord name + roman + tag inside the
      // SVG the same way the piano staff already does — single row of
      // cells, no separate name row above. Matches the unified-row
      // restructure where the only row is the tab/diagram row.
      const sizingGuitar = isMobile
        ? {W: 100, H: 128, r: 8, minimal: true,
           chordName: cellChordName, roman: ch.roman, tag: ch.tag}
        : {W: 130, H: 148, r: 11, bwNotes: true,
           chordName: cellChordName, roman: ch.roman, tag: ch.tag};
      // Multi-chord detection: cell carries slots[] and at least one slot
      // holds a different chord-ID than slot 0. Same-chord slots just
      // mean "rhythm subdivisions of one chord" and stay on the snapshot
      // diagram. Different chords switch to the horizontal TAB renderer.
      // Multi-chord visualization is triggered by the PRESENCE of slots[],
      // not by chord-ID uniqueness. The user enters multi-chord mode
      // explicitly (via the chip), and from that point on the cell stays
      // in multi-chord view even if they put the SAME chord in multiple
      // slots — e.g. two strikes of I with different inversions. Was a
      // surprise-deletion before: typing the same chord into slot 1
      // collapsed the bar back to single-chord rendering.
      const isMultiChord = cell.slots && cell.slots.length > 1;
      let svg;
      if (isMultiChord && state.instrument !== 'piano') {
        const editingThisCell = (state._multiChordEditCell === i);
        const editingSlot = editingThisCell ? (state._multiChordEditSlotIdx ?? -1) : -1;
        const muteArr = cell.subdivMute || [];
        const columns = cell.slots.map((slot, sIdx) => {
          const muted = !!muteArr[sIdx];
          if (!slot || !slot.chord) return { shape: null, chordName: '', isEditing: sIdx === editingSlot, muted };
          const sCh = map.chordDefs[slot.chord];
          if (!sCh) return { shape: slot.shape, chordName: slot.chord, isEditing: sIdx === editingSlot, muted };
          const sRoot = (state.keyPc + sCh.deg) % 12;
          const cn = chordNameForVoicing(sCh.quality, sRoot, slot.shape, flats)
                  || (nameOf(sRoot, flats) + QUALITIES[sCh.quality].sfx);
          return {
            shape: slot.shape,
            chordName: symbolizeChordName(cn),
            romanLabel: symbolizeChordName(sCh.roman),
            tag: sCh.tag,
            isEditing: sIdx === editingSlot,
            muted,
          };
        });
        // viewBox W has to match the cell's actual aspect ratio — otherwise
        // `meet` centering inside the cell adds vertical bands and the
        // strings end up compressed. On DESKTOP the strip is a flexbox and
        // multi-chord cells grow via `flex-grow: 1 + (N-1)*0.5`, so viewBox
        // W mirrors that multiplier. On MOBILE the strip is a CSS grid
        // (repeat(4, 1fr)) — inline flex-grow has no effect, every cell is
        // 25% of the row regardless of slot count. So baseW stays constant
        // there and the slot columns just pack tighter inside.
        const slotCount2 = cell.slots.length;
        const aspectMult = isMobile ? 1 : (1 + (slotCount2 - 1) * 0.5);
        const baseW = isMobile ? 130 : 165;
        const htabSizing = isMobile
          ? { W: Math.round(baseW * aspectMult), H: 210, minimal: true }
          : { W: Math.round(baseW * aspectMult), H: 250, minimal: false };
        svg = renderHorizontalTab(columns, htabSizing);
      } else {
        if (isMultiChord && state.instrument === 'piano') {
          // Multi-chord piano staff: feed renderChordStaff per-slot data so
          // each rhythmic slot draws its OWN chord's noteheads on the staff.
          // Layout/design stays identical to the single-chord case — only
          // the notes and per-slot chord names change.
          const pianoSlots = cell.slots.map(slot => {
            if (!slot || !slot.chord) return null;
            const sCh = map.chordDefs[slot.chord];
            if (!sCh) return null;
            const sRoot = (state.keyPc + sCh.deg) % 12;
            const cn = chordNameForVoicing(sCh.quality, sRoot, slot.shape, flats)
                    || (nameOf(sRoot, flats) + QUALITIES[sCh.quality].sfx);
            return {
              shape: slot.shape,
              root: sRoot,
              quality: sCh.quality,
              chordName: symbolizeChordName(cn),
              tag: sCh.tag,
            };
          });
          // Only switch on multi-chord rendering when every slot has data —
          // otherwise renderChordStaff falls back to base chord per missing
          // slot which would silently swallow gaps. Better to log and use
          // the snapshot path in that case.
          const allFilled = pianoSlots.every(p => p && p.shape);
          sizingPiano.slots = allFilled ? pianoSlots : null;
          // Tell the staff renderer which slot (if any) is currently being
          // edited so it can highlight just that slot — NOT the whole bar.
          sizingPiano.editingSlotIdx = (state._multiChordEditCell === i)
            ? (state._multiChordEditSlotIdx ?? -1) : -1;
          svg = renderChordStaff(cell.shape, root, ch.quality, flats, sizingPiano);
        } else {
          svg = state.instrument === 'piano'
            ? renderChordStaff(cell.shape, root, ch.quality, flats, sizingPiano)
            : renderMini(cell.shape, root, ch.quality, flats, sizingGuitar);
        }
      }
      // Rhythm subdivisions UI — triangle picker is ALWAYS visible with the
      // current count inside (default 1). Segment bar appears only when N > 1
      // AND the cell is single-chord. Multi-chord cells skip the segment bar
      // since each slot already shows its own chord; per-slot mute will live
      // on the slot itself (next step).
      const n = cell.subdivisions || 1;
      const muteArr = cell.subdivMute || [];
      const triClass = n > 1 ? 'subdiv-triangle has-divs' : 'subdiv-triangle';
      let barHtml = '';
      if (n > 1 && !isMultiChord) {
        let segs = '';
        for (let s = 0; s < n; s++) {
          const m = muteArr[s] ? 'muted' : '';
          segs += `<div class="subdiv-seg ${m}" data-subdiv-cell="${i}" data-subdiv-seg="${s}"></div>`;
        }
        barHtml = `<div class="subdiv-bar">${segs}</div>`;
      }
      // Just a pill badge with the count — clean, no triangle silhouette.
      const triHtml = `<button class="${triClass}" data-subdiv-tri="${i}" title="rhythm subdivisions (click to change)">${n}</button>`;
      // Multi-chord chip — only meaningful as a "+" CTA on single-chord
      // bars. Once the bar already has slots[], the chip becomes
      // redundant clutter (the rhythm-subdivision badge below already
      // shows the slot count, and the path back to single chord lives
      // on the same badge by picking 1). We still show the chip while
      // EDITING (chip-initiated walkthrough) so the user has a visible
      // anchor showing which slot index they're filling next.
      const slots = cell.slots || null;
      const slotCt = slots && slots.length > 1 ? slots.length : 1;
      const isMC = slotCt > 1;
      const isEditing = (state._multiChordEditCell === i);
      let mcHtml = '';
      if (!isMC || isEditing) {
        const mcClass = isEditing ? 'multichord-chip editing'
                                  : 'multichord-chip';
        const mcLabel = isEditing
          ? String((state._multiChordEditSlotIdx ?? 1) + 1)   // "2" while editing slot index 1
          : '+';
        const mcTitle = isEditing
          ? 'editing slot — tap chord button to fill, tap chip to exit'
          : 'add 2nd chord in this bar';
        mcHtml = `<button class="${mcClass}" data-multichord-cell="${i}" title="${mcTitle}">${mcLabel}</button>`;
      }
      // Piano mode: no flex-grow change. The sheet-music staff already
      // distributes N chord-events horizontally within a single cell
      // width without needing extra room. Tab mode keeps a softer
      // proportional ramp so the column spacing stays legible.
      const slotCount = isMultiChord ? cell.slots.length : 1;
      const isPiano = state.instrument === 'piano';
      const flexGrow = (slotCount > 1 && !isPiano) ? (1 + (slotCount - 1) * 0.5) : 1;
      // No overflow:hidden — that was clipping the subdiv-triangle badge
      // that hangs at bottom:-9px below the cell. The extended staff
      // lines are now clipped by a clip-path on the SVG itself (see CSS
      // rule on .rb-tab-cell svg below).
      // Multi-chord cells also drop the bottom padding that used to
      // reserve room for the subdivision bar — that brown strip is gone
      // here (each slot already shows its own chord) so the horizontal
      // TAB can extend down into that previously-wasted space.
      const growStyle = isMultiChord
        ? ` style="${flexGrow > 1 ? `flex-grow: ${flexGrow}; ` : ''}padding-bottom: 0"`
        : (flexGrow > 1 ? ` style="flex-grow: ${flexGrow}"` : '');
      // Lock is now activated via LONG-PRESS on the cell itself (no
      // visible button — it kept stepping on the chip "+" and felt like
      // clutter). When the user is in the locked state (.compose-selected
      // via composedSelectedIdx), a small lock glyph appears as a hint
      // so they can SEE it's locked. Releasing the lock = another
      // long-press OR clicking outside any cell.
      const lockHintHtml = (i === state.composedSelectedIdx)
        ? `<span class="compose-lock-hint" aria-hidden="true">🔒</span>`
        : '';
      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}${growStyle}>${sectionTag}${svg}${triHtml}${barHtml}${mcHtml}${lockHintHtml}</div>`;
    }
    const name = chordNameForVoicing(ch.quality, root, cell.shape, flats)
      || (nameOf(root, flats) + QUALITIES[ch.quality].sfx);
    const selCls = (i === state.composedSelectedIdx) ? 'compose-edit-btn active' : 'compose-edit-btn';
    return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>
      ${sectionTag}
      <div class="rb-roman">${ch.roman}</div>
      <div class="rb-chord">${name}</div>
      <button class="${selCls}" data-edit-idx="${i}" title="lock slot for replacement (L)">${i === state.composedSelectedIdx ? '🔒' : '🔓'}</button>
    </div>`;
  };

  if (isMobile) {
    // Build quad rows: 4 chord cells, then 4 tab cells beneath, repeating
    const parts = [];
    for (let i = 0; i < cells.length; i += 4) {
      for (let k = 0; k < 4; k++) parts.push(renderCell(cells[i + k], i + k, false));
      for (let k = 0; k < 4; k++) parts.push(renderCell(cells[i + k], i + k, true));
    }
    el.innerHTML = parts.join('');
    tabsEl.innerHTML = '';
    // Auto-scroll the strip's INTERNAL scroll so the latest cell is at the
    // top — without bubbling to ancestor scrollables (scrollIntoView would
    // also scroll the page itself, which prevented the user from scrolling
    // back up to see the first row).
    requestAnimationFrame(() => {
      const cur = state.instrument === 'piano'
        ? el.querySelector('.rb-tab-cell.current')
        : el.querySelector('.rb-cell.current');
      if (cur && el.scrollHeight > el.clientHeight) {
        const target = cur.offsetTop - el.offsetTop;
        el.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    });
  } else {
    el.innerHTML = cells.map((c, i) => renderCell(c, i, false)).join('');
    tabsEl.innerHTML = cells.map((c, i) => renderCell(c, i, true)).join('');
  }
}

// Delegated click handler for the compose strip — tapping any composed-
// progression cell rings that chord (with its exact stored voicing) and
// focuses it so the user can audition / cycle inversions from there.
// Attached once on the document so it survives every renderComposeStrip().
// Subdivision popover lifecycle: open near the clicked triangle (above
// preferred, fallback below if no room). Click outside or Esc to close.
function openSubdivPopover(triEl, cellIdx) {
  const pop = document.getElementById('subdiv-popover');
  const cur = state.composedProgression[cellIdx]?.subdivisions || 1;
  pop.dataset.cellIdx = cellIdx;
  // Buttons in natural source order — CSS grid-area positions them in the
  // layout: [1] capped top, [2 4 6 / 3 5 7] in two columns, [8] capped bottom.
  const mkBtn = (n) => `<button data-subdiv-pick="${n}" class="${n === cur ? 'selected' : ''}">${n}</button>`;
  pop.innerHTML = [1,2,3,4,5,6,7,8].map(mkBtn).join('');
  pop.classList.add('open');
  // Position BELOW the badge, centered horizontally. Falls back to above
  // only if the popover would clip the viewport bottom.
  const r = triEl.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  let top  = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = r.top - h - 8;
  left = Math.max(6, Math.min(left, window.innerWidth - w - 6));
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
}
function closeSubdivPopover() {
  const pop = document.getElementById('subdiv-popover');
  if (pop) { pop.classList.remove('open'); pop.dataset.cellIdx = ''; }
}
document.addEventListener('click', (ev) => {
  // Close popover if click landed outside its body AND outside any triangle
  if (ev.target.closest('#subdiv-popover') || ev.target.closest('.subdiv-triangle')) return;
  closeSubdivPopover();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeSubdivPopover();
});

// ─── Drag-and-drop reorder for the compose strip (desktop only) ───
// User can drag a filled cell and drop it on another filled cell to
// SWAP positions (preserving song length). Dropping on a trailing
// empty cell moves the chord to the end of the sequence. Mobile is
// skipped — touch DnD with HTML5 is fragile, and the strip already
// has tap-to-jump / tap-to-replace touch UX.
(function() {
  let dragFromIdx = null;

  // Find the strip cell ancestor (chord or tab row, filled or empty).
  const cellOf = (target) => target && target.closest && target.closest('[data-compose-idx], [data-compose-empty]');

  // When the user touches an INTERIOR control (subdiv badge, segs, edit lock,
  // popover, etc.), suspend the cell's draggable attribute for the duration
  // of that gesture. Otherwise the browser's native HTML5 drag-detection on
  // the ancestor cell pre-empts pointer events, breaking the badge's
  // vertical drag-to-change-count gesture. Restore on the next pointerup.
  const INNER_CTRL_SEL = '.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg, #subdiv-popover';
  let suspendedCell = null;
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest) return;
    if (!e.target.closest(INNER_CTRL_SEL)) return;
    const cell = cellOf(e.target);
    if (cell && cell.getAttribute('draggable') === 'true') {
      cell.setAttribute('draggable', 'false');
      suspendedCell = cell;
    }
  }, true);
  const restoreSuspended = () => {
    if (suspendedCell) {
      suspendedCell.setAttribute('draggable', 'true');
      suspendedCell = null;
    }
  };
  document.addEventListener('pointerup', restoreSuspended, true);
  document.addEventListener('pointercancel', restoreSuspended, true);

  // Clear any lingering drop-target highlight across the whole strip.
  const clearDropTargets = () => {
    document.querySelectorAll('.rb-cell.drop-target, .rb-tab-cell.drop-target').forEach(c => c.classList.remove('drop-target'));
  };

  document.addEventListener('dragstart', (e) => {
    const cell = cellOf(e.target);
    if (!cell || cell.dataset.composeIdx == null) return;
    // Don't initiate drag from inner controls (edit btn, subdiv badge, etc).
    if (e.target.closest('.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg')) {
      e.preventDefault();
      return;
    }
    dragFromIdx = parseInt(cell.dataset.composeIdx, 10);
    try {
      e.dataTransfer.effectAllowed = 'move';
      // Some browsers need data set to actually start the drag.
      e.dataTransfer.setData('text/plain', String(dragFromIdx));
    } catch {}
    // Subtle visual: dim the source so the user sees what's being dragged.
    cell.classList.add('dragging');
    // Also dim the sibling row (tab cell mirroring same idx) so both
    // halves of the same step show the dragging state.
    document.querySelectorAll(`[data-compose-idx="${dragFromIdx}"]`).forEach(c => c.classList.add('dragging'));
  });

  document.addEventListener('dragover', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch {}
    // Update target highlight — only one cell at a time, sibling row too.
    const tIdx = cell.dataset.composeIdx != null ? cell.dataset.composeIdx : cell.dataset.composeEmpty;
    if (tIdx == null) return;
    // Don't highlight the source cell as a drop target.
    if (cell.dataset.composeIdx != null && parseInt(cell.dataset.composeIdx, 10) === dragFromIdx) {
      clearDropTargets();
      return;
    }
    // Clear stale targets then set the new pair.
    clearDropTargets();
    const sel = cell.dataset.composeIdx != null
      ? `[data-compose-idx="${tIdx}"]`
      : `[data-compose-empty="${tIdx}"]`;
    document.querySelectorAll(sel).forEach(c => c.classList.add('drop-target'));
  });

  document.addEventListener('drop', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) { dragFromIdx = null; clearDropTargets(); return; }
    e.preventDefault();
    const from = dragFromIdx;
    const seq = state.composedProgression;
    if (from < 0 || from >= seq.length) {
      dragFromIdx = null; clearDropTargets(); return;
    }
    // Deep clone the source so subdivisions / shape arrays don't share refs.
    const copy = JSON.parse(JSON.stringify(seq[from]));
    // Snapshot for undo before any mutation.
    const snapshot = () => {
      if (typeof _composeUndoStack !== 'undefined') {
        _composeUndoStack.push(JSON.parse(JSON.stringify(seq)));
      }
    };
    if (cell.dataset.composeIdx != null) {
      const to = parseInt(cell.dataset.composeIdx, 10);
      if (to !== from && to >= 0 && to < seq.length) {
        snapshot();
        seq[to] = copy;
        renderComposeStrip();
      }
    } else if (cell.dataset.composeEmpty != null) {
      // Drop on a trailing empty cell at index `to`. If `to` is past
      // the current end, fill the gap (seq.length .. to-1) with silent
      // rests, then place the duplicate at index `to`. This lets the
      // user drag e.g. from bar 2 to bar 4 and get a rest at bar 3.
      const to = parseInt(cell.dataset.composeEmpty, 10);
      if (to >= seq.length && to < _composeMax()) {
        snapshot();
        while (seq.length < to) seq.push({ _silent: true });
        seq.push(copy);
        renderComposeStrip();
      }
    }
    dragFromIdx = null;
    clearDropTargets();
  });

  document.addEventListener('dragend', () => {
    dragFromIdx = null;
    document.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging'));
    clearDropTargets();
  });
})();

// Shared: apply a new subdivision count to a cell. Handles subdivMute,
// the slots[] array (collapsing to single chord at N=1 OR reshaping when
// growing/shrinking), AND a stash of the LAST multi-chord state on the
// cell (_savedSlots) so dragging down to 1 and back up restores the
// chords you had before instead of seeding fresh. Both the popover pick
// and the badge drag go through this.
function applyCellSubdivisions(cell, cellIdx, newN) {
  if (!cell || cell.subdivisions === newN) return false;
  cell.subdivisions = newN;
  cell.subdivMute = (newN === 1)
    ? []
    : (cell.subdivMute && cell.subdivMute.length === newN
        ? cell.subdivMute
        : new Array(newN).fill(false));
  if (newN === 1) {
    // Stash existing slots so a later drag back up can resurrect them.
    if (cell.slots && cell.slots.length > 1) {
      cell._savedSlots = cell.slots.map(sl => sl ? {...sl} : null);
    }
    cell.slots = null;
    if (state._multiChordEditCell === cellIdx) {
      state._multiChordEditCell = null;
      state._multiChordEditSlotIdx = null;
      state._multiChordEditAutoAdvance = null;
    }
  } else {
    // Going to N>1. Source = current slots if any, else the saved stash
    // (resurrect-from-1 path), else nothing (seed-only path).
    const source = (cell.slots && cell.slots.length)
      ? cell.slots
      : (cell._savedSlots || null);
    if (source) {
      const seed = source[0] || {
        chord: cell.chord, _candIdx: cell._candIdx, shape: cell.shape,
        voicingType: cell.voicingType, stringSetIdx: cell.stringSetIdx,
        inversion: cell.inversion, stringSet: cell.stringSet,
      };
      cell.slots = Array.from({ length: newN }, (_, i) =>
        source[i] ? { ...source[i] } : { ...seed }
      );
    }
    // Keep _savedSlots around — user might collapse + re-expand many
    // times while landing on the right N. It only gets cleared when the
    // user explicitly changes the cell's chord or rebuilds the strip.
  }
  return true;
}

// Vertical drag on the subdivision badge to change the count (like the BPM).
// Drag UP increments, DRAG DOWN decrements. ~14 px per step. Clamped 1–8.
// Uses POINTER events so mouse + touch + pen all work the same way, with
// setPointerCapture so the drag survives the cursor leaving the badge.
(function() {
  let dragIdx = null, dragStartY = null, dragStartN = null, dragMoved = false;
  let dragCommitted = false;   // true once the pointer cleared the start threshold
  let capturedEl = null, capturedPointerId = null;
  function clampN(n) { return Math.max(1, Math.min(8, n)); }
  function onMove(e) {
    if (dragIdx === null) return;
    // Block the browser from scrolling — touch-action:none on the badge
    // helps but once the pointer leaves it, only preventDefault stops scroll.
    if (e.cancelable) e.preventDefault();
    const y = e.clientY;
    const movedPx = Math.abs(y - dragStartY);
    // First time crossing the 8px threshold "commits" to the drag. After
    // that, every position is mapped — including small distances that
    // resolve to N=1. That lets the user pull back to the start point
    // and land on 1 without having to release and click "1" in the popover.
    if (!dragCommitted) {
      if (movedPx <= 8) return;
      dragCommitted = true;
    }
    dragMoved = true;
    // 1 is ALWAYS the center value, regardless of where dragging started.
    // Drag distance (in either direction) maps to the count: 0 → 1,
    // 14px → 2, …, 98px → 8. Drag back to the start point to return to 1.
    const distance = Math.round(movedPx / 14);
    const newN = clampN(1 + distance);
    const seq = state.composedProgression;
    const cell = seq[dragIdx];
    if (!applyCellSubdivisions(cell, dragIdx, newN)) return;
    renderComposeStrip();
  }
  function onEnd(e) {
    if (capturedEl && capturedPointerId != null) {
      try { capturedEl.releasePointerCapture(capturedPointerId); } catch(_) {}
    }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
    document.body.classList.remove('dragging-subdiv');
    capturedEl = null;
    capturedPointerId = null;
    // Reset on next tick so the click handler can still read dragMoved.
    setTimeout(() => { dragIdx = null; dragMoved = false; dragCommitted = false; }, 0);
  }
  document.addEventListener('pointerdown', e => {
    if (player.playing) return;
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    if (!seq[idx]) return;
    dragIdx = idx;
    dragStartY = e.clientY;
    dragStartN = seq[idx].subdivisions || 1;
    dragMoved = false;
    dragCommitted = false;
    // Capture so subsequent move/up events fire on the SAME element even if
    // the finger drifts off the badge — critical on mobile.
    try {
      tri.setPointerCapture(e.pointerId);
      capturedEl = tri;
      capturedPointerId = e.pointerId;
    } catch(_) {}
    document.body.classList.add('dragging-subdiv');
    document.addEventListener('pointermove', onMove, {passive: false});
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  });
  // Right-click on the badge resets the subdivision count back to 1.
  document.addEventListener('contextmenu', e => {
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    e.preventDefault();
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    const cell = seq[idx];
    if (!cell) return;
    cell.subdivisions = 1;
    cell.subdivMute = [];
    renderComposeStrip();
  });
  window._subdivDragMoved = () => dragMoved;
})();

document.addEventListener('click', (ev) => {
  if (player.playing) return;

  // ── Rhythm subdivision triangle: open the 1–8 picker popover ──
  // (Only if the user TAPPED — if they dragged vertically to change the
  // count, the drag handler below sets _subdivDragMoved so we skip.)
  const triBtn = ev.target.closest('.subdiv-triangle');
  if (triBtn) {
    ev.stopPropagation();
    if (window._subdivDragMoved && window._subdivDragMoved()) return;
    const idx = parseInt(triBtn.dataset.subdivTri, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    // If the popover is already open for THIS cell, a second tap on
    // the same badge closes it (toggle behaviour). Otherwise open
    // (or re-open for a different cell).
    const pop = document.getElementById('subdiv-popover');
    if (pop && pop.classList.contains('open')
        && parseInt(pop.dataset.cellIdx, 10) === idx) {
      closeSubdivPopover();
    } else {
      openSubdivPopover(triBtn, idx);
    }
    return;
  }
  // ── Multi-chord slot tap: select that specific slot for editing ──
  // Each slot in the horizontal TAB has an invisible click rect. Tapping
  // picks that slot as the multi-chord edit target so the next chord
  // button writes into it AND shift+number cycles its voicing. Manual
  // slot selection does NOT auto-advance — the user stays on the slot
  // they picked until they pick another one or exit via the chip.
  const mcSlotRect = ev.target.closest('[data-multichord-slot]');
  if (mcSlotRect) {
    ev.stopPropagation();
    const cellEl = mcSlotRect.closest('[data-compose-idx]');
    if (!cellEl) return;
    const cellIdx = parseInt(cellEl.dataset.composeIdx, 10);
    const slotIdx = parseInt(mcSlotRect.dataset.multichordSlot, 10);
    if (!Number.isFinite(cellIdx) || !Number.isFinite(slotIdx)) return;
    const seq = state.composedProgression;
    const cell = seq[cellIdx];
    if (!cell || !cell.slots || slotIdx < 0 || slotIdx >= cell.slots.length) return;
    state._multiChordEditCell = cellIdx;
    state._multiChordEditSlotIdx = slotIdx;
    state._multiChordEditAutoAdvance = false;
    // Focus the chord that lives in this slot so the chord map + alt
    // voicings row reflect it. But if the slot is MUTED, don't audition
    // — the slot is meant to be silent, so playing it on click would
    // contradict the visual. The user can still change the chord via the
    // keypad; doing so un-mutes the slot (handled in composeAddChord).
    const isSlotMuted = !!(cell.subdivMute && cell.subdivMute[slotIdx]);
    const slot = cell.slots[slotIdx];
    if (slot && slot.chord) {
      state.focusedChord = slot.chord;
      state.userVoicing = slot.shape ? { shape: slot.shape } : null;
    }
    renderComposeStrip();
    if (typeof renderAll === 'function') renderAll();
    if (!isSlotMuted && typeof ringFocusedChord === 'function') ringFocusedChord();
    return;
  }
  // ── Multi-chord chip: enter / exit multi-chord edit mode ──
  // First tap on a single-chord bar: bumps subdivisions to 2 (if currently
  // 1), initializes cell.slots = [copy of current chord, copy of current
  // chord], and selects slot 1 (the second one) so the next chord button
  // press writes into it. If the bar already has slots and the user taps
  // the chip again, that just re-selects slot 1 (lets them restart from
  // the second slot). Tapping the chip on the cell that's currently being
  // edited exits edit mode.
  const mcBtn = ev.target.closest('.multichord-chip');
  if (mcBtn) {
    ev.stopPropagation();
    const idx = parseInt(mcBtn.dataset.multichordCell, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    const cell = seq[idx];
    if (!cell || !cell.chord) return;
    // Toggle off if we tapped the chip on the cell already being edited.
    if (state._multiChordEditCell === idx) {
      state._multiChordEditCell = null;
      state._multiChordEditSlotIdx = null;
      renderComposeStrip();
      return;
    }
    _composeSaveUndo();
    if (!cell.subdivisions || cell.subdivisions < 2) {
      cell.subdivisions = 2;
      cell.subdivMute = new Array(2).fill(false);
    }
    // Initialize slots from the cell's existing chord (so the bar still
    // sounds the same until the user picks a new chord for the selected
    // slot). Each slot mirrors the cell's current chord + voicing data.
    if (!cell.slots || cell.slots.length !== cell.subdivisions) {
      const seed = {
        chord: cell.chord,
        _candIdx: cell._candIdx,
        shape: cell.shape,
        voicingType: cell.voicingType,
        stringSetIdx: cell.stringSetIdx,
        inversion: cell.inversion,
        stringSet: cell.stringSet,
      };
      cell.slots = Array.from({ length: cell.subdivisions }, () => ({ ...seed }));
    }
    state._multiChordEditCell = idx;
    // Start at the first NON-MUTED slot from 1 onward. If the user
    // pre-set a rhythm where slot 1 (or several) are silent, skip past
    // them so the chip-walkthrough only stops on slots that will actually
    // sound. Fall back to slot 1 if every non-zero slot is muted — the
    // user can still un-mute one before picking a chord.
    const muteArr = cell.subdivMute || [];
    let startSlot = 1;
    while (startSlot < cell.slots.length && muteArr[startSlot]) startSlot++;
    if (startSlot >= cell.slots.length) startSlot = 1;
    state._multiChordEditSlotIdx = startSlot;
    state._multiChordEditAutoAdvance = true;  // chip-initiated: walk through slots
    renderComposeStrip();
    return;
  }
  // ── Rhythm subdivision segment: toggle mute on click ──
  const seg = ev.target.closest('.subdiv-seg');
  if (seg) {
    ev.stopPropagation();
    const cellIdx = parseInt(seg.dataset.subdivCell, 10);
    const segIdx  = parseInt(seg.dataset.subdivSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    if (!cell.subdivMute) cell.subdivMute = new Array(cell.subdivisions || 1).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
  }
  // ── Staff slot (piano mode): unified with the guitar horizontal-TAB
  //    slot click. Multi-chord bars (slots[] with ≥2 distinct chord IDs)
  //    SELECT the slot for editing — matches guitar so the user gets the
  //    same gesture in both instruments. Backspace then mutes the selected
  //    slot. Single-chord cells with rhythmic subdivisions keep the
  //    legacy mute-toggle behavior (no chord to "select"). ──
  const staffSlot = ev.target.closest('.staff-slot');
  if (staffSlot) {
    const parentCell = staffSlot.closest('[data-compose-idx]');
    if (!parentCell) return;
    const cellIdx = parseInt(parentCell.dataset.composeIdx, 10);
    const segIdx  = parseInt(staffSlot.dataset.staffSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    const subN = cell.subdivisions || 1;
    // Whole-note case (subdivisions === 1): there's no slot-level action
    // here — the whole staff IS the chord. Fall through to the generic
    // cell-tap handler below so single-chord piano cells go through the
    // SAME path as guitar (focus + audition + arm _oneShotReplaceIdx so
    // the next chord-button press replaces this cell in place).
    if (subN <= 1) {
      // Don't stopPropagation; don't return early.
    } else {
    // Multi-chord cell: tap → select that slot for editing (matches
    // the guitar horizontal-TAB behavior). Mute lives on Backspace.
    const isMultiChord = cell.slots && cell.slots.length > 1;
    if (isMultiChord) {
      ev.stopPropagation();
      if (segIdx < 0 || segIdx >= cell.slots.length) return;
      state._multiChordEditCell = cellIdx;
      state._multiChordEditSlotIdx = segIdx;
      state._multiChordEditAutoAdvance = false;
      // Muted slots don't audition on tap — the slot is silent by design,
      // ringing it would contradict what the user sees. They can still
      // change the chord on the keypad and that un-mutes (composeAddChord).
      const isSlotMuted = !!(cell.subdivMute && cell.subdivMute[segIdx]);
      const slot = cell.slots[segIdx];
      if (slot && slot.chord) {
        state.focusedChord = slot.chord;
        state.userVoicing = slot.shape ? { shape: slot.shape } : null;
      }
      renderComposeStrip();
      if (typeof renderAll === 'function') renderAll();
      if (!isSlotMuted && typeof ringFocusedChord === 'function') ringFocusedChord();
      return;
    }
    // Single-chord rhythmic subdivisions (legacy behavior): toggle mute.
    ev.stopPropagation();
    if (!cell.subdivMute) cell.subdivMute = new Array(subN).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
    }
  }
  // ── Click in the subdivision popover: pick a count ──
  const pickBtn = ev.target.closest('#subdiv-popover button[data-subdiv-pick]');
  if (pickBtn) {
    ev.stopPropagation();
    const n = parseInt(pickBtn.dataset.subdivPick, 10);
    const cellIdx = parseInt(document.getElementById('subdiv-popover').dataset.cellIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(n) || !seq[cellIdx]) return;
    const cell = seq[cellIdx];
    applyCellSubdivisions(cell, cellIdx, n);
    closeSubdivPopover();
    renderComposeStrip();
    return;
  }

  // ── Lock button: toggle lock on that specific slot ──
  const lockBtn = ev.target.closest('.compose-edit-btn');
  if (lockBtn) {
    ev.stopPropagation();
    const idx = parseInt(lockBtn.dataset.editIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    if (state.composedSelectedIdx === idx) {
      // Already locked on this slot — unlock
      state.composedSelectedIdx = null;
      state._composedSelectedLocked = false;
    } else {
      // Lock this slot — EXPLICIT user lock, persists until unlocked or
      // overridden by another explicit lock. Cell-clicks won't clear this.
      state.composedSelectedIdx = idx;
      state._composedSelectedLocked = true;
      const entry = seq[idx];
      state.focusedChord = entry.chord;
      state.userVoicing = entry.shape ? { shape: entry.shape } : null;
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Empty cell click: extend the previous chord with ties up to that slot ──
  const emptyCell = ev.target.closest('[data-compose-empty]');
  if (emptyCell) {
    const seq = state.composedProgression;
    if (!seq.length || seq.length >= _composeMax()) return;
    const targetIdx = parseInt(emptyCell.dataset.composeEmpty, 10);
    if (!Number.isFinite(targetIdx) || targetIdx < seq.length) return;
    _composeSaveUndo();
    const prev = seq[seq.length - 1];
    const tieEntry = {
      chord: prev.chord, _candIdx: prev._candIdx, shape: prev.shape,
      voicingType: prev.voicingType, stringSetIdx: prev.stringSetIdx,
      inversion: prev.inversion, stringSet: prev.stringSet, _tie: true,
    };
    // Fill all slots from current end up to and including the clicked slot
    while (seq.length <= targetIdx && seq.length < _composeMax()) {
      seq.push(JSON.parse(JSON.stringify(tieEntry)));
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Cell click: focus/audition that chord (does NOT lock) ──
  const cell = ev.target.closest('[data-compose-idx]');
  if (!cell) {
    // Click outside any compose cell — clear lock
    if (state.composedSelectedIdx !== null) {
      const inControls = ev.target.closest('.compose-pad, .compose-btn, .compose-inv, .map-card');
      if (!inControls) {
        state.composedSelectedIdx = null;
        state._composedSelectedLocked = false;
        renderComposeStrip();
      }
    }
    return;
  }
  const idx = parseInt(cell.dataset.composeIdx, 10);
  const seq = state.composedProgression;
  if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
  const entry = seq[idx];
  if (!entry || !entry.chord) return;
  ensureAudio();
  // Tap a cell = focus + audit + silently arm a ONE-SHOT replace
  // target. NO visual lock indicator — the next chord button just
  // replaces this slot in place, then clears the arm so subsequent
  // picks append at the end. Tap a different cell to re-aim. Use
  // a separate _oneShotReplaceIdx so the existing composedSelectedIdx
  // (which DOES drive the orange "locked" highlight via the explicit
  // 🔓 button) stays untouched.
  //
  // EXCEPT: if composedSelectedIdx was set automatically (pause or AI
  // capture — flag _composedSelectedLocked is false), the user clicking
  // a different cell signals intent to start play from THIS cell, so we
  // clear the stale auto-select. Explicit 🔓 locks survive (flag true).
  if (state.composedSelectedIdx !== null && !state._composedSelectedLocked) {
    state.composedSelectedIdx = null;
  }
  state._composeFocusedIdx = idx;
  state.focusedChord = entry.chord;
  state.userVoicing = entry.shape ? { shape: entry.shape } : null;
  state._oneShotReplaceIdx = (state._oneShotReplaceIdx === idx) ? null : idx;
  renderAll();
  renderComposeStrip();
  ringFocusedChord();
});

// Long-press on a compose cell toggles the explicit lock (composedSelectedIdx)
// — the gesture replaced the visible lock button so the strip stays clean.
// Threshold: 520ms hold without moving more than 6px. Quick taps fall
// through to the normal cell-click handler that arms one-shot replace.
(function wireComposeLongPressLock() {
  const area = document.querySelector('.rb-area');
  if (!area) return;
  const HOLD_MS = 520;
  const MOVE_TOL = 6;
  let pressTimer = null;
  let startX = 0, startY = 0;
  let pressedIdx = -1;
  let pressedEl = null;
  let didFire = false;
  const clear = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (pressedEl) pressedEl.classList.remove('compose-longpress');
    pressedEl = null;
    pressedIdx = -1;
  };
  area.addEventListener('pointerdown', (ev) => {
    if (player.playing || player.paused) return;
    // Skip if the press lands on an inner control — chip, lock btn, subdiv
    // triangle/seg, popover button. Those have their own handlers.
    if (ev.target.closest('.multichord-chip, .compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg, #subdiv-popover, [data-multichord-slot], .staff-slot')) return;
    const cell = ev.target.closest('[data-compose-idx]');
    if (!cell) return;
    const idx = parseInt(cell.dataset.composeIdx, 10);
    if (!Number.isFinite(idx)) return;
    pressedIdx = idx;
    pressedEl = cell;
    startX = ev.clientX;
    startY = ev.clientY;
    didFire = false;
    cell.classList.add('compose-longpress');
    pressTimer = setTimeout(() => {
      pressTimer = null;
      const seq = state.composedProgression;
      if (!seq[pressedIdx]) { clear(); return; }
      // Toggle the explicit lock — same body as the old lock-button click.
      if (state.composedSelectedIdx === pressedIdx) {
        state.composedSelectedIdx = null;
        state._composedSelectedLocked = false;
      } else {
        state.composedSelectedIdx = pressedIdx;
        state._composedSelectedLocked = true;
        const entry = seq[pressedIdx];
        if (entry && entry.chord) {
          state.focusedChord = entry.chord;
          state.userVoicing = entry.shape ? { shape: entry.shape } : null;
        }
      }
      didFire = true;
      if (typeof renderAll === 'function') renderAll();
      if (typeof renderComposeStrip === 'function') renderComposeStrip();
      // Subtle haptic on mobile if supported — confirms the lock fired
      // without waiting for the user to look at the strip.
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch(_) {} }
      clear();
    }, HOLD_MS);
  });
  area.addEventListener('pointermove', (ev) => {
    if (!pressedEl) return;
    if (Math.abs(ev.clientX - startX) > MOVE_TOL || Math.abs(ev.clientY - startY) > MOVE_TOL) {
      clear();
    }
  });
  // Both cancel + up clear the timer. If didFire is true the click that
  // follows pointerup gets swallowed by the click handler chain that the
  // lock toggle already triggered (re-render replaces the element).
  area.addEventListener('pointerup', clear);
  area.addEventListener('pointercancel', clear);
  area.addEventListener('pointerleave', clear);
})();

// Sync hover highlight between chord-name row and tab row so they read as
// ONE cell. Uses bubbling mouseover/mouseout (mouseenter doesn't bubble,
// so the previous version only fired once on area entry, not per cell).
(function wireComposeHoverSync() {
  const area = document.querySelector('.rb-area');
  if (!area) return;
  let lastIdx = null;
  const clear = () => {
    area.querySelectorAll('[data-compose-idx].compose-hover')
        .forEach(el => el.classList.remove('compose-hover'));
  };
  area.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('[data-compose-idx]');
    if (!cell) return;
    const idx = cell.dataset.composeIdx;
    if (idx === lastIdx) return;
    lastIdx = idx;
    clear();
    area.querySelectorAll(`[data-compose-idx="${idx}"]`)
        .forEach(el => el.classList.add('compose-hover'));
  });
  area.addEventListener('mouseout', (e) => {
    // Skip if the mouse is still moving INTO another paired cell — the
    // mouseover that follows will refresh the highlight correctly.
    const next = e.relatedTarget && e.relatedTarget.closest
      ? e.relatedTarget.closest('[data-compose-idx]')
      : null;
    if (next) return;
    lastIdx = null;
    clear();
  });
})();

// Tracks voicing cycling for keyboard shortcuts.
//   Number 1–7                → select chord, play the screen-recommended voicing
//   Right Shift + number 1–7  → cycle FORWARD through alternate voicings
//   Left  Shift + number 1–7  → cycle BACKWARD through alternate voicings
let _shortcutCycle = { chord: null, idx: 0, cands: [] };

// Track which shift is held — e.shiftKey alone can't distinguish sides.
let _shiftSide = null;   // 'left' | 'right' | null
document.addEventListener('keydown', e => {
  if (e.code === 'ShiftLeft')  _shiftSide = 'left';
  if (e.code === 'ShiftRight') _shiftSide = 'right';
});
document.addEventListener('keyup', e => {
  if (e.code === 'ShiftLeft'  && _shiftSide === 'left')  _shiftSide = null;
  if (e.code === 'ShiftRight' && _shiftSide === 'right') _shiftSide = null;
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  // Ctrl/Cmd+Z → undo compose action
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    composeUndo();
    return;
  }

  if (e.metaKey || e.ctrlKey || e.altKey) return;

  // Spacebar → universal play/pause toggle (always available)
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    const btn = document.getElementById('auto-play');
    if (player.playing) {
      // Hit the auto-play button so it tears down player+metronome the same way
      if (btn) btn.click();
    } else if (state.composedProgression.length) {
      composePlay();
    } else if (btn) {
      btn.click();
    }
    return;
  }

  // Playback-mode shortcuts (active when the player owns the strip).
  // Enter     → click the big ⏹ stop button (2-stage: rewind, then clear).
  // Escape    → click ✏ edit (exits playback, focuses current chord).
  // Backspace → same as Escape: first press reverts to edit mode instead
  //             of nuking composition cells (which the user can't see).
  // ←/→       → step the playback head one bar back / forward while paused.
  if (player.playing || player.paused) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const stopBtn = document.getElementById('auto-stop');
      if (stopBtn) stopBtn.click();
      return;
    }
    if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault();
      const editBtn = document.getElementById('auto-edit');
      if (editBtn) editBtn.click();
      return;
    }
    if (player.paused && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      _navigateStrip(e.key === 'ArrowRight' ? 1 : -1);
      return;
    }
  }

  // Compose-mode shortcuts (only when AI off)
  if (!player.playing) {
    if (e.key === 'Backspace') {
      if (state.composedProgression.length) {
        e.preventDefault(); composeDeleteLast(); return;
      }
      // Nothing left to delete — if the player is paused (idle but
      // visualization still on the bar), the natural fallback is
      // "wipe everything and reset", same as tapping ⏹ stop/reset.
      if (player.paused) {
        e.preventDefault();
        const stopBtn = document.getElementById('auto-stop');
        if (stopBtn) stopBtn.click();
        return;
      }
    }
    if (e.key === 'Enter' && state.composedProgression.length) {
      e.preventDefault(); composePlay(); return;
    }
    // ←/→ = step through the composed progression (audition each chord)
    if (!player.paused && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') &&
        state.composedProgression.length) {
      e.preventDefault();
      const seq = state.composedProgression;
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const cur = state._composeFocusedIdx;
      let idx;
      if (cur === null || cur === undefined) {
        idx = dir > 0 ? 0 : seq.length - 1;
      } else {
        idx = cur + dir;
        if (idx < 0) idx = 0;
        if (idx >= seq.length) idx = seq.length - 1;
      }
      const entry = seq[idx];
      if (!entry || !entry.chord) return;
      ensureAudio();
      state._composeFocusedIdx = idx;
      state.focusedChord = entry.chord;
      state.userVoicing = entry.shape ? { shape: entry.shape } : null;
      renderAll();
      renderComposeStrip();
      ringFocusedChord();
      return;
    }
    // L = toggle lock on current/last chord slot for in-place replacement
    if ((e.key === 'l' || e.key === 'L') && state.composedProgression.length) {
      e.preventDefault();
      const seq = state.composedProgression;
      // If nothing selected, lock the last chord; if already locked, unlock
      const target = state.composedSelectedIdx ?? (seq.length - 1);
      if (state.composedSelectedIdx === target) {
        state.composedSelectedIdx = null;
        state._composedSelectedLocked = false;
      } else {
        state.composedSelectedIdx = target;
        state._composedSelectedLocked = true;  // explicit user lock via L key
        const entry = seq[target];
        state.focusedChord = entry.chord;
        state.userVoicing = entry.shape ? { shape: entry.shape } : null;
      }
      renderAll();
      renderComposeStrip();
      return;
    }
  }
  if (e.key === 'Escape' && state.composedProgression.length) {
    e.preventDefault();
    // First Escape: just deselect (leaves the strip intact). Second Escape
    // (with no selection): clear the whole composed progression.
    if (state.composedSelectedIdx !== null) {
      state.composedSelectedIdx = null;
      renderComposeStrip();
    } else {
      composeClear();
    }
    return;
  }

  // Shift+digit may produce a punctuation glyph ("@", "#", ...) instead of the
  // digit on US layouts — fall back to e.code "Digit1"–"Digit7" in that case.
  // Also accept the numeric keypad ("Numpad1"–"Numpad7") so desktop users
  // with a 10-key get the same shortcut.
  let n = parseInt(e.key);
  if (isNaN(n) && e.code) {
    if (e.code.startsWith('Digit'))  n = parseInt(e.code.slice(5));
    else if (e.code.startsWith('Numpad')) n = parseInt(e.code.slice(6));
  }
  if (n < 1 || n > 7) return;
  const chordId = DEGREE_SHORTCUTS[state.tonality]?.[n];
  if (!chordId || !currentMap().chordDefs[chordId]) return;
  e.preventDefault();

  // Compose mode (AI not playing AND not paused): append / cycle inversion.
  // While paused the strip belongs to the player, so chord input falls
  // through to the audition path below instead of mutating the comp.
  if (!player.playing && !player.paused) {
    composeAddChord(chordId, e.shiftKey, _shiftSide === 'left' ? -1 : 1);
    const padBtn = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
    if (padBtn) {
      padBtn.classList.add('flash');
      setTimeout(() => padBtn.classList.remove('flash'), 150);
    }
    return;
  }

  const ch = currentMap().chordDefs[chordId];
  const root = chordRoot(ch);
  const isCycleKey = e.shiftKey;
  // Default to forward if shift side somehow isn't tracked (e.g. window lost focus)
  const direction = _shiftSide === 'left' ? -1 : 1;

  if (isCycleKey && _shortcutCycle.chord === chordId && _shortcutCycle.cands.length) {
    // Shift+same-number → step voicing in the chosen direction
    const len = _shortcutCycle.cands.length;
    _shortcutCycle.idx = (_shortcutCycle.idx + direction + len) % len;
  } else {
    // Either plain digit OR shift+different-chord. Pull the master voicing
    // list (drop-2 → shells → triads → guides → sus, deduped) so the cycle
    // covers EVERY distinct voicing — not just drop-2 inversions.
    const displayed = computeAllVoicings()[chordId];
    const cands = allDistinctVoicings(ch.quality, root);
    let startIdx = 0;
    if (displayed?.shape) {
      const match = cands.findIndex(c => c.shape.every((f, i) => f === displayed.shape[i]));
      if (match >= 0) startIdx = match;
    }
    if (isCycleKey && cands.length > 1) {
      startIdx = (startIdx + direction + cands.length) % cands.length;
    }
    _shortcutCycle = { chord: chordId, idx: startIdx, cands };
  }

  const picked = _shortcutCycle.cands[_shortcutCycle.idx];
  state.focusedChord = chordId;
  state.userVoicing = picked
    ? { shape: picked.shape, type: picked.type, stringSetIdx: picked.stringSetIdx, inversion: picked.inversion }
    : null;

  if (player.playing) {
    player.jumpTo(chordId);
  } else {
    renderAll();
    ringFocusedChord();
  }

  // Flash keypad button (after any re-render)
  const padBtn2 = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
  if (padBtn2) {
    padBtn2.classList.add('flash');
    setTimeout(() => padBtn2.classList.remove('flash'), 150);
  }
});

// Any non-keyboard focus change (clicking a card, AI moving) resets the cycle.
// We hook this by watching focusedChord transitions from other code paths.
const _origRenderAll = renderAll;
renderAll = function() {
  // If focused changed away from the cycle's chord by other means, drop the cycle
  if (_shortcutCycle.chord && state.focusedChord !== _shortcutCycle.chord) {
    _shortcutCycle = { chord: null, idx: 0, cands: [] };
  }
  return _origRenderAll.apply(this, arguments);
};

// ─── Startup randomizer ────────────────────────────────────────
// On each fresh page load, roll the default Chord Sound / Rhythm /
// Instrument view / BPM from the weighted distributions below.
// Voicing preference and Bass are intentionally left at their compile-
// time defaults ('all' / on) per the user's spec. No localStorage —
// every new session re-rolls.
(function rollStartupDefaults() {
  // Pick a key from a {value: weight} map. Weights are relative, no
  // need to sum to 100 — but we use percentages here for legibility.
  const pickWeighted = (map) => {
    const entries = Object.entries(map);
    const total = entries.reduce((a, [, w]) => a + w, 0);
    if (total <= 0) return entries[0][0];
    let r = Math.random() * total;
    for (const [k, w] of entries) {
      r -= w;
      if (r <= 0) return k;
    }
    return entries[entries.length - 1][0];
  };

  // 🎹 Chord Sound — instrument that plays the chords
  const soundPick = pickWeighted({
    rhodes:  5,
    piano:   60,
    jazzgtr: 15,
    pad:     10,
    organ:   10,
  });
  droneTimbre = soundPick;
  const sOpt = SOUND_OPTIONS.find(o => o.value === soundPick);
  if (sOpt && soundBtn && typeof _updateKeysIcon === 'function') {
    _updateKeysIcon();
  }

  // 🥁 Rhythm — drum/click pattern
  const rhythmPick = pickWeighted({
    ride:    50,
    drums:   15,
    twofour: 25,
    click:   5,
    off:     5,
  });
  applyRhythmMode(rhythmPick);

  // 🎸 Instrument view — guitar fretboard vs piano keyboard
  const instPick = pickWeighted({ guitar: 65, piano: 35 });
  setInstrument(instPick);

  // ⏱ BPM — first pick a range, then a uniform integer inside it
  const bpmRange = pickWeighted({
    '90-110':  30,
    '110-130': 40,
    '130-150': 20,
    '150-170': 10,
  });
  const [lo, hi] = bpmRange.split('-').map(Number);
  const bpm = lo + Math.floor(Math.random() * (hi - lo + 1));
  setBpm(bpm);
})();

// Initial placement of the now-playing card BEFORE renderAll — app
// boots in compose mode, so the card belongs left of the chord map.
// Doing this first ensures renderComposeInfo measures + auto-fits
// the chord name/roman against the FINAL container width (.map-wrap,
// ~220px), not against the wider .rb-area origin (which led to fonts
// being sized too big and the card looking off until the user
// resized the window to trigger a reflow).
if (typeof relocatePlayerInfo === 'function') relocatePlayerInfo();
renderAll();
window.addEventListener('resize', () => {
  renderFretboard();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();
});

/* ─── MIDI Export ─── */

function _midiCollectComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  const shapeToNotes = (shape) => shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    // Silent rests + ties — advance tick without emitting notes.
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = CHORD_MAP[state.tonality]?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    // Count consecutive ties after this cell
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    // Fallback notes (slot 0 / single chord)
    let baseNotes;
    if (cell.shape && cell.shape.some(f => f >= 0)) {
      baseNotes = shapeToNotes(cell.shape);
    } else {
      const rootPc = (state.keyPc + def.deg) % 12;
      const q = QUALITIES[def.quality];
      if (!q) { tick += barLen; continue; }
      baseNotes = q.ints.map(i => 48 + rootPc + i);
    }
    const dur = barLen * bars;
    const subN = Math.max(1, cell.subdivisions || 1);
    const subMute = cell.subdivMute || [];
    const slotDur = Math.floor(barLen / subN);
    // Per-slot notes: when cell.slots is set, each slot may carry a
    // different chord/voicing → use slot.shape for that slot. This is the
    // "export as it plays" requirement — the MIDI mirrors what the audio
    // scheduler does (notesForSlot in _triggerChord).
    const slotsArr = (cell.slots && cell.slots.length === subN) ? cell.slots : null;
    const notesForSlot = (s) => {
      if (!slotsArr) return baseNotes;
      const sl = slotsArr[s];
      if (!sl || !sl.shape) return baseNotes;
      return shapeToNotes(sl.shape);
    };
    for (let s = 0; s < subN; s++) {
      if (subMute[s]) continue;
      const slotStart = tick + s * slotDur;
      const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
      const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
      const slotNotes = notesForSlot(s);
      for (const n of slotNotes) {
        events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
        events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
      }
    }
    tick += dur;
  }
  return events;
}

function _midiCollectSong() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;

  const homeKey = player._homeKey || { keyPc: state.keyPc, tonality: state.tonality };
  let prevShape = null;
  for (const section of player.song) {
    const secKey = section.keyPc ?? homeKey.keyPc;
    const secTon = section.tonality ?? homeKey.tonality;
    const vType  = section.voicingType || 'drop2';
    const prog   = section.progression;
    if (!prog || !prog.steps) continue;
    const repeats = section.repeats || 1;
    for (let r = 0; r < repeats; r++) {
      for (const step of prog.steps) {
        // Silent rest step — advance tick but emit no notes.
        if (step._silent) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        const def = CHORD_MAP[secTon]?.chordDefs?.[step.chord];
        if (!def) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        let notes;
        if (step.composedShape && step.composedShape.some(f => f >= 0)) {
          notes = step.composedShape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
          prevShape = step.composedShape;
        } else {
          const rootPc = (secKey + def.deg) % 12;
          const shape = player._pickShape(def.quality, rootPc, vType, prevShape);
          if (shape) {
            notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
            prevShape = shape;
          } else {
            const q = QUALITIES[def.quality];
            notes = q ? q.ints.map(i => 48 + rootPc + i) : null;
          }
        }
        const dur = ticksPerBeat * 4 * (step.bars || 1);
        if (notes && notes.length) {
          // Rhythm subdivisions: split into N slot strikes inside the bar.
          // Last un-muted slot extends to end of full duration so the chord
          // rings through tied bars instead of cutting on slot N-1.
          const barLen2 = ticksPerBeat * 4;
          const subN = Math.max(1, step.subdivisions || 1);
          const subMute = step.subdivMute || [];
          const slotDur = Math.floor(barLen2 / subN);
          // Per-slot notes when the step carries slots[] (multi-chord bar).
          // buildSteps in _generateSong propagates cell.slots → step.slots
          // so the live player + MIDI export share the same per-slot data.
          const slotsArr = (step.slots && step.slots.length === subN) ? step.slots : null;
          const shapeToNotes = (sh) => sh.map((f, st) => f >= 0 ? STRING_OPEN_MIDI[st] + f : null).filter(x => x !== null);
          const notesForSlot = (s) => {
            if (!slotsArr) return notes;
            const sl = slotsArr[s];
            if (!sl || !sl.shape) return notes;
            return shapeToNotes(sl.shape);
          };
          for (let s = 0; s < subN; s++) {
            if (subMute[s]) continue;
            const slotStart = tick + s * slotDur;
            const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
            const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
            const slotNotes = notesForSlot(s);
            for (const n of slotNotes) {
              events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
              events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
            }
          }
          tick += dur;
        }
      }
    }
  }
  return events;
}

// Build the raw MIDI bytes for a set of events. Extracted from
// _buildMidiFile so the ZIP path can reuse it without triggering a

  for (let i = 0; i < keyName.length; i++) tw8(keyName.charCodeAt(i));

  for (const ev of events) {
    twVLQ(ev.tick - lastTick);
    lastTick = ev.tick;
    tw8(ev.type === 'on' ? 0x90 : 0x80);
    tw8(ev.note);
    tw8(ev.type === 'on' ? ev.vel : 0);
  }
  twVLQ(0); tw8(0xff); tw8(0x2f); tw8(0);

  wStr('MTrk'); w32(trackBuf.length);
  trackBuf.forEach(b => buf.push(b));
  return new Uint8Array(buf);
}

function _buildMidiFile(events, label) {
  const bytes = _buildMidiBytes(events, label);
  if (!bytes) return;
  const blob = new Blob([bytes], { type: 'audio/midi' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const keyStr = ROOTS[state.keyPc].name.replace('#', 's').replace('b', 'f');
  const bpm = Math.round(metronome.bpm || 120);
  a.href = url;
  a.download = `guitarra-${keyStr}-${state.tonality}-${bpm}bpm-${label}.mid`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return;
}

    dv.setUint16(28, p.nameBytes.length, true);
    dv.setUint16(30, 0, true); dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true); dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, p.offset, true);
    centralParts.push({ hdr, nameBytes: p.nameBytes });
    centralSize += hdr.length + p.nameBytes.length;
  }
  const centralOffset = offset;
  // End of central directory record
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0,  0x06054b50, true);
  edv.setUint16(4,  0, true); edv.setUint16(6, 0, true);
  edv.setUint16(8,  files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralOffset, true);
  edv.setUint16(20, 0, true);

  const totalSize = centralOffset + centralSize + end.length;
  const out = new Uint8Array(totalSize);
  let pos = 0;
  for (const p of localParts) {
    out.set(p.hdr, pos);          pos += p.hdr.length;
    out.set(p.nameBytes, pos);    pos += p.nameBytes.length;
    out.set(p.fileBytes, pos);    pos += p.fileBytes.length;
  }
  for (const c of centralParts) {
    out.set(c.hdr, pos);          pos += c.hdr.length;
    out.set(c.nameBytes, pos);    pos += c.nameBytes.length;
  }
  out.set(end, pos);
  return out;
}

// Build a zip with chords + bass MIDI files (both files inside one
// folder named after the export). Triggers a download of the .zip.
function _buildMidiBundle(chordsEvents, bassEvents, label) {
  const keyStr = ROOTS[state.keyPc].name.replace('#', 's').replace('b', 'f');
  const bpm = Math.round(metronome.bpm || 120);
  const folder = `guitarra-${keyStr}-${state.tonality}-${bpm}bpm-${label}`;
  const chordBytes = _buildMidiBytes(chordsEvents, label);
  const bassBytes  = _buildMidiBytes(bassEvents,   label + '-bass');
  const files = [];
  if (chordBytes) files.push({ name: `${folder}/chords.mid`, bytes: chordBytes });
  if (bassBytes)  files.push({ name: `${folder}/bass.mid`,   bytes: bassBytes  });
  if (!files.length) return;
  const zipBytes = _buildZip(files);
  const blob = new Blob([zipBytes], { type: 'application/zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${folder}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Bass-only collectors: one root note per chord in bass register
function _midiCollectBassComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  const cmap = CHORD_MAP[state.tonality];
  const rootPcOf = (chordId) => {
    const d = cmap?.chordDefs?.[chordId];
    return d ? (state.keyPc + d.deg) % 12 : null;
  };
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = cmap?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    const rootPc = (state.keyPc + def.deg) % 12;
    const dur = barLen * bars;
    // Multi-chord bar — follow each slot's chord at beat 1 (slot 0) and
    // beat 3 (slot covering the half-bar). Two-feel style so each
    // chord change inside the bar gets its own bass anchor, matching what
    // the live scheduler (_triggerChord bass section) does.
    const subN = Math.max(1, cell.subdivisions || 1);
    const slotsArr = (cell.slots && cell.slots.length === subN) ? cell.slots : null;
    const slotsAreMulti = slotsArr && subN >= 2;
    if (slotsAreMulti) {
      // One bass strike per non-muted slot, each using its own chord's
      // root. Bass note rings until the next non-muted slot (or end of
      // bar for the last). Mirrors the live player so MIDI export and
      // playback match note-for-note.
      const subMute = cell.subdivMute || [];
      const slotDur = Math.floor(barLen / subN);
      const slotStarts = [];
      for (let s = 0; s < subN; s++) {
        if (subMute[s]) continue;
        slotStarts.push(s);
      }
      for (let k = 0; k < slotStarts.length; k++) {
        const s = slotStarts[k];
        const slRoot = (slotsArr[s] && slotsArr[s].chord)
          ? (rootPcOf(slotsArr[s].chord) ?? rootPc) : rootPc;
        const note = bassMidiForPc(slRoot);
        const slotStart = tick + s * slotDur;
        const nextStart = (k + 1 < slotStarts.length)
          ? (tick + slotStarts[k + 1] * slotDur)
          : (tick + dur);
        events.push({ tick: slotStart, type: 'on', note, vel: 100 });
        events.push({ tick: nextStart - 1, type: 'off', note, vel: 0 });
      }
    } else {
      // Single-chord cell — sustained whole-bar root (existing behavior).
      const note = bassMidiForPc(rootPc);
      events.push({ tick, type: 'on', note, vel: 100 });
      events.push({ tick: tick + dur - 1, type: 'off', note, vel: 0 });
    }
    tick += dur;
  }
  return events;
}

function _midiCollectBassSong() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  if (!player.song || !player.song.length) return events;
  const homeKey = player._homeKey || { keyPc: state.keyPc, tonality: state.tonality };
  for (const section of player.song) {
    const secKey = section.keyPc ?? homeKey.keyPc;
    const secTon = section.tonality ?? homeKey.tonality;
    const prog = section.progression;
    if (!prog || !prog.steps) continue;
    const repeats = section.repeats || 1;
    for (let r = 0; r < repeats; r++) {
      for (const step of prog.steps) {
        const dur = ticksPerBeat * 4 * (step.bars || 1);
        if (step._silent) { tick += dur; continue; }
        const secMap = CHORD_MAP[secTon];
        const def = secMap?.chordDefs?.[step.chord];
        if (!def) { tick += dur; continue; }
        const rootPc = (secKey + def.deg) % 12;
        const subN = Math.max(1, step.subdivisions || 1);
        const slotsArr = (step.slots && step.slots.length === subN) ? step.slots : null;
        const slotsAreMulti = slotsArr && subN >= 2;
        if (slotsAreMulti) {
          const rootPcOf = (chordId) => {
            const d = secMap?.chordDefs?.[chordId];
            return d ? (secKey + d.deg) % 12 : null;
          };
          const subMute = step.subdivMute || [];
          const barLen3 = ticksPerBeat * 4;
          const slotDur = Math.floor(barLen3 / subN);
          const slotStarts = [];
          for (let s = 0; s < subN; s++) {
            if (subMute[s]) continue;
            slotStarts.push(s);
          }
          for (let k = 0; k < slotStarts.length; k++) {
            const s = slotStarts[k];
            const slRoot = (slotsArr[s] && slotsArr[s].chord)
              ? (rootPcOf(slotsArr[s].chord) ?? rootPc) : rootPc;
            const note = bassMidiForPc(slRoot);
            const slotStart = tick + s * slotDur;
            const nextStart = (k + 1 < slotStarts.length)
              ? (tick + slotStarts[k + 1] * slotDur)
              : (tick + dur);
            events.push({ tick: slotStart, type: 'on', note, vel: 100 });
            events.push({ tick: nextStart - 1, type: 'off', note, vel: 0 });
          }
        } else {
          const note = bassMidiForPc(rootPc);
          events.push({ tick, type: 'on', note, vel: 100 });
          events.push({ tick: tick + dur - 1, type: 'off', note, vel: 0 });
        }
        tick += dur;
      }
    }
  }
  return events;
}

// NOTE: do NOT alias these onto window — in non-strict mode the top-level

// Mobile structure picker: native <select> overlaid on the AABA summary.

function _buildMobileStructSelect(labels, activeLabel, cap) {

window._onMobileStructPick = function (sel) {
  const id = sel && sel.value;
