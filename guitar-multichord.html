      if (prog) {
        const formProgName = prog.name;
        return [{
          label: structDef.id.replace('_', ' '),     // 'BLUES' / 'JAZZ BLUES' shows in dashboard
          progression: prog,
          repeats: 4,                                 // cycle the form 4x
          voicingType: this._pickVoicingType({progName: formProgName}),
          bassPattern: this._pickBassPattern(),
        }];
      }
    }

    const letters = structureStr.split('');
    const uniqueLetters = [...new Set(letters)];

    // Pick one progression per unique label, avoiding repeats with prior picks.
    // Role mapping: A → 'A' (home), B → 'B' (bridge), C/D/etc → 'C' (departure).
    const baseByLabel = {};
    for (const lab of uniqueLetters) {
      const usedNames = Object.values(baseByLabel).map(s => s.progression.name);
      const role = lab === 'A' ? 'A' : (lab === 'B' ? 'B' : 'C');
      const prog = this._pickProgression(usedNames[0], role);
      baseByLabel[lab] = { label: lab, progression: prog, repeats: this._repeatsFor(prog) };
    }

    // Decide if this song modulates — kept moderately rare so it feels
    // intentional. Modulation applies to the FIRST non-A section (the
    // bridge); truck-driver lift applies to the LAST section IF it's A
    // and there's at least one A repeated earlier.
    let bMod = null;
    let finalALift = null;
    if (Math.random() < 0.35) {
      if (Math.random() < 0.55) {
        bMod = this._pickModulation(homePc, homeTonality);
      } else {
        const shift = Math.random() < 0.4 ? 1 : 2;
        finalALift = { keyPc: (homePc + shift) % 12, tonality: homeTonality,
                       name: shift === 1 ? 'half-step lift' : 'whole-step lift' };
      }
    }

    // Which label gets the modulation? First non-A letter in the sequence
    // (e.g. 'B' in AABA; first 'B' in ABAB; 'B' in ABCD).
    const bridgeLabel = letters.find(l => l !== 'A');
    if (bMod && bridgeLabel) {
      // If the bridge flips tonality, re-pick its progression from the dest catalog
      if (bMod.tonality !== homeTonality) {
        const altList = PROGRESSIONS[bMod.tonality] || [];
        if (altList.length) {
          const newProg = altList[Math.floor(Math.random() * altList.length)];
          baseByLabel[bridgeLabel] = { ...baseByLabel[bridgeLabel], progression: newProg,
                                        repeats: this._repeatsFor(newProg) };
        }
      }
      baseByLabel[bridgeLabel] = {
        ...baseByLabel[bridgeLabel],
        keyPc: bMod.keyPc, tonality: bMod.tonality, modName: bMod.name,
      };
    }

    // Build final section array — clone each base by label, applying
    // the final-A lift to the LAST section if it's A and qualifies.
    const lastIdx = letters.length - 1;
    const aCount = letters.filter(l => l === 'A').length;
    const sections = letters.map((lab, i) => {
      const base = { ...baseByLabel[lab] };
      const isFinalLiftedA = (i === lastIdx) && (lab === 'A') && (aCount > 1) && !!finalALift;
      if (isFinalLiftedA) {
        return { ...base, keyPc: finalALift.keyPc, tonality: finalALift.tonality, modName: finalALift.name };
      }
      return base;
    });

    // Pre-assign voicingType + bassPattern PER SECTION so playback is deterministic
    // (and the Real Book strip's lookahead can show the exact voicings that'll play).
    // Sections sharing the same identity (same A reused twice) keep the same type.
    // Voicing pick is now progression-aware (per PROGRESSION_VOICING) and
    // applies a continuity bonus from the previous section so AABA flows
    // texturally instead of jumping families at random.
    const typeByLabel = {};
    const bassByLabel = {};
    let prevType = null;
    let prevLabel = null;
    return sections.map(s => {
      const key = s.label + (s.modName || '');
      if (typeByLabel[key] === undefined) {
        const progName = s.progression && s.progression.name;
        const sameIdentity = (prevLabel === key);
        typeByLabel[key] = this._pickVoicingType({
          progName,
          prevType,
          sameIdentity,
        });
      }
      if (bassByLabel[key] === undefined) bassByLabel[key] = this._pickBassPattern();
      prevType = typeByLabel[key];
      prevLabel = key;
      return { ...s, voicingType: typeByLabel[key], bassPattern: bassByLabel[key] };
    });
  }

  // Rebuild a song from state._capturedSong's per-section cells, preserving
  // the original AI structure (AABA/ABAB/etc.), repeats and modulations.
  // Honors live state.songStructure changes (user picks a new shape via the
  // AABA dashboard picker) by adding AI-picked sections for any new labels.
  _generateFromCaptured() {
    if (typeof _syncCapturedFromCompose === 'function') _syncCapturedFromCompose();
    const cap = state._capturedSong;
    const desiredStruct = (typeof _resolveSongStructure === 'function')
      ? _resolveSongStructure(state.songStructure || cap.structureStr)
      : (state.songStructure || cap.structureStr);
    cap.structureStr = desiredStruct;
    this._homeKey = cap.homeKey ? { ...cap.homeKey } : { keyPc: state.keyPc, tonality: state.tonality };
    const map = currentMap();
    // Self-contained forms (BLUES, JAZZ_BLUES) are ONE labeled section, not
    // a letter sequence — don't split them character-by-character.
    const structDef = (typeof SONG_STRUCTURES !== 'undefined')
      ? SONG_STRUCTURES.find(s => s.id === desiredStruct) : null;
    const isSelfContained = !!(structDef && structDef.formType);
    const structureLabels = isSelfContained
      ? [desiredStruct]
      : desiredStruct.split('');
    // Purge any letter-split pollution from earlier capture passes (a prior
    // bug split 'BLUES' into B/L/U/E/S sections — drop those phantoms).
    if (isSelfContained) {
      cap.uniqueLabels = cap.uniqueLabels.filter(l => l === desiredStruct);
      for (const k of Object.keys(cap.sections)) {
        if (k !== desiredStruct) delete cap.sections[k];
      }
      if (!cap.uniqueLabels.length) cap.uniqueLabels.push(desiredStruct);
    }
    // Grow cap.sections for any structure label we haven't captured yet.
    for (const lab of [...new Set(structureLabels)]) {
      if (cap.sections[lab]) continue;
      const usedNames = Object.values(cap.sections).map(s => s.progName).filter(Boolean);
      const role = lab === 'A' ? 'A' : (lab === 'B' ? 'B' : 'C');
      const picked = this._pickProgression(usedNames[0], role);
      if (!picked) continue;
      const stub = {
        label: lab,
        progression: picked,
        voicingType: this._pickVoicingType({ progName: picked.name }),
        bassPattern: this._pickBassPattern(),
        repeats: this._repeatsFor(picked),
      };
      const cells = _captureSectionAsCells(stub);
      cap.sections[lab] = {
        cells,
        originalSig: JSON.stringify(cells),
        progName: picked.name,
        voicingType: stub.voicingType,
        bassPattern: stub.bassPattern,
        repeats: stub.repeats,
      };
      if (!cap.uniqueLabels.includes(lab)) cap.uniqueLabels.push(lab);
    }
    if (typeof _reloadCapturedStrip === 'function') _reloadCapturedStrip({ keepActive: true });
    const buildSection = (label) => {
      const sec = cap.sections[label];
      const steps = [];
      for (const c of (sec.cells || [])) {
        const prev = steps.length ? steps[steps.length - 1] : null;
        if (c._silent) {
          if (prev && prev._silent) prev.bars++;
          else steps.push({ chord: null, bars: 1, roman: '', _silent: true });
          continue;
        }
        if (prev && !prev._silent && prev.chord === c.chord && c._tie) {
          prev.bars++;
        } else {
          steps.push({
            chord: c.chord,
            bars: 1,
            roman: (map.chordDefs[c.chord] && map.chordDefs[c.chord].roman) || c.chord,
            composedShape: c.shape,
            subdivisions: c.subdivisions || 1,
            subdivMute: c.subdivMute ? [...c.subdivMute] : [],
            slots: c.slots ? c.slots.map(sl => sl ? {...sl} : null) : null,
          });
        }
      }
      const sectionLen = steps.reduce((n, s) => n + (s.bars || 1), 0) || 1;
      const baseName = sec.progName || `Section ${label}`;
      const edited = sec.originalSig !== undefined && JSON.stringify(sec.cells || []) !== sec.originalSig;
      const progName = edited ? `${baseName} (edited)` : baseName;
      return {
        label,
        progression: { name: progName, len: sectionLen, steps },
        repeats: sec.repeats || 1,
        voicingType: sec.voicingType || 'drop2',
        bassPattern: sec.bassPattern || this._pickBassPattern(),
        keyPc: sec.keyPc,
        tonality: sec.tonality,
        modName: sec.modName,
      };
    };
    return structureLabels.map(lab => buildSection(lab));
  }

  // If the user pressed Edit and selected a bar, advance songIdx/stepIdx so
  // playback resumes at that bar (snapped to the start of the held chord if
  // they tapped a tie cell). No-op outside captured-song mode.
  _applyCapturedStartPosition() {
    if (!this.song || !this.song.length) return;
    let cellIdx = state.composedSelectedIdx;
    if (cellIdx == null || cellIdx < 0) cellIdx = state._composeFocusedIdx;
    // No active selection → just-typed Play or AI-only Play. Leave the song
    // position alone so playback starts from bar 0.
    if (cellIdx == null || cellIdx < 0) return;
    const cap = state._capturedSong;
    const seq = state.composedProgression;
    let targetLabel, cellInSection, sectionAbsStart;
    if (cap) {
      if (cap.mode === 'dense') {
        const aLab = cap.uniqueLabels[0], bLab = cap.uniqueLabels[1];
        const aLen = cap.sections[aLab].cells.length;
        if (cellIdx < aLen) {
          targetLabel = aLab;   cellInSection = cellIdx;          sectionAbsStart = 0;
        } else {
          targetLabel = bLab;   cellInSection = cellIdx - aLen;   sectionAbsStart = aLen;
        }
      } else if (cap.boundaries && cap.boundaries.length) {
        // Stacked: the strip concatenates every unique section, so the cellIdx
        // could live in any of them. Find the section whose [start, start+len)
        // range contains the click and rebase cellInSection accordingly.
        // Without this, a click in section B walked through section A's steps
        // until it ran out and stuck on A's last chord.
        let bnd = cap.boundaries[0];
        for (const b of cap.boundaries) {
          if (cellIdx >= b.start && cellIdx < b.start + b.len) { bnd = b; break; }
        }
        targetLabel = bnd.label;
        cellInSection = cellIdx - bnd.start;
        sectionAbsStart = bnd.start;
      } else {
        targetLabel = cap.activeLabel;
        cellInSection = cellIdx;
        sectionAbsStart = 0;
      }
    } else if (seq && seq.length) {
      // Compose-only (no AI capture): _generateSong slices composedProgression
      // into A (cells 0-7) and B (8-15). Only fires when the user explicitly
      // tapped a cell — composeAddChord clears _composeFocusedIdx so plain
      // Play after typing skips this and starts from bar 0 as before.
      if (cellIdx < 8) {
        targetLabel = 'A'; cellInSection = cellIdx;     sectionAbsStart = 0;
      } else {
        targetLabel = 'B'; cellInSection = cellIdx - 8; sectionAbsStart = 8;
      }
    } else {
      return;
    }
    const targetSongIdx = this.song.findIndex(s => s.label === targetLabel);
    if (targetSongIdx < 0) return;
    const steps = this.song[targetSongIdx].progression.steps || [];
    if (!steps.length) return;
    let cellsConsumed = 0;
    let targetStepIdx = steps.length - 1;
    for (let i = 0; i < steps.length; i++) {
      const bars = steps[i].bars || 1;
      if (cellsConsumed + bars > cellInSection) { targetStepIdx = i; break; }
      cellsConsumed += bars;
    }
    this.songIdx = targetSongIdx;
    this.currentStepIdx = targetStepIdx;
    this.barsRemaining = steps[targetStepIdx].bars || 1;
    this.forceTriggerAtNextBar = true;
    // Page-align totalBars to the absolute strip position where the clicked
    // chord starts (snapped to chord head if the click landed on a tie). This
    // keeps the chord at its native 4-bar page slot instead of snapping to
    // cells[0]. _buildPagePlan reads composedProgression to fill the slots
    // before barInPage with the prior strip cells.
    this.totalBars = sectionAbsStart + cellsConsumed;
    if (typeof this._applySectionKey === 'function') this._applySectionKey();
  }

  // Apply the key/tonality of the current section. Called when songIdx advances.
  _applySectionKey() {
    const section = this._currentSection();
    if (!section) return;
    const targetPc       = section.keyPc       !== undefined ? section.keyPc       : this._homeKey.keyPc;
    const targetTonality = section.tonality    !== undefined ? section.tonality    : this._homeKey.tonality;
    if (state.keyPc === targetPc && state.tonality === targetTonality) return;
    state.keyPc = targetPc;
    state.tonality = targetTonality;
    // Voicings are cached per chord-ID — but now the chord-IDs may differ AND the
    // roots have changed even where IDs stay the same. Reset everything.
    state.progressionVoicings = {};
    state.userVoicing = null;
    this.previousShape = null;
    // Snap focused chord to the new tonality's tonic if the old one no longer exists
    if (!currentMap().chordDefs[state.focusedChord]) {
      state.focusedChord = (targetTonality === 'major') ? 'I' : 'i';
    }
    renderAll();
  }

  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.previousShape = null;
    this.song = this._generateSong();
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = this._currentStep().bars;
    this.totalBars = 0;
    // After Edit on an AI song: jump to the cell the user had selected so
    // playback resumes where they were listening, not from bar 0.
    // _applyCapturedStartPosition may overwrite totalBars to the absolute
    // strip position of the clicked chord — must run AFTER the totalBars=0
    // reset above so that override actually sticks.
    this._applyCapturedStartPosition();
    // _applyCapturedStartPosition sets forceTriggerAtNextBar=true (needed
    // for paused-jump→resume flow). But in start()'s flow the count-in
    // already fires the first chord — leaving force-trigger on makes the
    // next scheduler tick fire the same chord AGAIN (audible double-strike
    // on bar 1). Mirror resume()'s explicit reset.
    this.forceTriggerAtNextBar = false;
    // Read voicingType + bassPattern from the section (pre-assigned at song generation)
    this.voicingType = this._currentSection().voicingType || this._pickVoicingType();
    this.bassPattern = this._currentSection().bassPattern || this._pickBassPattern();
    this._cachedPage = null;
    // Reset the per-progression voicing cache so cards revert to default until played
    state.progressionVoicings = {};

    const wasMetronomePlaying = metronome.playing;
    // Defensive: if the metronome's playing flag is set but its
    // scheduler may have been zombified (no timer, suspended audio
    // context, etc.), force a clean restart whenever the user hits
    // play. Cheap and avoids "drums went silent" mystery cases.
    if (currentRhythmMode !== 'off') {
      if (metronome.playing) metronome.stop();
      metronome.start();
      updateRhythmBtn();
    }
    updateBlinkRate();

    // Sync the first bar with the metronome's next downbeat so they line up
    let firstBarStart;
    if (wasMetronomePlaying) {
      const downbeat = metronome.nextDownbeatTime();
      firstBarStart = (downbeat !== null && downbeat > ctx.currentTime + 0.05)
        ? downbeat
        : ctx.currentTime + 0.08;
    } else {
      firstBarStart = ctx.currentTime + 0.08;
    }

    // Count-in: 4 ticks of the metronome before the first chord enters. Lets
    // the user feel the tempo and "come in" with the band.
    const beatDur = 60 / metronome.bpm;
    const COUNT_IN_BEATS = 4;
    firstBarStart += COUNT_IN_BEATS * beatDur;

    this.nextBarTime = firstBarStart;
    this._countInUntil = firstBarStart;            // scheduler treats this as dormant

    // Pre-paint the first chord's voicing on the neck / piano BEFORE
    // the count-in starts — otherwise the previews would show the
    // notes from whatever was last focused, until the chord actually
    // triggers a beat or two later. We don't START the audio here,
    // we just publish the upcoming chord's shape into the same state
    // fields _triggerChord uses, so the visualization is instantly
    // correct.
    this._buildPagePlan();
    const firstEntry = this._cachedPage && this._cachedPage[0];
    if (firstEntry && firstEntry.shape && firstEntry.chord) {
      state.playerVoicing = {
        chord: firstEntry.chord,
        shape: firstEntry.shape,
        type:  firstEntry.voicingType || this.voicingType,
      };
      state.focusedChord = firstEntry.chord;
      this.previousShape = firstEntry.shape;
    }
    this._updateVisuals();

    // Save the precise downbeat target so the scheduler can fire chord 1 itself
    // (no setTimeout race with the 120 ms look-ahead window).
    this._firstChordAt = firstBarStart;

    this.timer = setInterval(() => this._scheduler(), 30);
    startBeatCounterLoop();
    this.paused = false;
  }

  // Rewind position to the very beginning of the song without
  // touching the playback state. If playing, the next bar will
  // re-trigger from songIdx=0 / step 0; if paused, resume() will
  // do so on the next tap.
  rewind() {
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.totalBars = 0;
    this._cachedPage = null;
    this._cachedPeek = null;
    // Reset the voice-leading chain too — otherwise _pickShape would
    // anchor the rewound first chord on whatever shape was last
    // played, producing a different voicing than the user got when
    // they originally hit play (which started with prevShape=null).
    this.previousShape = null;
    state.progressionVoicings = {};
    const step = this._currentStep();
    if (step) this.barsRemaining = step.bars;
    // If currently playing, schedule the re-trigger at the next bar
    // boundary so the song restarts cleanly in time.
    if (this.playing) this.forceTriggerAtNextBar = true;
    // Pre-paint the first chord's voicing on the neck/piano so the
    // user sees the rewound chord immediately (same trick used by
    // start()'s pre-paint).
    this._buildPagePlan();
    const firstEntry = this._cachedPage && this._cachedPage[0];
    if (firstEntry && firstEntry.shape && firstEntry.chord) {
      state.playerVoicing = {
        chord: firstEntry.chord,
        shape: firstEntry.shape,
        type:  firstEntry.voicingType || this.voicingType,
      };
      state.focusedChord = firstEntry.chord;
      this.previousShape = firstEntry.shape;
    }
    this._updateVisuals();
  }

  // Pause WITHOUT clearing position: halts the scheduler and silences
  // audio, but keeps songIdx / currentStepIdx / barsRemaining intact so
  // resume() can pick up exactly where we left off.
  pause() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
    this.paused = true;
    chordDrone.stop();
    this.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    this.bassOscillators = [];
    if (this._subdivTimers) {
      this._subdivTimers.forEach(t => clearTimeout(t));
      this._subdivTimers = [];
    }
    // Pause the rhythm too — remember whether it was playing so
    // resume() can bring it back in the same on/off state.
    this._metronomeWasOn = metronome.playing;
    if (metronome.playing) {
      metronome.stop();
      if (typeof updateRhythmBtn === 'function') updateRhythmBtn();
    }
    // Reset barsRemaining to the full duration of the current chord
    // so resume() replays it from the top instead of finishing mid-bar.
    const step = this._currentStep();
    if (step) this.barsRemaining = step.bars;
    // When pausing while a composition is driving the AI, select the
    // current chord in the compose strip so the user can immediately
    // edit it — same selection state they'd get from clicking the cell.
    const curChord = this._currentChordId();
    if (curChord && state.composedProgression && state.composedProgression.length) {
      const idx = (this.currentStepIdx >= 0
                   && this.currentStepIdx < state.composedProgression.length
                   && state.composedProgression[this.currentStepIdx]?.chord === curChord)
        ? this.currentStepIdx
        : state.composedProgression.findIndex(c => c.chord === curChord);
      if (idx >= 0) {
        state.composedSelectedIdx = idx;
        state._composedSelectedLocked = false;  // pause auto-select, not user lock
        state._composeFocusedIdx  = idx;
        state.focusedChord = curChord;
        const cell = state.composedProgression[idx];
        if (cell && cell.shape) {
          state.userVoicing = {
            shape: cell.shape,
            type: cell.voicingType,
            stringSetIdx: cell.stringSetIdx,
            inversion: cell.inversion,
            stringSet: cell.stringSet,
          };
        }
      }
    }
    this._updateVisuals();
  }

  // Resume from a paused state — re-arm the scheduler using the saved
  // song position. If we were never playing/paused, falls back to a
  // fresh start so the button always does something sensible.
  resume() {
    if (this.playing) return;
    if (!this.paused) { this.start(); return; }
    const ctx = ensureAudio();
    this.playing = true;
    this.paused = false;
    // Do NOT invalidate _cachedPage here — when the user clicked a
    // different cell while paused, the cache is exactly what we
    // want to play (cells[barInPage] = the clicked chord/shape).
    // Wiping it and rebuilding from the new (songIdx, stepIdx)
    // would place the clicked chord at cells[0] but barInPage is
    // still i, so the player would trigger cells[i] of the new
    // walk — i bars in the future. Trust the cache.
    // Bring the metronome back if it was running when we paused, and
    // sync the bar to its next downbeat so chord 1 lands clean.
    if (this._metronomeWasOn) {
      metronome.start();
      if (typeof updateRhythmBtn === 'function') updateRhythmBtn();
    }
    const beatDur = 60 / metronome.bpm;
    let firstBar;
    if (metronome.playing) {
      const downbeat = metronome.nextDownbeatTime();
      firstBar = (downbeat !== null && downbeat > ctx.currentTime + 0.05)
        ? downbeat
        : ctx.currentTime + 0.08;
    } else {
      firstBar = ctx.currentTime + 0.08;
    }
    this.nextBarTime    = firstBar;
    this._countInUntil  = firstBar;
    this._firstChordAt  = firstBar;
    // NO forceTriggerAtNextBar — the count-in branch above already
    // fires the resumed chord once at firstBar. Setting force-trigger
    // here makes the very next scheduler tick fire AGAIN, audibly
    // playing the chord twice ("count-in" effect).
    this.forceTriggerAtNextBar = false;
    this._updateVisuals();
    this.timer = setInterval(() => this._scheduler(), 30);
    startBeatCounterLoop();
  }

  stop() {
    if (!this.playing && !this.paused) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
    this.paused = false;
    chordDrone.stop();
    // Stop any pending bass plucks
    this.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    this.bassOscillators = [];
    // Cancel any in-flight rhythm-subdivision re-strikes
    if (this._subdivTimers) {
      this._subdivTimers.forEach(t => clearTimeout(t));
      this._subdivTimers = [];
    }
    this.currentBarSlot = 0;
    state.playerVoicing = null;
    state.nextVoicing = null;
    state.progressionVoicings = {};
    this._upcomingType = null;
    this.forceTriggerAtNextBar = false;
    // Restore home key if we stopped during a modulated section
    if (this._homeKey && (state.keyPc !== this._homeKey.keyPc || state.tonality !== this._homeKey.tonality)) {
      state.keyPc = this._homeKey.keyPc;
      state.tonality = this._homeKey.tonality;
      renderAll();
    }
    document.querySelectorAll('.map-card.playing, .map-card.next-up, .map-card.about-to-start').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start');
    });
    // Rescue the MIDI export wrap before wiping innerHTML — otherwise
    // it gets destroyed on stop and the next play+_updateVisuals can't
    // find it to reattach (button disappears until tab reload).
    const _piEl = document.getElementById('player-info');
    const _midiW = document.getElementById('midi-wrap');
    if (_piEl && _midiW && _piEl.contains(_midiW)) document.body.appendChild(_midiW);
    if (_piEl) _piEl.innerHTML = '';
    document.getElementById('real-book').hidden = true;
    const _tabsHide = document.getElementById('real-book-tabs');
    if (_tabsHide) _tabsHide.hidden = true;
    // If user has a composed progression, re-show the compose strip so they
    // can edit and replay it.
    if (typeof renderComposeStrip === 'function') renderComposeStrip();
    // Hand the green info bar back to compose mode (chord name + voicing).
    if (typeof renderComposeInfo === 'function') renderComposeInfo();
  }

  _scheduler() {
    if (!audioCtx) return;
    // ── Count-in handling ──
    // While the count-in is still in progress, do nothing.
    if (this._countInUntil && audioCtx.currentTime < this._countInUntil - 0.005) return;
    // The count-in just ended — fire the very first chord HERE (in the same
    // tick where the bar boundary is being processed) so we can't race against
    // a setTimeout that may have been throttled by the browser.
    if (this._countInUntil) {
      const fired = this._firstChordAt;
      this._countInUntil = 0;
      this._firstChordAt = 0;
      // nextBarTime is the boundary AT THE END of bar 1
      const barDurNow = (60 / metronome.bpm) * 4;
      this.nextBarTime = fired + barDurNow;
      // Schedule the very first chord exactly at `fired` (audio time).
      this._triggerChord(this._currentChordId(), fired);
      this._updateVisuals();
      return;
    }
    const barDur = (60 / metronome.bpm) * 4;
    if (this.nextBarTime < audioCtx.currentTime + 0.12) {
      // If user jumped, trigger the new chord at THIS bar boundary
      // instead of advancing. Mirrors the count-in fire: we play the
      // current bar without incrementing totalBars — the next normal
      // tick will increment and advance the step naturally. (The
      // earlier version incremented here AND in the next tick, which
      // double-counted and made the player skip the bar after a
      // paused-click jump, producing "wrong chord on page rollover".)
      if (this.forceTriggerAtNextBar) {
        this.forceTriggerAtNextBar = false;
        // The bar that starts NOW lives at this.nextBarTime in audio time.
        this._triggerChord(this._currentChordId(), this.nextBarTime);
        this._updateVisuals();
        this.nextBarTime += barDur;
        return;
      }
      this.totalBars++;
      this.barsRemaining--;
      // Anchored loops (bars-4 or section): snap back to the
      // loopAnchor captured at the moment the user enabled the loop.
      // bars-4 loops the 4 visible strip cells; section loops the
      // current section's bar length (4, 8, 16, whatever).
      const anchorActive = (loopMode === 'bars-4' || loopMode === 'section') && this._loopAnchor;
      const barsLoopLen = anchorActive ? this._loopAnchor.length : 0;
      if (barsLoopLen && this._loopAnchor
          && this.totalBars >= this._loopAnchor.totalBars + barsLoopLen) {
        const a = this._loopAnchor;
        this.totalBars      = a.totalBars;
        this.songIdx        = a.songIdx;
        this.sectionIter    = a.sectionIter;
        this.currentStepIdx = a.stepIdx;
        this.barsRemaining  = this._currentStep().bars;
        this._cachedPage    = null;
        this._cachedPeek    = null;
        // Apply PITCHED cycle on each loop iteration.
        if (cycleMode !== 'none') {
          const step = cycleMode === 'chromatic' ? 1 : 5;
          state.keyPc = (state.keyPc + step) % 12;
          if (this._homeKey) this._homeKey.keyPc = state.keyPc;
          // Update the anchor key too so the loop tracks the shift.
          a.keyPc = state.keyPc;
          state.progressionVoicings = {};
          state.userVoicing = null;
          this.previousShape = null;
          renderAll();
        }
        this._triggerChord(this._currentChordId(), this.nextBarTime);
        this._updateVisuals();
        this.nextBarTime += barDur;
        return;
      }
      if (this.barsRemaining <= 0) {
        // Advance to next step
        this.currentStepIdx++;
        const prog = this._currentProgression();
        if (this.currentStepIdx >= prog.steps.length) {
          // Progression ended — check if we repeat or move to next section
          const section = this._currentSection();
          this.sectionIter++;
          if (this.sectionIter < section.repeats) {
            // Repeat same progression — keep same voicing type
            this.currentStepIdx = 0;
          } else {
            // Move to next section — fresh voicing type for contrast
            this.songIdx++;
            this.sectionIter = 0;
            this.currentStepIdx = 0;
            if (this.songIdx >= this.song.length) {
              if (loopMode === 'song') {
                // Song loop — restart from the top of the same song
                this.songIdx = 0;
                if (cycleMode !== 'none') {
                  const step = cycleMode === 'chromatic' ? 1 : 5;
                  state.keyPc = (state.keyPc + step) % 12;
                  if (this._homeKey) this._homeKey.keyPc = state.keyPc;
                  state.progressionVoicings = {};
                  state.userVoicing = null;
                  this.previousShape = null;
                  renderAll();
                }
              } else {
              // Low-probability "travel" — the new song's home shifts to a
              // musically related key, like a jam session drifting over time.
              if (Math.random() < 0.15) {
                const travel = this._pickModulation(this._homeKey.keyPc, this._homeKey.tonality);
                state.keyPc = travel.keyPc;
                state.tonality = travel.tonality;
                this._travelNote = travel.name;   // surfaces in player-info briefly
              } else {
                // Default: restore home key so we stay anchored
                state.keyPc = this._homeKey.keyPc;
                state.tonality = this._homeKey.tonality;
                this._travelNote = null;
              }
              // Once the composed-seeded AABA has run its course, let the AI
              // wander off — clear the composed seed so the next song is fully
              // random territory.
              if (state.composedProgression && state.composedProgression.length && loopMode === 'off') {
                state.composedProgression = [];
                state._composeIsSingleSection = false;
                state._capturedSong = null;
                state._composeASectionLen = null;
              }
              this.song = this._generateSong();
              this.songIdx = 0;
              }
            }
            // Apply this section's key/tonality (may modulate)
            this._applySectionKey();
            // Read pre-assigned voicingType / bassPattern from the section so playback
            // matches the strip's lookahead exactly. Fallback to random if unassigned.
            const newSection = this._currentSection();
            this.voicingType = newSection.voicingType || this._upcomingType || this._pickVoicingType();
            this._upcomingType = null;
            this.bassPattern = newSection.bassPattern || this._pickBassPattern();
          }
        }
        this.barsRemaining = this._currentStep().bars;
        // Bar starts at this.nextBarTime in audio time — pass it through so
        // chord + subdivisions all schedule sample-accurate relative to it.
        this._triggerChord(this._currentChordId(), this.nextBarTime);
      }
      this._updateVisuals();
      this.nextBarTime += barDur;
    }
  }

  _triggerChord(chordId, barStartTime = null) {
    const map = currentMap();
    const ch = map.chordDefs[chordId];
    if (!ch) {
      // Null chordId = silent rest cell — actually go quiet (don't let the
      // previous chord drone keep ringing through the rest).
      if (chordDrone.playing) chordDrone.stop();
      return;
    }
    const root = (state.keyPc + ch.deg) % 12;
    // Anchor: when this bar's chord should actually sound. Defaults to
    // audioCtx.currentTime for legacy callers (e.g. user-driven jumps).
    const t0 = (barStartTime != null && audioCtx)
      ? Math.max(audioCtx.currentTime, barStartTime)
      : (audioCtx ? audioCtx.currentTime : 0);

    // Make sure the plan covers the current page, and that its entry at our
    // current barInPage matches the chord we're triggering. If not, rebuild.
    this._ensurePagePlan();
    const barInPage = this.totalBars % 4;
    if (!this._cachedPage[barInPage] || this._cachedPage[barInPage].chord !== chordId) {
      this._buildPagePlan();
    }
    const planned = this._cachedPage[barInPage];
    let type = this.voicingType;
    let shape = null;
    if (planned && planned.chord === chordId && planned.shape) {
      shape = planned.shape;
      type = planned.voicingType || type;
    } else {
      // True last-resort fallback (shouldn't happen with the rebuild above)
      const progName = this._currentProgression()?.name;
      const pickOpts = { progName };
      // Honor the step's qualityOverride if any (Jobim's 7#11, jazz blues
      // 7alt, Maiden Voyage 9sus4, etc.). Falls back to canonical quality.
      const stepNow = this._currentStep();
      const eq = effectiveQuality(stepNow, ch);
      shape = this._pickShape(eq, root, type, this.previousShape, pickOpts);
      if (!shape) {
        shape = this._pickShape(eq, root, 'drop2', this.previousShape, pickOpts);
        type = 'drop2';
      }
    }
    if (!shape) return;

    state.focusedChord = chordId;
    state.userVoicing = null;
    state.playerVoicing = { chord: chordId, shape, type };
    // Remember how this chord was played so its map card defaults to this voicing
    // for the rest of the progression — even when it's not the focused/next-up chord.
    state.progressionVoicings[chordId] = { shape, type };
    this.previousShape = shape;

    // Reset the in-bar slot index BEFORE predicting, so the prediction
    // for multi-chord bars starts from slot 0 of the freshly-triggered
    // bar (not from whatever slot we were on at end of previous bar).
    this.currentBarSlot = 0;
    this._predictNextVoicing();

    const notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
    const vol = currentDroneVolume() * 1.8;

    // Rhythmic subdivisions: bar divided into N equal slots. Slot 0 fires
    // AT t0 (the exact bar boundary in audio time). Remaining slots are
    // pre-scheduled with their own audio start times, so even setTimeout
    // jitter can't drift them — the audio engine fires them sample-accurate.
    const subN = (planned && planned.subdivisions) || 1;
    const subMute = (planned && planned.subdivMute) || [];
    if (this._subdivTimers) this._subdivTimers.forEach(t => clearTimeout(t));
    this._subdivTimers = [];
    const barDur = (60 / metronome.bpm) * 4;

    // Multi-chord bar: per-slot voicings live on planned.slots. When at
    // least two slots carry different chord IDs we use slot[s].shape for
    // each slot's strike (instead of repeating `notes`, which is slot 0).
    // Same-chord slots (single-chord cells with rhythmic subdivisions)
    // skip this branch — `notes` is already correct for every slot.
    const slotsArr = (planned && planned.slots && planned.slots.length === subN) ? planned.slots : null;
    // Slots are the source of truth: if the cell has them, use per-slot
    // shapes for playback regardless of whether chord IDs match between
    // slots. Same-chord-different-inversion bars need per-slot voicings.
    const slotsAreMulti = !!slotsArr;
    const notesForSlot = (s) => {
      if (!slotsAreMulti) return notes;
      const sl = slotsArr[s];
      if (!sl || !sl.shape) return notes;
      return sl.shape.map((f, st) => f >= 0 ? STRING_OPEN_MIDI[st] + f : null).filter(x => x !== null);
    };

    // Force re-attack: _triggerChord is only called at a NEW step boundary,
    // so even if the chord/voicing matches the previous step the strike fires
    // again. Continuations (bars > 1 in one step) never reach this path.
    this.currentBarSlot = 0;
    if (!(subN > 1 && subMute[0])) {
      chordDrone.start(notesForSlot(0), vol, true, t0);
    }

    if (subN > 1 && audioCtx) {
      for (let s = 1; s < subN; s++) {
        if (subMute[s]) continue;
        const slotAudioTime = t0 + (s / subN) * barDur;
        // Wake up ~30 ms before the slot so Drone.start has time to wire up
        // oscillators, then it schedules the actual strike AT slotAudioTime.
        const wallWait = Math.max(0, (slotAudioTime - audioCtx.currentTime) * 1000 - 30);
        const fireAt = slotAudioTime;
        const slotNotes = notesForSlot(s);
        const slotIdx  = s;
        const tid = setTimeout(() => {
          // ─── PHASE 1: audio + state (sync, cheap, gets out of the way) ───
          // Schedule the slot's audio strike FIRST and synchronously so the
          // AudioContext queue doesn't get held up by main-thread paints.
          chordDrone.start(slotNotes, vol, true, fireAt);
          if (!slotsAreMulti) return;   // rhythmic subdivisions: no visual work
          this.currentBarSlot = slotIdx;
          // Update state.playerVoicing to the slot's own chord+shape so the
          // realistic guitar neck animates the in-bar change. State writes
          // are essentially free; the heavy DOM work below is what we defer.
          const sl = slotsArr[slotIdx];
          if (sl && sl.chord && sl.shape) {
            state.playerVoicing = {
              chord: sl.chord,
              shape: sl.shape,
              type: sl.voicingType || (state.playerVoicing && state.playerVoicing.type) || 'drop2',
            };
            state.focusedChord = sl.chord;
          }
          // ─── PHASE 2: visual repaints (deferred to next frame) ───
          // requestAnimationFrame batches the chord-map rebuild, fretboard,
          // chord-neck, and piano repaint onto the next browser paint pass —
          // the main thread returns immediately after audio scheduling, so
          // subsequent audio events (the NEXT slot's setTimeout, sample-
          // accurate drone notes) aren't blocked by 10-30ms of DOM work.
          // The visible change still lands within ~one frame (≤16 ms), so
          // the in-bar animation feels just as tight as before.
          requestAnimationFrame(() => {
            this._predictNextVoicing();
            if (typeof this._updateVisuals === 'function') this._updateVisuals();
            if (typeof repaintChordNeckNotes === 'function') repaintChordNeckNotes();
            if (typeof paintPianoNotes === 'function') paintPianoNotes();
          });
        }, wallWait);
        this._subdivTimers.push(tid);
      }
    }
    // For multi-chord bars: also schedule a delayed first refresh at t=0
    // so the slot-0 chord paints immediately at bar start (without it the
    // dashboard would still show the previous bar's last slot until the
    // first per-slot timer fires).
    if (slotsAreMulti && typeof this._updateVisuals === 'function') {
      this.currentBarSlot = 0;
      // rAF instead of setTimeout(0) — same "next frame" timing but lets
      // the browser batch with other paints and frees the JS thread to
      // schedule the rest of this trigger's audio first.
      requestAnimationFrame(() => this._updateVisuals());
    }

    // Schedule bass plucks per the current section's bass pattern
    if (isBassEnabled() && audioCtx && this._currentStep()) {
      const stepBars = this._currentStep().bars;
      const beatDur = 60 / metronome.bpm;
      const barDur = beatDur * 4;
      const now = audioCtx.currentTime + 0.04;
      const bassVol = chVol('bass') * 0.75;
      const pattern = this.bassPattern;
      const rootAtSlot = (s) => {
        if (!slotsAreMulti) return root;
        const sl = slotsArr[s];
        if (!sl || !sl.chord) return root;
        const sCh = map.chordDefs[sl.chord];
        if (!sCh) return root;
        return (state.keyPc + sCh.deg) % 12;
      };
      if (slotsAreMulti) {
        // Multi-chord: every non-muted slot gets its OWN bass anchor.
        // The user explicitly placed a chord change at each slot, so the
        // bass should follow each change instead of only hitting beats 1/3.
        const slotDur = barDur / subN;
        for (let s = 0; s < subN; s++) {
          if (subMute[s]) continue;
          const sBass = bassMidiForPc(rootAtSlot(s));
          const o = playBassPluck(sBass, now + s * slotDur, bassVol);
          this.bassOscillators.push(...o);
        }
        // Continuation bars (rare for multi-chord since slots live in one
        // bar) — fall back to whole-bar root of slot 0.
        const baseBass = bassMidiForPc(rootAtSlot(0));
        for (let b = 1; b < stepBars; b++) {
          const barStart = now + b * barDur;
          const o = playBassPluck(baseBass, barStart, bassVol);
          this.bassOscillators.push(...o);
        }
      } else {
        // Single-chord cell — existing pattern (whole / two-feel / fifth)
        const bassMidi  = bassMidiForPc(root);
        const fifthMidi = bassMidi + 7;
        for (let b = 0; b < stepBars; b++) {
          const barStart = now + b * barDur;
          const o1 = playBassPluck(bassMidi, barStart, bassVol);
          this.bassOscillators.push(...o1);
          if (pattern === 'two-feel') {
            const o3 = playBassPluck(bassMidi, barStart + 2 * beatDur, bassVol);
            this.bassOscillators.push(...o3);
          } else if (pattern === 'fifth') {
            const o3 = playBassPluck(fifthMidi, barStart + 2 * beatDur, bassVol * 0.9);
            this.bassOscillators.push(...o3);
          }
        }
      }
    }
  }

  _predictNextVoicing() {
    // Multi-chord bars: if there's another slot AFTER the one currently
    // sounding, preview that slot's chord/shape instead of the next bar.
    // The user sees the imminent in-bar change ghosted on the realistic
    // guitar / piano, not a chord that won't sound for another beat or
    // two. Falls through to the normal bar-level prediction when this is
    // the last (non-muted) slot of the bar.
    {
      this._ensurePagePlan();
      const barInPage = this.totalBars % 4;
      const planned = this._cachedPage?.[barInPage];
      const subN = planned?.subdivisions || 1;
      const slotsArr = (planned && planned.slots && planned.slots.length === subN) ? planned.slots : null;
      if (slotsArr && slotsArr.length >= 2) {
        const subMute = planned.subdivMute || [];
        const curSlotIdx = Math.min(slotsArr.length - 1, this.currentBarSlot || 0);
        for (let s = curSlotIdx + 1; s < slotsArr.length; s++) {
          if (subMute[s]) continue;
          const sl = slotsArr[s];
          if (sl && sl.chord && sl.shape) {
            state.nextVoicing = {
              chord: sl.chord,
              shape: sl.shape,
              type: sl.voicingType || this.voicingType,
            };
            return;
          }
        }
        // Last non-muted slot of the bar — fall through to next-bar logic.
      }
    }
    const nxtId = this._nextChordId();
    if (!nxtId || !state.playerVoicing?.shape) { state.nextVoicing = null; return; }

    // Determine the voicing type the next chord will use, AND which
    // section's key/tonality we should look up against. If the next
    // chord starts a new section, pre-pick that section's type AND
    // pull its keyPc + tonality so the preview reflects modulations
    // instead of computing the chord's root from the OLD section's
    // key and looking up its def in the OLD tonality's map. That was
    // the bug behind the "key change doesn't show up in the preview"
    // report — at the section boundary the next chord was being
    // rendered in the current key, then re-rendered correctly only
    // once the bar actually advanced.
    let nextType = this.voicingType;
    let nxtKeyPc    = state.keyPc;
    let nxtTonality = state.tonality;
    const prog = this._currentProgression();
    const isLastStepOfProg = this.currentStepIdx + 1 >= prog.steps.length;
    if (isLastStepOfProg) {
      const section = this._currentSection();
      const isLastIter = this.sectionIter + 1 >= section.repeats;
      if (isLastIter) {
        if (!this._upcomingType) this._upcomingType = this._pickVoicingType();
        nextType = this._upcomingType;
        const nextSection = this.song[(this.songIdx + 1) % this.song.length];
        if (nextSection) {
          if (nextSection.keyPc    !== undefined) nxtKeyPc    = nextSection.keyPc;
          if (nextSection.tonality !== undefined) nxtTonality = nextSection.tonality;
        }
      }
    }

    // Look up the chord def in the TARGET section's tonality map (not
    // currentMap()). When crossing a modulation, the next chord ID may
    // not exist in the current tonality's map at all (e.g. minor-only
    // IDs after a major→minor flip), and even when it does exist its
    // deg might differ between maps.
    const nxtMap = (typeof CHORD_MAP !== 'undefined' && CHORD_MAP[nxtTonality])
      ? CHORD_MAP[nxtTonality] : currentMap();
    const nxtCh = nxtMap.chordDefs[nxtId];
    if (!nxtCh) { state.nextVoicing = null; return; }
    // Use the page plan if it has the next chord — same source of truth the
    // strip displays and the trigger reads. Falls back to a fresh pick if the
    // next chord is past the plan (rare) or no plan exists yet. The page
    // plan already stores per-cell keyPc, so this branch is modulation-safe.
    const barInPage = this.totalBars % 4;
    const planEntries = [...(this._cachedPage || []), this._cachedPeek].filter(Boolean);
    const plannedNext = planEntries.find((e, i) => i > barInPage && e.chord === nxtId);
    if (plannedNext) {
      state.nextVoicing = { chord: nxtId, shape: plannedNext.shape, type: plannedNext.voicingType || nextType };
      return;
    }
    const nxtRoot = (nxtKeyPc + nxtCh.deg) % 12;
    const nxtShape = this._pickShape(nxtCh.quality, nxtRoot, nextType, state.playerVoicing.shape);
    state.nextVoicing = nxtShape ? { chord: nxtId, shape: nxtShape, type: nextType } : null;
  }

  _updateVisuals() {
    const flats = useFlatsFor(state.keyPc);
    // Display IDs follow the active SLOT inside multi-chord bars; for
    // single-chord bars they fall through to the bar-level chord. The
    // trigger / scheduling path still uses _currentChordId so audio stays
    // bar-aligned — only what the user SEES (highlighted card, dashboard
    // name, next-up) advances per slot.
    const curId = this._currentDisplayChordId();
    const nxtId = this._nextDisplayChordId();

    // Re-render the chord map so each card's mini-fretboard reflects the latest voicing
    // (the focused chord uses state.playerVoicing; others recompute smoothest from it)
    renderChordMap();

    // Build a set of chord IDs that appear in the CURRENT section's progression.
    // Updates at A→B transitions so the dot/dim reflects the immediate context.
    const progressionChordIds = new Set();
    this._currentSection()?.progression?.steps?.forEach(step => progressionChordIds.add(step.chord));

    // Re-apply playing / next-up / in-progression classes (renderChordMap creates fresh cards)
    const isLastBar = this.barsRemaining === 1;
    document.querySelectorAll('.map-card').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start', 'in-progression');
      if (progressionChordIds.has(c.dataset.chord)) c.classList.add('in-progression');
      if (c.dataset.chord === curId) c.classList.add('playing');
      else if (c.dataset.chord === nxtId) {
        c.classList.add('next-up');
        if (isLastBar) {
          void c.offsetWidth;
          c.classList.add('about-to-start');
        }
      }
    });
    // Render temporary popup cards for chords that exist in chordDefs but
    // not on the map (V/iii, iiø, bIIImaj7, etc.). They appear one bar
    // ahead (yellow next-up) and transition to playing-green when their
    // bar starts, with a connector arrow to their resolvesTo target.
    if (typeof _renderPopupCards === 'function') {
      _renderPopupCards(curId, nxtId, isLastBar);
    }
    // Quality-override badge on existing map cards: when the playing
    // chord uses an altered quality (bII7 → 7#11, V → 7alt, etc.), a
    // small badge in the corner shows the alteration. Lets the user
    // know that "bII7" is currently sounding as bII7#11 without
    // creating a separate chord ID.
    document.querySelectorAll('.map-card .mc-quality-badge').forEach(el => el.remove());
    const curStepNow = this._currentStep();
    if (curStepNow && curStepNow.qualityOverride) {
      const card = document.querySelector(`.map-card[data-chord="${curId}"]`);
      if (card) {
        const badge = document.createElement('span');
        badge.className = 'mc-quality-badge';
        badge.textContent = QUALITIES[curStepNow.qualityOverride].sfx;
        card.appendChild(badge);
      }
    }

    const map = currentMap();
    const curStep = this._currentStep();
    const curCh = map.chordDefs[curId];
    // Resolve which section the NEXT chord actually lives in. At the last
    // step of the last iteration of the current section, the next chord
    // crosses into the next section — which may carry a different keyPc
    // and tonality. Looking the chord up in currentMap() with state.keyPc
    // (the OLD section's values) was painting the preview in the old key
    // until the bar actually advanced.
    const _curProg = this._currentProgression();
    const _curSection = this._currentSection();
    const _isLastStepOfProg = _curProg && (this.currentStepIdx + 1 >= _curProg.steps.length);
    const _isLastIter = _curSection && (this.sectionIter + 1 >= _curSection.repeats);
    const _crossingToNextSection = _isLastStepOfProg && _isLastIter;
    const _nextSection = _crossingToNextSection
      ? this.song[(this.songIdx + 1) % this.song.length] : null;
    const nxtKeyPc = (_nextSection && _nextSection.keyPc    !== undefined) ? _nextSection.keyPc    : state.keyPc;
    const nxtTonality = (_nextSection && _nextSection.tonality !== undefined) ? _nextSection.tonality : state.tonality;
    const _nxtMap = (typeof CHORD_MAP !== 'undefined' && CHORD_MAP[nxtTonality])
      ? CHORD_MAP[nxtTonality] : map;
    const nxtCh = nxtId ? _nxtMap.chordDefs[nxtId] : null;
    // Honor step qualityOverride so the dashboard chord name reflects the
    // alteration that's actually sounding (e.g. C7#11 instead of plain C7).
    // When crossing to the next section, pull its first step's override;
    // otherwise read from the current progression.
    const nxtStep = _crossingToNextSection
      ? (_nextSection && _nextSection.progression && _nextSection.progression.steps && _nextSection.progression.steps[0])
      : (curStep && _curProg ? _curProg.steps[(this.currentStepIdx + 1) % _curProg.steps.length] : null);
    const curEffQ = effectiveQuality(curStep, curCh);
    const nxtEffQ = effectiveQuality(nxtStep, nxtCh);
    const curRoot = curCh ? (state.keyPc + curCh.deg) % 12 : 0;
    const nxtRoot = nxtCh ? (nxtKeyPc + nxtCh.deg) % 12 : 0;
    // Live shape for current chord — drops the 7 from the name when the
    // sounding voicing is a triad. Next chord has no shape yet, so its
    // name stays canonical.
    const curLiveShape = (state.playerVoicing && state.playerVoicing.chord === curId)
      ? state.playerVoicing.shape : null;
    const curName = curCh
      ? (chordNameForVoicing(curEffQ, curRoot, curLiveShape, flats)
         || (nameOf(curRoot, flats) + QUALITIES[curEffQ].sfx))
      : '';
    // When crossing into a new key, the next chord's name should be spelled
    // with THAT key's flat/sharp convention (Bb in F major, A# in B major)
    // rather than inheriting the current section's spelling.
    const nxtFlats = (nxtKeyPc !== state.keyPc) ? useFlatsFor(nxtKeyPc) : flats;
    const nxtName = nxtCh ? (nameOf(nxtRoot, nxtFlats) + QUALITIES[nxtEffQ].sfx) : '';
    const barsLabel = this.barsRemaining === 1 ? '1 bar' : `${this.barsRemaining} bars`;

    const section = this._currentSection();
    const prog = this._currentProgression();

    // Form segments — AABA as a tiny segmented strip. The current segment is
    // taller and gold; finished sections fade out; upcoming ones sit muted.
    const formHtml = this.song.map((s, i) => {
      let cls = 'pi-form-seg';
      if (i < this.songIdx)       cls += ' done';
      else if (i === this.songIdx) cls += ' now';
      return `<span class="${cls}" data-label="${s.label}"></span>`;
    }).join('');

    // Roman labels are still useful (shows the FUNCTION of the chord in the
    // current key) but live as quiet captions next to the bigger chord name.
    // Prefer the chord def's `roman` (with proper "/" notation for secondaries
    // — V/V, V/ii, iiø/iii) over the internal chord ID (V_V, V_ii) which is
    // ugly and confuses.
    const curRoman = curCh?.roman || curStep?.chord || '';
    const nxtRoman = nxtCh?.roman || nxtId || '';

    const modBadge = section.modName
      ? `<span class="pi-badge mod">↗ ${section.modName}</span>` : '';
    const travelBadge = (this._travelNote && this.songIdx === 0 && this.sectionIter === 0)
      ? `<span class="pi-badge travel">✈ ${this._travelNote}</span>` : '';

    const iterTxt = section.repeats > 1
      ? `<span class="pi-iter">×${this.sectionIter + 1}/${section.repeats}</span>` : '';

    // Friendly voicing label matching the compose-mode info bar.
    const PV_LABEL = { drop2: 'DROP-2', drop3: 'DROP-3', shell: 'SHELLS', triad: 'TRIAD', guide: 'GUIDE', sus: 'SUS' };
    const pvType = state.playerVoicing?.type;
    const pvLabel = pvType ? (PV_LABEL[pvType] || pvType.toUpperCase()) : '';
    const voicingTxt = pvLabel
      ? `<span class="pi-voicing">${pvLabel} · ${this.bassPattern}</span>`
      : '';

    // Step indicator — where we are within the current progression
    const stepTxt = `<span class="pi-step">${this.currentStepIdx + 1}/${prog.steps.length}</span>`;

    // Live key name (handles modulation — section.modName/modKeyPc beat state.keyPc)
    const liveKeyPc = (section.modKeyPc != null) ? section.modKeyPc : state.keyPc;
    const liveKeyName = nameOf(liveKeyPc, useFlatsFor(liveKeyPc));
    const keyHtml = `<span class="pi-key">${liveKeyName}<span class="pi-key-q">${state.tonality === 'major' ? 'maj' : 'min'}</span></span>`;

    const beatsHtml = `
      <span class="pi-beats">
        <span class="pi-beat downbeat" data-b="0">1</span>
        <span class="pi-beat" data-b="1">2</span>
        <span class="pi-beat" data-b="2">3</span>
        <span class="pi-beat" data-b="3">4</span>
      </span>`;

    // ── Desktop dashboard pieces ──────────────────────────────────
    // Chord-name big block + functional context line ("ii of C major").
    const FUNC_LABEL = { tonic:'tonic', dom:'dominant', predom:'pre-dominant',
                         secondary:'secondary', borrowed:'borrowed' };
    const liveKeyTon = state.tonality === 'major' ? 'major' : 'minor';
    const ctxFunction = curCh && FUNC_LABEL[curCh.tag];
    const ctxText = curRoman
      ? `${curRoman}${ctxFunction ? ' · ' + ctxFunction : ''} in ${liveKeyName} ${liveKeyTon}`
      : '';

    // Step dots — one dot per step in the progression; current one glows.
    const dotsHtml = prog.steps.map((_, i) => {
      let cls = 'pi-prog-dot';
      if (i < this.currentStepIdx) cls += ' done';
      else if (i === this.currentStepIdx) cls += ' now';
      return `<span class="${cls}"></span>`;
    }).join('');

    // AABA at size — each section letter as a glyph, current underlined+gold.
    const formLargeHtml = this.song.map((s, i) => {
      let cls = 'pi-fseg';
      if (i < this.songIdx) cls += ' done';
      else if (i === this.songIdx) cls += ' now';
      return `<span class="${cls}">${s.label}</span>`;
    }).join('');
    const iterLarge = section.repeats > 1
      ? `<div class="pi-iter-large">iter ×${this.sectionIter + 1}/${section.repeats}</div>`
      : '';

    // Voicing icon (reuses VOICE_ICONS — strum / drop2 / drop3 / etc.)
    const voiceIcon = (pvType && typeof VOICE_ICONS !== 'undefined' && VOICE_ICONS[pvType])
      ? VOICE_ICONS[pvType] : '';
    // Sub-variant detail from the actual played shape (E-SHAPE / OPEN / etc.)
    const pvShape = state.playerVoicing?.shape;
    const pvVariant = pvShape ? pvShape.__variant : null;
    const VARIANT_LABEL = { seventh:'7TH', triad:'TRIAD', open:'OPEN', power:'POWER' };
    const variantTxt = pvVariant ? ' · ' + (VARIANT_LABEL[pvVariant] || pvVariant.toUpperCase()) : '';

    // String-set / inversion detail for the voicing bloc (sourced from
    // the live played voicing if we can find it in the catalog).
    let voicingDetail = '';
    if (pvShape && typeof allDistinctVoicings === 'function' && curCh) {
      const root = (state.keyPc + curCh.deg) % 12;
      const cands = allDistinctVoicings(curCh.quality, root);
      const sk = pvShape.map((f, i) => f >= 0 ? `${i}.${f}` : '').filter(Boolean).join(',');
      const match = cands.find(c => c.shape.map((f, i) => f >= 0 ? `${i}.${f}` : '').filter(Boolean).join(',') === sk);
      if (match) {
        const SET = ['LOW','MID','TOP'];
        const INV = ['root','1st inv','2nd inv','3rd inv'];
        const parts = [];
        if (match.stringSetIdx != null && SET[match.stringSetIdx]) parts.push(SET[match.stringSetIdx] + ' set');
        else if (match.stringSet) parts.push(match.stringSet);
        if (match.inversion != null) parts.push(INV[match.inversion]);
        voicingDetail = parts.join(' · ');
      }
    }
    const variantHero = pvVariant ? (VARIANT_LABEL[pvVariant] || pvVariant.toUpperCase()) : '';
    const voicingMetaLine = [variantHero, voicingDetail].filter(Boolean).join(' · ');

    // Progression pills — every step in the current progression as a
    // small italic chord-pill; the current one is filled + scaled.
    // Pills are time-aware: flex-grow proportional to step.bars so a
    // 2-bar chord visually takes twice the horizontal space of a 1-bar
    // chord. The bar within a sustained chord is shown as a darker
    // bg fill on the .now pill (visual progress).
    const pillsHtml = prog.steps.map((step, i) => {
      let cls = 'pi-prog-pill';
      if (i < this.currentStepIdx) cls += ' done';
      else if (i === this.currentStepIdx) cls += ' now';
      const bars = step.bars || 1;
      // Look up the chord def so the pill shows the readable roman
      // ("V/V") instead of the internal chord ID ("V_V").
      const stepRoman = map.chordDefs[step.chord]?.roman || step.chord;
      return `<span class="${cls}" style="flex:${bars} 1 0;" data-bars="${bars}">${stepRoman}</span>`;
    }).join('');

    // Build a clean descriptor-only name. Strips the chord sequence
    // (since the pills already show it), the ×N iteration counter,
    // and bare parentheses (keeps their content). Leaves only words
    // like "Backdoor", "Pop ballad", "Bach", "epic", "Autumn Leaves".
    // If nothing meaningful remains, hide the name entirely.
    const _stripChordSeq = (rawName) => {
      if (!rawName) return '';
      let out = rawName;
      // Drop "×2", "×1/2" etc.
      out = out.replace(/×\s*\d+(?:\/\d+)?/g, '');
      // Build a pattern that matches the full chord sequence with any
      // dash flavor (–, —, -) and optional spaces between IDs. Allow
      // each chord ID to be followed by display decorations the name
      // might add but the ID doesn't carry — e.g. step.chord = 'vii'
      // while the name spells it 'vii°', or 'ii' shown as 'iiø'.
      const chordsEsc = prog.steps.map(s => {
        const id = (s.chord || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return id + '[°ø7susmajM]*';      // tolerate display suffixes
      });
      const sep = '\\s*[–—-]\\s*';
      const seqPattern = chordsEsc.join(sep);
      if (seqPattern) out = out.replace(new RegExp(seqPattern, 'g'), '');
      // Strip parens (keep their content)
      out = out.replace(/[()]/g, '');
      // Collapse whitespace + trim leading/trailing dashes
      out = out.replace(/\s+/g, ' ').trim();
      out = out.replace(/^[–—\-\s]+|[–—\-\s]+$/g, '');
      return out;
    };
    const cleanProgName = _stripChordSeq(prog.name);
    const progNameHtml = cleanProgName
      ? `<div class="pi-prog-name">${cleanProgName}</div>`
      : '';

    // Short context: function in current key (e.g. "predominant").
    // Dropped "in C major" — the key chip in the meta strip already
    // carries that, no need to repeat it.
    const shortCtx = ctxFunction || '';
    // Single condensed voicing line: "MID · 2nd · whole bass"
    const voicingOneLine = [voicingMetaLine, this.bassPattern && `${this.bassPattern} bass`]
      .filter(Boolean).join(' · ');

    const desktopHtml = `
      <div class="pi-grid">
        <div class="pi-block pi-block-chord">
          <div class="pi-chord-name${curCh?.tag ? ' tag-' + curCh.tag : ''}">${curName || '—'}</div>
          ${shortCtx ? `<div class="pi-chord-context">${shortCtx}</div>` : ''}
          ${curRoman ? `<div class="pi-chord-roman">${curRoman}</div>` : ''}
        </div>
        <div class="pi-block pi-block-voicing">
          <div class="pi-voicing-row">
            <span class="pi-voicing-icon">${voiceIcon}</span>
            <span class="pi-voicing-family">${pvLabel || '—'}</span>
          </div>
          ${voicingOneLine ? `<div class="pi-voicing-variant">${voicingOneLine}</div>` : ''}
        </div>
        <div class="pi-block pi-block-prog">
          ${progNameHtml}
          <div class="pi-prog-pills">${pillsHtml}</div>
        </div>
        <div class="pi-meta">
          <span class="pi-meta-val pi-meta-key">${liveKeyName} ${state.tonality === 'major' ? 'maj' : 'min'}</span>
          ${travelBadge}
          ${modBadge}
          <span class="pi-meta-spacer"></span>
          <span class="pi-meta-actions">
            <span class="pi-meta-song" id="pi-song-picker" title="click to change song structure">
              <span class="pi-meta-song-letters">
                ${this.song.map((s, i) => {
                  let c = 'ms-l';
                  if (i < this.songIdx) c += ' done';
                  else if (i === this.songIdx) c += ' now';
                  return `<span class="${c}">${s.label}</span>`;
                }).join('')}
              </span>
              ${section.repeats > 1
                ? `<span class="pi-meta-song-iter">×${this.sectionIter + 1}/${section.repeats}</span>`
                : ''}
            </span>
            <span id="pi-midi-slot" class="pi-midi-slot"></span>
            ${beatsHtml}
          </span>
        </div>
      </div>
    `;

    // ── Mobile dashboard (slim two-row) ───────────────────────────
    // Row 1: key chip · section letters (tappable picker) · badges · beats
    // Row 2: progression name (stripped of chord-seq) · voicing line
    // The big chord name + roman aren't duplicated here — they already live
    // in the chord cards / map directly below, so showing them again would
    // just be visual repetition. Same letter format the desktop pi-grid uses
    // for sections, so the existing pi-meta-song-letters CSS handles styling.
    const mobileSectionLetters = this.song.map((s, i) => {
      let c = 'ms-l';
      if (i < this.songIdx)       c += ' done';
      else if (i === this.songIdx) c += ' now';
      return `<span class="${c}">${s.label}</span>`;
    }).join('');
    const mobileIterHtml = section.repeats > 1
      ? `<span class="pi-meta-song-iter">×${this.sectionIter + 1}/${section.repeats}</span>`
      : '';
    const mobileBottomRow = (cleanProgName || voicingTxt)
      ? `<div class="pi-mobile-row pi-mobile-bot">
          ${cleanProgName ? `<span class="pi-prog-mobile">${cleanProgName}</span>` : ''}
          ${voicingTxt}
        </div>`
      : '';
    const mobileHtml = `
      <div class="pi-mobile pi-mobile-play">
        <div class="pi-mobile-row pi-mobile-top">
          ${keyHtml}
          <span class="pi-form pi-song-picker-mobile" title="click to change song structure">
            <span class="pi-meta-song-letters">${mobileSectionLetters}</span>
            ${mobileIterHtml}
          </span>
          ${travelBadge}
          ${modBadge}
          <span class="pi-spacer"></span>
          ${beatsHtml}
        </div>
        ${mobileBottomRow}
      </div>
    `;

    // Auto-fit the chord block's two big lines (chord name + roman)
    // to the block width — long names like "Bbm7b5" or long romans
    // like "iiø/iii" can otherwise blow past the column at 76/64px.
    // Each line is independent now (vertical stack), so measure each
    // separately rather than scaling together.
    const _fitChordRow = () => {
      const block = document.querySelector('#player-info .pi-block-chord');
      if (!block) return;
      const maxW = block.clientWidth;
      if (!maxW) return;
      const name  = block.querySelector('.pi-chord-name');
      const roman = block.querySelector('.pi-chord-roman');
      const NAME_BASE  = 64;
      const ROMAN_BASE = 104;
      const fitLine = (el, base) => {
        if (!el) return;
        el.style.fontSize = base + 'px';
        const w = el.scrollWidth;
        if (w <= maxW) return;
        const scale = Math.max(0.5, maxW / w);
        el.style.fontSize = (base * scale) + 'px';
      };
      fitLine(name, NAME_BASE);
      fitLine(roman, ROMAN_BASE);
    };
    // Shrink every roman-numeral pill by the same factor when at least one
    // is being ellipsis-truncated (12-bar blues etc.). Preserves the
    // bars-proportional widths since the container width isn't touched,
    // and keeps the now/done size hierarchy (22/18 base ratio) intact.
    const _fitPillRow = () => {
      const pills = document.querySelectorAll('#player-info .pi-prog-pill');
      if (!pills.length) return;
      // Reset to CSS defaults so we re-measure cleanly each tick.
      pills.forEach(p => { p.style.fontSize = ''; });
      let maxRatio = 1;
      pills.forEach(p => {
        const cw = p.clientWidth;
        if (!cw) return;
        const ratio = p.scrollWidth / cw;
        if (ratio > maxRatio) maxRatio = ratio;
      });
      if (maxRatio <= 1) return;
      const MIN_SCALE = 0.45;
      const scale = Math.max(MIN_SCALE, 1 / maxRatio);
      pills.forEach(p => {
        const base = p.classList.contains('now') ? 22 : 18;
        p.style.fontSize = (base * scale) + 'px';
      });
    };

    // Rescue the MIDI export wrap BEFORE the innerHTML wipe — otherwise
    // setting innerHTML below would destroy the wrap (along with its
    // click handler + popup menu state) every time _updateVisuals runs.
    // Stash it on document.body temporarily; we'll reattach to the new
    // slot or send it back to the header below.
    const piEl   = document.getElementById('player-info');
    const midiW  = document.getElementById('midi-wrap');
    if (midiW && piEl.contains(midiW)) document.body.appendChild(midiW);

    piEl.innerHTML = desktopHtml + mobileHtml;

    // Reattach the MIDI wrap. Desktop: into the .pi-grid meta slot.
    // Mobile: as a sibling of #player-info inside .song-block's flex row
    // so MIDI sits OUTSIDE the green now-playing bar but at the same row.
    if (window.matchMedia && window.matchMedia('(min-width: 720px)').matches) {
      const slot = document.getElementById('pi-midi-slot');
      if (slot && midiW) slot.appendChild(midiW);
    } else if (midiW) {
      const songRow = document.querySelector('.song-block > div:last-child');
      if (songRow && piEl && songRow.contains(piEl)) {
        songRow.insertBefore(midiW, piEl);
      } else if (songRow) {
        songRow.appendChild(midiW);
      }
    }

    // Now that the DOM is in place and laid out, fit the chord row.
    // requestAnimationFrame so the browser has done at least one paint
    // pass — otherwise clientWidth can be 0 during the first render.
    requestAnimationFrame(_fitChordRow);
    requestAnimationFrame(_fitPillRow);

    // Don't stomp the focus / userVoicing while an audition is active.
    // Clicking a chord card sets up a 3.5s revert timer; until it fires
    // (or another click replaces it), the user's pick should keep
    // showing on the chord map / guitar / piano. Without this guard,
    // every bar tick reverted focus to the live AI chord and the
    // audition was invisible.
    if (!_auditionRevertTimer) {
      state.focusedChord = curId;
      state.userVoicing = null;
    }
    renderAlternatives();
    renderFretboard();
    updateScaleHighlightForPlayer(this);
    this._renderRealBook();
  }

  // Compute the next N bars of chord events (handles repeats, sections, loops)
  _lookAheadBars(n = 6) {
    if (!this.song) return [];
    const result = [];
    let songIdx = this.songIdx;
    let sectionIter = this.sectionIter;
    let stepIdx = this.currentStepIdx;
    let barsLeft = this.barsRemaining;
    let totalBars = 0;
    let isFirst = true;
    let safety = 0;
    // Track the key + tonality as we simulate forward. CRITICAL: both
    // must advance whenever we cross into a new section so a modulated
    // bridge (e.g. parallel minor) resolves its chord-IDs against the
    // right CHORD_MAP. Was only `simKeyPc` before and never updated on
    // section change — so the first chord of any modulated section was
    // computed in the OLD key/map and rendered as a bogus/empty shape.
    let simKeyPc = (this.song[songIdx]?.keyPc !== undefined)
      ? this.song[songIdx].keyPc : state.keyPc;
    let simTonality = (this.song[songIdx]?.tonality !== undefined)
      ? this.song[songIdx].tonality : state.tonality;
    const cycleStep = cycleMode === 'chromatic' ? 1 : cycleMode === 'fourths' ? 5 : 0;
    // Anchored loops: simulation has to mirror the scheduler's wrap
    // so the strip preview matches the bars that'll actually play.
    const anchorActive = (loopMode === 'bars-4' || loopMode === 'section') && this._loopAnchor;
    const barsLoopLen = anchorActive ? this._loopAnchor.length : 0;
    let absoluteBars = this.totalBars;
    while (totalBars < n && safety++ < 30) {
      const section = this.song[songIdx];
      if (!section) break;
      const prog = section.progression;
      const step = prog.steps[stepIdx];
      if (!step) break;
      const stepBars = isFirst ? barsLeft : step.bars;
      const barsToShow = Math.min(stepBars, n - totalBars);
      // voicingType comes straight from the section's pre-assignment — guaranteed
      // to match what the player will pick when it transitions in.
      const simVoicingType = section.voicingType || this.voicingType;
      result.push({
        roman: step.roman,
        chord: step.chord,
        bars: barsToShow,
        isCurrent: isFirst,
        isNextChange: false,
        keyPc: simKeyPc,
        tonality: simTonality,
        voicingType: simVoicingType,
        composedShape: step.composedShape,  // honors user-typed inversions
        subdivisions: step.subdivisions || (step.slots && step.slots.length) || 1,
        subdivMute: step.subdivMute || [],
        slots: step.slots || null,
        // Track song position so playback-strip cells can jump back
        // to the exact (songIdx, stepIdx) for click-while-paused.
        songIdx,
        stepIdx,
        sectionIter,
        stepBarsTotal: step.bars,
        // barsAlreadyConsumed tells the click handler how many bars
        // of THIS step have already passed before this strip cell.
        barsAlreadyConsumed: isFirst ? (step.bars - barsLeft) : 0,
      });
      totalBars += barsToShow;
      absoluteBars += barsToShow;
      isFirst = false;
      // Fixed-bar loop wrap: snap back to the anchor (the page that
      // was current when the user enabled the loop), not bar 0 of
      // the song. Matches the scheduler's loopAnchor logic.
      if (barsLoopLen && this._loopAnchor
          && absoluteBars >= this._loopAnchor.totalBars + barsLoopLen) {
        absoluteBars = this._loopAnchor.totalBars;
        songIdx      = this._loopAnchor.songIdx;
        sectionIter  = this._loopAnchor.sectionIter;
        stepIdx      = this._loopAnchor.stepIdx;
        barsLeft     = this.song[songIdx]?.progression?.steps?.[stepIdx]?.bars || 1;
        if (cycleStep) simKeyPc = (simKeyPc + cycleStep) % 12;
        continue;
      }
      stepIdx++;
      if (stepIdx >= prog.steps.length) {
        stepIdx = 0;
        sectionIter++;
        if (sectionIter >= section.repeats) {
          sectionIter = 0;
          songIdx++;
          if (songIdx >= this.song.length) {
            if (loopMode === 'song') {
              songIdx = 0;
              if (cycleStep) simKeyPc = (simKeyPc + cycleStep) % 12;
            } else break;
          }
          // Adopt the new section's key/tonality so a modulated bridge
          // (parallel minor, truck-driver lift, etc.) shows the right
          // chords from the right map starting on its FIRST bar — not
          // one bar late.
          const nextSection = this.song[songIdx];
          if (nextSection) {
            if (nextSection.keyPc !== undefined) simKeyPc = nextSection.keyPc;
            else simKeyPc = this._homeKey ? this._homeKey.keyPc : simKeyPc;
            if (nextSection.tonality !== undefined) simTonality = nextSection.tonality;
            else simTonality = this._homeKey ? this._homeKey.tonality : simTonality;
          }
        }
      }
    }
    // Mark the chord right after the current as "next change"
    if (result.length >= 2) result[1].isNextChange = true;
    return result;
  }

  // Single source of truth for upcoming voicings. Walks the lookahead, picks
  // shapes using the same picker the trigger uses, with proper chaining.
  // Stored in `_cachedPage` (4 bars) + `_cachedPeek`. Both the strip render
  // AND the chord trigger READ from this — they cannot diverge.
  _buildPagePlan() {
    // Promote the PREVIOUS peek (if any): when this rebuild is for the
    // page immediately following the one whose peek we showed, the
    // first cell's chord/shape should equal the peek we promised in
    // the preview. Stash it so we can overwrite cells[0] below.
    const promotedPeek = this._cachedPeek;
    const wasFollowupPage = promotedPeek
      && this._cachedPlanPage != null
      && Math.floor(this.totalBars / 4) === this._cachedPlanPage + 1;
    this._cachedPage = [];
    this._cachedPeek = null;
    this._cachedPlanPage = Math.floor(this.totalBars / 4);   // tag for cache invalidation
    const lookahead = this._lookAheadBars(8);
    // Start the chain from the actual last-played shape — same context the
    // next real trigger will be in.
    let prevShape = this.previousShape;
    let prevKeyPc = state.keyPc;
    let prevTonality = state.tonality;
    let prevChord = null;
    let bar = 0;
    // Edit→tap→Play can start the player mid-page (totalBars % 4 > 0). The
    // lookahead only knows about FUTURE bars from songIdx/stepIdx, so without
    // help the clicked chord would land in cells[0] and the page would visually
    // shrink. Prefill the slots before barInPage from the captured strip
    // (composedProgression) so the four-bar page stays page-aligned and the
    // clicked chord sits at its native slot. These are visual-only — no songIdx
    // means the paused-click handler won't try to jump into them.
    const startBarInPage = this.totalBars % 4;
    const pageStart = this._cachedPlanPage * 4;
    const seq = state.composedProgression;
    if (startBarInPage > 0 && seq && seq.length >= pageStart + startBarInPage) {
      const cmap = currentMap();
      for (let j = 0; j < startBarInPage; j++) {
        const sc = seq[pageStart + j];
        if (!sc || !sc.chord || !cmap.chordDefs[sc.chord]) {
          this._cachedPage.push(null);
          continue;
        }
        this._cachedPage.push({
          chord: sc.chord,
          qualityOverride: null,
          barIdxInChord: sc._tie ? 1 : 0,
          keyPc: state.keyPc,
          voicingType: sc.voicingType || this.voicingType,
          shape: sc.shape,
          subdivisions: sc.subdivisions || 1,
          subdivMute: sc.subdivMute || [],
          slots: sc.slots ? sc.slots.map(sl => sl ? {...sl} : null) : null,
          songIdx: null,
          stepIdx: null,
          sectionIter: null,
        });
      }
      bar = startBarInPage;
    }
    outer: for (const seg of lookahead) {
      for (let b = 0; b < seg.bars; b++) {
        // Resolve chord-def in the SEGMENT's tonality, not the live one.
        // Otherwise a modulated bridge in parallel minor would look up
        // its `iiø` / `i` IDs against the major map (current state) and
        // get undefined — which collapsed the first cell into a blank
        // visualization until the section actually started playing.
        const segTonality = (seg.tonality !== undefined) ? seg.tonality : state.tonality;
        const ch = (CHORD_MAP[segTonality] || currentMap()).chordDefs[seg.chord];
        const segKeyPc = (seg.keyPc !== undefined) ? seg.keyPc : state.keyPc;
        const segType = seg.voicingType || this.voicingType;
        // Key change resets prev (matches _applySectionKey's reset).
        // Also reset on tonality flip (parallel-key modulation keeps the
        // same root but lands in a different mode — fresh chain).
        if (segKeyPc !== prevKeyPc || segTonality !== prevTonality) prevShape = null;
        // Continuation bar — same chord, no new trigger, reuse shape
        const isContinuation = (seg.chord === prevChord) && (b > 0);
        let shape;
        if (isContinuation) {
          shape = prevShape;
        } else if (seg.composedShape) {
          // User-composed progression — honor the exact inversion they chose
          shape = seg.composedShape;
        } else if (bar === 0 && state.playerVoicing
                   && state.playerVoicing.chord === seg.chord
                   && state.playerVoicing.shape) {
          // First entry IS the currently-playing chord — use the literal played
          // shape, never re-pick. This is the critical anti-drift anchor: a
          // post-trigger rebuild would otherwise re-pick with prev=its-own-shape
          // and may land on a different inversion than what's actually sounding.
          shape = state.playerVoicing.shape;
        } else if (ch) {
          const root = (segKeyPc + ch.deg) % 12;
          // Function-based override: tonics, dominants, secondaries
          // sometimes promote to their natural alternate family
          // (drop-3 / shell) so each chord function has its own
          // sonic personality, even within a uniform section.
          var finalType = _voicingTypeForChord(
            segType, ch.tag,
