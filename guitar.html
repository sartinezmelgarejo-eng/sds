      'V7':    {roman:'V7',    deg:7,  quality:'7',     tag:'dom'},
      'bVI':   {roman:'bVI',   deg:8,  quality:'maj7',  tag:'tonic'},
      'bVII':  {roman:'bVII',  deg:10, quality:'7',     tag:'dom'},
      // Extensions
      'bII7':  {roman:'bII7',  deg:1,  quality:'7',     tag:'borrowed'},   // Neapolitan / tritone sub of V7
      'V_iv':  {roman:'V/iv',  deg:0,  quality:'7',     tag:'secondary'},  // secondary dom of iv (in C min = C7→Fm)
      'V_V':   {roman:'V/V',   deg:2,  quality:'7',     tag:'secondary'},  // secondary dom of V7
      'I_pic': {roman:'I',     deg:0,  quality:'maj7',  tag:'borrowed'},   // Picardy major tonic
      'bIII7': {roman:'bIII7', deg:3,  quality:'7',     tag:'borrowed'},   // substitute dom
      'vii7':  {roman:'vii°7', deg:11, quality:'dim7',  tag:'borrowed'},   // harmonic-minor leading-tone dim
      'IV':    {roman:'IV',    deg:5,  quality:'maj7',  tag:'borrowed'},   // parallel-major IV
    },
    nodes: {
      // ── PREDOMINANT column (left, x=50) — ordered so bIII→bVI→iiø→iv flows downward ──
      'n_bIII':  {chord:'bIII',  x:50,  y:30},
      'n_bVI':   {chord:'bVI',   x:50,  y:170},
      'n_iiø':   {chord:'iiø',   x:50,  y:310},
      'n_iv':    {chord:'iv',    x:50,  y:450},
      'n_bVII':  {chord:'bVII',  x:50,  y:600},
      // ── PREDOMINANT satellites (x=170, sat next to parent rows) ──
      'n_bIII7': {chord:'bIII7', x:170, y:185},  // sub-dom of bVI, right of bVI
      'n_IV':    {chord:'IV',    x:170, y:325},  // parallel-maj IV (predom), right of iiø
      'n_V_iv':  {chord:'V_iv',  x:170, y:465},  // sec dom of iv, right of iv
      // ── DOMINANT column (middle, x=280) — pushed right to clear the
      //    predom-satellite right edge (262) ──
      'n_vii7':  {chord:'vii7',  x:280, y:200},  // leading-tone dim (dom function)
      'n_V_V':   {chord:'V_V',   x:280, y:325},  // sec dom of V7, stacked above
      'n_V7':    {chord:'V7',    x:280, y:450},
      'n_bII7':  {chord:'bII7',  x:280, y:600},
      // ── TONIC (right) ──
      'n_I_pic': {chord:'I_pic', x:400, y:30},   // Picardy major tonic, top-right
      'n_i':     {chord:'i',     x:400, y:560, hub:true},
    },
    arrows: [
      {from:'n_bIII', to:'n_bVI'},
      {from:'n_bVI',  to:'n_iiø'},
      {from:'n_iiø',  to:'n_V7'},
      {from:'n_V7',   to:'n_i'},
      {from:'n_iv',   to:'n_V7'},
      {from:'n_iv',   to:'n_i'},
      {from:'n_iv',   to:'n_iiø'},
      {from:'n_V7',   to:'n_bVI'},
      {from:'n_bVII', to:'n_i'},
      {from:'n_bVI',  to:'n_bVII'},
      // Extensions resolving inward
      {from:'n_bII7',  to:'n_i'},                  // tritone sub → tonic
      {from:'n_V_iv',  to:'n_iv'},                 // secondary → iv
      {from:'n_V_V',   to:'n_V7'},                 // secondary → V7
      {from:'n_V7',    to:'n_I_pic', curve:-1},    // Picardy resolution
      {from:'n_bIII7', to:'n_bVI'},                // sub-dom → bVI
      {from:'n_vii7',  to:'n_i'},                  // leading-tone dim → i
      {from:'n_IV',    to:'n_V7'},                 // parallel-major IV → V7 (cadence)
      {from:'n_IV',    to:'n_i'},                  // or → i directly (plagal)
      // i (tonic hub) → can go anywhere — show outgoing options (incl. parallels/borrowed)
      {from:'n_i',    to:'n_iiø'},
      {from:'n_i',    to:'n_iv'},
      {from:'n_i',    to:'n_V7'},
      {from:'n_i',    to:'n_bVI'},
      {from:'n_i',    to:'n_bVII'},
      {from:'n_i',    to:'n_bIII'},
      {from:'n_i',    to:'n_IV'},
      {from:'n_i',    to:'n_V_iv'},
    ],
  },
};

function intervalColor(label) {
  const map = {'R':'i-R','b2':'i-b2','2':'i-2','b3':'i-b3','3':'i-3','4':'i-4','b5':'i-b5',
    '5':'i-5','b6':'i-b6','#5':'i-s5','6':'i-6','b7':'i-b7','7':'i-7','bb7':'i-6',
    'b9':'i-b9','9':'i-9','#9':'i-s9','11':'i-11','#11':'i-s11','13':'i-13','b13':'i-b13'};
  return map[label] ? getComputedStyle(document.documentElement).getPropertyValue('--' + map[label]).trim() : '#888';
}

function noteAt(s, f) { return (STRING_OPEN_MIDI[s] + f) % 12; }
function nameOf(pc, useFlats) { return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc]; }
function useFlatsFor(pc) { return ROOTS[pc].prefer === 'flat'; }

/* ─── Drop-2 generator ─── */

function dropTwoVoicing(quality, rootPc, stringSetIdx, inversion) {
  const q = QUALITIES[quality];
  if (!q || q.ints.length !== 4) return null;
  let close = [...q.ints];
  for (let i = 0; i < inversion; i++) {
    close = [close[1], close[2], close[3], close[0] + 12];
  }
  const dropped = [close[0], close[1], close[2] - 12, close[3]].sort((a, b) => a - b);
  const set = STRING_SETS[stringSetIdx].idx;
  for (let oct = 24; oct <= 84; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = dropped.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function totalVoiceMovement(shapeA, shapeB) {
  let total = 0;
  for (let s = 0; s < 6; s++) {
    if (shapeA[s] >= 0 && shapeB[s] >= 0) total += Math.abs(shapeA[s] - shapeB[s]);
  }
  return total;
}

function avgFret(shape) {
  const fs = shape.filter(f => f >= 0);
  return fs.length ? fs.reduce((a,b)=>a+b,0) / fs.length : 0;
}

function smoothestVoicing(quality, rootPc, sourceShape) {
  // Score = voice-movement + register-cost
  // Sweet spot: avg fret 5–9 (comping range). Outside that, cost grows.
  let best = null;
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!sh) continue;
      const m = totalVoiceMovement(sourceShape, sh);
      const af = avgFret(sh);
      const target = 7;
      const reg = Math.abs(af - target);
      const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
      // Prefer mid (5432) + top (4321) sets over low (6543) for comping clarity
      const setPref = ss === 0 ? 3 : 0;
      const score = m + registerCost + setPref;
      if (!best || score < best.score) best = {shape: sh, stringSetIdx: ss, inversion: inv, movement: m, score};
    }
  }
  return best;
}

function bestStartingVoicing(quality, rootPc) {
  // Single source of truth: use the EXACT same candidate list + scoring as
  // composeAddChord's no-previous-chord branch, so the voicing the map shows
  // for the focused chord is always the one that gets played when the user
  // clicks it (or types it as the first chord of a composed progression).
  const cands = (typeof composedCandidatesFor === 'function')
    ? composedCandidatesFor(quality, rootPc)
    : (() => {
        const out = [];
        for (let ss = 0; ss < STRING_SETS.length; ss++) {
          for (let inv = 0; inv < 4; inv++) {
            const sh = dropTwoVoicing(quality, rootPc, ss, inv);
            if (sh) out.push({ shape: sh, stringSetIdx: ss, inversion: inv });
          }
        }
        return out;
      })();
  let best = null;
  cands.forEach((c) => {
    const af = avgFret(c.shape);
    const reg = Math.abs(af - 7);
    const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
    const setPref = c.stringSetIdx === 0 ? 3 : 0;   // low-E set penalty
    const score = registerCost + setPref;
    if (!best || score < best.score) {
      best = { shape: c.shape, stringSetIdx: c.stringSetIdx, inversion: c.inversion, score };
    }
  });
  return best;
}

/* ─── Alt voicing types: triad, shell ─── */

// Triad (R, 3rd or b3rd, 5th or b5th) — no 7th
function triadVoicing(quality, rootPc, stringSetType = 'top') {
  const q = QUALITIES[quality];
  if (!q || q.ints.length < 3) return null;
  // First three chord tones = R, 3 (or b3), 5 (or b5)
  const ints = [q.ints[0], q.ints[1], q.ints[2]];
  // Three-string sets to choose from
  const sets = {
    'top':  [3, 4, 5],   // G-B-E
    'mid':  [2, 3, 4],   // D-G-B
    'low':  [1, 2, 3],   // A-D-G
  };
  const set = sets[stringSetType] || sets.top;
  for (let oct = 24; oct <= 72; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = ints.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

// Shell voicing: R (low) + 7 (or b7) + 3 (or b3) — classic jazz comping
// Guide-tone duo: the 3rd and 7th only — literally a shell without the root.
// Mirrors shellVoicing's string sets minus the root string.
// Returns a single best shape (picker handles voice-leading across calls).
function guideToneVoicing(quality, rootPc, type = 'A') {
  const q = QUALITIES[quality];
  if (!q) return null;
  const ints = q.ints;
  const seventhInt = ints.includes(11) ? 11 : ints.includes(10) ? 10 : ints.includes(9) ? 9 : 10;
  const thirdInt   = ints.includes(4)  ? 4  : ints.includes(3)  ? 3  : 4;
  // Pitches ascending: 7 (below), 3+12 (above) — same arrangement as the shell's
  // upper two voices.
  const intervals = [seventhInt, thirdInt + 12];
  // Type A: 7 on D string, 3 on G string  (the upper two strings of shell A)
  // Type B: 7 on G string, 3 on B string  (the upper two strings of shell B)
  const strings = type === 'A' ? [2, 3] : [3, 4];
  for (let oct = 24; oct <= 60; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = intervals.map(s => rootMidi + s);
    const frets = strings.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      strings.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function shellVoicing(quality, rootPc, type = 'A') {
  const q = QUALITIES[quality];
  if (!q) return null;
  // Find the 7th and 3rd intervals from chord tones
  const ints = q.ints;
  let seventhInt = null;
  if (ints.includes(11)) seventhInt = 11;
  else if (ints.includes(10)) seventhInt = 10;
  else if (ints.includes(9))  seventhInt = 9;
  else seventhInt = 10; // fallback to b7
  let thirdInt = null;
  if (ints.includes(4)) thirdInt = 4;
  else if (ints.includes(3)) thirdInt = 3;
  else thirdInt = 4;
  // Ascending pitches: R (0), 7 (10 or 11), 3 + 12 (to be above 7)
  const intervals = [0, seventhInt, thirdInt + 12];
  // Type A: R on 6th string, 7 on 4th, 3 on 3rd (skip 5th string)
  // Type B: R on 5th string, 7 on 3rd, 3 on 2nd
  const strings = type === 'A' ? [0, 2, 3] : [1, 3, 4];
  for (let oct = 24; oct <= 60; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = intervals.map(s => rootMidi + s);
    const frets = strings.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      strings.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */

const state = {
  keyPc: 0,
  tonality: 'major',
  instrument: 'guitar',     // 'guitar' | 'piano' — swaps chord neck for piano keyboard
  display: 'notes',
  focusedChord: 'I',
  userVoicing: null,
  playerVoicing: null,  // {chord, shape, type} — currently playing
  nextVoicing: null,    // {chord, shape, type} — predicted upcoming
  // chordId → {shape, type} for chords that have played in the current progression.
  // Used so each chord card shows the voicing it will actually be played in.
  progressionVoicings: {},
  // Composed progression: user-typed sequence of {chord, inversion}. When non-empty
  // and AI starts playing, this overrides the AI's random progression generation —
  // the player just loops the typed sequence.
  composedProgression: [],
  // Index of the currently SELECTED compose cell (orange highlight). When set,
  // adding a chord / cycling inversions / Backspace target this cell instead
  // of appending to the end. null = append mode (default).
  composedSelectedIdx: null,
};

function currentMap() { return CHORD_MAP[state.tonality]; }

function chordRoot(chord) { return (state.keyPc + chord.deg) % 12; }

function focusedChord() {
  const map = currentMap();
  const ch = map.chordDefs[state.focusedChord];
  return {id: state.focusedChord, ...ch};
}

function focusedShape() {
  const fc = focusedChord();
  const root = chordRoot(fc);
  if (state.userVoicing) {
    // If the user voicing carries a raw shape (shells/triads/AI voicings), use it directly.
    if (state.userVoicing.shape) {
      return { shape: state.userVoicing.shape, ...state.userVoicing };
    }
    return {
      shape: dropTwoVoicing(fc.quality, root, state.userVoicing.stringSetIdx, state.userVoicing.inversion),
      ...state.userVoicing,
    };
  }
  // If the AI is currently playing this chord with a specific voicing, show that one
  if (state.playerVoicing && state.playerVoicing.chord === state.focusedChord && state.playerVoicing.shape) {
    return { shape: state.playerVoicing.shape, type: state.playerVoicing.type };
  }
  // Default: register-aware musical voicing
  const v = bestStartingVoicing(fc.quality, root);
  if (v) {
    return { shape: v.shape, stringSetIdx: v.stringSetIdx, inversion: v.inversion };
  }
  return {
    shape: dropTwoVoicing(fc.quality, root, 2, 0),
    stringSetIdx: 2,
    inversion: 0,
  };
}

function computeAllVoicings() {
  const map = currentMap();
  const focused = focusedChord();
  const focShape = focusedShape();
  const result = {};
  result[focused.id] = {...focShape, movement: 0};

  for (const id in map.chordDefs) {
    if (id === focused.id) continue;
    // 1. AI's predicted next-up voicing wins (most accurate)
    if (state.nextVoicing && state.nextVoicing.chord === id && state.nextVoicing.shape) {
      result[id] = { shape: state.nextVoicing.shape, type: state.nextVoicing.type };
      continue;
    }
    // 2. Cached voicing from this run of the progression — keeps each played
    //    chord's card showing the position it'll be in next time it comes around
    if (state.progressionVoicings[id]) {
      result[id] = state.progressionVoicings[id];
      continue;
    }
    // 3. Predict using the SAME picker the player would use, so the card
    //    shows the voicing that'll actually play. Falls back to smoothestVoicing
    //    when the player isn't running (no _pickShape context).
    const ch = map.chordDefs[id];
    const r = chordRoot(ch);
    if (player && player.playing) {
      let sh = player._pickShape(ch.quality, r, player.voicingType, focShape.shape);
      if (!sh) sh = player._pickShape(ch.quality, r, 'drop2', focShape.shape);
      result[id] = sh ? { shape: sh, type: player.voicingType } : null;
    } else {
      result[id] = smoothestVoicing(ch.quality, r, focShape.shape);
    }
  }
  return result;
}

/* ════════════════════════════════════════════════════════════
   MINI FRETBOARD (with inlays)
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   Clef glyphs — italic letters G (treble = G clef, anchors G4)
   and F (bass = F clef, anchors F3). Cleaner and instantly readable
   at any cell size on any device, no Unicode-font surprises.
   ════════════════════════════════════════════════════════════ */
// Continuation-bar staff: same grand-staff geometry as renderChordStaff but
// no notes — just an empty staff plus a simile sign (the slash + two dots
// you see in Real Books meaning "play the previous measure again"). Lets
// the partitura read continuously across multi-bar chords without
// retriggering the audio.
function renderContinuationStaff(sizing) {
  const W = sizing?.W || 100;
  const H = sizing?.H || 130;
  const showClef = sizing?.showClef !== false;
  const clefW = showClef ? 22 : 3;
  const labelH = sizing?.minimal ? 14 : 26;
  const padTop = labelH;
  const padBot = sizing?.minimal ? 7 : 9;
  const gapY = 2;
  const lineSp = (H - padTop - padBot) / (8 + gapY);
  const trebleTopY = padTop;
  const trebleBotY = trebleTopY + 4 * lineSp;
  const bassTopY   = trebleBotY + lineSp * gapY;
  const bassBotY   = bassTopY + 4 * lineSp;
  const middleCY   = trebleBotY + lineSp;
  const linesStartX = showClef ? clefW : 0;

  let lines = '';
  for (let i = 0; i < 5; i++) {
    const yt = trebleTopY + i * lineSp;
    const yb = bassTopY   + i * lineSp;
    lines += `<line x1="${linesStartX}" y1="${yt}" x2="${W}" y2="${yt}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    lines += `<line x1="${linesStartX}" y1="${yb}" x2="${W}" y2="${yb}" stroke="#1a1a1a" stroke-width="0.7"/>`;
  }
  // Compás divider on the right
  lines += `<line x1="${W - 0.5}" y1="${trebleTopY}" x2="${W - 0.5}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Faint middle-C hint
  const cHintW = W * 0.25;
  lines += `<line x1="${(W - cHintW)/2}" y1="${middleCY}" x2="${(W + cHintW)/2}" y2="${middleCY}" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>`;

  // Simile sign (thick slash + two flanking dots, classical Real-Book style).
  // Slash goes lower-left to upper-right; dots sit perpendicular to it on
  // either side at upper-left and lower-right.
  const cx = W * 0.5;
  const cy = middleCY;
  const slashL = lineSp * 1.9;
  const dotR   = lineSp * 0.42;
  const slashSW = Math.max(3, lineSp * 0.55);
  const dx = slashL / 2;
  const perp = lineSp * 0.75;            // perpendicular offset to the dots
  const simile =
    `<line x1="${cx - dx}" y1="${cy + dx}" x2="${cx + dx}" y2="${cy - dx}" stroke="#1a1a1a" stroke-width="${slashSW}" stroke-linecap="butt"/>` +
    `<circle cx="${cx - perp}" cy="${cy - perp}" r="${dotR}" fill="#1a1a1a"/>` +
    `<circle cx="${cx + perp}" cy="${cy + perp}" r="${dotR}" fill="#1a1a1a"/>`;

  // Clefs (only on the first cell of the row, so the rest reads as a clean
  // continuation of the partitura).
  let clef = '';
  if (showClef) {
    const trebleClefY = trebleBotY - lineSp;
    const bassClefY   = bassTopY + lineSp;
    const cx2 = clefW * 0.5;
    clef = trebleClefSVG(cx2, trebleClefY, lineSp, !!sizing?.minimal)
         + bassClefSVG(cx2, bassClefY, lineSp, !!sizing?.minimal);
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    ${lines}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" x="0" y="0" width="100%" height="100%">
      ${clef}
      ${simile}
    </svg>
  </svg>`;
}

function trebleClefSVG(cx, gLineY, lineSp, minimal) {
  // Real treble clef glyph. Mobile (Apple iOS / Noto Music) renders 𝄞 larger
  // within its em-box than desktop fonts (Apple Symbols / Segoe UI Symbol) —
  // use a smaller multiplier on mobile and a larger one on desktop so the
  // glyph visually reads at a similar staff-relative size on both.
  const fs = lineSp * (minimal ? 2.5 : 4.4);
  return `<text x="${cx}" y="${gLineY}"
        font-size="${fs}"
        font-family="'Bravura Text','Petaluma','Maestro','Sebastian','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola','Times New Roman',serif"
        fill="#1a1a1a"
        text-anchor="middle"
        dominant-baseline="central">𝄞</text>`;
}
function bassClefSVG(cx, fLineY, lineSp, minimal) {
  // Real bass clef glyph (𝄢, U+1D122). Mirrors trebleClefSVG: smaller on
  // mobile (Apple/Noto Music render symbols larger in their em-box), larger
  // on desktop (Apple Symbols / Segoe UI Symbol are more conservative).
  // The dot of the clef anchors F3 — the spot at fLineY, so we let the
  // central baseline sit on that line.
  const fs = lineSp * (minimal ? 2.6 : 4.4);
  return `<text x="${cx}" y="${fLineY}"
        font-size="${fs}"
        font-family="'Bravura Text','Petaluma','Maestro','Sebastian','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','Noto Music','Symbola','Times New Roman',serif"
        fill="#1a1a1a"
        text-anchor="middle"
        dominant-baseline="central">𝄢</text>`;
}

/* ════════════════════════════════════════════════════════════
   SHEET MUSIC — grand staff (treble + bass). Notes plotted at
   their actual pitch on whichever staff is appropriate (C4 / 60 is
   the split). No octave-shift trickery needed since the bass clef
   handles all the low chord tones natively.
   ════════════════════════════════════════════════════════════ */
function renderChordStaff(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const pcToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((rootPc + semi) % 12 + 12) % 12;
    if (!(pc in pcToDeg)) pcToDeg[pc] = q.degs[i];
  });
  const midis = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null)
                     .filter(x => x !== null)
                     .sort((a, b) => a - b);
  if (!midis.length) return '';

  const W = sizing?.W || 100;
  const H = sizing?.H || 82;
  const showClef = sizing?.showClef !== false;
  // Wider clef column so the bass-clef dots and treble-clef curl fit
  const clefW = showClef ? 22 : 3;
  const accW = 10;
  // Place the note stack at the HORIZONTAL CENTER of the cell — chords sit
  // visually balanced inside the staff lines instead of being pinned to the
  // left after the clef. Stay just right of the clef + accidental space.
  const noteX = Math.max(clefW + accW + 4, W * 0.55);
  // Budget the whole vertical space across both staves + a generous gap for
  // the middle-C ledger zone. Two staves × 4 line-spacings each + gap + pad
  // = H, so lineSp = (H - pad*2 - gap) / 8.
  // Top zone reserved for the chord-name label (Real-Book style above the
  // staff). padBot a bit looser so low chord tones never clip.
  const nameLabel = sizing?.chordName || '';
  const romanLabel = sizing?.roman || '';
  // Reuse the natural upper margin of the sheet music for the chord name —
  // just enough room for the text itself, no extra padding stacked on top.
  // The staff body keeps more vertical room as a result.
  const labelH = (nameLabel || romanLabel) ? (sizing?.minimal ? 14 : 26) : 3;
  const padTop = labelH;
  const padBot = (sizing?.minimal ? 7 : 9);
  // gap = 2 line-spacings so middle-C (one full ledger below treble bottom AND
  // one full ledger above bass top) sits at exactly the geometric mid-point
  // between the two staves. Anything less and the C-hint reads like B3.
  const gapY = 2;
  const lineSp = (H - padTop - padBot) / (8 + gapY);
  const trebleTopY = padTop;
  const trebleBotY = trebleTopY + 4 * lineSp;
  const bassTopY   = trebleBotY + lineSp * gapY;
  const bassBotY   = bassTopY + 4 * lineSp;
  const middleCY   = trebleBotY + lineSp;   // C4 ledger position

  // Map MIDI -> diatonic step + accidental + which staff
  const noteLetterFromPc = (pc, useFlat) => {
    const sharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const flat  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    return (useFlat ? flat : sharp)[pc];
  };
  const stepInOctave = {C:0, D:1, E:2, F:3, G:4, A:5, B:6};

  const positions = midis.map((midi) => {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const name = noteLetterFromPc(pc, flats);
    const letter = name.charAt(0);
    const acc = name.length > 1 ? name.charAt(1) : '';
    const step = (octave - 4) * 7 + stepInOctave[letter];   // 0 at C4
    // MIDI >= 60 → treble. Below → bass. (Middle C lives on first ledger
    // below treble; B3 and below sit on bass.)
    const useTreble = midi >= 60;
    const y = useTreble
      ? trebleBotY + lineSp - step * 0.5 * lineSp
      : bassTopY + (-step - 2) * 0.5 * lineSp;
    return { midi, pc, acc, letter, step, useTreble, y };
  });

  // 5 staff lines per staff — extend the FULL width of the cell so adjacent
  // cells' staves visually connect (continuous score look). The vertical bar
  // line at the right edge serves as the compás divider between cells.
  const linesStartX = showClef ? clefW : 0;
  let lines = '';
  for (let i = 0; i < 5; i++) {
    const yt = trebleTopY + i * lineSp;
    const yb = bassTopY   + i * lineSp;
    lines += `<line x1="${linesStartX}" y1="${yt}" x2="${W}" y2="${yt}" stroke="#1a1a1a" stroke-width="0.7"/>`;
    lines += `<line x1="${linesStartX}" y1="${yb}" x2="${W}" y2="${yb}" stroke="#1a1a1a" stroke-width="0.7"/>`;
  }
  // Brace bar at left joining the two staves (only on cells that show clefs)
  if (showClef) {
    lines += `<line x1="${clefW}" y1="${trebleTopY}" x2="${clefW}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="1.4"/>`;
  }
  // Compás divider — thin vertical line at the right edge of every cell
  lines += `<line x1="${W - 0.5}" y1="${trebleTopY}" x2="${W - 0.5}" y2="${bassBotY}" stroke="#1a1a1a" stroke-width="0.8"/>`;
  // Hint of the middle-C line floating between the two staves — short faint
  // dashed segment centered horizontally so the reader has a reference for
  // where C4 sits without overpowering the staff itself.
  // If middle C (MIDI 60) is actually sounding in this chord, light its
  // ledger line up in gold so the reader's eye snaps to the pivot tone.
  const hasMiddleC = midis.includes(60);
  const cHintW = hasMiddleC ? W * 0.32 : W * 0.25;
  const cHintX = (W - cHintW) / 2;
  if (hasMiddleC) {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#d4a843" stroke-width="1.2" opacity="0.95" stroke-linecap="round"/>`;
  } else {
    lines += `<line x1="${cHintX}" y1="${middleCY}" x2="${cHintX + cHintW}" y2="${middleCY}" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.35"/>`;
  }

  // Both clefs drawn: treble (G clef) anchors G4 on the second-bottom treble
  // line; bass (F clef) anchors F3 on the second-top bass line.
  let clef = '';
  if (showClef) {
    const trebleClefY = trebleBotY - lineSp;   // G4 line — center of the loop
    const bassClefY   = bassTopY + lineSp;     // F3 line — dot of the bass clef
    const cx = clefW * 0.5;
    clef = trebleClefSVG(cx, trebleClefY, lineSp, !!sizing?.minimal)
         + bassClefSVG(cx, bassClefY, lineSp, !!sizing?.minimal);
  }

  // Ledger lines — drawn per-staff (treble or bass) based on each note's home
  let ledgers = '';
  const seenLedger = new Set();
  for (const p of positions) {
    const staffTop = p.useTreble ? trebleTopY : bassTopY;
    const staffBot = staffTop + 4 * lineSp;
    if (p.y > staffBot + lineSp * 0.3) {
      let k = 1;
      while (true) {
        const ly = staffBot + k * lineSp;
        if (ly > p.y + lineSp * 0.3) break;
        const key = `b-${ly.toFixed(1)}`;
        if (!seenLedger.has(key)) {
          seenLedger.add(key);
          ledgers += `<line x1="${noteX - 6}" y1="${ly}" x2="${noteX + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
        }
        k++;
      }
    } else if (p.y < staffTop - lineSp * 0.3) {
      let k = 1;
      while (true) {
        const ly = staffTop - k * lineSp;
        if (ly < p.y - lineSp * 0.3) break;
        const key = `a-${ly.toFixed(1)}`;
        if (!seenLedger.has(key)) {
          seenLedger.add(key);
          ledgers += `<line x1="${noteX - 6}" y1="${ly}" x2="${noteX + 6}" y2="${ly}" stroke="#1a1a1a" stroke-width="0.7"/>`;
        }
        k++;
      }
    }
  }

  // Detect adjacent-stepwise pairs and offset one of them so noteheads don't overlap
  const offsetX = {};   // index -> x-offset for displaced notes
  for (let i = 1; i < positions.length; i++) {
    if (Math.abs(positions[i].step - positions[i - 1].step) <= 1
        && offsetX[i - 1] === undefined) {
      offsetX[i] = lineSp * 1.5;   // shift this note to the right of stem
    }
  }

  // ── Hand-drawn accidentals — cleaner than Unicode ♯ / ♭ at small sizes
  function svgSharp(cx, cy) {
    // Two vertical bars + two slightly upward-tilted thicker horizontal bars,
    // sized to fit roughly two line-spacings tall (one above + one below note line)
    const w = lineSp * 0.85;
    const h = lineSp * 1.6;
    const x0 = cx - w * 0.5, y0 = cy - h * 0.5;
    return [
      // Vertical bars
      `<line x1="${x0 + w*0.32}" y1="${y0 + h*0.06}" x2="${x0 + w*0.32}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="1.0" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.68}" y1="${y0 + h*0.06}" x2="${x0 + w*0.68}" y2="${y0 + h*0.94}" stroke="#1a1a1a" stroke-width="1.0" stroke-linecap="round"/>`,
      // Two thick angled crossbars (slope up to the right, classic sharp look)
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.45}" x2="${x0 + w*0.95}" y2="${y0 + h*0.33}" stroke="#1a1a1a" stroke-width="${Math.max(1.6, lineSp*0.32)}" stroke-linecap="round"/>`,
      `<line x1="${x0 + w*0.05}" y1="${y0 + h*0.72}" x2="${x0 + w*0.95}" y2="${y0 + h*0.60}" stroke="#1a1a1a" stroke-width="${Math.max(1.6, lineSp*0.32)}" stroke-linecap="round"/>`,
    ].join('');
  }
  function svgFlat(cx, cy) {
    // Vertical stem + a teardrop bulge on the lower right (the loop of a flat)
    const h = lineSp * 1.9;
    const x0 = cx - lineSp * 0.25, y0 = cy - h * 0.65;
    const stemX = x0 + lineSp * 0.18;
    return [
      `<line x1="${stemX}" y1="${y0}" x2="${stemX}" y2="${y0 + h * 0.95}" stroke="#1a1a1a" stroke-width="1.1" stroke-linecap="round"/>`,
      // Loop (filled teardrop)
      `<path d="M ${stemX} ${y0 + h*0.55}
                Q ${stemX + lineSp*1.0} ${y0 + h*0.50},
                  ${stemX + lineSp*0.55} ${y0 + h*0.95}
                Q ${stemX + lineSp*0.15} ${y0 + h*1.02},
                  ${stemX} ${y0 + h*0.85} Z"
              fill="#1a1a1a"/>`,
    ].join('');
  }

  // Accidentals + noteheads. Whole-note style (hollow oval) so each chord
  // reads as "lasts the whole bar". Only the root is colored — the rest
  // are inked black to keep the chord stack clean.
  let notes = '';
  const noteR = lineSp * 0.52;
  positions.forEach((p, i) => {
    const dx = offsetX[i] || 0;
    const cx = noteX + dx;
    const deg = pcToDeg[p.pc];
    const isRoot = deg === 'R';
    const color = isRoot ? (intervalColor('R') || '#dc2626') : '#1a1a1a';
    if (p.acc === '#') {
      notes += svgSharp(cx - lineSp * 1.2, p.y);
    } else if (p.acc === 'b') {
      notes += svgFlat(cx - lineSp * 1.1, p.y);
    }
    // Whole note: tilted oval rendered as stroke-only so the staff lines
    // pass visibly through the hollow center (classic engraving convention).
    notes += `<g transform="rotate(-22 ${cx} ${p.y})">
      <ellipse cx="${cx}" cy="${p.y}" rx="${noteR * 1.35}" ry="${noteR * 0.92}" fill="none" stroke="${color}" stroke-width="${noteR * 0.55}"/>
    </g>`;
  });

  // Chord-name label above the staff (Real-Book style). Single <text> with
  // a <tspan> for the roman numeral that uses dx for letter-by-letter
  // offset. Roman is colored by harmonic-function tag (tonic green, dom red,
  // predom gold, borrowed purple, secondary orange).
  const TAG_COLOR = {
    tonic:     '#059669',
    predom:    '#a07820',
    dom:       '#dc2626',
    borrowed:  '#9333ea',
    secondary: '#b45309',
    picardy:   '#b45309',
  };
  let nameSvg = '';
  if (nameLabel) {
    // Match the on-screen size of guitar mode's .rb-chord pill (19 px).
    // With cell ~125 wide vs viewBox W=130, inner scale is ~0.96 — so
    // nameFs 20 renders ~19 px on screen, matching the rb-chord pill in
    // compose. romanFs matches rb-roman's 11 px.
    const nameFs = sizing?.minimal ? 14 : 20;
    const romanFs = sizing?.minimal ? 10 : 12;
    const tx = showClef ? clefW + 4 : 4;
    const ty = labelH * 0.85;
    const romanColor = TAG_COLOR[sizing?.tag] || '#5a5a64';
    const romanTspan = romanLabel
      ? `<tspan dx="${sizing?.minimal ? 6 : 10}" font-size="${romanFs}" font-weight="700" fill="${romanColor}">${romanLabel}</tspan>`
      : '';
    nameSvg += `<text x="${tx}" y="${ty}" font-size="${nameFs}"
                font-family="'Cormorant Garamond', Georgia, serif"
                font-style="italic" font-weight="700" fill="#1a1a1a"
                letter-spacing="${sizing?.minimal ? 0.2 : 0.5}"><tspan>${nameLabel}</tspan>${romanTspan}</text>`;
  }
  // Two-layer SVG: outer stretches (preserveAspectRatio=none) so staff lines
  // and bar-line reach the actual cell edges — adjacent cells connect into
  // one continuous score. Inner keeps aspect so clef, noteheads AND the
  // chord-name label aren't horizontally distorted.
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    ${lines}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" x="0" y="0" width="100%" height="100%">
      ${nameSvg}${clef}${ledgers}${notes}
    </svg>
  </svg>`;
}

function renderMini(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const intToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((semi % 12) + 12) % 12;
    if (!(pc in intToDeg)) intToDeg[pc] = q.degs[i];
  });

  const played = shape.filter(f => f >= 0);
  if (!played.length) return '';
  let minF = Math.min(...played);
  let maxF = Math.max(...played);
  const hasOpen = shape.some(f => f === 0);
  let span = Math.max(4, maxF - minF + 1);
  // startFret = fret-number of the TOP BAR shown (the bar above the first playable fret)
  let startFret = hasOpen ? 0 : Math.max(0, minF - 1);
  let endFret = startFret + span;
  if (!hasOpen && endFret > N_FRETS) { endFret = N_FRETS; startFret = endFret - span; }

  const W = sizing?.W || 160;
  const H = sizing?.H || 140;
  const ml = 18, mr = 8, mt = 18, mb = 6;
  const innerW = W - ml - mr;
  const innerH = H - mt - mb;
  const stringSp = innerW / 5;
  const fretSp = innerH / Math.max(4, endFret - startFret);

  let s = '';
  if (startFret === 0) {
    s += `<line x1="${ml-2}" y1="${mt}" x2="${ml+innerW+2}" y2="${mt}" stroke="#1f1d18" stroke-width="4"/>`;
  } else {
    s += `<text x="${ml-4}" y="${mt+fretSp/2+3}" text-anchor="end" font-size="10" fill="#7a7a82" font-family="SF Mono">${startFret+1}fr</text>`;
  }
  for (let i = (startFret === 0 ? 1 : 0); i <= endFret - startFret; i++) {
    const y = mt + i * fretSp;
    s += `<line x1="${ml}" y1="${y}" x2="${ml+innerW}" y2="${y}" stroke="#d4d4da" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = ml + i * stringSp;
    s += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+innerH}" stroke="#a8a8b0" stroke-width="0.8"/>`;
  }
  // Inlays
  {
    const cx = ml + innerW / 2;
    const dw = Math.min(stringSp * 0.7, fretSp * 0.32);
    const dh = Math.min(fretSp * 0.32, 8);
    const drawD = (x, y) => `<polygon points="${x},${y-dh} ${x+dw},${y} ${x},${y+dh} ${x-dw},${y}" fill="#aaa496" opacity="0.55"/>`;
    [3,5,7,9,15,17,19,21].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      s += drawD(cx, y);
    });
    [12, 24].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      const off = stringSp * 1.5;
      s += drawD(cx - off, y);
      s += drawD(cx + off, y);
    });
  }
  // Barre indicator: when 2+ adjacent strings share the same fret, draw a backing bar
  {
    const fretGroups = {};
    shape.forEach((f, sIdx) => {
      if (f > 0) {
        if (!fretGroups[f]) fretGroups[f] = [];
        fretGroups[f].push(sIdx);
      }
    });
    Object.entries(fretGroups).forEach(([f, strings]) => {
      if (strings.length < 2) return;
      strings.sort((a, b) => a - b);
      // longest consecutive run
      let runStart = strings[0], runEnd = strings[0];
      let bestStart = runStart, bestEnd = runEnd;
      for (let i = 1; i < strings.length; i++) {
        if (strings[i] === runEnd + 1) {
          runEnd = strings[i];
        } else {
          if (runEnd - runStart > bestEnd - bestStart) { bestStart = runStart; bestEnd = runEnd; }
          runStart = strings[i]; runEnd = strings[i];
        }
      }
      if (runEnd - runStart > bestEnd - bestStart) { bestStart = runStart; bestEnd = runEnd; }
      if (bestEnd - bestStart < 1) return;
      const fret = +f;
      const cy = mt + ((fret - startFret) - 0.5) * fretSp;
      const x1 = ml + bestStart * stringSp;
      const x2 = ml + bestEnd * stringSp;
      const noteR = sizing?.r || 11;
      s += `<rect x="${x1 - noteR}" y="${cy - noteR - 1}" width="${x2 - x1 + 2*noteR}" height="${2*noteR + 2}" rx="${noteR + 1}" fill="#1f1d18" opacity="0.13"/>`;
    });
  }
  const minimal = sizing?.minimal === true;
  shape.forEach((fret, sIdx) => {
    const x = ml + sIdx * stringSp;
    if (fret < 0) {
      s += `<text x="${x}" y="${mt-5}" text-anchor="middle" font-size="${minimal ? 9 : 11}" fill="${minimal ? '#1a1a1a' : '#a8a8b0'}" font-weight="700">×</text>`;
      return;
    }
    const pc = noteAt(sIdx, fret);
    const rel = (pc - rootPc + 12) % 12;
    const deg = intToDeg[rel] || '';
    let cy;
    if (fret === 0) {
      // Open string: small ring at the nut
      cy = mt - 7;
      if (minimal) {
        s += `<circle cx="${x}" cy="${cy}" r="4.5" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>`;
      } else {
        const color = intervalColor(deg);
        s += `<circle cx="${x}" cy="${cy}" r="6" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      }
      return;
    }
    cy = mt + ((fret - startFret) - 0.5) * fretSp;
    const r = sizing?.r || 11;
    if (minimal) {
      // Classical chord-diagram style: solid black dot, no text, no colors
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="#1a1a1a"/>`;
    } else {
      const color = intervalColor(deg);
      s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      const noteName = nameOf(pc, flats);
      let label = state.display === 'intervals' ? deg : noteName;
      let fontSize = label.length > 2 ? 8 : 10;
      s += `<text x="${x}" y="${cy + 3.5}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="#000">${label}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

/* ════════════════════════════════════════════════════════════
   CHORD MAP RENDER
   ════════════════════════════════════════════════════════════ */

const MAP_DIMS = {width: 540, height: 800};

function renderChordMap() {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  const map = currentMap();
  const flats = useFlatsFor(state.keyPc);
  const voicings = computeAllVoicings();

  // Clear existing cards
  Array.from(wrap.querySelectorAll('.map-card')).forEach(el => el.remove());

  // Render one card per node
  for (const nodeId in map.nodes) {
    const node = map.nodes[nodeId];
    // Skip chords not allowed by the current scope filter — clears space in the map
    if (!isChordInScope(node.chord)) continue;
    const ch = map.chordDefs[node.chord];
    const root = chordRoot(ch);
    const v = voicings[node.chord];
    const chordName = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
    const isFocus = node.chord === state.focusedChord;
    const isHub = node.hub;
    const card = document.createElement('div');
    const isSatellite = (ch.tag === 'secondary' || ch.tag === 'borrowed');
    card.className = `map-card tag-${ch.tag} ${isHub ? 'hub' : ''} ${isFocus ? 'focused' : ''} ${isSatellite ? 'satellite' : 'diatonic'}`;
    card.style.left = `${node.x}px`;
    card.style.top = `${node.y}px`;
    card.dataset.chord = node.chord;
    const sizing = isHub ? {W:130, H:120, r:9} : (isSatellite ? {W:72, H:80, r:5.5} : {W:96, H:104, r:7.5});
    const svg = v?.shape ? renderMini(v.shape, root, ch.quality, flats, sizing) : '';
    card.innerHTML = `
      <div class="mc-top">
        <span class="mc-roman">${ch.roman}</span>
        <span class="mc-name">${chordName}</span>
      </div>
      <div class="mc-svg-wrap">${svg}</div>
    `;
    card.addEventListener('click', (ev) => {
      // Compose mode: tapping a map card = typing that chord into the strip.
      // The map IS the dialer when the AI isn't playing. Shift-click cycles
      // the inversion of the LAST chord (same semantics as Shift+number).
      if (!player.playing && currentMap().chordDefs[node.chord]) {
        composeAddChord(node.chord, ev.shiftKey, _shiftSide === 'left' ? -1 : 1);
        return;
      }

      // Player-active path: focus + jump
      const displayed = v;
      state.focusedChord = node.chord;
      state.userVoicing = displayed?.shape
        ? { shape: displayed.shape, ...displayed }
        : null;

      // While the AI is playing, clicking a chord auditions it (plays once,
      // visually focuses) but does NOT permanently jump the progression —
      // the next scheduled bar overwrites the audition, "reverting" the
      // chord automatically. To force a real jump, use the keyboard.
      if (player.playing) {
        auditionChord(node.chord);
      }
      renderAll();
      ringFocusedChord();
      // After renderAll, re-apply playing/next-up classes if player active
      if (player.playing) {
        document.querySelectorAll('.map-card').forEach(c => {
          if (c.dataset.chord === player.currentChord) c.classList.add('playing');
          else if (c.dataset.chord === player.nextChord) c.classList.add('next-up');
        });
      }
    });
    wrap.appendChild(card);
  }

  // Render arrows using node positions
  arrowsSvg.setAttribute('viewBox', `0 0 ${MAP_DIMS.width} ${MAP_DIMS.height}`);
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  arrowsSvg.innerHTML = `
    <defs>
      <!-- Tiny, minimal arrowhead — only shown on highlighted arrows -->
      <marker id="ah-hl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,1 L7,4 L0,7" fill="none" stroke="${accentColor}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="ah-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0,1 L7,4 L0,7" fill="none" stroke="#9d978a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
  ` + map.arrows.map(arr => {
    const a = map.nodes[arr.from];
    const b = map.nodes[arr.to];
    if (!a || !b) return '';
    // Don't draw arrows touching chords filtered out by the scope
    if (!isChordInScope(a.chord) || !isChordInScope(b.chord)) return '';
    const aIsHub = a.hub;
    const bIsHub = b.hub;
    const aChDef = map.chordDefs[a.chord];
    const bChDef = map.chordDefs[b.chord];
    const aSat = aChDef && (aChDef.tag === 'secondary' || aChDef.tag === 'borrowed');
    const bSat = bChDef && (bChDef.tag === 'secondary' || bChDef.tag === 'borrowed');
    const aw = aIsHub ? 130 : (aSat ? 92 : 100);
    const bw = bIsHub ? 130 : (bSat ? 92 : 100);
    const ah = aIsHub ? 145 : (aSat ? 100 : 115);
    const bh = bIsHub ? 145 : (bSat ? 100 : 115);
    const acx = a.x + aw/2;
    const acy = a.y + ah/2;
    const bcx = b.x + bw/2;
    const bcy = b.y + bh/2;

    const dx = bcx - acx, dy = bcy - acy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (!dist) return '';
    const ux = dx/dist, uy = dy/dist;
    const aRadX = aw/2 * 0.92, aRadY = ah/2 * 0.7;
    const tA = 1 / Math.max(Math.abs(ux)/aRadX, Math.abs(uy)/aRadY);
    const sx = acx + ux * tA;
    const sy = acy + uy * tA;
    const bRadX = bw/2 * 0.92, bRadY = bh/2 * 0.7;
    const tB = 1 / Math.max(Math.abs(ux)/bRadX, Math.abs(uy)/bRadY);
    const ex = bcx - ux * tB;
    const ey = bcy - uy * tB;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const perpX = -uy, perpY = ux;
    // Gentler curve — short arrows nearly straight, long arrows softly arched
    const curveAmt = dist < 180 ? dist * 0.06 : Math.min(70, dist * 0.18);
    const curveDir = (arr.curve === undefined) ? 1 : arr.curve;
    const cx = mx + perpX * curveAmt * curveDir;
    const cy = my + perpY * curveAmt * curveDir;

    const aChord = a.chord, bChord = b.chord;
    const isHl = (aChord === state.focusedChord) || (bChord === state.focusedChord);

    // Only DRAW arrows that touch the focused chord — keeps the map clean.
    if (!isHl) return '';

    // When the focused chord is the tonic hub, suppress ALL its arrows.
    // The relationships are conveyed by glowing the connected cards instead.
    const focusedNode = Object.values(map.nodes).find(n => n.chord === state.focusedChord);
    if (focusedNode?.hub) return '';

    // Voice-leading cost → opacity (smoother connections are bolder)
    const va = voicings[aChord];
    const vb = voicings[bChord];
    let opacity = 0.85;
    if (va?.shape && vb?.shape) {
      const cost = totalVoiceMovement(va.shape, vb.shape);
      if (cost <= 3) opacity = 1.0;
      else if (cost <= 7) opacity = 0.8;
      else opacity = 0.55;
    }

    // Hand-rolled arrowhead — compute the exact tangent at the path end so
    // direction is guaranteed correct on every browser (mobile Safari has
    // historically mis-oriented SVG <marker> arrows with curved Q paths).
    // Tangent of Q at t=1 is (end - control), pointing OUT of the path end.
    const tdx = ex - cx, tdy = ey - cy;
    const tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
    const tux = tdx / tlen, tuy = tdy / tlen;
    const arrSize = 7;
    // Tip sits at (ex,ey); two wings flare backward along -tangent ± perpendicular
    const baseX = ex - tux * arrSize;
    const baseY = ey - tuy * arrSize;
    const wing = arrSize * 0.55;
    const w1x = baseX + (-tuy) * wing, w1y = baseY + ( tux) * wing;
    const w2x = baseX - (-tuy) * wing, w2y = baseY - ( tux) * wing;
    const head = `<polyline points="${w1x.toFixed(1)},${w1y.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)} ${w2x.toFixed(1)},${w2y.toFixed(1)}" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>`;
    return `<path d="M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="${accentColor}" stroke-width="1.8" opacity="${opacity}" stroke-linecap="round"/>${head}`;
  }).join('');

  // ── Light up the cards connected to the focused chord ──
  // Find chord IDs that the focused chord points TO or FROM
  const relatedIds = new Set();
  map.arrows.forEach(arr => {
    const a = map.nodes[arr.from];
    const b = map.nodes[arr.to];
    if (!a || !b) return;
    if (a.chord === state.focusedChord) relatedIds.add(b.chord);
    if (b.chord === state.focusedChord) relatedIds.add(a.chord);
  });
  const focusedNode2 = Object.values(map.nodes).find(n => n.chord === state.focusedChord);
  const isFocusedHub = !!focusedNode2?.hub;
  document.querySelectorAll('.map-card').forEach(c => {
    c.classList.remove('related', 'related-from-hub');
    if (relatedIds.has(c.dataset.chord)) {
      c.classList.add('related');
      if (isFocusedHub) c.classList.add('related-from-hub');
    }
  });
}

function renderAlternatives() {
  const altRow = document.getElementById('alt-row');
  const altName = document.getElementById('alt-chord-name');
  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const chordName = nameOf(root, flats) + QUALITIES[fc.quality].sfx;
  altName.textContent = `${fc.roman} · ${chordName}`;

  const current = state.userVoicing || {stringSetIdx: 2, inversion: 0};
  const currentKey = `${current.stringSetIdx}.${current.inversion}`;

  const autoSel = state.userVoicing === null ? 'selected' : '';
  let html = `
    <div class="alt-card ${autoSel}" data-auto="1" style="justify-content:center">
      <div style="font-size:14px;color:var(--accent);font-weight:700;text-align:center;line-height:1.2;padding:24px 0">↻<br><span style="font-size:9px;text-transform:uppercase;letter-spacing:1px">auto</span></div>
      <div class="ac-label">smoothest</div>
      <div class="ac-notes">(re-pick)</div>
    </div>
  `;

  for (let inv = 0; inv < 4; inv++) {
    for (let ss = 0; ss < STRING_SETS.length; ss++) {
      const sh = dropTwoVoicing(fc.quality, root, ss, inv);
      if (!sh) continue;
      const sel = (`${ss}.${inv}` === currentKey && state.userVoicing) ? 'selected' : '';
      const invN = ['R','1st','2nd','3rd'][inv];
      const label = `${invN} · ${STRING_SETS[ss].label}`;
      const notes = sh.map((f, st) => f < 0 ? '' : nameOf(noteAt(st, f), flats)).filter(x => x).join(' ');
      html += `
        <div class="alt-card ${sel}" data-ss="${ss}" data-inv="${inv}">
          ${renderMini(sh, root, fc.quality, flats, {W:88, H:92, r:7})}
          <div class="ac-label">${label}</div>
          <div class="ac-notes">${notes}</div>
        </div>
      `;
    }
  }

  altRow.innerHTML = html;
  altRow.querySelectorAll('[data-auto]').forEach(c => {
    c.addEventListener('click', () => {
      state.userVoicing = null;
      // Compose: if focused chord is the last typed, re-pick its voicing too
      if (!player.playing) {
        const seq = state.composedProgression;
        if (seq.length && seq[seq.length - 1].chord === fc.id) {
          const ch = currentMap().chordDefs[fc.id];
          const r  = chordRoot(ch);
          const prev = seq.length > 1 ? seq[seq.length - 2].shape : null;
          const sm = smoothestVoicing(ch.quality, r, prev);
          if (sm) {
            seq[seq.length - 1].shape = sm.shape;
            seq[seq.length - 1]._candIdx = 0;
            renderComposeStrip();
          }
        }
      }
      applyAltToComping(fc.id, null);
      renderAll();
    });
  });
  altRow.querySelectorAll('[data-ss]').forEach(c => {
    c.addEventListener('click', () => {
      const ss = +c.dataset.ss, inv = +c.dataset.inv;
      state.userVoicing = {stringSetIdx: ss, inversion: inv};
      const ch = currentMap().chordDefs[fc.id];
      const r  = chordRoot(ch);
      const sh = dropTwoVoicing(ch.quality, r, ss, inv);
      // Compose: replace last chord's voicing if it matches the focused one
      if (!player.playing && sh) {
        const seq = state.composedProgression;
        if (seq.length && seq[seq.length - 1].chord === fc.id) {
          seq[seq.length - 1].shape = sh;
          renderComposeStrip();
        }
      }
      applyAltToComping(fc.id, sh ? { shape: sh, stringSetIdx: ss, inversion: inv } : null);
      renderAll();
    });
  });
}

// Push an alternate voicing into the live AI comping path, if playing:
//   - cache it so the next bar of this chord uses it
//   - if it's the chord currently sounding, re-trigger so the change is audible now
function applyAltToComping(chordId, voicing) {
  if (!player || !player.playing) return;
  if (voicing && voicing.shape) {
    state.progressionVoicings[chordId] = voicing;
  } else {
    delete state.progressionVoicings[chordId];
  }
  // Invalidate the cached page-plan so the next bar re-resolves with the new voicing
  if (player._cachedPlanPage !== undefined) player._cachedPlanPage = -1;
  if (player.currentChord === chordId && typeof player.jumpTo === 'function') {
    player.jumpTo(chordId);
  }
}

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */

const FB = {W:2500, H:380, ml:60, mr:20, mt:30, mb:30, openW:70, noteR:16};

function renderFretboard() {
  const svg = document.getElementById('fretboard-svg');
  const innerW = FB.W - FB.ml - FB.mr - FB.openW;
  const fretW = innerW / N_FRETS;
  const stringsH = FB.H - FB.mt - FB.mb;
  const ss = stringsH / 5;

  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const q = QUALITIES[fc.quality];
  const focShape = focusedShape();

  const activeFrets = focShape.shape ? new Set(focShape.shape.map((f, i) => f >= 0 ? `${i}.${f}` : null).filter(Boolean)) : new Set();

  const chordPcs = new Set(q.ints.map(i => (root + i) % 12));
  const chordDegFromRoot = {};
  q.ints.forEach((semi, i) => {
    const pc = (root + semi) % 12;
    if (!(pc in chordDegFromRoot)) chordDegFromRoot[pc] = q.degs[i];
  });

  let s = '';
  const diamond = (cx, cy) => `<polygon points="${cx},${cy-11} ${cx+11},${cy} ${cx},${cy+11} ${cx-11},${cy}" fill="#aaa496"/>`;
  [3,5,7,9,15,17,19,21].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + stringsH/2);
  });
  [12, 24].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + ss);
    s += diamond(cx, FB.mt + ss*4);
  });

  for (let f = 0; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + f * fretW;
    const w = f === 0 ? 6 : 1.5;
    const color = f === 0 ? '#1a1a1f' : '#c8c8cc';
    s += `<line x1="${x}" y1="${FB.mt - 4}" x2="${x}" y2="${FB.mt + stringsH + 4}" stroke="${color}" stroke-width="${w}"/>`;
  }
  for (let f = 1; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += `<text x="${x}" y="${FB.H - 8}" text-anchor="middle" font-size="11" fill="#8a8a92" font-family="SF Mono, monospace">${f}</text>`;
  }
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    const w = 0.6 + (5 - str) * 0.35;
    s += `<line x1="${FB.ml}" y1="${y}" x2="${FB.W - FB.mr}" y2="${y}" stroke="#a8a8b0" stroke-width="${w}"/>`;
    s += `<text x="${FB.ml - 10}" y="${y + 5}" text-anchor="end" font-size="13" fill="#7a7a82" font-family="SF Mono, monospace" font-weight="700">${STRING_LABELS[str]}</text>`;
  }

  // Shadow chord-tones
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const pc = noteAt(str, f);
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!chordPcs.has(pc) || isActive) continue;
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      s += `<circle cx="${cx}" cy="${y}" r="9" fill="${c}" opacity="0.42" stroke="#000" stroke-width="0.5"/>`;
    }
  }

  // Active voicing — bright
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!isActive) continue;
      const pc = noteAt(str, f);
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      const isRoot = pc === root;
      if (isRoot) {
        s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR + 5}" fill="none" stroke="${c}" stroke-width="2.2" opacity="0.6"/>`;
      }
      s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR}" fill="${c}" stroke="#000" stroke-width="1.5"/>`;
      const noteName = nameOf(pc, flats);
      if (state.display === 'notes') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${noteName}</text>`;
      } else if (state.display === 'intervals') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${deg}</text>`;
      } else {
        s += `<text x="${cx}" y="${y - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="#000">${noteName}</text>`;
        s += `<text x="${cx}" y="${y + 10}" text-anchor="middle" font-size="8" font-weight="700" fill="#000" opacity="0.7">${deg}</text>`;
      }
    }
  }

  svg.innerHTML = s;
}

function renderKeyRow() {
  const el = document.getElementById('key-row');
  // Piano layout: 7 white keys + 5 black keys overlaid
  const whitePCs   = [0, 2, 4, 5, 7, 9, 11];  // C D E F G A B
  const blackInfo  = [
    {pc:1,  after:0}, // C#/Db between C(0) and D(1 idx)
    {pc:3,  after:1}, // D#/Eb between D and E
    {pc:6,  after:3}, // F#/Gb between F and G
    {pc:8,  after:4}, // G#/Ab between G and A
    {pc:10, after:5}, // A#/Bb between A and B
  ];
  const whiteW = 24;
  const blackW = 16;
  const totalW = whitePCs.length * whiteW;

  let html = `<div class="key-piano" style="width:${totalW}px">`;
  whitePCs.forEach(pc => {
    const r = ROOTS[pc];
    const active = state.keyPc === pc ? 'active' : '';

  });
  blackInfo.forEach(b => {
    const r = ROOTS[b.pc];
    const active = state.keyPc === b.pc ? 'active' : '';
    const left = (b.after + 1) * whiteW - blackW / 2;
    html += `<div class="pk-black ${active}" data-pc="${b.pc}" style="left:${left}px">${r.name}</div>`;
  });

}

function setInstrument(inst) {
  state.instrument = inst;
  document.body.classList.toggle('instrument-piano', inst === 'piano');
  document.body.classList.toggle('instrument-guitar', inst === 'guitar');

  // Piano mode: stack cycle + loop into a single right-column inside the
  // staff row, splitting vertically ~30/70. Guitar mode: restore them to
  // their original separate rows (cycle in row 1, loop in row 2).
  const cycleBtn = document.getElementById('cycle-toggle');
  const loopBtn  = document.getElementById('loop-toggle');
  if (cycleBtn && loopBtn) {
    if (inst === 'piano') {
      let stack = document.getElementById('right-btn-stack');
      if (!stack) {
        stack = document.createElement('div');
        stack.id = 'right-btn-stack';
        stack.className = 'right-btn-stack';
      }
      stack.appendChild(cycleBtn);    // top
      stack.appendChild(loopBtn);     // bottom
      const tabsRow = document.querySelector('.rb-stack > .rb-row:nth-child(2)');
      if (tabsRow) tabsRow.appendChild(stack);
    } else {
      const row1 = document.querySelector('.rb-stack > .rb-row:first-child');
      const row2 = document.querySelector('.rb-stack > .rb-row:nth-child(2)');
      if (row1) row1.appendChild(cycleBtn);
      if (row2) row2.appendChild(loopBtn);
      const stack = document.getElementById('right-btn-stack');
      if (stack) stack.remove();
    }

  if (typeof renderChordPiano === 'function') renderChordPiano();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();

}

   ORCHESTRATE

/* ════════════════════════════════════════════════════════════
   AUDIO — drones (Web Audio API)
   ════════════════════════════════════════════════════════════ */

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Karplus-Strong physical-model plucked string. Returns an AudioBuffer.
function ksBuffer(ctx, freq, opts = {}) {
  const duration   = opts.duration   ?? 2.2;
  const brightness = opts.brightness ?? 0.5;  // 0 bright, 1 warm
  const damping    = opts.damping    ?? 0.9975;
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.floor(sr / freq));
  const samples = Math.floor(duration * sr);
  const buf = ctx.createBuffer(1, samples, sr);
  const data = buf.getChannelData(0);
  // Delay line — shaped pluck (low-passed noise)
  const delay = new Float32Array(N);
  for (let i = 0; i < N; i++) delay[i] = Math.random() * 2 - 1;
  // Low-pass the initial burst (2 passes for warmer attack)
  for (let pass = 0; pass < 2; pass++) {
    let prev = 0;
    for (let i = 0; i < N; i++) {
      const v = delay[i] * (1 - brightness) + prev * brightness;
      delay[i] = v;
      prev = v;
    }
  }
  // Karplus-Strong main loop: output sample, average with next, feed back with damping
  let idx = 0;
  for (let i = 0; i < samples; i++) {
    const cur = delay[idx];
    data[i] = cur;
    const nxt = delay[(idx + 1) % N];
    delay[idx] = (cur + nxt) * 0.5 * damping;
    idx = (idx + 1) % N;
  }
  return buf;
}

// Tube-style soft saturation curve (warm even+odd harmonics, no harshness)
function makeSatCurve(amount = 8) {
  const n = 2048;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    // tanh-style soft clip with slight asymmetry for tube warmth
    const y = Math.tanh(x * amount) / Math.tanh(amount);
    curve[i] = y * 0.85 + (y * y * Math.sign(y)) * 0.06;
  }
  return curve;
}

// Generate a short plate/room reverb impulse response. Cached per ctx.
let _jazzReverbIR = null;
function getJazzReverbIR(ctx) {
  if (_jazzReverbIR && _jazzReverbIR._sr === ctx.sampleRate) return _jazzReverbIR;
  const sr = ctx.sampleRate;
  const duration = 1.8;
  const len = Math.floor(sr * duration);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      // Exponential decay, slightly slower in the early tail
      const env = Math.pow(1 - t, 2.2) * (1 - 0.4 * Math.pow(t, 0.3));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    // gentle low-pass on the IR (one-pole) so reverb is dark, not splashy
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const v = data[i] * 0.35 + prev * 0.65;
      data[i] = v;
      prev = v;
    }
  }
  buf._sr = sr;
  _jazzReverbIR = buf;
  return buf;
}

class Drone {
  constructor() {
    this.nodes = [];
    this.master = null;
    this.playing = false;
    this.targetVolume = 0.18;
  }
  start(midiNotes, volume, forceRestart = false) {
    // Avoid restarting if the pitches didn't change (prevents clicking on focus
    // changes). Skip this short-circuit when the caller is explicitly asking
    // for a re-strike — e.g. the bar scheduler hitting the same chord at the
    // start of a new step, where the player WANTS the chord to sound again.
    if (!forceRestart && this.playing && this.lastNotes &&
        midiNotes.length === this.lastNotes.length &&
        midiNotes.every((n, i) => n === this.lastNotes[i])) {
      this.setVolume(volume);
      return;
    }
    const ctx = ensureAudio();
    // Quick crossfade out of any previous master to avoid clicks
    if (this.playing && this.master) {
      const oldM = this.master, oldN = this.nodes;
      const now = ctx.currentTime;
      oldM.gain.cancelScheduledValues(now);
      oldM.gain.linearRampToValueAtTime(0, now + 0.06);
      setTimeout(() => {
        oldN.forEach(n => {
          try {
            if (n.o1) n.o1.stop();
            if (n.o2) n.o2.stop();
            if (n.o3) n.o3.stop();
            if (n.lfo) n.lfo.stop();
          } catch(e) {}
        });
        try { oldM.disconnect(); } catch(e) {}
      }, 90);
    } else {
      this._immediateStop();
    }
    if (!midiNotes.length) {
      this.master = null; this.nodes = []; this.playing = false; this.lastNotes = null;
      return;
    }
    this.nodes = []; // fresh array for new oscillators
    this.lastNotes = [...midiNotes];
    this.targetVolume = volume;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    const sortedNotes = [...midiNotes].sort((a,b) => a - b);
    const now = ctx.currentTime;
    const timbre = droneTimbre;

    // Tremolo LFO only for Rhodes (the iconic wobble)
    if (timbre === 'rhodes') {
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 4.6;
      const lfoDepth = ctx.createGain();
      lfoDepth.gain.value = 0.055;
      lfo.connect(lfoDepth);
      lfoDepth.connect(this.master.gain);
      lfo.start(now);
      this.nodes.push({lfo});
    }

    sortedNotes.forEach((midi, i) => {
      const startOffset = timbre === 'pad' ? 0 : i * 0.006;
      const t = now + startOffset;
      if (timbre === 'pad') this._voicePad(midi, i, sortedNotes.length, t);
      else if (timbre === 'organ') this._voiceOrgan(midi, i, sortedNotes.length, t);
      else if (timbre === 'piano') this._voicePiano(midi, i, sortedNotes.length, t);
      else if (timbre === 'jazzgtr') this._voiceJazzGuitar(midi, i, sortedNotes.length, t);
      else this._voiceRhodes(midi, i, sortedNotes.length, t);
    });

    // Per-timbre master attack
    const attack = timbre === 'pad' ? 0.4 : (timbre === 'organ' ? 0.18 : (timbre === 'piano' ? 0.05 : (timbre === 'jazzgtr' ? 0.04 : 0.06)));
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(0, now);
    this.master.gain.linearRampToValueAtTime(this.targetVolume, now + attack);
    this.playing = true;
  }

  _voiceRhodes(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = freq;
    const ratio = midi < 55 ? 4 : (midi < 70 ? 7 : 14);
    const modulator = ctx.createOscillator();
    modulator.type = 'sine';
    modulator.frequency.value = freq * ratio;
    const modDepth = ctx.createGain();
    const peakDepth = freq * 3.2;
    const restDepth = freq * 0.12;
    modDepth.gain.setValueAtTime(0, t);
    modDepth.gain.linearRampToValueAtTime(peakDepth, t + 0.004);
    modDepth.gain.exponentialRampToValueAtTime(restDepth, t + 0.45);
    modulator.connect(modDepth);
    modDepth.connect(carrier.frequency);
    const pitchRoll = 1.0 - (i / total) * 0.4;
    const peakVol = 0.22 * pitchRoll;
    const sustainVol = peakVol * 0.62;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(peakVol, t + 0.008);
    noteG.gain.exponentialRampToValueAtTime(sustainVol, t + 0.5);
    carrier.connect(noteG);
    noteG.connect(this.master);
    carrier.start(t); modulator.start(t);
    this.nodes.push({o1: carrier, o2: modulator});
  }

  _voicePad(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq; o1.detune.value = -6;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq; o2.detune.value =  6;
    const o3 = ctx.createOscillator(); o3.type = 'sine';     o3.frequency.value = freq;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 1400 + (midi - 36) * 28;
    filt.Q.value = 0.5;
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const sineG = ctx.createGain(); sineG.gain.value = 0.48;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.12 * pitchRoll, t + 0.025);
    o1.connect(filt); o2.connect(filt);
    o3.connect(sineG); sineG.connect(filt);
    filt.connect(noteG); noteG.connect(this.master);
    o1.start(t); o2.start(t); o3.start(t);
    this.nodes.push({o1, o2, o3});
  }

  _voiceOrgan(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Drawbar-style harmonics (Hammond-ish)
    const harmonics = [
      {ratio: 1,   gain: 0.75},
      {ratio: 2,   gain: 0.50},
      {ratio: 3,   gain: 0.30},
      {ratio: 4,   gain: 0.20},
      {ratio: 6,   gain: 0.12},
    ];
    const pitchRoll = 1.0 - (i / total) * 0.30;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.12 * pitchRoll, t + 0.04);
    // Soft lowpass for warmth
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200 + (midi - 36) * 30;
    lp.Q.value = 0.4;
    noteG.connect(lp);
    lp.connect(this.master);
    const oscs = [];
    harmonics.forEach(h => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * h.ratio;
      const g = ctx.createGain(); g.gain.value = h.gain;
      o.connect(g); g.connect(noteG);
      o.start(t);
      oscs.push(o);
    });
    // Track oscillators in chunks of 3 (so stop logic catches them all)
    for (let j = 0; j < oscs.length; j += 3) {
      this.nodes.push({ o1: oscs[j], o2: oscs[j+1], o3: oscs[j+2] });
    }
  }

  _voicePiano(midi, i, total, t) {
    // Calm felt/acoustic piano: gentle hammer attack, mellow decay
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Fundamental sine
    const fund = ctx.createOscillator();
    fund.type = 'sine'; fund.frequency.value = freq;
    // Triangle for body
    const tri = ctx.createOscillator();
    tri.type = 'triangle'; tri.frequency.value = freq;
    // Subtle 2nd harmonic (octave above) for slight piano color
    const harm = ctx.createOscillator();
    harm.type = 'sine'; harm.frequency.value = freq * 2;
    const harmG = ctx.createGain(); harmG.gain.value = 0.18;
    const triG = ctx.createGain(); triG.gain.value = 0.45;
    // Soft lowpass with a slight downward sweep (felt damping)
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(1100, t + 0.5);
    lp.Q.value = 0.35;
    // Pitch-dependent decay — high notes die faster like a real piano.
    const decayTime = midi < 55 ? 5.0 : (midi < 65 ? 4.0 : (midi < 72 ? 3.2 : 2.5));
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const peakVol = 0.22 * pitchRoll;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(peakVol, t + 0.018);            // soft felt attack
    env.gain.exponentialRampToValueAtTime(peakVol * 0.5,  t + 0.35);       // hammer pluck dies
    env.gain.exponentialRampToValueAtTime(peakVol * 0.15, t + decayTime * 0.55);
    env.gain.exponentialRampToValueAtTime(0.0001,         t + decayTime);  // full fade to silence
    fund.connect(env);
    tri.connect(triG); triG.connect(env);
    harm.connect(harmG); harmG.connect(env);
    env.connect(lp);
    lp.connect(this.master);
    fund.start(t); tri.start(t); harm.start(t);
    // Free the oscillators after the envelope finishes so they don't pile up
    fund.stop(t + decayTime + 0.1);
    tri.stop(t + decayTime + 0.1);
    harm.stop(t + decayTime + 0.1);
    this.nodes.push({o1: fund, o2: tri, o3: harm});
  }

  _voiceJazzGuitar(midi, i, total, t) {
    // Soft archtop jazz guitar — Karplus-Strong physically modeled plucked string
    // plus body-formant EQ to suggest the wooden hollow body.
    const ctx = audioCtx;
    const freq = midiToFreq(midi);

    // Joe-Pass dark archtop: neck pickup, tone rolled off — heavily damped attack
    const brightness = midi < 55 ? 0.86 : (midi < 70 ? 0.82 : 0.78);
    // Long sustain across the range (hollow body resonance)
    const damping = midi < 55 ? 0.9990 : (midi < 70 ? 0.9984 : 0.9978);

    const buf = ksBuffer(ctx, freq, {
      duration: 7,
      brightness,
      damping,
    });
    const src = ctx.createBufferSource();
    src.buffer = buf;

    // Body formants — typical archtop hollow-body resonances, gentle
    const f1 = ctx.createBiquadFilter();
    f1.type = 'peaking'; f1.frequency.value = 180; f1.Q.value = 1.2; f1.gain.value = 2.5;
    const f2 = ctx.createBiquadFilter();
    f2.type = 'peaking'; f2.frequency.value = 520; f2.Q.value = 1.4; f2.gain.value = 2.0;
    const f3 = ctx.createBiquadFilter();
    f3.type = 'peaking'; f3.frequency.value = 1400; f3.Q.value = 1.6; f3.gain.value = 1.0;

    // Joe Pass tone-knob-rolled-off: aggressive top-end roll (two cascaded LPs for steeper slope)
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1700; lp.Q.value = 0.5;
    const lp2 = ctx.createBiquadFilter();
    lp2.type = 'lowpass'; lp2.frequency.value = 1900; lp2.Q.value = 0.5;
    // High-shelf to crush any sizzle that remains
    const hsh = ctx.createBiquadFilter();
    hsh.type = 'highshelf'; hsh.frequency.value = 2200; hsh.gain.value = -14;

    // Per-voice volume balance
    const pitchRoll = 1 - (i / total) * 0.35;
    const vol = 0.32 * pitchRoll;
    const g = ctx.createGain();
    // Gentle plucked-string envelope: brief settling after the pluck, then slow body decay.
    const decayTime = midi < 55 ? 6.5 : (midi < 65 ? 5.5 : (midi < 72 ? 4.5 : 3.5));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    // Small settle: pluck transient drops ~15% in the first half-second
    g.gain.exponentialRampToValueAtTime(vol * 0.85, t + 0.5);
    // Long slow decay through the body of the note
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + decayTime * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decayTime);

    // Lazy-create a shared FX bus on this Drone (saturation + parallel reverb)
    // so all jazz-guitar voices share one amp + reverb tail instead of each voice
    // spawning its own convolver.
    if (!this._gtrFx || this._gtrFx._master !== this.master) {
      // Pre-amp tone: gentle low-mid warmth, scoop the upper mids slightly
      const preEq = ctx.createBiquadFilter();
      preEq.type = 'peaking'; preEq.frequency.value = 350; preEq.Q.value = 0.8; preEq.gain.value = 1.8;
      const scoop = ctx.createBiquadFilter();
      scoop.type = 'peaking'; scoop.frequency.value = 2200; scoop.Q.value = 1.2; scoop.gain.value = -3.0;

      // VERY light tube warmth — barely audible, just removes digital edge
      const drive = ctx.createGain();  drive.gain.value = 1.15;
      const sat = ctx.createWaveShaper();
      sat.curve = makeSatCurve(2.2);
      sat.oversample = '4x';
      const postSat = ctx.createGain(); postSat.gain.value = 0.88;

      // Speaker cab — dark, woody
      const ampLp = ctx.createBiquadFilter();
      ampLp.type = 'lowpass'; ampLp.frequency.value = 2000; ampLp.Q.value = 0.5;
      const ampHp = ctx.createBiquadFilter();
      ampHp.type = 'highpass'; ampHp.frequency.value = 85; ampHp.Q.value = 0.5;

      // Parallel reverb send — subtle room, not a plate
      const dry = ctx.createGain(); dry.gain.value = 0.92;
      const sendToVerb = ctx.createGain(); sendToVerb.gain.value = 0.22;
      const conv = ctx.createConvolver();
      conv.buffer = getJazzReverbIR(ctx);
      const verbTone = ctx.createBiquadFilter();
      verbTone.type = 'lowpass'; verbTone.frequency.value = 2200; verbTone.Q.value = 0.4;
      const wet = ctx.createGain(); wet.gain.value = 0.18;

      // Bus input — voices connect here
      const input = ctx.createGain(); input.gain.value = 1.0;

      // Wiring
      input.connect(preEq); preEq.connect(scoop); scoop.connect(drive); drive.connect(sat); sat.connect(postSat);
      postSat.connect(ampHp); ampHp.connect(ampLp);
      ampLp.connect(dry); dry.connect(this.master);
      ampLp.connect(sendToVerb); sendToVerb.connect(conv); conv.connect(verbTone); verbTone.connect(wet); wet.connect(this.master);

      this._gtrFx = { input, _master: this.master };
    }

    src.connect(f1); f1.connect(f2); f2.connect(f3); f3.connect(lp); lp.connect(lp2); lp2.connect(hsh); hsh.connect(g); g.connect(this._gtrFx.input);
    src.start(t);
    this.nodes.push({o1: src});
  }

  _immediateStop() {
    this.nodes.forEach(n => {
      try {
        if (n.o1) n.o1.stop();
        if (n.o2) n.o2.stop();
        if (n.o3) n.o3.stop();
        if (n.lfo) n.lfo.stop();
      } catch(e) {}
    });
    if (this.master) { try { this.master.disconnect(); } catch(e) {} }
    this.nodes = []; this.master = null; this.playing = false;
    this.lastNotes = null;
  }
  stop(fadeMs = 350) {
    if (!this.playing || !audioCtx) return this._immediateStop();
    const now = audioCtx.currentTime;
    const m = this.master, n = this.nodes;
    m.gain.cancelScheduledValues(now);
    m.gain.linearRampToValueAtTime(0, now + fadeMs/1000);
    setTimeout(() => {
      n.forEach(x => {
        try {
          if (x.o1) x.o1.stop();
          if (x.o2) x.o2.stop();
          if (x.o3) x.o3.stop();
          if (x.lfo) x.lfo.stop();
        } catch(e) {}
      });
      try { m.disconnect(); } catch(e) {}
    }, fadeMs + 60);
    this.master = null; this.nodes = []; this.playing = false;
  }
  setVolume(v) {
    this.targetVolume = v;
    if (this.master && audioCtx) {
      this.master.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
    }
  }
}

let droneTimbre = 'piano';
let loopMode = false;
// Key-cycle modes: 'none' | 'chromatic' (+1 semitone per loop) | 'fourths' (+5)
let cycleMode = 'none';

];

const tonicDrone = new Drone();
const chordDrone = new Drone();

/* ─── Bass pluck (jazz upright pizzicato) ─── */

function bassMidiForPc(pc) {
  // Map pitch class to a bass register (MIDI 32-43 range, G#1 to G2)
  let midi = 24 + pc;
  while (midi < 32) midi += 12;
  if (midi > 43) midi -= 12;
  return midi;
}

function playBassPluck(midi, time, volume) {
  const ctx = audioCtx;
  if (!ctx) return [];
  const freq = midiToFreq(midi);

  // Triangle = warm body
  const tri = ctx.createOscillator();
  tri.type = 'triangle'; tri.frequency.value = freq;
  // Sine sub for depth
  const sine = ctx.createOscillator();
  sine.type = 'sine'; sine.frequency.value = freq;
  // Brief saw click for the pluck transient
  const click = ctx.createOscillator();
  click.type = 'sawtooth'; click.frequency.value = freq * 2;
  const clickG = ctx.createGain();
  clickG.gain.setValueAtTime(0, time);
  clickG.gain.linearRampToValueAtTime(volume * 0.35, time + 0.003);
  clickG.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);

  // Lowpass with downward sweep — "thump" envelope
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1200, time);
  lp.frequency.exponentialRampToValueAtTime(280, time + 0.3);
  lp.Q.value = 0.7;

  // Main amplitude envelope
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(volume, time + 0.008);
  env.gain.exponentialRampToValueAtTime(volume * 0.45, time + 0.18);
  env.gain.exponentialRampToValueAtTime(0.0008, time + 1.3);

  tri.connect(env);
  sine.connect(env);
  click.connect(clickG); clickG.connect(env);
  env.connect(lp);
  lp.connect(ctx.destination);

  tri.start(time); sine.start(time); click.start(time);
  tri.stop(time + 1.4); sine.stop(time + 1.4); click.stop(time + 0.06);

  return [tri, sine, click];
}

function tonicMidiNotes() {
  // Root note in 2 octaves (bass + tenor) + fifth above for body
  const pc = state.keyPc;
  return [36 + pc, 48 + pc, 36 + pc + 7];
}
function chordMidiNotes() {
  const fs = focusedShape();
  if (!fs.shape) return [];
  return fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
}

// Per-channel volumes (0..1). The mixer popover writes here; audio sites read.
const channelVols = {
  chords:    0.7,
  bass:      0.7,
  metronome: 0.7,
  tonic:     0.0,    // off by default; raise in mixer to enable
};
const CHANNEL_SCALES = { chords: 0.5, bass: 0.5, metronome: 1.0, tonic: 0.5 };
function chVol(name) { return channelVols[name] * (CHANNEL_SCALES[name] ?? 0.5); }

// Backward-compat shim — old call sites that meant "the chord/drone volume"
function currentDroneVolume() { return chVol('chords'); }

// Bass is enabled whenever its slider is above zero.
function isBassEnabled() { return channelVols.bass > 0.001; }

function updateActiveDrones() {
  if (tonicDrone.playing) tonicDrone.start(tonicMidiNotes(), chVol('tonic'));
  if (chordDrone.playing) chordDrone.start(chordMidiNotes(), chVol('chords'));
}

// Auto start/stop the tónica drone when its channel volume crosses zero.
function syncTonicDrone() {
  if (channelVols.tonic > 0.001) {
    if (!tonicDrone.playing) tonicDrone.start(tonicMidiNotes(), chVol('tonic'));
    else tonicDrone.setVolume(chVol('tonic'));
  } else {
    if (tonicDrone.playing) tonicDrone.stop();
  }
}
