// Ring the currently focused chord's voicing — used for manual navigation
// (keyboard shortcut OR chord card click). Skips when the AI is playing so
// we don't double up. The jazz-guitar voice has natural per-note decay so
// the chord fades out on its own without ringing forever.
function ringFocusedChord() {
  if (player.playing) return;
  ensureAudio();
  const fs = focusedShape();
  if (!fs?.shape) return;
  const notes = fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
  if (!notes.length) return;
  chordDrone.start(notes, currentDroneVolume() * 1.8, true);
  // Safety: fade the master after ~2s so audio never lingers indefinitely
  if (chordDrone.master && audioCtx) {
    const m = chordDrone.master;
    const now = audioCtx.currentTime;
    m.gain.cancelScheduledValues(now + 2);
    m.gain.setTargetAtTime(0, now + 2, 0.5);
  }
}

// Audition a chord WHILE the AI is playing — rings the clicked chord on top
// of the playback so the user can hear what they tapped, without altering the
// progression. The next bar boundary's scheduled chord will naturally
// overwrite the audition, restoring whatever was supposed to be playing.
// A timeout also reverts the visual focus to the chord that's actually
// sounding, so the highlight doesn't get stuck on the auditioned card.
let _auditionRevertTimer = null;
function auditionChord(chordId) {
  if (!player.playing) return;
  ensureAudio();
  const fs = focusedShape();
  if (!fs?.shape) return;
  const notes = fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
  if (!notes.length) return;
  chordDrone.start(notes, currentDroneVolume() * 1.8, true);
  // Revert the focused chord back to whatever the player is on after a few
  // seconds (or sooner if the user clicks again — the timer is replaced).
  if (_auditionRevertTimer) clearTimeout(_auditionRevertTimer);
  _auditionRevertTimer = setTimeout(() => {
    _auditionRevertTimer = null;
    if (!player.playing) return;
    state.focusedChord = player.currentChord || state.focusedChord;
    state.userVoicing = null;
    renderAll();
    // Re-apply playing / next-up classes lost during renderAll
    document.querySelectorAll('.map-card').forEach(c => {
      if (c.dataset.chord === player.currentChord) c.classList.add('playing');
      else if (c.dataset.chord === player.nextChord) c.classList.add('next-up');
    });
  }, 3500);
}

/* ─── Chord-scope filter ─── */
// Controls which chords appear in the chord map AND which progressions the AI can choose.
const SCOPE_OPTIONS = [
  {value: 'all',      emoji: '✦', label: 'All',        desc: 'diatonic + secondaries + borrowed'},
  {value: 'diatonic', emoji: '◇', label: 'Diatonic',   desc: 'only the 7 diatonic chords'},
  {value: 'borrowed', emoji: '◈', label: '+ Borrowed', desc: 'diatonic + modal interchange'},
  {value: 'secondary',emoji: '✷', label: '+ Secondaries', desc: 'diatonic + secondary dominants'},
];
let chordScope = 'all';

// True iff `chordId` is allowed under the current scope.
function isChordInScope(chordId) {
  const ch = currentMap().chordDefs[chordId];
  if (!ch) return false;
  if (chordScope === 'all') return true;
  if (chordScope === 'diatonic') return ['tonic','predom','dom'].includes(ch.tag);
  if (chordScope === 'borrowed') return ['tonic','predom','dom','borrowed'].includes(ch.tag);
  if (chordScope === 'secondary') return ['tonic','predom','dom','secondary'].includes(ch.tag);
  return true;
}

      // If focused chord is now out of scope, fall back to tonic
      if (!isChordInScope(state.focusedChord)) {
        state.focusedChord = state.tonality === 'major' ? 'I' : 'i';
        state.userVoicing = null;
      }
      renderAll();
      // If AI is mid-song, regenerate with new scope and reset bookkeeping so
      // the strip's cached page + voicing chain don't carry stale data.
      if (player.playing) {
        player.song = player._generateSong();
        player.songIdx = 0;
        player.sectionIter = 0;
        player.currentStepIdx = 0;
        player.barsRemaining = player._currentStep().bars;
        player.voicingType = player._currentSection().voicingType || player.voicingType;
        player.bassPattern = player._currentSection().bassPattern || player.bassPattern;
        player._cachedPage = null;
      }
    });
  });
}

// Anchor a popover under a button while keeping it inside the viewport.
// Without this, opening a popover near the right edge of a phone pushes the
// menu off-screen. We make it visible momentarily to measure its width, then
// clamp left so it always fits within an 8px margin.
function positionPopoverUnder(menu, btn) {
  const rect = btn.getBoundingClientRect();
  const margin = 8;
  // Show it first so the layout engine gives us a real width
  menu.style.visibility = 'hidden';
  menu.hidden = false;
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = rect.left;
  if (left + mw > vw - margin) left = Math.max(margin, vw - mw - margin);
  if (left < margin) left = margin;
  let top = rect.bottom + 4;
  if (top + mh > vh - margin) top = Math.max(margin, rect.top - mh - 4);  // flip above
  menu.style.left = left + 'px';
  menu.style.top  = top  + 'px';
  menu.style.visibility = '';
}

scopeBtn.addEventListener('click', e => {

  }
});

});

/* ─── Metronome ─── */

class Metronome {
  constructor() {
    this.bpm = 120;
    this.mode = 'ride';
    this.playing = false;
    this.nextTickTime = 0;
    this.tickIdx = 0;
    this.timer = null;
    this.scheduleAhead = 0.12;
    this.lookAheadMs = 25;
  }
  // Lazy-init a long pink-noise buffer once per audio context. Reused for both
  // the ride shimmer wash and the 2&4 hi-hat. Pink noise sounds random regardless,
  // so generating it once and replaying is indistinguishable from per-tick generation
  // — but skips ~48k samples of synchronous main-thread work per tick (the original
  // biggest source of audio glitches on mobile).
  static _ensurePinkBuf(ctx) {
    if (Metronome._pinkBuf && Metronome._pinkBuf._sr === ctx.sampleRate) return Metronome._pinkBuf;
    const bufLen = Math.floor(ctx.sampleRate * 1.2);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    // Paul Kellet's pink noise approximation
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for (let i = 0; i < bufLen; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    buf._sr = ctx.sampleRate;
    Metronome._pinkBuf = buf;
    return buf;
  }
  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.tickIdx = 0;
    this.nextTickTime = ctx.currentTime + 0.08;
    this.timer = setInterval(() => this._scheduler(), this.lookAheadMs);
  }
  stop() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
  }
  _scheduler() {
    if (!audioCtx) return;
    while (this.nextTickTime < audioCtx.currentTime + this.scheduleAhead) {
      this._playTick(this.nextTickTime, this.tickIdx);
      this._advance();
    }
  }
  _advance() {
    if (this.mode === 'click' || this.mode === 'twofour') {
      this.nextTickTime += 60 / this.bpm;
      this.tickIdx = (this.tickIdx + 1) % 4;
    } else {
      // Jazz ride: 6 hits per bar in triplet feel at triplet positions [0, 3, 5, 6, 9, 11] of 12
      const positions = [0, 3, 5, 6, 9, 11];
      const cur = positions[this.tickIdx];
      this.tickIdx = (this.tickIdx + 1) % 6;
      const nxt = positions[this.tickIdx];
      const triplet = 60 / (this.bpm * 3); // duration of one triplet eighth
      let diff = nxt - cur;
      if (diff <= 0) diff += 12;
      this.nextTickTime += diff * triplet;
    }
  }
  _playTick(time, idx) {
    if (this.mode === 'click') this._click(time, idx === 0);
    else if (this.mode === 'twofour') this._twoFour(time, idx);
    else this._ride(time, idx);
  }
  _click(time, isDownbeat) {
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = isDownbeat ? 1600 : 1100;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.32 * mv, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(time); o.stop(time + 0.08);
  }
  _ride(time, idx) {
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    // idx 0,3 = main "ding" (downbeats); idx 1,4 = swing "and"; idx 2,5 = skip note
    const isDing = (idx === 0 || idx === 3);
    const dur = isDing ? 1.1 : 0.55;
    const vol = (isDing ? 0.20 : 0.13) * mv;

    // PRIMARY: pink-noise shimmer wash from the shared cached buffer
    const noise = ctx.createBufferSource();
    noise.buffer = Metronome._ensurePinkBuf(ctx);

    // Multi-stage filtering for the cymbal "sheen"
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3200;
    hp.Q.value = 0.4;

    const shimmer = ctx.createBiquadFilter();
    shimmer.type = 'peaking';
    shimmer.frequency.value = 7800;
    shimmer.Q.value = 1.2;
    shimmer.gain.value = 6;

    const air = ctx.createBiquadFilter();
    air.type = 'lowpass';
    air.frequency.value = 13000;
    air.Q.value = 0.5;

    const noiseEnv = ctx.createGain();
    // Soft attack (no harsh click), long smooth exponential tail
    noiseEnv.gain.setValueAtTime(0.0001, time);
    noiseEnv.gain.exponentialRampToValueAtTime(vol, time + 0.018);
    noiseEnv.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    noise.connect(hp); hp.connect(shimmer); shimmer.connect(air); air.connect(noiseEnv); noiseEnv.connect(ctx.destination);
    noise.start(time);

    // ─── SECONDARY: subtle warm "ding" bell — only on main beats, very quiet ───
    if (isDing) {
      // Two soft mid-high partials, warm not piercing
      const partials = [{f: 940, g: 0.5}, {f: 1640, g: 0.3}];
      partials.forEach(p => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = p.f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol * 0.09 * p.g, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.55);
        o.connect(g); g.connect(ctx.destination);
        o.start(time); o.stop(time + dur * 0.6);
      });
    }
  }
  _twoFour(time, idx) {
    // Beats 2 and 4 only — idx 0=beat1, 1=beat2, 2=beat3, 3=beat4
    if (idx !== 1 && idx !== 3) return;
    const ctx = audioCtx;
    const mv = chVol('metronome');
    if (mv <= 0.001) return;
    // Brushed snare / rim-ish: pink noise bandpassed in the snare body region
    // with a quick metallic ping on top. More body and presence than the old
    // thin hi-hat tick, fills the room better at low volumes.
    const noise = ctx.createBufferSource();
    noise.buffer = Metronome._ensurePinkBuf(ctx);
    // Body band: focused on ~3.5kHz with steep filtering = warm snare body
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3500; bp.Q.value = 1.2;
    // Air shelf: slight highshelf cut to keep it from being shrill
    const shelf = ctx.createBiquadFilter();
    shelf.type = 'highshelf'; shelf.frequency.value = 8000; shelf.gain.value = -6;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, time);
    env.gain.exponentialRampToValueAtTime(0.55 * mv, time + 0.004);  // snappier attack
    env.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);      // longer body decay
    noise.connect(bp); bp.connect(shelf); shelf.connect(env); env.connect(ctx.destination);
    noise.start(time); noise.stop(time + 0.18);

    // Subtle metallic "click" — short sine ping that gives it definition
    const ping = ctx.createOscillator();
    ping.type = 'triangle'; ping.frequency.value = 2200;
    const pingEnv = ctx.createGain();
    pingEnv.gain.setValueAtTime(0.0001, time);
    pingEnv.gain.exponentialRampToValueAtTime(0.12 * mv, time + 0.002);
    pingEnv.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    ping.connect(pingEnv); pingEnv.connect(ctx.destination);
    ping.start(time); ping.stop(time + 0.05);
  }
  setBpm(b) { this.bpm = Math.max(40, Math.min(280, b)); }
  setMode(m) { this.mode = m; this.tickIdx = 0; }

  // Time of the next bar's downbeat (beat 1). Used to sync the player.
  nextDownbeatTime() {
    if (!this.playing) return null;
    if (this.mode === 'click' || this.mode === 'twofour') {
      // 4 ticks per bar; tickIdx 0 = beat 1
      const beatDur = 60 / this.bpm;
      const ticksUntilOne = (4 - this.tickIdx) % 4;
      return this.nextTickTime + ticksUntilOne * beatDur;
    } else {
      // ride: positions [0,3,5,6,9,11] of 12 triplets. tickIdx 0 = beat 1.
      if (this.tickIdx === 0) return this.nextTickTime;
      const positions = [0, 3, 5, 6, 9, 11];
      const tripletDur = 60 / (this.bpm * 3);
      const tripletsLeft = 12 - positions[this.tickIdx];
      return this.nextTickTime + tripletsLeft * tripletDur;
    }
  }
}

const metronome = new Metronome();

function updateBlinkRate() {
  const beat = 60 / metronome.bpm;
  document.documentElement.style.setProperty('--blink-duration', (beat * 2) + 's');
}

// ─── BPM compact widget (drag up/down or click to type) ───
const bpmCompact = document.getElementById('bpm-compact');
const bpmVal = document.getElementById('bpm-val');
let currentRhythmMode = 'ride'; // 'ride' | 'click' | 'off'

function setBpm(v) {
  v = Math.max(40, Math.min(280, Math.round(v)));
  metronome.setBpm(v);
  bpmVal.textContent = v;
  updateBlinkRate();
}

// Drag up/down to change BPM
(function() {
  let dragY = null, dragBpm = null;
  function onMove(e) {
    if (dragY === null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = Math.round((dragY - y) / 3);
    setBpm(dragBpm + delta);
  }
  function onEnd() {
    dragY = null;
    bpmCompact.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  }
  bpmCompact.addEventListener('mousedown', e => {
    if (e.target.tagName === 'INPUT') return;
    dragY = e.clientY; dragBpm = metronome.bpm;
    bpmCompact.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  });
  bpmCompact.addEventListener('touchstart', e => {
    if (e.target.tagName === 'INPUT') return;
    dragY = e.touches[0].clientY; dragBpm = metronome.bpm;
    bpmCompact.classList.add('dragging');
    document.addEventListener('touchmove', onMove, {passive: true});
    document.addEventListener('touchend', onEnd);
  }, {passive: true});
})();

// Click to type BPM
bpmCompact.addEventListener('dblclick', () => {
  const cur = metronome.bpm;
  bpmVal.innerHTML = `<input class="bpm-edit" type="number" value="${cur}" min="40" max="280">`;
  const inp = bpmVal.querySelector('input');
  inp.focus(); inp.select();
  function commit() {
    const v = parseInt(inp.value);
    if (!isNaN(v)) setBpm(v); else bpmVal.textContent = cur;
    bpmVal.textContent = metronome.bpm;
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = cur; inp.blur(); } });
});

updateBlinkRate();

const rhythmBtn = document.getElementById('rhythm-btn');
const rhythmMenu = document.getElementById('rhythm-menu');
const RHYTHM_OPTIONS = [
  {value: 'ride',    emoji: '🥁', label: 'Ride'},
  {value: 'twofour', emoji: '🎩', label: '2 & 4'},
  {value: 'click',   emoji: '🔔', label: 'Metronome'},
  {value: 'off',     emoji: '🔇', label: 'Off'},
];

function updateRhythmBtn() {
  const opt = RHYTHM_OPTIONS.find(o => o.value === currentRhythmMode);
  rhythmBtn.textContent = `${opt.emoji} ${opt.label}`;
  if (currentRhythmMode === 'off') {
    rhythmBtn.classList.remove('active');
  } else {
    rhythmBtn.classList.add('active');
  }
}

function applyRhythmMode(mode) {
  currentRhythmMode = mode;
  if (mode === 'off') {
    if (metronome.playing) metronome.stop();
  } else {
    metronome.setMode(mode);
    if (!metronome.playing) metronome.start();
  }
  updateRhythmBtn();
}

function renderRhythmMenu() {
  rhythmMenu.innerHTML = RHYTHM_OPTIONS.map(o => `
    <div class="sound-menu-item ${o.value === currentRhythmMode ? 'selected' : ''}" data-rhythm="${o.value}">
      <span>${o.emoji}</span><span>${o.label}</span><span class="check">✓</span>
    </div>
  `).join('');
  rhythmMenu.querySelectorAll('[data-rhythm]').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      applyRhythmMode(item.dataset.rhythm);
      rhythmMenu.hidden = true;
    });
  });
}

rhythmBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (rhythmMenu.hidden) {
    renderRhythmMenu();
    positionPopoverUnder(rhythmMenu, rhythmBtn);

    rhythmMenu.hidden = true;
  }
});

});

    {name:'iv–V7–i',                      len:4,  steps:[{chord:'iv',bars:1},{chord:'V7',bars:1},{chord:'i',bars:2}]},
    {name:'i–bVII–bVI–V7 (Andalusian)',   len:4,  steps:[{chord:'i',bars:1},{chord:'bVII',bars:1},{chord:'bVI',bars:1},{chord:'V7',bars:1}]},
    {name:'i–iv–bVII–bIII',               len:4,  steps:[{chord:'i',bars:1},{chord:'iv',bars:1},{chord:'bVII',bars:1},{chord:'bIII',bars:1}]},
    {name:'bVI–bVII–i',                   len:4,  steps:[{chord:'bVI',bars:1},{chord:'bVII',bars:1},{chord:'i',bars:2}]},
    // ─── 4-bar with borrowed/secondary chords ───
    {name:'iiø–bII7–i (tritone sub)',     len:4,  steps:[{chord:'iiø',bars:1},{chord:'bII7',bars:1},{chord:'i',bars:2}]},
    {name:'iv–bII7–i',                    len:4,  steps:[{chord:'iv',bars:1},{chord:'bII7',bars:1},{chord:'i',bars:2}]},
    {name:'vii°7–i Bach cadence',         len:4,  steps:[{chord:'iv',bars:1},{chord:'vii7',bars:1},{chord:'i',bars:2}]},
    {name:'i–IV–V7–i (parallel IV)',      len:4,  steps:[{chord:'i',bars:1},{chord:'IV',bars:1},{chord:'V7',bars:1},{chord:'i',bars:1}]},
    {name:'iiø–V/V–V7–i',                 len:4,  steps:[{chord:'iiø',bars:1},{chord:'V_V',bars:1},{chord:'V7',bars:1},{chord:'i',bars:1}]},
    // ─── 8-bar ───
    {name:'i–iv–V7–i (long)',             len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'V7',bars:2},{chord:'i',bars:2}]},
    {name:'bIII–bVI–iiø–V7–i',            len:8,  steps:[{chord:'bIII',bars:1},{chord:'bVI',bars:1},{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'i',bars:4}]},
    {name:'Andalusian extended',          len:8,  steps:[{chord:'i',bars:2},{chord:'bVII',bars:2},{chord:'bVI',bars:2},{chord:'V7',bars:2}]},
    {name:'Minor blues fragment',         len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'i',bars:2},{chord:'V7',bars:1},{chord:'i',bars:1}]},
    // ─── 8-bar with borrowed/secondary chords ───
    {name:'i–V/iv–iv–V7 turnaround',      len:8,  steps:[{chord:'i',bars:2},{chord:'V_iv',bars:2},{chord:'iv',bars:2},{chord:'V7',bars:2}]},
    {name:'iiø–V7–iv–bII7–i',             len:8,  steps:[{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'iv',bars:1},{chord:'bII7',bars:1},{chord:'i',bars:4}]},
    {name:'i–IV–iiø–V7 (modal mix)',      len:8,  steps:[{chord:'i',bars:2},{chord:'IV',bars:2},{chord:'iiø',bars:2},{chord:'V7',bars:2}]},
    {name:'Picardy ending',               len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'I_pic',bars:2}]},
    {name:'bIII7 backdoor',               len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'bIII7',bars:2},{chord:'bVI',bars:2}]},
    {name:'Romance bossa',                len:8,  steps:[{chord:'i',bars:1},{chord:'V_iv',bars:1},{chord:'iv',bars:1},{chord:'bII7',bars:1},{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'i',bars:2}]},
    // ─── 16-bar ───
    {name:'Minor AABA-A',                 len:16, steps:[{chord:'i',bars:2},{chord:'bVI',bars:2},{chord:'iiø',bars:2},{chord:'V7',bars:2},{chord:'i',bars:2},{chord:'bVI',bars:2},{chord:'iiø',bars:2},{chord:'V7',bars:2}]},
    {name:'Jazz minor long',              len:16, steps:[{chord:'i',bars:2},{chord:'V_iv',bars:1},{chord:'iv',bars:1},{chord:'vii7',bars:1},{chord:'bIII',bars:1},{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'i',bars:2},{chord:'IV',bars:1},{chord:'iv',bars:1},{chord:'iiø',bars:1},{chord:'bII7',bars:1},{chord:'I_pic',bars:2}]},
  ]
};

/* ─── AI Player — travels through real progressions with sections + repeats ─── */

class Player {
  constructor() {
    this.playing = false;
    this.song = null;
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = 0;
    this.nextBarTime = 0;
    this.timer = null;
    this.previousShape = null;
    this.voicingType = 'drop2';
    this.bassPattern = 'two-feel';
    this.bassOscillators = [];
    this.totalBars = 0;
    this._cachedPage = null;
  }

  _pickBassPattern() {
    const r = Math.random();
    if (r < 0.28) return 'whole';       // root on beat 1 only — sparse, ballad
    if (r < 0.60) return 'two-feel';    // root on beats 1 and 3 — solid
    return 'fifth';                     // root on 1, fifth on 3 — boom-chuck
  }

  _pickVoicingType() {
    // Honor user preference: if a specific type is chosen, always use it
    if (voicingPref !== 'all') return voicingPref;
    // 'all' = mix of the rich voicings (no guide-tones in random mode)
    const r = Math.random();
    if (r < 0.70) return 'drop2';
    if (r < 0.88) return 'shell';
    return 'triad';
  }

  // Find the candidate shape of the chosen type that voice-leads best and stays anchored
  _pickShape(quality, root, type, prevShape) {
    const cands = [];
    if (type === 'drop2') {
      for (let ss = 0; ss < STRING_SETS.length; ss++) {
        for (let inv = 0; inv < 4; inv++) {
          const sh = dropTwoVoicing(quality, root, ss, inv);
          if (sh) cands.push(sh);
        }
      }
    } else if (type === 'shell') {
      ['A','B'].forEach(t => { const sh = shellVoicing(quality, root, t); if (sh) cands.push(sh); });
    } else if (type === 'triad') {
      ['top','mid','low'].forEach(t => { const sh = triadVoicing(quality, root, t); if (sh) cands.push(sh); });
    } else if (type === 'guide') {
      ['A','B'].forEach(t => { const sh = guideToneVoicing(quality, root, t); if (sh) cands.push(sh); });
    }
    if (!cands.length) return null;

    // No previous reference → strong pull to fret-6/7 sweet spot
    if (!prevShape) {
      let best = null;
      for (const sh of cands) {
        const af = avgFret(sh);
        const cost = Math.pow(Math.abs(af - 6.5), 1.7);
        if (!best || cost < best.cost) best = {shape: sh, cost};
      }
      return best.shape;
    }

    // With previous: hard-filter candidates that drift too far from previous region.
    // Then score by voice-leading smoothness + sweet-spot pull.
    const prevAvg = avgFret(prevShape);
    const REGION_LIMIT = 4.5; // max avg-fret drift between consecutive chords
    let filtered = cands.filter(sh => Math.abs(avgFret(sh) - prevAvg) <= REGION_LIMIT);
    // Also drop candidates outside playable comfort zone
    filtered = filtered.filter(sh => {
      const af = avgFret(sh);
      return af >= 1.5 && af <= 12;
    });
    if (!filtered.length) filtered = cands; // emergency fallback

    let best = null;
    const prevStrings = prevShape.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
    for (const sh of filtered) {
      // Per-string voice movement on overlapping strings
      let moveSum = 0, overlapCount = 0;
      for (let s = 0; s < 6; s++) {
        if (prevShape[s] >= 0 && sh[s] >= 0) {
          moveSum += Math.abs(sh[s] - prevShape[s]);
          overlapCount++;
        }
      }
      const af = avgFret(sh);
      const regionShift = Math.abs(af - prevAvg);
      const candStrings = sh.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
      const stringSetPenalty = (prevStrings === candStrings) ? 0 : 4;
      // Strong sweet-spot anchor (quadratic outside frets 4-9)
      const reg = Math.abs(af - 6.5);
      const regSpot = reg <= 2.5 ? 0 : Math.pow(reg - 2.5, 1.9);
      // Recovery bias: if previous was high or low, prefer candidates that come back toward center
      let recoveryBias = 0;
      if (prevAvg > 9.5 && af < prevAvg - 0.5) recoveryBias = -2;
      if (prevAvg < 4 && af > prevAvg + 0.5) recoveryBias = -2;
      // Weight: voice-leading * 1, region shift * 1.8, sweet-spot * 1, string set * 4, recovery * 1
      const score = (overlapCount ? moveSum : 5) + regionShift * 1.8 + stringSetPenalty + regSpot + recoveryBias;
      if (!best || score < best.score) best = {shape: sh, score};
    }
    return best ? best.shape : filtered[0];
  }

  _currentSection() { return this.song?.[this.songIdx]; }
  _currentProgression() { return this._currentSection()?.progression; }
  _currentStep() { return this._currentProgression()?.steps[this.currentStepIdx]; }
  _currentChordId() { return this._currentStep()?.chord; }

  // Look ahead to figure out the next chord that'll play (handles repeats + section transitions)
  _nextChordId() {
    const prog = this._currentProgression();
    if (!prog) return null;
    const nextStepIdx = this.currentStepIdx + 1;
    if (nextStepIdx < prog.steps.length) {
      return prog.steps[nextStepIdx].chord;
    }
    // At end of progression — will we repeat or move on?
    const section = this._currentSection();
    if (this.sectionIter + 1 < section.repeats) {
      // Repeating same progression
      return prog.steps[0].chord;
    }
    // Moving to next section
    const nextSectionIdx = (this.songIdx + 1) % this.song.length;
    return this.song[nextSectionIdx]?.progression.steps[0].chord;
  }

  _pickProgression(avoidName = null) {
    const list = PROGRESSIONS[state.tonality] || [];
    if (!list.length) return null;
    // Only use progressions whose chords are all allowed by the current scope.
    let inScope = list.filter(p => p.steps.every(step => isChordInScope(step.chord)));
    if (!inScope.length) inScope = list; // safety: never starve the player
    const filtered = avoidName ? inScope.filter(p => p.name !== avoidName) : inScope;
    const finalList = filtered.length ? filtered : inScope;
    return finalList[Math.floor(Math.random() * finalList.length)];
  }

  _repeatsFor(prog) {
    // Bias toward powers of 2 (4s and 2s) — that's how most music phrases
    const r = Math.random();
    if (prog.len <= 4) {
      // 4-bar progressions
      if (r < 0.50) return 4;  // 16 bars total (most common)
      if (r < 0.85) return 2;  // 8 bars total
      if (r < 0.95) return 3;  // 12 bars — occasional odd phrase
      return 1;                // very rare single pass
    }
    if (prog.len <= 8) {
      // 8-bar progressions
      if (r < 0.65) return 2;  // 16 bars total (standard chorus half)
      if (r < 0.90) return 1;  // 8 bars (single statement)
      return 4;                // 32 bars (extended)
    }
    // 16-bar+ progressions
    return r < 0.85 ? 1 : 2;
  }

  _pickModulation(homePc, homeTonality) {
    // Returns {keyPc, tonality, name} for a musically motivated key change.
    const opts = [
      {keyPc: (homePc + 5) % 12, tonality: homeTonality, name: 'to subdominant'},
      {keyPc: (homePc + 7) % 12, tonality: homeTonality, name: 'to dominant'},
    ];
    if (homeTonality === 'major') {
      opts.push({keyPc: (homePc + 9) % 12, tonality: 'minor', name: 'to relative minor'});
      opts.push({keyPc: homePc, tonality: 'minor', name: 'to parallel minor'});
    } else {
      opts.push({keyPc: (homePc + 3) % 12, tonality: 'major', name: 'to relative major'});
      opts.push({keyPc: homePc, tonality: 'major', name: 'to parallel major'});
    }
    return opts[Math.floor(Math.random() * opts.length)];
  }

  _generateSong() {
    // Snapshot the home key so we can restore + measure modulations from it
    const homePc = state.keyPc;
    const homeTonality = state.tonality;
    this._homeKey = { keyPc: homePc, tonality: homeTonality };

    // If user typed a custom progression, treat the FIRST 8 chords as section A.
    // If they kept typing past 8, chords 9–16 become section B.
    //   • Loop ON                       → loop just A (single section)
    //   • Loop OFF, only A typed (≤8)   → A + AI-picked B in AABA
    //   • Loop OFF, A & B typed (9–16)  → both sections come from typed input
    if (state.composedProgression && state.composedProgression.length) {
      const buildSteps = (cells, label) => {
        const steps = cells.map(c => ({
          chord: c.chord,
          bars: 1,
          roman: currentMap().chordDefs[c.chord]?.roman || c.chord,
          composedShape: c.shape,
        }));
        return {
          label,
          progression: { name: `◇ Composed ${label}`, len: steps.length, steps },
          repeats: loopMode ? 1 : 2,
          voicingType: voicingPref !== 'all' ? voicingPref : 'drop2',
          bassPattern: this._pickBassPattern(),
        };
      };
      const aCells = state.composedProgression.slice(0, 8);
      const bCells = state.composedProgression.slice(8, 16);
      const A_sec = buildSteps(aCells, 'A');

      if (loopMode) {
        // Pure compose-loop mode — single section, loops via loopMode flag
        return [A_sec];
      }

      if (bCells.length > 0) {
        // User typed BOTH sections — full AABA built entirely from their input
        const B_sec = buildSteps(bCells, 'B');
        return [A_sec, A_sec, B_sec, A_sec];
      }

      // Only A typed — AI picks B as the bridge
      const B = this._pickProgression();
      const B_section = {
        label: 'B',
        progression: B,
        repeats: this._repeatsFor(B),
        voicingType: voicingPref !== 'all' ? voicingPref : this._pickVoicingType(),
        bassPattern: this._pickBassPattern(),
      };
      return [A_sec, A_sec, B_section, A_sec];
    }

    const A = this._pickProgression();
    const B = this._pickProgression(A.name);
    const aRepeats = this._repeatsFor(A);
    const bRepeats = this._repeatsFor(B);

    // Decide if this song modulates — kept moderately rare so it feels intentional
    let bMod = null;
    let finalALift = null;
    if (Math.random() < 0.35) {
      if (Math.random() < 0.55) {
        // Bridge modulates (relative/parallel/subdom/dom)
        bMod = this._pickModulation(homePc, homeTonality);
      } else {
        // "Truck-driver" lift on the final A section (half- or whole-step up)
        const shift = Math.random() < 0.4 ? 1 : 2;
        finalALift = { keyPc: (homePc + shift) % 12, tonality: homeTonality,
                       name: shift === 1 ? 'half-step lift' : 'whole-step lift' };
      }
    }

    // If B section flips tonality, re-pick its progression from the destination catalog
    let B_progression = B;
    if (bMod && bMod.tonality !== homeTonality) {
      const altList = PROGRESSIONS[bMod.tonality] || [];
      if (altList.length) B_progression = altList[Math.floor(Math.random() * altList.length)];
    }

    const A_base = { label:'A', progression:A, repeats:aRepeats };
    const B_section = bMod
      ? { label:'B', progression:B_progression, repeats:bRepeats,
          keyPc: bMod.keyPc, tonality: bMod.tonality, modName: bMod.name }
      : { label:'B', progression:B, repeats:bRepeats };
    const A_lifted = finalALift
      ? { ...A_base, keyPc: finalALift.keyPc, tonality: finalALift.tonality, modName: finalALift.name }
      : A_base;

    const sections = Math.random() < 0.7
      ? [A_base, A_base, B_section, A_lifted]
      : [A_base, B_section, A_base, A_lifted];

    // Pre-assign voicingType + bassPattern PER SECTION so playback is deterministic
    // (and the Real Book strip's lookahead can show the exact voicings that'll play).
    // Sections sharing the same identity (same A reused twice) keep the same type.
    const typeByLabel = {};
    const bassByLabel = {};
    return sections.map(s => {
      const key = s.label + (s.modName || '');   // distinguish A_lifted from A_base
      if (typeByLabel[key] === undefined) typeByLabel[key] = this._pickVoicingType();
      if (bassByLabel[key] === undefined) bassByLabel[key] = this._pickBassPattern();
      return { ...s, voicingType: typeByLabel[key], bassPattern: bassByLabel[key] };
    });
  }

  // Apply the key/tonality of the current section. Called when songIdx advances.
  _applySectionKey() {
    const section = this._currentSection();
    if (!section) return;
    const targetPc       = section.keyPc       !== undefined ? section.keyPc       : this._homeKey.keyPc;
    const targetTonality = section.tonality    !== undefined ? section.tonality    : this._homeKey.tonality;
    if (state.keyPc === targetPc && state.tonality === targetTonality) return;
    state.keyPc = targetPc;
    state.tonality = targetTonality;
    // Voicings are cached per chord-ID — but now the chord-IDs may differ AND the
    // roots have changed even where IDs stay the same. Reset everything.
    state.progressionVoicings = {};
    state.userVoicing = null;
    this.previousShape = null;
    // Snap focused chord to the new tonality's tonic if the old one no longer exists
    if (!currentMap().chordDefs[state.focusedChord]) {
      state.focusedChord = (targetTonality === 'major') ? 'I' : 'i';
    }
    renderAll();
  }

  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.previousShape = null;
    this.song = this._generateSong();
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = this._currentStep().bars;
    // Read voicingType + bassPattern from the section (pre-assigned at song generation)
    this.voicingType = this._currentSection().voicingType || this._pickVoicingType();
    this.bassPattern = this._currentSection().bassPattern || this._pickBassPattern();
    this.totalBars = 0;
    this._cachedPage = null;
    // Reset the per-progression voicing cache so cards revert to default until played
    state.progressionVoicings = {};

    const wasMetronomePlaying = metronome.playing;
    if (!metronome.playing && currentRhythmMode !== 'off') {
      metronome.start();
      updateRhythmBtn();
    }
    updateBlinkRate();

    // Sync the first bar with the metronome's next downbeat so they line up
    let firstBarStart;
    if (wasMetronomePlaying) {
      const downbeat = metronome.nextDownbeatTime();
      firstBarStart = (downbeat !== null && downbeat > ctx.currentTime + 0.05)
        ? downbeat
        : ctx.currentTime + 0.08;
    } else {
      firstBarStart = ctx.currentTime + 0.08;
    }

    // Count-in: 4 ticks of the metronome before the first chord enters. Lets
    // the user feel the tempo and "come in" with the band.
    const beatDur = 60 / metronome.bpm;
    const COUNT_IN_BEATS = 4;
    firstBarStart += COUNT_IN_BEATS * beatDur;

    this.nextBarTime = firstBarStart;
    this._countInUntil = firstBarStart;            // scheduler treats this as dormant
    this._updateVisuals();

    // Save the precise downbeat target so the scheduler can fire chord 1 itself
    // (no setTimeout race with the 120 ms look-ahead window).
    this._firstChordAt = firstBarStart;

    this.timer = setInterval(() => this._scheduler(), 30);
    startBeatCounterLoop();
  }

  stop() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
    chordDrone.stop();
    // Stop any pending bass plucks
    this.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    this.bassOscillators = [];
    state.playerVoicing = null;
    state.nextVoicing = null;
    state.progressionVoicings = {};
    this._upcomingType = null;
    this.forceTriggerAtNextBar = false;
    // Restore home key if we stopped during a modulated section
    if (this._homeKey && (state.keyPc !== this._homeKey.keyPc || state.tonality !== this._homeKey.tonality)) {
      state.keyPc = this._homeKey.keyPc;
      state.tonality = this._homeKey.tonality;
      renderAll();
    }
    document.querySelectorAll('.map-card.playing, .map-card.next-up, .map-card.about-to-start').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start');
    });
    document.getElementById('player-info').innerHTML = '';
    document.getElementById('real-book').hidden = true;
    const _tabsHide = document.getElementById('real-book-tabs');
    if (_tabsHide) _tabsHide.hidden = true;
    // If user has a composed progression, re-show the compose strip so they
    // can edit and replay it.
    if (typeof renderComposeStrip === 'function') renderComposeStrip();
  }

  _scheduler() {
    if (!audioCtx) return;
    // ── Count-in handling ──
    // While the count-in is still in progress, do nothing.
    if (this._countInUntil && audioCtx.currentTime < this._countInUntil - 0.005) return;
    // The count-in just ended — fire the very first chord HERE (in the same
    // tick where the bar boundary is being processed) so we can't race against
    // a setTimeout that may have been throttled by the browser.
    if (this._countInUntil) {
      const fired = this._firstChordAt;
      this._countInUntil = 0;
      this._firstChordAt = 0;
      // nextBarTime is the boundary AT THE END of bar 1
      const barDurNow = (60 / metronome.bpm) * 4;
      this.nextBarTime = fired + barDurNow;
      this._triggerChord(this._currentChordId());
      this._updateVisuals();
      return;
    }
    const barDur = (60 / metronome.bpm) * 4;
    if (this.nextBarTime < audioCtx.currentTime + 0.12) {
      // If user jumped, trigger the new chord at THIS bar boundary instead of advancing
      if (this.forceTriggerAtNextBar) {
        this.forceTriggerAtNextBar = false;
        this._triggerChord(this._currentChordId());
        this.totalBars++;
        this._updateVisuals();
        this.nextBarTime += barDur;
        return;
      }
      this.totalBars++;
      this.barsRemaining--;
      if (this.barsRemaining <= 0) {
        // Advance to next step
        this.currentStepIdx++;
        const prog = this._currentProgression();
        if (this.currentStepIdx >= prog.steps.length) {
          // Progression ended — check if we repeat or move to next section
          const section = this._currentSection();
          this.sectionIter++;
          if (loopMode) {
            // Lock to the current section indefinitely
            this.sectionIter = 0;
            this.currentStepIdx = 0;
            // Key practice: when a cycle mode is active, advance the key on
            // each loop iteration — practice the same progression through all 12 keys.
            if (cycleMode !== 'none') {
              const step = cycleMode === 'chromatic' ? 1 : 5; // fourths = +5 semitones
              state.keyPc = (state.keyPc + step) % 12;
              // Also update the player's "home" so modulations / stop-restore stay coherent
              if (this._homeKey) this._homeKey.keyPc = state.keyPc;
              state.progressionVoicings = {};
              state.userVoicing = null;
              this.previousShape = null;
              renderAll();
            }
          } else if (this.sectionIter < section.repeats) {
            // Repeat same progression — keep same voicing type
            this.currentStepIdx = 0;
          } else {
            // Move to next section — fresh voicing type for contrast
            this.songIdx++;
            this.sectionIter = 0;
            this.currentStepIdx = 0;
            if (this.songIdx >= this.song.length) {
              // Low-probability "travel" — the new song's home shifts to a
              // musically related key, like a jam session drifting over time.
              if (Math.random() < 0.15) {
                const travel = this._pickModulation(this._homeKey.keyPc, this._homeKey.tonality);
                state.keyPc = travel.keyPc;
                state.tonality = travel.tonality;
                this._travelNote = travel.name;   // surfaces in player-info briefly
              } else {
                // Default: restore home key so we stay anchored
                state.keyPc = this._homeKey.keyPc;
                state.tonality = this._homeKey.tonality;
                this._travelNote = null;
              }
              // Once the composed-seeded AABA has run its course, let the AI
              // wander off — clear the composed seed so the next song is fully
              // random territory.
              if (state.composedProgression && state.composedProgression.length && !loopMode) {
                state.composedProgression = [];
              }
              this.song = this._generateSong();
              this.songIdx = 0;
            }
            // Apply this section's key/tonality (may modulate)
            this._applySectionKey();
            // Read pre-assigned voicingType / bassPattern from the section so playback
            // matches the strip's lookahead exactly. Fallback to random if unassigned.
            const newSection = this._currentSection();
            this.voicingType = newSection.voicingType || this._upcomingType || this._pickVoicingType();
            this._upcomingType = null;
            this.bassPattern = newSection.bassPattern || this._pickBassPattern();
          }
        }
        this.barsRemaining = this._currentStep().bars;
        this._triggerChord(this._currentChordId());
      }
      this._updateVisuals();
      this.nextBarTime += barDur;
    }
  }

  _triggerChord(chordId) {
    const map = currentMap();
    const ch = map.chordDefs[chordId];
    if (!ch) return;
    const root = (state.keyPc + ch.deg) % 12;

    // Make sure the plan covers the current page, and that its entry at our
    // current barInPage matches the chord we're triggering. If not, rebuild.
    this._ensurePagePlan();
    const barInPage = this.totalBars % 4;
    if (!this._cachedPage[barInPage] || this._cachedPage[barInPage].chord !== chordId) {
      this._buildPagePlan();
    }
    const planned = this._cachedPage[barInPage];
    let type = this.voicingType;
    let shape = null;
    if (planned && planned.chord === chordId && planned.shape) {
      shape = planned.shape;
      type = planned.voicingType || type;
    } else {
      // True last-resort fallback (shouldn't happen with the rebuild above)
      shape = this._pickShape(ch.quality, root, type, this.previousShape);
      if (!shape) {
        shape = this._pickShape(ch.quality, root, 'drop2', this.previousShape);
        type = 'drop2';
      }
    }
    if (!shape) return;

    state.focusedChord = chordId;
    state.userVoicing = null;
    state.playerVoicing = { chord: chordId, shape, type };
    // Remember how this chord was played so its map card defaults to this voicing
    // for the rest of the progression — even when it's not the focused/next-up chord.
    state.progressionVoicings[chordId] = { shape, type };
    this.previousShape = shape;

    this._predictNextVoicing();

    const notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
    const vol = currentDroneVolume() * 1.8;
    // Force re-attack: _triggerChord is only called at a NEW step boundary,
    // so even if the chord/voicing matches the previous step (e.g. "I I V"),
    // the user expects to hear the chord strike again. Continuation bars
    // inside a multi-bar step never reach this path — those just keep ringing.
    chordDrone.start(notes, vol, true);

    // Schedule bass plucks per the current section's bass pattern
    if (isBassEnabled() && audioCtx && this._currentStep()) {
      const stepBars = this._currentStep().bars;
      const beatDur = 60 / metronome.bpm;
      const barDur = beatDur * 4;
      const now = audioCtx.currentTime + 0.04;
      const bassMidi = bassMidiForPc(root);
      const fifthMidi = bassMidi + 7; // fifth above root
      const bassVol = chVol('bass') * 0.75;
      const pattern = this.bassPattern;
      for (let b = 0; b < stepBars; b++) {
        const barStart = now + b * barDur;
        // Beat 1: always root
        const o1 = playBassPluck(bassMidi, barStart, bassVol);
        this.bassOscillators.push(...o1);
        // Beat 3: depends on pattern
        if (pattern === 'two-feel') {
          const o3 = playBassPluck(bassMidi, barStart + 2 * beatDur, bassVol);
          this.bassOscillators.push(...o3);
        } else if (pattern === 'fifth') {
          const o3 = playBassPluck(fifthMidi, barStart + 2 * beatDur, bassVol * 0.9);
          this.bassOscillators.push(...o3);
        }
        // 'whole' pattern: nothing on beat 3
      }
    }
  }

  _predictNextVoicing() {
    const nxtId = this._nextChordId();
    if (!nxtId || !state.playerVoicing?.shape) { state.nextVoicing = null; return; }

    // Determine the voicing type the next chord will use.
    // If the next chord starts a new section, pre-pick that section's type so the prediction matches actual playback.
    let nextType = this.voicingType;
    const prog = this._currentProgression();
    const isLastStepOfProg = this.currentStepIdx + 1 >= prog.steps.length;
    if (isLastStepOfProg) {
      const section = this._currentSection();
      const isLastIter = this.sectionIter + 1 >= section.repeats;
      if (isLastIter) {
        if (!this._upcomingType) this._upcomingType = this._pickVoicingType();
        nextType = this._upcomingType;
      }
    }

    const nxtCh = currentMap().chordDefs[nxtId];
    if (!nxtCh) { state.nextVoicing = null; return; }
    // Use the page plan if it has the next chord — same source of truth the
    // strip displays and the trigger reads. Falls back to a fresh pick if the
    // next chord is past the plan (rare) or no plan exists yet.
    const barInPage = this.totalBars % 4;
    const planEntries = [...(this._cachedPage || []), this._cachedPeek].filter(Boolean);
    const plannedNext = planEntries.find((e, i) => i > barInPage && e.chord === nxtId);
    if (plannedNext) {
      state.nextVoicing = { chord: nxtId, shape: plannedNext.shape, type: plannedNext.voicingType || nextType };
      return;
    }
    const nxtRoot = (state.keyPc + nxtCh.deg) % 12;
    const nxtShape = this._pickShape(nxtCh.quality, nxtRoot, nextType, state.playerVoicing.shape);
    state.nextVoicing = nxtShape ? { chord: nxtId, shape: nxtShape, type: nextType } : null;
  }

  _updateVisuals() {
    const flats = useFlatsFor(state.keyPc);
    const curId = this._currentChordId();
    const nxtId = this._nextChordId();

    // Re-render the chord map so each card's mini-fretboard reflects the latest voicing
    // (the focused chord uses state.playerVoicing; others recompute smoothest from it)
    renderChordMap();

    // Build a set of chord IDs that appear in the CURRENT section's progression.
    // Updates at A→B transitions so the dot/dim reflects the immediate context.
    const progressionChordIds = new Set();
    this._currentSection()?.progression?.steps?.forEach(step => progressionChordIds.add(step.chord));

    // Re-apply playing / next-up / in-progression classes (renderChordMap creates fresh cards)
    const isLastBar = this.barsRemaining === 1;
    document.querySelectorAll('.map-card').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start', 'in-progression');
      if (progressionChordIds.has(c.dataset.chord)) c.classList.add('in-progression');
      if (c.dataset.chord === curId) c.classList.add('playing');
      else if (c.dataset.chord === nxtId) {
        c.classList.add('next-up');
        if (isLastBar) {
          void c.offsetWidth;
          c.classList.add('about-to-start');
        }
      }
    });

    const map = currentMap();
    const curStep = this._currentStep();
    const curCh = map.chordDefs[curId];
    const nxtCh = nxtId ? map.chordDefs[nxtId] : null;
    const curName = curCh ? (nameOf((state.keyPc + curCh.deg) % 12, flats) + QUALITIES[curCh.quality].sfx) : '';
    const nxtName = nxtCh ? (nameOf((state.keyPc + nxtCh.deg) % 12, flats) + QUALITIES[nxtCh.quality].sfx) : '';
    const barsLabel = this.barsRemaining === 1 ? '1 bar' : `${this.barsRemaining} bars`;

    const section = this._currentSection();
    const prog = this._currentProgression();

    // Form segments — AABA as a tiny segmented strip. The current segment is
    // taller and gold; finished sections fade out; upcoming ones sit muted.
    const formHtml = this.song.map((s, i) => {
      let cls = 'pi-form-seg';
      if (i < this.songIdx)       cls += ' done';
      else if (i === this.songIdx) cls += ' now';
      return `<span class="${cls}" data-label="${s.label}"></span>`;
    }).join('');

    // Roman labels are still useful (shows the FUNCTION of the chord in the
    // current key) but live as quiet captions next to the bigger chord name.
    const curRoman = curStep?.chord || '';
    const nxtRoman = nxtId || '';

    const modBadge = section.modName
      ? `<span class="pi-badge mod">↗ ${section.modName}</span>` : '';
    const travelBadge = (this._travelNote && this.songIdx === 0 && this.sectionIter === 0)
      ? `<span class="pi-badge travel">✈ ${this._travelNote}</span>` : '';

    const iterTxt = section.repeats > 1
      ? `<span class="pi-iter">×${this.sectionIter + 1}/${section.repeats}</span>` : '';

    const voicingTxt = state.playerVoicing?.type
      ? `<span class="pi-voicing">${state.playerVoicing.type} · ${this.bassPattern}</span>`
      : '';

    // Step indicator — where we are within the current progression
    const stepTxt = `<span class="pi-step">${this.currentStepIdx + 1}/${prog.steps.length}</span>`;

    // Live key name (handles modulation — section.modName/modKeyPc beat state.keyPc)
    const liveKeyPc = (section.modKeyPc != null) ? section.modKeyPc : state.keyPc;
    const liveKeyName = nameOf(liveKeyPc, useFlatsFor(liveKeyPc));
    const keyHtml = `<span class="pi-key">${liveKeyName}<span class="pi-key-q">${state.tonality === 'major' ? 'maj' : 'min'}</span></span>`;

    const beatsHtml = `
      <span class="pi-beats">
        <span class="pi-beat downbeat" data-b="0">1</span>
        <span class="pi-beat" data-b="1">2</span>
        <span class="pi-beat" data-b="2">3</span>
        <span class="pi-beat" data-b="3">4</span>
      </span>`;

    document.getElementById('player-info').innerHTML = `
      ${keyHtml}
      <span class="pi-div"></span>
      <span class="pi-prog">${prog.name}</span>
      ${stepTxt}
      ${iterTxt}
      <span class="pi-div"></span>
      <span class="pi-form">${formHtml}</span>
      <span class="pi-div"></span>
      ${voicingTxt}
      <span class="pi-spacer"></span>
      ${travelBadge}
      ${modBadge}
      ${beatsHtml}
    `;

    state.focusedChord = curId;
    state.userVoicing = null;
    renderAlternatives();
    renderFretboard();
    updateScaleHighlightForPlayer(this);
    this._renderRealBook();
  }

  // Compute the next N bars of chord events (handles repeats, sections, loops)
  _lookAheadBars(n = 6) {
    if (!this.song) return [];
    const result = [];
    let songIdx = this.songIdx;
    let sectionIter = this.sectionIter;
    let stepIdx = this.currentStepIdx;
    let barsLeft = this.barsRemaining;
    let totalBars = 0;
    let isFirst = true;
    let safety = 0;
    // Track the key as we simulate forward
    let simKeyPc = state.keyPc;
    const cycleStep = cycleMode === 'chromatic' ? 1 : cycleMode === 'fourths' ? 5 : 0;
    while (totalBars < n && safety++ < 30) {
      const section = this.song[songIdx];
      if (!section) break;
      const prog = section.progression;
      const step = prog.steps[stepIdx];
      if (!step) break;
      const stepBars = isFirst ? barsLeft : step.bars;
      const barsToShow = Math.min(stepBars, n - totalBars);
      // voicingType comes straight from the section's pre-assignment — guaranteed
      // to match what the player will pick when it transitions in.
      const simVoicingType = section.voicingType || this.voicingType;
      result.push({
        roman: step.roman,
        chord: step.chord,
        bars: barsToShow,
        isCurrent: isFirst,
        isNextChange: false,
        keyPc: simKeyPc,
        voicingType: simVoicingType,
        composedShape: step.composedShape,  // honors user-typed inversions
      });
      totalBars += barsToShow;
      isFirst = false;
      stepIdx++;
      if (stepIdx >= prog.steps.length) {
        stepIdx = 0;
        sectionIter++;
        if (loopMode) {
          sectionIter = 0;
          if (cycleStep) simKeyPc = (simKeyPc + cycleStep) % 12;
        } else if (sectionIter >= section.repeats) {
          sectionIter = 0;
          songIdx++;
          if (songIdx >= this.song.length) break;
        }
      }
    }
    // Mark the chord right after the current as "next change"
    if (result.length >= 2) result[1].isNextChange = true;
    return result;
  }

  // Single source of truth for upcoming voicings. Walks the lookahead, picks
  // shapes using the same picker the trigger uses, with proper chaining.
  // Stored in `_cachedPage` (4 bars) + `_cachedPeek`. Both the strip render
  // AND the chord trigger READ from this — they cannot diverge.
  _buildPagePlan() {
    this._cachedPage = [];
    this._cachedPeek = null;
    this._cachedPlanPage = Math.floor(this.totalBars / 4);   // tag for cache invalidation
    const lookahead = this._lookAheadBars(8);
    // Start the chain from the actual last-played shape — same context the
    // next real trigger will be in.
    let prevShape = this.previousShape;
    let prevKeyPc = state.keyPc;
    let prevChord = null;
    let bar = 0;
    outer: for (const seg of lookahead) {
      for (let b = 0; b < seg.bars; b++) {
        const ch = currentMap().chordDefs[seg.chord];
        const segKeyPc = (seg.keyPc !== undefined) ? seg.keyPc : state.keyPc;
        const segType = seg.voicingType || this.voicingType;
        // Key change resets prev (matches _applySectionKey's reset)
        if (segKeyPc !== prevKeyPc) prevShape = null;
        // Continuation bar — same chord, no new trigger, reuse shape
        const isContinuation = (seg.chord === prevChord) && (b > 0);
        let shape;
        if (isContinuation) {
          shape = prevShape;
        } else if (seg.composedShape) {
          // User-composed progression — honor the exact inversion they chose
          shape = seg.composedShape;
        } else if (bar === 0 && state.playerVoicing
                   && state.playerVoicing.chord === seg.chord
                   && state.playerVoicing.shape) {
          // First entry IS the currently-playing chord — use the literal played
          // shape, never re-pick. This is the critical anti-drift anchor: a
          // post-trigger rebuild would otherwise re-pick with prev=its-own-shape
          // and may land on a different inversion than what's actually sounding.
          shape = state.playerVoicing.shape;
        } else if (ch) {
          const root = (segKeyPc + ch.deg) % 12;
          shape = this._pickShape(ch.quality, root, segType, prevShape);
          if (!shape) shape = this._pickShape(ch.quality, root, 'drop2', prevShape);
        }
        const entry = { chord: seg.chord, barIdxInChord: b, keyPc: segKeyPc, voicingType: segType, shape };
        if (bar < 4) {
          this._cachedPage.push(entry);
        } else if (bar === 4) {
          this._cachedPeek = entry;
          break outer;
        }
        if (shape && !isContinuation) prevShape = shape;
        prevKeyPc = segKeyPc;
        prevChord = seg.chord;
        bar++;
      }
    }
    while (this._cachedPage.length < 4) this._cachedPage.push(null);
  }

  // Rebuild the plan only if it's stale (different page than what was cached,
  // or no plan at all). Idempotent — safe to call from both trigger and render.
  _ensurePagePlan() {
    const curPage = Math.floor(this.totalBars / 4);
    if (!this._cachedPage || this._cachedPlanPage !== curPage) {
      this._buildPagePlan();
    }
  }

  _renderRealBook() {
    const el = document.getElementById('real-book');
    if (!this.playing) {
      el.hidden = true;
      const tEl = document.getElementById('real-book-tabs');
      if (tEl) tEl.hidden = true;
      return;
    }
    el.hidden = false;
    const barInPage = this.totalBars % 4;
    // Plan is shared with _triggerChord. _ensurePagePlan is a no-op if the
    // plan is already fresh for this page, so the trigger-time rebuild won't
    // get double-rebuilt by us (which previously caused drift — the second
    // rebuild used a post-trigger prevShape and could land on a different inversion).
    this._ensurePagePlan();
    const flats = useFlatsFor(state.keyPc);
    const map = currentMap();

    // On the last bar of the page, swap cell 0 to show the upcoming chord with
    // imminent blink. Cells 1–3 stay put. Cell 3 stays highlighted as current.
    let cells = this._cachedPage;
    let currentIdx = barInPage;
    let imminentIdx = -1;
    if (barInPage === 3 && this._cachedPeek) {
      cells = [this._cachedPeek, ...this._cachedPage.slice(1)];
      imminentIdx = 0;
    }
    // Voicings come straight from the pre-computed page plan — no live re-prediction.
    const cellVoicings = cells.map(c => c ? c.shape : null);

    const cellsHtml = cells.map((cell, i) => {
      if (!cell) return `<div class="rb-cell"></div>`;
      const ch = map.chordDefs[cell.chord];
      if (!ch) return `<div class="rb-cell"></div>`;
      // Use the cell's recorded keyPc so chords across a key-cycle boundary
      // show the NEW key's chord names, not the current key's.
      const cellKeyPc = (cell.keyPc !== undefined) ? cell.keyPc : state.keyPc;
      const cellFlats = useFlatsFor(cellKeyPc);
      const root = (cellKeyPc + ch.deg) % 12;
      const name = nameOf(root, cellFlats) + QUALITIES[ch.quality].sfx;
      const isCurrent = i === currentIdx;
      const isImminent = i === imminentIdx;
      const cls = `rb-cell ${isCurrent ? 'current' : ''} ${isImminent ? 'imminent' : ''}`;
      if (cell.barIdxInChord > 0) {
        return `<div class="${cls}"><div class="rb-continuation">%</div></div>`;
      }
      return `
        <div class="${cls}">
          <div class="rb-roman">${ch.roman}</div>
          <div class="rb-chord">${name}</div>
        </div>
      `;
    }).join('');

    // Build the SEPARATE tabs row beneath — one mini fretboard per cell, aligned
    // with the chord cells above. Stays empty for null/continuation cells.
    const tabsHtml = cells.map((cell, i) => {
      const isCurrent = i === currentIdx;
      const isImminent = i === imminentIdx;
      const cls = `rb-tab-cell ${isCurrent ? 'current' : ''} ${isImminent ? 'imminent' : ''}`;
      if (!cell) return `<div class="${cls}"></div>`;
      // Continuation bar (same chord still sounding from the previous bar).
      // In piano mode draw an empty staff with a simile sign so the partitura
      // reads as one continuous score; in guitar mode keep it empty since the
      // chord-name row already shows the % continuation symbol.
      if (cell.barIdxInChord > 0) {
        if (state.instrument === 'piano') {
          const showClefC = (i === 0);
          return `<div class="${cls}">${renderContinuationStaff({W: 130, H: 148, minimal: window.innerWidth <= 800, showClef: showClefC})}</div>`;
        }
        return `<div class="${cls}"></div>`;
      }
      const ch = map.chordDefs[cell.chord];
      if (!ch) return `<div class="${cls}"></div>`;
      const cellKeyPc = (cell.keyPc !== undefined) ? cell.keyPc : state.keyPc;
      const cellFlats = useFlatsFor(cellKeyPc);
      const root = (cellKeyPc + ch.deg) % 12;
      const shape = cellVoicings[i];
      // Minimal classical chord-diagram style — black dots only, no colors or text.
      // The colors live on the chord neck and bottom fretboard where they have room.
      // Clef only on the first cell of the row (the rest inherit it visually)
      const showClef = (i === 0);
      const cellName = nameOf((cellKeyPc + ch.deg) % 12, cellFlats) + QUALITIES[ch.quality].sfx;
      // Mobile playback inherits the same minimal sizing compose uses, so the
      // chord name is the same on-screen size whether you're composing or the
      // AI is playing.
      const isMobileNow = window.innerWidth <= 800;
      const svg = shape
        ? (state.instrument === 'piano'
            ? renderChordStaff(shape, root, ch.quality, cellFlats, {W: 130, H: 148, minimal: isMobileNow, showClef, chordName: cellName, roman: ch.roman, tag: ch.tag})
            : renderMini(shape, root, ch.quality, cellFlats, {W: 130, H: 80, r: 6, minimal: true}))
        : '';
      return `<div class="${cls}">${svg}</div>`;
    }).join('');
    el.innerHTML = cellsHtml;
    const tabsEl = document.getElementById('real-book-tabs');
    if (tabsEl) {
      tabsEl.hidden = false;
      tabsEl.innerHTML = tabsHtml;
    }
  }

  jumpTo(chordId) {
    // User clicked a chord during playback — queue the change for the next bar boundary
    // so it stays in time with the metronome.
    const list = PROGRESSIONS[state.tonality] || [];
    const matches = list.filter(p => p.steps[0].chord === chordId);
    let newProg;
    if (matches.length) {
      newProg = matches[Math.floor(Math.random() * matches.length)];
    } else {
      newProg = { name: `→ ${chordId}`, len: 2, steps: [{chord: chordId, bars: 2}] };
    }
    const prev = this._currentSection();
    this.song[this.songIdx] = {
      label: prev.label,
      progression: newProg,
      repeats: this._repeatsFor(newProg),
      // Preserve the section's pre-assigned voicingType + bassPattern so the
      // strip lookahead and the player stay in agreement after the jump.
      voicingType: prev.voicingType || this.voicingType,
      bassPattern: prev.bassPattern || this.bassPattern,
      keyPc: prev.keyPc,
      tonality: prev.tonality,
    };
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = this._currentStep().bars;
    // Invalidate the cached real-book page — chord IDs have changed
    this._cachedPage = null;
    // Cancel any bass plucks pre-scheduled for the previous chord
    if (audioCtx) {
      const cutTime = audioCtx.currentTime + 0.05;
      this.bassOscillators.forEach(o => { try { o.stop(cutTime); } catch(e) {} });
      this.bassOscillators = [];
    }
    // Tell the scheduler to trigger the new chord audio at the next bar boundary
    this.forceTriggerAtNextBar = true;
    this._updateVisuals();
  }
}

const player = new Player();

document.getElementById('loop-toggle').addEventListener('click', e => {
  loopMode = !loopMode;
  e.currentTarget.classList.toggle('active', loopMode);
  // When turning loop OFF mid-play AND a composed progression is active, the AI
  // takes over: regenerate the song so the composed progression becomes the A
  // section of a full AABA (AI picks B as a bridge). "Take my hook and run with it."
  if (player.playing && !loopMode && state.composedProgression.length) {
    player.song = player._generateSong();
    player.songIdx = 0;
    player.sectionIter = 0;
    // Keep playing through the current bar — next section transition reads new song
    player._cachedPage = null;
  }
  if (player.playing) player._renderRealBook();
});

// Cycle button — clicks through none → chromatic → fourths → none ...
// When active AND loop is on, the key advances each loop iteration.
document.getElementById('cycle-toggle').addEventListener('click', e => {
  const i = CYCLE_OPTIONS.findIndex(o => o.value === cycleMode);
  const next = CYCLE_OPTIONS[(i + 1) % CYCLE_OPTIONS.length];
  cycleMode = next.value;
  e.currentTarget.textContent = next.label;
  e.currentTarget.title = next.title;
  e.currentTarget.classList.toggle('active', cycleMode !== 'none');
});

/* ─── Volume mixer popover ─── */
const MIX_CHANNELS = [
  { key: 'chords',    label: 'Chords' },
  { key: 'bass',      label: 'Bass' },
  { key: 'metronome', label: 'Drums' },
  { key: 'tonic',     label: 'Tónica' },
];
const mixerBtn  = document.getElementById('mixer-btn');
const mixerMenu = document.getElementById('mixer-menu');

function renderMixerMenu() {
  mixerMenu.innerHTML = MIX_CHANNELS.map(ch => {
    const v = Math.round(channelVols[ch.key] * 100);
    return `<div class="mixer-row ${v === 0 ? 'muted' : ''}" data-ch="${ch.key}">
      <span class="mix-label">${ch.label}</span>
      <input type="range" min="0" max="100" value="${v}" data-ch="${ch.key}">
      <span class="mix-val">${v}</span>
    </div>`;
  }).join('');
  mixerMenu.querySelectorAll('input[type="range"]').forEach(slider => {
    slider.addEventListener('input', e => {
      const k = slider.dataset.ch;
      channelVols[k] = parseInt(slider.value) / 100;
      // Update the displayed value + muted styling for this row
      const row = slider.closest('.mixer-row');
      row.querySelector('.mix-val').textContent = slider.value;
      row.classList.toggle('muted', parseInt(slider.value) === 0);
      // Apply live to running audio
      if (k === 'chords' && chordDrone.playing) chordDrone.setVolume(chVol('chords'));
      if (k === 'tonic')  syncTonicDrone();
      if (k === 'bass' && parseInt(slider.value) === 0 && player.playing) {
        player.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
        player.bassOscillators = [];
      }
      // (metronome reads chVol on each tick — nothing to push)
    });
  });
}
