<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitarra</title>
<link rel="manifest" href="pwa/manifest-guitar.json">
<meta name="theme-color" content="#e6e3da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guitarra">
<link rel="apple-touch-icon" href="pwa/icon-guitar.svg">
<link rel="icon" type="image/svg+xml" href="pwa/icon-guitar.svg">
<style>
  :root {
    --bg: #e6e3da;
    --panel: #f0ede4;
    --panel-2: #e8e5dc;
    --line: #d2cec0;
    --line-2: #b8b4a4;
    --text: #1f1d18;
    --text-dim: #5e5c52;
    --text-faint: #908d80;
    --accent: #a07820;

    --i-R:#dc2626;--i-b2:#ea580c;--i-2:#d97706;--i-b3:#7c3aed;--i-3:#1d4ed8;
    --i-4:#0891b2;--i-b5:#db2777;--i-5:#059669;--i-b6:#9333ea;--i-6:#ca8a04;
    --i-b7:#c2410c;--i-7:#b45309;--i-9:#db2777;--i-b9:#e11d48;--i-s9:#a21caf;
    --i-11:#0891b2;--i-s11:#0e7490;--i-13:#65a30d;--i-b13:#84cc16;--i-s5:#9333ea;

    --tag-tonic: #059669;
    --tag-predom: #a07820;
    --tag-dom: #dc2626;
    --tag-borrowed: #9333ea;
    --tag-picardy: #b45309;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px;
    color: var(--accent);
    font-weight: 500;
  }
  .ctx-block { display: flex; flex-direction: column; gap: 3px; }
  .ctx-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .ctx-row { display: flex; gap: 2px; }

  /* Mini piano keyboard for key picker */
  .key-piano {
    position: relative;
    display: flex;
    height: 40px;
    user-select: none;
  }
  .pk-white {
    width: 24px;
    height: 40px;
    background: #fbf9f1;
    border: 1px solid var(--line-2);
    border-right: none;
    border-radius: 0 0 3px 3px;
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 4px;
    cursor: pointer;
    line-height: 1;
  }
  .pk-white:last-child { border-right: 1px solid var(--line-2); }
  .pk-white:hover { background: #f0ebd6; }
  .pk-white.active {
    background: var(--accent);
    color: #fff;
  }
  .pk-black {
    position: absolute;
    width: 16px;
    height: 26px;
    background: #1f1d18;
    border: none;
    border-radius: 0 0 3px 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 3px;
    cursor: pointer;
    z-index: 2;
    line-height: 1;
  }
  .pk-black:hover { background: #3a3833; }
  .pk-black.active {
    background: var(--accent);
    color: #1f1d18;
  }
  .chip {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    min-width: 28px;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--line-2); color: var(--text); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  .toggle { display: flex; background: var(--bg); border-radius: 6px; padding: 2px; }
  .toggle button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 3px rgba(160,120,32,0.35);
  }

  .bpm-compact {
    display: inline-flex;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: ns-resize;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    min-width: 38px;
    justify-content: center;
  }
  .bpm-compact:hover { border-color: var(--accent); }
  .bpm-compact.dragging { border-color: var(--accent); background: var(--panel); }
  .bpm-val {
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .bpm-compact input.bpm-edit {
    width: 38px;
    padding: 0;
    background: transparent;
    color: var(--text);
    border: none;
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    outline: none;
  }
  .bpm-compact input.bpm-edit::-webkit-inner-spin-button,
  .bpm-compact input.bpm-edit::-webkit-outer-spin-button { display: none; }

  /* Sound popup menu */
  .sound-menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 6px 20px rgba(31,29,24,0.12);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 120px;
  }
  .sound-menu[hidden] { display: none; }
  .sound-menu-item {
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sound-menu-item:hover { background: var(--panel-2); }
  .sound-menu-item.selected {
    background: rgba(160,120,32,0.15);
    color: var(--accent);
  }
  .sound-menu-item .check {
    margin-left: auto;
    color: var(--accent);
    font-weight: 700;
    opacity: 0;
  }
  .sound-menu-item.selected .check { opacity: 1; }

  /* Mixer (channel volume) panel */
  .mixer-menu { min-width: 220px; padding: 10px 12px; gap: 8px; }
  .mixer-row {
    display: grid;
    grid-template-columns: 70px 1fr 28px;
    align-items: center;
    gap: 8px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--text);
  }
  .mixer-row .mix-label { font-style: italic; opacity: 0.85; }
  .mixer-row input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .mixer-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
  }
  .mixer-row .mix-val {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-align: right;
  }
  .mixer-row.muted .mix-label { opacity: 0.4; text-decoration: line-through; }

  /* Playback */
  .auto-btn {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .auto-btn:hover { border-color: var(--line-2); color: var(--text); }
  .auto-btn.active {
    background: var(--tag-tonic);
    color: #fff;
    border-color: var(--tag-tonic);
  }
  /* ─── Player info bar — fine, green-leaning, info-rich. One stable row.
     Chord names live in the Real Book strip; this is the context layer. */
  #player-info {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;            /* never overflow to the right — wrap to a 2nd row */
    row-gap: 4px;
    color: var(--text-dim);
    font-family: 'Cormorant Garamond', Georgia, serif;
    width: 100%;
    min-width: 0;
    min-height: 26px;
    /* Subtle green-tinted backdrop so the player state reads as "live" */
    background: linear-gradient(90deg, rgba(5,150,105,0.04), transparent 35%, transparent 65%, rgba(5,150,105,0.04));
    border-top: 1px solid rgba(5,150,105,0.18);
    border-bottom: 1px solid rgba(5,150,105,0.18);
    padding: 4px 10px;
  }
  #player-info .pi-spacer { flex: 1; }
  /* Subtle vertical divider between info groups */
  #player-info .pi-div {
    width: 1px;
    height: 14px;
    background: rgba(5,150,105,0.22);
    margin: 0 -4px;
  }
  /* Key signature pill — small green chip showing the active key */
  #player-info .pi-key {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--tag-tonic);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  #player-info .pi-key .pi-key-q {
    font-style: normal;
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  /* Step position inside the current progression — '2/4' tiny mono */
  #player-info .pi-step {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--tag-tonic);
    letter-spacing: 0.5px;
    font-weight: 700;
    opacity: 0.85;
  }
  /* Progression name — italic serif section heading, slightly emphasized */
  #player-info .pi-prog {
    font-style: italic;
    font-weight: 700;
    font-size: 15px;
    color: var(--tag-tonic);
    letter-spacing: 0.3px;
  }
  /* AABA form bar — compact segmented strip */
  #player-info .pi-form {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  #player-info .pi-form-seg {
    min-width: 14px;
    height: 5px;
    border-radius: 2px;
    background: rgba(5,150,105,0.20);
    transition: background 0.2s, height 0.2s;
    position: relative;
  }
  #player-info .pi-form-seg.done { background: rgba(5,150,105,0.4); opacity: 0.75; }
  #player-info .pi-form-seg.now  {
    background: var(--tag-tonic);
    height: 8px;
    box-shadow: 0 0 6px rgba(5,150,105,0.6);
  }
  /* Letter (A / B) under the current segment — small but readable */
  #player-info .pi-form-seg.now::after {
    content: attr(data-label);
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8.5px;
    color: var(--tag-tonic);
    font-weight: 700;
    letter-spacing: 1px;
  }
  #player-info .pi-iter {
    font-size: 10px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.5px;
  }
  /* Voicing-type — fine mono caption, no pill, just colored text */
  #player-info .pi-voicing {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--tag-tonic);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    opacity: 0.85;
    white-space: nowrap;
  }
  /* Beat counter — 1 2 3 4 ticking with the BPM. The current beat lights up;
     the downbeat (1) gets a gold accent. Replaces the static bars-left. */
  #player-info .pi-beats {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-family: 'SF Mono', monospace;
  }
  #player-info .pi-beat {
    display: inline-block;
    width: 14px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: rgba(5,150,105,0.28);
    transition: color 0.06s, transform 0.08s, text-shadow 0.08s;
  }
  #player-info .pi-beat.on {
    color: var(--tag-tonic);
    transform: scale(1.22);
    text-shadow: 0 0 6px rgba(5,150,105,0.55);
  }
  #player-info .pi-beat.downbeat.on {
    color: #d4a843;
    text-shadow: 0 0 8px rgba(212,168,67,0.75);
  }
  /* Count-in: the 4 beats before the song actually starts. Tint everything
     gold so the user knows this is the "1, 2, 3, 4" before the band enters. */
  #player-info .pi-beats.count-in .pi-beat {
    color: rgba(212,168,67,0.30);
  }
  #player-info .pi-beats.count-in .pi-beat.on {
    color: #d4a843;
    text-shadow: 0 0 10px rgba(212,168,67,0.85);
    transform: scale(1.35);
  }
  /* Tiny "count-in" caption that fades in next to the beat dots */
  #player-info .pi-beats.count-in::before {
    content: 'count-in';
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10px;
    color: #a07820;
    margin-right: 4px;
    opacity: 0.75;
  }
  /* Iteration count — mono, smaller */
  #player-info .pi-iter {
    font-family: 'SF Mono', monospace;
    font-size: 9.5px;
    color: var(--tag-tonic);
    letter-spacing: 0.6px;
    font-weight: 700;
    opacity: 0.8;
  }
  /* Refine the modulation / travel badges — finer, greener */
  #player-info .pi-badge {
    font-style: italic;
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 2px;
    border: 1px solid;
    animation: piBadgeIn 0.4s ease-out;
    letter-spacing: 0.3px;
  }
  #player-info .pi-badge.mod    { color: var(--accent); border-color: rgba(160,120,32,0.6); background: rgba(160,120,32,0.06); }
  #player-info .pi-badge.travel { color: var(--tag-tonic); border-color: rgba(5,150,105,0.55); background: rgba(5,150,105,0.06); }
  /* Modulation / travel pill — slightly more prominent, animates in */
  @keyframes piBadgeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 0.92; transform: translateY(0); }
  }
  #player-info .pi-badge {
    font-style: italic;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid;
    animation: piBadgeIn 0.4s ease-out;
  }
  #player-info .pi-badge.mod    { color: var(--accent);   border-color: var(--accent); background: rgba(160,120,32,0.08); }
  #player-info .pi-badge.travel { color: #5a8a5a;          border-color: #5a8a5a;       background: rgba(90,138,90,0.08); }
  @keyframes playingPulse {
    0%,100% { box-shadow: 0 0 0 2.5px var(--tag-tonic), 0 0 24px rgba(5,150,105,0.45); }
    50%     { box-shadow: 0 0 0 3.5px var(--tag-tonic), 0 0 36px rgba(5,150,105,0.7); }
  }
  .map-card.playing {
    border-color: var(--tag-tonic) !important;
    background: #e8f7ef !important;
    animation: playingPulse 0.55s ease-in-out infinite;
    z-index: 20 !important;
    opacity: 1 !important;
  }
  @keyframes nextUpBlink {
    0%,100% { background: #faedc4; }
    50%     { background: #f5d98a; }
  }

  /* Real Book + scale section — chord bar above, scale below, both right-aligned */
  .rb-area {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 18px;
    display: flex;
    justify-content: flex-end;
  }
  .rb-stack {
    display: flex;
    flex-direction: column;
    width: 50%;
    gap: 4px;
  }
  /* When composing (no AI playing), the strip uses the FULL width of the bar
     so each chord cell has more room and the staff/diagram is readable. */
  body:not(.player-active) .rb-area { justify-content: stretch; }
  body:not(.player-active) .rb-stack { width: 100%; }
  .rb-row {
    display: flex;
    align-items: stretch;
  }
  .map-side-panel {
    width: 720px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: flex-start;
  }
  /* Piano-mode tab cells: drop the heavy borders so staff lines flow across
     cells like one continuous staff — the SVG itself draws the compás bar
     line between cells. */
  body.instrument-piano .rb-tab-cell {
    border: none !important;
    padding: 0 !important;
    background: #fdfcf3 !important;
  }
  /* In piano mode the playback chord-NAME row vanishes — the embedded name
     in the staff SVG suffices. In COMPOSE mode (compose-interleaved) the
     chord-name cells stay visible so the user always sees what they just
     typed in big readable text. */
  body.instrument-piano .real-book:not(.compose-interleaved) {
    display: none !important;
  }
  /* Piano mode: hide the chord-name cells in compose-interleaved too —
     the chord name lives inside the staff SVG (Real-Book style) so a
     second big name on top would be redundant. */
  body.instrument-piano .real-book.compose-interleaved > .rb-cell {
    display: none !important;
  }
  /* With chord-name cells out of the way, give each tab cell more vertical
     room — the staff and the embedded chord-name label breathe properly. */
  body.instrument-piano .real-book.compose-interleaved > .rb-tab-cell {
    min-height: 130px !important;
  }
  /* Piano PLAYBACK: row 1 (chord-name strip + cycle) hidden because the
     chord name is embedded in the staff SVG. NOT applied in compose mode —
     compose-interleaved on mobile renders the WHOLE strip inside row 1
     (chord cells + tab cells interleaved), so hiding row 1 there killed
     the entire compose strip. */
  body.instrument-piano.player-active .rb-row:first-child {
    display: none;
  }
  /* Wider buttons aligned with the two staves — cycle gets the treble half,
     loop gets the bass half (50/50). */
  /* Right-edge button column in piano mode. Wider, cleaner, with subtle
     gradient and proper inner divider — reads as a polished sidebar
     instead of two bare boxes. */
  /* Slim right-column — same thin profile as the guitar tabs buttons, so
     the staff gets the maximum horizontal space. */
  body.instrument-piano .right-btn-stack {
    display: flex;
    flex-direction: column;
    width: 30px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #faf6e8 0%, #f0e9d2 100%);
    border: 1.2px solid #1a1a1a;
    border-left: none;
    border-radius: 0 4px 4px 0;
    overflow: hidden;
  }
  body.instrument-piano .right-btn-stack .rb-cycle {
    flex: 1 1 50%;
    width: 100%;
    height: auto;
    font-size: 14px;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1.2px solid rgba(26,26,26,0.4);
    color: #1a1a1a;
    transition: background 0.15s;
  }
  body.instrument-piano .right-btn-stack .rb-cycle:hover {
    background: rgba(160,120,32,0.12);
  }
  body.instrument-piano .right-btn-stack .rb-loop {
    flex: 1 1 50%;
    width: 100%;
    height: auto;
    background: transparent;
    border: none;
    transition: background 0.15s;
  }
  body.instrument-piano .right-btn-stack .rb-loop:hover {
    background: rgba(160,120,32,0.12);
  }
  body.instrument-piano .right-btn-stack .rb-loop svg {
    width: 16px;
    height: 26px;
  }
  body.instrument-piano .real-book-tabs {
    border: 1.2px solid #1a1a1a;
    border-right: none;          /* connects to the right-btn-stack */
    border-radius: 4px 0 0 4px;
    background: #fdfcf3;
    height: 260px;               /* desktop: lots of room for the bigger chord name + lines */
  }
  /* Mobile playback: match the height compose-interleaved uses so the
     chord-name + staff render at the exact same size you see while
     composing (the right-button column sits beside, sized to match). */
  @media (max-width: 800px) {
    body.instrument-piano .real-book-tabs {
      height: 140px;
    }
  }
  /* Now-playing measure: keep cream/white background like printed paper, but
     the WHOLE staff (lines + clef + chord name + notes) gets a soft warm
     gold glow that gently pulses — your eye locks onto it instantly. Plus
     the small triangle above and a thicker gold underline at the bottom. */
  @keyframes currentMeasurePulse {
    0%, 100% { box-shadow: inset 0 -4px 0 #d4a843, 0 0 10px rgba(212,168,67,0.18); }
    50%      { box-shadow: inset 0 -5px 0 #f4c542, 0 0 18px rgba(244,197,66,0.42); }
  }
  body.instrument-piano .rb-tab-cell.current {
    background: #fdfcf3 !important;
    position: relative;
    animation: currentMeasurePulse 1.6s ease-in-out infinite;
  }
  /* Only the staff LINES go gold (the > svg > line targets just the outer
     SVG's direct line children = staff lines + bar line + middle-C hint).
     Notes, clef, accidentals, chord name stay black ink — the pentagrama
     itself glows, not the music. */
  body.instrument-piano .rb-tab-cell.current > svg > line {
    stroke: #d4a843 !important;
    stroke-width: 1.1 !important;
    filter: drop-shadow(0 0 2px rgba(212,168,67,0.65));
  }
  body.instrument-piano .rb-tab-cell.current::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 9px solid #d4a843;
    z-index: 5;
    filter: drop-shadow(0 1px 2px rgba(160,120,32,0.35));
  }
  /* Imminent (the chord about to enter): faint cream-gold tint */
  body.instrument-piano .rb-tab-cell.imminent {
    background: rgba(212,168,67,0.10) !important;
  }
  body.instrument-piano .real-book.compose-interleaved .rb-tab-cell {
    border-bottom: none !important;
  }
  body.instrument-piano .real-book.compose-interleaved {
    border: none !important;
    background: #fdfcf3;
  }
  /* Piano keyboard — shown when state.instrument === 'piano' */
  .piano-svg {
    display: none;
    width: 100%;
    height: 200px;
  }
  body.instrument-piano #chord-neck { display: none; }
  body.instrument-piano .piano-svg { display: block; }
  /* Piano keyboard keys — renamed kb- to avoid collision with header's key-picker .pk- classes */
  .kb-white { fill: #fdfcf3; stroke: #1a1a1a; stroke-width: 1.2; }
  .kb-black { fill: #1a1a1a; stroke: #000; }
  .kb-dot   { stroke: rgba(0,0,0,0.4); stroke-width: 1; }
  .kb-deg {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 800;
    text-anchor: middle;
    fill: #fff;
    pointer-events: none;
  }
  .kb-deg.dark { fill: #1a1a1a; }
  .kb-octave-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    fill: var(--text-faint);
    text-anchor: middle;
    pointer-events: none;
  }

  .scale-neck {
    width: 100%;
    height: 300px;
    background: #1a1410;
    border: 1.5px solid #1a1a1a;
    display: block;
    border-radius: 4px;
    box-shadow: 0 2px 18px rgba(0,0,0,0.25) inset;
  }
  .neck-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .neck-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #5a5a64;
    opacity: 0.65;
    letter-spacing: 0.5px;
    padding-left: 4px;
  }
  .real-book {
    display: flex;
    flex: 1;
    border: 1.5px solid #1a1a1a;
    background: #fdfcf3;
    height: 52px;
  }
  /* Second row beneath the chord-name row: matching cells, each with a mini tab */
  .real-book-tabs {
    display: flex;
    flex: 1;
    border: 1.5px solid #1a1a1a;
    border-top: none;
    background: #fdfcf3;
    height: 150px;     /* taller so the staff has room for proper line spacing */
  }
  .real-book-tabs[hidden] { display: none; }
  /* Tabs row extends across only the chord-cell width (matching real-book above).
     The +1 accounts for the loop button's space on the row above. */
  .rb-tab-cell {
    flex: 1 1 0;
    border-right: 1.5px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    background: #fdfcf3;
  }
  .rb-tab-cell:last-child { border-right: none; }
  .rb-tab-cell.current { background: #fcecaa; }
  /* Visual divider between compose section A (cells 0–7) and B (cells 8–15) */
  .rb-cell.section-divider, .rb-tab-cell.section-divider {
    border-left: 3px double #a07820;
  }

  /* ─── Compose keypad ─── */
  /* Desktop: horizontal flex bar — all 12 buttons in one line at the top */
  .compose-pad {
    /* Desktop: hidden by default. Keyboard 1-7 + map-card clicks cover composing.
       Mobile media-query below turns it back on as a pinned phone dialer. */
    display: none;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 6px 18px;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
  }
  body.player-active .compose-pad { display: none; }   /* hidden during playback */
  .compose-btn {
    min-width: 42px;
    height: 34px;
    padding: 0 10px;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    transition: background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .compose-btn:hover { background: #f5ecd0; }
  .compose-btn:active { background: #fcecaa; }
  .compose-btn .deg {
    display: block;
    font-size: 9px;
    color: var(--text-faint);
    font-style: normal;
    line-height: 1;
    margin-top: 1px;
  }
  .compose-btn.compose-play {
    background: #e8f7ef;
    border-color: var(--tag-tonic);
    color: #047857;
  }
  .compose-btn.compose-del,
  .compose-btn.compose-clear {
    font-family: 'SF Mono', monospace;
    font-style: normal;
  }
  .compose-btn.compose-inv {
    font-family: 'SF Mono', monospace;
    font-style: normal;
    font-size: 13px;
  }
  /* Insert a small spacer between the 7 chord buttons and the controls on desktop */
  .compose-btn[data-act="inv-down"] { margin-left: 18px; }
  /* ─── Mobile: phone-dialer pinned to the bottom of the viewport ─── */
  @media (max-width: 800px) {
    .compose-pad {
      position: fixed;
      left: 0; right: 0;
      /* Sit above the always-visible map toggle bar (about 44px tall + safe area) */
      bottom: calc(44px + env(safe-area-inset-bottom));
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 14px 14px;
      background: var(--panel-2);
      border-top: 1.5px solid #1a1a1a;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      align-items: stretch;
    }
    .compose-pad .compose-btn {
      width: 100%;
      height: 54px;
      font-size: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.12);
      margin: 0;     /* override desktop's left spacer */
    }
    .compose-pad .compose-btn .deg {
      font-size: 10px;
      margin-top: 2px;
    }
    .compose-pad .compose-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }
    /* Phone-dialer layout placement on the 3-col grid:
         row 1: 1 2 3
         row 2: 4 5 6
         row 3: ▼ 7 ▲
         row 4: ⌫ ▶ × */
    .compose-pad .compose-btn[data-act="inv-down"] { grid-row: 3; grid-column: 1; }
    .compose-pad .compose-btn[data-n="7"]          { grid-row: 3; grid-column: 2; }
    .compose-pad .compose-btn[data-act="inv-up"]   { grid-row: 3; grid-column: 3; }
    .compose-pad .compose-btn[data-act="del"]      { grid-row: 4; grid-column: 1; }
    .compose-pad .compose-btn[data-act="play"]     { grid-row: 4; grid-column: 2; }
    .compose-pad .compose-btn[data-act="clear"]    { grid-row: 4; grid-column: 3; }

    /* Padding so the bottom-pinned keypad doesn't cover the content above */
    body:not(.player-active) main,
    body:not(.player-active) .rb-area {
      /* 4 rows × 54px + 3 gaps × 10px + 28px padding ≈ 280px */
      padding-bottom: 290px;
    }
    /* Hide the chord neck while composing — the dialer dominates the screen */
    body:not(.player-active) .map-side-panel { display: none; }

    /* ─── Compose strip: rows of 4 cells instead of one stretched row ─── */
    /* Hide loop/cycle buttons in compose mode (loop auto-enables on play) */
    body:not(.player-active) .rb-loop,
    body:not(.player-active) .rb-cycle { display: none; }
    /* Both strips become 4-col grids that wrap into multiple rows naturally */
    /* Tabs container empty on mobile compose — main strip holds chord+tab pair-rows */
    body:not(.player-active) .real-book.compose-interleaved {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: auto;
      /* Show exactly 2 sets (chord-row + tab-row, twice). Cells got thicker
         so the slot needs ~260 to keep showing 2 full sets without scroll. */
      max-height: 290px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-cell {
      min-height: 58px;
      padding: 1px 0;
      gap: 1px;
      container-type: inline-size;   /* enables cqw sizing inside */
    }
    /* Type scales WITH the cell width so short names (I, V) go huge and long
       ones (Bbm7b5) shrink to fit — true spacemaxx. */
    body:not(.player-active) .real-book.compose-interleaved .rb-cell .rb-roman {
      font-size: clamp(14px, 18cqw, 22px);
      line-height: 1;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-cell .rb-chord {
      font-size: clamp(26px, 38cqw, 46px);
      line-height: 1;
      letter-spacing: -1px;
      white-space: nowrap;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
      min-height: 96px;
      padding: 1px;          /* drop the 4px frame so the diagram can reach the edges */
    }
    /* Drop right border on every 4th cell (right edge of each row) */
    body:not(.player-active) .real-book.compose-interleaved .rb-cell:nth-child(4n),
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell:nth-child(4n) {
      border-right: none;
    }
    /* Horizontal divider between rows */
    body:not(.player-active) .real-book.compose-interleaved .rb-cell,
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
      border-bottom: 1px solid rgba(26,26,26,0.4);
    }
  }
  .rb-tab-cell.imminent {
    animation: cellImminent 1s ease-in-out infinite;
  }
  /* SVG fills the full cell width — the chord diagram letterboxes to its own
     aspect so the dots stay round, but the visible footprint matches the
     chord-name cell above for clean column alignment. */
  .rb-tab-cell svg { width: 100%; height: 100%; display: block; }
  .real-book[hidden] { display: none; }
  .rb-loop {
    height: 150px;    /* matches the tabs row height — sits on the bottom row */
    width: 24px;      /* same thin width as the cycle button so they align visually */
    padding: 0;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-left: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .rb-loop:hover { background: #f5ecd0; }
  .rb-loop svg { display: block; }
  .rb-loop .repeat-thick { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop .repeat-thin  { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop .repeat-dot   { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop.active {
    background: #fffbe8;
  }
  .rb-loop.active .repeat-thick,
  .rb-loop.active .repeat-thin,
  .rb-loop.active .repeat-dot {
    fill: #d4a017;
    filter: drop-shadow(0 0 3px #f4c542) drop-shadow(0 0 6px #f4c542);
  }
  @keyframes repeat-pulse {
    0%, 100% { filter: drop-shadow(0 0 3px #f4c542) drop-shadow(0 0 6px #f4c542); }
    50%      { filter: drop-shadow(0 0 5px #ffd54a) drop-shadow(0 0 10px #ffd54a); }
  }
  .rb-loop.active .repeat-thick,
  .rb-loop.active .repeat-thin,
  .rb-loop.active .repeat-dot {
    animation: repeat-pulse 1.8s ease-in-out infinite;
  }
  /* Key-cycle button — tiny, sits next to the loop button. Only meaningful while looping. */
  .rb-cycle {
    height: 52px;
    width: 24px;
    padding: 0;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-left: none;
    cursor: pointer;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #5a5a64;
    transition: background 0.2s, color 0.2s;
  }
  .rb-cycle:hover { background: #f5ecd0; color: #1a1a1a; }
  .rb-cycle.active {
    background: #fcecaa;
    color: #6b4a0e;
  }
  /* When strip is hidden, the loop button needs its own left border */
  /* When the row's main element is hidden, the trailing button needs its own left border */
  .real-book[hidden] + .rb-cycle,
  .real-book-tabs[hidden] + .rb-loop { border-left: 1.5px solid #1a1a1a; }
  .rb-cell {
    flex: 1 1 0;
    padding: 6px 4px;
    border-right: 1.5px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    gap: 1px;
    transition: background 0.18s;
    position: relative;
  }
  .rb-cell:last-child { border-right: none; }
  /* Cells of the composed strip are clickable (audition + focus). */
  body:not(.player-active) [data-compose-idx] { cursor: pointer; }
  body:not(.player-active) [data-compose-idx]:hover { background: rgba(160,120,32,0.10); }
  /* Selected compose cell — warm orange so the user knows the next chord /
     inversion change will EDIT this cell instead of appending a new one. */
  [data-compose-idx].compose-selected {
    background: rgba(232,144,52,0.22) !important;
    box-shadow: inset 0 0 0 2px #e89034;
  }
  [data-compose-idx].compose-selected:hover {
    background: rgba(232,144,52,0.30) !important;
  }
  .rb-cell.current {
    background: #fcecaa;
  }
  /* Imminent: the upcoming chord on mobile when the page is about to roll over */
  @keyframes cellImminent {
    0%, 100% { background: #faedc4; }
    50%      { background: #f5d98a; }
  }
  .rb-cell.imminent {
    animation: cellImminent 1s ease-in-out infinite;
    color: #6b4a0e;
    font-weight: 700;
  }
  .rb-roman {
    font-size: 11px;
    color: #5a5a64;
    font-style: italic;
    font-weight: 500;
    line-height: 1;
  }
  .rb-cell.current .rb-roman { color: #6b4a0e; }
  .rb-chord {
    font-size: 19px;
    color: #1a1a1a;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
  }
  .rb-continuation {
    font-size: 22px;
    color: #5a5a64;
    font-weight: 400;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: normal;
  }
  .rb-peek {
    flex: 0 0 auto;
    padding: 0 14px;
    display: flex;
    align-items: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: #908d80;
    opacity: 0.6;
    border-left: 1.5px dashed #908d80;
    background: #faf8ec;
    white-space: nowrap;
    transition: opacity 0.25s, color 0.25s, background 0.25s;
  }
  @keyframes peekImminent {
    0%, 100% { background: #faedc4; }
    50%      { background: #f5d98a; }
  }
  .rb-peek.imminent {
    opacity: 1;
    color: #6b4a0e;
    font-weight: 700;
    border-left-style: solid;
    border-left-color: #6b4a0e;
    animation: peekImminent 1s ease-in-out infinite;
  }
  .map-card.next-up {
    border-color: rgba(160,120,32,0.85) !important;
    background: #faedc4 !important;
    z-index: 18;
    animation: nextUpBlink var(--blink-duration, 1s) ease-in-out infinite;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    min-height: 0;
  }
  .bottom-bar {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    min-height: 0;
  }
  .bottom-bar .alternatives {
    flex: 0 0 auto;
    width: 48%;
    border-top: none;
    border-right: 1px solid var(--line);
  }
  .bottom-bar .fb-wrap {
    flex: 1;
    border-top: none;
    min-width: 0;
  }

  /* ─── Chord Map ─── */
  .map-wrap {
    position: relative;
    overflow: auto;
    padding: 8px 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 18px;
  }
  .chord-map-host {
    width: 460px;
    height: 680px;
    flex-shrink: 0;
  }
  /* Desktop: the mobile map toggle + backdrop never show */
  #map-mobile-toggle, #map-mobile-backdrop { display: none; }
  .chord-map {
    position: relative;
    width: 540px;
    height: 800px;
    transform: scale(0.85);
    transform-origin: top left;
  }
  .map-arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* Sit BEHIND the cards so lines never cover chord content. */
    z-index: 1;
  }
  .map-card {
    position: absolute;
    width: 100px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 5px 6px;
    cursor: pointer;
    transition: opacity 0.18s, border-color 0.12s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    opacity: 0.95;
    z-index: 2;
  }
  .map-card:hover { border-color: var(--line-2); opacity: 1; z-index: 3; }
  .map-card.hub {
    width: 130px;
    background: var(--panel-2);
    border: 1.5px solid var(--accent);
    padding: 10px 8px 10px;
    box-shadow: 0 4px 18px rgba(31,29,24,0.08);
    z-index: 4;
  }
  .map-card.tag-tonic     { border-left: 3px solid var(--tag-tonic); }
  .map-card.tag-predom    { border-left: 3px solid var(--tag-predom); }
  .map-card.tag-dom       { border-left: 3px solid var(--tag-dom); }
  .map-card.tag-borrowed  { border-left: 3px solid var(--tag-borrowed); }
  .map-card.tag-secondary { border-left: 3px solid #b45309; }

  /* Satellite (non-diatonic): smaller and dimmer than diatonic chords */
  .map-card.satellite {
    width: 92px !important;
    padding: 4px 4px 5px;
    opacity: 0.82;
    background: var(--bg);
    border-style: dashed;
    z-index: 1;
  }
  .map-card.satellite .mc-top { gap: 4px; }
  .map-card.satellite .mc-roman { font-size: 13px; }
  .map-card.satellite .mc-name { font-size: 10.5px; }
  .map-card.satellite .mc-svg-wrap svg { width: 72px !important; }
  .map-card.satellite:hover { opacity: 1; }
  /* Cards connected to the focused chord get a soft amber glow */
  .map-card.related {
    box-shadow: 0 0 0 1.5px rgba(160,120,32,0.45), 0 0 14px rgba(212,160,23,0.22);
    border-color: rgba(160,120,32,0.55) !important;
    transition: box-shadow 0.35s ease, border-color 0.35s ease;
  }
  /* Stronger, slowly-pulsing glow when the focused chord is the tonic hub —
     makes the opening view feel alive without spaghetti arrows. */
  @keyframes hubRelatedPulse {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(160,120,32,0.45), 0 0 16px rgba(244,197,66,0.32); }
    50%      { box-shadow: 0 0 0 2px   rgba(160,120,32,0.6),  0 0 26px rgba(244,197,66,0.55); }
  }
  .map-card.related-from-hub {
    animation: hubRelatedPulse 2.6s ease-in-out infinite;
  }
  /* "In current progression" — quiet marker so progression chords are recognizable
     without competing with the playing/next-up highlights. */
  .map-card.in-progression::after {
    content: '';
    position: absolute;
    top: 5px;
    right: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.55;
    pointer-events: none;
  }
  /* Don't show the dot when the card is already the live or upcoming chord */
  .map-card.playing.in-progression::after,
  .map-card.next-up.in-progression::after { display: none; }
  /* Cards NOT in the current progression get a subtle dim so the in-progression
     cards stand out without explicit decoration */
  body.player-active .map-card:not(.in-progression):not(.playing):not(.next-up) {
    opacity: 0.55;
  }
  /* Diatonic: emphasize with subtle shadow + thicker border */
  .map-card.diatonic {
    box-shadow: 0 1px 4px rgba(31,29,24,0.07);
    border-width: 1.5px;
  }
  .map-card.focused {
    border-color: var(--accent);
    background: #fff8e6;
    box-shadow: 0 6px 22px rgba(31,29,24,0.10), 0 0 0 2px rgba(160,120,32,0.22);
    z-index: 15;
    opacity: 1;
  }
  .mc-top { display: flex; gap: 6px; align-items: baseline; line-height: 1; }
  .mc-roman {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
  }
  .map-card.hub .mc-roman { font-size: 28px; }
  .mc-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .map-card.hub .mc-name { font-size: 17px; }
  .mc-tag {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .mc-tag.tonic     { color: var(--tag-tonic); }
  .mc-tag.predom    { color: var(--tag-predom); }
  .mc-tag.dom       { color: var(--tag-dom); }
  .mc-tag.borrowed  { color: var(--tag-borrowed); }
  .mc-tag.picardy   { color: var(--tag-picardy); }
  .mc-tag.secondary { color: #b45309; }
  .mc-svg-wrap { width: 100%; display: flex; justify-content: center; }
  .mc-svg-wrap svg { width: 78px; height: auto; }
  .map-card.hub .mc-svg-wrap svg { width: 108px; }
  .mc-cost {
    font-size: 9px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
  }
  .mc-cost strong { color: var(--accent); }

  /* ─── Alternatives ─── */
  .alternatives {
    padding: 8px 20px 10px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
  }
  .alt-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .alt-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .alt-title strong { color: var(--accent); }
  .alt-hint { font-size: 10px; color: var(--text-faint); }
  .alt-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .alt-card {
    flex: 0 0 auto;
    width: 100px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 5px 5px;
    cursor: pointer;
    transition: all 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .alt-card:hover { border-color: var(--line-2); }
  .alt-card.selected {
    border-color: var(--accent);
    background: #fff8e6;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .alt-card svg { width: 88px; height: 92px; }
  .alt-card .ac-label {
    font-size: 8px;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.2;
  }
  .alt-card .ac-notes {
    font-size: 8px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.3px;
  }

  /* ─── Fretboard ─── */
  .fb-wrap {
    padding: 6px 20px 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  svg.fretboard { width: 100%; height: 100%; display: block; max-height: 120px; }

  /* SVG arrow style */
  .arrow-path {
    fill: none;
    stroke: #b8b4a4;
    stroke-width: 1.5;
    opacity: 0.7;
  }
  .arrow-path.highlighted {
    stroke: var(--accent);
    stroke-width: 2.5;
    opacity: 1;
  }
  .arrow-path.sub {
    stroke-dasharray: 4 3;
  }
  .arrow-path.secondary {
    stroke: #b45309;
    opacity: 0.55;
    stroke-dasharray: 6 2;
  }
  .arrow-path.secondary.highlighted {
    stroke: #b45309;
    opacity: 1;
    stroke-width: 2.5;
  }
  .arrow-cost {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    fill: var(--text-faint);
  }
  .arrow-cost.highlighted {
    fill: var(--accent);
    font-weight: 700;
  }

  /* ════════════════════════════════════════════════════════════
     MOBILE — strip down to the essentials: chord neck + real book
     ════════════════════════════════════════════════════════════ */
  @media (max-width: 800px) {
    header {
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 6px 10px;
    }
    .brand { display: none; }                /* title takes room we don't have */
    .ctx-label { font-size: 9px; }

    /* Chord map — too dense for phones inline. Hidden by default, shown as
       a fullscreen overlay when the user taps the floating "🗺 Map" button. */
    .map-wrap { flex-direction: column; padding: 4px; gap: 8px; }
    .chord-map-host { display: none; }

    /* Toggle bar — thin row pinned to the very bottom of the viewport so it
       stays visible regardless of whether the dialer or the chord-map is up. */
    #map-mobile-toggle {
      display: block;
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 102;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
      background: #fdfcf3;
      border: none;
      border-top: 1.5px solid #1a1a1a;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    body.player-active #map-mobile-toggle { display: none; }
    body.map-overlay-open #map-mobile-toggle {
      background: #1a1a1a;
      color: #fdfcf3;
    }
    /* When map mode is on, the chord map REPLACES the keypad in the same
       bottom-pinned slot — but the action buttons (▼/▲/⌫/▶/×) hop to the
       right side of the map so the user can still cycle inversions, delete,
       play and clear without switching back to Keys mode. */
    body.map-overlay-open .compose-chord-btn { display: none; }
    body.map-overlay-open .compose-pad {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: fixed;
      right: 6px;
      bottom: calc(50px + env(safe-area-inset-bottom));
      top: auto; left: auto;
      width: 52px;
      max-height: 42vh;
      padding: 0;
      background: transparent;
      border-top: none;
      box-shadow: none;
      z-index: 101;
    }
    body.map-overlay-open .compose-pad .compose-btn {
      grid-row: auto !important;
      grid-column: auto !important;
      width: 100%;
      height: 44px;
      font-size: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    /* In the vertical right-column layout, ▲ should sit ABOVE ▼ so the
       arrow direction matches its action (up raises, down lowers). */
    body.map-overlay-open .compose-pad .compose-btn[data-act="inv-up"]   { order: -2; }
    body.map-overlay-open .compose-pad .compose-btn[data-act="inv-down"] { order: -1; }
    body.map-overlay-open .chord-map-host {
      display: block;       /* not flex — flex centering breaks when child overflows */
      position: fixed;
      left: 0; right: 0;
      bottom: calc(44px + env(safe-area-inset-bottom));
      z-index: 100;
      width: 100vw;
      height: 260px;
      max-height: 42vh;
      background: var(--panel-2);
      border-top: 1.5px solid #1a1a1a;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      padding: 8px 10px;
    }
    body.map-overlay-open .chord-map {
      /* Pin to top-center of the host and translate the WIDE box left by half
         its own width before scaling. This is the only reliable way to center
         a box that is wider than its container — flex justify-content falls
         back to start when content overflows. */
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) scale(var(--map-scale, 0.6));
      transform-origin: top center;
      width: 540px;
      height: 800px;
    }
    /* Backdrop unused in this layout — map sits in the keypad slot, not over content */
    #map-mobile-backdrop { display: none !important; }
    body.map-overlay-open #map-mobile-toggle {
      background: #1a1a1a;
      color: #fdfcf3;
    }

    /* Side panel becomes full-width with just the chord neck */
    .map-side-panel { width: 100% !important; gap: 8px; }
    .scale-neck { height: 200px; }            /* shorter than desktop */
    /* Drop the scale neck (second one) — keep only the chord neck */
    .neck-block:nth-of-type(2) { display: none; }
    .neck-label { font-size: 11px; padding-left: 2px; }

    /* Bottom area — drop the alternatives + main fretboard, real estate is gone */
    .bottom-bar .alternatives,
    .bottom-bar .fb-wrap { display: none; }
    .bottom-bar { display: none; }

    /* Real Book strip — span the full viewport width on mobile (desktop pins
       it to the right half; on a phone that squeezes the chord cells off-screen). */
    .rb-area { padding: 6px; justify-content: stretch; }
    .rb-stack { width: 100% !important; }
    .real-book { height: 56px; }
    .rb-cycle { height: 56px; }
    .real-book-tabs { height: 70px; }
    .rb-loop { height: 70px; }   /* mobile: match the (shorter) tabs row */
    /* Chord cells: more breathing room, bigger chord names — they ARE the content */
    .rb-cell { padding: 4px 2px; }
    .rb-cell .rb-roman { font-size: 11px; }
    .rb-cell .rb-chord { font-size: 19px; }
    /* Drop the peek entirely on mobile — the 4 cells already show what's coming,
       and when the current chord enters its imminent state the page rolls over.
       No need to waste space on a separate next-chord readout. */
    .rb-peek { display: none; }

    /* Sound block — let it wrap and use compact sizing */
    .ctx-block { flex-shrink: 0; min-width: 0; }
    .ctx-block > div { flex-wrap: wrap; gap: 4px !important; }
    .auto-btn { font-size: 10px !important; padding: 3px 5px !important; }
    .bpm-compact { padding: 2px 6px; }
    .bpm-val { font-size: 11px; }

    /* Song / player-info on phones: own bar below the rest of the header
       so it never competes for space with Key / Tonality / Chords / Sound. */
    .song-block {
      flex: 1 0 100% !important;
      min-width: 0 !important;
      order: 99;                     /* force to the bottom of the header flex */
      width: 100%;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }
    .song-block .ctx-label { display: none; }   /* label not needed in standalone bar */
    .song-block > div:last-child { width: 100%; gap: 6px !important; }
    #player-info {
      gap: 8px;
      padding: 3px 4px;
      font-size: 11px;
      flex: 1;
    }
    #player-info .pi-div,
    #player-info .pi-key,
    #player-info .pi-step,
    #player-info .pi-iter { display: none; }
    #player-info .pi-prog { font-size: 13px; }
    #player-info .pi-form-seg { min-width: 10px; }
    #player-info .pi-beats { gap: 4px; }
    #player-info .pi-beat  { width: 11px; font-size: 11px; }

    /* Mixer / sound dropdowns — wider tap targets */
    .sound-menu-item { padding: 8px 12px; font-size: 13px; }
    .mixer-row { grid-template-columns: 60px 1fr 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Guitarra</div>

  <div class="ctx-block">
    <div class="ctx-label">Key</div>
    <div class="ctx-row" id="key-row"></div>
  </div>

  <div class="ctx-block">
    <div class="ctx-label">Tonality</div>
    <div class="toggle" id="tonality-toggle">
      <button class="active" data-tonality="major">Major</button>
      <button data-tonality="minor">Minor</button>
    </div>
  </div>

  <div class="ctx-block">
    <div class="ctx-label">Chords</div>
    <button class="auto-btn" id="chord-scope" style="font-weight:600" title="filter which chords appear in the map and progressions">✦ All</button>
  </div>

  <div class="spacer"></div>

  <div class="ctx-block">
    <div class="ctx-label">Sound</div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="auto-btn" id="instrument-btn" style="font-weight:600" title="Toggle guitar / piano view">🎸</button>
      <button class="auto-btn" id="mixer-btn" style="font-weight:600" title="open the volume mixer">🎚 Mix</button>
      <button class="auto-btn active" id="bass-toggle" style="font-weight:600" title="mute/unmute bass">🎸 Bass</button>
      <button class="auto-btn" id="chord-sound" style="font-weight:600" title="click to pick chord sound">🎹 Piano</button>
      <button class="auto-btn" id="voicing-pref" style="font-weight:600" title="click to pick voicing type">🎼 All</button>
      <button class="auto-btn" id="rhythm-btn" style="font-weight:600" title="rhythm style">🥁 Ride</button>
      <div class="bpm-compact" id="bpm-compact" title="drag up/down or click to type BPM">
        <span class="bpm-val" id="bpm-val">120</span>
      </div>
    </div>
  </div>

  <div class="ctx-block song-block" style="flex:1;min-width:200px">
    <div class="ctx-label">Song</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="auto-btn" id="auto-play">▶ AI</button>
      <div id="player-info"></div>
    </div>
  </div>
</header>

<div class="sound-menu" id="sound-menu" hidden></div>
<div class="sound-menu" id="voicing-menu" hidden></div>
<div class="sound-menu" id="scope-menu" hidden></div>
<div class="sound-menu mixer-menu" id="mixer-menu" hidden></div>
<div class="sound-menu" id="rhythm-menu" hidden></div>

<!-- Compose keypad — number pad for typing a custom progression. Only visible
     when the AI isn't playing. On phone: phone-dialer grid pinned to the bottom. -->
<div class="compose-pad" id="compose-pad"></div>

<!-- Mobile: a thin pinned bar at the very bottom of the viewport that toggles
     between the keypad (default) and the chord-map overlay. Sits below both
     the compose-pad and the map-host so it's always visible. -->
<button id="map-mobile-toggle" type="button" title="toggle keypad / chord map">🗺 Map</button>
<div id="map-mobile-backdrop" hidden></div>

<div class="rb-area">
  <div class="rb-stack">
    <div class="rb-row">
      <div class="real-book" id="real-book" hidden></div>
      <button class="rb-cycle" id="cycle-toggle" title="no key cycle">·</button>
    </div>
    <div class="rb-row">
      <div class="real-book-tabs" id="real-book-tabs" hidden></div>
      <button class="rb-loop" id="loop-toggle" title="loop the current section" aria-label="repeat"><svg width="14" height="22" viewBox="0 0 20 30"><rect class="repeat-thick" x="3"  y="3" width="4" height="24"/><rect class="repeat-thin"  x="9"  y="3" width="1.4" height="24"/><circle class="repeat-dot" cx="15" cy="11" r="1.8"/><circle class="repeat-dot" cx="15" cy="19" r="1.8"/></svg></button>
    </div>
  </div>
</div>

<main>
  <div class="map-wrap">
    <div class="chord-map-host">
      <div class="chord-map" id="chord-map">
        <svg class="map-arrows" id="map-arrows"></svg>
      </div>
    </div>
    <div class="map-side-panel">
      <div class="neck-block">
        <div class="neck-label">chord</div>
        <svg class="scale-neck" id="chord-neck" preserveAspectRatio="xMidYMid meet"></svg>
        <svg class="piano-svg" id="chord-piano" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="alternatives">
      <div class="alt-header">
        <div class="alt-title">Other voicings for <strong id="alt-chord-name">—</strong></div>
      </div>
      <div class="alt-row" id="alt-row"></div>
    </div>

    <div class="fb-wrap">
      <svg id="fretboard-svg" class="fretboard" viewBox="0 0 2500 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════
   THEORY
   ════════════════════════════════════════════════════════════ */

const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const ROOTS = [
  {pc:0,name:'C',prefer:'sharp'},{pc:1,name:'Db',prefer:'flat'},{pc:2,name:'D',prefer:'sharp'},
  {pc:3,name:'Eb',prefer:'flat'},{pc:4,name:'E',prefer:'sharp'},{pc:5,name:'F',prefer:'flat'},
  {pc:6,name:'F#',prefer:'sharp'},{pc:7,name:'G',prefer:'sharp'},{pc:8,name:'Ab',prefer:'flat'},
  {pc:9,name:'A',prefer:'sharp'},{pc:10,name:'Bb',prefer:'flat'},{pc:11,name:'B',prefer:'sharp'},
];

const STRING_OPEN_MIDI = [40, 45, 50, 55, 59, 64];
const STRING_LABELS = ['E','A','D','G','B','E'];
const N_FRETS = 22;

const STRING_SETS = [
  {idx:[0,1,2,3], label:'EADG', sub:'low'},
  {idx:[1,2,3,4], label:'ADGB', sub:'mid'},
  {idx:[2,3,4,5], label:'DGBE', sub:'top'},

const QUALITIES = {
  'maj7':  {ints:[0,4,7,11],  degs:['R','3','5','7'],     sfx:'maj7'},
  '7':     {ints:[0,4,7,10],  degs:['R','3','5','b7'],    sfx:'7'},
  'm7':    {ints:[0,3,7,10],  degs:['R','b3','5','b7'],   sfx:'m7'},
  'm7b5':  {ints:[0,3,6,10],  degs:['R','b3','b5','b7'],  sfx:'ø'},
  'dim7':  {ints:[0,3,6,9],   degs:['R','b3','b5','bb7'], sfx:'°7'},
  'mMaj7': {ints:[0,3,7,11],  degs:['R','b3','5','7'],    sfx:'mMaj7'},
  '6':     {ints:[0,4,7,9],   degs:['R','3','5','6'],     sfx:'6'},
  'm6':    {ints:[0,3,7,9],   degs:['R','b3','5','6'],    sfx:'m6'},

/* ─── CHORD MAP — tonic centered, approaches around ─── */

const CHORD_MAP = {
  major: {
    chordDefs: {
      // Diatonic
      'I':    {roman:'I',    deg:0,  quality:'maj7', tag:'tonic'},
      'ii':   {roman:'ii',   deg:2,  quality:'m7',   tag:'predom'},

      // Secondary dominants
      'V_V':  {roman:'V/V',  deg:2,  quality:'7',    tag:'secondary'},
      'V_ii': {roman:'V/ii', deg:9,  quality:'7',    tag:'secondary'},

      'iv':   {roman:'iv',   deg:5,  quality:'m7',   tag:'borrowed'},
      'bVII': {roman:'bVII', deg:10, quality:'7',    tag:'borrowed'},
      // Tritone sub
      'bII7': {roman:'bII7', deg:1,  quality:'7',    tag:'borrowed'},
    },
    nodes: {

      'n_vi':   {chord:'vi',   x:50,  y:170},
      'n_ii':   {chord:'ii',   x:50,  y:310},
      'n_IV':   {chord:'IV',   x:50,  y:450},
      'n_bVII': {chord:'bVII', x:50,  y:600},
      // ── PREDOMINANT-area satellites (x=170, tucked right of their parent) ──
      'n_V_ii': {chord:'V_ii', x:170, y:325},   // sec dom of ii, sits right of ii
      'n_iv':   {chord:'iv',   x:170, y:465},   // borrowed iv, right of IV (same row)
      // ── DOMINANT column (middle, x=280) — moved right so the predom
      //    satellites at x=170 (right edge 262) don't collide with it ──
      'n_V':    {chord:'V',    x:280, y:450},
      'n_V_V':  {chord:'V_V',  x:280, y:325},   // sec dom of V, stacked above V
      'n_bII7': {chord:'bII7', x:280, y:600},
      // ── TONIC (right) ──
      'n_I':    {chord:'I',    x:400, y:560, hub:true},
    },
    arrows: [
      // Predominant descending-5ths chain (straight down left column)
      {from:'n_iii', to:'n_vi'},
      {from:'n_vi',  to:'n_ii'},
      // Predoms → V (the push)
      {from:'n_ii',  to:'n_V'},
      {from:'n_IV',  to:'n_V'},
      // IV's alternate roles
      {from:'n_IV',  to:'n_ii', curve:-1},
      {from:'n_IV',  to:'n_I'},
      // V → I (the move)
      {from:'n_V',   to:'n_I'},
      // Deceptive V → vi (arches up-left around the predom column)
      {from:'n_V',   to:'n_vi', curve:-1},
      // iii's options
      {from:'n_iii', to:'n_IV'},                // stepwise neighbor
      {from:'n_iii', to:'n_V',  curve:1},       // long diagonal to dom
      // Borrowed iv path
      {from:'n_iv',  to:'n_I'},
      {from:'n_iv',  to:'n_bVII'},
      {from:'n_bVII',to:'n_I'},

      {from:'n_bII7',to:'n_I'},

      {from:'n_V_V', to:'n_V'},
      {from:'n_V_ii',to:'n_ii'},

      {from:'n_I',   to:'n_ii'},
      {from:'n_I',   to:'n_iii'},
      {from:'n_I',   to:'n_IV'},
      {from:'n_I',   to:'n_V'},

  minor: {
    chordDefs: {
      'i':    {roman:'i',    deg:0,  quality:'m7',    tag:'tonic'},
      'iiø':  {roman:'iiø',  deg:2,  quality:'m7b5',  tag:'predom'},
      'bIII': {roman:'bIII', deg:3,  quality:'maj7',  tag:'tonic'},
