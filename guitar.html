<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Disable HTTP caching so iterative development always shows the
     freshest deploy without manual hard-reloads on every device. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Guitarra</title>
<link rel="manifest" href="pwa/manifest-guitar.json">
<meta name="theme-color" content="#e6e3da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guitarra">
<link rel="apple-touch-icon" href="pwa/icon-guitar.svg">
<link rel="icon" type="image/svg+xml" href="pwa/icon-guitar.svg">
<style>
  :root {
    --bg: #e6e3da;
    --panel: #f0ede4;
    --panel-2: #e8e5dc;
    --line: #d2cec0;
    --line-2: #b8b4a4;
    --text: #1f1d18;
    --text-dim: #5e5c52;
    --text-faint: #908d80;
    --accent: #a07820;

    --i-R:#dc2626;--i-b2:#ea580c;--i-2:#d97706;--i-b3:#7c3aed;--i-3:#1d4ed8;
    --i-4:#0891b2;--i-b5:#db2777;--i-5:#059669;--i-b6:#9333ea;--i-6:#ca8a04;
    --i-b7:#c2410c;--i-7:#b45309;--i-9:#db2777;--i-b9:#e11d48;--i-s9:#a21caf;
    --i-11:#0891b2;--i-s11:#0e7490;--i-13:#65a30d;--i-b13:#84cc16;--i-s5:#9333ea;

    --tag-tonic: #059669;
    --tag-predom: #a07820;
    --tag-dom: #dc2626;
    --tag-borrowed: #9333ea;
    --tag-picardy: #b45309;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  .midi-export-btn { font-size: 11px !important; padding: 2px 8px !important; opacity: 0.7; }
  .midi-export-btn:hover { opacity: 1; }
  .midi-menu {
    position: absolute; top: 100%; left: 0; z-index: 999;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px;
    padding: 4px 0; min-width: 150px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  .midi-menu button {
    display: block; width: 100%; text-align: left; padding: 6px 12px;
    background: none; border: none; font-size: 12px; color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .midi-menu button:hover { background: var(--panel-2); }
  html, body { height: 100%; }
  html {
    /* iOS Safari auto-inflates text for "readability" which broke the
       carefully-sized chord names on iPhone. Lock to 100%. */
    -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(6px, env(safe-area-inset-top)) 16px 6px;  /* respect iPhone notch */
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px;
    color: var(--accent);
    font-weight: 500;
  }
  .ctx-block { display: flex; flex-direction: column; gap: 3px; }
  .ctx-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .ctx-row { display: flex; gap: 2px; }

  /* Mini piano keyboard for key picker */
  .key-piano {
    position: relative;
    display: flex;
    height: 40px;
    user-select: none;
  }
  .pk-white {
    width: 24px;
    height: 40px;
    background: #fbf9f1;
    border: 1px solid var(--line-2);
    border-right: none;
    border-radius: 0 0 3px 3px;
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 4px;
    cursor: pointer;
    line-height: 1;
  }
  .pk-white:last-child { border-right: 1px solid var(--line-2); }
  .pk-white:hover { background: #f0ebd6; }
  .pk-white.active {
    background: var(--accent);
    color: #fff;
  }
  .pk-black {
    position: absolute;
    width: 16px;
    height: 26px;
    background: #1f1d18;
    border: none;
    border-radius: 0 0 3px 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 3px;
    cursor: pointer;
    z-index: 2;
    line-height: 1;
  }
  .pk-black:hover { background: #3a3833; }
  .pk-black.active {
    background: var(--accent);
    color: #1f1d18;
  }
  .chip {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    min-width: 28px;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--line-2); color: var(--text); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  .toggle { display: flex; background: var(--bg); border-radius: 6px; padding: 2px; }
  .toggle button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 3px rgba(160,120,32,0.35);
  }

  .bpm-compact {
    display: inline-flex;
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 2px 6px;
    cursor: ns-resize;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    min-width: 32px;
    justify-content: center;
    color: var(--text-dim);
  }
  .bpm-compact:hover { color: var(--accent); }
  .bpm-compact.dragging { color: var(--accent); }
  .bpm-val {
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .bpm-compact input.bpm-edit {
    width: 38px;
    padding: 0;
    background: transparent;
    color: var(--text);
    border: none;
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    outline: none;
  }
  .bpm-compact input.bpm-edit::-webkit-inner-spin-button,
  .bpm-compact input.bpm-edit::-webkit-outer-spin-button { display: none; }

  /* ════════════════════════════════════════════════════════════
     BRUTALIST CONTROL PANELS — Visual + Sound
     A nod to Soviet poster typography: heavy mono caps, hard
     black borders (2px), zero radius, zero shadows. State is
     conveyed by inversion (black bg, cream text) — no glowing
     accent color. Cells sit edge-to-edge sharing borders to
     read as one panel, not separate pills.
  ════════════════════════════════════════════════════════════ */
  /* Wrapper that keeps Visual + Sound together as one logical row.
     nowrap = never split onto two rows; if the combined width exceeds
     the viewport on mobile, the strip scrolls horizontally instead. */
  .vs-snd-strip {
    display: flex;
    align-items: stretch;
    gap: 10px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    max-width: 100%;
  }
  .vs-snd-strip::-webkit-scrollbar { display: none; }
  /* Soviet poster palette: warm cream paper with subtle noise grain,
     deep ochre labels, brick-red active state instead of stark black.
     The noise is an inline SVG (fractal turbulence) at very low alpha
     — readable as PAPER, not noticeable as pattern. */
  .vs-panel, .snd-panel {
    display: inline-flex;
    align-items: stretch;
    border: 2px solid #1a1a1a;
    background-color: #f4ecd4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(60, 40, 10, 0.06);
  }
  .vs-cell, .snd-cell {
    appearance: none;
    background: transparent;             /* show the panel's paper texture */
    color: #1a1a1a;
    border: 0;
    border-right: 2px solid #1a1a1a;
    border-radius: 0;
    margin: 0;
    padding: 4px 12px 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 42px;
    transition: background 0.08s, color 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .vs-cell:last-child, .snd-cell:last-child { border-right: 0; }
  /* Tiny header label — Soviet ochre/mustard so it reads as printed
     ink on the paper rather than just faded black. */
  .snd-cell::before {
    content: attr(data-label);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: #8a5a1a;
    opacity: 0.85;
    line-height: 1;
  }
  .vs-cell { font-size: 13px; min-width: 44px; padding: 8px 14px; }
  .snd-cell { font-size: 12px; min-width: 56px; }
  .snd-cell .sc-val {
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.8px;
  }
  /* Hover — warmer cream tint, still showing the paper texture under it. */
  .vs-cell:hover, .snd-cell:hover { background: rgba(160, 120, 32, 0.12); }
  /* Active state — Soviet brick red instead of stark black. Reads
     as a stamped INK BLOCK on the page; not as harsh as pure inversion. */
  .vs-cell.active,
  .snd-cell.active {
    background: #a8231b;
    color: #f8eed0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.18);
  }
  .snd-cell.active::before { color: #f8d8c0; opacity: 0.9; }
  /* Pressed — momentary darker invert for tactile feedback. */
  .vs-cell:active, .snd-cell:active {
    background: #1a1a1a;
    color: #f8eed0;
  }
  .vs-cell:active::before, .snd-cell:active::before { color: #f8d8c0; }
  /* Mixer cell carries no semantic value — show its glyph centered. */
  .snd-mix::before { opacity: 0.55; }
  .snd-mix .sc-val { font-size: 18px; line-height: 1; }
  /* On small screens, allow the panel to wrap rows without losing
     edge-to-edge borders — cells stay flush within each row. */
  @media (max-width: 800px) {
    .vs-cell, .snd-cell { min-height: 36px; min-width: 0; padding: 3px 8px 5px; }
    .snd-cell { font-size: 10px; }
    .snd-cell .sc-val { font-size: 11px; }
    .snd-cell::before { font-size: 7px; letter-spacing: 1px; }
    .vs-cell { font-size: 11px; padding: 6px 10px; }
    /* The generic mobile rule (.ctx-block > div) sets flex-wrap:wrap +
       gap:4px on every header block — that would split the brutalist
       panel into separate pills. Force zero gap so cells stay flush;
       wrapping is fine but the shared-border look must be preserved. */
    .vs-panel, .snd-panel { gap: 0 !important; flex-wrap: nowrap !important; }
    /* Same fight for the Visual+Sound wrapper: keep nowrap and the
       10px panel gap, override the generic 4px. */
    .vs-snd-strip { flex-wrap: nowrap !important; gap: 8px !important; }
    /* Mobile: shave a couple more pixels off each cell so the full
       VISUAL + 6-cell SOUND strip fits within a phone width. */
    .vs-cell, .snd-cell { padding: 3px 6px 4px; }
    .snd-cell { font-size: 9px; }
    .snd-cell .sc-val { font-size: 10px; }
    .snd-cell::before { font-size: 7px; letter-spacing: 0.8px; }
  }

  /* Sound popup menu */
  .sound-menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 6px 20px rgba(31,29,24,0.12);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 120px;
  }
  .sound-menu[hidden] { display: none; }
  .sound-menu-item {
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sound-menu-item:hover { background: var(--panel-2); }
  .sound-menu-item.selected {
    background: rgba(160,120,32,0.15);
    color: var(--accent);
  }
  .sound-menu-item .check {
    margin-left: auto;
    color: var(--accent);
    font-weight: 700;
    opacity: 0;
  }
  .sound-menu-item.selected .check { opacity: 1; }

  /* Mixer (channel volume) panel */
  .mixer-menu { min-width: 220px; padding: 10px 12px; gap: 8px; }
  .mixer-row {
    display: grid;
    grid-template-columns: 70px 1fr 28px;
    align-items: center;
    gap: 8px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
    color: var(--text);
  }
  .mixer-row .mix-label { font-style: italic; opacity: 0.85; }
  .mixer-row input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .mixer-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
  }
  .mixer-row .mix-val {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-align: right;
  }
  .mixer-row.muted .mix-label { opacity: 0.4; text-decoration: line-through; }

  /* Playback */
  .auto-btn {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .auto-btn:hover { border-color: var(--line-2); color: var(--text); }
  #auto-stop.armed {
    animation: autoStopArmedPulse 0.7s ease-in-out infinite;
    border-color: #dc2626 !important;
    color: #dc2626 !important;
  }
  @keyframes autoStopArmedPulse {
    0%, 100% { background: transparent; }
    50%      { background: #dc2626; color: #fff !important; }
  }
  .auto-btn.active {
    background: var(--tag-tonic);
    color: #fff;
    border-color: var(--tag-tonic);
  }
  /* ─── Player info bar — fine, green-leaning, info-rich. One stable row.
     Chord names live in the Real Book strip; this is the context layer. */
  #player-info {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;            /* never overflow to the right — wrap to a 2nd row */
    row-gap: 4px;
    color: var(--text-dim);
    font-family: 'Cormorant Garamond', Georgia, serif;
    width: 100%;
    min-width: 0;
    min-height: 26px;
    /* Subtle green-tinted backdrop so the player state reads as "live" */
    background: linear-gradient(90deg, rgba(5,150,105,0.04), transparent 35%, transparent 65%, rgba(5,150,105,0.04));
    border-top: 1px solid rgba(5,150,105,0.18);
    border-bottom: 1px solid rgba(5,150,105,0.18);
    padding: 4px 10px;
  }
  #player-info .pi-spacer { flex: 1; }
  /* Subtle vertical divider between info groups */
  #player-info .pi-div {
    width: 1px;
    height: 14px;
    background: rgba(5,150,105,0.22);
    margin: 0 -4px;
  }
  /* Key signature pill — small green chip showing the active key */
  #player-info .pi-key {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--tag-tonic);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  #player-info .pi-key .pi-key-q {
    font-style: normal;
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 2px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  /* Step position inside the current progression — '2/4' tiny mono */
  #player-info .pi-step {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--tag-tonic);
    letter-spacing: 0.5px;
    font-weight: 700;
    opacity: 0.85;
  }
  /* Progression name — italic serif section heading, slightly emphasized */
  #player-info .pi-prog {
    font-style: italic;
    font-weight: 700;
    font-size: 15px;
    color: var(--tag-tonic);
    letter-spacing: 0.3px;
  }
  /* AABA form bar — compact segmented strip */
  #player-info .pi-form {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  #player-info .pi-form-seg {
    min-width: 14px;
    height: 5px;
    border-radius: 2px;
    background: rgba(5,150,105,0.20);
    transition: background 0.2s, height 0.2s;
    position: relative;
  }
  #player-info .pi-form-seg.done { background: rgba(5,150,105,0.4); opacity: 0.75; }
  #player-info .pi-form-seg.now  {
    background: var(--tag-tonic);
    height: 8px;
    box-shadow: 0 0 6px rgba(5,150,105,0.6);
  }
  /* Letter (A / B) under the current segment — small but readable */
  #player-info .pi-form-seg.now::after {
    content: attr(data-label);
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8.5px;
    color: var(--tag-tonic);
    font-weight: 700;
    letter-spacing: 1px;
  }
  #player-info .pi-iter {
    font-size: 10px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.5px;
  }
  /* Voicing-type — fine mono caption, no pill, just colored text */
  #player-info .pi-voicing {
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    color: var(--tag-tonic);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    opacity: 0.85;
    white-space: nowrap;
  }
  /* Beat counter — 1 2 3 4 ticking with the BPM. The current beat lights up;
     the downbeat (1) gets a gold accent. Replaces the static bars-left. */
  #player-info .pi-beats {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-family: 'SF Mono', monospace;
  }
  #player-info .pi-beat {
    display: inline-block;
    width: 14px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: rgba(5,150,105,0.28);
    transition: color 0.06s, transform 0.08s, text-shadow 0.08s;
  }
  #player-info .pi-beat.on {
    color: var(--tag-tonic);
    transform: scale(1.22);
    text-shadow: 0 0 6px rgba(5,150,105,0.55);
  }
  #player-info .pi-beat.downbeat.on {
    color: #d4a843;
    text-shadow: 0 0 8px rgba(212,168,67,0.75);
  }
  /* Count-in: the 4 beats before the song actually starts. Tint everything
     gold so the user knows this is the "1, 2, 3, 4" before the band enters. */
  #player-info .pi-beats.count-in .pi-beat {
    color: rgba(212,168,67,0.30);
  }
  #player-info .pi-beats.count-in .pi-beat.on {
    color: #d4a843;
    text-shadow: 0 0 10px rgba(212,168,67,0.85);
    transform: scale(1.35);
  }
  /* Tiny "count-in" caption that fades in next to the beat dots */
  #player-info .pi-beats.count-in::before {
    content: 'count-in';
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 10px;
    color: #a07820;
    margin-right: 4px;
    opacity: 0.75;
  }
  /* Iteration count — mono, smaller */
  #player-info .pi-iter {
    font-family: 'SF Mono', monospace;
    font-size: 9.5px;
    color: var(--tag-tonic);
    letter-spacing: 0.6px;
    font-weight: 700;
    opacity: 0.8;
  }
  /* Refine the modulation / travel badges — finer, greener */
  #player-info .pi-badge {
    font-style: italic;
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 2px;
    border: 1px solid;
    animation: piBadgeIn 0.4s ease-out;
    letter-spacing: 0.3px;
  }
  #player-info .pi-badge.mod    { color: var(--accent); border-color: rgba(160,120,32,0.6); background: rgba(160,120,32,0.06); }
  #player-info .pi-badge.travel { color: var(--tag-tonic); border-color: rgba(5,150,105,0.55); background: rgba(5,150,105,0.06); }
  /* Modulation / travel pill — slightly more prominent, animates in */
  @keyframes piBadgeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 0.92; transform: translateY(0); }
  }
  #player-info .pi-badge {
    font-style: italic;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid;
    animation: piBadgeIn 0.4s ease-out;
  }
  #player-info .pi-badge.mod    { color: var(--accent);   border-color: var(--accent); background: rgba(160,120,32,0.08); }
  #player-info .pi-badge.travel { color: #5a8a5a;          border-color: #5a8a5a;       background: rgba(90,138,90,0.08); }
  @keyframes playingPulse {
    0%,100% { box-shadow: 0 0 0 2.5px var(--tag-tonic), 0 0 24px rgba(5,150,105,0.45); }
    50%     { box-shadow: 0 0 0 3.5px var(--tag-tonic), 0 0 36px rgba(5,150,105,0.7); }
  }
  .map-card.playing {
    border-color: var(--tag-tonic) !important;
    background: #e8f7ef !important;
    animation: playingPulse 0.55s ease-in-out infinite;
    z-index: 20 !important;
    opacity: 1 !important;
  }
  @keyframes nextUpBlink {
    0%,100% { background: #faedc4; }
    50%     { background: #f5d98a; }
  }

  /* Real Book + scale section — chord bar above, scale below, both right-aligned */
  .rb-area {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 18px;
    display: flex;
    justify-content: flex-end;
  }
  .rb-stack {
    display: flex;
    flex-direction: column;
    width: 50%;
    gap: 4px;
  }
  /* When composing (no AI playing), the strip uses the FULL width of the bar
     so each chord cell has more room and the staff/diagram is readable. */
  body:not(.player-active) .rb-area { justify-content: stretch; }
  body:not(.player-active) .rb-stack { width: 100%; gap: 0; }
  /* Merge chord-name row and tab row into one visual unit when composing */
  body:not(.player-active) .real-book { border-bottom: none; }
  body:not(.player-active) .real-book .rb-cell { border-bottom: none; }
  .rb-row {
    display: flex;
    align-items: stretch;
  }
  .map-side-panel {
    width: 720px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: flex-start;
  }
  /* Piano-mode tab cells: drop the heavy borders so staff lines flow across
     cells like one continuous staff — the SVG itself draws the compás bar
     line between cells. */
  body.instrument-piano .rb-tab-cell {
    border: none !important;
    padding: 0 !important;
    background: #fdfcf3 !important;
  }
  /* In piano mode the playback chord-NAME row vanishes — the embedded name
     in the staff SVG suffices. In COMPOSE mode (compose-interleaved) the
     chord-name cells stay visible so the user always sees what they just
     typed in big readable text. */
  body.instrument-piano .real-book:not(.compose-interleaved) {
    display: none !important;
  }
  /* Piano mode: hide the chord-name cells in compose-interleaved too —
     the chord name lives inside the staff SVG (Real-Book style) so a
     second big name on top would be redundant. */
  body.instrument-piano .real-book.compose-interleaved > .rb-cell {
    display: none !important;
  }
  /* With chord-name cells out of the way, give each tab cell more vertical
     room — the staff and the embedded chord-name label breathe properly. */
  body.instrument-piano .real-book.compose-interleaved > .rb-tab-cell {
    min-height: 130px !important;
  }
  /* PLAYBACK: row 1 (chord-name strip + cycle) hidden because the chord
     name is now embedded in the tab SVG itself — both piano AND guitar.
     NOT applied in compose mode — compose-interleaved on mobile renders
     the WHOLE strip inside row 1 (chord cells + tab cells interleaved),
     so hiding row 1 there killed the entire compose strip. */
  body.player-active .rb-row:first-child {
    display: none;
  }
  /* Wider buttons aligned with the two staves — cycle gets the treble half,
     loop gets the bass half (50/50). */
  /* Right-edge button column in piano mode. Wider, cleaner, with subtle
     gradient and proper inner divider — reads as a polished sidebar
     instead of two bare boxes. */
  /* Slim right-column — same thin profile as the guitar tabs buttons, so
     the staff gets the maximum horizontal space. */
  body.instrument-piano .right-btn-stack {
    display: flex;
    flex-direction: column;
    width: 30px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #faf6e8 0%, #f0e9d2 100%);
    border: 1.2px solid #1a1a1a;
    border-left: none;
    border-radius: 0 4px 4px 0;
    overflow: hidden;
  }
  body.instrument-piano .right-btn-stack .rb-cycle {
    flex: 1 1 50%;
    width: 100%;
    height: auto;
    font-size: 14px;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1.2px solid rgba(26,26,26,0.4);
    color: #1a1a1a;
    transition: background 0.15s;
  }
  body.instrument-piano .right-btn-stack .rb-cycle:hover {
    background: rgba(160,120,32,0.12);
  }
  body.instrument-piano .right-btn-stack .rb-loop {
    flex: 1 1 50%;
    width: 100%;
    height: auto;
    background: transparent;
    border: none;
    transition: background 0.15s;
  }
  body.instrument-piano .right-btn-stack .rb-loop:hover {
    background: rgba(160,120,32,0.12);
  }
  body.instrument-piano .right-btn-stack .rb-loop svg {
    width: 16px;
    height: 26px;
  }
  body.instrument-piano .real-book-tabs {
    border: 1.2px solid #1a1a1a;
    border-right: none;          /* connects to the right-btn-stack */
    border-radius: 4px 0 0 4px;
    background: #fdfcf3;
    height: 260px;               /* desktop: lots of room for the bigger chord name + lines */
  }
  /* Mobile playback: match the height compose-interleaved uses so the
     chord-name + staff render at the exact same size you see while
     composing (the right-button column sits beside, sized to match). */
  @media (max-width: 800px) {
    body.instrument-piano .real-book-tabs {
      height: 140px;
    }
  }
  /* Now-playing measure: keep cream/white background like printed paper, but
     the WHOLE staff (lines + clef + chord name + notes) gets a soft warm
     gold glow that gently pulses — your eye locks onto it instantly. Plus
     the small triangle above and a thicker gold underline at the bottom. */
  @keyframes currentMeasurePulse {
    0%, 100% { box-shadow: inset 0 -4px 0 #d4a843, 0 0 10px rgba(212,168,67,0.18); }
    50%      { box-shadow: inset 0 -5px 0 #f4c542, 0 0 18px rgba(244,197,66,0.42); }
  }
  body.instrument-piano .rb-tab-cell.current {
    background: #fdfcf3 !important;
    position: relative;
    animation: currentMeasurePulse 1.6s ease-in-out infinite;
  }
  /* Only the staff LINES go gold (the > svg > line targets just the outer
     SVG's direct line children = staff lines + bar line + middle-C hint).
     Notes, clef, accidentals, chord name stay black ink — the pentagrama
     itself glows, not the music. */
  body.instrument-piano .rb-tab-cell.current > svg > line {
    stroke: #d4a843 !important;
    stroke-width: 1.1 !important;
    filter: drop-shadow(0 0 2px rgba(212,168,67,0.65));
  }
  body.instrument-piano .rb-tab-cell.current::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 9px solid #d4a843;
    z-index: 5;
    filter: drop-shadow(0 1px 2px rgba(160,120,32,0.35));
  }
  /* Imminent (the chord about to enter): faint cream-gold tint */
  body.instrument-piano .rb-tab-cell.imminent {
    background: rgba(212,168,67,0.10) !important;
  }
  body.instrument-piano .real-book.compose-interleaved .rb-tab-cell {
    border-bottom: none !important;
  }
  body.instrument-piano .real-book.compose-interleaved {
    border: none !important;
    background: #fdfcf3;
  }
  /* Piano keyboard — shown when state.instrument === 'piano' */
  .piano-svg {
    display: none;
    width: 100%;
    height: 200px;
  }
  body.instrument-piano #chord-neck { display: none; }
  body.instrument-piano .piano-svg { display: block; }
  /* Piano keyboard keys — renamed kb- to avoid collision with header's key-picker .pk- classes */
  .kb-white { fill: #fdfcf3; stroke: #1a1a1a; stroke-width: 1.2; }
  .kb-black { fill: #1a1a1a; stroke: #000; }
  .kb-dot   { stroke: rgba(0,0,0,0.4); stroke-width: 1; }
  .kb-deg {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 800;
    text-anchor: middle;
    fill: #fff;
    pointer-events: none;
  }
  .kb-deg.dark { fill: #1a1a1a; }
  /* Open-string indicators on the chord neck: ring pulses outward
     to show the open string is vibrating, like a struck note. Two
     overlapping pulses (one offset by half the cycle) keep the
     animation continuous. */
  @keyframes chordOpenPulse {
    0%   { r: 22; opacity: 0.9; stroke-width: 3; }
    100% { r: 56; opacity: 0;   stroke-width: 1; }
  }
  .chord-open-pulse   { animation: chordOpenPulse 1.5s ease-out infinite; }
  .chord-open-pulse-2 { animation-delay: 0.75s; }
  .kb-octave-label {
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    fill: var(--text-faint);
    text-anchor: middle;
    pointer-events: none;
  }

  .scale-neck {
    width: 100%;
    height: 300px;
    background: #1a1410;
    border: 1.5px solid #1a1a1a;
    display: block;
    border-radius: 4px;
    box-shadow: 0 2px 18px rgba(0,0,0,0.25) inset;
  }
  .neck-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .neck-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #5a5a64;
    opacity: 0.65;
    letter-spacing: 0.5px;
    padding-left: 4px;
  }
  .real-book {
    display: flex;
    flex: 1;
    border: 1.5px solid #1a1a1a;
    background: #fdfcf3;
    height: 52px;
  }
  /* Second row beneath the chord-name row: matching cells, each with a mini tab */
  .real-book-tabs {
    display: flex;
    flex: 1;
    border: 1.5px solid #1a1a1a;
    border-top: none;
    background: #fdfcf3;
    height: 150px;     /* taller so the staff has room for proper line spacing */
  }
  .real-book-tabs[hidden] { display: none; }
  /* Tabs row extends across only the chord-cell width (matching real-book above).
     The +1 accounts for the loop button's space on the row above. */
  .rb-tab-cell {
    flex: 1 1 0;
    border-right: 1.5px solid #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    background: #fdfcf3;
    position: relative;          /* anchor for the subdivision triangle + segment bar */
  }
  .rb-tab-cell:last-child { border-right: none; }
  .rb-tab-cell.current,
  .rb-tab-cell.current:hover { background: #fcecaa !important; }
  /* Visual divider between compose section A (cells 0–7) and B (cells 8–15) */
  .rb-cell.section-divider, .rb-tab-cell.section-divider {
    border-left: 3px double #a07820;
  }

  /* ─── Compose keypad ─── */
  .compose-pad {
    display: none; /* desktop: hidden until toggled */
    flex-wrap: wrap;
    gap: 6px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 6px 18px;
    justify-content: center;
    align-items: center;
  }
  body.keypad-open .compose-pad { display: flex; }
  @media (max-width: 800px) {
    body.keypad-open .compose-pad { display: grid; }
  }
  .keypad-toggle { font-size: 13px !important; }
  body.keypad-open .keypad-toggle { background: var(--accent); color: #fff; }
  /* Controls gap from chord buttons */
  .compose-pad .compose-inv:first-of-type { margin-left: 18px; }
  /* Mobile playback: the keypad steals screen real estate, so hide
     it during play. Desktop keeps the keypad visible so the user
     can still type chords / cycle inversions while the AI plays. */
  @media (max-width: 800px) {
    body.player-active .compose-pad { display: none; }
  }
  .compose-btn {
    min-width: 42px;
    height: 34px;
    padding: 0 10px;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    transition: background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .compose-btn:hover { background: #f5ecd0; }
  .compose-btn:active, .compose-btn.flash { background: #fcecaa; }
  .compose-btn .deg {
    display: block;
    font-size: 9px;
    color: var(--text-faint);
    font-style: normal;
    line-height: 1;
    margin-top: 1px;
  }
  /* Keypad ▶ play — mobile only (desktop has the unified top transport).
     Green to read like the m-transport play button. */
  .compose-btn.compose-play {
    background: #059669;
    border-color: #1a1a1a;
    color: #fdfcf3;
  }
  .compose-btn.compose-play:hover { background: #047857; }
  .compose-btn.compose-play:active { background: #1a1a1a; color: #fdfcf3; }
  @media (min-width: 801px) {
    .compose-btn.compose-play { display: none !important; }
  }
  .compose-btn.compose-del,
  .compose-btn.compose-clear {
    font-family: 'SF Mono', monospace;
    font-style: normal;
  }
  .compose-btn.compose-inv {
    font-family: 'SF Mono', monospace;
    font-style: normal;
    font-size: 13px;
  }
  /* Desktop: gap between chord buttons (1-7) and controls (▼▲⌫▶×) */
  /* ─── Mobile: phone-dialer pinned to the bottom of the viewport ─── */
  @media (max-width: 800px) {
    .keypad-toggle { display: none !important; }
    .compose-pad {
      position: fixed;
      left: 0; right: 0;
      /* Sit above the always-visible map toggle bar (about 44px tall + safe area) */
      bottom: calc(44px + env(safe-area-inset-bottom));
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 14px 14px;
      background: var(--panel-2);
      border-top: 1.5px solid #1a1a1a;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      align-items: stretch;
    }
    .compose-pad .compose-btn {
      width: 100%;
      height: 54px;
      font-size: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.12);
      margin: 0;     /* override desktop's left spacer */
    }
    .compose-pad .compose-btn .deg {
      font-size: 10px;
      margin-top: 2px;
    }
    .compose-pad .compose-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }
    /* Phone-dialer layout placement on the 3-col grid:
         row 1: 1 2 3
         row 2: 4 5 6
         row 3: 7 ▼ ▲
         row 4: ⌫ ▶ × */
    .compose-pad .compose-btn[data-act="inv-down"] { grid-row: 3; grid-column: 1; margin-left: 0; }
    .compose-pad .compose-btn[data-n="7"]          { grid-row: 3; grid-column: 2; }
    .compose-pad .compose-btn[data-act="inv-up"]   { grid-row: 3; grid-column: 3; }
    .compose-pad .compose-btn[data-act="del"]      { grid-row: 4; grid-column: 1; }
    .compose-pad .compose-btn[data-act="play"]     { grid-row: 4; grid-column: 2; }
    .compose-pad .compose-btn[data-act="clear"]    { grid-row: 4; grid-column: 3; }

    /* Padding so the bottom-pinned keypad doesn't cover the content above */
    body:not(.player-active) main,
    body:not(.player-active) .rb-area {
      /* 4 rows × 54px + 3 gaps × 10px + 28px padding ≈ 280px */
      padding-bottom: 290px;
    }
    /* Mobile compose: unlock page scroll. Body grows with content (height
       auto), html grows with body. The DOCUMENT scrolls naturally — most
       reliable on iOS Safari + Chrome Android. Keypad is position: fixed
       so it stays pinned no matter where the page is scrolled. */
    html, body:not(.player-active) {
      height: auto !important;
      min-height: 100vh;
      overflow: visible !important;
    }
    body:not(.player-active) {
      display: block;  /* drop flex so block layout grows naturally */
    }
    /* Hide the chord neck while composing — the dialer dominates the screen */
    body:not(.player-active) .map-side-panel { display: none; }

    /* ─── Compose strip: rows of 4 cells instead of one stretched row ─── */
    /* Hide loop/cycle buttons in compose mode (loop auto-enables on play) */
    body:not(.player-active) .rb-loop,
    body:not(.player-active) .rb-cycle { display: none; }
    /* Both strips become 4-col grids that wrap into multiple rows naturally */
    /* Tabs container empty on mobile compose — main strip holds chord+tab pair-rows */
    body:not(.player-active) .real-book.compose-interleaved {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      /* Rows take their natural content size (NOT redistributed when more
         rows appear). So adding a 5th chord just makes the grid taller and
         the container scrolls — existing rows keep their full size. */
      grid-auto-rows: min-content;
      height: auto;
      /* Let the strip grow tall enough for 2 full pair-rows. The page
         itself scrolls naturally to access overflow (auto-scroll inside
         the strip stays scoped via el.scrollTo so it doesn't trap the
         page scroll position). */
      max-height: 580px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-cell {
      min-height: 38px;
      padding: 2px 0 0;
      gap: 0;
      justify-content: flex-end;   /* hug the tab below — no wasted whitespace at top */
      margin-bottom: -2px;         /* pull the chord-name even closer to the tab */
    }
    /* Viewport-relative sizes (vw) instead of container-query (cqw) so the
       font doesn't recalculate when the cell width shifts (which happened
       when the scrollbar appeared on the 5th chord). */
    body:not(.player-active) .real-book.compose-interleaved .rb-cell .rb-roman {
      font-size: clamp(13px, 3.6vw, 20px);
      line-height: 1;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-cell .rb-chord {
      font-size: clamp(15px, 5.4vw, 24px);
      line-height: 1;
      letter-spacing: -0.7px;
      white-space: nowrap;
    }
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
      min-height: 110px;     /* compact enough that 2 rows fit on iPhone too */
      padding: 0 1px 1px;    /* zero top padding — chord diagram hugs the chord-name above */
    }
    /* Drop right border on every 4th cell (right edge of each row) */
    body:not(.player-active) .real-book.compose-interleaved .rb-cell:nth-child(4n),
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell:nth-child(4n) {
      border-right: none;
    }
    /* Horizontal divider ONLY at the bottom of each tab row (between pairs),
       not between a chord-name cell and its paired tab cell — so each pair
       reads as one unified rectangle (matches desktop). */
    body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
      border-bottom: 1px solid rgba(26,26,26,0.4);
      margin-bottom: 14px;  /* room for the subdivision badge that hangs below */
    }
  }
  .rb-tab-cell.imminent {
    animation: cellImminent 1s ease-in-out infinite;
  }
  /* SVG fills the full cell width — the chord diagram letterboxes to its own
     aspect so the dots stay round, but the visible footprint matches the
     chord-name cell above for clean column alignment. */
  .rb-tab-cell svg { width: 100%; height: 100%; display: block; }
  .real-book[hidden] { display: none; }
  .rb-loop {
    height: 150px;    /* matches the tabs row height — sits on the bottom row */
    width: 24px;      /* same thin width as the cycle button so they align visually */
    padding: 0;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-left: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .rb-loop:hover { background: #f5ecd0; }
  .rb-loop svg { display: block; }
  .rb-loop .repeat-thick { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop .repeat-thin  { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop .repeat-dot   { fill: #1a1a1a; transition: fill 0.2s, filter 0.2s; }
  .rb-loop.active {
    background: #fffbe8;
  }
  .rb-loop.active .repeat-thick,
  .rb-loop.active .repeat-thin,
  .rb-loop.active .repeat-dot {
    fill: #d4a017;
    filter: drop-shadow(0 0 3px #f4c542) drop-shadow(0 0 6px #f4c542);
  }
  @keyframes repeat-pulse {
    0%, 100% { filter: drop-shadow(0 0 3px #f4c542) drop-shadow(0 0 6px #f4c542); }
    50%      { filter: drop-shadow(0 0 5px #ffd54a) drop-shadow(0 0 10px #ffd54a); }
  }
  .rb-loop.active .repeat-thick,
  .rb-loop.active .repeat-thin,
  .rb-loop.active .repeat-dot {
    animation: repeat-pulse 1.8s ease-in-out infinite;
  }
  /* Song loop: clearly distinct from section loop — warmer/redder
     tint, thickened companion bar, plus a tiny "S" badge in the
     corner so the difference reads at a glance, not just on hover. */
  .rb-loop.loop-song {
    background: #ffe9d4 !important;
  }
  .rb-loop.loop-song .repeat-thick,
  .rb-loop.loop-song .repeat-thin,
  .rb-loop.loop-song .repeat-dot {
    fill: #c14a17 !important;
    filter: drop-shadow(0 0 3px #f08040) drop-shadow(0 0 6px #f08040) !important;
  }
  .rb-loop.loop-song .repeat-thin {
    width: 3px !important;
  }
  .rb-loop { position: relative; }
  .rb-loop.loop-song::after {
    content: 'S';
    position: absolute;
    top: 3px;
    right: 4px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    font-weight: 800;
    color: #c14a17;
    letter-spacing: 0;
    pointer-events: none;
  }
  /* Section loop badge shows the ACTUAL section letter (A, B, …)
     currently playing — pulled from data-section, which JS updates
     on every section change. Falls back to 'A' if unset. */
  .rb-loop.active:not(.loop-song)::after {
    content: attr(data-section);
    position: absolute;
    top: 3px;
    right: 4px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    font-weight: 800;
    color: #d4a017;
    letter-spacing: 0;
    pointer-events: none;
  }
  /* Mobile transport loop button mirrors the same A/S badge so the
     section letter stays visible after the toolbar move. */
  .m-tx-btn#m-tx-loop.loop-song::after,
  .m-tx-btn#m-tx-loop.active:not(.loop-song)::after {
    position: absolute;
    top: 1px;
    right: 3px;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0;
    pointer-events: none;
  }
  .m-tx-btn#m-tx-loop.loop-song::after { content: 'S'; color: #1a1a1a; }
  .m-tx-btn#m-tx-loop.active:not(.loop-song)::after {
    content: attr(data-section); color: #1a1a1a;
  }
  /* Key-cycle button — tiny, sits next to the loop button. Only meaningful while looping. */
  .rb-cycle {
    height: 52px;
    width: 24px;
    padding: 0;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-left: none;
    cursor: pointer;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #5a5a64;
    transition: background 0.2s, color 0.2s;
  }
  .rb-cycle:hover { background: #f5ecd0; color: #1a1a1a; }
  .rb-cycle.active {
    background: #fcecaa;
    color: #6b4a0e;
  }
  /* When strip is hidden, the loop button needs its own left border */
  /* When the row's main element is hidden, the trailing button needs its own left border */
  .real-book[hidden] + .rb-cycle,
  .real-book-tabs[hidden] + .rb-loop { border-left: 1.5px solid #1a1a1a; }
  .rb-cell {
    flex: 1 1 0;
    padding: 6px 4px;
    border-right: 1.5px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    gap: 1px;
    position: relative;
    /* No background transition — .rb-tab-cell has none either, so the pair
       must pop in/out instantly and synchronously when hover-paired. */
  }
  .rb-cell:last-child { border-right: none; }
  /* Cells of the composed strip are clickable (audition + focus). */
  body:not(.player-active) [data-compose-idx] { cursor: pointer; }
  body:not(.player-active) [data-compose-empty] { cursor: pointer; }
  body:not(.player-active) [data-compose-empty]:hover { background: rgba(160,120,32,0.07); }
  /* Drag-and-drop reorder feedback (desktop). Source dims; valid drop
     targets get a thin highlighted border so the user sees where the
     swap will land. */
  body:not(.player-active) [draggable="true"] { cursor: grab; }
  body:not(.player-active) [draggable="true"]:active { cursor: grabbing; }
  .rb-cell.dragging, .rb-tab-cell.dragging { opacity: 0.4; }
  .rb-cell.drop-target, .rb-tab-cell.drop-target {
    background: rgba(34, 197, 94, 0.18);
    outline: 2px dashed #047857;
    outline-offset: -3px;
  }
  /* Only the JS-driven .compose-hover class paints the background — no bare
     :hover. Using :hover too caused a flicker because CSS painted the
     directly-hovered cell instantly while the paired cell waited for the
     JS event to add .compose-hover (a microsecond later but visible).
     Solid color (no alpha) so the two stacked cells don't compose alpha
     and create a darker line at the seam. */
  body:not(.player-active) [data-compose-idx].compose-hover { background: #f5ecd0 !important; }
  /* And drop the borders between the two rows during hover so the gold
     reads as one continuous rectangle — no thin dividing line. */
  body:not(.player-active) .rb-cell.compose-hover     { border-bottom: none !important; }
  body:not(.player-active) .rb-tab-cell.compose-hover { border-top: none !important; }
  body:not(.player-active) [data-compose-idx].current,
  body:not(.player-active) [data-compose-idx].current:hover { background: #fcecaa !important; }
  /* Selected compose cell — warm orange so the user knows the next chord /
     inversion change will EDIT this cell instead of appending a new one. */
  [data-compose-idx].compose-selected {
    background: rgba(232,144,52,0.22) !important;
    box-shadow: inset 0 0 0 2px #e89034;
  }
  [data-compose-idx].compose-selected:hover {
    background: rgba(232,144,52,0.30) !important;
  }
  .compose-edit-btn {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.06); color: var(--text-faint);
    font-size: 11px; line-height: 20px; text-align: center;
    cursor: pointer; opacity: 0; transition: opacity 0.15s;
  }
  [data-compose-idx]:hover .compose-edit-btn,
  .compose-edit-btn.active { opacity: 1; }
  .compose-edit-btn.active {
    background: var(--accent); color: #fff;
  }
  /* ─── Rhythm subdivisions: number badge picker + segment bar per cell ─── */
  /* Small pill-shaped badge with the count inside, hanging at the bottom
     edge of the cell. Always visible — default count = 1. */
  .subdiv-triangle {
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 22px;
    height: 16px;
    padding: 0 7px;
    border: 1.4px solid var(--accent);
    border-radius: 9px;
    background: #fdfcf3;
    cursor: ns-resize;          /* hint: drag vertically to change count, click to pick */
    touch-action: none;         /* prevent page scroll while dragging on mobile */
    line-height: 13px;
    color: var(--accent);
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    opacity: 0.9;
    transition: opacity 0.15s, transform 0.1s, background 0.1s;
    z-index: 6;
  }
  .subdiv-triangle:hover,
  .subdiv-triangle.has-divs { opacity: 1; }
  .subdiv-triangle:hover { background: var(--accent); color: #fff; }
  .subdiv-triangle.has-divs { background: var(--accent); color: #fff; }
  .subdiv-bar {
    position: absolute;
    bottom: 6px;                 /* lower so it doesn't crowd the tab/staff content */
    left: 6px;
    right: 6px;
    height: 9px;                 /* thicker so segments are easier to tap */
    display: flex;
    gap: 2px;
    z-index: 4;
  }
  /* Compose-mode tab cells reserve room at the bottom so the chord diagram
     / staff doesn't extend into the subdivision bar's area. The bar itself
     is also chunkier in compose (easier hit target than playback). Bar
     sits low (close to the diagram) so the cell stays compact. */
  body:not(.player-active) .real-book-tabs .rb-tab-cell,
  body:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
    padding-bottom: 28px;
  }
  /* Piano mode (no segment bar) — only reserve room for the count badge */
  body.instrument-piano:not(.player-active) .real-book-tabs .rb-tab-cell,
  body.instrument-piano:not(.player-active) .real-book.compose-interleaved .rb-tab-cell {
    padding-bottom: 14px;
  }
  /* Play mode (desktop + vertical mobile): reserve room at the bottom
     of each tab cell so the playback subdivision bar gets its own
     strip and stops overlapping the chord diagram. Landscape mobile
     handles its own padding inside #landscape-play. */
  body.player-active:not(.lp-on) .real-book-tabs .rb-tab-cell {
    padding-bottom: 14px;
  }

  /* ─── Mobile transport bar — brutalist (matches landscape) ───
     Same vibe as the landscape overlay: hard black borders, square
     corners, no shadows / no gradients. State colours stay strong
     (green play, red stop, yellow/orange loop) but the chrome is
     flat. Buttons sit on the page background — no panel block. */
  .m-transport {
    display: none;
    gap: 0;
    padding: 8px 12px;
    background: transparent;
    border: 0;
    width: 100%;
    box-sizing: border-box;
  }
  /* Brutalist weighted single row — play dominates ancho (30%),
     stop & edit secundarios (20% each), modifiers más angostos
     (15% each). Flex-grow weights so when stop / edit are hidden,
     the remaining buttons absorb their space proportionally. */
  .m-transport .m-tx-btn {
    min-width: 0;
    height: 56px;
    padding: 0;
    background: #fdfcf3;
    border: 2px solid #1a1a1a;
    border-radius: 0;
    font-size: 22px;
    font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
    font-weight: 800;
    color: #1a1a1a;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.1s, color 0.1s;
    /* Force text presentation of play / stop / pencil symbols on
       phones that default to color-emoji rendering (Android Noto
       Emoji especially). The variation-selector also forces text
       on a per-character basis, this is the CSS-level safety net. */
    font-variant-emoji: text;
  }
  .m-transport #m-tx-cycle { flex: 15 1 0; }
  .m-transport #m-tx-loop  { flex: 15 1 0; }
  .m-transport #m-tx-play  { flex: 30 1 0; }
  .m-transport #m-tx-stop  { flex: 20 1 0; }
  .m-transport #m-tx-edit  { flex: 20 1 0; }
  /* SVG icons — guaranteed consistent rendering across all phones
     (no emoji-font surprises). currentColor lets the icon flip to
     white when the button hits its active dark background. */
  .m-transport .m-tx-ico {
    width: 22px;
    height: 22px;
    display: block;
    pointer-events: none;
  }
  .m-transport .m-tx-play .m-tx-ico { width: 24px; height: 24px; }
  /* Play / pause icon swap — pause is hidden by default, shown when
     the play button is in its .active (playing) state. */
  .m-transport .m-tx-play .m-tx-ico-pause { display: none; }
  .m-transport .m-tx-play.active .m-tx-ico-play  { display: none; }
  .m-transport .m-tx-play.active .m-tx-ico-pause { display: block; }
  /* Hard divider between adjacent buttons — the row reads as a
     single brutalist strip, not separate pills. */
  .m-transport .m-tx-btn + .m-tx-btn { border-left: 0; }
  .m-transport .m-tx-btn:active { background: #1a1a1a; color: #fdfcf3; }
  /* Generic "on" state for buttons without a dedicated colour */
  .m-transport .m-tx-btn.active { background: #1a1a1a; color: #fdfcf3; }
  /* Play / pause — green idle/paused; bright lime when playing (still
     reads as "play" not "stop", with the pause-icon swap clarifying
     the state). Color-coded like a Logic transport indicator light. */
  .m-transport .m-tx-play {
    background: #059669;
    color: #fdfcf3;
    border-color: #1a1a1a;
  }
  .m-transport .m-tx-play.active {
    background: #22c55e;          /* clean bright green when playing */
    color: #1a1a1a;
    border-color: #1a1a1a;
  }
  /* Stop — flat red */
  .m-transport .m-tx-stop {
    background: #dc2626;
    color: #fdfcf3;
  }
  .m-transport .m-tx-stop.armed {
    animation: mTxStopPulse 0.7s ease-in-out infinite;
  }
  @keyframes mTxStopPulse {
    0%, 100% { background: #dc2626; color: #fdfcf3; }
    50%      { background: #fdfcf3; color: #dc2626; }
  }
  /* Loop — yellow for section, orange for song. Inactive stays cream. */
  .m-transport #m-tx-loop.active {
    background: #fbbf24;
    color: #1a1a1a;
  }
  .m-transport #m-tx-loop.loop-song {
    background: #f97316;
    color: #1a1a1a;
  }
  /* PITCHED cycle — indigo when on */
  .m-transport #m-tx-cycle.active {
    background: #4f46e5;
    color: #fdfcf3;
  }
  /* Edit — neutral cream like the off state */
  .m-transport #m-tx-edit {
    font-size: 15px;
  }
  .m-transport .m-tx-btn[hidden] { display: none !important; }

  /* ─── Desktop unified transport bar ───────────────────────────
     Lives in the top toolbar where ▶ AI / ⏹ / ↩ Edit used to sit.
     Same brutalist DNA as .m-transport but scaled for the desktop
     header strip: shorter height, tighter padding. Hidden on mobile
     (m-transport takes over there).
  ─────────────────────────────────────────────────────────────── */
  .d-transport {
    display: inline-flex;
    gap: 0;
    align-items: stretch;
    height: 34px;
  }
  .d-transport .d-tx-btn {
