// Subdivision popover lifecycle: open near the clicked triangle (above
// preferred, fallback below if no room). Click outside or Esc to close.
function openSubdivPopover(triEl, cellIdx) {
  const pop = document.getElementById('subdiv-popover');
  const cur = state.composedProgression[cellIdx]?.subdivisions || 1;
  pop.dataset.cellIdx = cellIdx;
  // Buttons in natural source order — CSS grid-area positions them in the
  // layout: [1] capped top, [2 4 6 / 3 5 7] in two columns, [8] capped bottom.
  const mkBtn = (n) => `<button data-subdiv-pick="${n}" class="${n === cur ? 'selected' : ''}">${n}</button>`;
  pop.innerHTML = [1,2,3,4,5,6,7,8].map(mkBtn).join('');
  pop.classList.add('open');
  // Position BELOW the badge, centered horizontally. Falls back to above
  // only if the popover would clip the viewport bottom.
  const r = triEl.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  let top  = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = r.top - h - 8;
  left = Math.max(6, Math.min(left, window.innerWidth - w - 6));
  pop.style.left = left + 'px';
  pop.style.top  = top  + 'px';
}
function closeSubdivPopover() {
  const pop = document.getElementById('subdiv-popover');
  if (pop) { pop.classList.remove('open'); pop.dataset.cellIdx = ''; }
}
document.addEventListener('click', (ev) => {
  // Close popover if click landed outside its body AND outside any triangle
  if (ev.target.closest('#subdiv-popover') || ev.target.closest('.subdiv-triangle')) return;
  closeSubdivPopover();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeSubdivPopover();
});

// ─── Drag-and-drop reorder for the compose strip (desktop only) ───
// User can drag a filled cell and drop it on another filled cell to
// SWAP positions (preserving song length). Dropping on a trailing
// empty cell moves the chord to the end of the sequence. Mobile is
// skipped — touch DnD with HTML5 is fragile, and the strip already
// has tap-to-jump / tap-to-replace touch UX.
(function() {
  let dragFromIdx = null;

  // Find the strip cell ancestor (chord or tab row, filled or empty).
  const cellOf = (target) => target && target.closest && target.closest('[data-compose-idx], [data-compose-empty]');

  // When the user touches an INTERIOR control (subdiv badge, segs, edit lock,
  // popover, etc.), suspend the cell's draggable attribute for the duration
  // of that gesture. Otherwise the browser's native HTML5 drag-detection on
  // the ancestor cell pre-empts pointer events, breaking the badge's
  // vertical drag-to-change-count gesture. Restore on the next pointerup.
  const INNER_CTRL_SEL = '.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg, #subdiv-popover';
  let suspendedCell = null;
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest) return;
    if (!e.target.closest(INNER_CTRL_SEL)) return;
    const cell = cellOf(e.target);
    if (cell && cell.getAttribute('draggable') === 'true') {
      cell.setAttribute('draggable', 'false');
      suspendedCell = cell;
    }
  }, true);
  const restoreSuspended = () => {
    if (suspendedCell) {
      suspendedCell.setAttribute('draggable', 'true');
      suspendedCell = null;
    }
  };
  document.addEventListener('pointerup', restoreSuspended, true);
  document.addEventListener('pointercancel', restoreSuspended, true);

  // Clear any lingering drop-target highlight across the whole strip.
  const clearDropTargets = () => {
    document.querySelectorAll('.rb-cell.drop-target, .rb-tab-cell.drop-target').forEach(c => c.classList.remove('drop-target'));
  };

  document.addEventListener('dragstart', (e) => {
    const cell = cellOf(e.target);
    if (!cell || cell.dataset.composeIdx == null) return;
    // Don't initiate drag from inner controls (edit btn, subdiv badge, etc).
    if (e.target.closest('.compose-edit-btn, .subdiv-triangle, .subdiv-bar, .subdiv-seg')) {
      e.preventDefault();
      return;
    }
    dragFromIdx = parseInt(cell.dataset.composeIdx, 10);
    try {
      e.dataTransfer.effectAllowed = 'move';
      // Some browsers need data set to actually start the drag.
      e.dataTransfer.setData('text/plain', String(dragFromIdx));
    } catch {}
    // Subtle visual: dim the source so the user sees what's being dragged.
    cell.classList.add('dragging');
    // Also dim the sibling row (tab cell mirroring same idx) so both
    // halves of the same step show the dragging state.
    document.querySelectorAll(`[data-compose-idx="${dragFromIdx}"]`).forEach(c => c.classList.add('dragging'));
  });

  document.addEventListener('dragover', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch {}
    // Update target highlight — only one cell at a time, sibling row too.
    const tIdx = cell.dataset.composeIdx != null ? cell.dataset.composeIdx : cell.dataset.composeEmpty;
    if (tIdx == null) return;
    // Don't highlight the source cell as a drop target.
    if (cell.dataset.composeIdx != null && parseInt(cell.dataset.composeIdx, 10) === dragFromIdx) {
      clearDropTargets();
      return;
    }
    // Clear stale targets then set the new pair.
    clearDropTargets();
    const sel = cell.dataset.composeIdx != null
      ? `[data-compose-idx="${tIdx}"]`
      : `[data-compose-empty="${tIdx}"]`;
    document.querySelectorAll(sel).forEach(c => c.classList.add('drop-target'));
  });

  document.addEventListener('drop', (e) => {
    if (dragFromIdx === null) return;
    const cell = cellOf(e.target);
    if (!cell) { dragFromIdx = null; clearDropTargets(); return; }
    e.preventDefault();
    const from = dragFromIdx;
    const seq = state.composedProgression;
    if (from < 0 || from >= seq.length) {
      dragFromIdx = null; clearDropTargets(); return;
    }
    // Deep clone the source so subdivisions / shape arrays don't share refs.
    const copy = JSON.parse(JSON.stringify(seq[from]));
    // Snapshot for undo before any mutation.
    const snapshot = () => {
      if (typeof _composeUndoStack !== 'undefined') {
        _composeUndoStack.push(JSON.parse(JSON.stringify(seq)));
      }
    };
    if (cell.dataset.composeIdx != null) {
      const to = parseInt(cell.dataset.composeIdx, 10);
      if (to !== from && to >= 0 && to < seq.length) {
        snapshot();
        seq[to] = copy;
        renderComposeStrip();
      }
    } else if (cell.dataset.composeEmpty != null) {
      // Drop on a trailing empty cell at index `to`. If `to` is past
      // the current end, fill the gap (seq.length .. to-1) with silent
      // rests, then place the duplicate at index `to`. This lets the
      // user drag e.g. from bar 2 to bar 4 and get a rest at bar 3.
      const to = parseInt(cell.dataset.composeEmpty, 10);
      if (to >= seq.length && to < 16) {
        snapshot();
        while (seq.length < to) seq.push({ _silent: true });
        seq.push(copy);
        renderComposeStrip();
      }
    }
    dragFromIdx = null;
    clearDropTargets();
  });

  document.addEventListener('dragend', () => {
    dragFromIdx = null;
    document.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging'));
    clearDropTargets();
  });
})();

// Vertical drag on the subdivision badge to change the count (like the BPM).
// Drag UP increments, DRAG DOWN decrements. ~14 px per step. Clamped 1–8.
// Uses POINTER events so mouse + touch + pen all work the same way, with
// setPointerCapture so the drag survives the cursor leaving the badge.
(function() {
  let dragIdx = null, dragStartY = null, dragStartN = null, dragMoved = false;
  let capturedEl = null, capturedPointerId = null;
  function clampN(n) { return Math.max(1, Math.min(8, n)); }
  function onMove(e) {
    if (dragIdx === null) return;
    // Block the browser from scrolling — touch-action:none on the badge
    // helps but once the pointer leaves it, only preventDefault stops scroll.
    if (e.cancelable) e.preventDefault();
    const y = e.clientY;
    const movedPx = Math.abs(y - dragStartY);
    // Wait until the pointer crosses an intentional-drag threshold
    // before mutating subdivisions. Otherwise tap jitter (1-2 px on
    // touchscreens) would compute distance=0 → newN=1 and wipe the
    // current value before the user has actually intended to drag.
    if (movedPx <= 8) return;
    dragMoved = true;
    // 1 is ALWAYS the center value, regardless of where dragging started.
    // Drag distance (in either direction) maps to the count: 0 → 1,
    // 14px → 2, …, 98px → 8. Drag back to the start point to return to 1.
    const distance = Math.round(movedPx / 14);
    const newN = clampN(1 + distance);
    const seq = state.composedProgression;
    const cell = seq[dragIdx];
    if (!cell || cell.subdivisions === newN) return;
    cell.subdivisions = newN;
    cell.subdivMute = (newN === 1)
      ? []
      : (cell.subdivMute && cell.subdivMute.length === newN
          ? cell.subdivMute
          : new Array(newN).fill(false));
    renderComposeStrip();
  }
  function onEnd(e) {
    if (capturedEl && capturedPointerId != null) {
      try { capturedEl.releasePointerCapture(capturedPointerId); } catch(_) {}
    }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onEnd);
    document.removeEventListener('pointercancel', onEnd);
    document.body.classList.remove('dragging-subdiv');
    capturedEl = null;
    capturedPointerId = null;
    // Reset on next tick so the click handler can still read dragMoved.
    setTimeout(() => { dragIdx = null; dragMoved = false; }, 0);
  }
  document.addEventListener('pointerdown', e => {
    if (player.playing) return;
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    if (!seq[idx]) return;
    dragIdx = idx;
    dragStartY = e.clientY;
    dragStartN = seq[idx].subdivisions || 1;
    dragMoved = false;
    // Capture so subsequent move/up events fire on the SAME element even if
    // the finger drifts off the badge — critical on mobile.
    try {
      tri.setPointerCapture(e.pointerId);
      capturedEl = tri;
      capturedPointerId = e.pointerId;
    } catch(_) {}
    document.body.classList.add('dragging-subdiv');
    document.addEventListener('pointermove', onMove, {passive: false});
    document.addEventListener('pointerup', onEnd);
    document.addEventListener('pointercancel', onEnd);
  });
  // Right-click on the badge resets the subdivision count back to 1.
  document.addEventListener('contextmenu', e => {
    const tri = e.target.closest('.subdiv-triangle');
    if (!tri) return;
    e.preventDefault();
    const idx = parseInt(tri.dataset.subdivTri, 10);
    if (!Number.isFinite(idx)) return;
    const seq = state.composedProgression;
    const cell = seq[idx];
    if (!cell) return;
    cell.subdivisions = 1;
    cell.subdivMute = [];
    renderComposeStrip();
  });
  window._subdivDragMoved = () => dragMoved;
})();

document.addEventListener('click', (ev) => {
  if (player.playing) return;

  // ── Rhythm subdivision triangle: open the 1–8 picker popover ──
  // (Only if the user TAPPED — if they dragged vertically to change the
  // count, the drag handler below sets _subdivDragMoved so we skip.)
  const triBtn = ev.target.closest('.subdiv-triangle');
  if (triBtn) {
    ev.stopPropagation();
    if (window._subdivDragMoved && window._subdivDragMoved()) return;
    const idx = parseInt(triBtn.dataset.subdivTri, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    // If the popover is already open for THIS cell, a second tap on
    // the same badge closes it (toggle behaviour). Otherwise open
    // (or re-open for a different cell).
    const pop = document.getElementById('subdiv-popover');
    if (pop && pop.classList.contains('open')
        && parseInt(pop.dataset.cellIdx, 10) === idx) {
      closeSubdivPopover();
    } else {
      openSubdivPopover(triBtn, idx);
    }
    return;
  }
  // ── Rhythm subdivision segment: toggle mute on click ──
  const seg = ev.target.closest('.subdiv-seg');
  if (seg) {
    ev.stopPropagation();
    const cellIdx = parseInt(seg.dataset.subdivCell, 10);
    const segIdx  = parseInt(seg.dataset.subdivSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    if (!cell.subdivMute) cell.subdivMute = new Array(cell.subdivisions || 1).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
  }
  // ── Staff slot (piano mode): same toggle, but clicking the noteheads
  //    on the partitura instead of the segment bar (which is hidden in
  //    piano mode). Finds the parent compose cell to know which index. ──
  const staffSlot = ev.target.closest('.staff-slot');
  if (staffSlot) {
    const parentCell = staffSlot.closest('[data-compose-idx]');
    if (!parentCell) return;
    const cellIdx = parseInt(parentCell.dataset.composeIdx, 10);
    const segIdx  = parseInt(staffSlot.dataset.staffSeg, 10);
    const seq = state.composedProgression;
    if (!seq[cellIdx]) return;
    const cell = seq[cellIdx];
    // Whole-note case (subdivisions === 1): clicking shouldn't mute
    // the only slot — that's what the regular delete key is for.
    // Instead, audition the chord (same behaviour as clicking the cell
    // in tab mode). We do it inline because this delegated handler
    // returns before reaching the cell-click block further down.
    const subN = cell.subdivisions || 1;
    if (subN <= 1) {
      ev.stopPropagation();
      if (!cell.chord) return;
      ensureAudio();
      state._composeFocusedIdx = cellIdx;
      state.focusedChord = cell.chord;
      state.userVoicing = cell.shape ? { shape: cell.shape } : null;
      renderAll();
      renderComposeStrip();
      ringFocusedChord();
      return;
    }
    ev.stopPropagation();
    if (!cell.subdivMute) cell.subdivMute = new Array(subN).fill(false);
    cell.subdivMute[segIdx] = !cell.subdivMute[segIdx];
    renderComposeStrip();
    return;
  }
  // ── Click in the subdivision popover: pick a count ──
  const pickBtn = ev.target.closest('#subdiv-popover button[data-subdiv-pick]');
  if (pickBtn) {
    ev.stopPropagation();
    const n = parseInt(pickBtn.dataset.subdivPick, 10);
    const cellIdx = parseInt(document.getElementById('subdiv-popover').dataset.cellIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(n) || !seq[cellIdx]) return;
    const cell = seq[cellIdx];
    cell.subdivisions = n;
    cell.subdivMute = (n === 1)
      ? []
      : (cell.subdivMute && cell.subdivMute.length === n
          ? cell.subdivMute
          : new Array(n).fill(false));
    closeSubdivPopover();
    renderComposeStrip();
    return;
  }

  // ── Lock button: toggle lock on that specific slot ──
  const lockBtn = ev.target.closest('.compose-edit-btn');
  if (lockBtn) {
    ev.stopPropagation();
    const idx = parseInt(lockBtn.dataset.editIdx, 10);
    const seq = state.composedProgression;
    if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
    if (state.composedSelectedIdx === idx) {
      // Already locked on this slot — unlock
      state.composedSelectedIdx = null;
    } else {
      // Lock this slot
      state.composedSelectedIdx = idx;
      const entry = seq[idx];
      state.focusedChord = entry.chord;
      state.userVoicing = entry.shape ? { shape: entry.shape } : null;
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Empty cell click: extend the previous chord with ties up to that slot ──
  const emptyCell = ev.target.closest('[data-compose-empty]');
  if (emptyCell) {
    const seq = state.composedProgression;
    if (!seq.length || seq.length >= 16) return;
    const targetIdx = parseInt(emptyCell.dataset.composeEmpty, 10);
    if (!Number.isFinite(targetIdx) || targetIdx < seq.length) return;
    _composeSaveUndo();
    const prev = seq[seq.length - 1];
    const tieEntry = {
      chord: prev.chord, _candIdx: prev._candIdx, shape: prev.shape,
      voicingType: prev.voicingType, stringSetIdx: prev.stringSetIdx,
      inversion: prev.inversion, stringSet: prev.stringSet, _tie: true,
    };
    // Fill all slots from current end up to and including the clicked slot
    while (seq.length <= targetIdx && seq.length < 16) {
      seq.push(JSON.parse(JSON.stringify(tieEntry)));
    }
    renderAll();
    renderComposeStrip();
    return;
  }

  // ── Cell click: focus/audition that chord (does NOT lock) ──
  const cell = ev.target.closest('[data-compose-idx]');
  if (!cell) {
    // Click outside any compose cell — clear lock
    if (state.composedSelectedIdx !== null) {
      const inControls = ev.target.closest('.compose-pad, .compose-btn, .compose-inv, .map-card');
      if (!inControls) {
        state.composedSelectedIdx = null;
        renderComposeStrip();
      }
    }
    return;
  }
  const idx = parseInt(cell.dataset.composeIdx, 10);
  const seq = state.composedProgression;
  if (!Number.isFinite(idx) || idx < 0 || idx >= seq.length) return;
  const entry = seq[idx];
  if (!entry || !entry.chord) return;
  ensureAudio();
  // Tap a cell = focus + audit + silently arm a ONE-SHOT replace
  // target. NO visual lock indicator — the next chord button just
  // replaces this slot in place, then clears the arm so subsequent
  // picks append at the end. Tap a different cell to re-aim. Use
  // a separate _oneShotReplaceIdx so the existing composedSelectedIdx
  // (which DOES drive the orange "locked" highlight via the explicit
  // 🔓 button) stays untouched.
  state._composeFocusedIdx = idx;
  state.focusedChord = entry.chord;
  state.userVoicing = entry.shape ? { shape: entry.shape } : null;
  state._oneShotReplaceIdx = (state._oneShotReplaceIdx === idx) ? null : idx;
  renderAll();
  renderComposeStrip();
  ringFocusedChord();
});

// Sync hover highlight between chord-name row and tab row so they read as
// ONE cell. Uses bubbling mouseover/mouseout (mouseenter doesn't bubble,
// so the previous version only fired once on area entry, not per cell).
(function wireComposeHoverSync() {
  const area = document.querySelector('.rb-area');
  if (!area) return;
  let lastIdx = null;
  const clear = () => {
    area.querySelectorAll('[data-compose-idx].compose-hover')
        .forEach(el => el.classList.remove('compose-hover'));
  };
  area.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('[data-compose-idx]');
    if (!cell) return;
    const idx = cell.dataset.composeIdx;
    if (idx === lastIdx) return;
    lastIdx = idx;
    clear();
    area.querySelectorAll(`[data-compose-idx="${idx}"]`)
        .forEach(el => el.classList.add('compose-hover'));
  });
  area.addEventListener('mouseout', (e) => {
    // Skip if the mouse is still moving INTO another paired cell — the
    // mouseover that follows will refresh the highlight correctly.
    const next = e.relatedTarget && e.relatedTarget.closest
      ? e.relatedTarget.closest('[data-compose-idx]')
      : null;
    if (next) return;
    lastIdx = null;
    clear();
  });
})();

// Tracks voicing cycling for keyboard shortcuts.
//   Number 1–7                → select chord, play the screen-recommended voicing
//   Right Shift + number 1–7  → cycle FORWARD through alternate voicings
//   Left  Shift + number 1–7  → cycle BACKWARD through alternate voicings
let _shortcutCycle = { chord: null, idx: 0, cands: [] };

// Track which shift is held — e.shiftKey alone can't distinguish sides.
let _shiftSide = null;   // 'left' | 'right' | null
document.addEventListener('keydown', e => {
  if (e.code === 'ShiftLeft')  _shiftSide = 'left';
  if (e.code === 'ShiftRight') _shiftSide = 'right';
});
document.addEventListener('keyup', e => {
  if (e.code === 'ShiftLeft'  && _shiftSide === 'left')  _shiftSide = null;
  if (e.code === 'ShiftRight' && _shiftSide === 'right') _shiftSide = null;
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  // Ctrl/Cmd+Z → undo compose action
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    composeUndo();
    return;
  }

  if (e.metaKey || e.ctrlKey || e.altKey) return;

  // Spacebar → universal play/pause toggle (always available)
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    const btn = document.getElementById('auto-play');
    if (player.playing) {
      // Hit the auto-play button so it tears down player+metronome the same way
      if (btn) btn.click();
    } else if (state.composedProgression.length) {
      composePlay();
    } else if (btn) {
      btn.click();
    }
    return;
  }

  // Playback-mode shortcuts (active when the player owns the strip).
  // Enter  → click the big ⏹ stop button (2-stage: rewind, then clear).
  // Escape → click ✏ edit (exits playback, focuses the current chord
  //          in compose mode); a second Escape afterwards still falls
  //          through to the compose-mode "deselect → clear" chain.
  if (player.playing || player.paused) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const stopBtn = document.getElementById('auto-stop');
      if (stopBtn) stopBtn.click();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      const editBtn = document.getElementById('auto-edit');
      if (editBtn) editBtn.click();
      return;
    }
  }

  // Compose-mode shortcuts (only when AI off)
  if (!player.playing) {
    if (e.key === 'Backspace') {
      if (state.composedProgression.length) {
        e.preventDefault(); composeDeleteLast(); return;
      }
      // Nothing left to delete — if the player is paused (idle but
      // visualization still on the bar), the natural fallback is
      // "wipe everything and reset", same as tapping ⏹ stop/reset.
      if (player.paused) {
        e.preventDefault();
        const stopBtn = document.getElementById('auto-stop');
        if (stopBtn) stopBtn.click();
        return;
      }
    }
    if (e.key === 'Enter' && state.composedProgression.length) {
      e.preventDefault(); composePlay(); return;
    }
    // L = toggle lock on current/last chord slot for in-place replacement
    if ((e.key === 'l' || e.key === 'L') && state.composedProgression.length) {
      e.preventDefault();
      const seq = state.composedProgression;
      // If nothing selected, lock the last chord; if already locked, unlock
      const target = state.composedSelectedIdx ?? (seq.length - 1);
      if (state.composedSelectedIdx === target) {
        state.composedSelectedIdx = null;
      } else {
        state.composedSelectedIdx = target;
        const entry = seq[target];
        state.focusedChord = entry.chord;
        state.userVoicing = entry.shape ? { shape: entry.shape } : null;
      }
      renderAll();
      renderComposeStrip();
      return;
    }
  }
  if (e.key === 'Escape' && state.composedProgression.length) {
    e.preventDefault();
    // First Escape: just deselect (leaves the strip intact). Second Escape
    // (with no selection): clear the whole composed progression.
    if (state.composedSelectedIdx !== null) {
      state.composedSelectedIdx = null;
      renderComposeStrip();
    } else {
      composeClear();
    }
    return;
  }

  // Shift+digit may produce a punctuation glyph ("@", "#", ...) instead of the
  // digit on US layouts — fall back to e.code "Digit1"–"Digit7" in that case.
  // Also accept the numeric keypad ("Numpad1"–"Numpad7") so desktop users
  // with a 10-key get the same shortcut.
  let n = parseInt(e.key);
  if (isNaN(n) && e.code) {
    if (e.code.startsWith('Digit'))  n = parseInt(e.code.slice(5));
    else if (e.code.startsWith('Numpad')) n = parseInt(e.code.slice(6));
  }
  if (n < 1 || n > 7) return;
  const chordId = DEGREE_SHORTCUTS[state.tonality]?.[n];
  if (!chordId || !currentMap().chordDefs[chordId]) return;
  e.preventDefault();

  // Compose mode (AI not playing): append OR cycle last inversion with Shift
  if (!player.playing) {
    composeAddChord(chordId, e.shiftKey, _shiftSide === 'left' ? -1 : 1);
    // Flash AFTER composeAddChord, which re-renders the pad via renderAll
    const padBtn = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
    if (padBtn) {
      padBtn.classList.add('flash');
      setTimeout(() => padBtn.classList.remove('flash'), 150);
    }
    return;
  }

  const ch = currentMap().chordDefs[chordId];
  const root = chordRoot(ch);
  const isCycleKey = e.shiftKey;
  // Default to forward if shift side somehow isn't tracked (e.g. window lost focus)
  const direction = _shiftSide === 'left' ? -1 : 1;

  if (isCycleKey && _shortcutCycle.chord === chordId && _shortcutCycle.cands.length) {
    // Shift+same-number → step voicing in the chosen direction
    const len = _shortcutCycle.cands.length;
    _shortcutCycle.idx = (_shortcutCycle.idx + direction + len) % len;
  } else {
    // Either plain digit OR shift+different-chord. Pull the master voicing
    // list (drop-2 → shells → triads → guides → sus, deduped) so the cycle
    // covers EVERY distinct voicing — not just drop-2 inversions.
    const displayed = computeAllVoicings()[chordId];
    const cands = allDistinctVoicings(ch.quality, root);
    let startIdx = 0;
    if (displayed?.shape) {
      const match = cands.findIndex(c => c.shape.every((f, i) => f === displayed.shape[i]));
      if (match >= 0) startIdx = match;
    }
    if (isCycleKey && cands.length > 1) {
      startIdx = (startIdx + direction + cands.length) % cands.length;
    }
    _shortcutCycle = { chord: chordId, idx: startIdx, cands };
  }

  const picked = _shortcutCycle.cands[_shortcutCycle.idx];
  state.focusedChord = chordId;
  state.userVoicing = picked
    ? { shape: picked.shape, type: picked.type, stringSetIdx: picked.stringSetIdx, inversion: picked.inversion }
    : null;

  if (player.playing) {
    player.jumpTo(chordId);
  } else {
    renderAll();
    ringFocusedChord();
  }

  // Flash keypad button (after any re-render)
  const padBtn2 = document.querySelector(`.compose-pad .compose-btn[data-n="${n}"]`);
  if (padBtn2) {
    padBtn2.classList.add('flash');
    setTimeout(() => padBtn2.classList.remove('flash'), 150);
  }
});

// Any non-keyboard focus change (clicking a card, AI moving) resets the cycle.
// We hook this by watching focusedChord transitions from other code paths.
const _origRenderAll = renderAll;
renderAll = function() {
  // If focused changed away from the cycle's chord by other means, drop the cycle
  if (_shortcutCycle.chord && state.focusedChord !== _shortcutCycle.chord) {
    _shortcutCycle = { chord: null, idx: 0, cands: [] };
  }
  return _origRenderAll.apply(this, arguments);
};

// ─── Startup randomizer ────────────────────────────────────────
// On each fresh page load, roll the default Chord Sound / Rhythm /
// Instrument view / BPM from the weighted distributions below.
// Voicing preference and Bass are intentionally left at their compile-
// time defaults ('all' / on) per the user's spec. No localStorage —
// every new session re-rolls.
(function rollStartupDefaults() {
  // Pick a key from a {value: weight} map. Weights are relative, no
  // need to sum to 100 — but we use percentages here for legibility.
  const pickWeighted = (map) => {
    const entries = Object.entries(map);
    const total = entries.reduce((a, [, w]) => a + w, 0);
    if (total <= 0) return entries[0][0];
    let r = Math.random() * total;
    for (const [k, w] of entries) {
      r -= w;
      if (r <= 0) return k;
    }
    return entries[entries.length - 1][0];
  };

  // 🎹 Chord Sound — instrument that plays the chords
  const soundPick = pickWeighted({
    rhodes:  5,
    piano:   60,
    jazzgtr: 15,
    pad:     10,
    organ:   10,
  });
  droneTimbre = soundPick;
  const sOpt = SOUND_OPTIONS.find(o => o.value === soundPick);
  if (sOpt && soundBtn) {
    const sv = soundBtn.querySelector('.sc-val');
    if (sv) sv.textContent = sOpt.label.toUpperCase();
    else    soundBtn.textContent = sOpt.label;
  }

  // 🥁 Rhythm — drum/click pattern
  const rhythmPick = pickWeighted({
    ride:    50,
    drums:   15,
    twofour: 25,
    click:   5,
    off:     5,
  });
  applyRhythmMode(rhythmPick);

  // 🎸 Instrument view — guitar fretboard vs piano keyboard
  const instPick = pickWeighted({ guitar: 65, piano: 35 });
  setInstrument(instPick);

  // ⏱ BPM — first pick a range, then a uniform integer inside it
  const bpmRange = pickWeighted({
    '90-110':  30,
    '110-130': 40,
    '130-150': 20,
    '150-170': 10,
  });
  const [lo, hi] = bpmRange.split('-').map(Number);
  const bpm = lo + Math.floor(Math.random() * (hi - lo + 1));
  setBpm(bpm);
})();

renderAll();
window.addEventListener('resize', () => {
  renderFretboard();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();
});

/* ─── MIDI Export ─── */

function _midiCollectComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    // Silent rests + ties — advance tick without emitting notes.
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = CHORD_MAP[state.tonality]?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    // Count consecutive ties after this cell
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    let notes;
    if (cell.shape && cell.shape.some(f => f >= 0)) {
      notes = cell.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
    } else {
      const rootPc = (state.keyPc + def.deg) % 12;
      const q = QUALITIES[def.quality];
      if (!q) { tick += barLen; continue; }
      notes = q.ints.map(i => 48 + rootPc + i);
    }
    const dur = barLen * bars;
    // Rhythm subdivisions: split the chord into N slot strikes within the
    // first bar (slot 0 = bar start). Muted slots emit nothing. The last
    // un-muted slot's note-off extends to the end of the full duration so
    // the chord rings through any tied bars instead of cutting on slot N-1.
    const subN = Math.max(1, cell.subdivisions || 1);
    const subMute = cell.subdivMute || [];
    const slotDur = Math.floor(barLen / subN);  // subdivisions live inside ONE bar
    let lastSlotStart = tick;
    for (let s = 0; s < subN; s++) {
      if (subMute[s]) continue;
      const slotStart = tick + s * slotDur;
      const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
      const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
      for (const n of notes) {
        events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
        events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
      }
      lastSlotStart = slotStart;
    }
    tick += dur;
  }
  return events;
}

function _midiCollectSong() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  if (!player.song || !player.song.length) return events;
  const homeKey = player._homeKey || { keyPc: state.keyPc, tonality: state.tonality };
  let prevShape = null;
  for (const section of player.song) {
    const secKey = section.keyPc ?? homeKey.keyPc;
    const secTon = section.tonality ?? homeKey.tonality;
    const vType  = section.voicingType || 'drop2';
    const prog   = section.progression;
    if (!prog || !prog.steps) continue;
    const repeats = section.repeats || 1;
    for (let r = 0; r < repeats; r++) {
      for (const step of prog.steps) {
        // Silent rest step — advance tick but emit no notes.
        if (step._silent) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        const def = CHORD_MAP[secTon]?.chordDefs?.[step.chord];
        if (!def) { tick += ticksPerBeat * 4 * (step.bars || 1); continue; }
        let notes;
        if (step.composedShape && step.composedShape.some(f => f >= 0)) {
          notes = step.composedShape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
          prevShape = step.composedShape;
        } else {
          const rootPc = (secKey + def.deg) % 12;
          const shape = player._pickShape(def.quality, rootPc, vType, prevShape);
          if (shape) {
            notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
            prevShape = shape;
          } else {
            const q = QUALITIES[def.quality];
            notes = q ? q.ints.map(i => 48 + rootPc + i) : null;
          }
        }
        const dur = ticksPerBeat * 4 * (step.bars || 1);
        if (notes && notes.length) {
          // Rhythm subdivisions: split into N slot strikes inside the bar.
          // Last un-muted slot extends to end of full duration so the chord
          // rings through tied bars instead of cutting on slot N-1.
          const barLen2 = ticksPerBeat * 4;
          const subN = Math.max(1, step.subdivisions || 1);
          const subMute = step.subdivMute || [];
          const slotDur = Math.floor(barLen2 / subN);
          for (let s = 0; s < subN; s++) {
            if (subMute[s]) continue;
            const slotStart = tick + s * slotDur;
            const isLast = (s === subN - 1) || subMute.slice(s + 1).every(Boolean);
            const slotEnd = isLast ? (tick + dur - 1) : (slotStart + slotDur - 1);
            for (const n of notes) {
              events.push({ tick: slotStart, type: 'on', note: n, vel: 90 });
              events.push({ tick: slotEnd, type: 'off', note: n, vel: 0 });
            }
          }
          tick += dur;
        }
      }
    }
  }
  return events;
}

function _buildMidiFile(events, label) {
  if (!events.length) return;
  const bpm = metronome.bpm || 120;
  const ticksPerBeat = 480;

  const buf = [];
  const w8  = (v) => buf.push(v & 0xff);
  const w16 = (v) => { w8(v >> 8); w8(v); };
  const w32 = (v) => { w16(v >> 16); w16(v); };
  const wStr = (s) => { for (let i = 0; i < s.length; i++) w8(s.charCodeAt(i)); };
  const wVLQ = (v) => {
    const bytes = [];
    bytes.push(v & 0x7f);
    v >>= 7;
    while (v > 0) { bytes.push((v & 0x7f) | 0x80); v >>= 7; }
    bytes.reverse().forEach(b => w8(b));
  };

  wStr('MThd'); w32(6); w16(0); w16(1); w16(ticksPerBeat);

  const trackBuf = [];
  const tw8  = (v) => trackBuf.push(v & 0xff);
  const twVLQ = (v) => {
    const bytes = [];
    bytes.push(v & 0x7f);
    v >>= 7;
    while (v > 0) { bytes.push((v & 0x7f) | 0x80); v >>= 7; }
    bytes.reverse().forEach(b => tw8(b));
  };

  const uspb = Math.round(60000000 / bpm);
  twVLQ(0); tw8(0xff); tw8(0x51); tw8(3);
  tw8((uspb >> 16) & 0xff); tw8((uspb >> 8) & 0xff); tw8(uspb & 0xff);

  const keyName = ROOTS[state.keyPc].name + ' ' + state.tonality + ' (' + label + ')';
  twVLQ(0); tw8(0xff); tw8(0x03); twVLQ(keyName.length);
  for (let i = 0; i < keyName.length; i++) tw8(keyName.charCodeAt(i));

  events.sort((a, b) => a.tick - b.tick || (a.type === 'off' ? -1 : 1));
  let lastTick = 0;
  for (const ev of events) {
    twVLQ(ev.tick - lastTick);
    lastTick = ev.tick;
    tw8(ev.type === 'on' ? 0x90 : 0x80);
    tw8(ev.note);
    tw8(ev.type === 'on' ? ev.vel : 0);
  }
  twVLQ(0); tw8(0xff); tw8(0x2f); tw8(0);

  wStr('MTrk'); w32(trackBuf.length);
  trackBuf.forEach(b => buf.push(b));

  const blob = new Blob([new Uint8Array(buf)], { type: 'audio/midi' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const keyStr = ROOTS[state.keyPc].name.replace('#', 's').replace('b', 'f');
  a.href = url;
  a.download = `guitarra-${keyStr}-${state.tonality}-${label}.mid`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Bass-only collectors: one root note per chord in bass register
function _midiCollectBassComposed() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  const barLen = ticksPerBeat * 4;
  for (let i = 0; i < state.composedProgression.length; i++) {
    const cell = state.composedProgression[i];
    if (cell._silent || cell._tie) { tick += barLen; continue; }
    const def = CHORD_MAP[state.tonality]?.chordDefs?.[cell.chord];
    if (!def) { tick += barLen; continue; }
    let bars = 1;
    for (let j = i + 1; j < state.composedProgression.length && state.composedProgression[j]._tie; j++) bars++;
    const rootPc = (state.keyPc + def.deg) % 12;
    const note = bassMidiForPc(rootPc);
    const dur = barLen * bars;
    events.push({ tick, type: 'on', note, vel: 100 });
    events.push({ tick: tick + dur - 1, type: 'off', note, vel: 0 });
    tick += dur;
  }
  return events;
}

function _midiCollectBassSong() {
  const ticksPerBeat = 480;
  const events = [];
  let tick = 0;
  if (!player.song || !player.song.length) return events;
  const homeKey = player._homeKey || { keyPc: state.keyPc, tonality: state.tonality };
  for (const section of player.song) {
    const secKey = section.keyPc ?? homeKey.keyPc;
    const secTon = section.tonality ?? homeKey.tonality;
    const prog = section.progression;
    if (!prog || !prog.steps) continue;
    const repeats = section.repeats || 1;
    for (let r = 0; r < repeats; r++) {
      for (const step of prog.steps) {
        const dur = ticksPerBeat * 4 * (step.bars || 1);
        if (step._silent) { tick += dur; continue; }
        const def = CHORD_MAP[secTon]?.chordDefs?.[step.chord];
        if (!def) { tick += dur; continue; }
        const rootPc = (secKey + def.deg) % 12;
        const note = bassMidiForPc(rootPc);
        events.push({ tick, type: 'on', note, vel: 100 });
        events.push({ tick: tick + dur - 1, type: 'off', note, vel: 0 });
        tick += dur;
      }
    }
  }
  return events;
}

// Show/hide MIDI wrap + manage menu
function _updateMidiBtn() {
  const wrap = document.getElementById('midi-wrap');
  if (!wrap) return;
  const hasComposed = state.composedProgression.length > 0;
  const hasSong = player.song && player.song.length > 0;
  wrap.style.display = (hasComposed || hasSong) ? '' : 'none';
}

const _midiMenu = document.getElementById('midi-menu');

function _closeMidiMenu() { _midiMenu.hidden = true; }

function _midiMenuBtn(label, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => { _closeMidiMenu(); fn(); };
  return b;
}

document.getElementById('midi-export').addEventListener('click', () => {
  const hasComposed = state.composedProgression.length > 0;
  const hasSong = player.song && player.song.length > 0;

  // Always show menu now (bass option means ≥2 choices)
  _midiMenu.innerHTML = '';
  if (hasComposed) {
    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — chords', () => _buildMidiFile(_midiCollectComposed(), 'composed')));
    _midiMenu.appendChild(_midiMenuBtn('◇ Composed — bass only', () => _buildMidiFile(_midiCollectBassComposed(), 'composed-bass')));
  }
  if (hasSong) {
    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — chords', () => _buildMidiFile(_midiCollectSong(), 'song')));
    _midiMenu.appendChild(_midiMenuBtn('♫ Full song — bass only', () => _buildMidiFile(_midiCollectBassSong(), 'song-bass')));
  }
  _midiMenu.hidden = false;
});

// Close menu on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.midi-wrap')) _closeMidiMenu();
});

const _origRenderComposeStrip = renderComposeStrip;
renderComposeStrip = function() {
  _origRenderComposeStrip.apply(this, arguments);
  _updateMidiBtn();
};

// Keypad toggle (desktop only — mobile always shows it)
document.getElementById('keypad-toggle').addEventListener('click', () => {
  document.body.classList.toggle('keypad-open');
});

// Register the shared service worker so this app installs / works offline
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('pwa/sw.js').catch(() => {});
}
