<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitarra</title>
<link rel="manifest" href="pwa/manifest-guitar.json">
<meta name="theme-color" content="#e6e3da">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #e6e3da;
    --panel: #f0ede4;
    --panel-2: #e8e5dc;
    --line: #d2cec0;
    --line-2: #b8b4a4;
    --text: #1f1d18;
    --text-dim: #5e5c52;
    --text-faint: #908d80;
    --accent: #a07820;

    --i-R:#dc2626;--i-b2:#ea580c;--i-2:#d97706;--i-b3:#7c3aed;--i-3:#1d4ed8;
    --i-4:#0891b2;--i-b5:#db2777;--i-5:#059669;--i-b6:#9333ea;--i-6:#ca8a04;
    --i-b7:#c2410c;--i-7:#b45309;--i-9:#db2777;--i-b9:#e11d48;--i-s9:#a21caf;
    --i-11:#0891b2;--i-s11:#0e7490;--i-13:#65a30d;--i-b13:#84cc16;--i-s5:#9333ea;

    --tag-tonic: #059669;
    --tag-predom: #a07820;
    --tag-dom: #dc2626;
    --tag-borrowed: #9333ea;
    --tag-picardy: #b45309;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px;
    color: var(--accent);
    font-weight: 500;
  }
  .ctx-block { display: flex; flex-direction: column; gap: 3px; }
  .ctx-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .ctx-row { display: flex; gap: 2px; }

  /* Mini piano keyboard for key picker */
  .key-piano {
    position: relative;
    display: flex;
    height: 40px;
    user-select: none;
  }
  .pk-white {
    width: 24px;
    height: 40px;
    background: #fbf9f1;
    border: 1px solid var(--line-2);
    border-right: none;
    border-radius: 0 0 3px 3px;
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 4px;
    cursor: pointer;
    line-height: 1;
  }
  .pk-white:last-child { border-right: 1px solid var(--line-2); }
  .pk-white:hover { background: #f0ebd6; }
  .pk-white.active {
    background: var(--accent);
    color: #fff;
  }
  .pk-black {
    position: absolute;
    width: 16px;
    height: 26px;
    background: #1f1d18;
    border: none;
    border-radius: 0 0 3px 3px;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 3px;
    cursor: pointer;
    z-index: 2;
    line-height: 1;
  }
  .pk-black:hover { background: #3a3833; }
  .pk-black.active {
    background: var(--accent);
    color: #1f1d18;
  }
  .chip {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    min-width: 28px;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--line-2); color: var(--text); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  .toggle { display: flex; background: var(--bg); border-radius: 6px; padding: 2px; }
  .toggle button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle button.active { background: var(--panel-2); color: var(--text); }

  .drone-btn {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .drone-btn:hover { border-color: var(--line-2); color: var(--text); }
  .drone-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .drone-btn .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.4;
  }
  .drone-btn.active .dot {
    opacity: 1;
    background: #fff;
    box-shadow: 0 0 6px #fff;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .drone-vol {
    width: 60px;
    cursor: pointer;
  }

  .met-play {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    min-width: 28px;
  }
  .met-play.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .bpm-input {
    width: 48px;
    padding: 4px 6px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'SF Mono', monospace;
    text-align: center;
  }
  .bpm-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .met-mode {
    display: flex;
    background: var(--bg);
    border-radius: 5px;
    padding: 2px;
  }
  .met-mode button {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .met-mode button.active { background: var(--panel-2); color: var(--text); }

  /* Sound popup menu */
  .sound-menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 6px 20px rgba(31,29,24,0.12);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 120px;
  }
  .sound-menu[hidden] { display: none; }
  .sound-menu-item {
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sound-menu-item:hover { background: var(--panel-2); }
  .sound-menu-item.selected {
    background: rgba(160,120,32,0.15);
    color: var(--accent);
  }
  .sound-menu-item .check {
    margin-left: auto;
    color: var(--accent);
    font-weight: 700;
    opacity: 0;
  }
  .sound-menu-item.selected .check { opacity: 1; }

  /* Playback */
  .auto-btn {
    background: var(--panel-2);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .auto-btn:hover { border-color: var(--line-2); color: var(--text); }
  .auto-btn.active {
    background: var(--tag-tonic);
    color: #fff;
    border-color: var(--tag-tonic);
  }
  #player-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'SF Mono', monospace;
    flex-wrap: wrap;
  }
  #player-info .section-badge {
    background: var(--accent);
    color: #fff;
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  #player-info .iteration {
    color: var(--text-faint);
    font-size: 10px;
  }
  #player-info .prog-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  #player-info .dots {
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  #player-info .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--line-2);
  }
  #player-info .dot.done { background: var(--text-faint); }
  #player-info .dot.now {
    background: var(--tag-tonic);
    box-shadow: 0 0 6px rgba(5,150,105,0.6);
  }
  #player-info .now-chord strong {
    color: var(--tag-tonic);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
  }
  #player-info .bars-left {
    color: var(--accent);
    font-weight: 700;
  }
  #player-info .next-chord strong {
    color: var(--accent);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px;
  }
  @keyframes playingPulse {
    0%,100% { box-shadow: 0 0 0 2.5px var(--tag-tonic), 0 0 24px rgba(5,150,105,0.45); }
    50%     { box-shadow: 0 0 0 3.5px var(--tag-tonic), 0 0 36px rgba(5,150,105,0.7); }
  }
  .map-card.playing {
    border-color: var(--tag-tonic) !important;
    background: #e8f7ef !important;
    animation: playingPulse 0.55s ease-in-out infinite;
    z-index: 10 !important;
    opacity: 1 !important;
  }
  @keyframes nextUpBlink {
    0%,100% { background: #faedc4; }
    50%     { background: #f5d98a; }
  }

  /* Real Book + scale section — chord bar above, scale below, both right-aligned */
  .rb-area {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 18px;
    display: flex;
    justify-content: flex-end;
  }
  .rb-stack {
    display: flex;
    flex-direction: column;
    width: 50%;
    gap: 4px;
  }
  .rb-row {
    display: flex;
    align-items: stretch;
  }
  .scale-area {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 18px 12px;
    display: flex;
    justify-content: flex-end;
  }
  .scale-strip {
    width: 50%;
    height: 100px;
    border: 1.5px solid #1a1a1a;
    background: #fdfcf3;
    display: flex;
    align-items: center;
    padding: 6px 18px;
    gap: 24px;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  .scale-strip-label {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
    flex: 0 0 auto;
    min-width: 140px;
  }
  .scale-strip-label .ss-name {
    font-size: 22px;
    color: #1a1a1a;
    font-style: italic;
    font-weight: 600;
  }
  .scale-strip-label .ss-fret {
    font-size: 13px;
    color: #5a5a64;
    font-style: italic;
    opacity: 0.75;
    margin-top: 2px;
  }
  .scale-strip-legend {
    font-size: 11px;
    color: #5a5a64;
    font-style: italic;
    opacity: 0.7;
    line-height: 1.5;
    margin-top: 4px;
  }
  .scale-strip-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .scale-strip svg {
    height: 86px;
    flex: 1 1 auto;
    max-width: none;
  }
  .real-book {
    display: flex;
    flex: 1;
    border: 1.5px solid #1a1a1a;
    background: #fdfcf3;
    height: 52px;
  }
  .real-book[hidden] { display: none; }
  .rb-loop {
    height: 52px;
    padding: 0 14px;
    background: #fdfcf3;
    border: 1.5px solid #1a1a1a;
    border-left: none;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 600;
    color: #5a5a64;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }
  .rb-loop:hover { background: #f5ecd0; }
  .rb-loop.active {
    background: #fcecaa;
    color: #6b4a0e;
  }
  /* When strip is hidden, the loop button needs its own left border */
  .real-book[hidden] + .rb-loop { border-left: 1.5px solid #1a1a1a; }
  .rb-cell {
    flex: 1 1 0;
    padding: 6px 4px;
    border-right: 1.5px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    gap: 1px;
    transition: background 0.18s;
    position: relative;
  }
  .rb-cell:last-child { border-right: none; }
  .rb-cell.current {
    background: #fcecaa;
  }
  .rb-roman {
    font-size: 11px;
    color: #5a5a64;
    font-style: italic;
    font-weight: 500;
    line-height: 1;
  }
  .rb-cell.current .rb-roman { color: #6b4a0e; }
  .rb-chord {
    font-size: 19px;
    color: #1a1a1a;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
  }
  .rb-continuation {
    font-size: 22px;
    color: #5a5a64;
    font-weight: 400;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: normal;
  }
  .rb-peek {
    flex: 0 0 auto;
    padding: 0 14px;
    display: flex;
    align-items: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: #908d80;
    opacity: 0.6;
    border-left: 1.5px dashed #908d80;
    background: #faf8ec;
    white-space: nowrap;
    transition: opacity 0.25s, color 0.25s, background 0.25s;
  }
  @keyframes peekImminent {
    0%, 100% { background: #faedc4; }
    50%      { background: #f5d98a; }
  }
  .rb-peek.imminent {
    opacity: 1;
    color: #6b4a0e;
    font-weight: 700;
    border-left-style: solid;
    border-left-color: #6b4a0e;
    animation: peekImminent 1s ease-in-out infinite;
  }
  .map-card.next-up {
    border-color: rgba(160,120,32,0.85) !important;
    background: #faedc4 !important;
    z-index: 8;
    animation: nextUpBlink var(--blink-duration, 1s) ease-in-out infinite;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    min-height: 0;
  }
  .bottom-bar {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
    min-height: 0;
  }
  .bottom-bar .alternatives {
    flex: 0 0 auto;
    width: 48%;
    border-top: none;
    border-right: 1px solid var(--line);
  }
  .bottom-bar .fb-wrap {
    flex: 1;
    border-top: none;
    min-width: 0;
  }

  /* ─── Chord Map ─── */
  .map-wrap {
    position: relative;
    overflow: auto;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
  }
  .chord-map {
    position: relative;
    width: 540px;
    height: 800px;
    flex-shrink: 0;
  }
  .map-arrows {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .map-card {
    position: absolute;
    width: 100px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 5px 6px;
    cursor: pointer;
    transition: opacity 0.18s, border-color 0.12s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    opacity: 0.95;
    z-index: 2;
  }
  .map-card:hover { border-color: var(--line-2); opacity: 1; z-index: 3; }
  .map-card.hub {
    width: 130px;
    background: var(--panel-2);
    border: 1.5px solid var(--accent);
    padding: 10px 8px 10px;
    box-shadow: 0 4px 18px rgba(31,29,24,0.08);
    z-index: 4;
  }
  .map-card.tag-tonic     { border-left: 3px solid var(--tag-tonic); }
  .map-card.tag-predom    { border-left: 3px solid var(--tag-predom); }
  .map-card.tag-dom       { border-left: 3px solid var(--tag-dom); }
  .map-card.tag-borrowed  { border-left: 3px solid var(--tag-borrowed); }
  .map-card.tag-secondary { border-left: 3px solid #b45309; }

  /* Satellite (non-diatonic): smaller and dimmer than diatonic chords */
  .map-card.satellite {
    width: 92px !important;
    padding: 4px 4px 5px;
    opacity: 0.82;
    background: var(--bg);
    border-style: dashed;
    z-index: 1;
  }
  .map-card.satellite .mc-top { gap: 4px; }
  .map-card.satellite .mc-roman { font-size: 13px; }
  .map-card.satellite .mc-name { font-size: 10.5px; }
  .map-card.satellite .mc-svg-wrap svg { width: 72px !important; }
  .map-card.satellite:hover { opacity: 1; }
  /* Diatonic: emphasize with subtle shadow + thicker border */
  .map-card.diatonic {
    box-shadow: 0 1px 4px rgba(31,29,24,0.07);
    border-width: 1.5px;
  }
  .map-card.focused {
    border-color: var(--accent);
    background: #fff8e6;
    box-shadow: 0 6px 22px rgba(31,29,24,0.10), 0 0 0 2px rgba(160,120,32,0.22);
    z-index: 5;
    opacity: 1;
  }
  .mc-top { display: flex; gap: 6px; align-items: baseline; line-height: 1; }
  .mc-roman {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
  }
  .map-card.hub .mc-roman { font-size: 28px; }
  .mc-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .map-card.hub .mc-name { font-size: 17px; }
  .mc-tag {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .mc-tag.tonic     { color: var(--tag-tonic); }
  .mc-tag.predom    { color: var(--tag-predom); }
  .mc-tag.dom       { color: var(--tag-dom); }
  .mc-tag.borrowed  { color: var(--tag-borrowed); }
  .mc-tag.picardy   { color: var(--tag-picardy); }
  .mc-tag.secondary { color: #b45309; }
  .mc-svg-wrap { width: 100%; display: flex; justify-content: center; }
  .mc-svg-wrap svg { width: 78px; height: auto; }
  .map-card.hub .mc-svg-wrap svg { width: 108px; }
  .mc-cost {
    font-size: 9px;
    color: var(--text-faint);
    font-family: 'SF Mono', monospace;
  }
  .mc-cost strong { color: var(--accent); }

  /* ─── Alternatives ─── */
  .alternatives {
    padding: 8px 20px 10px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
  }
  .alt-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .alt-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-faint);
    font-weight: 700;
  }
  .alt-title strong { color: var(--accent); }
  .alt-hint { font-size: 10px; color: var(--text-faint); }
  .alt-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .alt-card {
    flex: 0 0 auto;
    width: 100px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 5px 5px;
    cursor: pointer;
    transition: all 0.08s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .alt-card:hover { border-color: var(--line-2); }
  .alt-card.selected {
    border-color: var(--accent);
    background: #fff8e6;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .alt-card svg { width: 88px; height: 92px; }
  .alt-card .ac-label {
    font-size: 8px;

<script>
/* ════════════════════════════════════════════════════════════
   THEORY
   ════════════════════════════════════════════════════════════ */

const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

const ROOTS = [
  {pc:0,name:'C',prefer:'sharp'},{pc:1,name:'Db',prefer:'flat'},{pc:2,name:'D',prefer:'sharp'},
  {pc:3,name:'Eb',prefer:'flat'},{pc:4,name:'E',prefer:'sharp'},{pc:5,name:'F',prefer:'flat'},
  {pc:6,name:'F#',prefer:'sharp'},{pc:7,name:'G',prefer:'sharp'},{pc:8,name:'Ab',prefer:'flat'},
  {pc:9,name:'A',prefer:'sharp'},{pc:10,name:'Bb',prefer:'flat'},{pc:11,name:'B',prefer:'sharp'},
];

const STRING_OPEN_MIDI = [40, 45, 50, 55, 59, 64];
const STRING_LABELS = ['E','A','D','G','B','E'];
const N_FRETS = 22;

const STRING_SETS = [
  {idx:[0,1,2,3], label:'EADG', sub:'low'},
  {idx:[1,2,3,4], label:'ADGB', sub:'mid'},
  {idx:[2,3,4,5], label:'DGBE', sub:'top'},
];

const QUALITIES = {
  'maj7':  {ints:[0,4,7,11],  degs:['R','3','5','7'],     sfx:'maj7'},
  '7':     {ints:[0,4,7,10],  degs:['R','3','5','b7'],    sfx:'7'},
  'm7':    {ints:[0,3,7,10],  degs:['R','b3','5','b7'],   sfx:'m7'},
  'm7b5':  {ints:[0,3,6,10],  degs:['R','b3','b5','b7'],  sfx:'ø'},
  'dim7':  {ints:[0,3,6,9],   degs:['R','b3','b5','bb7'], sfx:'°7'},
  'mMaj7': {ints:[0,3,7,11],  degs:['R','b3','5','7'],    sfx:'mMaj7'},
  '6':     {ints:[0,4,7,9],   degs:['R','3','5','6'],     sfx:'6'},
  'm6':    {ints:[0,3,7,9],   degs:['R','b3','5','6'],    sfx:'m6'},
};

/* ─── CHORD MAP — tonic centered, approaches around ─── */

const CHORD_MAP = {
  major: {
    chordDefs: {
      // Diatonic
      'I':    {roman:'I',    deg:0,  quality:'maj7', tag:'tonic'},
      'ii':   {roman:'ii',   deg:2,  quality:'m7',   tag:'predom'},
      'iii':  {roman:'iii',  deg:4,  quality:'m7',   tag:'tonic'},
      'IV':   {roman:'IV',   deg:5,  quality:'maj7', tag:'predom'},
      'V':    {roman:'V',    deg:7,  quality:'7',    tag:'dom'},
      'vi':   {roman:'vi',   deg:9,  quality:'m7',   tag:'tonic'},
      // Secondary dominants
      'V_V':  {roman:'V/V',  deg:2,  quality:'7',    tag:'secondary'},
      'V_ii': {roman:'V/ii', deg:9,  quality:'7',    tag:'secondary'},
      // Borrowed / modal interchange
      'iv':   {roman:'iv',   deg:5,  quality:'m7',   tag:'borrowed'},
      'bVII': {roman:'bVII', deg:10, quality:'7',    tag:'borrowed'},
      // Tritone sub
      'bII7': {roman:'bII7', deg:1,  quality:'7',    tag:'borrowed'},
    },
    nodes: {
      // ── DIATONIC SPINE (big, prominent) ──
      'n_iii': {chord:'iii', x:380, y:20},
      'n_vi':  {chord:'vi',  x:380, y:170},
      'n_ii':  {chord:'ii',  x:380, y:320},
      'n_V':   {chord:'V',   x:380, y:470},
      'n_IV':  {chord:'IV',  x:50,  y:470},
      'n_I':   {chord:'I',   x:175, y:620, hub:true},
      // ── SATELLITES (smaller, attached to their diatonic parent) ──
      // Secondary dominants attached to the left of their target diatonic
      'n_V_ii': {chord:'V_ii', x:280, y:335},  // touching left of ii
      'n_V_V':  {chord:'V_V',  x:280, y:485},  // touching left of V
      // Borrowed iv attached to the right of IV (same row)
      'n_iv':   {chord:'iv',   x:165, y:485},
      // Backdoor bVII below IV in the left column
      'n_bVII': {chord:'bVII', x:50,  y:620},
      // Tritone sub directly below V
      'n_bII7': {chord:'bII7', x:380, y:625},
    },
    arrows: [
      // Diatonic cycle (short adjacent — straight line, default curve)
      {from:'n_iii',  to:'n_vi'},
      {from:'n_vi',   to:'n_ii'},
      {from:'n_ii',   to:'n_V'},
      // V → I (arch right of the V_V satellite)
      {from:'n_V',    to:'n_I',  curve:-1},
      // IV's three roles (need to arch around iv & V_V which sit between IV and V)
      {from:'n_IV',   to:'n_V',  curve:-1},   // arch up over iv/V_V row
      {from:'n_IV',   to:'n_I'},              // direct diagonal to hub
      {from:'n_IV',   to:'n_ii', curve:-1},   // arch up around middle
      // Deceptive V → vi (arch left of ii)
      {from:'n_V',    to:'n_vi', curve:-1},
      // Stepwise iii → IV (long diagonal, arch up-left)
      {from:'n_iii',  to:'n_IV'},
      // Secondaries → their targets (short, default)
      {from:'n_V_V',  to:'n_V'},
      {from:'n_V_ii', to:'n_ii'},
      // Borrowed iv
      {from:'n_iv',   to:'n_I'},
      {from:'n_iv',   to:'n_bVII'},
      {from:'n_bVII', to:'n_I'},
      // Tritone sub (arch below to avoid hub on the way)
      {from:'n_bII7', to:'n_I'},
    ],
  },
  minor: {
    chordDefs: {
      'i':    {roman:'i',    deg:0,  quality:'m7',    tag:'tonic'},
      'iiø':  {roman:'iiø',  deg:2,  quality:'m7b5',  tag:'predom'},
      'bIII': {roman:'bIII', deg:3,  quality:'maj7',  tag:'tonic'},
      'iv':   {roman:'iv',   deg:5,  quality:'m7',    tag:'predom'},
      'V7':   {roman:'V7',   deg:7,  quality:'7',     tag:'dom'},
      'bVI':  {roman:'bVI',  deg:8,  quality:'maj7',  tag:'tonic'},
      'bVII': {roman:'bVII', deg:10, quality:'7',     tag:'dom'},
    },
    nodes: {
      'n_bIII': {chord:'bIII', x:300, y:30},
      'n_bVI':  {chord:'bVI',  x:300, y:150},
      'n_iiø':  {chord:'iiø',  x:300, y:270},
      'n_V7':   {chord:'V7',   x:300, y:390},
      'n_iv':   {chord:'iv',   x:80,  y:390},
      'n_bVII': {chord:'bVII', x:80,  y:270},
      'n_i':    {chord:'i',    x:165, y:540, hub:true},
    },
    arrows: [
      {from:'n_bIII', to:'n_bVI'},
      {from:'n_bVI',  to:'n_iiø'},
      {from:'n_iiø',  to:'n_V7'},
      {from:'n_V7',   to:'n_i'},
      {from:'n_iv',   to:'n_V7'},
      {from:'n_iv',   to:'n_i'},
      {from:'n_iv',   to:'n_iiø'},
      {from:'n_V7',   to:'n_bVI'},
      {from:'n_bVII', to:'n_i'},
      {from:'n_bVI',  to:'n_bVII'},
    ],
  },
};

function intervalColor(label) {
  const map = {'R':'i-R','b2':'i-b2','2':'i-2','b3':'i-b3','3':'i-3','4':'i-4','b5':'i-b5',
    '5':'i-5','b6':'i-b6','#5':'i-s5','6':'i-6','b7':'i-b7','7':'i-7','bb7':'i-6',
    'b9':'i-b9','9':'i-9','#9':'i-s9','11':'i-11','#11':'i-s11','13':'i-13','b13':'i-b13'};
  return map[label] ? getComputedStyle(document.documentElement).getPropertyValue('--' + map[label]).trim() : '#888';
}

function noteAt(s, f) { return (STRING_OPEN_MIDI[s] + f) % 12; }
function nameOf(pc, useFlats) { return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc]; }
function useFlatsFor(pc) { return ROOTS[pc].prefer === 'flat'; }

/* ─── Drop-2 generator ─── */

function dropTwoVoicing(quality, rootPc, stringSetIdx, inversion) {
  const q = QUALITIES[quality];
  if (!q || q.ints.length !== 4) return null;
  let close = [...q.ints];
  for (let i = 0; i < inversion; i++) {
    close = [close[1], close[2], close[3], close[0] + 12];
  }
  const dropped = [close[0], close[1], close[2] - 12, close[3]].sort((a, b) => a - b);
  const set = STRING_SETS[stringSetIdx].idx;
  for (let oct = 24; oct <= 84; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = dropped.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function totalVoiceMovement(shapeA, shapeB) {
  let total = 0;
  for (let s = 0; s < 6; s++) {
    if (shapeA[s] >= 0 && shapeB[s] >= 0) total += Math.abs(shapeA[s] - shapeB[s]);
  }
  return total;
}

function avgFret(shape) {
  const fs = shape.filter(f => f >= 0);
  return fs.length ? fs.reduce((a,b)=>a+b,0) / fs.length : 0;
}

function smoothestVoicing(quality, rootPc, sourceShape) {
  // Score = voice-movement + register-cost
  // Sweet spot: avg fret 5–9 (comping range). Outside that, cost grows.
  let best = null;
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!sh) continue;
      const m = totalVoiceMovement(sourceShape, sh);
      const af = avgFret(sh);
      const target = 7;
      const reg = Math.abs(af - target);
      const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
      // Prefer mid (5432) + top (4321) sets over low (6543) for comping clarity
      const setPref = ss === 0 ? 3 : 0;
      const score = m + registerCost + setPref;
      if (!best || score < best.score) best = {shape: sh, stringSetIdx: ss, inversion: inv, movement: m, score};
    }
  }
  return best;
}

function bestStartingVoicing(quality, rootPc) {
  let best = null;
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!sh) continue;
      const af = avgFret(sh);
      const reg = Math.abs(af - 7);
      const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
      const setPref = ss === 0 ? 3 : 0;
      const score = registerCost + setPref;
      if (!best || score < best.score) best = {shape: sh, stringSetIdx: ss, inversion: inv, score};
    }
  }
  return best;
}

/* ─── Alt voicing types: triad, shell ─── */

// Triad (R, 3rd or b3rd, 5th or b5th) — no 7th
function triadVoicing(quality, rootPc, stringSetType = 'top') {
  const q = QUALITIES[quality];
  if (!q || q.ints.length < 3) return null;
  // First three chord tones = R, 3 (or b3), 5 (or b5)
  const ints = [q.ints[0], q.ints[1], q.ints[2]];
  // Three-string sets to choose from
  const sets = {
    'top':  [3, 4, 5],   // G-B-E
    'mid':  [2, 3, 4],   // D-G-B
    'low':  [1, 2, 3],   // A-D-G
  };
  const set = sets[stringSetType] || sets.top;
  for (let oct = 24; oct <= 72; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = ints.map(s => rootMidi + s);
    const frets = set.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      set.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

// Shell voicing: R (low) + 7 (or b7) + 3 (or b3) — classic jazz comping
function shellVoicing(quality, rootPc, type = 'A') {
  const q = QUALITIES[quality];
  if (!q) return null;
  // Find the 7th and 3rd intervals from chord tones
  const ints = q.ints;
  let seventhInt = null;
  if (ints.includes(11)) seventhInt = 11;
  else if (ints.includes(10)) seventhInt = 10;
  else if (ints.includes(9))  seventhInt = 9;
  else seventhInt = 10; // fallback to b7
  let thirdInt = null;
  if (ints.includes(4)) thirdInt = 4;
  else if (ints.includes(3)) thirdInt = 3;
  else thirdInt = 4;
  // Ascending pitches: R (0), 7 (10 or 11), 3 + 12 (to be above 7)
  const intervals = [0, seventhInt, thirdInt + 12];
  // Type A: R on 6th string, 7 on 4th, 3 on 3rd (skip 5th string)
  // Type B: R on 5th string, 7 on 3rd, 3 on 2nd
  const strings = type === 'A' ? [0, 2, 3] : [1, 3, 4];
  for (let oct = 24; oct <= 60; oct += 12) {
    const rootMidi = oct + rootPc;
    const voiceMidis = intervals.map(s => rootMidi + s);
    const frets = strings.map((sIdx, i) => voiceMidis[i] - STRING_OPEN_MIDI[sIdx]);
    if (frets.every(f => f >= 0 && f <= N_FRETS)) {
      const shape = [-1, -1, -1, -1, -1, -1];
      strings.forEach((sIdx, i) => { shape[sIdx] = frets[i]; });
      return shape;
    }
  }
  return null;
}

function smoothestOnStringSet(quality, rootPc, stringSetIdx, sourceShape) {
  let best = null;
  for (let inv = 0; inv < 4; inv++) {
    const sh = dropTwoVoicing(quality, rootPc, stringSetIdx, inv);
    if (!sh) continue;
    const m = totalVoiceMovement(sourceShape, sh);
    if (!best || m < best.movement) best = {shape: sh, stringSetIdx, inversion: inv, movement: m};
  }
  return best;
}

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */

const state = {
  keyPc: 0,
  tonality: 'major',
  display: 'notes',
  focusedChord: 'I',
  userVoicing: null,
  playerVoicing: null,  // {chord, shape, type} — currently playing
  nextVoicing: null,    // {chord, shape, type} — predicted upcoming
};

function currentMap() { return CHORD_MAP[state.tonality]; }

function chordRoot(chord) { return (state.keyPc + chord.deg) % 12; }

function focusedChord() {
  const map = currentMap();
  const ch = map.chordDefs[state.focusedChord];
  return {id: state.focusedChord, ...ch};
}

function focusedShape() {
  const fc = focusedChord();
  const root = chordRoot(fc);
  if (state.userVoicing) {
    return {
      shape: dropTwoVoicing(fc.quality, root, state.userVoicing.stringSetIdx, state.userVoicing.inversion),
      ...state.userVoicing,
    };
  }
  // If the AI is currently playing this chord with a specific voicing, show that one
  if (state.playerVoicing && state.playerVoicing.chord === state.focusedChord && state.playerVoicing.shape) {
    return { shape: state.playerVoicing.shape, type: state.playerVoicing.type };
  }
  // Default: register-aware musical voicing
  const v = bestStartingVoicing(fc.quality, root);
  if (v) {
    return { shape: v.shape, stringSetIdx: v.stringSetIdx, inversion: v.inversion };
  }
  return {
    shape: dropTwoVoicing(fc.quality, root, 2, 0),
    stringSetIdx: 2,
    inversion: 0,
  };
}

function computeAllVoicings() {
  const map = currentMap();
  const focused = focusedChord();
  const focShape = focusedShape();
  const result = {};
  result[focused.id] = {...focShape, movement: 0};

  for (const id in map.chordDefs) {
    if (id === focused.id) continue;
    // Honor the AI's predicted next-up voicing so the next-up card
    // shows exactly what will be played when it becomes active
    if (state.nextVoicing && state.nextVoicing.chord === id && state.nextVoicing.shape) {
      result[id] = { shape: state.nextVoicing.shape, type: state.nextVoicing.type };
      continue;
    }
    const ch = map.chordDefs[id];
    const r = chordRoot(ch);
    const sm = smoothestVoicing(ch.quality, r, focShape.shape);
    result[id] = sm;
  }
  return result;
}

/* ════════════════════════════════════════════════════════════
   MINI FRETBOARD (with inlays)
   ════════════════════════════════════════════════════════════ */

function renderMini(shape, rootPc, quality, flats, sizing) {
  if (!shape) return '';
  const q = QUALITIES[quality];
  const intToDeg = {};
  q.ints.forEach((semi, i) => {
    const pc = ((semi % 12) + 12) % 12;
    if (!(pc in intToDeg)) intToDeg[pc] = q.degs[i];
  });

  const played = shape.filter(f => f >= 0);
  if (!played.length) return '';
  let minF = Math.min(...played);
  let maxF = Math.max(...played);
  const hasOpen = shape.some(f => f === 0);
  let span = Math.max(4, maxF - minF + 1);
  // startFret = fret-number of the TOP BAR shown (the bar above the first playable fret)
  let startFret = hasOpen ? 0 : Math.max(0, minF - 1);
  let endFret = startFret + span;
  if (!hasOpen && endFret > N_FRETS) { endFret = N_FRETS; startFret = endFret - span; }

  const W = sizing?.W || 160;
  const H = sizing?.H || 140;
  const ml = 18, mr = 8, mt = 18, mb = 6;
  const innerW = W - ml - mr;
  const innerH = H - mt - mb;
  const stringSp = innerW / 5;
  const fretSp = innerH / Math.max(4, endFret - startFret);

  let s = '';
  if (startFret === 0) {
    s += `<line x1="${ml-2}" y1="${mt}" x2="${ml+innerW+2}" y2="${mt}" stroke="#1f1d18" stroke-width="4"/>`;
  } else {
    s += `<text x="${ml-4}" y="${mt+fretSp/2+3}" text-anchor="end" font-size="10" fill="#7a7a82" font-family="SF Mono">${startFret+1}fr</text>`;
  }
  for (let i = (startFret === 0 ? 1 : 0); i <= endFret - startFret; i++) {
    const y = mt + i * fretSp;
    s += `<line x1="${ml}" y1="${y}" x2="${ml+innerW}" y2="${y}" stroke="#d4d4da" stroke-width="1"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const x = ml + i * stringSp;
    s += `<line x1="${x}" y1="${mt}" x2="${x}" y2="${mt+innerH}" stroke="#a8a8b0" stroke-width="0.8"/>`;
  }
  // Inlays
  {
    const cx = ml + innerW / 2;
    const dw = Math.min(stringSp * 0.7, fretSp * 0.32);
    const dh = Math.min(fretSp * 0.32, 8);
    const drawD = (x, y) => `<polygon points="${x},${y-dh} ${x+dw},${y} ${x},${y+dh} ${x-dw},${y}" fill="#aaa496" opacity="0.55"/>`;
    [3,5,7,9,15,17,19,21].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      s += drawD(cx, y);
    });
    [12, 24].forEach(f => {
      if (f <= startFret || f > endFret) return;
      const y = mt + ((f - startFret) - 0.5) * fretSp;
      if (y < mt - 1) return;
      const off = stringSp * 1.5;
      s += drawD(cx - off, y);
      s += drawD(cx + off, y);
    });
  }
  // Barre indicator: when 2+ adjacent strings share the same fret, draw a backing bar
  {
    const fretGroups = {};
    shape.forEach((f, sIdx) => {
      if (f > 0) {
        if (!fretGroups[f]) fretGroups[f] = [];
        fretGroups[f].push(sIdx);
      }
    });
    Object.entries(fretGroups).forEach(([f, strings]) => {
      if (strings.length < 2) return;
      strings.sort((a, b) => a - b);
      // longest consecutive run
      let runStart = strings[0], runEnd = strings[0];
      let bestStart = runStart, bestEnd = runEnd;
      for (let i = 1; i < strings.length; i++) {
        if (strings[i] === runEnd + 1) {
          runEnd = strings[i];
        } else {
          if (runEnd - runStart > bestEnd - bestStart) { bestStart = runStart; bestEnd = runEnd; }
          runStart = strings[i]; runEnd = strings[i];
        }
      }
      if (runEnd - runStart > bestEnd - bestStart) { bestStart = runStart; bestEnd = runEnd; }
      if (bestEnd - bestStart < 1) return;
      const fret = +f;
      const cy = mt + ((fret - startFret) - 0.5) * fretSp;
      const x1 = ml + bestStart * stringSp;
      const x2 = ml + bestEnd * stringSp;
      const noteR = sizing?.r || 11;
      s += `<rect x="${x1 - noteR}" y="${cy - noteR - 1}" width="${x2 - x1 + 2*noteR}" height="${2*noteR + 2}" rx="${noteR + 1}" fill="#1f1d18" opacity="0.13"/>`;
    });
  }
  shape.forEach((fret, sIdx) => {
    const x = ml + sIdx * stringSp;
    if (fret < 0) {
      s += `<text x="${x}" y="${mt-5}" text-anchor="middle" font-size="11" fill="#a8a8b0" font-weight="700">×</text>`;
      return;
    }
    const pc = noteAt(sIdx, fret);
    const rel = (pc - rootPc + 12) % 12;
    const deg = intToDeg[rel] || '';
    const color = intervalColor(deg);
    let cy;
    if (fret === 0) {
      cy = mt - 7;
      s += `<circle cx="${x}" cy="${cy}" r="6" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
      return;
    }
    cy = mt + ((fret - startFret) - 0.5) * fretSp;
    const r = sizing?.r || 11;
    s += `<circle cx="${x}" cy="${cy}" r="${r}" fill="${color}" stroke="#000" stroke-width="0.8"/>`;
    const noteName = nameOf(pc, flats);
    let label = state.display === 'intervals' ? deg : noteName;
    let fontSize = label.length > 2 ? 8 : 10;
    s += `<text x="${x}" y="${cy + 3.5}" text-anchor="middle" font-size="${fontSize}" font-weight="700" fill="#000">${label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

/* ════════════════════════════════════════════════════════════
   CHORD MAP RENDER
   ════════════════════════════════════════════════════════════ */

const MAP_DIMS = {width: 540, height: 800};

function renderChordMap() {
  const wrap = document.getElementById('chord-map');
  const arrowsSvg = document.getElementById('map-arrows');
  const map = currentMap();
  const flats = useFlatsFor(state.keyPc);
  const voicings = computeAllVoicings();

  // Clear existing cards
  Array.from(wrap.querySelectorAll('.map-card')).forEach(el => el.remove());

  // Render one card per node
  for (const nodeId in map.nodes) {
    const node = map.nodes[nodeId];
    const ch = map.chordDefs[node.chord];
    const root = chordRoot(ch);
    const v = voicings[node.chord];
    const chordName = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
    const isFocus = node.chord === state.focusedChord;
    const isHub = node.hub;
    const card = document.createElement('div');
    const isSatellite = (ch.tag === 'secondary' || ch.tag === 'borrowed');
    card.className = `map-card tag-${ch.tag} ${isHub ? 'hub' : ''} ${isFocus ? 'focused' : ''} ${isSatellite ? 'satellite' : 'diatonic'}`;
    card.style.left = `${node.x}px`;
    card.style.top = `${node.y}px`;
    card.dataset.chord = node.chord;
    const sizing = isHub ? {W:130, H:120, r:9} : (isSatellite ? {W:72, H:80, r:5.5} : {W:96, H:104, r:7.5});
    const svg = v?.shape ? renderMini(v.shape, root, ch.quality, flats, sizing) : '';
    card.innerHTML = `
      <div class="mc-top">
        <span class="mc-roman">${ch.roman}</span>
        <span class="mc-name">${chordName}</span>
      </div>
      <div class="mc-svg-wrap">${svg}</div>
    `;
    card.addEventListener('click', () => {
      state.focusedChord = node.chord;
      state.userVoicing = null;
      if (player.playing) {
        player.jumpTo(node.chord);
      }
      renderAll();
      // After renderAll, re-apply playing/next-up classes if player active
      if (player.playing) {
        document.querySelectorAll('.map-card').forEach(c => {
          if (c.dataset.chord === player.currentChord) c.classList.add('playing');
          else if (c.dataset.chord === player.nextChord) c.classList.add('next-up');
        });
      }
    });
    wrap.appendChild(card);
  }

  // Render arrows using node positions
  arrowsSvg.setAttribute('viewBox', `0 0 ${MAP_DIMS.width} ${MAP_DIMS.height}`);
  arrowsSvg.innerHTML = `
    <defs>
      <marker id="ah-smooth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
      </marker>
      <marker id="ah-med" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#a07820"/>
      </marker>
      <marker id="ah-jump" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#a8a493"/>
      </marker>
      <marker id="ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="${getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()}"/>
      </marker>
    </defs>
  ` + map.arrows.map(arr => {
    const a = map.nodes[arr.from];
    const b = map.nodes[arr.to];
    if (!a || !b) return '';
    const aIsHub = a.hub;
    const bIsHub = b.hub;
    const aChDef = map.chordDefs[a.chord];
    const bChDef = map.chordDefs[b.chord];
    const aSat = aChDef && (aChDef.tag === 'secondary' || aChDef.tag === 'borrowed');
    const bSat = bChDef && (bChDef.tag === 'secondary' || bChDef.tag === 'borrowed');
    const aw = aIsHub ? 130 : (aSat ? 92 : 100);
    const bw = bIsHub ? 130 : (bSat ? 92 : 100);
    const ah = aIsHub ? 145 : (aSat ? 100 : 115);
    const bh = bIsHub ? 145 : (bSat ? 100 : 115);
    const acx = a.x + aw/2;
    const acy = a.y + ah/2;
    const bcx = b.x + bw/2;
    const bcy = b.y + bh/2;

    const dx = bcx - acx, dy = bcy - acy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (!dist) return '';
    const ux = dx/dist, uy = dy/dist;
    const aRadX = aw/2 * 0.92, aRadY = ah/2 * 0.7;
    const tA = 1 / Math.max(Math.abs(ux)/aRadX, Math.abs(uy)/aRadY);
    const sx = acx + ux * tA;
    const sy = acy + uy * tA;
    const bRadX = bw/2 * 0.92, bRadY = bh/2 * 0.7;
    const tB = 1 / Math.max(Math.abs(ux)/bRadX, Math.abs(uy)/bRadY);
    const ex = bcx - ux * tB;
    const ey = bcy - uy * tB;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const perpX = -uy, perpY = ux;
    // Short arrows = nearly straight. Long arrows = strong arch around obstacles.
    const curveAmt = dist < 180 ? dist * 0.10 : Math.min(120, dist * 0.34);
    const curveDir = (arr.curve === undefined) ? 1 : arr.curve;
    const cx = mx + perpX * curveAmt * curveDir;
    const cy = my + perpY * curveAmt * curveDir;

    const aChord = a.chord, bChord = b.chord;
    const isHl = (aChord === state.focusedChord) || (bChord === state.focusedChord);

    // Voice-leading cost → visual thickness + color (no number labels)
    const va = voicings[aChord];
    const vb = voicings[bChord];
    let strokeWidth = 1.5;
    let strokeColor = '#a8a493';
    let markerName = 'ah-jump';
    if (va?.shape && vb?.shape) {
      const cost = totalVoiceMovement(va.shape, vb.shape);
      if (cost <= 3) {
        strokeWidth = 2.8;
        strokeColor = '#059669';
        markerName = 'ah-smooth';
      } else if (cost <= 7) {
        strokeWidth = 2.0;
        strokeColor = '#a07820';
        markerName = 'ah-med';
      } else {
        strokeWidth = 1.2;
        strokeColor = '#a8a493';
        markerName = 'ah-jump';
      }
    }
    const finalStroke = isHl ? 'var(--accent)' : strokeColor;
    const finalWidth = isHl ? Math.max(strokeWidth, 2.6) : strokeWidth;
    const finalOpacity = isHl ? 1 : 0.78;
    const finalMarker = isHl ? 'ah-hl' : markerName;

    return `
      <path d="M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="${finalStroke}" stroke-width="${finalWidth}" opacity="${finalOpacity}" marker-end="url(#${finalMarker})"/>
    `;
  }).join('');
}

/* ════════════════════════════════════════════════════════════
   ALTERNATIVES
   ════════════════════════════════════════════════════════════ */

function renderAlternatives() {
  const altRow = document.getElementById('alt-row');
  const altName = document.getElementById('alt-chord-name');
  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const chordName = nameOf(root, flats) + QUALITIES[fc.quality].sfx;
  altName.textContent = `${fc.roman} · ${chordName}`;

  const current = state.userVoicing || {stringSetIdx: 2, inversion: 0};
  const currentKey = `${current.stringSetIdx}.${current.inversion}`;

  const autoSel = state.userVoicing === null ? 'selected' : '';
  let html = `
    <div class="alt-card ${autoSel}" data-auto="1" style="justify-content:center">
      <div style="font-size:14px;color:var(--accent);font-weight:700;text-align:center;line-height:1.2;padding:24px 0">↻<br><span style="font-size:9px;text-transform:uppercase;letter-spacing:1px">auto</span></div>
      <div class="ac-label">smoothest</div>
      <div class="ac-notes">(re-pick)</div>
    </div>
  `;

  for (let inv = 0; inv < 4; inv++) {
    for (let ss = 0; ss < STRING_SETS.length; ss++) {
      const sh = dropTwoVoicing(fc.quality, root, ss, inv);
      if (!sh) continue;
      const sel = (`${ss}.${inv}` === currentKey && state.userVoicing) ? 'selected' : '';
      const invN = ['R','1st','2nd','3rd'][inv];
      const label = `${invN} · ${STRING_SETS[ss].label}`;
      const notes = sh.map((f, st) => f < 0 ? '' : nameOf(noteAt(st, f), flats)).filter(x => x).join(' ');
      html += `
        <div class="alt-card ${sel}" data-ss="${ss}" data-inv="${inv}">
          ${renderMini(sh, root, fc.quality, flats, {W:88, H:92, r:7})}
          <div class="ac-label">${label}</div>
          <div class="ac-notes">${notes}</div>
        </div>
      `;
    }
  }

  altRow.innerHTML = html;
  altRow.querySelectorAll('[data-auto]').forEach(c => {
    c.addEventListener('click', () => { state.userVoicing = null; renderAll(); });
  });
  altRow.querySelectorAll('[data-ss]').forEach(c => {
    c.addEventListener('click', () => {
      state.userVoicing = {stringSetIdx: +c.dataset.ss, inversion: +c.dataset.inv};
      renderAll();
    });
  });
}

/* ════════════════════════════════════════════════════════════
   FRETBOARD
   ════════════════════════════════════════════════════════════ */

const FB = {W:2500, H:380, ml:60, mr:20, mt:30, mb:30, openW:70, noteR:16};

function renderFretboard() {
  const svg = document.getElementById('fretboard-svg');
  const innerW = FB.W - FB.ml - FB.mr - FB.openW;
  const fretW = innerW / N_FRETS;
  const stringsH = FB.H - FB.mt - FB.mb;
  const ss = stringsH / 5;

  const fc = focusedChord();
  const root = chordRoot(fc);
  const flats = useFlatsFor(root);
  const q = QUALITIES[fc.quality];
  const focShape = focusedShape();

  const activeFrets = focShape.shape ? new Set(focShape.shape.map((f, i) => f >= 0 ? `${i}.${f}` : null).filter(Boolean)) : new Set();

  const chordPcs = new Set(q.ints.map(i => (root + i) % 12));
  const chordDegFromRoot = {};
  q.ints.forEach((semi, i) => {
    const pc = (root + semi) % 12;
    if (!(pc in chordDegFromRoot)) chordDegFromRoot[pc] = q.degs[i];
  });

  let s = '';
  const diamond = (cx, cy) => `<polygon points="${cx},${cy-11} ${cx+11},${cy} ${cx},${cy+11} ${cx-11},${cy}" fill="#aaa496"/>`;
  [3,5,7,9,15,17,19,21].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + stringsH/2);
  });
  [12, 24].forEach(f => {
    if (f > N_FRETS) return;
    const cx = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += diamond(cx, FB.mt + ss);
    s += diamond(cx, FB.mt + ss*4);
  });

  for (let f = 0; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + f * fretW;
    const w = f === 0 ? 6 : 1.5;
    const color = f === 0 ? '#1a1a1f' : '#c8c8cc';
    s += `<line x1="${x}" y1="${FB.mt - 4}" x2="${x}" y2="${FB.mt + stringsH + 4}" stroke="${color}" stroke-width="${w}"/>`;
  }
  for (let f = 1; f <= N_FRETS; f++) {
    const x = FB.ml + FB.openW + (f - 0.5) * fretW;
    s += `<text x="${x}" y="${FB.H - 8}" text-anchor="middle" font-size="11" fill="#8a8a92" font-family="SF Mono, monospace">${f}</text>`;
  }
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    const w = 0.6 + (5 - str) * 0.35;
    s += `<line x1="${FB.ml}" y1="${y}" x2="${FB.W - FB.mr}" y2="${y}" stroke="#a8a8b0" stroke-width="${w}"/>`;
    s += `<text x="${FB.ml - 10}" y="${y + 5}" text-anchor="end" font-size="13" fill="#7a7a82" font-family="SF Mono, monospace" font-weight="700">${STRING_LABELS[str]}</text>`;
  }

  // Shadow chord-tones
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const pc = noteAt(str, f);
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!chordPcs.has(pc) || isActive) continue;
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      s += `<circle cx="${cx}" cy="${y}" r="9" fill="${c}" opacity="0.42" stroke="#000" stroke-width="0.5"/>`;
    }
  }

  // Active voicing — bright
  for (let str = 0; str < 6; str++) {
    const y = FB.mt + (5 - str) * ss;
    for (let f = 0; f <= N_FRETS; f++) {
      const isActive = activeFrets.has(`${str}.${f}`);
      if (!isActive) continue;
      const pc = noteAt(str, f);
      const cx = f === 0 ? FB.ml + FB.openW/2 : FB.ml + FB.openW + (f - 0.5) * fretW;
      const deg = chordDegFromRoot[pc] || '';
      const c = intervalColor(deg);
      const isRoot = pc === root;
      if (isRoot) {
        s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR + 5}" fill="none" stroke="${c}" stroke-width="2.2" opacity="0.6"/>`;
      }
      s += `<circle cx="${cx}" cy="${y}" r="${FB.noteR}" fill="${c}" stroke="#000" stroke-width="1.5"/>`;
      const noteName = nameOf(pc, flats);
      if (state.display === 'notes') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${noteName}</text>`;
      } else if (state.display === 'intervals') {
        s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#000">${deg}</text>`;
      } else {
        s += `<text x="${cx}" y="${y - 2}" text-anchor="middle" font-size="10" font-weight="700" fill="#000">${noteName}</text>`;
        s += `<text x="${cx}" y="${y + 10}" text-anchor="middle" font-size="8" font-weight="700" fill="#000" opacity="0.7">${deg}</text>`;
      }
    }
  }

  svg.innerHTML = s;
}

/* ════════════════════════════════════════════════════════════
   PICKERS
   ════════════════════════════════════════════════════════════ */

function renderKeyRow() {
  const el = document.getElementById('key-row');
  // Piano layout: 7 white keys + 5 black keys overlaid
  const whitePCs   = [0, 2, 4, 5, 7, 9, 11];  // C D E F G A B
  const blackInfo  = [
    {pc:1,  after:0}, // C#/Db between C(0) and D(1 idx)
    {pc:3,  after:1}, // D#/Eb between D and E
    {pc:6,  after:3}, // F#/Gb between F and G
    {pc:8,  after:4}, // G#/Ab between G and A
    {pc:10, after:5}, // A#/Bb between A and B
  ];
  const whiteW = 24;
  const blackW = 16;
  const totalW = whitePCs.length * whiteW;

  let html = `<div class="key-piano" style="width:${totalW}px">`;
  whitePCs.forEach(pc => {
    const r = ROOTS[pc];
    const active = state.keyPc === pc ? 'active' : '';
    html += `<div class="pk-white ${active}" data-pc="${pc}">${r.name}</div>`;
  });
  blackInfo.forEach(b => {
    const r = ROOTS[b.pc];
    const active = state.keyPc === b.pc ? 'active' : '';
    const left = (b.after + 1) * whiteW - blackW / 2;
    html += `<div class="pk-black ${active}" data-pc="${b.pc}" style="left:${left}px">${r.name}</div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-pc]').forEach(c => {
    c.addEventListener('click', () => {
      state.keyPc = +c.dataset.pc;
      state.userVoicing = null;
      renderAll();
    });
  });
}

document.querySelectorAll('#tonality-toggle button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#tonality-toggle button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.tonality = b.dataset.tonality;
    state.focusedChord = state.tonality === 'major' ? 'I' : 'i';
    state.userVoicing = null;
    renderAll();
  });
});

/* ════════════════════════════════════════════════════════════
   ORCHESTRATE
   ════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════
   AUDIO — drones (Web Audio API)
   ════════════════════════════════════════════════════════════ */

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

class Drone {
  constructor() {
    this.nodes = [];
    this.master = null;
    this.playing = false;
    this.targetVolume = 0.18;
  }
  start(midiNotes, volume) {
    // Avoid restarting if the pitches didn't change (prevents clicking on focus changes)
    if (this.playing && this.lastNotes &&
        midiNotes.length === this.lastNotes.length &&
        midiNotes.every((n, i) => n === this.lastNotes[i])) {
      this.setVolume(volume);
      return;
    }
    const ctx = ensureAudio();
    // Quick crossfade out of any previous master to avoid clicks
    if (this.playing && this.master) {
      const oldM = this.master, oldN = this.nodes;
      const now = ctx.currentTime;
      oldM.gain.cancelScheduledValues(now);
      oldM.gain.linearRampToValueAtTime(0, now + 0.06);
      setTimeout(() => {
        oldN.forEach(n => {
          try {
            if (n.o1) n.o1.stop();
            if (n.o2) n.o2.stop();
            if (n.o3) n.o3.stop();
            if (n.lfo) n.lfo.stop();
          } catch(e) {}
        });
        try { oldM.disconnect(); } catch(e) {}
      }, 90);
    } else {
      this._immediateStop();
    }
    if (!midiNotes.length) {
      this.master = null; this.nodes = []; this.playing = false; this.lastNotes = null;
      return;
    }
    this.nodes = []; // fresh array for new oscillators
    this.lastNotes = [...midiNotes];
    this.targetVolume = volume;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    const sortedNotes = [...midiNotes].sort((a,b) => a - b);
    const now = ctx.currentTime;
    const timbre = droneTimbre;

    // Tremolo LFO only for Rhodes (the iconic wobble)
    if (timbre === 'rhodes') {
      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 4.6;
      const lfoDepth = ctx.createGain();
      lfoDepth.gain.value = 0.055;
      lfo.connect(lfoDepth);
      lfoDepth.connect(this.master.gain);
      lfo.start(now);
      this.nodes.push({lfo});
    }

    sortedNotes.forEach((midi, i) => {
      const startOffset = timbre === 'pad' ? 0 : i * 0.006;
      const t = now + startOffset;
      if (timbre === 'pad') this._voicePad(midi, i, sortedNotes.length, t);
      else if (timbre === 'organ') this._voiceOrgan(midi, i, sortedNotes.length, t);
      else if (timbre === 'piano') this._voicePiano(midi, i, sortedNotes.length, t);
      else this._voiceRhodes(midi, i, sortedNotes.length, t);
    });

    // Per-timbre master attack
    const attack = timbre === 'pad' ? 0.4 : (timbre === 'organ' ? 0.18 : (timbre === 'piano' ? 0.05 : 0.06));
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(0, now);
    this.master.gain.linearRampToValueAtTime(this.targetVolume, now + attack);
    this.playing = true;
  }

  _voiceRhodes(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = freq;
    const ratio = midi < 55 ? 4 : (midi < 70 ? 7 : 14);
    const modulator = ctx.createOscillator();
    modulator.type = 'sine';
    modulator.frequency.value = freq * ratio;
    const modDepth = ctx.createGain();
    const peakDepth = freq * 3.2;
    const restDepth = freq * 0.12;
    modDepth.gain.setValueAtTime(0, t);
    modDepth.gain.linearRampToValueAtTime(peakDepth, t + 0.004);
    modDepth.gain.exponentialRampToValueAtTime(restDepth, t + 0.45);
    modulator.connect(modDepth);
    modDepth.connect(carrier.frequency);
    const pitchRoll = 1.0 - (i / total) * 0.4;
    const peakVol = 0.22 * pitchRoll;
    const sustainVol = peakVol * 0.62;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(peakVol, t + 0.008);
    noteG.gain.exponentialRampToValueAtTime(sustainVol, t + 0.5);
    carrier.connect(noteG);
    noteG.connect(this.master);
    carrier.start(t); modulator.start(t);
    this.nodes.push({o1: carrier, o2: modulator});
  }

  _voicePad(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq; o1.detune.value = -6;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq; o2.detune.value =  6;
    const o3 = ctx.createOscillator(); o3.type = 'sine';     o3.frequency.value = freq;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 1400 + (midi - 36) * 28;
    filt.Q.value = 0.5;
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const sineG = ctx.createGain(); sineG.gain.value = 0.55;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.16 * pitchRoll, t + 0.025);
    o1.connect(filt); o2.connect(filt);
    o3.connect(sineG); sineG.connect(filt);
    filt.connect(noteG); noteG.connect(this.master);
    o1.start(t); o2.start(t); o3.start(t);
    this.nodes.push({o1, o2, o3});
  }

  _voiceOrgan(midi, i, total, t) {
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Drawbar-style harmonics (Hammond-ish)
    const harmonics = [
      {ratio: 1,   gain: 0.75},
      {ratio: 2,   gain: 0.50},
      {ratio: 3,   gain: 0.30},
      {ratio: 4,   gain: 0.20},
      {ratio: 6,   gain: 0.12},
    ];
    const pitchRoll = 1.0 - (i / total) * 0.30;
    const noteG = ctx.createGain();
    noteG.gain.setValueAtTime(0, t);
    noteG.gain.linearRampToValueAtTime(0.12 * pitchRoll, t + 0.04);
    // Soft lowpass for warmth
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200 + (midi - 36) * 30;
    lp.Q.value = 0.4;
    noteG.connect(lp);
    lp.connect(this.master);
    const oscs = [];
    harmonics.forEach(h => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * h.ratio;
      const g = ctx.createGain(); g.gain.value = h.gain;
      o.connect(g); g.connect(noteG);
      o.start(t);
      oscs.push(o);
    });
    // Track oscillators in chunks of 3 (so stop logic catches them all)
    for (let j = 0; j < oscs.length; j += 3) {
      this.nodes.push({ o1: oscs[j], o2: oscs[j+1], o3: oscs[j+2] });
    }
  }

  _voicePiano(midi, i, total, t) {
    // Calm felt/acoustic piano: gentle hammer attack, mellow decay
    const ctx = audioCtx;
    const freq = midiToFreq(midi);
    // Fundamental sine
    const fund = ctx.createOscillator();
    fund.type = 'sine'; fund.frequency.value = freq;
    // Triangle for body
    const tri = ctx.createOscillator();
    tri.type = 'triangle'; tri.frequency.value = freq;
    // Subtle 2nd harmonic (octave above) for slight piano color
    const harm = ctx.createOscillator();
    harm.type = 'sine'; harm.frequency.value = freq * 2;
    const harmG = ctx.createGain(); harmG.gain.value = 0.18;
    const triG = ctx.createGain(); triG.gain.value = 0.45;
    // Soft lowpass with a slight downward sweep (felt damping)
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(1100, t + 0.5);
    lp.Q.value = 0.35;
    const pitchRoll = 1.0 - (i / total) * 0.35;
    const peakVol = 0.22 * pitchRoll;
    const sustainVol = peakVol * 0.55;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(peakVol, t + 0.018); // soft felt-hammer attack
    env.gain.exponentialRampToValueAtTime(sustainVol, t + 0.45);
    env.gain.exponentialRampToValueAtTime(sustainVol * 0.35, t + 2.8); // long natural fade
    fund.connect(env);
    tri.connect(triG); triG.connect(env);
    harm.connect(harmG); harmG.connect(env);
    env.connect(lp);
    lp.connect(this.master);
    fund.start(t); tri.start(t); harm.start(t);
    this.nodes.push({o1: fund, o2: tri, o3: harm});
  }

  _immediateStop() {
    this.nodes.forEach(n => {
      try {
        if (n.o1) n.o1.stop();
        if (n.o2) n.o2.stop();
        if (n.o3) n.o3.stop();
        if (n.lfo) n.lfo.stop();
      } catch(e) {}
    });
    if (this.master) { try { this.master.disconnect(); } catch(e) {} }
    this.nodes = []; this.master = null; this.playing = false;
    this.lastNotes = null;
  }
  stop(fadeMs = 350) {
    if (!this.playing || !audioCtx) return this._immediateStop();
    const now = audioCtx.currentTime;
    const m = this.master, n = this.nodes;
    m.gain.cancelScheduledValues(now);
    m.gain.linearRampToValueAtTime(0, now + fadeMs/1000);
    setTimeout(() => {
      n.forEach(x => {
        try {
          if (x.o1) x.o1.stop();
          if (x.o2) x.o2.stop();
          if (x.o3) x.o3.stop();
          if (x.lfo) x.lfo.stop();
        } catch(e) {}
      });
      try { m.disconnect(); } catch(e) {}
    }, fadeMs + 60);
    this.master = null; this.nodes = []; this.playing = false;
  }
  setVolume(v) {
    this.targetVolume = v;
    if (this.master && audioCtx) {
      this.master.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
    }
  }
}

/* ─── Bass pluck (jazz upright pizzicato) ─── */

function bassMidiForPc(pc) {
  // Map pitch class to a bass register (MIDI 32-43 range, G#1 to G2)
  let midi = 24 + pc;
  while (midi < 32) midi += 12;
  if (midi > 43) midi -= 12;
  return midi;
}

function playBassPluck(midi, time, volume) {
  const ctx = audioCtx;
  if (!ctx) return [];
  const freq = midiToFreq(midi);

  // Triangle = warm body
  const tri = ctx.createOscillator();
  tri.type = 'triangle'; tri.frequency.value = freq;
  // Sine sub for depth
  const sine = ctx.createOscillator();
  sine.type = 'sine'; sine.frequency.value = freq;
  // Brief saw click for the pluck transient
  const click = ctx.createOscillator();
  click.type = 'sawtooth'; click.frequency.value = freq * 2;
  const clickG = ctx.createGain();
  clickG.gain.setValueAtTime(0, time);
  clickG.gain.linearRampToValueAtTime(volume * 0.35, time + 0.003);
  clickG.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);

  // Lowpass with downward sweep — "thump" envelope
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1200, time);
  lp.frequency.exponentialRampToValueAtTime(280, time + 0.3);
  lp.Q.value = 0.7;

  // Main amplitude envelope
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(volume, time + 0.008);
  env.gain.exponentialRampToValueAtTime(volume * 0.45, time + 0.18);
  env.gain.exponentialRampToValueAtTime(0.0008, time + 1.3);

  tri.connect(env);
  sine.connect(env);
  click.connect(clickG); clickG.connect(env);
  env.connect(lp);
  lp.connect(ctx.destination);

  tri.start(time); sine.start(time); click.start(time);
  tri.stop(time + 1.4); sine.stop(time + 1.4); click.stop(time + 0.06);

  return [tri, sine, click];
}

function tonicMidiNotes() {
  // Root note in 2 octaves (bass + tenor) + fifth above for body
  const pc = state.keyPc;
  return [36 + pc, 48 + pc, 36 + pc + 7];
}
function chordMidiNotes() {
  const fs = focusedShape();
  if (!fs.shape) return [];
  return fs.shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
}

/* ─── Metronome ─── */

class Metronome {
  constructor() {
    this.bpm = 120;
    this.mode = 'ride';
    this.playing = false;
    this.nextTickTime = 0;
    this.tickIdx = 0;
    this.timer = null;
    this.scheduleAhead = 0.12;
    this.lookAheadMs = 25;
  }
  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.tickIdx = 0;
    this.nextTickTime = ctx.currentTime + 0.08;
    this.timer = setInterval(() => this._scheduler(), this.lookAheadMs);
  }
  stop() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
  }
  _scheduler() {
    if (!audioCtx) return;
    while (this.nextTickTime < audioCtx.currentTime + this.scheduleAhead) {
      this._playTick(this.nextTickTime, this.tickIdx);
      this._advance();
    }
  }
  _advance() {
    if (this.mode === 'click') {
      this.nextTickTime += 60 / this.bpm;
      this.tickIdx = (this.tickIdx + 1) % 4;
    } else {
      // Jazz ride: 6 hits per bar in triplet feel at triplet positions [0, 3, 5, 6, 9, 11] of 12
      const positions = [0, 3, 5, 6, 9, 11];
      const cur = positions[this.tickIdx];
      this.tickIdx = (this.tickIdx + 1) % 6;
      const nxt = positions[this.tickIdx];
      const triplet = 60 / (this.bpm * 3); // duration of one triplet eighth
      let diff = nxt - cur;
      if (diff <= 0) diff += 12;
      this.nextTickTime += diff * triplet;
    }
  }
  _playTick(time, idx) {
    if (this.mode === 'click') this._click(time, idx === 0);
    else this._ride(time, idx);
  }
  _click(time, isDownbeat) {
    const ctx = audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = isDownbeat ? 1600 : 1100;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.32, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(time); o.stop(time + 0.08);
  }
  _ride(time, idx) {
    const ctx = audioCtx;
    // idx 0,3 = main "ding" (downbeats); idx 1,4 = swing "and"; idx 2,5 = skip note
    const isDing = (idx === 0 || idx === 3);
    const dur = isDing ? 1.1 : 0.55;
    const vol = isDing ? 0.20 : 0.13;

    // ─── PRIMARY: pink-noise shimmer wash (most of the sound) ───
    const bufLen = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    // Paul Kellet's pink noise approximation
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for (let i = 0; i < bufLen; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;

    // Multi-stage filtering for the cymbal "sheen"
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3200;
    hp.Q.value = 0.4;

    const shimmer = ctx.createBiquadFilter();
    shimmer.type = 'peaking';
    shimmer.frequency.value = 7800;
    shimmer.Q.value = 1.2;
    shimmer.gain.value = 6;

    const air = ctx.createBiquadFilter();
    air.type = 'lowpass';
    air.frequency.value = 13000;
    air.Q.value = 0.5;

    const noiseEnv = ctx.createGain();
    // Soft attack (no harsh click), long smooth exponential tail
    noiseEnv.gain.setValueAtTime(0.0001, time);
    noiseEnv.gain.exponentialRampToValueAtTime(vol, time + 0.018);
    noiseEnv.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    noise.connect(hp); hp.connect(shimmer); shimmer.connect(air); air.connect(noiseEnv); noiseEnv.connect(ctx.destination);
    noise.start(time);

    // ─── SECONDARY: subtle warm "ding" bell — only on main beats, very quiet ───
    if (isDing) {
      // Two soft mid-high partials, warm not piercing
      const partials = [{f: 940, g: 0.5}, {f: 1640, g: 0.3}];
      partials.forEach(p => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = p.f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, time);
        g.gain.exponentialRampToValueAtTime(vol * 0.09 * p.g, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.55);
        o.connect(g); g.connect(ctx.destination);
        o.start(time); o.stop(time + dur * 0.6);
      });
    }
  }
  setBpm(b) { this.bpm = Math.max(40, Math.min(280, b)); }
  setMode(m) { this.mode = m; this.tickIdx = 0; }

  // Time of the next bar's downbeat (beat 1). Used to sync the player.
  nextDownbeatTime() {
    if (!this.playing) return null;
    if (this.mode === 'click') {
      // 4 ticks per bar; tickIdx 0 = beat 1
      const beatDur = 60 / this.bpm;
      const ticksUntilOne = (4 - this.tickIdx) % 4;
      return this.nextTickTime + ticksUntilOne * beatDur;
    } else {
      // ride: positions [0,3,5,6,9,11] of 12 triplets. tickIdx 0 = beat 1.
      if (this.tickIdx === 0) return this.nextTickTime;
      const positions = [0, 3, 5, 6, 9, 11];
      const tripletDur = 60 / (this.bpm * 3);
      const tripletsLeft = 12 - positions[this.tickIdx];
      return this.nextTickTime + tripletsLeft * tripletDur;
    }
  }
}

    {name:'iii–vi–ii–V–I',                len:8,  steps:[{chord:'iii',bars:1},{chord:'vi',bars:1},{chord:'ii',bars:1},{chord:'V',bars:1},{chord:'I',bars:4}]},
