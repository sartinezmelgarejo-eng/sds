    {name:'I–IV (long)',                  len:8,  steps:[{chord:'I',bars:2},{chord:'IV',bars:2},{chord:'I',bars:2},{chord:'V',bars:1},{chord:'I',bars:1}]},
    {name:'Pop ballad I–V–vi–IV ×2',      len:8,  steps:[{chord:'I',bars:1},{chord:'V',bars:1},{chord:'vi',bars:1},{chord:'IV',bars:1},{chord:'I',bars:1},{chord:'V',bars:1},{chord:'vi',bars:1},{chord:'IV',bars:1}]},
    {name:'Extended ii–V–I',              len:8,  steps:[{chord:'iii',bars:1},{chord:'vi',bars:1},{chord:'ii',bars:2},{chord:'V',bars:2},{chord:'I',bars:2}]},
    // ───── With secondary dominants ─────
    {name:'V/V – V – I',                  len:4,  steps:[{chord:'V_V',bars:1},{chord:'V',bars:1},{chord:'I',bars:2}]},
    {name:'V/ii – ii – V – I',            len:4,  steps:[{chord:'V_ii',bars:1},{chord:'ii',bars:1},{chord:'V',bars:1},{chord:'I',bars:1}]},
    {name:'I – V/V – V – I',              len:8,  steps:[{chord:'I',bars:2},{chord:'V_V',bars:2},{chord:'V',bars:2},{chord:'I',bars:2}]},
    {name:'iii – V/ii – ii – V – I',      len:8,  steps:[{chord:'iii',bars:1},{chord:'V_ii',bars:1},{chord:'ii',bars:1},{chord:'V',bars:1},{chord:'I',bars:4}]},
    // ───── With borrowed / tritone sub ─────
    {name:'bII7 – I (tritone sub)',       len:4,  steps:[{chord:'bII7',bars:1},{chord:'I',bars:3}]},
    {name:'ii – bII7 – I',                len:4,  steps:[{chord:'ii',bars:1},{chord:'bII7',bars:1},{chord:'I',bars:2}]},
    {name:'iv – I (borrowed)',            len:4,  steps:[{chord:'iv',bars:2},{chord:'I',bars:2}]},
    {name:'Backdoor iv – bVII – I',       len:4,  steps:[{chord:'iv',bars:1},{chord:'bVII',bars:1},{chord:'I',bars:2}]},
    {name:'I – iv – bVII – I',            len:8,  steps:[{chord:'I',bars:2},{chord:'iv',bars:2},{chord:'bVII',bars:2},{chord:'I',bars:2}]},
    // ───── 16-bar phrases ─────
    {name:'AABA-A double',                len:16, steps:[{chord:'I',bars:2},{chord:'vi',bars:2},{chord:'ii',bars:2},{chord:'V',bars:2},{chord:'I',bars:2},{chord:'vi',bars:2},{chord:'ii',bars:2},{chord:'V',bars:2}]},
  ],
  minor: [
    // 4-bar
    {name:'iiø–V7–i',                     len:4,  steps:[{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'i',bars:2}]},
    {name:'iv–V7–i',                      len:4,  steps:[{chord:'iv',bars:1},{chord:'V7',bars:1},{chord:'i',bars:2}]},
    {name:'i–bVII–bVI–V7 (Andalusian)',   len:4,  steps:[{chord:'i',bars:1},{chord:'bVII',bars:1},{chord:'bVI',bars:1},{chord:'V7',bars:1}]},
    {name:'i–iv–bVII–bIII',               len:4,  steps:[{chord:'i',bars:1},{chord:'iv',bars:1},{chord:'bVII',bars:1},{chord:'bIII',bars:1}]},
    {name:'bVI–bVII–i',                   len:4,  steps:[{chord:'bVI',bars:1},{chord:'bVII',bars:1},{chord:'i',bars:2}]},
    // 8-bar
    {name:'i–iv–V7–i (long)',             len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'V7',bars:2},{chord:'i',bars:2}]},
    {name:'bIII–bVI–iiø–V7–i',            len:8,  steps:[{chord:'bIII',bars:1},{chord:'bVI',bars:1},{chord:'iiø',bars:1},{chord:'V7',bars:1},{chord:'i',bars:4}]},
    {name:'Andalusian extended',          len:8,  steps:[{chord:'i',bars:2},{chord:'bVII',bars:2},{chord:'bVI',bars:2},{chord:'V7',bars:2}]},
    {name:'Minor blues fragment',         len:8,  steps:[{chord:'i',bars:2},{chord:'iv',bars:2},{chord:'i',bars:2},{chord:'V7',bars:1},{chord:'i',bars:1}]},
    // 16-bar
    {name:'Minor AABA-A',                 len:16, steps:[{chord:'i',bars:2},{chord:'bVI',bars:2},{chord:'iiø',bars:2},{chord:'V7',bars:2},{chord:'i',bars:2},{chord:'bVI',bars:2},{chord:'iiø',bars:2},{chord:'V7',bars:2}]},
  ]
};

/* ─── AI Player — travels through real progressions with sections + repeats ─── */

class Player {
  constructor() {
    this.playing = false;
    this.song = null;
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = 0;
    this.nextBarTime = 0;
    this.timer = null;
    this.previousShape = null;
    this.voicingType = 'drop2';
    this.bassPattern = 'two-feel';
    this.bassOscillators = [];
    this.totalBars = 0;
    this._cachedPage = null;
  }

  _pickBassPattern() {
    const r = Math.random();
    if (r < 0.28) return 'whole';       // root on beat 1 only — sparse, ballad
    if (r < 0.60) return 'two-feel';    // root on beats 1 and 3 — solid
    return 'fifth';                     // root on 1, fifth on 3 — boom-chuck
  }

  _pickVoicingType() {
    const r = Math.random();
    if (r < 0.70) return 'drop2';
    if (r < 0.88) return 'shell';
    return 'triad';
  }

  // Find the candidate shape of the chosen type that voice-leads best and stays anchored
  _pickShape(quality, root, type, prevShape) {
    const cands = [];
    if (type === 'drop2') {
      for (let ss = 0; ss < STRING_SETS.length; ss++) {
        for (let inv = 0; inv < 4; inv++) {
          const sh = dropTwoVoicing(quality, root, ss, inv);
          if (sh) cands.push(sh);
        }
      }
    } else if (type === 'shell') {
      ['A','B'].forEach(t => { const sh = shellVoicing(quality, root, t); if (sh) cands.push(sh); });
    } else if (type === 'triad') {
      ['top','mid','low'].forEach(t => { const sh = triadVoicing(quality, root, t); if (sh) cands.push(sh); });
    }
    if (!cands.length) return null;

    // No previous reference → strong pull to fret-6/7 sweet spot
    if (!prevShape) {
      let best = null;
      for (const sh of cands) {
        const af = avgFret(sh);
        const cost = Math.pow(Math.abs(af - 6.5), 1.7);
        if (!best || cost < best.cost) best = {shape: sh, cost};
      }
      return best.shape;
    }

    // With previous: hard-filter candidates that drift too far from previous region.
    // Then score by voice-leading smoothness + sweet-spot pull.
    const prevAvg = avgFret(prevShape);
    const REGION_LIMIT = 4.5; // max avg-fret drift between consecutive chords
    let filtered = cands.filter(sh => Math.abs(avgFret(sh) - prevAvg) <= REGION_LIMIT);
    // Also drop candidates outside playable comfort zone
    filtered = filtered.filter(sh => {
      const af = avgFret(sh);
      return af >= 1.5 && af <= 12;
    });
    if (!filtered.length) filtered = cands; // emergency fallback

    let best = null;
    const prevStrings = prevShape.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
    for (const sh of filtered) {
      // Per-string voice movement on overlapping strings
      let moveSum = 0, overlapCount = 0;
      for (let s = 0; s < 6; s++) {
        if (prevShape[s] >= 0 && sh[s] >= 0) {
          moveSum += Math.abs(sh[s] - prevShape[s]);
          overlapCount++;
        }
      }
      const af = avgFret(sh);
      const regionShift = Math.abs(af - prevAvg);
      const candStrings = sh.map((f, i) => f >= 0 ? i : -1).filter(i => i >= 0).join(',');
      const stringSetPenalty = (prevStrings === candStrings) ? 0 : 4;
      // Strong sweet-spot anchor (quadratic outside frets 4-9)
      const reg = Math.abs(af - 6.5);
      const regSpot = reg <= 2.5 ? 0 : Math.pow(reg - 2.5, 1.9);
      // Recovery bias: if previous was high or low, prefer candidates that come back toward center
      let recoveryBias = 0;
      if (prevAvg > 9.5 && af < prevAvg - 0.5) recoveryBias = -2;
      if (prevAvg < 4 && af > prevAvg + 0.5) recoveryBias = -2;
      // Weight: voice-leading * 1, region shift * 1.8, sweet-spot * 1, string set * 4, recovery * 1
      const score = (overlapCount ? moveSum : 5) + regionShift * 1.8 + stringSetPenalty + regSpot + recoveryBias;
      if (!best || score < best.score) best = {shape: sh, score};
    }
    return best ? best.shape : filtered[0];
  }

  _currentSection() { return this.song?.[this.songIdx]; }
  _currentProgression() { return this._currentSection()?.progression; }
  _currentStep() { return this._currentProgression()?.steps[this.currentStepIdx]; }
  _currentChordId() { return this._currentStep()?.chord; }

  // Look ahead to figure out the next chord that'll play (handles repeats + section transitions)
  _nextChordId() {
    const prog = this._currentProgression();
    if (!prog) return null;
    const nextStepIdx = this.currentStepIdx + 1;
    if (nextStepIdx < prog.steps.length) {
      return prog.steps[nextStepIdx].chord;
    }
    // At end of progression — will we repeat or move on?
    const section = this._currentSection();
    if (this.sectionIter + 1 < section.repeats) {
      // Repeating same progression
      return prog.steps[0].chord;
    }
    // Moving to next section
    const nextSectionIdx = (this.songIdx + 1) % this.song.length;
    return this.song[nextSectionIdx]?.progression.steps[0].chord;
  }

  _pickProgression(avoidName = null) {
    const list = PROGRESSIONS[state.tonality] || [];
    if (!list.length) return null;
    const filtered = avoidName ? list.filter(p => p.name !== avoidName) : list;
    return filtered[Math.floor(Math.random() * filtered.length)];
  }

  _repeatsFor(prog) {
    // Bias toward powers of 2 (4s and 2s) — that's how most music phrases
    const r = Math.random();
    if (prog.len <= 4) {
      // 4-bar progressions
      if (r < 0.50) return 4;  // 16 bars total (most common)
      if (r < 0.85) return 2;  // 8 bars total
      if (r < 0.95) return 3;  // 12 bars — occasional odd phrase
      return 1;                // very rare single pass
    }
    if (prog.len <= 8) {
      // 8-bar progressions
      if (r < 0.65) return 2;  // 16 bars total (standard chorus half)
      if (r < 0.90) return 1;  // 8 bars (single statement)
      return 4;                // 32 bars (extended)
    }
    // 16-bar+ progressions
    return r < 0.85 ? 1 : 2;
  }

  _generateSong() {
    // Build an AABA-style song: pick A and B progressions, optionally a bridge C
    const A = this._pickProgression();
    const B = this._pickProgression(A.name);
    const aRepeats = this._repeatsFor(A);
    const bRepeats = this._repeatsFor(B);
    // 70% chance AABA, 30% chance ABAB
    if (Math.random() < 0.7) {
      return [
        {label:'A', progression:A, repeats:aRepeats},
        {label:'A', progression:A, repeats:aRepeats},
        {label:'B', progression:B, repeats:bRepeats},
        {label:'A', progression:A, repeats:aRepeats},
      ];
    } else {
      return [
        {label:'A', progression:A, repeats:aRepeats},
        {label:'B', progression:B, repeats:bRepeats},
        {label:'A', progression:A, repeats:aRepeats},
        {label:'B', progression:B, repeats:bRepeats},
      ];
    }
  }

  start() {
    if (this.playing) return;
    const ctx = ensureAudio();
    this.playing = true;
    this.previousShape = null;
    this.song = this._generateSong();
    this.songIdx = 0;
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = this._currentStep().bars;
    this.voicingType = this._pickVoicingType();
    this.bassPattern = this._pickBassPattern();
    this.totalBars = 0;
    this._cachedPage = null;

    const wasMetronomePlaying = metronome.playing;
    if (!metronome.playing) {
      metronome.start();
      document.getElementById('met-play').classList.add('active');
      document.getElementById('met-play').textContent = '⏸';
    }
    updateBlinkRate();

    // Sync the first bar with the metronome's next downbeat so they line up
    if (wasMetronomePlaying) {
      const downbeat = metronome.nextDownbeatTime();
      this.nextBarTime = (downbeat !== null && downbeat > ctx.currentTime + 0.05)
        ? downbeat
        : ctx.currentTime + 0.08;
    } else {
      this.nextBarTime = ctx.currentTime + 0.08;
    }
    this._triggerChord(this._currentChordId());
    this._updateVisuals();

    const beatDur = 60 / metronome.bpm;
    this.nextBarTime += beatDur * 4;
    this.timer = setInterval(() => this._scheduler(), 30);
  }

  stop() {
    if (!this.playing) return;
    clearInterval(this.timer);
    this.timer = null;
    this.playing = false;
    chordDrone.stop();
    // Stop any pending bass plucks
    this.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    this.bassOscillators = [];
    state.playerVoicing = null;
    state.nextVoicing = null;
    this._upcomingType = null;
    this.forceTriggerAtNextBar = false;
    document.querySelectorAll('.map-card.playing, .map-card.next-up, .map-card.about-to-start').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start');
    });
    document.getElementById('player-info').innerHTML = '';
    document.getElementById('real-book').hidden = true;
  }

  _scheduler() {
    if (!audioCtx) return;
    const barDur = (60 / metronome.bpm) * 4;
    if (this.nextBarTime < audioCtx.currentTime + 0.12) {
      // If user jumped, trigger the new chord at THIS bar boundary instead of advancing
      if (this.forceTriggerAtNextBar) {
        this.forceTriggerAtNextBar = false;
        this._triggerChord(this._currentChordId());
        this.totalBars++;
        this._updateVisuals();
        this.nextBarTime += barDur;
        return;
      }
      this.totalBars++;
      this.barsRemaining--;
      if (this.barsRemaining <= 0) {
        // Advance to next step
        this.currentStepIdx++;
        const prog = this._currentProgression();
        if (this.currentStepIdx >= prog.steps.length) {
          // Progression ended — check if we repeat or move to next section
          const section = this._currentSection();
          this.sectionIter++;
          if (loopMode) {
            // Lock to the current section indefinitely
            this.sectionIter = 0;
            this.currentStepIdx = 0;
          } else if (this.sectionIter < section.repeats) {
            // Repeat same progression — keep same voicing type
            this.currentStepIdx = 0;
          } else {
            // Move to next section — fresh voicing type for contrast
            this.songIdx++;
            this.sectionIter = 0;
            this.currentStepIdx = 0;
            if (this.songIdx >= this.song.length) {
              this.song = this._generateSong();
              this.songIdx = 0;
            }
            this.voicingType = this._upcomingType || this._pickVoicingType();
            this._upcomingType = null;
            this.bassPattern = this._pickBassPattern();
          }
        }
        this.barsRemaining = this._currentStep().bars;
        this._triggerChord(this._currentChordId());
      }
      this._updateVisuals();
      this.nextBarTime += barDur;
    }
  }

  _triggerChord(chordId) {
    const map = currentMap();
    const ch = map.chordDefs[chordId];
    if (!ch) return;
    const root = (state.keyPc + ch.deg) % 12;

    // Use the section's committed voicing type; pick the candidate shape closest to previous
    let type = this.voicingType;
    let shape = this._pickShape(ch.quality, root, type, this.previousShape);
    // Fallback if this chord type can't be voiced this way
    if (!shape) {
      shape = this._pickShape(ch.quality, root, 'drop2', this.previousShape);
      type = 'drop2';
    }
    if (!shape) return;

    state.focusedChord = chordId;
    state.userVoicing = null;
    state.playerVoicing = { chord: chordId, shape, type };
    this.previousShape = shape;

    this._predictNextVoicing();

    const notes = shape.map((f, s) => f >= 0 ? STRING_OPEN_MIDI[s] + f : null).filter(x => x !== null);
    const vol = currentDroneVolume() * 1.8;
    chordDrone.start(notes, vol);

    // Schedule bass plucks per the current section's bass pattern
    if (bassEnabled && audioCtx && this._currentStep()) {
      const stepBars = this._currentStep().bars;
      const beatDur = 60 / metronome.bpm;
      const barDur = beatDur * 4;
      const now = audioCtx.currentTime + 0.04;
      const bassMidi = bassMidiForPc(root);
      const fifthMidi = bassMidi + 7; // fifth above root
      const bassVol = currentDroneVolume() * 0.75;
      const pattern = this.bassPattern;
      for (let b = 0; b < stepBars; b++) {
        const barStart = now + b * barDur;
        // Beat 1: always root
        const o1 = playBassPluck(bassMidi, barStart, bassVol);
        this.bassOscillators.push(...o1);
        // Beat 3: depends on pattern
        if (pattern === 'two-feel') {
          const o3 = playBassPluck(bassMidi, barStart + 2 * beatDur, bassVol);
          this.bassOscillators.push(...o3);
        } else if (pattern === 'fifth') {
          const o3 = playBassPluck(fifthMidi, barStart + 2 * beatDur, bassVol * 0.9);
          this.bassOscillators.push(...o3);
        }
        // 'whole' pattern: nothing on beat 3
      }
    }
  }

  _predictNextVoicing() {
    const nxtId = this._nextChordId();
    if (!nxtId || !state.playerVoicing?.shape) { state.nextVoicing = null; return; }

    // Determine the voicing type the next chord will use.
    // If the next chord starts a new section, pre-pick that section's type so the prediction matches actual playback.
    let nextType = this.voicingType;
    const prog = this._currentProgression();
    const isLastStepOfProg = this.currentStepIdx + 1 >= prog.steps.length;
    if (isLastStepOfProg) {
      const section = this._currentSection();
      const isLastIter = this.sectionIter + 1 >= section.repeats;
      if (isLastIter) {
        if (!this._upcomingType) this._upcomingType = this._pickVoicingType();
        nextType = this._upcomingType;
      }
    }

    const nxtCh = currentMap().chordDefs[nxtId];
    if (!nxtCh) { state.nextVoicing = null; return; }
    const nxtRoot = (state.keyPc + nxtCh.deg) % 12;
    const nxtShape = this._pickShape(nxtCh.quality, nxtRoot, nextType, state.playerVoicing.shape);
    state.nextVoicing = nxtShape ? { chord: nxtId, shape: nxtShape, type: nextType } : null;
  }

  _updateVisuals() {
    const flats = useFlatsFor(state.keyPc);
    const curId = this._currentChordId();
    const nxtId = this._nextChordId();

    // Re-render the chord map so each card's mini-fretboard reflects the latest voicing
    // (the focused chord uses state.playerVoicing; others recompute smoothest from it)
    renderChordMap();

    // Re-apply playing / next-up classes (renderChordMap creates fresh cards)
    const isLastBar = this.barsRemaining === 1;
    document.querySelectorAll('.map-card').forEach(c => {
      c.classList.remove('playing', 'next-up', 'about-to-start');
      if (c.dataset.chord === curId) c.classList.add('playing');
      else if (c.dataset.chord === nxtId) {
        c.classList.add('next-up');
        if (isLastBar) {
          void c.offsetWidth;
          c.classList.add('about-to-start');
        }
      }
    });

    const map = currentMap();
    const curStep = this._currentStep();
    const curCh = map.chordDefs[curId];
    const nxtCh = nxtId ? map.chordDefs[nxtId] : null;
    const curName = curCh ? (nameOf((state.keyPc + curCh.deg) % 12, flats) + QUALITIES[curCh.quality].sfx) : '';
    const nxtName = nxtCh ? (nameOf((state.keyPc + nxtCh.deg) % 12, flats) + QUALITIES[nxtCh.quality].sfx) : '';
    const barsLabel = this.barsRemaining === 1 ? '1 bar' : `${this.barsRemaining} bars`;

    const section = this._currentSection();
    const prog = this._currentProgression();
    const dotsHtml = prog.steps.map((step, i) => {
      let cls = '';
      if (i < this.currentStepIdx) cls = 'done';
      else if (i === this.currentStepIdx) cls = 'now';
      return `<span class="dot ${cls}"></span>`;
    }).join('');

    // Form summary: AABA visualization (current section highlighted)
    const formHtml = this.song.map((s, i) => {
      const color = s.label === 'A' ? 'var(--tag-tonic)' : s.label === 'B' ? 'var(--accent)' : 'var(--tag-borrowed)';
      const isCur = i === this.songIdx;
      return `<span style="color:${color};font-weight:${isCur?'700':'400'};opacity:${isCur?'1':'0.4'};font-family:'Cormorant Garamond',serif;font-size:13px;margin:0 1px">${s.label}</span>`;
    }).join('');

    const voicingTypeLabel = state.playerVoicing?.type
      ? `<span style="opacity:0.7;font-size:9px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-faint)">${state.playerVoicing.type} · ${this.bassPattern}</span>`
      : '';

    document.getElementById('player-info').innerHTML = `
      <span class="section-badge">${section.label}</span>
      <span style="opacity:0.7">${formHtml}</span>
      <span class="prog-name">${prog.name}</span>
      <span class="iteration">${this.sectionIter + 1}/${section.repeats}</span>
      <span class="dots">${dotsHtml}</span>
      <span class="now-chord">now <strong>${curStep.chord}</strong> ${curName}</span>
      ${voicingTypeLabel}
      <span class="bars-left">${barsLabel}</span>
      ${nxtCh ? `<span class="next-chord">→ <strong>${nxtCh.roman}</strong> ${nxtName}</span>` : ''}
    `;

    state.focusedChord = curId;
    state.userVoicing = null;
    renderAlternatives();
    renderFretboard();
    renderScaleStrip();
    this._renderRealBook();
  }

  // Compute the next N bars of chord events (handles repeats, sections, loops)
  _lookAheadBars(n = 6) {
    if (!this.song) return [];
    const result = [];
    let songIdx = this.songIdx;
    let sectionIter = this.sectionIter;
    let stepIdx = this.currentStepIdx;
    let barsLeft = this.barsRemaining;
    let totalBars = 0;
    let isFirst = true;
    let safety = 0;
    while (totalBars < n && safety++ < 30) {
      const section = this.song[songIdx];
      if (!section) break;
      const prog = section.progression;
      const step = prog.steps[stepIdx];
      if (!step) break;
      const stepBars = isFirst ? barsLeft : step.bars;
      const barsToShow = Math.min(stepBars, n - totalBars);
      result.push({
        roman: step.roman,
        chord: step.chord,
        bars: barsToShow,
        isCurrent: isFirst,
        isNextChange: false,
      });
      totalBars += barsToShow;
      isFirst = false;
      stepIdx++;
      if (stepIdx >= prog.steps.length) {
        stepIdx = 0;
        sectionIter++;
        if (loopMode) {
          sectionIter = 0;
        } else if (sectionIter >= section.repeats) {
          sectionIter = 0;
          songIdx++;
          if (songIdx >= this.song.length) break;
        }
      }
    }
    // Mark the chord right after the current as "next change"
    if (result.length >= 2) result[1].isNextChange = true;
    return result;
  }

  _renderRealBook() {
    const el = document.getElementById('real-book');
    if (!this.playing) { el.hidden = true; return; }
    el.hidden = false;
    const barInPage = this.totalBars % 4;
    // Refresh page + peek at page boundaries (or first render). Within a page, cursor moves only.
    if (barInPage === 0 || !this._cachedPage) {
      this._cachedPage = [];
      this._cachedPeek = null;
      const lookahead = this._lookAheadBars(8);
      let bar = 0;
      outer: for (const seg of lookahead) {
        for (let b = 0; b < seg.bars; b++) {
          if (bar < 4) {
            this._cachedPage.push({chord: seg.chord, barIdxInChord: b});
          } else if (bar === 4) {
            this._cachedPeek = seg.chord;
            break outer;
          }
          bar++;
        }
      }
      while (this._cachedPage.length < 4) this._cachedPage.push(null);
    }
    const flats = useFlatsFor(state.keyPc);
    const map = currentMap();
    const cellsHtml = this._cachedPage.map((cell, i) => {
      if (!cell) return `<div class="rb-cell"></div>`;
      const ch = map.chordDefs[cell.chord];
      if (!ch) return `<div class="rb-cell"></div>`;
      const root = (state.keyPc + ch.deg) % 12;
      const name = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
      const isCurrent = (i === barInPage);
      if (cell.barIdxInChord > 0) {
        return `<div class="rb-cell ${isCurrent ? 'current' : ''}"><div class="rb-continuation">%</div></div>`;
      }
      return `
        <div class="rb-cell ${isCurrent ? 'current' : ''}">
          <div class="rb-roman">${ch.roman}</div>
          <div class="rb-chord">${name}</div>
        </div>
      `;
    }).join('');
    let peekHtml = '';
    if (this._cachedPeek) {
      const ch = map.chordDefs[this._cachedPeek];
      if (ch) {
        const root = (state.keyPc + ch.deg) % 12;
        const name = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
        const imminent = barInPage === 3 ? 'imminent' : '';
        peekHtml = `<div class="rb-peek ${imminent}">→ ${name}</div>`;
      }
    }
    el.innerHTML = cellsHtml + peekHtml;
  }

  jumpTo(chordId) {
    // User clicked a chord during playback — queue the change for the next bar boundary
    // so it stays in time with the metronome.
    const list = PROGRESSIONS[state.tonality] || [];
    const matches = list.filter(p => p.steps[0].chord === chordId);
    let newProg;
    if (matches.length) {
      newProg = matches[Math.floor(Math.random() * matches.length)];
    } else {
      newProg = { name: `→ ${chordId}`, len: 2, steps: [{chord: chordId, bars: 2}] };
    }
    this.song[this.songIdx] = {
      label: this._currentSection().label,
      progression: newProg,
      repeats: this._repeatsFor(newProg),
    };
    this.sectionIter = 0;
    this.currentStepIdx = 0;
    this.barsRemaining = this._currentStep().bars;
    // Cancel any bass plucks pre-scheduled for the previous chord
    if (audioCtx) {
      const cutTime = audioCtx.currentTime + 0.05;
      this.bassOscillators.forEach(o => { try { o.stop(cutTime); } catch(e) {} });
      this.bassOscillators = [];
    }
    // Tell the scheduler to trigger the new chord audio at the next bar boundary
    this.forceTriggerAtNextBar = true;
    this._updateVisuals();
  }
}

const player = new Player();

document.getElementById('loop-toggle').addEventListener('click', e => {
  loopMode = !loopMode;
  e.target.classList.toggle('active', loopMode);
  // If player is running, immediately re-render the lookahead to reflect loop state
  if (player.playing) player._renderRealBook();
});

document.getElementById('bass-toggle').addEventListener('click', e => {
  bassEnabled = !bassEnabled;
  e.target.classList.toggle('active', bassEnabled);
  // If disabling mid-playback, stop any pending bass
  if (!bassEnabled && player.playing) {
    player.bassOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
    player.bassOscillators = [];
  }
});

document.getElementById('auto-play').addEventListener('click', e => {
  if (player.playing) {
    // Global pause: stop player + metronome (drones stay — user controls those)
    player.stop();
    if (metronome.playing) {
      metronome.stop();
      const mp = document.getElementById('met-play');
      mp.classList.remove('active');
      mp.textContent = '▶';
    }
    e.target.classList.remove('active');
    e.target.textContent = '▶ AI';
  } else {
    player.start();
    e.target.classList.add('active');
    e.target.textContent = '⏸ AI';
  }
});

/* ─── Pentatonic / scale box for the scale strip ─── */

function computeScaleBox(keyPc, tonality, targetFret = null) {
  // Use the relative minor's pentatonic — C major pent = A minor pent shape.
  const minorRootPc = (tonality === 'major') ? (keyPc + 9) % 12 : keyPc;

  // Find all anchor frets where the minor root appears on ANY string (0..N_FRETS-3)
  const anchorSet = new Set();
  for (let str = 0; str < 6; str++) {
    const openPc = STRING_OPEN_MIDI[str];
    let f = ((minorRootPc - openPc) % 12 + 12) % 12;
    while (f + 3 <= N_FRETS) {
      anchorSet.add(f);
      f += 12;
    }
  }
  const anchors = [...anchorSet].sort((a, b) => a - b);

  // Pick the anchor whose 4-fret window is closest to the target chord position.
  // Snap so that the chord lies in the middle of the window.
  let startFret;
  if (targetFret == null || !anchors.length) {
    startFret = anchors[0] ?? 0;
  } else {
    const t = Math.max(0, targetFret - 1.5);
    startFret = anchors.reduce((best, a) =>
      Math.abs(a - t) < Math.abs(best - t) ? a : best
    , anchors[0]);
  }
  const endFret = Math.min(N_FRETS, startFret + 3);

  const pentaInts = [0, 3, 5, 7, 10];
  const fullInts  = [0, 2, 3, 5, 7, 8, 10];
  const pentaPcs = new Set(pentaInts.map(i => (minorRootPc + i) % 12));
  const fullPcs  = new Set(fullInts.map(i  => (minorRootPc + i)  % 12));

  const notes = [];
  for (let str = 0; str < 6; str++) {
    for (let f = startFret; f <= endFret; f++) {
      const pc = (STRING_OPEN_MIDI[str] + f) % 12;
      if (fullPcs.has(pc)) {
        notes.push({
          string: str,
          fret: f,
          isRoot: pc === minorRootPc,
          isPenta: pentaPcs.has(pc),
        });
      }
    }
  }
  return {startFret, endFret, notes, minorRootPc};
}

function renderScaleBox(box, W = 720, H = 86) {
  const ml = 28, mr = 14, mt = 8, mb = 22;
  const innerW = W - ml - mr;
  const innerH = H - mt - mb;
  const stringSp = innerH / 5;
  const numFrets = box.endFret - box.startFret + 1;
  const fretSp = innerW / numFrets;
  const flats = useFlatsFor(state.keyPc);
  let s = '';
  // Strings (horizontal lines, low E at bottom)
  for (let str = 0; str < 6; str++) {
    const y = mt + str * stringSp;
    const stroke = (str === 0) ? 1.0 : (str === 1) ? 0.9 : (str === 2) ? 0.8 : 0.7;
    s += `<line x1="${ml}" y1="${y}" x2="${ml+innerW}" y2="${y}" stroke="#888" stroke-width="${stroke}"/>`;
  }
  // String labels on the left
  const stringLabels = ['E','B','G','D','A','E']; // s1 top → s6 bottom (high E at top)
  stringLabels.forEach((lbl, i) => {
    const y = mt + i * stringSp + 4;
    s += `<text x="${ml - 8}" y="${y}" font-size="10" fill="#7a7a82" text-anchor="end" font-family="SF Mono, monospace" font-weight="700">${lbl}</text>`;
  });
  // Fret lines (vertical)
  for (let f = 0; f <= numFrets; f++) {
    const x = ml + f * fretSp;
    const w = (f === 0) ? 2.5 : 1.2;
    s += `<line x1="${x}" y1="${mt-2}" x2="${x}" y2="${mt+innerH+2}" stroke="#1a1a1a" stroke-width="${w}"/>`;
  }
  // Fret numbers below each cell
  for (let f = 0; f < numFrets; f++) {
    const fretNum = box.startFret + f;
    const x = ml + (f + 0.5) * fretSp;
    s += `<text x="${x}" y="${H - 5}" font-size="11" fill="#5a5a64" text-anchor="middle" font-family="SF Mono, monospace">${fretNum}</text>`;
  }
  // Notes
  box.notes.forEach(n => {
    const stringIdx = 5 - n.string; // s6 (low E) at the BOTTOM
    const y = mt + stringIdx * stringSp;
    const relFret = n.fret - box.startFret;
    const x = ml + (relFret + 0.5) * fretSp;
    const pc = (STRING_OPEN_MIDI[n.string] + n.fret) % 12;
    const noteName = nameOf(pc, flats);
    if (n.isRoot) {
      s += `<circle cx="${x}" cy="${y}" r="9" fill="#dc2626" stroke="#1a1a1a" stroke-width="0.6"/>`;
      s += `<text x="${x}" y="${y + 3.5}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Inter, sans-serif">${noteName}</text>`;
    } else if (n.isPenta) {
      s += `<circle cx="${x}" cy="${y}" r="8" fill="#1a1a1a"/>`;
      s += `<text x="${x}" y="${y + 3.5}" font-size="9" font-weight="700" fill="#fdfcf3" text-anchor="middle" font-family="Inter, sans-serif">${noteName}</text>`;
    } else {
      s += `<circle cx="${x}" cy="${y}" r="7.5" fill="#fdfcf3" stroke="#1a1a1a" stroke-width="1.2" opacity="0.7"/>`;
      s += `<text x="${x}" y="${y + 3.5}" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle" font-family="Inter, sans-serif" opacity="0.7">${noteName}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

function renderScaleStrip() {
  const el = document.getElementById('scale-strip');
  if (!el) return;
  // Find the target fret from whatever voicing is "active" right now
  let targetFret = null;
  const shape = state.playerVoicing?.shape || focusedShape()?.shape;
  if (shape) {
    const fs = shape.filter(f => f >= 0);
    if (fs.length) targetFret = fs.reduce((a,b) => a+b, 0) / fs.length;
  }
  const box = computeScaleBox(state.keyPc, state.tonality, targetFret);
  const flats = useFlatsFor(state.keyPc);
  const tonicName = nameOf(state.keyPc, flats);
  const minorName = nameOf(box.minorRootPc, flats);
  const label = state.tonality === 'major'
    ? `${tonicName} maj pent`
    : `${minorName} min pent`;
  const svg = renderScaleBox(box);
  el.innerHTML = `
    <div class="scale-strip-label">
      <div class="ss-name">${label}</div>
      <div class="ss-fret">fr ${box.startFret}–${box.endFret}</div>
      <div class="scale-strip-legend">
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#dc2626"></span> root</span><br>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#1a1a1a"></span> penta</span><br>
        <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#fdfcf3;border:1px solid #1a1a1a"></span> extra</span>
      </div>
    </div>
    ${svg}
  `;
}

function renderAll() {
  renderKeyRow();
  renderScaleStrip();
  renderChordMap();
  renderAlternatives();
  renderFretboard();
  updateActiveDrones();
}

/* ─── Keyboard shortcuts: 1–7 jump to diatonic scale degrees ─── */

const DEGREE_SHORTCUTS = {
  major: {1:'I',  2:'ii',  3:'iii',  4:'IV', 5:'V',  6:'vi',  7:'bVII'},
  minor: {1:'i',  2:'iiø', 3:'bIII', 4:'iv', 5:'V7', 6:'bVI', 7:'bVII'},
};

document.addEventListener('keydown', e => {
  // Don't intercept when typing into inputs
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key);
  if (n >= 1 && n <= 7) {
    const chordId = DEGREE_SHORTCUTS[state.tonality]?.[n];
    if (chordId && currentMap().chordDefs[chordId]) {
      e.preventDefault();
      state.focusedChord = chordId;
      state.userVoicing = null;
      if (player.playing) {
        player.jumpTo(chordId);
      } else {
        renderAll();
      }
    }
  }
});

renderAll();
window.addEventListener('resize', renderFretboard);
