  animateNeckHighlight(chordHi, CHORD_NECK_GEO, 'chord', targetBox, durationMs);
}
function applyChordHighlight() { applyNeckHighlight(chordHi, CHORD_NECK_GEO, 'chord'); }

// For the chord neck: "box" = the fret span the voicing actually uses
function computeChordViewBox(shape) {
  if (!shape) return { startFret: 1, endFret: 5 };
  const fs = shape.filter(f => f > 0);  // ignore open strings
  if (!fs.length) return { startFret: 1, endFret: 5 };
  const minF = Math.min(...fs);
  const maxF = Math.max(...fs);
  return { startFret: Math.max(1, minF - 1), endFret: Math.max(minF + 4, maxF + 1) };
}

// Helper: snap a hiState to a given box and apply immediately
function snapNeckTo(hiState, geo, idPrefix, box) {
  const visible = geo.visibleFrets;
  const boxCenter = (box.startFret + box.endFret + 1) / 2;
  let win = boxCenter - visible / 2;
  const minWin = geo.firstFret - 0.3;
  const maxWin = geo.lastFret - visible + 1.3;
  win = Math.max(minWin, Math.min(maxWin, win));
  hiState.currentStart  = hiState.targetStart  = hiState.fromStart  = box.startFret;
  hiState.currentEnd    = hiState.targetEnd    = hiState.fromEnd    = box.endFret;
  hiState.currentWindow = hiState.targetWindow = hiState.fromWindow = win;
  applyNeckHighlight(hiState, geo, idPrefix);
}

function renderScaleStrip() {
  // (Re)draws both static necks and snaps highlights to the active position.
  // Called from renderAll() only (key/tonality changes) — NOT every chord change.
  renderScaleNeck();
  renderChordNeck();
  snapNeckTo(scaleHi, SCALE_NECK_GEO, 'scale', computeActiveBox());
  const shape = state.playerVoicing?.shape || focusedShape()?.shape;
  snapNeckTo(chordHi, CHORD_NECK_GEO, 'chord', computeChordViewBox(shape));
}

// Called from the player on every visual tick. Slides the highlight toward
// the NEXT chord's box during the last bar (anticipation), otherwise eases
// to the CURRENT chord's box.
function updateScaleHighlightForPlayer(player) {
  if (!player || !player.playing) return;
  // Both necks pan to the SAME window (the scale box) for visual coherence.
  // The chord neck just draws its dots inside that same window.
  const curBox = computeBoxForShape(state.playerVoicing?.shape);
  const beatDur = 60 / metronome.bpm;
  const barMs = beatDur * 4 * 1000;

  const anticipateBars = Math.min(player.barsRemaining, 2);
  const inAnticipation = state.nextVoicing && player.barsRemaining <= 2;

  let target, durMs;
  if (inAnticipation) {
    const nextBox = computeBoxForShape(state.nextVoicing.shape);
    if (nextBox.startFret === curBox.startFret && nextBox.endFret === curBox.endFret) {
      target = curBox; durMs = 700;
    } else {
      target = nextBox; durMs = barMs * (anticipateBars - 0.1);
    }
  } else {
    target = curBox; durMs = 750;
  }
  animateScaleHighlight(target, durMs);
  animateChordHighlight(target, durMs);

  // Re-paint both necks' note layers so chord tones recolor live.
  repaintChordNeckNotes();
  repaintScaleNeckNotes();
}

// Helper: build SVG markup for a single voicing's notes on the chord neck.
// preview=true gives a muted, amber-outlined preview style for the upcoming chord.
// staysSet: Set of "str.fret" keys that are common between current & next voicings
// (finger stays put across the chord change) — gets a green halo ring.
// Detect realistic barres in a voicing based on jazz pedagogy.
// String indices: 0 = high E, 1 = B, 2 = G, 3 = D, 4 = A, 5 = low E.
// Rules:
//   (1) 3+ adjacent strings on same fret → always a barre
//   (2) 2 adjacent strings on the TOP pair (E+B, indices 0+1) or G+B (1+2) → barre
//       (these are the standard partial barres — index or ring finger)
//   (3) 2 adjacent strings at the LOWEST fret of the voicing → barre (root-position index barre)
//   (4) Mid/bottom pair NOT at the lowest fret → two fingers (no barre shown)
//   (5) Bottom pair (E+A, A+D) → two fingers (would mute inner voices)
//   (6) Non-contiguous "barres" → never (just two separate fingers)
function _detectBarres(shape) {
  const fretted = shape.filter(f => f > 0);
  if (!fretted.length) return [];
  const minFret = Math.min(...fretted);
  const muted = (str) => shape[str] < 0;

  // Group fretted strings by fret position
  const byFret = {};
  for (let str = 0; str < 6; str++) {
    const f = shape[str];
    if (f <= 0) continue;
    (byFret[f] = byFret[f] || []).push(str);
  }

  const barres = [];
  for (const [fretStr, strs] of Object.entries(byFret)) {
    const fret = parseInt(fretStr, 10);
    if (strs.length < 2) continue;
    strs.sort((a,b) => a-b);

    // Must be contiguous — no string gaps within the candidate barre
    let contiguous = true;
    for (let i = 1; i < strs.length; i++) {
      if (strs[i] !== strs[i-1] + 1) { contiguous = false; break; }
    }
    if (!contiguous) continue;

    // No barre if a string inside the range is muted (we'd cross it)
    let mutedInside = false;
    for (let s = strs[0]; s <= strs[strs.length-1]; s++) {
      if (muted(s)) { mutedInside = true; break; }
    }
    if (mutedInside) continue;

    const minS = strs[0], maxS = strs[strs.length - 1];
    const span = strs.length;
    const isTopPair = span === 2 && minS === 0 && maxS === 1;          // high E + B
    const isGB     = span === 2 && minS === 1 && maxS === 2;            // B + G
    const isAtMinFret = fret === minFret;

    let isBarre = false;
    if (span >= 3) {
      isBarre = true;                                                   // (1) 3+ → barre
    } else if (isTopPair || isGB) {
      isBarre = true;                                                   // (2) top-string partial
    } else if (isAtMinFret && minS >= 2) {
      // (3) Lowest-fret index barre on inner/lower strings — only if it's
      //     actually the bottom of the voicing AND covers the lowest sounding
      //     strings of the chord (no fretted note below the barre).
      const anyFrettedBelow = shape.slice(maxS + 1).some(f => f > 0);
      isBarre = !anyFrettedBelow;
    }

    if (isBarre) barres.push({ fret, minStr: minS, maxStr: maxS });
  }
  return barres;
}

function _paintChordVoicing(shape, chordId, preview, geo, staysSet) {
  if (!shape || !chordId) return '';
  const map = currentMap();
  const ch = map.chordDefs[chordId];
  if (!ch) return '';
  const root = (state.keyPc + ch.deg) % 12;
  const q = QUALITIES[ch.quality];
  const chordDegFromRoot = {};
  q.ints.forEach((semi, i) => {
    const pc = (root + semi) % 12;
    if (!(pc in chordDegFromRoot)) chordDegFromRoot[pc] = q.degs[i];
  });
  const { mt, mb, H, firstFret, fretW } = geo;
  const ss = (H - mt - mb) / 5;
  const xOf = (f) => (f - firstFret) * fretW;
  let s = '';

  // Draw barre indicators FIRST (under the note dots) — only on the live chord, not preview
  if (!preview) {
    const barres = _detectBarres(shape);
    barres.forEach(b => {
      const cx = xOf(b.fret) + fretW / 2;
      // String y (str=0 is high E at the BOTTOM, str=5 is low E at the TOP)
      const yHigherStr = mt + (5 - b.maxStr) * ss;  // top of bar
      const yLowerStr  = mt + (5 - b.minStr) * ss;  // bottom of bar
      const barW = 78;
      const padY = 30;
      const barH = (yLowerStr - yHigherStr) + padY * 2;
      const barY = yHigherStr - padY;

      // Does the barre survive into the next chord? Count strings at this fret in staysSet.
      let staysCount = 0;
      if (staysSet) {
        for (let str = b.minStr; str <= b.maxStr; str++) {
          if (staysSet.has(`${str}.${b.fret}`)) staysCount++;
        }
      }
      const barreStays = staysCount >= 2;

      // Soft bloom around the barre when it stays into the next chord
      if (barreStays) {
        s += `<rect x="${cx - barW/2}" y="${barY}" width="${barW}" height="${barH}" rx="${barW/2}" ry="${barW/2}" fill="#f0caa0" opacity="0.78" filter="url(#chord-bloom)"/>`;
      }

      // Soft, fleshy bar that suggests an index finger laying across the strings
      s += `<rect x="${cx - barW/2}" y="${barY}" width="${barW}" height="${barH}" rx="${barW/2}" ry="${barW/2}" fill="#f0caa0" stroke="#704020" stroke-width="2" opacity="0.6"/>`;
      // Soft shading on the side to give it depth
      s += `<rect x="${cx - barW/2}" y="${barY}" width="${barW * 0.45}" height="${barH}" rx="${barW/2}" ry="${barW/2}" fill="#fde8c8" opacity="0.35"/>`;
      // Tiny nail crescent at the top
      s += `<ellipse cx="${cx}" cy="${barY + 14}" rx="${barW/2 - 14}" ry="5" fill="#fdf2e0" opacity="0.5"/>`;
    });
  }

  for (let str = 0; str < 6; str++) {
    const f = shape[str];
    if (f < 0) continue;
    const y = mt + (5 - str) * ss;
    const cx = xOf(f) + fretW/2;
    const pc = noteAt(str, f);
    const deg = chordDegFromRoot[pc] || '';
    const c = intervalColor(deg);
    const noteName = nameOf(pc, useFlatsFor(root));
    const stays = staysSet && staysSet.has(`${str}.${f}`);
    if (preview) {
      s += `<g opacity="0.4">`;
      if (stays) {
        // Sustained finger on the preview side — halo in the note's own color
        s += `<circle cx="${cx}" cy="${y}" r="34" fill="none" stroke="${c}" stroke-width="2.6" stroke-dasharray="4 3" opacity="0.7"/>`;
      }
      s += `<circle cx="${cx}" cy="${y}" r="26" fill="rgba(250,237,196,0.35)" stroke="#a07820" stroke-width="1.8" stroke-dasharray="5 4"/>`;
      s += `<circle cx="${cx}" cy="${y}" r="18" fill="${c}" opacity="0.35"/>`;
      s += `<text x="${cx}" y="${y + 3}" text-anchor="middle" font-size="13" font-weight="600" fill="#3a2a0a" pointer-events="none">${noteName}</text>`;
      s += `<text x="${cx}" y="${y + 16}" text-anchor="middle" font-size="10" font-weight="600" fill="#6b4a0e" pointer-events="none">${deg}</text>`;
      s += `</g>`;
    } else {
      if (stays) {
        // Finger stays into next chord — soft bloom in the note's own color
        s += `<circle cx="${cx}" cy="${y}" r="40" fill="${c}" opacity="0.85" filter="url(#chord-bloom)"/>`;
      }
      s += `<circle cx="${cx}" cy="${y}" r="34" fill="${c}" stroke="#000" stroke-width="2" filter="url(#chord-dropShadow)"/>`;
      s += `<text x="${cx}" y="${y + 5}" text-anchor="middle" font-size="20" font-weight="700" fill="#000" pointer-events="none">${noteName}</text>`;
      s += `<text x="${cx}" y="${y + 24}" text-anchor="middle" font-size="14" font-weight="700" fill="#000" opacity="0.7" pointer-events="none">${deg}</text>`;
    }
  }
  return s;
}

// Repaint piano keys alongside chord-neck notes
const _origRepaintWrap = (fn) => function() { fn.apply(this, arguments); paintPianoNotes(); };

// Re-render the chord-neck note dots without rebuilding the SVG (so pan transform persists).
function repaintChordNeckNotes() {
  const panInner = document.getElementById('chord-pan-inner');
  if (!panInner) return;
  let notesG = document.getElementById('chord-notes-group');
  if (!notesG) {
    notesG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    notesG.id = 'chord-notes-group';
    panInner.appendChild(notesG);
  }
  const geo = CHORD_NECK_GEO;
  const liveShape = state.playerVoicing?.shape || focusedShape()?.shape;
  const liveChordId = state.playerVoicing?.chord || state.focusedChord;
  const nextShape  = state.nextVoicing?.shape;
  const nextChordId = state.nextVoicing?.chord;

  // Compute "fingers that stay" — same string AND same fret across the two voicings
  const staysSet = new Set();
  if (liveShape && nextShape) {
    for (let str = 0; str < 6; str++) {
      if (liveShape[str] >= 0 && liveShape[str] === nextShape[str]) {
        staysSet.add(`${str}.${liveShape[str]}`);
      }
    }
  }

  let s = '';
  // Preview first so the live chord paints on top
  if (nextShape && nextChordId) {
    s += _paintChordVoicing(nextShape, nextChordId, true, geo, staysSet);
  }
  if (liveShape && liveChordId) {
    s += _paintChordVoicing(liveShape, liveChordId, false, geo, staysSet);
  }
  notesG.innerHTML = s;
  // Open strings (f === 0) sit at x = -fretW inside the pan group,
  // which the clip-path hides. Render them OUTSIDE the pan in a
  // separate group anchored to the labels strip so they're always
  // visible — and pulse so the user sees the string is ringing.
  const svg = document.getElementById('chord-neck');
  let openG = svg && svg.querySelector('#chord-open-group');
  if (!openG && svg) {
    openG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    openG.setAttribute('id', 'chord-open-group');
    svg.appendChild(openG);
  }
  if (openG) {
    openG.innerHTML = '';
    if (liveShape && liveChordId) {
      const map = currentMap();
      const ch  = map.chordDefs[liveChordId];
      if (ch) {
        const root = (state.keyPc + ch.deg) % 12;
        const q    = QUALITIES[ch.quality];
        const degFromRoot = {};
        q.ints.forEach((semi, i) => {
          const pc = (root + semi) % 12;
          if (!(pc in degFromRoot)) degFromRoot[pc] = q.degs[i];
        });
        const ss = (geo.H - geo.mt - geo.mb) / 5;
        const cx = geo.labelsW - 28;
        let parts = '';
        for (let str = 0; str < 6; str++) {
          if (liveShape[str] !== 0) continue;
          const pc = noteAt(str, 0);
          const deg = degFromRoot[pc] || '';
          const color = intervalColor(deg);
          const noteName = nameOf(pc, useFlatsFor(root));
          const cy = geo.mt + (5 - str) * ss;
          parts += `<g class="chord-open-mark">
            <circle cx="${cx}" cy="${cy}" r="22" fill="${color}" stroke="#000" stroke-width="2.5"/>
            <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="18" font-weight="800" fill="#000" pointer-events="none">${noteName}</text>
            <circle cx="${cx}" cy="${cy}" r="22" fill="none" stroke="${color}" stroke-width="3" class="chord-open-pulse"/>
            <circle cx="${cx}" cy="${cy}" r="22" fill="none" stroke="${color}" stroke-width="3" class="chord-open-pulse chord-open-pulse-2"/>
          </g>`;
        }
        openG.innerHTML = parts;
      }
    }
  }
  paintPianoNotes();   // keep the piano lit-keys in sync
}

function renderAll() {
  syncTonalityToggle();
  renderKeyRow();
  renderScaleStrip();
  renderChordMap();
  renderAlternatives();
  renderFretboard();
  updateActiveDrones();
  if (typeof renderComposeStrip === 'function') renderComposeStrip();
  if (typeof renderComposePad === 'function') renderComposePad();
  renderComposeInfo();
  if (typeof renderLandscapePlay === 'function') renderLandscapePlay();
}

/* ════════════════════════════════════════════════════════════
   LANDSCAPE PLAY VIEW
   A fullscreen "follow-along" overlay shown on mobile in
   landscape orientation while the player is active. We MOVE the
   live #chord-neck / #chord-piano / #real-book-tabs elements
   (and a freshly-built staff for piano mode) into the overlay so
   the existing renderers keep painting them in place. When the
   overlay deactivates, lp_exit() returns each element to its
   original parent at its original position.
═════════════════════════════════════════════════════════════ */
// Per-mode slot map: which live element gets reparented into which
// pane id. The originals' existing renderers keep painting them in
// place. Anything else (tabs clone for guitar) is rebuilt per tick.
const LP_SLOTS = {
  guitar: [
    { id: 'chord-neck',     target: 'lp-guitar-area' },
  ],
  piano: [
    { id: 'real-book-tabs', target: 'lp-staff-area' },
    { id: 'chord-piano',    target: 'lp-piano-area' },
  ],
};

// Build the inner DOM of #lp-body for a given mode. Called when the
// mode changes (or first enter). Slots created here are the targets
// for lp_enter's reparenting.
function lp_buildLayout(mode) {
  const body = document.getElementById('lp-body');
  if (!body) return;
  body.className = 'lp-body lp-' + mode + '-layout';
  if (mode === 'piano') {
    body.innerHTML = `
      <div class="lp-staff-area" id="lp-staff-area"></div>
      <div class="lp-bottom-row">
        <div class="lp-piano-area" id="lp-piano-area"></div>
        <div class="lp-controls-slot" id="lp-controls-slot"></div>
      </div>`;
  } else {
    // Tabs on top, bottom row split into realistic guitar neck
    // (left, fills its cell) and the brutalist controls (right).
    body.innerHTML = `
      <div class="lp-tabs-area" id="lp-tabs-area"></div>
      <div class="lp-bottom-row">
        <div class="lp-guitar-area" id="lp-guitar-area"></div>
        <div class="lp-controls-slot" id="lp-controls-slot"></div>
      </div>`;
  }
}
const lp_savedHomes = {};       // id -> { parent, nextSibling }
let   lp_currentMode = null;    // 'guitar' | 'piano' | null

function lp_park(id) {
  if (lp_savedHomes[id]) return;
  const el = document.getElementById(id);
  if (!el) return;
  lp_savedHomes[id] = { parent: el.parentNode, next: el.nextSibling };
}
function lp_restore(id) {
  const home = lp_savedHomes[id];
  if (!home) return;
  const el = document.getElementById(id);
  if (el && home.parent) {
    if (home.next && home.next.parentNode === home.parent) {
      home.parent.insertBefore(el, home.next);
    } else {
      home.parent.appendChild(el);
    }
  }
  delete lp_savedHomes[id];
}
function lp_enter(mode) {
  if (lp_currentMode === mode) return;
  if (lp_currentMode) lp_exit();
  const slots = LP_SLOTS[mode];
  if (!slots) return;
  lp_buildLayout(mode);
  slots.forEach((slot) => {
    const el = document.getElementById(slot.id);
    const target = document.getElementById(slot.target);
    if (!el || !target) return;
    lp_park(slot.id);
    target.appendChild(el);
  });
  // The realistic guitar's default viewBox (1440×640 ≈ 2.25:1) is
  // narrower than the landscape pane (~3:1). Instead of stretching
  // (distorts strings), widen the SVG and show two extra frets so
  // the natural aspect matches the box better — small letterbox
  // remains, but the fretboard stays in proportion.
  if (mode === 'guitar' && typeof CHORD_NECK_GEO !== 'undefined') {
    if (!CHORD_NECK_GEO._lpOrig) {
      CHORD_NECK_GEO._lpOrig = {
        W: CHORD_NECK_GEO.W,
        visibleFrets: CHORD_NECK_GEO.visibleFrets,
        viewW: CHORD_NECK_GEO.viewW,
        fretW: CHORD_NECK_GEO.fretW,
        contentW: CHORD_NECK_GEO.contentW,
      };
    }
    // Match the landscape pane's aspect (~3.75:1 on typical mobile
     // landscape) so meet stops letterboxing. Bumped frets to 10 too.
    CHORD_NECK_GEO.W = 2400;
    CHORD_NECK_GEO.visibleFrets = 10;
    CHORD_NECK_GEO.viewW    = CHORD_NECK_GEO.W - CHORD_NECK_GEO.labelsW;
    CHORD_NECK_GEO.fretW    = CHORD_NECK_GEO.viewW / CHORD_NECK_GEO.visibleFrets;
    CHORD_NECK_GEO.contentW = (CHORD_NECK_GEO.lastFret - CHORD_NECK_GEO.firstFret + 1) * CHORD_NECK_GEO.fretW;
    if (typeof renderChordNeck === 'function') renderChordNeck();
  }
  // Embed the controls strip into the built layout (piano mode) or
  // leave it floating in the overlay corner (guitar mode).
  const controls = document.getElementById('lp-controls');
  const slot = document.getElementById('lp-controls-slot');
  if (controls) {
    if (slot) slot.appendChild(controls);
    else document.getElementById('landscape-play').appendChild(controls);
  }
  lp_currentMode = mode;
}
function lp_exit() {
  if (!lp_currentMode) return;
  const slots = LP_SLOTS[lp_currentMode] || [];
  slots.forEach((slot) => lp_restore(slot.id));
  // Restore the chord-neck geo so portrait/desktop go back to the
  // original 7-fret zoom.
  if (typeof CHORD_NECK_GEO !== 'undefined' && CHORD_NECK_GEO._lpOrig) {
    Object.assign(CHORD_NECK_GEO, CHORD_NECK_GEO._lpOrig);
    delete CHORD_NECK_GEO._lpOrig;
    if (typeof renderChordNeck === 'function') renderChordNeck();
  }
  // Rescue the controls element back to the overlay root before
  // we wipe lp-body — otherwise the controls (a child of the slot
  // inside lp-body) get destroyed and never come back.
  const controls = document.getElementById('lp-controls');
  const overlay  = document.getElementById('landscape-play');
  if (controls && overlay && !overlay.contains(controls)) overlay.appendChild(controls);
  else if (controls && overlay && controls.parentNode !== overlay) overlay.appendChild(controls);
  const body = document.getElementById('lp-body');
  if (body) { body.innerHTML = ''; body.className = 'lp-body'; }
  lp_currentMode = null;
}

function renderLandscapePlay() {
  const overlay = document.getElementById('landscape-play');
  if (!overlay) return;
  const onOverlay = document.body.classList.contains('lp-on')
                 && document.body.classList.contains('player-active');
  if (!onOverlay) { lp_exit(); return; }
  // Enter / switch mode based on the current instrument.
  lp_enter(state.instrument === 'piano' ? 'piano' : 'guitar');

  // ── Header: now-playing + next-up chord names ─────────────
  const curId = (player && player._currentChordId && player._currentChordId()) || state.focusedChord;
  const nxtId = (player && player._nextChordId && player._nextChordId()) || null;
  const map = currentMap();
  const curDef = curId && map.chordDefs[curId];
  const nxtDef = nxtId && map.chordDefs[nxtId];
  const nowName = document.getElementById('lp-now-name');
  const nowRoman = document.getElementById('lp-now-roman');
  const nextName = document.getElementById('lp-next-name');
  if (nowName)  nowName.textContent  = curDef ? (curDef.name || curId) : '—';
  if (nowRoman) nowRoman.textContent = (curDef && curDef.roman) ? curDef.roman : '';
  if (nextName) nextName.textContent = nxtDef ? (nxtDef.name || nxtId) : '—';

  // ── Body content ─────────────────────────────────────────
  // Live elements (chord-neck for guitar, chord-piano for piano) are
  // reparented by lp_enter so their existing renderers keep working.
  // The OTHER pane is built fresh on every tick: tabs clone for
  // guitar, staff SVG for piano.
  if (state.instrument === 'piano') {
    // Piano landscape uses the LIVE #real-book-tabs (reparented by
    // lp_enter) so its rendering matches vertical play mode exactly.
    // Nothing to rebuild here — the strip's own renderer keeps it
    // in sync as the player advances.
  } else {
    // Guitar tabs: clone the compose strip into the top tabs area.
    // Cloned (not reparented) so the source keeps its compose
    // layout. Cache by content signature to avoid expensive rebuilds
    // on every player tick.
    const tabsHost = document.getElementById('lp-tabs-area');
    const tabsSrc = document.getElementById('real-book-tabs');
    if (tabsHost && tabsSrc) {
      const sig = tabsSrc.innerHTML.length + ':' + tabsSrc.children.length;
      if (tabsHost.dataset.tabsSig !== sig) {
        tabsHost.dataset.tabsSig = sig;
        tabsHost.innerHTML = '';
        const clone = tabsSrc.cloneNode(true);
        clone.removeAttribute('id');
        clone.removeAttribute('hidden');
        tabsHost.appendChild(clone);
      } else {
        // Same content, just re-apply the `current` class so the
        // highlighted cell follows the playback head.
        const clone = tabsHost.firstElementChild;
        if (clone) {
          const srcCells = tabsSrc.querySelectorAll('.rb-tab-cell');
          const dstCells = clone.querySelectorAll('.rb-tab-cell');
          srcCells.forEach((s, i) => {
            const d = dstCells[i];
            if (!d) return;
            d.classList.toggle('current',  s.classList.contains('current'));
            d.classList.toggle('imminent', s.classList.contains('imminent'));
          });
        }
      }
    }
  }

  // Keep the corner play / loop buttons in sync with the main UI.
  if (typeof lp_syncControls === 'function') lp_syncControls();
  // Update the main loop button's section letter badge so the
  // user sees A/B/etc. matching what's currently playing.
  if (typeof syncLoopSectionBadge === 'function') syncLoopSectionBadge();

  // ── Progression strip at the bottom ──────────────────────
  const prog = document.getElementById('lp-prog');
  if (prog) {
    prog.innerHTML = '';
    const steps = player?._currentSection?.()?.progression?.steps || [];
    const stepIdx = player?.currentStepIdx ?? -1;
    steps.forEach((step, i) => {
      const def = map.chordDefs[step.chord];
      const div = document.createElement('div');
      div.className = 'lp-cell';
      if (i === stepIdx) div.classList.add('playing');
      else if (i === stepIdx + 1) div.classList.add('next-up');
      div.textContent = def ? (def.name || step.chord) : step.chord;
      prog.appendChild(div);
    });
  }
}

// Wire the four corner controls. Each button proxies the existing
// main-UI action so the same code path runs (and so the main UI
// stays in sync when the user rotates back to portrait).
(function wireLandscapeControls() {
  const playBtn  = document.getElementById('lp-play');
  const stopBtn  = document.getElementById('lp-stop');
  const loopBtn  = document.getElementById('lp-loop');
  const cycleBtn = document.getElementById('lp-cycle');
  if (playBtn) playBtn.addEventListener('click', () => {
    const real = document.getElementById('auto-play');
    if (real) real.click();
  });
  if (stopBtn) stopBtn.addEventListener('click', () => {
    const real = document.getElementById('auto-stop');
    if (real) real.click();
  });
  if (loopBtn) loopBtn.addEventListener('click', () => {
    const real = document.getElementById('loop-toggle');
    if (real) real.click();
  });
  // Key cycle: proxies the main #cycle-toggle button. Its tap
  // rotates the cycle mode (off → semitones → fourths → …); we
  // mirror its current label text in `lp_syncControls`.
  if (cycleBtn) cycleBtn.addEventListener('click', () => {
    const real = document.getElementById('cycle-toggle');
    if (real) real.click();
  });
})();

// Sync the corner buttons' visual state to match the main toolbar
// (playing → red ⏸ icon, loop active → highlighted).
// Update the section letter shown in the loop button's badge. Reads
// the live player section when one is playing; falls back to the
// first section of the composed/generated song when idle so the
// user sees which section will start when they hit play.
function syncLoopSectionBadge() {
  const btn = document.getElementById('loop-toggle');
  if (!btn) return;
  // Badge value matches the loop mode directly: "4" / "8" / "S".
  // Empty when loop is off (no badge shown via :not(.active) CSS).
  // Badge value matches the loop mode. For section, show the actual
  // bar length of the anchored section (4 / 8 / 16 / etc.).
  const sectionLen = (loopMode === 'section' && player._loopAnchor)
    ? player._loopAnchor.length : 0;
  const label = loopMode === 'bars-4' ? '4'
              : loopMode === 'section' ? (sectionLen ? String(sectionLen) : 'S')
              : loopMode === 'song'   ? 'S' : '';
  btn.dataset.section = label;
  // Propagate to the mobile transport loop button so its badge stays
  // in sync.
  if (typeof syncMobileTransport === 'function') syncMobileTransport();
}

function lp_syncControls() {
  const play = document.getElementById('lp-play');
  const stop = document.getElementById('lp-stop');
  const isPlaying = !!(typeof player !== 'undefined' && player && player.playing);
  const isPaused  = !!(typeof player !== 'undefined' && player && player.paused);
  if (play) {
    // SVG icons swap via CSS based on .active — don't touch textContent
    // (would wipe the SVGs).
    play.classList.toggle('active', isPlaying);
    play.classList.toggle('paused', isPaused);
    play.title = isPlaying ? 'Pause' : isPaused ? 'Resume' : 'Start';
  }
  // Stop only shows when there's something to halt.
  if (stop) {
    stop.hidden = !(isPlaying || isPaused);
    stop.classList.toggle('armed', !!player._stopArmed);
    stop.title = player._stopArmed ? 'Tap again to clear' : 'Rewind / stop';
  }
  const loop = document.getElementById('lp-loop');
  if (loop) {
    const isOn = loopMode !== 'off';
    loop.classList.toggle('active', isOn);
    loop.classList.toggle('loop-song', loopMode === 'song');
    // Bar-count badge (matches the toolbar / mobile transport) so the
    // user sees "this loop is N bars" at a glance.
    const realLoop = document.getElementById('loop-toggle');
    if (realLoop && realLoop.dataset.section) {
      loop.dataset.section = realLoop.dataset.section;
    }
    loop.title = loopMode === 'off' ? 'loop off'
      : loopMode === 'bars-4'  ? 'looping 4 bars'
      : loopMode === 'section' ? 'looping section'
                                 : 'looping song';
  }
  // Cycle: mirror the main #cycle-toggle label (· / +1 / IV / etc.)
  const cycle = document.getElementById('lp-cycle');
  const realCycle = document.getElementById('cycle-toggle');
  if (cycle && realCycle) {
    cycle.textContent = realCycle.textContent || '·';
    cycle.classList.toggle('active', realCycle.classList.contains('active'));
    if (realCycle.title) cycle.title = realCycle.title;
  }
  // Chord info window (top row of the landscape controls) — mirrors
  // the green player-info bar: current chord name + voicing type.
  const infoName = document.getElementById('lp-info-name');
  const infoSub  = document.getElementById('lp-info-sub');
  if (infoName && infoSub) {
    const map = currentMap();
    const flats = useFlatsFor(state.keyPc);
    let chordId = null, type = null;
    if (state.playerVoicing && state.playerVoicing.chord) {
      chordId = state.playerVoicing.chord;
      type    = state.playerVoicing.type;
    } else if (state.focusedChord) {
      chordId = state.focusedChord;
    }
    const ch = chordId ? map.chordDefs[chordId] : null;
    if (ch) {
      const root = (state.keyPc + ch.deg) % 12;
      infoName.textContent = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
      const TLBL = { drop2: 'DROP-2', drop3: 'DROP-3', shell: 'SHELLS', triad: 'TRIAD', guide: 'GUIDE', sus: 'SUS' };
      const typeLabel = type ? (TLBL[type] || type.toUpperCase()) : '';
      const roman = ch.roman || '';
      infoSub.textContent = [roman, typeLabel].filter(Boolean).join(' · ');
    } else {
      infoName.textContent = '—';
      infoSub.textContent = '';
    }
  }
}

// Toggle body.lp-on based on orientation + touch capability. The
// overlay's CSS only paints when `lp-on` AND `player-active` are
// both present, so we don't need to also gate on play state here.
(function wireLandscapePlayToggle() {
  const mql = window.matchMedia('(orientation: landscape) and (pointer: coarse)');
  const apply = () => {
    document.body.classList.toggle('lp-on', mql.matches);
    if (mql.matches && typeof renderLandscapePlay === 'function') {
      renderLandscapePlay();
    }
    if (mql.matches && typeof renderLandscapeStandby === 'function') {
      renderLandscapeStandby();
    }
  };
  if (mql.addEventListener) mql.addEventListener('change', apply);
  else if (mql.addListener) mql.addListener(apply);   // Safari < 14
  apply();
})();

/* ════════════════════════════════════════════════════════════
   LANDSCAPE STANDBY
   Big remote-control menu shown in landscape when the player
   is idle. Syncs key/bpm/toggles from the main UI so you can
   configure and launch without rotating back to portrait.
═════════════════════════════════════════════════════════════ */
function renderLandscapeStandby() {
  const el = document.getElementById('landscape-standby');
  if (!el) return;
  const visible = document.body.classList.contains('lp-on')
               && !document.body.classList.contains('player-active');
  if (!visible) return;

  // Key display
  const keyEl = document.getElementById('ls-key');
  if (keyEl) {
    const flats = useFlatsFor(state.keyPc);
    keyEl.textContent = nameOf(state.keyPc, flats);
  }
  // Tonality
  const tonEl = document.getElementById('ls-tonality');
  if (tonEl) tonEl.textContent = state.tonality;

  // BPM
  const bpmEl = document.getElementById('ls-bpm-val');
  if (bpmEl) bpmEl.textContent = metronome.bpm || 120;

  // Loop button state — yellow when on, label shows mode
  const loopBtn = document.getElementById('ls-loop');
  if (loopBtn) {
    const isOn = loopMode !== 'off';
    loopBtn.classList.toggle('ls-active', false);
    loopBtn.classList.toggle('ls-loop-on', isOn);
    loopBtn.textContent = loopMode === 'off'    ? '⟲ Loop'
      : loopMode === 'bars-4' ? '⟲ 4 bars'
      : loopMode === 'section' ? '⟲ Section'
                              : '⟲ Song';
  }

  // Cycle button state
  const cycleBtn = document.getElementById('ls-cycle');
  const realCycle = document.getElementById('cycle-toggle');
  if (cycleBtn && realCycle) {
    const label = realCycle.textContent || '·';
    cycleBtn.textContent = (label === '·') ? '· PITCHED' : label + ' PITCHED';
    cycleBtn.classList.toggle('ls-active', realCycle.classList.contains('active'));
  }

  // Sound button — show current instrument
  const soundBtn = document.getElementById('ls-sound');
  if (soundBtn) {
    soundBtn.textContent = state.instrument === 'piano' ? '🎹 Piano' : '🎸 Guitar';
  }
}

// Wire standby buttons
(function wireLandscapeStandby() {
  // Play → proxy the real AI play button
  const playBtn = document.getElementById('ls-play');
  if (playBtn) playBtn.addEventListener('click', () => {
    const real = document.getElementById('auto-play');
    if (real) real.click();
  });

  // Key tap → cycle through the 12 keys
  const keyEl = document.getElementById('ls-key');
  if (keyEl) keyEl.addEventListener('click', () => {
    state.keyPc = (state.keyPc + 1) % 12;
    if (typeof render === 'function') render();
    renderLandscapeStandby();
  });

  // Tonality tap → toggle major/minor
  const tonEl = document.getElementById('ls-tonality');
  if (tonEl) tonEl.addEventListener('click', () => {
    const btns = document.querySelectorAll('#tonality-toggle button');
    const target = state.tonality === 'major' ? 'minor' : 'major';
    btns.forEach(b => { if (b.dataset.tonality === target) b.click(); });
    renderLandscapeStandby();
  });

  // BPM drag up/down to adjust (mirrors the portrait BPM compact)
  const bpmEl = document.getElementById('ls-bpm-val');
  if (bpmEl) {
    let dragY = null, dragBpm = null, moved = false;
    function lsBpmMove(e) {
      if (dragY === null) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const delta = Math.round((dragY - y) / 3);
      if (Math.abs(delta) > 0) moved = true;
      setBpm(dragBpm + delta);
      renderLandscapeStandby();
    }
    function lsBpmEnd() {
      dragY = null;
      document.removeEventListener('mousemove', lsBpmMove);
      document.removeEventListener('mouseup', lsBpmEnd);
      document.removeEventListener('touchmove', lsBpmMove);
      document.removeEventListener('touchend', lsBpmEnd);
    }
    bpmEl.addEventListener('mousedown', e => {
      dragY = e.clientY; dragBpm = metronome.bpm; moved = false;
      document.addEventListener('mousemove', lsBpmMove);
      document.addEventListener('mouseup', lsBpmEnd);
    });
    bpmEl.addEventListener('touchstart', e => {
      dragY = e.touches[0].clientY; dragBpm = metronome.bpm; moved = false;
      document.addEventListener('touchmove', lsBpmMove, {passive: true});
      document.addEventListener('touchend', lsBpmEnd);
    }, {passive: true});
  }

  // Loop → proxy the real loop-toggle (which now cycles 3 states)
  const loopBtn = document.getElementById('ls-loop');
  if (loopBtn) loopBtn.addEventListener('click', () => {
    const real = document.getElementById('loop-toggle');
    if (real) real.click();
    // renderLandscapeStandby is called by the loop-toggle handler
  });

  // Cycle → proxy
  const cycleBtn = document.getElementById('ls-cycle');
  if (cycleBtn) cycleBtn.addEventListener('click', () => {
    const real = document.getElementById('cycle-toggle');
    if (real) real.click();
    renderLandscapeStandby();
  });

  // Sound → toggle instrument
  const soundBtn = document.getElementById('ls-sound');
  if (soundBtn) soundBtn.addEventListener('click', () => {
    const real = document.getElementById('instrument-btn');
    if (real) real.click();
    renderLandscapeStandby();
  });

  // Swipe left/right on standby or play overlay → toggle guitar/piano
  function wireSwipeInstrument(el) {
    if (!el) return;
    let startX = null, startY = null;
    el.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: true});
    el.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      startX = null;
      // Only trigger on horizontal swipes (dx > 60px, mostly horizontal)
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        const real = document.getElementById('instrument-btn');
        if (real) real.click();
        if (typeof renderLandscapeStandby === 'function') renderLandscapeStandby();
      }
    }, {passive: true});
  }
  wireSwipeInstrument(document.getElementById('landscape-standby'));
  wireSwipeInstrument(document.getElementById('landscape-play'));
  // Mobile vertical: hook the same swipe on the realistic guitar /
  // piano panel (the chord neck below the strip) so the user can
  // flick between instruments without hunting for the 🎸/🎹 button.
  // Only attach on coarse-pointer (touch) devices to avoid hijacking
  // accidental mouse drags on desktop.
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    wireSwipeInstrument(document.querySelector('.map-side-panel'));
  }
})();

// Compose-mode counterpart of the player's green info bar. While the AI isn't
// playing, the bar still has useful real estate — show the focused chord and
// the voicing being inspected (type, inversion, string set, fret position).
// When the player IS playing, this is a no-op (the player owns the bar).
function renderComposeInfo() {
  const el = document.getElementById('player-info');
  if (!el) return;
  if (player && (player.playing || player.paused)) return;   // player owns the bar while playing OR paused
  const fcId = state.focusedChord;
  const map = currentMap();
  const ch = fcId && map.chordDefs[fcId];
  if (!ch) { el.innerHTML = ''; return; }
  const flats = useFlatsFor(state.keyPc);
  const root  = (state.keyPc + ch.deg) % 12;
  const name  = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
  const fs    = focusedShape();
  // Voicing-type label — prefer explicit type from userVoicing/focusedShape;
  // fall back to the global voicingPref when nothing more specific is known.
  const typeRaw = fs?.type || state.userVoicing?.type || (window.voicingPref && voicingPref !== 'all' ? voicingPref : 'drop2');
  const TYPE_LABEL = { drop2: 'DROP-2', drop3: 'DROP-3', shell: 'SHELLS', triad: 'TRIAD', guide: 'GUIDE', sus: 'SUS' };
  const typeLabel = TYPE_LABEL[typeRaw] || typeRaw.toUpperCase();
  // Inversion + string-set when available (drop-2 path).
  const SET_LABEL = ['LOW', 'MID', 'TOP'];
  const INV_LABEL = ['root pos', '1st inv', '2nd inv', '3rd inv'];
  const inv = fs?.inversion;
  const ss  = fs?.stringSetIdx;
  let detail = '';
  if (Number.isInteger(inv) && Number.isInteger(ss)) {
    detail = `${INV_LABEL[inv] || ('inv ' + inv)} · ${SET_LABEL[ss] || ('set ' + ss)} set`;
  }
  // Average fret as a quick "where on the neck" reading.
  let fretTxt = '';
  if (fs?.shape) {
    const af = Math.round(avgFret(fs.shape));
    if (Number.isFinite(af) && af > 0) fretTxt = `fret&nbsp;${af}`;
  }
  // Position counter inside the current voicing family — "3/12" tells the
  // user how many more voicings live in this technique before cycling
  // wraps. Only shown in compose mode (the AI's own info bar is busy with
  // progression state and doesn't need this).
  let posTxt = '';
  if (fs?.shape && typeRaw) {
    const family = allDistinctVoicings(ch.quality, root).filter(c => c.type === typeRaw);
    if (family.length > 1) {
      const idx = family.findIndex(c => c.shape.every((f, i) => f === fs.shape[i]));
      if (idx >= 0) posTxt = `${idx + 1}/${family.length}`;
    }
  }
  // Key chip (matches the player's pi-key styling).
  const keyName = nameOf(state.keyPc, flats);
  const tq = state.tonality === 'major' ? 'MAJ' : 'MIN';
  const keyHtml = `<span class="pi-key">${keyName}<span class="pi-key-q">${tq}</span></span>`;
  // Chord name uses the same italic-serif pi-prog class so it visually
  // rhymes with the playback bar's progression name.
  const chordHtml = `<span class="pi-prog">${name}</span>`;
  const romanHtml = `<span class="pi-iter">${ch.roman}</span>`;
  const posChip   = posTxt ? `<span class="pi-step">${posTxt}</span>` : '';
  const typeHtml  = `<span class="pi-voicing">${typeLabel}${detail ? ' · ' + detail : ''}</span>${posChip}`;
  const fretHtml  = fretTxt ? `<span class="pi-iter">${fretTxt}</span>` : '';
  el.innerHTML = `
    ${keyHtml}
    <span class="pi-div"></span>
    ${chordHtml}
    ${romanHtml}
    <span class="pi-div"></span>
    ${typeHtml}
    ${fretHtml ? '<span class="pi-spacer"></span>' + fretHtml : ''}
  `;
}

// ─── Beat counter loop: drives the 1-2-3-4 lights in the player-info bar ───
// Reads from audioCtx + player.nextBarTime so it stays phase-locked with the
// actual scheduled chord changes (no drift, no separate clock).
let _beatLoopId = null;
function startBeatCounterLoop() {
  if (_beatLoopId) return;
  let lastBeat = -1;
  let lastCountIn = null;
  let lastSubSlot = -1;
  let lastSubCell = -1;
  function tick() {
    if (!player || !player.playing || !audioCtx) {
      _beatLoopId = null;
      // Clear any lingering active-slot highlight on stop
      document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
      return;
    }
    const beatDur = 60 / metronome.bpm;
    const barDur = beatDur * 4;
    const barStart = player.nextBarTime - barDur;
    const elapsed = audioCtx.currentTime - barStart;
    const beatInBar = ((Math.floor(elapsed / beatDur) % 4) + 4) % 4;
    const inCountIn = !!(player._countInUntil && audioCtx.currentTime < player._countInUntil - 0.02);
    if (beatInBar !== lastBeat || inCountIn !== lastCountIn) {
      lastBeat = beatInBar;
      lastCountIn = inCountIn;
      const beatsEl = document.querySelector('#player-info .pi-beats');
      if (beatsEl) beatsEl.classList.toggle('count-in', inCountIn);
      document.querySelectorAll('#player-info .pi-beat').forEach((el, i) => {
        el.classList.toggle('on', i === beatInBar);
      });
    }
    // Subdivision slot animation: highlight the segment currently sounding
    // on the CURRENT cell's playback bar. During count-in nothing's
    // actually playing yet — keep the bar static.
    const cellInPage = player.totalBars % 4;
    const planned = player._cachedPage && player._cachedPage[cellInPage];
    const subN = (planned && planned.subdivisions) || 1;
    if (subN > 1 && elapsed >= 0 && !inCountIn) {
      const slotDur = barDur / subN;
      const slot = Math.min(subN - 1, Math.max(0, Math.floor(elapsed / slotDur)));
      const muted = (planned.subdivMute || [])[slot];
      if (slot !== lastSubSlot || cellInPage !== lastSubCell) {
        document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
        if (!muted) {
          const seg = document.querySelector(`[data-pb-cell="${cellInPage}"][data-pb-seg="${slot}"]`);
          if (seg) {
            // Force restart of the CSS animation by toggling the class off/on
            seg.classList.remove('pb-on');
            void seg.offsetWidth;
            seg.classList.add('pb-on');
          }
        }
        lastSubSlot = slot;
        lastSubCell = cellInPage;
      }
    } else if (lastSubSlot !== -1 || inCountIn) {
      // Either out of subdivisions or we're in count-in — clear any leftover.
      document.querySelectorAll('.subdiv-seg.pb-on').forEach(el => el.classList.remove('pb-on'));
      lastSubSlot = -1;
      lastSubCell = -1;
    }
    _beatLoopId = requestAnimationFrame(tick);
  }
  _beatLoopId = requestAnimationFrame(tick);
}

// Mobile chord-map overlay: toggle, close on backdrop tap, close after picking a chord
(function wireMobileMapToggle() {
  const btn      = document.getElementById('map-mobile-toggle');
  const backdrop = document.getElementById('map-mobile-backdrop');
  if (!btn || !backdrop) return;
  const host = document.querySelector('.chord-map-host');
  const mapEl = document.querySelector('.chord-map');
  function fitMap() {
    if (!host || !mapEl) return;
    if (!document.body.classList.contains('map-overlay-open')) return;
    // Reset scale + nominal box so measurements are stable
    mapEl.style.setProperty('--map-scale', '1');
    mapEl.style.width  = '540px';
    mapEl.style.height = '800px';
    // Measure real content extents
    let contentW = 540, contentH = 800;
    mapEl.querySelectorAll('.map-card').forEach(c => {
      contentW = Math.max(contentW, c.offsetLeft + c.offsetWidth);
      contentH = Math.max(contentH, c.offsetTop  + c.offsetHeight);
    });
    // Use the visual viewport when available — innerHeight on mobile lies while
    // the URL bar is showing, which was making the slot too tall and spilling
    // past the top of the actual visible area.
    const vv = window.visualViewport;
    const vw = vv ? vv.width  : window.innerWidth;
    const vh = vv ? vv.height : window.innerHeight;
    // Reserve room for the toggle bar + safe area below AND the header above
    const toggleBarH = 48;
    const headerH    = 60;
    const padX = 24, padY = 18;
    const availW = Math.max(0, vw - padX);
    // Cap the slot to a sensible fraction of the visual viewport so even on
    // small phones the map can never be taller than what's actually visible.
    // Reserve room for the compose strip too (~280px on mobile) so the chord
     // preview never gets buried behind the map overlay.
    const composeStripH = 280;
    const maxSlotH = Math.max(180, Math.min(vh * 0.42, vh - toggleBarH - headerH - composeStripH));
    const scaleW = availW    / contentW;
    const scaleH = (maxSlotH - padY) / contentH;
    const scale  = Math.min(scaleW, scaleH);
    mapEl.style.setProperty('--map-scale', scale.toFixed(4));
    mapEl.style.width  = contentW + 'px';
    mapEl.style.height = contentH + 'px';
    const slotH = Math.min(maxSlotH, Math.ceil(contentH * scale + padY));
    host.style.height = slotH + 'px';
  }
  function close() {
    document.body.classList.remove('map-overlay-open');
    btn.textContent = '🗺 Map';
  }
  function open() {
    document.body.classList.add('map-overlay-open');
    btn.textContent = '⌨ Keys';
    requestAnimationFrame(fitMap);
  }
  window.addEventListener('resize', fitMap);
  window.addEventListener('orientationchange', () => setTimeout(fitMap, 200));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitMap);
    window.visualViewport.addEventListener('scroll', fitMap);
  }
  btn.addEventListener('click', () => {
    document.body.classList.contains('map-overlay-open') ? close() : open();
  });
  // Map is an *alternative* to the keypad in the same slot — stays open while the
  // user taps multiple chords. They flip back to the dialer with the same button.
})();

/* ─── Keyboard shortcuts: 1–7 jump to diatonic scale degrees ─── */

const DEGREE_SHORTCUTS = {
  // Number 7 binds to the diatonic vii° in major (was bVII before — bVII
  // still lives in the chord map, just no longer on the number pad).
  major: {1:'I',  2:'ii',  3:'iii',  4:'IV', 5:'V',  6:'vi',  7:'vii'},
  minor: {1:'i',  2:'iiø', 3:'bIII', 4:'iv', 5:'V7', 6:'bVI', 7:'bVII'},
};

/* Master voicing catalog for a chord — DEDUPED across every technique.
   Ordered: drop-2 → shells → triads → guides → sus, register-ascending
   within each group. Used by the inversion cycle so the user can step
   through every distinct voicing the app knows how to play, instead of
   just the drop-2 column.
   Each entry: {shape, type, ...meta}. meta carries stringSetIdx/inversion
   (drop-2/sus) or stringSet (shells/triads/guides) so the green info bar
   can describe what's currently selected. */
function allDistinctVoicings(quality, rootPc, opts = {}) {
  const out = [];
  const seen = new Set();
  const keyOf = (sh) => sh.map((f, s) => f >= 0 ? `${s}.${f}` : '').filter(Boolean).sort().join(',');
  // Skip the playability filter for piano (no fret constraints) or when
  // an explicit opts.allShapes is passed — used by transpose-rebuild
  // so a voicing defined in piano keeps its coordinate across keys
  // even when the user later switches to guitar.
  const needsPlayable = !opts.allShapes && state.instrument !== 'piano';
  const add = (sh, type, meta = {}) => {
    if (!sh) return;
    if (needsPlayable && !isPlayableShape(sh)) return;
    const k = keyOf(sh);
    if (seen.has(k)) return;
    seen.add(k);
    out.push({ shape: sh, type, ...meta });
  };
  const byReg = (a, b) => avgFret(a.shape) - avgFret(b.shape);
  // Octave-shift a shape by +12 frets on every fretted string. Same
  // pitches, higher position. Returns null if any fret would exceed
  // the playable range so callers can stop ascending.
  const octaveUp = (sh) => {
    const shifted = sh.map(f => f >= 0 ? f + 12 : -1);
    return shifted.every(f => f === -1 || f <= N_FRETS) ? shifted : null;
  };
  // For each base voicing the builder returns, expand vertically by
  // adding every higher-octave copy that still fits on the neck.
  // Big range boost for chord types whose root sits low (drop-2 EADG
  // set 0 inv 0 used to be the only option — now we get the 12-fret-up
  // copy too, sometimes a third one in the upper register).
  const withOctaves = (push, baseSh) => {
    let sh = baseSh;
    while (sh) {
      push(sh);
      sh = octaveUp(sh);
    }
  };

  // 1. Drop-2 (3 string sets × 4 inversions × N octaves)
  const drops = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = dropTwoVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => drops.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  drops.sort(byReg).forEach(d => add(d.shape, 'drop2', { stringSetIdx: d.stringSetIdx, inversion: d.inversion }));

  // 1.5 Drop-3 (2 skipped-string sets × 4 inversions × N octaves) —
  // wider 4-note voicings; the "missing link" between shells and
  // drop-2. Uses DROP3_STRING_SETS (skip 5th or skip 4th) for the
  // idiomatic guitar drop-3 sound — the skipped middle string is
  // what gives the bass its breathing room.
  const drop3s = [];
  for (let ss = 0; ss < DROP3_STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = dropThreeVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => drop3s.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  drop3s.sort(byReg).forEach(d => add(d.shape, 'drop3', { stringSetIdx: d.stringSetIdx, inversion: d.inversion }));

  // 2. Shells (2 root-position string sets — no rotations on guitar)
  const shells = [];
  ['A','B'].forEach(t => {
    const base = shellVoicing(quality, rootPc, t);
    if (!base) return;
    withOctaves(sh => shells.push({ shape: sh, stringSet: t }), base);
  });
  shells.sort(byReg).forEach(s => add(s.shape, 'shell', { stringSet: s.stringSet }));

  // 3. Triads (3 string positions × N octaves)
  const triads = [];
  ['top','mid','low'].forEach(t => {
    const base = triadVoicing(quality, rootPc, t);
    if (!base) return;
    withOctaves(sh => triads.push({ shape: sh, stringSet: t }), base);
  });
  triads.sort(byReg).forEach(t => add(t.shape, 'triad', { stringSet: t.stringSet }));

  // 4. Guide tones (2 string sets × N octaves)
  const guides = [];
  ['A','B'].forEach(t => {
    const base = guideToneVoicing(quality, rootPc, t);
    if (!base) return;
    withOctaves(sh => guides.push({ shape: sh, stringSet: t }), base);
  });
  guides.sort(byReg).forEach(g => add(g.shape, 'guide', { stringSet: g.stringSet }));

  // 5. Sus voicings (3 sets × 4 inversions × N octaves)
  const suss = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const base = susVoicing(quality, rootPc, ss, inv);
      if (!base) continue;
      withOctaves(sh => suss.push({ shape: sh, stringSetIdx: ss, inversion: inv }), base);
    }
  }
  suss.sort(byReg).forEach(s => add(s.shape, 'sus', { stringSetIdx: s.stringSetIdx, inversion: s.inversion }));

  return out;
}

// All drop-2 voicing candidates for a chord, sorted by register (low → high).
// Kept as a separate helper because bestStartingVoicing still wants the
// drop-2-only pool for the map's static "what would this chord look like" view.
function composedCandidatesFor(quality, rootPc) {
  const cands = [];
  for (let ss = 0; ss < STRING_SETS.length; ss++) {
    for (let inv = 0; inv < 4; inv++) {
      const sh = dropTwoVoicing(quality, rootPc, ss, inv);
      if (sh) cands.push({ shape: sh, stringSetIdx: ss, inversion: inv });
    }
  }
  cands.sort((a, b) => {
    const afA = avgFret(a.shape), afB = avgFret(b.shape);
    if (afA !== afB) return afA - afB;
    return a.stringSetIdx - b.stringSetIdx;
  });
  return cands;
}

// Strategy-aware voicing picker. Given a candidate list (from
// allDistinctVoicings), the previous chord's shape (optional), and the
// current state.autoStrategy, returns the index of the chosen voicing.
//   smoothest — voice-leading + central register + drop-2 bias (default)
//   low       — minimize avgFret (sit near the nut)
//   high      — maximize avgFret (high on the neck)
//   random    — uniform random pick
// Function-based voicing override: each harmonic function has a
// "natural" alternate family that should win a fraction of the
// time, even when the section's primary family is something else.
// Lets the AI add color/contrast on dominants and tonics without
// blowing up the section's overall texture.
//   tonic     → drop-3 (fuller "arrival") ~25%
//   predom    → shell  (lighter, pushing) ~30%
//   dom       → drop-3 (bass color)       ~40%
//   secondary → drop-3 (highlighted)      ~45%
//   borrowed  → drop-3 (color chord)      ~45%
const FUNCTION_OVERRIDE = {
  tonic:     { alt: 'drop3', prob: 0.15 },
  predom:    { alt: 'shell', prob: 0.18 },
  dom:       { alt: 'drop3', prob: 0.25 },
  secondary: { alt: 'drop3', prob: 0.30 },
  borrowed:  { alt: 'drop3', prob: 0.30 },
};
// Decide the voicing type to use for one chord-event. The section
// primary is the default; with FUNCTION_OVERRIDE probability we
// promote the chord to its natural alternate family. Deterministic
// per song position so re-rendering the same bar always picks the
// same family (no flicker).
function _voicingTypeForChord(primaryType, chordTag, songIdx, stepIdx, sectionIter) {
  // Only override in 'all' preference mode — if user pinned a
  // specific family, respect it.
  if (voicingPref !== 'all') return primaryType;
  if (!chordTag) return primaryType;
  const override = FUNCTION_OVERRIDE[chordTag];
  if (!override || override.alt === primaryType) return primaryType;
  // Deterministic 0..1 hash seeded on song position + chord function.
  const seed = `${songIdx}|${stepIdx}|${sectionIter}|${chordTag}|${primaryType}`;
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const r = ((h >>> 0) % 10000) / 10000;
  return r < override.prob ? override.alt : primaryType;
}

// Per-family bias used by the smoothest picker. Drop-2 stays the
// "house default" but bias is small enough that the others win when
// voice-leading is comparable. Random ±3 noise is added to every
// score so tied/near-tied cases break randomly across families
// (not always to drop-2). Aim: real variety on subsequent picks,
// drop-2 still ~half the time on average.
const FAMILY_BIAS = {
  drop2: 0,
  drop3: 1,
  shell: 2,
  triad: 3,
  guide: 6,
  sus:   5,
};
// Deterministic per-candidate hash → noise in [-3, 3]. Used in place
// of Math.random() so the picker returns the SAME family for the
// same (chord, prev, family-coordinate) context. That way the map
// card preview matches the chord that actually plays when clicked.
function _seedNoise(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const u = ((h >>> 0) % 10000) / 10000;
  return (u - 0.5) * 6;
}
function _shapeKey(sh) {
  if (!sh) return '∅';
  return sh.map((f, i) => f >= 0 ? `${i}:${f}` : '').filter(Boolean).join(',');
}
function pickByStrategy(cands, prevShape) {
  if (!cands || !cands.length) return -1;
  const strat = state.autoStrategy || 'smoothest';
  if (strat === 'random') return Math.floor(Math.random() * cands.length);
  let bestIdx = 0, bestScore = Infinity;
  const prevKey = _shapeKey(prevShape);
  cands.forEach((c, i) => {
    const af = avgFret(c.shape);
    const typeBias = FAMILY_BIAS[c.type] ?? 4;
    // Deterministic ±3 noise — keyed by family + this candidate's
    // shape + the previous chord. Same context → same noise → same
    // pick. Different context → different noise → real variety.
    const seed = `${c.type}|${_shapeKey(c.shape)}|${prevKey}`;
    const noise = _seedNoise(seed);
    let score;
    if (strat === 'low') {
      score = af + typeBias + noise;
    } else if (strat === 'high') {
      score = (15 - af) + typeBias + noise;
    } else {
      // smoothest: voice-leading + sweet-spot + register-shift-from-prev
      // + family bias + noise. The register-shift penalty keeps the
      // picker from "jumping" to a wildly different fret area even
      // when voice-leading score is OK — chords should stay in
      // roughly the same hand position unless there's a clear win.
      const m = prevShape ? totalVoiceMovement(prevShape, c.shape) : 0;
      const reg = Math.abs(af - 7);
      const registerCost = reg <= 2 ? 0 : Math.pow(reg - 2, 1.5);
      const setPref = c.stringSetIdx === 0 ? 3 : 0;
      const regionShift = prevShape ? Math.abs(af - avgFret(prevShape)) : 0;
      const jumpPenalty = regionShift > 4 ? Math.pow(regionShift - 4, 1.8) : 0;
      score = m + registerCost + setPref + typeBias + noise + jumpPenalty;
    }
    if (score < bestScore) { bestScore = score; bestIdx = i; }
  });
  return bestIdx;
}

// ─── Undo stack for compose progression ───
const _composeUndoStack = [];
function _composeSaveUndo() {
  _composeUndoStack.push(JSON.parse(JSON.stringify(state.composedProgression)));
  if (_composeUndoStack.length > 30) _composeUndoStack.shift();
}
function composeUndo() {
  if (!_composeUndoStack.length) return;
  state.composedProgression = _composeUndoStack.pop();
  state.composedSelectedIdx = null;
  state._composeFocusedIdx = null;
  state.userVoicing = null;
  if (state.composedProgression.length) {
    const last = state.composedProgression[state.composedProgression.length - 1];
    state.focusedChord = last.chord;
    state.userVoicing = last.shape ? { shape: last.shape } : null;
  }
  if (chordDrone.playing) chordDrone.stop();
  renderComposeStrip();
  renderAll();
}

// Shared compose actions — used by both the keyboard handler and the touch keypad.
function composeAddChord(chordId, cycleInversion = false, direction = 1) {
  const ch = currentMap().chordDefs[chordId];
  if (!ch) return;
  const root = chordRoot(ch);
  // Master pool: every distinct voicing across all techniques, deduped.
  // Cycling (Shift) steps through this list; first-pick scoring biases toward
  // drop-2 so the default voicing feels familiar.
  const cands = allDistinctVoicings(ch.quality, root);
  if (!cands.length) return;
  const seq = state.composedProgression;
  // On the FIRST chord typed (going from empty → non-empty), gently scroll
  // the page so the compose strip sits in the user's main attention area.
  // Only on mobile, only once per session-of-composing.
  const wasEmpty = seq.length === 0;

  // Strategy-driven picker (smoothest / low / high / random) shared with the
  // auto card. The strategy lives in state.autoStrategy.
  const pickBest = (prevShape) => pickByStrategy(cands, prevShape);
  const writeCell = (target, idx) => {
    const c = cands[idx];
    return {
      chord: chordId,
      _candIdx: idx,
      shape: c.shape,
      voicingType: c.type,
      // Persist the structural coordinates so transpositions can preserve
      // the exact same voicing position (string set + inversion) instead
      // of falling on a different one when the master catalog re-sorts.
      stringSetIdx: c.stringSetIdx,
      inversion: c.inversion,
      stringSet: c.stringSet,
    };
  };

  // ── EDIT MODE: either an explicit lock (composedSelectedIdx,
  // persistent until cleared) OR a one-shot replace target armed by

// Build the full compose keypad as a flat list of buttons. CSS positions them:
// mobile = phone-dialer grid (1,2,3 / 4,5,6 / ▼,7,▲ / ⌫,▶,×) pinned at bottom.
// Desktop = horizontal row.
function renderComposePad() {
  const pad = document.getElementById('compose-pad');
  if (!pad) return;
  const flats = useFlatsFor(state.keyPc);
  const shortcuts = DEGREE_SHORTCUTS[state.tonality];

  const chordBtn = (n) => {
    const chordId = shortcuts[n];
    const ch = currentMap().chordDefs[chordId];
    if (!ch) return '';
    const root = (state.keyPc + ch.deg) % 12;
    const name = nameOf(root, flats) + QUALITIES[ch.quality].sfx;
    return `<button class="compose-btn compose-chord-btn" data-chord="${chordId}" data-n="${n}" title="${ch.roman} (${name}) — keyboard: ${n}">
      ${ch.roman}<span class="deg">${n}</span>
    </button>`;
  };

  // DOM order: 1-7 chord buttons first, then controls.
  // Desktop: two rows (chords row + controls row).
  // Mobile CSS grid repositions into phone-dialer layout.
  pad.innerHTML = `
    ${chordBtn(1)}${chordBtn(2)}${chordBtn(3)}
    ${chordBtn(4)}${chordBtn(5)}${chordBtn(6)}
    ${chordBtn(7)}
    <button class="compose-btn compose-inv" data-act="inv-down" title="lower inversion (Shift+←)">▼</button>
    <button class="compose-btn compose-inv" data-act="inv-up" title="raise inversion (Shift+→)">▲</button>
    <button class="compose-btn compose-del" data-act="del" title="delete last (Backspace)">⌫</button>
    <button class="compose-btn compose-play" data-act="play" title="play (Enter)">▶</button>
    <button class="compose-btn compose-clear" data-act="clear" title="clear all (Escape)">×</button>
  `;
  // Per-button handlers are no longer attached here — see the single delegated
  // listener on the compose-pad (set up once, after first renderComposePad).
}

// One-time delegated listener for the compose-pad. Survives any innerHTML
// re-renders because it's attached to the pad container, not to the buttons.
(function wireComposePadDelegation() {
  // Wait until the pad exists (renderComposePad runs from renderAll at startup)
  const tryAttach = () => {
    const pad = document.getElementById('compose-pad');
    if (!pad) { setTimeout(tryAttach, 50); return; }
    if (pad.dataset.wired === '1') return;
    pad.dataset.wired = '1';
    pad.addEventListener('click', (e) => {
      const btn = e.target.closest('button.compose-btn');
      if (!btn || !pad.contains(btn)) return;
      e.stopPropagation();
      if (btn.dataset.chord) {
        composeAddChord(btn.dataset.chord, false);
        return;
      }
      const a = btn.dataset.act;
      if      (a === 'del')      composeDeleteLast();
      else if (a === 'undo')     composeUndo();
      else if (a === 'clear')    composeClear();
      else if (a === 'play')     composePlay();
      // ▲ raises the voicing (higher pitch / higher on the neck), ▼ lowers it
      else if (a === 'inv-up')   composeCycleLastInversion(1);
      else if (a === 'inv-down') composeCycleLastInversion(-1);
    });
    // Touch flash — iOS Safari doesn't always paint :active on tap
    // (especially after scrollable ancestors enter the gesture mix), so
    // mirror :active with a class we add on pointerdown and remove on
    // pointerup/cancel. Same .flash class the keyboard shortcut path
    // already drives, so the styling stays consistent. Minimum visible
    // duration (MIN_MS) guarantees that ultra-fast taps still paint a
    // visible flash — without it, pointerdown+pointerup inside the
    // same frame would add+remove the class before any paint happened.
    const MIN_MS = 110;
    const flashStart = new WeakMap();
    const addFlash = (e) => {
      const btn = e.target.closest('button.compose-btn');
      if (!btn || !pad.contains(btn)) return;
      btn.classList.add('flash');
      flashStart.set(btn, performance.now());
    };
    const scheduleClear = (btn) => {
      const started = flashStart.get(btn) || 0;
      const elapsed = performance.now() - started;
      const wait = Math.max(0, MIN_MS - elapsed);
      setTimeout(() => {
        btn.classList.remove('flash');
        flashStart.delete(btn);
      }, wait);
    };
    const clearAllFlash = () => {
      pad.querySelectorAll('.compose-btn.flash').forEach(scheduleClear);
    };
    pad.addEventListener('pointerdown',   addFlash, { passive: true });
    pad.addEventListener('pointerup',     clearAllFlash, { passive: true });
    pad.addEventListener('pointercancel', clearAllFlash, { passive: true });
    pad.addEventListener('pointerleave',  clearAllFlash, { passive: true });
  };

})();

// Render the composed-progression strip into the Real Book area when AI is
// not playing AND the user has typed at least one chord. Empty cells fill
// out to the right; backspace removes the last, Enter starts playback.

  // its own render keep the playback view (tabs + realistic guitar
  // are frozen on the bar the user is on). Without this, pausing a
  // composed song reverted the strip back to the compose render and
  // wiped the visible tabs.
  if (player.playing || player.paused) return;

  if (!seq.length) {
    el.hidden = true;
    tabsEl.hidden = true;
    // Drop the compose-interleaved override so the [hidden] attribute can
    // actually take effect (the override rule's display: grid was beating
    // .real-book[hidden] { display: none }).

    tabsEl.innerHTML = '';

  // the main strip only. Tabs container is hidden so the whole grid scrolls as one.

  tabsEl.hidden = isMobile ? true : false;

  const renderCell = (cell, i, isTab) => {
    const cls = ['rb-cell'];
    if (isTab) cls[0] = 'rb-tab-cell';
    const focIdx = state._composeFocusedIdx ?? (seq.length - 1);
    if (i === focIdx) cls.push('current');
    if (i === state.composedSelectedIdx) cls.push('compose-selected');

      let barHtml = '';
      if (n > 1) {

        for (let s = 0; s < n; s++) {

      return `<div class="${cls.join(' ')}"${idxAttr}${dragAttr}>${svg}${triHtml}${barHtml}</div>`;
    }
    const name = nameOf(root, flats) + QUALITIES[ch.quality].sfx;

      <div class="rb-roman">${ch.roman}</div>
      <div class="rb-chord">${name}</div>
