<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SdS — Apps</title>
<link rel="manifest" href="pwa/manifest-index.json"><meta name="theme-color" content="#f8fafc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;color:#1e293b;font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 28px 20px;overflow:hidden}

/* ─── Search ─── */
.search-stack{
  width:100%;margin:0 0 18px;flex-shrink:0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.search-form{
  display:flex;align-items:center;gap:6px;min-width:0;
  background:#fff;border:1px solid #e2e8f0;border-radius:22px;
  padding:6px 6px 6px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:box-shadow .2s, border-color .2s;
}
.search-form:focus-within{border-color:#94a3b8;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.search-form .engine{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;flex-shrink:0}
.search-form input{
  flex:1;min-width:0;width:100%;border:none;outline:none;background:transparent;
  font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#1e293b;
}
.search-form input::placeholder{color:#cbd5e1}
.search-form button{
  border:none;color:#fff;padding:6px 10px;border-radius:16px;cursor:pointer;flex-shrink:0;
  font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:.5px;
  transition:filter .2s;
}
.search-form button:hover{filter:brightness(1.15)}
.search-form.google  button{background:#4285f4}
.search-form.yandex  button{background:#fc3f1d}
.search-form.x       button{background:#0f172a}
.search-form.youtube button{background:#ff0000}
.search-form.google  .engine{color:#4285f4}
.search-form.yandex  .engine{color:#fc3f1d}
.search-form.x       .engine{color:#0f172a}
.search-form.youtube .engine{color:#ff0000}

/* ─── Main layout: cards + sidebar ─── */
.main{
  width:100%;flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 360px;gap:16px;
}
.grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  grid-template-rows:1fr 1fr;gap:12px;
}
.grid .card:nth-child(1),
.grid .card:nth-child(2){grid-column:span 3}
.grid .card:nth-child(3),
.grid .card:nth-child(4),
.grid .card:nth-child(5){grid-column:span 2}
.card{
  position:relative;border-radius:14px;overflow:hidden;
  text-decoration:none;cursor:pointer;
  transition:transform .3s ease,box-shadow .3s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 30px var(--glow,rgba(0,0,0,.1))}
.card-bg{
  position:absolute;inset:0;background-size:cover;background-position:center top;
  filter:brightness(.95) saturate(.95);transition:filter .4s ease,transform .4s ease;
}
.card:hover .card-bg{filter:brightness(1) saturate(1);transform:scale(1.03)}
.card-overlay{display:none}
.card-accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);opacity:.7;transition:opacity .3s}
.card:hover .card-accent{opacity:1}
.card-info{display:none}

/* ─── More card ─── */
.card.more-card{
  background:#f8f9fb;border:1px dashed #d0d5dd;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;
}
.card.more-card:hover{
  background:#f0f2f5;border-color:#94a3b8;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}
.more-inner{text-align:center}
.more-dots{font-size:20px;color:#94a3b8;letter-spacing:3px;line-height:1}
.more-label{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;margin-top:6px}

/* ─── Launchpad overlay ─── */
.more-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,15,20,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.more-overlay.open{opacity:1;pointer-events:auto}
.more-panel{
  width:100%;max-width:800px;padding:40px;
  transform:scale(.92);transition:transform .3s;
}
.more-overlay.open .more-panel{transform:scale(1)}
.more-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  justify-items:center;
}
.more-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-decoration:none;color:#fff;
  width:100%;max-width:220px;
  transition:transform .2s;
}
.more-item:hover{transform:translateY(-4px)}
.more-item-thumb{
  width:100%;aspect-ratio:16/10;border-radius:14px;
  background-size:cover;background-position:center top;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:box-shadow .2s;
}
.more-item:hover .more-item-thumb{box-shadow:0 8px 30px rgba(0,0,0,.6)}
.more-item-name{font-size:12px;font-weight:600;color:#d4d4d4;text-align:center}
.more-close{
  display:block;margin:30px auto 0;border:none;background:rgba(255,255,255,.08);
  font-family:inherit;font-size:11px;color:#94a3b8;cursor:pointer;
  padding:8px 24px;border-radius:20px;transition:background .15s;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;
}
.more-close:hover{background:rgba(255,255,255,.15)}

/* ─── Sidebar ─── */
.sidebar{
  overflow:hidden;border-radius:10px;
  display:flex;flex-direction:column;
}
.sidebar-half{
  flex:1;display:flex;flex-direction:column;min-height:0;
}
.sidebar-half.tg-widget{
  background:
    radial-gradient(ellipse at 20% 0%,rgba(30,80,130,.4),transparent 60%),
    radial-gradient(ellipse at 80% 100%,rgba(20,60,100,.3),transparent 50%),
    linear-gradient(170deg,#0a1220 0%,#0c1a2a 40%,#081018 100%);
  border:1px solid rgba(90,160,220,.12);
  border-bottom:none;
  border-radius:10px 10px 0 0;
}
.sidebar-half.tl-widget{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(220,200,140,.18),transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(180,160,100,.12),transparent 50%),
    linear-gradient(170deg,#1c1810 0%,#18150e 40%,#14110c 100%);
  border:1px solid rgba(201,168,76,.12);
  border-top:1px solid rgba(255,255,255,.04);
  border-radius:0 0 10px 10px;
}

/* ─── Widget shared ─── */
.widget{
  overflow:hidden;flex:1;min-height:0;
  display:flex;flex-direction:column;
}
.w-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 8px;
}
.w-header a{text-decoration:none;display:flex;align-items:center;gap:6px}
.w-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#d4b860}
.w-header .w-link{font-size:9px;color:#8a7a48;text-decoration:none;transition:color .2s}
.w-header .w-link:hover{color:#d4b860}

/* ─── Translations widget ─── */
.tl-banner{
  display:flex;align-items:center;justify-content:flex-start;
  padding:16px 18px;text-decoration:none;
  background:
    repeating-linear-gradient(92deg,
      rgba(120,80,30,.1) 0px,rgba(60,40,15,.03) 2px,
      rgba(140,100,40,.08) 5px,rgba(80,50,20,.04) 7px,
      rgba(100,70,25,.06) 10px),
    linear-gradient(180deg,#2c2214 0%,#221a0e 50%,#1a150c 100%);
  border-bottom:1px solid rgba(201,168,76,.15);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,220,120,.06);
  transition:background .2s;
}
.tl-banner:hover{
  background:
    repeating-linear-gradient(92deg,
      rgba(120,80,30,.14) 0px,rgba(60,40,15,.05) 2px,
      rgba(140,100,40,.1) 5px,rgba(80,50,20,.06) 7px,
      rgba(100,70,25,.08) 10px),
    linear-gradient(180deg,#342a18 0%,#2a2012 50%,#201a0e 100%);
}
.tl-banner-text{
  font-size:14px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;
  color:#e8c860;
  text-shadow:
    0 1px 0 #a08030,
    0 2px 0 #8a6a28,
    0 3px 3px rgba(0,0,0,.5),
    0 0 8px rgba(220,180,60,.15);
}
.tl-list{display:flex;flex-direction:column;flex:1;overflow:hidden}
.tl-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;text-decoration:none;color:inherit;
  border-top:1px solid rgba(201,168,76,.08);
  transition:background .15s;
}
.tl-item:hover{background:rgba(201,168,76,.06)}
.tl-outlet-icon{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  object-fit:contain;background:#fff;padding:3px;
}
.tl-item-body{flex:1;min-width:0}
.tl-item .tl-title{
  font-size:11px;font-weight:500;color:#e8dcc0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tl-item .tl-meta{
  display:flex;gap:6px;align-items:center;
  font-size:9px;color:#a09070;
}
.tl-item .tl-ago{color:#8a7a58}
.tl-empty{padding:10px 14px;font-size:10px;color:#8a7a58;font-style:italic}

/* ─── Telegram widget ─── */
.tg-widget .w-label{color:#5bb8e8}
.tg-widget .w-link{color:#4a9cc8}
.tg-widget .w-link:hover{color:#7ccaf0}
.tg-list{display:flex;flex-direction:column;flex:1;overflow-y:auto;overflow-x:hidden}
.tg-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;text-decoration:none;color:inherit;
  border-top:1px solid rgba(90,180,230,.1);transition:background .15s;
}
.tg-item:hover{background:rgba(90,180,230,.08)}
.tg-thumb{
  width:48px;height:48px;border-radius:6px;flex-shrink:0;
  object-fit:cover;background:#0d1520;
}
.tg-body{flex:1;min-width:0}
.tg-item .tg-txt{
  font-size:11px;font-weight:400;color:#c8dfe8;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tg-item .tg-date{font-size:9px;color:#6a9ab8;margin-top:2px}
.tg-empty{padding:10px 14px;font-size:10px;color:#6a9ab8;font-style:italic}

.footer{flex-shrink:0;padding-top:8px;font-size:9px;color:#cbd5e1;letter-spacing:1px;text-align:center}

/* ─── Mobile ─── */
/* ─── Mobile: 2-page swipe layout (Telegram ↔ Apps) ─── */
.mobile-pages{display:none}
@media(max-width:680px){
  body{padding:0!important;height:100vh!important;overflow:hidden!important;display:block}
  .search-stack,.main{display:none!important}
  .mobile-pages{
    display:flex;width:100vw;height:100vh;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .mobile-pages::-webkit-scrollbar{display:none}
  .m-page{
    flex:0 0 100vw;width:100vw;height:100vh;
    scroll-snap-align:start;
    display:flex;flex-direction:column;
    background:#f0f2f5;overflow:hidden;position:relative;
  }
  .m-page-head{
    padding:14px 16px 10px;background:#fff;border-bottom:1px solid #e2e8f0;
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;gap:10px;
  }
  .m-page-head .title{font-weight:700;font-size:17px;color:#0f172a;flex:1;min-width:0}
  .m-page-head .link{color:#64748b;text-decoration:none;font-size:12px;font-weight:500;flex-shrink:0}
  .m-view-btn{
    background:#f1f5f9;border:1px solid #cbd5e1;color:#475569;
    width:32px;height:32px;border-radius:10px;
    font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:inherit;padding:0;
  }
  .m-view-btn:hover{background:#e2e8f0;color:#0f172a}
  /* Spacious mode: edge-to-edge image, bigger text, no card chrome */
  .m-tg-list.spacious{padding:0;background:#fff}
  .m-tg-list.spacious .m-tg-item{
    margin:0;border-radius:0;box-shadow:none;
    border-bottom:1px solid #e2e8f0;
  }
  .m-tg-list.spacious .m-tg-item:active{transform:none}
  .m-tg-list.spacious .m-tg-item img{
    max-height:none;background:#000;width:100%;
  }
  .m-tg-list.spacious .m-tg-item .body{padding:16px 18px 20px}
  .m-tg-list.spacious .m-tg-item .meta-row{margin-bottom:10px}
  .m-tg-list.spacious .m-tg-item .txt{
    font-size:16px;line-height:1.55;-webkit-line-clamp:unset;display:block;overflow:visible;
  }
  .m-tg-list.spacious .m-tg-item .footer{margin-top:14px;padding-top:12px}
  .m-tg-list.spacious .read-more{display:none}  /* spacious always shows full */
  /* TG feed page — category filter chips */
  .m-tg-chips{
    display:flex;gap:6px;padding:8px 12px;background:#fff;
    border-bottom:1px solid #e2e8f0;overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  }
  .m-tg-chips::-webkit-scrollbar{display:none}
  .m-chip{
    flex-shrink:0;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;
    padding:6px 12px;border-radius:14px;font-size:11.5px;font-weight:600;
    letter-spacing:.3px;cursor:pointer;transition:all .2s;--ck:#94a3b8;
    font-family:inherit;
  }
  .m-chip:hover{background:#f1f5f9}
  .m-chip.active{background:var(--ck);color:#fff;border-color:var(--ck);
    box-shadow:0 1px 4px rgba(0,0,0,.12)}
  /* TG feed list — X-like cards: large image on top, headline below, tap-through */
  .m-tg-list{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;background:#f0f2f5}
  .m-tg-item{
    display:block;background:#fff;border-radius:14px;
    margin-bottom:10px;overflow:hidden;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.03);
    transition:transform .15s ease;
  }
  .m-tg-item:active{transform:scale(.99)}
  .m-tg-item img{
    width:100%;height:auto;display:block;background:#f1f5f9;
    max-height:600px;object-fit:contain;
  }
  .m-tg-item.no-img{padding-top:2px}
  .m-tg-item .body{padding:13px 14px 12px}
  .m-tg-item .meta-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .m-tg-item .task-tag{
    display:inline-block;padding:2px 9px;border-radius:10px;
    font-size:9.5px;font-weight:700;color:#fff;
    letter-spacing:.6px;text-transform:uppercase;
  }
  .m-tg-item .time{font-size:11px;color:#94a3b8;letter-spacing:.3px}
  .m-tg-item .txt{
    font-size:15px;line-height:1.45;color:#0f172a;font-weight:500;
    word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;
  }
  .m-tg-item .txt.expanded{
    -webkit-line-clamp:unset;display:block;overflow:visible;
  }
  .m-tg-item .read-more{
    display:inline-block;margin-top:8px;
    background:none;border:none;padding:0;
    color:#475569;font-weight:600;font-size:12px;
    cursor:pointer;font-family:inherit;
    letter-spacing:.2px;
  }
  .m-tg-item .read-more:hover{color:#1e293b;text-decoration:underline}
  .m-tg-item .footer{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:10px;padding-top:8px;border-top:1px solid #f1f5f9;
  }
  .m-tg-item .date{font-size:11px;color:#94a3b8;letter-spacing:.3px}
  .m-tg-item .open-tg{
    font-size:11px;color:#0088cc;font-weight:600;
    text-decoration:none;letter-spacing:.3px;
    padding:3px 8px;border-radius:10px;
    background:rgba(0,136,204,.08);
  }
  .m-tg-item .open-tg:hover{background:rgba(0,136,204,.15)}
  /* Translations chip: distinct gold/dark style so it reads as different content */
  .m-chip.translations{
    background:linear-gradient(135deg, #2a2018, #1a120a);
    color:#c8a960;border-color:#c8a960;
  }
  .m-chip.translations.active{background:linear-gradient(135deg, #c8a960, #8a6a30);color:#1a1208;border-color:#c8a960}
  /* Translation cards in the mobile feed */
  .m-tl-item{
    display:flex;gap:10px;padding:12px;
    background:linear-gradient(180deg, #fffbf2, #f7efde);
    border:1px solid #e8d8b0;border-radius:10px;margin-bottom:6px;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .m-tl-item .outlet-logo{
    width:42px;height:42px;border-radius:6px;flex-shrink:0;
    background:#fff;border:1px solid #e2d6b5;
    display:flex;align-items:center;justify-content:center;
    object-fit:contain;padding:4px;
  }
  .m-tl-item .body{flex:1;min-width:0}
  .m-tl-item .outlet-name{
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
    color:#8a6a30;margin-bottom:3px;
  }
  .m-tl-item .title{
    font-size:13px;line-height:1.35;color:#3a2810;font-weight:500;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  }
  .m-tl-item .dates{
    font-size:9.5px;color:#a08454;margin-top:5px;letter-spacing:.3px;
  }
  .m-tg-item{
    display:flex;gap:10px;padding:11px;
    background:#fff;border-radius:10px;margin-bottom:6px;
    text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  .m-tg-item img{width:62px;height:62px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#f1f5f9}
  .m-tg-item .body{flex:1;min-width:0}
  .m-tg-item .txt{font-size:13.5px;line-height:1.4;color:#1e293b;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .m-tg-item .date{font-size:10.5px;color:#94a3b8;margin-top:4px;letter-spacing:.5px}
  .m-tg-empty{padding:40px 20px;text-align:center;color:#94a3b8;font-size:13px}
  /* Apps page */
  .m-search{display:flex;gap:6px;width:100%}
  .m-search input{
    flex:1;border:1px solid #cbd5e1;border-radius:18px;
    padding:8px 14px;font-size:14px;outline:none;background:#f8fafc;
  }
  .m-search button{
    background:#4285f4;color:#fff;border:none;padding:8px 16px;
    border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .m-apps-grid{
    flex:1;overflow-y:auto;padding:12px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;
  }
  .m-app{
    aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;
    text-decoration:none;color:inherit;
    background:#fff;border:1px solid #e2e8f0;
    display:flex;flex-direction:column;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .m-app img{flex:1;width:100%;object-fit:cover;display:block;min-height:0}
  .m-app span{
    font-size:10px;padding:6px 4px;
    text-align:center;font-weight:600;color:#475569;
    border-top:1px solid #e2e8f0;background:#fafbfc;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .m-app-more{background:#f8fafc;border:1px dashed #cbd5e1}
  .m-more-dots{flex:1;display:flex;align-items:center;justify-content:center;font-size:28px;color:#94a3b8;line-height:1}
  /* Bottom peek strip — taste of the other page */
  .m-strip{
    flex-shrink:0;height:72px;
    background:linear-gradient(180deg,#fff,#f8fafc);
    border-top:1px solid #e2e8f0;
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;overflow-x:auto;cursor:pointer;
    box-shadow:0 -2px 8px rgba(0,0,0,.03);scrollbar-width:none;
  }
  .m-strip::-webkit-scrollbar{display:none}
  .apps-peek-item{
    flex-shrink:0;width:48px;height:48px;border-radius:10px;overflow:hidden;
    text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .apps-peek-item img{width:100%;height:100%;object-fit:cover;display:block}
  .tg-peek-item{
    flex-shrink:0;background:#f1f5f9;border-radius:10px;padding:6px 10px;
    text-decoration:none;color:#475569;min-width:130px;max-width:180px;

}

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('pwa/sw.js').catch(()=>{});
(function(){
  const list = document.getElementById('tl-list');
  function ago(ts){
    const s = Math.floor(Date.now()/1000 - ts);
    if(s<60)return 'now';if(s<3600)return Math.floor(s/60)+'m';
    if(s<86400)return Math.floor(s/3600)+'h';
    const d=Math.floor(s/86400);if(d<7)return d+'d';return Math.floor(d/7)+'w';
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const outletLogos={
    'La Jornada':'translations/logos/la-jornada.png',
    'Contralínea':'translations/logos/contralinea.png',
    'Revista Contralínea':'translations/logos/contralinea.png',
  };
  function outletIcon(name){
    const src=outletLogos[name];
    if(src) return `<img class="tl-outlet-icon" src="${src}" alt="${esc(name)}">`;
    return `<img class="tl-outlet-icon" src="translations/logos/la-jornada.png" alt="${esc(name||'')}" style="opacity:.3">`;
  }
  fetch('translations/manifest.json?v='+Date.now())
    .then(r=>r.json())
    .then(data=>{
      const items=(data||[]).sort((a,b)=>(b.last_modified||0)-(a.last_modified||0)).slice(0,4);
      if(!items.length){list.innerHTML='<div class="tl-empty">No translations yet</div>';return}
      list.innerHTML=items.map(x=>`<a class="tl-item" href="translations/viewer.html?slug=${encodeURIComponent(x.slug)}">
        ${outletIcon(x.outlet)}
        <div class="tl-item-body"><span class="tl-title">${esc(x.translated_title||x.slug)}</span>
        <span class="tl-meta"><span>${esc(x.outlet||'')}</span><span class="tl-ago">${x.last_modified?ago(x.last_modified):''}</span></span></div>
      </a>`).join('');
    })
    .catch(()=>{list.innerHTML='<div class="tl-empty">—</div>'});
})();
(function(){
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  // Task metadata — chip label + color
  const TASK_META={
    dailyt:  {label:'Mañanera', color:'#f59e0b'},
    scant:   {label:'Scan',     color:'#3b82f6'},
    onmexico:{label:'OnMex',    color:'#10b981'},
    dragon:  {label:'Dragon',   color:'#ef4444'},
  };
  const meta=t=>TASK_META[t]||{label:(t||'Other'),color:'#94a3b8'};

  // Desktop sidebar (unchanged) — reads tg-feed.json (top 10)
  const tg=document.getElementById('tg-list');
  fetch('tg-feed.json?v='+Date.now()).then(r=>r.json()).then(data=>{
    const items=(data||[]).slice(0,5);
    if(!items.length){tg.innerHTML='<div class="tg-empty">No posts yet</div>';return}
    tg.innerHTML=items.map(x=>`<a class="tg-item" href="https://t.me/resisres/${x.id}" target="_blank">
      ${x.img?`<img class="tg-thumb" src="${esc(x.img)}" alt="">`:''}
      <div class="tg-body"><div class="tg-txt">${esc(x.text)}</div>
      <div class="tg-date">${esc(x.date)}</div></div>
    </a>`).join('');
  }).catch(()=>{tg.innerHTML='<div class="tg-empty">—</div>'});

  // Mobile feed — reads sends.ndjson (richer: has task + chat info)
  // Falls back to tg-feed.json if sends.ndjson unavailable.
  // Also loads translations/manifest.json for the Translations filter.
  let mobileItems=[], translationItems=[], activeFilter=null;
  // Outlet logo mapping (same as desktop tl-widget)
  const OUTLET_LOGO={
    'La Jornada':'translations/logos/la-jornada.png',
    'Contralínea':'translations/logos/contralinea.png',
    'Revista Contralínea':'translations/logos/contralinea.png',
  };
  function renderTranslationList(){
    const list=document.getElementById('m-tg-list');
    if(!list)return;
    if(!translationItems.length){list.innerHTML='<div class="m-tg-empty">No translations yet</div>';return}
    list.innerHTML=translationItems.slice(0,50).map(t=>{
      const logo=OUTLET_LOGO[t.outlet]||'';
      const title=esc(t.translated_title||t.original_title||'(untitled)');
      const orig=esc(t.original_date||''), trans=esc(t.translated_date||'');
      return `<a class="m-tl-item" href="translations/viewer.html?slug=${encodeURIComponent(t.slug||'')}">
        ${logo?`<img class="outlet-logo" src="${logo}" alt="">`:'<div class="outlet-logo"></div>'}
        <div class="body">
          <div class="outlet-name">${esc(t.outlet||'')}</div>
          <div class="title">${title}</div>
          <div class="dates">${orig?`Original ${orig}`:''}${orig&&trans?' · ':''}${trans?`Translated ${trans}`:''}</div>
        </div>
      </a>`;
    }).join('');
  }
  function renderMobile(){
    const list=document.getElementById('m-tg-list');
    const chips=document.getElementById('m-tg-chips');
    const peek=document.getElementById('m-tg-peek');
    if(!list)return;
    // Build chip set from tasks actually present (+ Translations at the end)
    if(chips){
      const tasks=[...new Set(mobileItems.map(x=>x.task||'other'))];
      const taskChips=tasks.map(t=>{const m=meta(t);return `<button class="m-chip ${activeFilter===t?'active':''}" data-filter="${esc(t)}" style="--ck:${m.color}">${m.label}</button>`}).join('');
      const tlChip=translationItems.length?`<button class="m-chip translations ${activeFilter==='__tl'?'active':''}" data-filter="__tl">📖 Translations</button>`:'';
      chips.innerHTML=`<button class="m-chip ${!activeFilter?'active':''}" data-filter="">All</button>`+taskChips+tlChip;
    }
    // Translations mode: render translation cards
    if(activeFilter==='__tl'){
      renderTranslationList();
    } else {
      const filtered=activeFilter?mobileItems.filter(x=>(x.task||'other')===activeFilter):mobileItems;
      if(!filtered.length){list.innerHTML='<div class="m-tg-empty">No posts yet</div>'}
      else{list.innerHTML=filtered.slice(0,50).map(x=>{
        const m=meta(x.task);
        const t=x.ts||'';
        const hasImg=!!x.img;
        return `<a class="m-tg-item${hasImg?'':' no-img'}" href="${esc(x.url||'#')}" target="_blank" rel="noopener">
          ${hasImg?`<img src="${esc(x.img)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img')">`:''}
          <div class="body">
            <div class="meta-row">
              <span class="task-tag" style="background:${m.color}">${m.label}</span>
              <span class="time">${esc(t.slice(11,16))}</span>
            </div>
            <div class="txt">${esc(x.text)}</div>
            <div class="footer">
              <span class="date">${esc(t.slice(0,10))}</span>
              <span class="open-tg">Open in Telegram ↗</span>
            </div>
          </div>
        </a>`;
      }).join('');
        // Auto-add "Read more" only where the text actually overflows the 6-line clamp.
        // requestAnimationFrame so the layout has been computed before we measure.
        requestAnimationFrame(()=>{
          list.querySelectorAll('.m-tg-item .txt').forEach(el=>{
            if(el.scrollHeight > el.clientHeight + 2){
              const btn=document.createElement('button');
              btn.className='read-more';
              btn.type='button';
              btn.textContent='Read more';
              btn.addEventListener('click',e=>{
                e.preventDefault();e.stopPropagation();
                const open=el.classList.toggle('expanded');
                btn.textContent=open?'Show less':'Read more';
              });
              el.after(btn);
            }
          });
        });
      }
    }
    // Peek strip on apps page: telegram top 4 (translations don't peek for now)
    if(peek){
      peek.innerHTML=mobileItems.slice(0,4).map(x=>`<a class="tg-peek-item" href="${esc(x.url||'#')}" target="_blank">
        <div class="ptxt">${esc(x.text)}</div>
      </a>`).join('')+'<span class="swipe-cue">← Feed</span>';
    }
  }
  // Chip click → filter
  document.addEventListener('click',e=>{
    const c=e.target.closest('.m-chip');
    if(!c)return;
    activeFilter=c.dataset.filter||null;
    renderMobile();
  });

  // View toggle: compact ⇄ spacious. Preference persists in localStorage.
  let viewMode = (function(){try{return localStorage.getItem('m-tg-view')||'compact'}catch{return 'compact'}})();
  function applyView(){
    const list=document.getElementById('m-tg-list');
    const btn=document.getElementById('m-view-btn');
    if(list)list.classList.toggle('spacious', viewMode==='spacious');
    if(btn)btn.textContent = viewMode==='spacious' ? '☰' : '▦';
  }
  const viewBtn=document.getElementById('m-view-btn');
  if(viewBtn){
    viewBtn.addEventListener('click',()=>{
      viewMode = viewMode==='spacious' ? 'compact' : 'spacious';
      try{localStorage.setItem('m-tg-view',viewMode)}catch{}
      applyView();
    });
  }
  applyView();
  // Fetch translations manifest in parallel (so the chip can appear once data lands)
  fetch('translations/manifest.json?v='+Date.now()).then(r=>r.ok?r.json():[]).then(data=>{
    translationItems=(data||[]).slice().sort((a,b)=>(b.translated_date||'').localeCompare(a.translated_date||''));
    renderMobile();
  }).catch(()=>{});

  // Fetch sends.ndjson (preferred), fallback to tg-feed.json
  fetch('sends.ndjson?v='+Date.now(),{cache:'no-store'}).then(r=>{
    if(!r.ok)throw 0; return r.text();
  }).then(text=>{
    mobileItems=text.split('\n').filter(Boolean).map(l=>{
      try{return JSON.parse(l)}catch{return null}
    }).filter(s=>s&&s.chat==='resisres').sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    renderMobile();
  }).catch(()=>{
    // Fallback: shape tg-feed.json into the mobile schema
    fetch('tg-feed.json?v='+Date.now()).then(r=>r.json()).then(data=>{
      mobileItems=(data||[]).map(x=>({
        ts:x.date+'T00:00:00', task:'', chat:'resisres',
        msg_id:x.id, text:x.text, img:x.img,
        url:`https://t.me/resisres/${x.id}`
      }));
      renderMobile();
    }).catch(()=>{mobileItems=[];renderMobile()});
  });
})();

/* ─── Mobile 2-page interactions: strip empty-area swipe + dot tracking ─── */
(function(){
  const pages=document.getElementById('mobile-pages');
  if(!pages)return;
  // Tap empty area of a strip → scroll-snap to the other page.
  // Tap on a link/button inside the strip → that link/button handles itself.
  document.addEventListener('click',e=>{
    const strip=e.target.closest('.m-strip');
    if(!strip)return;
    if(e.target.closest('a, button'))return;  // hybrid: item taps work normally
    pages.scrollTo({left: strip.dataset.go==='apps'?window.innerWidth:0, behavior:'smooth'});
  });
  // Update dot indicators as the user scrolls between pages
  let raf=0;
  pages.addEventListener('scroll',()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      const onB=pages.scrollLeft > window.innerWidth/2;
      document.querySelectorAll('.m-dots').forEach(d=>{
        d.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('active', i===(onB?1:0)));
      });
    });
  },{passive:true});
})();
</script>
