<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SdS — Apps</title>
<link rel="manifest" href="pwa/manifest-index.json"><meta name="theme-color" content="#f8fafc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;color:#1e293b;font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 28px 20px;overflow:hidden}

/* ─── Search ─── */
.search-stack{
  width:100%;margin:0 0 18px;flex-shrink:0;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.search-form{
  display:flex;align-items:center;gap:6px;min-width:0;
  background:#fff;border:1px solid #e2e8f0;border-radius:22px;
  padding:6px 6px 6px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:box-shadow .2s, border-color .2s;
}
.search-form:focus-within{border-color:#94a3b8;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.search-form .engine{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;flex-shrink:0}
.search-form input{
  flex:1;min-width:0;width:100%;border:none;outline:none;background:transparent;
  font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#1e293b;
}
.search-form input::placeholder{color:#cbd5e1}
.search-form button{
  border:none;color:#fff;padding:6px 10px;border-radius:16px;cursor:pointer;flex-shrink:0;
  font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:.5px;
  transition:filter .2s;
}
.search-form button:hover{filter:brightness(1.15)}
.search-form.google  button{background:#4285f4}
.search-form.yandex  button{background:#fc3f1d}
.search-form.x       button{background:#0f172a}
.search-form.youtube button{background:#ff0000}
.search-form.google  .engine{color:#4285f4}
.search-form.yandex  .engine{color:#fc3f1d}
.search-form.x       .engine{color:#0f172a}
.search-form.youtube .engine{color:#ff0000}

/* ─── Main layout: cards + sidebar ─── */
.main{
  width:100%;flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 360px;gap:16px;
}
.grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  grid-template-rows:1fr 1fr;gap:12px;
}
.grid .card:nth-child(1),
.grid .card:nth-child(2){grid-column:span 3}
.grid .card:nth-child(3),
.grid .card:nth-child(4),
.grid .card:nth-child(5){grid-column:span 2}
.card{
  position:relative;border-radius:14px;overflow:hidden;
  text-decoration:none;cursor:pointer;
  transition:transform .3s ease,box-shadow .3s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 30px var(--glow,rgba(0,0,0,.1))}
.card-bg{
  position:absolute;inset:0;background-size:cover;background-position:center top;
  filter:brightness(.95) saturate(.95);transition:filter .4s ease,transform .4s ease;
}
.card:hover .card-bg{filter:brightness(1) saturate(1);transform:scale(1.03)}
.card-overlay{display:none}
.card-accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);opacity:.7;transition:opacity .3s}
.card:hover .card-accent{opacity:1}
.card-info{display:none}

/* ─── More card ─── */
.card.more-card{
  background:#f8f9fb;border:1px dashed #d0d5dd;
  display:flex;align-items:center;justify-content:center;
  box-shadow:none;
}
.card.more-card:hover{
  background:#f0f2f5;border-color:#94a3b8;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}
.more-inner{text-align:center}
.more-dots{font-size:20px;color:#94a3b8;letter-spacing:3px;line-height:1}
.more-label{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;margin-top:6px}

/* ─── Launchpad overlay ─── */
.more-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,15,20,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.more-overlay.open{opacity:1;pointer-events:auto}
.more-panel{
  width:100%;max-width:800px;padding:40px;
  transform:scale(.92);transition:transform .3s;
}
.more-overlay.open .more-panel{transform:scale(1)}
.more-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  justify-items:center;
}
.more-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-decoration:none;color:#fff;
  width:100%;max-width:220px;
  transition:transform .2s;
}
.more-item:hover{transform:translateY(-4px)}
.more-item-thumb{
  width:100%;aspect-ratio:16/10;border-radius:14px;
  background-size:cover;background-position:center top;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:box-shadow .2s;
}
.more-item:hover .more-item-thumb{box-shadow:0 8px 30px rgba(0,0,0,.6)}
.more-item-name{font-size:12px;font-weight:600;color:#d4d4d4;text-align:center}
.more-close{
  display:block;margin:30px auto 0;border:none;background:rgba(255,255,255,.08);
  font-family:inherit;font-size:11px;color:#94a3b8;cursor:pointer;
  padding:8px 24px;border-radius:20px;transition:background .15s;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;
}
.more-close:hover{background:rgba(255,255,255,.15)}

/* ─── Sidebar ─── */
/* ─── Sidebar (desktop unified feed) ─── Paleta Pantone: 7421 wine + 465 oro caramelo */
.sidebar{
  overflow:hidden;border-radius:10px;position:relative;
  container-type:inline-size;container-name:sidebar;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(159,34,65,.22),transparent 60%),
    radial-gradient(ellipse at 80% 100%,rgba(105,28,50,.28),transparent 55%),
    linear-gradient(170deg,#180a0e 0%,#221014 40%,#120608 100%);
  border:1px solid rgba(105,28,50,.3);
}
/* Drag handle on left edge — drag to resize the sidebar width */
.sidebar-resize{
  position:absolute;top:0;left:0;width:6px;height:100%;
  cursor:ew-resize;z-index:10;
  background:transparent;transition:background .15s;
}
.sidebar-resize:hover,.sidebar-resize.dragging{background:rgba(221,201,163,.35)}
body.sidebar-resizing{cursor:ew-resize!important;user-select:none}
body.sidebar-resizing *{cursor:ew-resize!important;user-select:none!important}
.d-feed-head{
  padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid rgba(159,34,65,.15);flex-shrink:0;
}
/* Sidebar-context override for the view-toggle button (mobile uses light theme) */
.sidebar .m-view-btn{
  background:rgba(159,34,65,.22);border:1px solid rgba(221,201,163,.25);
  color:#DDC9A3;width:28px;height:28px;border-radius:7px;
  font-size:14px;line-height:1;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;
  transition:background .2s,border-color .2s;
}
.sidebar .m-view-btn:hover{background:rgba(159,34,65,.4);border-color:rgba(221,201,163,.5)}
.d-feed-link{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#DDC9A3;text-decoration:none;
  padding:4px 9px;border-radius:6px;background:rgba(159,34,65,.25);
  border:1px solid rgba(221,201,163,.25);
  transition:background .2s,border-color .2s;
}
.d-feed-link:hover{background:rgba(159,34,65,.4);border-color:rgba(221,201,163,.5)}
/* Chips strip in sidebar */
.sidebar .m-tg-chips{
  display:flex;gap:5px;padding:8px 10px;
  border-bottom:1px solid rgba(159,34,65,.15);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.sidebar .m-tg-chips::-webkit-scrollbar{display:none}
.sidebar .m-chip{
  flex-shrink:0;--ck:#9F2241;
  background:color-mix(in srgb, var(--ck) 25%, rgba(20,8,10,.65));
  color:color-mix(in srgb, var(--ck) 30%, #f5e8c8);
  border:1px solid color-mix(in srgb, var(--ck) 50%, rgba(221,201,163,.15));
  padding:4px 10px;border-radius:11px;font-size:10px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:all .2s;
}
.sidebar .m-chip:hover{background:color-mix(in srgb, var(--ck) 38%, rgba(20,8,10,.65))}
.sidebar .m-chip.active{background:var(--ck);color:#fff;border-color:var(--ck);box-shadow:0 1px 6px color-mix(in srgb, var(--ck) 50%, transparent)}
/* Sidebar Translations chip — oro caramelo Pantone 465, gradient luxe */
.sidebar .m-chip.translations{
  --ck:#BC955C;
  background:linear-gradient(135deg, #BC955C 0%, #8a6a30 100%);
  color:#1a0e10;border-color:#DDC9A3;
  font-weight:800;
  box-shadow:0 1px 4px rgba(188,149,92,.35);
}
.sidebar .m-chip.translations:hover{background:linear-gradient(135deg, #DDC9A3 0%, #BC955C 100%)}
.sidebar .m-chip.translations.active{
  background:linear-gradient(135deg, #E8D6B5 0%, #BC955C 100%);color:#1a0e10;border-color:#DDC9A3;
  box-shadow:0 2px 10px rgba(221,201,163,.55);
}
/* Card list in sidebar — scrollbar hidden so it doesn't eat horizontal space */
.sidebar .m-tg-list{
  flex:1;overflow-y:auto;padding:6px 6px 40px 6px;background:transparent;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.sidebar .m-tg-list::-webkit-scrollbar{display:none}
.sidebar .m-tg-item{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;position:relative;
  --ct:#9F2241;
  padding:9px 9px 9px 12px;
  background:color-mix(in srgb, var(--ct) 32%, #0d0608);
  border:1px solid color-mix(in srgb, var(--ct) 50%, transparent);
  border-left:3px solid var(--ct);
  border-radius:8px;margin-bottom:5px;
  transition:background .2s,border-color .2s;
}
.sidebar .m-tg-item:hover{
  background:color-mix(in srgb, var(--ct) 42%, #0d0608);
  border-color:color-mix(in srgb, var(--ct) 70%, transparent);
}
.sidebar .m-tg-item img{
  width:52px;height:52px;flex-shrink:0;
  border-radius:6px;object-fit:cover;background:#1a0a0c;display:block;
}
.sidebar .m-tg-item.no-img img{display:none}
.sidebar .m-tg-item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sidebar .m-tg-item .meta-row{display:flex;align-items:center;gap:5px;padding-right:14px}
.sidebar .m-tg-item .task-tag{
  display:inline-block;padding:1px 5px;border-radius:5px;
  font-size:8.5px;font-weight:700;color:#fff;letter-spacing:.4px;text-transform:uppercase;
}
.sidebar .m-tg-item .time{font-size:9px;color:#a08a5a}
.sidebar .m-tg-item .txt{
  font-size:11.5px;line-height:1.4;color:#e8d8b0;font-weight:400;
  word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sidebar .m-tg-item .footer{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.sidebar .m-tg-item .date{font-size:9px;color:#a08a5a}
/* Open in Telegram pill — Telegram brand blue (intentionally distinct from the rest of the palette) */
.sidebar .m-tg-item .open-tg{
  font-size:9px;color:#5bb8e8;font-weight:600;text-decoration:none;
  padding:2px 6px;border-radius:5px;background:rgba(90,180,230,.12);
}
.sidebar .m-tg-item .read-more{display:none}
.sidebar .m-tg-item .expand-chevron{
  position:absolute;top:8px;right:8px;
  color:#6b4a3a;font-size:11px;line-height:1;pointer-events:none;
  transition:transform .25s ease,color .25s;
}
.sidebar .m-tg-item.expanded .expand-chevron{transform:rotate(180deg);color:#DDC9A3}
/* Expanded card in sidebar */
.sidebar .m-tg-item.expanded{
  flex-direction:column;gap:0;padding:0;overflow:hidden;cursor:default;
  background:color-mix(in srgb, var(--ct) 36%, #0d0608);
  border-left:3px solid var(--ct);
}
.sidebar .m-tg-item.expanded img,
.sidebar .m-tg-item.expanded .meta-row,
.sidebar .m-tg-item.expanded .expand-chevron{cursor:pointer}
.sidebar .m-tg-item.expanded .txt{cursor:text;user-select:text;-webkit-user-select:text}
.sidebar .m-tg-item.expanded img{
  width:100%;height:auto;max-height:260px;
  border-radius:8px 8px 0 0;object-fit:contain;background:transparent;
}
.sidebar .m-tg-item.expanded.no-img img{display:none}
.sidebar .m-tg-item.expanded .body{padding:10px 11px;width:100%}
.sidebar .m-tg-item.expanded .meta-row{margin-bottom:8px;padding-right:18px}
.sidebar .m-tg-item.expanded .task-tag{padding:1px 6px;font-size:9px;border-radius:7px}
.sidebar .m-tg-item.expanded .time{font-size:10px}
.sidebar .m-tg-item.expanded .txt{
  font-size:12px;line-height:1.45;display:block;overflow:visible;
  -webkit-line-clamp:initial;-webkit-box-orient:initial;
}
.sidebar .m-tg-item.expanded .footer{
  margin-top:10px;padding-top:8px;border-top:1px solid rgba(221,201,163,.12);
}
/* Source preview card in sidebar — guinda + dorado accents, Telegram-style hero image */
.sidebar .source-card{
  margin-top:8px;display:block;padding:0;
  background:rgba(0,0,0,.32);border:1px solid rgba(221,201,163,.2);
  border-radius:8px;overflow:hidden;
  text-decoration:none;color:inherit;
  transition:border-color .2s, background .2s;
}
.sidebar .source-card:hover{border-color:rgba(221,201,163,.45);background:rgba(40,18,22,.45)}
.sidebar .source-card .src-img{
  width:100% !important;height:auto !important;
  aspect-ratio:16/9;max-height:160px;
  object-fit:cover;background:#1a0a0c;display:block !important;
  border-radius:0;
}
.sidebar .source-card .src-body{
  padding:8px 11px 10px;
  display:flex;flex-direction:column;gap:2px;
}
.sidebar .source-card .src-domain{
  font-size:8.5px;font-weight:700;color:#DDC9A3;
  text-transform:uppercase;letter-spacing:.6px;
}
.sidebar .source-card .src-title{
  font-size:11.5px;line-height:1.3;color:#f5e8c8;font-weight:600;margin-top:2px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.sidebar .source-card .src-desc{
  display:-webkit-box;font-size:10px;color:#c4a878;line-height:1.35;margin-top:4px;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* Translation cards in sidebar (when Translations chip is active) — guinda + dorado */
.sidebar .m-tl-item{
  display:flex;gap:9px;padding:9px;margin-bottom:5px;
  background:linear-gradient(180deg,rgba(60,20,28,.55),rgba(40,14,20,.6));
  border:1px solid rgba(221,201,163,.22);border-radius:8px;
  text-decoration:none;color:inherit;
}
.sidebar .m-tl-item:hover{background:linear-gradient(180deg,rgba(80,28,38,.6),rgba(50,18,26,.65))}
.sidebar .m-tl-item .outlet-logo{
  width:36px;height:36px;border-radius:5px;flex-shrink:0;
  background:#fff;border:1px solid rgba(221,201,163,.35);padding:3px;object-fit:contain;
}
.sidebar .m-tl-item .body{flex:1;min-width:0}
.sidebar .m-tl-item .outlet-name{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#DDC9A3;margin-bottom:2px}
.sidebar .m-tl-item .title{
  font-size:11px;line-height:1.3;color:#f5e8c8;font-weight:500;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
}
.sidebar .m-tl-item .dates{font-size:9px;color:#a08a5a;margin-top:3px}
.sidebar .m-tg-empty{padding:24px 14px;text-align:center;color:#a08a5a;font-style:italic;font-size:11px}

/* ─── Hero-from-source: source-card-in-body is the visual everywhere on narrow/compact
       Source-as-hero only shown in wide-sidebar magazine layout (revealed via @container query) ─── */
.sidebar .m-tg-item .source-card.source-as-hero{display:none}

/* ─── source-card promoted to HERO (when post has no own image) ─── */
/* COMPACT (collapsed in non-spacious list): just the image as a small left thumb. */
.sidebar .m-tg-list:not(.spacious) .m-tg-item:not(.expanded) .source-card.source-as-hero{
  flex-shrink:0;width:54px;height:54px;align-self:flex-start;
  margin:0;padding:0;border-radius:6px;
  border:1px solid color-mix(in srgb, var(--ct) 40%, transparent);
  border-left:none;overflow:hidden;
  background:#0d0608;
}
.sidebar .m-tg-list:not(.spacious) .m-tg-item:not(.expanded) .source-card.source-as-hero .src-img{
  width:100%;height:100%;border-radius:0;object-fit:cover;max-height:none;
}
.sidebar .m-tg-list:not(.spacious) .m-tg-item:not(.expanded) .source-card.source-as-hero .src-body{display:none}

/* EXPANDED (tap-to-expand) OR SPACIOUS mode: show full preview — image + domain/title/desc */
.sidebar .m-tg-item.expanded .source-card.source-as-hero,
.sidebar .m-tg-list.spacious .m-tg-item .source-card.source-as-hero{
  display:flex;flex-direction:column;
  width:100%;height:auto;align-self:stretch;
  border-radius:0;border:none;
  border-bottom:1px solid rgba(221,201,163,.18);
  background:rgba(0,0,0,.25);
  margin:0;padding:0;
}
.sidebar .m-tg-item.expanded .source-card.source-as-hero .src-img,
.sidebar .m-tg-list.spacious .m-tg-item .source-card.source-as-hero .src-img{
  width:100%;height:auto;max-height:200px;
  object-fit:contain;background:transparent;
  border-radius:0;
}
.sidebar .m-tg-item.expanded .source-card.source-as-hero .src-body,
.sidebar .m-tg-list.spacious .m-tg-item .source-card.source-as-hero .src-body{
  display:flex;flex-direction:column;gap:3px;
  padding:8px 12px 10px;
}

/* Sidebar SPACIOUS view: full image on top, text below; category-tinted */
.sidebar .m-tg-list.spacious{padding:0}
.sidebar .m-tg-list.spacious .m-tg-item{
  flex-direction:column;gap:0;padding:0;margin:0;
  border:none;border-bottom:1px solid color-mix(in srgb, var(--ct) 50%, transparent);
  border-left:3px solid var(--ct);
  background:color-mix(in srgb, var(--ct) 28%, #0d0608);
  border-radius:0;
}
.sidebar .m-tg-list.spacious .m-tg-item:hover{background:color-mix(in srgb, var(--ct) 38%, #0d0608)}
.sidebar .m-tg-list.spacious .m-tg-item img{
  width:100%;height:auto;max-height:260px;
  border-radius:0;object-fit:contain;background:transparent;
}
.sidebar .m-tg-list.spacious .m-tg-item.no-img img{display:none}
.sidebar .m-tg-list.spacious .m-tg-item .body{padding:12px 14px 14px;width:100%}
.sidebar .m-tg-list.spacious .m-tg-item .meta-row{margin-bottom:8px;padding-right:0}
.sidebar .m-tg-list.spacious .m-tg-item .task-tag{padding:2px 8px;font-size:9px;border-radius:8px}
.sidebar .m-tg-list.spacious .m-tg-item .time{font-size:10px}
.sidebar .m-tg-list.spacious .m-tg-item .txt{
  font-size:13px;line-height:1.5;color:#f5e8c8;
  display:block;overflow:visible;
  -webkit-line-clamp:initial;-webkit-box-orient:initial;
}
.sidebar .m-tg-list.spacious .m-tg-item .footer{margin-top:12px;padding-top:10px;border-top:1px solid rgba(221,201,163,.12)}
.sidebar .m-tg-list.spacious .expand-chevron{display:none}  /* irrelevant in spacious (already full) */

/* ─── Wide sidebar (≥ 480px container width): side-by-side, image at natural ratio ─── */
/* Image sits top-left at its real proportions (no crop). Text column on the right.
   If text is longer than image height, blank space below image just shows card bg. */
@container sidebar (min-width: 480px){
  /* Expanded individual card */
  .sidebar .m-tg-item.expanded{
    flex-direction:row;align-items:flex-start;
    padding:0;gap:0;overflow:hidden;
  }
  /* Both <img> hero and source-as-hero get the same left-column treatment */
  .sidebar .m-tg-item.expanded img,
  .sidebar .m-tg-item.expanded .source-card.source-as-hero{
    width:220px;flex-shrink:0;
    height:auto;max-height:340px;
    align-self:flex-start;
    border-radius:8px 0 0 8px;margin:0;
  }
  .sidebar .m-tg-item.expanded img{
    object-fit:contain;background:transparent;
  }
  .sidebar .m-tg-item.expanded .body{
    flex:1;min-width:0;padding:14px 16px 14px 16px;
  }
  /* In wide-magazine: reveal source-as-hero AND hide the body source-card (no duplication) */
  .sidebar .m-tg-item.hero-from-source.expanded .source-card.source-as-hero{display:flex;flex-direction:column}
  .sidebar .m-tg-item.hero-from-source.expanded > .body > .source-card{display:none}
  .sidebar .m-tg-item.hero-from-source.expanded .source-card.source-as-hero .src-img{
    width:100%;height:auto;max-height:260px;object-fit:cover;border-radius:8px 0 0 0;background:transparent;
  }

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('pwa/sw.js').catch(()=>{});
// (Legacy translations widget IIFE removed — translations are now in the unified feed below)
(function(){
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  // Task metadata — chip label + color. Paleta Pantone institucional (más editorial que bandera literal).
  const TASK_META={
    dailyt:  {label:'Mañanera',    color:'#9F2241'},  // Pantone 7420 — guinda frambuesa
    scant:   {label:'Noticias',    color:'#DDC9A3'},  // Pantone 468 — cream / papel
    onmexico:{label:'Internacional',color:'#235B4E'}, // Pantone 626 — teal verde profundo
    dragon:  {label:'Dragon',      color:'#691C32'},  // Pantone 7421 — vino profundo
  };
  const meta=t=>TASK_META[t]||{label:(t||'Other'),color:'#94a3b8'};

  // Unified feed — populates BOTH the mobile pages AND the desktop sidebar (same DOM classes,
  // styled separately). Reads sends.ndjson (richer: has task + chat info).
  // Falls back to tg-feed.json if sends.ndjson unavailable.
  // Also loads translations/manifest.json for the Translations filter.
  let mobileItems=[], translationItems=[], activeFilter=null;
  // Outlet logo mapping (same as desktop tl-widget)
  const OUTLET_LOGO={
    'La Jornada':'translations/logos/la-jornada.png',
    'Contralínea':'translations/logos/contralinea.png',
    'Revista Contralínea':'translations/logos/contralinea.png',
  };
  function buildTranslationHTML(){
    if(!translationItems.length)return '<div class="m-tg-empty">No translations yet</div>';
    return translationItems.slice(0,200).map(t=>{
      const logo=OUTLET_LOGO[t.outlet]||'';
      const title=esc(t.translated_title||t.original_title||'(untitled)');
      const orig=esc(t.original_date||''), trans=esc(t.translated_date||'');
      return `<a class="m-tl-item" href="translations/viewer.html?slug=${encodeURIComponent(t.slug||'')}">
        ${logo?`<img class="outlet-logo" src="${logo}" alt="">`:'<div class="outlet-logo"></div>'}
        <div class="body">
          <div class="outlet-name">${esc(t.outlet||'')}</div>
          <div class="title">${title}</div>
          <div class="dates">${orig?`Original ${orig}`:''}${orig&&trans?' · ':''}${trans?`Translated ${trans}`:''}</div>
        </div>
      </a>`;
    }).join('');
  }
  function renderMobile(){
    const lists=document.querySelectorAll('.m-tg-list');
    const chipBars=document.querySelectorAll('.m-tg-chips');
    const peek=document.getElementById('m-tg-peek');
    if(!lists.length)return;
    // Build chip set from tasks actually present (+ Translations at the end)
    if(chipBars.length){
      const tasks=[...new Set(mobileItems.map(x=>x.task||'other'))];
      const taskChips=tasks.map(t=>{const m=meta(t);return `<button class="m-chip ${activeFilter===t?'active':''}" data-filter="${esc(t)}" style="--ck:${m.color}">${m.label}</button>`}).join('');
      const tlChip=translationItems.length?`<button class="m-chip translations ${activeFilter==='__tl'?'active':''}" data-filter="__tl">📖 Translations</button>`:'';
      const chipsHTML=`<button class="m-chip ${!activeFilter?'active':''}" data-filter="">All</button>`+taskChips+tlChip;
      chipBars.forEach(c=>{c.innerHTML=chipsHTML});
    }
    // Translations mode: render translation cards
    if(activeFilter==='__tl'){
      const html=buildTranslationHTML();
      lists.forEach(l=>{l.innerHTML=html});
    } else {
      const filtered=activeFilter?mobileItems.filter(x=>(x.task||'other')===activeFilter):mobileItems;
      let html;
      if(!filtered.length){html='<div class="m-tg-empty">No posts yet</div>'}
      else{html=filtered.slice(0,200).map(x=>{
        const m=meta(x.task);
        const t=x.ts||'';
        const s=x.source;
        const hasOwnImg = !!x.img;
        const hasSource = !!(s && s.url);
        const heroFromSource = !hasOwnImg && !!(s && s.img);
        // Hero thumb only when the post itself has an attached image.
        // No source.img fallback — the source-card (inside body) provides its own image.
        const heroImg = x.img || null;
        const itemClasses = ['m-tg-item'];
        if (!heroImg) itemClasses.push('no-img');
        if (heroFromSource) itemClasses.push('hero-from-source');
        // Build the source-card markup once; render TWO copies for hero-from-source:
        //   1. source-as-hero (sibling of body) — shown only in wide-sidebar expanded
        //   2. source-card (inside body) — shown in narrow expanded/spacious + compact
        // CSS hides whichever isn't appropriate for the current mode, so only one is ever visible.
        const sourceCardInner = hasSource ? `
          ${s.img?`<img class="src-img" src="${esc(s.img)}" alt="">`:''}
          <div class="src-body">
            ${s.domain?`<div class="src-domain">${esc(s.domain)}</div>`:''}
            ${s.title?`<div class="src-title">${esc(s.title)}</div>`:''}
            ${s.desc?`<div class="src-desc">${esc(s.desc)}</div>`:''}
          </div>` : '';
        const sourceCardBody = hasSource ? `<a class="source-card" href="${esc(s.url)}" target="_blank" rel="noopener">${sourceCardInner}</a>` : '';
        const sourceCardHero = heroFromSource ? `<a class="source-card source-as-hero" href="${esc(s.url)}" target="_blank" rel="noopener">${sourceCardInner}</a>` : '';
        return `<div class="${itemClasses.join(' ')}" data-task="${esc(x.task||'other')}" style="--ct:${m.color}">
          <span class="expand-chevron">▾</span>
          ${heroImg?`<img src="${esc(heroImg)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img')">`:''}
          ${sourceCardHero}
          <div class="body">
            <div class="meta-row">
              <span class="time">${esc(t.slice(11,16))}</span>
            </div>
            <div class="txt">${esc(x.text)}</div>
            ${sourceCardBody}
            <div class="footer">
              <span class="date">${esc(t.slice(0,10))}</span>
              <a class="open-tg" href="${esc(x.url||'#')}" target="_blank" rel="noopener">Open in Telegram ↗</a>
            </div>
          </div>
        </div>`;
      }).join('')}
      // Write the same HTML into every list container (mobile pages + desktop sidebar)
      lists.forEach(l=>{l.innerHTML=html});
    }
    // Peek strip on apps page: telegram top 4 (translations don't peek for now)
    if(peek){
      peek.innerHTML=mobileItems.slice(0,4).map(x=>`<a class="tg-peek-item" href="${esc(x.url||'#')}" target="_blank">
        <div class="ptxt">${esc(x.text)}</div>
      </a>`).join('')+'<span class="swipe-cue">← Feed</span>';
    }
  }
  // Chip click → filter
  document.addEventListener('click',e=>{
    const c=e.target.closest('.m-chip');
    if(!c)return;
    activeFilter=c.dataset.filter||null;
    renderMobile();
  });

  // Tap a tg card → expand. Once expanded, only the top zone collapses it
  // (so text/source/footer remain freely selectable for copy-paste).
  document.addEventListener('click',e=>{
    const card=e.target.closest('.m-tg-item');
    if(!card)return;
    if(e.target.closest('a, button'))return;  // interactive children handle themselves
    if(card.closest('.m-tg-list.spacious'))return;  // no-op in spacious
    if(card.classList.contains('expanded')){
      // Collapse only on chevron, meta-row, or the image
      const topZone = e.target.closest('.expand-chevron, .meta-row') || e.target.tagName==='IMG';
      if(topZone) card.classList.remove('expanded');
    } else {
      // Don't expand from a text selection — if the user is dragging to select, leave the card alone
      const sel = window.getSelection && window.getSelection();
      if(sel && sel.toString().length > 0) return;
      card.classList.add('expanded');
    }
  });

  // Refresh button: hard-reload the page (since body overflow is locked, pull-to-refresh doesn't work)
  const refreshBtn=document.getElementById('m-refresh');
  if(refreshBtn){
    refreshBtn.addEventListener('click',()=>{
      refreshBtn.classList.add('spinning');
      setTimeout(()=>location.reload(), 250);
    });
  }

  // Sidebar resize: drag the left edge to make it wider/narrower. Persists in localStorage.
  // Min 240px; max = 50% of viewport (so it can take up to half the desktop). Default stays 360.
  (function(){
    const main=document.querySelector('.main');
    const handle=document.getElementById('sidebar-resize');
    if(!main||!handle)return;
    const maxW=()=>Math.floor(window.innerWidth*0.5);
    // Restore saved width on load (clamp to current viewport's max)
    const saved=parseInt(localStorage.getItem('sidebar-width')||'',10);
    if(saved && saved>=240){
      const clamped=Math.min(saved, maxW());
      main.style.gridTemplateColumns='1fr '+clamped+'px';
    }
    let dragging=false, startX=0, startW=0;
    handle.addEventListener('mousedown',e=>{
      dragging=true;
      startX=e.clientX;
      startW=document.querySelector('.sidebar').offsetWidth;
      handle.classList.add('dragging');
      document.body.classList.add('sidebar-resizing');
      e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      const dx=startX-e.clientX;  // moving left increases width (sidebar is on the right)
      const newW=Math.max(240, Math.min(maxW(), startW+dx));
      main.style.gridTemplateColumns='1fr '+newW+'px';
    });
    document.addEventListener('mouseup',()=>{
      if(!dragging)return;
      dragging=false;
      handle.classList.remove('dragging');
      document.body.classList.remove('sidebar-resizing');
      const w=document.querySelector('.sidebar').offsetWidth;
      try{localStorage.setItem('sidebar-width',w)}catch{}
    });
  })();

  // View toggle: compact ⇄ spacious. Preference persists in localStorage.
  // Both mobile and desktop sidebar share the same mode + button class.
  let viewMode = (function(){try{return localStorage.getItem('m-tg-view')||'compact'}catch{return 'compact'}})();
  function applyView(){
    document.querySelectorAll('.m-tg-list').forEach(l=>l.classList.toggle('spacious', viewMode==='spacious'));
    document.querySelectorAll('.m-view-btn').forEach(b=>{b.textContent = viewMode==='spacious' ? '☰' : '▦'});
  }
  document.querySelectorAll('.m-view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      viewMode = viewMode==='spacious' ? 'compact' : 'spacious';
      try{localStorage.setItem('m-tg-view',viewMode)}catch{}
      applyView();
      renderMobile();  // re-render to clear any stale .expanded state
    });
  });
  applyView();
  // Fetch translations manifest in parallel (so the chip can appear once data lands)
  fetch('translations/manifest.json?v='+Date.now()).then(r=>r.ok?r.json():[]).then(data=>{
    translationItems=(data||[]).slice().sort((a,b)=>(b.translated_date||'').localeCompare(a.translated_date||''));
    renderMobile();
  }).catch(()=>{});

  // Fetch sends.ndjson (preferred), fallback to tg-feed.json
  fetch('sends.ndjson?v='+Date.now(),{cache:'no-store'}).then(r=>{
    if(!r.ok)throw 0; return r.text();
  }).then(text=>{
    mobileItems=text.split('\n').filter(Boolean).map(l=>{
      try{return JSON.parse(l)}catch{return null}
    }).filter(s=>s&&s.chat==='resisres').sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    renderMobile();
  }).catch(()=>{
    // Fallback: shape tg-feed.json into the mobile schema
    fetch('tg-feed.json?v='+Date.now()).then(r=>r.json()).then(data=>{
      mobileItems=(data||[]).map(x=>({
        ts:x.date+'T00:00:00', task:'', chat:'resisres',
        msg_id:x.id, text:x.text, img:x.img,
        url:`https://t.me/resisres/${x.id}`
      }));
      renderMobile();
    }).catch(()=>{mobileItems=[];renderMobile()});
  });
})();

/* ─── Mobile 2-page interactions: strip empty-area swipe + dot tracking ─── */
(function(){
  const pages=document.getElementById('mobile-pages');
  if(!pages)return;
  // Tap empty area of a strip → scroll-snap to the other page.
  // Tap on a link/button inside the strip → that link/button handles itself.
  document.addEventListener('click',e=>{
    const strip=e.target.closest('.m-strip');
    if(!strip)return;
    if(e.target.closest('a, button'))return;  // hybrid: item taps work normally
    pages.scrollTo({left: strip.dataset.go==='apps'?window.innerWidth:0, behavior:'smooth'});
  });
  // Update dot indicators as the user scrolls between pages
  let raf=0;
  pages.addEventListener('scroll',()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      const onB=pages.scrollLeft > window.innerWidth/2;
      document.querySelectorAll('.m-dots').forEach(d=>{
        d.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('active', i===(onB?1:0)));
      });
    });
  },{passive:true});
})();
</script>
