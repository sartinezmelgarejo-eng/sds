<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('pwa/sw.js').catch(()=>{});
(function(){
  function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  // Like esc() but preserves safe HTML: <a>, <b>, <i>, <u> and their closing tags
  function safeTxt(s){
    s=String(s||'');
    // Temporarily replace safe tags with placeholders
    const ph=[];
    s=s.replace(/<(\/?)([abiu])(\s[^>]*)?>|<(a)\s+href="([^"]*)"[^>]*>(.*?)<\/a>/gi,(_m)=>{ph.push(_m);return '\x00'+(ph.length-1)+'\x00'});
    s=esc(s);
    s=s.replace(/\x00(\d+)\x00/g,(_,i)=>ph[+i]);
    return s;
  }
  // Wrap the first line (everything up to the first \n) in <b> so the
  // headline reads as bold in the feed. Posts here follow a consistent
  // pattern: emoji + headline on line 1, blank line, body — so the
  // first newline reliably separates the headline from the body. If
  // the post is single-line (no \n) we leave it alone (would otherwise
  // bold the entire post). Existing inline tags (<u>, <b>, <a>, <i>)
  // inside the headline are preserved and end up nested inside the <b>.
  function boldFirstLine(s){
    const i=s.indexOf('\n');
    if(i<=0) return s;
    return '<b class="hd">'+s.slice(0,i)+'</b>'+s.slice(i);
  }

  // Task metadata — chip label + color + group. Paleta Pantone institucional (más editorial que bandera literal).
  // `group` lets distinct task names share a chip: dragon posts (China-Mexico, BRICS, multipolar)
  // live under the same Internacional chip as onmexico, but get a jade stripe instead of teal so
  // they read as a sub-tone of the parent category.
  const TASK_META={
    dailyt:  {label:'Mañanera',     color:'#9F2241', group:'dailyt'},   // Pantone 7420 — guinda frambuesa
    scant:   {label:'Noticias',     color:'#98989A', group:'scant'},    // Pantone Cool Gray 7 C
    onmexico:{label:'Internacional',color:'#235B4E', group:'onmexico'}, // Pantone 626 — teal verde profundo
    dragon:  {label:'Internacional',color:'#3a8a78', group:'onmexico'}, // jade — sub-tone of Internacional
  };
  const meta=t=>TASK_META[t]||{label:(t||'Other'),color:'#94a3b8',group:t||'other'};
  const groupOf=t=>meta(t).group;

  // ── Magazine / batch helpers ────────────────────────────────────────────
  // Posts arrive in clusters (mañanera dump ~13:40, noticias 3-4×/day, etc).
  // A gap >30 min between consecutive sends marks a new batch.
  function groupIntoBatches(items){
    if(!items.length) return [];
    const out=[]; let cur=[items[0]];
    for(let i=1;i<items.length;i++){
      const dt=new Date(items[i-1].ts).getTime() - new Date(items[i].ts).getTime();
      if(dt > 30*60*1000){ out.push(cur); cur=[items[i]] }
      else cur.push(items[i]);
    }
    out.push(cur);
    return out;
  }
  function latestBatchFor(group){
    const its=mobileItems.filter(x=>groupOf(x.task)===group);
    return groupIntoBatches(its)[0]||[];
  }
  function todayBatchesFor(group){
    const its=mobileItems.filter(x=>groupOf(x.task)===group);
    const all=groupIntoBatches(its);
    const today=new Date().toISOString().slice(0,10);
    return all.filter(b=>(b[0].ts||'').slice(0,10)===today);
  }
  function fmtBatchDay(ts){
    if(!ts) return '';
    const d=new Date(ts), now=new Date();
    const startDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const tsDay=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const dDays=Math.round((startDay-tsDay)/86400000);
    if(dDays===0) return 'Hoy';
    if(dDays===1) return 'Ayer';
    const names=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    if(dDays<7) return names[d.getDay()];
    const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${d.getDate()} ${months[d.getMonth()]}`;
  }
  function batchTimeBucket(ts){
    if(!ts) return '';
    const h=new Date(ts).getHours();
    if(h<12) return 'Mañana';
    if(h<18) return 'Tarde';
    return 'Noche';
  }

  // Magazine state — which section is on stage, current slide per section,
  // which of today's noticias batches is showing, cycle timers, hover-pause.
  const magState={
    featured:null,
    slideIdx:{dailyt:0, scant:0, onmexico:0},
    noticiasBatchIdx:0,
    timers:{},
    paused:{},
  };
  function magBatchFor(group){
    if(group==='scant'){
      const todays=todayBatchesFor('scant');
      if(todays.length) return todays[magState.noticiasBatchIdx % todays.length] || todays[0];
    }
    return latestBatchFor(group);
  }
  function magClampSlideIdx(group){
    const b=magBatchFor(group);
    if(!b.length){ magState.slideIdx[group]=0; return 0 }
    const len=b.length;
    magState.slideIdx[group]=((magState.slideIdx[group]||0)%len+len)%len;
    return magState.slideIdx[group];
  }
  // Image preload cache: warm the browser cache for every slide in every
  // visible batch so when a cell auto-advances, the image is already there.
  const preloadCache=new Set();
  function preloadImagesFor(batch){
    if(!batch) return;
    batch.forEach(x=>{
      const url = x.img || (x.source && x.source.img);
      if(url && !preloadCache.has(url)){
        preloadCache.add(url);
        const img=new Image();
        img.src=url;  // fire-and-forget warm-up
      }
    });
  }

  function stopMagCycling(){
    Object.keys(magState.timers).forEach(g=>{
      clearInterval(magState.timers[g]);
      delete magState.timers[g];
    });
  }
  function startMagCycling(){
    stopMagCycling();
    ['dailyt','scant','onmexico'].forEach(g=> bumpCellTimer(g));
  }
  // (Re)set a single cell's cycle timer. Called from startMagCycling and
  // whenever the user interacts manually (dot click, tab click) so the next
  // auto-advance doesn't fire surprisingly soon. When the featured stage
  // cell cycles through ALL its posts (wraps back to 0) we auto-promote
  // the next non-empty section to stage, so a sleeper reader sees the
  // whole front page rotate without interaction.
  function bumpCellTimer(g){
    if(magState.timers[g]) clearInterval(magState.timers[g]);
    magState.timers[g]=setInterval(()=>{
      if(magState.paused[g]) return;
      const b=magBatchFor(g);
      if(!b.length) return;                       // no posts → nothing to do
      if(b.length<2){
        // Single-post section on stage: after one tick, advance featured.
        // Satellites with 1 post just sit (no rotation needed).
        if(g===magState.featured) advanceFeatured(g);
        return;
      }
      const next=magState.slideIdx[g]+1;
      const wrapping=next>=b.length;
      magState.slideIdx[g]=wrapping ? 0 : next;
      if(wrapping && g===magState.featured){
        advanceFeatured(g);
        return;
      }
      updateCell(g);
    }, 12000);
  }
  // Auto-promote the next non-empty section to stage when the current
  // featured has cycled through all its posts. Resets the new featured's
  // slideIdx to 0 so it starts fresh from its most recent post.
  function advanceFeatured(currentGroup){
    const sections=['dailyt','scant','onmexico'];
    const start=sections.indexOf(currentGroup);
    if(start<0) return;
    for(let i=1; i<=sections.length; i++){
      const candidate=sections[(start+i)%sections.length];
      const batch=magBatchFor(candidate);
      if(batch && batch.length){
        magState.featured=candidate;
        magState.slideIdx[candidate]=0;
        renderMobile();
        return;
      }
    }
  }
  // Mirror of advanceFeatured for backward navigation: jump to the previous
  // section and land on its LAST slide. Used by ← keyboard nav when the
  // current featured is already on slide 0.
  function retreatFeatured(currentGroup){
    const sections=['dailyt','scant','onmexico'];
    const start=sections.indexOf(currentGroup);
    if(start<0) return;
    const n=sections.length;
    for(let i=1; i<=n; i++){
      const candidate=sections[((start-i)%n+n)%n];
      const batch=magBatchFor(candidate);
      if(batch && batch.length){
        magState.featured=candidate;
        magState.slideIdx[candidate]=batch.length-1;
        renderMobile();
        return;
      }
    }
  }

  // Stable skeletons — kind-specific. Mutated in place by paintCell so the
  // <img> elements survive cycles (cached images show instantly, no flash).
  function renderCellShell(kind){
    const head = `
      <header class="mag-cell-head">
        <span class="mag-kicker"></span>
        <span class="mag-day-label"></span>
        <span class="mag-time"></span>
      </header>
      <div class="mag-noticias-tabs"></div>`;
    const foot = `
      <footer class="mag-cell-foot">
        ${kind==='stage' ? '<div class="mag-dots"></div>' : ''}
        <span class="mag-counter"></span>
        <button class="mag-drill"></button>
      </footer>`;
    if(kind==='satellite'){
      // Hybrid layout: active post pinned at top as an expanded card
      // (photo + headline + body), other posts below as a 3-col grid of
      // compact thumbs.
      return `${head}<div class="mag-active-pin"></div><div class="mag-others-grid"></div>${foot}`;
    }
    // stage — hero image OR thumb navigator (when no image), then headline + body.
    return `${head}
      <div class="mag-body-grid">
        <div class="mag-hero-wrap">
          <img class="mag-hero-img" alt="" decoding="async">
          <div class="mag-hero-thumbs"></div>
          <div class="mag-hero-date"></div>
          <div class="mag-hero-source"></div>
        </div>
        <div class="mag-text">
          <h2 class="mag-headline"></h2>
          <p class="mag-body-text"></p>
        </div>
      </div>
      ${foot}`;
  }

  // Build (or top up) a tile grid. Each tile has a stable photo+title slot
  // so paintTile can mutate it without rebuilding the DOM every cycle.
  function ensureTiles(container, count){
    if(container.children.length === count) return;
    container.innerHTML = Array.from({length:count}).map((_,i)=>`
      <button class="mag-tile" data-slide-idx="${i}">
        <div class="mag-tile-img"><img class="mag-tile-photo" alt="" decoding="async"></div>
        <div class="mag-tile-title"></div>
      </button>
    `).join('');
  }

  // Paint a single tile with a post's data. Same DOM works for stage thumbs
  // and satellite mini-feed; CSS chooses orientation/scale by parent.
  function paintTile(tile, post, isActive){
    const url = post.img || (post.source && post.source.img) || null;
    const photo = tile.querySelector('.mag-tile-photo');
    if(url){
      tile.classList.remove('no-img');
      if(photo.dataset.url !== url){
        photo.classList.remove('loaded');
        photo.dataset.url = url;
        const target = url;
        photo.onload = ()=>{ if(photo.dataset.url===target) photo.classList.add('loaded') };
        photo.onerror = ()=>{ if(photo.dataset.url!==target) return;
          tile.classList.add('no-img'); photo.removeAttribute('src'); photo.dataset.url='';
        };
        photo.src = url;
      } else if(photo.complete && photo.naturalWidth>0){
        photo.classList.add('loaded');
      }
    } else {
      tile.classList.add('no-img');
      photo.removeAttribute('src'); photo.dataset.url='';
      photo.classList.remove('loaded');
    }
    const titleText = (post.text||'').split('\n')[0] || '';
    tile.querySelector('.mag-tile-title').innerHTML = safeTxt(titleText);
    tile.classList.toggle('active', isActive);
  }

  // Header + foot are shared between stage and satellite.
  function paintHead(el, group, batch, slide){
    const m=meta(group);
    el.querySelector('.mag-kicker').textContent=m.label;
    el.querySelector('.mag-day-label').textContent=fmtBatchDay(batch[0].ts||'');
    el.querySelector('.mag-time').textContent=(slide.ts||'').slice(11,16);
  }
  function paintFoot(el, group, batch, idx, kind){
    if(kind==='stage'){
      const dotsEl=el.querySelector('.mag-dots');
      if(dotsEl){
        if(dotsEl.children.length !== batch.length){
          dotsEl.innerHTML=batch.map((_,i)=>`<button class="mag-dot" data-slide-idx="${i}" aria-label="Slide ${i+1}"></button>`).join('');
        }
        [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
      }
    }
    el.querySelector('.mag-counter').textContent=`${idx+1} / ${batch.length}`;
    const drill=el.querySelector('.mag-drill');
    if(drill){
      drill.textContent='Ver todas →';
      drill.dataset.filter=group;
      drill.style.display='';
    }
  }

  function paintStage(el, group, batch){
    const idx = magClampSlideIdx(group);
    const slide = batch[idx];
    paintHead(el, group, batch, slide);

    // Noticias tabs (only when scant is on stage with >1 batch today)
    const tabsEl=el.querySelector('.mag-noticias-tabs');
    if(group==='scant'){
      const todays=todayBatchesFor('scant');
      if(todays.length>1){
        const html=todays.map((b,i)=>{
          const label=batchTimeBucket(b[0].ts);
          return `<button class="mag-noticias-tab ${i===magState.noticiasBatchIdx?'active':''}" data-batch-idx="${i}">${esc(label)}</button>`;
        }).join('');
        if(tabsEl.innerHTML!==html) tabsEl.innerHTML=html;
        tabsEl.style.display='';
      } else { tabsEl.style.display='none'; tabsEl.innerHTML='' }
    } else { tabsEl.style.display='none'; tabsEl.innerHTML='' }

    // Hero image (race-guarded swap). On load we also flip the stage into
    // a side-by-side 2-col layout for portrait images (naturalHeight > naturalWidth)
    // so the wide stage doesn't leave the right half empty.
    // Gallery mode: posts whose text starts with 📸 (Mañanera del Pueblo
    // daily breakdown + event posts) carry an `imgs` array of all the
    // album's photos. Instead of one hero image, we fill the .mag-hero-thumbs
    // grid with one tile per photo; each tile opens the lightbox carousel
    // at that index when clicked.
    const isGalleryPost = Array.isArray(slide.imgs) && slide.imgs.length>1
                          && /^📸/.test(slide.text||'');
    el.classList.toggle('gallery-hero', isGalleryPost);
    // Expose the current gallery for the lightbox's click handler. It's
    // keyed by group so the satellites + stage stay isolated.
    if(!window.__magSlideImgs) window.__magSlideImgs = {};
    window.__magSlideImgs[group] = isGalleryPost ? slide.imgs.slice() : null;
    const heroImg = isGalleryPost
      ? null  // gallery posts hide the single <img> and use the grid instead
      : (slide.img || (slide.source && slide.source.img) || null);
    el.classList.toggle('no-hero-img', !heroImg && !isGalleryPost);
    const img=el.querySelector('.mag-hero-img');
    const applyOrientation=()=>{
      if(!(img.naturalWidth>0)) return;
      const isPortrait = img.naturalHeight > img.naturalWidth*1.05;
      el.classList.toggle('vertical-hero', isPortrait);
      // Drive the hero-wrap aspect-ratio off the image's natural shape so
      // the wrapper matches the image (no letterbox bands), then max-height
      // CSS caps the vertical so it doesn't dominate the cell.
      el.style.setProperty('--hero-aspect', `${img.naturalWidth} / ${img.naturalHeight}`);
      // For Mañanera (dailyt): headline-over-photo only makes sense on
      // horizontal images. Portraits use the 2-col layout (image left,
      // text right) so we put the headline back in the text column.
      if(group==='dailyt'){
        const hl = el.querySelector('.mag-headline');
        const wrap = el.querySelector('.mag-hero-wrap');
        const txt = el.querySelector('.mag-text');
        if(hl && wrap && txt){
          if(isPortrait){
            if(!txt.contains(hl)) txt.insertBefore(hl, txt.firstChild);
            el.style.removeProperty('--headline-color');  // not overlay anymore
          } else {
            if(!wrap.contains(hl)) wrap.appendChild(hl);
            // No color-picking logic anymore: the headline now sits on a
            // solid cream label-strip (CSS), so guinda always reads sharp.
            // img_lum / img_dist fields in sends.ndjson are kept (might be
            // useful for future treatments) but the JS doesn't consume them.
          }
        }
      }
    };
    if(heroImg){
      if(img.dataset.url!==heroImg){
        img.classList.remove('loaded');
        el.classList.remove('vertical-hero');  // clear stale orientation
        img.dataset.url=heroImg;
        const target=heroImg;
        img.onload=()=>{ if(img.dataset.url!==target) return;
          img.classList.add('loaded'); applyOrientation();
        };
        img.onerror=()=>{ if(img.dataset.url!==target) return;
          el.classList.add('no-hero-img'); el.classList.remove('vertical-hero');
          el.style.removeProperty('--hero-aspect');
          img.removeAttribute('src'); img.dataset.url='';
        };
        img.src=heroImg;
      } else if(img.complete && img.naturalWidth>0){
        img.classList.add('loaded');
        applyOrientation();
      }
    } else {
      img.removeAttribute('src'); img.dataset.url=''; img.classList.remove('loaded');
      el.classList.remove('vertical-hero');
      el.style.removeProperty('--hero-aspect');
    }

    // Hero-thumbs container has three modes (mutually exclusive):
    //   1. Gallery: 📸 post with imgs[] — fill with the album photos.
    //      Tiles carry data-gallery-idx; clicking opens lightbox carousel.
    //   2. No-image navigator: stage post has no image, batch has >1 posts —
    //      show other batch posts as a 3-col grid; click to navigate.
    //   3. Empty: cleared.
    const thumbsEl = el.querySelector('.mag-hero-thumbs');
    if(thumbsEl){
      if(isGalleryPost){
        const imgs = slide.imgs;
        ensureTiles(thumbsEl, imgs.length);
        const cols = imgs.length <= 3 ? imgs.length
                   : imgs.length <= 6 ? 3
                   : imgs.length <= 8 ? 4
                                      : 4;
        thumbsEl.style.setProperty('--gallery-cols', cols);
        [...thumbsEl.children].forEach((tile,i)=>{
          tile.classList.add('gallery-tile');
          tile.classList.remove('no-img','active');
          tile.dataset.galleryIdx = i;
          tile.removeAttribute('data-slide-idx');
          const photo = tile.querySelector('.mag-tile-photo');
          if(photo.dataset.url !== imgs[i]){
            photo.classList.remove('loaded');
            photo.dataset.url = imgs[i];
            const target = imgs[i];
            photo.onload  = ()=>{ if(photo.dataset.url===target) photo.classList.add('loaded') };
            photo.onerror = ()=>{ if(photo.dataset.url===target){
              tile.classList.add('no-img'); photo.removeAttribute('src'); photo.dataset.url='';
            }};
            photo.src = imgs[i];
          } else if(photo.complete && photo.naturalWidth>0){
            photo.classList.add('loaded');
          }
          const title = tile.querySelector('.mag-tile-title');
          if(title) title.textContent = '';
        });
      } else if(!heroImg && batch.length > 1){
        // Show OTHER batch posts only — skip the active slide so the stage's
        // current post (e.g. Mañanera Breakdown) doesn't appear twice.
        const others = batch
          .map((p, i) => ({post: p, batchIdx: i}))
          .filter(x => x.batchIdx !== idx)
          .slice(0, 9);  // 3-col × up-to-3-row grid
        ensureTiles(thumbsEl, others.length);
        [...thumbsEl.children].forEach((tile, i) => {
          tile.classList.remove('gallery-tile');
          tile.removeAttribute('data-gallery-idx');
          paintTile(tile, others[i].post, false);
          // Overwrite slide-idx with the real batch index (grid skipped active)
          tile.dataset.slideIdx = others[i].batchIdx;
        });
      } else if(thumbsEl.children.length){
        thumbsEl.innerHTML = '';
      }
    }

    // Headline + body. Onmexico (international) posts follow a peculiar format:
    // [Headline] / [Date metadata: "Month DD, YYYY | <symbol>"] / context /
    // Sheinbaum response / bullet quotes — sections separated by blank lines.
    // We strip the date line (it gets rendered as a photo-credit-style overlay
    // on the hero image) and lay the 3 real content sections out as newspaper
    // columns. Other sections keep the flowing single body.
    const lines=(slide.text||'').split('\n');
    // If the post has a source URL (the original article from the outlet),
    // wrap the headline text in an <a> so clicking opens it in a new tab.
    // Skipped for mañanera (dailyt) since the official URL is already
    // surfaced in the post's body credit — no need to duplicate it.
    const _hlText = safeTxt(lines[0]||'');
    const _srcUrl = slide.source && slide.source.url;
    el.querySelector('.mag-headline').innerHTML = (_srcUrl && group!=='dailyt')
      ? `<a href="${esc(_srcUrl)}" target="_blank" rel="noopener noreferrer">${_hlText}</a>`
      : _hlText;

    // For Mañanera (dailyt) only, move the headline DOM into the hero-wrap so
    // it sits as an overlay (cream label-strip) at the bottom-edge of the
    // image. When there's no image, the hero-wrap holds the thumb-grid
    // navigator instead — so the headline drops into the text column and
    // appears below the thumb-grid as a static block (same cream-strip
    // styling via shared CSS selector). For other sections, headline always
    // goes in the text column above body.
    const _headline = el.querySelector('.mag-headline');
    const _heroWrap = el.querySelector('.mag-hero-wrap');
    const _textCol = el.querySelector('.mag-text');
    if(_headline && _heroWrap && _textCol){
      if(group==='dailyt' && heroImg){
        if(!_heroWrap.contains(_headline)) _heroWrap.appendChild(_headline);
      } else {
        if(!_textCol.contains(_headline)) _textCol.insertBefore(_headline, _textCol.firstChild);
      }
    }
    const bodyRaw = lines.slice(1).join('\n').trim();
    const bEl=el.querySelector('.mag-body-text');
    let sections = bodyRaw.split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);

    // Detect & strip a "Month DD, YYYY | <symbol>" date metadata line.
    const dateRegex = /^[A-Z][a-z]+\s+\d{1,2},?\s+\d{4}\s*\|.+$/;
    let dateLine = null;
    sections = sections.filter(s=>{
      if(dateLine===null && dateRegex.test(s)){ dateLine=s; return false }
      return true;
    });

    // Date overlay (pinned bottom-left of hero). CSS hides via :empty when
    // we clear textContent, so the show/hide is driven purely by content.
    const dateEl = el.querySelector('.mag-hero-date');
    if(dateEl) dateEl.textContent = dateLine || '';

    // Source watermark on the hero photo — favicon (via Google's service)
    // pinned bottom-right, with the outlet name when useful. For noticias
    // (scant) we parse the trailing "Source: <outlet>" line out of the
    // body and show it as the watermark text. For internacional (onmexico)
    // the outlet is already in the headline ("REUTERS/AOL: …") so we
    // skip the name and show only the favicon — no duplication. Mañanera's
    // source is the telegra.ph breakdown, not an outlet — fully skipped.
    let srcName='', srcDomain=(slide.source && slide.source.domain)||'';
    if(group==='scant'){
      const srcIdx = sections.findIndex(s=>/^Source:\s+/i.test(s));
      if(srcIdx>=0){
        srcName = sections[srcIdx].replace(/^Source:\s+/i,'').trim();
        sections.splice(srcIdx,1);  // strip the line from body
      }
      if(!srcName) srcName = srcDomain;
    }
    const srcEl = el.querySelector('.mag-hero-source');
    if(srcEl){
      if((srcName || srcDomain) && heroImg && group!=='dailyt'){
        const fav = srcDomain
          ? `<img class="mag-source-icon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(srcDomain)}&sz=64" alt="" loading="lazy">`
          : '';
        const nm = srcName ? `<span class="mag-source-name">${esc(srcName)}</span>` : '';
        srcEl.innerHTML = `${fav}${nm}`;
      } else {
        srcEl.innerHTML = '';
      }
    }

    const isMultiCol = group==='onmexico' && sections.length>=2;
    bEl.classList.toggle('multi-col', isMultiCol);
    bEl.dataset.colCount = isMultiCol ? Math.min(sections.length, 3) : '';
    if(isMultiCol){
      bEl.innerHTML = sections.slice(0,3)
        .map(s=>`<div class="mag-body-col">${safeTxt(s)}</div>`).join('');
    } else {
      // Render each blank-line-separated section as a <p> so paragraph
      // breaks survive in the magazine view. Within a section, collapse
      // any soft line breaks into a single space so the paragraph flows.
      // Auto-bold key citation patterns per section so the body becomes
      // scannable. safeTxt() escapes straight " → &quot; and ' → &#39;,
      // so quote regexes match the escaped forms. Curly + angle marks
      // pass through literally.
      //
      // - Mañanera (dailyt): bold double-quoted text (Sheinbaum's
      //   citable lines) + bold the em-dash credit paragraph (the article
      //   link with the attribution).
      // - Internacional (onmexico): bold double-quoted text (outlet
      //   headlines, Trump/Sheinbaum quotes — the framing the article
      //   actually leans on).
      // - Noticias (scant): citations come in single quotes, but
      //   apostrophes (Mexico's, Trump's) share the same character. To
      //   avoid false matches, only bold single-quoted text preceded by
      //   ": " — the "Name: 'their quote'" intro pattern. Apostrophes in
      //   possessives never follow ": " so they're safely skipped. Also
      //   bold double quotes if they happen to appear.
      const boldDouble = s => s
        .replace(/&quot;(.+?)&quot;/g, '&quot;<strong>$1</strong>&quot;')
        .replace(/([“«])(.+?)([”»])/g, '$1<strong>$2</strong>$3');
      bEl.innerHTML = sections.map(s=>{
        let t = safeTxt(s.replace(/\s+/g,' ').trim());
        if(group==='dailyt'){
          t = boldDouble(t);
          if(/^—\s/.test(t)) t = `<strong>${t}</strong>`;
        } else if(group==='onmexico'){
          t = boldDouble(t);
        } else if(group==='scant'){
          t = boldDouble(t)
            .replace(/(:\s+)&#39;(.+?)&#39;/g, '$1&#39;<strong>$2</strong>&#39;');
        }
        return `<p>${t}</p>`;
      }).join('');
    }
    bEl.style.display = sections.length ? '' : 'none';

    // Auto-adapt body font scale based on text length so long posts shrink
    // to fit (more text visible) and short posts grow to fill the cell.
    // CSS multiplies this scalar into the body font-size clamp.
    // Smooth curve clamped to [0.78, 1.10]: scale=1 around ~300 chars.
    const bodyLen = sections.reduce((n,s)=> n + s.length, 0);
    const scale = bodyLen
      ? Math.max(0.78, Math.min(1.10, 1 + (300 - bodyLen) / 2500))
      : 1;
    el.style.setProperty('--body-scale', scale.toFixed(3));

    paintFoot(el, group, batch, idx, 'stage');
  }

  // Satellite uses .mag-row instead of .mag-tile. Each row has the same DOM
  // (photo + text). CSS shows/hides body and resizes photo based on .active,
  // and uses `order` to pin the active row to the top of the column.
  function ensureRows(container, count){
    if(container.children.length === count) return;
    container.innerHTML = Array.from({length:count}).map((_,i)=>`
      <button class="mag-row" data-slide-idx="${i}">
        <div class="row-photo"><img class="row-img" alt="" decoding="async"></div>
        <div class="row-text">
          <h3 class="row-headline"></h3>
          <p class="row-body"></p>
        </div>
      </button>
    `).join('');
  }
  function paintRow(row, post, isActive){
    const url = post.img || (post.source && post.source.img) || null;
    row.classList.toggle('active', isActive);
    const photo = row.querySelector('.row-img');
    if(url){
      row.classList.remove('no-img');
      if(photo.dataset.url !== url){
        photo.classList.remove('loaded');
        photo.dataset.url = url;
        const target = url;
        photo.onload = ()=>{ if(photo.dataset.url===target) photo.classList.add('loaded') };
        photo.onerror = ()=>{ if(photo.dataset.url!==target) return;
          row.classList.add('no-img'); photo.removeAttribute('src'); photo.dataset.url='';
        };
        photo.src = url;
      } else if(photo.complete && photo.naturalWidth>0){
        photo.classList.add('loaded');
      }
    } else {
      row.classList.add('no-img');
      photo.removeAttribute('src'); photo.dataset.url='';
      photo.classList.remove('loaded');
    }
    const lines = (post.text||'').split('\n');
    row.querySelector('.row-headline').innerHTML = safeTxt(lines[0]||'');
    const body = lines.slice(1).join(' ').replace(/\s+/g,' ').trim();
    row.querySelector('.row-body').innerHTML = body ? safeTxt(body) : '';
  }

  function paintSatellite(el, group, batch){
    const idx = magClampSlideIdx(group);
    const slide = batch[idx];
    paintHead(el, group, batch, slide);

    // No tabs in satellite (kept in shell for layout parity but hidden)
    const tabsEl=el.querySelector('.mag-noticias-tabs');
    if(tabsEl){ tabsEl.style.display='none'; tabsEl.innerHTML='' }

    // 1. Active pin — single .mag-row.active with the current slide's full
    //    expanded card (photo + headline + body). DOM is built once and the
    //    img element persists across cycles (paintRow swaps src in place).
    const pinEl = el.querySelector('.mag-active-pin');
    if(pinEl){
      if(!pinEl.querySelector('.mag-row')){
        pinEl.innerHTML = `
          <button class="mag-row active" data-slide-idx="${idx}">
            <div class="row-photo"><img class="row-img" alt="" decoding="async"></div>
            <div class="row-text">
              <h3 class="row-headline"></h3>
              <p class="row-body"></p>
            </div>
          </button>`;
      }
      const activeRow = pinEl.querySelector('.mag-row');
      activeRow.dataset.slideIdx = idx;
      paintRow(activeRow, slide, true);
    }

    // 2. Others grid — up to 6 non-active posts as compact tiles (64px photo
    //    + 3-line clamped title) in a 3-col grid. Tile data-slide-idx is the
    //    source batch index (the grid skips the active, so loop idx ≠ batch idx).
    const others = batch.map((post,i) => ({post, idx:i}))
                        .filter(x => x.idx !== idx)
                        .slice(0, 6);
    const gridEl = el.querySelector('.mag-others-grid');
    if(gridEl){
      ensureTiles(gridEl, others.length);
      [...gridEl.children].forEach((tile,i) => {
        const o = others[i];
        paintTile(tile, o.post, false);
        tile.dataset.slideIdx = o.idx;  // override loop idx → real batch idx
      });
    }

    paintFoot(el, group, batch, idx, 'satellite');
  }

  function paintCell(el, group, kind){
    const batch=magBatchFor(group);
    if(!batch.length){ el.innerHTML='<div class="mag-empty">Sin envíos</div>'; return }
    // Recover skeleton if it was wiped by a prior empty state OR was created
    // for a different kind (stage ↔ satellite swap on featured-section change).
    if(!el.querySelector('.mag-cell-head') || el.dataset.shellKind!==kind){
      el.innerHTML = renderCellShell(kind);
      el.dataset.shellKind = kind;
    }
    if(kind==='satellite') return paintSatellite(el, group, batch);
    return paintStage(el, group, batch);
  }

  function updateCell(group){
    const el=document.querySelector(`.mag-front [data-group="${group}"]`);
    if(!el) return;
    paintCell(el, group, el.dataset.cell||'satellite');
  }

  function buildMagazineHTML(){
    const groups=['dailyt','scant','onmexico'];
    const sections=groups.map(g=>{
      const b=latestBatchFor(g);
      return {group:g, ts: b[0]?.ts || ''};
    }).filter(s=>s.ts);
    if(!sections.length) return '<div class="m-tg-empty">No posts yet</div>';
    sections.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    // Detect first-ever build (magState.featured was null before). Auto-jump
    // to the first image-bearing slide ONLY on first build, otherwise the
    // user's explicit slide picks (click-to-promote, tile clicks) would
    // get clobbered every time the magazine re-renders.
    const isFirstBuild = !magState.featured;
    if(!magState.featured || !sections.find(s=>s.group===magState.featured)){
      magState.featured=sections[0].group;
    }
    if(isFirstBuild){
      ['dailyt','scant','onmexico'].forEach(g=>{
        if(magState.slideIdx[g]!==0) return;
        const b=magBatchFor(g);
        const withImg=b.findIndex(x => x.img || (x.source && x.source.img));
        if(withImg>0) magState.slideIdx[g]=withImg;
      });
    }
    const stageGroup=magState.featured;
    const satGroups=sections.map(s=>s.group).filter(g=>g!==stageGroup);
    const sm=meta(stageGroup);
    const satellites=satGroups.map(g=>{
      const m=meta(g);
      return `<section class="mag-satellite" data-group="${esc(g)}" data-cell="satellite" data-shell-kind="satellite" style="--ct:${m.color}">${renderCellShell('satellite')}</section>`;
    }).join('');
    return `<div class="mag-front">
      <section class="mag-stage" data-group="${esc(stageGroup)}" data-cell="stage" data-shell-kind="stage" style="--ct:${sm.color}">${renderCellShell('stage')}</section>
      <aside class="mag-rail">${satellites}</aside>
    </div>`;
  }
  // Paint every cell currently in the DOM. Called after attaching the shell HTML.
  function paintAllCells(){
    document.querySelectorAll('.mag-front [data-group]').forEach(el=>{
      paintCell(el, el.dataset.group, el.dataset.cell||'satellite');
    });
  }

  // Unified feed — populates BOTH the mobile pages AND the desktop sidebar (same DOM classes,
  // styled separately). Reads sends.ndjson (richer: has task + chat info).
  // Falls back to tg-feed.json if sends.ndjson unavailable.
  // Also loads translations/manifest.json for the Translations filter.
  let mobileItems=[], translationItems=[], activeFilter=null;
  // Outlet logo mapping (same as desktop tl-widget)
  const OUTLET_LOGO={
    'La Jornada':'translations/logos/la-jornada.png',
    'Contralínea':'translations/logos/contralinea.png',
    'Revista Contralínea':'translations/logos/contralinea.png',
  };
  function buildTranslationHTML(){
    if(!translationItems.length)return '<div class="m-tg-empty">No translations yet</div>';
    return translationItems.slice(0,200).map(t=>{
      const logo=OUTLET_LOGO[t.outlet]||'';
      const title=esc(t.translated_title||t.original_title||'(untitled)');
      const orig=esc(t.original_date||''), trans=esc(t.translated_date||'');
      return `<a class="m-tl-item" href="translations/viewer.html?slug=${encodeURIComponent(t.slug||'')}">
        ${logo?`<img class="outlet-logo" src="${logo}" alt="">`:'<div class="outlet-logo"></div>'}
        <div class="body">
          <div class="outlet-name">${esc(t.outlet||'')}</div>
          <div class="title">${title}</div>
          <div class="dates">${orig?`Original ${orig}`:''}${orig&&trans?' · ':''}${trans?`Translated ${trans}`:''}</div>
        </div>
      </a>`;
    }).join('');
  }
  function renderMobile(){
    const lists=document.querySelectorAll('.m-tg-list');
    const chipBars=document.querySelectorAll('.m-tg-chips');
    const peek=document.getElementById('m-tg-peek');
    if(!lists.length)return;
    // Build chip set from groups actually present (+ Translations at the end).
    // Group-based so dragon posts collapse into the Internacional chip rather than spawning their own.
    if(chipBars.length){
      const groups=[...new Set(mobileItems.map(x=>groupOf(x.task)))];
      const taskChips=groups.map(g=>{const m=meta(g);return `<button class="m-chip ${activeFilter===g?'active':''}" data-filter="${esc(g)}" style="--ck:${m.color}">${m.label}</button>`}).join('');
      const allLabel=document.body.classList.contains('sidebar-fullscreen')?'Portada':'All';
      const chipsHTML=`<button class="m-chip ${!activeFilter?'active':''}" data-filter="">${allLabel}</button>`+taskChips;
      chipBars.forEach(c=>{
        c.innerHTML=chipsHTML;
        // Hide chips row when in translations mode
        c.style.display=activeFilter==='__tl'?'none':'';
      });
      // Update mode toggles in header (mobile + desktop)
      document.querySelectorAll('.m-mode-toggle').forEach(modeToggle=>{
        const isTl=activeFilter==='__tl';
        modeToggle.classList.toggle('tl-active',isTl);
        modeToggle.querySelectorAll('.m-mode-seg').forEach(s=>{
          s.classList.toggle('active', isTl ? s.dataset.mode==='tl' : s.dataset.mode==='tg');
        });
      });
    }
    // Translations mode: render translation cards
    if(activeFilter==='__tl'){
      stopMagCycling();
      lists.forEach(l=>l.classList.remove('is-magazine'));
      const html=buildTranslationHTML();
      lists.forEach(l=>{l.innerHTML=html});
    } else if(document.body.classList.contains('sidebar-fullscreen') && activeFilter===null && lists[0]?.closest('.sidebar')){
      // Magazine front page: desktop sidebar fullscreen with no filter
      const html=buildMagazineHTML();
      lists.forEach(l=>{l.innerHTML=html; l.classList.add('is-magazine')});
      // Paint cells against the attached skeleton + warm image cache so the
      // next auto-advance shows instantly.
      paintAllCells();
      ['dailyt','scant','onmexico'].forEach(g=>preloadImagesFor(magBatchFor(g)));
      startMagCycling();
    } else {
      stopMagCycling();
      lists.forEach(l=>l.classList.remove('is-magazine'));
      const filtered=activeFilter?mobileItems.filter(x=>groupOf(x.task)===activeFilter):mobileItems;
      let html;
      if(!filtered.length){html='<div class="m-tg-empty">No posts yet</div>'}
      else{html=filtered.slice(0,200).map(x=>{
        const m=meta(x.task);
        const t=x.ts||'';
        const s=x.source;
        const hasOwnImg = !!x.img;
        const hasSource = !!(s && s.url);
        const heroFromSource = !hasOwnImg && !!(s && s.img);
        // Hero thumb only when the post itself has an attached image.
        // No source.img fallback — the source-card (inside body) provides its own image.
        const heroImg = x.img || null;
        const itemClasses = ['m-tg-item'];
        if (!heroImg) itemClasses.push('no-img');
        if (heroFromSource) itemClasses.push('hero-from-source');
        // Build the source-card markup once; render TWO copies for hero-from-source:
        //   1. source-as-hero (sibling of body) — shown only in wide-sidebar expanded
        //   2. source-card (inside body) — shown in narrow expanded/spacious + compact
        // CSS hides whichever isn't appropriate for the current mode, so only one is ever visible.
        const sourceCardInner = hasSource ? `
          ${s.img?`<img class="src-img" src="${esc(s.img)}" alt="">`:''}
          <div class="src-body">
            ${s.domain?`<div class="src-domain">${esc(s.domain)}</div>`:''}
            ${s.title?`<div class="src-title">${esc(s.title)}</div>`:''}
            ${s.desc?`<div class="src-desc">${esc(s.desc)}</div>`:''}
          </div>` : '';
        const sourceCardBody = hasSource ? `<a class="source-card" href="${esc(s.url)}" target="_blank" rel="noopener">${sourceCardInner}</a>` : '';
        const sourceCardHero = heroFromSource ? `<a class="source-card source-as-hero" href="${esc(s.url)}" target="_blank" rel="noopener">${sourceCardInner}</a>` : '';
        return `<div class="${itemClasses.join(' ')}" data-task="${esc(x.task||'other')}" style="--ct:${m.color}">
          <span class="expand-chevron">▾</span>
          ${heroImg?`<img src="${esc(heroImg)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img')">`:''}
          ${sourceCardHero}
          <div class="body">
            <div class="meta-row">
              <span class="time">${esc(t.slice(11,16))}</span>
            </div>
            <div class="txt">${boldFirstLine(safeTxt(x.text))}</div>
            ${sourceCardBody}
            <div class="footer">
              <span class="date">${esc(t.slice(0,10))}</span>
              <a class="open-tg" href="${esc(x.url||'#')}" target="_blank" rel="noopener">Open in Telegram ↗</a>
            </div>
          </div>
        </div>`;
      }).join('')}
      // Write the same HTML into every list container (mobile pages + desktop sidebar)
      lists.forEach(l=>{l.innerHTML=html});
    }
    // Peek strip on apps page: telegram top 4 (translations don't peek for now)
    if(peek){
      peek.innerHTML=mobileItems.slice(0,4).map(x=>`<a class="tg-peek-item" href="${esc(x.url||'#')}" target="_blank">
        <div class="ptxt">${esc(x.text)}</div>
      </a>`).join('')+'<span class="swipe-cue">← Feed</span>';
    }
  }
  // Chip click → filter. Also catches .mag-drill ("Ver todas" button in the
  // magazine stage cell) since it carries data-filter for the same routing.
  document.addEventListener('click',e=>{
    const c=e.target.closest('.m-chip, .mag-drill');
    if(!c)return;
    activeFilter=c.dataset.filter||null;
    renderMobile();
  });

  // ── Magazine interactions ─────────────────────────────────────────────
  // Hover anywhere on a cell pauses ITS cycle (others keep going).
  document.addEventListener('mouseover',e=>{
    const cell=e.target.closest('.mag-front [data-group]');
    if(!cell) return;
    magState.paused[cell.dataset.group]=true;
  });
  document.addEventListener('mouseout',e=>{
    const cell=e.target.closest('.mag-front [data-group]');
    if(!cell) return;
    if(cell.contains(e.relatedTarget)) return;  // still inside the cell
    magState.paused[cell.dataset.group]=false;
  });
  // Click a satellite (outside its buttons) → spotlight that section.
  document.addEventListener('click',e=>{
    if(e.target.closest('.mag-dot, .mag-noticias-tab, .mag-drill, a, button')) return;
    const sat=e.target.closest('.mag-satellite');
    if(!sat) return;
    const g=sat.dataset.group;
    if(!g || g===magState.featured) return;
    magState.featured=g;
    renderMobile();
  });
  // Click a dot → jump to that slide. Resets the cell's cycle timer.
  document.addEventListener('click',e=>{
    const dot=e.target.closest('.mag-dot');
    if(!dot) return;
    e.stopPropagation();
    const cell=dot.closest('[data-group]');
    if(!cell) return;
    const g=cell.dataset.group;
    magState.slideIdx[g]=parseInt(dot.dataset.slideIdx)||0;
    updateCell(g);
    bumpCellTimer(g);
  });
  // Click a satellite tile / active pin row → set that slide as the section's
  // current AND promote the section to the stage so the clicked post opens
  // in the big spread. Click on a stage no-image thumb → just navigate within
  // the stage (no swap needed; we're already there).
  document.addEventListener('click',e=>{
    const target=e.target.closest('.mag-tile, .mag-row');
    if(!target) return;
    e.stopPropagation();
    const cell=target.closest('[data-group]');
    if(!cell) return;
    const g=cell.dataset.group;
    magState.slideIdx[g]=parseInt(target.dataset.slideIdx)||0;
    if(cell.dataset.cell==='satellite' && magState.featured!==g){
      magState.featured=g;
      renderMobile();  // full rebuild swaps stage ↔ clicked satellite
    } else {
      updateCell(g);
    }
    bumpCellTimer(g);
  });
  // Click a noticias time-of-day tab → switch batch, warm the new batch's images, reset timer.
  document.addEventListener('click',e=>{
    const tab=e.target.closest('.mag-noticias-tab');
    if(!tab) return;
    e.stopPropagation();
    magState.noticiasBatchIdx=parseInt(tab.dataset.batchIdx)||0;
    magState.slideIdx.scant=0;
    preloadImagesFor(magBatchFor('scant'));
    updateCell('scant');
    bumpCellTimer('scant');
  });
  // Keyboard: Enter/Space on a focused satellite spotlights it.
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ') return;
    const sat=e.target.closest && e.target.closest('.mag-satellite');
    if(!sat) return;
    e.preventDefault();
    const g=sat.dataset.group;
    if(g && g!==magState.featured){ magState.featured=g; renderMobile(); }
  });
  // Keyboard: ← / → navigate the stage post-by-post. When you hit the end
  // of the current section's batch, jump to the next non-empty section's
  // first slide (mirrors the auto-advance behavior). When you hit the
  // start, jump back to the previous section's last slide. Skipped when
  // the lightbox is open (it has its own ← / → for the carousel) or when
  // a text input is focused.
  document.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    if(!document.body.classList.contains('sidebar-fullscreen')) return;
    const lb=document.getElementById('lightbox');
    if(lb && lb.classList.contains('open')) return;
    if(e.target && e.target.matches && e.target.matches('input, textarea, [contenteditable], select')) return;
    const g=magState.featured;
    if(!g) return;
    const batch=magBatchFor(g);
    if(!batch || !batch.length) return;
    e.preventDefault();
    const cur=magState.slideIdx[g]||0;
    if(e.key==='ArrowRight'){
      if(cur+1 >= batch.length){
        advanceFeatured(g);
      } else {
        magState.slideIdx[g]=cur+1;
        updateCell(g);
        bumpCellTimer(g);
      }
    } else {
      if(cur-1 < 0){
        retreatFeatured(g);
      } else {
        magState.slideIdx[g]=cur-1;
        updateCell(g);
        bumpCellTimer(g);
      }
    }
  });
  // Mode toggle click — switch between Telegram and Translations (mobile + desktop)
  document.querySelectorAll('.m-mode-toggle').forEach(toggle=>{
    toggle.addEventListener('click',e=>{
      const seg=e.target.closest('.m-mode-seg');
      if(!seg)return;
      activeFilter=seg.dataset.mode==='tl'?'__tl':null;
      renderMobile();
    });
  });

  // Tap a tg card → expand. Once expanded, only the top zone collapses it
  // (so text/source/footer remain freely selectable for copy-paste).
  document.addEventListener('click',e=>{
    const card=e.target.closest('.m-tg-item');
    if(!card)return;
    if(e.target.closest('a, button'))return;  // interactive children handle themselves
    if(card.closest('.m-tg-list.spacious'))return;  // no-op in spacious
    if(card.closest('.mag-front'))return;  // magazine cells manage their own layout
    if(card.classList.contains('expanded')){
      // Collapse only on chevron, meta-row, or the image
      const topZone = e.target.closest('.expand-chevron, .meta-row') || e.target.tagName==='IMG';
      if(topZone) card.classList.remove('expanded');
    } else {
      // Don't expand from a text selection — if the user is dragging to select, leave the card alone
      const sel = window.getSelection && window.getSelection();
      if(sel && sel.toString().length > 0) return;
      card.classList.add('expanded');
    }
  });

  // Refresh button: hard-reload the page (since body overflow is locked, pull-to-refresh doesn't work)
  const refreshBtn=document.getElementById('m-refresh');
  if(refreshBtn){
    refreshBtn.addEventListener('click',()=>{
      refreshBtn.classList.add('spinning');
      setTimeout(()=>location.reload(), 250);
    });
  }


  // Sidebar resize: drag the left edge to make it wider/narrower. Persists in localStorage.
  // Min 240px; max = full viewport width (drag all the way to swallow the apps
  // grid into a fullscreen reader). Once the sidebar passes 70% of the viewport,
  // body.sidebar-fullscreen kicks in and hides the apps grid. Drag back below
  // 70% to restore.
  (function(){
    const main=document.querySelector('.main');
    const handle=document.getElementById('sidebar-resize');
    if(!main||!handle)return;
    const maxW=()=>window.innerWidth;
    const fsThreshold=()=>Math.floor(window.innerWidth*0.70);
    const applyFullscreen=(w)=>{
      const was=document.body.classList.contains('sidebar-fullscreen');
      document.body.classList.toggle('sidebar-fullscreen', w>=fsThreshold());
      const now=document.body.classList.contains('sidebar-fullscreen');
      if(was!==now) renderMobile();  // flip between magazine and scroll on threshold cross
    };
    // Restore saved width on load (clamp to current viewport's max)
    const saved=parseInt(localStorage.getItem('sidebar-width')||'',10);
    if(saved && saved>=240){
      const clamped=Math.min(saved, maxW());
      main.style.gridTemplateColumns='1fr '+clamped+'px';
      applyFullscreen(clamped);
    }
    let dragging=false, startX=0, startW=0;
    handle.addEventListener('mousedown',e=>{
      dragging=true;
      startX=e.clientX;
      startW=document.querySelector('.sidebar').offsetWidth;
      handle.classList.add('dragging');
      document.body.classList.add('sidebar-resizing');
      e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      const dx=startX-e.clientX;  // moving left increases width (sidebar is on the right)
      const newW=Math.max(240, Math.min(maxW(), startW+dx));
      main.style.gridTemplateColumns='1fr '+newW+'px';
      applyFullscreen(newW);
    });
    document.addEventListener('mouseup',()=>{
      if(!dragging)return;
      dragging=false;
      handle.classList.remove('dragging');
      document.body.classList.remove('sidebar-resizing');
      const w=document.querySelector('.sidebar').offsetWidth;
      try{localStorage.setItem('sidebar-width',w)}catch{}
    });
    // Re-apply fullscreen state when the viewport itself resizes
    window.addEventListener('resize',()=>{
      const w=document.querySelector('.sidebar').offsetWidth;
      applyFullscreen(w);
    });
    // Arrow-key navigation between posts when in fullscreen reader.
    // ↓ scrolls to the next .m-tg-item; ↑ to the previous one. The
    // 'current' item is the one whose top is at or just above the
    // visible scroll top. Smooth scroll + scroll-margin-top from CSS
    // keeps it from butting into the chips strip.
    document.addEventListener('keydown',e=>{
      if(!document.body.classList.contains('sidebar-fullscreen'))return;
      // Don't hijack typing
      if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='j'&&e.key!=='k')return;
      const list=document.querySelector('.sidebar .m-tg-list');
      if(!list)return;
      const items=[...list.querySelectorAll('.m-tg-item')];
      if(!items.length)return;
      const listRect=list.getBoundingClientRect();
      // Find current: first item whose top is within (or just below) the
      // top edge of the list. Use 80px tolerance for the chips strip.
      const tol=80;
      let cur=0;
      for(let i=0;i<items.length;i++){
        const r=items[i].getBoundingClientRect();
        if(r.top-listRect.top<=tol+1) cur=i;
        else break;
      }
      const dir=(e.key==='ArrowDown'||e.key==='j')?1:-1;
      const next=Math.max(0,Math.min(items.length-1,cur+dir));
      if(next===cur && dir>0)return;  // already at the end
      e.preventDefault();
      items.forEach(it=>it.classList.remove('reader-current'));
      items[next].classList.add('reader-current');
      items[next].scrollIntoView({behavior:'smooth',block:'start'});
    });
  })();

  // View toggle: compact ⇄ spacious. Preference persists in localStorage.
  // Both mobile and desktop sidebar share the same mode + button class.
  let viewMode = (function(){try{return localStorage.getItem('m-tg-view')||'compact'}catch{return 'compact'}})();
  function applyView(){
    document.querySelectorAll('.m-tg-list').forEach(l=>l.classList.toggle('spacious', viewMode==='spacious'));
    document.querySelectorAll('.m-view-btn').forEach(b=>{b.textContent = viewMode==='spacious' ? '☰' : '▦'});
  }
  document.querySelectorAll('.m-view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      viewMode = viewMode==='spacious' ? 'compact' : 'spacious';
      try{localStorage.setItem('m-tg-view',viewMode)}catch{}
      applyView();
      renderMobile();  // re-render to clear any stale .expanded state
    });
  });
  applyView();
  // Fetch translations manifest in parallel (so the chip can appear once data lands)
  fetch('translations/manifest.json?v='+Date.now()).then(r=>r.ok?r.json():[]).then(data=>{
    translationItems=(data||[]).slice().sort((a,b)=>(b.translated_date||'').localeCompare(a.translated_date||''));
    renderMobile();
  }).catch(()=>{});

  // Fetch sends.ndjson (preferred), fallback to tg-feed.json
  fetch('sends.ndjson?v='+Date.now(),{cache:'no-store'}).then(r=>{
    if(!r.ok)throw 0; return r.text();
  }).then(text=>{
    mobileItems=text.split('\n').filter(Boolean).map(l=>{
      try{return JSON.parse(l)}catch{return null}
    }).filter(s=>s&&s.chat==='resisres').sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    renderMobile();
  }).catch(()=>{
    // Fallback: shape tg-feed.json into the mobile schema
    fetch('tg-feed.json?v='+Date.now()).then(r=>r.json()).then(data=>{
      mobileItems=(data||[]).map(x=>({
        ts:x.date+'T00:00:00', task:'', chat:'resisres',
        msg_id:x.id, text:x.text, img:x.img,
        url:`https://t.me/resisres/${x.id}`
      }));
      renderMobile();
    }).catch(()=>{mobileItems=[];renderMobile()});
  });
})();

/* ─── Mobile 2-page interactions: strip empty-area swipe + dot tracking ─── */
(function(){
  const pages=document.getElementById('mobile-pages');
  if(!pages)return;
  // Tap empty area of a strip → scroll-snap to the other page.
  // Tap on a link/button inside the strip → that link/button handles itself.
  document.addEventListener('click',e=>{
    const strip=e.target.closest('.m-strip');
    if(!strip)return;
    if(e.target.closest('a, button'))return;  // hybrid: item taps work normally
    pages.scrollTo({left: strip.dataset.go==='apps'?window.innerWidth:0, behavior:'smooth'});
  });
  // Update dot indicators as the user scrolls between pages
  let raf=0;
  pages.addEventListener('scroll',()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      const onB=pages.scrollLeft > window.innerWidth/2;
      document.querySelectorAll('.m-dots').forEach(d=>{
        d.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('active', i===(onB?1:0)));
      });
    });
  },{passive:true});
})();

/* ─── Lightbox: click any feed image to view at full resolution.
   Single-image mode for feed-item clicks; carousel mode for gallery posts
   (📸 Mañanera albums) — opens at the clicked tile's index and supports
   prev/next via on-screen arrows or ← / → keys. ───────────────────────── */
(function(){
  let lb;
  // Carousel state — populated by openCarousel, cleared on close.
  let imgs=[], idx=0;
  function ensureLB(){
    if(lb)return lb;
    lb=document.createElement('div');
    lb.id='lightbox';
    lb.innerHTML='<button class="lb-close" aria-label="Close">×</button>'
               +'<div class="lb-counter"></div>'
               +'<button class="lb-prev" aria-label="Previous">‹</button>'
               +'<button class="lb-next" aria-label="Next">›</button>'
               +'<img alt="">';
    document.body.appendChild(lb);
    lb.addEventListener('click',e=>{
      // Clicking the image or the nav buttons should NOT close — only backdrop.
      if(e.target.tagName==='IMG') return;
      if(e.target.closest('.lb-prev,.lb-next,.lb-close,.lb-counter')) return;
      close();
    });
    lb.querySelector('.lb-prev').addEventListener('click',e=>{e.stopPropagation();step(-1)});
    lb.querySelector('.lb-next').addEventListener('click',e=>{e.stopPropagation();step(1)});
    return lb;
  }
  function syncCarouselUI(){
    if(!lb) return;
    lb.querySelector('img').src = imgs[idx];
    lb.querySelector('.lb-counter').textContent = `${idx+1} / ${imgs.length}`;
    lb.querySelector('.lb-prev').classList.toggle('disabled', idx===0);
    lb.querySelector('.lb-next').classList.toggle('disabled', idx===imgs.length-1);
  }
  function step(delta){
    if(!imgs.length) return;
    const next = idx + delta;
    if(next<0 || next>=imgs.length) return;
    idx = next;
    syncCarouselUI();
  }
  function open(src){
    const el=ensureLB();
    imgs=[]; idx=0;
    el.classList.remove('lb-carousel');
    el.querySelector('img').src=src;
    el.classList.add('open');
    document.documentElement.style.overflow='hidden';
  }
  function openCarousel(imageList, startIdx){
    const el=ensureLB();
    imgs = imageList.slice();
    idx = Math.max(0, Math.min(startIdx|0, imgs.length-1));
    el.classList.add('lb-carousel');
    syncCarouselUI();
    el.classList.add('open');
    document.documentElement.style.overflow='hidden';
  }
  function close(){
    if(lb){ lb.classList.remove('open','lb-carousel'); }
    imgs=[]; idx=0;
    document.documentElement.style.overflow='';
  }
  // Capture phase: intercept image clicks BEFORE the source-card <a> or any parent click handler fires
  document.addEventListener('click',e=>{
    // Gallery tile click → open carousel at this index.
    const tile = e.target.closest('.mag-stage.gallery-hero .mag-tile.gallery-tile');
    if(tile){
      const stage = tile.closest('.mag-stage');
      const group = stage && stage.dataset.group;
      if(group && window.__magSlideImgs && window.__magSlideImgs[group]){
        e.preventDefault(); e.stopPropagation();
        openCarousel(window.__magSlideImgs[group], parseInt(tile.dataset.galleryIdx)||0);
        return;
      }
    }
    const img=e.target.closest('.m-tg-item > img, .m-tg-item .src-img');
    if(!img||!img.src)return;
    e.preventDefault();e.stopPropagation();
    open(img.src);
  },true);
  document.addEventListener('keydown',e=>{
    if(!lb || !lb.classList.contains('open')) return;
    if(e.key==='Escape'){ close(); return }
    if(lb.classList.contains('lb-carousel')){
      if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1) }
      else if(e.key==='ArrowRight'){ e.preventDefault(); step(1) }
    }
  });
})();
</script>
</body></html>
