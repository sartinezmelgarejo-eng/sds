:root{--bg:#0e0c09;--panel:#171310;--ink:#ece3d2;--dim:#9a8f7c;--gold:#d8b46a;--line:#2a2118;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:22px 26px 60px}
h1{font-family:Georgia,serif;font-weight:600;font-size:26px;margin:0 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.big{display:flex;gap:26px;align-items:flex-end;margin:14px 0 24px;flex-wrap:wrap}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:120px}
.metric .n{font-size:32px;font-weight:700;color:var(--gold);line-height:1}
.metric .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.coll{margin:12px 0}
.coll .row{display:flex;align-items:center;gap:12px;margin-bottom:5px}
.coll .name{width:190px;font-size:14px}.coll .name b{color:var(--ink)}.coll .name span{color:var(--dim);font-size:12px}
.bar{flex:1;height:20px;background:#221b12;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar .fill{height:100%;background:linear-gradient(90deg,#6a5426,#d8b46a);transition:width .5s}
.bar .lab{position:absolute;right:8px;top:2px;font-size:11px;color:#e9dcc0;text-shadow:0 1px 2px #000}
.funnel{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-align:center;min-width:96px}
.stage .n{font-size:22px;font-weight:700;color:var(--gold)}.stage .l{font-size:11px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.stage .pct{font-size:11px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#20190f;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--ink)}
.chip b{color:var(--gold)}
.wave{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.wave table{width:100%;border-collapse:collapse;font-size:13px}
.wave th{text-align:left;padding:8px 10px;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.wave td{padding:7px 10px;border-bottom:1px solid #1d160e}
.wave tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;background:var(--wait)}
.dot.on{background:var(--ok);box-shadow:0 0 6px rgba(109,181,109,.5)}
.stgs{white-space:nowrap}
.muted{color:var(--dim)}
.tag{background:#20190f;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--dim);margin-right:3px}

const STG=S.stages, LAB={texto:'Texto',portada:'Portada',card:'Card',eventos:'Eventos',deck:'Deck',deploy:'En línea'};
function pct(n,d){return d?Math.round(100*n/d):0}
// big metrics
const done=S.books.filter(b=>b.stages.card).length;
const live=S.books.filter(b=>b.stages.deploy).length;
const ev=S.books.reduce((a,b)=>a+(b.nEventos||0),0);
const ci=S.books.reduce((a,b)=>a+(b.nCitas||0),0);
document.getElementById('big').innerHTML=[
 ['n',S.total,'libros totales'],['n2',done,'con card ('+pct(done,S.total)+'%)'],
 ['n3',live,'en línea'],['ev',ev,'eventos aportados'],['ci',ci,'citas verbatim']
].map(m=>`<div class="metric"><div class="n">${m[1]}</div><div class="l">${m[2]}</div></div>`).join('');
// per collection
const colls={};S.books.forEach(b=>{(colls[b.coll_label]=colls[b.coll_label]||[]).push(b)});
document.getElementById('colls').innerHTML=Object.entries(colls).map(([name,bs])=>{
 const d=bs.filter(b=>b.stages.card).length;const p=pct(d,bs.length);
 return `<div class="coll"><div class="row"><div class="name"><b>${name}</b> <span>${d}/${bs.length}</span></div>
 <div class="bar"><div class="fill" style="width:${p}%"></div><div class="lab">${p}%</div></div></div></div>`;
}).join('');
// funnel
document.getElementById('funnel').innerHTML=STG.map(s=>{
 const n=S.books.filter(b=>b.stages[s]).length;
 return `<div class="stage"><div class="n">${n}</div><div class="l">${LAB[s]}</div><div class="pct">${pct(n,S.total)}%</div></div>`;
}).join('');
// categories
const est={},tags={};S.books.forEach(b=>{if(b.estante)est[b.estante]=(est[b.estante]||0)+1;(b.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1)});
const estChips=Object.entries(est).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="chip">${k} <b>${v}</b></div>`).join('');
const tagChips=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,14).map(([k,v])=>`<div class="chip">${k} <b>${v}</b></div>`).join('');
document.getElementById('cats').innerHTML=(estChips||'<span class="muted">— aún sin categorizar —</span>')+(tagChips?'<div style="width:100%;height:6px"></div>'+tagChips:'');
