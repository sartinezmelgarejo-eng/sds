<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Librería — La biblioteca de la historia de México</title>
<meta name="description" content="390 libros en seis estantes, del México profundo a la Cuarta Transformación, con sus ideas, sus citas y su lugar en el tiempo.">
<script>
(function(){var t;try{t=localStorage.getItem('v2-theme')}catch(e){}
if(t!=='day'&&t!=='night'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'night':'day'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ Tokens: una sola gramática, dos luces ═══ */
:root,[data-theme=day]{
  --bg:#F4EFE6;--paper:#FBF8F2;--ink:#1F1B16;--ink2:#6B6157;--rule:#D8CDBD;--acc:#8C1C2B;--on-acc:#FFFFFF;--field:#FFFFFF;
  --wood:#6d4b2d;--wood-hi:#7a5536;--wood-lo:#5a3c22;--case-a:#6a482b;--case-b:#4a321d;--bay-a:#e9dfcc;--bay-b:#f3ecdf;--plate:#c9a467;
  --d0:#cbbfae;--d1:#b07a6c;--land:#ece4d6;--landbd:#cdbfaa;--mex:#f7f1e6;--mexbd:#a99a85;--stbd:#d6c9b6;
  --c1:#2F6F6A;--c2:#5B7F3A;--c3:#8C1C2B;--c4:#5E4B8B;--c5:#2E5A87;--c6:#A0526E;
  --serif:'EB Garamond',Georgia,serif;--k:1;
  --glow:none;--head-bg:rgba(251,248,242,.94);
  --sh-cover:2px 2px 0 rgba(0,0,0,.06),6px 8px 16px -6px rgba(40,25,10,.45);
  --sh-card:0 18px 40px -18px rgba(40,25,10,.45);
}
[data-theme=night]{
  --bg:#15110D;--paper:#1E1914;--ink:#EDE3D2;--ink2:#A8987F;--rule:#3A3026;--acc:#C49A5A;--on-acc:#1a130b;--field:#120f0c;
  --wood:#4a3320;--wood-hi:#5a3f28;--wood-lo:#2c1f14;--case-a:#3b2817;--case-b:#22170d;--bay-a:#120e0a;--bay-b:#1b1510;--plate:#b8914f;
  --d0:#3b3228;--d1:#8a6a3c;--land:#211b15;--landbd:#3d332a;--mex:#2a221b;--mexbd:#6b5a45;--stbd:#3f352b;
  --c1:#7FB3A8;--c2:#9DB57A;--c3:#C4664F;--c4:#A08CC8;--c5:#7FA2C8;--c6:#C98AA5;
  --serif:'Cormorant Garamond',Georgia,serif;--k:1.1;
  --glow:radial-gradient(1200px 520px at 50% -140px,rgba(230,170,90,.15),transparent 70%);--head-bg:rgba(21,17,13,.88);
  --sh-cover:0 14px 22px -10px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04);
  --sh-card:0 24px 50px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--ink);font-family:var(--serif);font-size:calc(17px*var(--k));line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.ui,.btn,.chip,input,select{font-family:Inter,system-ui,sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ═══ Header ═══ */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:30px;padding:14px 48px;background:var(--head-bg);border-bottom:1px solid var(--rule);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.02em;white-space:nowrap;line-height:1}
.brand small{font-size:inherit;color:var(--acc)}
[data-theme=night] .brand{font-weight:600;font-variant:small-caps;letter-spacing:.06em;font-size:28px}
nav.main{display:flex;gap:24px;font-family:Inter,sans-serif;font-size:14px;letter-spacing:.02em}
nav.main a{padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--acc)}
nav.main a.on{color:var(--acc);border-bottom-color:var(--acc)}
header .flex1{flex:1}
.hsearch{position:relative;width:340px;max-width:32vw}
.hsearch input,.bigsearch input{width:100%;border:1px solid var(--rule);background:var(--field);color:var(--ink);border-radius:999px;padding:10px 18px 10px 40px;font-size:14px}
.hsearch svg,.bigsearch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.hsearch input::placeholder,.bigsearch input::placeholder{color:var(--ink2)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--rule);color:var(--ink)}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.only-m{display:none!important}
.tabbar{display:none}

/* ═══ Botones / chips ═══ */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:11px 18px;border-radius:999px;background:var(--acc);color:var(--on-acc);border:1px solid var(--acc);white-space:nowrap}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.alt:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{font-size:13px;padding:7px 14px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
a.chip:hover,button.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.kick{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.more{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.more:hover{color:var(--acc)}

/* ═══ Portadas ═══ */
.cv{position:relative;background:var(--rule);box-shadow:var(--sh-cover);border-radius:2px;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover}
.tcov{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10%;color:#f4ecdc;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 12%),var(--tc,#6b4a2e);text-align:center;font-family:var(--serif)}
.tcov.lt{color:#1d160f}
.tcov b{font-weight:500;font-size:var(--tf,15px);line-height:1.15;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;border-top:1px solid currentColor;border-bottom:1px solid currentColor;padding:8% 0;opacity:.95}
.tcov span{font-family:Inter,sans-serif;font-size:calc(var(--tf,15px)*.62);letter-spacing:.12em;text-transform:uppercase;opacity:.8}

/* ═══ Home ═══ */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;padding:64px 56px 56px;align-items:center;border-bottom:1px solid var(--rule)}
[data-theme=day] .hero{background:var(--paper)}
.hero h1{font-weight:500;font-size:68px;line-height:1;margin:0;letter-spacing:-.005em}
[data-theme=night] .hero h1{font-style:italic;font-size:76px;line-height:.95}
.hero .lead{font-size:calc(21px*var(--k));line-height:1.5;max-width:580px;margin:22px 0 18px}
.stats{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.bigsearch{position:relative;margin-top:26px;max-width:580px}
.bigsearch input{padding:16px 22px 16px 46px;font-size:16px}
.bigsearch svg{left:18px}
.feat{display:flex;gap:28px;align-items:flex-end;justify-content:center}
.feat .cv{width:210px;height:316px;flex:0 0 auto}
.feat .fq{max-width:280px;font-size:calc(19px*var(--k));font-style:italic;line-height:1.45}
.feat .fq .kick{display:block;font-style:normal;margin-bottom:10px}
.feat .fq small{display:block;font-style:normal;font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.4}
.feat .fq a:hover{color:var(--acc)}
.feat .ft{display:block;font-style:normal;font-weight:500;font-size:calc(26px*var(--k));line-height:1.15;margin:2px 0 10px}
.feat .bl{display:block;font-style:normal;font-size:calc(17px*var(--k));line-height:1.45;color:var(--ink2)}
.feat .face{width:210px;height:250px;flex:0 0 auto;border-radius:3px;overflow:hidden;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.feat .face img{width:100%;height:100%;object-fit:cover;display:block}
.feat .mini{display:flex;gap:8px;margin-top:12px}.feat .mini .cv{width:46px;height:68px}
.feat .otro{display:inline-block;margin-top:14px;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:none;cursor:pointer}
.feat .otro:hover{color:var(--acc);border-color:var(--acc)}
#destacado{min-height:330px;display:flex;align-items:center}

.est{padding:44px 56px 20px;border-bottom:1px solid var(--rule)}
.est .hd{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.est h2{font-size:36px;margin:0;font-weight:500;line-height:1.1}
[data-theme=night] .est h2{font-variant:small-caps;letter-spacing:.05em}
.est .num{font-size:20px;color:var(--acc);font-family:var(--serif)}
.est .cnt{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.est .more{margin-left:auto}
.est .desc{color:var(--ink2);font-size:calc(16.5px*var(--k));margin:0 0 22px;max-width:780px}
.rowscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;margin:0 -56px;padding:0 56px 6px;scroll-padding:0 56px}
.track{display:inline-flex;gap:22px;align-items:flex-start;min-width:100%;padding-top:8px;background:linear-gradient(var(--wood-hi),var(--wood-lo)) 0 180px/100% 10px no-repeat;position:relative}
.track:after{content:"";position:absolute;left:0;right:0;top:190px;height:10px;background:linear-gradient(rgba(40,25,10,.28),transparent);pointer-events:none}
.bk{flex:0 0 auto;width:118px;display:block}
.bk .cv{width:118px;height:172px;transition:transform .18s ease}
.bk:hover .cv,.bk:focus-visible .cv{transform:translateY(-4px)}
.bk .meta{font-family:Inter,sans-serif;font-size:11.5px;line-height:1.3;margin-top:22px;color:var(--ink2)}
.bk .meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;color:var(--ink);margin-bottom:2px}
.bk .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlband{padding:38px 56px;border-bottom:1px solid var(--rule)}
[data-theme=day] .tlband{background:var(--paper)}
[data-theme=night] .tlband{background:linear-gradient(90deg,#1b1611,#221b14,#1b1611)}
.tlband h2{margin:0 0 4px;font-size:32px;font-weight:500}
.tlband p{margin:0 0 20px;color:var(--ink2);font-size:calc(17px*var(--k))}
.erachips{display:flex;gap:10px;flex-wrap:wrap}
.erachip{font-family:Inter,sans-serif;padding:8px 14px;font-size:13px;background:rgba(127,127,127,.08);border-left:3px solid var(--c);display:inline-flex;gap:8px;align-items:baseline}
.erachip small{color:var(--ink2);font-size:11px}
.erachip:hover{background:rgba(127,127,127,.16)}
footer.foot{padding:40px 56px 60px;font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap}
footer.foot a{text-decoration:underline;text-underline-offset:3px}

/* ═══ Librero ═══ */
.subbar{position:sticky;top:67px;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 48px;background:var(--head-bg);border-bottom:1px solid var(--rule);font-family:Inter,sans-serif;font-size:13px;color:var(--ink2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.jump{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.jump::-webkit-scrollbar{display:none}
.jump a{white-space:nowrap;padding:4px 0}
.jump a b{color:var(--ink);font-weight:600;margin-right:4px}
.jump a:hover{color:var(--acc)}
.jump i{font-style:normal;opacity:.5}
.total{white-space:nowrap}
.tabs{display:flex;gap:2px;background:rgba(127,127,127,.12);padding:3px;border-radius:999px;flex:0 0 auto}
.tabs button{padding:6px 14px;border-radius:999px;font-family:Inter,sans-serif;font-size:13px;color:var(--ink)}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
.wrap{padding:28px 48px 60px}
.case{background:linear-gradient(var(--case-a),var(--case-b));padding:14px;border-radius:3px;box-shadow:0 24px 44px -20px rgba(40,25,10,.6);display:flex;flex-direction:column;gap:14px}
[data-theme=night] .case{box-shadow:0 30px 60px -20px rgba(0,0,0,.9)}
.bay{padding:14px 12px 2px;border-radius:2px;box-shadow:inset 0 10px 18px -8px rgba(0,0,0,.45);background:linear-gradient(180deg,var(--bay-a),var(--bay-b) 40%,var(--bay-a))}
[data-theme=night] .bay{background:radial-gradient(800px 200px at 50% 0,rgba(255,200,130,.10),transparent),linear-gradient(180deg,var(--bay-a),var(--bay-b))}
.plate{display:inline-flex;gap:10px;align-items:baseline;background:linear-gradient(#e2c78f,var(--plate) 55%,#9c7a3e);color:#2a1d0c;padding:5px 14px;border-radius:2px;font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 4px rgba(0,0,0,.4);margin:0 0 6px 6px;white-space:nowrap}
.plate i{font-style:normal;font-size:12px;opacity:.75;letter-spacing:.05em;text-transform:none}
.shelfrow{display:flex;align-items:flex-end;gap:2px;padding:16px 6px 0;border-bottom:12px solid var(--wood);box-shadow:0 8px 10px -6px rgba(0,0,0,.5);margin-bottom:16px;min-height:200px}
.shelfrow.face{gap:12px;min-height:196px}
.sp{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-radius:2px 2px 0 0;color:#f6efe2;
  background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 28%,rgba(255,255,255,.07) 50%,transparent 72%,rgba(0,0,0,.26)),
             linear-gradient(transparent 7px,rgba(255,236,190,.22) 7px,rgba(255,236,190,.22) 9px,transparent 9px,transparent calc(100% - 9px),rgba(255,236,190,.22) calc(100% - 9px),rgba(255,236,190,.22) calc(100% - 7px),transparent calc(100% - 7px)),var(--sc);
  box-shadow:inset -3px 0 4px rgba(0,0,0,.25),inset 3px 0 3px rgba(255,255,255,.12);overflow:hidden;white-space:nowrap;transition:transform .2s ease,box-shadow .2s;font-family:var(--serif)}
.sp.lt{color:#1d160f}
.sp .t{font-weight:500;font-size:13px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;max-height:74%}
[data-theme=night] .sp .t{font-size:14px;font-weight:600}
.sp .au{font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.78;overflow:hidden;max-height:26%}
.sp:hover,.sp:focus-visible{transform:rotate(180deg) translateY(8px)}
.sp.lift{transform:rotate(180deg) translateY(16px);box-shadow:inset -3px 0 4px rgba(0,0,0,.25),0 -6px 14px rgba(0,0,0,.35)}
.fc{flex:0 0 auto;width:112px;height:168px;display:block;transition:transform .2s ease}
.fc .cv{width:100%;height:100%}
.fc:hover,.fc:focus-visible{transform:translateY(-6px)}
.fc.lift{transform:translateY(-14px)}

/* ═══ Ficha ═══ */
.det{display:grid;grid-template-columns:300px 1fr;gap:56px;padding:48px 56px 80px;max-width:1240px;margin:0 auto}
.det .side{position:sticky;top:96px;align-self:start}
.det .side .cv{width:300px;height:440px}
.det .side .vols{margin-top:18px}
.chips{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.det h1{font-size:56px;font-weight:500;margin:0;line-height:1.04}
[data-theme=night] .det h1{font-size:60px}
.det .by{font-family:Inter,sans-serif;font-size:17px;margin:12px 0 22px;color:var(--ink2)}
.det .by a:hover{color:var(--acc)}
.btns{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.det .lede{font-size:calc(19px*var(--k));line-height:1.55;color:var(--ink2);max-width:720px;margin:0 0 6px}
.col{max-width:720px}
h3.sec{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:42px 0 14px;color:var(--ink2);font-weight:600}
.tesis{font-size:calc(22px*var(--k));line-height:1.55;margin:0}
.tesis .dc{float:left;font-size:76px;line-height:.8;padding:8px 10px 0 0;color:var(--acc);font-weight:500}
.prose{font-size:calc(18.5px*var(--k));line-height:1.6;margin:0 0 12px}
.ideas{counter-reset:i;padding:0;margin:0;list-style:none}
.ideas li{counter-increment:i;display:grid;grid-template-columns:44px 1fr;font-size:calc(18.5px*var(--k));line-height:1.5;margin-bottom:14px}
.ideas li:before{content:counter(i,decimal-leading-zero);font-size:15px;color:var(--acc);padding-top:3px}
.quote{margin:0 0 18px;padding:6px 0 6px 22px;border-left:3px solid var(--acc);font-size:calc(21px*var(--k));font-style:italic;line-height:1.45}
[data-theme=night] .quote{border-left-width:2px}
.quote footer{font-style:normal;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;margin-top:8px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.quote footer a{color:var(--acc);font-weight:600;display:inline-flex;gap:5px;align-items:center}
.quote footer a svg{width:14px;height:14px}
.conx{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;max-width:900px}
.conx a{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.conx a:hover{border-color:var(--acc)}
.conx .cv{width:56px;height:82px}
.conx b{display:block;font-weight:500;font-size:calc(17px*var(--k));line-height:1.2}
.conx small{display:block;font-family:Inter,sans-serif;font-size:11.5px;color:var(--ink2);margin:3px 0 5px}
.conx p{margin:0;font-size:calc(15px*var(--k));line-height:1.4;color:var(--ink2)}
.vols .chip{margin:0 6px 6px 0}

/* ═══ Páginas genéricas (estante, autor, atlas, búsqueda) ═══ */
.page{padding:48px 56px 80px;max-width:1320px;margin:0 auto}
.page h1{font-size:54px;font-weight:500;margin:6px 0 10px;line-height:1.05}
[data-theme=night] .page h1{font-variant:small-caps;letter-spacing:.03em}
.page .essay{font-size:calc(19px*var(--k));line-height:1.6;max-width:760px;color:var(--ink)}
.grid-bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:30px 22px;margin-top:30px}
.grid-bk .bk{width:auto}
.grid-bk .bk .cv{width:100%;height:auto;aspect-ratio:118/172}
.grid-bk .bk .meta{margin-top:10px}
.res-group{margin-top:34px}
.res-group h2{font-size:26px;font-weight:500;margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.res-group h2 small{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);letter-spacing:.1em}
.res-list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.res-list a{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 6px;border-bottom:1px solid var(--rule)}
.res-list a:hover{background:var(--paper)}
.res-list .d{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);padding-top:3px}
.res-list p{margin:0;font-size:calc(17px*var(--k));line-height:1.35}
.res-list small{font-family:Inter,sans-serif;font-size:11px;color:var(--ink2)}
mark{background:transparent;color:var(--acc);font-weight:600}
.atlas-g{margin-top:40px}
.atlas-g h2{font-size:30px;font-weight:500;margin:0 0 14px;border-bottom:1px solid var(--rule);padding-bottom:8px}

.ctl{border-left:1px solid var(--rule);margin-left:6px;padding-left:22px}

/* ═══ Línea del tiempo ═══ */
.ribbon{display:flex;gap:2px;padding:18px 48px 0;font-family:Inter,sans-serif;overflow-x:auto;scrollbar-width:none}

.seg{border-top:4px solid var(--rule);padding:8px 6px 4px;min-width:0;text-align:left;display:block}

.tgrid{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:40px;padding:26px 48px 40px;align-items:stretch}

.tfilters select{flex:1 1 40%;max-width:none;width:0}
.cnt{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);letter-spacing:.04em;margin:4px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnt a{color:var(--acc);font-weight:600}
.evlist{border-top:1px solid var(--rule)}
.yr{font-size:calc(28px*var(--k));color:var(--acc);margin:16px 0 4px;font-weight:500;line-height:1.1}
.ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 10px;border-radius:4px;text-align:left;width:100%}
.ev:hover{background:rgba(127,127,127,.07)}
.ev.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--acc)}
.ev .md{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);padding-top:3px}
.ev p{margin:0;font-size:calc(17px*var(--k));line-height:1.35}
.ev .src{font-family:Inter,sans-serif;font-size:11px;color:var(--ink2);letter-spacing:.01em;display:block;margin-top:3px}
.sentinel{height:40px}
.evscroll{position:relative;max-height:calc(100vh - 100px);min-height:420px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;border-bottom:1px solid var(--rule)}
.mapw{position:sticky;top:84px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px 18px 14px}
.mapw .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mapw .hd .kick{flex:1}
.mapw .seg2{display:flex;gap:2px;background:rgba(127,127,127,.12);padding:2px;border-radius:999px}

.mapw .seg2 button.on{background:var(--acc);color:var(--on-acc)}
.mapbox{position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.bm-land{fill:var(--land);stroke:var(--landbd);stroke-width:.7}
.bm-mex{fill:var(--mex);stroke:var(--mexbd);stroke-width:1.1}
.bm-st{fill:none;stroke:var(--stbd);stroke-width:.6}
.bm-stl{font:500 8.5px Inter,sans-serif;fill:var(--ink2);opacity:.55;text-anchor:middle;pointer-events:none}

.bm-ctl.sea{font-style:italic;font-weight:400;letter-spacing:.04em;font-family:'EB Garamond',serif;font-size:13px}
.dots0{stroke:var(--d0);stroke-linecap:round;fill:none}
.dots1{stroke:var(--d1);stroke-linecap:round;fill:none}
.pin{fill:var(--acc);stroke:var(--paper);stroke-width:2;cursor:pointer}
.pin.on{stroke-width:3}
.plbl{font-family:Inter,sans-serif;font-size:15px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.graticule{stroke:var(--rule);stroke-width:.6;fill:none;stroke-dasharray:2 4}
.evcard{position:relative;margin-top:12px;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:16px 18px;display:grid;grid-template-columns:64px 1fr;gap:14px}
.evcard.nocov{grid-template-columns:1fr}
.evcard .cv{width:64px;height:94px}
.evcard .d{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;font-weight:600}
.evcard h3{margin:4px 0 8px;font-size:calc(20px*var(--k));font-weight:500;line-height:1.18}
.evcard q{font-style:italic;font-size:calc(15px*var(--k));line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.evcard .bkl{font-family:Inter,sans-serif;font-size:11px;color:var(--ink2);margin-top:8px;line-height:1.4}

.ctrls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}

.rutas{padding:10px 48px 60px}

.rutas>p{margin:0 0 14px;color:var(--ink2)}
.rutas .chip{font-size:13px;padding:7px 14px;margin:0 6px 8px 0}
.ruta{margin-top:18px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:24px 26px}
.ruta h3{font-size:28px;font-weight:500;margin:0 0 4px}
.ruta>p{margin:0 0 18px;color:var(--ink2);font-size:calc(17px*var(--k));max-width:820px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:28px 56px 1fr;gap:12px;align-items:start}
.step:before{counter-increment:s;content:counter(s);font-family:Inter,sans-serif;font-size:13px;color:var(--acc);font-weight:600;padding-top:2px}
.step .cv{width:56px;height:82px}
.step b{font-weight:500;font-size:calc(17px*var(--k));line-height:1.2;display:block}
.step p{margin:4px 0 6px;font-size:calc(15px*var(--k));color:var(--ink2);line-height:1.4}
.step .lk{font-family:Inter,sans-serif;font-size:12px;display:flex;gap:12px}
.step .lk a{color:var(--acc)}

/* ═══ Lightbox ═══ */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,.94);display:none;flex-direction:column;align-items:center;justify-content:center;color:#EDE3D2}
.lb.on{display:flex}
.hdeck{position:relative;max-width:1240px;margin:28px auto 0;width:calc(100% - 96px);height:380px;border-radius:6px;overflow:hidden;background:#0d0a08;color:#F3EADB;box-shadow:0 24px 50px -28px rgba(0,0,0,.6);transition:height 1.6s cubic-bezier(.22,1,.36,1);cursor:default}
.hdeck .hstack{position:absolute;inset:0;filter:blur(20px) brightness(.42) saturate(.8);transform:scale(1.16);transition:filter 1.8s cubic-bezier(.22,1,.36,1) .2s,transform 1.8s cubic-bezier(.22,1,.36,1) .2s}
.hdeck .hs{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.hdeck .hs.on{opacity:1}
.hdeck .hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,10,8,.82),rgba(13,10,8,.35) 60%,rgba(13,10,8,.15));transition:opacity 1.2s}
.hdeck .hmeta{position:absolute;inset:0;display:flex;gap:34px;align-items:center;padding:0 48px;transition:opacity .9s ease,transform .9s ease}
.hdeck .hmeta .cv{width:170px;height:252px;flex:0 0 auto;box-shadow:0 18px 40px -14px rgba(0,0,0,.8)}
.hdeck .hm .kick{color:#d9b77a}.hdeck h1{font-size:calc(46px*var(--k));font-weight:500;margin:6px 0 4px;line-height:1.05;color:#F7EFE2}
.hdeck .by a{color:#d8ccb8;font-family:Inter,sans-serif;font-size:15px}.hdeck .btns{margin-top:20px}
.hdeck .btn.ghost{background:rgba(255,255,255,.08);color:#F3EADB;border:1px solid rgba(255,255,255,.25)}
.hdeck .hint{margin-top:16px;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;color:rgba(243,234,219,.55);animation:hpulse 2.4s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.35}}
.hdeck .hctl,.hdeck .hcap{position:absolute;opacity:0;pointer-events:none;transition:opacity .8s ease .9s}
.hdeck .hctl{right:14px;bottom:14px;display:flex;gap:6px;align-items:center;font-family:Inter,sans-serif;font-size:12px}
.hdeck .hctl .ib{width:34px;height:34px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:16px;cursor:pointer}
.hdeck .hctl .hc{background:rgba(0,0,0,.55);padding:7px 11px;border-radius:999px}
.hdeck .hcap{left:14px;bottom:14px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.6);padding:8px 14px 8px 8px;border-radius:6px;font-family:Inter,sans-serif;max-width:60%}
.hdeck .hcap .cv{width:30px;height:44px}.hdeck .hcap b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdeck .hcap small{font-size:11px;opacity:.75}
.hdeck.open{height:min(70vh,calc((min(100vw,1240px) - 96px)*9/16));cursor:zoom-in}
.hdeck.open .hstack{filter:none;transform:none}
.hdeck.open .hs{object-fit:contain;background:#000}
.hdeck.open .hshade{opacity:0}
.hdeck.open .hmeta{opacity:0;transform:translateY(10px);pointer-events:none}
.hdeck.open .hctl,.hdeck.open .hcap{opacity:1;pointer-events:auto}
.det.withdeck .side>.cv,.det.withdeck .main>h1,.det.withdeck .main>.by,.det.withdeck .main>.btns{display:none}
.lb .lbcap{position:absolute;top:18px;left:50%;transform:translate(-50%,-8px);display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.55);padding:8px 16px 8px 8px;border-radius:6px;font-family:Inter,sans-serif;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
.lb .lbcap.show{opacity:1;transform:translate(-50%,0)}.lb .lbcap .cv{width:36px;height:54px}.lb .lbcap b{display:block;font-size:14px}.lb .lbcap small{font-size:12px;opacity:.75}
.lb .lbnext{position:absolute;bottom:70px;right:24px;background:rgba(196,154,90,.92);color:#1a130b;padding:8px 14px;border-radius:999px;font-family:Inter,sans-serif;font-size:13px;opacity:0;transition:opacity .5s;pointer-events:none}
.lb .lbnext.show{opacity:1}
@media(max-width:760px){.hdeck{width:calc(100% - 24px);height:auto;min-height:300px;margin-top:12px}.hdeck .hmeta{position:relative;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 18px}.hdeck .hmeta .cv{width:96px;height:142px}.hdeck h1{font-size:30px}
 .hdeck.open{height:calc((100vw - 24px)*9/16 + 64px);min-height:0}.hdeck.open .hmeta{position:absolute}.hdeck .hcap{display:none}.hdeck .hctl{right:8px;bottom:8px}}

.lb .stage{position:relative;width:min(92vw,calc((100vh - 140px)*16/9));aspect-ratio:16/9;background:#000;border-radius:3px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb .stage img{width:100%;height:100%;object-fit:contain}
.lb .bar{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:Inter,sans-serif;font-size:13px}
.lb .bar .t{opacity:.75;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .ib{width:42px;height:42px;border-radius:999px;border:1px solid rgba(237,227,210,.3);display:inline-flex;align-items:center;justify-content:center;color:#EDE3D2}
.lb .ib:hover{border-color:#C49A5A;color:#C49A5A}
.lb .ib.on{background:#C49A5A;color:#1a130b;border-color:#C49A5A}
.lb .close{position:absolute;top:16px;right:18px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .nav.p{left:14px}.lb .nav.n{right:14px}

  <div class="stage"><img id="lbImg" alt=""><button class="ib nav p" data-lb="prev" aria-label="Anterior"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="ib nav n" data-lb="next" aria-label="Siguiente"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>

</div>
<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════
   Librería · v2
   Datos: libreria-data/ (generados por ~/scripts/library/build-v2-data.py)
   Rutas: #/estantes · #/estante/<id> · #/librero[/portadas|/anio] · #/libro/<id>
          #/tiempo[/<era>] · #/tiempo/evento/<era>-<i> · #/tiempo/libro/<id> · #/tiempo/ruta/<id>
          #/atlas[/<id>] · #/autor/<nombre> · #/buscar/<q>
   ══════════════════════════════════════════════════════════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmtN=n=>Number(n).toLocaleString('en-US');
const IS_MOBILE=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||window.innerWidth<=768;
const IS_ONLINE=location.protocol!=='file:';
const DATA_DIR='libreria-data/';
const ICON={
  arrow:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  pdf:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  slides:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8M10 8.5v4l3.5-2z"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor" stroke="none"/></svg>',
  pause:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>',
  prev:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  close:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
  ext:'<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>'
};

/* ── Tema ── */
function setThemeIcon(){const t=document.documentElement.dataset.theme;$('#themeBtn').innerHTML=t==='night'?ICON.sun:ICON.moon;$('#themeBtn').setAttribute('aria-label',t==='night'?'Cambiar a luz de día':'Cambiar a luz de noche');}
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='night'?'day':'night';document.documentElement.dataset.theme=t;try{localStorage.setItem('v2-theme',t)}catch(e){};setThemeIcon();if(T.mounted)drawMap();};
setThemeIcon();

/* ── Datos ── */
const D={core:null,B:{},E:{},idx:null,eras:{},search:null,atlas:null,libro:{}};
let VER='';
const getJ=u=>fetch(DATA_DIR+u+(VER?'?v='+VER:'')).then(r=>{if(!r.ok)throw new Error(u+' → '+r.status);return r.json();});
const memo={};
const once=(k,f)=>memo[k]||(memo[k]=f().catch(e=>{delete memo[k];throw e;}));
const loadCore=()=>once('core',()=>getJ('core.json').then(c=>{
  D.core=c;VER=c.gen||'';
  c.books.forEach(b=>{D.B[b.id]=b;b._n=norm(b.t+' '+b.a+' '+(b.tg||[]).join(' ').replace(/_/g,' '));});
  c.estantes.forEach((e,i)=>{e.i=i;D.E[e.id]=e;});
  return c;}));
const loadIdx=()=>once('idx',()=>getJ('tiempo/index.json').then(x=>D.idx=x));
const loadEra=i=>once('era'+i,()=>getJ('tiempo/era-'+String(i).padStart(2,'0')+'.json').then(x=>{x.events.forEach((e,k)=>{e.i=k;e.era=i;});D.eras[i]=x.events;return x.events;}));
const loadSearch=()=>once('search',()=>getJ('tiempo/buscar.json').then(x=>{x.forEach(r=>r.n=norm(r[3]+' '+r[4]));D.search=x;return x;}));
const loadAtlas=()=>once('atlas',()=>getJ('atlas.json').then(x=>D.atlas=x));
const loadLibro=id=>once('lib'+id,()=>getJ('libro/'+encodeURIComponent(id)+'.json').then(x=>D.libro[id]=x));

/* ── Utilidades de libros ── */
const ERA_C=[1,1,1,1,1,1,1,3,3,6,2,5,4,3,5,4,4,2];
const estCol=e=>'var(--c'+((e&&e.i!=null?e.i:0)%6+1)+')';
function surname(a){
  if(!a) return '';
  let s=String(a).split(/;|,| y | & | and /)[0].replace(/\(.*?\)/g,'').trim();
  let w=s.split(/\s+/).filter(x=>!/^(ii|iii|jr\.?|sr\.?|ed\.?|eds\.?|comp\.?|coord\.?|de|del|la|las|los|von|van)$/i.test(x));
  return w.length?w[w.length-1]:s;
}
function cover(b,o={}){
  if(!b) return '<div class="cv"></div>';
  const st=o.w?` style="width:${o.w}px;height:${o.h}px"`:'';
  const tc=`<div class="tcov${b.lt?' lt':''}" style="--tc:${b.col||'#6b4a2e'};--tf:${o.tf||15}px"><span>${esc(surname(b.a))}</span><b>${esc(b.t)}</b><span>${esc(String(b.y||''))}</span></div>`;
  if(b.c&&!b.bad) return `<div class="cv"${st}><img src="${esc(b.c)}" alt="Portada de ${esc(b.t)}" loading="${o.eager?'eager':'lazy'}" decoding="async" data-tc="${b.id}" data-tf="${o.tf||15}"></div>`;
  return `<div class="cv" role="img" aria-label="Portada de ${esc(b.t)}"${st}>${tc}</div>`;
}
document.addEventListener('error',ev=>{const im=ev.target;if(im.tagName==='IMG'&&im.dataset.tc){const b=D.B[im.dataset.tc];if(!b)return;const p=im.parentNode;const bb=Object.assign({},b,{bad:1});const tmp=document.createElement('div');tmp.innerHTML=cover(bb,{tf:+im.dataset.tf||15});p.replaceWith(tmp.firstChild);}},true);
function bookLink(b,meta=true,o={}){
  return `<a class="bk" href="#/libro/${encodeURIComponent(b.id)}">${cover(b,o)}${meta?`<div class="meta"><b>${esc(b.t)}</b><span>${esc(b.a)}</span></div>`:''}</a>`;
}
let BOOKS_BASE_PATH="/Users/samuelmartinez/Library/Mobile Documents/com~apple~CloudDocs/Documents/Books";
try{const s=localStorage.getItem('booksBasePath');if(s)BOOKS_BASE_PATH=s;}catch(e){}
function fileURL(fp){if(!fp||!BOOKS_BASE_PATH)return null;const base=BOOKS_BASE_PATH.replace(/\\/g,'/').replace(/\/$/,'');const enc=s=>s.split('/').map(encodeURIComponent).join('/');return 'file:///'+enc(base.replace(/^\//,''))+'/'+enc(fp);}
/* Igual que v1: en línea usa pdfUrl; en local (file://) la carpeta Books. */
function pdfBase(b){if(!b)return null;if(IS_ONLINE&&b.pdf)return b.pdf;if(!IS_ONLINE&&b.fp&&BOOKS_BASE_PATH)return fileURL(b.fp);if(b.pdf)return b.pdf;return null;}
function pageHref(bookId,pagina){const b=D.B[bookId];if(!b)return '';const m=String(pagina||'').match(/(\d+)/);if(!m)return '';const base=pdfBase(b);if(!base)return '';return base+'#page='+Math.floor(parseInt(m[1],10)*(b.pm||1)+(b.po||0));}
const sortYear=(a,b)=>(a.yn-b.yn)||a.t.localeCompare(b.t,'es');
const booksOf=eid=>D.core.books.filter(b=>b.e===eid).sort(sortYear);
const goodFirst=a=>a.filter(b=>b.c&&!b.bad&&!b.pg).concat(a.filter(b=>!(b.c&&!b.bad&&!b.pg)));

/* ── Fechas ── */
const MES=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function yearLabel(y){
  y=String(y||'').trim();
  let m=y.match(/^(-?\d+)(?:-(\d{2}))?(?:-(\d{2}))?$/);
  if(m){const n=parseInt(m[1],10);if(n<0){const a=-n;if(a>=1e9)return fmtN(a/1e6)+' millones de años';if(a>=1e6)return fmtN(a/1e6)+' millones de años';if(a>=10000)return fmtN(a)+' a.C.';return a+' a.C.';}return String(n);}
  return y;
}
function evDate(e){
  const m=String(e.y).match(/^(-?\d+)(?:-(\d{2}))?(?:-(\d{2}))?$/);
  if(m){return {g:yearLabel(m[1]),md:m[3]?(+m[3])+' '+MES[+m[2]]:(m[2]?MES[+m[2]]:''),full:(m[3]?(+m[3])+' '+MES[+m[2]]+' ':m[2]?MES[+m[2]]+' ':'')+yearLabel(m[1])};}
  const s=String(e.y);const n=s.match(/(\d{3,4})/);
  if(n&&/a\.?\s?c/i.test(s)) return {g:n[1]+' a.C.',md:/^c/i.test(s)?'c.':'',full:s};
  if(n) return {g:n[1],md:/^c/i.test(s)?'c.':(/^post/i.test(s)?'post':''),full:s};
  return {g:s,md:'',full:s};
}

/* ── Router ── */
const VIEWS=['home','librero','tiempo','page'];
let curView=null,curHash='';
const scrollMem={};
function show(v){
  VIEWS.forEach(x=>{$('#v-'+x).hidden=x!==v;});
  curView=v;
}
function setNav(k){$$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===k));}
function parse(){const h=location.hash.replace(/^#\/?/,'');return h.split('/').map(s=>{try{return decodeURIComponent(s)}catch(e){return s}});}
async function route(){
  const prevKey=curView==='page'?null:curView;
  if(prevKey) scrollMem[prevKey+'|'+curHash]=window.scrollY;
  const p=parse();curHash=location.hash;
  const r=p[0]||'estantes';
  if(r!=='tiempo') stopPlay();
  try{
    await loadCore();
    if(r==='estantes'||r===''){setNav('estantes');renderHome();show('home');restore('home');document.title='Librería — Estantes';}
    else if(r==='librero'){setNav('librero');renderLibrero(p[1],p[2]);show('librero');restore('librero');document.title='Librero completo — Librería';}
    else if(r==='libro'){setNav('');show('page');await renderFicha(p[1]);}
    else if(r==='estante'){setNav('estantes');show('page');renderEstante(p[1]);}
    else if(r==='autor'){setNav('');show('page');renderAutor(p.slice(1).join('/'));}
    else if(r==='tiempo'){setNav('tiempo');show('tiempo');await renderTiempo(p.slice(1));}
    else if(r==='atlas'){setNav('atlas');show('page');await renderAtlas(p[1]);}
    else if(r==='buscar'){setNav('buscar');show('page');renderBuscar(p.slice(1).join('/'));}
    else {location.replace('#/estantes');}
  }catch(err){console.warn(err);$('#v-page').innerHTML='<div class="loading">No se pudieron cargar los datos ('+esc(err.message)+').</div>';show('page');}
}
function restore(k){const y=scrollMem[k+'|'+location.hash];window.scrollTo(0,y||0);}
window.addEventListener('hashchange',route);

/* ── Búsqueda en cabecera ── */
let qT=null;
$('#q').addEventListener('input',e=>{clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{const h='#/buscar/'+encodeURIComponent(v.trim());if(parse()[0]==='buscar')history.replaceState(null,'',h),route();else location.hash=h;},220);});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';e.target.blur();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#lb').classList.contains('on')){e.preventDefault();(window.innerWidth>760?$('#q'):null)?$('#q').focus():(location.hash='#/buscar');}});

/* ══════════ ESTANTES (inicio) ══════════ */
let homeDone=false;
function renderHome(){
  if(homeDone) return; homeDone=true;
  const c=D.core,s=c.stats;
  const feats=c.featured.filter(f=>D.B[f.id]);
  const day=Math.floor(Date.now()/864e5);
  const f=feats.length?feats[day%feats.length]:null, fb=f&&D.B[f.id];
  let h=`<section class="hero"><div><h1>La biblioteca<br>de la historia<br>de México.</h1>
  <p class="lead">${fmtN(s.books)} libros en seis estantes, del México profundo a la Cuarta Transformación, con sus ideas, sus citas y su lugar en el tiempo.</p>
  <div class="stats">${fmtN(s.books)} libros · ${s.estantes} estantes · ${fmtN(s.events)} eventos · ${s.rutas} recorridos</div>
  <form class="bigsearch" role="search" onsubmit="event.preventDefault();location.hash='#/buscar/'+encodeURIComponent(this.q.value.trim())"><label class="sr" for="bq">Buscar</label><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="bq" name="q" type="search" autocomplete="off" placeholder="Buscar libro, autor, idea o evento…"></form></div>`;
  h+=`<div id="destacado">`;
  if(fb) h+=`<div class="feat"><a href="#/libro/${encodeURIComponent(fb.id)}" aria-label="${esc(fb.t)}">${cover(fb,{eager:1,tf:22})}</a><div class="fq"><span class="kick">Para empezar</span>“${esc(f.q)}”<small>— ${esc(fb.a)}, <a href="#/libro/${encodeURIComponent(fb.id)}"><i>${esc(fb.t)}</i></a>${f.p?' · '+(/^\d/.test(f.p)?'p. ':'')+esc(f.p):''}</small></div></div>`;
  h+='</div></section>';
  c.estantes.forEach((e,i)=>{
    const bs=booksOf(e.id);
    h+=`<section class="est" id="est-${e.id}" style="--c:${estCol(e)}"><div class="hd"><span class="num">${e.num}</span><h2>${esc(e.name)}</h2><span class="cnt">${bs.length} libros</span><a class="more" href="#/estante/${e.id}">Ver el estante →</a></div>
    <p class="desc">${esc(e.desc)}</p><div class="rowscroll"><div class="track">${shuffleGood(bs).map(b=>bookLink(b)).join('')}</div></div></section>`;
    if(i===0) h+=tlBand();
  });
  h+=`<footer class="foot"><span>Librería · v2</span><a href="libreria-v1.html">Versión anterior (v1)</a><a href="#/librero">Librero completo</a><a href="#/atlas">Atlas</a></footer>`;
  $('#v-home').innerHTML=h;
  pickDestacado();
  $('#bq').addEventListener('input',e=>{clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{if(v.trim().length>1)location.hash='#/buscar/'+encodeURIComponent(v.trim());},450);});
}
function shuffleGood(bs){const ok=b=>b.c&&!b.bad&&!b.pg;const a=bs.filter(ok),r=bs.filter(b=>!ok(b));for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.concat(r);}
let DEST=null;
const rndOf=a=>a[Math.floor(Math.random()*a.length)];
async function pickDestacado(){
  try{if(!DEST)DEST=await (await fetch('libreria-data/destacados.json')).json();}catch(e){return;}
  const box=$('#destacado');if(!box)return;
  const k=rndOf(['evento','evento','personaje','autor','cita','libro']);let h='';
  const more=`<button class="otro" type="button" onclick="pickDestacado()">Otro ↻</button>`;
  if(k==='evento'&&DEST.eventos.length){const e=rndOf(DEST.eventos),b=D.B[e.b];if(b){const pl=placeName({n:e.pl});
    h=`<div class="feat"><a href="#/tiempo/evento/${e.era}-${e.i}">${cover(b,{eager:1,tf:22})}</a><div class="fq"><span class="kick">Un día en la historia · ${esc(String(e.y).slice(0,10))}${pl?' · '+esc(pl):''}</span><b class="ft">${esc(e.t)}</b>“${esc(e.x)}”<small>— <a href="#/libro/${encodeURIComponent(b.id)}"><i>${esc(b.t)}</i></a>, ${esc(e.p)} · <a href="#/tiempo/evento/${e.era}-${e.i}">Ver en el tiempo →</a></small>${more}</div></div>`;}}
  if(!h&&k==='personaje'&&DEST.personajes.length){const p=rndOf(DEST.personajes);
    h=`<div class="feat"><a href="#/buscar/${encodeURIComponent(p.n)}" class="face">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.n)}">`:''}</a><div class="fq"><span class="kick">Un personaje · ${fmtN(p.m)} menciones</span><b class="ft">${esc(p.n)}</b><span class="bl">${esc(p.bl)}</span><small><a href="#/buscar/${encodeURIComponent(p.n)}">Dónde aparece en la librería →</a></small>${more}</div></div>`;}
  if(!h&&k==='autor'&&DEST.autores.length){const pool=DEST.autores.filter(x=>x.img);const a=rndOf(pool.length?pool:DEST.autores);
    h=`<div class="feat"><a href="#/autor/${encodeURIComponent(a.n)}" class="face">${a.img?`<img src="${esc(a.img)}" alt="${esc(a.n)}">`:''}</a><div class="fq"><span class="kick">Un autor${a.yrs?' · '+esc(a.yrs):''}</span><b class="ft">${esc(a.n)}</b><span class="bl">${esc(a.bio)}</span><div class="mini">${a.bs.map(id=>D.B[id]?`<a href="#/libro/${encodeURIComponent(id)}">${cover(D.B[id],{tf:6})}</a>`:'').join('')}</div>${more}</div></div>`;}
  if(!h&&k==='libro'){const g=D.core.books.filter(b=>b.c&&!b.bad&&b.nq);const b=rndOf(g.length?g:D.core.books);let tes='';try{const d=await loadLibro(b.id);tes=String(d.tesis||d.desc||'').replace(/<[^>]+>/g,'');}catch(e){}
    if(tes.length>260)tes=tes.slice(0,tes.lastIndexOf(' ',257))+'…';
    h=`<div class="feat"><a href="#/libro/${encodeURIComponent(b.id)}">${cover(b,{eager:1,tf:22})}</a><div class="fq"><span class="kick">Un libro para hoy</span><b class="ft">${esc(b.t)}</b><span class="bl">${esc(tes)}</span><small>— ${esc(b.a)}${b.y!==''?' · '+esc(b.y):''} · <a href="#/libro/${encodeURIComponent(b.id)}">Abrir la ficha →</a></small>${more}</div></div>`;}
  if(!h){const feats=D.core.featured.filter(f=>D.B[f.id]);const f=rndOf(feats),fb=D.B[f.id];
    h=`<div class="feat"><a href="#/libro/${encodeURIComponent(fb.id)}">${cover(fb,{eager:1,tf:22})}</a><div class="fq"><span class="kick">Una cita</span>“${esc(f.q)}”<small>— ${esc(fb.a)}, <a href="#/libro/${encodeURIComponent(fb.id)}"><i>${esc(fb.t)}</i></a>${f.p?' · '+(/^\d/.test(f.p)?'p. ':'')+esc(f.p):''}</small>${more}</div></div>`;}
  box.innerHTML=h;
}

function tlBand(){
  const eras=D.core.eras;
  return `<section class="tlband"><h2><a href="tiempo.html#/" style="color:inherit;text-decoration:none">Línea del tiempo</a></h2><p>Cada libro, en su momento. ${fmtN(D.core.stats.events)} eventos citados de los propios libros, con mapa.</p>
  <div class="erachips">${eras.map((e,i)=>`<a class="erachip" style="--c:var(--c${ERA_C[i]})" href="tiempo.html#/era/${i}">${esc(e.short)} <small>${fmtN(e.n)}</small></a>`).join('')}</div></section>`;
}

/* ══════════ ESTANTE (página) ══════════ */
function renderEstante(id){
  const e=D.E[id];if(!e){location.replace('#/estantes');return;}

function groupsFor(ord){
  if(ord==='cronologico'){

function packRows(items,avail,wOf,gap){
  const rows=[];let row=[],w=0;
  items.forEach(b=>{const bw=wOf(b)+gap;if(row.length&&w+bw>avail){rows.push(row);row=[];w=0;}row.push(b);w+=bw;});

}

/* ── Banda de presentación en la ficha (mecánica de la v1, refinada): los slides esperan detrás del encabezado,
   borrosos; si no haces scroll ~5.5 s se aclaran, la banda crece a 16:9 y pasan solos cada 9 s. Click = pantalla completa. ── */
function heroDeckHTML(b,d,e,url,nq,ne,id){
  const n=Math.min(b.dk,40);let imgs='';for(let i=1;i<=n;i++){imgs+=`<img class="hs${i===1?' on':''}" ${i<=2?'':'loading="lazy" '}src="decks/${b.id}/slide-${String(i).padStart(2,'0')}.jpg" alt="Diapositiva ${i}">`;}
  return `<section class="hdeck" id="hdeck" data-n="${n}" aria-label="Presentación de ${esc(b.t)}">

    <div class="btns">${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${ICON.pdf}Leer el PDF</a>`:''}<button class="btn ghost" data-hd="play">${ICON.slides}Ver la presentación · ${b.dk}</button>${ne?`<a class="btn ghost" href="tiempo.html#/libro/${encodeURIComponent(id)}">${ICON.clock}Ver en el tiempo</a>`:''}</div>
    <div class="hint">La presentación se abre sola si te quedas aquí…</div></div></div>
  <div class="hctl"><button class="ib" data-hd="prev" aria-label="Anterior">‹</button><span class="hc" id="hdCount">1 / ${n}</span><button class="ib" data-hd="next" aria-label="Siguiente">›</button><button class="ib" data-hd="full" aria-label="Pantalla completa">⤢</button><button class="ib" data-hd="close" aria-label="Volver a la ficha">✕</button></div>
  <div class="hcap">${cover(b,{tf:5})}<div><b>${esc(b.t)}</b><small>${esc(b.a)} · Presentación · ${b.dk} diapositivas</small></div></div>
</section>`;
}
let HD=null;
function initHeroDeck(b){
  if(HD&&HD.cleanup)HD.cleanup();
  const el=$('#hdeck');if(!el)return;const sl=[...el.querySelectorAll('.hs')];
  HD={id:b.id,i:0,n:sl.length,timer:null,reveal:null,hover:false};
  const show=k=>{HD.i=(k+HD.n)%HD.n;sl.forEach((x,j)=>x.classList.toggle('on',j===HD.i));$('#hdCount').textContent=(HD.i+1)+' / '+HD.n;const nx=sl[(HD.i+1)%HD.n];if(nx&&nx.loading==='lazy')nx.loading='eager';};
  const start=()=>{stop();if(!HD.hover)HD.timer=setInterval(()=>show(HD.i+1),9000);};
  const stop=()=>{if(HD.timer){clearInterval(HD.timer);HD.timer=null;}};
  const expand=()=>{if(el.classList.contains('open'))return;el.classList.add('open');setTimeout(start,1200);};
  const collapse=()=>{stop();el.classList.remove('open');};
  const y0=window.scrollY;const onS=()=>{if(Math.abs(window.scrollY-y0)>40){clearTimeout(HD.reveal);window.removeEventListener('scroll',onS);}};
  window.addEventListener('scroll',onS,{passive:true});
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  HD.reveal=setTimeout(()=>{window.removeEventListener('scroll',onS);if(!document.hidden&&curView==='page'&&$('#hdeck')===el&&!reduce)expand();},5500);
  el.addEventListener('mouseenter',()=>{HD.hover=true;stop();});
  el.addEventListener('mouseleave',()=>{HD.hover=false;if(el.classList.contains('open'))start();});
  el.addEventListener('click',ev=>{const a=ev.target.closest('[data-hd]');
    if(a){ev.preventDefault();const k=a.dataset.hd;if(k==='play'){expand();}else if(k==='prev'){show(HD.i-1);start();}else if(k==='next'){show(HD.i+1);start();}else if(k==='close'){collapse();}else if(k==='full'){stop();openDeck(b.id,a,HD.i);}return;}
    if(ev.target.closest('a,button'))return;
    if(el.classList.contains('open')){stop();openDeck(b.id,el,HD.i);}});
  let tx=null;el.addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',ev=>{if(tx==null||!el.classList.contains('open'))return;const dx=ev.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){show(HD.i+(dx<0?1:-1));start();}tx=null;},{passive:true});
  HD.cleanup=()=>{stop();clearTimeout(HD.reveal);window.removeEventListener('scroll',onS);};
}

/* ── Presentación (deck) en lightbox, con narración como v1 ── */
const LBX={id:null,n:0,i:0,narr:false,ret:null};
const deckList=()=>D.core.books.filter(x=>x.dk>0);
let lbCapT=null;
function lbCaption(){const b=D.B[LBX.id];if(!b)return;$('#lbCap').innerHTML=`${cover(b,{tf:5})}<div><b>${esc(b.t)}</b><small>${esc(b.a)}${b.y!==''?' · '+esc(b.y):''}</small></div>`;$('#lbCap').classList.add('show');clearTimeout(lbCapT);lbCapT=setTimeout(()=>$('#lbCap').classList.remove('show'),3800);}
function openDeck(id,ret,start){const b=D.B[id];if(!b||!b.dk)return;LBX.id=id;LBX.n=b.dk;LBX.i=start||0;LBX.ret=ret||document.activeElement;$('#lbTitle').textContent=b.t;$('#lb').classList.add('on');document.body.style.overflow='hidden';lbShow();lbCaption();lbAuto();setTimeout(()=>$('#lb .close').focus(),30);}
function lbShow(){const n=String(LBX.i+1).padStart(2,'0');
  {const L=deckList(),k=L.findIndex(x=>x.id===LBX.id),nb=L[(k+1)%L.length];const nu=$('#lbNext');if(nu){if(LBX.i===LBX.n-1&&nb&&nb.id!==LBX.id){nu.innerHTML='Sigue: <b>'+esc(nb.t)+'</b> · '+esc(nb.a);nu.classList.add('show');}else nu.classList.remove('show');}}$('#lbImg').src='decks/'+LBX.id+'/slide-'+n+'.jpg';$('#lbImg').alt='Diapositiva '+(LBX.i+1)+' de '+LBX.n;$('#lbCount').textContent=(LBX.i+1)+' / '+LBX.n;
  if(LBX.i+1<LBX.n){const p=new Image();p.src='decks/'+LBX.id+'/slide-'+String(LBX.i+2).padStart(2,'0')+'.jpg';}}
function lbGo(d){const j=LBX.i+d;
  if(j>=LBX.n||j<0){const L=deckList(),k=L.findIndex(x=>x.id===LBX.id),nb=L[((k+(j<0?-1:1))%L.length+L.length)%L.length];if(nb&&nb.id!==LBX.id){LBX.id=nb.id;LBX.n=nb.dk;LBX.i=j<0?nb.dk-1:0;$('#lbTitle').textContent=nb.t;lbShow();lbCaption();if(LBX.narr)narrLoad(LBX.id).then(narrSpeak).catch(()=>narrStop());return;}}
  LBX.i=(j+LBX.n)%LBX.n;lbShow();if(LBX.narr)narrSpeak();}
let lbT=null;function lbAuto(){clearInterval(lbT);lbT=setInterval(()=>{if(!$('#lb').classList.contains('on')){clearInterval(lbT);return;}if(!LBX.narr&&!LBX.hold)lbGo(1);},9000);}
function lbClose(){clearInterval(lbT);narrStop();$('#lb').classList.remove('on');document.body.style.overflow='';if(LBX.ret&&LBX.ret.focus)LBX.ret.focus();}
$('#lb').addEventListener('click',e=>{const a=e.target.closest('[data-lb]');if(a){const k=a.dataset.lb;if(k==='close')lbClose();else if(k==='prev')lbGo(-1);else if(k==='next')lbGo(1);else if(k==='voice')LBX.narr?narrStop():narrStart();return;}if(e.target.id==='lb')lbClose();});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='ArrowLeft')lbGo(-1);else if(e.key==='Tab'){const f=$$('#lb button');const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}});
let tx0=null;$('#lb').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});$('#lb').addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)lbGo(dx>0?-1:1);},{passive:true});
function narrLoad(id){return new Promise((res,rej)=>{window.__DECKNARR=window.__DECKNARR||{};if(__DECKNARR[id])return res(__DECKNARR[id]);const s=document.createElement('script');s.src='decks/'+id+'/narration.js';s.onload=()=>__DECKNARR[id]?res(__DECKNARR[id]):rej();s.onerror=()=>rej();document.head.appendChild(s);});}
function narrVoice(lang){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const pool=vs.filter(v=>new RegExp('^'+lang,'i').test(v.lang||''));const q=v=>{const n=(v.name||'').toLowerCase();return /premium|siri/.test(n)?0:/enhanced|mejorad|neural|natural/.test(n)?1:/google/.test(n)?2:3;};const pref=lang==='en'?/samantha|aria|jenny/i:/monica|mónica|paulina/i;pool.sort((a,b)=>q(a)-q(b)||(pref.test(b.name)?1:0)-(pref.test(a.name)?1:0)||(/mx|us/i.test(b.lang)?1:0)-(/mx|us/i.test(a.lang)?1:0));return pool[0]||null;}
function narrSpeak(){try{speechSynthesis.cancel();}catch(e){}const arr=(window.__DECKNARR||{})[LBX.id]||[];const t=String(arr[LBX.i]||'').replace(/\n/g,' ').trim();
  const s=' '+arr.join(' ').toLowerCase()+' ';const cnt=ws=>ws.reduce((n,w)=>n+(s.split(w).length-1),0);const lang=cnt([' the ',' of ',' and '])>cnt([' el ',' la ',' de ',' que '])?'en':'es';
  if(!t){setTimeout(()=>{if(LBX.narr&&LBX.i<LBX.n-1)lbGo(1);else narrStop();},1500);return;}
  const u=new SpeechSynthesisUtterance(t);u.lang=lang==='en'?'en-US':'es-MX';const v=narrVoice(lang);if(v)u.voice=v;u.rate=1;
  u.onend=()=>{if(!LBX.narr)return;if(LBX.i>=LBX.n-1){narrStop();return;}setTimeout(()=>{if(LBX.narr)lbGo(1);},600);};speechSynthesis.speak(u);}
function narrStart(){if(!('speechSynthesis' in window))return;narrLoad(LBX.id).then(()=>{LBX.narr=true;$('#lbVoice').classList.add('on');$('#lbVoice').setAttribute('aria-label','Detener narración');narrSpeak();}).catch(()=>{$('#lbVoice').title='Narración aún no generada para esta presentación';});}
function narrStop(){LBX.narr=false;try{speechSynthesis.cancel();}catch(e){}$('#lbVoice').classList.remove('on');$('#lbVoice').setAttribute('aria-label','Narrar los slides');}

}
function step(d,focus){if(!T.list.length)return;let k=T.sel+d;if(k<0)k=0;if(k>=T.list.length){stopPlay();return;}select(k,focus?true:'auto',true);}
function startPlay(){if(T.play)return;T.play=setInterval(()=>{if(T.sel>=T.list.length-1){stopPlay();return;}step(1);},4500);$('#tplay').innerHTML=ICON.pause+'<span>Pausa</span>';$('#tplay').setAttribute('aria-pressed','true');}
function stopPlay(){if(T.play){clearInterval(T.play);T.play=null;}const b=$('#tplay');if(b){b.innerHTML=ICON.play+'<span>Recorrer'+(T.book?'':(' '+(D.idx?esc(D.idx.eras[T.era].short):'')))+'</span>';b.setAttribute('aria-pressed','false');}}
let allPathCache={};
function dotsPath(pts,f,skipEra){let s='';for(let ei=0;ei<pts.length;ei++){if(ei===skipEra)continue;const a=pts[ei];for(let i=0;i<a.length;i++){const p=a[i];if(!p)continue;const xy=f(p[0],p[1]);s+='M'+xy[0].toFixed(1)+' '+xy[1].toFixed(1)+'h0';}}return s;}
let BASEMAP=null,BASEMAP_L=false;
const SMALL_ST=new Set(['Ciudad de México','Distrito Federal','Tlaxcala','Morelos','Aguascalientes','Colima','Querétaro','Querétaro de Arteaga','México','Hidalgo']);
function basemapSVG(view){
  if(!BASEMAP){if(!BASEMAP_L){BASEMAP_L=true;fetch('libreria-data/geo/basemap.json').then(r=>r.json()).then(j=>{BASEMAP=j;drawMap();}).catch(()=>{});}return '';}
  const b=BASEMAP[view];if(!b)return '';
  let h=`<path class="bm-land" d="${b.land}"/><path class="bm-mex" d="${b.mex}"/>`;
  if(b.states){h+=`<path class="bm-st" d="${b.states}"/>`;h+=b.stl.filter(x=>!SMALL_ST.has(x[0])).map(x=>`<text class="bm-stl" x="${x[1]}" y="${x[2]}">${esc(x[0])}</text>`).join('');}
  if(b.ctl)h+=b.ctl.map(x=>`<text class="bm-ctl${/Golfo|Océano/.test(x[0])?' sea':''}" x="${x[1]}" y="${x[2]}">${esc(x[0])}</text>`).join('');
  return h;
}
function drawMap(){
  if(!T.mounted)return;
  const P=proj(T.view),f=P.f,svg=$('#map');
  svg.setAttribute('viewBox','0 0 '+P.W+' '+P.H);
  $$('[data-mv]').forEach(b=>b.classList.toggle('on',b.dataset.mv===T.view));
  const pts=D.idx.points;
  const key=T.view+'|'+(T.book?'-1':T.era);
  if(!allPathCache[key]){
    const cur=T.book?[]:[pts[T.era]];
    allPathCache[key]={a:dotsPath(pts,f,T.book?-1:T.era),c:T.book?'':dotsPath(cur,f,-1)};
  }
  let bookDots='';
  if(T.book){T.all.forEach(e=>{if(e.l&&e.l.la!=null){const xy=f(e.l.la,e.l.ln);bookDots+='M'+xy[0].toFixed(1)+' '+xy[1].toFixed(1)+'h0';}});}
  let grat='';
  if(T.view==='w'){for(let ln=-150;ln<=180;ln+=30){const a=f(W0.la0,ln),b=f(W0.la1,ln);grat+=`M${a[0].toFixed(1)} ${a[1]}V${b[1]}`;}for(let la=-30;la<=60;la+=30){const a=f(la,W0.ln0),b=f(la,W0.ln1);grat+=`M${a[0]} ${a[1].toFixed(1)}H${b[0]}`;}
    const m0=f(MX.la1,MX.ln0),m1=f(MX.la0,MX.ln1);grat+=`M${m0[0].toFixed(1)} ${m0[1].toFixed(1)}H${m1[0].toFixed(1)}V${m1[1].toFixed(1)}H${m0[0].toFixed(1)}Z`;}
  const r0=T.view==='mx'?2.6:1.8,r1=T.view==='mx'?4.2:3;
  let pins='',lbl='';
  const k0=Math.max(0,T.sel-8),k1=Math.min(T.list.length,T.sel+9);
  for(let k=k0;k<k1;k++){const e=T.list[k];if(!e||!e.l||e.l.la==null)continue;const xy=f(e.l.la,e.l.ln);if(xy[0]<0||xy[0]>P.W||xy[1]<0||xy[1]>P.H)continue;if(k===T.sel)continue;pins+=`<circle class="pin" data-k="${k}" cx="${xy[0].toFixed(1)}" cy="${xy[1].toFixed(1)}" r="5"><title>${esc(e.t)}</title></circle>`;}
  const s=T.list[T.sel];
  if(s&&s.l&&s.l.la!=null){const xy=f(s.l.la,s.l.ln);if(xy[0]>=0&&xy[0]<=P.W&&xy[1]>=0&&xy[1]<=P.H){pins+=`<circle class="pin on" cx="${xy[0].toFixed(1)}" cy="${xy[1].toFixed(1)}" r="9"/>`;const name=placeName(s.l);const right=xy[0]<P.W-160;lbl=`<text class="plbl" x="${(xy[0]+(right?15:-15)).toFixed(1)}" y="${(xy[1]+5).toFixed(1)}" text-anchor="${right?'start':'end'}">${esc(name)}</text>`;}}
  svg.innerHTML=`${basemapSVG(T.view)}${grat?`<path class="graticule" d="${grat}"/>`:''}<path class="dots0" stroke-width="${r0}" d="${allPathCache[key].a}"/><path class="dots1" stroke-width="${r1}" d="${allPathCache[key].c||bookDots}"/>${pins}${lbl}`;
  $('#mapt').textContent=T.view==='mx'?'Dónde pasó · cada punto es un evento citado':'Vista mundial · el recuadro marca México';
}
$('#v-tiempo').addEventListener('click',e=>{const p=e.target.closest('circle.pin[data-k]');if(p)select(+p.dataset.k,true,true);});
const MXST={AGU:'Aguascalientes',BCN:'Baja California',BCS:'Baja California Sur',CAM:'Campeche',CHP:'Chiapas',CHH:'Chihuahua',CMX:'Ciudad de México',DIF:'Ciudad de México',COA:'Coahuila',COL:'Colima',DUR:'Durango',GUA:'Guanajuato',GRO:'Guerrero',HID:'Hidalgo',JAL:'Jalisco',MEX:'Estado de México',MIC:'Michoacán',MOR:'Morelos',NAY:'Nayarit',NLE:'Nuevo León',OAX:'Oaxaca',PUE:'Puebla',QUE:'Querétaro',ROO:'Quintana Roo',SLP:'San Luis Potosí',SIN:'Sinaloa',SON:'Sonora',TAB:'Tabasco',TAM:'Tamaulipas',TLA:'Tlaxcala',VER:'Veracruz',YUC:'Yucatán',ZAC:'Zacatecas'};
function placeName(l){if(!l)return '';let n=l.n||'';if(/^[A-Z]{2}-[A-Z]{2,3}$/.test(n)){const c=n.split('-')[1];n=(n.startsWith('MX-')&&MXST[c])||c;}return n;}
function drawCard(){
  const e=T.list[T.sel],card=$('#evcard');if(!e){card.hidden=true;return;}
  const c=(e.c||[])[0],b=c&&D.B[c.b];
  const pg=c?pageHref(c.b,c.p):'';
  const place=e.l?placeName(e.l)+(e.l.p&&e.l.p!=='MX'&&e.l.p!=='XX'?', '+e.l.p:''):'';
  const quote=c&&c.x?c.x:(e.d||'');
  card.className='evcard'+(b?'':' nocov');
  card.innerHTML=`${b?`<a href="#/libro/${encodeURIComponent(b.id)}" aria-label="${esc(b.t)}">${cover(b,{tf:7})}</a>`:''}<div><div class="d">${esc(e._full)}${place?' · '+esc(place):''}</div><h3>${esc(e.t)}</h3>${quote?`<q>${esc(quote.length>420?quote.slice(0,417)+'…':quote)}</q>`:''}
  ${b?`<div class="bkl"><a href="#/libro/${encodeURIComponent(b.id)}">${esc(b.t)}</a>${c.p?' · '+(pg?`<a class="pg" href="${esc(pg)}" target="_blank" rel="noopener">${esc(c.p)} →</a>`:esc(c.p)):''}</div>`:(e.u?`<div class="bkl"><a class="pg" href="${esc(e.u)}" target="_blank" rel="noopener">Fuente →</a></div>`:'')}</div>`;
  card.hidden=false;
}
function showRuta(id){
  const r=D.idx.rutas.find(x=>x.id===id);const box=$('#rutabox');
  $$('[data-ruta]').forEach(a=>a.classList.toggle('on',a.dataset.ruta===id));
  if(!r){box.innerHTML='';return;}
  box.innerHTML=`<div class="ruta"><div class="kick">Recorrido · ${r.steps.length} libros</div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><div class="steps">${r.steps.map(s=>{const b=D.B[s.b];if(!b)return '';const w=r.win&&r.win[s.b];return `<div class="step"><a href="#/libro/${encodeURIComponent(b.id)}">${cover(b,{tf:8})}</a><div><b>${esc(b.t)}</b><small class="ui" style="font-size:11.5px;color:var(--ink2)">${esc(b.a)} · ${esc(b.y)}${w?' · '+w[0]+'–'+w[1]:''}</small><p>${esc(s.r)}</p><div class="lk"><a href="#/libro/${encodeURIComponent(b.id)}">Ficha</a>${b.ne?`<a href="#/tiempo/libro/${encodeURIComponent(b.id)}">En el tiempo (${b.ne})</a>`:''}</div></div></div>`;}).join('')}</div></div>`;
  setTimeout(()=>$('#rutas').scrollIntoView({behavior:'smooth',block:'start'}),60);
}

/* ── Arranque ── */
if(!location.hash||location.hash==='#'||location.hash==='#/')history.replaceState(null,'','#/estantes');
route();
</script>
