<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Librería — La biblioteca de la historia de México</title>
<meta name="description" content="390 libros en seis estantes, del México profundo a la Cuarta Transformación, con sus ideas, sus citas y su lugar en el tiempo.">
<script>
(function(){var t;try{t=localStorage.getItem('v2-theme')}catch(e){}
if(t!=='day'&&t!=='night'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'night':'day'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ Tokens: una sola gramática, dos luces ═══ */
:root,[data-theme=day]{
  --bg:#F4EFE6;--paper:#FBF8F2;--ink:#1F1B16;--ink2:#6B6157;--rule:#D8CDBD;--acc:#8C1C2B;--on-acc:#FFFFFF;--field:#FFFFFF;
  --wood:#6d4b2d;--wood-hi:#7a5536;--wood-lo:#5a3c22;--case-a:#6a482b;--case-b:#4a321d;--bay-a:#e9dfcc;--bay-b:#f3ecdf;--plate:#c9a467;
  --d0:#cbbfae;--d1:#b07a6c;--land:#ece4d6;--landbd:#cdbfaa;--mex:#f7f1e6;--mexbd:#a99a85;--stbd:#d6c9b6;
  --c1:#2F6F6A;--c2:#5B7F3A;--c3:#8C1C2B;--c4:#5E4B8B;--c5:#2E5A87;--c6:#A0526E;
  --serif:'EB Garamond',Georgia,serif;--k:1;
  --glow:none;--head-bg:rgba(251,248,242,.94);
  --sh-cover:2px 2px 0 rgba(0,0,0,.06),6px 8px 16px -6px rgba(40,25,10,.45);
  --sh-card:0 18px 40px -18px rgba(40,25,10,.45);
}
[data-theme=night]{
  --bg:#15110D;--paper:#1E1914;--ink:#EDE3D2;--ink2:#A8987F;--rule:#3A3026;--acc:#C49A5A;--on-acc:#1a130b;--field:#120f0c;
  --wood:#4a3320;--wood-hi:#5a3f28;--wood-lo:#2c1f14;--case-a:#3b2817;--case-b:#22170d;--bay-a:#120e0a;--bay-b:#1b1510;--plate:#b8914f;
  --d0:#3b3228;--d1:#8a6a3c;--land:#211b15;--landbd:#3d332a;--mex:#2a221b;--mexbd:#6b5a45;--stbd:#3f352b;
  --c1:#7FB3A8;--c2:#9DB57A;--c3:#C4664F;--c4:#A08CC8;--c5:#7FA2C8;--c6:#C98AA5;
  --serif:'Cormorant Garamond',Georgia,serif;--k:1.1;
  --glow:radial-gradient(1200px 520px at 50% -140px,rgba(230,170,90,.15),transparent 70%);--head-bg:rgba(21,17,13,.88);
  --sh-cover:0 14px 22px -10px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04);
  --sh-card:0 24px 50px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--ink);font-family:var(--serif);font-size:calc(17px*var(--k));line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.ui,.btn,.chip,input,select{font-family:Inter,system-ui,sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ═══ Header ═══ */
header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:30px;padding:14px 48px;background:var(--head-bg);border-bottom:1px solid var(--rule);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.02em;white-space:nowrap;line-height:1}
.brand small{font-size:inherit;color:var(--acc)}
[data-theme=night] .brand{font-weight:600;font-variant:small-caps;letter-spacing:.06em;font-size:28px}
nav.main{display:flex;gap:24px;font-family:Inter,sans-serif;font-size:14px;letter-spacing:.02em}
nav.main a{padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--acc)}
nav.main a.on{color:var(--acc);border-bottom-color:var(--acc)}
header .flex1{flex:1}
.hsearch{position:relative;width:340px;max-width:32vw}
.hsearch input,.bigsearch input{width:100%;border:1px solid var(--rule);background:var(--field);color:var(--ink);border-radius:999px;padding:10px 18px 10px 40px;font-size:14px}
.hsearch>svg,.bigsearch>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.hsearch input::placeholder,.bigsearch input::placeholder{color:var(--ink2)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--rule);color:var(--ink)}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.only-m{display:none!important}
.tabbar{display:none}

/* ═══ Botones / chips ═══ */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:11px 18px;border-radius:999px;background:var(--acc);color:var(--on-acc);border:1px solid var(--acc);white-space:nowrap}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.alt:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{font-size:13px;padding:7px 14px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
a.chip:hover,button.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.kick{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.more{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.more:hover{color:var(--acc)}

/* ═══ Portadas ═══ */
.cv{position:relative;background:var(--rule);box-shadow:var(--sh-cover);border-radius:2px;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover}
.tcov{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12% 10%;color:#f4ecdc;background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 12%),var(--tc,#6b4a2e);text-align:center;font-family:var(--serif)}
.tcov.lt{color:#1d160f}
.tcov b{font-weight:500;font-size:var(--tf,15px);line-height:1.15;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;border-top:1px solid currentColor;border-bottom:1px solid currentColor;padding:8% 0;opacity:.95}
.tcov span{font-family:Inter,sans-serif;font-size:calc(var(--tf,15px)*.62);letter-spacing:.12em;text-transform:uppercase;opacity:.8}

/* ═══ Home ═══ */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;padding:64px 56px 56px;align-items:center;border-bottom:1px solid var(--rule)}
[data-theme=day] .hero{background:var(--paper)}
.hero h1{font-weight:500;font-size:68px;line-height:1;margin:0;letter-spacing:-.005em}
[data-theme=night] .hero h1{font-style:italic;font-size:76px;line-height:.95}
.hero .lead{font-size:calc(21px*var(--k));line-height:1.5;max-width:580px;margin:22px 0 18px}
.stats{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.bigsearch{position:relative;margin-top:26px;max-width:580px}
.bigsearch input{padding:16px 22px 16px 46px;font-size:16px}
.bigsearch>svg{left:18px}
.feat{display:flex;gap:28px;align-items:flex-end;justify-content:center}
.feat .cv{width:210px;height:316px;flex:0 0 auto}
.feat .fq{max-width:280px;font-size:calc(19px*var(--k));font-style:italic;line-height:1.45}
.feat .fq .kick{display:block;font-style:normal;margin-bottom:10px}
.feat .fq small{display:block;font-style:normal;font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.4}
.feat .fq a:hover{color:var(--acc)}
.feat .ft{display:block;font-style:normal;font-weight:500;font-size:calc(26px*var(--k));line-height:1.15;margin:2px 0 10px}
.feat .bl{display:block;font-style:normal;font-size:calc(17px*var(--k));line-height:1.45;color:var(--ink2)}
.feat .face{width:210px;height:250px;flex:0 0 auto;border-radius:3px;overflow:hidden;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.feat .face img{width:100%;height:100%;object-fit:cover;display:block}
.feat .mini{display:flex;gap:8px;margin-top:12px}.feat .mini .cv{width:46px;height:68px}
.feat .otro{display:inline-block;margin-top:14px;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:none;cursor:pointer}
.feat .otro:hover{color:var(--acc);border-color:var(--acc)}
#destacado{min-height:330px;display:flex;align-items:center}

.est{padding:44px 56px 20px;border-bottom:1px solid var(--rule)}
.est .hd{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.est h2{font-size:36px;margin:0;font-weight:500;line-height:1.1}
[data-theme=night] .est h2{font-variant:small-caps;letter-spacing:.05em}
.est .num{font-size:20px;color:var(--acc);font-family:var(--serif)}
.est .cnt{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.est .more{margin-left:auto}
.est .desc{color:var(--ink2);font-size:calc(16.5px*var(--k));margin:0 0 22px;max-width:780px}
.rowscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;margin:0 -56px;padding:0 56px 6px;scroll-padding:0 56px}
.track{display:inline-flex;gap:22px;align-items:flex-start;min-width:100%;padding-top:8px;background:linear-gradient(var(--wood-hi),var(--wood-lo)) 0 180px/100% 10px no-repeat;position:relative}
.track:after{content:"";position:absolute;left:0;right:0;top:190px;height:10px;background:linear-gradient(rgba(40,25,10,.28),transparent);pointer-events:none}
.bk{flex:0 0 auto;width:118px;display:block}
.bk .cv{width:118px;height:172px;transition:transform .18s ease}
.bk:hover .cv,.bk:focus-visible .cv{transform:translateY(-4px)}
.bk .meta{font-family:Inter,sans-serif;font-size:11.5px;line-height:1.3;margin-top:22px;color:var(--ink2)}
.bk .meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;color:var(--ink);margin-bottom:2px}
.bk .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlband{padding:38px 56px;border-bottom:1px solid var(--rule)}
[data-theme=day] .tlband{background:var(--paper)}
[data-theme=night] .tlband{background:linear-gradient(90deg,#1b1611,#221b14,#1b1611)}
.tlband h2{margin:0 0 4px;font-size:32px;font-weight:500}
.tlband p{margin:0 0 20px;color:var(--ink2);font-size:calc(17px*var(--k))}
.erachips{display:flex;gap:10px;flex-wrap:wrap}
.erachip{font-family:Inter,sans-serif;padding:8px 14px;font-size:13px;background:rgba(127,127,127,.08);border-left:3px solid var(--c);display:inline-flex;gap:8px;align-items:baseline}
.erachip small{color:var(--ink2);font-size:11px}
.erachip:hover{background:rgba(127,127,127,.16)}
footer.foot{padding:40px 56px 60px;font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap}
footer.foot a{text-decoration:underline;text-underline-offset:3px}

/* ═══ Librero ═══ */
.subbar{position:sticky;top:67px;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 48px;background:var(--head-bg);border-bottom:1px solid var(--rule);font-family:Inter,sans-serif;font-size:13px;color:var(--ink2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.jump{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.jump::-webkit-scrollbar{display:none}
.jump a{white-space:nowrap;padding:4px 0}
.jump a b{color:var(--ink);font-weight:600;margin-right:4px}
.jump a:hover{color:var(--acc)}
.jump i{font-style:normal;opacity:.5}
.total{white-space:nowrap}
.tabs{display:flex;gap:2px;background:rgba(127,127,127,.12);padding:3px;border-radius:999px;flex:0 0 auto}
.tabs button{padding:6px 14px;border-radius:999px;font-family:Inter,sans-serif;font-size:13px;color:var(--ink)}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
.wrap{padding:28px 48px 60px}
.case{background:linear-gradient(var(--case-a),var(--case-b));padding:14px;border-radius:3px;box-shadow:0 24px 44px -20px rgba(40,25,10,.6);display:flex;flex-direction:column;gap:14px}
[data-theme=night] .case{box-shadow:0 30px 60px -20px rgba(0,0,0,.9)}
.bay{padding:14px 12px 2px;border-radius:2px;box-shadow:inset 0 10px 18px -8px rgba(0,0,0,.45);background:linear-gradient(180deg,var(--bay-a),var(--bay-b) 40%,var(--bay-a))}
[data-theme=night] .bay{background:radial-gradient(800px 200px at 50% 0,rgba(255,200,130,.10),transparent),linear-gradient(180deg,var(--bay-a),var(--bay-b))}
.plate{display:inline-flex;gap:10px;align-items:baseline;background:linear-gradient(#e2c78f,var(--plate) 55%,#9c7a3e);color:#2a1d0c;padding:5px 14px;border-radius:2px;font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 4px rgba(0,0,0,.4);margin:0 0 6px 6px;white-space:nowrap}
.plate i{font-style:normal;font-size:12px;opacity:.75;letter-spacing:.05em;text-transform:none}
.shelfrow{display:flex;align-items:flex-end;gap:2px;padding:16px 6px 0;border-bottom:12px solid var(--wood);box-shadow:0 8px 10px -6px rgba(0,0,0,.5);margin-bottom:16px;min-height:200px}
.shelfrow.face{gap:12px;min-height:196px}
.sp{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-radius:2px 2px 0 0;color:#f6efe2;
  background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 28%,rgba(255,255,255,.07) 50%,transparent 72%,rgba(0,0,0,.26)),
             linear-gradient(transparent 7px,rgba(255,236,190,.22) 7px,rgba(255,236,190,.22) 9px,transparent 9px,transparent calc(100% - 9px),rgba(255,236,190,.22) calc(100% - 9px),rgba(255,236,190,.22) calc(100% - 7px),transparent calc(100% - 7px)),var(--sc);
  box-shadow:inset -3px 0 4px rgba(0,0,0,.25),inset 3px 0 3px rgba(255,255,255,.12);overflow:hidden;white-space:nowrap;transition:transform .2s ease,box-shadow .2s;font-family:var(--serif)}
.sp.lt{color:#1d160f}
.sp .t{font-weight:500;font-size:13px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;max-height:74%}
[data-theme=night] .sp .t{font-size:14px;font-weight:600}
.sp .au{font-family:Inter,sans-serif;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.78;overflow:hidden;max-height:26%}
.sp:hover,.sp:focus-visible{transform:rotate(180deg) translateY(8px)}
.sp.lift{transform:rotate(180deg) translateY(16px);box-shadow:inset -3px 0 4px rgba(0,0,0,.25),0 -6px 14px rgba(0,0,0,.35)}
.dvd{flex:0 0 auto;width:28px;height:150px;align-self:flex-end;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#2a1d0c;background:linear-gradient(90deg,#d9bf86,#e9d6a6 40%,#c9a467);border-radius:0 0 3px 3px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;margin:0 4px}
.dvd small{font-size:10px;opacity:.7;font-weight:500}
.dvd.f{height:178px;width:30px;margin:0 2px}
a.dvd:hover{background:linear-gradient(90deg,#e6cd93,#f3e3b8 40%,#d6b273)}
.fc{flex:0 0 auto;width:112px;height:168px;display:block;transition:transform .2s ease}
.fc .cv{width:100%;height:100%}
.fc:hover,.fc:focus-visible{transform:translateY(-6px)}
.fc.lift{transform:translateY(-14px)}

/* ═══ Ficha ═══ */
.det{display:grid;grid-template-columns:300px 1fr;gap:56px;padding:48px 56px 80px;max-width:1240px;margin:0 auto}
.det .side{position:sticky;top:96px;align-self:start}
.det .side .cv{width:300px;height:440px}
.det .side .vols{margin-top:18px}
.chips{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.det h1{font-size:56px;font-weight:500;margin:0;line-height:1.04}
[data-theme=night] .det h1{font-size:60px}
.det .by{font-family:Inter,sans-serif;font-size:17px;margin:12px 0 22px;color:var(--ink2)}
.det .by a:hover{color:var(--acc)}
.btns{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.det .lede{font-size:calc(19px*var(--k));line-height:1.55;color:var(--ink2);max-width:720px;margin:0 0 6px}
.col{max-width:720px}
h3.sec{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:42px 0 14px;color:var(--ink2);font-weight:600}
.tesis{font-size:calc(22px*var(--k));line-height:1.55;margin:0}
.tesis .dc{float:left;font-size:76px;line-height:.8;padding:8px 10px 0 0;color:var(--acc);font-weight:500}
.prose{font-size:calc(18.5px*var(--k));line-height:1.6;margin:0 0 12px}
.ideas{counter-reset:i;padding:0;margin:0;list-style:none}
.ideas li{counter-increment:i;display:grid;grid-template-columns:44px 1fr;font-size:calc(18.5px*var(--k));line-height:1.5;margin-bottom:14px}
.ideas li:before{content:counter(i,decimal-leading-zero);font-size:15px;color:var(--acc);padding-top:3px}
.quote{margin:0 0 18px;padding:6px 0 6px 22px;border-left:3px solid var(--acc);font-size:calc(21px*var(--k));font-style:italic;line-height:1.45}
[data-theme=night] .quote{border-left-width:2px}
.quote footer{font-style:normal;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;margin-top:8px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.quote footer a{color:var(--acc);font-weight:600;display:inline-flex;gap:5px;align-items:center}
.quote footer a svg{width:14px;height:14px}
.conx{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;max-width:900px}
.conx a{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.conx a:hover{border-color:var(--acc)}
.conx .cv{width:56px;height:82px}
.conx b{display:block;font-weight:500;font-size:calc(17px*var(--k));line-height:1.2}
.conx small{display:block;font-family:Inter,sans-serif;font-size:11.5px;color:var(--ink2);margin:3px 0 5px}
.conx p{margin:0;font-size:calc(15px*var(--k));line-height:1.4;color:var(--ink2)}
.vols .chip{margin:0 6px 6px 0}

/* ═══ Páginas genéricas (estante, autor, atlas, búsqueda) ═══ */
.page{padding:48px 56px 80px;max-width:1320px;margin:0 auto}
.page h1{font-size:54px;font-weight:500;margin:6px 0 10px;line-height:1.05}
[data-theme=night] .page h1{font-variant:small-caps;letter-spacing:.03em}
.page .essay{font-size:calc(19px*var(--k));line-height:1.6;max-width:760px;color:var(--ink)}
.grid-bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:30px 22px;margin-top:30px}
.grid-bk .bk{width:auto}
.grid-bk .bk .cv{width:100%;height:auto;aspect-ratio:118/172}
.grid-bk .bk .meta{margin-top:10px}
.res-group{margin-top:34px}
.res-group h2{font-size:26px;font-weight:500;margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.res-group h2 small{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);letter-spacing:.1em}
.res-list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.res-list a{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 6px;border-bottom:1px solid var(--rule)}
.res-list a:hover{background:var(--paper)}
.res-list .d{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);padding-top:3px}
.res-list p{margin:0;font-size:calc(17px*var(--k));line-height:1.35}
.res-list small{font-family:Inter,sans-serif;font-size:11px;color:var(--ink2)}
mark{background:transparent;color:var(--acc);font-weight:600}
.atlas-g{margin-top:40px}
.atlas-g h2{font-size:30px;font-weight:500;margin:0 0 14px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cards a{display:block;padding:16px 18px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.cards a:hover{border-color:var(--acc)}
.cards b{display:block;font-size:calc(20px*var(--k));font-weight:500;line-height:1.2}
.cards small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.08em;color:var(--acc);margin:4px 0 6px;text-transform:uppercase}
.cards p{margin:0;font-size:calc(15px*var(--k));color:var(--ink2);line-height:1.4}
.metaline{font-family:Inter,sans-serif;font-size:13px;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 24px}
.metaline b{color:var(--ink);font-weight:500}
.ctl{border-left:1px solid var(--rule);margin-left:6px;padding-left:22px}
.ctl .it{position:relative;margin-bottom:18px}
.ctl .it:before{content:"";position:absolute;left:-27px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.ctl .y{font-family:Inter,sans-serif;font-size:12px;color:var(--acc);letter-spacing:.08em;font-weight:600}
.ctl p{margin:2px 0;font-size:calc(17.5px*var(--k))}
.ctl q{display:block;font-style:italic;color:var(--ink2);margin:6px 0 2px;font-size:calc(16px*var(--k))}
.ctl small{font-family:Inter,sans-serif;font-size:11px;color:var(--ink2)}
.ctl small a{color:var(--acc)}
.empty{font-family:Inter,sans-serif;color:var(--ink2);font-size:14px;padding:20px 0}
.loading{font-family:Inter,sans-serif;color:var(--ink2);font-size:14px;padding:60px 56px}

/* ═══ Línea del tiempo (marco con la original) ═══ */
body.tiempo-on{overflow:hidden;background:#07070d}
body.tiempo-on header.top,body.tiempo-on .tabbar{--head-bg:rgba(9,8,13,.94);--ink:#EDE3D2;--ink2:#A8987F;--rule:#2a2520;--acc:#C49A5A;--on-acc:#1a130b;--field:#14110d;color:var(--ink)}
body.tiempo-on footer.foot{display:none}
.tf-wrap{position:relative;height:calc(100vh - 67px);height:calc(100dvh - 67px);background:#07070d;overflow:hidden}
.tf-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#07070d}
.tf-load{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 40%,#141428,#07070d 70%);color:#bfb3a0;font-family:Inter,sans-serif;font-size:13px;letter-spacing:.08em;transition:opacity .6s ease}
.tf-load.off{opacity:0;pointer-events:none}
.tf-globe{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3d6aa8,#173563 45%,#0a1530 72%);box-shadow:0 0 50px rgba(90,140,220,.35),inset -18px -12px 40px rgba(0,0,0,.6);animation:tfpulse 2.4s ease-in-out infinite}
@keyframes tfpulse{50%{box-shadow:0 0 80px rgba(90,140,220,.55),inset -18px -12px 40px rgba(0,0,0,.6)}}

/* ═══ Lightbox ═══ */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,.94);display:none;flex-direction:column;align-items:center;justify-content:center;color:#EDE3D2}
.lb.on{display:flex}
.hdeck{position:relative;max-width:1240px;margin:28px auto 0;width:calc(100% - 96px);height:380px;border-radius:6px;overflow:hidden;background:#0d0a08;color:#F3EADB;box-shadow:0 24px 50px -28px rgba(0,0,0,.6);transition:height 1.6s cubic-bezier(.22,1,.36,1);cursor:default}
.hdeck .hstack{position:absolute;inset:0;filter:blur(20px) brightness(.42) saturate(.8);transform:scale(1.16);transition:filter 1.8s cubic-bezier(.22,1,.36,1) .2s,transform 1.8s cubic-bezier(.22,1,.36,1) .2s}
.hdeck .hs{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.hdeck .hs.on{opacity:1}
.hdeck .hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,10,8,.82),rgba(13,10,8,.35) 60%,rgba(13,10,8,.15));transition:opacity 1.2s}
.hdeck .hmeta{position:absolute;inset:0;display:flex;gap:34px;align-items:center;padding:0 48px;transition:opacity .9s ease,transform .9s ease}
.hdeck .hmeta .cv{width:170px;height:252px;flex:0 0 auto;box-shadow:0 18px 40px -14px rgba(0,0,0,.8)}
.hdeck .hm .kick{color:#d9b77a}.hdeck h1{font-size:calc(46px*var(--k));font-weight:500;margin:6px 0 4px;line-height:1.05;color:#F7EFE2}
.hdeck .by a{color:#d8ccb8;font-family:Inter,sans-serif;font-size:15px}.hdeck .btns{margin-top:20px}
.hdeck .btn.ghost{background:rgba(255,255,255,.08);color:#F3EADB;border:1px solid rgba(255,255,255,.25)}
.hdeck .hint{margin-top:16px;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.06em;color:rgba(243,234,219,.55);animation:hpulse 2.4s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.35}}
.hdeck .hctl,.hdeck .hcap{position:absolute;opacity:0;pointer-events:none;transition:opacity .8s ease .9s}
.hdeck .hctl{right:14px;bottom:14px;display:flex;gap:6px;align-items:center;font-family:Inter,sans-serif;font-size:12px}
.hdeck .hctl .ib{width:34px;height:34px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:16px;cursor:pointer}
.hdeck .hctl .hc{background:rgba(0,0,0,.55);padding:7px 11px;border-radius:999px}
.hdeck .hcap{left:14px;bottom:14px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.6);padding:8px 14px 8px 8px;border-radius:6px;font-family:Inter,sans-serif;max-width:60%}
.hdeck .hcap .cv{width:30px;height:44px}.hdeck .hcap b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdeck .hcap small{font-size:11px;opacity:.75}
.hdeck.open{height:min(70vh,calc((min(100vw,1240px) - 96px)*9/16));cursor:zoom-in}
.hdeck.open .hstack{filter:none;transform:none}
.hdeck.open .hs{object-fit:contain;background:#000}
.hdeck.open .hshade{opacity:0}
.hdeck.open .hmeta{opacity:0;transform:translateY(10px);pointer-events:none}
.hdeck.open .hctl,.hdeck.open .hcap{opacity:1;pointer-events:auto}
.det.withdeck .side>.cv,.det.withdeck .main>h1,.det.withdeck .main>.by,.det.withdeck .main>.btns{display:none}
.lb .lbcap{position:absolute;top:18px;left:50%;transform:translate(-50%,-8px);display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.55);padding:8px 16px 8px 8px;border-radius:6px;font-family:Inter,sans-serif;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
.lb .lbcap.show{opacity:1;transform:translate(-50%,0)}.lb .lbcap .cv{width:36px;height:54px}.lb .lbcap b{display:block;font-size:14px}.lb .lbcap small{font-size:12px;opacity:.75}
.lb .lbnext{position:absolute;bottom:70px;right:24px;background:rgba(196,154,90,.92);color:#1a130b;padding:8px 14px;border-radius:999px;font-family:Inter,sans-serif;font-size:13px;opacity:0;transition:opacity .5s;pointer-events:none}
.lb .lbnext.show{opacity:1}
@media(max-width:760px){.hdeck{width:calc(100% - 24px);height:auto;min-height:300px;margin-top:12px}.hdeck .hmeta{position:relative;flex-direction:column;align-items:flex-start;gap:14px;padding:22px 18px}.hdeck .hmeta .cv{width:96px;height:142px}.hdeck h1{font-size:30px}
 .hdeck.open{height:calc((100vw - 24px)*9/16 + 64px);min-height:0}.hdeck.open .hmeta{position:absolute}.hdeck .hcap{display:none}.hdeck .hctl{right:8px;bottom:8px}}

.lb .stage{position:relative;width:min(92vw,calc((100vh - 140px)*16/9));aspect-ratio:16/9;background:#000;border-radius:3px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb .stage img{width:100%;height:100%;object-fit:contain}
.lb .bar{display:flex;align-items:center;gap:12px;margin-top:16px;font-family:Inter,sans-serif;font-size:13px}
.lb .bar .t{opacity:.75;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .ib{width:42px;height:42px;border-radius:999px;border:1px solid rgba(237,227,210,.3);display:inline-flex;align-items:center;justify-content:center;color:#EDE3D2}
.lb .ib:hover{border-color:#C49A5A;color:#C49A5A}
.lb .ib.on{background:#C49A5A;color:#1a130b;border-color:#C49A5A}
.lb .close{position:absolute;top:16px;right:18px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .nav.p{left:14px}.lb .nav.n{right:14px}

/* ═══ Enlaces al Atlas dentro de los textos (los ◐ de la v1) ═══ */
a.xref{border-bottom:1px dotted var(--acc);color:inherit}
a.xref:after{content:"◐";font-size:.55em;vertical-align:super;margin-left:2px;color:var(--acc);font-style:normal}
a.xref:hover{color:var(--acc)}
.prose a.au,.by a.au{border-bottom:1px solid transparent}.by a.au:hover{border-bottom-color:currentColor}

/* ═══ Vitrina: citas del libro en la línea del tiempo (btlShowcase de la v1) ═══ */
.vit{position:relative;border:1px solid var(--rule);border-left:3px solid var(--acc);background:var(--paper);border-radius:4px;padding:20px 26px 14px;max-width:760px;outline:none;overflow:hidden}
.vit:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.vit:before{content:"“";position:absolute;right:18px;top:-34px;font-family:var(--serif);font-size:170px;line-height:1;color:var(--acc);opacity:.07;pointer-events:none}
.vit .vk{display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.vit .vk a{margin-left:auto;letter-spacing:.03em;text-transform:none;font-weight:600;color:var(--acc);display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.vit .vk a svg{width:15px;height:15px}
.vit .vbody{min-height:236px;display:flex;flex-direction:column;justify-content:center;padding:6px 0}
.vit .vh{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.plq{flex:0 0 auto;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;padding:5px 12px 4px;border-radius:2px;color:var(--pf,#f3ead8);background:linear-gradient(var(--ph,#6d4a2a),var(--pl,#3d2714));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 5px rgba(0,0,0,.22);letter-spacing:.02em;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.vit .vt{font-size:calc(19px*var(--k));line-height:1.25;font-weight:500}
.vit .vt a:hover{color:var(--acc)}
.vit blockquote{margin:0;font-style:italic;font-size:calc(19.5px*var(--k));line-height:1.5}
.vit .vm{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2);margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vit .vm a{color:var(--acc);font-weight:600}
.vit .vm .tag{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;color:var(--ink2);font-weight:500}
.vit .vm .tag:hover{border-color:var(--acc);color:var(--acc)}
.vit .vc{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:Inter,sans-serif;font-size:12px;color:var(--ink2)}
.vit .vc .ib{width:40px;height:40px;border:1px solid var(--rule);border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.vit .vc .ib:hover{border-color:var(--acc);color:var(--acc)}
.vit .vc .all{margin-left:auto;border:1px solid var(--rule);border-radius:999px;padding:8px 14px}
.vit .vc .all:hover{border-color:var(--acc);color:var(--acc)}
.vit .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0;opacity:.8}
.vit .bar.run{animation:vtick var(--d,8s) linear forwards}
.vit.hold .bar{animation-play-state:paused}
@keyframes vtick{to{width:100%}}
.vit .vin{animation:vfade .7s ease both}
@keyframes vfade{from{opacity:0;transform:translateY(7px)}}
.vrail{list-style:none;margin:12px 0 0;padding:0 4px 0 0;max-height:320px;overflow-y:auto;border-top:1px solid var(--rule);scrollbar-width:thin}
.vrail li button{display:grid;grid-template-columns:92px 1fr;gap:12px;width:100%;text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);font-size:calc(15.5px*var(--k));line-height:1.3}
.vrail li button span{font-family:Inter,sans-serif;font-size:11.5px;color:var(--acc);font-weight:600;padding-top:2px}
.vrail li button:hover,.vrail li.on button{background:rgba(127,127,127,.08)}
.vrail li.on button{box-shadow:inset 3px 0 0 var(--acc)}

/* ═══ Autores ═══ */
.ahero{display:grid;grid-template-columns:200px 1fr;gap:44px;align-items:start;max-width:1040px}
.portrait{width:200px;height:250px;border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:0 18px 34px -18px rgba(40,25,10,.6),0 0 0 1px var(--rule);position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
[data-theme=day] .portrait img{filter:sepia(.12) contrast(1.02)}
.pinit{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:96px;color:var(--acc);background:linear-gradient(160deg,var(--paper),var(--bg))}
.achips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.achips .chip{font-size:12.5px;padding:7px 14px}
.achips .chip b{font-weight:600;color:var(--acc)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px;margin-top:18px}
.acard{display:block}
.acard .ph{aspect-ratio:4/5;border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 1px var(--rule);transition:transform .2s}
.acard .ph img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
[data-theme=day] .acard .ph img{filter:sepia(.12)}
.acard .ph .pinit{font-size:54px}
.acard:hover .ph{transform:translateY(-4px)}
.acard b{display:block;font-weight:500;font-size:calc(17px*var(--k));line-height:1.2;margin-top:10px}
.acard small{font-family:Inter,sans-serif;font-size:11.5px;color:var(--ink2)}
.alist{columns:3 260px;column-gap:40px;margin-top:10px}
.alist a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:calc(16.5px*var(--k))}
.alist a small{font-family:Inter,sans-serif;font-size:11.5px;color:var(--ink2);white-space:nowrap;padding-top:3px}
.alist a:hover{color:var(--acc)}
.letter{font-size:30px;color:var(--acc);margin:30px 0 4px;font-weight:500;scroll-margin-top:130px}
.abox{display:grid;grid-template-columns:84px 1fr;gap:18px;align-items:start;margin-bottom:18px}
.abox .portrait{width:84px;height:104px}
.abox .pinit{font-size:40px}
.abox b{font-size:calc(21px*var(--k));font-weight:500;display:block;line-height:1.2}
.abox small{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2)}
.abox p{margin:6px 0 4px;font-size:calc(17px*var(--k));line-height:1.5}
.faces{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.faces::-webkit-scrollbar{display:none}
.faces a{flex:0 0 auto;width:96px;text-align:center}
.faces .ph{width:96px;height:120px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--rule);background:var(--paper);transition:transform .2s}
.faces .ph img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
[data-theme=day] .faces .ph img{filter:sepia(.12)}
.faces .ph .pinit{font-size:44px}
.faces a:hover .ph{transform:translateY(-3px)}
.faces b{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11.5px;line-height:1.25;margin-top:7px}
.faces small{font-family:Inter,sans-serif;font-size:10.5px;color:var(--ink2)}

/* ═══ Voces del estante (bloque de citas de la v1) ═══ */
.voces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 40px;margin:26px 0 10px;max-width:1100px}
.voces .quote{margin:0;font-size:calc(19px*var(--k))}
.voces .quote footer a.bt{color:var(--ink2);font-weight:500}
.voces .quote footer a.bt:hover{color:var(--acc)}
.sechd{display:flex;align-items:baseline;gap:14px;margin:46px 0 4px;flex-wrap:wrap}
.sechd h2{font-size:30px;font-weight:500;margin:0;line-height:1.1}
[data-theme=night] .sechd h2{font-variant:small-caps;letter-spacing:.04em}
.sechd .more,.sechd button.otro{margin-left:auto}
button.otro{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.04em;color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;min-height:36px}
button.otro:hover{color:var(--acc);border-color:var(--acc)}

/* ═══ Recorridos ═══ */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:26px}
.rcard{display:grid;grid-template-columns:118px 1fr;gap:18px;padding:18px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);align-items:start;transition:border-color .2s,transform .2s}
.rcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.rfan{position:relative;height:150px}
.rfan .cv{position:absolute;width:74px;height:108px;top:14px;transform-origin:50% 100%}
.rfan .cv:nth-child(1){left:0;transform:rotate(-9deg)}
.rfan .cv:nth-child(2){left:16px;transform:rotate(-3deg)}
.rfan .cv:nth-child(3){left:30px;transform:rotate(3deg)}
.rfan .cv:nth-child(4){left:44px;transform:rotate(9deg)}
.rcard:hover .rfan .cv:nth-child(1){transform:rotate(-13deg) translateX(-4px)}
.rcard:hover .rfan .cv:nth-child(4){transform:rotate(13deg) translateX(4px)}
.rfan .cv{transition:transform .3s ease}
.rcard .kick{font-size:10.5px}
.rcard b{display:block;font-size:calc(22px*var(--k));font-weight:500;line-height:1.15;margin:4px 0 6px}
.rcard p{margin:0;font-size:calc(15.5px*var(--k));line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.eradots{display:flex;align-items:center;gap:0;margin:16px 0 4px;flex-wrap:wrap}
.eradots i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block;flex:0 0 auto;box-shadow:0 0 0 3px var(--bg)}
.eradots i.no{background:var(--rule)}
.eradots s{width:28px;height:2px;background:linear-gradient(90deg,var(--a),var(--b));display:block;text-decoration:none;opacity:.6}
.rsteps{margin-top:30px;max-width:1000px;counter-reset:st}
.rstep{display:grid;grid-template-columns:52px 1fr;gap:18px;position:relative}
.rstep:before{counter-increment:st;content:counter(st);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--on-acc);background:var(--c,var(--acc));z-index:1;margin-top:18px;box-shadow:0 0 0 5px var(--bg)}
.rstep:after{content:"";position:absolute;left:19px;top:58px;bottom:-18px;width:2px;background:var(--rule)}
.rstep:last-child:after{display:none}
.rstep .card{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:18px 20px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);margin-bottom:18px;animation:vfade .45s ease both;animation-delay:var(--dl,0s)}
.rstep .cv{width:96px;height:140px}
.rstep .ec{display:inline-block;font-family:Inter,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:var(--c);border:1px solid var(--c);margin-right:8px}
.rstep .yr2{font-family:Inter,sans-serif;font-size:12px;color:var(--ink2)}
.rstep h3{margin:6px 0 2px;font-size:calc(23px*var(--k));font-weight:500;line-height:1.15}
.rstep h3 a:hover{color:var(--acc)}

}
function dropSearch(q){
  const seq=++qSeq;q=q.trim();if(norm(q).length<2){dropClose();return;}
  const t=qToks(q),all=s=>t.every(x=>s.includes(x));
  const bs=findBooks(q);const parts={books:bs.slice(0,5),nb:bs.length,authors:findAuthors(q).slice(0,4),rutas:findRutas(q).slice(0,2),pending:true};
  dropRender(q,parts);
  Promise.all([loadAtlas().catch(()=>[]),loadCitas().catch(()=>[]),loadSearch().catch(()=>[])]).then(([A,C,S])=>{
    if(seq!==qSeq||DROP.box.hidden)return;
    parts.atlas=A.filter(c=>all(norm(c.label+' '+(c.keywords||[]).join(' ')))).slice(0,3);
    parts.citas=C.filter(r=>all(r.n)).slice(0,3);
    parts.ev=S.filter(r=>all(r.n)).slice(0,3);parts.pending=false;
    const its0=$$('.so,.all',DROP.box);const k=its0.findIndex(x=>x.classList.contains('on'));
    dropRender(q,parts);if(k>=0){const it=$$('.so,.all',DROP.box)[k];if(it)it.classList.add('on');}
  });
}
function dropClose(){$$('.sdrop').forEach(b=>{b.hidden=true;b.innerHTML='';});$$('[aria-controls]').forEach(i=>i.setAttribute('aria-expanded','false'));}
function wireDrop(inp,box){
  inp.addEventListener('input',e=>{DROP={inp,box};clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>dropSearch(v),150);});
  inp.addEventListener('focus',e=>{DROP={inp,box};if(e.target.value.trim().length>1)dropSearch(e.target.value);});
  inp.addEventListener('keydown',e=>{
    const its=$$('.so,.all',box);let k=its.findIndex(x=>x.classList.contains('on'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!its.length)return;e.preventDefault();if(k>=0)its[k].classList.remove('on');k=e.key==='ArrowDown'?(k+1)%its.length:(k<=0?its.length-1:k-1);its[k].classList.add('on');its[k].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();const h=k>=0?its[k].getAttribute('href'):(v?'#/buscar/'+encodeURIComponent(v):null);if(h){dropClose();e.target.blur();location.hash=h;}}
    else if(e.key==='Escape'){if(!box.hidden)dropClose();else{e.target.value='';e.target.blur();}}
  });
}

       Tramos grandes (con su material) y un separador por era. */

    const gs=T.map((t,k)=>{const items=[],books=[];for(let i=t[1];i<=t[2];i++){const bs=D.core.books.filter(b=>b.er===i).sort(sortYear);if(!bs.length)continue;items.push({div:1,name:D.core.eras[i].short,full:'',n:bs.length,href:'#/tiempo/era/'+i});items.push(...bs);books.push(...bs);}
      return {id:'t'+k,num:'',name:t[0],mat:t[3],sub:D.core.eras[t[1]].years.split(/\s*[–-]\s*/)[0]+' – '+(D.core.eras[t[2]].years.split(/\s*[–-]\s*/)[1]||'hoy'),items,books};});
    const nx=D.core.books.filter(b=>b.er==null).sort(sortYear);
    if(nx.length)gs.push({id:'t-x',num:'',name:'Sin lugar en la línea',sub:'',books:nx});
    return gs.filter(g=>g.books.length);
  }
  if(ord==='autor'){
    /* la v1: un apartado para quien tiene 2+ libros (con su nombre común), los demás juntos; aquí, como en una librería,
       un tramo por letra y separadores con el nombre del autor entre los libros */
    const by=authorIndex().byName,named=[];
    Object.keys(by).forEach(n=>{const ids=[...new Set(by[n])];if(ids.length>=2)named.push({n,key:surnameKey(n),books:ids.map(id=>D.B[id]).sort(sortYear)});});
    const inNamed=new Set(named.flatMap(g=>g.books.map(b=>b.id)));
    const L={};named.forEach(g=>{const k=(g.key[0]||'#').toUpperCase();(L[k]=L[k]||{named:[],rest:[]}).named.push(g);});
    D.core.books.forEach(b=>{if(inNamed.has(b.id))return;const p=parseAuthors(b.a)[0]||b.a||'?';const k=(surnameKey(p)[0]||'#').toUpperCase();(L[k]=L[k]||{named:[],rest:[]}).rest.push(b);});
    return Object.keys(L).sort((a,b)=>a.localeCompare(b,'es')).map(k=>{const x=L[k];x.named.sort((a,b)=>a.key.localeCompare(b.key,'es'));x.rest.sort((a,b)=>surnameKey(parseAuthors(a.a)[0]||a.a).localeCompare(surnameKey(parseAuthors(b.a)[0]||b.a),'es'));
      const items=[];x.named.forEach(g=>{items.push({div:1,name:commonName(g.n),full:g.n,n:g.books.length});items.push(...g.books);});
      if(x.rest.length){if(x.named.length)items.push({div:1,name:'Otros',full:'',n:x.rest.length});items.push(...x.rest);}
      return {id:'L-'+k,num:'',name:k,sub:x.named.length?x.named.length+' autor'+(x.named.length===1?'':'es')+' con estante propio':'',items,books:x.named.flatMap(g=>g.books).concat(x.rest)};});
  }
  return D.core.estantes.map(e=>({id:e.id,num:e.num,name:e.name,href:'#/estante/'+e.id,books:booksOf(e.id)}));
}
function packRows(items,avail,wOf,gap){
  const rows=[];let row=[],w=0;
  items.forEach(b=>{const bw=wOf(b)+gap;if(row.length&&w+bw>avail){rows.push(row);row=[];w=0;}row.push(b);w+=bw;});
  if(row.length)rows.push(row);return rows;
}
let LBORN=false,LSPY=null;

  LB={mode,ord,w:avail};
  const gs=groupsFor(ord);

    const its=g.items||g.books,dw=face?40:30;

    h+='</div>';
  });
  h+='</div></div>';
  host.innerHTML=h;
  $('#ordsel').onchange=e=>{location.hash='#/librero/'+mode+'/'+e.target.value;};
  /* nacimiento estelar (v1): la primera vez en la visita, los libros aparecen escalonados */
  if(!LBORN&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){LBORN=true;const c=$('.case',host);c.classList.add('born');
    $$('.fc,.sp',host).forEach((el,i)=>el.style.setProperty('--bd',(Math.min(i*9,1250)+((i*2654435761)>>>0)%90)+'ms'));setTimeout(()=>c.classList.remove('born'),2600);}
  /* riel activo (shelf spy de la v1) */

    LSPY=new IntersectionObserver(es=>{es.forEach(x=>{if(!x.isIntersecting)return;const id=x.target.id.slice(4);

/* ── Vitrina: las citas del libro (o del autor) que sostienen eventos de la línea del tiempo, una a la vez.
   Mecánica de la v1 (btlShowcase): cada cita dura lo que tarda en leerse (5–13 s), barra de progreso, ‹ ›, swipe,
   flechas con foco, "ver todas" despliega el riel y pausa; se detiene si no está a la vista. ── */
const VITS=new Set();
function vitrinaHTML(id,entries,o){
  if(!entries.length)return '';
  return `<section class="vit" id="${id}" tabindex="0" aria-roledescription="carrusel" aria-label="Citas en la línea del tiempo">
  <div class="vk"><span>${esc(o.kick||'En la línea del tiempo')}</span>${o.href?`<a href="${o.href}">${ICON.clock}${esc(o.hrefLabel||'Ver en el tiempo')}</a>`:''}</div>
  <div class="vbody" aria-live="polite"></div>
  <div class="vc"><button class="ib" data-v="prev" aria-label="Cita anterior">${ICON.prev}</button><span class="pos"></span><button class="ib" data-v="next" aria-label="Cita siguiente">${ICON.next}</button><button class="all" data-v="all" aria-expanded="false">ver todas ▾</button></div>
  <ol class="vrail" hidden></ol><div class="bar"></div></section>`;
}
function initVitrina(id,entries,o){
  const el=document.getElementById(id);if(!el)return;
  const V={i:0,t:null,hold:false,vis:true,open:false,n:entries.length};VITS.add(V);
  const body=$('.vbody',el),pos=$('.pos',el),bar=$('.bar',el),rail=$('.vrail',el);
  const dur=e=>Math.max(5000,Math.min(13000,(e.x||'').length*52));
  const render=()=>{const e=entries[V.i];const b=D.B[e.b];const pg=pageHref(e.b,e.p);
    body.innerHTML=`<div class="vin"><div class="vh"><span class="plq" style="${matStyle(e.y)}" title="${esc(e.y)}">${esc(evDate({y:e.y}).full)}</span><div class="vt"><a href="#/tiempo/evento/${e.e}-${e.i}">${esc(e.t)}</a></div></div>
      <blockquote>«${esc(e.x)}»</blockquote>
      <div class="vm">${o.multi&&b?`<a class="tag" href="#/libro/${encodeURIComponent(b.id)}">${esc(clip(b.t,52))}</a>`:''}${e.p?(pg?`<a href="${esc(pg)}" target="_blank" rel="noopener" title="Abrir el PDF en esta página">${esc(e.p)} ↗</a>`:`<span>${esc(e.p)}</span>`):''}</div></div>`;
    pos.textContent=(V.i+1)+' / '+V.n;
    $$('li',rail).forEach((li,k)=>li.classList.toggle('on',k===V.i));
    if(V.open){const on=$('li.on',rail);if(on)on.scrollIntoView({block:'nearest'});}
    schedule();};
  const schedule=()=>{clearTimeout(V.t);bar.classList.remove('run');void bar.offsetWidth;
    if(V.hold||V.open||!V.vis||document.hidden||V.n<2)return;
    const d=dur(entries[V.i]);bar.style.setProperty('--d',d+'ms');bar.classList.add('run');
    V.t=setTimeout(()=>{if(!document.body.contains(el)){VITS.delete(V);return;}V.i=(V.i+1)%V.n;render();},d);};
  const go=d=>{V.i=(V.i+d+V.n)%V.n;render();};
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-v]');if(!b)return;const k=b.dataset.v;
    if(k==='prev')go(-1);else if(k==='next')go(1);
    else if(k==='all'){V.open=!V.open;b.setAttribute('aria-expanded',V.open);b.textContent=V.open?'ocultar ▴':'ver todas ▾';
      if(V.open&&!rail.children.length)rail.innerHTML=entries.map((e,k)=>`<li><button data-k="${k}"><span>${esc(evDate({y:e.y}).g)}</span>${esc(e.t)}</button></li>`).join('');
      rail.hidden=!V.open;render();}});
  rail.addEventListener('click',ev=>{const b=ev.target.closest('[data-k]');if(b){V.i=+b.dataset.k;render();}});
  el.addEventListener('keydown',ev=>{if(ev.target!==el)return;if(ev.key==='ArrowRight'){ev.preventDefault();ev.stopPropagation();go(1);}else if(ev.key==='ArrowLeft'){ev.preventDefault();ev.stopPropagation();go(-1);}});
  el.addEventListener('mouseenter',()=>{V.hold=true;el.classList.add('hold');clearTimeout(V.t);});
  el.addEventListener('mouseleave',()=>{V.hold=false;el.classList.remove('hold');schedule();});
  let tx=null;el.addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',ev=>{if(tx==null)return;const dx=ev.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40)go(dx<0?1:-1);},{passive:true});
  if('IntersectionObserver' in window){new IntersectionObserver(es=>{es.forEach(x=>{V.vis=x.isIntersecting;if(V.vis)schedule();else clearTimeout(V.t);});},{threshold:.35}).observe(el);}
  render();
}
/* citas de la línea del tiempo de un libro → entradas de la vitrina */
const tlEntries=(d,id)=>(d.tl||[]).map(r=>({e:r[0],i:r[1],y:r[2],t:r[3],x:r[4],p:r[5],b:id}));

/* ── Banda de presentación en la ficha (mecánica de la v1, refinada): los slides esperan detrás del encabezado,
   borrosos; si no haces scroll ~5.5 s se aclaran, la banda crece a 16:9 y pasan solos cada 9 s. Click = pantalla completa. ── */
function heroDeckHTML(b,d,e,url,nq,ne,id){
  const n=Math.min(b.dk,40);let imgs='';for(let i=1;i<=n;i++){imgs+=`<img class="hs${i===1?' on':''}" ${i<=2?'':'loading="lazy" '}src="decks/${b.id}/slide-${String(i).padStart(2,'0')}.jpg" alt="Diapositiva ${i}">`;}
  return `<section class="hdeck" id="hdeck" data-n="${n}" aria-label="Presentación de ${esc(b.t)}">

let HD=null;
function initHeroDeck(b){

  const show=k=>{if(!document.body.contains(el)){HD.cleanup&&HD.cleanup();return;}HD.i=(k+HD.n)%HD.n;sl.forEach((x,j)=>x.classList.toggle('on',j===HD.i));$('#hdCount').textContent=(HD.i+1)+' / '+HD.n;const nx=sl[(HD.i+1)%HD.n];if(nx&&nx.loading==='lazy')nx.loading='eager';};

  const stop=()=>{if(HD.timer){clearInterval(HD.timer);HD.timer=null;}};
  const expand=()=>{if(el.classList.contains('open'))return;el.classList.add('open');setTimeout(start,1200);};
  const collapse=()=>{stop();el.classList.remove('open');};
  const y0=window.scrollY;const onS=()=>{if(Math.abs(window.scrollY-y0)>40){clearTimeout(HD.reveal);window.removeEventListener('scroll',onS);}};

  HD.reveal=setTimeout(()=>{window.removeEventListener('scroll',onS);if(!document.hidden&&curView==='page'&&$('#hdeck')===el&&!reduce)expand();},5500);
  el.addEventListener('mouseenter',()=>{HD.hover=true;stop();});

    if(a){ev.preventDefault();const k=a.dataset.hd;if(k==='play'){expand();}else if(k==='prev'){show(HD.i-1);start();}else if(k==='next'){show(HD.i+1);start();}else if(k==='close'){collapse();}else if(k==='full'){stop();openDeck(b.id,a,HD.i);}return;}
    if(ev.target.closest('a,button'))return;
    if(el.classList.contains('open')){stop();openDeck(b.id,el,HD.i);}});
  let tx=null;el.addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',ev=>{if(tx==null||!el.classList.contains('open'))return;const dx=ev.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){show(HD.i+(dx<0?1:-1));start();}tx=null;},{passive:true});
  HD.cleanup=()=>{stop();clearTimeout(HD.reveal);window.removeEventListener('scroll',onS);};
}

  if(j>=LBX.n||j<0){const L=deckList(),k=L.findIndex(x=>x.id===LBX.id),nb=L[((k+(j<0?-1:1))%L.length+L.length)%L.length];if(nb&&nb.id!==LBX.id){LBX.id=nb.id;LBX.n=nb.dk;LBX.i=j<0?nb.dk-1:0;$('#lbTitle').textContent=nb.t;lbShow();lbCaption();if(LBX.narr)narrLoad(LBX.id).then(narrSpeak).catch(()=>narrStop());return;}}

function narrLoad(id){return new Promise((res,rej)=>{window.__DECKNARR=window.__DECKNARR||{};if(__DECKNARR[id])return res(__DECKNARR[id]);const s=document.createElement('script');s.src='decks/'+id+'/narration.js';s.onload=()=>__DECKNARR[id]?res(__DECKNARR[id]):rej();s.onerror=()=>rej();document.head.appendChild(s);});}
function narrVoice(lang){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const pool=vs.filter(v=>new RegExp('^'+lang,'i').test(v.lang||''));const q=v=>{const n=(v.name||'').toLowerCase();return /premium|siri/.test(n)?0:/enhanced|mejorad|neural|natural/.test(n)?1:/google/.test(n)?2:3;};const pref=lang==='en'?/samantha|aria|jenny/i:/monica|mónica|paulina/i;pool.sort((a,b)=>q(a)-q(b)||(pref.test(b.name)?1:0)-(pref.test(a.name)?1:0)||(/mx|us/i.test(b.lang)?1:0)-(/mx|us/i.test(a.lang)?1:0));return pool[0]||null;}
/* trozos de ≤180 caracteres por frase: Chrome corta los enunciados largos (lo resolvió la v1) */
function narrChunks(t,max=180){const out=[];let cur='';t.split(/(?<=[.!?;:])\s+/).forEach(f=>{while(f.length>max){const k=f.lastIndexOf(' ',max);out.push((cur+' '+f.slice(0,k>40?k:max)).trim());cur='';f=f.slice(k>40?k:max);}if((cur+' '+f).trim().length>max){out.push(cur.trim());cur=f;}else cur=(cur+' '+f).trim();});if(cur.trim())out.push(cur.trim());return out;}

  const s=' '+arr.join(' ').toLowerCase()+' ';const cnt=ws=>ws.reduce((n,w)=>n+(s.split(w).length-1),0);const lang=cnt([' the ',' of ',' and '])>cnt([' el ',' la ',' de ',' que '])?'en':'es';

  const parts=narrChunks(t);const v=narrVoice(lang);const slide=LBX.id+'#'+LBX.i;
  const say=k=>{if(!LBX.narr||LBX.id+'#'+LBX.i!==slide)return;if(k>=parts.length){setTimeout(()=>{if(LBX.narr&&LBX.id+'#'+LBX.i===slide)lbGo(1);},800);return;}

function narrStop(){LBX.narr=false;try{speechSynthesis.cancel();}catch(e){}$('#lbVoice').classList.remove('on');$('#lbVoice').setAttribute('aria-label','Narrar los slides');}

function yrOf(s,bcDefault){s=String(s||'');const m=s.match(/(\d[\d.,]*)/);if(!m)return null;let n=parseInt(m[1].replace(/[.,]/g,''),10);if(/a\.?\s?c/i.test(s)||(bcDefault&&!/d\.?\s?c/i.test(s)))n=-n;return n;}

    h+=`<nav class="anav">${pv?`<a href="#/atlas/${encodeURIComponent(pv.id)}">← Anterior<b>${esc(pv.label)}</b></a>`:'<span></span>'}${nx?`<a href="#/atlas/${encodeURIComponent(nx.id)}" style="text-align:right">Siguiente →<b>${esc(nx.label)}</b></a>`:''}</nav></div>`;
    host.innerHTML=h;window.scrollTo(0,0);return;
  }
  document.title='Atlas — Librería';
  const groups=GROUP_ORDER.filter(g=>A.some(c=>c.group===g)).concat([...new Set(A.map(c=>c.group))].filter(g=>!GROUP_ORDER.includes(g)));
  const dW=A.filter(c=>c.geo&&c.geo.v==='w'&&c.geo.cap).map(c=>({c,g:c.geo})),dM=A.filter(c=>c.geo&&c.geo.v==='mx'&&c.geo.cap).map(c=>({c,g:c.geo}));
  let h=`<div class="page"><div class="kick">Atlas · ${A.length} civilizaciones, imperios, sistemas e ideas</div><h1>Atlas</h1><p class="essay">Las civilizaciones, los imperios, los recursos y las ideas que atraviesan los libros: cada ficha resume su historia y te lleva a lo que tu biblioteca dice de ella, con citas.</p>
  <div class="chips" style="margin-top:18px">${groups.map(g=>`<a class="chip" href="#/atlas" data-ag="${esc(g)}" style="font-size:13px;padding:8px 14px">${esc(g)} <span style="opacity:.6">${A.filter(c=>c.group===g).length}</span></a>`).join('')}</div>
  ${AMAP?`<div class="sechd"><h2>En el mapa</h2><span class="cnt ui" style="font-size:12px;color:var(--ink2)">Toca un punto para abrir su ficha</span></div><div class="amaps"><figure class="amap" style="margin:0">${amapSVG('w',null,dW)}<figcaption>El mundo</figcaption></figure><figure class="amap" style="margin:0">${amapSVG('mx',null,dM)}<figcaption>México y Mesoamérica</figcaption></figure></div>`:''}
  <div class="legend">${Object.values(MODO).map(m=>`<span><i style="--mc:${m[0]}"></i>${m[1]}</span>`).join('')}</div>
  <div class="sechd"><h2>Cronografía</h2><span class="cnt ui" style="font-size:12px;color:var(--ink2)">Cuándo existió cada una · la escala se abre después de 1492</span></div><div class="gantt">${ganttSVG(A)}</div>`;
  groups.forEach((g,gi)=>{h+=`<section class="atlas-g" id="ag-${gi}" style="--g:${GROUP_COL[g]||'var(--acc)'}"><h2>${esc(g)}</h2><div class="cards">${A.filter(c=>c.group===g).map(c=>{const nb=(c._bk||[]).length;return `<a href="#/atlas/${encodeURIComponent(c.id)}"><span class="gl">${glyph(c.group)}</span><b>${esc(c.label)}</b><small>${esc(c.subregion||(MODO[c.modo]||['',''])[1]||'')}${c.periodo?' · '+esc(c.periodo):''}</small><p>${esc(c.desc||'')}</p>${nb||c._nq?`<span class="cnts">${nb} libro${nb===1?'':'s'} · ${fmtN(c._nq||0)} cita${c._nq===1?'':'s'}</span>`:''}</a>`;}).join('')}</div></section>`;});
  h+='</div>';host.innerHTML=h;window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-ag]');if(a){e.preventDefault();const gs=$$('[data-ag]').map(x=>x.dataset.ag);const el=$('#ag-'+gs.indexOf(a.dataset.ag));if(el)el.scrollIntoView({behavior:'smooth'});}
  const m=e.target.closest('[data-showall]');if(m){$$('#'+m.dataset.showall+' [hidden]').forEach(x=>x.hidden=false);m.remove();}});

/* ══════════ LÍNEA DEL TIEMPO ══════════
   La original de la v1 (estrellas, globo, banda tipo Star Wars, constelaciones de caras), refinada en tiempo.html
   (fuente: ~/scripts/library/tiempo-src). Vive DENTRO de la librería, en un marco que comparte encabezado y pestañas:
   #/tiempo/<ruta de la línea del tiempo> ⇄ tiempo.html?embed=1#/<ruta>. El marco avisa cada cambio de hash
   (__tiempoSync) y la librería lo refleja con replaceState, así Atrás funciona y los enlaces se pueden compartir.
   Se carga la primera vez que entras y se queda vivo (el globo no se reconstruye al volver). */
const MX={la0:13.6,la1:33.2,ln0:-118.6,ln1:-86.2};
const W0={la0:-56,la1:76,ln0:-170,ln1:180};
function proj(view){
  if(view==='mx'){const k=Math.cos(23.5*Math.PI/180);const W=760,H=Math.round(760*(MX.la1-MX.la0)/((MX.ln1-MX.ln0)*k));return {W,H,f:(la,ln)=>[(ln-MX.ln0)/(MX.ln1-MX.ln0)*W,(MX.la1-la)/(MX.la1-MX.la0)*H]};}
  const W=760,H=Math.round(760*(W0.la1-W0.la0)/(W0.ln1-W0.ln0)*1.25);return {W,H,f:(la,ln)=>[(ln-W0.ln0)/(W0.ln1-W0.ln0)*W,(W0.la1-la)/(W0.la1-W0.la0)*H]};
}
const MXST={AGU:'Aguascalientes',BCN:'Baja California',BCS:'Baja California Sur',CAM:'Campeche',CHP:'Chiapas',CHH:'Chihuahua',CMX:'Ciudad de México',DIF:'Ciudad de México',COA:'Coahuila',COL:'Colima',DUR:'Durango',GUA:'Guanajuato',GRO:'Guerrero',HID:'Hidalgo',JAL:'Jalisco',MEX:'Estado de México',MIC:'Michoacán',MOR:'Morelos',NAY:'Nayarit',NLE:'Nuevo León',OAX:'Oaxaca',PUE:'Puebla',QUE:'Querétaro',ROO:'Quintana Roo',SLP:'San Luis Potosí',SIN:'Sinaloa',SON:'Sonora',TAB:'Tabasco',TAM:'Tamaulipas',TLA:'Tlaxcala',VER:'Veracruz',YUC:'Yucatán',ZAC:'Zacatecas'};
function placeName(l){if(!l)return '';let n=l.n||'';if(/^[A-Z]{2}-[A-Z]{2,3}$/.test(n)){const c=n.split('-')[1];n=(n.startsWith('MX-')&&MXST[c])||c;}return n;}
let TF=null;
function tiempoWant(){
  const raw=location.hash.replace(/^#\/?tiempo\/?/,'');
  if(/^libros\//.test(raw))return '#/explorar?libros='+raw.slice(7);
  if(raw==='hoy'||raw==='')return '#/';
  return '#/'+raw;
}
async function renderTiempo(){
  document.title='Línea del tiempo — Librería';
  document.body.classList.add('tiempo-on');window.scrollTo(0,0);
  const want=tiempoWant();
  if(!TF){
    $('#v-tiempo').innerHTML=`<div class="tf-wrap"><div class="tf-load" id="tfLoad"><div class="tf-globe"></div><p>Abriendo la línea del tiempo…</p></div><iframe id="tframe" title="Línea del tiempo" src="tiempo.html?embed=1${want}" allow="fullscreen; autoplay; screen-wake-lock" allowfullscreen></iframe></div>`;
    TF=$('#tframe');TF.addEventListener('load',()=>{setTimeout(()=>$('#tfLoad').classList.add('off'),350);try{TF.contentWindow.focus();}catch(e){}});
    return;
  }
  try{const w=TF.contentWindow,cur=w.location.hash||'#/';if(cur!==want)w.location.replace(w.location.pathname+w.location.search+want);setTimeout(()=>{try{w.focus();}catch(e){}},60);}catch(e){}
}
window.__tiempoSync=h=>{
  if(curView!=='tiempo')return;
  const sub=String(h||'').replace(/^#\/?/,'');const want='#/tiempo'+(sub?'/'+sub:'');
  if(location.hash!==want){history.replaceState(null,'',want);curHash=want;}
};
function tiempoLeave(){document.body.classList.remove('tiempo-on');if(TF){try{const w=TF.contentWindow;if(w.__tlStopNarration)w.__tlStopNarration();}catch(e){}}}

/* ── Encabezado que se esconde al bajar y vuelve al subir (móvil, como la v1) ── */
(function(){let y0=window.scrollY,tk=false;window.addEventListener('scroll',()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{const y=window.scrollY;
  if(window.innerWidth<=760&&curView!=='tiempo'){if(y>y0+4&&y>120)document.body.classList.add('hh');else if(y<y0-4||y<80)document.body.classList.remove('hh');}
  y0=y;tk=false;});},{passive:true});})();

/* ── Arranque ── */
(function(){const v=new URLSearchParams(location.search).get('view');const M={tiempo:'#/tiempo',timeline:'#/tiempo',atlas:'#/atlas',libros:'#/librero',librero:'#/librero',recorridos:'#/recorridos',autores:'#/autores'};
  if(v&&M[v]&&(!location.hash||location.hash.length<3))history.replaceState(null,'',location.pathname+M[v]);})();
if(!location.hash||location.hash==='#'||location.hash==='#/')history.replaceState(null,'','#/estantes');
route();
</script>
