const tEnd=()=>{onUp()};
el.addEventListener("mousedown",mDown,true);
el.addEventListener("mousemove",mMove,true);
el.addEventListener("mouseup",mUp,true);
el.addEventListener("mouseleave",mLeave);
el.addEventListener("touchstart",tDown,{capture:true,passive:true});
el.addEventListener("touchmove",tMove,{capture:true,passive:false});
el.addEventListener("touchend",tEnd,true);
el.addEventListener("touchcancel",tEnd,true);
return()=>{el.removeEventListener("mousedown",mDown,true);el.removeEventListener("mousemove",mMove,true);el.removeEventListener("mouseup",mUp,true);el.removeEventListener("mouseleave",mLeave);el.removeEventListener("touchstart",tDown,true);el.removeEventListener("touchmove",tMove,true);el.removeEventListener("touchend",tEnd,true);el.removeEventListener("touchcancel",tEnd,true)};
});
return <div ref={ref} style={{position:"relative",userSelect:"none",touchAction:"none",cursor:dragRef.current!=null?"col-resize":"default"}}>
{children}
{!show&&<div style={{position:"absolute",top:6,right:10,fontSize:8,color:C.dm,fontFamily:"monospace",opacity:.6,pointerEvents:"none",zIndex:3}}>Desliza para comparar</div>}
{show&&(()=>{
const x0=getPx(si),x1=getPx(fi);
const d0=cfg.d[si],d1=cfg.d[fi];
if(!d0||!d1)return null;
const lbl0=d0[cfg.x],lbl1=d1[cfg.x];
return <React.Fragment>
<div style={{position:"absolute",left:x0,top:0,width:Math.max(x1-x0,1),height:h,background:"rgba(255,255,255,.06)",borderLeft:`1px dashed ${C.mu}`,borderRight:`1px dashed ${C.mu}`,pointerEvents:"none",zIndex:3}}/>
<div style={{position:"absolute",left:Math.min(x0+((x1-x0)/2)-60,ref.current?.offsetWidth-160||9999),top:8,background:C.card+"ee",border:`1px solid ${C.bdr}`,borderRadius:6,padding:"6px 10px",fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:C.tx,zIndex:6,pointerEvents:"none",minWidth:100,maxWidth:200}}>
<div style={{fontWeight:700,marginBottom:3,color:C.al}}>{lbl0} → {lbl1}</div>
{cfg.keys.map((k,ki)=>{
const v0=d0[k.k],v1=d1[k.k];
const p=pct(v0,v1);
const delta=v1-v0;
const up=delta>=0;
const clr=up?C.gn:C.rd;
return <div key={ki} style={{color:clr,marginTop:ki?2:0}}>
{cfg.keys.length>1&&<span style={{color:C.mu}}>{k.label}: </span>}
{p!=null?<span>{up?"+":""}{p.toFixed(1)}%</span>:<span>N/A</span>}
<span style={{color:C.mu}}> ({up?"+":""}{fmt(delta)})</span>
</div>})}
</div>
</React.Fragment>})()}
</div>};

const FsLabelsOverlay=({containerRef,drag,chartId})=>{
const[pts,setPts]=useState([]);
useEffect(()=>{
const el=containerRef.current;if(!el)return;
let attempts=0;
const fmt=v=>{if(v==null)return'';return Math.abs(v)<1?v.toFixed(2):Math.abs(v)<10?v.toFixed(1):String(Math.round(v))};
const scan=()=>{
const svg=el.querySelector('.recharts-surface');
if(!svg){if(attempts<5){attempts++;setTimeout(scan,400)}return}
const elRect=el.getBoundingClientRect();const svgRect=svg.getBoundingClientRect();
const ox=svgRect.left-elRect.left;const oy=svgRect.top-elRect.top;
// Build YAxis value scale from tick labels
const yTicks=[];
const yAxis=svg.querySelector('.recharts-yAxis');
if(yAxis){yAxis.querySelectorAll('.recharts-cartesian-axis-tick').forEach(t=>{
const txt=t.querySelector('text');if(!txt)return;
const val=parseFloat(txt.textContent);const py=parseFloat(txt.getAttribute('y'));
if(!isNaN(val)&&!isNaN(py))yTicks.push({val,py});
})}
const valFromY=(py)=>{
if(yTicks.length<2)return null;
const t0=yTicks[0],t1=yTicks[yTicks.length-1];
if(t0.py===t1.py)return null;
return t0.val+(t1.val-t0.val)*((py-t0.py)/(t1.py-t0.py));
};
// Build XAxis value scale (for horizontal bars)
const xTicks=[];
const xAxis=svg.querySelector('.recharts-xAxis');
if(xAxis){xAxis.querySelectorAll('.recharts-cartesian-axis-tick').forEach(t=>{
const txt=t.querySelector('text');if(!txt)return;
const val=parseFloat(txt.textContent);const px=parseFloat(txt.getAttribute('x'));
if(!isNaN(val)&&!isNaN(px))xTicks.push({val,px});
})}
const valFromX=(px)=>{
if(xTicks.length<2)return null;
const t0=xTicks[0],t1=xTicks[xTicks.length-1];
if(t0.px===t1.px)return null;
return t0.val+(t1.val-t0.val)*((px-t0.px)/(t1.px-t0.px));
};
const labels=[];
const seriesGroups=[];
// Lines/Areas
svg.querySelectorAll('.recharts-line, .recharts-area').forEach(layer=>{
const color=layer.querySelector('path.recharts-curve')?.getAttribute('stroke')||
layer.querySelector('path.recharts-curve')?.getAttribute('fill')||C.tx;
const dots=[];
layer.querySelectorAll('circle').forEach(c=>{
const cx=parseFloat(c.getAttribute('cx'));const cy=parseFloat(c.getAttribute('cy'));
if(!isNaN(cx)&&!isNaN(cy))dots.push({x:ox+cx,y:oy+cy,sy:cy});
});
if(dots.length>0)seriesGroups.push({dots,color});
});
// Bars — detect horizontal (layout="vertical") vs vertical
svg.querySelectorAll('.recharts-bar').forEach(layer=>{
const rects=[];let color=C.tx;let isHoriz=false;
const allBr=layer.querySelectorAll('.recharts-bar-rectangle');
if(allBr.length>0){const fr=allBr[0].querySelector('rect')||allBr[0].querySelector('path');if(fr){const fw=fr.tagName==='rect'?parseFloat(fr.getAttribute('width')):fr.getBBox().width;const fh=fr.tagName==='rect'?parseFloat(fr.getAttribute('height')):fr.getBBox().height;if(!isNaN(fw)&&!isNaN(fh)&&fw>fh*1.5)isHoriz=true}}
allBr.forEach(br=>{
const rect=br.querySelector('rect')||br.querySelector('path');
if(!rect)return;
const fill=rect.getAttribute('fill');if(fill)color=fill;
if(rect.tagName==='rect'){
const x=parseFloat(rect.getAttribute('x'));const y=parseFloat(rect.getAttribute('y'));
const w=parseFloat(rect.getAttribute('width'));const h=parseFloat(rect.getAttribute('height'));
if(!isNaN(x)&&!isNaN(y)){
if(isHoriz){if(w>2||h>2)rects.push({x:ox+x+w+4,y:oy+y+h/2,sx:x+w,horiz:true})}
else{if(w>2)rects.push({x:ox+x+w/2,y:oy+y,sy:y})}
}
}else{const bb=rect.getBBox();if(bb.width>2){if(isHoriz){rects.push({x:ox+bb.x+bb.width+4,y:oy+bb.y+bb.height/2,sx:bb.x+bb.width,horiz:true})}else{rects.push({x:ox+bb.x+bb.width/2,y:oy+bb.y,sy:bb.y})}}}
});
if(rects.length>0)seriesGroups.push({dots:rects,color,isHoriz});
});
if(seriesGroups.length===0){if(attempts<5){attempts++;setTimeout(scan,400)}return}
const data=drag?.d;const keys=drag?.keys;
seriesGroups.forEach((sg,si)=>{
if(sg.isHoriz){sg.dots.sort((a,b)=>a.y-b.y)}else{sg.dots.sort((a,b)=>a.x-b.x)}
for(let d=0;d<sg.dots.length;d++){
let val;const dot=sg.dots[d];
if(data&&keys&&si<keys.length&&d<data.length){
val=data[d][keys[si].k];
}else{
val=dot.horiz?valFromX(dot.sx):valFromY(dot.sy);
}
if(val==null)continue;
labels.push({x:dot.x,y:dot.horiz?dot.y:dot.y-18,val:fmt(val),color:sg.color,horiz:dot.horiz});
}
});
// Separate overlapping labels
for(let i=0;i<labels.length;i++){
for(let j=i+1;j<labels.length;j++){
const dx=Math.abs(labels[i].x-labels[j].x);const dy=Math.abs(labels[i].y-labels[j].y);
if(dx<8&&dy<14){labels[i].y-=7;labels[j].y+=7}
}
}
setPts(labels);
};
const timer=setTimeout(scan,300);
return()=>clearTimeout(timer);
},[drag,chartId]);
if(!pts.length)return null;
return <div style={{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden"}}>
{pts.map((p,i)=><span key={i} style={{position:"absolute",left:p.x,top:p.y,transform:p.horiz?"translate(0,-50%)":"translate(-50%,0)",fontSize:7,fontFamily:"'JetBrains Mono',monospace",color:p.color,fontWeight:700,textShadow:`0 0 4px ${C.card}, 0 0 4px ${C.card}, 0 0 6px ${C.card}`}}>{p.val}</span>)}
</div>;
};
