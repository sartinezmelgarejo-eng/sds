<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf3"/>
      <stop offset="100%" stop-color="#ebe5d2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="50%" stop-color="#3d2615"/>
      <stop offset="100%" stop-color="#2e1a0c"/>
    </linearGradient>
    <linearGradient id="fret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#888"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="40%" stop-color="#fde2ee"/>
      <stop offset="70%" stop-color="#e0f4ff"/>
      <stop offset="100%" stop-color="#c8d4e6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cream square background (safe-area friendly) -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- Guitar neck slab, angled diagonally -->
  <g transform="translate(256 256) rotate(-18) translate(-256 -110)">
    <rect x="-60" y="0" width="640" height="220" fill="url(#wood)"/>
    <!-- Frets -->
    <g fill="url(#fret)">
      <rect x="40"  y="-6" width="4" height="232"/>
      <rect x="160" y="-6" width="4" height="232"/>
      <rect x="280" y="-6" width="4" height="232"/>
      <rect x="400" y="-6" width="4" height="232"/>
      <rect x="520" y="-6" width="4" height="232"/>
    </g>
    <!-- Mother-of-pearl diamond inlays -->
    <polygon points="100,110 122,86 144,110 122,134" fill="url(#pearl)" stroke="#3a2a1a" stroke-width="0.8"/>
    <polygon points="340,110 362,86 384,110 362,134" fill="url(#pearl)" stroke="#3a2a1a" stroke-width="0.8"/>
    <!-- Strings -->
    <g stroke-linecap="round">
      <line x1="-60" y1="32"  x2="580" y2="32"  stroke="#e0e0e0" stroke-width="2"/>
      <line x1="-60" y1="62"  x2="580" y2="62"  stroke="#e8c590" stroke-width="2.5"/>
      <line x1="-60" y1="98"  x2="580" y2="98"  stroke="#c89a5e" stroke-width="3"/>
      <line x1="-60" y1="138" x2="580" y2="138" stroke="#c89a5e" stroke-width="3.5"/>
      <line x1="-60" y1="174" x2="580" y2="174" stroke="#a87840" stroke-width="4"/>
      <line x1="-60" y1="204" x2="580" y2="204" stroke="#8a6230" stroke-width="4.5"/>
    </g>
    <!-- Chord-tone notes lit up -->
    <circle cx="220" cy="62"  r="26" fill="#dc2626" filter="url(#glow)"/>
    <text x="220" y="71" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fff">R</text>
    <circle cx="340" cy="138" r="26" fill="#2563eb" filter="url(#glow)"/>
    <text x="340" y="147" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fff">3</text>
    <circle cx="460" cy="98"  r="26" fill="#16a34a" filter="url(#glow)"/>
    <text x="460" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#fff">5</text>
  </g>

  <!-- Title -->
  <text x="40" y="76" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="48" font-weight="700" fill="#1a1a1a">Guitarra</text>
  <text x="40" y="105" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="18" fill="#a07820" letter-spacing="2">jazz chord practice</text>
</svg>
