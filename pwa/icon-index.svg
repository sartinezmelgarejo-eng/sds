<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0608"/>
      <stop offset="100%" stop-color="#1a0a0e"/>
    </linearGradient>
    <filter id="softshadow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 3 rounded vertical bars, Mexican tricolor.
       64px wide, 32px gaps between, 256px tall.
       Total span: 256×256, centered on the 512×512 canvas. -->
  <g transform="translate(128 128)">
    <rect x="0"   y="0" width="64" height="256" rx="14" fill="#006847"/>
    <rect x="96"  y="0" width="64" height="256" rx="14" fill="#f5f5f0"/>
    <rect x="192" y="0" width="64" height="256" rx="14" fill="#ce1126"/>
  </g>
</svg>
