<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2126"/>
      <stop offset="100%" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="dwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a33"/>
      <stop offset="55%" stop-color="#6e4526"/>
      <stop offset="100%" stop-color="#4c2e16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#dbg)"/>
  <rect x="0" y="62" width="400" height="176" fill="url(#dwood)"/>
  <!-- fret wires -->
  <g stroke="#c9ccd6" stroke-width="2.5" opacity="0.85">
    <line x1="58" y1="62" x2="58" y2="238"/>
    <line x1="126" y1="62" x2="126" y2="238"/>
    <line x1="188" y1="62" x2="188" y2="238"/>
    <line x1="246" y1="62" x2="246" y2="238"/>
    <line x1="298" y1="62" x2="298" y2="238"/>
    <line x1="346" y1="62" x2="346" y2="238"/>
  </g>
  <!-- inlays -->
  <g fill="rgba(232,228,218,0.30)">
    <circle cx="157" cy="150" r="7"/>
    <circle cx="272" cy="150" r="7"/>
    <circle cx="322" cy="128" r="6"/>
    <circle cx="322" cy="172" r="6"/>
  </g>
  <!-- strings (low E thickest at top) -->
  <g stroke="#dfe2ea">
    <line x1="0" y1="88"  x2="400" y2="88"  stroke-width="3.4" opacity="0.92"/>
    <line x1="0" y1="113" x2="400" y2="113" stroke-width="2.9" opacity="0.9"/>
    <line x1="0" y1="138" x2="400" y2="138" stroke-width="2.4" opacity="0.88"/>
    <line x1="0" y1="163" x2="400" y2="163" stroke-width="2.0" opacity="0.86"/>
    <line x1="0" y1="188" x2="400" y2="188" stroke-width="1.6" opacity="0.84"/>
    <line x1="0" y1="213" x2="400" y2="213" stroke-width="1.3" opacity="0.82"/>
  </g>
  <!-- scale dots: amber root, cool tones -->
  <g>
    <circle cx="92"  cy="88"  r="11" fill="#e8a33d"/>
    <circle cx="92"  cy="113" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="157" cy="113" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="126" cy="138" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="188" cy="138" r="10" fill="#e8a33d"/>
    <circle cx="157" cy="163" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="217" cy="163" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="188" cy="188" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="246" cy="188" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="217" cy="213" r="10" fill="#2c333d" stroke="#8fa3b8" stroke-width="1.4"/>
    <circle cx="272" cy="213" r="10" fill="#e8a33d"/>
  </g>
  <!-- playhead hint -->
  <line x1="126" y1="70" x2="126" y2="230" stroke="#e8a33d" stroke-width="2" opacity="0.55"/>
</svg>
