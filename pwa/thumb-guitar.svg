<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf3"/>
      <stop offset="100%" stop-color="#f0ede4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="50%" stop-color="#3d2615"/>
      <stop offset="100%" stop-color="#2e1a0c"/>
    </linearGradient>
    <linearGradient id="fret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#888"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="40%" stop-color="#fde2ee"/>
      <stop offset="70%" stop-color="#e0f4ff"/>
      <stop offset="100%" stop-color="#c8d4e6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cream paper background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Guitar neck slab, angled diagonally -->
  <g transform="translate(0 30) rotate(-12 200 150)">
    <rect x="-40" y="100" width="500" height="100" fill="url(#wood)" rx="4"/>
    <!-- Frets -->
    <g fill="url(#fret)">
      <rect x="20"  y="92" width="3" height="116"/>
      <rect x="80"  y="92" width="3" height="116"/>
      <rect x="140" y="92" width="3" height="116"/>
      <rect x="200" y="92" width="3" height="116"/>
      <rect x="260" y="92" width="3" height="116"/>
      <rect x="320" y="92" width="3" height="116"/>
      <rect x="380" y="92" width="3" height="116"/>
    </g>
    <!-- Mother-of-pearl inlays -->
    <polygon points="50,150 64,136 78,150 64,164" fill="url(#pearl)" stroke="#3a2a1a" stroke-width="0.5"/>
    <polygon points="170,150 184,136 198,150 184,164" fill="url(#pearl)" stroke="#3a2a1a" stroke-width="0.5"/>
    <polygon points="290,150 304,136 318,150 304,164" fill="url(#pearl)" stroke="#3a2a1a" stroke-width="0.5"/>
    <!-- Strings (high to low) -->
    <g stroke-linecap="round">
      <line x1="-40" y1="115" x2="460" y2="115" stroke="#e0e0e0" stroke-width="1.4"/>
      <line x1="-40" y1="130" x2="460" y2="130" stroke="#e8c590" stroke-width="2"/>
      <line x1="-40" y1="150" x2="460" y2="150" stroke="#c89a5e" stroke-width="2.4"/>
      <line x1="-40" y1="170" x2="460" y2="170" stroke="#c89a5e" stroke-width="2.8"/>
      <line x1="-40" y1="185" x2="460" y2="185" stroke="#a87840" stroke-width="3.2"/>
    </g>
    <!-- Chord-tone notes lit up -->
    <circle cx="110" cy="130" r="14" fill="#dc2626" filter="url(#glow)"/>
    <text x="110" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">R</text>

    <circle cx="170" cy="170" r="14" fill="#2563eb" filter="url(#glow)"/>
    <text x="170" y="175" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>

    <circle cx="230" cy="150" r="14" fill="#16a34a" filter="url(#glow)"/>
    <text x="230" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff">5</text>

    <circle cx="290" cy="115" r="14" fill="#d4a017" filter="url(#glow)"/>
    <text x="290" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#000">7</text>
  </g>

  <!-- Title -->
  <text x="24" y="46" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="32" font-weight="700" fill="#1a1a1a">Guitarra</text>
  <text x="24" y="68" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="13" fill="#a07820">jazz chord practice</text>
</svg>
