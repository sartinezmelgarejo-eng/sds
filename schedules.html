<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules</title>
<link rel="manifest" href="pwa/manifest-schedules.json"><meta name="theme-color" content="#06b6d4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="pwa/icon-schedules-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06090f;color:#e2e8f0;font-family:'Menlo','Courier New',monospace;padding:12px;min-height:100vh}
h1{font-size:12px;color:#06b6d4;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.sub{font-size:9px;color:#64748b;margin-bottom:10px}
.home{display:inline-block;margin-bottom:8px;color:#64748b;text-decoration:none;font-size:9px}
.home:hover{color:#06b6d4}
.wrap{overflow-x:auto;border:1px solid #1e293b;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:8px;min-width:500px}
th{color:#64748b;font-size:7px;text-transform:uppercase;letter-spacing:.5px;padding:5px 4px;border-bottom:1px solid #1e293b;text-align:center;position:sticky;top:0;background:#0a0e17}
th:first-child{text-align:right;width:40px}
td{padding:2px 3px;border-bottom:1px solid #0c1220;border-left:1px solid #0c1220;vertical-align:top;height:28px}
td:first-child{text-align:right;color:#475569;font-size:7px;border-left:none;padding-right:6px;white-space:nowrap}
.p{border-radius:3px;padding:1px 4px;font-size:7px;font-weight:700;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tg{background:#1a3a5c;color:#58a6ff}
.dt{background:#1e3a2a;color:#3fb950}
.mn{background:#3a1e2a;color:#f85149}
.today th{color:#06b6d4}
.legend{margin-top:10px;font-size:8px;color:#64748b;display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.monthly{margin-top:12px;border:1px solid #1e293b;border-radius:8px;padding:8px 10px}
.monthly h2{font-size:9px;color:#d29922;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.monthly table{min-width:auto;border:none}
.monthly td,.monthly th{border:none;border-bottom:1px solid #0c1220;height:auto;padding:3px 6px}
.my{background:#2d2a1a;color:#d29922}
@media(max-width:480px){
  body{padding:8px 4px}
  .p{font-size:6px;padding:1px 3px}
  td{height:24px}
}
</style></head><body>
<a href="index.html" class="home">< Apps</a>
<h1>Scheduled Tasks</h1>
<p class="sub">Semana tipo</p>
<div class="wrap">
<table id="grid"></table>
</div>
<div class="legend">
<span><i class="dot tg"></i> Telegram</span>
<span><i class="dot dt"></i> Datos</span>
<span><i class="dot mn"></i> Monitor</span>
<span><i class="dot my"></i> Mensual (ver abajo)</span>
</div>
<div class="monthly">
<h2>Tareas mensuales</h2>
<table>
<tr><th style="text-align:left">Tarea</th><th style="text-align:left">Dias</th><th style="text-align:left">Hora</th></tr>
<tr><td><span class="p my">fiscal</span></td><td style="color:#94a3b8">1 y 15</td><td style="color:#94a3b8">11:00</td></tr>
<tr><td><span class="p my">energy</span></td><td style="color:#94a3b8">1 y 15</td><td style="color:#94a3b8">11:30</td></tr>
<tr><td><span class="p my">trimestral</span></td><td style="color:#94a3b8">1 y 15</td><td style="color:#94a3b8">12:00</td></tr>
<tr><td><span class="p my">general</span></td><td style="color:#94a3b8">10</td><td style="color:#94a3b8">12:30</td></tr>
</table>
</div>
<script>
const D=['Lun','Mar','Mie','Jue','Vie','Sab','Dom'];
const tasks=[
{id:'datos-gob',c:'tg',d:[0,1,2,3,4,5,6],h:[6]},
{id:'scant',c:'tg',d:[0,1,2,3,4,5,6],h:[7,13,20]},
{id:'onmexico',c:'tg',d:[0,1,2,3,4,5,6],h:[10]},
{id:'dailyt',c:'tg',d:[0,1,2,3,4],h:[13]},
{id:'mananeras',c:'dt',d:[0,1,2,3,4,5,6],h:[19]},
{id:'man-datos',c:'dt',d:[1,4],h:[11]},
{id:'inegi',c:'mn',d:[0,2,4],h:[8]},
{id:'banxico',c:'mn',d:[0,2,4],h:[8]},
{id:'security',c:'mn',d:[1],h:[9]},
];
const hours=[6,7,8,9,10,11,13,19,20];
const today=(new Date().getDay()+6)%7;
const grid=document.getElementById('grid');
let hdr='<tr><th></th>';
D.forEach((d,i)=>hdr+=`<th${i===today?' class="today"':''}>${d}</th>`);
hdr+='</tr>';
const lookup={};
tasks.forEach(t=>t.d.forEach(d=>t.h.forEach(h=>{
  const k=d+'-'+h;if(!lookup[k])lookup[k]=[];lookup[k].push(t);
})));
let rows='';
hours.forEach(h=>{
  rows+=`<tr><td>${h}:00</td>`;
  for(let d=0;d<7;d++){
    const ts=lookup[d+'-'+h]||[];
    rows+='<td>'+ts.map(t=>`<span class="p ${t.c}">${t.id}</span>`).join('')+'</td>';
  }
  rows+='</tr>';
});
grid.innerHTML=hdr+rows;
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('pwa/sw.js').catch(()=>{})</script>
</body></html>
