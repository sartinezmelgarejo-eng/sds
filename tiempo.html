#timeline-view{

}

}
.tl-mapa-search{

}

}

  background: rgba(200,169,96,0.16);

}

  letter-spacing: 1px;

}

}
.tl-mapa-tag-dropdown .tlm-pick-author{

}
.tl-mapa-clear{

}
.tl-mapa-clear:hover{ color: var(--text); border-color: var(--gold); background: rgba(200,169,96,0.08); }

.tl-filter-pop{ position: relative; flex-shrink: 0; }
.tl-filter-btn{
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(200,169,96,0.3);
  border-radius: 16px;

}

.tl-filter-btn .tl-filter-caret{ font-size: 9px; opacity: 0.6; }
.tl-filter-popover{

  max-height: 62vh;

  flex-direction: column;
  background: #1a1812;
  border: 1px solid rgba(200,169,96,0.35);

}

.tl-filter-popover .tl-filter-q{

}
.tl-filter-popover .tl-filter-q::placeholder{ color: var(--text-dim); opacity: 0.6; }
.tl-filter-results{

}
.tl-filter-group-label{
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.6px;

  padding: 10px 14px 4px;
  opacity: 0.75;
}
.tl-filter-row{
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px;

}
.tl-filter-row:hover, .tl-filter-row.kbsel{ background: rgba(200,169,96,0.12); }

.tl-filter-row .pick-meta{ flex: 1; min-width: 0; }
.tl-filter-row .pick-title{
  font-family: 'Cormorant Garamond', 'Inter', serif;

.tl-filter-row .pick-sub{

.tl-filter-row .pick-check{

.tl-filter-empty{

  font-size: 11px; color: var(--text-dim);

.tl-filter-chips{ display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.tl-filter-chips .tag-chip{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  background: var(--gold);
  color: #0d0d1a;

.tl-filter-chips .tag-chip button{

.tl-mapa-view{
  display: grid;
  grid-template-columns: auto minmax(380px, 0.8fr) minmax(620px, 1.7fr);
  gap: 28px;
  height: calc(100vh - 130px);
  min-height: 640px;
  margin-top: 4px;
  
  width: min(96vw, 1680px);
  margin-left: calc(50% - min(48vw, 840px));
  margin-right: calc(50% - min(48vw, 840px));
}
.tl-mapa-view.ambos{
  grid-template-columns: auto minmax(320px, 0.85fr) minmax(560px, 1.55fr) minmax(320px, 0.85fr);
}
.tl-mapa-view{ column-gap: 28px; }
.tl-mapa-view .tl-mapa-era-rail + .tl-mapa-column,
.tl-mapa-view .tl-mapa-era-rail{  }
.tl-mapa-view > .tl-mapa-era-rail{ margin-right: -16px; }
.tl-mapa-column{
  overflow-y: auto;
  padding: 6px 12px 24px 6px;
  scrollbar-width: thin;
}

#tl-mapa-globe > svg{ position: relative; z-index: 1; }
.tl-texture path.sphere{ fill: rgba(4,10,24,.16); }
.tl-texture path.land{ fill: rgba(240,225,195,.05);
  stroke: rgba(255,246,222,.55); stroke-width: .45; }
.tl-texture path.graticule{ opacity: .3; }
.tl-mapa-globe .graticule{ fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 0.3; }
.tl-mapa-globe .land{
  fill: #b8a37d;
  stroke: #75664a;
  stroke-width: 0.45;
  transition: fill 0.5s, filter 0.5s;
}
.tl-mapa-globe .land.lit-mexico{ fill: #d4a84a; filter: drop-shadow(0 0 6px #f0c860); }
.tl-mapa-globe .land.lit-mundo{ fill: #7faed8; filter: drop-shadow(0 0 6px #a8cae8); }
.tl-mapa-globe .mx-state{
  fill: transparent;
  stroke: transparent;
  pointer-events: none;
  transition: fill 0.5s, filter 0.5s, stroke 0.5s;
}
.tl-mapa-globe .mx-state.lit-mexico{ fill: #d4a84a; filter: drop-shadow(0 0 6px #f0c860); stroke: #b88a30; stroke-width: 0.5; }
.tl-mapa-globe .mx-state.lit-mundo{ fill: #7faed8; filter: drop-shadow(0 0 6px #a8cae8); stroke: #4a78a8; stroke-width: 0.5; }
.tl-mapa-globe .pin{ cursor: pointer; transition: opacity 0.35s; }
.tl-mapa-globe .pin .needle{ stroke: rgba(15,12,8,0.95); stroke-width: 1.1; stroke-linecap: round; fill: none; }
.tl-mapa-globe .pin .ball{ stroke: rgba(15,12,8,0.85); stroke-width: 0.6; }
.tl-mapa-globe .pin.mexico .ball{ fill: #d4a84a; }
.tl-mapa-globe .pin.mundo  .ball{ fill: #7faed8; }
.tl-mapa-globe .pin{
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.tl-mapa-globe .pin-hit{
  fill: transparent;
  stroke: none;
  pointer-events: all;
  cursor: pointer;
}
.tl-mapa-globe .pin.near,
.tl-mapa-globe .pin.selected{ cursor: pointer; }
.tl-mapa-globe .pin.near:hover .ball,
.tl-mapa-globe .pin.near:hover .pin-halo{
  filter: drop-shadow(0 0 6px #f0c860) brightness(1.15);
}
.tl-mapa-globe .pin.near:hover{ opacity: 1 !important; }
.tl-mapa-globe .pin.near{
  opacity: 0.35;
  pointer-events: auto;
}
.tl-mapa-globe .pin.near.tier-1{ opacity: 0.85; }
.tl-mapa-globe .pin.near.tier-2{ opacity: 0.6; }
.tl-mapa-globe .pin.near.tier-3{ opacity: 0.35; }
.tl-mapa-globe .pin.selected{ opacity: 1; pointer-events: auto; }
.tl-mapa-globe .pin.selected .ball{ filter: drop-shadow(0 0 8px #f0c860) brightness(1.2); }
.tl-mapa-globe .pin.mundo.selected .ball{ filter: drop-shadow(0 0 8px #a8cae8) brightness(1.2); }
.tl-mapa-globe .pin-halo{
  fill: none;
  stroke: #f0c860;
  stroke-width: 1.5;
  opacity: 0;
  pointer-events: none;
}
.tl-mapa-globe .pin.mundo .pin-halo{ stroke: #a8cae8; }
.tl-mapa-globe .pin-halo.active{
  opacity: 0.7;
  animation: tlMapaPulse 2.2s ease-in-out infinite;
}
.tl-mapa-label{
  font-family: 'Cormorant Garamond', serif;

.ruta-sheet{ max-width:860px; margin:0 auto; background:var(--v2-paper); border:1px solid var(--v2-rule); border-radius:14px; padding:32px 36px 40px; color:var(--v2-ink); }
.tl-kicker{ font-family:var(--sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--v2-ink2); font-weight:600; }
/* ══════════════════════════════════════════════════════════════
   tiempo.html · refinamientos sobre la línea del tiempo de la v1
   (misma escena: estrellas, globo, cabezas, banda; tipografía y
   cromo en la familia v2 · noche, acentos de latón)
   ══════════════════════════════════════════════════════════════ */
:root{ --gold:#C9A260; --gold-dim:#8C7244; --brass:#C49A5A; --ink:#EDE3D2; --ink2:#A8987F; }

/* ── Tipografía de la interfaz: Inter con cifras tabulares (fuera monoespaciadas) ── */
.cita-thumb-badge, .ruta2-year, .tl-event-date, .tl-filter-btn, .tl-filter-chips .tag-chip,
.tl-filter-empty, .tl-filter-group-label, .tl-filter-popover .tl-filter-q, .tl-filter-row .pick-check,
.tl-mapa-cita-thumb.placeholder, .tl-mapa-citas-toggle, .tl-mapa-clear, .tl-mapa-column-header,
.tl-mapa-counter, .tl-mapa-era-inception-years, .tl-mapa-era-years, .tl-mapa-floating-cita-attr,
.tl-mapa-nav--speed, .tl-mapa-search, .tlm-card-era, .tlm-card-place, .tlm-chip, .tlm-cita-meta,
.tlm-deck-meta, .tlm-lcd-brand, .tlp-tick-y, .tlm-search, .tlm-card-year{
  font-family: var(--sans) !important; font-variant-numeric: tabular-nums lining-nums; }
/* Rótulos: versalitas consistentes */
.tl-kicker, .tl-filter-btn, .tl-mapa-clear, .tl-filter-group-label, .tlp-ticker-label, .tlp-counts,
.tl-mapa-citas-toggle, .tlm-card-era, .tlm-chip, .tl-mapa-era-inception-years, .tlp-azar-k > span,
.tlp-shuffle span, .tlp-azar-dado span, .tl-ruta-banner-btn span{
  font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
.tl-ic{ width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.tl-cc{ display: inline-block; font-family: var(--sans); font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
  padding: 1px 4px; border-radius: 3px; border: 1px solid currentColor; opacity: .8; line-height: 1.3; }

/* ══════════ PORTADA ══════════ */
@media (min-width: 769px){
  .tl-portada-mode .tl-mapa-view.tlp-view{ height: calc(100vh - var(--bar-h)); min-height: 620px; }
  body.tl-en-portada{ overflow: hidden; }
  body.tl-en-portada .tt-bar{ background: rgba(6,6,11,.55); border-bottom-color: rgba(196,154,90,.10); }
}
/* Hoy en la historia */
.tlp-ticker{ padding: 8px 0 9px; border-bottom-color: rgba(196,154,90,.16); background: linear-gradient(180deg, rgba(5,5,10,.55), transparent); }
.tlp-ticker-label{ color: var(--brass); padding-left: 22px; display: flex; flex-direction: column; gap: 2px; line-height: 1.1; }
.tlp-ticker-label span{ font-weight: 500; letter-spacing: .08em; text-transform: none; font-size: 11px; color: var(--ink2); }
.tlp-tick-item{ font-family: var(--serif); font-size: 16.5px; color: #e6dcc8; gap: 10px; padding: 3px 6px; border-radius: 6px; transition: color .2s, background .2s; }
.tlp-tick-item:hover, .tlp-tick-item:focus-visible{ color: #fff3d6; background: rgba(196,154,90,.12); }
.tlp-tick-y{ font-size: 11.5px !important; font-weight: 600; letter-spacing: .04em; color: var(--brass); }
.tlp-tick-sep{ width: 4px; height: 4px; border-radius: 50%; background: rgba(196,154,90,.45); }
.tlp-ticker-track{ animation-duration: 170s; }
/* Buscador + conteos */
.tlp-top{ top: 62px; }
.tl-portada-mode .tl-mapa-filter-bar{ border-color: rgba(196,154,90,.30); }
.tl-portada-mode .tl-mapa-search{ font-family: var(--serif) !important; font-size: 18px; }
.tl-portada-mode .tl-filter-btn{ font-size: 10.5px; color: var(--ink2); }
.tlp-counts{ margin-top: 10px; color: rgba(237,227,210,.78); font-weight: 500; }
.tlp-counts-link{ letter-spacing: inherit; text-transform: inherit; font-weight: inherit; }
.tlp-hint{ margin-top: 5px; font-family: var(--serif); font-style: italic; font-size: 14.5px; color: rgba(237,227,210,.58); text-shadow: 0 1px 8px rgba(0,0,0,.9); }
.tlp-shuffle{ display: inline-flex; align-items: center; gap: 7px; top: 62px; right: 22px; border-radius: 999px;
  border-color: rgba(196,154,90,.28); color: var(--ink2); padding: 6px 13px 6px 10px; background: rgba(8,8,14,.4); }
.tlp-shuffle .tl-ic{ width: 15px; height: 15px; }
.tlp-shuffle:hover{ color: var(--brass); border-color: var(--brass); }
/* Cabezas: aro nítido, nombre legible */
.tlp-bubble-ic, .tlp-bubble-cover{ border: 1.5px solid rgba(196,154,90,.55);
  box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 0 0 3px rgba(8,8,14,.55), 0 0 18px rgba(196,154,90,.14); }
.tlp-bubble-aut .tlp-bubble-ic, .tlp-bubble-aut .tlp-bubble-cover{ border-color: rgba(216,160,110,.6); }
.tlp-bubble-cover img{ image-rendering: auto; }
.tlp-orbits{ contain: layout style; }
.tlp-orbits .tlp-bubble{ will-change: transform, opacity; }
.tlp-orbits .tlp-bubble-n{ font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .12em;
  color: #efe6d4; background: rgba(9,8,7,.74); border: 1px solid rgba(196,154,90,.22); padding: 3px 9px 4px;
  border-radius: 999px; top: calc(100% + 8px); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.tlp-orbits .tlp-bubble-near .tlp-bubble-n{ opacity: .9; }
.tlp-orbits .tlp-bubble:hover .tlp-bubble-n, .tlp-orbits .tlp-bubble:focus-visible .tlp-bubble-n{ opacity: 1; border-color: var(--brass); color: #fff4dc; }
.tlp-bubble-aut .tlp-bubble-n{ border-color: rgba(216,160,110,.3); }
.tlp-bubble:focus-visible{ outline: none; }
.tlp-bubble:focus-visible .tlp-bubble-cover, .tlp-bubble:focus-visible .tlp-bubble-ic{ border-color: var(--brass); box-shadow: 0 0 0 3px rgba(196,154,90,.45); }
/* Portadas que rotan */
.tlp-cover{ outline: 1px solid rgba(196,154,90,0); outline-offset: 3px; transition: transform .3s, opacity .45s ease, outline-color .3s; }
.tlp-cover:hover, .tlp-cover:focus-visible{ outline-color: rgba(196,154,90,.7); }
/* Nube de términos */
.tlp-term{ font-family: var(--serif); color: #e6dcc8; border-bottom-color: rgba(196,154,90,.28); }
.tlp-term:hover, .tlp-term:focus-visible{ color: #fff0cf; border-color: var(--brass); text-shadow: 0 0 14px rgba(196,154,90,.45); }
/* Sorpréndeme */
.tlp-zone-azar{ right: 2.6%; bottom: 12.5%; width: 23.5%; z-index: 6; }
.tlp-zone-terms{ top: 53.5%; }
.tlp-azar-k{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.tlp-azar-k > span{ color: var(--brass); font-size: 10px; }
.tlp-azar-dado{ display: inline-flex; align-items: center; gap: 6px; background: rgba(196,154,90,.10); color: #f0dfb8;
  border: 1px solid rgba(196,154,90,.45); border-radius: 999px; padding: 4px 11px 4px 8px; cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
.tlp-azar-dado span{ font-size: 10px; letter-spacing: .14em; }
.tlp-azar-dado .tl-ic{ width: 15px; height: 15px; }
.tlp-azar-dado:hover{ background: rgba(196,154,90,.22); border-color: var(--brass); transform: rotate(-2deg); }
.tlp-azar{ display: block; width: 100%; text-align: left; cursor: pointer; color: #efe6d2;
  background: linear-gradient(90deg, rgba(14,12,18,.72), rgba(14,12,18,.30)); border: 0; border-left: 2px solid var(--brass);
  border-radius: 0 10px 10px 0; padding: 9px 14px 10px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: opacity .6s ease, transform .6s ease, background .25s; }
.tlp-azar.fuera{ opacity: 0; transform: translateY(6px); }
.tlp-azar:hover{ background: linear-gradient(90deg, rgba(40,30,18,.8), rgba(20,16,14,.4)); }
.tlp-azar-y{ display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .06em; color: var(--ink2); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tlp-azar-t{ display: block; font-family: var(--serif); font-size: 19px; line-height: 1.18; }
/* Lugares sobre el globo */
.tlp-lugar{ cursor: pointer; }
.tlp-lugar-hit{ fill: transparent; }
.tlp-lugar-dot{ fill: #ffe3a6; stroke: rgba(30,20,8,.7); stroke-width: .8; transition: r .2s; }
.tlp-lugar-halo{ fill: rgba(255,214,140,.12); stroke: rgba(255,214,140,.55); stroke-width: .8;
  transform-box: fill-box; transform-origin: center; animation: tlpLatido 5.5s ease-in-out infinite; }
.tlp-lugar:hover .tlp-lugar-halo, .tlp-lugar:focus .tlp-lugar-halo{ fill: rgba(255,214,140,.32); stroke: #ffe3a6; animation-play-state: paused; }
.tlp-lugar:focus{ outline: none; }
@keyframes tlpLatido{ 0%,100%{ transform: scale(.8); opacity: .55; } 50%{ transform: scale(1.18); opacity: 1; } }
.tlp-pais-tip{ font-family: var(--sans); font-size: 12px; background: rgba(12,10,8,.88); border-color: rgba(196,154,90,.45); color: #efe6d2; }
.tlp-pais-tip b{ font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .02em; }
/* Banda tipo Star Wars: más grande, más lenta, legible */
.tlp-zone-crawl{ width: min(920px, 60%); height: 50%; bottom: 7%; perspective: 430px; perspective-origin: 50% -14%; }
.tlp-crawl-plane{ transform: rotateX(44deg); }
.tlp-crawl-belt{ gap: 20px; }
.tlp-crawl-covs img{ width: 58px !important; height: 87px !important; }
.tlp-crawl-item-t{ font-size: 22px; font-weight: 600; color: #20170a; background: #efe0b4; border-color: #a98648; padding: 4px 18px 5px; letter-spacing: .02em; }
.tlp-crawl-meta{ font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #6b5427; }
.tlp-crawl-item:hover .tlp-crawl-item-t, .tlp-crawl-item:focus-visible .tlp-crawl-item-t{ background: #fff1c8; border-color: var(--brass); box-shadow: 0 0 0 2px rgba(196,154,90,.55), 0 6px 18px rgba(0,0,0,.5); }
.tlp-crawl-item:hover .tlp-crawl-covs{ box-shadow: 0 6px 22px rgba(0,0,0,.5), 0 0 0 2px rgba(196,154,90,.6); }
.tlp-crawl-belt.pausa{ animation-play-state: paused !important; }
/* Barra de épocas: nombre corto + año de inicio, nada truncado */
.tlp-rail{ padding: 0 14px; background: linear-gradient(180deg, transparent, rgba(5,5,10,.78)); border-top-color: rgba(196,154,90,.18); }
.tlp-seg{ flex: 1 1 auto; padding: 7px 3px 9px; border-top-width: 3px; gap: 2px; border-radius: 0 0 6px 6px; position: relative; }
.tlp-seg-n{ font-family: var(--sans); font-size: 10.5px; font-weight: 500; letter-spacing: .01em; color: #e3d9c6;
  -webkit-line-clamp: unset; display: block; overflow: visible; white-space: normal; text-wrap: balance; }
.tlp-seg-y{ font-family: var(--sans); font-size: 10px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.tlp-seg:hover, .tlp-seg:focus-visible, .tlp-seg.on{ background: color-mix(in srgb, var(--ac) 22%, transparent); transform: translateY(-3px); }
.tlp-seg:hover .tlp-seg-n, .tlp-seg.on .tlp-seg-n{ color: #fff; }
.tlp-seg.on{ border-top-width: 5px; box-shadow: 0 -10px 22px -10px var(--ac); }
.tlp-rail-explore{ font-family: var(--serif); font-size: 16px; color: #f0d79a; border-bottom-color: rgba(196,154,90,.6); margin-left: 14px; }
/* Tooltip propio para todas las puertas */
.tlp-tip{ position: fixed; z-index: 90; pointer-events: none; max-width: 300px; padding: 8px 12px 9px;
  background: rgba(14,11,8,.94); border: 1px solid rgba(196,154,90,.45); border-radius: 8px; color: #efe6d2;
  box-shadow: 0 12px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
.tlp-tip.show{ opacity: 1; transform: translateY(0); }
.tlp-tip b{ display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; }
.tlp-tip span{ display: block; font-family: var(--sans); font-size: 12px; line-height: 1.4; color: #cfc3ad; margin-top: 3px; }
.tlp-tip em{ display: block; font-style: normal; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin-top: 6px; }

/* ══════════ VISTA DE EVENTOS ══════════ */
.tl-mapa-view{ height: calc(100vh - var(--bar-h) - 70px); }
.view-transition > .tl-mapa-filter-bar{ padding-top: 14px; }
.tl-mapa-search{ font-size: 13.5px !important; }
.tl-filter-btn{ display: inline-flex; align-items: center; gap: 6px; }
.tl-filter-chips .tag-chip{ font-size: 11.5px; letter-spacing: .02em; }
.tl-filter-chips .tag-chip .tl-ic{ width: 13px; height: 13px; margin-right: 3px; }
.tl-filter-chips .tag-chip.kind-lugar{ display: inline-flex; align-items: center; }
/* Riel de épocas con nombres */
.tl-mapa-era-rail{ width: 112px; padding: 10px 4px 10px 0; gap: 3px; }
.tl-mapa-view > .tl-mapa-era-rail{ margin-right: -10px; }
.tl-mapa-era-pill{ width: 100% !important; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  text-align: left; padding: 2px 6px 2px 9px; min-height: 0; background: transparent; border-left: 3px solid var(--era-color);
  border-radius: 0 6px 6px 0; opacity: .62; color: #ddd3bf; overflow: hidden; }
.tl-mapa-era-pill::before, .tl-mapa-era-pill::after{ display: none !important; }
.tl-mapa-era-pill:hover{ opacity: 1; background: color-mix(in srgb, var(--era-color) 14%, transparent); }
.tl-mapa-era-pill.active{ opacity: 1; box-shadow: none; border-left-width: 5px; background: color-mix(in srgb, var(--era-color) 26%, transparent); color: #fff; }
.tl-rail-n{ font-family: var(--sans); font-size: 10.5px; font-weight: 600; line-height: 1.12; letter-spacing: .01em; }
.tl-rail-y{ font-family: var(--sans); font-size: 9.5px; color: var(--ink2); font-variant-numeric: tabular-nums; margin-top: 1px; }
.tl-mapa-era-pill.active .tl-rail-y{ color: #e8dcc2; }
.tl-mapa-era-inception-title{ font-family: var(--sans) !important; font-size: 11px !important; font-weight: 700 !important; letter-spacing: .16em !important; }
/* Encabezado metálico: la fecha arriba del día; el título nunca se corta */
.tl-mapa-loc{ min-height: 72px; padding: 12px 26px !important; align-items: center; }
.tl-mapa-loc-year{ display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tl-mapa-loc-year .tl-fy{ font-size: 32px; line-height: .95; }
.tl-mapa-loc-year.tl-fy-largo .tl-fy{ font-size: 22px; }
.tl-mapa-loc-year .tl-fdm{ font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .82; }
.tl-mapa-loc-name{ display: block !important; -webkit-line-clamp: unset !important; overflow: visible !important; text-overflow: clip !important;
  text-wrap: balance; line-height: 1.12 !important; padding-top: 2px; padding-bottom: 2px; }
.tl-mapa-loc-name[data-len="m"]{ font-size: 20px !important; letter-spacing: 1.1px; }
.tl-mapa-loc-name[data-len="l"]{ font-size: 17px !important; letter-spacing: .8px; }
.tl-mapa-loc-name[data-len="xl"]{ font-size: 14.5px !important; letter-spacing: .5px; line-height: 1.18 !important; }
/* Texto del evento: jerarquía limpia, plegable */
.tl-mapa-floating-detalle{ width: clamp(320px, 37%, 470px); max-height: 46%; overflow: auto; padding: 18px 22px 16px; scrollbar-width: thin; }
.tl-mapa-floating-detalle .tl-mapa-detalle-body{ font-family: var(--serif) !important; font-size: 18.5px !important; line-height: 1.42 !important; color: #ece3cf !important; }
.tl-mapa-floating-detalle .tl-mapa-detalle-body .detalle-lead{ font-weight: 600; color: #fff8e6; }
.tl-mapa-floating-detalle .tl-mapa-detalle-body.solo-lead .detalle-lead{ font-weight: 500; }
.tl-mapa-floating-detalle .tl-mapa-detalle-body::first-letter{ font-family: var(--serif) !important; font-size: 2.7em !important; font-weight: 600 !important; color: var(--gold) !important; margin: 3px 7px -2px 0 !important; }
.tl-det-fold{ position: sticky; float: right; top: 0; margin: -8px -12px 0 8px; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: rgba(196,154,90,.12); border: 1px solid rgba(196,154,90,.35);
  color: #e8d6a8; cursor: pointer; z-index: 2; }
#tl-mapa-globe .tl-det-fold .tl-ic{ width: 14px; height: 14px; transition: transform .25s; cursor: pointer; }
.tl-det-fold:hover{ background: rgba(196,154,90,.25); }
.tl-mapa-floating-detalle.plegado{ max-height: 92px; overflow: hidden; }
.tl-mapa-floating-detalle.plegado .tl-mapa-detalle-body{ display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-mapa-floating-detalle.plegado .tl-mapa-detalle-body::first-letter{ font-size: 1em !important; float: none; margin: 0 !important; }
#tl-mapa-globe .tl-mapa-floating-detalle.plegado .tl-det-fold .tl-ic{ transform: rotate(180deg); }
/* Citas */
.tl-mapa-floating-cita-text{ font-family: var(--serif) !important; }
.tl-mapa-floating-cita-attr{ font-size: 10px !important; letter-spacing: .1em !important; }
.tl-mapa-citas-toggle{ border-radius: 999px !important; padding: 6px 14px !important; background: rgba(14,11,8,.82) !important;
  color: #f0dfb8 !important; border: 1px solid rgba(196,154,90,.5) !important; font-size: 10px !important; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.tl-mapa-citas-toggle:hover{ border-color: var(--brass) !important; background: rgba(40,30,18,.9) !important; }
.tl-mapa-citas-toggle.off{ background: var(--brass) !important; color: #1a130b !important; }
.tl-mapa-citas-toggle[hidden]{ display: none !important; }
/* Controles */
.tl-mapa-nav{ display: inline-flex !important; align-items: center; justify-content: center; }
.tl-mapa-nav .tl-ic{ width: 18px; height: 18px; }
.tl-mapa-nav--play .tl-ic{ width: 17px; height: 17px; }
.tl-mapa-counter{ font-size: 12px !important; letter-spacing: .06em !important; color: var(--ink2) !important; }
.tl-mapa-nav--speed{ font-size: 12px !important; font-weight: 600 !important; }
/* Recorrido activo: rótulo, título a todo lo ancho, luego datos y botones */
.tl-ruta-banner{ padding: 10px 12px 10px; background: rgba(14,11,8,.9); border-color: rgba(196,154,90,.4); }
.tl-ruta-banner-top{ display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "k b1 b2" "t t t" "m m m"; gap: 2px 6px; align-items: center; }
.tl-ruta-banner-top .tl-kicker{ grid-area: k; }
.tl-ruta-banner-top .tl-ruta-banner-t{ grid-area: t; line-height: 1.15; margin-top: 2px; }
.tl-ruta-banner-top .tl-ruta-banner-m{ grid-area: m; font-family: var(--sans); font-size: 11px; letter-spacing: .04em; }
.tl-ruta-banner-top [data-ruta-libros]{ grid-area: b1; }
.tl-ruta-banner-top [data-ruta-exit]{ grid-area: b2; }
.tl-ruta-chip{ font-family: var(--sans); }
.tl-filter-chips .tag-chip.kind-ruta{ background: var(--brass); color: #1a130b; }
.tl-ruta-banner .tl-kicker{ color: var(--brass); font-size: 9.5px; }
.tl-ruta-banner-t{ font-family: var(--serif); font-size: 19px; }
.tl-ruta-banner-btn{ display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; }
.tl-ruta-banner-btn .tl-ic{ width: 14px; height: 14px; }
.tl-ruta-banner-btn span{ font-size: 9.5px; }
/* Panel de recorrido (lista de libros) */
.ruta-sheet .ruta-header h2{ font-family: var(--serif); font-weight: 500; font-size: 38px; color: var(--ink); margin: 6px 0 8px; }
.ruta-sheet .back-btn{ margin-bottom: 22px; color: var(--ink2); border-color: var(--v2-rule); }
.ruta-sheet .ruta2-card{ text-decoration: none; color: inherit; display: flex; }
.ruta-sheet .ruta2-next-chip{ text-decoration: none; }

/* ══════════ MÓVIL ══════════ */
.tt-nav .short{ display: none; }
@media (max-width: 768px){
  :root{ --bar-h: 50px; }
  .tt-bar{ padding: 0 12px; gap: 10px; }
  .tt-brand b{ font-size: 20px; }
  .tt-brand small{ display: none; }
  .tt-nav{ gap: 2px; }

      var anyVisible = false;

  // Escape user-authored strings before injection into innerHTML.

  // ── Render mapa view as a FLAT chronological column. Events flow strictly

          if (!seenEras[key]) {

              '<div class="tl-mapa-era-inception" style="--era-color:' + color + '">' +
                '<div class="tl-mapa-era-inception-title">' + ev._era.label + '</div>' +
                '<div class="tl-mapa-era-inception-years">' + (ev._era.years || '') + '</div>' +

      orbsHTML = '<div class="tlp-orbits tlp-orbits-all">' + orbsAll + '</div>';


      // ── Libros: 3 portadas en triángulo (dos derecha, una izquierda) ──
      var libPool = Object.keys(citasPorLibro).map(function(id){ return { b: bookById[id], n: citasPorLibro[id] }; })
        .filter(function(x){ return x.b && x.n >= 10 && (x.b.coverUrl || (x.b.coverId && typeof coverImages !== 'undefined' && coverImages[x.b.coverId])); })
        .sort(function(a, b){ return b.n - a.n; });
      // 4 portadas visibles SIN encimarse; el resto del pool rota con fundido
      // (cada ~14s sale una y entra otra — el orden diario ya viene sembrado).
      var LIB_SLOTS = [[50,1,-4],[0,34,3],[44,62,-3]];
      var libShown = tlShufflePick(libPool, libPool.length, rnd);
      window.__tlpLibPool = libShown;
      var libHTML = libShown.slice(0, 3).map(function(x, i){
        var sl = LIB_SLOTS[i % LIB_SLOTS.length];
        return '<button class="tlp-cover" type="button" data-door="libro" data-id="' + esc(x.b.id) + '" data-slot="' + i + '" ' +
          'title="' + esc(x.b.title) + ' — ' + x.n + ' citas" style="left:' + sl[0] + '%; top:' + sl[1] + '%; --rot:' + sl[2] + 'deg; --dly:' + (i * 0.9).toFixed(1) + 's">' +
          getCoverHTML(x.b, 'small') + '</button>';
      }).join('');

      // ── Épocas: eje de tiempo horizontal (cada era un segmento de su color) ──
      var erasHTML = eraPills.map(function(p, i){
        var short = tlEraShort(p.label);
        return '<button class="tlp-seg" type="button" data-door="era" data-first="' + p.firstIdx + '" data-era="' + (allEvents[p.firstIdx] ? allEvents[p.firstIdx]._srcEra : 0) + '" style="--ac:' + p.color + '" title="' + esc(p.label) + ' · ' + esc(p.years) + '">' +
          '<span class="tlp-seg-n">' + esc(short) + '</span><span class="tlp-seg-y">' + esc(tlEraStart(p.years)) + '</span></button>';
      }).join('');

      // ── Recorridos: 2 barras grandes + lista completa en overlay ──
      function rutaBar(r, nEv) {
        var dots = r.steps.map(function(s){
          var c = rutaEraChip(s.bookId);
          return '<span class="tlp-dot" style="--ac:' + (c ? c.color : 'rgba(200,169,96,.25)') + '"></span>';
        }).join('');
        // Collage de las portadas de la ruta a la derecha del banner
        var covers = r.steps.map(function(s){ return bookById[s.bookId]; })
          .filter(function(b){ return b && (b.coverUrl || (b.coverId && typeof coverImages !== 'undefined' && coverImages[b.coverId])); })
          .slice(0, 4);
        var covHTML = covers.length ? '<span class="tlp-bar-covers">' + covers.map(function(b, i){
          return '<span class="tlp-bar-cov" style="--i:' + i + '">' + getCoverHTML(b, 'tiny') + '</span>';
        }).join('') + '</span>' : '';
        return '<button class="tlp-bar" type="button" data-door="ruta" data-id="' + esc(r.id) + '" title="' + esc(r.desc) + '">' +
          covHTML +
          '<span class="tlp-bar-body"><span class="tlp-bar-t">' + esc(r.title) + '</span>' +
          '<span class="tlp-bar-meta"><span class="tlp-dots">' + dots + '</span>' + r.steps.length + ' libros · ' + nEv + ' eventos</span></span>' +
        '</button>';
      }
      var rutaInfos = rutas.map(function(r){
        var nEv = 0;
        r.steps.forEach(function(s){ nEv += citasPorLibro[s.bookId] || 0; });
        return { r: r, nEv: nEv };
      }).filter(function(x){ return x.nEv > 0; });
      var rutasHTML = '', crawlHTML = '';
      if (rutaInfos.length) {
        rutasHTML = tlShufflePick(rutaInfos, 2, rnd).map(function(x){ return rutaBar(x.r, x.nEv); }).join('') +
          '<button class="tlp-mini2" type="button" data-door="rutas-todas">ver los ' + rutaInfos.length + ' recorridos</button>' +
          '<div class="tlp-rutas-all">' + rutaInfos.map(function(x){ return rutaBar(x.r, x.nEv); }).join('') + '</div>';
        // Crawl: cada recorrido es un banner de sus portadas con el título
        // encima; la banda va duplicada para el loop sin costura.
        var crawlList = tlShufflePick(rutaInfos, rutaInfos.length, rnd);
        var beltItems = crawlList.map(function(x){
          var covs = x.r.steps.map(function(st){ return bookById[st.bookId]; })
            .filter(function(b){ return b && (b.coverUrl || (b.coverId && typeof coverImages !== 'undefined' && coverImages[b.coverId])); });
          if (!covs.length) return '';
          return '<button class="tlp-crawl-item" type="button" data-door="ruta" data-id="' + esc(x.r.id) + '" title="' + esc(x.r.desc || x.r.title) + '">' +
            '<span class="tlp-crawl-item-t">' + esc(x.r.title) + '<span class="tlp-crawl-meta">' + x.r.steps.length + ' libros · ' + x.nEv + ' eventos</span></span>' +
            '<span class="tlp-crawl-covs">' + covs.map(function(b){ return getCoverHTML(b, 'shelf'); }).join('') + '</span>' +
          '</button>';
        }).join('');
        crawlHTML = '<div class="tlp-crawl-plane"><div class="tlp-crawl-belt" style="--beltdur:' + (crawlList.length * 27) + 's">' + beltItems + beltItems + '</div></div>';
      }

      // ── Términos: más cantidad y más aire ──
      var terms = (typeof tlTerminos !== 'undefined' && tlTerminos.length) ? tlShufflePick(tlTerminos, 10, rnd) : [];
      var termsHTML = terms.map(function(t){
        var fs = (13.5 + Math.min(5.5, t.menciones / 40)).toFixed(1);
        return '<button class="tlp-term" type="button" data-door="q" data-q="' + esc(t.termino) + '" title="' + t.menciones + ' menciones" style="font-size:' + fs + 'px">' + esc(t.termino) + '</button>';
      }).join('');
      if (termsHTML) termsHTML = '<div class="tlp-terms-label" aria-hidden="true"></div>' + termsHTML;

      // ── Sorpréndeme: un evento destacado que rota solo; el dado salta a uno al azar ──
      var azar = tlShufflePick(TD.idx.destacados || [], 24, rnd);
      window.__tlpAzar = azar;
      var azarHTML = '';
      if (azar.length) {
        var a0 = azar[0];
        azarHTML = '<div class="tlp-zone tlp-zone-azar">' +
          '<div class="tlp-azar-k"><span>Un evento al azar</span>' +
            '<button class="tlp-azar-dado" type="button" data-door="sorpresa" title="Sorpréndeme: abre un evento cualquiera">' + TL_IC.azar + '<span>Sorpréndeme</span></button></div>' +
          '<button class="tlp-azar" type="button" data-door="evento" data-ev="' + a0[0] + '-' + a0[1] + '" title="Abrir este evento">' +
            '<span class="tlp-azar-y">' + esc(tlFechaTexto(a0[2])) + (a0[4] ? ' · ' + esc(a0[4]) : '') + '</span>' +
            '<span class="tlp-azar-t">' + esc(a0[3]) + '</span></button>' +
        '</div>';
      }

      return '<div class="tl-portada tlp-dash">' +
        '<div class="tlp-cielo" aria-hidden="true"><i></i><i></i><i></i></div>' +
        '<div class="tlp-stars" style="box-shadow:' + shadows.join(',') + ';"></div>' +
        '<svg class="tlp-arc" aria-hidden="true"></svg>' +
        '<div class="tlp-pais-tip"></div>' +
        '<div class="tlp-stage"></div>' +
        tickerHTML +
        '<div class="tlp-top">' +
          '<div class="tlp-search-slot"></div>' +
          '<div class="tlp-counts">' + totalAll.toLocaleString('es-MX') + ' eventos · <button class="tlp-counts-link" type="button" data-door="rutas-todas">' + rutas.length + ' recorridos</button> · ' + Object.keys(citasPorLibro).length + ' libros</div>' +
          '<div class="tlp-hint">Arrastra el globo · toca una ciudad o un país</div>' +
        '</div>' +
        '<button class="tlp-shuffle" type="button" data-door="shuffle" title="Barajar otra portada: otras caras, libros y palabras">' + TL_IC.rehacer + '<span>Barajar</span></button>' +
        orbsHTML +
        (libHTML ? '<div class="tlp-zone tlp-zone-lib">' + libHTML + '</div>' : '') +
        (crawlHTML ? '<div class="tlp-zone tlp-zone-crawl">' + crawlHTML + '</div>' : '') +
        (rutasHTML ? '<div class="tlp-zone tlp-zone-rutas">' + rutasHTML + '</div>' : '') +
        (termsHTML ? '<div class="tlp-zone tlp-zone-terms">' + termsHTML + '</div>' : '') +
        azarHTML +
        '<div class="tlp-rail">' + erasHTML +
          '<button class="tlp-rail-explore" type="button" data-door="explorar">Explorar todo el tiempo →</button></div>' +
      '</div>';
    }

    // Banner del recorrido activo (guía por libros sobre la columna).
    function buildRutaBanner(allEvents) {
      var ruta = rutas.find(function(r){ return r.id === tlRuta; });
      if (!ruta) return '';
      var firstByLibro = {}, cntByLibro = {};
      allEvents.forEach(function(ev){
        (ev.citas || []).forEach(function(c){
          if (!c.libro) return;
          if (firstByLibro[c.libro] == null || ev._idx < firstByLibro[c.libro]) firstByLibro[c.libro] = ev._idx;
          cntByLibro[c.libro] = (cntByLibro[c.libro] || 0) + 1;
        });
      });
      var chips = ruta.steps.map(function(s, i){
        var bk = books.find(function(b){ return b.id === s.bookId; });
        var n = cntByLibro[s.bookId] || 0;
        var first = firstByLibro[s.bookId];
        return '<button type="button" class="tl-ruta-chip' + (n ? '' : ' off') + '" data-rbook="' + esc(s.bookId) + '" ' +
          'data-first="' + (first != null ? first : '') + '" data-reason="' + esc(s.reason || '') + '" ' +
          'title="' + esc(bk ? bk.title : s.bookId) + '">' +
          '<span class="tl-ruta-chip-n">' + (i + 1) + '</span>' +
          '<span class="tl-ruta-chip-t">' + esc(bk ? bk.title : s.bookId) + '</span>' +
          (n ? '<span class="tl-ruta-chip-c">' + n + '</span>' : '') +
        '</button>';
      }).join('');
      return '<div class="tl-ruta-banner">' +
        '<div class="tl-ruta-banner-top">' +
          '<span class="tl-kicker">Recorrido</span>' +
          '<span class="tl-ruta-banner-t">' + esc(ruta.title) + '</span>' +
          '<span class="tl-ruta-banner-m">' + allEvents.length + ' eventos · ' + ruta.steps.length + ' libros</span>' +
          '<button type="button" class="tl-ruta-banner-btn" data-ruta-libros="1" title="Ver el recorrido como lista de libros">' + TL_IC.libros + '<span>Libros</span></button>' +
          '<button type="button" class="tl-ruta-banner-btn" data-ruta-exit="1" title="Salir del recorrido y volver a la portada">' + TL_IC.cerrar + '<span>Salir</span></button>' +
        '</div>' +
        '<div class="tl-ruta-banner-chips">' + chips + '</div>' +
        '<div class="tl-ruta-reason"></div>' +
      '</div>';
    }

    var portadaHTML = portadaOn ? buildPortada(allEvents, eraPills, totalAll) : '';
    var rutaBannerHTML = (!portadaOn && tlRuta) ? buildRutaBanner(allEvents) : '';

    // Portada = dashboard: el globo va DENTRO del dash (reparented a .tlp-stage),
    // sin columna ni rail. Solo al salir de la portada existe la columna de eventos.
    var bodyHTML = portadaOn
      ? '<div class="tl-mapa-view tlp-view">' + portadaHTML + buildGlobeBlock(allEvents.length) + '</div>' + notice
      : '<div class="tl-mapa-view">' +
          railHTML +
          '<div class="tl-mapa-column">' +
            rutaBannerHTML + '<div class="tl-mapa-events">' + columnHTML + '</div>' +
          '</div>' +
          buildGlobeBlock(allEvents.length) +
        '</div>' + notice;

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
    // Bandera emoji desde el código ISO-2 (MX→🇲🇽); fallback si no es par de letras
    function paisFlag(cc) {
      cc = String(cc || '').toUpperCase();
      return '<span class="tl-cc">' + (/^[A-Z]{2}$/.test(cc) ? cc : '··') + '</span>';
    }
    function tagLabel(v, kind) {
      if (kind === 'paises') return tlPaisLabel(v);
      if (kind === 'autores') return v;
      if (kind === 'fuentes') return v === 'inehrm' ? 'INEHRM' : v;
      return tlBookLabel(v);
    }
    function renderChips(set, kind) {
      return Array.from(set).map(function(v) {
        var flag = kind === 'paises' ? '<span class="chip-flag">' + paisFlag(v) + '</span>' : '';
        return '<span class="tag-chip kind-' + kind + '" data-kind="' + kind + '" data-val="' + esc(v) + '" title="' + esc(v) + '">' +
          flag + esc(tagLabel(v, kind)) + '<button type="button" aria-label="quitar">×</button></span>';
      }).join('');
    }
    var filterEmpty = filterIsEmpty(tlFilter);
    var activeCount = tlFilter.libros.size + tlFilter.paises.size + tlFilter.autores.size + (tlFilter.fuentes ? tlFilter.fuentes.size : 0) + (tlFilter.lugar ? 1 : 0);
    function rutaChipHTML() {
      var rr = tlRuta && rutas.find(function(r){ return r.id === tlRuta; });
      return rr ? '<span class="tag-chip kind-ruta" data-kind="ruta" data-val="' + esc(rr.id) + '" title="Salir del recorrido">Recorrido · ' + esc(rr.title) +
        '<button type="button" aria-label="salir del recorrido">×</button></span>' : '';
    }
    function lugarChipHTML() {
      return tlFilter.lugar ? '<span class="tag-chip kind-lugar" data-kind="lugar" data-val="' + esc(tlFilter.lugar.s) + '" title="Eventos en ' + esc(tlFilter.lugar.n) + ' y alrededores">' +
        TL_IC.pin + 'Cerca de ' + esc(tlFilter.lugar.n) + '<button type="button" aria-label="quitar">×</button></span>' : '';
    }
    var filterBarHTML =
      '<div class="tl-mapa-filter-bar">' +
        '<input class="tl-mapa-search" type="text" id="tl-mapa-q" ' +
          'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
          'placeholder="Buscar eventos…" value="' + esc(tlFilter.q) + '">' +
        '<div class="tl-filter-pop" id="tl-filter-pop">' +
          '<button class="tl-filter-btn" id="tl-filter-btn" type="button">Filtro' +
            '<span class="tl-filter-count">' + (activeCount || '') + '</span>' +
            '<span class="tl-filter-caret">▾</span>' +
          '</button>' +
          '<div class="tl-filter-popover" id="tl-filter-popover">' +
            '<input class="tl-filter-q" type="text" id="tl-filter-q" ' +
              'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
              'placeholder="Libro, país o autor…">' +
            '<div class="tl-filter-results" id="tl-filter-results"></div>' +
          '</div>' +
        '</div>' +
        '<div class="tl-filter-chips">' +
          lugarChipHTML() +
          renderChips(tlFilter.fuentes || new Set(), 'fuentes') +
          renderChips(tlFilter.paises, 'paises') +
          (tlRuta ? rutaChipHTML() : renderChips(tlFilter.libros, 'libros')) +
          renderChips(tlFilter.autores, 'autores') +
        '</div>' +
        '<button class="tl-mapa-clear" id="tl-mapa-clear" ' + (filterEmpty?'disabled':'') + '>Limpiar</button>' +
      '</div>';

    // Mobile Gameboy shell — gets the globe placed inside its LCD frame
    // after render. Stays hidden on >768px. Includes its own d-pad/A-B deck
    // and a card slot the renderTlmCard fills on each selectIdx.
    var mobileShellHTML =
      '<div class="tlm-shell">' +
        '<div class="tlm-search-wrap">' +
          '<input class="tlm-search" type="text" id="tlm-search" ' +
            'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
            'placeholder="Buscar eventos…" value="' + esc(tlFilter.q) + '">' +
          '<button class="tlm-filter-fab' + (filterEmpty ? '' : ' has-filter') + '" ' +
            'id="tlm-filter-btn" title="Filtros" aria-label="Filtros" type="button">' + TL_IC.filtro + '</button>' +
        '</div>' +
        '<div class="tlm-lcd-wrap">' +
          '<div class="tlm-lcd">' +
            '<div class="tlm-screen" id="tlm-screen">' +
              '<div class="tlm-screen-overlay">' +
                '<div class="row">' +
                  '<span class="tlm-chip year" id="tlm-chip-year">—</span>' +
                  '<span class="tlm-chip era" id="tlm-chip-era">—</span>' +
                '</div>' +
                '<div class="row">' +
                  '<span class="tlm-chip place" id="tlm-chip-place">—</span>' +
                  '<span></span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="tlm-lcd-brand">tiempo · color</div>' +
          '</div>' +
        '</div>' +
        (portadaOn ? portadaHTML : rutaBannerHTML) +
        '<div class="tlm-card" id="tlm-card">' +
          '<div class="tlm-card-header">' +
            '<span class="tlm-card-year">—</span>' +
            '<span class="tlm-card-era">—</span>' +
          '</div>' +
          '<div class="tlm-card-body">' +
            '<h3 class="tlm-card-title">Cargando…</h3>' +
          '</div>' +
        '</div>' +
        '<div class="tlm-deck">' +
          '<div class="tlm-tape" id="tlm-tape" role="slider" aria-label="Línea del tiempo">' +
            '<div class="tlm-tape-segs" id="tlm-tape-segs"></div>' +
            '<div class="tlm-tape-head" id="tlm-tape-head"></div>' +
          '</div>' +
          '<div class="tlm-deck-row">' +
            '<button class="tlm-step" id="tlm-step-prev" aria-label="Evento anterior">' + TL_IC.prev + '</button>' +
            '<div class="tlm-deck-meta">' +
              '<span class="era-name" id="tlm-counter-era">—</span>' +
              '<span class="num" id="tlm-counter-num">0 / ' + allEvents.length + '</span>' +
            '</div>' +
            '<button class="tlm-step" id="tlm-step-next" aria-label="Evento siguiente">' + TL_IC.next + '</button>' +
            '<button class="tlm-act tlm-act-play" id="tlm-btn-a" aria-label="Reproducir">' + TL_IC.play + '</button>' +
            '<button class="tlm-act tlm-act-world" id="tlm-btn-b" aria-label="Ver el globo completo">' + TL_IC.mundo + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    container.innerHTML = '<div class="view-transition' + (portadaOn ? ' tl-portada-mode' : '') + '">' +
      filterBarHTML +
      bodyHTML +
      mobileShellHTML +
    '</div>';

    // Move the globe-wrap from the desktop layout INTO the mobile LCD screen
    // when we're under 768px. The globe is initialized once; it just lives in
    // a different DOM parent depending on breakpoint. Reparenting it preserves
    // the SVG and event handlers.
    var mqMobile = window.matchMedia('(max-width: 768px)');
    var mqFlow = window.matchMedia('(max-width: 1100px)');
    var globeWrap = container.querySelector('.tl-mapa-globe-wrap');
    var tlmScreen = container.querySelector('#tlm-screen');
    var portadaStage = portadaOn ? container.querySelector('.tlp-stage') : null;
    var desktopGlobeSlot = globeWrap ? globeWrap.parentNode : null;
    function placeGlobeForBreakpoint() {
      if (!globeWrap) return;
      if (mqMobile.matches) {
        if (tlmScreen && globeWrap.parentNode !== tlmScreen) tlmScreen.appendChild(globeWrap);
      } else if (portadaStage && !mqFlow.matches) {
        // Portada dashboard: el planeta flota centrado dentro del dash.
        if (globeWrap.parentNode !== portadaStage) portadaStage.appendChild(globeWrap);
      } else if (desktopGlobeSlot) {
        if (globeWrap.parentNode !== desktopGlobeSlot) desktopGlobeSlot.appendChild(globeWrap);
      }
    }
    placeGlobeForBreakpoint();
    // La search bar vive dentro del dash (slot bajo "Hoy en la historia").
    // En móvil no: allá tiene la suya dentro del shell.
    if (portadaOn && !mqMobile.matches) {
      var fbar = container.querySelector('.tl-mapa-filter-bar');
      var fslot = container.querySelector('.tlp-search-slot');
      if (fbar && fslot && fbar.parentNode !== fslot) fslot.appendChild(fbar);
    }
    // React to rotation / window resize across breakpoint
    if (mqMobile.addEventListener) {
      mqMobile.addEventListener('change', placeGlobeForBreakpoint);
    } else if (mqMobile.addListener) {
      mqMobile.addListener(placeGlobeForBreakpoint);
    }

    // Wire toggles — RETIRADO el toggle Lista/Mapa (2026-08-02): vista única mapa.

    // ── Wire filter bar ──
    function rerenderFromFilter() {
      // Si el filtro quedó vacío al editarlo (Limpiar, quitar chips, Escape),
      // se regresa a la portada en lugar del volcado completo de eventos.
      if (filterIsEmpty(tlFilter)) tlPortadaDismissed = false;
      // Recuerda si el buscador tenía el foco y dónde iba el cursor: el
      // re-render recrea el input y si no, se pierde el foco (había que volver
      // a hacer clic para seguir escribiendo).
      var active = document.activeElement;
      var focusedId = active && (active.id === 'tl-mapa-q' || active.id === 'tlm-search') ? active.id : null;
      var caret = null;
      if (focusedId) { try { caret = active.selectionStart; } catch(e) {} }
      writeFilterToURL(tlFilter);
      renderTimelineView();
      if (focusedId) {
        var ni = document.getElementById(focusedId);
        if (ni) {
          ni.focus();
          var pos = caret != null ? caret : ni.value.length;
          try { ni.setSelectionRange(pos, pos); } catch(e) {}
        }
      }
    }
    // Hook para abrir el timeline filtrado por un libro desde su ficha.
    window.__tlApplyBookFilter = function(bid){
      tlFilter = { q:'', libros:new Set([bid]), paises:new Set(), autores:new Set(), fuentes:new Set() };
      rerenderFromFilter();
    };
    window.__tlApplyBooksFilter = function(ids){
      tlFilter = { q:'', libros:new Set(ids||[]), paises:new Set(), autores:new Set(), fuentes:new Set() };
      rerenderFromFilter();
    };
    var qInput = container.querySelector('#tl-mapa-q');
    if (qInput) {
      var qTimer = null;
      qInput.addEventListener('input', function(e) {
        tlFilter.q = e.target.value.trim();
        clearTimeout(qTimer);
        qTimer = setTimeout(rerenderFromFilter, 350);
      });
      qInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { tlFilter.q = ''; e.target.value = ''; rerenderFromFilter(); }
      });
    }
    var clearBtn = container.querySelector('#tl-mapa-clear');
    if (clearBtn) clearBtn.addEventListener('click', function() {
      tlRuta = null; // Limpiar también sale del recorrido → regresa a la portada
      tlFilter = { q: '', libros: new Set(), paises: new Set(), autores: new Set(), fuentes: new Set() };
      rerenderFromFilter();
    });

    // ── Unified filter popover (Filtro ▾) ──
    // Un solo buscador agrupado: Libros (portadas), Países (banderas), Autores.
    // Click/Enter alterna selección SIN cerrar; el re-render pesado va con debounce.
    var popWrap = container.querySelector('#tl-filter-pop');
    var popBtn = container.querySelector('#tl-filter-btn');
    var popInput = container.querySelector('#tl-filter-q');
    var popResults = container.querySelector('#tl-filter-results');
    var chipsWrap = container.querySelector('.tl-filter-chips');
    var popKbSel = -1;
    var popHeavyTimer = null;

    function firstAlpha(s) { var m = String(s || '').match(/[\p{L}]/u); return m ? m[0].toUpperCase() : '?'; }

    function buildPopPools() {
      var paises = allPaises.map(function(c){ return {kind:'paises', id:c, label:tlPaisLabel(c)}; });
      var libros = allLibros.map(function(id){
        var bk = books.find(function(b){ return b.id === id; }) || null;
        return {kind:'libros', id:id, label: bk ? bk.title : tlBookLabel(id), book: bk};
      });
      var auMap = {};
      books.forEach(function(b){
        if (!allLibrosSet.has(b.id)) return;
        var names = (typeof parseAuthors === 'function' ? parseAuthors(b.author || '') : []);
        names.forEach(function(a){
          if (!a.name) return;
          (auMap[a.name] = auMap[a.name] || {kind:'autores', id:a.name, label:a.name, n:0}).n++;
        });
      });
      var fuentes = inehrmIds().size ? [{kind:'fuentes', id:'inehrm', label:'INEHRM'}] : [];
      return {paises: paises, libros: libros, autores: Object.values(auMap), fuentes: fuentes};
    }

    function popRowHTML(o, icon, sub) {
      var sel = tlFilter[o.kind].has(o.id);
      return '<div class="tl-filter-row' + (sel ? ' selected' : '') + '" data-kind="' + o.kind + '" data-val="' + esc(o.id) + '">' +
        icon +
        '<div class="pick-meta"><div class="pick-title">' + esc(o.label) + '</div>' +
        (sub ? '<div class="pick-sub">' + esc(sub) + '</div>' : '') + '</div>' +
        '<div class="pick-check">' + (sel ? '✓' : '') + '</div>' +
      '</div>';
    }

    function renderPopResults() {
      if (!popResults) return;
      var q = tlNormalize((popInput.value || '').trim());
      var pools = buildPopPools();
      function match(o) {
        return !q || tlNormalize(o.label).indexOf(q) !== -1 || tlNormalize(o.id).indexOf(q) !== -1;
      }
      var paises = pools.paises.filter(match);
      paises.sort(function(a, b){
        if (!q) { if (a.id === 'MX') return -1; if (b.id === 'MX') return 1; }
        return a.label.localeCompare(b.label, 'es');
      });
      var libros = pools.libros.filter(match).sort(function(a, b){ return a.label.localeCompare(b.label, 'es'); });
      var autores = pools.autores.filter(match).sort(function(a, b){ return (b.n - a.n) || a.label.localeCompare(b.label, 'es'); });
      var fuentes = (pools.fuentes || []).filter(match);
      var html = '';
      if (fuentes.length) {
        html += '<div class="tl-filter-group-label">Fuentes</div>' + fuentes.map(function(o){
          return popRowHTML(o, '<div class="pick-author-ic">IN</div>', 'solo eventos con cita del INEHRM');
        }).join('');
      }
      if (paises.length) {
        html += '<div class="tl-filter-group-label">Países</div>' + paises.slice(0, 40).map(function(o){
          return popRowHTML(o, '<span class="pick-flag">' + paisFlag(o.id) + '</span>', '');
        }).join('');
      }
      if (libros.length) {
        html += '<div class="tl-filter-group-label">Libros</div>' + libros.slice(0, 40).map(function(o){
          var bk = o.book, icon;
          if (bk && typeof getCoverHTML === 'function' && (bk.coverUrl || (bk.coverId && typeof coverImages !== 'undefined' && coverImages[bk.coverId]))) {
            icon = '<div class="pick-cover">' + getCoverHTML(bk, 'tiny') + '</div>';
          } else {
            var au = bk ? (bk.author || '') : '';
            var initial = firstAlpha(au.split(' ').pop());
            if (initial === '?') initial = firstAlpha(o.label);
            icon = '<div class="pick-cover"><div class="ph">' + esc(initial) + '</div></div>';
          }
          return popRowHTML(o, icon, bk ? (bk.author || '') : '');
        }).join('');
      }
      if (autores.length) {
        html += '<div class="tl-filter-group-label">Autores</div>' + autores.slice(0, 40).map(function(o){
          return popRowHTML(o, '<div class="pick-author-ic">' + esc(firstAlpha(o.label)) + '</div>',
            o.n + (o.n === 1 ? ' libro' : ' libros'));
        }).join('');
      }
      popResults.innerHTML = html || '<div class="tl-filter-empty">Sin resultados para "' + esc(popInput.value) + '"</div>';
      popKbSel = -1;
    }

    function openPop() {
      popWrap.classList.add('open');

    function refreshChips() {
      var cnt = tlFilter.libros.size + tlFilter.paises.size + tlFilter.autores.size + (tlFilter.fuentes ? tlFilter.fuentes.size : 0);

      if (cb) cb.disabled = filterIsEmpty(tlFilter);

    function toggleSel(kind, val) {
      if (tlFilter[kind].has(val)) tlFilter[kind].delete(val); else tlFilter[kind].add(val);
      writeFilterToURL(tlFilter);

      refreshChips();
      clearTimeout(popHeavyTimer);
      popHeavyTimer = setTimeout(rerenderFromFilter, 700);

      });

      document.addEventListener('click', function onDocClick(e) {

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          popKbSel = Math.min(items.length - 1, popKbSel + 1);
          items.forEach(function(it, i){ it.classList.toggle('kbsel', i === popKbSel); });
          if (items[popKbSel]) items[popKbSel].scrollIntoView({block:'nearest'});
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          popKbSel = Math.max(0, popKbSel - 1);
          items.forEach(function(it, i){ it.classList.toggle('kbsel', i === popKbSel); });

          e.preventDefault();
          var pick = popKbSel >= 0 ? items[popKbSel] : items[0];
          if (pick) toggleSel(pick.getAttribute('data-kind'), pick.getAttribute('data-val'));

      if (pill) {

      if (evEl) {
        var idx = parseInt(evEl.getAttribute('data-idx'));
        if (!isNaN(idx) && container._tlMapaSelect) container._tlMapaSelect(idx);
      }

      // pero nunca la misma; el ciclo continúa desde ahí
      var __intimas = [];
      TLP_FORMS.forEach(function(f, i) { if (f.p.length <= 5) __intimas.push(i); });
      var formStep = __intimas[Math.floor(Math.random() * __intimas.length)] || 1;
      var swapPtr = 0;
      function orbColoca(sph, f) {
        sph.style.left = f[0] + '%';
        sph.style.top = f[1] + '%';
        sph.style.transform = 'translate(-50%,-50%) scale(' + f[2] + ')';
        sph.style.opacity = 1;
        // profundidad: las lejanas (escala chica) van apagadas (sin blur)
        sph.style.setProperty('--obr', f[2] <= 0.85 ? '.72' : (f[2] < 1.05 ? '.88' : '1'));
        sph.style.setProperty('--osc', f[2]);
        // destacada SIEMPRE delante del mundo; el resto según profundidad
        sph.style.zIndex = f[3] ? 4 : (f[2] >= 1.05 ? 3 : (f[2] >= 0.85 ? 2 : 1));
        sph.classList.toggle('tlp-bubble-feat', !!f[3]);
        sph.classList.toggle('tlp-bubble-near', f[2] >= 1);
      }
      function orbEntrada(sph, f, modo) {
        // teleport sin transición al punto de partida del viaje
        sph.style.transition = 'none';
        if (modo === 'lejos') {
          // nace como estrella: un punto diminuto en el cielo
          sph.style.left = (4 + Math.random() * 40).toFixed(1) + '%';
          sph.style.top = (6 + Math.random() * 30).toFixed(1) + '%';
          sph.style.transform = 'translate(-50%,-50%) scale(.05)';
          sph.style.setProperty('--obr', '1.6');
          sph.style.opacity = 0;
        } else {
          // entra por una orilla: izquierda, arriba o abajo
          var lado = ['izq', 'arriba', 'abajo'][Math.floor(Math.random() * 3)];
          if (lado === 'arriba') { sph.style.left = f[0] + '%'; sph.style.top = '-9%'; }
          else if (lado === 'abajo') { sph.style.left = f[0] + '%'; sph.style.top = '108%'; }
          else { sph.style.left = '-9%'; sph.style.top = f[1] + '%'; }
          sph.style.transform = 'translate(-50%,-50%) scale(' + (f[2] * 0.8).toFixed(2) + ')';
          sph.style.opacity = 0;
        }
        void sph.offsetWidth;
        sph.style.transition = '';
      }
      function cambiarCara(sph, i) {
        if (!window.__tlpOrbit) return;
        var isPer = sph.classList.contains('tlp-bubble-per');
        var q = isPer ? window.__tlpOrbit.per : window.__tlpOrbit.aut;
        var key = isPer ? 'nextPer' : 'nextAut';
        if (!q.length) return;
        var occ = { tipo: isPer ? 'per' : 'aut', data: q[window.__tlpOrbit[key] % q.length] };
        window.__tlpOrbit[key]++;
        var tmp = document.createElement('div');
        tmp.innerHTML = window.__tlpOrbBubbleHTML(occ, i);
        var nb = tmp.firstChild;
        sph.setAttribute('data-door', nb.getAttribute('data-door'));
        var nq = nb.getAttribute('data-q'), nid = nb.getAttribute('data-id');
        if (nq) { sph.setAttribute('data-q', nq); sph.removeAttribute('data-id'); }
        else if (nid) { sph.setAttribute('data-id', nid); sph.removeAttribute('data-q'); }
        sph.title = nb.title;
        sph.innerHTML = nb.innerHTML;
        sph.className = nb.className;
      }
      function orbApply(withSwap) {
        var FE = TLP_FORMS[formStep % TLP_FORMS.length];
        var F = FE.p, d = FE.t.d;
        formStep++;
        var N = Math.min(F.length, orbBubbles.length);
        // relevos: nunca sobre destacadas y solo con elenco suficiente
        var swapIdx = [];
        if (withSwap && N >= 8) {
          var cand = [];
          for (var ci = 0; ci < N; ci++) { if (!F[ci][3]) cand.push(ci); }
          if (cand.length > 3) {
            swapIdx = [cand[swapPtr % cand.length], cand[(swapPtr + (cand.length >> 1)) % cand.length]];
            swapPtr++;
          }
        }
        orbBubbles.forEach(function(sph, i) {
          if (!sph.isConnected) return;
          sph.style.setProperty('--tdur', d + 's');
          sph.style.transitionDelay = (Math.random() * 1.6).toFixed(2) + 's';
          if (i >= N) {
            // sobra en esta formación: sale del baile encogiéndose a estrella
            if (!sph.__oculta) {
              sph.__oculta = true;
              sph.classList.remove('tlp-bubble-feat');
              sph.style.transform = 'translate(-50%,-50%) scale(.05)';
              sph.style.setProperty('--obr', '1.7');
              setTimeout(function() { if (sph.isConnected && sph.__oculta) sph.style.opacity = 0; }, d * 820);
            }
            return;
          }
          var f = F[i];
          if (sph.__oculta) {
            // vuelve al baile con cara nueva; profundidad 7 de cada 10 veces
            sph.__oculta = false;
            cambiarCara(sph, i);
            orbEntrada(sph, f, Math.random() < 0.7 ? 'lejos' : 'orilla');
            setTimeout(function() { if (sph.isConnected && !sph.__oculta) orbColoca(sph, f); }, 80);
            return;
          }
          if (swapIdx.indexOf(i) < 0) { orbColoca(sph, f); return; }
          // relevo: se encoge hasta quedar como una estrella y ahí se apaga
          sph.style.transitionDelay = '0s';
          sph.classList.remove('tlp-bubble-feat');
          sph.style.transform = 'translate(-50%,-50%) scale(.05)';
          sph.style.setProperty('--obr', '1.7');
          setTimeout(function() { if (sph.isConnected) sph.style.opacity = 0; }, d * 850);
          setTimeout(function() {
            if (!sph.isConnected || !window.__tlpOrbit || sph.__oculta) return;
            cambiarCara(sph, i);
            orbEntrada(sph, f, Math.random() < 0.7 ? 'lejos' : 'orilla');
            setTimeout(function() { if (sph.isConnected && !sph.__oculta) orbColoca(sph, f); }, 80);
          }, d * 1150);
        });
      }
      function cicloOrb() {
        var h = TLP_FORMS[(formStep - 1 + TLP_FORMS.length) % TLP_FORMS.length].t.h || 30;
        window.__tlpOrbitTimer = setTimeout(function() {
          if (window.__tlpOrbit && !mqFlow.matches) orbApply(true);
          cicloOrb();
        }, h * 1000);
      }
      // entrada inicial: espera a que el dash tenga layout real. El primer
      // render corre con la vista aún sin medir y sus nodos se reemplazan;
      // arrancar ahí pintaba un instante la formación antes del snap.
      window.__tlpOrbitKick = setTimeout(function() {
        if (mqFlow.matches) return;
        (function esperar(n) {
          if (!orbDash || !orbDash.isConnected) return;   // render viejo: abortar
          var r = orbDash.getBoundingClientRect();
          if (r.width < 100 || r.height < 100) {
            if (n < 180) requestAnimationFrame(function() { esperar(n + 1); });
            return;
          }
          var F0 = TLP_FORMS[formStep % TLP_FORMS.length].p;
          // Movimiento reducido: la primera figura queda quieta, sin baile.
          if (tlReducedMotion) {
            orbBubbles.forEach(function(sph, i) {
              if (i < F0.length) orbColoca(sph, F0[i]);
              else { sph.__oculta = true; sph.style.opacity = 0; }
            });
            return;
          }
          orbBubbles.forEach(function(sph, i) {
            if (!sph.isConnected) return;
            if (i < F0.length) orbEntrada(sph, F0[i], (i % 3 === 2) ? 'orilla' : 'lejos');
            else sph.__oculta = true;
          });
          window.__tlpOrbitKick2 = setTimeout(function() { orbApply(false); cicloOrb(); }, 400);
        })(0);
      }, 90);
    }

    // ── Constelaciones de conceptos: cada tanto, un hilo dorado une 2-3
    // términos, se sostiene y se desvanece — las ideas como figuras que uno
    // encuentra en el cielo de palabras. ──
    try { clearInterval(window.__tlpConstTimer); } catch(e) {}
    try { clearTimeout(window.__tlpConstKick); } catch(e) {}
    if (portadaOn) {
      var zonasT = Array.prototype.slice.call(container.querySelectorAll('.tlp-zone-terms'));
      zonasT.forEach(function(z) {
        if (!z.querySelector('svg.tlp-terms-svg')) {
          var sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          sv.setAttribute('class', 'tlp-terms-svg');
          z.insertBefore(sv, z.firstChild);
        }
      });
      function constelar() {
        zonasT.forEach(function(z) {
          if (!z.offsetParent) return;
          var sv = z.querySelector('svg.tlp-terms-svg');
          var terms = Array.prototype.slice.call(z.querySelectorAll('.tlp-term'));
          if (!sv || terms.length < 3) return;
          var zr = z.getBoundingClientRect();
          if (!zr.width) return;
          sv.setAttribute('viewBox', '0 0 ' + Math.round(zr.width) + ' ' + Math.round(zr.height));
          var n = 2 + (Math.random() < 0.55 ? 1 : 0);
          var idx = [];
          while (idx.length < n) {
            var k = Math.floor(Math.random() * terms.length);
            if (idx.indexOf(k) < 0) idx.push(k);
          }
          // anclas bajo cada palabra (en su raíz), no sobre el texto
          var pts = idx.map(function(k) {
            var r = terms[k].getBoundingClientRect();
            return [((r.left + r.right) / 2 - zr.left).toFixed(1), (r.bottom - zr.top + 5).toFixed(1)];
          });
          sv.innerHTML = '<polyline points="' + pts.map(function(p){ return p[0] + ',' + p[1]; }).join(' ') + '"/>' +
            pts.map(function(p){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="1.8"/>'; }).join('');
          void sv.getBoundingClientRect();
          sv.classList.add('on');
          setTimeout(function() { sv.classList.remove('on'); }, 9500);
        });
      }
      window.__tlpConstKick = setTimeout(constelar, 5000);
      window.__tlpConstTimer = setInterval(constelar, 17000);
    }

    // ── Crawl: hover lo pausa (CSS); la rueda lo hojea a tu velocidad.
    // Sin rAF ni timers: solo se corre la fase de la animación al llegar
    // cada evento, así que el costo es nulo en reposo. ──
    if (portadaOn) {
      Array.prototype.forEach.call(container.querySelectorAll('.tlp-zone-crawl'), function(z) {
        var belt = z.querySelector('.tlp-crawl-belt');
        if (!belt || belt.__wheeled) return;
        belt.__wheeled = true;

        // Entrada: la banda nace justo debajo del plano y sube al MISMO paso
        // que el bucle, así que el empalme no se nota. Espera a que el plano
        // tenga alto real; medirlo en 0 (vista todavía sin layout) dejaba la
        // banda parada en translateY(0), es decir el plano lleno de golpe.
        (function arrancar(intentos) {
          var hPlano = z.clientHeight || 0;
          var hCopia = belt.scrollHeight / 2 || 0;
          if (hPlano < 40 || hCopia < 40) {
            if (intentos < 120) requestAnimationFrame(function() { arrancar(intentos + 1); });
            return;                       // sin medida fiable se queda oculta
          }
          var dur = parseFloat(getComputedStyle(belt).getPropertyValue('--beltdur')) || 290;
          belt.style.setProperty('--beltin', hPlano + 'px');
          belt.style.setProperty('--beltindur', (dur * hPlano / hCopia).toFixed(2) + 's');
          belt.classList.add('lista');
          belt.addEventListener('animationend', function alBucle(ev) {
            if (ev.animationName !== 'tlpBeltIn') return;
            belt.removeEventListener('animationend', alBucle);
            belt.__entro = true;
            belt.style.transform = '';
            // el bucle va por CLASE, no inline: el shorthand inline pisaba el
            // animation-play-state del hover y mataba la pausa y el hojeado.
            // 'lista' se queda (trae el visibility); 'encarrilada' la pisa
            // en la animación por venir después en la hoja.
            belt.classList.add('encarrilada');
          });
        })(0);
        z.addEventListener('wheel', function(e) {
          // La rueda hojea en CUALQUIER punto de la franja. Antes exigía que
          // el primer golpe cayera sobre un banner, pero durante la entrada
          // los rótulos todavía vienen subiendo desde abajo del plano y están
          // fuera de pantalla: el agarre nunca se daba y la rueda se sentía
          // muerta. La franja no compite con nada — la portada no scrollea.
          var ahora = Date.now();
          if (!belt.__entro) {
            // Antes esto era `return` y dejaba la rueda muerta durante toda la
            // entrada, que dura ~80 s: en la práctica el hojeado casi nunca
            // respondía. Si el usuario ya quiere hojear, cortamos la entrada
            // y lo dejamos en el bucle de inmediato.
            belt.__entro = true;

            belt.classList.add('encarrilada');

          belt.style.animationDelay = (-belt.__off) + 's';
        }, { passive: false });
      });
    }

    // ── Portada: rayo eléctrico puerta → planeta al hover (solo con hover real) ──
    if (portadaOn && window.matchMedia('(hover: hover)').matches) {
      var dashEl = container.querySelector('.tl-mapa-view.tlp-view .tlp-dash') || container.querySelector('.tlp-dash');
      var arcSvg = dashEl ? dashEl.querySelector('.tlp-arc') : null;
      var stageEl = dashEl ? dashEl.querySelector('.tlp-stage') : null;
      var arcTimer = null;
      // Color del rayo por categoría de puerta
      function boltColor(door) {
        var dk = door.getAttribute('data-door');
        if (dk === 'ruta' || dk === 'explorar') return '#e8c86a';
        if (dk === 'era') { var ac = door.style.getPropertyValue('--ac'); return ac || '#c8a960'; }
        if (dk === 'autor') return '#d8a06e';
        if (dk === 'libro') return '#a8d8b0';
        if (dk === 'evento') return '#f0e6c8';
        if (door.classList.contains('tlp-bubble-per')) return '#9fd8ff';
        if (door.classList.contains('tlp-term')) return '#c8b0e8';
        return '#d5ecff';
      }
      // ── Rayo vivo: electricidad que chisporrotea MIENTRAS dure el hover.
      // Cada ~90ms se regenera el camino con jitter nuevo (parpadeo eléctrico)
      // y a veces le brotan ramas cortas. Color por categoría (boltColor). ──
      var boltTick = null;
      function boltPath(x1, y1, x2, y2, jag) {
        var dx = x2 - x1, dy = y2 - y1, dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / dist, ny = dx / dist;      // normal para el zigzag
        var segs = Math.max(6, Math.round(dist / 34));
        var pts = [[x1, y1]];
        for (var i = 1; i < segs; i++) {
          var t = i / segs;
          var j = (Math.random() - 0.5) * dist * jag * Math.sin(t * Math.PI);
          pts.push([x1 + dx * t + nx * j, y1 + dy * t + ny * j]);
        }
        pts.push([x2, y2]);
        return pts;
      }
      function dibujarRayo(doorEl, primera) {
        if (!dashEl || !arcSvg || !stageEl || !doorEl.isConnected) return;
        var dashR = dashEl.getBoundingClientRect();
        var dR = doorEl.getBoundingClientRect();
        var sR = stageEl.getBoundingClientRect();
        if (!sR.width) return;
        var cx = sR.left + sR.width / 2 - dashR.left, cy = sR.top + sR.height / 2 - dashR.top;
        var x1 = Math.max(dR.left, Math.min(cx + dashR.left, dR.right)) - dashR.left;
        var y1 = Math.max(dR.top, Math.min(cy + dashR.top, dR.bottom)) - dashR.top;
        var ddx = cx - x1, ddy = cy - y1, dist = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var R = sR.width / 2 * 0.94;
        var x2 = cx - ddx / dist * R, y2 = cy - ddy / dist * R;
        var col = boltColor(doorEl);
        var pts = boltPath(x1, y1, x2, y2, 0.085);
        var dAttr = 'M' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L');
        var html = '<path class="tlp-bolt echo" stroke="' + col + '" d="' + dAttr + '"/>' +
          '<path class="tlp-bolt" stroke="' + col + '" style="filter:drop-shadow(0 0 5px ' + col + ')" d="' + dAttr + '"/>';
        // ramas: brotan de un punto intermedio y mueren cortas
        if (Math.random() < 0.55 && pts.length > 4) {
          var k = 1 + Math.floor(Math.random() * (pts.length - 3));
          var bx = pts[k][0], by = pts[k][1];
          var ang = Math.atan2(y2 - by, x2 - bx) + (Math.random() - 0.5) * 1.5;
          var blen = dist * (0.10 + Math.random() * 0.14);
          var bpts = boltPath(bx, by, bx + Math.cos(ang) * blen, by + Math.sin(ang) * blen, 0.16);
          html += '<path class="tlp-bolt rama" stroke="' + col + '" d="M' +
            bpts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') + '"/>';
        }
        html += '<circle class="tlp-bolt-dot" fill="' + col + '" style="filter:drop-shadow(0 0 6px ' + col + ')" cx="' +
          x2.toFixed(1) + '" cy="' + y2.toFixed(1) + '" r="' + (2.4 + Math.random() * 1.6).toFixed(1) + '"/>';
        arcSvg.innerHTML = html;
        if (primera) { arcSvg.classList.remove('go', 'out'); void arcSvg.offsetWidth; arcSvg.classList.add('go'); }
