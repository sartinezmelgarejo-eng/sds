        clearInterval(boltTick); clearTimeout(arcTimer);
        dibujarRayo(doorEl, true);
        boltTick = setInterval(function() {
          if (!doorEl.isConnected) { apagarRayo(); return; }
          dibujarRayo(doorEl, false);
        }, 90);
      }
      function apagarRayo() {
        clearInterval(boltTick); boltTick = null;
        if (!arcSvg) return;
        arcSvg.classList.add('out');
        clearTimeout(arcTimer);
        arcTimer = setTimeout(function(){ arcSvg.innerHTML = ''; arcSvg.classList.remove('go', 'out'); }, 320);
      }
      var lastBoltDoor = null;
      container.addEventListener('mouseover', function(e) {
        var doorEl = e.target.closest ? e.target.closest('[data-door]') : null;
        if (!doorEl || doorEl === lastBoltDoor) return;
        lastBoltDoor = doorEl;
        encenderRayo(doorEl);
      });
      container.addEventListener('mouseout', function(e) {
        var doorEl = e.target.closest ? e.target.closest('[data-door]') : null;
        if (doorEl && doorEl === lastBoltDoor) {
          lastBoltDoor = null;
          apagarRayo();
        }
      });
    }

    // Initialize globe — but only after the container has real dimensions.
    // During the page's initial render the timeline-view tab can still be
    // display:none, so globeEl.clientWidth would be 0 and the sphere ends
    // up drawn at 0x0. Wait for the wrap to be measurable.
    loadMapaDeps().then(function(deps) {
      var globeWrap = container.querySelector('.tl-mapa-globe-wrap');
      function tryInit() {
        if (!globeWrap || globeWrap.clientWidth > 0) {
          initMapaGlobe(container, allEvents, deps.world, deps.mxStates);
          wireMobileShell(container, allEvents, eras);
          // Salto pendiente desde una puerta de la portada (época / hoy).
          if (tlPendingSelect != null && container._tlMapaSelect) {
            var ps = tlPendingSelect; tlPendingSelect = null, psi = -1;
            if (typeof ps === 'number') psi = ps;
            else if (ps.id) psi = allEvents.findIndex(function(x){ return x._id === ps.id; });
            else if (ps.era != null) psi = allEvents.findIndex(function(x){ return x._srcEra === ps.era; });
            if (psi >= 0) container._tlMapaSelect(psi);
          }
          return true;
        }
        return false;
      }
      if (tryInit()) return;
      // Defer to when the tab becomes visible.
      var ro;
      try { ro = new ResizeObserver(function() { if (tryInit() && ro) ro.disconnect(); }); } catch(e) {}
      if (ro) ro.observe(globeWrap);
      // Fallback poll in case ResizeObserver is unavailable
      var attempts = 0;
      var poll = setInterval(function() {
        if (tryInit() || ++attempts > 40) clearInterval(poll);
      }, 120);
    }).catch(function(err) {
      var loading = container.querySelector('.tl-mapa-loading');
      if (loading) loading.innerHTML = '<div style="color:#c44">Error cargando mapa: ' + err.message + '</div>';
    });
  }

  // ── Mobile Gameboy shell wiring ──
  // Wraps container._tlMapaSelect with a hook that updates the LCD chips,
  // counter, and pokemon-card whenever an event becomes active. Also wires
  // the d-pad / A-B buttons to navigation actions.
  function wireMobileShell(container, events, eras) {
    var shell = container.querySelector('.tlm-shell');
    if (!shell) return;
    var card = container.querySelector('#tlm-card');
    var chipYear = container.querySelector('#tlm-chip-year');
    var chipEra = container.querySelector('#tlm-chip-era');
    var chipPlace = container.querySelector('#tlm-chip-place');
    var counterNum = container.querySelector('#tlm-counter-num');
    var counterEra = container.querySelector('#tlm-counter-era');

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function renderTlmCard(ev, idx) {
      if (!ev) return;
      var era = ev._era || {};
      var eraColor = era.color || 'var(--gold)';
      // Update the era-color custom prop so card border + chip use it
      shell.style.setProperty('--era-color-current', eraColor);
      // Year chip on the LCD
      if (chipYear) chipYear.textContent = tlFechaTexto(ev.year || '—');
      // Era chip
      if (chipEra) chipEra.textContent = era.label ? tlEraShort(era.label) : '—';
      // Place chip
      var placeText = (ev.lugar && ev.lugar.nombre) ? ev.lugar.nombre : '';
      if (chipPlace) {
        if (placeText) { chipPlace.textContent = placeText; chipPlace.style.display = ''; }
        else { chipPlace.style.display = 'none'; }
      }
      // Counter
      if (counterNum) counterNum.textContent = (idx + 1) + ' / ' + events.length;
      if (counterEra) counterEra.textContent = era.label ? tlEraShort(era.label) : '';

      // Build the card body
      var titleHTML = '<h3 class="tlm-card-title">' + esc(ev.text || '') + '</h3>';
      var placeHTML = placeText ? '<div class="tlm-card-place">' + esc(placeText) + '</div>' : '';
      var detalleHTML = ev.detalle
        ? '<div class="tlm-card-detalle">' + formatDetalleHTML(ev.detalle) + '</div>'
        : '';
      var citasHTML = '';
      if (ev.citas && ev.citas.length) {
        var citaItems = ev.citas.map(function(c) {
          var bookLabel = c.libro ? (typeof tlBookLabel === 'function' ? tlBookLabel(c.libro) : c.libro) : '';
          var pageLink = '';
          if (c.libro && c.pagina) pageLink = tlPdfPageUrl(c);
          var metaParts = [];
          if (bookLabel) {
            metaParts.push(c.libro
              ? '<a href="#" data-book="' + esc(c.libro) + '" class="tlm-book-link">' + esc(bookLabel) + '</a>'
              : esc(bookLabel));
          }
          if (c.pagina) {
            if (pageLink) metaParts.push('<a href="' + esc(pageLink) + '" target="_blank" rel="noopener">' + esc(c.pagina) + '</a>');
            else metaParts.push(esc(c.pagina));
          }
          return '<div class="tlm-cita">' +
            '<div class="tlm-cita-text">' + esc(c.texto || '') + '</div>' +
            (metaParts.length ? '<span class="tlm-cita-meta">' + metaParts.join(' · ') + '</span>' : '') +
          '</div>';
        }).join('');
        citasHTML = '<div class="tlm-citas">' + citaItems + '</div>';
      }
      var headerHTML =
        '<div class="tlm-card-header">' +
          '<span class="tlm-card-year">' + esc(tlFechaTexto(ev.year || '—')) + '</span>' +
          '<span class="tlm-card-era">' + esc(era.label ? tlEraShort(era.label) : '') + '</span>' +
        '</div>';
      var bodyHTML = '<div class="tlm-card-body">' + titleHTML + placeHTML + detalleHTML + citasHTML + '</div>';
      card.innerHTML = headerHTML + bodyHTML;
    }

    // Register the mobile-card updater on the core select hook (fired inside
    // selectIdx). This covers autoplay + marker taps too, which the old wrapper
    // missed. tapeHeadUpdater is filled in once the tape is built (below).
    var tapeHeadUpdater = null;
    container._tlmOnSelect = function(idx) {
      if (events[idx]) renderTlmCard(events[idx], idx);
      if (tapeHeadUpdater) { try { tapeHeadUpdater(idx); } catch(e) {} }
    };
    // Render the initial event into the card (en portada no: el LCD va limpio).
    if (events[0] && !tlPortadaActive()) renderTlmCard(events[0], 0);

    // Tap a book title inside a cita → open the book detail panel.
    // PDF page links keep their default browser behavior (target=_blank).
    if (card && !card.__bookWired) {
      card.__bookWired = true;
      card.addEventListener('click', function(e) {
        if (e.target.closest('a[target="_blank"]')) return; // let pdf link through
        var link = e.target.closest('.tlm-book-link[data-book]');
        if (!link) return;
        e.preventDefault();
        var bid = link.getAttribute('data-book');
        if (bid && typeof openBook === 'function') openBook(bid);
      });
    }

    // ── Era tape + step chevrons ──
    function curIdx() {
      var active = container.querySelector('.tl-mapa-evt--active');
      if (active) {
        var i = parseInt(active.getAttribute('data-idx'));
        if (!isNaN(i)) return i;
      }
      return 0;
    }

    // Build the tape: one colored segment per era, width proportional to its
    // event count in the current (filtered) dataset. Tap a segment to jump
    // to its first event.
    var tape = shell.querySelector('#tlm-tape');
    var tapeSegs = shell.querySelector('#tlm-tape-segs');
    var tapeHead = shell.querySelector('#tlm-tape-head');
    var eraInfo = []; // [{label, color, firstIdx, count}]
    if (tapeSegs && tapeHead) {
      var seenLabels = {};
      events.forEach(function(ev, i) {
        var era = ev._era;
        if (!era) return;
        var key = era.label || '__';
        if (!seenLabels[key]) {
          seenLabels[key] = eraInfo.length;
          eraInfo.push({ label: era.label || '', color: era.color || 'var(--gold)', firstIdx: i, count: 0 });
        }
        eraInfo[seenLabels[key]].count++;
      });
      var segHTML = eraInfo.map(function(e, i) {
        var pct = (e.count / events.length) * 100;
        return '<div class="tlm-tape-seg" data-era="' + i + '" data-first="' + e.firstIdx + '" ' +
          'style="width:' + pct.toFixed(3) + '%; background:' + e.color + ';" ' +
          'title="' + esc(e.label) + ' (' + e.count + ')"></div>';
      }).join('');
      tapeSegs.innerHTML = segHTML;

      function updateTapeHead(idx) {
        var pct = ((idx + 0.5) / events.length) * 100;
        tapeHead.style.left = pct.toFixed(3) + '%';
        // Mark the active era segment
        var activeEra = -1;
        for (var i = 0; i < eraInfo.length; i++) {
          var nextStart = (i + 1 < eraInfo.length) ? eraInfo[i + 1].firstIdx : events.length;
          if (idx >= eraInfo[i].firstIdx && idx < nextStart) { activeEra = i; break; }
        }
        tapeSegs.querySelectorAll('.tlm-tape-seg').forEach(function(s, i) {
          s.classList.toggle('active', i === activeEra);
        });
      }

      // Initial head position
      updateTapeHead(curIdx());

      // Tap a segment = jump to that era's first event
      tape.addEventListener('click', function(e) {
        var seg = e.target.closest('.tlm-tape-seg');
        if (!seg) return;
        if (container._tlMapaStopPlay) container._tlMapaStopPlay('tape');
        var first = parseInt(seg.getAttribute('data-first'));
        if (!isNaN(first) && container._tlMapaSelect) container._tlMapaSelect(first);
      });

      // Feed the tape playhead updater into the select hook so autoplay, marker
      // taps and chevrons move the playhead too (not just container._tlMapaSelect).
      tapeHeadUpdater = updateTapeHead;
    }

    // Step chevrons
    var stepPrev = shell.querySelector('#tlm-step-prev');
    var stepNext = shell.querySelector('#tlm-step-next');
    if (stepPrev && !stepPrev.__wired) {
      stepPrev.__wired = true;
      stepPrev.addEventListener('click', function() {
        if (container._tlMapaStopPlay) container._tlMapaStopPlay('step');
        var sel = container._tlMapaSelect; if (!sel) return;
        sel(Math.max(0, curIdx() - 1));
      });
    }
    if (stepNext && !stepNext.__wired) {
      stepNext.__wired = true;
      stepNext.addEventListener('click', function() {
        if (container._tlMapaStopPlay) container._tlMapaStopPlay('step');
        var sel = container._tlMapaSelect; if (!sel) return;
        sel(Math.min(events.length - 1, curIdx() + 1));
      });
    }


    // ── A button = play; B button = world view ──
    // Both proxy to the existing #tl-mapa-play / #tl-mapa-world buttons.
    var btnA = container.querySelector('#tlm-btn-a');
    var btnB = container.querySelector('#tlm-btn-b');
    var playBtn = container.querySelector('#tl-mapa-play');
    var worldBtn = container.querySelector('#tl-mapa-world');
    if (btnA && playBtn && !btnA.__wired) {
      btnA.__wired = true;
      btnA.addEventListener('click', function() {
        playBtn.click();
        // Mirror playing state visually
        setTimeout(function() {
          btnA.classList.toggle('playing', playBtn.classList.contains('playing'));
          btnA.innerHTML = playBtn.classList.contains('playing') ? TL_IC.pause : TL_IC.play;
        }, 30);
      });
    }
    if (btnB && worldBtn && !btnB.__wired) {
      btnB.__wired = true;
      btnB.addEventListener('click', function() {
        worldBtn.click();
        setTimeout(function() {
          btnB.classList.toggle('active', worldBtn.classList.contains('active'));
        }, 30);
      });
    }

    // ── Search input: mirror the desktop #tl-mapa-q (just push value + dispatch) ──
    var search = container.querySelector('#tlm-search');
    var desktopSearch = container.querySelector('#tl-mapa-q');
    if (search && desktopSearch && !search.__wired) {
      search.__wired = true;
      search.addEventListener('input', function(e) {
        desktopSearch.value = e.target.value;
        desktopSearch.dispatchEvent(new Event('input', {bubbles: true}));
      });
    }

    // ── Filter FAB → bottom sheet wrapping the existing filter bar ──
    var fab = container.querySelector('#tlm-filter-btn');
    if (fab && !fab.__wired) {
      fab.__wired = true;
      var sheet = document.getElementById('tlm-filter-sheet');
      var backdrop = document.getElementById('tlm-sheet-backdrop');
      if (!sheet) {
        sheet = document.createElement('div');
        sheet.className = 'tlm-sheet';
        sheet.id = 'tlm-filter-sheet';
        sheet.innerHTML =
          '<div class="tlm-sheet-handle"></div>' +
          '<div class="tlm-sheet-title">Filtros</div>' +
          '<div class="tlm-sheet-slot"></div>' +
          '<div class="tlm-sheet-actions">' +
            '<button class="tlm-sheet-clear">Limpiar</button>' +
            '<button class="tlm-sheet-apply">Cerrar</button>' +
          '</div>';
        document.body.appendChild(sheet);
        backdrop = document.createElement('div');
        backdrop.className = 'tlm-sheet-backdrop';
        backdrop.id = 'tlm-sheet-backdrop';
        document.body.appendChild(backdrop);
        backdrop.addEventListener('click', closeSheet);
        sheet.querySelector('.tlm-sheet-apply').addEventListener('click', closeSheet);
        sheet.querySelector('.tlm-sheet-clear').addEventListener('click', function() {
          var clearBtn = container.querySelector('#tl-mapa-clear');
          if (clearBtn) clearBtn.click();
        });
      }
      function openSheet() {
        var bar = container.querySelector('.tl-mapa-filter-bar');
        var slot = sheet.querySelector('.tlm-sheet-slot');
        if (bar && slot && bar.parentNode !== slot) slot.appendChild(bar);
        sheet.classList.add('open');
        backdrop.classList.add('open');
      }
      function closeSheet() {
        sheet.classList.remove('open');
        backdrop.classList.remove('open');
        var slot = sheet.querySelector('.tlm-sheet-slot');
        var bar = slot ? slot.querySelector('.tl-mapa-filter-bar') : null;
        if (bar) {
          var viewT = container.querySelector('.view-transition');
          // La barra vuelve arriba de todo (antes del mapa-view).
          if (viewT) viewT.insertBefore(bar, viewT.firstChild);
        }
      }
      fab.addEventListener('click', openSheet);
    }
  }

      '<div class="tl-mapa-loc">' +

        '<label>Evento<select data-role="evento"></select></label>' +

        '<button class="tlvp-close" id="tl-mapa-voices-close">Cerrar</button>' +

  function buildEraRail(eraPills) {
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    var pillsHTML = (eraPills || []).map(function(p, i) {
      return '<button class="tl-mapa-era-pill" data-era-idx="' + i + '" data-first-idx="' + p.firstIdx + '" ' +
        'data-label="' + esc(p.label) + '" data-years="' + esc(p.years) + '" ' +
        'style="--era-color: ' + p.color + '" aria-label="' + esc(p.label) + '" title="' + esc(p.label + ' · ' + p.years) + '">' +
        '<span class="tl-rail-n">' + esc(tlEraShort(p.label)) + '</span><span class="tl-rail-y">' + esc(tlEraStart(p.years)) + '</span></button>';
    }).join('');
    return pillsHTML ? '<div class="tl-mapa-era-rail" id="tl-mapa-era-rail">' + pillsHTML + '</div>' : '';
  }

  // Split a detalle into [lead, rest] for the editorial bold-lead pattern.
  // Prefer first colon if it lands early (≤80 chars); else first period.
  function formatDetalleHTML(text) {
    if (!text) return '';
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    var t = String(text);
    var split = -1;
    var colon = t.indexOf(':');
    if (colon > 0 && colon < 80) split = colon + 1;
    if (split < 0) {
      var period = t.indexOf('. ');
      if (period > 12 && period < 110) split = period + 1;
    }
    if (split < 0) {
      // Sin corte natural: todo el texto en peso normal (antes iba todo en negritas)
      return esc(t);
    }
    return '<span class="detalle-lead">' + esc(t.slice(0, split)) + '</span>' + esc(t.slice(split));
  }


  // ── Populate floating overlays for the active event ──
  function renderMapaDetail(container, ev) {
    var detalleEl = container.querySelector('#tl-mapa-detalle');
    var detalleBody = container.querySelector('#tl-mapa-detalle-body');
    var citasLayerEl = container.querySelector('#tl-mapa-citas-layer');
    if (!detalleEl || !citasLayerEl) return;

    if (ev.detalle && detalleBody) {
      detalleBody.innerHTML = formatDetalleHTML(ev.detalle);
      detalleEl.classList.add('show');
      detalleEl.classList.toggle('mundo', ev.scope === 'mundo');
    } else {
      if (detalleBody) detalleBody.innerHTML = '';
      detalleEl.classList.remove('show');
    }

    // Group citas by libro so a book with multiple citas about this event
    // becomes a single card with stacked quotes — saves space and reads as
    // "this book speaks here twice" instead of two unrelated objects.
    // Citas without a libro fall into their own anonymous group.
    var citas = ev.citas || [];
    var groups = [];
    var byLibro = {};
    citas.forEach(function(c, idx) {
      var key = c.libro || ('__anon_' + idx);
      if (!byLibro[key]) {
        byLibro[key] = { libro: c.libro || null, citas: [], gIdx: groups.length };
        groups.push(byLibro[key]);
      }
      var cc = {}; for (var k in c) cc[k] = c[k]; cc._i = idx;   // keep original index for highlight
      byLibro[key].citas.push(cc);
    });

    function coverHTML(bk, fallbackAuthor) {
      if (!bk) {
        var initial = (fallbackAuthor || '?').charAt(0).toUpperCase();
        var lastName = (fallbackAuthor || '').split(' ').slice(-1)[0] || '';
        return '<div class="cita-cover placeholder" data-letter="' + initial + '" data-author="' + lastName.replace(/"/g, '&quot;') + '"></div>';
      }
      var src = bk.coverUrl || (bk.coverId && typeof coverImages !== 'undefined' && coverImages[bk.coverId] ? coverImages[bk.coverId] : null);
      if (src) {
        return '<div class="cita-cover" style="background-image:url(\'' + src + '\')"></div>';
      }
      var letter = (bk.title || '?').charAt(0).toUpperCase();
      var author = (bk.author || '').split(' ').slice(-1)[0] || '';
      return '<div class="cita-cover placeholder" data-letter="' + letter + '" data-author="' + author.replace(/"/g, '&quot;') + '"></div>';
    }
    function pdfLinkFor(c, bk) {
      var pageMatch = (c.pagina || '').match(/^p\.\s*(\d+)/);
      if (!(bk && bookPdfBase(bk) && pageMatch)) return '';
      var pdfPage = Math.floor(parseInt(pageMatch[1]) * ((typeof PDF_PAGE_MULT!=='undefined'&&PDF_PAGE_MULT[c.libro])||1) + (PDF_PAGE_OFFSET[c.libro] || 0));
      if (pdfPage < 1) pdfPage = 1;
      return '<a href="' + bookPdfBase(bk) + '#page=' + pdfPage + '" target="_blank" class="quote-page-link" onclick="event.stopPropagation();">p.' + pdfPage + '</a>';
    }

    var cards = groups.map(function(g) {
      var bk = g.libro ? books.find(function(b) { return b.id === g.libro; }) : null;
      var bkTitle = bk ? bk.title : '';
      var bookColor = null;
      if (bk && typeof estantes !== 'undefined') {
        var est = estantes.find(function(e) { return e.id === bk.estante; });
        if (est) bookColor = est.color;
      }
      var coverSrc = bk && (bk.coverUrl || (bk.coverId && typeof coverImages !== 'undefined' && coverImages[bk.coverId]));
      var styleParts = [];
      if (coverSrc) styleParts.push("--book-cover-bg: url('" + coverSrc.replace(/'/g, "\\'") + "') center/cover no-repeat");
      if (bookColor) styleParts.push('--book-color: ' + bookColor);
      var styleAttr = styleParts.length ? ' style="' + styleParts.join('; ') + '"' : '';
      var quotesHTML;
      if (g.citas.length === 1) {
        quotesHTML = '<div class="tl-mapa-floating-cita-text" data-cita-idx="' + g.citas[0]._i + '">“' + escHTML(g.citas[0].texto) + '”</div>';
      } else {
        quotesHTML = '<div class="cita-quote-stack">' + g.citas.map(function(c, i) {
          return (i ? '<div class="tl-cita-divider"></div>' : '') +
            '<div class="tl-mapa-floating-cita-text" data-cita-idx="' + c._i + '">“' + escHTML(c.texto) + '”</div>';
        }).join('') + '</div>';
      }
      // Attribution: book title once, then page links (one per cita that has a page)
      var pages = g.citas.map(function(c) { return pdfLinkFor(c, bk); }).filter(Boolean).join('');
      var pagesBlock = pages ? '<span class="cita-page-list">' + pages + '</span>' : '';
      var fallbackAuthor = g.citas[0].autor;
      // Attribution: title + author of the book, PLUS "cita de {other}" whenever
      // any cita in the group has an autor different from the book's own
      // author (nested quote — book's author is quoting a third party).
      var attrTitle = bkTitle || (g.libro || '');
      var bookAuthorMapa = (bk && bk.author) || '';
      var attrAuthor = bookAuthorMapa || fallbackAuthor || '';
      var titleSpan = attrTitle
        ? '<span class="booklink" data-book="' + (g.libro || '') + '">' + escHTML(attrTitle) + '</span>'
        : '';
      var authorSpan = attrAuthor ? '<span class="cita-attr-author">' + escHTML(attrAuthor) + '</span>' : '';
      var attrParts = [titleSpan, authorSpan].filter(Boolean).join(' · ');
      // Nested-quote hint: collect distinct citaAuthors that differ from bookAuthor
      var nestedAuthors = [];
      if (bookAuthorMapa) {
        var seenNested = {};
        g.citas.forEach(function(c) {
          if (c.autor && !isSameAuthor(c.autor, bookAuthorMapa) && !seenNested[c.autor]) {
            seenNested[c.autor] = 1;
            nestedAuthors.push(c.autor);
          }
        });
      }
      var nestedHint = nestedAuthors.length
        ? '<span class="cita-attr-nested">cita de ' + escHTML(nestedAuthors.join(', ')) + '</span> '
        : '';
      return '<div class="tl-mapa-floating-cita ' + (ev.scope === 'mundo' ? 'mundo' : '') +
        (g.citas.length > 1 ? ' cita-multi' : '') +
        '" data-group-idx="' + g.gIdx + '"' + styleAttr + '>' +
        coverHTML(bk, fallbackAuthor) +
        '<div class="cita-card-rect">' +
          quotesHTML +
          '<div class="tl-mapa-floating-cita-attr">' +
            nestedHint +
            attrParts +
            (pagesBlock ? ' ' + pagesBlock : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    var thumbs = groups.map(function(g) {
      var bk = g.libro ? books.find(function(b) { return b.id === g.libro; }) : null;
      var src = bk && (bk.coverUrl || (bk.coverId && typeof coverImages !== 'undefined' && coverImages[bk.coverId]));
      var multiBadge = g.citas.length > 1 ? '<span class="cita-thumb-badge">' + g.citas.length + '</span>' : '';
      var title = bk ? bk.title : (g.citas[0].autor || '');
      if (src) {
        return '<div class="tl-mapa-cita-thumb" data-group-idx="' + g.gIdx + '" style="background-image:url(\'' + src.replace(/'/g, "\\'") + '\')" title="' + title.replace(/"/g, '&quot;') + '">' + multiBadge + '</div>';
      }
      var letter = (title || '?').charAt(0).toUpperCase();
      return '<div class="tl-mapa-cita-thumb placeholder" data-group-idx="' + g.gIdx + '" title="' + title.replace(/"/g, '&quot;') + '">' + letter + multiBadge + '</div>';
    }).join('');
    citasLayerEl.innerHTML = cards + thumbs;
    citasLayerEl._citas = citas;
    citasLayerEl._scope = ev.scope;
    // Size tier by GROUP count: 1–2 = pair (big), 3–4 = mid, 5+ = many (compact)
    citasLayerEl.classList.remove('tl-citas-pair','tl-citas-mid','tl-citas-many');
    var nG = groups.length;
    if (nG <= 2) citasLayerEl.classList.add('tl-citas-pair');
    else if (nG <= 4) citasLayerEl.classList.add('tl-citas-mid');
    else citasLayerEl.classList.add('tl-citas-many');
  }

  function initMapaGlobe(container, events, world, mxStates) {
    var globeEl = container.querySelector('#tl-mapa-globe');
    if (!globeEl) return;
    // Guard: refuse to init at 0×0 — otherwise D3 renders a valid-looking
    // SVG with invisible paths (d="" or "M0,0Z") and the showView retry
    // heuristic thinks the globe is already up. Caller (loadMapaDeps.then
    // + tryInit) is expected to retry when the container gets real size.
    if (globeEl.clientWidth < 20 || globeEl.clientHeight < 20) return;
    // Remove only the loading splash, keep the floating overlay nodes intact
    var loading = globeEl.querySelector('.tl-mapa-loading');
    if (loading) loading.remove();
    var existingSvg = globeEl.querySelector(':scope > svg');
    if (existingSvg) existingSvg.remove();
    var oldTex = globeEl.querySelector('canvas.tl-globe-tex');
    if (oldTex) oldTex.remove();
    // Canvas de textura DEBAJO del SVG: la foto se pinta aquí; países, pines
    // e interacción siguen viviendo en el SVG de arriba.
    var texCanvas = document.createElement('canvas');
    texCanvas.className = 'tl-globe-tex';
    globeEl.insertBefore(texCanvas, globeEl.firstChild);
    var svgNode = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    globeEl.insertBefore(svgNode, texCanvas.nextSibling);
    var svg = d3.select(svgNode);
    var W = globeEl.clientWidth, H = globeEl.clientHeight;
    svg.attr('viewBox', '0 0 ' + W + ' ' + H);

    // Día/noche por hora local (se decide una vez al pintar; capas estáticas)
    var tlHour = new Date().getHours();
    var tlNight = (tlHour >= 19 || tlHour < 7);
    var tlWrap = globeEl.closest('.tl-mapa-globe-wrap');
    if (tlWrap) tlWrap.classList.add(tlNight ? 'tl-night' : 'tl-day');

    // Defs
    var defs = svg.append('defs');
    var oceanGrad = defs.append('radialGradient')
      .attr('id', 'oceanGradient-tl')
      .attr('cx','40%').attr('cy','38%').attr('r','65%');
    if (tlNight) {
      oceanGrad.append('stop').attr('offset','0%').attr('stop-color','#2f5d88');
      oceanGrad.append('stop').attr('offset','55%').attr('stop-color','#1c3c60');
      oceanGrad.append('stop').attr('offset','100%').attr('stop-color','#081426');
    } else {
      oceanGrad.append('stop').attr('offset','0%').attr('stop-color','#4a83b3');
      oceanGrad.append('stop').attr('offset','55%').attr('stop-color','#32608a');
      oceanGrad.append('stop').attr('offset','100%').attr('stop-color','#13304e');
    }

    var radius = Math.min(W, H) * 0.48;
    var projection = d3.geoOrthographic()
      .scale(radius)
      .translate([W/2, H/2])
      .clipAngle(90)
      .rotate([95, -15, 0]);
    var path = d3.geoPath(projection);
    var g = svg.append('g');

    // ── Textura: reproyección de la foto equirectangular a la vista actual.
    // Cuesta solo cuando la rotación cambia (carga, arrastre, animateTo);
    // en reposo, cero. quality<1 = borrador rápido durante el movimiento. ──
    var TL_EARTH_TEX_B64 = null; // (la v1 incrustaba la textura en base64; aquí se usa earth-tex.jpg)
    if (!window.__tlEarthTex) {
      window.__tlEarthTex = { data: null };
      var texImg = new Image();
      texImg.onload = function() {
        var c = document.createElement('canvas');
        c.width = texImg.naturalWidth; c.height = texImg.naturalHeight;
        var cx2 = c.getContext('2d', { willReadFrequently: true });
        cx2.drawImage(texImg, 0, 0);
        try { window.__tlEarthTex.data = cx2.getImageData(0, 0, c.width, c.height); }
        catch (e) { window.__tlEarthTex.data = null; }
        document.dispatchEvent(new Event('tl-earth-tex'));
      };
      // En file:// el canvas no puede leer pixeles de una imagen externa
      // (taint); incrustada como data URI no hay restriccion.
      texImg.src = 'earth-tex.jpg';
    }
    function tlTexRender(quality) {
      var tex = window.__tlEarthTex && window.__tlEarthTex.data;
      if (!tex || !texCanvas) return;
      var wrapT = globeEl.closest('.tl-mapa-globe-wrap');
      if (wrapT && !wrapT.classList.contains('tl-texture')) wrapT.classList.add('tl-texture');
      var q = Math.min(quality || 1, 1);
      var cw = globeEl.clientWidth, ch = globeEl.clientHeight;
      var s = q * Math.min(window.devicePixelRatio || 1, 1.5);
      var pw = Math.max(48, Math.round(cw * s)), ph = Math.max(48, Math.round(ch * s));
      if (texCanvas.width !== pw || texCanvas.height !== ph) {
        texCanvas.width = pw; texCanvas.height = ph;
      }
      var ctx = texCanvas.getContext('2d');
      var out = ctx.createImageData(pw, ph);
      var od = out.data, td = tex.data, tw = tex.width, th = tex.height;
      var tr = projection.translate(), R = projection.scale();
      var cx = tr[0] * s, cy = tr[1] * s, Rs = R * s;
      var inv = projection.invert;
      var x0 = Math.max(0, Math.floor(cx - Rs)), x1 = Math.min(pw, Math.ceil(cx + Rs));
      var y0 = Math.max(0, Math.floor(cy - Rs)), y1 = Math.min(ph, Math.ceil(cy + Rs));
      for (var py = y0; py < y1; py++) {
        for (var px = x0; px < x1; px++) {
          var dx = (px - cx) / Rs, dy = (py - cy) / Rs;
          var rr = dx * dx + dy * dy;
          if (rr > 1) continue;
          var ll = inv([px / s, py / s]);
          if (!ll || isNaN(ll[0])) continue;
          var u = Math.min(tw - 1, Math.max(0, ((ll[0] + 180) / 360 * tw) | 0));
          var v = Math.min(th - 1, Math.max(0, ((90 - ll[1]) / 180 * th) | 0));
          var ti = (v * tw + u) * 4, oi = (py * pw + px) * 4;
          od[oi] = td[ti]; od[oi + 1] = td[ti + 1]; od[oi + 2] = td[ti + 2];
          // borde antialiasado del disco
          od[oi + 3] = rr > 0.985 ? Math.max(0, Math.min(255, ((1 - Math.sqrt(rr)) * Rs * 2) * 255)) | 0 : 255;
        }
      }
      ctx.putImageData(out, 0, 0);
    }
    container._tlTexRender = tlTexRender;
    document.addEventListener('tl-earth-tex', function() { tlTexRender(1); });

    // Sphere
    g.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d', path);
    g.append('path').datum(d3.geoGraticule().step([15,15])()).attr('class','graticule').attr('d', path);

    var ISO_NUM_TO_A2 = {
      "032":"AR","068":"BO","076":"BR","124":"CA","152":"CL","170":"CO","188":"CR","192":"CU",
      "214":"DO","218":"EC","222":"SV","320":"GT","332":"HT","340":"HN","388":"JM","484":"MX",
      "558":"NI","591":"PA","600":"PY","604":"PE","630":"PR","724":"ES","780":"TT","840":"US",
      "858":"UY","862":"VE","250":"FR","276":"DE","620":"PT","380":"IT","826":"GB","528":"NL",
      "372":"IE","056":"BE","752":"SE","578":"NO","246":"FI","208":"DK","040":"AT","756":"CH",
      "616":"PL","203":"CZ","348":"HU","100":"BG","642":"RO","300":"GR","792":"TR",
      "643":"RU","156":"CN","392":"JP","410":"KR","356":"IN","360":"ID","608":"PH","704":"VN",
      "764":"TH","458":"MY","504":"MA","012":"DZ","788":"TN","818":"EG","710":"ZA","566":"NG"
    };
    function countryA2(d) { return ISO_NUM_TO_A2[String(d.id).padStart(3,'0')]; }

    // Países con eventos en el set actual (para picarlos en la portada)
    var paisConEventos = {};
    events.forEach(function(ev){ if (ev.lugar && ev.lugar.pais) paisConEventos[ev.lugar.pais] = 1; });

    var countries = topojson.feature(world, world.objects.countries);
    var countryPaths = g.selectAll('path.land')
      .data(countries.features)
      .enter().append('path')
      .attr('class', function(d) {
        var cc = countryA2(d);
        return 'land' + (cc && paisConEventos[cc] ? ' has-ev' : '');
      })
      .attr('d', path)
      .on('click', function(_, d) {
        // En portada: picar un país abre la vista completa filtrada a ese país.
        if (!tlPortadaActive()) return;
        var cc = countryA2(d);
        if (!cc || !paisConEventos[cc]) return;
        tlGo('#/pais/' + cc);
      })
      .on('mousemove', function(event, d) {
        // Nombre del país al pasar el mouse (solo en portada)
        if (!tlPortadaActive()) return;
        var cc = countryA2(d);
        var tip = container.querySelector('.tlp-pais-tip');
        if (!tip) return;
        if (!cc || !paisConEventos[cc]) { tip.classList.remove('show'); return; }
        tip.textContent = (typeof tlPaisLabel === 'function' ? tlPaisLabel(cc) : cc);
        var dashR = tip.parentElement.getBoundingClientRect();
        tip.style.left = (event.clientX - dashR.left + 16) + 'px';
        tip.style.top = (event.clientY - dashR.top - 12) + 'px';
        tip.classList.add('show');
      })
      .on('mouseout', function() {
        var tip = container.querySelector('.tlp-pais-tip');
        if (tip) tip.classList.remove('show');
      });

    // Mexico states layer — drawn ON TOP of land so a single state can be
    // highlighted in region/pais events with region_codigo 'MX-XXX'.
    // INEGI numeric state code → ISO 3166-2 alpha-3 suffix.
    var INEGI_TO_ISO = {
      1:'AGU', 2:'BCN', 3:'BCS', 4:'CAM', 5:'COA', 6:'COL', 7:'CHP', 8:'CHH',
      9:'CMX', 10:'DUR', 11:'GUA', 12:'GRO', 13:'HID', 14:'JAL', 15:'MEX', 16:'MIC',
      17:'MOR', 18:'NAY', 19:'NLE', 20:'OAX', 21:'PUE', 22:'QUE', 23:'ROO', 24:'SLP',
      25:'SIN', 26:'SON', 27:'TAB', 28:'TAM', 29:'TLA', 30:'VER', 31:'YUC', 32:'ZAC'
    };
    var stateByCode = {};
    var statePaths = null;
    if (mxStates && mxStates.features) {
      mxStates.features.forEach(function(f) {
        var iso = INEGI_TO_ISO[f.properties.state_code];
        if (iso) {
          f.__iso = iso;
          stateByCode[iso] = f;
        }
      });
      statePaths = g.selectAll('path.mx-state')
        .data(mxStates.features)
        .enter().append('path')
        .attr('class', 'mx-state')
        .attr('d', path);
    }

    // No jitter — pins stack exactly at coords. Selected pin is on top.
    var pinData = [];
    events.forEach(function(ev) {
      if (ev.lugar.tipo !== 'punto') return;
      if (!ev.lugar.coords) return;
      pinData.push({ev: ev});
    });

    function pinTransform(d) {
      var c = projection([d.ev.lugar.coords.lng, d.ev.lugar.coords.lat]);
      if (!c) return 'translate(-9999,-9999)';
      return 'translate(' + c[0] + ',' + c[1] + ')';
    }
    function isVisible(lng, lat) {
      var r = projection.rotate();
      var λ = lng * Math.PI / 180, φ = lat * Math.PI / 180;
      var λ0 = -r[0] * Math.PI / 180, φ0 = -r[1] * Math.PI / 180;
      var cosΔ = Math.sin(φ) * Math.sin(φ0) + Math.cos(φ) * Math.cos(φ0) * Math.cos(λ - λ0);
      return cosΔ > 0.05;
    }

    var pinsLayer = g.append('g').attr('class','pins-layer');
    var NEEDLE_TOP = -13, BALL_CY = -15, BALL_R = 4.2, HIT_R = 14;
    var pins = pinsLayer.selectAll('g.pin')
      .data(pinData)
      .enter().append('g')
      .attr('class', function(d){ return 'pin ' + d.ev.scope; })
      .attr('transform', pinTransform)
      .on('click', function(_, d) {
        // En portada: picar el mundo abre la vista completa en ese evento.
        if (tlPortadaActive()) {
          tlGo('#/evento/' + d.ev._id);
          return;
        }
        // Clicking a pin jumps to that event; if playing, keep playing and move
        // the voice there (same as clicking an event in the timeline list).
        navTo(d.ev._idx);
      });
    // Invisible hit area — generous radius so taps/clicks land easily.
    pins.append('circle').attr('class','pin-hit').attr('cx',0).attr('cy', BALL_CY).attr('r', HIT_R);
    pins.append('circle').attr('class','pin-halo').attr('cx',0).attr('cy', BALL_CY).attr('r', 6);
    pins.append('line').attr('class','needle').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2', NEEDLE_TOP);
    pins.append('circle').attr('class','ball').attr('cx',0).attr('cy', BALL_CY).attr('r', BALL_R);
    // ── Lugares (solo portada): los sitios con más eventos titilan sobre el
    // globo; al pasar dicen su nombre y al picarlos abren sus eventos. ──
    var lugaresSel = null;
    if (tlPortadaActive() && TD.idx && TD.idx.lugares) {
      var lugList = TD.idx.lugares.filter(function(l) { return l.p && l.s !== 'mexico' && l.s !== 'estados-unidos'; });
      var lugMax = lugList.length ? lugList[0].c : 1;
      var lugTip = function(on, event, d) {
        var tip = container.querySelector('.tlp-pais-tip');
        if (!tip) return;
        if (!on) { tip.classList.remove('show'); return; }
        tip.innerHTML = '<b>' + bhe(d.n) + '</b> · ' + d.c.toLocaleString('es-MX') + ' eventos';
        var dashR = tip.parentElement.getBoundingClientRect();
        tip.style.left = (event.clientX - dashR.left + 16) + 'px';
        tip.style.top = (event.clientY - dashR.top - 12) + 'px';
        tip.classList.add('show');
      };
      lugaresSel = g.append('g').attr('class', 'tlp-lugares').selectAll('g.tlp-lugar')
        .data(lugList).enter().append('g')
        .attr('class', 'tlp-lugar')
        .attr('tabindex', 0).attr('role', 'button')
        .attr('aria-label', function(d) { return d.n + ', ' + d.c + ' eventos'; })
        .on('click', function(event, d) { event.stopPropagation(); lugTip(false); tlGo('#/lugar/' + d.s); })
        .on('keydown', function(event, d) { if (event.key === 'Enter') tlGo('#/lugar/' + d.s); })
        .on('mousemove', function(event, d) { lugTip(true, event, d); })
        .on('mouseout', function() { lugTip(false); });
      lugaresSel.append('circle').attr('class', 'tlp-lugar-hit').attr('r', 10);
      lugaresSel.append('circle').attr('class', 'tlp-lugar-halo')
        .attr('r', function(d) { return 4 + 9 * Math.sqrt(d.c / lugMax); })
        .style('animation-delay', function(d, i) { return ((i * 0.73) % 6).toFixed(2) + 's'; });
      lugaresSel.append('circle').attr('class', 'tlp-lugar-dot')
        .attr('r', function(d) { return 1.7 + 2.3 * Math.sqrt(d.c / lugMax); });
    }

    // ── Active-event label that lives on the map ──
    var labelLayer = g.append('g').attr('class','label-layer');
    var labelEl = labelLayer.append('text')
      .attr('class', 'tl-mapa-label hidden')
      .attr('text-anchor', 'middle');
    var currentLabelData = null; // { lng, lat, type: 'point' | 'centroid', text, scope }

    function updateLabel() {
      if (!currentLabelData) { labelEl.classed('hidden', true); positionFloatingCitas(null); return; }
      var d = currentLabelData;
      var anchorX, anchorY;
      if (d.type === 'point') {
        var c = projection([d.lng, d.lat]);
        if (!c) { labelEl.classed('hidden', true); positionFloatingCitas(null); return; }
        labelEl.attr('x', c[0]).attr('y', c[1] - 28);  // above the pin ball
        anchorX = c[0]; anchorY = c[1];
      } else if (d.type === 'state' && d.stateFeat) {
        var bbS = path.bounds(d.stateFeat);
        if (!bbS || isNaN(bbS[0][0]) || isNaN(bbS[1][1])) { labelEl.classed('hidden', true); positionFloatingCitas(null); return; }
        var xS = (bbS[0][0] + bbS[1][0]) / 2;
        var yS = bbS[1][1] + 14;
        labelEl.attr('x', xS).attr('y', yS);
        anchorX = xS; anchorY = (bbS[0][1] + bbS[1][1]) / 2;
      } else {
        // Below the country: horizontally centered on bounding box, just under the south edge
        var feat = countries.features.find(function(f) { return countryA2(f) === d.pais; });
        if (!feat) { labelEl.classed('hidden', true); positionFloatingCitas(null); return; }
        var bb = path.bounds(feat);
        if (!bb || isNaN(bb[0][0]) || isNaN(bb[1][1])) { labelEl.classed('hidden', true); positionFloatingCitas(null); return; }
        var x = (bb[0][0] + bb[1][0]) / 2;
        var y = bb[1][1] + 20;
        labelEl.attr('x', x).attr('y', y);
        anchorX = x; anchorY = (bb[0][1] + bb[1][1]) / 2;
      }
      var visible = isVisible(d.lng, d.lat);
      labelEl.text(d.text)
        .classed('mundo', d.scope === 'mundo')
        .classed('hidden', !visible);
      positionFloatingCitas(visible ? {x: anchorX, y: anchorY} : null);
    }

    // Position cita cards and thumbs around the pin, avoiding the detalle
    // overlay, the lugar label, and each card's footprint. Two modes:
    //  - Citas ON  → ALL N cards visible, distributed around the pin
    //  - Citas OFF → all thumbs on a right rail; the active thumb's card
    //                pops to its left (.tl-mapa-cita-popup)
    function positionFloatingCitas(anchor) {
      var layer = container.querySelector('#tl-mapa-citas-layer');
      if (!layer) return;
      var cards = layer.querySelectorAll('.tl-mapa-floating-cita');
      var thumbs = layer.querySelectorAll('.tl-mapa-cita-thumb');
      var globeEl = container.querySelector('#tl-mapa-globe');
      var globeW = globeEl ? globeEl.clientWidth : W;
      var globeH = globeEl ? globeEl.clientHeight : H;
      if (!anchor) {
        // Evento sin ubicación (ej. Big Bang): no hay pin, pero igual mostramos
        // las citas en una rejilla centrada a la derecha del panel de detalle.
        thumbs.forEach(function(t) { t.classList.remove('show'); });
        if (!cards.length) return;
        var fCW = layer.classList.contains('tl-citas-pair') ? 360 : (layer.classList.contains('tl-citas-many') ? 280 : 320);
        var fCH = layer.classList.contains('tl-citas-pair') ? 170 : (layer.classList.contains('tl-citas-many') ? 140 : 150);
        var fgap = 16, fx0 = Math.round(globeW * 0.40);
        var favail = globeW - fx0 - 16;
        var fcols = Math.max(1, Math.min(cards.length, Math.floor((favail + fgap) / (fCW + fgap))));
        var frows = Math.ceil(cards.length / fcols);
        var fstartY = Math.max(16, (globeH - (frows * fCH + (frows - 1) * fgap)) / 2);
        cards.forEach(function(card, i) {
          var rr = Math.floor(i / fcols), cc = i % fcols;
          card.style.left = Math.round(fx0 + cc * (fCW + fgap)) + 'px';
          card.style.top = Math.round(Math.min(fstartY + rr * (fCH + fgap), globeH - fCH - 8)) + 'px';
          card.classList.add('show');
        });
        return;
      }
      var citasOff = globeEl && globeEl.classList.contains('no-citas');
      // Card width depends on the count tier set on the layer
      var CARD_W = 320, CARD_H = 150;
      if (layer.classList.contains('tl-citas-pair')) { CARD_W = 360; CARD_H = 170; }
      else if (layer.classList.contains('tl-citas-many')) { CARD_W = 280; CARD_H = 140; }
      var PAD = 10;

      // Build the avoidance list: detalle overlay + label + right-side thumb rail
      var avoid = [];
      var detalleEl = container.querySelector('#tl-mapa-detalle.show');
      var gRect = globeEl ? globeEl.getBoundingClientRect() : null;
      if (detalleEl && gRect) {
        var dRect = detalleEl.getBoundingClientRect();
        avoid.push({
          left: dRect.left - gRect.left - PAD,
          top: dRect.top - gRect.top - PAD,
          right: dRect.right - gRect.left + PAD,
          bottom: dRect.bottom - gRect.top + PAD
        });
      }
      // (tiempo.html) tampoco encima del botón de plegar/desplegar citas
      var ctgEl = container.querySelector('#tl-mapa-citas-toggle:not([hidden])');
      if (ctgEl && gRect) {
        var tgR = ctgEl.getBoundingClientRect();
        if (tgR.width) avoid.push({ left: tgR.left - gRect.left - PAD, top: tgR.top - gRect.top - PAD, right: tgR.right - gRect.left + PAD, bottom: tgR.bottom - gRect.top + PAD });
      }
      if (thumbs.length > 0 && citasOff) {
        avoid.push({ left: globeW - 64, top: 0, right: globeW, bottom: globeH });
      }
      var labelTextEl = container.querySelector('.tl-mapa-label:not(.hidden)');
      if (labelTextEl && gRect) {
        try {
          var lBox = labelTextEl.getBoundingClientRect();
          avoid.push({
            left: lBox.left - gRect.left - PAD,
            top: lBox.top - gRect.top - PAD,
            right: lBox.right - gRect.left + PAD,
            bottom: lBox.bottom - gRect.top + PAD
          });
        } catch(e) {}
      }

      function fitsAt(x, y, w, h) {
        if (x < 4 || y < 4 || x + w > globeW - 4 || y + h > globeH - 4) return false;
        for (var a = 0; a < avoid.length; a++) {
          var r = avoid[a];
          if (x + w > r.left && x < r.right && y + h > r.top && y < r.bottom) return false;
        }
        return true;
      }

      var THUMB_W = 44, THUMB_H = 66, THUMB_GAP = 6;

      // ── Citas OFF: hide all cards, render the thumb rail, then place popup ──
      if (citasOff) {
        cards.forEach(function(c) {
          c.classList.remove('show');
          c.style.left = ''; c.style.top = '';
        });
        var nThumbs = thumbs.length;
        if (nThumbs === 0) return;
        var rightEdge = globeW - THUMB_W - 12;
        var totalH = nThumbs * THUMB_H + (nThumbs - 1) * THUMB_GAP;
        var startY = Math.max(56, (globeH - totalH) / 2);
        if (startY + totalH > globeH - 60) startY = Math.max(56, globeH - 60 - totalH);
        var thumbTopByIdx = {};
        thumbs.forEach(function(t, k) {
          var ty = startY + k * (THUMB_H + THUMB_GAP);
          t.style.left = rightEdge + 'px';
          t.style.top = ty + 'px';
          t.classList.add('show');
          var idxStr = t.getAttribute('data-group-idx');
          if (idxStr) thumbTopByIdx[idxStr] = ty;
        });
        // Popup card lands to the LEFT of its thumb
        var popupCard = layer.querySelector('.tl-mapa-floating-cita.tl-mapa-cita-popup');
        if (popupCard) {
          var pIdx = popupCard.getAttribute('data-group-idx');
          var py = thumbTopByIdx[pIdx] != null ? thumbTopByIdx[pIdx] : startY;
          py = Math.max(8, Math.min(globeH - CARD_H - 8, py - (CARD_H - THUMB_H) / 2));
          var px = rightEdge - CARD_W - 14;
          px = Math.max(8, px);
          popupCard.style.left = px + 'px';
          popupCard.style.top = py + 'px';
          popupCard.classList.add('show');
        }
        return;
      }

      // ── Citas ON: hide thumbs, fan all cards around the pin ──
      thumbs.forEach(function(t) { t.classList.remove('show'); });

      // Compass-rose slot list (priority order around the pin):
      // right-upper, right-lower, left-upper, left-lower, far-right stack, far-left stack
      var GAP = 70;
      var baseSlots = [
        {dx:  GAP,             dy: -CARD_H - 8},
        {dx:  GAP,             dy: 12},
        {dx: -GAP - CARD_W,    dy: -CARD_H - 8},
        {dx: -GAP - CARD_W,    dy: 12},
        {dx:  GAP,             dy: -CARD_H * 2 - 20},
        {dx:  GAP,             dy: CARD_H + 24},
        {dx: -GAP - CARD_W,    dy: -CARD_H * 2 - 20},
        {dx: -GAP - CARD_W,    dy: CARD_H + 24}
      ];

      cards.forEach(function(card, i) {
        // Rotate priority per card so consecutive cards prefer different quadrants

    function narratedCitas(ev) {

      if (!tlFilter.libros.size && !(tlFilter.autores && tlFilter.autores.size)) return todas;
      var propias = todas.filter(function(p) {
        return citaMatchesTlFilter(p.c) && rutaVentanaOk(p.c.libro, ev.year, p.c);

    function pickCitas(pairs) {
      if (pairs.length <= 4) return pairs;

      return idxs.slice(0, 4).sort(function(a, b) { return a - b; }).map(function(i) { return pairs[i]; });

    function eventSegments(ev) {
      var segs = [{ text: speakNumbers(speakYear(ev.year) + '.'), lang: 'es', role: 'fecha' }];

      // en inglés — se detecta para que no los lea una voz en español.
      if (ev.text) segs.push({ text: speakNumbers(ev.text + '.'), lang: detectLang(ev.text), role: 'evento' });
      if (ev.detalle) segs.push({ text: speakNumbers(ev.detalle), lang: detectLang(ev.detalle), role: 'descripcion' });
      var picked = pickCitas(narratedCitas(ev));
      var prevSpeaker = null;
      picked.forEach(function(p) {
        var c = p.c, speaker = speakerFor(c), qLang = detectLang(c.texto);
        if (speaker && speaker !== prevSpeaker) {
          // Arranca con "Según" (claramente español) para que el motor no
          // detecte inglés por el nombre y lea "dice" como "dies".
          segs.push({ text: speakNumbers('Según ' + speaker + (qLang === 'en' ? ', en inglés:' : ':')), lang: 'es', role: 'cita', citaIdx: p.idx });
        } else if (!speaker && prevSpeaker === null) {
          segs.push({ text: 'Cita:', lang: 'es', role: 'cita', citaIdx: p.idx });
        }
        segs.push({ text: speakNumbers(c.texto), lang: qLang, role: 'cita', citaIdx: p.idx, isQuote: true });

    // play walkthrough is running it resumes (advances) after reading.
    function readClicked(segs) {

    // Exposed so the delegated click handler (different scope) can trigger a

      var det = targetEl.closest('#tl-mapa-detalle');
      if (det) {

        var t = body ? body.textContent.trim() : '';
        if (t) readClicked([{ text: speakNumbers(t), lang: detectLang(t), role: 'descripcion' }]);
        return !!t;
      }
      var card = targetEl.closest('.tl-mapa-floating-cita');
      if (card) {
        var segs = [];
        Array.prototype.forEach.call(card.querySelectorAll('.tl-mapa-floating-cita-text'), function(el) {
          var t = el.textContent.replace(/[“”"]/g, '').trim();
          if (!t) return;
          var ci = parseInt(el.getAttribute('data-cita-idx'));
          segs.push({ text: speakNumbers(t), lang: detectLang(t), role: 'cita', citaIdx: isNaN(ci) ? null : ci, isQuote: true });

    function startPresent() {

  // ── Timeline eras data: evaluated ONCE at load (was re-evaluated on every render) ──

  function openRuta(rutaId) {

      arcHTML = '<div class="ruta2-arc" title="Épocas que recorre esta ruta">' +

        }).join('') +
      '</div>';
    }
    var stepsHTML = ruta.steps.map(function(step, i) {
      var book = BOOK_BY_ID[step.bookId];
      if (!book) return '';
      var chip = chips[i];
      var chipHTML = chip ? '<span class="ruta2-chip" style="--ac:'+chip.color+'">'+bhe(chip.label)+'</span>' : '';
      var t = String(book.tesis || '');
      if (t.length > 220) t = t.slice(0, 218).replace(/\s+\S*$/, '') + '…';
      var tesis = t ? '<div class="ruta2-tesis">' + bhe(t) + '</div>' : '';
      var qt = String(book.q0 || '');
      if (qt.length > 190) qt = qt.slice(0, 188).replace(/\s+\S*$/, '') + '…';
      var quote = qt ? '<div class="ruta2-quote">«' + bhe(qt) + '»</div>' : '';
      return '<div class="ruta2-step" style="animation-delay:'+(i*0.07)+'s">' +
        '<div class="ruta2-rail"><div class="ruta2-num" style="--ac:'+(chip?chip.color:'var(--gold)')+'">'+(i+1)+'</div>'+
          (i < ruta.steps.length-1 ? '<div class="ruta2-railline"></div>' : '')+'</div>' +
        '<a class="ruta2-card" href="' + V2 + '#/libro/' + encodeURIComponent(book.id) + '">' +
          '<div class="ruta2-coverbox">'+getCoverHTML(book, 'small')+'</div>' +
          '<div class="ruta2-body">' +
            '<div class="ruta2-toprow">'+chipHTML+'<span class="ruta2-year">'+bhe(String(book.year||''))+'</span></div>' +
            '<h4 class="ruta2-title">'+bhe(book.title)+'</h4>' +
            '<div class="ruta2-author">'+bhe(book.author||'')+'</div>' +
            '<div class="ruta2-reason">'+bhe(step.reason||'')+'</div>' +
            tesis + quote +

        '</a>' +

      return r2.id !== ruta.id && r2.steps.some(function(st){ return ids[st.bookId]; });
    }).slice(0, 3);
    var relHTML = rel.length ? ('<div class="ruta2-next"><div class="ruta2-next-t">Si esta ruta te atrapó, sigue por</div>' +
      rel.map(function(r2){
        return '<a class="ruta2-next-chip" href="#/ruta/' + encodeURIComponent(r2.id) + '">' + bhe(r2.title) + '</a>';

        '<button class="back-btn" type="button" onclick="closeRuta()">← Volver al recorrido</button>' +
        '<div class="ruta-header">' +
          '<div class="tl-kicker">Recorrido · ' + ruta.steps.length + ' libros</div>' +
          '<h2>'+bhe(ruta.title)+'</h2>' +
          '<div class="ruta-desc-detail">'+bhe(ruta.desc)+'</div>' +

  function closeRuta() {

  // ══════════════════════════════════════════════
  // RUTAS (hash): #/ · #/explorar · #/era/<i> · #/evento/<era>-<idx> ·
  // #/libro/<id> · #/ruta/<id> · #/personaje/<id> · #/termino/<id> ·
  // #/autor/<nombre> · #/pais/<CC>   (+ ?ev=<era>-<idx> para el evento activo)
  // ══════════════════════════════════════════════
  function tlSlug(s) { return tlNormalize(s).replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
  function tlLugarBySlug(sl) { return (TD.idx.lugares || []).find(function(l) { return l.s === sl; }) || null; }
  function emptyFilter() { return { q:'', libros:new Set(), paises:new Set(), autores:new Set(), fuentes:new Set() }; }
  function defaultFilter() { var f = emptyFilter(); f.paises.add('MX'); return f; }
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var qs = '', qi = h.indexOf('?');
    if (qi >= 0) { qs = h.slice(qi + 1); h = h.slice(0, qi); }
    var parts = h.split('/').filter(Boolean).map(function(p) { try { return decodeURIComponent(p); } catch(e) { return p; } });
    return { parts: parts, params: new URLSearchParams(qs) };
  }
  // Hash canónico para el estado actual (lo escribe writeFilterToURL).
  function hashForState(f, evId) {
    var h;
    if (tlRuta) h = '#/ruta/' + encodeURIComponent(tlRuta);
    else if (!tlPortadaDismissed && (filterIsEmpty(f) || tlFilterDefault)) h = '#/';
    else {
      var onlyLib = f.libros.size === 1 && !f.q && !f.paises.size && !f.autores.size && !(f.fuentes && f.fuentes.size);
      var onlyAut = f.autores.size === 1 && !f.q && !f.paises.size && !f.libros.size && !(f.fuentes && f.fuentes.size);
      var onlyPais = f.paises.size === 1 && !f.q && !f.libros.size && !f.autores.size && !(f.fuentes && f.fuentes.size);
      var onlyQ = f.q && !f.paises.size && !f.libros.size && !f.autores.size && !(f.fuentes && f.fuentes.size) && !f.lugar;
      var onlyLugar = f.lugar && !f.q && !f.paises.size && !f.libros.size && !f.autores.size && !(f.fuentes && f.fuentes.size);
      if (f.lugar && !onlyLugar) { onlyLib = onlyAut = onlyPais = false; }
      var per = onlyQ && tlPersonajes.find(function(p) { return tlNormalize(p.nombre) === tlNormalize(f.q); });
      var ter = onlyQ && !per && tlTerminos.find(function(t) { return tlNormalize(t.termino) === tlNormalize(f.q); });
      if (onlyLugar) h = '#/lugar/' + encodeURIComponent(f.lugar.s);
      else if (onlyLib) h = '#/libro/' + encodeURIComponent(Array.from(f.libros)[0]);
      else if (onlyAut) h = '#/autor/' + encodeURIComponent(Array.from(f.autores)[0]);
      else if (per) h = '#/personaje/' + tlSlug(per.nombre);
      else if (ter) h = '#/termino/' + tlSlug(ter.termino);
      else if (onlyPais && tlFilterDefault) h = '#/explorar';
      else if (onlyPais) h = '#/pais/' + Array.from(f.paises)[0];
      else {
        var u = new URLSearchParams();
        if (f.q) u.set('q', f.q);
        if (f.libros.size) u.set('libros', Array.from(f.libros).join(','));
        if (f.paises.size) u.set('paises', Array.from(f.paises).join(','));
        if (f.autores.size) u.set('autores', Array.from(f.autores).join('|'));
        if (f.fuentes && f.fuentes.size) u.set('fuentes', Array.from(f.fuentes).join(','));
        if (f.lugar) u.set('lugar', f.lugar.s);
        var s = u.toString();
        h = '#/explorar' + (s ? '?' + s : '');
        if (!s) h = '#/todo';
      }
    }
    // Sin filtro propio (lente MX o todo el tiempo) el evento manda: #/evento/<era>-<idx>
    if (evId && (h === '#/explorar' || h === '#/todo')) h = '#/evento/' + evId;
    else if (evId && h !== '#/') h += (h.indexOf('?') >= 0 ? '&' : '?') + 'ev=' + evId;
    return h;
  }
  var __tlLastHash = null;
  function tlSetHash(h, push) {
    if (location.hash === h || (h === '#/' && !location.hash)) { __tlLastHash = h; return; }
    __tlLastHash = h;
    if (push) history.pushState(null, '', h); else history.replaceState(null, '', h);
  }
  // Navegar (con historial) a un estado: lo pinta el router.
  function tlGo(h) {
    if (location.hash === h) { route(); return; }
    location.hash = h;
  }
  // Traduce el hash a estado de la línea del tiempo.
  function stateFromHash() {
    var r = parseHash(), p = r.parts, prm = r.params;
    var st = { filter: emptyFilter(), dismissed: true, ruta: null, select: null, isDefault: false };
    var k = p[0] || '';
    if (!k) { st.filter = defaultFilter(); st.dismissed = false; st.isDefault = true; }
    else if (k === 'explorar') {
      if (prm.get('q')) st.filter.q = prm.get('q');
      (prm.get('libros') || '').split(',').filter(Boolean).forEach(function(x){ st.filter.libros.add(x); });
      (prm.get('paises') || '').split(',').filter(Boolean).forEach(function(x){ st.filter.paises.add(x); });
      (prm.get('autores') || '').split('|').filter(Boolean).forEach(function(x){ st.filter.autores.add(x); });
      (prm.get('fuentes') || '').split(',').filter(Boolean).forEach(function(x){ st.filter.fuentes.add(x); });
      if (prm.get('lugar')) st.filter.lugar = tlLugarBySlug(prm.get('lugar'));
      if (filterIsEmpty(st.filter)) { st.filter = defaultFilter(); st.isDefault = true; }
    }
    else if (k === 'todo') { /* todo el tiempo, lente global */ }
    else if (k === 'era') { st.filter = defaultFilter(); st.isDefault = true; st.select = { era: parseInt(p[1]) || 0 }; }
    else if (k === 'evento') { st.select = { id: p[1] || '' }; st.evento = true; }
    else if (k === 'libro' && p[1]) st.filter.libros.add(p[1]);
    else if (k === 'autor' && p[1]) st.filter.autores.add(p[1]);
    else if (k === 'pais' && p[1]) st.filter.paises.add(p[1].toUpperCase());
    else if (k === 'lugar' && p[1]) st.filter.lugar = tlLugarBySlug(p[1]);
    else if (k === 'ruta' && p[1]) st.ruta = p[1];
    else if (k === 'personaje' && p[1]) {
      var per = tlPersonajes.find(function(x) { return tlSlug(x.nombre) === p[1]; });
      st.filter.q = per ? per.nombre : p[1].replace(/-/g, ' ');
    }
    else if (k === 'termino' && p[1]) {
      var ter = tlTerminos.find(function(x) { return tlSlug(x.termino) === p[1]; });
      st.filter.q = ter ? ter.termino : p[1].replace(/-/g, ' ');
    }
    else if (k === 'buscar' && p[1]) st.filter.q = p[1];
    else { st.filter = defaultFilter(); st.dismissed = false; st.isDefault = true; }
    if (prm.get('ev') && !st.select) st.select = { id: prm.get('ev') };
    return st;
  }
  var __routeSeq = 0;
  function route() {
    if (location.hash === __tlLastHash && __tlLastHash !== null && !route.force) return;
    route.force = false;
    __tlLastHash = location.hash;
    closeRuta();
    var st = stateFromHash();
    tlRuta = null;
    if (st.ruta) {
      var ruta = rutas.find(function(r){ return r.id === st.ruta; });
      if (ruta) {
        tlRuta = ruta.id;
        st.filter = emptyFilter();
        ruta.steps.forEach(function(s){ st.filter.libros.add(s.bookId); });
        st.filter._strict = true;
      }
    }
    tlFilter = st.filter;
    tlFilterDefault = !!st.isDefault;
    tlPortadaDismissed = st.dismissed;
    tlPendingSelect = st.select;
    // Época sin eventos en México (p. ej. Mundo antiguo): lente global.
    if (st.select && st.select.era != null && !TD.pins.some(function(x) { return x[0] === st.select.era && x[3] === 'MX'; })) {
      tlFilter = emptyFilter(); tlFilterDefault = false;
    }
    // Evento suelto: si no es de México, la lente MX no lo mostraría → todo el tiempo.
    if (st.evento && st.select && st.select.id) {
      var e = parseInt(st.select.id), pin = TD.pins.find(function(x) { return (x[0] + '-' + x[1]) === st.select.id; });
      if (pin && pin[3] === 'MX') { tlFilter = defaultFilter(); tlFilterDefault = true; }
    }
    renderTimelineView();
  }
  // El filtro vive en el hash (la v1 lo guardaba en ?q=&libros=…).
  function readFilterFromURL() { return defaultFilter(); }
  function writeFilterToURL(f) {
    tlFilterDefault = false;
    tlSetHash(hashForState(f), false);
  }
  // Evento activo → ?ev= en el hash (sin ensuciar el historial).
  var __evHashT = null;
  function tlNoteSelected(ev) {
    if (!ev || !ev._id) return;
    clearTimeout(__evHashT);
    __evHashT = setTimeout(function() { tlSetHash(hashForState(tlFilter, ev._id), false); }, 250);
  }

  // ══════════════════════════════════════════════
  // RENDER: asegura las eras que pide el filtro y pinta la vista mapa de la v1
  // ══════════════════════════════════════════════
  function renderTimelineView() {
    var container = document.getElementById('timeline-view');
    var seq = ++__routeSeq;
    var need = tlPortadaActive() ? [] : tdErasNeeded(tlFilter);
    var missing = need.filter(function(i) { return !TD.eraLoaded[i]; });
    if (!missing.length) return paint();
    // Cargando: velo sobre lo que haya en pantalla con una barra de avance.
    var veil = document.getElementById('tl-veil');
    veil.classList.add('on');
    __tdProgEl = veil; tdProgress();
    veil.querySelector('.tl-veil-t').textContent = 'Abriendo ' + need.reduce(function(a, i) { return a + TD.idx.eras[i].n; }, 0).toLocaleString('es-MX') + ' eventos…';
    tdLoadEras(missing).then(function() {
      if (seq !== __routeSeq) return;
      veil.classList.remove('on');
      paint();
    }, function(err) {
      veil.querySelector('.tl-veil-t').textContent = 'No se pudieron cargar los eventos (' + (err && err.message || err) + ').';
    });
    function paint() {
      document.body.classList.toggle('tl-en-portada', tlPortadaActive());
      try {
        renderTimelineMapaView(container, timelineEras, 'ambos');
      } catch (err) {
        console.error('[tiempo] render', err);
        container.innerHTML = '<div class="tl-fail">La línea del tiempo falló al cargar: ' + bhe(err && err.message || err) + '</div>';
      }
    }
  }

  // ══════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════
  tdBoot().then(function() {
    loadMapaDeps();                       // globo en paralelo
    __tlLastHash = null; route.force = true;
    route();
    window.addEventListener('hashchange', function() { route(); });
    tdPrefetchIdle();
  }).catch(function(err) {
    console.error(err);
    document.getElementById('timeline-view').innerHTML = '<div class="tl-fail">No se pudo cargar la línea del tiempo: ' + bhe(err && err.message || err) + '</div>';
  });
  // ══════════════════════════════════════════════
  // Refinamientos de interacción (tiempo.html)
  // ══════════════════════════════════════════════
  (function() {
    var view = document.getElementById('timeline-view');
    // ── Tooltip propio para las puertas de la portada (el title nativo tarda y se ve pobre) ──
    var tip = document.createElement('div');
    tip.className = 'tlp-tip'; tip.setAttribute('role', 'tooltip');
    document.body.appendChild(tip);
    var HINT = { q: 'Ver sus eventos', autor: 'Ver los eventos que citan sus libros', libro: 'Ver los eventos que cita este libro',
      ruta: 'Recorrer esta ruta en el tiempo', era: 'Ir a esta época', evento: 'Abrir este evento', explorar: 'Todos los eventos, en orden',
      sorpresa: 'Abrir un evento cualquiera', shuffle: 'Otra portada', 'rutas-todas': 'Ver todos los recorridos' };
    function tipFor(el) {
      if (el.title) { el.setAttribute('data-tip', el.title); el.removeAttribute('title'); }
      var t = el.getAttribute('data-tip') || '', dk = el.getAttribute('data-door'), b = '', rest = t;
      if (el.classList.contains('tlp-bubble')) {
        b = (el.querySelector('.tlp-bubble-n') || {}).textContent || '';
        if (el.classList.contains('tlp-bubble-per')) { rest = t; }
        else rest = t.replace(/^.*? — /, '') + ' en sus libros';
      } else if (el.classList.contains('tlp-term')) { b = el.textContent; rest = t; }
      else if (dk === 'libro' || dk === 'ruta' && el.classList.contains('tlp-crawl-item')) {
        var parts = t.split(' — ');
        b = dk === 'ruta' ? ((el.querySelector('.tlp-crawl-item-t') || {}).firstChild || {}).textContent || '' : parts[0];
        rest = dk === 'ruta' ? t : (parts[1] || '');
      } else if (dk === 'era') { var p = t.split(' · '); b = p[0]; rest = p[1] || ''; }
      else if (dk === 'evento' && el.classList.contains('tlp-tick-item')) { b = el.lastChild ? el.lastChild.textContent : ''; rest = t; }
      else { b = ''; }
      if (!b && !rest) rest = '';
      return (b ? '<b>' + bhe(b) + '</b>' : '') + (rest ? '<span>' + bhe(rest) + '</span>' : '') + (HINT[dk] ? '<em>' + HINT[dk] + '</em>' : '');
    }
    var tipEl = null;
    function placeTip(e) {
      var r = tip.getBoundingClientRect(), x = e.clientX + 16, y = e.clientY + 18;
      if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
      if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
      tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
    }
    if (window.matchMedia('(hover: hover)').matches) {
      view.addEventListener('mouseover', function(e) {
        var el = e.target.closest && e.target.closest('.tl-portada [data-door]');
        if (el === tipEl) return;
        tipEl = el;
        if (!el) { tip.classList.remove('show'); return; }
        var html = tipFor(el);
        if (!html) { tip.classList.remove('show'); return; }
        tip.innerHTML = html; placeTip(e); tip.classList.add('show');
      });
      view.addEventListener('mousemove', function(e) { if (tipEl) placeTip(e); });
      view.addEventListener('mouseleave', function() { tipEl = null; tip.classList.remove('show'); });
      view.addEventListener('click', function() { tipEl = null; tip.classList.remove('show'); }, true);
    }

    // ── La banda se detiene al tocarla (en touch no hay hover) ──
    var pausaT = null;
    view.addEventListener('touchstart', function(e) {
      var z = e.target.closest && e.target.closest('.tlp-zone-crawl');
      if (!z) return;
      var belt = z.querySelector('.tlp-crawl-belt');
      if (!belt) return;
      belt.classList.add('pausa');
      clearTimeout(pausaT);
      pausaT = setTimeout(function() { belt.classList.remove('pausa'); }, 5000);
    }, { passive: true });

    // ── Texto del evento plegable (deja ver el globo) ──
    var plegado = false;
    try { plegado = localStorage.getItem('tlDetPlegado') === '1'; } catch(e) {}
    function armaDetalle() {
      var det = view.querySelector('#tl-mapa-detalle');
      if (!det || det.querySelector('.tl-det-fold')) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tl-det-fold';
      b.innerHTML = tlSvg('<path d="M6 15l6-6 6 6"/>');
      b.title = 'Plegar / desplegar el texto';
      b.setAttribute('aria-label', 'Plegar o desplegar el texto del evento');
      det.insertBefore(b, det.firstChild);
      det.classList.toggle('plegado', plegado);
      b.addEventListener('click', function(e) {
        e.stopPropagation();
        plegado = !det.classList.contains('plegado');
        det.classList.toggle('plegado', plegado);
        try { localStorage.setItem('tlDetPlegado', plegado ? '1' : '0'); } catch(err) {}
        if (view._tlMapaRedraw) view._tlMapaRedraw();
      });
    }

    // ── La época del evento al azar se enciende en la barra ──
    function marcaEra() {
      var a = view.querySelector('.tlp-azar');
      if (!a) return;
      var era = String(a.getAttribute('data-ev') || '').split('-')[0];
      view.querySelectorAll('.tlp-seg').forEach(function(s) { s.classList.toggle('on', s.getAttribute('data-era') === era); });
    }
    var azarObs = new MutationObserver(marcaEra);
    new MutationObserver(function() {
      armaDetalle();
      var a = view.querySelector('.tlp-azar');
      if (a && !a.__obs) { a.__obs = true; azarObs.observe(a, { attributes: true, attributeFilter: ['data-ev'] }); marcaEra(); }
    }).observe(view, { childList: true, subtree: true });
  })();
</script>
