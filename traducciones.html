<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traducciones — Mexico Solidarity</title>
<!-- Static manifest so Chrome/Android captures the RIGHT start_url at install
     time (its start_url is index.html?view=traducciones). Installing from this
     page gives an app that always opens on Translations. -->
<link rel="manifest" href="pwa/manifest-traducciones.json">
<meta name="theme-color" content="#9f2241">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traducciones">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<link rel="icon" href="pwa/icon-192.png">
<style>
  :root{ --guinda:#9f2241; --cream:#fdfcf3; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Bodoni Moda',Didot,Georgia,serif;
    background:
      radial-gradient(ellipse at top, color-mix(in srgb,var(--guinda) 22%,transparent), transparent 60%),
      linear-gradient(180deg, #7a1a32, var(--guinda));
    color:var(--cream);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;gap:6px;
    -webkit-font-smoothing:antialiased;
  }
  .kick{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.72;font-weight:700;margin-bottom:10px}
  h1{font-size:clamp(34px,9vw,54px);line-height:1.02;margin:0;font-weight:800;letter-spacing:-.5px}
  .sub{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:15px;opacity:.82;margin:6px 0 26px}
  .open{
    display:inline-block;text-decoration:none;
    background:var(--cream);color:#1a1a1a;
    font-weight:700;font-size:17px;letter-spacing:.3px;
    padding:14px 34px;border-radius:999px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .open:active{transform:scale(.97)}
  .hint{
    max-width:340px;font-family:'Playfair Display',Georgia,serif;
    font-size:13px;line-height:1.5;opacity:.72;margin-top:26px;
  }
  .hint b{opacity:.95}
  .flag{margin-top:22px;height:4px;width:120px;border-radius:2px;
    background:linear-gradient(to right, #006847 0 33%, var(--cream) 33% 66%, var(--guinda) 66% 100%);opacity:.6}
</style>
</head>
<body>
  <div class="kick">Mexico Solidarity Media</div>
  <h1>Traducciones</h1>
  <div class="sub">Prensa mexicana, traducida al inglés</div>

  <a class="open" href="index.html?view=traducciones">Abrir traducciones</a>

  <p class="hint">
    Para tenerla como <b>app</b> que siempre abre aquí: menú de Chrome
    <b>⋮ → “Instalar app”</b> (o “Agregar a pantalla de inicio”) desde
    <b>esta</b> página. En iPhone/iPad: <b>Compartir → Agregar a inicio</b>.
  </p>
  <div class="flag" aria-hidden="true"></div>
</body>
</html>
