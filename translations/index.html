<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translations Queue · mexicosolidarity.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#0d0d0d;color:#e0ddd5;
  padding:40px 20px 80px;
  min-height:100vh;
}
.wrap{max-width:840px;margin:0 auto}
header{margin-bottom:32px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:28px;line-height:1.2;color:#e8e4da}
.count{font-size:13px;color:#6a6050;font-weight:500}
.list{display:flex;flex-direction:column;gap:10px}
.item{
  background:#1a1a1a;border:1px solid #2a2722;border-radius:10px;
  padding:18px 22px;text-decoration:none;color:inherit;
  display:block;transition:border-color .25s, transform .05s, box-shadow .25s;
}
.item:hover{border-color:#2a8a5a;opacity:1 !important;box-shadow:0 0 20px rgba(26,93,58,.15)}
.item:active{transform:scale(.998)}
.item .title{
  font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:18px;line-height:1.3;
  color:#e8e4da;margin-bottom:6px;
}
.item .original{
  font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:13.5px;
  color:#7a6d50;margin-bottom:10px;line-height:1.4;
}
.item .meta{
  display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#6a6050;
  align-items:center;
}
.item .meta .dot{color:#3a3530}
.empty{text-align:center;padding:60px 20px;color:#6a6050;font-size:14px}
.error{background:#2a1010;border:1px solid #5a2020;color:#e08080;padding:14px;border-radius:8px}
.recency{font-size:11px;color:#5a5040}
@media (max-width:600px){
  body{padding:24px 14px 60px}
  h1{font-size:22px}
  .item{padding:14px 16px}
  .item .title{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📰 Translations Queue</h1>
    <div class="count" id="count"></div>
  </header>
  <div class="list" id="list"></div>
</div>
<script>
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
let _all = [];

function timeAgo(ts){
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  const d = Math.floor(s/86400);
  if (d < 7) return d + 'd ago';
  if (d < 30) return Math.floor(d/7) + 'w ago';
  return Math.floor(d/30) + 'mo ago';
}


function render(){
  countEl.textContent = _all.length + ' translation' + (_all.length === 1 ? '' : 's');
  if (!_all.length) {
    listEl.innerHTML = '<div class="empty">Nothing here.</div>';
    return;
  }
  listEl.innerHTML = _all.map((x, i) => {
    const dateStr = x.original_date || '';
    const ago = x.last_modified ? timeAgo(x.last_modified) : '';
    // First 2 items full opacity, then fade from #3 onward
    const op = i < 2 ? 1 : Math.max(0.2, 1 - (i - 2) * 0.12);
    return `<a class="item" href="viewer.html?slug=${encodeURIComponent(x.slug)}" style="opacity:${op.toFixed(2)}">
      <div class="title">${escapeHtml(x.translated_title || x.slug)}</div>
      ${x.original_title ? `<div class="original">${escapeHtml(x.original_title)}</div>` : ''}
      <div class="meta">
        ${x.outlet ? `<span>${escapeHtml(x.outlet)}</span><span class="dot">·</span>` : ''}
        ${x.author ? `<span>${escapeHtml(x.author)}</span><span class="dot">·</span>` : ''}
        ${dateStr ? `<span>${dateStr}</span>` : ''}
        ${ago ? `<span class="recency" style="margin-left:auto">${ago}</span>` : ''}
      </div>
    </a>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

fetch('manifest.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    _all = (data || []).slice().sort((a,b) => (b.last_modified||0) - (a.last_modified||0));
    render();
  })
  .catch(err => {
    listEl.innerHTML = '<div class="error">Failed to load manifest: ' + escapeHtml(err.message) + '</div>';
  });
</script>
</body>
</html>
