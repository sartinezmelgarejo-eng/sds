<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Viewer — mexicosolidarity.com</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f5f1ea;color:#1a1a1a;font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;line-height:1.55;
}
.toolbar{
  position:sticky;top:0;z-index:50;
  background:#fff;border-bottom:1px solid #e5dfd2;
  padding:6px 10px;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.back{color:#999;text-decoration:none;font-size:18px;padding:4px 6px;line-height:1}
.toolbar-spacer{flex:1;min-width:4px}
.mode-toggle{
  display:inline-flex;background:#f0ebe0;border-radius:6px;padding:2px;gap:1px;
}
.mode-toggle button{
  border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:600;
  padding:5px 10px;border-radius:5px;cursor:pointer;color:#999;
  transition:background .15s, color .15s;
}
.mode-toggle button.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mode-toggle button.locked{background:#fff;color:#1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lock-icon{
  display:inline-block;font-size:9px;margin-left:2px;
  transition:transform .2s ease;
}
.lock-icon.locking{transform:scale(1.3);}
.tbtn{
  border:none;cursor:pointer;font-family:inherit;
  padding:5px 10px;border-radius:5px;font-size:11px;font-weight:600;
  white-space:nowrap;transition:background .15s;
}
.tbtn.t-title{background:#e8e4f0;color:#3a3a78}
.tbtn.t-title:hover{background:#d8d0e8}
.tbtn.t-body{background:#dceee4;color:#1a5d3a}
.tbtn.t-body:hover{background:#c8e0d0}
.tbtn.done{background:#0f7a44 !important;color:#fff !important}
.original-link{color:#1a5d3a;text-decoration:none;font-size:11px;font-weight:500;white-space:nowrap}
.original-link:hover{text-decoration:underline}
.save-indicator{
  font-size:10px;color:#7a9a82;opacity:0;transition:opacity .25s;width:0;overflow:hidden;
}
.save-indicator.show{opacity:1;width:auto}

/* ─── META FOOTER (cat + tags) ─── */
.meta-footer{
  max-width:780px;margin:0 auto;padding:0 32px 60px;
}
.meta-footer-inner{
  border-top:1px dashed #d5cdb8;padding-top:20px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.meta-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:#e8e0cc;border-radius:20px;
  padding:6px 14px;font-size:12px;color:#6a5d40;
  cursor:pointer;transition:background .15s;user-select:none;
}
.meta-pill:hover{background:#ddd4bc}
.meta-pill .label{font-weight:600;color:#8a7340;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.meta-pill .val{font-family:'Source Serif 4',serif;color:#4a3f28}

/* ─── PREVIEW MODE ─── */
.container{max-width:780px;margin:0 auto;padding:40px 32px 80px}
.article-title{
  font-family:'Source Serif 4',Georgia,serif;font-weight:600;
  font-size:30px;line-height:1.2;color:#1a1a1a;
  margin:0 0 24px;
}
#article-content{font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.75;color:#262422}
#article-content figure{margin:24px 0}
#article-content img{width:100%;height:auto;border-radius:4px}
#article-content figcaption{font-size:13px;color:#777;font-style:italic;margin-top:6px;font-family:'Inter',sans-serif}
#article-content p{margin:0 0 18px}
#article-content em{font-style:italic}
#article-content a{color:#1a5d3a;text-decoration:underline}
#article-content h1,#article-content h2{font-family:'Source Serif 4',serif;font-weight:600;margin:28px 0 14px;line-height:1.25}
#article-content blockquote{border-left:4px solid #1a5d3a;margin:28px 0;padding:6px 0 6px 22px;font-style:italic;color:#3a3a3a}
#article-content blockquote p{margin:0 0 8px}
#article-content blockquote p:last-child{margin:0}

/* Inline visual highlights (preview only, stripped on copy) */
.hl-acronym{
  background:linear-gradient(transparent 60%, rgba(180,140,90,.25) 60%);
  padding:0 1px;border-radius:2px;
  font-weight:600;color:#7a4a1a;
}
.hl-quote{
  background:linear-gradient(transparent 55%, rgba(26,140,80,.30) 55%);
  color:#0f5d2a;
  padding:0 2px;border-radius:2px;
  font-weight:500;
}
.hl-attribution{
  color:#888;
}
.hl-toggle{
  display:inline-flex;align-items:center;gap:5px;
  background:#faf7ef;border:1px solid #e0d8c4;border-radius:6px;
  padding:6px 10px;font-size:11px;color:#5a4a2a;
  cursor:pointer;user-select:none;
}
.hl-toggle.off{opacity:.5}
.hl-toggle input{margin:0;accent-color:#1a5d3a}
body.no-highlights .hl-acronym,
body.no-highlights .hl-quote{
  background:none;color:inherit;font-weight:inherit;
}

/* Editable highlight */
#article-content [contenteditable=true]{
  outline:none;
  transition:background .15s, box-shadow .15s;
}
#article-content [contenteditable=true]:hover{background:rgba(26,93,58,.04)}
#article-content [contenteditable=true]:focus{
  background:rgba(26,93,58,.08);
  box-shadow:inset 0 0 0 1px rgba(26,93,58,.3);
  border-radius:3px;
}

/* ─── COMPARE MODE ─── */
.compare-container{max-width:1400px;margin:0 auto;padding:24px 24px 80px;display:none}
body.mode-compare .container{display:none}
body.mode-compare .meta-footer{display:none}
body.mode-compare .compare-container{display:block}
.compare-title-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:#fff;border:1px solid #e5dfd2;border-radius:8px;
  overflow:hidden;margin:0 0 18px;
}
.compare-title-grid .article-title{
  margin:0;padding:18px 22px;font-size:22px;line-height:1.25;
}
.compare-title-grid .es{background:#faf7ef;border-right:1px solid #e5dfd2;color:#5a4a2a;font-style:italic}
.compare-title-grid .en[contenteditable=true]{outline:none;transition:background .15s, box-shadow .15s}
.compare-title-grid .en[contenteditable=true]:hover{background:rgba(26,93,58,.04)}
.compare-title-grid .en[contenteditable=true]:focus{
  background:rgba(26,93,58,.08);
  box-shadow:inset 0 0 0 1px rgba(26,93,58,.3);
}
@media (max-width:900px){
  .compare-title-grid{grid-template-columns:1fr}
  .compare-title-grid .es{border-right:none;border-bottom:1px solid #e5dfd2}
}
.compare-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  background:#fff;
  border:1px solid #e5dfd2;
  border-radius:8px;
  overflow:hidden;
}
.compare-col{padding:18px 22px;font-family:'Source Serif 4',Georgia,serif;font-size:15px;line-height:1.7;color:#262422}
.compare-col.es{background:#faf7ef;border-right:1px solid #e5dfd2;color:#5a4a2a}
.compare-col .label{
  display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;
  color:#8a7340;text-transform:uppercase;margin-bottom:12px;
}
.compare-col.en .label{color:#1a5d3a}
.cmp-row{
  display:contents;
}
.cmp-cell{
  padding:14px 20px;border-top:1px solid #f0ebe0;
}
.cmp-cell.es{background:#faf7ef;color:#5a4a2a;border-right:1px solid #e5dfd2}
.cmp-cell.es:first-of-type, .cmp-cell.en:first-of-type{border-top:none}
.cmp-cell.en[contenteditable=true]{outline:none;transition:background .15s, box-shadow .15s}
.cmp-cell.en[contenteditable=true]:hover{background:rgba(26,93,58,.04)}
.cmp-cell.en[contenteditable=true]:focus{
  background:rgba(26,93,58,.08);
  box-shadow:inset 0 0 0 1px rgba(26,93,58,.3);
}
.cmp-cell.placeholder{background:#fdfaf3;color:#aaa;font-style:italic}
.cmp-cell.figure{font-style:italic;color:#999;font-size:13px}

.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:#1a3a2a;color:#fff;padding:12px 22px;border-radius:8px;
  font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:100;
}
.toast.show{opacity:1}
.error{padding:40px;text-align:center;color:#a04;font-family:serif}

@media(max-width:780px){
  .toolbar{padding:5px 8px;gap:4px}
  .mode-toggle button{font-size:10px;padding:4px 8px}
  .tbtn{font-size:10px;padding:4px 8px}
  .original-link{font-size:10px}
  .container{padding:24px 18px 40px}
  .meta-footer{padding:0 18px 40px}
  .compare-container{padding:18px 12px 60px}
  .compare-grid{grid-template-columns:1fr;gap:0}
  .cmp-cell.es{border-right:none;border-bottom:1px dashed #e5dfd2}
  .compare-col{font-size:14px}
  #article-content{font-size:16px}
}
</style>
</head>
<body>

<div class="toolbar">
  <a class="back" href="index.html">‹</a>
  <span class="save-indicator" id="save-indicator">✓</span>
  <div class="toolbar-spacer"></div>
  <div class="mode-toggle">
    <button id="mode-preview" class="active" onclick="handlePreviewClick()">Preview<span class="lock-icon" id="lock-icon"></span></button>
    <button id="mode-compare" onclick="setMode('compare')">Edit</button>
  </div>
  <button class="tbtn t-title" onclick="copyTitle()"><span id="title-label">Title</span></button>
  <button class="tbtn t-body" onclick="copyForWordPress()"><span id="copy-label">Body</span></button>
  <a class="original-link" id="original-link" target="_blank" rel="noopener">↗ Original</a>
</div>

<!-- ═══ PREVIEW MODE ═══ -->
<div class="container">
  <h1 class="article-title" id="article-title-preview"></h1>
  <div id="article-content"></div>
</div>

<!-- ═══ META FOOTER (outside copy body) ═══ -->
<div class="meta-footer" id="meta-footer">
  <div class="meta-footer-inner">
    <span class="meta-pill" onclick="copyText(document.getElementById('cat-val').textContent, this)">
      <span class="label">Cat</span> <span class="val" id="cat-val">—</span>
    </span>
    <span class="meta-pill" onclick="copyText(document.getElementById('tags-val').textContent, this)">
      <span class="label">Tags</span> <span class="val" id="tags-val">—</span>
    </span>
  </div>
</div>

<!-- ═══ COMPARE & EDIT MODE ═══ -->
<div class="compare-container">
  <div class="compare-title-grid">
    <h1 class="article-title es" id="article-title-compare-es"></h1>
    <h1 class="article-title en" id="article-title-compare-en" contenteditable="true"></h1>
  </div>
  <div class="compare-grid" id="compare-grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const STORAGE_KEY = slug ? 'trans_edits_' + slug : null;
const articleEl = document.getElementById('article-content');
const compareGridEl = document.getElementById('compare-grid');

let _articleParas = []; // live references to the editable <p> nodes
let _articleFigCaps = []; // live references to <figcaption> nodes
let _originalParas = []; // Spanish original paragraphs (strings)

if (!slug) {
  articleEl.innerHTML = '<div class="error">No slug specified. Use <code>?slug=YYYY-MM-DD-name</code> in the URL.</div>';
} else {
  Promise.all([
    fetch(slug + '/article.html').then(r => r.text()),
    fetch(slug + '/meta.json').then(r => r.json()).catch(()=>null),
    fetch(slug + '/original.json').then(r => r.ok ? r.json() : null).catch(()=>null),
  ]).then(([html, meta, original]) => {
    // Restore from localStorage if available
    const saved = STORAGE_KEY ? localStorage.getItem(STORAGE_KEY) : null;
    articleEl.innerHTML = saved || html;
    window._meta = meta;

    // Tag direct children with stable index for scroll-position sync between Preview and Compare modes
    Array.from(articleEl.children).forEach((n, i) => n.setAttribute('data-cmp-index', i));

    // Make text content editable: every <p> and <figcaption>
    _articleParas = Array.from(articleEl.querySelectorAll('p'));
    _articleFigCaps = Array.from(articleEl.querySelectorAll('figcaption'));
    [..._articleParas, ..._articleFigCaps].forEach(el => {
      el.setAttribute('contenteditable', 'true');
      el.addEventListener('input', onEdit);
    });

    _originalParas = original && original.paragraphs ? original.paragraphs : [];
    decorateHighlights(articleEl);
    buildCompareView();

    if (meta) {
      // Title can be overridden by a previous in-browser edit
      const savedTitle = STORAGE_KEY ? localStorage.getItem(STORAGE_KEY + '_title') : null;
      const enTitle = savedTitle || meta.translated_title || '';
      if (enTitle) {
        document.title = enTitle;
        document.getElementById('article-title-preview').textContent = enTitle;
        document.getElementById('article-title-compare-en').textContent = enTitle;
        meta.translated_title = enTitle;
      }
      if (meta.original_title) {
        document.getElementById('article-title-compare-es').textContent = meta.original_title;
      }
      // Sync EN title edits back to preview + meta + storage
      const enTitleEl = document.getElementById('article-title-compare-en');
      const previewTitleEl = document.getElementById('article-title-preview');
      enTitleEl.addEventListener('input', () => {
        const v = enTitleEl.textContent;
        previewTitleEl.textContent = v;
        document.title = v;
        if (window._meta) window._meta.translated_title = v;
        if (STORAGE_KEY) {
          try { localStorage.setItem(STORAGE_KEY + '_title', v); } catch(e){}
        }
      });
      if (meta.suggested_category) document.getElementById('cat-val').textContent = meta.suggested_category;
      if (meta.suggested_tags) document.getElementById('tags-val').textContent = (meta.suggested_tags || []).join(' ');
      if (meta.original_url) {
        const link = document.getElementById('original-link');
        link.href = meta.original_url;
        link.textContent = '↗ ' + (meta.outlet || 'Original');
      }
    }
  }).catch(err => {
    articleEl.innerHTML = '<div class="error">Failed to load translation: ' + err.message + '</div>';
  });
}

// Identify which <p> elements correspond to translated body paragraphs
// (skip the attribution <em> wrapper, skip figcaptions, skip empties)
function contentParaIndices(){
  const out = [];
  _articleParas.forEach((p, i) => {
    // attribution paragraph is the one whose only child is <em>
    const onlyEm = p.children.length === 1 && p.children[0].tagName === 'EM';
    if (onlyEm) return;
    if (!p.textContent.trim()) return;
    out.push(i);
  });
  return out;
}

// Build the compare view: walk through ordered article children, pair body paragraphs to ES original
function buildCompareView(){
  compareGridEl.innerHTML = '';
  const children = Array.from(articleEl.children);
  let esIdx = 0;
  children.forEach((node) => {
    const tag = node.tagName;
    const cmpIdx = node.getAttribute('data-cmp-index');
    const tagCells = (esCell, enCell) => {
      if (cmpIdx != null) {
        esCell.setAttribute('data-cmp-index', cmpIdx);
        enCell.setAttribute('data-cmp-index', cmpIdx);
      }
    };
    if (tag === 'P') {
      const onlyEm = node.children.length === 1 && node.children[0].tagName === 'EM';
      if (onlyEm) {
        // attribution row — show in both columns, EN editable
        const esCell = document.createElement('div');
        esCell.className = 'cmp-cell es placeholder';
        esCell.textContent = '(attribution paragraph — not in original)';
        const enCell = document.createElement('div');
        enCell.className = 'cmp-cell en';
        enCell.innerHTML = node.innerHTML;
        enCell.setAttribute('contenteditable','true');
        enCell.addEventListener('input', () => syncBackToArticle(node, enCell, true));
        compareGridEl.appendChild(esCell);
        compareGridEl.appendChild(enCell);
        return;
      }
      const esText = _originalParas[esIdx] || '';
      esIdx++;
      const esCell = document.createElement('div');
      esCell.className = 'cmp-cell es';
      esCell.textContent = esText || '(no original counterpart)';
      if (!esText) esCell.classList.add('placeholder');
      const enCell = document.createElement('div');
      enCell.className = 'cmp-cell en';
      enCell.innerHTML = node.innerHTML;
      enCell.setAttribute('contenteditable','true');
      enCell.addEventListener('input', () => syncBackToArticle(node, enCell, true));
      tagCells(esCell, enCell);
      compareGridEl.appendChild(esCell);
      compareGridEl.appendChild(enCell);
    } else if (tag === 'BLOCKQUOTE') {
      const esText = _originalParas[esIdx] || '';
      esIdx++;
      const esCell = document.createElement('div');
      esCell.className = 'cmp-cell es';
      esCell.style.fontStyle = 'italic';
      esCell.textContent = esText || '(no original counterpart)';
      if (!esText) esCell.classList.add('placeholder');
      const enCell = document.createElement('div');
      enCell.className = 'cmp-cell en';
      enCell.style.fontStyle = 'italic';
      enCell.innerHTML = node.innerHTML;
      enCell.setAttribute('contenteditable','true');
      enCell.addEventListener('input', () => syncBackToArticleHTML(node, enCell));
      tagCells(esCell, enCell);
      compareGridEl.appendChild(esCell);
      compareGridEl.appendChild(enCell);
    } else if (tag === 'FIGURE') {
      // figure rows — show "image" placeholder + the caption (caption editable)
      const esCell = document.createElement('div');
      esCell.className = 'cmp-cell es figure';
      esCell.textContent = '🖼 [image]';
      const enCell = document.createElement('div');
      enCell.className = 'cmp-cell en figure';
      const cap = node.querySelector('figcaption');
      if (cap) {
        enCell.innerHTML = '🖼 <span data-cap="1" contenteditable="true">' + cap.innerHTML + '</span>';
        enCell.querySelector('[data-cap]').addEventListener('input', (e) => {
          cap.innerHTML = e.target.innerHTML;
          saveEdits();
        });
      } else {
        enCell.textContent = '🖼 [image, no caption]';
      }
      tagCells(esCell, enCell);
      compareGridEl.appendChild(esCell);
      compareGridEl.appendChild(enCell);
    } else if (tag === 'H1' || tag === 'H2' || tag === 'H3') {
      const esCell = document.createElement('div');
      esCell.className = 'cmp-cell es placeholder';
      esCell.textContent = '(subhead — not in original alignment)';
      const enCell = document.createElement('div');
      enCell.className = 'cmp-cell en';
      enCell.style.fontWeight = '600';
      enCell.innerHTML = node.innerHTML;
      enCell.setAttribute('contenteditable','true');
      enCell.addEventListener('input', () => syncBackToArticle(node, enCell, true));
      tagCells(esCell, enCell);
      compareGridEl.appendChild(esCell);
      compareGridEl.appendChild(enCell);
    }
  });
}

function syncBackToArticle(node, enCell, alsoSave){
  node.innerHTML = enCell.innerHTML;
  if (alsoSave) saveEdits();
}
function syncBackToArticleHTML(node, enCell){
  // For blockquote: wrap the edited content in <p> if it doesn't have one
  let html = enCell.innerHTML.trim();
  if (!html.startsWith('<p')) html = '<p>' + html + '</p>';
  node.innerHTML = html;
  saveEdits();
}

let _saveTimer = null;
function onEdit(){ saveEdits(); rebuildCompareIfActive(); }
function rebuildCompareIfActive(){
  // No-op for now; compare view updates from article DOM on toggle
}
function saveEdits(){
  if (!STORAGE_KEY) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    try {
      localStorage.setItem(STORAGE_KEY, articleEl.innerHTML);
      const ind = document.getElementById('save-indicator');
      ind.classList.add('show');
      setTimeout(()=>ind.classList.remove('show'), 1500);
    } catch(e){}
  }, 400);
}

function getViewportAnchorIndex(fromMode){
  const root = fromMode === 'compare' ? compareGridEl : articleEl;
  const sel = fromMode === 'compare' ? '.cmp-cell.en[data-cmp-index]' : '[data-cmp-index]';
  const nodes = root.querySelectorAll(sel);
  const topPad = 80;  // sticky toolbar height
  let best = null, bestDist = Infinity;
  nodes.forEach(n => {
    const r = n.getBoundingClientRect();
    if (r.bottom < topPad) return;  // already scrolled past
    const dist = Math.abs(r.top - topPad);
    if (dist < bestDist) { bestDist = dist; best = n; }
  });
  return best ? best.getAttribute('data-cmp-index') : null;
}

function scrollToAnchor(toMode, idx){
  if (idx == null) return;
  const root = toMode === 'compare' ? compareGridEl : articleEl;
  const sel = toMode === 'compare' ? `.cmp-cell.en[data-cmp-index="${idx}"]` : `[data-cmp-index="${idx}"]`;
  const el = root.querySelector(sel);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.pageYOffset - 80;
  window.scrollTo({top, behavior: 'instant'});
}

let _locked = false;

function handlePreviewClick(){
  const isPreview = !document.body.classList.contains('mode-compare');
  if (isPreview) {
    // Already in preview — toggle lock
    _locked = !_locked;
    applyLock();
  } else {
    // Switch from Edit to Preview
    _locked = false;
    setMode('preview');
    applyLock();
  }
}

function applyLock(){
  const icon = document.getElementById('lock-icon');
  const btn = document.getElementById('mode-preview');
  if (_locked) {
    icon.textContent = '🔒';
    btn.classList.add('locked');
    // Disable all contenteditable
    articleEl.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable','false'));
    // Animate
    icon.classList.add('locking');
    setTimeout(() => icon.classList.remove('locking'), 200);
    showToast('Locked — read only');
  } else {
    icon.textContent = '';
    btn.classList.remove('locked');
    // Re-enable contenteditable
    articleEl.querySelectorAll('p, figcaption').forEach(el => el.setAttribute('contenteditable','true'));
  }
}

function setMode(mode){
  const fromMode = document.body.classList.contains('mode-compare') ? 'compare' : 'preview';
  const anchorIdx = fromMode !== mode ? getViewportAnchorIndex(fromMode) : null;

  // Unlock when switching modes
  _locked = false;
  applyLock();

  document.body.classList.toggle('mode-compare', mode === 'compare');
  document.getElementById('mode-preview').classList.toggle('active', mode === 'preview');
  document.getElementById('mode-compare').classList.toggle('active', mode === 'compare');
  if (mode === 'compare') {
    buildCompareView();  // sync from article DOM
    compareGridEl.querySelectorAll('.cmp-cell.es, .cmp-cell.en').forEach(cell => {
      decorateHighlights(cell);
    });
  }
  if (anchorIdx != null) scrollToAnchor(mode, anchorIdx);
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function copyTitle(){
  const title = (window._meta && window._meta.translated_title) || document.title;
  try {
    await navigator.clipboard.writeText(title);
    flashBtn('title-label', '✓', 'Title');
    showToast('Title copied');
  } catch(e) { showToast('Copy failed: ' + e.message); }
}

function getCleanHTML(){
  // Clone the article DOM, strip visual-only highlight spans, then serialize
  const clone = articleEl.cloneNode(true);
  clone.querySelectorAll('.hl-acronym, .hl-quote, .hl-attribution').forEach(sp => {
    const parent = sp.parentNode;
    while (sp.firstChild) parent.insertBefore(sp.firstChild, sp);
    parent.removeChild(sp);
  });
  // Also remove contenteditable attribute (clutters output)
  clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
  return clone.innerHTML;
}

function decorateHighlights(rootEl){
  // Walk every text node inside <p> or <figcaption>, wrap matches.
  // Skip already-decorated nodes and the contents of <a>, <em>, <strong>, <code>.
  const SKIP_TAGS = new Set(['A','EM','STRONG','CODE','SCRIPT','STYLE']);
  // Acronyms: 2-5 uppercase letters, word-boundary, common false-positives excluded
  const FALSE_POS = new Set(['I','II','III','IV','VI','VII','VIII','IX','X','XI','XII','OK','TV','AM','PM','BY','OF','TO','IN','ON','AT','AS','IS','IT']);
  const acronymRe = /\b([A-Z][A-Z0-9]{1,5})\b/g;
  // Direct quotes: straight or curly
  const quoteRe = /("[^"]+"|"[^"]+"|"[^"]+")/g;

  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      let p = node.parentNode;
      while (p && p !== rootEl) {
        if (SKIP_TAGS.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('hl-acronym') || p.classList.contains('hl-quote'))) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);

  targets.forEach(textNode => {
    const text = textNode.nodeValue;
    // Build a list of [start, end, type] matches, non-overlapping
    const matches = [];
    let m;
    quoteRe.lastIndex = 0;
    while ((m = quoteRe.exec(text)) !== null) {
      matches.push({start: m.index, end: m.index + m[0].length, type:'quote', text: m[0]});
    }
    acronymRe.lastIndex = 0;
    while ((m = acronymRe.exec(text)) !== null) {
      if (FALSE_POS.has(m[1])) continue;
      const start = m.index, end = m.index + m[0].length;
      // Skip if inside a quote match
      if (matches.some(q => q.type==='quote' && start>=q.start && end<=q.end)) continue;
      matches.push({start, end, type:'acronym', text: m[0]});
    }
    if (matches.length === 0) return;
    matches.sort((a,b) => a.start - b.start);

    const frag = document.createDocumentFragment();
    let cursor = 0;
    matches.forEach(mm => {
      if (mm.start < cursor) return; // overlap, skip
      if (mm.start > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, mm.start)));
      const span = document.createElement('span');
      span.className = mm.type === 'quote' ? 'hl-quote' : 'hl-acronym';
      span.textContent = mm.text;
      frag.appendChild(span);
      cursor = mm.end;
    });
    if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
    textNode.parentNode.replaceChild(frag, textNode);
  });

  // Mark attribution paragraph
  Array.from(rootEl.querySelectorAll('p')).forEach(p => {
    if (p.children.length === 1 && p.children[0].tagName === 'EM' && !p.classList.contains('hl-attribution')) {
      p.classList.add('hl-attribution');
    }
  });
}

function toggleHighlights(){
  const on = document.getElementById('hl-checkbox').checked;
  document.body.classList.toggle('no-highlights', !on);
}

async function copyForWordPress(){
  const html = getCleanHTML(); // strips highlight spans
  if (!html) { showToast('Nothing to copy'); return; }
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([html], {type:'text/plain'}),
    });
    await navigator.clipboard.write([item]);
    flashBtn('copy-label', '✓', 'Body');
    showToast('Body copied');
  } catch(e){
    try {
      await navigator.clipboard.writeText(html);
      flashBtn('copy-label', '✓', 'Body');
    } catch(e2) { showToast('Copy failed: ' + e2.message); }
  }
}

function flashBtn(labelId, doneText, origText){
  const lbl = document.getElementById(labelId);
  const btn = lbl.closest('.tbtn') || lbl.closest('button');
  btn.classList.add('done');
  lbl.textContent = doneText;
  setTimeout(()=>{ btn.classList.remove('done'); lbl.textContent = origText; }, 2200);
}

async function copyText(text, el){
  try {
    await navigator.clipboard.writeText(text);
    const orig = el.style.background;
    el.style.background = '#d6efdb';
    showToast('Copied: ' + text);
    setTimeout(()=>{el.style.background = orig}, 1200);
  } catch(e) { showToast('Copy failed'); }
}
